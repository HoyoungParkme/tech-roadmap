  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

  <style id="trn-note-skin">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>

  <div id="root"></div>

  <!--
    III-1-1. 구조화 로그 (JSON)
    학습 목표: 자유 텍스트 로그를 JSON으로 바꾸어 검색·집계·추적이 가능해지는 과정을 단계별로 보인다.
    핵심 비유: "일기장 vs 데이터베이스"
    패턴: fastapi 표준 — 좌(LiveDataPane: 로그 검색 비교) / 우(VSCode 코드)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 4 STEPS — 좌측 LiveDataPane + 우측 코드
    const STEPS = [
      {
        title: 'Step 1. Plain — 자유 텍스트, grep 노가다',
        desc: 'print/logger.info로 자유 텍스트만 찍으면 사람은 읽기 편하지만 분석 도구는 막막하다. "에러 몇 번?", "user_id별 실패율?" 같은 질의는 매번 정규식을 새로 짜야 한다. 일기장처럼 페이지를 한 장씩 넘기는 셈이다.',
        title2: 'plain text 로그 — grep 어려움',
        mode: 'plain',
        rows: [
          { raw: 'error: failed to fetch user 123 — timeout 5s' },
          { raw: 'info: request finished in 1.2s' },
          { raw: 'warning: cache miss for key=session:abc' },
          { raw: 'error: failed to fetch user 456 — timeout 5s' },
          { raw: 'info: GET /api/items 200 124ms' },
          { raw: 'error: db connection lost retries=3' },
        ],
        legend: 'grep "failed" | wc -l → 정규식 매번 작성, ad-hoc 파싱 실수투성이',
        code: {
          lang: 'python',
          filename: 'app_plain.py — 자유 텍스트 logger',
          lines: [
            '# 평범한 logger — 사람용, 기계는 못 읽는다',
            'import logging',
            '',
            'logging.basicConfig(',
            '    level=logging.INFO,',
            '    format="%(levelname)s: %(message)s",',
            ')',
            'log = logging.getLogger("app")',
            '',
            '# 자유 텍스트로 찍힘 — 필드 구분 없음',
            'log.error("failed to fetch user 123 — timeout 5s")',
            'log.info("request finished in 1.2s")',
            'log.warning("cache miss for key=session:abc")',
            '',
            '# 분석은 grep 노가다',
            '# $ grep "failed to fetch" app.log | wc -l',
            '# $ grep -oP "user \\d+" app.log | sort | uniq -c',
            '# $ awk \'/timeout/ { ... }\'  ← 매번 즉석 파싱',
            '# ✗ 새 질의가 생길 때마다 정규식을 새로 작성',
          ],
          highlight: [5, 11, 12, 13],
        },
      },
      {
        title: 'Step 2. JSON — key:value 구조화',
        desc: '같은 정보를 JSON으로 찍으면 user_id, timeout_s가 명시적인 필드가 된다. jq · ELK · Loki 어디서든 필드 단위로 select·집계가 가능해진다. 일기장이 데이터베이스로 바뀌는 순간이다.',
        title2: 'JSON 구조화 로그 — key:value 표 파싱',
        mode: 'json',
        rows: [
          { level: 'error', msg: 'fetch_user_failed', user_id: 123, timeout_s: 5 },
          { level: 'info',  msg: 'request_completed', latency_ms: 1200 },
          { level: 'warn',  msg: 'cache_miss',        key: 'session:abc' },
          { level: 'error', msg: 'fetch_user_failed', user_id: 456, timeout_s: 5 },
          { level: 'info',  msg: 'http_request',      method: 'GET', path: '/api/items', status: 200, latency_ms: 124 },
          { level: 'error', msg: 'db_connection_lost', retries: 3 },
        ],
        legend: 'jq \'select(.msg=="fetch_user_failed") | .user_id\' — 한 줄로 집계',
        code: {
          lang: 'python',
          filename: 'app_json.py — JSONFormatter',
          lines: [
            '# JSON 한 줄당 한 이벤트 — 필드가 명시적',
            'import json, logging, sys',
            '',
            'class JSONFormatter(logging.Formatter):',
            '    def format(self, record):',
            '        payload = {',
            '            "level": record.levelname.lower(),',
            '            "msg": record.getMessage(),',
            '            "logger": record.name,',
            '        }',
            '        # extra={"user_id": 123} 같은 사용자 필드 흡수',
            '        for k, v in record.__dict__.items():',
            '            if k not in ("args", "msg", "levelname", "name") \\',
            '               and not k.startswith("_"):',
            '                payload.setdefault(k, v)',
            '        return json.dumps(payload, ensure_ascii=False)',
            '',
            'handler = logging.StreamHandler(sys.stdout)',
            'handler.setFormatter(JSONFormatter())',
            'log = logging.getLogger("app")',
            'log.addHandler(handler)',
            'log.setLevel(logging.INFO)',
            '',
            '# 이벤트 이름 + 필드를 분리해서 찍는다',
            'log.error("fetch_user_failed", extra={"user_id": 123, "timeout_s": 5})',
            '# → {"level":"error","msg":"fetch_user_failed",',
            '#    "user_id":123,"timeout_s":5}',
          ],
          highlight: [4, 16, 25],
        },
      },
      {
        title: 'Step 3. Context — request_id / trace_id / user_id 자동 주입',
        desc: 'contextvars(자바 MDC)에 request_id를 한 번 set하면, 그 요청 안의 모든 로그에 자동으로 같은 키가 따라붙는다. trace_id로 grep 한 번이면 한 요청이 만든 로그 전체를 시간순으로 복원할 수 있다.',
        title2: 'request_id / trace_id / user_id가 모든 row에 자동 주입',
        mode: 'context',
        rows: [
          { level: 'info',  msg: 'request_started',   trace_id: 'a1b2c3', request_id: 'r-7741', user_id: 42 },
          { level: 'info',  msg: 'cart_loaded',       trace_id: 'a1b2c3', request_id: 'r-7741', user_id: 42, items: 3 },
          { level: 'warn',  msg: 'cache_miss',        trace_id: 'a1b2c3', request_id: 'r-7741', user_id: 42, key: 'session:abc' },
          { level: 'error', msg: 'fetch_user_failed', trace_id: 'a1b2c3', request_id: 'r-7741', user_id: 42, timeout_s: 5 },
          { level: 'info',  msg: 'request_finished',  trace_id: 'a1b2c3', request_id: 'r-7741', user_id: 42, status: 500 },
        ],
        legend: 'trace_id=a1b2c3로 grep 한 번 → 요청 전체 흐름 한 화면에',
        code: {
          lang: 'python',
          filename: 'context_filter.py — contextvars 주입',
          lines: [
            '# 요청별 컨텍스트를 모든 로그에 자동 주입',
            'import contextvars, logging, uuid',
            '',
            'trace_id_var   = contextvars.ContextVar("trace_id",   default=None)',
            'request_id_var = contextvars.ContextVar("request_id", default=None)',
            'user_id_var    = contextvars.ContextVar("user_id",    default=None)',
            '',
            'class ContextFilter(logging.Filter):',
            '    """모든 LogRecord에 현재 컨텍스트 값을 끼워 넣는다."""',
            '    def filter(self, record):',
            '        record.trace_id   = trace_id_var.get()',
            '        record.request_id = request_id_var.get()',
            '        record.user_id    = user_id_var.get()',
            '        return True',
            '',
            'log = logging.getLogger("app")',
            'log.addFilter(ContextFilter())',
            '',
            '# FastAPI 미들웨어 — 요청 진입점에서 한 번만 set',
            '@app.middleware("http")',
            'async def trace_middleware(request, call_next):',
            '    trace_id_var.set(',
            '        request.headers.get("x-trace-id") or uuid.uuid4().hex',
            '    )',
            '    request_id_var.set(f"r-{uuid.uuid4().hex[:4]}")',
            '    user_id_var.set(getattr(request.state, "user_id", None))',
            '    return await call_next(request)',
            '',
            '# 이후 어디서 찍든 trace_id/request_id/user_id가 따라붙는다',
            'log.info("request_started")',
            'log.error("fetch_user_failed", extra={"timeout_s": 5})',
          ],
          highlight: [10, 11, 12, 13, 21, 22, 23, 24, 25, 26],
        },
      },
      {
        title: 'Step 4. Levels — DEBUG / INFO / WARN / ERROR 색상 + 카운트',
        desc: '레벨은 "이걸 누가 봐야 하나"의 신호다. DEBUG(개발자), INFO(정상 흐름), WARN(주의), ERROR(즉시 대응). 운영은 보통 INFO 이상만 흘리고, 장애 디버깅 시 동적으로 DEBUG로 잠깐 낮춘다. 색상으로 한눈에, 카운트로 추세 파악.',
        title2: '레벨 색상 분류 + 카운트 차트',
        mode: 'levels',
        rows: [
          { level: 'debug', msg: 'cache_lookup',        key: 'session:abc' },
          { level: 'info',  msg: 'request_started',     trace_id: 'a1b2c3' },
          { level: 'info',  msg: 'cart_loaded',         items: 3 },
          { level: 'warn',  msg: 'cache_miss_high',     miss_rate: 0.42 },
          { level: 'debug', msg: 'sql_query',           rows: 12 },
          { level: 'info',  msg: 'request_finished',    latency_ms: 124 },
          { level: 'error', msg: 'db_connection_lost', retries: 3 },
          { level: 'error', msg: 'fetch_user_failed',  timeout_s: 5 },
        ],
        legend: '운영=INFO 이상, 장애 시 SIGUSR1로 30분만 DEBUG로 낮췄다 복구',
        code: {
          lang: 'python',
          filename: 'levels.py — 레벨 + 동적 변경',
          lines: [
            '# 레벨 = "누가 봐야 하나" 신호',
            'import logging, os, signal',
            '',
            'log = logging.getLogger("app")',
            '# 운영=INFO, 개발=DEBUG (환경변수)',
            'log.setLevel(os.getenv("LOG_LEVEL", "INFO"))',
            '',
            'log.debug("cache_lookup", extra={"key": "session:abc"})  # 개발자',
            'log.info("request_completed", extra={"latency_ms": 124}) # 정상',
            'log.warning("cache_miss_high", extra={"miss_rate": 0.42})# 주의',
            'log.error("db_connection_lost", extra={"retries": 3})    # 즉시 대응',
            '',
            '# ① admin endpoint — 재배포 없이 동적 변경',
            '@app.post("/admin/log-level")',
            'def set_level(level: str):',
            '    logging.getLogger("app").setLevel(level.upper())',
            '    return {"level": level}',
            '',
            '# ② SIGUSR1 토글 — 장애 디버깅용',
            'def toggle_debug(signum, frame):',
            '    cur = log.getEffectiveLevel()',
            '    log.setLevel(',
            '        logging.DEBUG if cur != logging.DEBUG else logging.INFO',
            '    )',
            'signal.signal(signal.SIGUSR1, toggle_debug)',
            '',
            '# 운영 기본은 INFO — 노이즈/비용 절감',
            '# 장애 시 30분만 DEBUG로 낮췄다 다시 INFO로 복구',
          ],
          highlight: [8, 9, 10, 11, 20, 21, 22, 23],
        },
      },
    ];

    // ── 레벨별 색상
    const LEVEL_COLOR = {
      debug: { bar: 'bg-slate-400',  pill: 'bg-slate-100  text-slate-700  border-slate-300' },
      info:  { bar: 'bg-sky-500',    pill: 'bg-sky-50     text-sky-700    border-sky-300' },
      warn:  { bar: 'bg-amber-500',  pill: 'bg-amber-50   text-amber-800  border-amber-300' },
      error: { bar: 'bg-red-500',    pill: 'bg-red-50     text-red-800    border-red-300' },
    };

    // ── 좌측: LiveDataPane (로그 검색 비교)
    function LiveDataPane({ step, stepIdx }) {
      const animKey = `step-${stepIdx}`;

      // levels 모드용 카운트
      const counts = { debug: 0, info: 0, warn: 0, error: 0 };
      if (step.mode === 'levels') {
        for (const r of step.rows) counts[r.level] = (counts[r.level] || 0) + 1;
      }
      const maxCount = Math.max(1, ...Object.values(counts));

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {/* 헤더 */}
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">📔</span>
              <span className="text-xs font-bold text-slate-700">로그 검색 비교</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">
              mode={step.mode}
            </span>
          </div>

          {/* row들 */}
          <div className="p-3 space-y-1.5 min-h-[300px] max-h-[420px] overflow-auto" key={animKey}>
            {/* Step 1 — plain text */}
            {step.mode === 'plain' && step.rows.map((r, i) => (
              <div key={i}
                   className="fade-in text-[11px] font-mono text-slate-700 bg-slate-50 border border-slate-200 rounded px-2 py-1.5 truncate"
                   style={{ animationDelay: `${i * 90}ms` }}>
                {r.raw}
              </div>
            ))}

            {/* Step 2 — JSON key:value 표 */}
            {step.mode === 'json' && step.rows.map((r, i) => {
              const level = r.level || 'info';
              const c = LEVEL_COLOR[level === 'warn' ? 'warn' : level];
              const fields = Object.entries(r).filter(([k]) => k !== 'level' && k !== 'msg');
              return (
                <div key={i}
                     className="fade-in border border-slate-200 rounded px-2 py-1.5 bg-slate-50"
                     style={{ animationDelay: `${i * 90}ms` }}>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border uppercase ${c.pill}`}>{level}</span>
                    <span className="text-[11px] font-mono font-bold text-slate-800">{r.msg}</span>
                    {fields.map(([k, v]) => (
                      <span key={k} className="text-[10px] font-mono">
                        <span className="text-slate-500">{k}=</span>
                        <span className="text-slate-800">{String(v)}</span>
                      </span>
                    ))}
                  </div>
                </div>
              );
            })}

            {/* Step 3 — context 자동 주입 (trace_id 강조) */}
            {step.mode === 'context' && step.rows.map((r, i) => {
              const level = r.level || 'info';
              const c = LEVEL_COLOR[level === 'warn' ? 'warn' : level];
              return (
                <div key={i}
                     className="fade-in border border-slate-200 rounded px-2 py-1.5 bg-slate-50"
                     style={{ animationDelay: `${i * 90}ms` }}>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border uppercase ${c.pill}`}>{level}</span>
                    <span className="text-[11px] font-mono font-bold text-slate-800">{r.msg}</span>
                    {/* 컨텍스트 필드 — 강조 */}
                    <span className="text-[10px] font-mono px-1 py-0.5 rounded bg-red-100 text-red-700 border border-red-200">
                      <span className="opacity-70">trace_id=</span>{r.trace_id}
                    </span>
                    <span className="text-[10px] font-mono px-1 py-0.5 rounded bg-red-50 text-red-700 border border-red-200">
                      <span className="opacity-70">request_id=</span>{r.request_id}
                    </span>
                    <span className="text-[10px] font-mono px-1 py-0.5 rounded bg-red-50 text-red-700 border border-red-200">
                      <span className="opacity-70">user_id=</span>{r.user_id}
                    </span>
                    {/* 그 외 필드 */}
                    {Object.entries(r)
                      .filter(([k]) => !['level','msg','trace_id','request_id','user_id'].includes(k))
                      .map(([k, v]) => (
                        <span key={k} className="text-[10px] font-mono">
                          <span className="text-slate-500">{k}=</span>
                          <span className="text-slate-800">{String(v)}</span>
                        </span>
                      ))}
                  </div>
                </div>
              );
            })}

            {/* Step 4 — levels 색상 + 카운트 차트 */}
            {step.mode === 'levels' && (
              <>
                {step.rows.map((r, i) => {
                  const level = r.level;
                  const c = LEVEL_COLOR[level];
                  const fields = Object.entries(r).filter(([k]) => k !== 'level' && k !== 'msg');
                  return (
                    <div key={i}
                         className={`fade-in border rounded px-2 py-1.5 flex items-center gap-2 ${c.pill}`}
                         style={{ animationDelay: `${i * 70}ms` }}>
                      <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded uppercase text-white ${c.bar}`}>{level}</span>
                      <span className="text-[11px] font-mono font-bold">{r.msg}</span>
                      {fields.map(([k, v]) => (
                        <span key={k} className="text-[10px] font-mono opacity-80">
                          <span className="opacity-70">{k}=</span>{String(v)}
                        </span>
                      ))}
                    </div>
                  );
                })}

                {/* 카운트 차트 */}
                <div className="mt-3 pt-2 border-t border-slate-200">
                  <div className="text-[10px] font-bold text-slate-600 mb-1.5">레벨 카운트</div>
                  {['debug','info','warn','error'].map((lv) => {
                    const c = LEVEL_COLOR[lv];
                    const n = counts[lv];
                    const pct = (n / maxCount) * 100;
                    return (
                      <div key={lv} className="flex items-center gap-2 mb-1">
                        <span className="text-[9px] font-bold uppercase w-12 text-slate-600 font-mono">{lv}</span>
                        <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                          <div className={`h-full ${c.bar} grow-bar`}
                               style={{ '--target-width': `${pct}%`, animationDelay: '600ms' }} />
                        </div>
                        <span className="text-[10px] font-mono w-6 text-right text-slate-700">{n}</span>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title2}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일명 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          {/* 코드 + 라인 번호 */}
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in {
              opacity: 0;
              animation: fadeIn 360ms ease-out forwards;
            }
            @keyframes growBar {
              from { width: 0; }
              to   { width: var(--target-width); }
            }
            .grow-bar {
              width: 0;
              animation: growBar 700ms cubic-bezier(.2,.7,.3,1) forwards;
            }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            {/* 헤더 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-red-600 hover:text-red-800 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum III-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-red-600 text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. Observability &gt; Chapter 1. Logging</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">구조화 로그 (JSON)</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                일기장 vs 데이터베이스 — <strong>자유 텍스트 로그</strong>를 <code className="bg-slate-100 px-1 rounded text-xs">JSON 구조화</code>로 바꾸어
                검색·집계·추적이 가능한 데이터로 만든다.
              </p>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            {/* 설명 */}
            <div className="p-4 rounded-xl bg-red-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-red-200">Step {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-red-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 마지막 단계: 다음 안내 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-red-50 border-2 border-red-300 text-red-900 text-sm">
                💡 다음(III-1-2)에서는 <strong>ELK vs Loki</strong> — 두 로그 백엔드 비교
              </div>
            )}

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-red-600 text-white hover:bg-red-700 transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./III-1-2.html" className="text-red-600 hover:text-red-800 font-medium">III-1-2 ELK vs Loki &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
