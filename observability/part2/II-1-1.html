  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🥛</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    II-1-1. Prometheus 개론 (pull 모델)
    학습 목표: push와 pull 차이를 이해하고 Prometheus가 왜 pull을 채택했는지 안다.
    핵심 비유: "우유 배달 vs 우편" — push(앱이 보냄) vs pull(Prometheus가 가져감)
    패턴: 좌(LiveDataPane — Prometheus 아키텍처 시각화) / 우(VSCode CodeViewer — prometheus.yml)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 4 STEPS — 좌측 LiveDataPane이 보여줄 시각화 + 우측 코드
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      push: { lang: "yaml", filename: "statsd_app.py — push 모델 (한계)", lines: [
        "# push 모델 — 앱이 수집기 주소를 알고 매번 send()",
        "# (StatsD/Graphite 방식)",
        "",
        "import statsd",
        "",
        "# ① 앱이 수집기 주소/프로토콜을 알아야 함",
        "c = statsd.StatsClient(\"graphite.local\", 8125)",
        "",
        "@app.post(\"/login\")",
        "def login(payload: dict):",
        "    # ② 매 요청마다 네트워크 호출 — 트래픽 폭증 시 같이 폭증",
        "    c.incr(\"login.success\")",
        "    c.timing(\"db.query\", 42)",
        "    return ok()",
        "",
        "# ③ 한계",
        "# - 앱이 죽으면 push 자체가 멈춤",
        "# - 수집기는 \"왜 안 오지?\"인지 모름 (죽음? 안 보냄?)",
        "# - 트래픽과 메트릭이 동시 폭증 → 수집기 다운",
        "# - 수신측 주소/포트 변경 시 모든 앱 재배포",
      ] },
      pull: { lang: "yaml", filename: "prometheus.yml — scrape 설정", lines: [
        "# prometheus.yml — pull 모델 (scrape)",
        "global:",
        "  scrape_interval: 15s        # 15초마다 가지러 감",
        "  evaluation_interval: 15s",
        "",
        "scrape_configs:",
        "  - job_name: \"my-app\"",
        "    static_configs:",
        "      - targets:",
        "          - \"svc-a:9090\"",
        "          - \"svc-b:9090\"",
        "          - \"svc-c:9090\"",
        "    # → Prometheus가 GET http://svc-a:9090/metrics 호출",
        "",
        "# 앱이 노출하는 /metrics 출력 (expose 포맷, 라인 기반)",
        "# HELP http_requests_total Total HTTP requests",
        "# TYPE http_requests_total counter",
        "http_requests_total{method=\"GET\",status=\"200\"} 1027",
        "http_requests_total{method=\"POST\",status=\"500\"} 3",
        "",
        "# 장점",
        "# - 앱은 expose만 하면 됨 (수집기 주소 모름)",
        "# - scrape 실패 = up 0 → 죽음 자체가 메트릭",
        "# - 트래픽과 무관하게 메트릭 트래픽 일정",
      ] },
      discovery: { lang: "yaml", filename: "prometheus.yml — Kubernetes SD", lines: [
        "# prometheus.yml — Kubernetes Service Discovery",
        "scrape_configs:",
        "  - job_name: \"kubernetes-pods\"",
        "    kubernetes_sd_configs:",
        "      - role: pod                       # Pod 단위로 발견",
        "    relabel_configs:",
        "      # annotation prometheus.io/scrape=true 인 Pod만",
        "      - source_labels:",
        "          - __meta_kubernetes_pod_annotation_prometheus_io_scrape",
        "        action: keep",
        "        regex: true",
        "      # annotation prometheus.io/port 로 포트 지정",
        "      - source_labels:",
        "          - __address__",
        "          - __meta_kubernetes_pod_annotation_prometheus_io_port",
        "        action: replace",
        "        regex: ([^:]+)(?::\\d+)?;(\\d+)",
        "        replacement: $1:$2",
        "        target_label: __address__",
        "",
        "# Prometheus Operator 방식 — ServiceMonitor CRD",
        "apiVersion: monitoring.coreos.com/v1",
        "kind: ServiceMonitor",
        "metadata:",
        "  name: my-app",
        "spec:",
        "  selector:",
        "    matchLabels:",
        "      app: my-app                       # 이 label 가진 Service 자동 scrape",
        "  endpoints:",
        "    - port: metrics",
        "      interval: 15s",
        "",
        "# → 새 Pod 뜨면 자동 등록, 죽으면 자동 제거",
      ] },
      tsdb: { lang: "yaml", filename: "prometheus.yml — TSDB / retention", lines: [
        "# Prometheus 데이터 디렉터리 구조",
        "# /prometheus/data/",
        "#   01HXAB...    # 2시간 단위 block",
        "#   01HXCD...",
        "#   chunks_head/  # 메모리에서 디스크로 flush 중",
        "#   wal/          # Write-Ahead Log (장애 복구용)",

            { mark: "new", text: "retention.time=15d" },
            { mark: "new", text: "retention.size=50GB" },
          ],
        },
        focus: "tsdb",
        legend: "15일이 지나면 오래된 block 부터 삭제된다",
        services: [{ id: "a", name: "svc-a:9090/metrics", state: "scraping" }, { id: "b", name: "svc-b:9090/metrics", state: "scraping" }, { id: "c", name: "svc-c:9090/metrics", state: "scraping" }, { id: "d", name: "svc-d:9090/metrics", state: "scraping" }],
        code: { ...CODE.tsdb, highlight: [17, 18] },
      },
      { ...S4,
        beat: {
          label: "장기 보관은 넘긴다",
          at: "prometheus.yml L20–22",
          caption: "remote_write 로 Thanos/Mimir 에 복사본을 보낸다. 1년치 조회는 그쪽 몫이다.",
          changes: [
            { mark: "new", text: "remote_write" },
            { mark: "read", text: "thanos-receive:19291" },
          ],
        },
        focus: "tsdb",
        legend: "15일보다 오래된 데이터는 remote_write 로 위임한다",
        services: [{ id: "a", name: "svc-a:9090/metrics", state: "scraping" }, { id: "b", name: "svc-b:9090/metrics", state: "scraping" }, { id: "c", name: "svc-c:9090/metrics", state: "scraping" }, { id: "d", name: "svc-d:9090/metrics", state: "scraping" }],
        code: { ...CODE.tsdb, highlight: [20, 21, 22] },
      },
      { ...S4,
        beat: {
          label: "역할을 나눈다",
          at: "prometheus.yml L24–25",
          caption: "Prometheus 는 최근 15일 빠른 조회, 그 이상은 Thanos. 한 곳에 다 넣지 않는다.",
          changes: [
            { mark: "read", text: "최근 15일 = Prometheus" },
            { mark: "read", text: "장기 · 멀티 클러스터 = Thanos" },
          ],
        },
        focus: "tsdb",
        legend: "TSDB에 15s 간격 데이터 포인트 누적 (시계열 차트)",
        services: [{ id: "a", name: "svc-a:9090/metrics", state: "scraping" }, { id: "b", name: "svc-b:9090/metrics", state: "scraping" }, { id: "c", name: "svc-c:9090/metrics", state: "scraping" }, { id: "d", name: "svc-d:9090/metrics", state: "scraping" }],
        code: { ...CODE.tsdb, highlight: [24, 25] },
      },
    ];

    // ── 단계별 카드 강조 (Prometheus 아키텍처 4단계)
    const PHASES = [
      { key: 'push',      emoji: '📤', name: 'Push',              note: 'StatsD — 앱이 보냄' },
      { key: 'pull',      emoji: '📥', name: 'Pull',              note: 'scrape /metrics' },
      { key: 'discovery', emoji: '🎯', name: 'Service Discovery', note: 'K8s/EC2 자동 등록' },
      { key: 'tsdb',      emoji: '💾', name: 'TSDB',              note: '시계열 저장 (15d)' },
    ];

    // ── 좌측: Prometheus 아키텍처 LiveDataPane
    function LiveDataPane({ beat, step, stepIdx }) {
      const isPush      = step.focus === 'push';
      const isPull      = step.focus === 'pull';
      const isDiscovery = step.focus === 'discovery';
      const isTsdb      = step.focus === 'tsdb';

      // TSDB 시계열 차트용 — 누적 데이터 포인트 (15s 간격)
      const [tsPoints, setTsPoints] = useState([]);
      useEffect(() => {
        if (!isTsdb) return;
        // 단계 진입 시 0 → 누적
        setTsPoints([]);
        let i = 0;
        const id = setInterval(() => {
          i += 1;
          // 적당히 출렁이는 곡선 (rate 같은 느낌)
          const v = 40 + Math.sin(i * 0.4) * 18 + (i % 3) * 4;
          setTsPoints((prev) => {
            const next = [...prev, Math.max(8, Math.min(90, v))];
            return next.length > 18 ? next.slice(-18) : next;
          });
          if (i > 30) clearInterval(id);
        }, 220);
        return () => clearInterval(id);
      }, [isTsdb, stepIdx]);

      return (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* 헤더 */}
          <div className="bg-slate-50 px-4 py-2 flex items-center justify-between border-b border-slate-200">
            <div className="flex items-center gap-2">
              <span className="text-base">🥛</span>
              <span className="text-xs font-bold text-slate-700">Prometheus 아키텍처</span>
            </div>
            <span className="text-[10px] text-slate-500 font-mono">
              {isPush ? 'push (limit)' : `scrape_interval=15s`}
            </span>
          </div>

          {/* 4단계 카드 — 현재 focus 강조 */}
          <div className="px-4 pt-3">
            <div className="grid grid-cols-4 gap-2">
              {PHASES.map((p) => {
                const active = step.focus === p.key;
                return (
                  <div
                    key={p.key}
                    className={`rounded-lg p-2 text-center transition-all duration-300 ${active ? 'bg-red-100 border-2 border-red-400 scale-105 shadow-sm' : 'bg-slate-50 border border-slate-200'}`}
                  >
                    <div className="text-xl">{p.emoji}</div>
                    <div className="text-[11px] font-bold text-slate-800 mt-1">{p.name}</div>
                    <div className="text-[9px] text-slate-500 mt-0.5 leading-tight">{p.note}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 본문 시각화 */}
          <div className="p-4 min-h-[280px]">
            {/* 중앙: Prometheus 노드 + 좌측 서비스 노드들 + 우측 TSDB */}
            <div className="relative">
              <div className="flex items-stretch gap-4">

                {/* 좌측: 서비스 노드 리스트 */}
                <div className="flex-1 space-y-2" key={`svcs-${stepIdx}`}>
                  {step.services.map((s, idx) => {
                    let cls = 'bg-emerald-50 border-emerald-300 text-emerald-800';
                    let badge = '/metrics';
                    let badgeCls = 'bg-emerald-100 text-emerald-700 border-emerald-300';
                    if (s.state === 'silent') {
                      cls = 'bg-slate-100 border-slate-300 text-slate-400';
                      badge = '✕ 무응답';
                      badgeCls = 'bg-slate-200 text-slate-500 border-slate-300';
                    } else if (s.state === 'pushing') {
                      cls = 'bg-amber-50 border-amber-300 text-amber-800';
                      badge = 'push →';
                      badgeCls = 'bg-amber-100 text-amber-700 border-amber-300';
                    } else if (s.state === 'new') {
                      cls = 'bg-red-50 border-red-400 text-red-800 ring-2 ring-red-300 ring-offset-1';
                      badge = 'NEW (auto)';
                      badgeCls = 'bg-red-100 text-red-700 border-red-300';
                    }
                    return (
                      <div
                        key={`${stepIdx}-${s.id}`}
                        className={`rounded-lg border-2 px-3 py-2 flex items-center justify-between transition-all duration-500 fade-in ${cls}`}
                        style={{ animationDelay: `${idx * 120}ms` }}
                      >
                        <div className="flex items-center gap-2">
                          <span className="text-sm">📦</span>
                          <span className="text-[11px] font-mono font-bold">{s.name}</span>
                        </div>
                        <span className={`text-[9px] font-mono px-1.5 py-0.5 rounded border ${badgeCls}`}>{badge}</span>
                      </div>
                    );
                  })}
                </div>

                {/* 화살표 영역 (push: 좌→우 / pull/discovery: 우→좌) */}
                <div className="w-16 flex flex-col items-center justify-center gap-2 relative">
                  {step.services.map((s, idx) => {
                    if (isPush) {
                      const muted = s.state === 'silent';
                      return (
                        <div key={`arr-${s.id}`} className="h-7 flex items-center justify-center w-full">
                          <div className={`w-full h-0.5 ${muted ? 'bg-slate-300' : 'bg-amber-400'} relative ${muted ? '' : 'arrow-push'}`}
                               style={{ animationDelay: `${idx * 200}ms` }}>
                            <span className={`absolute right-0 top-1/2 -translate-y-1/2 text-[10px] ${muted ? 'text-slate-400' : 'text-amber-600'}`}>▶</span>
                          </div>
                        </div>
                      );
                    }
                    // pull / discovery / tsdb — Prometheus가 가지러 옴 (우→좌)
                    const isNew = s.state === 'new';
                    return (
                      <div key={`arr-${s.id}`} className="h-7 flex items-center justify-center w-full">
                        <div className={`w-full h-0.5 ${isNew ? 'bg-red-500' : 'bg-red-400'} relative arrow-pull`}
                             style={{ animationDelay: `${idx * 200}ms` }}>
                          <span className={`absolute left-0 top-1/2 -translate-y-1/2 text-[10px] ${isNew ? 'text-red-700' : 'text-red-600'}`}>◀</span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* 우측: Prometheus 서버 노드 */}
                <div className="w-44 shrink-0 flex flex-col">
                  <div className={`rounded-lg border-2 p-3 text-center transition-all ${isPush ? 'bg-slate-100 border-slate-300 text-slate-500' : 'bg-red-600 border-red-700 text-white shadow-lg shadow-red-500/30'}`}>
                    <div className="text-2xl">🔥</div>
                    <div className="text-xs font-bold mt-1">Prometheus</div>
                    <div className="text-[9px] mt-0.5 opacity-80">
                      {isPush ? '(수집기 — push 대기)' : (isDiscovery ? 'K8s SD enabled' : 'scrape every 15s')}
                    </div>
                  </div>

                  {/* TSDB 칩 — pull 이후 단계에서 보임 */}
                  {!isPush && (
                    <div className={`mt-2 rounded-lg border-2 p-2 transition-all ${isTsdb ? 'bg-red-50 border-red-400' : 'bg-slate-50 border-slate-300'}`}>
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-bold text-slate-700">💾 TSDB</span>
                        <span className="text-[9px] font-mono text-slate-500">15d retention</span>
                      </div>
                      {/* 시계열 차트 — TSDB 단계일 때 누적 */}
                      {isTsdb && (
                        <div className="mt-2 h-12 w-full relative bg-white rounded border border-red-200 overflow-hidden">
                          {/* 격자 */}
                          <div className="absolute inset-0">
                            <div className="absolute left-0 right-0 top-1/3 border-t border-dashed border-red-100" />
                            <div className="absolute left-0 right-0 top-2/3 border-t border-dashed border-red-100" />
                          </div>
                          {/* 데이터 포인트 + 라인 */}
                          <svg className="absolute inset-0 w-full h-full" viewBox="0 0 180 48" preserveAspectRatio="none">
                            {tsPoints.length > 1 && (
                              <polyline
                                fill="none"
                                stroke="#dc2626"
                                strokeWidth="1.5"
                                points={tsPoints.map((v, i) => `${(i / 17) * 180},${48 - (v / 100) * 44}`).join(' ')}
                              />
                            )}
                            {tsPoints.map((v, i) => (
                              <circle
                                key={i}
                                cx={(i / 17) * 180}
                                cy={48 - (v / 100) * 44}
                                r="1.6"
                                fill="#dc2626"
                              />
                            ))}
                          </svg>
                          <div className="absolute bottom-0 left-1 text-[8px] font-mono text-red-700 bg-white/80 px-1 rounded">
                            +{tsPoints.length} pts
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* 범례 */}
          <div className="px-4 pb-3 pt-2 border-t border-slate-100 bg-slate-50">
            <div className="text-[11px] text-slate-600 font-bold mb-1">{step.title.replace(/^Step \d+\. /, '')}</div>
            <div className="text-[10px] text-slate-500 leading-snug">{step.legend}</div>
          </div>
        </div>
      );
    }

    // ── 우측: VSCode 스타일 코드 뷰어 (highlight.js)
    function CodeViewer({ code, stepIdx }) {
      const codeRef = useRef(null);
      const [tokens, setTokens] = useState(null);
      useEffect(() => {
        setTokens(null);
        if (codeRef.current && window.hljs) {
          codeRef.current.textContent = code.lines.join('\n');
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
          setTokens(codeRef.current.innerHTML.split('\n'));
        }
      }, [stepIdx]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일명 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 px-2 py-0.5 rounded bg-slate-700/40 font-mono">{code.lang}</span>
          </div>
          {/* 코드 + 라인 번호 */}
          <div className="overflow-auto max-h-[28rem] text-xs">
            <pre className="p-0 m-0">
              <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
              <code className={`text-slate-200 language-${code.lang} block !bg-transparent !p-0`}>
{code.lines.map((line, i) => {
  const highlighted = code.highlight && code.highlight.includes(i + 1);
  return (
    <div key={i} data-hi={highlighted ? "1" : "0"} className={`flex ${highlighted ? 'bg-yellow-500/10' : ''}`}>
      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-10 shrink-0">{i + 1}</span>
      {tokens && tokens[i] !== undefined
        ? <span className="pl-3 pr-3 whitespace-pre" dangerouslySetInnerHTML={{ __html: tokens[i] }} />
        : <span className="pl-3 pr-3 whitespace-pre">{line || ' '}</span>}
    </div>
  );
})}
              </code>
            </pre>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);

      const handleNext = () => setStepIdx((i) => (i < STEPS.length - 1 ? i + 1 : i));
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      const handleNextRef = useRef(handleNext);
      const handlePrevRef = useRef(handlePrev);
      handleNextRef.current = handleNext;
      handlePrevRef.current = handlePrev;

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setIsPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); handleNextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); handlePrevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const step = STEPS[stepIdx];

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <style>{`
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(4px); }
              to   { opacity: 1; transform: translateY(0); }
            }
            .fade-in {
              opacity: 0;
              animation: fadeIn 360ms ease-out forwards;
            }
            @keyframes arrowPullDash {
              from { background-position: 0 0; }
              to   { background-position: 18px 0; }
            }
            .arrow-pull {
              background-image: linear-gradient(to right, #dc2626 50%, transparent 50%);
              background-size: 9px 2px;
              background-repeat: repeat-x;
              animation: arrowPullDash 700ms linear infinite reverse;
            }
            @keyframes arrowPushDash {
              from { background-position: 0 0; }
              to   { background-position: 18px 0; }
            }
            .arrow-push {
              background-image: linear-gradient(to right, #f59e0b 50%, transparent 50%);
              background-size: 9px 2px;
              background-repeat: repeat-x;
              animation: arrowPushDash 1100ms linear infinite;
            }
          `}</style>

          <div className="max-w-6xl mx-auto space-y-5">

            {/* 헤더 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-red-600 hover:text-red-800 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum II-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-red-600 text-white flex items-center justify-center rounded-full font-bold text-sm">II</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part II. Observability &gt; Chapter 1. Metrics</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">Prometheus 개론 (pull 모델)</h1>
                </div>
              </div>
              <p className="text-slate-600 text-sm leading-relaxed">
                우유 배달 vs 우편 — <strong>누가 가지러 가느냐</strong>의 차이.
                Prometheus는 <code className="bg-slate-100 px-1 rounded text-xs">scrape_interval</code>마다
                각 타깃의 <code className="bg-slate-100 px-1 rounded text-xs">/metrics</code>를 직접 가져온다.
              </p>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} />
              <CodeViewer code={step.code} stepIdx={stepIdx} />
            </div>

            {/* 설명 */}
            <div className="p-4 rounded-xl bg-red-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-red-200">세부 {stepIdx + 1} / {STEPS.length} — {step.title}</h3>
                <span className="text-xs text-red-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 마지막 단계: 다음 안내 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="p-3 rounded-xl bg-red-50 border-2 border-red-300 text-red-900 text-sm">
                💡 다음(II-1-2)에서는 <strong>PromQL 쿼리</strong> — rate, histogram_quantile, sum by (...) 등
              </div>
            )}

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button onClick={() => { setStepIdx(0); setIsPlaying(false); }} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-red-600 text-white hover:bg-red-700 transition min-w-[96px]">
                {isPlaying ? '⏸ 일시정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1}
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./II-1-2.html" className="text-red-600 hover:text-red-800 font-medium">II-1-2 PromQL &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
