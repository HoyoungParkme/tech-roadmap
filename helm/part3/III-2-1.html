<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helm 학습 — III-2-1. 패키징 · 배포 (helm package)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛵</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#277A9F';
    const BRAND_DARK = '#1f6886';
    const BRAND_BG = '#e5f0f6';
    const BRAND_BD = '#a8cee0';

    // 배포 파이프라인 단계 — LiveDataPane 좌측 시각화용
    const PIPELINE = [
      { key:'dir',   label:'차트 디렉터리', icon:'📁', sub:'mychart/' },
      { key:'tgz',   label:'.tgz 아티팩트', icon:'📦', sub:'helm package' },
      { key:'index', label:'index.yaml',    icon:'🗂️', sub:'helm repo index' },
      { key:'repo',  label:'차트 저장소',   icon:'🌐', sub:'GitHub Pages / S3' },
      { key:'install', label:'설치',        icon:'🚀', sub:'helm install' },
    ];

    const STEPS = [
      {
        title:'Step 1. helm package — 차트를 배포 가능한 .tgz 로',
        desc:'차트 디렉터리(mychart/) 는 개발용 원본이다. 남에게 배포하려면 하나의 압축 아티팩트로 굳혀야 한다. helm package ./mychart 를 실행하면 Chart.yaml 의 name 과 version 을 조합한 mychart-0.1.0.tgz 가 생긴다. 파일명은 항상 "이름-버전.tgz" 규칙 — version 을 올리면 파일명도 같이 바뀐다. appVersion 은 파일명에 안 들어가고 앱(이미지) 버전 표시용.',
        stage:'tgz',
        rows:[
          {name:'helm package ./mychart', desc:'디렉터리 → .tgz 아티팩트'},
          {name:'파일명 규칙', desc:'name-version.tgz (Chart.yaml 기준)'},
          {name:'version', desc:'차트 버전 → 파일명에 들어감'},
          {name:'appVersion', desc:'앱/이미지 버전 → 파일명엔 없음'},
        ],
        alert:{tone:'info', text:'파일명 = Chart.yaml 의 name + version. version 을 올려야 새 .tgz 가 나온다.'},
        code:{lang:'bash', filename:'package.sh', lines:[
          '# (1) 차트 메타 — 이 name/version 이 파일명이 된다',
          '$ cat mychart/Chart.yaml',
          'apiVersion: v2',
          'name: mychart',
          'version: 0.1.0           # 차트 버전 → 파일명에 반영',
          'appVersion: "1.0.0"      # 앱 버전 → 파일명엔 안 들어감',
          '',
          '# (2) 패키징 — 디렉터리를 .tgz 로 압축',
          '$ helm package ./mychart',
          'Successfully packaged chart and saved it to: /work/mychart-0.1.0.tgz',
          '',
          '# (3) 결과 아티팩트 확인',
          '$ ls -lh *.tgz',
          '-rw-r--r--  1 dev  staff   4.2K  mychart-0.1.0.tgz',
          '',
          '# (4) version 을 올리면 파일명도 바뀐다',
          '$ helm package ./mychart --version 0.2.0',
          'Successfully packaged chart and saved it to: /work/mychart-0.2.0.tgz',
          '',
          '# (5) 출력 위치 지정 — dist/ 폴더로 모으기',
          '$ helm package ./mychart --destination ./dist',
          '$ ls dist/',
          'mychart-0.1.0.tgz',
          '',
          '# .tgz 내부 구조 (참고) — 원본 디렉터리를 그대로 담는다',
          '$ tar tzf mychart-0.1.0.tgz',
          'mychart/Chart.yaml',
          'mychart/values.yaml',
          'mychart/templates/deployment.yaml',
          'mychart/templates/service.yaml',
        ], highlight:[3,4,5,6,9,10,17,18]},
      },
      {
        title:'Step 2. helm repo index — index.yaml 만들기',
        desc:'.tgz 파일들만 폴더에 있어도 저장소가 되진 않는다. Helm 클라이언트는 index.yaml 이라는 메타데이터 파일을 보고 "이 저장소에 어떤 차트의 어떤 버전이 있고, 다운로드 URL 은 무엇인지" 를 안다. helm repo index ./dist 를 돌리면 그 폴더의 모든 .tgz 를 스캔해 index.yaml 을 생성/갱신한다. --url 로 실제 다운로드 base URL 을 박아준다.',
        stage:'index',
        rows:[
          {name:'helm repo index ./dist', desc:'폴더의 .tgz 스캔 → index.yaml'},
          {name:'--url', desc:'다운로드 base URL 주입'},
          {name:'--merge', desc:'기존 index.yaml 에 새 버전 추가'},
          {name:'index.yaml', desc:'저장소 메타 (차트/버전/URL/digest)'},
        ],
        alert:{tone:'good', text:'index.yaml = 저장소 카탈로그. 없으면 helm 이 차트 목록을 못 읽는다.'},
        code:{lang:'bash', filename:'repo-index.sh', lines:[
          '# (1) dist/ 의 .tgz 들을 스캔해 index.yaml 생성',
          '$ helm repo index ./dist --url https://myorg.github.io/charts',
          '',
          '# (2) 새 버전을 추가할 땐 --merge 로 기존 것 유지',
          '$ helm package ./mychart --version 0.2.0 -d ./dist',
          '$ helm repo index ./dist \\',
          '    --url https://myorg.github.io/charts \\',
          '    --merge ./dist/index.yaml',
          '',
          '# (3) 생성된 index.yaml 내용',
          '$ cat dist/index.yaml',
          'apiVersion: v1',
          'entries:',
          '  mychart:',
          '    - apiVersion: v2',
          '      name: mychart',
          '      version: 0.2.0',
          '      appVersion: "1.0.0"',
          '      created: "2026-08-11T09:00:00Z"',
          '      digest: sha256:9f1c2a...            # .tgz 무결성 해시',
          '      urls:',
          '        - https://myorg.github.io/charts/mychart-0.2.0.tgz',
          '    - apiVersion: v2',
          '      name: mychart',
          '      version: 0.1.0',
          '      urls:',
          '        - https://myorg.github.io/charts/mychart-0.1.0.tgz',
          'generated: "2026-08-11T09:00:00Z"',
          '',
          '# 정리: dist/ 에는 .tgz 여러 개 + index.yaml 1개',
          '$ ls dist/',
          'index.yaml  mychart-0.1.0.tgz  mychart-0.2.0.tgz',
        ], highlight:[2,6,7,8,13,14,15,16,20,21,22]},
      },
      {
        title:'Step 3. 정적 호스팅 — GitHub Pages / S3 로 저장소 운영',
        desc:'차트 저장소는 특별한 서버가 필요 없다. index.yaml 과 .tgz 파일을 HTTP 로 서빙만 하면 된다. 그래서 GitHub Pages, S3, 사내 Nginx 같은 정적 호스팅이면 충분하다. dist/ 폴더 전체(index.yaml + .tgz)를 gh-pages 브랜치나 S3 버킷에 올리면, 그 URL 이 곧 helm repo add 로 붙일 저장소 주소가 된다.',
        stage:'repo',
        rows:[
          {name:'GitHub Pages', desc:'gh-pages 브랜치 → HTTPS 자동'},
          {name:'S3 static', desc:'버킷 + 정적 웹 호스팅'},
          {name:'서빙 대상', desc:'index.yaml + 모든 .tgz'},
          {name:'저장소 URL', desc:'helm repo add 에 쓸 base URL'},
        ],
        alert:{tone:'info', text:'차트 저장소 = 정적 파일 서버. index.yaml + .tgz 만 HTTP 로 열려 있으면 끝.'},
        code:{lang:'bash', filename:'host-static.sh', lines:[
          '# === 방법 A: GitHub Pages (gh-pages 브랜치) ===',
          '$ git checkout --orphan gh-pages',
          '$ git rm -rf .',
          '$ cp dist/index.yaml dist/*.tgz .',
          '$ git add index.yaml *.tgz',
          '$ git commit -m "publish mychart 0.2.0"',
          '$ git push origin gh-pages',
          '# 저장소 URL: https://myorg.github.io/charts',
          '',
          '# === 방법 B: S3 정적 호스팅 ===',
          '$ aws s3 sync ./dist s3://my-helm-charts/ \\',
          '    --acl public-read',
          '# 저장소 URL: https://my-helm-charts.s3.amazonaws.com',
          '',
          '# === 소비자 쪽: repo add 후 사용 ===',
          '$ helm repo add myorg https://myorg.github.io/charts',
          '"myorg" has been added to your repositories',
          '$ helm repo update',
          'Update Complete. Happy Helming!',
          '',
          '# (검색) index.yaml 을 읽어 차트 목록을 보여준다',
          '$ helm search repo myorg',
          'NAME             CHART VERSION   APP VERSION   DESCRIPTION',
          'myorg/mychart    0.2.0           1.0.0         My web app',
          '',
          '# (설치) urls 에 적힌 .tgz 를 내려받아 배포',
          '$ helm install web myorg/mychart',
        ], highlight:[2,3,4,5,6,7,11,12,16,17,22,23,24,27]},
      },
      {
        title:'Step 4. 서명 & provenance — 신뢰할 수 있는 배포',
        desc:'공개 저장소에 올린 차트를 소비자가 "이거 진짜 내가 만든 게 맞나?" 검증하려면 서명이 필요하다. helm package --sign 은 GPG 키로 차트를 서명해 .tgz.prov(provenance) 파일을 함께 만든다. 소비자는 helm install --verify 로 서명·해시를 확인한다. OCI 레지스트리가 아닌 전통 저장소에 밀어넣을 땐 chartmuseum 같은 서버에 helm cm-push 플러그인으로 업로드한다.',
        stage:'repo',
        rows:[
          {name:'--sign --key --keyring', desc:'GPG 키로 차트 서명'},
          {name:'.prov 파일', desc:'provenance — 해시+서명 기록'},
          {name:'helm install --verify', desc:'소비자 쪽 서명 검증'},
          {name:'helm cm-push', desc:'chartmuseum 서버로 업로드'},
        ],
        alert:{tone:'warn', text:'.prov 파일도 index.yaml/.tgz 와 함께 업로드해야 --verify 가 동작한다.'},
        code:{lang:'bash', filename:'sign-and-push.sh', lines:[
          '# (1) GPG 키로 서명하며 패키징 → .tgz + .tgz.prov',
          '$ helm package ./mychart \\',
          '    --sign \\',
          '    --key devops@myorg.io \\',
          '    --keyring ~/.gnupg/secring.gpg',
          'Successfully packaged chart and saved it to: mychart-0.2.0.tgz',
          '',
          '$ ls',
          'mychart-0.2.0.tgz  mychart-0.2.0.tgz.prov   # .prov 동반 생성',
          '',
          '# (2) provenance 파일 내용 (요약)',
          '$ cat mychart-0.2.0.tgz.prov',
          'name: mychart',
          'version: 0.2.0',
          'files:',
          '  mychart-0.2.0.tgz: sha256:9f1c2a...',
          '-----BEGIN PGP SIGNATURE-----',
          '...서명 블록...',
          '-----END PGP SIGNATURE-----',
          '',
          '# (3) 소비자: 설치 시 서명 검증',
          '$ helm install web myorg/mychart --verify \\',
          '    --keyring ~/.gnupg/pubring.gpg',
          'Verification: signed by "DevOps <devops@myorg.io>"',
          '',
          '# (4) OCI 아닌 저장소: chartmuseum + cm-push 플러그인',
          '$ helm plugin install https://github.com/chartmuseum/helm-push',
          '$ helm repo add cm http://chartmuseum.myorg.io',
          '$ helm cm-push mychart-0.2.0.tgz cm',
          'Pushing mychart-0.2.0.tgz to cm... Done.',
        ], highlight:[2,3,4,5,9,16,17,18,22,23,24,28,29,30]},
      },
      {
        title:'Step 5. 실무 전체 흐름 — package → index → upload → add → install',
        desc:'지금까지 조각을 하나의 릴리스 파이프라인으로 잇는다. (1) 차트 버전을 올리고 helm package 로 .tgz 를 만든다 → (2) helm repo index --merge 로 index.yaml 을 갱신한다 → (3) dist/ 전체를 정적 호스팅에 업로드한다 → (4) 소비자는 helm repo add 로 한 번 등록하고 → (5) helm install/upgrade 로 배포한다. CI 에 넣어 태그 푸시마다 자동으로 돌리는 게 표준.',
        stage:'install',
        rows:[
          {name:'1. package', desc:'버전 bump → .tgz 생성'},
          {name:'2. index --merge', desc:'index.yaml 갱신'},
          {name:'3. upload', desc:'정적 호스팅에 배포'},
          {name:'4. repo add/update', desc:'소비자 등록 (최초 1회)'},
          {name:'5. install/upgrade', desc:'클러스터에 배포'},
        ],
        wins:[
          'helm package 로 디렉터리를 name-version.tgz 아티팩트로 굳힌다',
          'helm repo index 로 index.yaml(저장소 카탈로그)을 만든다',
          '차트 저장소는 정적 호스팅(GitHub Pages/S3)이면 충분하다',
          '--sign + .prov 로 서명, --verify 로 소비자가 검증한다',
          'OCI 아닌 저장소엔 chartmuseum + cm-push 로 업로드',
          'package → index → upload → repo add → install 을 CI 로 자동화',
        ],
        alert:{tone:'good', text:'태그 푸시 → package → index → upload 를 CI 로 묶으면 릴리스가 한 번에 끝난다.'},
        code:{lang:'bash', filename:'.github/workflows/release-chart.yml', lines:[
          '# 태그 푸시마다 차트를 패키징·배포하는 CI 파이프라인',
          'name: release-chart',
          'on:',
          '  push:',
          '    tags: [ "chart-v*" ]',
          'jobs:',
          '  release:',
          '    runs-on: ubuntu-latest',
          '    steps:',
          '      - uses: actions/checkout@v4',
          '      - uses: azure/setup-helm@v4',
          '',
          '      # 1) 의존성 + 패키징',
          '      - run: helm dependency update ./mychart',
          '      - run: helm package ./mychart -d ./dist',
          '',
          '      # 2) index.yaml 갱신 (--merge 로 이전 버전 유지)',
          '      - run: |',
          '          helm repo index ./dist \\',
          '            --url https://myorg.github.io/charts \\',
          '            --merge ./dist/index.yaml',
          '',
          '      # 3) gh-pages 로 업로드 (정적 호스팅)',
          '      - uses: peaceiris/actions-gh-pages@v4',
          '        with:',
          '          publish_dir: ./dist',
          '          publish_branch: gh-pages',
          '',
          '# === 소비자 쪽 (최초 1회 등록 후 반복 배포) ===',
          '# $ helm repo add myorg https://myorg.github.io/charts',
          '# $ helm repo update',
          '# $ helm upgrade --install web myorg/mychart --version 0.2.0',
        ], highlight:[13,14,15,17,18,19,20,21,23,24,25,26,30,31,32]},
      },
    ];

    function Rows({ rows }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>⛵ 패키징 · 배포 키워드</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-44 font-mono font-bold" style={{color:BRAND}}>{r.name}</span>
                <span className="flex-1 px-2 py-0.5 rounded font-mono" style={{background:BRAND_BG, color:BRAND_DARK}}>{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Pipeline({ stage }) {
      const activeIdx = PIPELINE.findIndex((p) => p.key === stage);
      return (
        <div className="rounded-lg bg-white p-3" style={{border:`2px solid ${BRAND}`}}>
          <div className="text-xs font-bold mb-2" style={{color:BRAND_DARK}}>배포 파이프라인</div>
          <div className="flex items-stretch gap-1">
            {PIPELINE.map((p, i) => {
              const done = i < activeIdx;
              const active = i === activeIdx;
              const bg = active ? BRAND : done ? BRAND_BG : '#ffffff';
              const tx = active ? '#ffffff' : done ? BRAND_DARK : '#94a3b8';
              const bd = active || done ? BRAND : '#e2e8f0';
              return (
                <React.Fragment key={p.key}>
                  <div className="flex-1 rounded-lg px-1 py-2 text-center transition" style={{background:bg, color:tx, border:`1px solid ${bd}`, transform: active ? 'scale(1.04)' : 'none'}}>
                    <div className="text-lg leading-none">{p.icon}</div>
                    <div className="text-[10px] font-bold mt-1 leading-tight">{p.label}</div>
                    <div className="text-[9px] font-mono mt-0.5 opacity-80 leading-tight">{p.sub}</div>
                  </div>
                  {i < PIPELINE.length - 1 && (
                    <div className="self-center text-xs" style={{color: i < activeIdx ? BRAND : BRAND_BD}}>&rarr;</div>
                  )}
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col gap-3" style={{border:`1px solid ${BRAND}`}}>
          <div className="text-sm font-bold" style={{color:BRAND_DARK}}>차트 → 아티팩트 → 저장소 → 설치</div>
          <Pipeline stage={state.stage} />
          <Rows rows={state.rows} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:BRAND_BG}}>
          <div className="text-lg font-bold mb-2" style={{color:BRAND_DARK}}>⛵ {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:BRAND_DARK}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:BRAND_BG, bd:BRAND_BD, tx:BRAND_DARK, icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); window.hljs.highlightElement(codeRef.current); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(39,122,159,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:`linear-gradient(135deg,${BRAND_BG} 0%,#cfe5ef 100%)`}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>⛵</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:BRAND_DARK}}>III-2-1. 패키징 · 배포 (helm package)</h1>
                <p className="text-sm" style={{color:BRAND}}>비유: 차트를 배포 가능한 아티팩트로 굳혀 저장소에 올린다 = npm publish</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : BRAND_BD}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:`${BRAND}aa`}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                helm package 로 .tgz 를 만들고 → helm repo index 로 index.yaml 을 갱신 → 정적 호스팅에 업로드 → repo add → install. 서명(.prov)까지 붙이면 신뢰 배포 완성.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["Helm","Package","RepoIndex","Provenance","GitHubPages"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:BRAND_BG, color:BRAND_DARK, border:`1px solid ${BRAND_BD}`}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 목차</a>
              <div className="flex gap-4">
                <a href="./III-1-2.html" className="underline hover:no-underline">← 이전</a>
                <a href="./III-2-2.html" className="underline hover:no-underline">다음 →</a>
              </div>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
