  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-1-1. Chart 구조 — Helm 의 패키지 단위
    학습 목표: helm create 가 만들어주는 디렉터리(Chart.yaml/templates/values.yaml/charts/)가
              각각 어떤 역할을 하는지, 그리고 이 묶음 하나가 어떻게 "Kubernetes 매니페스트의 압축 패키지"
              로 동작하는지 시각화로 익힌다.
    핵심 비유: Helm Chart = "쿠버네티스용 npm 패키지" — package.json(Chart.yaml) + src(templates) + 설정(values).
    패턴: fastapi v1 — 좌(LiveDataPane: chart 트리 → template+values 결합 → 매니페스트)
                       / 우(VSCode CodeViewer YAML)
    색상: cyan (#277A9F 계열)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — Chart 디렉터리 탐색
    //   1) helm create 로 골격 생성
    //   2) Chart.yaml — 메타데이터
    //   3) values.yaml — 기본 설정값
    //   4) templates/ — Go template 매니페스트
    //   5) 결합 결과 — 실제 쿠버네티스 매니페스트
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. helm create 로 차트 골격 생성',
        desc: 'Helm 의 첫 명령은 helm create <이름> 이다. 이 명령은 "쿠버네티스 앱을 패키지로 묶는 최소 골격"을 만들어준다. 결과는 단순한 디렉터리이지만, 각 파일/폴더는 정해진 역할이 있고 helm CLI 가 이 약속을 그대로 따른다. npm init 이 package.json 을 만들 듯, helm create 는 Chart.yaml 을 중심으로 6~7개의 파일을 한꺼번에 만든다.',
        codeLeftLabel: '$ helm create webapp',
        codeLeft: `webapp/
├ Chart.yaml          # 메타데이터
├ values.yaml         # 기본 설정값
├ templates/          # Go template 매니페스트
│  ├ deployment.yaml
│  ├ service.yaml
│  ├ _helpers.tpl
│  └ NOTES.txt
├ charts/             # subchart 의존성
└ .helmignore`,
        tree: [
          { id: 't1-1', label: 'webapp/  (chart root)', depth: 0, kind: 'chart' },
          { id: 't1-2', label: '├ Chart.yaml', depth: 1, kind: 'meta' },
          { id: 't1-3', label: '├ values.yaml', depth: 1, kind: 'values' },
          { id: 't1-4', label: '├ templates/', depth: 1, kind: 'template' },
          { id: 't1-5', label: '│   ├ deployment.yaml', depth: 2, kind: 'template' },
          { id: 't1-6', label: '│   ├ service.yaml', depth: 2, kind: 'template' },
          { id: 't1-7', label: '│   └ _helpers.tpl', depth: 2, kind: 'template' },
          { id: 't1-8', label: '├ charts/  (subchart)', depth: 1, kind: 'dep' },
          { id: 't1-9', label: '└ .helmignore', depth: 1, kind: 'note' },
        ],
        dom: [
          { id: 'd1-1', tag: 'chart', depth: 0, text: '(파일들이 모인 디렉터리 — 아직 쿠버네티스 리소스 아님)' },
        ],
        arrow: { left: 'helm create', right: '디렉터리 골격' },
        keyPoint: 'Helm Chart = 디렉터리 한 개 + 정해진 6~7개의 파일. 디렉터리 자체가 패키지의 단위다.',
        code: {
          lang: 'yaml',
          filename: 'webapp/ (tree)',
          lines: [
            '# Step 1. helm create webapp 가 만들어주는 디렉터리 구조',
            '#',
            '# $ helm create webapp',
            '# Creating webapp',
            '#',
            '# 결과:',
            '#',
            'webapp/',
            '├── Chart.yaml          # 차트 메타데이터 (이름·버전·설명)',
            '├── values.yaml         # 사용자가 override 가능한 기본 설정',
            '├── charts/             # 의존(subchart) 차트 보관',
            '├── templates/          # Go template 으로 쓰여진 K8s 매니페스트',
            '│   ├── deployment.yaml',
            '│   ├── service.yaml',
            '│   ├── ingress.yaml',
            '│   ├── serviceaccount.yaml',
            '│   ├── hpa.yaml',
            '│   ├── NOTES.txt        # install 후 보여줄 안내문',
            '│   ├── _helpers.tpl     # 재사용 named template 모음',
            '│   └── tests/',
            '│       └── test-connection.yaml',
            '└── .helmignore         # package 시 제외할 파일 패턴',
            '',
            '# 각 파일의 역할 요약',
            '#',

            '    app.kubernetes.io/instance: web',
            '---',
            '# Source: webapp/templates/deployment.yaml',
            'apiVersion: apps/v1',
            'kind: Deployment',
            'metadata:',
            '  name: web-webapp',
            '  labels:',
            '    helm.sh/chart: webapp-0.1.0',
            '    app.kubernetes.io/name: webapp',
            '    app.kubernetes.io/instance: web',
            'spec:',
            '  replicas: 2',
            '  selector:',
            '    matchLabels:',
            '      app.kubernetes.io/name: webapp',
            '      app.kubernetes.io/instance: web',
            '  template:',
            '    metadata:',
            '      labels:',
            '        app.kubernetes.io/name: webapp',
            '        app.kubernetes.io/instance: web',
            '    spec:',
            '      serviceAccountName: web-webapp',
            '      containers:',
            '        - name: webapp',
            '          image: "nginx:1.25"',
            '          imagePullPolicy: IfNotPresent',
            '          ports:',
            '            - name: http',
            '              containerPort: 8080',
            '              protocol: TCP',
            '          resources:',
            '            limits:',
            '              cpu: 500m',
            '              memory: 256Mi',
            '',
            '# 💡 핵심 정리 — 3가지 개념',
            '#',
            '#   Chart    : 디렉터리 (template + values 묶음)',
            '#   Manifest : 위 렌더링 결과 YAML (kubectl 이 보는 것)',
            '#   Release  : 위 매니페스트가 클러스터에 배포된 인스턴스 (이름 = web)',
            '#',
            '# 다음 단계: Release 의 생명주기 (install/upgrade/rollback)',
          ],
          highlight: [1, 8, 10, 11, 12, 13, 14, 15, 22, 23, 24, 25, 26, 27, 32, 33, 34, 35, 36, 42, 43, 44, 45, 46, 53, 54, 64, 65, 66, 67, 68, 69, 70, 71, 79, 80, 81, 82, 83, 84],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // CodeCard — 좌측 입력 YAML 카드
    // ─────────────────────────────────────────────────────
    function CodeCard({ label, code, accent }) {
      return (
        <div className={`rounded-lg border-2 ${accent === 'in' ? 'border-cyan-300 bg-cyan-50' : 'border-slate-200 bg-slate-50'} overflow-hidden`}>
          <div className={`px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider ${accent === 'in' ? 'bg-cyan-100 text-cyan-700' : 'bg-slate-100 text-slate-600'}`}>
            {label}
          </div>
          <pre className="text-[11px] font-mono text-slate-800 leading-snug p-2.5 m-0 whitespace-pre overflow-x-auto">{code}</pre>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // PipelineTree — 차트 구조/필드/렌더 결과 트리
    // ─────────────────────────────────────────────────────
    function PipelineTree({ nodes }) {
      const kindMap = {
        chart:    { bg: 'bg-cyan-100',    text: 'text-cyan-800',    border: 'border-cyan-300',    tag: 'chart' },
        meta:     { bg: 'bg-indigo-50',   text: 'text-indigo-800',  border: 'border-indigo-300',  tag: 'meta'  },
        values:   { bg: 'bg-amber-50',    text: 'text-amber-800',   border: 'border-amber-300',   tag: 'value' },
        template: { bg: 'bg-fuchsia-50',  text: 'text-fuchsia-800', border: 'border-fuchsia-300', tag: 'tmpl'  },
        helper:   { bg: 'bg-purple-50',   text: 'text-purple-800',  border: 'border-purple-300',  tag: 'tpl'   },
        leaf:     { bg: 'bg-emerald-50',  text: 'text-emerald-800', border: 'border-emerald-300', tag: 'leaf'  },
        dep:      { bg: 'bg-rose-50',     text: 'text-rose-800',    border: 'border-rose-300',    tag: 'dep'   },
        note:     { bg: 'bg-slate-100',   text: 'text-slate-600',   border: 'border-slate-300',   tag: 'note'  },
        test:     { bg: 'bg-sky-50',      text: 'text-sky-800',     border: 'border-sky-300',     tag: 'test'  },
      };
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600">
            차트 구조 / 필드 / 렌더 결과
          </div>
          <div className="p-2.5 space-y-1">
            {nodes.map((n) => {
              const c = kindMap[n.kind] || kindMap.chart;
              return (
                <div key={n.id} className="flex items-center gap-1.5" style={{ marginLeft: `${n.depth * 14}px` }}>
                  <span className={`text-[8px] font-mono px-1.5 py-0.5 rounded ${c.bg} ${c.text} border ${c.border} font-bold uppercase tracking-wide flex-shrink-0`}>
                    {c.tag}
                  </span>
                  <span className="text-[11px] font-mono text-slate-700 leading-tight">{n.label}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // OutputCard — 마지막 단계: 매니페스트 출력 / 다음 단계 입력
    // ─────────────────────────────────────────────────────
    function OutputCard({ nodes, isFinal }) {
      return (
        <div className={`bg-white rounded-lg border-2 ${isFinal ? 'border-emerald-300' : 'border-slate-200'} overflow-hidden`}>
          <div className={`px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider flex items-center justify-between ${isFinal ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>
            <span>{isFinal ? 'K8s 매니페스트 (helm template 출력)' : '다음 단계 입력 ↓'}</span>
            <span className="text-[9px] font-mono">{isFinal ? 'manifest' : 'pending'}</span>
          </div>
          <div className="p-2.5 font-mono text-[11px] space-y-0.5">
            {nodes.map((n) => (
              <div key={n.id} className="flex items-start gap-1" style={{ marginLeft: `${n.depth * 16}px` }}>
                <span className="text-slate-400">[</span>
                <span className={`font-bold ${isFinal ? 'text-emerald-700' : 'text-slate-600'}`}>{n.tag}</span>
                <span className="text-slate-400">]</span>
                {n.text && <span className="text-slate-700 ml-1">{n.text}</span>}
              </div>
            ))}
            {isFinal && (
              <div className="mt-2 p-3 bg-slate-50 border border-slate-200 rounded space-y-1">
                <div className="text-[10px] text-slate-400 uppercase tracking-wider mb-1">helm install 결과 (요약)</div>
                <div className="text-[11px]"><span className="font-bold text-emerald-700">NAME:</span> <span className="font-mono">web</span></div>
                <div className="text-[11px]"><span className="font-bold text-emerald-700">STATUS:</span> <span className="font-mono text-emerald-600">deployed</span></div>
                <div className="text-[11px]"><span className="font-bold text-emerald-700">REVISION:</span> <span className="font-mono">1</span></div>
                <div className="text-[11px]"><span className="font-bold text-emerald-700">CHART:</span> <span className="font-mono">webapp-0.1.0</span></div>
                <div className="text-[11px]"><span className="font-bold text-emerald-700">RESOURCES:</span> <span className="font-mono">Deployment, Service, SA</span></div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // FlowArrow — 수직 화살표
    // ─────────────────────────────────────────────────────
    function FlowArrow({ label }) {
      return (
        <div className="flex items-center justify-center my-1">
          <div className="flex flex-col items-center">
            <div className="text-[9px] text-cyan-600 font-mono font-bold tracking-wider uppercase">{label}</div>
            <div className="text-cyan-400 text-lg leading-none">↓</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 전체
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step, stepIdx, total }) {
      const isPaired = step.codeRight !== undefined;
      const isFinal = stepIdx === total - 1;
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">⎈ Chart 디렉터리 → Template + Values → 매니페스트</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-1">
            {isPaired ? (
              <div className="grid grid-cols-2 gap-2">
                <CodeCard label={step.codeLeftLabel} code={step.codeLeft} accent="in" />
                <CodeCard label={step.codeRightLabel} code={step.codeRight} accent="out" />
              </div>
            ) : (
              <CodeCard label={step.codeLeftLabel} code={step.codeLeft} accent="in" />
            )}

            <FlowArrow label={step.arrow.left} />

            <PipelineTree nodes={step.tree} />

            <FlowArrow label={step.arrow.right} />

            <OutputCard nodes={step.dom} isFinal={isFinal} />
          </div>

          <div className="mt-3 bg-cyan-50 border-l-4 border-cyan-400 px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-cyan-700 uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-cyan-900 leading-snug">{step.keyPoint}</p>
          </div>

          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-cyan-400"></span>chart</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-indigo-400"></span>meta</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-amber-400"></span>values</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-fuchsia-400"></span>template</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-purple-400"></span>helper</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-emerald-400"></span>leaf</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-rose-400"></span>dep</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode CodeViewer — highlight.js + atom-one-dark
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-cyan-500/15 border-l-2 border-cyan-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App — 메인 컨테이너
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-cyan-700 hover:text-cyan-900 font-medium">&larr; 목차로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter I-1-1</span>
            </nav>

            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 text-white flex items-center justify-center rounded-full font-bold text-sm" style={{ background: '#277A9F' }}>⎈</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. Helm 기초 &gt; Chapter 1. Chart 구조</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">I-1-1. Chart 구조 — Helm 의 패키지 단위</h1>
                  <p className="text-sm text-slate-500 mt-0.5">Chart.yaml / values.yaml / templates/ 가 결합돼 K8s 매니페스트가 되는 과정</p>
                </div>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} stepIdx={stepIdx} total={STEPS.length} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {stepIdx === STEPS.length - 1 && (
              <div className="bg-cyan-50 border-2 border-cyan-300 rounded-xl p-3 text-sm text-cyan-900">
                💡 정리: Helm Chart 는 <strong>Chart.yaml + values.yaml + templates/</strong> 로 구성된 디렉터리 한 개다.
                helm install 시 <strong>템플릿이 values 와 결합</strong>되어 평범한 K8s 매니페스트로 렌더링되고, <strong>Release</strong> 라는
                이름으로 클러스터에 추적된다. 다음 챕터에서 이 Release 의 생명주기를 다룬다.
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#1f6886' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-100">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-cyan-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                처음
              </button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                &larr; 이전
              </button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]" style={{ background: '#277A9F' }}>
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
                다음 &rarr;
              </button>
            </div>

            <div className="flex flex-wrap gap-2 justify-center">
              {['Chart.yaml', 'values.yaml', 'templates/', 'Release', 'helm create', 'helm template', 'appVersion', 'NOTES.txt'].map((kw) => (
                <span key={kw} className="bg-cyan-50 text-cyan-700 px-3 py-1 rounded-full text-xs font-medium border border-cyan-200">{kw}</span>
              ))}
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-cyan-700 hover:text-cyan-900 font-medium">&larr; 목차</a>
              <a href="./I-1-2.html" className="text-cyan-700 hover:text-cyan-900 font-medium">Release 생명주기 &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
