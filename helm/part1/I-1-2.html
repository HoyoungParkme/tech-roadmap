    패턴: fastapi v1 — 좌(LiveDataPane: helm 명령 → release 트리 → 클러스터 상태)

              <div className="bg-cyan-50 border-2 border-cyan-300 rounded-xl p-3 text-sm text-cyan-900">
                💡 정리: <strong>install → upgrade → rollback → uninstall</strong> 의 매 단계는 <strong>revision 으로 기록</strong>된다.
                rollback 도 revision 이 늘어나며, 모든 히스토리는 클러스터의 <strong>Secret 으로 저장</strong>되어 별도 DB 가 필요 없다.
                CI/CD 에서는 <strong>helm upgrade --install --atomic --wait</strong> 가 가장 안전한 표준 패턴.
              </div>
            )}

            <div className="p-4 rounded-xl text-white shadow-sm" style={{ background: '#1f6886' }}>
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-cyan-100">
                  Step {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-cyan-100">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold text-white transition min-w-[100px]" style={{ background: '#277A9F' }}>
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>

            <div className="flex flex-wrap gap-2 justify-center">
              {['helm install', 'helm upgrade', 'helm rollback', 'helm uninstall', 'revision', '--atomic', '--keep-history', 'helm test'].map((kw) => (
                <span key={kw} className="bg-cyan-50 text-cyan-700 px-3 py-1 rounded-full text-xs font-medium border border-cyan-200">{kw}</span>
              ))}
            </div>

            <nav className="flex justify-between text-sm pt-2">
              <a href="./I-1-1.html" className="text-cyan-700 hover:text-cyan-900 font-medium">&larr; Chart 구조</a>
              <a href="./I-2-1.html" className="text-cyan-700 hover:text-cyan-900 font-medium">Chart Repository &rarr;</a>
            </nav>

            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
