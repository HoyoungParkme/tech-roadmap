</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#277A9F';
    const BRAND_DARK = '#1f6886';
    const BRAND_BG = '#e5f0f6';
    const BRAND_BD = '#a8cee0';

    const STEPS = [
      {
        title:'Step 1. Hook 이란 — 릴리스 생명주기에 끼어드는 훅',
        desc:'helm install / upgrade / delete 는 그냥 매니페스트를 적용하는 게 아니다. 각 단계 앞뒤로 "훅(hook)" 을 걸 수 있다. 예를 들어 앱 Pod 이 뜨기 전에 DB 스키마를 만들거나(pre-install), 업그레이드 직전에 마이그레이션을 돌리거나(pre-upgrade), 삭제 직전에 백업을 뜨는(pre-delete) 식이다. 훅은 보통 Job 으로 만들고, 일반 리소스와 달리 Helm 이 정해진 시점에 따로 실행해 완료를 기다린다.',
        rows:[
          {name:'hook = Job', desc:'특정 시점에 1회 실행되는 리소스 (보통 Job)'},
          {name:'helm.sh/hook', desc:'annotation 으로 훅 시점 지정'},
          {name:'일반 리소스', desc:'설치 시 함께 apply — 훅은 별도 타이밍'},
          {name:'완료 대기', desc:'훅 Job 이 성공해야 다음 단계로'},
        ],
        alert:{tone:'info', text:'hook = 생명주기의 정해진 시점에 Helm 이 따로 실행하고 완료를 기다리는 리소스.'},
        timeline:[
          {t:'render', label:'매니페스트 렌더', kind:'sys', active:false},
          {t:'pre',    label:'pre-install 훅', kind:'hook', active:true},
          {t:'apply',  label:'리소스 설치', kind:'sys', active:false},
          {t:'post',   label:'post-install 훅', kind:'hook', active:false},
        ],
        code:{lang:'yaml', filename:'templates/pre-install-job.yaml', lines:[
          '# 가장 단순한 훅 — 설치 직전 실행되는 Job',
          '# 일반 templates/ 안에 두되 annotation 으로 훅임을 표시한다',
          'apiVersion: batch/v1',
          'kind: Job',
          'metadata:',
          '  name: {{ .Release.Name }}-db-init',
          '  annotations:',
          '    # 이 한 줄이 이 Job 을 "훅" 으로 만든다',
          '    "helm.sh/hook": pre-install',
          'spec:',
          '  backoffLimit: 3            # 실패 시 재시도 횟수',
          '  template:',
          '    spec:',
          '      restartPolicy: Never',
          '      containers:',
          '        - name: db-init',
          '          image: postgres:16',
          '          command:',
          '            - psql',
          '            - -h',
          '            - {{ .Release.Name }}-postgresql',
          '            - -c',
          '            - "CREATE SCHEMA IF NOT EXISTS app;"',
          '',
          '# helm install 하면:',
          '#  1) 매니페스트 렌더',
          '#  2) pre-install 훅 (이 Job) 실행 → 완료 대기',
          '#  3) Deployment / Service 등 실제 리소스 설치',
        ], highlight:[6,7,8,9]},
      },
      {
        title:'Step 2. 훅 종류 — install · upgrade · delete · rollback · test',
        desc:'훅은 생명주기 이벤트마다 pre/post 쌍으로 존재한다. install(설치), upgrade(업그레이드), delete(삭제), rollback(롤백) 각각 앞뒤. 그리고 helm test 로만 도는 test 훅이 별도로 있다. 주의할 점: pre-delete 는 리소스가 지워지기 전에, post-delete 는 지워진 뒤에 돈다. 롤백 훅은 helm rollback 시에만 동작한다. 시점을 헷갈리면 마이그레이션이 엉뚱한 순서로 돌아 사고가 난다.',
        rows:[
          {name:'pre/post-install', desc:'helm install 앞뒤'},
          {name:'pre/post-upgrade', desc:'helm upgrade 앞뒤'},
          {name:'pre/post-delete', desc:'helm uninstall 앞뒤'},
          {name:'pre/post-rollback', desc:'helm rollback 앞뒤'},
          {name:'test', desc:'helm test 로만 실행 (검증용)'},
        ],
        alert:{tone:'warn', text:'pre-delete 는 리소스 삭제 전, post-delete 는 삭제 후. 백업은 보통 pre-delete.'},
        timeline:[
          {t:'pre-up',   label:'pre-upgrade', kind:'hook', active:true},
          {t:'apply',    label:'새 리소스 apply', kind:'sys', active:false},
          {t:'post-up',  label:'post-upgrade', kind:'hook', active:false},
          {t:'test',     label:'test (helm test)', kind:'test', active:false},
        ],
        code:{lang:'yaml', filename:'hook-events.yaml', lines:[
          '# 훅 시점(event) 종류 — annotation 값으로 지정',
          '#',
          '# 설치:   pre-install     post-install',
          '# 업그레이드: pre-upgrade   post-upgrade',
          '# 삭제:   pre-delete      post-delete',
          '# 롤백:   pre-rollback    post-rollback',
          '# 테스트: test',
          '#',
          '# 하나의 훅에 여러 이벤트를 줄 수도 있다 (쉼표)',
          'apiVersion: batch/v1',
          'kind: Job',
          'metadata:',
          '  name: {{ .Release.Name }}-migrate',
          '  annotations:',
          '    # 설치와 업그레이드 둘 다에서 실행',
          '    "helm.sh/hook": pre-install,pre-upgrade',
          'spec:',
          '  template:',
          '    spec:',
          '      restartPolicy: Never',
          '      containers:',
          '        - name: migrate',
          '          image: myorg/migrator:1.4.0',
          '          command: ["alembic", "upgrade", "head"]',
          '---',
          '# 검증용 test 훅 — helm test <release> 로만 실행',
          'apiVersion: v1',
          'kind: Pod',
          'metadata:',
          '  name: {{ .Release.Name }}-conn-test',
          '  annotations:',
          '    "helm.sh/hook": test',
          'spec:',
          '  restartPolicy: Never',
          '  containers:',
          '    - name: curl',
          '      image: curlimages/curl:8.9.0',
          '      command: ["curl", "-sf", "http://{{ .Release.Name }}:8080/healthz"]',
        ], highlight:[13,14,15,16,25,30,31,32]},
      },
      {
        title:'Step 3. hook-weight — 훅 실행 순서 정하기',
        desc:'같은 시점(pre-install 등)에 훅이 여러 개면 어떤 게 먼저 돌까? helm.sh/hook-weight 로 순서를 정한다. 값은 문자열 정수("-5", "0", "5")이고, 작은 값이 먼저 실행된다. 음수도 가능. weight 가 같으면 리소스 종류·이름 순으로 정렬된다. DB 를 먼저 초기화하고(weight -5) 그 다음 시드 데이터를 넣는(weight 0) 식으로 의존 순서를 표현한다. weight 는 반드시 따옴표로 감싼 문자열이어야 한다.',
        rows:[
          {name:'hook-weight', desc:'실행 순서 — 작을수록 먼저'},
          {name:'"-5" → "0" → "5"', desc:'문자열 정수, 오름차순'},
          {name:'같은 weight', desc:'종류·이름 순으로 정렬'},
          {name:'따옴표 필수', desc:'"0" 처럼 문자열이어야 함'},
        ],
        alert:{tone:'good', text:'weight 오름차순으로 실행 — DB 생성(-5) → 스키마(0) → 시드(5) 순서 표현.'},
        timeline:[
          {t:'w-5',  label:'weight -5 · DB 생성', kind:'hook', active:true},
          {t:'w0',   label:'weight 0 · 스키마', kind:'hook', active:true},
          {t:'w5',   label:'weight 5 · 시드', kind:'hook', active:true},
          {t:'apply',label:'앱 설치', kind:'sys', active:false},
        ],
        code:{lang:'yaml', filename:'hook-weight-order.yaml', lines:[
          '# 같은 pre-install 시점에 3개의 훅 — weight 로 순서 보장',
          '# 실행: create-db(-5) → schema(0) → seed(5)',
          'apiVersion: batch/v1',
          'kind: Job',
          'metadata:',
          '  name: {{ .Release.Name }}-01-create-db',
          '  annotations:',
          '    "helm.sh/hook": pre-install',
          '    "helm.sh/hook-weight": "-5"      # 가장 먼저',
          'spec:',
          '  template:',
          '    spec:',
          '      restartPolicy: Never',
          '      containers:',
          '        - name: create',
          '          image: postgres:16',
          '          command: ["createdb", "appdb"]',
          '---',
          'apiVersion: batch/v1',
          'kind: Job',
          'metadata:',
          '  name: {{ .Release.Name }}-02-schema',
          '  annotations:',
          '    "helm.sh/hook": pre-install',
          '    "helm.sh/hook-weight": "0"       # 두 번째',
          'spec:',
          '  template:',
          '    spec:',
          '      restartPolicy: Never',
          '      containers:',
          '        - name: schema',
          '          image: myorg/migrator:1.4.0',
          '          command: ["alembic", "upgrade", "head"]',
          '---',
          'apiVersion: batch/v1',
          'kind: Job',
          'metadata:',
          '  name: {{ .Release.Name }}-03-seed',
          '  annotations:',
          '    "helm.sh/hook": pre-install',
          '    "helm.sh/hook-weight": "5"       # 마지막',
          'spec:',
          '  template:',
          '    spec:',
          '      restartPolicy: Never',
          '      containers:',
          '        - name: seed',
          '          image: myorg/seeder:1.0.0',
          '          command: ["python", "seed.py"]',
        ], highlight:[7,8,9,22,23,24,39,40,41]},
      },
      {
        title:'Step 4. hook-delete-policy — 훅 리소스 정리',
        desc:'훅 Job 은 실행 후에도 클러스터에 그대로 남는다. 다음 번 upgrade 에서 같은 이름의 Job 을 만들려 하면 "already exists" 로 실패한다. 그래서 helm.sh/hook-delete-policy 로 언제 지울지 정한다. before-hook-creation 은 훅을 만들기 직전에 이전 것을 지워 재실행을 항상 가능하게 한다(가장 흔한 기본). hook-succeeded 는 성공하면 지우고, hook-failed 는 실패하면 지운다. 디버깅하려면 실패한 훅은 남겨야 하니 hook-succeeded 만 주는 경우도 많다.',
        rows:[
          {name:'before-hook-creation', desc:'만들기 전 이전 것 삭제 (재실행 보장)'},
          {name:'hook-succeeded', desc:'성공하면 삭제 (깔끔)'},
          {name:'hook-failed', desc:'실패하면 삭제'},
          {name:'조합 가능', desc:'쉼표로 여러 정책 동시에'},
        ],
        alert:{tone:'warn', text:'delete-policy 없으면 두 번째 upgrade 에서 "Job already exists" 로 실패한다.'},
        timeline:[
          {t:'del-old', label:'before-hook-creation · 이전 삭제', kind:'del', active:true},
          {t:'run',     label:'훅 Job 실행', kind:'hook', active:true},
          {t:'ok',      label:'hook-succeeded · 정리', kind:'del', active:true},
          {t:'apply',   label:'앱 업그레이드', kind:'sys', active:false},
        ],
        code:{lang:'yaml', filename:'hook-delete-policy.yaml', lines:[
          '# 재실행 가능한 마이그레이션 훅 — 정리 정책 지정',
          'apiVersion: batch/v1',
          'kind: Job',
          'metadata:',
          '  name: {{ .Release.Name }}-migrate',
          '  annotations:',
          '    "helm.sh/hook": pre-upgrade',
          '    "helm.sh/hook-weight": "0"',
          '    # 두 정책 조합:',
          '    #  - before-hook-creation: 만들기 전에 이전 Job 삭제 → 항상 재실행 가능',
          '    #  - hook-succeeded: 성공하면 지워서 클러스터 깔끔하게',
          '    #  (실패한 Job 은 남겨 로그 확인 — hook-failed 는 일부러 뺌)',
          '    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded',
          'spec:',
          '  backoffLimit: 2',
          '  activeDeadlineSeconds: 600   # 10분 넘으면 실패 처리',
          '  template:',
          '    spec:',
          '      restartPolicy: Never',
          '      containers:',
          '        - name: migrate',
          '          image: myorg/migrator:1.4.0',
          '          command: ["alembic", "upgrade", "head"]',
          '',
          '# 정책별 동작 요약:',
          '#  before-hook-creation → 생성 직전 이전 것 삭제 (기본으로 권장)',
          '#  hook-succeeded       → 성공 시 삭제',
          '#  hook-failed          → 실패 시 삭제 (디버깅하려면 빼기)',
          '#  (아무것도 없음)      → 영원히 남음 → 다음 실행 시 충돌',
        ], highlight:[6,7,8,9,10,11,12,13]},
      },
      {
        title:'Step 5. 실전 — 업그레이드 시 DB 마이그레이션',
        desc:'가장 흔한 실전 패턴은 pre-upgrade 훅으로 DB 마이그레이션을 돌리는 것이다. 새 앱 Pod 이 뜨기 전에 스키마를 먼저 바꿔야 하기 때문이다. 마이그레이션이 실패하면 훅이 실패 처리되고 upgrade 전체가 롤백되니, 깨진 스키마와 새 코드가 어긋나는 사고를 막는다. weight 로 순서를, delete-policy 로 재실행을, backoffLimit·activeDeadlineSeconds 로 무한 대기를 막는다. 아래 하나가 실무의 표준 형태다.',
        rows:[
          {name:'pre-upgrade', desc:'새 Pod 뜨기 전 스키마 변경'},
          {name:'실패 → 롤백', desc:'훅 실패 시 upgrade 중단·롤백'},
          {name:'weight', desc:'여러 마이그레이션 순서 보장'},
          {name:'delete-policy', desc:'매 배포마다 재실행 보장'},
        ],
        wins:[
          'hook = 생명주기의 정해진 시점에 실행되는 별도 리소스(보통 Job)',
          'helm.sh/hook 으로 시점 지정 — install/upgrade/delete/rollback/test',
          'hook-weight 오름차순으로 실행 순서 보장 (문자열 정수)',
          'hook-delete-policy 로 재실행·정리 — before-hook-creation 이 기본',
          'DB 마이그레이션은 pre-upgrade 훅이 표준, 실패하면 자동 롤백',
        ],
        alert:{tone:'good', text:'pre-upgrade 훅으로 마이그레이션 → 실패하면 배포 자체가 롤백되어 안전하다.'},
        timeline:[
          {t:'pre-up', label:'pre-upgrade · 마이그레이션', kind:'hook', active:true},
          {t:'ok?',    label:'성공? → 계속 / 실패 → 롤백', kind:'test', active:true},
          {t:'apply',  label:'새 Deployment 롤아웃', kind:'sys', active:false},
          {t:'post',   label:'post-upgrade · 캐시 워밍', kind:'hook', active:false},
        ],
        code:{lang:'yaml', filename:'templates/migrate-job.yaml', lines:[
          '# 실무 표준: 업그레이드 시 DB 마이그레이션 훅',
          'apiVersion: batch/v1',
          'kind: Job',
          'metadata:',
          '  name: {{ .Release.Name }}-migrate',
          '  labels:',
          '    app.kubernetes.io/managed-by: {{ .Release.Service }}',
          '  annotations:',
          '    "helm.sh/hook": pre-upgrade',
          '    "helm.sh/hook-weight": "0"',
          '    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded',
          'spec:',
          '  backoffLimit: 2',
          '  activeDeadlineSeconds: 600',
          '  template:',
          '    metadata:',
          '      name: {{ .Release.Name }}-migrate',
          '    spec:',
          '      restartPolicy: Never',
          '      containers:',
          '        - name: migrate',
          '          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"',
          '          command: ["alembic", "upgrade", "head"]',
          '          env:',
          '            - name: DATABASE_URL',
          '              valueFrom:',
          '                secretKeyRef:',
          '                  name: {{ .Release.Name }}-db',
          '                  key: url',
          '---',
          '# 배포 & 검증',
          '# $ helm upgrade my-app . --wait',
          '#   → pre-upgrade 훅(마이그레이션) 먼저 실행',
          '#   → 성공하면 새 Deployment 롤아웃',
          '#   → 실패하면 upgrade 중단, 이전 리비전 유지',
          '# $ helm test my-app        # test 훅으로 헬스체크',
        ], highlight:[7,8,9,10,11,12,13,14]},
      },
    ];

    function Rows({ rows }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>⛵ Hook 키워드</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-44 font-mono font-bold" style={{color:BRAND}}>{r.name}</span>
                <span className="flex-1 px-2 py-0.5 rounded font-mono" style={{background:BRAND_BG, color:BRAND_DARK}}>{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const KIND_STYLE = {
      sys:  {bg:'#e2e8f0', bd:'#94a3b8', tx:'#334155', icon:'📦'},
      hook: {bg:BRAND_BG,  bd:BRAND,     tx:BRAND_DARK, icon:'🪝'},
      test: {bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
      del:  {bg:'#fef3c7', bd:'#fbbf24', tx:'#92400e', icon:'🗑️'},
    };
    function HookTimeline({ timeline }) {
      if (!timeline) return null;
      return (
        <div className="mt-3 rounded-lg bg-white p-3" style={{border:`2px solid ${BRAND}`}}>
          <div className="text-xs font-bold mb-2" style={{color:BRAND_DARK}}>⏱ 실행 타임라인 (위 → 아래 순서)</div>
          <div className="space-y-1.5">
            {timeline.map((it, i) => {
              const s = KIND_STYLE[it.kind] || KIND_STYLE.sys;
              return (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-[10px] w-4 text-right font-mono" style={{color:BRAND}}>{i + 1}</span>
                  <div className="flex-1 rounded px-2 py-1 text-xs flex items-center gap-2"
                       style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx, opacity: it.active ? 1 : 0.45}}>
                    <span>{s.icon}</span>
                    <span className="font-mono">{it.label}</span>
                    {it.active && <span className="ml-auto text-[9px] px-1.5 rounded-full font-bold" style={{background:s.tx, color:'white'}}>실행</span>}
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-2 flex flex-wrap gap-2 text-[9px]" style={{color:BRAND_DARK}}>
            <span>🪝 훅</span><span>📦 리소스</span><span>🗑️ 정리</span><span>✅ 검증</span>
          </div>
        </div>
      );
    }
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="mb-3 text-sm font-bold" style={{color:BRAND_DARK}}>Lifecycle Hooks = 생명주기에 끼어드는 Job</div>
          <Rows rows={state.rows} />
          <HookTimeline timeline={state.timeline} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }
    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:BRAND_BG}}>
          <div className="text-lg font-bold mb-2" style={{color:BRAND_DARK}}>⛵ {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:BRAND_DARK}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:BRAND_BG, bd:BRAND_BD, tx:BRAND_DARK, icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); window.hljs.highlightElement(codeRef.current); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(39,122,159,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:`linear-gradient(135deg,${BRAND_BG} 0%,#cfe5ef 100%)`}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>⛵</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:BRAND_DARK}}>IV-1-2. Hooks (Lifecycle Hooks)</h1>
                <p className="text-sm" style={{color:BRAND}}>비유: 릴리스 생명주기의 정해진 시점에 끼어드는 훅</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 목차</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : BRAND_BD}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:`${BRAND}aa`}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                helm.sh/hook 으로 시점 지정 → hook-weight 로 순서 → hook-delete-policy 로 재실행. DB 마이그레이션은 pre-upgrade 훅이 표준.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["Helm","Hook","Lifecycle","preUpgrade","hookWeight","Migration"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:BRAND_BG, color:BRAND_DARK, border:`1px solid ${BRAND_BD}`}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="./IV-1-1.html" className="underline hover:no-underline">← 이전</a>
              <a href="./IV-2-1.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
