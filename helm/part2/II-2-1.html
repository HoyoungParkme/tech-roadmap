  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛵</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#277A9F';
    const BRAND_DARK = '#1f6886';
    const BRAND_BG = '#e5f0f6';
    const BRAND_BD = '#a8cee0';

    const STEPS = [
      {
        title:'Step 1. 파이프( | ) — 왼쪽 값을 오른쪽 함수로 흘려보낸다',
        desc:'Helm 템플릿은 Go template 문법이라 함수 호출이 upper(name) 처럼 안쪽부터 읽힌다. 중첩되면 읽기 어렵다. 그래서 파이프( | )로 "값을 왼쪽에서 오른쪽으로 흘려보내는" 방식을 쓴다. 유닉스 셸의 파이프와 완전히 같은 개념. 파이프에서는 왼쪽 결과가 오른쪽 함수의 마지막 인자로 들어간다. 아래 name 값이 upper 를 거쳐 대문자가 되고, 다시 quote 를 거쳐 따옴표로 감싸진다.',
        rows:[
          {name:'| (pipe)', desc:'왼쪽 값을 오른쪽 함수의 마지막 인자로'},
          {name:'upper', desc:'문자열을 대문자로'},
          {name:'quote', desc:'값을 큰따옴표로 감싼다'},
          {name:'좌→우 흐름', desc:'중첩 함수보다 읽기 쉽다'},
        ],
        pipeline:{ input:'.Values.name', value:'myApp', stages:[
          {fn:'upper', out:'MYAPP'},
          {fn:'quote', out:'"MYAPP"'},
        ]},
        alert:{tone:'info', text:'파이프는 왼쪽 결과를 오른쪽 함수의 "마지막 인자"로 넘긴다.'},
        code:{lang:'yaml', filename:'templates/configmap.yaml', lines:[
          '# values.yaml',
          '#   name: myApp',
          '',
          'apiVersion: v1',
          'kind: ConfigMap',
          'metadata:',
          '  name: {{ .Release.Name }}-config',
          'data:',
          '  # (1) 중첩 함수 — 안쪽부터 읽어야 해서 불편',
          '  app1: {{ quote (upper .Values.name) }}',
          '',
          '  # (2) 파이프 — 좌에서 우로 자연스럽게 읽힌다',
          '  app2: {{ .Values.name | upper | quote }}',
          '',
          '  # (1) 과 (2) 는 완전히 같은 결과',
          '  #   app1: "MYAPP"',
          '  #   app2: "MYAPP"',
          '',
          '  # 파이프는 마지막 인자로 넘어간다:',
          '  #   .Values.name | upper   ==   upper .Values.name',
          '  #   value | printf "%s-svc"  ==  printf "%s-svc" value',
        ], highlight:[9,10,12,13,19,20]},
      },
      {
        title:'Step 2. 자주 쓰는 함수 — default · quote · trim · trunc · printf',
        desc:'실무 차트에서 90% 는 이 몇 개 함수로 해결된다. default 는 값이 비었을 때 대체값을 준다(가장 많이 쓴다). quote 는 YAML 파싱 오류를 막는 안전장치. trim 은 앞뒤 공백 제거, trunc 는 길이 제한(라벨은 63자 제한이 있어 필수), printf 는 문자열 조립. 이 함수들을 파이프로 이어 붙이면 "값이 없으면 기본값 → 63자로 자르고 → 따옴표" 같은 처리를 한 줄로 끝낸다.',
        rows:[
          {name:'default "app"', desc:'값이 비면 "app" 으로 대체'},
          {name:'trunc 63', desc:'앞 63자만 (K8s 라벨 제한)'},
          {name:'trim', desc:'앞뒤 공백 제거'},
          {name:'printf "%s-svc"', desc:'문자열 조립·포맷'},
        ],
        pipeline:{ input:'.Values.fullName', value:'(빈 값)', stages:[
          {fn:'default "app"', out:'app'},
          {fn:'printf "%s-svc"', out:'app-svc'},
          {fn:'quote', out:'"app-svc"'},
        ]},
        alert:{tone:'good', text:'default 는 "값 없으면 이걸 써라" — 실무에서 가장 자주 쓰는 함수.'},
        code:{lang:'yaml', filename:'templates/_helpers-demo.yaml', lines:[
          '# values.yaml',
          '#   fullName: ""        # 비어 있음',
          '#   name: My-Long-Service-Name',
          '',
          'metadata:',
          '  # default — fullName 이 비었으니 "app" 사용 후 조립',
          '  name: {{ .Values.fullName | default "app" | printf "%s-svc" | quote }}',
          '  #   => "app-svc"',
          '',
          '  labels:',
          '    # trunc 63 — 쿠버네티스 라벨은 최대 63자',
          '    app: {{ .Values.name | lower | trunc 63 | trimSuffix "-" | quote }}',
          '    #   => "my-long-service-name"',
          '',
          '  annotations:',
          '    # printf 로 여러 값 조립',
          '    url: {{ printf "https://%s.%s" .Values.host .Values.domain | quote }}',
          '',
          '    # trim — 사용자 입력의 앞뒤 공백 제거',
          '    owner: {{ .Values.owner | trim | quote }}',
          '',
          '# 자주 쓰는 문자열 함수 모음:',
          '#   upper / lower / title    대소문자',
          '#   trim / trimSuffix / trimPrefix   공백·접두접미 제거',
          '#   trunc N                  N자로 자르기',
          '#   replace "a" "b"          치환',
          '#   contains "x"             포함 여부(bool)',
        ], highlight:[5,6,7,10,11,12,15,16,17]},
      },
      {
        title:'Step 3. indent · nindent · toYaml — 블록을 통째로 끼워 넣기',
        desc:'단일 문자열이 아니라 map/list 같은 "블록"을 YAML 에 끼워 넣을 때가 진짜 실전이다. toYaml 은 values 의 객체를 YAML 문자열로 바꾼다. 하지만 그대로 넣으면 들여쓰기가 안 맞아 깨진다. 그래서 nindent 12 로 "줄바꿈 + 12칸 들여쓰기" 를 붙인다. indent 와 nindent 의 차이: nindent 는 앞에 개행을 하나 더 넣어준다(대부분 nindent 를 쓴다). resources, nodeSelector, env 블록에서 매일 쓰는 패턴.',
        rows:[
          {name:'toYaml', desc:'map/list 를 YAML 문자열로'},
          {name:'nindent 12', desc:'개행 + 12칸 들여쓰기'},
          {name:'indent 12', desc:'개행 없이 12칸만'},
          {name:'실무 조합', desc:'toYaml . | nindent N'},
        ],
        pipeline:{ input:'.Values.resources', value:'{requests:{cpu,memory}}', stages:[
          {fn:'toYaml', out:'requests:\\n  cpu: 250m ...'},
          {fn:'nindent 12', out:'(개행+12칸 정렬된 블록)'},
        ]},
        alert:{tone:'info', text:'객체 블록 삽입의 정석: toYaml . | nindent (들여쓸 칸수).'},
        code:{lang:'yaml', filename:'templates/deployment.yaml', lines:[
          '# values.yaml',
          '#   resources:',
          '#     requests: { cpu: 250m, memory: 512Mi }',
          '#     limits:   { cpu: 1,    memory: 1Gi }',
          '',
          'spec:',
          '  template:',
          '    spec:',
          '      containers:',
          '        - name: app',
          '          image: {{ .Values.image.repo }}:{{ .Values.image.tag }}',
          '',
          '          # (핵심) resources 맵을 통째로 삽입',
          '          # toYaml -> YAML 문자열, nindent 12 -> 개행+12칸 정렬',
          '          resources:',
          '            {{- toYaml .Values.resources | nindent 12 }}',
          '',
          '          # env 리스트도 같은 패턴',
          '          env:',
          '            {{- toYaml .Values.env | nindent 12 }}',
          '',
          '# 렌더 결과 (helm template 로 확인):',
          '#   resources:',
          '#     requests:',
          '#       cpu: 250m',
          '#       memory: 512Mi',
          '#     limits:',
          '#       cpu: 1',
          '#       memory: 1Gi',
          '',
          '# nindent 대신 indent 를 쓰면 개행이 없어 첫 줄이 붙는다',
          '#   {{- 앞의 - 는 왼쪽 공백/개행 제거(공백 제어) }}',
        ], highlight:[12,13,14,15,17,18,19]},
      },
      {
        title:'Step 4. Sprig 라이브러리 — b64enc · list · dict · sprig 함수',
        desc:'Helm 이 제공하는 함수 대부분은 Sprig 라는 오픈소스 라이브러리에서 온다(문자열·수학·리스트·딕셔너리·암호·날짜 100+ 개). Secret 값을 넣을 때 b64enc 로 base64 인코딩하는 게 대표적. list 와 dict 로 템플릿 안에서 임시 배열·맵을 만들 수 있고, get / hasKey / keys 로 다룬다. 단, Helm 은 Sprig 중 env·expandenv 같은 위험 함수는 보안상 막아 둔다.',
        rows:[
          {name:'b64enc', desc:'Secret 값 base64 인코딩'},
          {name:'list a b c', desc:'임시 배열 생성'},
          {name:'dict "k" v', desc:'임시 맵 생성'},
          {name:'randAlphaNum', desc:'랜덤 문자열(비번 생성 등)'},
        ],
        pipeline:{ input:'.Values.password', value:'s3cr3t', stages:[
          {fn:'b64enc', out:'czNjcjN0'},
          {fn:'quote', out:'"czNjcjN0"'},
        ]},
        alert:{tone:'good', text:'Sprig = Helm 함수의 표준 라이브러리. 문자열·리스트·dict·암호까지.'},
        code:{lang:'yaml', filename:'templates/secret.yaml', lines:[
          '# values.yaml',
          '#   password: s3cr3t',
          '',
          'apiVersion: v1',
          'kind: Secret',
          'metadata:',
          '  name: {{ .Release.Name }}-secret',
          'type: Opaque',
          'data:',
          '  # Secret 은 base64 인코딩된 값이 필요 -> b64enc',
          '  password: {{ .Values.password | b64enc | quote }}',
          '  #   => "czNjcjN0"',
          '',
          '  # 값이 없으면 랜덤 비번 생성 후 인코딩',
          '  token: {{ .Values.token | default (randAlphaNum 16) | b64enc | quote }}',
          '---',
          '# list / dict — 템플릿 안에서 임시 자료구조',
          '# {{ $ports := list 80 443 8080 }}',
          '# {{ range $ports }} - {{ . }} {{ end }}',
          '',
          '# {{ $labels := dict "app" "web" "tier" "front" }}',
          '# {{ $labels | toYaml | nindent 4 }}',
          '#   hasKey $labels "app"  -> true',
          '#   keys $labels          -> [app tier]',
          '#   get $labels "app"     -> web',
          '',
          '# 자주 쓰는 Sprig 함수:',
          '#   sha256sum / b64enc / b64dec   해시·인코딩',
          '#   list / first / last / uniq    리스트',
          '#   dict / get / hasKey / merge   딕셔너리',
          '#   now / date / add / mul        날짜·수학',
        ], highlight:[9,10,11,13,14,16,17,18,20,21,22,23,24]},
      },
      {
        title:'Step 5. include · template · required — 재사용과 필수값 강제',
        desc:'_helpers.tpl 에 define 으로 만든 조각을 불러올 때 template 과 include 두 가지가 있다. 핵심 차이: template 은 출력만 하고 파이프에 못 넘긴다. include 는 결과를 문자열로 반환해서 nindent 같은 파이프와 조합된다 — 그래서 실무는 거의 include 를 쓴다. required 는 필수값을 강제한다: 값이 비면 렌더를 실패시켜 에러 메시지를 띄운다(설정 실수를 배포 전에 잡는다).',
        rows:[
          {name:'define / include', desc:'조각 정의 후 파이프로 삽입'},
          {name:'template', desc:'출력만 — 파이프 불가'},
          {name:'include ... | nindent', desc:'include 는 파이프 조합 가능'},
          {name:'required "msg" v', desc:'값 없으면 렌더 실패'},
        ],
        wins:[
          '파이프( | )는 값을 왼쪽에서 오른쪽 함수로 흘려보낸다',
          'default 로 빈 값 대체, quote 로 YAML 안전, trunc 로 길이 제한',
          '객체 블록은 toYaml . | nindent N 로 삽입한다',
          'Secret 값은 b64enc, Sprig 로 list·dict·랜덤까지',
          'include 는 파이프 조합 가능(template 은 불가) — 실무는 include',
          'required 로 필수값을 강제해 배포 전에 실수를 잡는다',
        ],
        pipeline:{ input:'include "app.labels"', value:'app.labels 조각', stages:[
          {fn:'(문자열 반환)', out:'app: web\\ntier: front'},
          {fn:'nindent 4', out:'(4칸 정렬 블록)'},
        ]},
        alert:{tone:'good', text:'include 는 파이프에 넘길 수 있어 template 보다 실무에서 압도적으로 많이 쓴다.'},
        code:{lang:'yaml', filename:'templates/_helpers.tpl', lines:[
          '# === _helpers.tpl — 재사용 조각 정의 ===',
          '{{- define "app.labels" -}}',
          'app.kubernetes.io/name: {{ .Chart.Name }}',
          'app.kubernetes.io/instance: {{ .Release.Name }}',
          '{{- end -}}',
          '',
          '# === deployment.yaml — 조각 불러오기 ===',
          'metadata:',
          '  labels:',
          '    # include -> 문자열 반환 -> nindent 로 정렬(권장)',
          '    {{- include "app.labels" . | nindent 4 }}',
          '',
          '    # template 은 출력만 -> 파이프에 못 넘긴다(들여쓰기 제어 불가)',
          '    # {{ template "app.labels" . }}   <-- nindent 조합 불가',
          '',
          'spec:',
          '  # === required — 필수값 강제 ===',
          '  # image.repo 가 비어 있으면 렌더 자체를 실패시킨다',
          '  image: {{ required "image.repo 는 필수입니다" .Values.image.repo }}',
          '',
          '# helm template 실행 시 값이 없으면:',
          '#   Error: execution error at (my-app/templates/deployment.yaml):',
          '#          image.repo 는 필수입니다',
          '',
          '# include vs template 요약:',
          '#   template : 출력만, 파이프 X, 반환값 없음',
          '#   include  : 문자열 반환, 파이프 O  ->  실무 표준',
        ], highlight:[1,2,3,4,5,9,10,11,12,13,16,17,18]},
      },
    ];

    function Rows({ rows }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>⛵ 함수 · 파이프라인 키워드</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-44 font-mono font-bold" style={{color:BRAND}}>{r.name}</span>
                <span className="flex-1 px-2 py-0.5 rounded font-mono" style={{background:BRAND_BG, color:BRAND_DARK}}>{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PipelineChain({ pipeline }) {
      if (!pipeline) return null;
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND_DARK}}>파이프 흐름 시뮬레이션 (좌 &rarr; 우)</div>
          <div className="p-3">
            {/* 입력 값 */}
            <div className="flex items-center gap-2 flex-wrap">
              <div className="px-2 py-1 rounded text-xs font-mono font-bold text-white" style={{background:BRAND}}>{pipeline.input}</div>
              <span className="text-xs font-mono" style={{color:BRAND_DARK}}>= {pipeline.value}</span>
            </div>
            {/* 단계별 체인 */}
            <div className="mt-2 space-y-2">
              {pipeline.stages.map((s, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-lg" style={{color:BRAND}}>&darr;</span>
                  <span className="px-2 py-0.5 rounded text-xs font-mono font-bold text-white" style={{background:BRAND}}>| {s.fn}</span>
                  <span className="text-sm" style={{color:BRAND}}>&rarr;</span>
                  <span className="flex-1 px-2 py-0.5 rounded text-xs font-mono" style={{background:BRAND_BG, color:BRAND_DARK, border:`1px solid ${BRAND_BD}`}}>{s.out}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:BRAND_BG}}>
          <div className="text-lg font-bold mb-2" style={{color:BRAND_DARK}}>⛵ {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:BRAND_DARK}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:BRAND_BG, bd:BRAND_BD, tx:BRAND_DARK, icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="mb-3 text-sm font-bold" style={{color:BRAND_DARK}}>파이프라인 = 값을 함수 체인으로 변환</div>
          <PipelineChain pipeline={state.pipeline} />
          <div className="mt-3"><Rows rows={state.rows} /></div>
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); window.hljs.highlightElement(codeRef.current); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(39,122,159,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:`linear-gradient(135deg,${BRAND_BG} 0%,#cfe5ef 100%)`}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>⛵</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:BRAND_DARK}}>II-2-1. 함수 · 파이프라인</h1>
                <p className="text-sm" style={{color:BRAND}}>비유: 값을 함수 컨베이어벨트에 태워 왼쪽에서 오른쪽으로 변환</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 목차</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : BRAND_BD}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:`${BRAND}aa`}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                파이프( | )로 값을 함수 체인에 흘려보낸다. default·quote·trunc 로 값 다듬기, toYaml | nindent 로 블록 삽입, b64enc·Sprig 로 확장, include·required 로 재사용·필수값 강제.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["Helm","Template","Pipeline","Sprig","toYaml","include"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:BRAND_BG, color:BRAND_DARK, border:`1px solid ${BRAND_BD}`}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="./II-1-2.html" className="underline hover:no-underline">← 이전</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
