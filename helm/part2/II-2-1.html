  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }

  <script>window.LESSON = {"topic": "helm", "topicName": "Helm", "topicHref": "../index.html", "id": "II-2-1", "title": "함수 · 파이프라인", "sub": "비유: 값을 함수 컨베이어벨트에 태워 왼쪽에서 오른쪽으로 변환", "path": "part2/II-2-1.html", "prev": {"id": "II-1-2", "title": "내장 객체 (.Values / .Release)", "href": "../part2/II-1-2.html"}, "next": {"id": "II-2-2", "title": "흐름 제어 (if / range / with)", "href": "../part2/II-2-2.html"}, "wrap": "파이프(|)로 값을 함수 체인에 흘려보낸다. default·quote·trunc로 값 다듬기, toYaml | nindent로 블록 삽입, b64enc·Sprig로 확장, include·required로 재사용·필수값 강제."};</script>

<body>
  <div id="root" data-trn-native-beats="1"></div>
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#277A9F';
    const BRAND_DARK = '#1f6886';
    const BRAND_BG = '#e5f0f6';
    const BRAND_BD = '#a8cee0';

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"yaml", filename:"templates/configmap.yaml", lines:[
        "# values.yaml",
        "#   name: myApp",
        "",
        "apiVersion: v1",
        "kind: ConfigMap",
        "metadata:",
        "  name: {{ .Release.Name }}-config",
        "data:",
        "  # (1) 중첩 함수 — 안쪽부터 읽어야 해서 불편",
        "  app1: {{ quote (upper .Values.name) }}",
        "",
        "  # (2) 파이프 — 좌에서 우로 자연스럽게 읽힌다",
        "  app2: {{ .Values.name | upper | quote }}",
        "",
        "  # (1) 과 (2) 는 완전히 같은 결과",
        "  #   app1: \"MYAPP\"",
        "  #   app2: \"MYAPP\"",
        "",
        "  # 파이프는 마지막 인자로 넘어간다:",
        "  #   .Values.name | upper   ==   upper .Values.name",
        "  #   value | printf \"%s-svc\"  ==  printf \"%s-svc\" value",
      ]},
      s2: {lang:"yaml", filename:"templates/_helpers-demo.yaml", lines:[
        "# values.yaml",
        "#   fullName: \"\"        # 비어 있음",
        "#   name: My-Long-Service-Name",
        "",
        "metadata:",
        "  # default — fullName 이 비었으니 \"app\" 사용 후 조립",
        "  name: {{ .Values.fullName | default \"app\" | printf \"%s-svc\" | quote }}",
        "  #   => \"app-svc\"",
        "",
        "  labels:",
        "    # trunc 63 — 쿠버네티스 라벨은 최대 63자",
        "    app: {{ .Values.name | lower | trunc 63 | trimSuffix \"-\" | quote }}",
        "    #   => \"my-long-service-name\"",
        "",
        "  annotations:",
        "    # printf 로 여러 값 조립",
        "    url: {{ printf \"https://%s.%s\" .Values.host .Values.domain | quote }}",
        "",
        "    # trim — 사용자 입력의 앞뒤 공백 제거",
        "    owner: {{ .Values.owner | trim | quote }}",
        "",
        "# 자주 쓰는 문자열 함수 모음:",
        "#   upper / lower / title    대소문자",
        "#   trim / trimSuffix / trimPrefix   공백·접두접미 제거",
        "#   trunc N                  N자로 자르기",
        "#   replace \"a\" \"b\"          치환",
        "#   contains \"x\"             포함 여부(bool)",
      ]},
      s3: {lang:"yaml", filename:"templates/deployment.yaml", lines:[
        "# values.yaml",
        "#   resources:",
        "#     requests: { cpu: 250m, memory: 512Mi }",
        "#     limits:   { cpu: 1,    memory: 1Gi }",
        "",
        "spec:",
        "  template:",
        "    spec:",
        "      containers:",
        "        - name: app",
        "          image: {{ .Values.image.repo }}:{{ .Values.image.tag }}",
        "",
        "          # (핵심) resources 맵을 통째로 삽입",
        "          # toYaml -> YAML 문자열, nindent 12 -> 개행+12칸 정렬",
        "          resources:",
        "            {{- toYaml .Values.resources | nindent 12 }}",
        "",
        "          # env 리스트도 같은 패턴",
        "          env:",
        "            {{- toYaml .Values.env | nindent 12 }}",
        "",
        "# 렌더 결과 (helm template 로 확인):",
        "#   resources:            (toYaml 은 키를 알파벳순으로)",
        "#     limits:",
        "#       cpu: 1",
        "#       memory: 1Gi",
        "#     requests:",
        "#       cpu: 250m",
        "#       memory: 512Mi",

          {"name":"helm template","desc":"배포 전에 렌더만 해 본다"},
          {"name":"에러 위치","desc":"파일 경로와 함께 표시"},
          {"name":"에러 문구","desc":"required에 적은 메시지 그대로"},
          {"name":"효과","desc":"설정 실수를 배포 전에 잡는다"},
        ],
        alert:{"tone":"danger","text":"required가 걸리면 install·upgrade가 시작되지 않는다."},
        code:{...CODE.s5, highlight:[21,22,23]},
      },
      { ...S5,
        beat:{
          label:"include vs template 정리",
          at:"templates/_helpers.tpl L25–27",
          caption:"template은 출력 전용, include는 문자열 반환. 파이프가 필요한 실무에서는 include가 표준이다.",
          changes:[{mark:"read", text:"두 방식 차이 요약"}, {mark:"changed", text:"실무 표준은 include"}],
        },
        wins:[
          "파이프( | )는 값을 왼쪽에서 오른쪽 함수로 흘려보낸다",
          "default로 빈 값 대체, quote로 YAML 안전, trunc로 길이 제한",
          "객체 블록은 toYaml . | nindent N으로 삽입한다",
          "Secret 값은 b64enc, Sprig로 list·dict·랜덤까지",
          "include는 파이프 조합 가능(template은 불가) — 실무는 include",
          "required로 필수값을 강제해 배포 전에 실수를 잡는다",
        ],
        pipeline:{input:"include \"app.labels\"", value:"app.labels 조각", stages:[
          {"fn":"(문자열 반환)","out":"app: web\\ntier: front"},
          {"fn":"nindent 4","out":"(4칸 정렬 블록)"},
        ]},
        rows:[
          {"name":"define / include","desc":"조각 정의 후 파이프로 삽입"},
          {"name":"template","desc":"출력만 — 파이프 불가"},
          {"name":"include ... | nindent","desc":"include는 파이프 조합 가능"},
          {"name":"required \"msg\" v","desc":"값 없으면 렌더 실패"},
        ],
        alert:{"tone":"good","text":"include는 파이프에 넘길 수 있어 template보다 실무에서 압도적으로 많이 쓴다."},
        code:{...CODE.s5, highlight:[25,26,27]},

    // 표·정리 보기: 예전 왼쪽 패널의 함수 표와 마지막 정리 목록
    function RefPanel({ step, stepIdx }) {
      const g = raGroupOf(stepIdx).g;
      if (g === 0) return (<div>
        <h4>같은 변환, 두 가지 쓰기</h4>
        <table><thead><tr><th>모양</th><th>읽는 순서</th><th>결과</th></tr></thead><tbody>
          <tr><td><code>quote (upper .Values.name)</code></td><td>괄호 안쪽 upper가 먼저, 바깥 quote가 나중</td><td><code>"MYAPP"</code></td></tr>
          <tr><td><code>.Values.name | upper | quote</code></td><td>왼쪽에서 오른쪽으로</td><td><code>"MYAPP"</code></td></tr>
        </tbody></table>
        <p>파이프로 넘어온 값은 오른쪽 함수의 마지막 인자가 된다. <code>x | printf "%s-svc"</code>는 <code>printf "%s-svc" x</code>와 같다.</p>
      </div>);
      if (g === 1) return (<div>
        <h4>자주 쓰는 함수</h4>
        <table><thead><tr><th>함수</th><th>하는 일</th><th>이 장의 예</th></tr></thead><tbody>
          <tr><td><code>default "app"</code></td><td>값이 비었을 때 대신 넣는다</td><td><code>"" → app</code></td></tr>
          <tr><td><code>quote</code></td><td>큰따옴표로 감싸 문자열로 둔다</td><td><code>app-svc → "app-svc"</code></td></tr>
          <tr><td><code>trim</code></td><td>앞뒤 공백을 지운다</td><td><code>"  devops  " → devops</code></td></tr>
          <tr><td><code>trunc 63</code></td><td>앞 63자만 남긴다 (음수면 뒤에서 센다)</td><td>라벨 값 길이 제한</td></tr>
          <tr><td><code>trimSuffix "-"</code></td><td>끝의 -를 뗀다</td><td>자른 끝이 -면 라벨로 못 쓴다</td></tr>
          <tr><td><code>printf "%s-svc"</code></td><td>자리표시자에 값을 채운다</td><td><code>app → app-svc</code></td></tr>
        </tbody></table>
        <p>Helm 문서는 고정된 기본값은 values.yaml에 두고, default는 계산해서 얻는 값에 쓰라고 권한다.</p>
      </div>);
      if (g === 2) return (<div>
        <h4>블록을 끼워 넣는 함수</h4>
        <table><thead><tr><th>함수</th><th>하는 일</th></tr></thead><tbody>
          <tr><td><code>toYaml</code></td><td>맵·리스트를 YAML 글로 바꾼다. 키는 알파벳순, 끝 줄바꿈은 뗀다</td></tr>
          <tr><td><code>indent 12</code></td><td>모든 줄 앞에 12칸을 붙인다</td></tr>
          <tr><td><code>nindent 12</code></td><td>indent와 같고 맨 앞에 줄바꿈을 하나 더 넣는다</td></tr>
        </tbody></table>
        <p>칸수는 그 블록이 들어갈 키의 들여쓰기에 2를 더한다. <code>resources:</code>가 10칸이면 <code>nindent 12</code>. 같은 패턴을 nodeSelector, tolerations, env에도 쓴다.</p>
      </div>);
      if (g === 3) return (<div>
        <h4>Sprig 함수 묶음</h4>
        <table><thead><tr><th>분류</th><th>예</th></tr></thead><tbody>
          <tr><td>해시·인코딩</td><td><code>sha256sum</code> <code>b64enc</code> <code>b64dec</code></td></tr>
          <tr><td>리스트</td><td><code>list</code> <code>first</code> <code>last</code> <code>uniq</code></td></tr>
          <tr><td>딕셔너리</td><td><code>dict</code> <code>get</code> <code>hasKey</code> <code>keys</code> <code>merge</code></td></tr>
          <tr><td>날짜·수학</td><td><code>now</code> <code>date</code> <code>add</code> <code>mul</code></td></tr>
          <tr><td>무작위</td><td><code>randAlphaNum 16</code>: 0-9a-zA-Z 16자</td></tr>
        </tbody></table>
        <ul><li>base64는 인코딩일 뿐 암호화가 아니다. <code>b64dec</code>이면 바로 평문이 나온다.</li>
          <li>Helm은 렌더 결과가 실행 머신의 환경에 따라 달라지지 않도록 Sprig의 <code>env</code>·<code>expandenv</code>를 뺐다. 환경 값은 <code>--set</code>이나 <code>-f</code>로 넘긴다.</li>
          <li><code>keys</code>가 돌려주는 순서는 정해져 있지 않다. 순서가 필요하면 <code>sortAlpha</code>를 붙인다.</li></ul>
      </div>);
      if (g === 4) return (<div>
        <h4>include와 template</h4>
        <table><thead><tr><th></th><th>include</th><th>template</th></tr></thead><tbody>
          <tr><td>결과</td><td>문자열로 돌려준다</td><td>그 자리에 바로 찍는다</td></tr>
          <tr><td>파이프(nindent 등)</td><td>된다</td><td>안 된다</td></tr>
          <tr><td>들여쓰기 맞추기</td><td>nindent로 맞춘다</td><td>둘째 줄부터 맞출 수 없다</td></tr>
        </tbody></table>
        <ul><li>템플릿 이름은 차트 전체(하위 차트 포함)에서 하나의 이름 공간을 쓴다. 그래서 <code>mychart.labels</code>처럼 차트 이름을 앞에 붙이는 관례가 있다.</li>
          <li>이름이 _로 시작하는 파일(_helpers.tpl)은 매니페스트로 렌더되지 않는다.</li>
          <li>default는 빈 값을 대신 채우고, required는 빈 값이면 렌더를 멈춘다.</li></ul>
        <h4>이 장에서 쓴 것</h4>
        <ul>{(STEPS[STEPS.length - 1].wins || []).map((w, i) => <li key={i}>{w}</li>)}</ul>
      </div>);
      return null;
    }


    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n')); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(39,122,159,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
