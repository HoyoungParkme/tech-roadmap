<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helm 학습 — II-1-1. Go 템플릿 문법</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛵</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#277A9F';
    const BRAND_DARK = '#1f6886';
    const BRAND_BG = '#e5f0f6';
    const BRAND_BD = '#a8cee0';

    const STEPS = [
      {
        title:'Step 1. 액션 구분자 — 이중 중괄호 안이 코드다',
        desc:'Helm 은 Go 언어의 text/template 엔진을 그대로 쓴다. 규칙은 하나 — 이중 중괄호(액션 구분자)로 감싼 부분만 "코드" 로 실행되고, 나머지는 글자 그대로 출력된다. 점(.) 은 현재 데이터의 루트다. 값 삽입은 점 뒤에 경로를 이어 붙여 쓴다. 예를 들어 이미지 이름 자리에 values.yaml 의 image.repository 값을 꽂아 넣는다.',
        rows:[
          {name:'action', desc:'이중 중괄호 안 — 실행되는 코드'},
          {name:'. (dot)', desc:'현재 스코프의 루트 데이터'},
          {name:'.Values', desc:'values.yaml 에서 온 사용자 값'},
          {name:'.Release / .Chart', desc:'Helm 이 주입하는 내장 객체'},
        ],
        transform:{
          srcTitle:'template (deployment.yaml)',
          outTitle:'rendered manifest',
          src:[
            'image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"',
            'replicas: {{ .Values.replicaCount }}',
            'name: {{ .Release.Name }}-web',
          ],
          out:[
            'image: "nginx:1.27"',
            'replicas: 3',
            'name: my-app-web',
          ],
        },
        alert:{tone:'info', text:'이중 중괄호 밖은 그대로, 안은 실행. 점(.)은 데이터의 뿌리.'},
        code:{lang:'yaml', filename:'templates/deployment.yaml', lines:[
          '# 이중 중괄호 안만 코드로 실행되고 나머지는 그대로 출력',
          '# 점(.)은 렌더링 시점의 최상위 데이터 객체를 가리킨다',
          'apiVersion: apps/v1',
          'kind: Deployment',
          'metadata:',
          '  # .Release.Name — helm install 시 준 릴리스 이름 (내장 객체)',
          '  name: {{ .Release.Name }}-web',
          'spec:',
          '  # .Values.* — 사용자의 values.yaml 에서 온 값',
          '  replicas: {{ .Values.replicaCount }}',
          '  template:',
          '    spec:',
          '      containers:',
          '        - name: web',
          '          # 문자열 안에서도 액션은 실행된다',
          '          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"',
          '',
          '# --- 참고: 함께 렌더링되는 values.yaml ---',
          '# replicaCount: 3',
          '# image:',
          '#   repository: nginx',
          '#   tag: "1.27"',
        ], highlight:[7,10,16]},
      },
      {
        title:'Step 2. 공백 제어 — 대시로 빈 줄·들여쓰기 정리',
        desc:'액션이 있던 자리에는 렌더 후 빈 줄과 공백이 남는다. YAML 은 들여쓰기에 민감해서 이 잔여 공백이 매니페스트를 깨뜨릴 수 있다. 여는 구분자에 대시를 붙이면 왼쪽 공백/개행을, 닫는 구분자에 대시를 붙이면 오른쪽 공백/개행을 먹어 치운다. if 블록을 쓸 때 특히 필수다 — 대시가 없으면 조건이 false 여도 빈 줄이 남는다.',
        rows:[
          {name:'여는 대시', desc:'액션 앞의 공백·개행 제거'},
          {name:'닫는 대시', desc:'액션 뒤의 공백·개행 제거'},
          {name:'왜 필요?', desc:'YAML 은 들여쓰기·빈 줄에 민감'},
          {name:'주의', desc:'대시와 액션 내용 사이 공백 1칸 필수'},
        ],
        transform:{
          srcTitle:'template (대시 있음 vs 없음)',
          outTitle:'rendered',
          src:[
            '# 대시 없음 → 빈 줄이 남는다',
            'a: 1',
            '{{ if false }}b: 2{{ end }}',
            'c: 3',
            '# 대시 있음 → 깔끔',
            'x: 1',
            '{{- if false }}',
            'y: 2',
            '{{- end }}',
            'z: 3',
          ],
          out:[
            'a: 1',
            '',
            'c: 3',
            '',
            'x: 1',
            'z: 3',
          ],
        },
        alert:{tone:'good', text:'조건/반복 블록에는 대시를 습관처럼. 빈 줄과 들여쓰기 사고를 막는다.'},
        code:{lang:'yaml', filename:'templates/whitespace.yaml', lines:[
          '# 여는 대시: 왼쪽 공백/개행 제거, 닫는 대시: 오른쪽 제거',
          '# 대시와 내용 사이에는 반드시 공백 한 칸이 있어야 한다',
          'metadata:',
          '  labels:',
          '    # 대시 없이 if 를 쓰면 조건이 거짓이어도 빈 줄이 남는다',
          '    app: web',
          '    {{- if .Values.env }}',
          '    env: {{ .Values.env }}',
          '    {{- end }}',
          '',
          '# 잘못된 예 (대시 없음) — 렌더 후 빈 줄이 남아 지저분',
          '#     app: web',
          '#     {{ if .Values.env }}',
          '#     env: prod',
          '#     {{ end }}',
          '# 결과:',
          '#     app: web',
          '#',
          '#     env: prod',
          '#',
          '',
          '# 올바른 예 (대시 사용) — 결과:',
          '#     app: web',
          '#     env: prod',
        ], highlight:[7,8,9]},
      },
      {
        title:'Step 3. 주석과 기본 함수 — quote, default',
        desc:'템플릿 주석은 별표 슬래시 구분자로 감싼다. 이 주석은 렌더 결과에 전혀 남지 않아서 민감한 설명을 적어도 안전하다. 값 뒤에 파이프로 함수를 연결하면 값을 가공한다. quote 는 값을 따옴표로 감싸 문자열임을 확실히 하고, default 는 값이 비어 있을 때 대체값을 넣는다. 파이프는 왼쪽 결과를 오른쪽 함수의 마지막 인자로 넘긴다 — 유닉스 파이프와 같다.',
        rows:[
          {name:'별표 주석', desc:'렌더 결과에 남지 않는 주석'},
          {name:'quote', desc:'값을 따옴표로 감싸 문자열화'},
          {name:'default', desc:'빈 값일 때 대체값 제공'},
          {name:'파이프', desc:'왼쪽 결과를 오른쪽 함수 인자로'},
        ],
        transform:{
          srcTitle:'template (함수 적용)',
          outTitle:'rendered',
          src:[
            '# tag 가 없으면 latest, 있으면 그 값',
            'tag: {{ .Values.image.tag | default "latest" }}',
            '# 숫자처럼 보여도 문자열로 강제',
            'port: {{ .Values.port | quote }}',
            'name: {{ .Values.name | default "web" | quote }}',
          ],
          out:[
            '',
            'tag: latest',
            '',
            'port: "8080"',
            'name: "web"',
          ],
        },
        alert:{tone:'info', text:'default 로 안전한 기본값, quote 로 YAML 타입 사고 방지. 둘 다 실무 단골.'},
        code:{lang:'yaml', filename:'templates/functions.yaml', lines:[
          '{{/*',
          '  이 주석은 렌더 결과에 남지 않는다 (별표 슬래시 구분자).',
          '  민감한 설명이나 TODO 를 적어도 매니페스트에 노출되지 않는다.',
          '*/}}',
          'apiVersion: apps/v1',
          'kind: Deployment',
          'spec:',
          '  template:',
          '    spec:',
          '      containers:',
          '        - name: web',
          '          # default: tag 값이 비어 있으면 latest 사용',
          '          image: "nginx:{{ .Values.image.tag | default "latest" }}"',
          '          ports:',
          '            # quote: 8080 을 "8080" 문자열로 (YAML 타입 사고 방지)',
          '            - containerPort: {{ .Values.port | default 80 }}',
          '          env:',
          '            - name: APP_NAME',
          '              # 파이프 체인: default 로 채우고 quote 로 감싼다',
          '              value: {{ .Values.appName | default "web" | quote }}',
        ], highlight:[1,2,3,4,13,16,20]},
      },
      {
        title:'Step 4. 변수 — 콜론이퀄로 이름 붙이기',
        desc:'긴 경로를 매번 반복하면 읽기 힘들고 실수도 난다. 달러 기호로 시작하는 변수에 값을 담아 두면 짧게 재사용할 수 있다. 선언은 콜론이퀄, 이후 재사용은 이퀄이다. 변수는 range 반복 안에서 특히 유용하다 — 반복 안에서는 점(.)이 각 항목으로 바뀌어서, 바깥의 루트 데이터가 필요하면 미리 변수에 담아 둬야 한다. 이게 초보자가 가장 많이 겪는 함정이다.',
        rows:[
          {name:'$x := 값', desc:'변수 선언 (콜론이퀄)'},
          {name:'$x = 값', desc:'기존 변수에 재할당'},
          {name:'$', desc:'항상 최상위 루트 (range 안에서도)'},
          {name:'range 함정', desc:'반복 안 점(.)은 항목으로 바뀜'},
        ],
        transform:{
          srcTitle:'template (변수 + range)',
          outTitle:'rendered',
          src:[
            '{{- $name := .Release.Name }}',
            '{{- range .Values.ports }}',
            '- name: {{ $name }}-{{ . }}',
            '  port: {{ . }}',
            '{{- end }}',
          ],
          out:[
            '',
            '',
            '- name: my-app-80',
            '  port: 80',
            '- name: my-app-443',
            '  port: 443',
          ],
        },
        alert:{tone:'good', text:'range 밖의 값이 필요하면 미리 변수에 담아라. 점(.)은 반복 안에서 바뀐다.'},
        code:{lang:'yaml', filename:'templates/variables.yaml', lines:[
          '# 변수 선언은 콜론이퀄, 재할당은 이퀄',
          '# $ 는 range 안에서도 항상 최상위 루트를 가리킨다',
          '{{- $fullName := printf "%s-web" .Release.Name }}',
          '{{- $replicas := .Values.replicaCount | default 1 }}',
          'apiVersion: apps/v1',
          'kind: Deployment',
          'metadata:',
          '  name: {{ $fullName }}',
          'spec:',
          '  replicas: {{ $replicas }}',
          '  template:',
          '    spec:',
          '      containers:',
          '        # range 안에서 . 는 각 포트로 바뀐다',
          '        # 바깥 이름이 필요해서 미리 $fullName 에 담아 둠',
          '        {{- range .Values.ports }}',
          '        - name: {{ $fullName }}-{{ . }}',
          '          containerPort: {{ . }}',
          '        {{- end }}',
        ], highlight:[3,4,8,10,16,17,18,19]},
      },
      {
        title:'Step 5. 전체 흐름 — 템플릿에서 매니페스트로',
        desc:'지금까지 배운 조각을 하나로 모으면 실무 deployment.yaml 템플릿이 된다. Helm 은 values.yaml 과 내장 객체를 데이터로 넣고, 템플릿을 렌더링해 순수 쿠버네티스 매니페스트를 만든다. helm template 명령으로 클러스터에 적용하기 전에 결과를 미리 확인할 수 있다. 값 삽입, 공백 제어, default/quote, 변수 — 네 가지만 알면 대부분의 차트를 읽고 쓸 수 있다.',
        rows:[
          {name:'입력', desc:'template + values.yaml + 내장 객체'},
          {name:'엔진', desc:'Go text/template + Helm 함수'},
          {name:'출력', desc:'순수 쿠버네티스 매니페스트'},
          {name:'미리보기', desc:'helm template 로 렌더 결과 확인'},
        ],
        wins:[
          '이중 중괄호 안만 실행, 점(.)은 데이터 루트',
          '.Values 는 사용자 값, .Release/.Chart 는 내장 객체',
          '대시로 공백 제어 — YAML 들여쓰기 사고 방지',
          '별표 슬래시 주석은 렌더에 안 남는다',
          'default 로 기본값, quote 로 문자열 강제',
          '$ 변수로 재사용, range 밖 값은 미리 담아두기',
        ],
        transform:{
          srcTitle:'template',
          outTitle:'helm template 결과',
          src:[
            'metadata:',
            '  name: {{ .Release.Name }}-web',
            'spec:',
            '  replicas: {{ .Values.replicaCount | default 1 }}',
            '  image: {{ .Values.image | quote }}',
          ],
          out:[
            'metadata:',
            '  name: my-app-web',
            'spec:',
            '  replicas: 3',
            '  image: "nginx:1.27"',
          ],
        },
        alert:{tone:'good', text:'네 가지 문법이면 실무 차트의 대부분을 읽고 쓸 수 있다.'},
        code:{lang:'yaml', filename:'templates/deployment.yaml (완성)', lines:[
          '{{/* 웹 앱 Deployment — 값 삽입/공백제어/함수/변수 총정리 */}}',
          '{{- $fullName := printf "%s-web" .Release.Name }}',
          'apiVersion: apps/v1',
          'kind: Deployment',
          'metadata:',
          '  name: {{ $fullName }}',
          '  labels:',
          '    app: {{ .Chart.Name }}',
          'spec:',
          '  replicas: {{ .Values.replicaCount | default 1 }}',
          '  selector:',
          '    matchLabels:',
          '      app: {{ $fullName }}',
          '  template:',
          '    metadata:',
          '      labels:',
          '        app: {{ $fullName }}',
          '    spec:',
          '      containers:',
          '        - name: web',
          '          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}"',
          '          ports:',
          '            {{- range .Values.ports }}',
          '            - containerPort: {{ . }}',
          '            {{- end }}',
          '',
          '# $ helm template my-app ./chart 로 위 결과를 미리 확인할 수 있다',
        ], highlight:[1,2,6,10,20,22,23,24]},
      },
    ];

    function Rows({ rows }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>⛵ Go 템플릿 키워드</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-40 font-mono font-bold" style={{color:BRAND}}>{r.name}</span>
                <span className="flex-1 px-2 py-0.5 rounded font-mono" style={{background:BRAND_BG, color:BRAND_DARK}}>{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function TransformPane({ t }) {
      if (!t) return null;
      return (
        <div className="mt-3 rounded-lg overflow-hidden" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND_DARK}}>템플릿 → 렌더 변환</div>
          <div className="grid grid-cols-2 gap-0 text-[11px] font-mono">
            <div className="p-2 bg-slate-900 text-slate-100 overflow-auto">
              <div className="text-[10px] mb-1 text-slate-400">{t.srcTitle}</div>
              {t.src.map((l, i) => (
                <div key={i} className="whitespace-pre text-emerald-200">{l === '' ? ' ' : l}</div>
              ))}
            </div>
            <div className="p-2 bg-white overflow-auto" style={{borderLeft:`2px solid ${BRAND}`}}>
              <div className="text-[10px] mb-1" style={{color:BRAND}}>{t.outTitle}</div>
              {t.out.map((l, i) => (
                <div key={i} className="whitespace-pre" style={{color:BRAND_DARK}}>{l === '' ? ' ' : l}</div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="mb-3 text-sm font-bold" style={{color:BRAND_DARK}}>Go text/template = Helm 이 값을 꽂는 방식</div>
          <Rows rows={state.rows} />
          <TransformPane t={state.transform} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:BRAND_BG}}>
          <div className="text-lg font-bold mb-2" style={{color:BRAND_DARK}}>⛵ {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:BRAND_DARK}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:BRAND_BG, bd:BRAND_BD, tx:BRAND_DARK, icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); window.hljs.highlightElement(codeRef.current); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(39,122,159,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:`linear-gradient(135deg,${BRAND_BG} 0%,#cfe5ef 100%)`}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>⛵</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:BRAND_DARK}}>II-1-1. Go 템플릿 문법</h1>
                <p className="text-sm" style={{color:BRAND}}>비유: 빈칸 뚫린 서식에 값을 채워 넣는 자동 완성기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 목차</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : BRAND_BD}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:`${BRAND}aa`}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                이중 중괄호 안이 코드, 점(.)이 데이터. 값 삽입 → 공백 제어 → default/quote → 변수. 이 네 가지로 대부분의 차트를 읽고 쓴다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["Helm","GoTemplate","Values","Whitespace","Pipeline"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:BRAND_BG, color:BRAND_DARK, border:`1px solid ${BRAND_BD}`}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../part1/I-2-2.html" className="underline hover:no-underline">← 이전</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
