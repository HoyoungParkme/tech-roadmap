    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }

  <script>window.LESSON = {"topic": "helm", "topicName": "Helm", "topicHref": "../index.html", "id": "V-2-1", "title": "멀티환경 (dev / stg / prod)", "sub": "비유: 차트 하나 = 붕어빵 틀, values-<env> = 환경별 반죽", "path": "part5/V-2-1.html", "prev": {"id": "V-1-2", "title": "시크릿 관리", "href": "../part5/V-1-2.html"}, "next": {"id": "V-2-2", "title": "실전 체크리스트", "href": "../part5/V-2-2.html"}, "wrap": "차트는 하나, values만 환경별로. 공통은 base에, 차이만 override에 최소로. -f는 왼→오 병합(뒤가 승), release·namespace로 환경 격리."};</script>

<body>
  <div id="root" data-trn-native-beats="1"></div>
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#277A9F';
    const BRAND_DARK = '#1f6886';
    const BRAND_BG = '#e5f0f6';
    const BRAND_BD = '#a8cee0';

    // 환경별 최종 병합 결과 (base + values-{env}.yaml override)
    const ENVS = [
      { key:'dev',     label:'dev',     ns:'dev',     release:'myapp-dev',     tone:'#3b82f6',
        replicas:'1', tag:'dev-latest', cpu:'100m', mem:'128Mi', host:'dev.myapp.local', hpa:'off' },
      { key:'staging', label:'staging', ns:'staging', release:'myapp-staging', tone:'#d97706',
        replicas:'2', tag:'1.4.0-rc.1', cpu:'250m', mem:'256Mi', host:'staging.myapp.io', hpa:'off' },
      { key:'prod',    label:'prod',    ns:'prod',    release:'myapp-prod',    tone:'#16a34a',
        replicas:'4', tag:'1.4.0', cpu:'500m', mem:'512Mi', host:'myapp.io', hpa:'on (2~12)' },
    ];

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      layout: {lang:"bash", filename:"chart-layout.txt", lines:[
        "# 하나의 차트 + 환경별 values 파일 레이아웃",
        "myapp/",
        "├── Chart.yaml",
        "├── templates/            # 환경 무관 — 딱 하나만",
        "│   ├── deployment.yaml",
        "│   ├── service.yaml",
        "│   ├── ingress.yaml",
        "│   └── hpa.yaml",
        "├── values.yaml           # (1) 공통 base — 모든 환경 공유",
        "├── values-dev.yaml       # (2) dev 오버라이드 (차이만)",
        "├── values-staging.yaml   # (3) staging 오버라이드",
        "└── values-prod.yaml      # (4) prod 오버라이드",
        "",
        "# 안티패턴 — 차트를 환경별로 복사 (절대 금지)",
        "#   myapp-dev/  myapp-staging/  myapp-prod/",
        "#   → 공통 수정이 3곳으로 흩어지고 반드시 어긋난다",
        "",
        "# 올바른 사용 — 같은 차트에 다른 values 만 주입",
        "$ helm upgrade --install myapp-dev  ./myapp -f values.yaml -f values-dev.yaml",
        "$ helm upgrade --install myapp-prod ./myapp -f values.yaml -f values-prod.yaml",
      ]},
      base: {lang:"yaml", filename:"values.yaml", lines:[
        "# ===== 공통 base — 모든 환경이 공유 =====",
        "# 환경마다 달라지는 값은 여기 확정하지 않는다.",
        "",
        "image:",
        "  repository: registry.myapp.io/myapp   # 저장소는 공통",
        "  pullPolicy: IfNotPresent",
        "  tag: \"\"                # 환경 파일에서 반드시 지정 (기본 비움)",
        "",
        "service:",
        "  type: ClusterIP        # 클러스터 내부 노출 — 공통",
        "  port: 8080",
        "",
        "ingress:",
        "  enabled: true",
        "  className: nginx",
        "  host: \"\"               # 환경 파일에서 host 지정",
        "",
        "# 오버라이드 안 되면 쓰이는 안전한 기본값 (dev 수준)",
        "replicaCount: 1",
        "resources:",
        "  requests:",
        "    cpu: 100m",
        "    memory: 128Mi",
        "  limits:",
        "    cpu: 250m",
        "    memory: 256Mi",
        "",
        "autoscaling:",
        "  enabled: false         # 기본 꺼짐 — prod 에서만 켠다",
        "  minReplicas: 2",
        "  maxReplicas: 12",
        "  targetCPUUtilizationPercentage: 70",
      ]},
      override: {lang:"yaml", filename:"values-prod.yaml", lines:[
        "# ===== prod 전용 오버라이드 — base 와 다른 값만 =====",
        "",
        "replicaCount: 4          # base 1 → prod 4",
        "",
        "image:",
        "  tag: \"1.4.0\"           # 고정 버전 (movable 태그 금지)",
        "",
        "ingress:",
        "  host: myapp.io         # 실서비스 도메인",
        "",

        rows:[
          {name:'replicaCount', desc:'dev 1 / staging 2 / prod 4'},
          {name:'image.tag', desc:'dev 움직임 / prod 고정'},
          {name:'resources', desc:'환경 규모에 맞춰 확대'},
          {name:'autoscaling', desc:'prod만 on'},
        ],
        alert:{tone:'warn', text:'prod 이미지 태그는 dev-latest 같은 움직이는 태그 금지 — 반드시 고정 버전.'},
        code:{...CODE.override, highlight:[22,23,24,25,26,27]},
      },

      // ── Step 4 ────────────────────────────────────────────────────────
      { ...S4,
        beat:{ label:'release 이름 규칙', at:'deploy.sh L1',
               caption:'release는 myapp-<env>, namespace는 -n <env> 로 나눠 한 클러스터에서도 섞이지 않게 한다.',
               changes:[{mark:'new', text:'release = myapp-<env>'},
                        {mark:'new', text:'namespace로 격리'}] },
        focus:'merge',
        rows:[
          {name:'release 규칙', desc:'myapp-dev / -staging / -prod'},
          {name:'namespace', desc:'dev / staging / prod'},
          {name:'배포한 환경', desc:'아직 없음'},
        ],
        alert:{tone:'info', text:'같은 클러스터에 세 환경이 있어도 release 이름과 namespace가 다르면 안 섞인다.'},
        code:{...CODE.deploy, highlight:[1]},
      },
      { ...S4,
        beat:{ label:'dev 배포', at:'deploy.sh L3–6',
               caption:'-f values.yaml 뒤에 values-dev.yaml을 줘서 dev 값이 base를 덮는다.',
               changes:[{mark:'new', text:'release myapp-dev 생성'},
                        {mark:'read', text:'-f base → -f dev 순서'}] },
        focus:'merge',
        rows:[
          {name:'-f 순서', desc:'values.yaml → values-dev.yaml'},
          {name:'namespace', desc:'dev (--create-namespace)'},
          {name:'배포한 환경', desc:'dev'},
        ],
        alert:{tone:'info', text:'--create-namespace를 붙이면 네임스페이스가 없어도 함께 만들어진다.'},
        code:{...CODE.deploy, highlight:[3,4,5,6]},
      },
      { ...S4,
        beat:{ label:'staging 배포', at:'deploy.sh L8–11',
               caption:'같은 차트에 values-staging.yaml만 바꿔 끼워 staging release를 만든다.',
               changes:[{mark:'new', text:'release myapp-staging 생성'},
                        {mark:'changed', text:'env 파일 dev → staging'}] },
        focus:'merge',
        rows:[
          {name:'-f 순서', desc:'values.yaml → values-staging.yaml'},
          {name:'namespace', desc:'staging'},
          {name:'배포한 환경', desc:'dev, staging'},
        ],
        alert:{tone:'good', text:'차트 인자 ./myapp은 그대로다. 바뀐 것은 -f 뒤 파일 하나뿐.'},
        code:{...CODE.deploy, highlight:[8,9,10,11]},
      },
      { ...S4,
        beat:{ label:'prod 배포 — 뒤가 승', at:'deploy.sh L13–16',
               caption:'base를 먼저 주고 values-prod.yaml을 나중에 줘야 prod 값이 최종적으로 이긴다.',
               changes:[{mark:'new', text:'release myapp-prod 생성'},
                        {mark:'changed', text:'replicas base 1 → prod 4'}] },
        focus:'merge',
        rows:[
          {name:'-f 순서', desc:'values.yaml → values-prod.yaml'},
          {name:'병합 규칙', desc:'왼→오 deep merge, 뒤가 승'},
          {name:'배포한 환경', desc:'dev, staging, prod'},
        ],
        alert:{tone:'warn', text:'순서를 뒤집어 env를 먼저 주면 base가 이겨서 prod 설정이 사라진다.'},
        code:{...CODE.deploy, highlight:[13,14,15,16]},
      },
      { ...S4,
        beat:{ label:'--set은 -f보다 위', at:'deploy.sh L13–16',
               caption:'우선순위는 차트 안 values.yaml < -f 파일(왼쪽부터) < --set이다. 차트 안 values.yaml은 -f로 주지 않아도 맨 아래에 깔리고, --set은 모든 -f를 이긴다.',
               changes:[{mark:'read', text:'차트 기본 values.yaml은 늘 바닥'},
                        {mark:'changed', text:'--set이 마지막으로 이김'}] },
        focus:'merge',
        rows:[
          {name:'차트 values.yaml', desc:'-f 없이도 기본값으로 깔림'},
          {name:'-f 파일', desc:'왼쪽부터 병합, 뒤가 이김'},
          {name:'--set', desc:'-f보다 나중에 적용'},
        ],
        alert:{tone:'info', text:'CI가 --set image.tag=… 로 넣은 값은 어떤 values 파일보다 우선한다.'},
        code:{...CODE.deploy, highlight:[13,14,15,16]},
      },
      { ...S4,
        beat:{ label:'설치 없이 결과 확인', at:'deploy.sh L18–21',
               caption:'helm template로 병합 결과만 뽑아보면 replicas가 4로 덮인 것이 눈에 보인다.',
               changes:[{mark:'read', text:'최종 매니페스트 미리보기'},
                        {mark:'changed', text:'replicas 출력 4'}] },
        focus:'merge',
        rows:[
          {name:'helm template', desc:'설치 없이 최종 매니페스트 확인'},
          {name:'replicas 출력', desc:'4 — prod가 base 1을 덮음'},
          {name:'배포한 환경', desc:'dev, staging, prod'},
        ],
        alert:{tone:'good', text:'배포 전 helm template로 병합 결과를 먼저 확인하면 사고를 대부분 막는다.'},
        code:{...CODE.deploy, highlight:[18,19,20,21]},
      },
      { ...S4,
        beat:{ label:'release 상태 확인', at:'deploy.sh L23–25',
               caption:'helm list -n prod로 리비전 3, 상태 deployed를 확인하면 배포가 끝난 것이다.',
               changes:[{mark:'read', text:'REVISION 3 / deployed'},
                        {mark:'read', text:'chart myapp-0.1.0 동일'}] },
        focus:'merge',
        rows:[
          {name:'release', desc:'myapp-prod (ns: prod)'},
          {name:'REVISION', desc:'3 · STATUS deployed'},
          {name:'CHART', desc:'myapp-0.1.0 — 세 환경 동일'},
        ],
        alert:{tone:'info', text:'-f는 왼→오 deep merge, 뒤 파일이 승리. base를 먼저, env를 나중에.'},
        code:{...CODE.deploy, highlight:[23,24,25]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'세 환경을 한 번에', at:'compare-envs.sh L1–2',
               caption:'dev·staging·prod를 도는 루프로 최종 replicaCount를 나란히 비교한다.',
               changes:[{mark:'new', text:'env 루프 시작'},
                        {mark:'read', text:'비교 대상 3개 환경'}] },
        focus:'summary',
        rows:[
          {name:'비교 대상', desc:'dev / staging / prod'},
          {name:'비교 항목', desc:'최종 replicaCount'},
          {name:'출력', desc:'아직 없음'},
        ],
        alert:{tone:'info', text:'같은 차트가 환경마다 어떻게 렌더되는지는 template 결과로 비교하면 된다.'},
        code:{...CODE.compare, highlight:[1,2]},
      },
      { ...S5,
        beat:{ label:'같은 차트에 다른 values', at:'compare-envs.sh L3–7',
               caption:'./myapp은 고정하고 -f values-$env.yaml만 바뀌며 replicas 줄을 뽑아낸다.',
               changes:[{mark:'read', text:'./myapp 고정 재사용'},
                        {mark:'changed', text:'-f values-$env.yaml만 교체'}] },
        focus:'summary',
        rows:[
          {name:'차트 인자', desc:'./myapp — 세 번 모두 동일'},
          {name:'바뀌는 것', desc:'-f values-$env.yaml 하나'},
          {name:'추출', desc:'grep -m1 replicas:'},
        ],
        alert:{tone:'good', text:'명령에서 유일하게 움직이는 부분이 values 파일 이름 하나면 성공이다.'},
        code:{...CODE.compare, highlight:[3,4,5,6,7]},
      },
      { ...S5,
        beat:{ label:'결과: 1 / 2 / 4', at:'compare-envs.sh L8–10',
               caption:'같은 템플릿에서 dev 1, staging 2, prod 4로 서로 다른 replicas가 나온다.',
               changes:[{mark:'changed', text:'dev 1 / staging 2 / prod 4'},
                        {mark:'read', text:'차이는 values에서만 발생'}] },
        focus:'merge',
        rows:[
          {name:'dev', desc:'replicas: 1'},
          {name:'staging', desc:'replicas: 2'},
          {name:'prod', desc:'replicas: 4'},
        ],
        alert:{tone:'good', text:'템플릿은 한 글자도 다르지 않은데 결과가 셋으로 갈린다. 이게 목표한 그림이다.'},
        code:{...CODE.compare, highlight:[8,9,10]},
      },
      { ...S5,
        beat:{ label:'클러스터 상태 확인', at:'compare-envs.sh L12–16',
               caption:'helm list -A로 세 release가 각자 namespace에서 같은 차트 버전으로 떠 있는지 본다.',
               changes:[{mark:'read', text:'release 3개 deployed'},
                        {mark:'read', text:'chart 버전 myapp-0.1.0 동일'}] },
        focus:'summary',
        rows:[
          {name:'myapp-dev', desc:'ns dev · deployed'},
          {name:'myapp-staging', desc:'ns staging · deployed'},
          {name:'myapp-prod', desc:'ns prod · deployed'},
          {name:'CHART', desc:'myapp-0.1.0 — 세 환경 동일'},
        ],
        alert:{tone:'info', text:'차트 버전이 셋 다 같으면 하나의 차트 원칙이 실제로 지켜지고 있다는 뜻이다.'},
        code:{...CODE.compare, highlight:[12,13,14,15,16]},
      },
      { ...S5,
        beat:{ label:'핵심 한 줄', at:'compare-envs.sh L18',
               caption:'차트는 하나, values만 환경별로 갈아끼운다 — 멀티환경의 전부다.',
               changes:[{mark:'read', text:'차트 1벌 유지'},
                        {mark:'changed', text:'values만 환경별 교체'}] },
        focus:'summary',
        rows:[
          {name:'replicaCount', desc:'dev 1 / staging 2 / prod 4'},
          {name:'image.tag', desc:'dev 움직임 / prod 고정'},
          {name:'resources', desc:'환경 규모에 맞춰 확대'},
          {name:'autoscaling', desc:'prod만 on'},
        ],
        wins:[
          '차트는 하나 — 환경별로 복사하지 않는다',
          '공통은 values.yaml(base) 에 최대한 몰아넣는다',
          '환경 파일에는 차이(replicas·resources·host·tag·hpa)만 최소로',
          '-f 는 왼→오 deep merge, 뒤 파일(env)이 base 를 이긴다',
          'release=myapp-<env> + namespace 로 환경 격리',
          'upgrade --install 로 CI 에서 멱등(없으면 설치·있으면 갱신)',
        ],
        alert:{tone:'good', text:'차트 하나 + 얇은 override + namespace 격리 = 유지보수 쉬운 멀티환경.'},
        code:{...CODE.compare, highlight:[18]},
      },
    ];

    // 강조 대상 필드 (STEP focus 에 따라 해당 행 하이라이트)

    // ── RefPanel ── 예전 왼쪽 패널의 키워드 표·환경 비교표 (lesson.jsx 가 "표·정리 보기" 상자에 넣는다)
    function RefPanel({ step }) {
      const out = [];
      if (step.rows && step.rows.length) out.push(
        <div key="rows">
          <h4>⛵ 멀티환경 키워드</h4>
          <table><tbody>{step.rows.map((r) => (<tr key={r.name}><td className="font-mono font-bold">{r.name}</td><td>{r.desc}</td></tr>))}</tbody></table>
        </div>);
      if (step.focus === 'merge' || step.focus === 'summary' || step.focus === 'override') out.push(
        <div key="envs">
          <h4>환경별 최종 병합 결과 (base + values-&lt;env&gt;)</h4>
          <table>
            <thead><tr><th>env</th><th>release · ns</th><th>replicas</th><th>image.tag</th><th>cpu / mem</th><th>host</th><th>HPA</th></tr></thead>
            <tbody>{ENVS.map((e) => (<tr key={e.key}><td className="font-bold">{e.label}</td><td className="font-mono">{e.release} · {e.ns}</td><td className="font-mono">{e.replicas}</td>
              <td className="font-mono">{e.tag}</td><td className="font-mono">{e.cpu} / {e.mem}</td><td className="font-mono">{e.host}</td><td>{e.hpa}</td></tr>))}</tbody>
          </table>
          <p>prod 의 HPA 범위 2~12 는 base 의 minReplicas·maxReplicas 가 그대로 남은 값이다. staging 값 파일은 이 장에 나오지 않아 표의 값만 적었다.</p>
        </div>);
      if (step.focus === 'merge') out.push(
        <div key="prio">
          <h4>values 우선순위 (아래가 이긴다)</h4>
          <ul>
            <li>차트 안 values.yaml (-f 로 주지 않아도 늘 적용)</li>
            <li>-f / --values 파일, 왼쪽부터 차례로. 같은 키는 뒤 파일이 이긴다</li>
            <li>--set 값 (여러 개면 오른쪽이 이긴다)</li>
          </ul>
          <p>이 장처럼 차트 안 values.yaml 을 -f 로 한 번 더 주는 것은 해롭지 않지만, 순서를 뒤집어 맨 뒤에 두면 환경 값을 덮는다.</p>
        </div>);
      if (step.wins) out.push(
        <div key="wins">
          <h4>⛵ 핵심 정리</h4>
          <ul>{step.wins.map((w) => <li key={w}>{w}</li>)}</ul>
        </div>);
      return out.length ? <div>{out}</div> : null;
    }
    // ── /RefPanel ──

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n')); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(39,122,159,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
