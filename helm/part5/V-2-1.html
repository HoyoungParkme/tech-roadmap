<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helm 학습 — V-2-1. 멀티환경 (dev / staging / prod)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛵</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#277A9F';
    const BRAND_DARK = '#1f6886';
    const BRAND_BG = '#e5f0f6';
    const BRAND_BD = '#a8cee0';

    // 환경별 최종 병합 결과 (base + values-{env}.yaml override)
    const ENVS = [
      { key:'dev',     label:'dev',     ns:'dev',     release:'myapp-dev',     tone:'#3b82f6',
        replicas:'1', tag:'dev-latest', cpu:'100m', mem:'128Mi', host:'dev.myapp.local', hpa:'off' },
      { key:'staging', label:'staging', ns:'staging', release:'myapp-staging', tone:'#d97706',
        replicas:'2', tag:'1.4.0-rc.1', cpu:'250m', mem:'256Mi', host:'staging.myapp.io', hpa:'off' },
      { key:'prod',    label:'prod',    ns:'prod',    release:'myapp-prod',    tone:'#16a34a',
        replicas:'4', tag:'1.4.0', cpu:'500m', mem:'512Mi', host:'myapp.io', hpa:'on (4~12)' },
    ];

    const STEPS = [
      {
        title:'Step 1. 하나의 차트로 여러 환경 — 왜 필요한가',
        desc:'dev·staging·prod 를 위해 차트를 3벌 복사하면 공통 로직이 바뀔 때마다 3곳을 고쳐야 하고 반드시 어긋난다. 정답은 "차트는 하나, 값만 환경별로". 공통 설정은 values.yaml(base) 에 두고, 환경마다 다른 값만 values-dev / values-staging / values-prod 에 최소로 담는다. 코드(차트)와 설정(values)을 분리하는 12-factor 원칙 그대로다.',
        focus:'concept',
        rows:[
          {name:'chart (템플릿)', desc:'환경 무관 — 딱 하나만 유지'},
          {name:'values.yaml', desc:'공통 base — 모든 환경 공유'},
          {name:'values-<env>.yaml', desc:'환경 차이만 override'},
          {name:'DRY 원칙', desc:'공통은 한 곳에, 중복 제거'},
        ],
        alert:{tone:'info', text:'차트는 하나, 환경별로 바뀌는 것은 values 뿐. 코드와 설정을 분리한다.'},
        code:{lang:'bash', filename:'chart-layout.txt', lines:[
          '# 하나의 차트 + 환경별 values 파일 레이아웃',
          'myapp/',
          '├── Chart.yaml',
          '├── templates/            # 환경 무관 — 딱 하나만',
          '│   ├── deployment.yaml',
          '│   ├── service.yaml',
          '│   ├── ingress.yaml',
          '│   └── hpa.yaml',
          '├── values.yaml           # (1) 공통 base — 모든 환경 공유',
          '├── values-dev.yaml       # (2) dev 오버라이드 (차이만)',
          '├── values-staging.yaml   # (3) staging 오버라이드',
          '└── values-prod.yaml      # (4) prod 오버라이드',
          '',
          '# 안티패턴 — 차트를 환경별로 복사 (절대 금지)',
          '#   myapp-dev/  myapp-staging/  myapp-prod/',
          '#   → 공통 수정이 3곳으로 흩어지고 반드시 어긋난다',
          '',
          '# 올바른 사용 — 같은 차트에 다른 values 만 주입',
          '$ helm upgrade --install myapp-dev  ./myapp -f values.yaml -f values-dev.yaml',
          '$ helm upgrade --install myapp-prod ./myapp -f values.yaml -f values-prod.yaml',
        ], highlight:[8,9,10,11,18,19]},
      },
      {
        title:'Step 2. base values.yaml — 공통은 여기 한 곳에',
        desc:'values.yaml 에는 "모든 환경이 똑같이 쓰는 값" 만 넣는다. 이미지 저장소 이름, 서비스 포트, ingress 사용 여부, 그리고 오버라이드되지 않았을 때의 안전한 기본값(dev 수준)이 들어간다. 여기 값이 두꺼울수록 환경 파일은 얇아지고 유지보수가 쉬워진다. 환경마다 달라지는 값은 절대 여기 확정하지 않는다.',
        focus:'base',
        alert:{tone:'good', text:'base 가 두꺼울수록 환경 override 파일은 얇아진다. 공통을 최대한 base 로.'},
        code:{lang:'yaml', filename:'values.yaml', lines:[
          '# ===== 공통 base — 모든 환경이 공유 =====',
          '# 환경마다 달라지는 값은 여기 확정하지 않는다.',
          '',
          'image:',
          '  repository: registry.myapp.io/myapp   # 저장소는 공통',
          '  pullPolicy: IfNotPresent',
          '  tag: ""                # 환경 파일에서 반드시 지정 (기본 비움)',
          '',
          'service:',
          '  type: ClusterIP        # 클러스터 내부 노출 — 공통',
          '  port: 8080',
          '',
          'ingress:',
          '  enabled: true',
          '  className: nginx',
          '  host: ""               # 환경 파일에서 host 지정',
          '',
          '# 오버라이드 안 되면 쓰이는 안전한 기본값 (dev 수준)',
          'replicaCount: 1',
          'resources:',
          '  requests:',
          '    cpu: 100m',
          '    memory: 128Mi',
          '  limits:',
          '    cpu: 250m',
          '    memory: 256Mi',
          '',
          'autoscaling:',
          '  enabled: false         # 기본 꺼짐 — prod 에서만 켠다',
          '  minReplicas: 2',
          '  maxReplicas: 12',
          '  targetCPUUtilizationPercentage: 70',
        ], highlight:[4,5,6,9,10,13,14,15]},
      },
      {
        title:'Step 3. 환경 override — 차이만 최소로',
        desc:'values-prod.yaml 에는 base 와 "다른 값만" 적는다. prod 는 replicaCount 를 늘리고, 리소스를 키우고, 실서비스 도메인을 쓰고, 이미지 태그를 고정(dev-latest 같은 움직이는 태그 금지)하고, autoscaling 을 켠다. dev 는 대부분 base 기본값을 그대로 쓰므로 파일이 가장 얇다. 여기서 override 하지 않은 키는 자동으로 base 값이 유지된다.',
        focus:'override',
        alert:{tone:'warn', text:'prod 이미지 태그는 dev-latest 같은 움직이는 태그 금지 — 반드시 고정 버전.'},
        code:{lang:'yaml', filename:'values-prod.yaml', lines:[
          '# ===== prod 전용 오버라이드 — base 와 다른 값만 =====',
          '',
          'replicaCount: 4          # base 1 → prod 4',
          '',
          'image:',
          '  tag: "1.4.0"           # 고정 버전 (movable 태그 금지)',
          '',
          'ingress:',
          '  host: myapp.io         # 실서비스 도메인',
          '',
          'resources:',
          '  requests:',
          '    cpu: 500m            # base 100m → 500m',
          '    memory: 512Mi',
          '  limits:',
          '    cpu: 1000m',
          '    memory: 1Gi',
          '',
          'autoscaling:',
          '  enabled: true          # prod 만 HPA 켬 (4~12)',
          '',
          '# --- 참고: values-dev.yaml 은 이렇게 얇다 ---',
          '# image:',
          '#   tag: dev-latest',
          '# ingress:',
          '#   host: dev.myapp.local',
          '# (replicaCount / resources 는 base 기본값 그대로)',
        ], highlight:[3,6,9,13,20]},
      },
      {
        title:'Step 4. 병합 순서 — 뒤 -f 가 이긴다',
        desc:'helm 은 -f 로 준 파일을 왼쪽에서 오른쪽으로 깊게 병합(deep merge)한다. 같은 키가 겹치면 뒤에 온 파일이 이긴다. 그래서 항상 base(values.yaml) 를 먼저, 환경 파일을 나중에 준다. release 이름은 myapp-<env>, namespace 는 -n <env> 로 분리해 한 클러스터 안에서도 환경이 섞이지 않게 한다. --install 을 붙이면 없으면 설치, 있으면 업그레이드라 CI 에서 안전하다.',
        focus:'merge',
        alert:{tone:'info', text:'-f 는 왼→오 deep merge, 뒤 파일이 승리. base 를 먼저, env 를 나중에.'},
        code:{lang:'bash', filename:'deploy.sh', lines:[
          '# release 이름 = myapp-<env>, namespace 로 격리',
          '',
          '# dev 배포',
          '$ helm upgrade --install myapp-dev ./myapp \\',
          '    -n dev --create-namespace \\',
          '    -f values.yaml -f values-dev.yaml',
          '',
          '# staging 배포',
          '$ helm upgrade --install myapp-staging ./myapp \\',
          '    -n staging --create-namespace \\',
          '    -f values.yaml -f values-staging.yaml',
          '',
          '# prod 배포 (base 먼저 → prod 나중, prod 가 이김)',
          '$ helm upgrade --install myapp-prod ./myapp \\',
          '    -n prod --create-namespace \\',
          '    -f values.yaml -f values-prod.yaml',
          '',
          '# 병합 결과 미리보기 (설치 없이 최종 매니페스트 확인)',
          '$ helm template myapp-prod ./myapp \\',
          '    -f values.yaml -f values-prod.yaml | grep replicas',
          '  replicas: 4            # prod 파일이 base 1 을 덮어씀',
          '',
          '$ helm list -n prod',
          'NAME         NAMESPACE  REVISION  STATUS     CHART',
          'myapp-prod   prod       3         deployed   myapp-0.1.0',
        ], highlight:[4,5,6,14,15,16,21]},
      },
      {
        title:'Step 5. 실무 원칙 — 한눈에 정리',
        desc:'멀티환경의 핵심은 "차트 하나 + 환경별 얇은 override" 다. 공통은 base 로 몰고, 환경 파일에는 진짜 차이(replicas / resources / host / tag / autoscaling)만 남긴다. release 이름과 namespace 로 환경을 격리하고, 배포는 항상 base 를 먼저 -f 로 준다. 아래 3열은 같은 차트가 dev / staging / prod 로 각각 다르게 렌더된 최종 결과다.',
        focus:'summary',
        rows:[
          {name:'replicaCount', desc:'dev 1 / staging 2 / prod 4'},
          {name:'image.tag', desc:'dev 움직임 / prod 고정'},
          {name:'resources', desc:'환경 규모에 맞춰 확대'},
          {name:'autoscaling', desc:'prod 만 on'},
        ],
        wins:[
          '차트는 하나 — 환경별로 복사하지 않는다',
          '공통은 values.yaml(base) 에 최대한 몰아넣는다',
          '환경 파일에는 차이(replicas·resources·host·tag·hpa)만 최소로',
          '-f 는 왼→오 deep merge, 뒤 파일(env)이 base 를 이긴다',
          'release=myapp-<env> + namespace 로 환경 격리',
          'upgrade --install 로 CI 에서 멱등(없으면 설치·있으면 갱신)',
        ],
        alert:{tone:'good', text:'차트 하나 + 얇은 override + namespace 격리 = 유지보수 쉬운 멀티환경.'},
        code:{lang:'bash', filename:'compare-envs.sh', lines:[
          '# 같은 차트, 세 환경의 최종 replicaCount 비교',
          '$ for env in dev staging prod; do',
          '    echo -n "$env: "',
          '    helm template myapp ./myapp \\',
          '      -f values.yaml -f values-$env.yaml \\',
          '      | grep -m1 "replicas:"',
          '  done',
          'dev:     replicas: 1',
          'staging: replicas: 2',
          'prod:    replicas: 4',
          '',
          '# 현재 클러스터의 환경별 release 상태',
          '$ helm list -A | grep myapp',
          'myapp-dev      dev      deployed   myapp-0.1.0',
          'myapp-staging  staging  deployed   myapp-0.1.0',
          'myapp-prod     prod     deployed   myapp-0.1.0',
          '',
          '# 핵심: 차트는 하나, values 만 환경별로 갈아끼운다',
        ], highlight:[8,9,10,14,15,16]},
      },
    ];

    function Rows({ rows }) {
      if (!rows) return null;
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>⛵ 환경별 차이 키워드</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-32 font-mono font-bold" style={{color:BRAND}}>{r.name}</span>
                <span className="flex-1 px-2 py-0.5 rounded font-mono" style={{background:BRAND_BG, color:BRAND_DARK}}>{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 강조 대상 필드 (STEP focus 에 따라 해당 행 하이라이트)
    const FOCUS_FIELDS = {
      concept:[], base:[], override:['replicas','tag','host','res','hpa'],
      merge:['replicas'], summary:['replicas','tag','res','hpa'],
    };

    function EnvColumns({ focus }) {
      const hot = new Set(FOCUS_FIELDS[focus] || []);
      const fields = [
        { k:'replicas', label:'replicaCount' },
        { k:'tag',      label:'image.tag' },
        { k:'res',      label:'resources(cpu/mem)' },
        { k:'host',     label:'ingress.host' },
        { k:'hpa',      label:'autoscaling' },
      ];
      const valOf = (e, k) => k === 'res' ? `${e.cpu} / ${e.mem}` : e[k];
      return (
        <div>
          <div className="mb-2 flex items-center gap-2 text-xs">
            <span className="px-2 py-0.5 rounded font-mono font-bold text-white" style={{background:BRAND_DARK}}>values.yaml (base)</span>
            <span style={{color:BRAND}}>+ values-&lt;env&gt;.yaml</span>
            <span style={{color:BRAND}}>&rarr; 병합</span>
          </div>
          <div className="grid grid-cols-3 gap-2">
            {ENVS.map((e) => (
              <div key={e.key} className="rounded-lg bg-white overflow-hidden" style={{border:`2px solid ${e.tone}`}}>
                <div className="px-2 py-1 text-xs font-bold text-white" style={{background:e.tone}}>{e.label}</div>
                <div className="px-2 py-1 text-[10px] font-mono" style={{color:BRAND_DARK, background:BRAND_BG}}>
                  ns: {e.ns}<br/>{e.release}
                </div>
                <div className="p-1.5 space-y-1">
                  {fields.map((f) => {
                    const isHot = hot.has(f.k);
                    return (
                      <div key={f.k} className="rounded px-1.5 py-1 text-[10px] font-mono leading-tight"
                        style={isHot ? {background:'#fde68a', color:'#92400e', fontWeight:700} : {background:'#f1f5f9', color:'#334155'}}>
                        <div className="opacity-70">{f.label}</div>
                        <div>{valOf(e, f.k)}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:BRAND_BG}}>
          <div className="text-lg font-bold mb-2" style={{color:BRAND_DARK}}>⛵ {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:BRAND_DARK}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:BRAND_BG, bd:BRAND_BD, tx:BRAND_DARK, icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="mb-3 text-sm font-bold" style={{color:BRAND_DARK}}>하나의 차트 → dev / staging / prod</div>
          <EnvColumns focus={state.focus} />
          {state.rows && <div className="mt-3"><Rows rows={state.rows} /></div>}
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); window.hljs.highlightElement(codeRef.current); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(39,122,159,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:`linear-gradient(135deg,${BRAND_BG} 0%,#cfe5ef 100%)`}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>⛵</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:BRAND_DARK}}>V-2-1. 멀티환경 (dev / staging / prod)</h1>
                <p className="text-sm" style={{color:BRAND}}>비유: 차트 하나 = 붕어빵 틀, values-&lt;env&gt; = 환경별 반죽</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 목차</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : BRAND_BD}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:`${BRAND}aa`}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                차트는 하나, values 만 환경별로. 공통은 base 에, 차이만 override 에 최소로. -f 는 왼→오 병합(뒤가 승), release·namespace 로 환경 격리.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["Helm","MultiEnv","values","upgrade-install","namespace"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:BRAND_BG, color:BRAND_DARK, border:`1px solid ${BRAND_BD}`}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="./V-1-2.html" className="underline hover:no-underline">← 이전</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
