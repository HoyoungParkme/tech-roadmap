<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helm 학습 — V-1-1. CI/CD 파이프라인 (배포 자동화)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛵</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#277A9F';
    const BRAND_DARK = '#1f6886';
    const BRAND_BG = '#e5f0f6';
    const BRAND_BD = '#a8cee0';

    // 파이프라인 스테이지 정의 (git push → lint → template → dry-run → upgrade → verify)
    const STAGES = ['git push', 'helm lint', 'helm template', 'helm --dry-run', 'helm upgrade', 'verify'];

    const STEPS = [
      {
        title:'Step 1. 파이프라인 개요 — git push 한 번에 배포까지',
        desc:'개발자가 main 에 push 하거나 PR 을 열면 GitHub Actions 가 자동으로 돈다. 사람이 로컬에서 helm upgrade 를 손으로 치던 시대는 끝. 워크플로우는 lint → template 검증 → dry-run 미리보기 → upgrade --install → verify 순으로 진행되고, 어느 단계든 실패하면 배포가 멈춘다. 손 배포는 오타 하나로 운영을 날리지만, 파이프라인은 매번 같은 순서로 검증한다.',
        rows:[
          {name:'on: push', desc:'main 브랜치 push → 배포 잡'},
          {name:'on: pull_request', desc:'PR → 검증 + dry-run 미리보기만'},
          {name:'runs-on', desc:'ubuntu-latest 러너에서 실행'},
          {name:'GITHUB_SHA', desc:'커밋 해시 = 이미지 태그로 재사용'},
        ],
        pipe:[0,0,0,0,0,0],
        active:0,
        alert:{tone:'info', text:'push 한 번 = lint → template → dry-run → upgrade → verify 자동 실행.'},
        code:{lang:'yaml', tabs:['.github/workflows/deploy.yml','values-prod.yaml'], filename:'.github/workflows/deploy.yml', lines:[
          '# GitHub Actions — Helm 배포 파이프라인',
          'name: deploy',
          '',
          'on:',
          '  push:',
          '    branches: [main]        # main 병합 시 실제 배포',
          '  pull_request:',
          '    branches: [main]        # PR 은 검증 + dry-run 만',
          '',
          'env:',
          '  CHART_DIR: ./charts/my-app',
          '  RELEASE: my-app',
          '  NAMESPACE: production',
          '',
          'jobs:',
          '  validate:',
          '    runs-on: ubuntu-latest',
          '    steps:',
          '      - uses: actions/checkout@v4',
          '      - uses: azure/setup-helm@v4',
          '        with:',
          '          version: v3.15.0',
          '      # 이후 Step 2~4 에서 각 단계를 채운다',
        ], highlight:[4,5,6,7,8]},
      },
      {
        title:'Step 2. helm lint → helm template — 배포 전 정적 검증',
        desc:'클러스터에 손대기 전에 차트가 문법적으로 옳은지부터 본다. helm lint 는 Chart.yaml/values 구조와 필수 필드를 검사하고, helm template 은 실제로 렌더링해서 최종 YAML 이 유효한 Kubernetes 매니페스트인지 확인한다. lint 만 통과하고 template 에서 깨지는 경우가 흔하다 — 잘못된 들여쓰기나 nil 참조는 렌더 시점에야 드러나기 때문. 두 단계 모두 클러스터 없이 러너에서 돈다.',
        rows:[
          {name:'helm lint', desc:'차트 구조/필수 필드 검사'},
          {name:'helm template', desc:'렌더링해서 매니페스트 유효성 확인'},
          {name:'kubeconform (선택)', desc:'렌더 결과를 스키마로 재검증'},
          {name:'실패 = job 중단', desc:'exit code != 0 → 배포 진행 안 함'},
        ],
        pipe:[2,1,1,0,0,0],
        active:2,
        alert:{tone:'good', text:'lint 는 구조, template 은 렌더 결과. 둘 다 클러스터 없이 러너에서.'},
        code:{lang:'yaml', tabs:['.github/workflows/deploy.yml','values-prod.yaml'], filename:'.github/workflows/deploy.yml', lines:[
          '  validate:',
          '    runs-on: ubuntu-latest',
          '    steps:',
          '      - uses: actions/checkout@v4',
          '      - uses: azure/setup-helm@v4',
          '        with:',
          '          version: v3.15.0',
          '',
          '      # (1) 의존성 먼저 내려받기 (subchart .tgz)',
          '      - name: helm dependency build',
          '        run: helm dependency build $CHART_DIR',
          '',
          '      # (2) 구조/문법 검사 — 실패하면 여기서 멈춤',
          '      - name: helm lint',
          '        run: helm lint $CHART_DIR --values $CHART_DIR/values-prod.yaml',
          '',
          '      # (3) 렌더링해서 매니페스트가 유효한지 확인',
          '      - name: helm template',
          '        run: |',
          '          helm template $RELEASE $CHART_DIR \\',
          '            --values $CHART_DIR/values-prod.yaml > rendered.yaml',
          '          cat rendered.yaml',
          '',
          '      # (4) (선택) 렌더 결과를 k8s 스키마로 재검증',
          '      - name: kubeconform',
          '        run: kubeconform -strict -summary rendered.yaml',
        ], highlight:[13,14,15,16,17,18,19,20,21]},
      },
      {
        title:'Step 3. PR 미리보기 — dry-run + 환경별 values + 이미지 태그',
        desc:'PR 단계에서는 실제 배포 대신 helm upgrade --install --dry-run 을 돌려 무엇이 바뀔지 미리 본다. 이미지 태그는 절대 latest 를 쓰지 않고 커밋 해시(github.sha)로 고정한다 — 어떤 커밋이 떠 있는지 추적되고, 롤백도 태그로 정확히 돌아간다. 환경은 --values 로 values-prod.yaml / values-staging.yaml 을 갈아끼워 선택한다. 같은 차트, 다른 값.',
        rows:[
          {name:'--dry-run', desc:'실제 적용 없이 렌더+검증만'},
          {name:'--set image.tag', desc:'github.sha 로 커밋 고정'},
          {name:'--values 선택', desc:'prod / staging 파일 교체'},
          {name:'PR 코멘트', desc:'diff 를 PR 에 자동 게시(선택)'},
        ],
        pipe:[2,2,2,1,0,0],
        active:3,
        alert:{tone:'info', text:'이미지 태그는 latest 금지. 커밋 SHA 로 고정해야 추적·롤백이 된다.'},
        code:{lang:'yaml', tabs:['.github/workflows/deploy.yml','values-prod.yaml'], filename:'values-prod.yaml', lines:[
          '# charts/my-app/values-prod.yaml — 운영 환경 값',
          'replicaCount: 4',
          '',
          'image:',
          '  repository: ghcr.io/my-org/my-app',
          '  # tag 는 파이프라인이 --set 으로 주입 (커밋 SHA)',
          '  pullPolicy: IfNotPresent',
          '',
          'resources:',
          '  requests:',
          '    cpu: 250m',
          '    memory: 512Mi',
          '  limits:',
          '    cpu: "1"',
          '    memory: 1Gi',
          '',
          'ingress:',
          '  enabled: true',
          '  host: app.example.com',
          '',
          '# PR 잡의 dry-run 스텝 (deploy.yml):',
          '#   helm upgrade --install my-app $CHART_DIR \\',
          '#     --namespace production \\',
          '#     --values $CHART_DIR/values-prod.yaml \\',
          '#     --set image.tag=${{ github.sha }} \\',
          '#     --dry-run --debug',
        ], highlight:[3,4,5,6,7,21,22,23,24,25,26]},
      },
      {
        title:'Step 4. helm upgrade --install --atomic — 실패 시 자동 롤백',
        desc:'main 병합 시 진짜 배포가 일어난다. --install 은 릴리스가 없으면 install, 있으면 upgrade 로 동작해 첫 배포와 재배포를 한 명령으로 처리한다. 핵심은 --atomic --wait --timeout 조합: --wait 로 모든 Pod 가 Ready 될 때까지 기다리고, timeout 안에 안 되면 --atomic 이 자동으로 직전 버전으로 롤백한다. 절반만 뜬 상태로 방치되는 최악을 막는 안전벨트다.',
        rows:[
          {name:'--install', desc:'없으면 install, 있으면 upgrade'},
          {name:'--wait', desc:'모든 리소스 Ready 까지 대기'},
          {name:'--timeout 5m', desc:'제한 시간 초과 시 실패 처리'},
          {name:'--atomic', desc:'실패하면 직전 리비전으로 롤백'},
        ],
        pipe:[2,2,2,2,3,0],
        active:4,
        rollback:true,
        alert:{tone:'danger', text:'--atomic 없이 실패하면 절반만 뜬 채로 방치된다. 반드시 함께 쓴다.'},
        code:{lang:'bash', tabs:['.github/workflows/deploy.yml','values-prod.yaml'], filename:'.github/workflows/deploy.yml', lines:[
          '  deploy:',
          '    needs: validate           # 검증 통과해야 실행',
          '    if: github.ref == \'refs/heads/main\'',
          '    runs-on: ubuntu-latest',
          '    environment: production   # 승인 게이트 걸 수 있음',
          '    steps:',
          '      - uses: actions/checkout@v4',
          '      - uses: azure/setup-helm@v4',
          '      - uses: azure/k8s-set-context@v4',
          '        with:',
          '          kubeconfig: ${{ secrets.KUBECONFIG }}',
          '',
          '      - name: helm upgrade --install',
          '        run: |',
          '          helm upgrade --install $RELEASE $CHART_DIR \\',
          '            --namespace $NAMESPACE --create-namespace \\',
          '            --values $CHART_DIR/values-prod.yaml \\',
          '            --set image.tag=${{ github.sha }} \\',
          '            --atomic \\        # 실패 시 자동 롤백',
          '            --wait \\          # 모든 Pod Ready 대기',
          '            --timeout 5m0s',
          '',
          '      # 실패해서 롤백되면 이 스텝은 실행 안 됨',
          '      - name: verify',
          '        run: |',
          '          helm status $RELEASE -n $NAMESPACE',
          '          kubectl rollout status deploy/$RELEASE -n $NAMESPACE',
        ], highlight:[13,14,15,16,17,18,19,20,21]},
      },
      {
        title:'Step 5. 차트 게시 & GitOps 대안',
        desc:'배포가 끝나면 차트 자체도 배포 산출물로 게시한다. 공개 차트라면 chart-releaser 액션이 gh-pages 에 index.yaml 을 갱신하고, 사내라면 OCI 레지스트리(ghcr.io)로 helm push 한다 — 차트도 컨테이너 이미지처럼 버전 태그로 관리된다. 한편 GitOps 방식에서는 파이프라인이 클러스터에 직접 upgrade 하지 않고, values 만 Git 에 커밋하면 ArgoCD 가 차트를 렌더해 스스로 동기화한다. push 형 vs pull 형의 차이.',
        rows:[
          {name:'chart-releaser', desc:'gh-pages 에 index.yaml 게시'},
          {name:'helm push (OCI)', desc:'ghcr.io 레지스트리에 차트 push'},
          {name:'ArgoCD (GitOps)', desc:'Git 이 소스, 차트는 ArgoCD 가 렌더'},
          {name:'push vs pull', desc:'CI 가 밀기 / 클러스터가 당기기'},
        ],
        pipe:[2,2,2,2,2,2],
        active:5,
        wins:[
          'push 한 번에 lint → template → dry-run → upgrade → verify 자동 실행',
          'helm lint 는 구조, helm template 은 렌더 결과를 검증한다',
          '이미지 태그는 latest 금지 — 커밋 SHA(github.sha) 로 고정',
          '--atomic --wait --timeout 로 실패 시 직전 리비전 자동 롤백',
          '--dry-run 으로 PR 에서 변경 미리보기',
          '차트는 chart-releaser 또는 OCI push 로 게시, GitOps 는 ArgoCD 가 렌더',
        ],
        alert:{tone:'good', text:'push 형(CI 가 upgrade) vs pull 형(ArgoCD 가 동기화) — 둘 다 helm 차트 기반.'},
        code:{lang:'yaml', tabs:['.github/workflows/deploy.yml','values-prod.yaml'], filename:'.github/workflows/deploy.yml', lines:[
          '  publish-chart:',
          '    needs: deploy',
          '    runs-on: ubuntu-latest',
          '    steps:',
          '      - uses: actions/checkout@v4',
          '        with: { fetch-depth: 0 }',
          '',
          '      # (A) 공개 저장소 — chart-releaser 로 gh-pages 게시',
          '      - name: chart-releaser',
          '        uses: helm/chart-releaser-action@v1.6.0',
          '        env:',
          '          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}',
          '',
          '      # (B) 또는 사내 OCI 레지스트리로 push',
          '      - name: helm push (OCI)',
          '        run: |',
          '          helm registry login ghcr.io \\',
          '            -u ${{ github.actor }} \\',
          '            -p ${{ secrets.GITHUB_TOKEN }}',
          '          helm package $CHART_DIR --version 0.3.0',
          '          helm push my-app-0.3.0.tgz oci://ghcr.io/my-org/charts',
          '',
          '  # === GitOps 대안 (ArgoCD) ===',
          '  # 파이프라인은 클러스터에 upgrade 하지 않는다.',
          '  # values-prod.yaml 만 Git 에 커밋하면,',
          '  # ArgoCD Application 이 차트를 렌더해 자동 동기화한다.',
        ], highlight:[8,9,10,11,12,14,15,16,17,18,19,20,21]},
      },
    ];

    function Rows({ rows }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>⛵ CI/CD 키워드</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-40 font-mono font-bold" style={{color:BRAND}}>{r.name}</span>
                <span className="flex-1 px-2 py-0.5 rounded font-mono" style={{background:BRAND_BG, color:BRAND_DARK}}>{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 파이프라인 스테이지 뷰 — 각 단계의 진행/성공/실행중 상태를 시각화
    // status: 0=대기, 1=실행중, 2=완료, 3=배포중
    function PipelineView({ pipe, active, rollback }) {
      const label = { 0:'대기', 1:'검증중', 2:'통과', 3:'배포중' };
      const statusStyle = (s, isActive) => {
        if (s === 2) return { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', dot:'#16a34a' };
        if (s === 1) return { bg:BRAND_BG, bd:BRAND, tx:BRAND_DARK, dot:BRAND };
        if (s === 3) return { bg:'#fff7ed', bd:'#fdba74', tx:'#9a3412', dot:'#ea580c' };
        return { bg:'#f1f5f9', bd:'#cbd5e1', tx:'#64748b', dot:'#94a3b8' };
      };
      return (
        <div className="rounded-lg bg-white p-3" style={{border:`2px solid ${BRAND}`}}>
          <div className="text-xs font-bold mb-2" style={{color:BRAND_DARK}}>🚀 GitHub Actions 파이프라인</div>
          <div className="space-y-1">
            {STAGES.map((name, i) => {
              const s = pipe[i];
              const isActive = i === active;
              const st = statusStyle(s, isActive);
              return (
                <div key={i}>
                  <div className="flex items-center gap-2 rounded px-2 py-1 text-xs font-mono transition"
                       style={{background:st.bg, border:`1px solid ${st.bd}`, color:st.tx, fontWeight:isActive?700:400}}>
                    <span className="w-2 h-2 rounded-full" style={{background:st.dot}}></span>
                    <span className="flex-1">{name}</span>
                    <span className="text-[10px]">{label[s]}</span>
                  </div>
                  {i < STAGES.length - 1 && (
                    <div className="text-center text-[10px] leading-3" style={{color:BRAND_BD}}>↓</div>
                  )}
                </div>
              );
            })}
          </div>
          {rollback && (
            <div className="mt-2 rounded px-2 py-1 text-[11px] font-mono flex items-center gap-2"
                 style={{background:'#fee2e2', border:'1px solid #fecaca', color:'#991b1b'}}>
              <span>⟲</span><span>실패 시 --atomic 이 직전 리비전으로 자동 롤백</span>
            </div>
          )}
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="mb-3 text-sm font-bold" style={{color:BRAND_DARK}}>비유: git push = 자동 배포 컨베이어 벨트</div>
          <PipelineView pipe={state.pipe} active={state.active} rollback={state.rollback} />
          <div className="mt-3"><Rows rows={state.rows} /></div>
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:BRAND_BG}}>
          <div className="text-lg font-bold mb-2" style={{color:BRAND_DARK}}>⛵ {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:BRAND_DARK}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:BRAND_BG, bd:BRAND_BD, tx:BRAND_DARK, icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); window.hljs.highlightElement(codeRef.current); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      const tabs = code.tabs || [code.filename];
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex items-center gap-1">
              {tabs.map((t) => {
                const isActive = t === code.filename;
                return (
                  <span key={t} className="text-[11px] font-mono px-2 py-0.5 rounded-t"
                        style={isActive ? {background:'#282c34', color:'#e5e7eb', borderTop:`2px solid ${BRAND}`} : {background:'transparent', color:'#94a3b8'}}>{t}</span>
                );
              })}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(39,122,159,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:`linear-gradient(135deg,${BRAND_BG} 0%,#cfe5ef 100%)`}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>⛵</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:BRAND_DARK}}>V-1-1. CI/CD 파이프라인 — Helm 배포 자동화</h1>
                <p className="text-sm" style={{color:BRAND}}>비유: git push = 검증부터 배포까지 도는 컨베이어 벨트</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 목차</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : BRAND_BD}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:`${BRAND}aa`}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                push → lint → template → dry-run → upgrade --install --atomic → verify. 태그는 커밋 SHA, 실패 시 자동 롤백, 차트는 게시. GitOps 는 ArgoCD 가 렌더.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["Helm","CI/CD","GitHubActions","Atomic","Rollback","ArgoCD"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:BRAND_BG, color:BRAND_DARK, border:`1px solid ${BRAND_BD}`}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../part4/IV-2-2.html" className="underline hover:no-underline">← 이전</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
