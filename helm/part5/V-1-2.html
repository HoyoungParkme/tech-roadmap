<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helm 학습 — V-1-2. 시크릿 관리</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛵</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#277A9F';
    const BRAND_DARK = '#1f6886';
    const BRAND_BG = '#e5f0f6';
    const BRAND_BD = '#a8cee0';

    const FLOW = [
      {icon:'🔓', label:'평문 values', sub:'절대 커밋 금지'},
      {icon:'🔐', label:'SOPS 암호화', sub:'secrets.yaml'},
      {icon:'📦', label:'git 커밋', sub:'암호문만 저장'},
      {icon:'🔑', label:'배포 시 복호화', sub:'helm secrets'},
      {icon:'☸️', label:'Secret 주입', sub:'k8s Secret'},
    ];

    const STEPS = [
      {
        title:'Step 1. 평문 시크릿을 values.yaml 에 넣으면 안 되는 이유',
        stage:0,
        desc:'가장 흔한 사고. DB 비밀번호·API 키를 values.yaml 에 그대로 적고 git 에 커밋한다. 저장소가 private 이라 괜찮다고 생각하지만, 협업자·CI 로그·fork·유출된 토큰을 통해 언제든 노출된다. git 은 히스토리를 지우지 않으므로 한 번 커밋된 비밀은 rebase 로도 완전히 사라지지 않는다. 원칙은 단순하다 — 평문 시크릿은 저장소에 절대 들어가지 않는다.',
        rows:[
          {name:'values.yaml (평문)', desc:'password: changeme ← git 에 그대로'},
          {name:'git history', desc:'한 번 커밋되면 영구 노출'},
          {name:'.gitignore 만으로?', desc:'실수 한 번이면 끝 — 부족'},
          {name:'해결 방향', desc:'커밋되는 건 암호문만'},
        ],
        alert:{tone:'danger', text:'평문 시크릿을 커밋하는 순간 노출된 것으로 간주하고 즉시 로테이션해야 한다.'},
        code:{lang:'yaml', filename:'values.yaml (안티패턴)', lines:[
          '# ❌ 이렇게 하면 안 된다 — 평문 시크릿이 git 에 그대로 올라간다',
          'postgresql:',
          '  auth:',
          '    username: appuser',
          '    password: SuperSecret123!      # ← 평문. git log 에 영구 박제',
          '    database: appdb',
          '',
          'app:',
          '  jwtSecret: my-jwt-signing-key      # ← 토큰 위조 가능',
          '  stripeApiKey: sk_live_51Hxxxx      # ← 결제 키 유출 = 금전 피해',
          '  awsSecretAccessKey: wJalrXUtnFEMI  # ← 클라우드 계정 장악',
          '',
          '# 왜 위험한가',
          '# 1) private repo 여도 협업자/CI/fork 로 퍼진다',
          '# 2) git 은 히스토리를 지우지 않는다 (rebase 로도 잔존)',
          '# 3) 유출 시 어떤 커밋에서 샜는지 추적조차 어렵다',
          '',
          '# ✅ 목표 — 저장소에는 암호문만, 복호화는 배포 시점에',
        ], highlight:[1,5,9,10,11]},
      },
      {
        title:'Step 2. helm-secrets 플러그인 + SOPS 로 values 암호화',
        stage:1,
        desc:'SOPS(Secrets OPerationS) 는 YAML 의 값(value)만 골라 암호화하고 키(key) 구조는 평문으로 남긴다. 그래서 diff 가 읽히고 리뷰가 가능하다. 암호화 열쇠는 age 나 PGP 를 쓴다 — age 는 SSH 키처럼 공개키로 암호화하고 개인키로만 복호화한다. helm-secrets 플러그인이 helm 과 SOPS 를 이어준다. secrets.yaml 을 암호화하면 값이 ENC[...] 형태로 바뀌어 이 상태로 커밋한다.',
        rows:[
          {name:'SOPS', desc:'값만 암호화, 키 구조는 평문'},
          {name:'age / PGP', desc:'복호화 키 — age 가 간편'},
          {name:'helm-secrets', desc:'helm ↔ SOPS 연결 플러그인'},
          {name:'secrets.yaml', desc:'커밋되는 암호문 파일'},
        ],
        alert:{tone:'info', text:'SOPS 는 값만 암호화 → key 구조가 보여 코드 리뷰와 diff 가 가능하다.'},
        code:{lang:'bash', filename:'encrypt-with-sops.sh', lines:[
          '# (1) 플러그인 설치 (한 번)',
          '$ helm plugin install https://github.com/jkroepke/helm-secrets',
          '',
          '# (2) age 키 생성 — 공개키로 암호화, 개인키로 복호화',
          '$ age-keygen -o ~/.config/sops/age/keys.txt',
          'Public key: age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p',
          '',
          '# (3) SOPS 설정 — 어떤 age 공개키로 암호화할지 지정',
          '$ cat .sops.yaml',
          'creation_rules:',
          '  - path_regex: secrets.*\\.yaml$',
          '    age: age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p',
          '',
          '# (4) 평문 secrets.yaml 을 암호화 → 값이 ENC[...] 로 바뀐다',
          '$ helm secrets encrypt secrets.yaml > secrets.enc.yaml',
          '$ mv secrets.enc.yaml secrets.yaml',
          '',
          '# (5) 이 상태로 커밋 — 값은 모두 암호문',
          '$ git add secrets.yaml .sops.yaml',
          '$ git commit -m "chore: add encrypted secrets"',
          '',
          '# 개인키(keys.txt) 는 절대 커밋하지 않는다 — .gitignore 필수',
        ], highlight:[8,9,10,11,14,15]},
      },
      {
        title:'Step 3. 커밋되는 secrets.yaml — 암호문만 남는다',
        stage:2,
        desc:'암호화된 secrets.yaml 을 열어보면 key(postgresql, auth, password) 는 그대로 읽히고 값만 ENC[AES256_GCM,...] 로 바뀌어 있다. 하단의 sops 메타데이터에 어떤 age 공개키로 암호화했는지, MAC(무결성 검증값) 이 함께 저장된다. 이 파일은 git 에 올려도 안전하다 — 개인키 없이는 복호화가 불가능하기 때문이다. 리뷰어는 어떤 키가 추가/삭제됐는지 구조 diff 로 확인할 수 있다.',
        rows:[
          {name:'key 구조', desc:'평문 — diff·리뷰 가능'},
          {name:'ENC[AES256_GCM,...]', desc:'값 암호문'},
          {name:'sops.mac', desc:'변조 감지 무결성값'},
          {name:'커밋 안전성', desc:'개인키 없이 복호화 불가'},
        ],
        alert:{tone:'good', text:'커밋되는 건 암호문뿐. key 구조만 보이므로 리뷰는 가능하고 값은 안전하다.'},
        code:{lang:'yaml', filename:'secrets.yaml (암호화됨, 커밋 대상)', lines:[
          '# SOPS 로 암호화된 secrets.yaml — 이 상태로 git 에 커밋한다',
          'postgresql:',
          '  auth:',
          '    username: ENC[AES256_GCM,data:9pKk2A==,iv:7Qx...,tag:vB2...,type:str]',
          '    password: ENC[AES256_GCM,data:Hn4tZ0Lm,iv:aC1...,tag:pQ9...,type:str]',
          '    database: ENC[AES256_GCM,data:Kd83==,iv:mZ0...,tag:rT4...,type:str]',
          'app:',
          '  jwtSecret: ENC[AES256_GCM,data:xY7pLq,iv:oW2...,tag:sN5...,type:str]',
          '  stripeApiKey: ENC[AES256_GCM,data:Rb1cVe,iv:tU8...,tag:kM3...,type:str]',
          '',
          '# === SOPS 메타데이터 (자동 생성) ===',
          'sops:',
          '  age:',
          '    - recipient: age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aq',
          '      enc: |',
          '        -----BEGIN AGE ENCRYPTED FILE-----',
          '        YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSBB...',
          '        -----END AGE ENCRYPTED FILE-----',
          '  lastmodified: "2026-05-20T10:00:00Z"',
          '  mac: ENC[AES256_GCM,data:0f3a...,type:str]     # 변조 감지',
          '  version: 3.8.1',
          '',
          '# key(postgresql/auth/password) 는 평문 → diff·리뷰 가능',
          '# value 만 암호문 → 개인키 없이는 못 읽는다',
        ], highlight:[3,4,5,7,8]},
      },
      {
        title:'Step 4. 배포 시 복호화 + Kubernetes Secret 템플릿',
        stage:3,
        desc:'helm secrets install 을 쓰면 배포 직전에만 메모리에서 복호화되고, 그 값이 템플릿으로 흘러 들어간다. 디스크에는 평문이 남지 않는다. 템플릿에서는 b64enc 로 base64 인코딩해 Secret 의 data 에 넣거나, 인코딩이 번거로우면 stringData 를 써서 평문 그대로 넣으면 k8s 가 알아서 인코딩한다. 최종 산출물인 k8s Secret 은 etcd 에 저장되므로 저장 암호화(EncryptionConfiguration)와 RBAC 로 접근을 제한한다.',
        rows:[
          {name:'helm secrets install', desc:'배포 시점에만 메모리 복호화'},
          {name:'b64enc', desc:'data: 에 넣을 땐 base64'},
          {name:'stringData', desc:'평문 넣으면 k8s 가 인코딩'},
          {name:'RBAC + etcd 암호화', desc:'Secret 접근 최소화'},
        ],
        alert:{tone:'info', text:'복호화는 배포 시점·메모리에서만. data 는 b64enc, 귀찮으면 stringData 로.'},
        code:{lang:'yaml', filename:'templates/secret.yaml + 배포', lines:[
          '# === templates/secret.yaml — Secret 매니페스트 템플릿 ===',
          'apiVersion: v1',
          'kind: Secret',
          'metadata:',
          '  name: {{ include "my-app.fullname" . }}-secret',
          'type: Opaque',
          '# 방법 A) data — base64 인코딩 필요 → b64enc 파이프',
          'data:',
          '  jwt-secret: {{ .Values.app.jwtSecret | b64enc | quote }}',
          '  stripe-key: {{ .Values.app.stripeApiKey | b64enc | quote }}',
          '# 방법 B) stringData — 평문 그대로, k8s 가 인코딩 (더 간편)',
          'stringData:',
          '  db-password: {{ .Values.postgresql.auth.password | quote }}',
          '  db-user: {{ .Values.postgresql.auth.username | quote }}',
          '---',
          '# === 배포 — helm secrets 가 secrets.yaml 을 메모리에서 복호화 ===',
          '# $ helm secrets install my-app . -f secrets.yaml',
          '#   → ENC[...] 값을 복호화하여 템플릿에 주입, 디스크엔 평문 없음',
          '',
          '# === 결과 Secret 확인 ===',
          '# $ kubectl get secret my-app-secret -o yaml',
          '# data:',
          '#   db-password: U3VwZXJTZWNyZXQxMjMh   ← base64 (평문 아님)',
          '',
          '# RBAC — 이 Secret 을 읽을 수 있는 주체를 최소화',
          '# etcd 저장 암호화(EncryptionConfiguration)도 병행',
        ], highlight:[7,8,9,10,11,12,13,14]},
      },
      {
        title:'Step 5. External Secrets Operator / Vault 연동',
        stage:4,
        desc:'SOPS 는 "암호문을 git 에 둔다" 는 접근이고, External Secrets Operator(ESO) 는 "시크릿을 아예 git 에 두지 않는다" 는 접근이다. 실제 값은 Vault·AWS Secrets Manager 같은 외부 저장소에 있고, 클러스터의 ExternalSecret 리소스가 이를 런타임에 당겨와 k8s Secret 을 자동 생성한다. 로테이션이 잦거나 여러 팀이 공유하는 시크릿에 적합하다. 차트에는 참조(경로)만 들어가므로 민감값이 저장소에 전혀 남지 않는다.',
        rows:[
          {name:'ExternalSecret', desc:'외부 저장소 → k8s Secret 생성'},
          {name:'SecretStore', desc:'Vault/AWS SM 연결 정의'},
          {name:'remoteRef', desc:'외부 시크릿의 경로 참조'},
          {name:'refreshInterval', desc:'주기적 재동기화(로테이션)'},
        ],
        wins:[
          '평문 시크릿은 저장소에 절대 커밋하지 않는다',
          'SOPS(age/PGP) 로 값만 암호화 → 커밋되는 건 암호문뿐',
          'helm secrets 로 배포 시점·메모리에서만 복호화',
          'Secret 템플릿은 b64enc(data) 또는 stringData',
          'ESO/Vault 는 시크릿을 git 밖 외부 저장소에 두고 런타임 주입',
          'etcd 저장 암호화 + RBAC 로 Secret 접근을 최소화',
        ],
        alert:{tone:'good', text:'SOPS = 암호문을 git 에 둔다 / ESO = 시크릿을 git 밖에 두고 런타임에 당겨온다.'},
        code:{lang:'yaml', filename:'external-secret.yaml', lines:[
          '# === SecretStore — Vault 연결 정의 (한 번) ===',
          'apiVersion: external-secrets.io/v1beta1',
          'kind: SecretStore',
          'metadata:',
          '  name: vault-backend',
          'spec:',
          '  provider:',
          '    vault:',
          '      server: https://vault.example.com',
          '      path: secret',
          '      version: v2',
          '      auth:',
          '        kubernetes:',
          '          mountPath: kubernetes',
          '          role: my-app',
          '---',
          '# === ExternalSecret — 외부 값을 당겨 k8s Secret 자동 생성 ===',
          'apiVersion: external-secrets.io/v1beta1',
          'kind: ExternalSecret',
          'metadata:',
          '  name: my-app-db',
          'spec:',
          '  refreshInterval: 1h            # 주기적 재동기화 = 로테이션 반영',
          '  secretStoreRef:',
          '    name: vault-backend',
          '    kind: SecretStore',
          '  target:',
          '    name: my-app-secret          # 생성될 k8s Secret 이름',
          '  data:',
          '    - secretKey: db-password      # k8s Secret 안의 키',
          '      remoteRef:',
          '        key: database/my-app      # Vault 경로',
          '        property: password        # Vault 안의 필드',
          '',
          '# 차트에는 "경로 참조" 만 → 민감값이 저장소에 남지 않는다',
        ], highlight:[15,16,17,18,19,20,21,22,26,27,28,29,30,31]},
      },
    ];

    function Flow({ active }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>⛵ 시크릿 생애주기 흐름</div>
          <div className="p-3 flex items-stretch gap-1">
            {FLOW.map((f, i) => (
              <React.Fragment key={i}>
                <div className="flex-1 flex flex-col items-center text-center rounded-lg py-2 px-1 transition"
                     style={i === active ? {background:BRAND_BG, border:`2px solid ${BRAND}`} : {border:`2px solid transparent`, opacity:0.55}}>
                  <span className="text-2xl leading-none mb-1">{f.icon}</span>
                  <span className="text-[10px] font-bold" style={{color:BRAND_DARK}}>{f.label}</span>
                  <span className="text-[9px] font-mono" style={{color:BRAND}}>{f.sub}</span>
                </div>
                {i < FLOW.length - 1 && (
                  <span className="self-center text-sm" style={{color: i < active ? BRAND : BRAND_BD}}>&rarr;</span>
                )}
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    function Rows({ rows }) {
      return (
        <div className="mt-3 rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>⛵ 시크릿 관리 키워드</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-44 font-mono font-bold" style={{color:BRAND}}>{r.name}</span>
                <span className="flex-1 px-2 py-0.5 rounded font-mono" style={{background:BRAND_BG, color:BRAND_DARK}}>{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="mb-3 text-sm font-bold" style={{color:BRAND_DARK}}>커밋되는 건 암호문만 · 복호화는 배포 시점</div>
          <Flow active={state.stage} />
          <Rows rows={state.rows} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }
    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:BRAND_BG}}>
          <div className="text-lg font-bold mb-2" style={{color:BRAND_DARK}}>⛵ {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:BRAND_DARK}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:BRAND_BG, bd:BRAND_BD, tx:BRAND_DARK, icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); window.hljs.highlightElement(codeRef.current); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(39,122,159,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:`linear-gradient(135deg,${BRAND_BG} 0%,#cfe5ef 100%)`}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>⛵</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:BRAND_DARK}}>V-1-2. 시크릿 관리</h1>
                <p className="text-sm" style={{color:BRAND}}>비유: 금고에 넣고 열쇠는 따로 — 민감정보 안전하게 다루기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : BRAND_BD}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:`${BRAND}aa`}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:BRAND_DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                평문은 절대 커밋 금지 → SOPS 로 값만 암호화 → 배포 시점에만 복호화 → Secret 주입. 로테이션·공유가 잦으면 ESO/Vault 로 시크릿을 git 밖에 둔다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["Helm","Secrets","SOPS","age","ExternalSecrets","Vault"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:BRAND_BG, color:BRAND_DARK, border:`1px solid ${BRAND_BD}`}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="./V-1-1.html" className="underline hover:no-underline">← 이전</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
