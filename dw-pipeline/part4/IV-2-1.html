  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DW Pipeline IV-2-1 — Airflow vs Dagster vs 크론
    학습 목표: 파이프라인 오케스트레이터가 "언제 필요한가"와 "무엇을 고를까"를 판단한다.
              크론(단순)→Airflow(태스크 DAG·표준)→Dagster(데이터 자산 중심·현대적)→관리형의
              스펙트럼 위에서, 태스크 중심과 자산 중심의 발상 차이를 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 오케스트레이터 스펙트럼 지도 + 크론 판단 + Airflow 강약점 +
                       태스크 vs 자산 애니메이션 + 선택 결정표)
                       우(VSCode CodeViewer: orchestrators.py 진화 — 크론→Airflow→Dagster→비교→가이드)
    색상: teal (data 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 오케스트레이터 스펙트럼 — 왼쪽(단순)에서 오른쪽(현대·관리형)으로
    //   key   : 식별자
    //   axis  : 핵심 성격 (무엇 중심으로 파이프라인을 보는가)
    //   fit   : 어울리는 규모/상황
    // ─────────────────────────────────────────────────────
    const TOOLS = [
      { key: 'cron',    icon: '⏰', name: '크론 (cron)',        sub: '단순·의존성 없음',   axis: '시간 트리거',       fit: '단일 작업 · 소규모',       when: '스크립트 1개를 정해진 시각에' },
      { key: 'airflow', icon: '🌀', name: 'Airflow',            sub: '성숙·사실상 표준',   axis: '태스크 DAG 중심',   fit: '중대형 · 복잡한 의존성',   when: '오퍼레이터·생태계가 필요할 때' },
      { key: 'dagster', icon: '🧊', name: 'Dagster',            sub: '데이터 자산 중심',   axis: '자산(asset) 중심',  fit: '데이터 성숙·리니지 중시',  when: '리니지·타입·부분실행 중시' },
      { key: 'managed', icon: '☁️', name: '관리형 (Managed)',    sub: 'Composer·MWAA·Astro', axis: '운영을 위임',      fit: '인프라 부담 회피',         when: '스케줄러 운영을 맡기고 싶을 때' },
    ];
    const TOOL_IDX = Object.fromEntries(TOOLS.map((t, i) => [t.key, i]));

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    //   focus : 스펙트럼에서 강조할 tool key 배열
    //   panel : 좌측 특수 패널 종류
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 선택의 스펙트럼 — 크론에서 관리형까지',
        desc: '"오케스트레이터 뭐 써요?"라는 질문에 정답은 없다 — 팀 규모와 성숙도에 따라 위치가 다르기 때문이다. 왼쪽 끝 크론은 시간이 되면 스크립트를 실행할 뿐 의존성도 재시도도 모른다. 오른쪽으로 갈수록 Airflow는 태스크들의 의존성을 DAG로 엮어 성숙한 생태계를 제공하고, Dagster는 한 발 더 나아가 "데이터 자산"을 1급 시민으로 삼아 리니지를 자동으로 만든다. 그리고 이 모든 걸 직접 운영하기 싫다면 Cloud Composer·MWAA·Astronomer 같은 관리형이 스케줄러 운영 부담을 대신 진다. 핵심은 "더 강력한 도구 = 더 좋음"이 아니라, 지금 우리 파이프라인의 복잡도에 맞는 위치를 고르는 것이다.',
        focus: ['cron', 'airflow', 'dagster', 'managed'],
        panel: 'spectrum',

    // 좌: 오케스트레이터 스펙트럼 지도 — 단순 ⟶ 현대 ⟶ 관리형
    // ─────────────────────────────────────────────────────
    const TOOL_STYLE = {
      cron:    'bg-slate-100 text-slate-700 border-slate-300',
      airflow: 'bg-sky-100 text-sky-800 border-sky-300',
      dagster: 'bg-teal-100 text-teal-800 border-teal-300',
      managed: 'bg-indigo-100 text-indigo-800 border-indigo-300',
    };

    function SpectrumMap({ focus }) {
      const focusSet = new Set(focus);
      return (
        <div className="rounded-lg border-2 border-teal-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-teal-900 mb-2">🎼 오케스트레이터 스펙트럼 — 단순 ⟶ 현대 ⟶ 관리형</div>
          <div className="flex items-stretch gap-1">
            {TOOLS.map((t, i) => {
              const on = focusSet.has(t.key);
              return (
                <React.Fragment key={t.key}>
                  {i > 0 && (
                    <div className="flex items-center leading-none">
                      <span className={`text-[11px] ${on || focusSet.has(TOOLS[i-1].key) ? 'text-teal-500' : 'text-slate-300'}`}>▶</span>
                    </div>
                  )}
                  <div className={`flex-1 rounded-lg border-2 px-1.5 py-2 transition-all text-center ${on ? 'border-teal-500 bg-teal-50 shadow' : 'border-slate-200 bg-white opacity-70'}`}>
                    <div className="text-lg leading-none">{t.icon}</div>
                    <div className={`text-[10px] font-bold mt-1 ${on ? 'text-teal-900' : 'text-slate-600'}`}>{t.name}</div>
                    <div className="text-[8px] text-slate-500 leading-tight mt-0.5">{t.sub}</div>
                    <span className={`inline-block mt-1 text-[8px] font-bold px-1 py-0.5 rounded border ${TOOL_STYLE[t.key]}`}>{t.axis}</span>
                  </div>
                </React.Fragment>
              );
            })}
          </div>
          <div className="mt-2 flex justify-between text-[9px] text-slate-500 px-1">
            <span>← 단순·저비용</span>
            <span>현대·자산 중심 · 관리형 →</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 크론 판단 체크리스트 + 고통의 신호
    // ─────────────────────────────────────────────────────
    function CronCaseBox() {
      const checks = [
        { q: '실행할 작업이 하나뿐인가?', ok: '예 → 크론' },
        { q: '앞뒤 작업 의존성이 없는가?', ok: '예 → 크론' },
        { q: '실패 시 수동 재실행 감당 가능?', ok: '예 → 크론' },
      ];
      const pains = [
        '태스크가 여러 개로 쪼개져 서로를 기다린다',
        '실패 지점부터 재시도·백필이 잦아진다',
        '누가 언제 왜 실패했는지 UI로 봐야 한다',
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-300 bg-white p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">⏰ 크론이면 충분한가? — 3문항 체크</div>
          <div className="space-y-1.5">
            {checks.map((c) => (
              <div key={c.q} className="flex items-center justify-between rounded border border-emerald-200 bg-emerald-50 px-2 py-1.5">
                <span className="text-[11px] text-slate-700">{c.q}</span>
                <span className="text-[10px] font-bold text-emerald-700 whitespace-nowrap">{c.ok}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 rounded border border-amber-300 bg-amber-50 p-2">
            <div className="text-[10px] font-bold text-amber-900 mb-1">🚦 오케스트레이터로 옮길 "고통의 신호"</div>
            <ul className="space-y-0.5">
              {pains.map((p) => (
                <li key={p} className="text-[10px] text-amber-800 flex gap-1"><span>•</span><span>{p}</span></li>
              ))}
            </ul>
          </div>
          <div className="mt-2 text-[10px] text-slate-600">→ 세 문항 모두 "예"면 crontab 한 줄로 시작. 미리 도입하는 건 순수 비용이다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — Airflow 강점/약점 레이더(막대) + 요약
    // ─────────────────────────────────────────────────────
    function AirflowSwotBox() {
      const bars = [
        { label: '생태계·오퍼레이터', val: 95, good: true },
        { label: '성숙도·표준', val: 92, good: true },
        { label: '의존성 명시(DAG)', val: 85, good: true },
        { label: '로컬 테스트 용이', val: 35, good: false },
        { label: '데이터 자산 인식', val: 20, good: false },
        { label: '스케줄러 경량', val: 40, good: false },
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🌀 Airflow 강약점 — 태스크 중심의 명암</div>
          <div className="space-y-1.5">
            {bars.map((b) => (
              <div key={b.label} className="flex items-center gap-2">
                <span className="text-[10px] text-slate-700 w-28 text-right">{b.label}</span>
                <div className="flex-1 h-3 rounded-full bg-slate-100 border border-slate-200 overflow-hidden">
                  <div className={`h-full transition-all duration-700 ${b.good ? 'bg-sky-500' : 'bg-red-400'}`} style={{ width: `${b.val}%` }} />
                </div>
                <span className={`text-[10px] font-bold w-8 ${b.good ? 'text-sky-700' : 'text-red-600'}`}>{b.good ? '강' : '약'}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-slate-700 rounded border border-sky-200 bg-sky-50 p-2">
            근본 한계: "무엇을 <b>실행</b>했나"는 알아도 "무엇을 <b>만들었나</b>(데이터 자산·리니지)"는 모른다. 그럼에도 생태계·성숙도 덕에 대형 파이프라인의 1순위다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 태스크 중심(Airflow) vs 자산 중심(Dagster) 같은 파이프라인 비교
    // ─────────────────────────────────────────────────────
    function DagsterAssetBox() {
      const [flash, setFlash] = useState(0);
      // 부분 실행 데모: clean 자산이 바뀌면 그 아래(clean→mart)만 다시 만든다
      useEffect(() => {
        const id = setInterval(() => setFlash((f) => (f + 1) % 2), 1400);
        return () => clearInterval(id);
      }, []);
      const rebuilt = flash === 1; // true면 clean·mart 재생성 강조
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-400 bg-white p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">🔀 같은 파이프라인, 두 관점</div>
          <div className="grid grid-cols-2 gap-2">
            {/* Airflow: 태스크 흐름 */}
            <div className="rounded border border-sky-300 bg-sky-50 p-2">
              <div className="text-[10px] font-bold text-sky-900 mb-1.5">🌀 Airflow — 태스크 흐름</div>
              <div className="space-y-1">
                {['extract', 'transform', 'load'].map((t, i) => (
                  <React.Fragment key={t}>
                    {i > 0 && <div className="text-center text-[9px] text-sky-400 leading-none">↓ 실행 순서</div>}
                    <div className="rounded border border-sky-300 bg-white px-2 py-1 text-[10px] font-mono text-sky-800">{`task: ${t}()`}</div>
                  </React.Fragment>
                ))}
              </div>
              <div className="mt-1.5 text-[9px] text-sky-700">"무엇을 실행하나"만 안다. 결과물·리니지는 모름.</div>
            </div>
            {/* Dagster: 자산 그래프 */}
            <div className="rounded border border-teal-400 bg-teal-50 p-2">
              <div className="text-[10px] font-bold text-teal-900 mb-1.5">🧊 Dagster — 자산 리니지</div>
              <div className="space-y-1">
                {[
                  { a: 'raw_orders', hot: false },
                  { a: 'clean_orders', hot: true },
                  { a: 'orders_mart', hot: true },
                ].map((n, i) => (
                  <React.Fragment key={n.a}>
                    {i > 0 && <div className="text-center text-[9px] text-teal-400 leading-none">↓ 만들어진다</div>}
                    <div className={`rounded border px-2 py-1 text-[10px] font-mono transition-all ${n.hot && rebuilt ? 'border-teal-500 bg-teal-200 text-teal-900 font-bold shadow' : 'border-teal-300 bg-white text-teal-800'}`}>
                      {`@asset ${n.a}`}
                    </div>
                  </React.Fragment>
                ))}
              </div>
              <div className="mt-1.5 text-[9px] text-teal-700">{rebuilt ? '⚡ clean 변경 → 그 아래만 부분 재생성' : '"무엇을 만드나"를 선언 → 리니지 자동.'}</div>
            </div>
          </div>
          <div className="mt-2 grid grid-cols-3 gap-1.5 text-[9px]">
            {['리니지 자동', '부분 실행', '타입 체크'].map((k) => (
              <div key={k} className="rounded border border-teal-300 bg-teal-50 px-1.5 py-1 text-center font-bold text-teal-800">✓ {k}</div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 선택 결정표 + 다음 장 예고
    // ─────────────────────────────────────────────────────
    function DecisionTable() {
      const rows = [
        { crit: '팀 규모 작음 · 단일 작업', pick: '크론', tone: 'slate' },
        { crit: '대형 · 다양한 시스템 연동', pick: 'Airflow', tone: 'sky' },
        { crit: '리니지 · 데이터 성숙도 핵심', pick: 'Dagster', tone: 'teal' },
        { crit: '이미 Airflow 스택', pick: 'Airflow 유지', tone: 'sky' },
        { crit: '운영을 맡기고 싶음', pick: '관리형(Composer·MWAA·Astro)', tone: 'indigo' },
      ];
      const TONE = {
        slate: 'bg-slate-100 text-slate-700 border-slate-300',
        sky: 'bg-sky-100 text-sky-800 border-sky-300',
        teal: 'bg-teal-100 text-teal-800 border-teal-300',
        indigo: 'bg-indigo-100 text-indigo-800 border-indigo-300',
      };
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-400 bg-white p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">🧭 선택 결정표 — 상황별 한눈에</div>
          <div className="overflow-x-auto">
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-teal-900 border-b-2 border-teal-300">
                  <th className="text-left py-1">상황</th>
                  <th className="text-left py-1 pl-2">권장</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.crit} className="border-t border-teal-100">
                    <td className="py-1 text-slate-700">{r.crit}</td>
                    <td className="py-1 pl-2">
                      <span className={`px-1.5 py-0.5 rounded border text-[9px] font-bold ${TONE[r.tone]}`}>{r.pick}</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="mt-2 text-[10px] text-slate-700 rounded border border-amber-300 bg-amber-50 p-2">
            <b>현실 체크:</b> 시장의 다수는 여전히 Airflow — 마이그레이션은 기존 DAG·팀 숙련도를 버려야 하므로 공짜가 아니다. "새 프로젝트 백지 선택"과 "돌아가는 Airflow 교체"는 다른 문제다.
          </div>
        </div>
      );
    }

    function NextChapterBox() {
      const alts = [
        { n: 'Prefect', d: '경량·동적 워크플로' },
        { n: 'Mage', d: '노코드 친화 · 빠른 시작' },
      ];
      return (
        <div className="mt-2 rounded-lg border-2 border-teal-500 bg-gradient-to-br from-teal-50 to-emerald-50 p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">🔎 그 외 대안 + 다음 장 예고</div>
          <div className="flex gap-1.5 flex-wrap mb-2">
            {alts.map((a) => (
              <div key={a.n} className="flex-1 min-w-[120px] rounded border border-teal-300 bg-white px-2 py-1.5">
                <div className="text-[10px] font-bold text-teal-800">{a.n}</div>
                <div className="text-[9px] text-slate-600">{a.d}</div>
              </div>
            ))}
          </div>
          <div className="text-[10px] text-teal-900">
            ▶ <b>다음 장 (배포)</b>: 이렇게 고른 오케스트레이터를 실제로 배포·운영하는 법으로 넘어간다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-teal-50',    border: 'border-teal-300',    text: 'text-teal-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 스펙트럼 지도 + 단계별 특수 패널 (teal 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      spectrum: { icon: '🗺️', label: '스펙트럼' },
      cron:     { icon: '⏰', label: '크론' },
      airflow:  { icon: '🌀', label: 'Airflow' },
      dagster:  { icon: '🧊', label: 'Dagster' },
      guide:    { icon: '🧭', label: '선택 가이드' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.spectrum;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-teal-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>오케스트레이터 선택 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-teal-700 font-mono mb-2 px-2 py-1 rounded bg-teal-50 border border-teal-200">
            현재 초점: {state.engineDetail}
          </div>

          <SpectrumMap focus={state.focus} />

          {state.panel === 'spectrum' && (
            <div className="mt-3 rounded-lg border-2 border-teal-300 bg-white p-3">
              <div className="text-xs font-bold text-teal-900 mb-2">📐 무엇 중심으로 보는가 — 축이 다르다</div>
              <div className="space-y-1.5">
                {TOOLS.map((t) => (
                  <div key={t.key} className="flex items-center gap-2 rounded border border-teal-100 px-2 py-1.5">
                    <span className="text-base">{t.icon}</span>
                    <span className="text-[11px] font-bold text-teal-900 w-24">{t.name}</span>
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${TOOL_STYLE[t.key]}`}>{t.axis}</span>
                    <span className="text-[10px] text-slate-600 flex-1">{t.fit}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          {state.panel === 'cronCase' && <CronCaseBox />}
          {state.panel === 'airflowSwot' && <AirflowSwotBox />}
          {state.panel === 'dagsterAsset' && <DagsterAssetBox />}
          {state.panel === 'decision' && (<><DecisionTable /><NextChapterBox /></>)}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      const tabs = [
        { id: 'py', name: 'orchestrators.py' },
      ];

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {tabs.map((t) => (
                <span
                  key={t.id}
                  className={`text-[11px] font-mono px-2 py-0.5 rounded-t ${code.file === t.id ? 'bg-[#282c34] text-teal-300 border-t border-x border-slate-600' : 'text-slate-500'}`}
                >{t.name}</span>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="px-3 pt-1.5 text-[10px] text-slate-400 font-mono border-b border-slate-700/50">{code.filename}</div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-teal-400/15 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-teal-600 text-white font-bold">IV</span>
              <div>
                <h1 className="text-2xl font-bold text-teal-900">IV-2-1. Airflow vs Dagster vs 크론</h1>
                <p className="text-sm text-teal-800/80">오케스트레이터도 진화한다 — 태스크 중심에서 데이터 자산 중심으로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-teal-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-teal-800 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-teal-800 text-white' : 'bg-teal-600 text-white hover:bg-teal-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-500 bg-white px-4 py-3 text-sm text-teal-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                오케스트레이터 선택은 "강함"이 아니라 "복잡도에 맞는 위치"의 문제다.
                단일 작업·의존성 없음이면 크론으로 시작하고, 규모가 커지고 다양한 시스템을 엮어야 하면 Airflow(태스크 중심·성숙한 표준)를 쓴다.
                리니지·부분 실행·타입 체크가 핵심이고 데이터가 복잡하면 Dagster(데이터 자산 중심)가 빛난다 — "무엇을 실행하나"에서 "무엇을 만드나"로의 발상 전환이다.
                운영을 맡기려면 Cloud Composer·MWAA·Astronomer 같은 관리형을 고른다.
                다만 시장의 다수는 여전히 Airflow이고 마이그레이션은 공짜가 아니다 — Prefect·Mage도 후보로 두고, 다음 장에서 배포·운영으로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['오케스트레이션', 'Airflow', 'Dagster', '크론', 'DAG', '데이터자산', '리니지', 'CloudComposer', 'MWAA', 'Prefect'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-teal-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
