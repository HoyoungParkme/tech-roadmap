            '#   위 WHERE 가 그날 데이터만 정확히 재생성한다 → 멱등의 기반',
          ],
          highlight: [3, 5, 7, 9, 10, 11, 13, 15, 16, 17, 20, 21, 25, 26],
        },
      },
      {
        title: 'Step 5. 실전 DAG 조립 — 원천→스테이징→변환→적재',
        desc: '이제 배운 조각을 하나의 완성 DAG로 조립한다: 센서로 외부 CSV를 기다리고, 원천을 추출하고, 스테이징에 적재하고, SQL로 변환하고, DW에 적재한다. 실무에서 지켜야 할 두 원칙이 있다. 첫째는 멱등(idempotent) 태스크다(III-2-2 회수) — 같은 execution_date로 몇 번을 재실행해도 결과가 동일해야 재시도·백필이 안전하다. 그래서 적재는 append가 아니라 "그날 파티션을 지우고 다시 넣는(delete-insert)" 식으로 짠다. 둘째는 파라미터화 — 날짜·경로를 코드에 박지 말고 {{ ds }} 같은 템플릿으로 주입한다. DAG 설계 원칙은 "작게 나누고(태스크 하나=한 가지 일), 재시도 가능하게(retries·retry_delay)"다. 다음 장에서는 이 DAG가 실패했을 때 어떻게 알림·재시도·복구하는지(실패 처리)를 다룬다.',

        code: {
          lang: 'python', file: 'py',
          filename: 'etl_dag.py — ⑤ 완성 ETL DAG',
          lines: [
            '# ⑤ 완성: 원천→스테이징→변환→적재, 멱등 + 파라미터화',
            'from datetime import datetime, timedelta',
            'from airflow import DAG',
            'from airflow.decorators import task',
            'from airflow.sensors.filesystem import FileSensor',
            '',
            'default_args = {',
            '    "retries": 3,                       # 실패 시 3회 재시도',
            '    "retry_delay": timedelta(minutes=5),',
            '}',
            '',

            '    dag_id="etl_orders_daily",',

    // ─────────────────────────────────────────────────────
    // 좌: DAG 그래프 다이어그램 — 태스크(노드) + 의존성(엣지), 상태 애니메이션
    // ─────────────────────────────────────────────────────
    const OP_STYLE = {
      Python: 'bg-teal-100 text-teal-800 border-teal-300',
      SQL:    'bg-indigo-100 text-indigo-800 border-indigo-300',
      Sensor: 'bg-amber-100 text-amber-800 border-amber-300',
      Bash:   'bg-slate-100 text-slate-700 border-slate-300',
    };

    // 태스크 실행 상태 전이 애니메이션용 — 순서(레벨) 정의
    // 레벨0: extract, wait_file (병렬) → 레벨1: stage → 레벨2: transform → 레벨3: load
    const TASK_LEVEL = { extract: 0, wait_file: 0, stage: 1, transform: 2, load: 3 };

    function DagGraph({ highlightTasks, runStage }) {
      const hi = new Set(highlightTasks);
      // runStage: -1(정지) 또는 0~3 진행 레벨. 상태 판정
      const stateOf = (key) => {
        if (runStage < 0) return hi.has(key) ? 'ready' : 'idle';
        const lv = TASK_LEVEL[key];
        if (lv < runStage) return 'success';
        if (lv === runStage) return 'running';
        return 'wait';
      };
      const CELL = {
        idle:    'border-slate-200 bg-white opacity-60',
        ready:   'border-teal-400 bg-teal-50',
        wait:    'border-slate-300 bg-white text-slate-400',
        running: 'border-amber-500 bg-amber-50 shadow ring-2 ring-amber-300',
        success: 'border-emerald-500 bg-emerald-50',
      };
      const BADGE = { wait: '⏳ 대기', running: '▶ 실행', success: '✓ 성공', ready: '● 준비', idle: '· 대기' };
      const BADGE_C = {
        wait: 'text-slate-400', running: 'text-amber-700', success: 'text-emerald-700',
        ready: 'text-teal-600', idle: 'text-slate-300',
      };
      // 레벨별로 묶어서 병렬을 나란히
      const levels = [[], [], [], []];
      TASKS.forEach((t) => levels[TASK_LEVEL[t.key]].push(t));
      return (
        <div className="rounded-lg border-2 border-teal-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-teal-900 mb-2">🔗 ETL DAG — 태스크(노드) + 의존성(엣지)</div>
          <div className="space-y-1">
            {levels.map((lvTasks, li) => (
              <React.Fragment key={li}>
                {li > 0 && (
                  <div className="flex justify-center leading-none">
                    <span className={`text-[11px] ${runStage >= li ? 'text-teal-500' : 'text-slate-300'}`}>▼</span>
                  </div>
                )}
                <div className="flex gap-1.5 justify-center">
                  {lvTasks.map((t) => {
                    const st = stateOf(t.key);
                    return (
                      <div key={t.key} className={`flex-1 rounded-lg border-2 px-2 py-1.5 transition-all ${CELL[st]}`}>
                        <div className="flex items-center gap-1">
                          <span className="text-base">{t.icon}</span>
                          <span className={`text-[10px] font-bold ${st === 'idle' || st === 'wait' ? 'text-slate-500' : 'text-slate-800'}`}>{t.name}</span>
                        </div>
                        <div className="flex items-center justify-between mt-0.5">
                          <span className={`text-[8px] font-bold px-1 rounded border ${OP_STYLE[t.op]}`}>{t.op}</span>
                          <span className={`text-[9px] font-bold ${BADGE_C[st]}`}>{BADGE[st]}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 크론 vs DAG 비교
    // ─────────────────────────────────────────────────────
    function CronVsDagBox() {
      const [failed, setFailed] = useState(false);
      // failed=false: 추출 정상 / true: 추출 실패했지만 크론은 변환 강행
      const cronJobs = [
        { t: '02:00', name: 'extract.py', st: failed ? 'fail' : 'ok' },
        { t: '02:30', name: 'transform.py', st: failed ? 'garbage' : 'ok' },
        { t: '03:00', name: 'load.py', st: failed ? 'garbage' : 'ok' },
      ];
      const ST = {
        ok: 'bg-emerald-50 border-emerald-300 text-emerald-800',
        fail: 'bg-red-100 border-red-500 text-red-900',
        garbage: 'bg-amber-50 border-amber-400 text-amber-900',
      };
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-red-800">🧪 크론 — 추출이 실패하면?</div>
            <button
              onClick={() => setFailed((f) => !f)}
              className={`text-[10px] font-bold px-2 py-1 rounded border ${failed ? 'bg-red-600 text-white border-red-700' : 'bg-white text-red-700 border-red-400'}`}
            >{failed ? '■ 정상 복구' : '▶ 추출 실패 주입'}</button>
          </div>
          <div className="space-y-1">
            {cronJobs.map((j) => (
              <div key={j.name} className={`rounded border px-2 py-1 text-[10px] font-mono flex justify-between ${ST[j.st]}`}>
                <span>{j.t} · {j.name}</span>
                <span className="font-bold">
                  {j.st === 'ok' ? '✓ 정상' : j.st === 'fail' ? '✗ 실패' : '⚠️ 반쪽 데이터로 강행'}
                </span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-red-900">
            {failed
              ? '추출이 실패했는데도 크론은 시각(02:30)만 보고 변환을 실행 → 오염된 데이터가 DW까지 번진다. 크론은 "성공 여부"를 모른다.'
              : '평시엔 순서가 맞아 보인다. 문제는 "앞 작업이 실패하는 순간" 크론이 그걸 모른 채 뒤를 강행한다는 것.'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 오퍼레이터 종류 카드
    // ─────────────────────────────────────────────────────
    function OperatorsBox() {
      const rows = [
        { icon: '🐍', name: 'PythonOperator', op: 'Python', detail: '파이썬 함수 실행 · @task 로 간결화' },
        { icon: '💻', name: 'BashOperator', op: 'Bash', detail: '셸 명령 실행 (스크립트·CLI)' },
        { icon: '🗃️', name: 'SQLOperator', op: 'SQL', detail: 'DB에 쿼리 실행 (변환·적재)' },
        { icon: '⏳', name: 'Sensor', op: 'Sensor', detail: '외부 조건 대기 (파일·파티션·DAG)' },
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-300 bg-white p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">⚙️ 오퍼레이터 — 태스크가 실제로 하는 일</div>
          <div className="grid grid-cols-2 gap-1.5">
            {rows.map((r) => (
              <div key={r.name} className={`rounded border px-2 py-1.5 ${OP_STYLE[r.op]}`}>
                <div className="flex items-center gap-1.5">
                  <span>{r.icon}</span>
                  <span className="text-[11px] font-bold">{r.name}</span>
                </div>
                <div className="text-[9px] opacity-90 mt-0.5">{r.detail}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 rounded border border-teal-300 bg-teal-50 p-2 text-[10px] text-teal-900">
            <b>XCom</b>: @task 함수의 <span className="font-mono">return</span> 값은 XCom에 저장되어 다음 태스크가 인자로 받는다 — 태스크 간 <b>작은 데이터</b> 통로. 대용량은 스토리지 경로만 넘긴다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 실행 아키텍처 (Scheduler / Executor / Worker)
    // ─────────────────────────────────────────────────────
    function ArchitectureBox() {
      const layers = [
        { icon: '🧭', name: 'Scheduler', role: 'DAG 파싱 → 의존성 충족 태스크 큐잉', c: 'border-teal-400 bg-teal-50 text-teal-900' },
        { icon: '🚦', name: 'Executor', role: 'Local / Celery / Kubernetes 로 워커 배분', c: 'border-indigo-400 bg-indigo-50 text-indigo-900' },
        { icon: '🛠️', name: 'Worker', role: '실제 태스크 코드 실행', c: 'border-emerald-400 bg-emerald-50 text-emerald-900' },
      ];
      const execs = [
        { name: 'Local', d: '한 머신 프로세스 · 소규모' },
        { name: 'Celery', d: '여러 워커 분산 · 대규모' },
        { name: 'Kubernetes', d: '태스크마다 파드 · 격리·탄력' },
      ];
      const states = ['queued', 'running', 'success', 'failed', 'up_for_retry'];
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-400 bg-white p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">🏗️ 실행 아키텍처 — 3역할 분업</div>
          <div className="space-y-1">
            {layers.map((l, i) => (
              <React.Fragment key={l.name}>
                {i > 0 && <div className="flex justify-center leading-none"><span className="text-[11px] text-teal-500">▼</span></div>}
                <div className={`rounded-lg border-2 px-2 py-1.5 flex items-center gap-2 ${l.c}`}>
                  <span className="text-base">{l.icon}</span>
                  <span className="text-[11px] font-bold w-20">{l.name}</span>
                  <span className="text-[10px] opacity-90 flex-1">{l.role}</span>
                </div>
              </React.Fragment>
            ))}
          </div>
          <div className="mt-2 grid grid-cols-3 gap-1.5">
            {execs.map((e) => (
              <div key={e.name} className="rounded border border-indigo-200 bg-indigo-50 px-1.5 py-1">
                <div className="text-[10px] font-bold text-indigo-800">{e.name}</div>
                <div className="text-[8px] text-indigo-700">{e.d}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 flex items-center flex-wrap gap-1 text-[9px]">
            <span className="text-slate-600 font-bold">태스크 상태:</span>
            {states.map((s, i) => (
              <React.Fragment key={s}>
                {i > 0 && <span className="text-slate-400">→</span>}
                <span className={`px-1.5 py-0.5 rounded border font-mono ${s === 'success' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : s === 'failed' ? 'bg-red-100 text-red-800 border-red-300' : s === 'running' ? 'bg-amber-100 text-amber-800 border-amber-300' : 'bg-slate-100 text-slate-700 border-slate-300'}`}>{s}</span>
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 최종 DAG 요약 (멱등·파라미터화·설계 원칙)
    // ─────────────────────────────────────────────────────
    function FinalDagBox() {
      const principles = [
        { icon: '♻️', name: '멱등 태스크', d: 'delete-insert · 몇 번 재실행해도 동일 (III-2-2)' },
        { icon: '🔧', name: '파라미터화', d: '{{ ds }} 템플릿 · 날짜·경로 주입' },
        { icon: '🧩', name: '작게 나누기', d: '태스크 1개 = 한 가지 일' },
        { icon: '🔁', name: '재시도 가능', d: 'retries · retry_delay 설정' },
      ];
      return (
        <div className="mt-3 space-y-2">
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-3">
            <div className="text-xs font-bold text-emerald-900 mb-2">✅ 프로덕션 DAG 설계 원칙</div>
            <div className="grid grid-cols-2 gap-1.5">
              {principles.map((p) => (
                <div key={p.name} className="rounded border border-emerald-200 bg-emerald-50 px-2 py-1.5">
                  <div className="flex items-center gap-1">
                    <span>{p.icon}</span>
                    <span className="text-[11px] font-bold text-emerald-900">{p.name}</span>
                  </div>
                  <div className="text-[9px] text-emerald-800 mt-0.5">{p.d}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-teal-500 bg-gradient-to-br from-teal-50 to-emerald-50 p-3">
            <div className="text-xs font-bold text-teal-900 mb-1">▶ 다음 장 — IV-1-2 실패 처리</div>
            <div className="text-[10px] text-teal-900">이 DAG가 실패하면? 알림(Slack·이메일)·자동 재시도·부분 재실행·SLA 감시로 복구하는 법을 다룬다. 지금 DAG를 "재시도 가능"하게 짠 것이 그 토대다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-teal-50',    border: 'border-teal-300',    text: 'text-teal-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — DAG 그래프 + 단계별 특수 패널 (teal 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      cron:     { icon: '⏰', label: '크론 (무질서)' },
      dag:      { icon: '🔗', label: 'DAG 구조' },
      operator: { icon: '⚙️', label: '오퍼레이터' },
      exec:     { icon: '🏗️', label: '실행 모델' },
      final:    { icon: '✅', label: '완성 DAG' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.dag;
      // 태스크 상태 전이 애니메이션 — DAG 그래프가 보이는 단계에서만
      const showsGraph = state.panel !== 'cronVsDag';
      const [runStage, setRunStage] = useState(-1);
      useEffect(() => {
        if (!showsGraph) { setRunStage(-1); return; }
        setRunStage(0);
        const timer = setInterval(() => {
          setRunStage((s) => (s >= 3 ? 0 : s + 1));
        }, 1100);
        return () => clearInterval(timer);
      }, [showsGraph, state.panel]);

      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-teal-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>오케스트레이션 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-teal-700 font-mono mb-2 px-2 py-1 rounded bg-teal-50 border border-teal-200">
            현재 처리: {state.engineDetail}
          </div>

          {showsGraph && <DagGraph highlightTasks={state.highlightTasks} runStage={runStage} />}

          {state.panel === 'cronVsDag' && <CronVsDagBox />}
          {state.panel === 'operators' && <OperatorsBox />}
          {state.panel === 'architecture' && <ArchitectureBox />}
          {state.panel === 'finalDag' && <FinalDagBox />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      const tabs = [
        { id: 'py', name: 'etl_dag.py' },
      ];

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {tabs.map((t) => (
                <span
                  key={t.id}
                  className={`text-[11px] font-mono px-2 py-0.5 rounded-t ${code.file === t.id ? 'bg-[#282c34] text-teal-300 border-t border-x border-slate-600' : 'text-slate-500'}`}
                >{t.name}</span>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="px-3 pt-1.5 text-[10px] text-slate-400 font-mono border-b border-slate-700/50">{code.filename}</div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-teal-400/15 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-teal-600 text-white font-bold">Ⅳ</span>
              <div>
                <h1 className="text-2xl font-bold text-teal-900">IV-1-1. Airflow DAG 해부</h1>
                <p className="text-sm text-teal-800/80">크론으로는 안 되는 이유 — 의존성이 있는 작업들을 그래프로 지휘하기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-teal-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-teal-800 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-teal-800 text-white' : 'bg-teal-600 text-white hover:bg-teal-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-500 bg-white px-4 py-3 text-sm text-teal-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                크론은 "시각"만 알 뿐 작업 사이의 의존성·성공 여부·재시도·모니터링을 모른다 — 그래서 오케스트레이터가 필요하다.
                Airflow의 단위는 DAG(방향 비순환 그래프)로, 태스크(노드)와 의존성(엣지)을 <span className="font-mono">task1 &gt;&gt; task2</span>로 "선언"하면 스케줄러가 순서·병렬·대기를 스스로 판단한다.
                각 노드는 오퍼레이터(Python·Bash·SQL·Sensor)로 실제 일을 하고, XCom으로 태스크 간 작은 데이터를 넘긴다.
                실행은 스케줄러(파싱·큐잉)+익스큐터(Local/Celery/K8s)+워커로 분업하며, execution_date(논리적 실행일)가 백필의 파티션 경계가 된다.
                프로덕션 DAG는 멱등·파라미터화·작은 태스크·재시도 가능을 지켜야 한다 — 다음 장은 실패 처리다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Airflow', 'DAG', '오케스트레이션', 'Operator', 'Sensor', 'TaskFlow', 'XCom', 'execution_date', 'Executor', '멱등성'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-teal-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
