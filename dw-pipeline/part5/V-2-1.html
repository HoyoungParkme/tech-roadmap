  <!--
    DW Pipeline V-2-1 — 비용·성능: 파티셔닝·클러스터링
    학습 목표: 클라우드 DW는 "스캔한 데이터량"으로 과금된다는 사실을 실감하고,
              파티셔닝(파티션 프루닝)·클러스터링(블록 프루닝)·열 지향 포맷·
              결과 캐시/구체화 뷰로 같은 쿼리의 스캔량을 100배까지 줄이는
              비용 최적화 전략을 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 스캔 블록 그리드 프루닝 애니메이션 + 비용 게이지
                       + 행 vs 열 저장 읽기 비교 + 최적화 체크리스트)
                       우(VSCode CodeViewer: partitioning.sql 진화)
    색상: teal (data 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 스캔 대상 테이블 모델 — orders_fact: 3년치 = 36개월 파티션
    //   요금 가정: BigQuery on-demand $6.25 / TB 스캔 (환율 1,300원 가정)
    //   전체 크기: 3.6 TB (월 100 GB × 36)
    // ─────────────────────────────────────────────────────
    const PRICE_PER_TB_USD = 6.25;       // 스캔 1 TB 당 요금(달러)
    const KRW = 1300;                    // 환율 가정
    const MONTH_GB = 100;                // 파티션(월) 하나의 크기(GB)
    const TOTAL_MONTHS = 36;             // 3년치
    const TOTAL_TB = (MONTH_GB * TOTAL_MONTHS) / 1000; // 3.6 TB

    // GB 스캔량 → 비용(원) 환산
    function costKrw(scanGb) {
      const tb = scanGb / 1000;
      return Math.round(tb * PRICE_PER_TB_USD * KRW);
    }

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    //   scanGb : 좌측 게이지가 표현할 "이 단계에서 실제로 읽는 양(GB)"
    //   panel  : 좌측 특수 패널 종류
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 스캔량 = 비용 — 클라우드 DW는 읽은 만큼 청구한다',
        desc: '온프렘 DB는 서버를 사 두면 쿼리를 아무리 날려도 추가 요금이 없다. 하지만 BigQuery·Snowflake 같은 클라우드 DW는 근본이 다르다 — "스캔한 데이터량"이 그대로 청구서가 된다(BigQuery on-demand는 스캔 1 TB당 약 $6.25). 문제는 분석가가 무심코 던지는 "지난주 매출" 쿼리다. WHERE 절에 날짜를 걸었더라도, 테이블이 그냥 쌓여만 있으면 엔진은 3년치 3.6 TB 전체를 읽고 나서 필터링한다. 필요한 건 7일치인데 요금은 1,095일치로 나온다 — 100배 넘게 낭비되는 것이다. 그래서 클라우드 DW 최적화의 제1원칙은 "스캔량을 줄이는 것"이고, 그 첫 무기가 다음 단계의 파티셔닝이다.',
        panel: 'fullscan',
        scanGb: MONTH_GB * TOTAL_MONTHS, // 3.6 TB 풀스캔
        wantGb: MONTH_GB / 4,            // 실제로 원한 건 약 1주치(≈25GB)
        stage: 'fullscan',
        actor: '⚠️ 풀스캔 — 3년치 전체를 읽는다',
        alert: { tone: 'danger', text: '클라우드 DW는 "읽은 데이터량"으로 과금된다. WHERE로 걸러도 물리적으로 정리돼 있지 않으면 엔진은 전체를 스캔한 뒤 필터한다. 원하는 건 1주치인데 3년치 요금이 나오는 이유다.' },
        code: {
          lang: 'sql', file: 'sql',
          filename: 'partitioning.sql — ① 풀스캔 비용 확인',

            '-- partitioning.sql',
            '-- ① 스캔량 = 비용: 클라우드 DW(BigQuery)는 읽은 바이트로 과금',

            'FROM   dw.orders_fact                 -- 3년치 = 3.6 TB',

            'GROUP  BY d;',
            '',
            '-- 실행 전 반드시 스캔량을 예측한다 (dry-run):',

            '--',

      },
      {
        title: 'Step 2. 파티셔닝 — 날짜로 물리 분할하고 필요한 조각만 읽는다',
        desc: '파티셔닝은 한 테이블을 파티션 키(대개 날짜)를 기준으로 여러 물리 조각으로 쪼개는 것이다. 이렇게 해 두면 WHERE ordered_at BETWEEN ... 조건을 만난 엔진이 해당 날짜 파티션만 골라 읽고 나머지는 건드리지 않는다 — 이것을 파티션 프루닝(partition pruning)이라 부른다. 방금 3.6 TB를 읽던 "지난주 매출"이 7일치 파티션 ≈ 25 GB만 읽게 되어 비용이 144배 줄어든다. 파티션 키는 "쿼리가 항상 거는 필터 컬럼"으로 잡아야 하고, 거의 항상 시간(일/월)이 정답이다. 단, 너무 잘게 쪼개면(예: 초 단위) 파티션 수가 폭발하고 각 조각이 작은 파일 수천 개로 흩어져 메타데이터 관리 비용과 스캔 오버헤드가 오히려 커진다 — 이 과파티셔닝의 함정을 늘 경계해야 한다.',
        panel: 'prune',
        scanGb: MONTH_GB,               // 최근 1개월 파티션만
        wantGb: MONTH_GB,
        prunedMonths: 1,                // 켜지는 파티션 개수(최근 1개월)
        stage: 'partition',
        actor: '📦 파티션 프루닝 — 해당 조각만',
        alert: { tone: 'good', text: '파티션 프루닝: WHERE의 날짜 범위에 걸린 파티션만 읽고 나머지는 스킵한다. 파티션 키는 "쿼리가 늘 거는 필터"(대개 날짜)로. 단 과파티셔닝(초·분 단위)은 작은 파일 폭증 → 오히려 느려진다.' },
        code: {
          lang: 'sql', file: 'sql',
          filename: 'partitioning.sql — ② 파티션 테이블',

            '-- partitioning.sql',

      {

        desc: '파티셔닝이 큰 단위(날짜)로 잘랐다면, 클러스터링은 파티션 내부를 자주 필터하는 컬럼(예: region)으로 정렬·군집화하는 세부 무기다. 같은 region의 행들이 물리적으로 모여 있으면, 엔진은 각 데이터 블록의 min/max 통계를 보고 "이 블록엔 찾는 region이 없다"고 판단해 통째로 건너뛴다 — 이것이 블록 프루닝이다. 그래서 실전 설계는 둘의 조합이다: 파티션(날짜)으로 먼저 큰 덩어리를 자르고, 클러스터(region·user_id)로 그 안을 다시 좁힌다. 주의할 점은 카디널리티다 — 값 종류가 너무 적으면(예: 성별) 군집 효과가 없고, 반대로 거의 유니크하면(예: 주문 ID) 정렬 이득이 흩어진다. region처럼 "적당히 다양하고 자주 필터하는" 컬럼이 클러스터 키의 정석이다.',
        panel: 'cluster',

        wantGb: MONTH_GB / 4,

        stage: 'cluster',
        actor: '🧲 블록 프루닝 — 파티션 안까지',

            '',
            '-- 파티션(날짜) + 클러스터(region) 를 함께 건다',

            'PARTITION BY DATE(ordered_at)          -- 큰 단위: 날짜로 자르고',

    // ─────────────────────────────────────────────────────
    // 좌: 스캔 블록 그리드 — 3년치(36개월) 파티션을 6×6 격자로 표현
    //   단계에 따라 "실제로 읽는 칸" 이 줄어드는 것을 색으로 보인다
    // ─────────────────────────────────────────────────────
    function ScanGrid({ stage, prunedMonths }) {
      // stage 별로 칸 상태 결정
      //   fullscan : 36칸 전부 읽음(빨강)
      //   partition: 최근 prunedMonths 칸만(teal), 나머지 스킵(회색)
      //   cluster  : 읽는 칸 안에서도 일부 블록만(진한 teal + 얇은 칸)
      //   format   : 컬럼 프루닝 → 읽는 칸을 더 옅게(적은 바이트)
      //   summary  : 구체화 뷰 → 거의 안 읽음(1칸만 반짝)
      const total = TOTAL_MONTHS;
      const cells = Array.from({ length: total }, (_, i) => i);
      // 최근 개월이 격자의 "끝" 쪽에 오도록 (index 큰 쪽이 최신)
      const readFrom = total - (prunedMonths || 0);

      function cellClass(i) {
        if (stage === 'fullscan') return 'bg-red-400 border-red-500';
        const isRecent = i >= readFrom;
        if (!isRecent) return 'bg-slate-100 border-slate-200';   // 프루닝된 파티션
        // 최근 파티션 = 읽는 대상. 단계별로 "얼마나" 읽는지 농도로 표현
        if (stage === 'partition') return 'bg-teal-400 border-teal-500';
        if (stage === 'cluster')   return 'bg-teal-500 border-teal-600 opacity-60'; // 블록 일부
        if (stage === 'format')    return 'bg-teal-400 border-teal-500 opacity-30'; // 컬럼만
        if (stage === 'summary')   return 'bg-emerald-400 border-emerald-500 opacity-40';
        return 'bg-teal-400 border-teal-500';
      }

      return (
        <div className="rounded-lg border-2 border-teal-300 bg-white p-2.5">
          <div className="flex items-center justify-between mb-2">
            <div className="text-[11px] font-bold text-teal-900">🗂️ orders_fact — 36개월 파티션 (칸 1개 ≈ {MONTH_GB}GB)</div>
            <div className="flex items-center gap-2 text-[9px]">
              <span className="flex items-center gap-0.5"><span className="w-2.5 h-2.5 rounded-sm bg-red-400 inline-block"></span>읽음</span>
              <span className="flex items-center gap-0.5"><span className="w-2.5 h-2.5 rounded-sm bg-teal-400 inline-block"></span>선택</span>
              <span className="flex items-center gap-0.5"><span className="w-2.5 h-2.5 rounded-sm bg-slate-100 border border-slate-300 inline-block"></span>스킵</span>
            </div>
          </div>
          <div className="grid grid-cols-6 gap-1">
            {cells.map((i) => (
              <div
                key={i}
                className={`aspect-square rounded-sm border transition-all duration-500 ${cellClass(i)}`}
                title={`파티션 ${i + 1}/${total}`}
              />
            ))}
          </div>
          <div className="mt-2 text-[10px] text-slate-600">
            {stage === 'fullscan' && '❌ 전체 36칸을 모두 스캔 — WHERE를 걸어도 물리 정리가 없으면 전부 읽는다.'}
            {stage === 'partition' && '✅ 파티션 프루닝 — 최근 1칸(파티션)만 읽고 35칸은 통째로 스킵.'}
            {stage === 'cluster' && '✅ 블록 프루닝 — 읽는 파티션 "안" 에서도 region 블록만(옅은 칸=적게 읽음).'}
            {stage === 'format' && '✅ 컬럼 프루닝 — 열 지향이라 참조한 2개 컬럼만(더 옅은 칸=더 적게).'}
            {stage === 'summary' && '✅ 구체화 뷰/캐시 — 미리 집계된 결과를 재사용, 원본은 거의 안 읽는다.'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 비용 게이지 — scanGb 를 전체(3.6TB) 대비 비율과 원화 비용으로
    // ─────────────────────────────────────────────────────
    function CostGauge({ scanGb }) {
      const totalGb = MONTH_GB * TOTAL_MONTHS;
      const pct = Math.max(1.2, (scanGb / totalGb) * 100); // 최소 1.2%는 보이게
      const won = costKrw(scanGb);
      const fullWon = costKrw(totalGb);
      const factor = won > 0 ? Math.round(fullWon / won) : fullWon;
      const scanLabel = scanGb >= 1000
        ? `${(scanGb / 1000).toFixed(2)} TB`
        : `${scanGb < 1 ? scanGb.toFixed(2) : Math.round(scanGb)} GB`;
      const danger = pct > 50;
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-teal-900">💰 이 쿼리의 스캔량 → 청구액</div>

              <div className={`h-full transition-all duration-700 ${danger ? 'bg-red-500' : 'bg-teal-500'}`} style={{ width: `${pct}%` }} />
            </div>
            <span className={`text-[11px] font-mono font-bold w-16 text-right ${danger ? 'text-red-700' : 'text-teal-700'}`}>{scanLabel}</span>

          <div className="grid grid-cols-3 gap-2 mt-2 text-center">
            <div className="rounded border border-slate-200 bg-slate-50 p-1.5">
              <div className="text-[9px] text-slate-500">청구액</div>
              <div className={`text-sm font-bold ${danger ? 'text-red-700' : 'text-teal-700'}`}>{won.toLocaleString()}원</div>
            </div>
            <div className="rounded border border-slate-200 bg-slate-50 p-1.5">
              <div className="text-[9px] text-slate-500">풀스캔 대비</div>
              <div className="text-sm font-bold text-slate-700">1/{factor}</div>
            </div>
            <div className="rounded border border-slate-200 bg-slate-50 p-1.5">
              <div className="text-[9px] text-slate-500">풀스캔이면</div>
              <div className="text-sm font-bold text-slate-500 line-through">{fullWon.toLocaleString()}원</div>
            </div>
          </div>
        </div>
      );
    }

          </div>
          <div className="mt-2 text-[10px] text-slate-600">
            열 지향은 참조 컬럼만 읽는 데다(컬럼 프루닝), 같은 컬럼끼리 모여 압축·인코딩이 잘 먹혀 물리 바이트까지 준다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 블록 프루닝 설명 미니 도해
    // ─────────────────────────────────────────────────────
    function BlockPruneBox() {
      const blocks = [
        { range: 'BUSAN~DAEGU', hit: false },
        { range: 'GWANGJU~INCHEON', hit: false },
        { range: 'SEJONG~SEOUL', hit: true },
        { range: 'SUWON~ULSAN', hit: false },
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-400 bg-white p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">🧲 블록 프루닝 — WHERE region = 'SEOUL'</div>
          <div className="text-[9px] text-slate-500 mb-1.5">파티션(최근 1개월) 안이 region으로 정렬됨 → 블록마다 min/max 기록</div>
          <div className="space-y-1">
            {blocks.map((b) => (
              <div key={b.range} className={`flex items-center justify-between rounded border px-2 py-1 text-[10px] font-mono ${b.hit ? 'bg-teal-100 border-teal-400 text-teal-900' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                <span>블록 [{b.range}]</span>
                <span className="font-bold">{b.hit ? "✓ 'SEOUL' 포함 → 읽음" : "✗ 범위 밖 → 스킵"}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-teal-900">
            4개 블록 중 1개만 읽는다. 정렬돼 있으니 min/max만 보고 나머지를 통째로 건너뛴다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 최적화 종합 체크리스트
    // ─────────────────────────────────────────────────────
    function SummaryBox() {
      const rows = [
        { icon: '📦', name: '파티셔닝', saves: '스캔 파티션', tip: '키=늘 거는 날짜' },
        { icon: '🧲', name: '클러스터링', saves: '파티션 내 블록', tip: '키=자주 거는 필터' },
        { icon: '🧱', name: '열 지향+압축', saves: '읽는 컬럼·바이트', tip: 'Parquet/ORC' },
        { icon: '♻️', name: '결과 재사용', saves: '반복 계산', tip: '캐시·구체화뷰·집계' },
        { icon: '📈', name: '모니터링·리뷰', saves: '실수·낭비', tip: 'JOBS 스캔 랭킹' },
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-500 bg-gradient-to-br from-teal-50 to-emerald-50 p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">🧾 비용 최적화 종합 — 스캔을 반복하지 않게</div>
          <div className="space-y-1">
            {rows.map((r) => (
              <div key={r.name} className="flex items-center gap-2 rounded border border-teal-200 bg-white px-2 py-1">
                <span>{r.icon}</span>
                <span className="text-[11px] font-bold text-teal-900 w-24">{r.name}</span>
                <span className="text-[9px] text-red-700 flex-1">{r.saves} ↓</span>
                <span className="text-[9px] text-slate-500 font-mono">{r.tip}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-teal-900">
            <b>스토리지는 싸고 컴퓨트(스캔)는 비싸다.</b> 집계 테이블은 II-2-2 그레인 설계의 회수 지점 — 다음 장 운영 종합으로 이어진다.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-teal-50',    border: 'border-teal-300',    text: 'text-teal-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 스캔 그리드 + 비용 게이지 + 단계별 특수 패널 (teal 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      fullscan:  { icon: '⚠️', label: '풀스캔' },
      partition: { icon: '📦', label: '파티셔닝' },
      cluster:   { icon: '🧲', label: '클러스터링' },
      format:    { icon: '🧱', label: '열 지향 포맷' },
      summary:   { icon: '🧾', label: '비용 종합' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.stage] || ENGINE_BADGE.fullscan;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-teal-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>스캔량 시뮬레이터 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-teal-700 font-mono mb-2 px-2 py-1 rounded bg-teal-50 border border-teal-200">
            같은 쿼리 · 스캔 대상: orders_fact (3년치 3.6 TB)
          </div>

          <ScanGrid stage={state.stage} prunedMonths={state.prunedMonths} />
          <CostGauge scanGb={state.scanGb} />

          {state.panel === 'fullscan' && <FullscanBox scanGb={state.scanGb} wantGb={state.wantGb} />}
          {state.panel === 'cluster' && <BlockPruneBox />}
          {state.panel === 'format' && <RowVsColBox />}
          {state.panel === 'summary' && <SummaryBox />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      const tabs = [
        { id: 'sql', name: 'partitioning.sql' },
        { id: 'py', name: 'cost_review.py' },
      ];

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {tabs.map((t) => (
                <span
                  key={t.id}
                  className={`text-[11px] font-mono px-2 py-0.5 rounded-t ${code.file === t.id ? 'bg-[#282c34] text-teal-300 border-t border-x border-slate-600' : 'text-slate-500'}`}
                >{t.name}</span>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="px-3 pt-1.5 text-[10px] text-slate-400 font-mono border-b border-slate-700/50">{code.filename}</div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-teal-400/15 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-teal-600 text-white font-bold">DW</span>
              <div>
                <span className="inline-block text-[10px] font-bold text-teal-700 bg-teal-100 border border-teal-300 rounded px-1.5 py-0.5 mb-1">Part V · 운영 — 비용·성능</span>
                <h1 className="text-2xl font-bold text-teal-900">V-2-1. 비용·성능 — 파티셔닝·클러스터링</h1>
                <p className="text-sm text-teal-800/80">같은 쿼리, 100배 싼 청구서 — 클라우드 DW에서 스캔량이 곧 돈이다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-teal-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-teal-800 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-teal-800 text-white' : 'bg-teal-600 text-white hover:bg-teal-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-500 bg-white px-4 py-3 text-sm text-teal-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                클라우드 DW는 "스캔한 데이터량"으로 과금된다 — 최적화의 제1원칙은 스캔량을 줄이는 것이다.
                파티셔닝(날짜)으로 큰 덩어리를 자르고, 클러스터링(필터 컬럼)으로 파티션 안 블록을 프루닝하고, 열 지향 포맷(Parquet)으로 참조 컬럼만 읽는다.
                그 위에 결과 캐시·구체화 뷰·집계 테이블(II-2-2 그레인 회수)로 같은 계산의 반복을 없앤다.
                마지막은 사람과 문화다 — 비용 대시보드 모니터링, 파티션 필터 누락을 잡는 쿼리 리뷰, 워크로드에 맞는 슬롯/웨어하우스 크기.
                스토리지는 싸고 컴퓨트(스캔)는 비싸다 — 설계는 결국 "스캔을 반복하지 않게" 만드는 일이다. 다음 장 운영 종합으로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['비용최적화', '파티셔닝', '파티션프루닝', '클러스터링', '블록프루닝', 'Parquet', '열지향', '구체화뷰', '결과캐시', 'BigQuery', 'Snowflake', '스캔량과금'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-teal-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
