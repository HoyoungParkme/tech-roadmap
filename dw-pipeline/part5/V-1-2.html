    패턴: fastapi v1 — 좌(LiveDataPane: 리니지 그래프 + 컬럼 영향 분석 애니메이션 + 카탈로그 검색 목업 + 거버넌스 통합도)

    const { useState, useEffect, useRef } = React;

    // 리니지 그래프 노드 정의 — 원천에서 최종 지표까지의 흐름
    //   key    : 노드 식별자
    //   layer  : 계층 (src/ods/dw/dm)
    //   col     : 이 예제에서 추적할 대표 컬럼
    //   ups     : 상류(이 노드를 만든 부모) 노드 key 배열
    // ─────────────────────────────────────────────────────
    const NODES = [
      { key: 'stg_orders',   icon: '📥', layer: 'staging', name: 'stg_orders',       col: 'amount', ups: [] },
      { key: 'stg_customers',icon: '📥', layer: 'staging', name: 'stg_customers',    col: 'region', ups: [] },
      { key: 'dim_customer', icon: '🧩', layer: 'dw',      name: 'dim_customer',     col: 'region', ups: ['stg_customers'] },
      { key: 'fct_orders',   icon: '🏛️', layer: 'dw',      name: 'fct_orders',       col: 'amount', ups: ['stg_orders'] },
      { key: 'sales_region', icon: '📊', layer: 'dm',      name: 'mart_sales_region',col: 'revenue',ups: ['fct_orders', 'dim_customer'] },
      { key: 'exec_dash',    icon: '📈', layer: 'bi',      name: '임원 매출 대시보드', col: 'revenue',ups: ['sales_region'] },
    ];
    const NODE_IDX = Object.fromEntries(NODES.map((n, i) => [n.key, i]));

    // 하류(자식) 관계를 역산 — 영향 분석에 쓴다
    const DOWNSTREAM = {};
    NODES.forEach((n) => { DOWNSTREAM[n.key] = []; });
    NODES.forEach((n) => n.ups.forEach((u) => DOWNSTREAM[u].push(n.key)));

    // 특정 노드의 모든 하류(재귀) 를 모은다 — 컬럼 변경 영향 범위
    function collectDownstream(startKey) {
      const out = [];
      const walk = (k) => DOWNSTREAM[k].forEach((c) => { if (!out.includes(c)) { out.push(c); walk(c); } });
      walk(startKey);
      return out;
    }
    // 특정 노드의 모든 상류(재귀) 를 모은다 — 디버깅(출처 추적)
    function collectUpstream(startKey) {
      const out = [];
      const walk = (k) => NODES[NODE_IDX[k]].ups.forEach((u) => { if (!out.includes(u)) { out.push(u); walk(u); } });
      walk(startKey);
      return out;
    }

      const results = [
        { table: 'fct_orders', desc: '주문 팩트 — 건별 매출/수량 단일 진실', owner: 'data-platform', pop: 1420, q: 0.98, tags: ['core', 'certified'], good: true },
        { table: 'mart_sales_region', desc: '지역×월 매출 집계 (마케팅)', owner: 'marketing-de', pop: 860, q: 0.95, tags: ['finance'], good: true },
        { table: 'tmp_sales_2019_bak', desc: '(설명 없음)', owner: 'unknown', pop: 0, q: 0.0, tags: ['stale'], good: false },
      ];
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-400 bg-white p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">🔎 데이터 카탈로그 — 분석가가 스스로 검색 (self-serve)</div>
          <div className="flex items-center gap-2 rounded border border-teal-300 bg-teal-50 px-2 py-1.5 mb-2">
            <span>🔍</span>
            <span className="text-[11px] font-mono text-teal-900">매출</span>
            <span className="ml-auto text-[9px] text-slate-500">DataHub · 3건</span>
          </div>
          <div className="space-y-1.5">
            {results.map((r) => (
              <div key={r.table} className={`rounded border px-2 py-1.5 ${r.good ? 'border-teal-200 bg-teal-50' : 'border-slate-300 bg-slate-50 opacity-80'}`}>
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-mono font-bold text-slate-800">{r.table}</span>
                  <span className="flex gap-1">
                    {r.tags.map((t) => (
                      <span key={t} className={`text-[8px] px-1 rounded ${t === 'certified' ? 'bg-emerald-200 text-emerald-800' : t === 'stale' ? 'bg-red-200 text-red-800' : 'bg-slate-200 text-slate-700'}`}>{t}</span>
                    ))}
                  </span>
                </div>
                <div className="text-[9px] text-slate-600 mt-0.5">{r.desc}</div>
                <div className="flex gap-2 text-[9px] mt-1 font-mono">
                  <span className="text-slate-500">👤 {r.owner}</span>
                  <span className={r.pop > 0 ? 'text-teal-700' : 'text-red-600'}>🔥 인기 {r.pop}</span>
                  <span className={r.q > 0.9 ? 'text-emerald-700' : 'text-red-600'}>✓ 품질 {r.q.toFixed(2)}</span>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-teal-800">→ 인기도·품질로 <b>신뢰할 테이블</b>(위)과 <b>정리할 테이블</b>(아래)이 한눈에 갈린다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 거버넌스 통합도 + PII 전파
    // ─────────────────────────────────────────────────────
    function GovernanceBox() {
      const pillars = [
        { icon: '🗂️', name: '카탈로그', q: '무엇이 있나', tone: 'bg-teal-100 text-teal-800 border-teal-300' },
        { icon: '🧭', name: '리니지', q: '어떻게 흐르나', tone: 'bg-sky-100 text-sky-800 border-sky-300' },
        { icon: '✅', name: '품질 (V-1-1)', q: '믿을 수 있나', tone: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
        { icon: '🔒', name: '접근 제어', q: '누가 봐도 되나', tone: 'bg-indigo-100 text-indigo-800 border-indigo-300' },
      ];
      const reach = ['dim_customer', 'mart_sales_region', 'exec_dashboard'];
      return (
        <div className="mt-3 space-y-2">
          <div className="rounded-lg border-2 border-teal-500 bg-gradient-to-br from-teal-50 to-emerald-50 p-3">
            <div className="text-xs font-bold text-teal-900 mb-2">🛡️ 데이터 거버넌스 — 네 기둥의 수렴</div>
            <div className="grid grid-cols-4 gap-1.5">
              {pillars.map((p) => (
                <div key={p.name} className={`rounded border px-1.5 py-1.5 text-center ${p.tone}`}>
                  <div className="text-base">{p.icon}</div>
                  <div className="text-[9px] font-bold leading-tight">{p.name}</div>
                  <div className="text-[8px] opacity-80">{p.q}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-rose-300 bg-white p-3">
            <div className="text-xs font-bold text-rose-900 mb-1.5">🏷️ PII 태깅 → 리니지 따라 자동 전파 (규제 대응)</div>
            <div className="flex items-center gap-1 text-[9px] font-mono flex-wrap">
              <span className="px-1.5 py-0.5 rounded bg-rose-200 text-rose-900 border border-rose-400 font-bold">🔴 stg_customers.email</span>
              <span className="text-rose-400">→ 전파 →</span>
              {reach.map((r) => (
                <span key={r} className="px-1.5 py-0.5 rounded bg-rose-50 text-rose-800 border border-rose-300">{r}</span>
              ))}
            </div>
            <div className="text-[10px] text-rose-800 mt-1.5">→ "이 개인정보가 어디까지 퍼졌나?" GDPR 삭제요청·감사에 자동으로 답한다.</div>
          </div>
          <div className="rounded-lg border border-slate-300 bg-slate-50 px-2.5 py-2 text-[10px] text-slate-700">
            한 걸음 더: <b>데이터 메시</b>(도메인이 데이터를 제품처럼 소유) · <b>데이터 계약</b>(생산자·소비자가 스키마를 계약으로 못 박음). <span className="text-teal-800">다음 장(V-1-3): 이 관리 대상을 비용·성능으로 본다.</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-teal-50',    border: 'border-teal-300',    text: 'text-teal-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 리니지 그래프 + 단계별 특수 패널 (teal 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      chaos:      { icon: '🌫️', label: '미궁' },
      lineage:    { icon: '🧭', label: '리니지' },
      generation: { icon: '⚙️', label: '자동 추출' },
      catalog:    { icon: '🔎', label: '카탈로그' },
      governance: { icon: '🛡️', label: '거버넌스' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.chaos;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-teal-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>리니지·카탈로그 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-teal-700 font-mono mb-2 px-2 py-1 rounded bg-teal-50 border border-teal-200">
            현재 처리: {state.engineDetail}
          </div>

          <LineageGraph focus={state.focus} mode={state.mode} pivot={state.pivot} />

          {state.panel === 'chaos' && <ChaosBox />}
          {state.panel === 'lineageOnly' && <LineageDetailBox />}
          {state.panel === 'generation' && <GenerationBox />}
          {state.panel === 'catalog' && <CatalogSearchBox />}
          {state.panel === 'governance' && <GovernanceBox />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      const tabs = [
        { id: 'py', name: 'lineage_catalog.py' },
      ];

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {tabs.map((t) => (
                <span
                  key={t.id}
                  className={`text-[11px] font-mono px-2 py-0.5 rounded-t ${code.file === t.id ? 'bg-[#282c34] text-teal-300 border-t border-x border-slate-600' : 'text-slate-500'}`}
                >{t.name}</span>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="px-3 pt-1.5 text-[10px] text-slate-400 font-mono border-b border-slate-700/50">{code.filename}</div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-teal-400/15 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-teal-600 text-white font-bold">V</span>
              <div>
                <h1 className="text-2xl font-bold text-teal-900">V-1-2. 리니지·카탈로그</h1>
                <p className="text-sm text-teal-800/80">이 지표는 어디서 왔나, 이 컬럼을 바꾸면 뭐가 깨지나 — 데이터의 족보와 지도</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-teal-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-teal-800 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-teal-800 text-white' : 'bg-teal-600 text-white hover:bg-teal-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-500 bg-white px-4 py-3 text-sm text-teal-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                수백 테이블·수천 컬럼의 미궁에서 "이 값 어디서 왔나(디버깅)"와 "이걸 바꾸면 뭐가 깨지나(영향 분석)"에 답하려면 리니지(족보)와 카탈로그(지도)가 필요하다.
                리니지는 상류·하류 양방향으로 추적하며, 특히 컬럼 수준까지 짚어야 파급을 정확히 본다.
                수동 문서는 낡으므로 dbt ref·SQL 파싱·OpenLineage로 코드에서 자동 추출하고, 오케스트레이터(Airflow→Marquez)에 통합해 매 실행을 기록한다.
                카탈로그는 스키마·소유자·품질·인기도를 중앙화해 분석가의 self-serve 발견성을 만든다(DataHub·Amundsen·OpenMetadata·Unity Catalog).
                이 넷에 품질(V-1-1)·접근제어가 합쳐지면 거버넌스가 되고, PII 태깅을 리니지로 전파해 규제에 대응한다 — 데이터 메시·계약으로 확장된다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['데이터리니지', '데이터카탈로그', 'OpenLineage', 'dbt', 'Marquez', 'DataHub', 'Amundsen', '영향분석', 'PII태깅', '데이터거버넌스'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-teal-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-3.html" className="underline hover:no-underline">다음: V-1-3 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
