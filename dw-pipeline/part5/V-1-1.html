  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

      setTimeout(focusFirst, 500);
    });

                       + 검사 위치 다이어그램 + 기대→검증 흐름)

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    //   check : 대표 검사
    //   ex    : 실무 실패 예시
    // ─────────────────────────────────────────────────────
    const DIMENSIONS = [
      { key: 'comp', icon: '🕳️', name: '완전성 (Completeness)', check: '널·누락 없음', ex: 'customer_id NULL 급증 → 매출 미집계' },
      { key: 'uniq', icon: '🔁', name: '유일성 (Uniqueness)',  check: 'PK 중복 없음',  ex: 'order_id 중복 → 매출 2배로 뻥튀기' },

      { key: 'fresh', icon: '⏱️', name: '적시성 (Timeliness)',  check: '신선도(지연)',  ex: '어제 배치 실패 → 데이터가 24h 낡음' },

      {

            '',

            '',
            '',

            '',
            '',

    // 좌: 파이프라인 검사 위치 다이어그램 (소스·변환후·적재후 게이트)

    const PIPE_NODES = [

    function SpreadSim() {

        <div className="mt-3 rounded-lg border-2 border-teal-300 bg-white p-3">

                <React.Fragment key={s.name}>
                  {i > 0 && (
                    <div className="flex items-center">
                      <span className={`text-sm ${i <= blockedFrom ? (gate && i === blockedFrom ? 'text-teal-500' : 'text-red-400') : 'text-emerald-400'}`}>

    // ─────────────────────────────────────────────────────
    // Step 2 — 5차원 실측 검사 카드 (오늘 배치 데이터로 실제 계산)
    // ─────────────────────────────────────────────────────
    function DimensionCards() {
      // Step 1의 오염 데이터로 실제 통과/실패를 계산 (하드코딩 아님)
      const orderIds = [1001, 1002, 1002, 1003];
      const customerIds = [7, null, 9, null];
      const amounts = [12000, 40000, -5000, 8000];
      const refIds = new Set([7, 8, 9, 10]);        // dim_customer 존재 id
      const lagHours = 26;                            // 어제 배치 실패 → 26h 지연

      const nNull = customerIds.filter((v) => v == null).length;
      const nDup = orderIds.length - new Set(orderIds).size;
      const nBadRange = amounts.filter((v) => v < 0).length;
      const nOrphan = customerIds.filter((v) => v != null && !refIds.has(v)).length;

      const results = [
        { d: DIMENSIONS[0], pass: nNull === 0, detail: `customer_id NULL ${nNull}건` },
        { d: DIMENSIONS[1], pass: nDup === 0, detail: `order_id 중복 ${nDup}건` },
        { d: DIMENSIONS[2], pass: nBadRange === 0, detail: `amount 음수 ${nBadRange}건` },
        { d: DIMENSIONS[3], pass: nOrphan === 0, detail: `customer_id 고아 ${nOrphan}건` },
        { d: DIMENSIONS[4], pass: lagHours <= 6, detail: `신선도 지연 ${lagHours}h (SLA 6h)` },
      ];
      const passed = results.filter((r) => r.pass).length;
      return (
        <div className="mt-3 rounded-lg border-2 border-teal-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-teal-900">📋 오늘 배치 · 5차원 실측 검사</div>
            <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${passed === 5 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>통과 {passed}/5</span>
          </div>
          <div className="space-y-1">
            {results.map((r) => (
              <div key={r.d.key} className={`rounded border px-2 py-1 flex items-center gap-2 ${r.pass ? 'border-emerald-300 bg-emerald-50' : 'border-red-400 bg-red-50'}`}>
                <span>{r.d.icon}</span>
                <div className="min-w-0 flex-1">
                  <div className="text-[10px] font-bold text-slate-800">{r.d.name}</div>
                  <div className="text-[9px] text-slate-600 font-mono truncate">{r.detail}</div>
                </div>
                <span className={`text-[10px] font-bold ${r.pass ? 'text-emerald-700' : 'text-red-700'}`}>{r.pass ? '✓ PASS' : '✗ FAIL'}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-slate-600">실패 4건: 중복·NULL은 값을 부풀리거나 누락시키고, 음수·지연은 집계를 왜곡한다.</div>
        </div>
      );
    }

        { name: 'Soda', tag: '간결', desc: 'SodaCL 문법으로 검사 선언', color: 'emerald' },
      ];
      const flow = ['① 기대 정의', '② 자동 검증', '③ 리포트·문서'];
      return (
        <div className="mt-3 space-y-2">
          <div className="rounded-lg border-2 border-teal-300 bg-white p-3">
            <div className="text-xs font-bold text-teal-900 mb-2">🤖 기대치를 코드로 → 자동 검증 → 문서</div>
            <div className="flex items-center gap-1 mb-2">
              {flow.map((f, i) => (
                <React.Fragment key={f}>
                  {i > 0 && <span className="text-teal-400">→</span>}
                  <div className="flex-1 rounded border border-teal-300 bg-teal-50 px-1 py-1 text-center text-[10px] font-bold text-teal-800">{f}</div>
                </React.Fragment>
              ))}
            </div>
            <div className="space-y-1">
              {tools.map((t) => (
                <div key={t.name} className={`rounded border px-2 py-1 flex items-center gap-2 border-${t.color}-300 bg-${t.color}-50`}>
                  <span className={`text-[10px] font-bold text-${t.color}-900 w-32`}>{t.name}</span>
                  <span className={`text-[8px] px-1 rounded bg-${t.color}-200 text-${t.color}-800 font-bold`}>{t.tag}</span>
                  <span className="text-[9px] text-slate-600 flex-1">{t.desc}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-white p-3">
            <div className="text-xs font-bold text-amber-900 mb-1.5">📈 이상 자동 감지 — 규칙 없이 잡는다 (≈ ml 드리프트)</div>
            <div className="grid grid-cols-2 gap-2 text-[10px]">
              <div className="rounded border border-red-300 bg-red-50 p-1.5">
                <div className="font-bold text-red-800">볼륨 급변</div>
                <div className="text-slate-600 font-mono">평소 3,100행 → 오늘 9,800행 (3.1배)</div>
              </div>
              <div className="rounded border border-red-300 bg-red-50 p-1.5">
                <div className="font-bold text-red-800">분포 이동</div>
                <div className="text-slate-600 font-mono">NULL 2% → 42% (+40%p)</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 품질 지표 대시보드 + 인시던트 대응 + 데이터 계약
    // ─────────────────────────────────────────────────────
    function OpsBox() {
      const metrics = [
        { label: '테스트 통과율', val: '96.5%', tone: 'amber', sub: 'SLA 99%' },
        { label: '신선도', val: '4.2h', tone: 'emerald', sub: 'SLA 6h' },
        { label: '열린 인시던트', val: '1건', tone: 'red', sub: '격리 중' },
      ];
      const M = {
        amber: 'border-amber-300 bg-amber-50 text-amber-800',
        emerald: 'border-emerald-300 bg-emerald-50 text-emerald-800',
        red: 'border-red-300 bg-red-50 text-red-800',
      };
      const incident = [
        { step: '1. 발견', desc: 'order_id 중복 감지 → 게이트 차단', icon: '🚨' },
        { step: '2. 격리', desc: '오염 파티션 격리, 하류 노출 차단', icon: '🔒' },
        { step: '3. 수정', desc: '상류 원인 수정 + 데이터 계약 갱신', icon: '🔧' },
        { step: '4. 백필', desc: '해당 구간 재적재 (III-2-2)', icon: '♻️' },
      ];
      return (
        <div className="mt-3 space-y-2">
          <div className="rounded-lg border-2 border-teal-400 bg-white p-3">
            <div className="text-xs font-bold text-teal-900 mb-2">📊 품질 지표 대시보드 (SLI)</div>
            <div className="grid grid-cols-3 gap-2">
              {metrics.map((m) => (
                <div key={m.label} className={`rounded border-2 p-2 text-center ${M[m.tone]}`}>
                  <div className="text-lg font-bold font-mono">{m.val}</div>
                  <div className="text-[9px] font-bold">{m.label}</div>
                  <div className="text-[8px] opacity-70">{m.sub}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-xs font-bold text-indigo-900 mb-1.5">🚑 인시던트 대응 절차 (오염 발견 → 복구)</div>
            <div className="grid grid-cols-2 gap-1.5">
              {incident.map((s) => (
                <div key={s.step} className="rounded border border-indigo-200 bg-indigo-50 px-2 py-1">
                  <div className="text-[10px] font-bold text-indigo-900">{s.icon} {s.step}</div>
                  <div className="text-[9px] text-slate-600">{s.desc}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-gradient-to-br from-teal-50 to-emerald-50 p-3">
            <div className="text-xs font-bold text-emerald-900 mb-1">🤝 데이터 계약 + 신뢰도 SLA</div>
            <div className="text-[10px] text-slate-700">
              생산자-소비자가 <b>스키마·의미·품질 기준</b>을 약속으로 못 박아 "상류가 말없이 컬럼 변경" 사고를 예방한다.
              이를 <b>"매일 06시까지 통과율 99% 보장"</b> 같은 신뢰도 SLA로 관리한다.
            </div>
            <div className="mt-1.5 text-[10px] text-teal-900 border-t border-teal-200 pt-1.5">
              🔭 <b>다음 장(리니지)</b>: 오염이 어디서 와서 어디까지 번졌는지를 데이터 계보로 추적한다.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-teal-50',    border: 'border-teal-300',    text: 'text-teal-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 게이트 다이어그램 + 단계별 특수 패널 (teal 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      spread:       { icon: '⚠️', label: '오염 전파' },
      dimensions:   { icon: '📋', label: '5차원 검사' },
      gates:        { icon: '🚦', label: '게이트 배치' },
      expectations: { icon: '🤖', label: '자동 검증' },
      ops:          { icon: '📊', label: '품질 운영' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.panel] || ENGINE_BADGE.spread;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-teal-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>데이터 품질 검증 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-teal-700 font-mono mb-2 px-2 py-1 rounded bg-teal-50 border border-teal-200">
            검사 지점: {PIPE_NODES.find((n) => n.key === state.gate)?.name || '전체 파이프라인'}
          </div>

          <GateDiagram active={state.gate} />

          {state.panel === 'spread' && <SpreadSim />}
          {state.panel === 'dimensions' && <DimensionCards />}
          {state.panel === 'gates' && <GatePolicyBox />}
          {state.panel === 'expectations' && <ExpectationsBox />}
          {state.panel === 'ops' && <OpsBox />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      const tabs = [
        { id: 'py', name: 'data_quality.py' },
        { id: 'yaml', name: 'schema.yml' },
      ];

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {tabs.map((t) => (
                <span
                  key={t.id}
                  className={`text-[11px] font-mono px-2 py-0.5 rounded-t ${code.file === t.id ? 'bg-[#282c34] text-teal-300 border-t border-x border-slate-600' : 'text-slate-500'}`}
                >{t.name}</span>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="px-3 pt-1.5 text-[10px] text-slate-400 font-mono border-b border-slate-700/50">{code.filename}</div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-teal-400/15 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-teal-600 text-white font-bold">V</span>
              <div>
                <h1 className="text-2xl font-bold text-teal-900">V-1-1. 데이터 품질 검증</h1>
                <p className="text-sm text-teal-800/80">"대시보드 숫자가 이상해요"의 근원 차단 — 나쁜 데이터가 하류로 흐르기 전에</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-teal-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-teal-800 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-teal-800 text-white' : 'bg-teal-600 text-white hover:bg-teal-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-500 bg-white px-4 py-3 text-sm text-teal-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                파이프라인 "성공(exit 0)"은 데이터가 옳다는 보장이 아니다 — 검증이 없으면 조용한 오염이 마트·대시보드·ML까지 번진다.
                무엇을 볼지는 5차원(완전성·유일성·유효성·정합성·적시성)으로 나누고, 검사는 소스 착지·변환 후·적재 후 여러 지점에 게이트로 건다.
                치명 검사는 중단(circuit breaker)해 전파를 끊고, 경미한 실패는 경고만 남긴다.
                dbt test·Great Expectations·Soda로 기대치를 코드로 선언해 자동 검증·문서화하고, 볼륨 급변·분포 이동은 이상 감지(≈ ml 드리프트)로 잡는다.
                끝으로 품질 지표(SLI)·데이터 계약·인시던트 대응(격리→수정→백필)을 신뢰도 SLA로 묶어 운영한다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['데이터품질', '품질차원', 'dbt_test', 'GreatExpectations', 'Soda', 'circuit_breaker', '이상감지', '데이터계약', '인시던트대응', '신뢰도SLA'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-teal-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 (리니지) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
