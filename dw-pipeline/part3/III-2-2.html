  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DW Pipeline III-2-2 — 멱등성·재처리(backfill)
    학습 목표: 파이프라인은 반드시 실패한다는 전제에서 출발해,
              같은 구간을 몇 번 돌려도 결과가 같도록(멱등) 설계하는 법을 익힌다.
              비멱등 append 의 재앙을 실계산으로 재현하고,
              delete-insert·MERGE·파티션·파라미터화·백필로 안전하게 만든다.
    패턴: fastapi v1 — 좌(LiveDataPane: 파이프라인 흐름 + 재실행 중복/멱등 비교 시뮬 + 백필 타임라인 + 4원칙)
                       우(VSCode CodeViewer: idempotent.py + backfill.sql 진화)
    색상: teal (data 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 파이프라인 3단계 — 추출→변환→적재. '적재를 어떻게 쓰느냐' 가 멱등성을 가른다
    // ─────────────────────────────────────────────────────
    const STAGES = [
      { key: 'extract',   icon: '📤', name: '추출 (Extract)',   sub: '원천에서 대상 구간만' },
      { key: 'transform', icon: '⚙️', name: '변환 (Transform)', sub: '집계·정제' },
      { key: 'load',      icon: '💾', name: '적재 (Load)',       sub: '대상 파티션에 쓰기' },
    ];

    // 쓰기 방식별 멱등성
    const MODE_INFO = {
      append:        { label: 'append (INSERT)', cls: 'bg-red-100 text-red-800 border-red-300',         idem: false },
      delete_insert: { label: 'delete-insert',   cls: 'bg-teal-100 text-teal-800 border-teal-300',      idem: true  },
      merge:         { label: 'MERGE (upsert)',  cls: 'bg-emerald-100 text-emerald-800 border-emerald-300', idem: true },
    };

    // 대상 파티션(하루치)의 '진짜' 데이터 — 원장 실제 하루 매출
    const PART_DATE = '2024-07-01';
    const BASE_ROWS = [
      { id: 'ord_1001', amt: 320000 },
      { id: 'ord_1002', amt: 450000 },
      { id: 'ord_1003', amt: 230000 },
    ];
    const BASE_SUM = BASE_ROWS.reduce((s, r) => s + r.amt, 0); // = 1,000,000
    const won = (n) => '₩' + n.toLocaleString('ko-KR');

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: { lang: 'python', file: 'py', filename: 'idempotent.py — 재실행을 전제로 한 진입점', lines: [
        '"""',
        'idempotent.py — 몇 번을 돌려도 결과가 같은 파이프라인',
        '멱등성(idempotency): f(f(x)) == f(x)',
        '파이프라인은 반드시 실패한다 → 재실행이 안전해야 한다.',
        '"""',
        'from datetime import date, timedelta',
        '',
        '# 재실행이 일상인 이유 (실무에서 늘 벌어진다)',
        'RERUN_CAUSES = [',
        '    "원천 지연: 새벽 배치가 09시에야 도착 → 다시 실행",',
        '    "코드 버그: 변환 로직 오류 발견 → 고치고 재실행",',
        '    "인프라 장애: 워커 OOM·네트워크 끊김 → 자동 재시도",',
        '    "성공 여부 불확실: 로그가 애매 → 그냥 한 번 더 실행",',
        ']',
        '',
        '',
        'def run_for_date(run_date: date) -> None:',
        '    """실행일(run_date)을 주입받아 그 하루치만 처리한다.',
        '    어떤 날짜든, 몇 번을 돌리든 결과가 같아야 한다(멱등).',
        '    """',
        '    extract(run_date)',
        '    rows = transform(run_date)',
        '    load(run_date, rows)   # ← 여기서 "어떻게 쓰느냐" 가 멱등성을 가른다',
        '',
        '',
        'if __name__ == "__main__":',
        '    # 오케스트레이터(Airflow 등)가 매일 이 진입점을 호출한다',
        '    run_for_date(date.today())',
      ] },
      s2: { lang: 'python', file: 'py', filename: 'idempotent.py — ❌ 비멱등 append 버그', lines: [
        '# idempotent.py (계속)',

    // ─────────────────────────────────────────────────────
    // Step 2·3 — 재실행 시뮬레이션 (append 중복 vs 멱등 덮어쓰기, 합계 실계산)
    // ─────────────────────────────────────────────────────
    function RerunSim({ allowModeToggle, initialMode }) {
      const [runs, setRuns] = useState(1);
      const [mode, setMode] = useState(initialMode);
      const m = MODE_INFO[mode];
      const copies = m.idem ? (runs >= 1 ? 1 : 0) : runs; // 멱등이면 항상 한 벌
      const rowCount = BASE_ROWS.length * copies;
      const total = BASE_SUM * copies;
      const ledger = BASE_SUM; // 원장 실제 하루 매출(정답)
      const ok = total === ledger;
      const barMax = BASE_SUM * 3; // 시각화 상한(3회분)
      const modes = ['append', 'delete_insert', 'merge'];

      return (
        <div className={`mt-3 rounded-lg border-2 p-3 ${ok ? 'border-teal-300 bg-teal-50' : 'border-red-300 bg-red-50'}`}>
          <div className="flex items-center justify-between mb-2">
            <div className={`text-xs font-bold ${ok ? 'text-teal-900' : 'text-red-800'}`}>🧪 재실행 시뮬레이션 — <span className="font-mono">dm.sales dt={PART_DATE}</span></div>
            <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${m.cls}`}>{m.label}</span>
          </div>

          {allowModeToggle && (
            <div className="flex gap-1 mb-2">
              {modes.map((k) => (
                <button
                  key={k}
                  onClick={() => setMode(k)}
                  className={`text-[10px] font-bold px-2 py-1 rounded border ${mode === k ? MODE_INFO[k].cls : 'bg-white text-slate-500 border-slate-300'}`}
                >{MODE_INFO[k].label}</button>
              ))}
            </div>
          )}

          <div className="flex gap-1.5 mb-2">
            <button
              onClick={() => setRuns((r) => r + 1)}
              className="text-[10px] font-bold px-2 py-1 rounded border bg-teal-600 text-white border-teal-700"
            >▶ 다시 실행</button>
            <button
              onClick={() => setRuns(1)}
              className="text-[10px] font-bold px-2 py-1 rounded border bg-white text-slate-600 border-slate-300"
            >↺ 초기화</button>
            <span className="ml-auto text-[11px] font-bold text-slate-700 self-center">재실행 {runs}회 실행됨</span>
          </div>

          {/* 파티션 상태 */}
          <div className="rounded border border-slate-300 bg-white p-2 mb-2">
            <div className="flex justify-between text-[10px] text-slate-600 mb-1">
              <span>파티션 적재 행 수</span>
              <span className="font-mono font-bold">{rowCount}건 {m.idem ? '(항상 한 벌)' : `= 3건 × ${runs}회`}</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-slate-600 w-16">리포트 합계</span>
              <div className="flex-1 h-4 rounded-full bg-slate-100 border border-slate-200 overflow-hidden">
                <div className={`h-full transition-all duration-500 ${ok ? 'bg-teal-500' : 'bg-red-500'}`} style={{ width: `${Math.min(100, (total / barMax) * 100)}%` }} />
              </div>
              <span className={`text-[11px] font-mono font-bold w-24 text-right ${ok ? 'text-teal-700' : 'text-red-700'}`}>{won(total)}</span>
            </div>
            <div className="flex items-center gap-2 mt-1">
              <span className="text-[10px] text-slate-600 w-16">원장 실제</span>
              <div className="flex-1 h-4 rounded-full bg-slate-100 border border-slate-200 overflow-hidden">
                <div className="h-full bg-emerald-500" style={{ width: `${(ledger / barMax) * 100}%` }} />
              </div>
              <span className="text-[11px] font-mono font-bold w-24 text-right text-emerald-700">{won(ledger)}</span>
            </div>
          </div>

          <div className={`text-[10px] rounded px-2 py-1 ${ok ? 'bg-teal-100 text-teal-900' : 'bg-red-100 text-red-900'}`}>
            {ok
              ? `✅ 재실행 ${runs}회에도 합계가 ${won(ledger)} 그대로 — 멱등하다.`
              : `🚨 재실행 ${runs}회 → 합계가 ${won(total)}로 부풀었다 (원장은 ${won(ledger)}). 매출 ${runs}배 중복!`}
          </div>
        </div>
      );
    }

      const rows = [
        { p: 'delete-insert', how: '구간 DELETE 후 재INSERT', when: '파티션 통째 재생성', idem: true },
        { p: 'MERGE (upsert)', how: '키 있으면 UPDATE, 없으면 INSERT', when: '행 단위 갱신', idem: true },
        { p: '파티션 교체', how: 'TRUNCATE/EXCHANGE 로 갈아끼움', when: '대용량·빠른 교체', idem: true },
        { p: 'append', how: '무조건 INSERT', when: '순수 이벤트 로그만', idem: false },
      ];
      return (
        <div className="mt-2 rounded-lg border-2 border-teal-400 bg-white p-3">
          <div className="text-xs font-bold text-teal-900 mb-2">🧰 멱등 쓰기 패턴 — 무엇을 언제</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-teal-900 border-b-2 border-teal-300">
                <th className="text-left py-1">패턴</th>
                <th className="text-left py-1 pl-1">방식</th>
                <th className="text-left py-1 pl-1">적합</th>
                <th className="text-center py-1">멱등</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.p} className="border-t border-teal-100">
                  <td className="py-1 font-bold text-slate-800 whitespace-nowrap">{r.p}</td>
                  <td className="py-1 pl-1 text-slate-600">{r.how}</td>
                  <td className="py-1 pl-1 text-slate-600">{r.when}</td>
                  <td className="py-1 text-center">{r.idem ? <span className="text-emerald-700 font-bold">O</span> : <span className="text-red-600 font-bold">X</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 백필 타임라인 (구간 재처리)
    // ─────────────────────────────────────────────────────
    const BF_DAYS = ['07-01', '07-02', '07-03', '07-04', '07-05', '07-06', '07-07'];
    const BUG_DAY = '07-03';

    function BackfillTimeline() {
      const [done, setDone] = useState(0);
      const [running, setRunning] = useState(false);

      useEffect(() => {
        if (!running) return;
        if (done >= BF_DAYS.length) { setRunning(false); return; }
        const t = setTimeout(() => setDone((d) => d + 1), 450);
        return () => clearTimeout(t);
      }, [running, done]);

      const start = () => { setDone(0); setRunning(true); };

      return (
        <div className="mt-3 rounded-lg border-2 border-teal-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-teal-900">⏪ 백필 — 07-01 ~ 07-07 구간 재처리</div>
            <div className="flex gap-1">
              <button onClick={start} className="text-[10px] font-bold px-2 py-1 rounded border bg-teal-600 text-white border-teal-700">▶ 백필 실행</button>
              <button onClick={() => { setRunning(false); setDone(0); }} className="text-[10px] font-bold px-2 py-1 rounded border bg-white text-slate-600 border-slate-300">↺</button>
            </div>
          </div>
          <div className="text-[10px] text-red-700 mb-2">🐞 {BUG_DAY} 변환 로직 버그 발견 → 그 이후 전 구간을 다시 만들어야 한다</div>
          <div className="flex gap-1">
            {BF_DAYS.map((d, i) => {
              const reprocessed = i < done;
              const isBug = d === BUG_DAY;
              return (
                <div key={d} className="flex-1 text-center">
                  <div className={`rounded border-2 py-2 text-[9px] font-mono font-bold transition-all ${reprocessed ? 'border-teal-500 bg-teal-100 text-teal-900' : isBug ? 'border-red-400 bg-red-50 text-red-700' : 'border-slate-300 bg-slate-50 text-slate-500'}`}>
                    {d}
                    <div className="text-[8px] mt-0.5 font-normal">{reprocessed ? '✓ 재처리' : '대기'}</div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-2 text-[10px] text-slate-600">
            날짜별로 <span className="font-mono">run_for_date</span> 를 반복 — 각 파티션이 멱등이라 몇 번을 돌려도 안전하다. 실패한 날짜만 골라 다시 돌리면 된다.
          </div>
          <div className="mt-2 grid grid-cols-3 gap-1.5 text-[9px]">
            <div className="rounded border border-slate-300 bg-slate-50 p-1.5"><b className="text-slate-800">격리</b><div className="text-slate-600">전용 풀 → 프로덕션 부하 침범 X</div></div>
            <div className="rounded border border-slate-300 bg-slate-50 p-1.5"><b className="text-slate-800">순서</b><div className="text-slate-600">의존 있으면 과거→최신</div></div>
            <div className="rounded border border-slate-300 bg-slate-50 p-1.5"><b className="text-slate-800">병렬</b><div className="text-slate-600">독립 날짜는 동시 실행</div></div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 4원칙 카드 + 체크리스트
    // ─────────────────────────────────────────────────────
    function FourPrinciples() {
      const principles = [
        { n: '1', icon: '🎛️', name: '파라미터화', d: '실행일을 밖에서 주입 (now() 하드코딩 금지)' },
        { n: '2', icon: '🗂️', name: '파티션 단위', d: '날짜 등으로 처리·재처리 범위를 좁힌다' },
        { n: '3', icon: '♻️', name: '멱등 쓰기', d: 'delete-insert / MERGE (append 아님)' },
        { n: '4', icon: '📍', name: '상태 추적', d: '성공 지점 기록 → 안전한 재시도' },
      ];
      const checks = [
        '같은 날짜를 두 번 돌려도 합계가 안 바뀌는가?',
        '실행일이 코드 밖 파라미터인가?',
        '재처리 단위가 파티션(날짜)으로 나뉘는가?',
        'etl_run_log 등으로 성공 여부를 남기는가?',
      ];
      return (
        <div className="mt-3 space-y-2">
          <div className="rounded-lg border-2 border-teal-500 bg-gradient-to-br from-teal-50 to-emerald-50 p-3">
            <div className="text-xs font-bold text-teal-900 mb-2">📐 멱등·재처리 4원칙</div>
            <div className="grid grid-cols-2 gap-1.5">
              {principles.map((p) => (
                <div key={p.n} className="rounded border border-teal-300 bg-white px-2 py-1.5">
                  <div className="flex items-center gap-1.5">
                    <span className="inline-flex w-4 h-4 items-center justify-center rounded-full bg-teal-600 text-white text-[9px] font-bold">{p.n}</span>
                    <span>{p.icon}</span>
                    <span className="text-[11px] font-bold text-teal-900">{p.name}</span>
                  </div>
                  <div className="text-[9px] text-slate-600 mt-0.5">{p.d}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-3">
            <div className="text-xs font-bold text-emerald-900 mb-1.5">✅ 리뷰 체크리스트</div>
            <ul className="space-y-1">
              {checks.map((c) => (
                <li key={c} className="text-[10px] text-slate-700 flex gap-1.5">
                  <span className="text-emerald-600 font-bold">☑</span><span>{c}</span>
                </li>
              ))}
            </ul>
            <div className="mt-2 text-[10px] text-teal-900 rounded bg-teal-50 border border-teal-200 px-2 py-1">
              → 다음 <b>Part Ⅳ 오케스트레이션</b>: 이 4원칙 위에서 "실패하면 그냥 다시 돌린다(retry-safe)"가 성립한다.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-teal-50',    border: 'border-teal-300',    text: 'text-teal-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 파이프라인 흐름 + 단계별 특수 패널 (teal 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      rerun:     { icon: '🔁', label: '재실행' },
      bug:       { icon: '💥', label: '비멱등 버그' },
      idem:      { icon: '✅', label: '멱등 패턴' },
      backfill:  { icon: '⏪', label: '백필' },
      principle: { icon: '📐', label: '설계 원칙' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.rerun;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-teal-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>멱등성·재처리 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-teal-700 font-mono mb-2 px-2 py-1 rounded bg-teal-50 border border-teal-200">
            현재 처리: {state.engineDetail}
          </div>

          <PipelineFlow focus={state.focus} mode={state.mode} />

          {state.panel === 'reasons' && <RerunReasons />}
          {state.panel === 'rerunAppend' && <RerunSim allowModeToggle={false} initialMode="append" />}
          {state.panel === 'idemPattern' && (<><RerunSim allowModeToggle={true} initialMode="delete_insert" /><IdemPatternTable /></>)}
          {state.panel === 'backfill' && <BackfillTimeline />}
          {state.panel === 'principles' && <FourPrinciples />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      const tabs = [
        { id: 'py', name: 'idempotent.py' },
        { id: 'sql', name: 'backfill.sql' },
      ];

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {tabs.map((t) => (
                <span
                  key={t.id}
                  className={`text-[11px] font-mono px-2 py-0.5 rounded-t ${code.file === t.id ? 'bg-[#282c34] text-teal-300 border-t border-x border-slate-600' : 'text-slate-500'}`}
                >{t.name}</span>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="px-3 pt-1.5 text-[10px] text-slate-400 font-mono border-b border-slate-700/50">{code.filename}</div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-teal-400/15 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-teal-600 text-white font-bold">DW</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-teal-100 text-teal-800 border border-teal-300">Part Ⅲ · ETL</span>
                  <span className="text-[10px] text-teal-700 font-mono">III-2-2</span>
                </div>
                <h1 className="text-2xl font-bold text-teal-900">III-2-2. 멱등성·재처리(backfill)</h1>
                <p className="text-sm text-teal-800/80">파이프라인은 반드시 실패한다 — 다시 돌려도 안전하게 만드는 설계</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-teal-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-teal-800 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-teal-800 text-white' : 'bg-teal-600 text-white hover:bg-teal-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-500 bg-white px-4 py-3 text-sm text-teal-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                파이프라인은 원천 지연·버그·장애로 반드시 재실행된다 — 재실행을 기본 전제로 둔다.
                append(INSERT)만 하면 두 번 돌릴 때 매출이 두 배로 중복되므로, delete-insert(파티션 덮어쓰기)·MERGE(upsert)로 "지우고 다시 채워" 멱등을 만든다.
                처리 단위를 파티션(날짜)으로 나누면 재처리 범위·병렬·롤백이 쉬워지고, 날짜 파라미터화로 과거 구간을 백필한다.
                4원칙(파라미터화·파티션·멱등 쓰기·상태 추적)이 갖춰지면 다음 Part Ⅳ 오케스트레이션의 자동 재시도가 안전해진다 — "실패하면 그냥 다시 돌린다"가 참이 된다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['멱등성', 'idempotency', 'backfill', 'delete-insert', 'MERGE', 'upsert', '파티션', '파라미터화', '재처리', 'retry-safe'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-200">#{k}</span>
              ))}
            </div>
