    @media (min-width: 768px) {

  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    DW Pipeline III-1-2 — 증분 적재·CDC
    학습 목표: 매 실행 전량 재적재가 왜 벽에 부딪히는지 체감하고,
              "무엇이 바뀌었나"를 잡아내는 두 갈래 — 타임스탬프 워터마크와
              로그 기반 CDC — 의 원리·함정·선택 기준을 5단계로 익힌다.
    패턴: fastapi v1 — 좌(LiveDataPane: 전량 vs 증분 게이지 + 워터마크 이동 + CDC 이벤트 스트림 + 선택 결정표)
                       우(VSCode CodeViewer: incremental_cdc.py 진화)
    색상: teal (data 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    //   focus  : 파이프라인 다이어그램에서 강조할 노드 key 배열
    //   panel  : 좌측 특수 패널 종류
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 전량 적재의 벽 — 매일 1억 행을 전부 다시?',
        desc: '초기 파이프라인은 대개 "원천 테이블을 통째로 비우고 다시 채우기"로 시작한다 — 단순하고 항상 최신이라 편하다. 문제는 데이터가 자란다는 것이다. 어제 1억 행이던 orders 가 오늘 1억 100만 행이 되면, 바뀐 건 100만 행뿐인데 매 실행마다 1억 행 전체를 다시 읽고 옮긴다. 적재 시간은 데이터 크기에 비례해 늘어 배치 윈도우를 넘기고, 그동안 원천 DB는 풀스캔 부하에 시달리며, 전송·컴퓨팅 비용도 그대로 청구된다. 그래서 규모가 커지면 질문이 바뀐다 — "전부"가 아니라 "무엇이 바뀌었나를 어떻게 알아내서 그것만 가져올까".',
        focus: ['src'],
        panel: 'fullVsInc',
        engine: 'full', engineDetail: '원천 전체 → 매 실행 통째로 재적재',
        actor: '⚠️ 매 실행 1억 행 전량 재적재',
        alert: { tone: 'danger', text: '전량 적재는 데이터 크기에 선형으로 무거워진다 — 시간·원천 부하·비용이 함께 커진다. 바뀐 건 1%인데 100%를 옮기는 낭비. 해법은 "변경분만" 잡는 증분 적재이고, 핵심 질문은 단 하나: 무엇이 바뀌었나를 어떻게 아는가.' },
        code: {
          lang: 'python', file: 'py',
          filename: 'incremental_cdc.py — ① 전량 적재',
          lines: [
            '"""',
            'incremental_cdc.py — 증분 적재와 CDC 를 단계별로 구현',
            '  ① 전량 → ② 타임스탬프 증분 → ③ CDC 이벤트 → ④ upsert 병합 → ⑤ 멱등',
            '"""',
            'import sqlalchemy as sa',
            '',
            'src = sa.create_engine("postgresql://.../shop_prod")',
            'dw  = sa.create_engine("postgresql://.../warehouse")',
            '',
            '',
            'def full_load() -> None:',
            '    """① 전량 적재: 비우고 원천 전체를 다시 채운다 (truncate-load)."""',
            '    with dw.begin() as conn:',
            '        conn.execute(sa.text("TRUNCATE TABLE stg.orders"))',
            '        # 원천 1억 행 전체를 매번 다시 읽어온다 ← 여기가 병목',
            '        rows = src.execute(sa.text("SELECT * FROM orders")).fetchall()',
            '        conn.execute(',
            '            sa.text("INSERT INTO stg.orders VALUES (...)"), rows,',
            '        )',
            '',
            '# 🔥 전량 적재의 대가 (데이터가 자랄수록 악화):',
            '#   · 시간 : 1억 행 → 40분, 내년 2억 행 → 80분 (배치 윈도우 초과)',
            '#   · 부하 : 원천 DB 풀스캔 → 운영 쿼리와 자원 경쟁',
            '#   · 비용 : 바뀐 1% 위해 100% 전송·컴퓨팅 비용 지불',
            '#',
            '# 핵심 질문: "전부" 말고 "무엇이 바뀌었나" 를 어떻게 알아낼까?',
            '#   → 두 갈래: (A) 타임스탬프 워터마크  (B) 로그 기반 CDC',
          ],
          highlight: [11, 12, 13, 14, 15, 16, 21, 22, 23, 24, 26, 27],
        },
      },

      // 원천은 매일 1% 증가, 변경분은 항상 100만 행(전체의 1% 근처)
      const totalRows = 100 + (day - 1);          // 백만 행 단위 (1억 = 100)
      const changed = 1;                          // 매일 100만 행 변경
      const fullPct = 100;
      const incPct = Math.round((changed / totalRows) * 100);
      const fullMin = Math.round(totalRows * 0.4);
      const incMin = Math.max(1, Math.round(changed * 0.4));
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-red-800">📊 전량 vs 증분 — 매일 옮기는 양</div>
            <div className="flex items-center gap-1 text-[10px]">
              <button onClick={() => setDay((d) => Math.max(1, d - 30))} className="px-1.5 py-0.5 rounded border border-red-400 bg-white text-red-700 font-bold">−30일</button>
              <span className="font-mono text-red-900 w-14 text-center">Day {day}</span>
              <button onClick={() => setDay((d) => Math.min(365, d + 30))} className="px-1.5 py-0.5 rounded border border-red-400 bg-white text-red-700 font-bold">+30일</button>
            </div>
          </div>
          <div className="text-[10px] text-slate-700 font-mono mb-2">원천 orders ≈ {totalRows}백만 행 · 오늘 변경 {changed}00만 행</div>
          <div className="space-y-2">
            <div>
              <div className="flex justify-between text-[10px] mb-0.5"><span className="text-red-800 font-bold">전량 적재</span><span className="font-mono text-red-700">{totalRows}00만 행 · ~{fullMin}분</span></div>
              <div className="h-3 rounded-full bg-white border border-red-200 overflow-hidden">
                <div className="h-full bg-red-500 transition-all duration-500" style={{ width: `${fullPct}%` }} />
              </div>
            </div>
            <div>
              <div className="flex justify-between text-[10px] mb-0.5"><span className="text-emerald-800 font-bold">증분 적재</span><span className="font-mono text-emerald-700">{changed}00만 행 · ~{incMin}분</span></div>
              <div className="h-3 rounded-full bg-white border border-emerald-200 overflow-hidden">
                <div className="h-full bg-emerald-500 transition-all duration-500" style={{ width: `${incPct}%` }} />
              </div>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-red-900">
            Day 를 넘길수록 전량 막대는 그대로 무겁지만, 증분은 변경분(1%)만 옮겨 <b>{Math.round(fullMin / incMin)}배</b> 가볍다. 바뀐 건 1%인데 100%를 옮기는 게 전량 적재의 벽.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 워터마크 이동 + 누락 경계 함정
    // ─────────────────────────────────────────────────────
    function WatermarkBox() {
      const [mode, setMode] = useState('unsafe'); // unsafe: 배타(>) / safe: 겹침(안전여유)
      // 원천 행: updated_at(분) 과 커밋 지연 여부
      const rows = [
        { id: '#101', t: 10, late: false },
        { id: '#102', t: 12, late: false },
        { id: '#103', t: 15, late: true },   // 시각은 15지만 커밋이 늦어 워터마크 직후 도착
        { id: '#104', t: 18, late: false },
        { id: '#105', t: 21, late: false },
      ];
      const wm = 15;                 // 이전 실행이 저장한 워터마크(분)
      const safety = mode === 'safe' ? 5 : 0;
      const boundary = wm - safety;  // 이번 실행이 읽기 시작하는 하한
      const picked = (r) => (mode === 'unsafe' ? r.t > wm : r.t >= boundary);
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-amber-900">⏱️ 워터마크 이동 — 누락 경계 함정</div>
            <button
              onClick={() => setMode((m) => (m === 'unsafe' ? 'safe' : 'unsafe'))}
              className={`text-[10px] font-bold px-2 py-1 rounded border ${mode === 'safe' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-red-600 text-white border-red-700'}`}
            >{mode === 'safe' ? '✓ 안전 여유(−5분) ON' : '⚠️ 배타 경계(>) 위험'}</button>
          </div>
          <div className="text-[10px] font-mono text-amber-900 mb-1.5">이전 워터마크 wm = 15분 · 읽기 하한 = {boundary}분 {mode === 'safe' && '(−5분 겹침)'}</div>
          <div className="space-y-1">
            {rows.map((r) => {
              const got = picked(r);
              const missed = !got && r.t >= wm;   // 워터마크 근처인데 놓친 것
              return (
                <div key={r.id} className={`rounded border px-2 py-1 text-[10px] font-mono flex items-center justify-between ${got ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : missed ? 'bg-red-100 border-red-400 text-red-800' : 'bg-white border-slate-200 text-slate-400'}`}>
                  <span>{r.id} · updated_at={r.t}분 {r.late && <span className="text-red-600">⏳커밋지연</span>}</span>
                  <span className="font-bold">{got ? '✓ 적재' : missed ? '✗ 누락!' : '이미 적재됨'}</span>
                </div>
              );
            })}
          </div>
          <div className="mt-2 text-[10px] text-amber-900">
            {mode === 'unsafe'
              ? '배타 경계(updated_at > 15)는 커밋이 늦어 15분에 뒤늦게 도착한 #103 을 영영 놓친다. 삭제도 못 잡는다.'
              : '하한을 5분 겹쳐 읽어(>= 10) #103 을 회수했다. 일부 중복은 upsert(멱등)로 흡수 — 중복은 고치고 누락은 못 고친다.'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — CDC 로그 이벤트 스트림 흐름
    // ─────────────────────────────────────────────────────
    function CdcStreamBox() {
      const events = [
        { op: 'c', label: 'INSERT', row: '#201 결제대기', color: 'emerald' },
        { op: 'u', label: 'UPDATE', row: '#201 결제완료', color: 'sky' },
        { op: 'd', label: 'DELETE', row: '#198 주문취소', color: 'red' },
        { op: 'u', label: 'UPDATE', row: '#201 배송중',   color: 'sky' },
      ];
      const C = {
        emerald: 'bg-emerald-100 border-emerald-400 text-emerald-800',
        sky: 'bg-sky-100 border-sky-400 text-sky-800',
        red: 'bg-red-100 border-red-400 text-red-800',
      };
      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-white p-3">
          <div className="text-xs font-bold text-indigo-900 mb-2">📡 로그 → 이벤트 스트림 → DW (binlog · WAL 을 꼬리에서 읽는다)</div>
          {/* 파이프라인 배지 흐름 */}
          <div className="flex items-center gap-1 text-[10px] font-bold mb-2 flex-wrap">
            <span className="px-2 py-1 rounded bg-slate-100 text-slate-700 border border-slate-300">🧾 binlog/WAL</span>
            <span className="text-indigo-400">→</span>
            <span className="px-2 py-1 rounded bg-teal-100 text-teal-800 border border-teal-300">Debezium</span>
            <span className="text-indigo-400">→</span>
            <span className="px-2 py-1 rounded bg-indigo-100 text-indigo-800 border border-indigo-300">📡 Kafka</span>
            <span className="text-indigo-400">→</span>
            <span className="px-2 py-1 rounded bg-emerald-100 text-emerald-800 border border-emerald-300">🏛️ DW upsert</span>
          </div>
          <div className="text-[9px] text-slate-500 mb-1">토픽에 흐르는 변경 이벤트 (op · after/before):</div>
          <div className="space-y-1">
            {events.map((e, i) => (
              <div key={i} className={`rounded border px-2 py-1 text-[10px] font-mono flex items-center justify-between ${C[e.color]}`}>
                <span><b>op={e.op}</b> · {e.label}</span>
                <span>{e.row}</span>
                <span className="text-[9px]">ts_ms 순서 보장</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-indigo-900">
            타임스탬프 방식이 못 잡던 <b>DELETE(op=d)</b> 까지 스트림에 담겨 온다. 원천 추가 쿼리 0 · 커밋 직후 ms 단위 도착.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — CDC 적재 패턴 (스테이징 → 병합 + 멱등)
    // ─────────────────────────────────────────────────────
    function MergePatternBox() {
      return (
        <div className="mt-3 space-y-2">
          <div className="rounded-lg border-2 border-teal-300 bg-white p-3">
            <div className="text-xs font-bold text-teal-900 mb-1.5">🔀 이벤트 → 스테이징 → 병합(upsert) 3단</div>
            <div className="flex items-center justify-between gap-1 text-[10px] font-bold text-center">
              <div className="flex-1 rounded border border-indigo-300 bg-indigo-50 px-1 py-1.5 text-indigo-800">📡 이벤트<br/>스트림</div>
              <span className="text-teal-400">→</span>
              <div className="flex-1 rounded border border-teal-300 bg-teal-50 px-1 py-1.5 text-teal-800">📥 스테이징<br/>착지·순서정렬</div>
              <span className="text-teal-400">→</span>
              <div className="flex-1 rounded border border-emerald-300 bg-emerald-50 px-1 py-1.5 text-emerald-800">🏛️ DW<br/>MERGE</div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-xs font-bold text-indigo-900 mb-1.5">🔁 멱등 확인 — 같은 이벤트를 2번 적용해도?</div>
            <table className="w-full text-[10px] font-mono">
              <thead>
                <tr className="text-indigo-800 border-b border-indigo-200">
                  <th className="text-left py-0.5">적용</th>
                  <th className="text-left py-0.5">이벤트</th>
                  <th className="text-left py-0.5">DW 결과 (order #201)</th>
                </tr>
              </thead>
              <tbody>
                <tr className="border-t border-indigo-100"><td>1회차</td><td>upsert 배송중</td><td className="text-indigo-900">status=배송중</td></tr>
                <tr className="border-t border-indigo-100 text-emerald-700 font-bold"><td>2회차(중복)</td><td>upsert 배송중</td><td>status=배송중 ✓ 동일</td></tr>
              </tbody>
            </table>
            <div className="text-[10px] text-indigo-800 mt-1">→ upsert 는 PK 기준 "있으면 갱신"이라 재적용에 안전 = 멱등 (III-2-2 예고).</div>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-white p-3">
            <div className="text-xs font-bold text-emerald-900 mb-1">🧱 초기 로드 = 스냅샷 + 증분</div>
            <div className="text-[10px] text-emerald-800">op=r(스냅샷)로 과거 전량을 한 번 깔고 → 그 시점부터 op=c/u/d 증분 스트림을 이어 붙여 이력을 온전히 만든다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 선택 결정표 + 도구 지도
    // ─────────────────────────────────────────────────────
    function DecisionBox() {
      const rows = [
        { crit: '신선도', ts: '배치 (분~시간)', cdc: '실시간 (ms~초)' },
        { crit: '삭제 감지', ts: '✗ 불가 (소프트만)', cdc: '✓ 정확히 포착' },
        { crit: '원천 부하', ts: '쿼리마다 부하', cdc: '거의 0 (로그 읽기)' },
        { crit: '복잡도', ts: '낮음 (인덱스 1개)', cdc: '높음 (Debezium+Kafka)' },
        { crit: '적합', ts: '배치·삭제 무관', cdc: '실시간·삭제 필요' },
      ];
      const tools = [
        { name: 'Debezium', tag: 'OSS 로그 CDC', color: 'teal' },
        { name: 'Fivetran', tag: 'SaaS 매니지드', color: 'indigo' },
        { name: 'AWS DMS', tag: 'AWS 마이그레이션', color: 'amber' },
      ];
      const TC = {
        teal: 'border-teal-300 bg-teal-50 text-teal-800',
        indigo: 'border-indigo-300 bg-indigo-50 text-indigo-800',
        amber: 'border-amber-300 bg-amber-50 text-amber-800',
      };
      return (
        <div className="mt-3 space-y-2">
          <div className="rounded-lg border-2 border-teal-400 bg-white p-3">
            <div className="text-xs font-bold text-teal-900 mb-2">🧭 타임스탬프 vs CDC — 무엇을 고를까</div>
            <div className="overflow-x-auto">
              <table className="w-full text-[10px]">
                <thead>
                  <tr className="text-teal-900 border-b-2 border-teal-300">
                    <th className="text-left py-1 w-16">기준</th>
                    <th className="text-left py-1 pl-2">⏱️ 타임스탬프</th>
                    <th className="text-left py-1 pl-2">📡 CDC</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => (
                    <tr key={r.crit} className="border-t border-teal-100">
                      <td className="py-1 font-bold text-slate-700 whitespace-nowrap">{r.crit}</td>
                      <td className="py-1 pl-2 text-amber-800">{r.ts}</td>
                      <td className="py-1 pl-2 text-indigo-800">{r.cdc}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div className="rounded-lg border-2 border-teal-500 bg-gradient-to-br from-teal-50 to-emerald-50 p-3">
            <div className="text-xs font-bold text-teal-900 mb-2">🛠️ 도구 지도 + 삭제 전략</div>
            <div className="flex gap-1.5 flex-wrap mb-2">
              {tools.map((t) => (
                <div key={t.name} className={`flex-1 min-w-[90px] rounded border px-2 py-1.5 ${TC[t.color]}`}>
                  <div className="text-[11px] font-bold">{t.name}</div>
                  <div className="text-[9px]">{t.tag}</div>
                </div>
              ))}
            </div>
            <div className="text-[10px] text-teal-900">
              삭제는 <b>소프트 딜리트(is_deleted)</b> 로 통일해 이력·분석 보존. 다음 장 <b>dbt</b> 에서 이렇게 적재한 데이터를 변환·모델링한다.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-teal-50',    border: 'border-teal-300',    text: 'text-teal-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 파이프라인 다이어그램 + 단계별 특수 패널 (teal 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      full:  { icon: '⚠️', label: '전량 적재' },
      ts:    { icon: '⏱️', label: '타임스탬프 증분' },
      cdc:   { icon: '📡', label: '로그 CDC' },
      merge: { icon: '🔀', label: 'upsert 병합' },
      guide: { icon: '🧭', label: '선택 가이드' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.full;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-teal-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>증분 적재 엔진 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-teal-700 font-mono mb-2 px-2 py-1 rounded bg-teal-50 border border-teal-200">
            현재 처리: {state.engineDetail}
          </div>

          <PipelineDiagram focus={state.focus} />

          {state.panel === 'fullVsInc' && <FullVsIncBox />}
          {state.panel === 'watermark' && <WatermarkBox />}
          {state.panel === 'cdcStream' && <CdcStreamBox />}
          {state.panel === 'mergePattern' && <MergePatternBox />}
          {state.panel === 'decision' && <DecisionBox />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      const tabs = [
        { id: 'py', name: 'incremental_cdc.py' },
        { id: 'sql', name: 'merge_cdc.sql' },
      ];

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {tabs.map((t) => (
                <span
                  key={t.id}
                  className={`text-[11px] font-mono px-2 py-0.5 rounded-t ${code.file === t.id ? 'bg-[#282c34] text-teal-300 border-t border-x border-slate-600' : 'text-slate-500'}`}
                >{t.name}</span>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="px-3 pt-1.5 text-[10px] text-slate-400 font-mono border-b border-slate-700/50">{code.filename}</div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-teal-400/15 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-teal-600 text-white font-bold">DW</span>
              <div>
                <h1 className="text-2xl font-bold text-teal-900">III-1-2. 증분 적재·CDC</h1>
                <p className="text-sm text-teal-800/80">매일 1억 행을 전부 다시? — 변경분만 잡아내는 기술과 그 함정</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-teal-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-teal-800 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-teal-800 text-white' : 'bg-teal-600 text-white hover:bg-teal-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-500 bg-white px-4 py-3 text-sm text-teal-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                전량 재적재는 데이터가 자랄수록 시간·원천 부하·비용의 벽에 부딪히므로, "무엇이 바뀌었나"만 잡는 증분 적재로 넘어간다.
                타임스탬프 증분(updated_at &gt; 워터마크)은 단순하지만 삭제를 못 잡고 경계 누락 위험이 있어, 하한을 겹쳐 읽고 워터마크를 트랜잭션 안에 저장한다.
                CDC 는 DB 트랜잭션 로그(binlog/WAL)를 읽어 INSERT/UPDATE/DELETE 이벤트 스트림으로 만들어 원천 부하 최소·삭제 포함·거의 실시간을 얻는다(Debezium+Kafka).
                적재는 이벤트→스테이징→MERGE(upsert)로 순서·중복을 통제하고, upsert 는 재적용에 안전한 멱등이라 중복 이벤트를 흡수한다.
                선택은 원천 특성·지연 요구가 정한다 — 배치·삭제 무관이면 타임스탬프, 실시간·삭제 필요면 CDC. 삭제는 소프트 딜리트로 통일하고, 다음 장 dbt 로 변환·모델링을 잇는다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['증분적재', 'CDC', 'ChangeDataCapture', '워터마크', 'binlog', 'WAL', 'Debezium', 'Kafka', 'upsert', '멱등', '소프트딜리트'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-teal-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline">다음: III-2-x (dbt) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
