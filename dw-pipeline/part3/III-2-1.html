  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔧</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    DW Pipeline III-2-1 — dbt로 변환 계층 관리
    학습 목표: 스케줄러에 흩어진 수백 개의 변환 쿼리가 왜 "무법지대" 인지 체험하고,
              dbt가 ref()·머티리얼라이제이션·테스트·문서로 변환을 "소프트웨어처럼"
              버전·테스트·문서화하는 흐름을 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 흩어진 쿼리 vs dbt DAG, ref 의존 그래프 성장,
                       머티리얼라이제이션 4종 비교, 테스트 통과/실패 시각화)
                       우(VSCode CodeViewer: staging.sql → marts.sql → schema.yml →
                       dbt_project.yml → incremental 모델)
    색상: teal (data 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // dbt 모델 계층 — 각 변환이 하나의 SELECT(model), ref()로 의존을 잇는다
    //   key   : 모델 계층 식별자
    //   layer : staging / intermediate / marts (파이프라인 계층과 대응)
    // ─────────────────────────────────────────────────────
    const MODELS = [
      { key: 'stg_orders',    layer: 'staging',      name: 'stg_orders',    dep: [],                           note: '원천 정제 (1:1)' },
      { key: 'stg_customers', layer: 'staging',      name: 'stg_customers', dep: [],                           note: '원천 정제 (1:1)' },
      { key: 'int_orders',    layer: 'intermediate', name: 'int_orders_joined', dep: ['stg_orders', 'stg_customers'], note: '조인·중간 가공' },
      { key: 'fct_orders',    layer: 'marts',        name: 'fct_orders',    dep: ['int_orders'],               note: '팩트 (분석용)' },
      { key: 'dim_customers', layer: 'marts',        name: 'dim_customers', dep: ['stg_customers'],            note: '차원 (분석용)' },
    ];

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    //   focus : DAG에서 강조할 모델 key 배열
    //   panel : 좌측 특수 패널 종류
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: { lang: 'sql', file: 'sql', filename: 'chaos.sql — ① 흩어진 변환의 안티패턴', lines: [
        '-- ❌ 안티패턴: 스케줄러 곳곳에 흩어진 변환 쿼리',
        '--    (크론 A, 에어플로우 태스크 B, 저장 프로시저 C ...)',
        '',
        '-- [크론 job_03.sql] — 매일 02:00',
        'INSERT INTO analytics.orders_joined',
        'SELECT o.*, c.region',
        'FROM   raw.orders o',
        'JOIN   raw.customers c ON c.id = o.customer_id;',
        '--  ⚠️ raw.customers 적재가 아직 안 끝났다면? → 빈 결과',
        '',
        '-- [에어플로우 task_stats] — 매일 03:00 (job_03 끝났길 "기대")',
        'INSERT INTO analytics.daily_sales',
        'SELECT region, SUM(amount) AS revenue',
        'FROM   analytics.orders_joined   -- ← 위 테이블에 의존',
        'GROUP  BY region;',
        '',
        '-- 🔥 무엇이 문제인가:',
        '--   1) 의존성: orders_joined → daily_sales 관계가 코드 어디에도 없다',
        '--   2) 순서:   시각(02:00/03:00) 으로만 "암묵적" 보장 → 밀리면 깨짐',
        '--   3) 테스트: customer_id NULL·중복 검증 없음 → 조용히 오염',
        '--   4) 문서:   region 이 무슨 값인지, 누가 쓰는지 기록 없음',
        '--',
        '-- 결론: 변환을 "코드" 로 모아 의존·테스트·문서를 붙여야 한다.',
        '--        → 그 도구가 dbt (data build tool) 다.',
      ] },
      s2: { lang: 'sql', file: 'sql', filename: 'models/staging/stg_orders.sql — 모델 + ref', lines: [
        '-- models/staging/stg_orders.sql',
        '-- ✅ dbt 모델 = 파일 하나에 담긴 SELECT 하나.',
        '--    테이블 생성/순서는 dbt 가 담당, 개발자는 SELECT 만 쓴다.',
        '',
        'with source as (',
        '    -- 원천 참조는 source() 로 (원천 위치를 한 곳에서 관리)',

    const LAYER_STYLE = {
      staging:      { badge: 'bg-sky-100 text-sky-800 border-sky-300',       label: 'staging' },
      intermediate: { badge: 'bg-amber-100 text-amber-800 border-amber-300', label: 'inter' },

    function DagDiagram({ focus }) {
      const focusSet = new Set(focus);
      // 계층별로 묶어 좌→우로 흐르게 배치
      const cols = [
        { title: 'staging (1:1 정제)', keys: ['stg_orders', 'stg_customers'] },
        { title: 'intermediate (가공)', keys: ['int_orders'] },
        { title: 'marts (분석용)', keys: ['fct_orders', 'dim_customers'] },
      ];
      const byKey = Object.fromEntries(MODELS.map((m) => [m.key, m]));
      return (
        <div className="rounded-lg border-2 border-teal-300 bg-white p-2.5">
          <div className="text-[11px] font-bold text-teal-900 mb-2">🔗 dbt DAG — ref()가 이어 붙인 모델 의존 그래프</div>
          <div className="grid grid-cols-3 gap-1.5 items-stretch">
            {cols.map((col, ci) => (
              <div key={col.title} className="flex flex-col">
                <div className="text-[8.5px] font-bold text-slate-500 mb-1 text-center">{col.title}</div>
                <div className="flex-1 flex flex-col justify-center gap-1.5">
                  {col.keys.map((k) => {
                    const m = byKey[k];
                    const on = focusSet.has(k);
                    const ls = LAYER_STYLE[m.layer];
                    return (
                      <div key={k} className={`rounded-lg border-2 px-1.5 py-1 transition-all ${on ? 'border-teal-500 bg-teal-50 shadow' : 'border-slate-200 bg-white opacity-60'}`}>
                        <div className="flex items-center justify-between gap-1">
                          <span className={`text-[10px] font-bold font-mono ${on ? 'text-teal-900' : 'text-slate-600'}`}>{m.name}</span>
                          <span className={`text-[8px] font-bold px-1 rounded border ${ls.badge}`}>{ls.label}</span>
                        </div>
                        <div className="text-[8.5px] text-slate-500">{m.note}</div>
                        {m.dep.length > 0 && (
                          <div className="text-[8px] text-teal-600 font-mono truncate">← ref: {m.dep.join(', ')}</div>
                        )}
                      </div>
                    );
                  })}
                </div>
                {ci < cols.length - 1 && null}
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[9px] text-slate-500 text-center">dbt run → 위상 정렬로 staging 먼저, marts 나중 (순서 자동 보장)</div>
        </div>
      );
    }

        <div className="mt-3 rounded-lg border-2 border-teal-300 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-bold text-teal-900">🧪 dbt test — 스키마 테스트가 데이터에 실제로 돈다</div>
            <button
              onClick={() => setRan((r) => !r)}
              className={`text-[10px] font-bold px-2 py-1 rounded border ${ran ? 'bg-teal-600 text-white border-teal-700' : 'bg-white text-teal-700 border-teal-400'}`}
            >{ran ? '↻ 초기화' : '▶ dbt test'}</button>
          </div>
          <div className="space-y-1">
            {tests.map((t) => {
              const shown = ran;
              const ok = t.st === 'pass';
              return (
                <div key={t.name} className={`rounded border px-2 py-1 text-[10px] font-mono flex justify-between items-center ${!shown ? 'bg-slate-50 border-slate-200 text-slate-400' : ok ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-red-50 border-red-400 text-red-800'}`}>
                  <span>{t.name}</span>
                  <span className="font-bold">{!shown ? '대기' : ok ? '✓ PASS' : `✗ FAIL — ${t.why}`}</span>
                </div>
              );
            })}
          </div>
          <div className={`mt-2 text-[10px] ${ran ? 'text-red-800' : 'text-slate-500'}`}>
            {ran
              ? '1건 실패 → CI가 배포를 차단한다. 오염된 status 값이 대시보드로 나가기 전에 잡혔다.'
              : '▶ 를 눌러 실행하면 선언한 규칙들이 실제 데이터에 SQL로 돌아간다.'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 프로젝트 구조 + 환경 분리
    // ─────────────────────────────────────────────────────
    function WorkflowBox() {
      const dirs = [
        { name: 'models/',    desc: 'staging→intermediate→marts (변환)', icon: '📁' },
        { name: 'tests/',     desc: '커스텀 데이터 테스트', icon: '🧪' },
        { name: 'seeds/',     desc: '참조 CSV → 테이블 (dbt seed)', icon: '🌱' },
        { name: 'snapshots/', desc: '원천 변경 → SCD2 자동 (II-2-1)', icon: '📸' },
      ];
      const envs = [
        { env: 'dev', schema: '내 개발 스키마', tone: 'bg-sky-100 text-sky-800 border-sky-300' },
        { env: 'staging', schema: '검증 스키마', tone: 'bg-amber-100 text-amber-800 border-amber-300' },
        { env: 'prod', schema: '프로덕션 스키마', tone: 'bg-emerald-100 text-emerald-800 border-emerald-300' },
      ];
      return (
        <div className="mt-3 space-y-2">
          <div className="rounded-lg border-2 border-teal-300 bg-white p-3">
            <div className="text-xs font-bold text-teal-900 mb-2">📦 dbt 프로젝트 구조</div>
            <div className="grid grid-cols-2 gap-1.5">
              {dirs.map((d) => (
                <div key={d.name} className="rounded border border-teal-200 bg-teal-50 px-2 py-1">
                  <div className="text-[10px] font-bold font-mono text-teal-900">{d.icon} {d.name}</div>
                  <div className="text-[8.5px] text-slate-600">{d.desc}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-teal-400 bg-white p-3">
            <div className="text-xs font-bold text-teal-900 mb-2">🚀 환경 분리 — 같은 코드, 다른 대상 스키마</div>
            <div className="flex items-center gap-1">
              {envs.map((e, i) => (
                <React.Fragment key={e.env}>
                  <div className={`flex-1 rounded border px-2 py-1.5 text-center ${e.tone}`}>
                    <div className="text-[11px] font-bold font-mono">{e.env}</div>
                    <div className="text-[8.5px]">{e.schema}</div>
                  </div>
                  {i < envs.length - 1 && <span className="text-teal-400 text-xs">→</span>}
                </React.Fragment>
              ))}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-600 text-center">ref()가 환경별 실제 이름을 치환 → 코드는 손대지 않는다</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-teal-50',    border: 'border-teal-300',    text: 'text-teal-900',    icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — DAG 다이어그램 + 단계별 특수 패널 (teal 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      chaos:    { icon: '⚠️', label: '흩어진 변환' },
      dag:      { icon: '🔗', label: 'ref · DAG' },
      material: { icon: '🧱', label: '머티리얼라이제이션' },
      test:     { icon: '🧪', label: '테스트·문서' },
      workflow: { icon: '🚀', label: '실전 워크플로' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.dag;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-teal-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>dbt 변환 계층 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-teal-700 font-mono mb-2 px-2 py-1 rounded bg-teal-50 border border-teal-200">
            현재 처리: {state.engineDetail}
          </div>

          <DagDiagram focus={state.focus} />

          {state.panel === 'chaos' && <ChaosBox />}
          {state.panel === 'dag' && (
            <div className="mt-3 rounded-lg border-2 border-teal-300 bg-white p-3 text-[11px] text-teal-900">
              <div className="font-bold mb-1">🌱 ref() 로 그래프가 자란다</div>
              <div className="text-[10px] text-slate-700 leading-relaxed">
                <span className="font-mono bg-teal-50 px-1 rounded">{'{{ ref(\'stg_orders\') }}'}</span> 한 줄을 쓰는 순간,
                dbt는 "이 모델이 stg_orders에 의존"을 기록한다. 모델을 더 추가할수록 위 그래프의 화살표가 늘고,
                dbt는 매 실행마다 위상 정렬로 <b>부모 먼저, 자식 나중</b>을 자동 보장한다. 크론 시각 눈치싸움이 사라진다.
              </div>
            </div>
          )}
          {state.panel === 'material' && <MaterialBox />}
          {state.panel === 'test' && <TestBox />}
          {state.panel === 'workflow' && <WorkflowBox />}

          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      const tabs = [
        { id: 'sql', name: 'models/*.sql' },
        { id: 'yaml', name: 'schema.yml' },
      ];

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <div className="ml-3 flex gap-1">
              {tabs.map((t) => (
                <span
                  key={t.id}
                  className={`text-[11px] font-mono px-2 py-0.5 rounded-t ${code.file === t.id ? 'bg-[#282c34] text-teal-300 border-t border-x border-slate-600' : 'text-slate-500'}`}
                >{t.name}</span>
              ))}
            </div>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="px-3 pt-1.5 text-[10px] text-slate-400 font-mono border-b border-slate-700/50">{code.filename}</div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-teal-400/15 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-teal-600 text-white font-bold">DW</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-teal-100 text-teal-800 border border-teal-300">Part III · ETL</span>
                  <span className="text-[10px] text-teal-700 font-mono">III-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-teal-900">III-2-1. dbt로 변환 계층 관리</h1>
                <p className="text-sm text-teal-800/80">SQL로 하는 소프트웨어 엔지니어링 — 변환을 코드처럼 버전·테스트·문서화하기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-teal-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-teal-800 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-teal-800 text-white' : 'bg-teal-600 text-white hover:bg-teal-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-teal-400 bg-white text-teal-800 hover:bg-teal-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-500 bg-white px-4 py-3 text-sm text-teal-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                스케줄러에 흩어진 변환 SQL은 의존 불명·테스트 없음·문서 없음의 무법지대다 — dbt는 "변환도 소프트웨어"라는 관점으로 이를 코드로 모은다.
                모델(SELECT 하나)과 ref()로 의존 DAG를 자동 구성해 순서를 보장하고, staging→intermediate→marts 계층으로 쌓는다.
                머티리얼라이제이션(view·table·incremental·ephemeral)으로 물리화 전략을 고르고, schema.yml의 스키마 테스트(unique·not_null·relationships·accepted_values)가 CI에서 데이터 품질을 막아선다.
                description은 dbt docs가 리니지로 자동 생성하고, snapshot은 SCD를 자동화하며, 같은 코드가 dev→staging→prod로 환경 분리되어 배포된다.
                이렇게 변환은 버전·테스트·문서화된 코드가 된다 — 다음 장에서는 이를 매일 안전하게 돌리는 멱등성·backfill을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['dbt', 'ref', 'DAG', 'materialized', 'incremental', 'is_incremental', '스키마테스트', 'dbt_docs', 'snapshot', '환경분리', 'dbtCore', 'dbtCloud'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-teal-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
