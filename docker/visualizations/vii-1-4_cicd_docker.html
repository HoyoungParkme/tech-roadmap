  <!--
    VII-1-4. CI/CD with Docker — GitHub Actions로 빌드/푸시 자동화
    학습 목표: 사람 손으로 docker build/push 하던 흐름을 GitHub Actions + build-push-action +
              metadata-action 으로 자동화하고, PR마다 빌드 → 테스트 → registry 흐름까지 5단계로 본다.
    핵심 비유: 컨베이어 벨트 — git push 하는 순간 벨트가 돌아 빌드/태깅/푸시까지 알아서 굴러간다
    패턴: fastapi v1 — 좌(LiveDataPane: git push → CI 파이프라인 → registry → 배포) / 우(VSCode CodeViewer)
    색상: docker sky
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // CI 파이프라인 단계 — 좌측 컨베이어 벨트의 칸들
    //   build  : Dockerfile → 이미지
    //   test   : 컨테이너 띄워 smoke test
    //   tag    : metadata-action 이 sha/branch/semver 부여
    //   push   : registry 로 업로드
    // ─────────────────────────────────────────────────────
    const PIPELINE = [
      { id: 'checkout', label: 'checkout', icon: '📥', desc: '소스 받기' },
      { id: 'build',    label: 'build',    icon: '🔨', desc: '이미지 빌드' },
      { id: 'test',     label: 'test',     icon: '🧪', desc: '테스트 실행' },
      { id: 'tag',      label: 'tag',      icon: '🏷️', desc: '태그 부여' },
      { id: 'push',     label: 'push',     icon: '⬆️', desc: 'registry 푸시' },
    ];

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 — LiveDataPane 이 읽는 dataState
    //   phase            : 'manual' | 'on-push' | 'build-push' | 'tags' | 'pr-pipeline'
    //   trigger          : 'human' | 'git-push' | 'pr-open' | null
    //   activeStages     : 활성/통과한 PIPELINE 단계 id 배열
    //   tags             : registry 에 올라간 이미지 태그 목록
    //   registryActive   : registry 박스 강조 여부
    //   prMode           : true 면 PR 컨텍스트 (push 차단)
    //   manualPain       : Step 1 — 수동 빌드 위험성 강조
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const C1 = {lang:"bash", filename:"manual-bad.sh", lines:["# Step 1. 수동 빌드/푸시 — 자동화 전 흔한 풍경","","# 1) 매번 손으로 빌드","docker build -t myapp:latest .","","# 2) 태그를 손으로 붙임 (여기서 오타·버전 혼선 단골 발생)","docker tag myapp:latest ghcr.io/acme/myapp:1.2.0","","# 3) 레지스트리 로그인도 매번 (또는 평소엔 생략하다 잊어버림)","echo $GHCR_TOKEN | docker login ghcr.io -u $USER --password-stdin","","# 4) push 도 손으로 — 잊으면 새 이미지가 안 올라감","docker push ghcr.io/acme/myapp:1.2.0","","# ─── 문제점 ───","#  • 태그 오타 (1.2.0 vs 1.20) — registry 가 그대로 받아버림","#  • 로컬 캐시·네트워크에 따라 결과가 미묘하게 다름 (\"내 노트북에선 됐는데\")","#  • 배포 권한이 특정 인원 한 명에게 묶임 → 휴가/퇴사 시 멈춤","#  • 어떤 커밋이 이미지로 올라갔는지 추적이 안 됨","#  • 테스트를 깜빡하고 push 해버려도 막을 장치가 없음","","# 한 줄 요약: \"사람의 의지\" 가 빌드/푸시의 유일한 안전장치다.","#            git push 만 하면 나머지가 자동으로 돌아가야 한다."]};
    const C2 = {lang:"yaml", filename:"gh-actions.yml", lines:["# Step 2. .github/workflows/docker.yml — 트리거 정의","","name: docker-image","","on:","  push:","    branches: [main]            # main 푸시 → 정식 배포 이미지","    tags:     [\"v*.*.*\"]        # v1.2.0 같은 semver 태그","  pull_request:","    branches: [main]            # PR 도 트리거 (Step 5 에서 활용)","","jobs:","  build:","    runs-on: ubuntu-latest","    steps:","      - name: checkout","        uses: actions/checkout@v4","","      - name: 환경 정보 출력","        run: |","          echo \"ref     = ${{ github.ref }}\"","          echo \"sha     = ${{ github.sha }}\"","          echo \"event   = ${{ github.event_name }}\"","","# ─── 핵심 ───","#  • on.push.branches  → 어떤 브랜치 푸시에 반응할지","#  • on.push.tags      → 릴리즈 태그도 같은 워크플로우에서 처리","#  • actions/checkout  → 러너에 소스 코드 내려받기","#  • github.* 컨텍스트 → 어떤 커밋/이벤트인지 모든 정보 제공","","# 아직 build/push 는 없다. 다음 단계에서 build-push-action 을 붙인다."]};
    const C3 = {lang:"yaml", filename:"build-push.yml", lines:["# Step 3. build-push-action — 빌드와 푸시를 한 액션이 처리","","jobs:","  build:","    runs-on: ubuntu-latest","    permissions:","      contents: read","      packages: write           # GHCR 푸시에 필수","","    steps:","      - uses: actions/checkout@v4","","      - name: BuildKit 빌더 활성화","        uses: docker/setup-buildx-action@v3","","      - name: GHCR 로그인","        uses: docker/login-action@v3","        with:","          registry: ghcr.io","          username: ${{ github.actor }}","          password: ${{ secrets.GITHUB_TOKEN }}","","      - name: 빌드 + 푸시","        uses: docker/build-push-action@v5","        with:","          context: .","          push: true               # ← 여기 한 줄로 push까지","          tags: ghcr.io/acme/myapp:latest","          cache-from: type=gha","          cache-to:   type=gha,mode=max","","# ─── 한 액션이 해주는 일 ───","#  • Dockerfile 로 BuildKit 멀티스테이지 빌드","#  • registry 인증 정보 기억 (login-action 결과 재사용)","#  • push: true 면 빌드 직후 그대로 업로드","#  • GHA 캐시(type=gha) 로 레이어 재사용 → 빌드 5분 → 30초"]};
    const C4 = {lang:"yaml", filename:"tags.yml", lines:["# Step 4. metadata-action — 태그를 git 컨텍스트로 자동 생성","","      - name: 태그/라벨 자동 생성","        id: meta","        uses: docker/metadata-action@v5","        with:","          images: ghcr.io/acme/myapp","          tags: |","            type=ref,event=branch          # main, develop ...","            type=ref,event=pr              # pr-123","            type=sha,prefix=sha-           # sha-abc1234","            type=semver,pattern={{version}}     # 1.2.0","            type=semver,pattern={{major}}.{{minor}}  # 1.2","            type=semver,pattern={{major}}        # 1","            type=raw,value=latest,enable={{is_default_branch}}","","      - name: 빌드 + 푸시 (자동 태그 사용)","        uses: docker/build-push-action@v5","        with:","          context: .","          push: true","          tags: ${{ steps.meta.outputs.tags }}     # 여러 태그 동시 push","          labels: ${{ steps.meta.outputs.labels }} # OCI 라벨도 자동","          cache-from: type=gha","          cache-to:   type=gha,mode=max","","# ─── 자동 부여되는 태그 예시 ───","#  main 브랜치 푸시:","#    → main, sha-abc1234, latest","#  v1.2.0 태그 푸시:","#    → 1.2.0, 1.2, 1, latest, sha-abc1234","#  PR #42 오픈:","#    → pr-42, sha-abc1234   (push 는 Step 5 정책으로 결정)","","# 사람은 git tag v1.2.0 한 줄만 적는다. 나머지는 액션이 만든다."]};
    const C5 = {lang:"yaml", filename:"pr-pipeline.yml", lines:["# Step 5. PR 파이프라인 — 빌드/테스트는 항상, push 는 main 일 때만","","on:","  push:","    branches: [main]","    tags:     [\"v*.*.*\"]","  pull_request:","    branches: [main]","","jobs:","  build-test-push:","    runs-on: ubuntu-latest","    permissions:","      contents: read","      packages: write","    steps:","      - uses: actions/checkout@v4","      - uses: docker/setup-buildx-action@v3","","      - name: GHCR 로그인 (PR 도 캐시 push 위해 로그인)","        uses: docker/login-action@v3","        with:","          registry: ghcr.io","          username: ${{ github.actor }}","          password: ${{ secrets.GITHUB_TOKEN }}","","      - name: 메타데이터(태그) 생성","        id: meta","        uses: docker/metadata-action@v5","        with:","          images: ghcr.io/acme/myapp","          tags: |","            type=ref,event=branch","            type=ref,event=pr","            type=sha,prefix=sha-","            type=semver,pattern={{version}}","","      - name: 빌드 (PR/푸시 공통)","        uses: docker/build-push-action@v5","        with:","          context: .","          load: ${{ github.event_name == 'pull_request' }}","          push: ${{ github.event_name != 'pull_request' }}","          tags:   ${{ steps.meta.outputs.tags }}","          labels: ${{ steps.meta.outputs.labels }}","          cache-from: type=gha","          cache-to:   type=gha,mode=max","","      - name: 컨테이너 smoke test (PR 포함 항상)","        run: |","          docker run -d --name app -p 8000:8000 \\","            ghcr.io/acme/myapp:sha-${GITHUB_SHA::7}","          sleep 5","          curl -fsS http://localhost:8000/health","","# ─── 정책 한 줄 요약 ───","#  PR :  build ✓  test ✓  push ✗   (검토 전 운영 registry 오염 방지)","#  main: build ✓  test ✓  push ✓   (정식 태그가 registry 에 박힘)","#  tag : 위와 동일 + semver 태그가 함께 push"]};

    const S1 = { title:"Step 1. 수동 build/push — 사람 실수의 단골 자리", desc:"터미널에서 docker build 후 docker push 하는 흐름은 단순해 보이지만, 태그 오타·빌드 누락·push 빠뜨림·로컬 환경 의존이 매번 발생한다. \"내 노트북에선 됐는데\"가 여기서 시작된다. 게다가 배포가 한 사람의 손에 묶여서 그가 자리를 비우면 멈춘다. 자동화 없이는 재현이 안 된다." };
    const S2 = { title:"Step 2. GitHub Actions on push — git push 가 곧 트리거", desc:"워크플로우 파일을 .github/workflows/ 에 두면 GitHub 가 git push 를 감지해 자동으로 러너를 띄운다. on.push.branches 로 어느 브랜치에서 동작할지, on.tags 로 태그 이벤트도 받을지 정한다. checkout-action 이 소스를 내려받는 첫 단계까지가 \"트리거 + 워크스페이스 준비\" 다. 사람의 손이 빠지는 첫 지점이다." };
    const S3 = { title:"Step 3. docker/build-push-action — 빌드 + push 한 방에", desc:"docker/build-push-action 은 BuildKit 으로 이미지를 만들고 그대로 registry 에 올려준다. setup-buildx-action 으로 빌더를 활성화하고, login-action 으로 GHCR 에 로그인한 뒤 build-push-action 한 단계로 빌드와 푸시가 동시에 끝난다. 여기서 캐시(cache-from/to: gha)도 같이 켜면 빌드 시간이 분 단위에서 초 단위로 떨어진다." };
    const S4 = { title:"Step 4. tag 생성 — sha + branch + semver 자동 부여", desc:"docker/metadata-action 이 git 컨텍스트(브랜치, 태그, sha)를 보고 어떤 이미지 태그를 붙일지 알아서 만들어준다. main 푸시면 latest + sha-abc1234, v1.2.0 태그 푸시면 1.2.0 + 1.2 + 1 + latest 까지 한 번에. build-push-action 이 그 출력을 그대로 받아 같은 이미지에 여러 태그로 push 한다. 태그 오타가 사람 손에서 떠난다." };
    const S5 = { title:"Step 5. PR 파이프라인 — 매 PR마다 빌드 → 테스트 → registry", desc:"PR이 열리면 같은 워크플로우가 돌면서 이미지를 빌드하고 컨테이너 띄워 테스트까지 한다. 단, push: ${{ github.event_name != 'pull_request' }} 로 PR 이미지는 registry 에 올리지 않거나 별도 dev registry 로만 보낸다. 검토 전 코드의 :latest 가 운영에 닿지 않게 막는 핵심 안전장치다. main 머지 직후에야 정식 태그가 registry 에 박힌다." };

    const STEPS = [
      // ── Step 1 ────────────────────────────────────────────────────────
      { ...S1,
        beat:{ label:"매번 손으로 빌드", at:"manual.sh L3–4",
               caption:"docker build를 매번 사람이 직접 실행한다 — 자동화가 전혀 없다.",
               changes:[{"mark":"new","text":"수동 build 실행"}] },
        phase: "manual",
        trigger: "human",
        activeStages: [],
        tags: [],
        registryActive: false,
        prMode: false,
        manualPain: true,
        code:{...C1, highlight:[3,4]},
      },
      { ...S1,
        beat:{ label:"태그도 손으로", at:"manual.sh L6–7",
               caption:"태그를 손으로 붙이다 보니 1.2.0과 1.20 같은 오타가 그대로 registry에 올라간다.",
               changes:[{"mark":"gone","text":"태그 오타 위험"}] },
        phase: "manual",
        trigger: "human",
        activeStages: [],
        tags: [],
        registryActive: false,
        prMode: false,
        manualPain: true,
        code:{...C1, highlight:[6,7]},
      },
      { ...S1,
        beat:{ label:"로그인도 매번", at:"manual.sh L9–10",
               caption:"레지스트리 로그인을 매번 잊거나 반복해야 한다.",
               changes:[{"mark":"read","text":"수동 로그인"}] },
        phase: "manual",
        trigger: "human",
        activeStages: [],
        tags: [],
        registryActive: false,
        prMode: false,
        manualPain: true,
        code:{...C1, highlight:[9,10]},
      },
      { ...S1,
        beat:{ label:"push도 손으로", at:"manual.sh L12–13",
               caption:"push를 잊으면 새 이미지가 registry에 올라가지 않은 채로 넘어간다.",
               changes:[{"mark":"gone","text":"push 누락 위험"}] },
        phase: "manual",
        trigger: "human",
        activeStages: [],
        tags: [],
        registryActive: false,
        prMode: false,
        manualPain: true,
        code:{...C1, highlight:[12,13]},
      },
      { ...S1,
        beat:{ label:"문제점 5가지", at:"manual.sh L15–20",
               caption:"태그 오타, 환경 차이, 배포 권한 편중, 커밋 추적 불가, 테스트 누락까지 — 자동화 없이는 재현이 안 된다.",
               changes:[] },
        phase: "manual",
        trigger: "human",
        activeStages: [],
        tags: [],
        registryActive: false,
        prMode: false,
        manualPain: true,
        code:{...C1, highlight:[15,16,17,18,19,20]},
      },
      { ...S1,
        beat:{ label:"요약 — git push가 트리거여야", at:"manual.sh L22–23",
               caption:"사람의 의지가 아니라 git push 한 번으로 나머지가 자동으로 돌아가야 한다.",
               changes:[{"mark":"changed","text":"자동화 필요성 확인"}] },
        phase: "manual",
        trigger: "human",
        activeStages: [],
        tags: [],
        registryActive: false,
        prMode: false,
        manualPain: true,
        code:{...C1, highlight:[22,23]},
      },
      // ── Step 2 ────────────────────────────────────────────────────────
      { ...S2,
        beat:{ label:"워크플로우 이름", at:"docker.yml L3",
               caption:"워크플로우 이름을 docker-image로 정의한다.",
               changes:[] },
        phase: "on-push",
        trigger: "git-push",

    // ─────────────────────────────────────────────────────
    // 좌측 상단: 트리거 박스 — 사람 / git push / PR
    //   manualPain → 사람 아이콘 + 빨간 경고
    //   trigger 'git-push' → push 이벤트 sky 강조
    //   trigger 'pr-open'  → PR 이벤트 amber 강조
    // ─────────────────────────────────────────────────────
    function TriggerBox({ trigger, manualPain }) {
      if (manualPain) {
        return (
          <div className="rounded-lg border-2 border-rose-300 bg-rose-50 p-3">
            <div className="flex items-center gap-1.5 mb-1.5">
              <span className="text-base">🧑‍💻</span>
              <span className="text-[11px] font-bold text-rose-800">사람이 매번 손으로</span>
            </div>
            <div className="bg-white rounded border border-rose-200 p-1.5 font-mono text-[9px] leading-snug text-slate-600 space-y-0.5">
              <div><span className="text-rose-600">$</span> docker build -t myapp:latest .</div>
              <div><span className="text-rose-600">$</span> docker tag ... 1.2.0</div>
              <div><span className="text-rose-600">$</span> docker login ghcr.io</div>
              <div><span className="text-rose-600">$</span> docker push ...</div>
            </div>
            <div className="text-[9px] mt-1 text-rose-700 font-semibold">
              ✗ 태그 오타 · push 누락 · 권한 한 명에게 묶임
            </div>
          </div>
        );
      }
      const isPush = trigger === 'git-push';
      const isPR   = trigger === 'pr-open';
      return (
        <div className="grid grid-cols-2 gap-2">
          <div className={`rounded-lg border-2 p-2 transition-all duration-500 text-center ${
            isPush ? 'bg-sky-100 border-sky-500 shadow-md' : 'bg-slate-50 border-slate-200 opacity-60'
          }`}>
            <div className="text-base">📤</div>
            <div className={`text-[11px] font-bold ${isPush ? 'text-sky-800' : 'text-slate-400'}`}>git push</div>
            <div className="text-[9px] text-slate-500 mt-0.5 font-mono">on: push (main / tags)</div>
          </div>
          <div className={`rounded-lg border-2 p-2 transition-all duration-500 text-center ${
            isPR ? 'bg-amber-100 border-amber-500 shadow-md' : 'bg-slate-50 border-slate-200 opacity-60'
          }`}>
            <div className="text-base">🔀</div>
            <div className={`text-[11px] font-bold ${isPR ? 'text-amber-800' : 'text-slate-400'}`}>pull request</div>
            <div className="text-[9px] text-slate-500 mt-0.5 font-mono">on: pull_request</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 중앙: CI 파이프라인 — 가로 컨베이어 벨트
    //   activeStages 에 들어 있는 id 까지 sky 점등
    //   마지막 활성 칸은 pulse, 이전은 통과(check)
    // ─────────────────────────────────────────────────────
    function PipelineBox({ activeStages }) {
      const lastActive = activeStages[activeStages.length - 1];
      return (
        <div className="rounded-lg border-2 border-slate-200 bg-white p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">🤖</span>
              <span className="text-[11px] font-bold text-slate-700">GitHub Actions Runner</span>
            </div>
            {activeStages.length > 0 && (
              <span className="text-[9px] bg-sky-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
                running
              </span>
            )}
          </div>
          <div className="flex items-center gap-1">
            {PIPELINE.map((stage, i) => {
              const passed   = activeStages.includes(stage.id);
              const isLast   = stage.id === lastActive;
              return (
                <React.Fragment key={stage.id}>
                  <div className={`flex-1 rounded-md border-2 p-1.5 text-center transition-all duration-500 ${
                    passed
                      ? (isLast ? 'bg-sky-100 border-sky-500 shadow' : 'bg-emerald-50 border-emerald-300')
                      : 'bg-slate-50 border-dashed border-slate-200 opacity-50'
                  }`}>
                    <div className="text-base leading-none">{stage.icon}</div>
                    <div className={`text-[9px] font-bold mt-0.5 ${
                      passed ? (isLast ? 'text-sky-800' : 'text-emerald-700') : 'text-slate-400'
                    }`}>{stage.label}</div>
                    <div className={`text-[8px] ${passed ? 'text-slate-600' : 'text-slate-400'} leading-tight`}>
                      {stage.desc}
                    </div>
                    {passed && !isLast && (
                      <div className="text-[8px] text-emerald-600 font-bold mt-0.5">✓</div>
                    )}
                    {isLast && passed && (
                      <div className="mt-0.5 bg-sky-600 text-white text-[8px] px-1 py-0.5 rounded font-mono font-bold">
                        active
                      </div>
                    )}
                  </div>
                  {i < PIPELINE.length - 1 && (
                    <span className={`text-xs ${
                      activeStages.includes(stage.id) ? 'text-sky-500' : 'text-slate-300'
                    }`}>→</span>
                  )}
                </React.Fragment>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 하단: registry 박스 — 푸시된 이미지 태그 목록
    //   prMode → push 차단 표시 (회색 + 자물쇠)
    //   registryActive → sky 강조
    // ─────────────────────────────────────────────────────
    function RegistryBox({ tags, registryActive, prMode }) {
      const hasTags = tags && tags.length > 0;
      return (
        <div className={`rounded-lg border-2 p-3 transition-all duration-500 ${
          registryActive
            ? 'bg-sky-50 border-sky-400 shadow-md'
            : prMode
              ? 'bg-amber-50 border-amber-300'
              : 'bg-slate-50 border-slate-200 opacity-70'
        }`}>
          <div className="flex items-center justify-between mb-1.5">
            <div className="flex items-center gap-1.5">
              <span className="text-base">📦</span>
              <span className={`text-[11px] font-bold ${
                registryActive ? 'text-sky-800' : prMode ? 'text-amber-800' : 'text-slate-500'
              }`}>
                ghcr.io/acme/myapp
              </span>
            </div>
            {registryActive && (
              <span className="text-[9px] bg-sky-600 text-white px-1.5 py-0.5 rounded font-mono font-bold animate-pulse">
                pushed ✓
              </span>
            )}
            {prMode && (
              <span className="text-[9px] bg-amber-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
                push 차단 🔒
              </span>
            )}
          </div>
          <div className="bg-white rounded border border-slate-200 p-1.5 font-mono text-[9px] leading-snug space-y-0.5 min-h-[80px]">
            {!hasTags && (
              <div className="text-slate-400 italic">아직 푸시된 이미지 없음</div>
            )}
            {hasTags && tags.map((t, i) => (
              <div key={i} className="flex items-center gap-1">
                <span className={prMode ? 'text-slate-400 line-through' : 'text-sky-700 font-semibold'}>
                  {t}
                </span>
                {!prMode && (
                  <span className="ml-auto text-[8px] text-emerald-600 font-bold">✓</span>
                )}
              </div>
            ))}
          </div>
          <div className={`text-[9px] mt-1 ${
            registryActive ? 'text-sky-700 font-semibold' :
            prMode ? 'text-amber-700 font-semibold' :
            'text-slate-400'
          }`}>
            {registryActive && '✓ main / tag 푸시 → 정식 이미지가 등록됨'}
            {prMode && '✗ PR 컨텍스트 — 빌드/테스트만, push 는 main 머지 후'}
            {!registryActive && !prMode && '대기 중'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   상단: 트리거 (사람/push/PR)
    //   중앙: CI 파이프라인 (5칸 컨베이어)
    //   하단: registry 와 푸시된 태그 목록
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📚 git push → CI → registry → 배포</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-2">
            <TriggerBox trigger={step.trigger} manualPain={step.manualPain} />

            {/* 화살표: 트리거 → 파이프라인 */}
            <div className="text-center">
              <div className={`inline-block text-xs font-mono ${
                step.activeStages.length > 0 ? 'text-sky-600 font-bold' : 'text-slate-300'
              }`}>
                ↓ workflow trigger
              </div>
            </div>

            <PipelineBox activeStages={step.activeStages} />

            {/* 화살표: 파이프라인 → registry */}
            <div className="text-center">
              <div className={`inline-block text-xs font-mono ${
                step.registryActive ? 'text-sky-600 font-bold' :
                step.prMode ? 'text-amber-600 font-bold' :
                'text-slate-300'
              }`}>
                {step.prMode ? '↓ push 차단 (PR 컨텍스트)' : '↓ docker push'}
              </div>
            </div>

            <RegistryBox
              tags={step.tags}
              registryActive={step.registryActive}
              prMode={step.prMode}
            />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-sky-500"></span>active
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>passed
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-500"></span>PR mode
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-500"></span>manual risk
            </span>
            <span className="ml-auto font-mono">phase: {step.phase}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js 토큰화
    //   파일명 탭, 윈도우 dot, 라인 번호, 강조 라인
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-sky-500/15 border-l-2 border-sky-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인 — 상태 관리, 자동재생(3000ms), 키보드 단축키
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum VII-1-4</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-sky-600 text-white flex items-center justify-center rounded-full font-bold text-sm">VII</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part VII. Docker 운영 &gt; Chapter 1. Registry · CI/CD</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">VII-1-4. CI/CD with Docker — GitHub Actions로 빌드/푸시 자동화</h1>
                  <p className="text-sm text-slate-500 mt-0.5">손으로 docker build/push → GitHub Actions + build-push-action + metadata-action 으로 컨베이어처럼 자동화</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-sky-50 border-2 border-sky-300 rounded-xl p-3 text-sm text-sky-900">
                💡 정리: 트리거(<strong>on.push / pull_request</strong>) → 빌드(<strong>build-push-action</strong>) → 태그(<strong>metadata-action</strong>) → 푸시 정책(<strong>push: PR이면 false</strong>) — 이 4 가지가 CI/CD with Docker 의 뼈대다. 다음 자료(VII-1-5)에서는 배포(deploy) 흐름까지 이어진다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-sky-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-sky-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-sky-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['GitHub Actions', 'build-push-action', 'metadata-action', 'setup-buildx', 'login-action', 'on: push', 'pull_request', 'GHCR', 'semver tag', 'cache: gha'].map((kw) => (
                <span key={kw} className="bg-sky-50 text-sky-700 px-3 py-1 rounded-full text-xs font-medium border border-sky-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./vii-1-3_security.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; VII-1-3 컨테이너 보안</a>
              <a href="./vii-1-5_deployment.html" className="text-sky-700 hover:text-sky-900 font-medium">VII-1-5 배포 전략 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
