  <!--
    VI-1-5. 로그 수집 — json-file / fluentd / syslog driver
    학습 목표: 컨테이너가 stdout/stderr 로 찍은 한 줄이 어떤 경로로 흘러서
              어디에 저장되고, 어떤 도구로 읽히는지 5단계로 본다.
              json-file(기본) → docker logs → fluentd/syslog 로 외부 전송 → ELK / Loki 에서 검색.
    핵심 비유: 우체국 — 앱은 편지(stdout), driver 는 배달부, 도착지는 디스크/원격 시스템
    패턴: fastapi v1 — 좌(LiveDataPane: 컨테이너 → driver → 외부 시스템) / 우(VSCode CodeViewer)
    색상: docker sky
  -->

    //   active 한 드라이버가 sky 강조됨

    function ContainerBox({ showLogStream }) {
      return (
        <div className="rounded-lg border-2 border-sky-300 bg-sky-50 p-3">
          <div className="flex items-center justify-between mb-2">
            <div className="flex items-center gap-1.5">
              <span className="text-base">🐳</span>
              <span className="text-[11px] font-bold text-sky-800">Container — myapp:1.0</span>
            </div>
            <span className="text-[9px] bg-sky-600 text-white px-1.5 py-0.5 rounded font-mono font-bold">
              stdout / stderr
            </span>
          </div>
          <div className="bg-slate-900 rounded border border-slate-700 p-2 font-mono text-[10px] leading-tight min-h-[5.5rem]">
            {showLogStream ? (
              LOG_LINES.map((l, i) => {
                const color =
                  l.level === 'ERROR' ? 'text-rose-400' :
                  l.level === 'WARN'  ? 'text-amber-300' : 'text-slate-200';
                return (
                  <div key={i} className={color}>
                    <span className="text-slate-500">[{l.time}]</span>{' '}
                    <span className="font-bold">{l.level.padEnd(5)}</span>{' '}
                    {l.msg}
                  </div>
                );
              })
            ) : (
              <div className="text-slate-500 italic">앱이 아직 출력 전 …</div>
            )}
            <div className="text-slate-500 mt-0.5 animate-pulse">▌</div>
          </div>
          <div className="text-[9px] mt-1 text-sky-700">
            앱 → stdout / stderr 한 통로 (12-factor)
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 중앙: 3개 driver 스위치
    //   activeDriver 와 일치하는 칸만 sky 강조
    // ─────────────────────────────────────────────────────
    function DriverSwitch({ activeDriver }) {
      return (
        <div className="rounded-lg border-2 border-slate-200 bg-white p-2.5">
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[10px] font-bold text-slate-700">log-driver</span>
            <span className="text-[9px] text-slate-400 font-mono">
              {activeDriver ? `→ ${activeDriver}` : '(미선택)'}
            </span>
          </div>
          <div className="grid grid-cols-3 gap-1.5">
            {DRIVERS.map((d) => {
              const on = activeDriver === d.id;
              return (
                <div
                  key={d.id}
                  className={`rounded border-2 p-1.5 text-center transition-all duration-500 ${
                    on
                      ? 'bg-sky-100 border-sky-500 shadow-sm'
                      : 'bg-slate-50 border-slate-200 opacity-60'
                  }`}
                >
                  <div className="text-base">{d.icon}</div>
                  <div className={`text-[10px] font-bold font-mono ${on ? 'text-sky-700' : 'text-slate-500'}`}>
                    {d.label}
                  </div>
                  <div className="text-[8px] text-slate-500 leading-tight">{d.desc}</div>
                  {on && (
                    <div className="mt-0.5 bg-sky-600 text-white text-[8px] px-1 py-0.5 rounded font-mono font-bold">
                      active
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 하단 — 두 갈래 도착지
    //   왼쪽: 호스트 디스크 (json-file)
    //   오른쪽: 외부 시스템 (fluentd/syslog → ELK/Loki)
    //   highlightStorage: 'host' | 'remote' 로 강조
    // ─────────────────────────────────────────────────────
    function StoragePane({
      showJsonFile,
      showDockerLogs,
      showForward,
      externalSystem,
      highlightStorage,
    }) {
      const hostHi = highlightStorage === 'host';
      const remoteHi = highlightStorage === 'remote';
      return (
        <div className="grid grid-cols-2 gap-2">
          {/* 왼쪽: 호스트 디스크 */}
          <div
            className={`rounded-lg border-2 p-2 transition-all duration-500 ${
              hostHi
                ? 'bg-sky-50 border-sky-400 shadow-md'
                : showJsonFile
                ? 'bg-slate-50 border-slate-300'
                : 'bg-slate-50 border-dashed border-slate-200 opacity-50'
            }`}
          >
            <div className="flex items-center gap-1.5 mb-1">
              <span className="text-sm">💽</span>
              <span className={`text-[10px] font-bold ${hostHi ? 'text-sky-800' : 'text-slate-500'}`}>
                호스트 디스크
              </span>
            </div>
            <div className="text-[8px] font-mono text-slate-500 leading-tight break-all">
              /var/lib/docker/<br />containers/&lt;id&gt;/<br />&lt;id&gt;-json.log
            </div>
            {showJsonFile && (
              <div className="mt-1 bg-white border border-slate-200 rounded p-1 font-mono text-[8px] leading-tight text-slate-600">
                <div>{'{"log":"INFO ...","stream":"stdout"}'}</div>
                <div>{'{"log":"WARN ...","stream":"stdout"}'}</div>
                <div>{'{"log":"ERROR ...","stream":"stderr"}'}</div>
              </div>
            )}
            {showDockerLogs && (
              <div className="mt-1 bg-slate-900 rounded p-1 font-mono text-[8px] leading-tight">
                <div className="text-emerald-400">$ docker logs api</div>
                <div className="text-slate-200">INFO  GET /items 200</div>
                <div className="text-rose-300">ERROR POST /items 500</div>
              </div>
            )}
            <div className="text-[8px] mt-1 text-slate-500">
              {hostHi ? '✓ json-file 활성' : '— driver 가 외부면 비워둠'}
            </div>
          </div>

          {/* 오른쪽: 외부 시스템 */}
          <div
            className={`rounded-lg border-2 p-2 transition-all duration-500 ${
              remoteHi
                ? 'bg-sky-50 border-sky-400 shadow-md'
                : showForward
                ? 'bg-slate-50 border-slate-300'
                : 'bg-slate-50 border-dashed border-slate-200 opacity-50'
            }`}
          >
            <div className="flex items-center gap-1.5 mb-1">
              <span className="text-sm">📡</span>
              <span className={`text-[10px] font-bold ${remoteHi ? 'text-sky-800' : 'text-slate-500'}`}>
                외부 시스템
              </span>
            </div>
            {showForward ? (
              <div className="space-y-1">
                {/* 1단계: 수집기 */}
                <div className="bg-white border border-sky-200 rounded p-1 text-center">
                  <div className="text-[10px]">📡</div>
                  <div className="text-[9px] font-bold text-sky-700 font-mono">
                    {externalSystem === 'syslog-server' ? 'syslog server' : 'Fluentd Aggregator'}
                  </div>
                  <div className="text-[8px] text-slate-500">tcp:24224 / 514</div>
                </div>
                <div className="text-center text-sky-500 text-xs leading-none">▼</div>
                {/* 2단계: 저장 + 시각화 */}
                {externalSystem === 'elk' ? (
                  <>
                    <div className="bg-white border border-amber-300 rounded p-1 text-center">
                      <div className="text-[10px]">🗄️</div>
                      <div className="text-[9px] font-bold text-amber-700 font-mono">Elasticsearch</div>
                      <div className="text-[8px] text-slate-500">인덱싱 · 저장</div>
                    </div>
                    <div className="text-center text-sky-500 text-xs leading-none">▼</div>
                    <div className="bg-white border border-emerald-300 rounded p-1 text-center">
                      <div className="text-[10px]">📊</div>
                      <div className="text-[9px] font-bold text-emerald-700 font-mono">Kibana</div>
                      <div className="text-[8px] text-slate-500">검색 · 대시보드</div>
                    </div>
                  </>
                ) : (
                  <div className="bg-white border border-slate-200 rounded p-1 text-center">
                    <div className="text-[10px]">▾</div>
                    <div className="text-[9px] font-bold text-slate-600 font-mono">ES / Loki / …</div>
                    <div className="text-[8px] text-slate-500">다음 stage 로 라우팅</div>
                  </div>
                )}
              </div>
            ) : (
              <div className="text-[9px] text-slate-400 italic mt-2">
                driver 가 json-file 이면 비워둠 (호스트만 사용)
              </div>
            )}
            <div className="text-[8px] mt-1 text-slate-500">
              {remoteHi ? '✓ 원격 수집 중' : '— 아직 외부 전송 안 함'}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   상단: 컨테이너 + stdout 로그 줄
    //   중앙: 3개 driver 스위치 (active 만 강조)
    //   하단: 호스트 디스크 vs 외부 시스템 두 박스
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📚 컨테이너 → log driver → 도착지</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-2">
            <ContainerBox showLogStream={step.showLogStream} />

            {/* 화살표: driver 로 */}
            <div className="text-center">
              <div
                className={`inline-block text-xs font-mono ${
                  step.activeDriver ? 'text-sky-600 font-bold' : 'text-slate-300'
                }`}
              >
                ↓ Docker 엔진이 캡처 → log-driver 로 전달
              </div>
            </div>

            <DriverSwitch activeDriver={step.activeDriver} />

            {/* 화살표: 도착지로 */}
            <div className="text-center">
              <div
                className={`inline-block text-xs font-mono ${
                  step.highlightStorage ? 'text-sky-600 font-bold' : 'text-slate-300'
                }`}
              >
                ↓ driver 가 정한 도착지로
              </div>
            </div>

            <StoragePane
              showJsonFile={step.showJsonFile}
              showDockerLogs={step.showDockerLogs}
              showForward={step.showForward}
              externalSystem={step.externalSystem}
              highlightStorage={step.highlightStorage}
            />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-sky-500"></span>active
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded border border-slate-300 bg-white"></span>idle
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-400"></span>WARN
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-400"></span>ERROR
            </span>
            <span className="ml-auto font-mono">phase: {step.phase}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js 토큰화
    //   파일명 탭, 윈도우 dot, 라인 번호, 강조 라인
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-sky-500/15 border-l-2 border-sky-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인 — 상태 관리, 자동재생(3000ms), 키보드 단축키
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum VI-1-5</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-sky-600 text-white flex items-center justify-center rounded-full font-bold text-sm">VI</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part VI. Docker 운영 &gt; Chapter 1. 모니터링 / 로그</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">VI-1-5. 로그 수집 — json-file / fluentd / syslog</h1>
                  <p className="text-sm text-slate-500 mt-0.5">stdout 한 줄이 어떤 driver 를 타고 어디로 가서 어떻게 검색되는지 5단계로</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-sky-50 border-2 border-sky-300 rounded-xl p-3 text-sm text-sky-900">
                💡 정리: <strong>stdout</strong> → <strong>log-driver</strong>(json-file/fluentd/syslog) → <strong>도착지</strong>(호스트 파일 / 원격 수집기) → <strong>EFK / PLG</strong> 로 검색·시각화. 다음(VI-1-6)에서는 같은 흐름의 메트릭 버전을 본다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-sky-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-sky-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-sky-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['stdout', 'stderr', 'log-driver', 'json-file', 'docker logs', 'fluentd', 'syslog', 'EFK', 'Loki', 'Grafana'].map((kw) => (
                <span key={kw} className="bg-sky-50 text-sky-700 px-3 py-1 rounded-full text-xs font-medium border border-sky-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./vi-1-4_resource_limits.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; VI-1-4 리소스 제한</a>
              <a href="./vi-1-6_metrics_prometheus.html" className="text-sky-700 hover:text-sky-900 font-medium">VI-1-6 메트릭 / Prometheus &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
