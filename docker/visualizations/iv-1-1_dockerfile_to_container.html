  <!--
    IV-1-1. Dockerfile → Image → Container — 3단계 흐름
    학습 목표 : Dockerfile 한 장이 docker build를 거쳐 불변 이미지(레이어 묶음)가 되고,
                docker run 한 줄로 RW 레이어가 추가된 컨테이너가 되는 전 과정을 5단계로 본다.
                마지막에는 commit으로 컨테이너 → 이미지 역방향까지 다룬다.
    핵심 비유 : 레시피(Dockerfile) → 냉동 완성품(Image) → 전자레인지에 돌린 1인분(Container)
    패턴      : fastapi v1 — 좌(LiveDataPane: Dockerfile/Image/Container 3 박스) / 우(VSCode CodeViewer)
    색상      : docker sky
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // Dockerfile 명령어 한 줄씩 — Image 박스 layer 시각화에서 사용
    //   각 명령어가 빌드되면 layer 한 칸씩 채워진다
    // ─────────────────────────────────────────────────────
    const DOCKERFILE_COMMANDS = [
      { instr: 'FROM',    arg: 'python:3.11-slim',  size: '125 MB', kind: 'base' },
      { instr: 'WORKDIR', arg: '/app',              size: '0 B',    kind: 'meta' },
      { instr: 'COPY',    arg: 'requirements.txt .', size: '1 KB',   kind: 'fs'   },
      { instr: 'RUN',     arg: 'pip install ...',   size: '14 MB',  kind: 'fs'   },
      { instr: 'COPY',    arg: '. .',               size: '2 MB',   kind: 'fs'   },
      { instr: 'ENV',     arg: 'PORT=8000',         size: '0 B',    kind: 'meta' },
      { instr: 'EXPOSE',  arg: '8000',              size: '0 B',    kind: 'meta' },
      { instr: 'CMD',     arg: '["uvicorn", ...]',  size: '0 B',    kind: 'meta' },
    ];

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 — LiveDataPane이 읽는 dataState
    //   phase            : 'write' | 'build' | 'inspect' | 'run' | 'commit'
    //   dockerfileLit    : Dockerfile 박스 강조 여부
    //   layersBuilt      : 빌드 완료된 layer 수 (0~8)
    //   imageMeta        : 이미지 메타데이터 표시 여부 (Step 3에서만)
    //   containerActive  : 컨테이너 실행 중 (RW layer 추가 표시)
    //   commitArrow      : Step 5 — 컨테이너 → 새 이미지 역방향 화살표
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      write: {
        lang: 'dockerfile', filename: 'Dockerfile', lines: [
          '# Step 1. 이미지 설계도를 코드로 — 명령어 4 종류만 알면 시작 OK',
          '',
          '# 1) FROM — 베이스 이미지 (모든 빌드는 여기서 출발)',
          'FROM python:3.11-slim',
          '',
          '# 2) WORKDIR — 컨테이너 안 작업 디렉터리',
          'WORKDIR /app',
          '',
          '# 3) COPY — 호스트 → 이미지로 파일 복사',
          '#    requirements.txt 를 먼저 복사하면 캐시 적중률↑',
          'COPY requirements.txt .',
          '',
          '# 4) RUN — 빌드 시 1회 실행되어 layer 로 박제됨',
          'RUN pip install --no-cache-dir -r requirements.txt',
          '',
          '# 5) 애플리케이션 소스 복사',
          'COPY . .',
          '',
          '# 6) ENV / EXPOSE — 메타데이터 (실행 시 참고됨)',
          'ENV PORT=8000',
          'EXPOSE 8000',
          '',
          '# 7) CMD — 컨테이너 시작 시 실행될 기본 명령',
          'CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]',
          '',
          '# ─── 핵심 정리 ───',
          '#  • Dockerfile 은 텍스트 파일 — git 으로 버전 관리',
          '#  • 한 줄 = 한 layer (RUN/COPY 는 fs layer, ENV/CMD 는 메타데이터)',
          '#  • 아직 빌드 전 — 이미지도 컨테이너도 없다',
        ],
      },
      build: {
        lang: 'bash', filename: 'build.sh', lines: [
          '# Step 2. docker build — Dockerfile → Image (layer 누적)',
          '',
          '# 빌드 실행 (현재 디렉터리의 Dockerfile 사용)',
          'docker build -t myapp:1.0 .',
          '',
          '#  → [1/8] FROM python:3.11-slim          ← 125 MB layer',
          '#  → [2/8] WORKDIR /app                    ← 메타데이터',
          '#  → [3/8] COPY requirements.txt .         ← 1 KB  layer',
          '#  → [4/8] RUN pip install ...             ← 14 MB layer (★ 보통 최대)',
          '#  → [5/8] COPY . .                        ← 2 MB  layer',
          '#  → [6/8] ENV PORT=8000                   ← 메타데이터',
          '#  → [7/8] EXPOSE 8000                     ← 메타데이터',
          '#  → [8/8] CMD ["uvicorn", ...]            ← 메타데이터',
          '#  → exporting to image ...',
          '#  → naming to docker.io/library/myapp:1.0',
          '#  → Successfully built sha256:a1b2c3d4...',
          '',
          '# 빌드 결과 확인',
          'docker images myapp',
          '#  REPOSITORY  TAG   IMAGE ID       CREATED        SIZE',
          '#  myapp       1.0   a1b2c3d4...    5 seconds ago  142 MB',
          '',
          '# ─── 핵심 ───',
          '#  • 위에서 아래로 명령어를 한 줄씩 실행 → 각각 layer 생성',
          '#  • layer 는 immutable (SHA256 해시로 식별)',
          '#  • 같은 명령어 + 같은 입력 → 캐시 재사용 (다음 빌드 빠름)',
          '#  • RUN/COPY 는 파일시스템 변경 → fs layer',
          '#  • ENV/EXPOSE/CMD/WORKDIR 은 메타데이터 (빈 layer)',
        ],
      },
      inspect: {
        lang: 'bash', filename: 'inspect-image.sh', lines: [
          '# Step 3. 이미지 메타데이터 + 다이제스트 — 들여다보기',
          '',
          '# 1) 이미지 상세 정보 (JSON)',
          'docker inspect myapp:1.0',
          '#  [',
          '#    {',
          '#      "Id": "sha256:a1b2c3d4e5f6...",         ← 이미지 다이제스트',
          '#      "RepoTags": ["myapp:1.0"],',
          '#      "Created": "2026-05-07T09:12:33Z",',
          '#      "Architecture": "amd64",',
          '#      "Os": "linux",',
          '#      "Size": 142000000,',
          '#      "Config": {',
          '#        "WorkingDir": "/app",',
          '#        "Env": ["PATH=...", "PORT=8000"],',
          '#        "ExposedPorts": {"8000/tcp": {}},',
          '#        "Cmd": ["uvicorn", "main:app", "--host", "0.0.0.0"]',
          '#      },',
          '#      "RootFS": {',
          '#        "Type": "layers",',
          '#        "Layers": [',
          '#          "sha256:1a1a..(python base)",',
          '#          "sha256:2b2b..(requirements.txt)",',
          '#          "sha256:3c3c..(pip install)",',
          '#          "sha256:4d4d..(app source)"',
          '#        ]',
          '#      }',
          '#    }',
          '#  ]',
          '',
          '# 2) layer 히스토리만 보기 (간략)',
          'docker history myapp:1.0',
          '',
          '# 3) 다이제스트만 추출 (CI 검증에 활용)',
          'docker inspect --format=\'{{.Id}}\' myapp:1.0',
          '#  → sha256:a1b2c3d4e5f6...',
          '',
          '# ─── 핵심 ───',
          '#  • 이미지 = 읽기 전용 layer 묶음 + Config(메타데이터)',
          '#  • 다이제스트(SHA256)가 곧 이미지의 신원',
          '#  • 같은 다이제스트 = 비트 단위로 100% 동일',
          '#  • 컨테이너는 아직 만들지 않았다 (다음 단계)',
        ],
      },
      run: {
        lang: 'bash', filename: 'run.sh', lines: [
          '# Step 4. docker run — Image → Container (RW layer 추가)',
          '',
          '# 1) 컨테이너 생성 + 실행 (-d: 백그라운드, -p: 포트 매핑)',
          'docker run -d -p 8000:8000 --name myapp-1 myapp:1.0',
          '#  → b5d2f8a9c1e0...    ← 컨테이너 ID (다이제스트)',
          '',
          '# 2) 실행 중 확인',
          'docker ps',
          '#  CONTAINER ID  IMAGE       COMMAND        STATUS    PORTS                  NAMES',
          '#  b5d2f8a9c1e0  myapp:1.0   "uvicorn ..."  Up 3 sec  0.0.0.0:8000->8000/tcp  myapp-1',
          '',
          '# 3) 같은 이미지로 두 번째 컨테이너 (각각 독립 RW layer)',
          'docker run -d -p 8001:8000 --name myapp-2 myapp:1.0',
          '#  → 두 컨테이너가 같은 RO layer 공유 + 각자 RW layer 보유',
          '',
          '# 4) 컨테이너 안에서 파일 변경 → RW layer 에만 기록',
          'docker exec myapp-1 sh -c "echo hello > /app/note.txt"',
          'docker exec myapp-1 ls /app/note.txt',
          '#  /app/note.txt           ← 보임 (RW layer 에 있음)',
          'docker exec myapp-2 ls /app/note.txt',
          '#  ls: cannot access ...   ← myapp-2 의 RW layer 에는 없음',
          '',
          '# ─── 핵심 ───',
          '#  • 컨테이너 = 이미지(RO layer) + RW layer + 실행 중인 프로세스',
          '#  • 같은 이미지 → 컨테이너 N 개 (각각 독립된 RW layer)',
          '#  • 컨테이너 삭제(docker rm)해도 이미지는 남는다',
          '#  • 컨테이너의 변경 사항은 기본적으로 휘발성 (volume 으로 영속화)',
        ],
      },
      commit: {
        lang: 'bash', filename: 'commit.sh', lines: [
          '# Step 5. docker commit — Container → 새 Image (역방향)',
          '',
          '# 0) 사전: 컨테이너 안에서 뭔가 변경했다고 가정',
          'docker exec myapp-1 sh -c "apt-get install -y vim"',
          'docker exec myapp-1 sh -c "echo DEBUG=true >> /app/.env"',
          '',
          '# 1) 컨테이너의 현재 상태를 새 이미지로 저장',
          'docker commit \\',
          '  -m "vim 추가 + DEBUG 모드 .env" \\',
          '  -a "edgar" \\',
          '  myapp-1 \\',
          '  myapp:1.0-debug',
          '#  → sha256:f9e8d7c6...        ← 새 이미지 다이제스트',
          '',
          '# 2) 새 이미지 확인',
          'docker images myapp',
          '#  REPOSITORY  TAG         IMAGE ID       SIZE',
          '#  myapp       1.0         a1b2c3d4...    142 MB',
          '#  myapp       1.0-debug   f9e8d7c6...    155 MB   ← 13 MB 증가 (vim + .env)',
          '',
          '# 3) 새 이미지로 다시 컨테이너 실행',
          'docker run -d --name myapp-debug myapp:1.0-debug',
          '',
          '# ─── 왜 commit 을 거의 안 쓰나 ───',
          '#  ✗ Dockerfile 이 아니라 컨테이너 상태에 의존 → 재현 불가',
          '#  ✗ 누가/언제/무엇을 바꿨는지 git diff 같은 추적 불가',
          '#  ✗ 팀원이 같은 이미지를 다시 만들 수 없음',
          '#  ✗ CI/CD 파이프라인에 안 맞음',
          '',
          '# ─── commit 이 유용한 케이스 ───',
          '#  ✓ 디버깅 중 현재 컨테이너 상태를 스냅샷으로 보존',
          '#  ✓ legacy 환경 마이그레이션 (Dockerfile 작성이 어려운 OS 이미지)',
          '#  ✓ 일회성 실험 결과를 임시 보관',
          '',
          '# ─── 권장 ───',
          '#  → 변경 사항을 Dockerfile 에 추가 + docker build 로 재빌드',
          '#  → git 으로 변경 이력 관리 + CI 에서 자동 빌드',
          '',
          '# ─── 다음 단계 ───',
          '#  IV-1-2 : layer 캐싱 — 빌드를 빠르게 만드는 핵심 기법',
          '#  IV-1-3 : Multi-stage 빌드 — 이미지 크기 줄이기',
        ],
      },
    };

    const S1 = { title: 'Step 1. Dockerfile 작성 — 이미지 설계도를 코드로', desc: 'Dockerfile은 이미지를 어떻게 만들지 적은 설계도다. FROM(베이스), COPY(파일 복사), RUN(빌드 시 명령), CMD(컨테이너 시작 명령) 네 가지가 핵심이다. 각 줄이 한 단계가 되어 빌드 시 layer로 쌓인다. 아직 이미지도 컨테이너도 만들어지지 않았다.' };
    const S2 = { title: 'Step 2. docker build — 한 줄씩 layer로 굳히기', desc: '`docker build` 한 줄로 Dockerfile 명령어를 위에서 아래로 한 줄씩 실행한다. 각 명령은 자체 SHA256 해시를 가진 불변 layer가 되어 이전 layer 위에 쌓인다. 빌드가 끝나면 myapp:1.0 태그가 붙은 이미지(layer 묶음)가 로컬 레지스트리에 등록된다.' };
    const S3 = { title: 'Step 3. 이미지 메타데이터 + 다이제스트 — 신원 확인', desc: '`docker inspect`로 이미지 내부를 들여다보면 layer 목록, 환경변수, CMD, ENTRYPOINT, 노출 포트, 작업 디렉터리, RootFS 다이제스트가 모두 보인다. 이 SHA256 다이제스트가 이미지의 신원이다. 같은 다이제스트 = 비트 단위로 동일한 이미지. 컨테이너는 아직 만들지 않았다.' };
    const S4 = { title: 'Step 4. docker run — 컨테이너 생성 (RW layer 추가)', desc: '`docker run`이 이미지를 기반으로 컨테이너를 만든다. 이미지의 layer 위에 얇은 RW(읽기/쓰기) layer가 한 장 더 얹히고, 컨테이너 안에서 일어나는 모든 파일 변경은 그 RW layer에 기록된다. 이미지 자체는 절대 변하지 않는다 (immutable). 같은 이미지로 컨테이너 N개를 만들어도 각각 독립된 RW layer를 가진다.' };
    const S5 = { title: 'Step 5. 역방향 — docker commit으로 컨테이너 → 새 이미지', desc: '드물지만 컨테이너 안에서 변경한 상태를 새 이미지로 굳히고 싶을 때 `docker commit`을 쓴다. 컨테이너의 RW layer가 새 이미지의 마지막 RO layer가 된다. 다만 실무에서는 거의 쓰지 않는다 — 변경 사항을 Dockerfile로 다시 코드화하는 것이 재현성/추적성 측면에서 압도적으로 우월하기 때문. 디버깅·실험 스냅샷 용도에 한정한다.' };

          {/* 메타데이터 박스 (Step 3 에서만) */}
          {imageMeta && (
            <div className="bg-sky-100 border border-sky-300 rounded p-1.5 mt-1.5 space-y-0.5">
              <div className="flex items-center gap-1.5 text-[9px] font-mono text-sky-900">
                <span className="text-slate-500">digest</span>
                <span className="text-sky-700 font-bold">sha256:a1b2c3d4...</span>
              </div>
              <div className="flex flex-wrap gap-1 text-[8px] font-mono">
                <span className="bg-white text-sky-700 px-1.5 py-0.5 rounded border border-sky-200">linux/amd64</span>
                <span className="bg-white text-sky-700 px-1.5 py-0.5 rounded border border-sky-200">142 MB</span>
                <span className="bg-white text-sky-700 px-1.5 py-0.5 rounded border border-sky-200">WORKDIR=/app</span>
                <span className="bg-white text-sky-700 px-1.5 py-0.5 rounded border border-sky-200">EXPOSE=8000</span>
                <span className="bg-white text-sky-700 px-1.5 py-0.5 rounded border border-sky-200">CMD=uvicorn</span>
              </div>
            </div>
          )}

          {!built && (
            <div className="text-[10px] text-slate-400 italic text-center mt-1">
              docker build 대기
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 하단: Container 박스
    //   containerActive = true 이면 RW layer + 실행 표시
    // ─────────────────────────────────────────────────────
    function ContainerBox({ active }) {
      return (
        <div className={`rounded-lg border-2 p-3 transition-all duration-500 ${
          active ? 'bg-emerald-50 border-emerald-500 shadow-md' : 'bg-slate-50 border-dashed border-slate-300 opacity-50'
        }`}>
          <div className="flex items-center justify-between mb-1.5">
            <div className="flex items-center gap-1.5">
              <span className="text-base">🚢</span>
              <span className={`text-[11px] font-bold ${active ? 'text-emerald-800' : 'text-slate-400'}`}>
                Container · myapp-1
              </span>
            </div>
            {active && (
              <span className="text-[9px] bg-emerald-600 text-white px-1.5 py-0.5 rounded font-mono font-bold animate-pulse">
                Up · running
              </span>
            )}
          </div>

          {active ? (
            <div className="space-y-1.5">
              {/* RW layer */}
              <div className="bg-white rounded border-2 border-emerald-400 p-1.5">
                <div className="flex items-center gap-1.5 text-[9px] font-mono">
                  <span className="bg-emerald-600 text-white px-1.5 py-0.5 rounded font-bold">RW</span>
                  <span className="text-emerald-800 font-bold">writable layer (이 컨테이너만의 변경 영역)</span>
                </div>
                <div className="text-[8px] text-emerald-700 font-mono mt-0.5 ml-1">
                  /app/note.txt · /tmp/* · 로그 파일 등 → 컨테이너 삭제 시 휘발
                </div>
              </div>

              {/* RO layers (요약) */}
              <div className="bg-white rounded border border-sky-300 p-1.5">
                <div className="flex items-center gap-1.5 text-[9px] font-mono">
                  <span className="bg-sky-600 text-white px-1.5 py-0.5 rounded font-bold">RO</span>
                  <span className="text-sky-800 font-bold">image layers (8 장 — 모든 컨테이너가 공유)</span>
                </div>
                <div className="text-[8px] text-sky-700 font-mono mt-0.5 ml-1">
                  python:3.11-slim · pip 패키지 · 앱 소스 · 메타데이터
                </div>
              </div>

              {/* 프로세스 + 포트 */}
              <div className="grid grid-cols-2 gap-1.5">
                <div className="bg-white rounded border border-emerald-200 p-1.5">
                  <div className="text-[8px] text-slate-500 font-mono">PID 1 (컨테이너 안)</div>
                  <div className="text-[10px] font-bold text-emerald-800 font-mono">uvicorn main:app</div>
                </div>
                <div className="bg-white rounded border border-emerald-200 p-1.5">
                  <div className="text-[8px] text-slate-500 font-mono">port mapping</div>
                  <div className="text-[10px] font-bold text-emerald-800 font-mono">host:8000 → 8000</div>
                </div>
              </div>
            </div>
          ) : (
            <div className="bg-white rounded border border-dashed border-slate-300 p-2 text-center">
              <div className="text-[10px] text-slate-400 italic">아직 실행되지 않음</div>
              <div className="text-[9px] text-slate-400 font-mono mt-0.5">docker run 대기</div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널
    //   상단 Dockerfile → (build) → Image → (run) → Container 흐름
    //   Step 5 에서는 Container → Image 역방향 화살표 추가 표시
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      const buildArrowActive = step.layersBuilt > 0;
      const runArrowActive = step.containerActive;

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📦 Dockerfile → Image → Container</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="space-y-2">
            <DockerfileBox lit={step.dockerfileLit} />

            {/* 화살표: build (아래로) */}
            <div className="text-center">
              <div className={`inline-block text-xs font-mono ${
                buildArrowActive ? 'text-sky-600 font-bold' : 'text-slate-300'
              }`}>
                ↓ docker build -t myapp:1.0 .
              </div>
            </div>

            <ImageBox layersBuilt={step.layersBuilt} imageMeta={step.imageMeta} />

            {/* 양방향 화살표: run (아래) + commit (위) */}
            <div className="flex items-center justify-center gap-4">
              <div className={`text-xs font-mono ${
                runArrowActive ? 'text-emerald-600 font-bold' : 'text-slate-300'
              }`}>
                ↓ docker run
              </div>
              {step.commitArrow && (
                <div className="text-xs font-mono text-amber-600 font-bold animate-pulse">
                  ↑ docker commit (역방향)
                </div>
              )}
            </div>

            <ContainerBox active={step.containerActive} />
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-300"></span>base layer
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-sky-400"></span>fs layer (RO)
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-slate-300"></span>metadata
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>RW layer
            </span>
            <span className="ml-auto font-mono">phase: {step.phase}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js 토큰화
    //   파일명 탭, 윈도우 dot, 라인 번호, 강조 라인
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 */}
          <div className="overflow-auto max-h-[40rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-sky-500/15 border-l-2 border-sky-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인 — 상태 관리, 자동재생(3000ms), 키보드 단축키
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum IV-1-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-sky-600 text-white flex items-center justify-center rounded-full font-bold text-sm">IV</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part IV. 이미지 빌드 &gt; Chapter 1. Dockerfile</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">IV-1-1. Dockerfile → Image → Container</h1>
                  <p className="text-sm text-slate-500 mt-0.5">설계도(Dockerfile) → 불변 스냅샷(Image, RO layer) → 실행 인스턴스(Container, +RW layer) — 그리고 commit 으로 역방향까지</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-sky-50 border-2 border-sky-300 rounded-xl p-3 text-sm text-sky-900">
                💡 정리: Dockerfile <strong>(설계도)</strong> → <code className="bg-white px-1 rounded text-sky-700">docker build</code> → Image <strong>(RO layer 묶음 + 다이제스트)</strong> → <code className="bg-white px-1 rounded text-sky-700">docker run</code> → Container <strong>(+RW layer + 프로세스)</strong>. 역방향 <code className="bg-white px-1 rounded text-amber-700">docker commit</code> 은 디버깅용 한정. 다음(IV-1-2) layer 캐싱으로 빌드 속도를 챙긴다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-sky-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-sky-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-sky-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['Dockerfile', 'FROM', 'COPY', 'RUN', 'CMD', 'docker build', 'image layer', 'sha256 digest', 'docker run', 'RW layer', 'docker commit'].map((kw) => (
                <span key={kw} className="bg-sky-50 text-sky-700 px-3 py-1 rounded-full text-xs font-medium border border-sky-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./iii-1-4_first_errors.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; III-1-4 첫 에러 디버깅</a>
              <a href="./iv-1-2_layer_caching.html" className="text-sky-700 hover:text-sky-900 font-medium">IV-1-2 layer 캐싱 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
