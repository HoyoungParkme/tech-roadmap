<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    VI-1-3. 헬스체크 타이밍 — depends_on with condition: service_healthy
    학습 목표: 컨테이너가 "시작됨(started)" ≠ "준비됨(healthy)"임을 5단계로 학습.
              depends_on만 → HEALTHCHECK 정의 → condition: service_healthy →
              interval/timeout/retries/start_period 튜닝 → restart policy.
    핵심 비유: 환자(DB) 도착 ≠ 수술 준비 완료. 간호사(HEALTHCHECK)가 체온·혈압을
              주기적으로 측정해 "준비됨"을 확인해야 의사(API)가 진료를 시작.
    패턴: fastapi v1 — 좌(LiveDataPane: 컨테이너 상태머신 + 타임라인) / 우(VSCode CodeViewer)
    색상: docker sky
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 상태 머신 정의 — 컨테이너 라이프사이클
    //   created    : 컨테이너만 생성됨 (아직 실행 전)
    //   starting   : 프로세스 시작 — start_period 내 헬스체크 결과는 무시
    //   healthy    : HEALTHCHECK 성공 → service_healthy 조건 해소
    //   unhealthy  : HEALTHCHECK retries 초과 실패 → 재시작 트리거
    //   restarting : restart policy(always/on-failure)에 의한 재기동
    //   exited     : 종료된 상태 (정책 없으면 그대로 끝)
    // ─────────────────────────────────────────────────────
    const STATE_DEFS = {
      created:    { label: 'created',    icon: '⬜', color: 'slate',   pulse: false },
      starting:   { label: 'starting',   icon: '🟡', color: 'amber',   pulse: true  },
      healthy:    { label: 'healthy',    icon: '✅', color: 'emerald', pulse: false },
      unhealthy:  { label: 'unhealthy',  icon: '❌', color: 'rose',    pulse: true  },
      restarting: { label: 'restarting', icon: '🔄', color: 'sky',     pulse: true  },
      exited:     { label: 'exited',     icon: '⬛', color: 'slate',   pulse: false },
    };

    // ─────────────────────────────────────────────────────
    // 단계별 데이터 — LiveDataPane이 읽는 dataState
    //   problem        : Step의 핵심 문제/메시지
    //   db             : DB 컨테이너 상태 (created/starting/healthy/unhealthy/restarting/exited)
    //   api            : API 컨테이너 상태
    //   timeline       : [{ t, type, text, ok }] — 시간축 이벤트들
    //   hcConfig       : 표시할 HEALTHCHECK 설정 ({interval, timeout, retries, start_period} | null)
    //   restartPolicy  : 'no' | 'on-failure' | 'always' | null
    //   crashAt        : DB가 죽는 시점(s) — Step 5에서 사용
    //   maxTime        : 타임라인 X축 최대값(초)
    //   verdict        : 하단 결론 메시지 ({ ok, text })
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:'yaml', filename:'depends-on-fail.yml', lines:[
        '# Step 1. depends_on 만 — 시작 순서만 보장, 준비 여부는 모름',
        '',
        'services:',
        '  db:',
        '    image: postgres:14',
        '    environment:',
        '      POSTGRES_PASSWORD: secret',
        '    # init.sql 실행에 ~15초 — 그 사이에는 5432 포트 close',
        '',
        '  api:',
        '    image: myapp:1.0',
        '    depends_on:',
        '      - db          # ← "db 컨테이너가 시작되면" api 시작',
        '                    #   "db 가 쿼리 받을 준비됐는지"는 모름',
        '    environment:',
        '      DATABASE_URL: postgresql://app:secret@db:5432/appdb',
        '',
        '# ─── 실행 결과 ───',
        '#   $ docker compose up',
        '#   db-1   | starting PostgreSQL 14...',
        '#   api-1  | sqlalchemy.exc.OperationalError:',
        '#   api-1  |     could not connect: Connection refused',
        '#   api-1 exited with code 1',
        '#   db-1   | database system is ready  ← 너무 늦음',
        '',
        '# ─── 왜 실패했나 ───',
        '#   • depends_on은 "started" 만 본다 (프로세스 기동 여부)',
        '#   • Postgres가 init.sql 실행 동안 listen 안 함',
        '#   • API는 started 직후 connect → Connection refused',
        '#',
        '# 해결 → Step 2 (HEALTHCHECK) + Step 3 (condition)',
      ]},
      s2: {lang:'docker', filename:'healthcheck.Dockerfile', lines:[
        '# Step 2. HEALTHCHECK — Dockerfile 또는 compose 에서 정의',
        '',
        '# ── 방법 A) Dockerfile 에 적기 ──',
        'FROM postgres:14',
        '',
        '# 명령어가 종료코드 0이면 healthy, 그 외면 fail',
        'HEALTHCHECK --interval=5s --timeout=3s --retries=5 \\',
        '  CMD pg_isready -U postgres || exit 1',
        '',
        '# ── 방법 B) compose 에 적기 (실무 더 흔함) ──',
        '# services:',
        '#   db:',
        '#     image: postgres:14',
        '#     healthcheck:',
        '#       test: ["CMD-SHELL", "pg_isready -U postgres"]',
        '#       interval: 5s   timeout: 3s   retries: 5',
        '',
        '# ── 다른 서비스의 흔한 test 명령 ──',
        '# Redis  : redis-cli ping     | MySQL : mysqladmin ping',
        '# Web    : curl -f /health    | TCP   : nc -z localhost 5432',
        '',
        '# ─── 동작 ───',
        '#   1) 시작 직후 → starting',
        '#   2) interval 마다 test 실행 — 0이면 healthy, 그 외 fail+1',
        '#   3) 실패가 retries 누적되면 → unhealthy',
        '',
        '# ─── 확인 ───',
        "#   docker inspect --format='{{.State.Health.Status}}' <ct>",
        '#   docker ps  →  STATUS 컬럼에 (healthy) 표시',
      ]},
      s3: {lang:'yaml', filename:'condition-healthy.yml', lines:[
        '# Step 3. condition: service_healthy — "healthy 까지 대기"',
        '',
        'services:',
        '  db:',
        '    image: postgres:14',
        '    environment:',
        '      POSTGRES_PASSWORD: secret',
        '    healthcheck:',
        '      test: ["CMD-SHELL", "pg_isready -U postgres"]',
        '      interval: 5s',
        '      timeout: 3s',
        '      retries: 5',
        '',
        '  api:',
        '    image: myapp:1.0',
        '    depends_on:',
        '      db:',
        '        condition: service_healthy   # ← 핵심 한 줄',
        '    environment:',
        '      DATABASE_URL: postgresql://app:secret@db:5432/appdb',
        '',
        '# ─── 실행 흐름 ───',
        '#   t=0s  : compose up — db starting, api 보류',
        '#   t=5s  : pg_isready ✗ (init 진행 중)',
        '#   t=10s : pg_isready ✗',
        '#   t=15s : pg_isready ✓ → db healthy → 조건 해소',
        '#   t=16s : api 시작 → 정상 connect ✓',
        '',
        '# ─── condition 종류 ───',
        '#   service_started  : (기본) 시작만 보장 — Step 1',
        '#   service_healthy  : healthcheck 통과까지 대기 ← 핵심',
        '#   service_completed_successfully : 종료까지 대기 (마이그레이션)',
      ]},
      s4: {lang:'yaml', filename:'tune.yml', lines:[
        '# Step 4. 4 파라미터 튜닝 — interval / timeout / retries / start_period',
        '',
        'services:',
        '  db:',
        '    image: postgres:14',
        '    healthcheck:',
        '      test: ["CMD-SHELL", "pg_isready -U postgres"]',
        '      interval: 3s        # 헬스체크 주기 (각 검사 사이 간격)',
        '      timeout: 2s         # 각 검사가 이 시간 안에 안 끝나면 실패 처리',
        '      retries: 3          # 연속 실패 누적 → unhealthy',
        '      start_period: 15s   # 이 시간 동안의 실패는 retries 에 안 들어감',
        '',
        '# ─── 4 파라미터 의미 (괄호=기본값) ───',
        '#   interval(30s) : 다음 검사까지 대기',
        '#   timeout(30s)  : 한 번 검사의 최대 시간',
        '#   retries(3)    : 연속 실패 N회 → unhealthy',
        '#   start_period(0s): 부팅 그레이스 기간',
        '',
        '# ─── 트레이드오프 ───',
        '#   interval : 짧게=빠른 감지·부하↑ / 길게=부하↓·인지 늦음',
        '#   retries  : 적게=즉각·spike 취약 / 많게=안정·인지 늦음',
        '',
        '# ─── 실무 권장값 ───',
        '#   웹 API : i=10s t=3s r=3        | DB : i=5s t=3s r=5',
        '#   JVM/대형: i=10s start_period=60s | 배치/AI : start_period=120s',
        '',
        '# ─── start_period 핵심 ───',
        '#   • 시작 직후 N초의 실패는 retries 에 안 들어감',
        '#   • 그 사이 한 번이라도 성공하면 즉시 healthy',
        '#   → 부팅 느린 앱의 false positive unhealthy 방지',
      ]},
      s5: {lang:'yaml', filename:'restart.yml', lines:[
        '# Step 5. restart policy — 죽으면 자동 재기동',
        '',
        'services:',
        '  db:',
        '    image: postgres:14',
        '    restart: on-failure        # ← 비정상 종료(exit≠0)일 때만 재시작',
        '    healthcheck:',
        '      test: ["CMD-SHELL", "pg_isready -U postgres"]',
        '      interval: 5s',
        '      timeout: 3s',
        '      retries: 3',
        '      start_period: 5s',
        '',
        '  api:',
        '    image: myapp:1.0',
        '    restart: always            # ← 어떤 종료든 항상 재시작',
        '    depends_on:',
        '      db:',
        '        condition: service_healthy',
        '',
        '# ─── 4 가지 정책 ───',
        '#   no             : (기본) 절대 재시작 안 함',
        '#   on-failure     : 비정상 종료(exit≠0) 시만 재시작 ★실무 권장★',
        '#   always         : 어떤 종료든 재시작 (수동 stop 도 daemon 재기동 시 부활)',
        '#   unless-stopped : always 와 같으나 사용자가 stop 한 건 부활 안 함',
        '',
        '# ─── 시나리오 (좌측 시뮬레이션) ───',
        '#   t=0s  : db 시작 → t=3s pg_isready ✓',
        '#   t=5s  : OOM kill (exit 137) → on-failure 발동',
        '#   t=6s  : db restarting → starting',
        '#   t=11s : pg_isready ✓ → healthy 복귀',
        '#   t=12s : api 자동 재연결 (pool 재성립)',
        '',
        '# ─── 함정 ───',
        '#   • always + 잘못된 설정 = 무한 crash loop',
        '#   • restart 는 unhealthy 만으론 발동 안 함',
        '#     → autoheal 외부 도구 또는 K8s liveness 필요',
        '',
        '# 다음: VI-1-4 다중 의존성 / VI-1-5 K8s probe 비교',
      ]},
    };

    const S1 = { title:'Step 1. depends_on만 — DB가 준비되기 전에 API가 시작 (실패)', desc:'depends_on은 "시작 순서"만 보장한다. DB 컨테이너가 docker start로 켜진 직후 곧장 API가 시작되는데, 그 시점 DB는 아직 init.sql 실행 중이라 5432 포트로 연결을 받지 못한다. API는 "Connection refused"를 만나고 그대로 종료된다. 시작됨(started) ≠ 준비됨(healthy)의 전형적 함정.' };
    const S2 = { title:'Step 2. HEALTHCHECK 정의 — pg_isready 로 "준비됨" 판정', desc:'Dockerfile의 HEALTHCHECK 또는 compose의 healthcheck 블록으로 "이 컨테이너가 진짜 준비됐는지"를 판정하는 명령을 정의한다. Postgres는 pg_isready, 웹서버는 curl http://localhost/health 가 정석. 일정 주기(interval)로 명령을 실행해 종료코드 0이면 healthy, 실패가 retries회 누적되면 unhealthy로 표시된다.' };
    const S3 = { title:'Step 3. depends_on with condition: service_healthy — "healthy 될 때까지" 대기', desc:'Step 2의 HEALTHCHECK만 정의하면 상태는 보이지만 API는 여전히 곧장 시작한다. depends_on에 condition: service_healthy를 명시하면 Compose가 DB의 Health.Status가 healthy로 전환될 때까지 API 시작을 보류한다. Step 1에서 실패했던 시나리오가 이 한 줄로 해소된다. 핵심: depends_on의 "조건"을 명시하는 것.' };
    const S4 = { title:'Step 4. interval / timeout / retries / start_period 튜닝', desc:'기본값은 모든 워크로드에 맞지 않는다. 부팅이 30초 걸리는 JVM 앱이면 start_period: 60s를 줘서 그 시간 동안의 실패는 재시도 카운트에 안 들어가게 한다. 너무 짧은 interval은 자체 부하가 되고, 너무 긴 interval은 장애 감지가 늦다. 4 파라미터의 트레이드오프를 이해하면 운영 안정성과 부하 사이의 균형을 잡을 수 있다.' };
    const S5 = { title:'Step 5. restart policy — unhealthy / 비정상 종료 시 자동 재기동', desc:'unhealthy 가 된다고 컨테이너가 자동으로 재시작되진 않는다. 별도로 restart 정책을 명시해야 한다. always는 어떤 종료든 재시작(개발 편하지만 무한 루프 위험), on-failure는 비정상 종료(exit≠0)일 때만 재시작(권장), unless-stopped는 사용자가 명시 stop한 경우만 제외. 아래 시뮬레이션: DB가 5초 살다가 죽고 → restarting → 다시 healthy.' };

    // Step 1 timeline — 모든 beat 가 공유 (전체 시뮬레이션 결과)
    const TL1 = [
      { t: 0,  type: 'event', text: 'compose up — db 시작', ok: null, lane: 'db' },
      { t: 1,  type: 'event', text: 'depends_on 만족 → api 시작', ok: null, lane: 'api' },
      { t: 2,  type: 'fail',  text: 'OperationalError: connection refused', ok: false, lane: 'api' },
      { t: 15, type: 'event', text: 'db 가 뒤늦게 listen 시작', ok: null, lane: 'db' },
    ];
    // Step 2 timeline
    const TL2 = [
      { t: 0,  type: 'event', text: 'compose up — db 시작', ok: null, lane: 'db' },
      { t: 5,  type: 'check', text: 'pg_isready', ok: false, lane: 'db' },
      { t: 10, type: 'check', text: 'pg_isready', ok: false, lane: 'db' },
      { t: 15, type: 'check', text: 'pg_isready', ok: true,  lane: 'db' },
    ];
    // Step 3 timeline
    const TL3 = [
      { t: 0,  type: 'event', text: 'db 시작', ok: null, lane: 'db' },
      { t: 5,  type: 'check', text: 'pg_isready', ok: false, lane: 'db' },
      { t: 10, type: 'check', text: 'pg_isready', ok: false, lane: 'db' },
      { t: 15, type: 'check', text: 'pg_isready ✓ → healthy', ok: true, lane: 'db' },
      { t: 16, type: 'event', text: 'condition 해소 → api 시작', ok: null, lane: 'api' },

        timeline: TL5, hcConfig: { interval:'5s', timeout:'3s', retries:3, start_period:'5s' }, restartPolicy: 'on-failure', crashAt: 5, maxTime: 14,
        verdict:{ ok:true, text:'on-failure 가 실무 표준' },
        code:{...CODE.s5, highlight:[21,22,23,24,25]},
      },
      { ...S5,
        beat:{ label:'시나리오 — OOM kill 후 자동 복구', at:'restart.yml L27–32',
               caption:'db가 5초에 OOM으로 죽고 on-failure 로 재시작돼 11초에 다시 healthy, api가 자동 재연결한다.',
               changes:[{mark:'changed', text:'crash → restarting → healthy'}] },
        db:{ state:'healthy', detail:'재시작 후 정상 (restart: on-failure)' }, api:{ state:'healthy', detail:'재연결 성공' },
        timeline: TL5, hcConfig: { interval:'5s', timeout:'3s', retries:3, start_period:'5s' }, restartPolicy: 'on-failure', crashAt: 5, maxTime: 14,
        verdict:{ ok:true, text:'✓ on-failure 정책 — 비정상 종료만 재시작, 운영 표준' },
        code:{...CODE.s5, highlight:[27,28,29,30,31,32]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // 좌측 상단: 컨테이너 상태머신 (db / api)
    //   각 컨테이너의 현재 state(STATE_DEFS) + detail 표시
    //   pulse 옵션이 있는 상태(starting/unhealthy/restarting)는 애니메이션
    // ─────────────────────────────────────────────────────
    function StateMachineCard({ name, icon, state, detail }) {
      const def = STATE_DEFS[state] || STATE_DEFS.created;
      const cc = {
        slate:   { bg: 'bg-slate-50',   border: 'border-slate-300', text: 'text-slate-700',   dot: 'bg-slate-400' },
        amber:   { bg: 'bg-amber-50',   border: 'border-amber-400', text: 'text-amber-800',   dot: 'bg-amber-400' },
        emerald: { bg: 'bg-emerald-50', border: 'border-emerald-500', text: 'text-emerald-800', dot: 'bg-emerald-500' },
        rose:    { bg: 'bg-rose-50',    border: 'border-rose-500', text: 'text-rose-800',    dot: 'bg-rose-500' },
        sky:     { bg: 'bg-sky-50',     border: 'border-sky-500', text: 'text-sky-800',     dot: 'bg-sky-500' },
      }[def.color];

      return (
        <div className={`rounded-lg border-2 p-2.5 transition-all duration-500 ${cc.bg} ${cc.border}`}>
          <div className="flex items-center justify-between mb-1">
            <div className="flex items-center gap-1.5">
              <span className="text-base">{icon}</span>
              <span className={`text-[11px] font-bold ${cc.text}`}>{name}</span>
            </div>
            <div className="flex items-center gap-1">
              <span className={`w-2 h-2 rounded-full ${cc.dot} ${def.pulse ? 'animate-pulse' : ''}`}></span>
              <span className={`text-[10px] font-mono font-bold ${cc.text}`}>{def.label}</span>
            </div>
          </div>
          <div className={`text-[9px] ${cc.text} opacity-80 leading-tight`}>{detail}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 중앙: 상태 전이 다이어그램 (현재 state 강조)
    // ─────────────────────────────────────────────────────
    function StateDiagram({ activeStates }) {
      const cell = (key) => {
        const def = STATE_DEFS[key];
        const active = activeStates.includes(key);
        const colorMap = {
          slate:   active ? 'bg-slate-200 border-slate-500 text-slate-800'   : 'bg-slate-50 border-slate-200 text-slate-400',
          amber:   active ? 'bg-amber-200 border-amber-600 text-amber-900'   : 'bg-slate-50 border-slate-200 text-slate-400',
          emerald: active ? 'bg-emerald-200 border-emerald-600 text-emerald-900' : 'bg-slate-50 border-slate-200 text-slate-400',
          rose:    active ? 'bg-rose-200 border-rose-600 text-rose-900'      : 'bg-slate-50 border-slate-200 text-slate-400',
          sky:     active ? 'bg-sky-200 border-sky-600 text-sky-900'         : 'bg-slate-50 border-slate-200 text-slate-400',
        };
        return (
          <div className={`px-1.5 py-1 rounded border-2 text-center transition-all duration-500 ${colorMap[def.color]}`}>
            <div className="text-[10px] leading-tight">{def.icon}</div>
            <div className="text-[9px] font-mono font-bold leading-tight">{def.label}</div>
          </div>
        );
      };

      return (
        <div className="rounded-lg border border-slate-200 bg-slate-50 p-2">
          <div className="text-[10px] font-bold text-slate-600 mb-1.5">컨테이너 상태머신 (lifecycle)</div>
          <div className="grid grid-cols-9 gap-1 items-center">
            {cell('created')}
            <span className="text-slate-400 text-center text-[10px]">→</span>
            {cell('starting')}
            <span className="text-slate-400 text-center text-[10px]">→</span>
            {cell('healthy')}
            <span className="text-slate-400 text-center text-[10px]">/</span>
            {cell('unhealthy')}
            <span className="text-slate-400 text-center text-[10px]">→</span>
            {cell('restarting')}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 하단: 시간축 타임라인
    //   db / api 두 lane.
    //   각 lane 에 timeline 이벤트 마커 배치 (시간 비례 좌표).
    //   check 마커는 ✓/✗, event 마커는 작은 점, fail 마커는 빨간 ✗.
    // ─────────────────────────────────────────────────────
    function Timeline({ events, maxTime, lane, dbState, apiState, crashAt }) {
      const laneEvents = events.filter(e => e.lane === lane);
      const tickLabels = [0, Math.round(maxTime / 4), Math.round(maxTime / 2), Math.round(maxTime * 3 / 4), maxTime];

      // 진행 바 색상 결정
      const state = lane === 'db' ? dbState : apiState;
      let barColor = 'bg-slate-200';
      if (state === 'healthy') barColor = 'bg-emerald-200';
      else if (state === 'starting') barColor = 'bg-amber-200';
      else if (state === 'unhealthy') barColor = 'bg-rose-200';
      else if (state === 'restarting') barColor = 'bg-sky-200';
      else if (state === 'exited') barColor = 'bg-slate-300';

      return (
        <div className="flex items-center gap-2">
          <div className="w-10 text-[10px] font-mono font-bold text-slate-600 text-right">
            {lane}
          </div>
          <div className="flex-1">
            <div className="relative h-7 bg-slate-100 rounded-md overflow-visible border border-slate-200">
              {/* 진행 바 */}
              <div
                className={`absolute inset-y-0 left-0 rounded-md transition-all duration-700 ${barColor}`}
                style={{ width: '100%' }}
              ></div>

              {/* crashAt 표시 (Step 5) */}
              {crashAt != null && lane === 'db' && (
                <div
                  className="absolute top-0 bottom-0 border-l-2 border-rose-600 border-dashed"
                  style={{ left: `${(crashAt / maxTime) * 100}%` }}
                  title="crash"
                ></div>
              )}

              {/* 이벤트 마커 — check(✓/✗) / fail(!) / event(점) */}
              {laneEvents.map((ev, i) => {
                const left = `${(ev.t / maxTime) * 100}%`;
                const wrap = 'absolute top-1/2 -translate-y-1/2 -translate-x-1/2 z-10';
                const tt = `${ev.t}s · ${ev.text}`;
                if (ev.type === 'check') {
                  const cls = ev.ok ? 'bg-emerald-500 border-emerald-700' : 'bg-rose-400 border-rose-600';
                  return (
                    <div key={i} className={wrap} style={{ left }}>
                      <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center text-[10px] font-bold shadow-sm text-white ${cls}`} title={tt}>
                        {ev.ok ? '✓' : '✗'}
                      </div>
                    </div>
                  );
                }
                if (ev.type === 'fail') {
                  return (
                    <div key={i} className={wrap} style={{ left }}>
                      <div className="w-5 h-5 rounded-full bg-rose-600 text-white flex items-center justify-center text-[10px] font-bold shadow" title={tt}>!</div>
                    </div>
                  );
                }
                const dotCls = ev.ok === true ? 'bg-emerald-500 border-emerald-700' : ev.ok === false ? 'bg-rose-500 border-rose-700' : 'bg-sky-500 border-sky-700';
                return (
                  <div key={i} className={wrap} style={{ left }}>
                    <div className={`w-2.5 h-2.5 rounded-full border ${dotCls}`} title={tt}></div>
                  </div>
                );
              })}
            </div>
            {/* 틱 라벨 */}
            <div className="flex justify-between text-[9px] text-slate-400 mt-0.5 font-mono">
              {tickLabels.map((t, i) => <span key={i}>{t}s</span>)}
            </div>
          </div>
        </div>
      );
    }

    // 좌측 하단 보조: 이벤트 로그 (텍스트 리스트)
    function EventLog({ events }) {
      return (
        <div className="rounded-lg border border-slate-200 bg-slate-50 p-2 max-h-32 overflow-y-auto">
          <div className="text-[10px] font-bold text-slate-600 mb-1">이벤트 로그</div>
          <div className="space-y-0.5 font-mono text-[9px]">
            {events.map((ev, i) => (
              <div key={i} className="flex items-center gap-1.5">
                <span className="text-slate-400 w-7">{ev.t}s</span>
                <span className={
                  ev.lane === 'db' ? 'w-7 text-sky-700 font-bold' : 'w-7 text-purple-700 font-bold'
                }>{ev.lane}</span>
                <span className={
                  ev.ok === true  ? 'text-emerald-700' :
                  ev.ok === false ? 'text-rose-700' :
                  'text-slate-700'
                }>
                  {ev.ok === true ? '✓ ' : ev.ok === false ? '✗ ' : '· '}
                  {ev.text}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // 좌측 보조: HEALTHCHECK 설정 카드
    function HealthcheckConfig({ cfg, restartPolicy }) {
      if (!cfg && !restartPolicy) {
        return (
          <div className="rounded-lg border-2 border-dashed border-slate-200 bg-slate-50 p-2 text-center">
            <div className="text-[10px] text-slate-400 font-mono">HEALTHCHECK 미정의</div>
          </div>
        );
      }
      return (
        <div className="rounded-lg border-2 border-sky-300 bg-sky-50 p-2">
          <div className="flex items-center justify-between mb-1">
            <div className="text-[10px] font-bold text-sky-800">현재 적용 설정</div>
          </div>
          {cfg && (
            <div className="grid grid-cols-2 gap-1 font-mono text-[9px]">
              <div className="bg-white rounded px-1.5 py-0.5 border border-sky-200">
                <span className="text-slate-500">interval</span>{' '}
                <span className="text-sky-700 font-bold">{cfg.interval}</span>
              </div>
              <div className="bg-white rounded px-1.5 py-0.5 border border-sky-200">
                <span className="text-slate-500">timeout</span>{' '}
                <span className="text-sky-700 font-bold">{cfg.timeout}</span>
              </div>
              <div className="bg-white rounded px-1.5 py-0.5 border border-sky-200">
                <span className="text-slate-500">retries</span>{' '}
                <span className="text-sky-700 font-bold">{cfg.retries}</span>
              </div>
              <div className="bg-white rounded px-1.5 py-0.5 border border-sky-200">
                <span className="text-slate-500">start_period</span>{' '}
                <span className="text-sky-700 font-bold">{cfg.start_period || '–'}</span>
              </div>
            </div>
          )}
          {restartPolicy && (
            <div className="mt-1 bg-white rounded px-1.5 py-1 border border-sky-200 font-mono text-[9px]">
              <span className="text-slate-500">restart</span>{' '}
              <span className="text-rose-700 font-bold">{restartPolicy}</span>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 좌측 패널 전체
    //   상단: db / api 상태 카드 (StateMachineCard)
    //   중상: 상태머신 다이어그램 (StateDiagram)
    //   중간: HEALTHCHECK 설정 (HealthcheckConfig)
    //   하단: db / api 타임라인 + 이벤트 로그
    //   푸터: verdict
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ step }) {
      // 어떤 상태들이 활성인지 — 상태 다이어그램에 강조
      const activeStates = [step.db.state, step.api.state];

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-bold text-slate-700">📊 컨테이너 상태 + 타임라인</h2>
            <span className="text-[10px] text-slate-400 font-mono">live</span>
          </div>
          {step.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {/* 컨테이너 상태 카드 2개 */}
          <div className="grid grid-cols-2 gap-2 mb-2">
            <StateMachineCard name="db (postgres)" icon="🐘" state={step.db.state} detail={step.db.detail} />
            <StateMachineCard name="api (fastapi)" icon="⚡" state={step.api.state} detail={step.api.detail} />
          </div>

          {/* 상태머신 다이어그램 */}
          <div className="mb-2">
            <StateDiagram activeStates={activeStates} />
          </div>

          {/* HEALTHCHECK 설정 */}
          <div className="mb-2">
            <HealthcheckConfig cfg={step.hcConfig} restartPolicy={step.restartPolicy} />
          </div>

          {/* 타임라인 */}
          <div className="rounded-lg border border-slate-200 bg-white p-2.5 mb-2">
            <div className="text-[10px] font-bold text-slate-600 mb-2">시간축 타임라인</div>
            <div className="space-y-2">
              <Timeline
                events={step.timeline}
                maxTime={step.maxTime}
                lane="db"
                dbState={step.db.state}
                apiState={step.api.state}
                crashAt={step.crashAt}
              />
              <Timeline
                events={step.timeline}
                maxTime={step.maxTime}
                lane="api"
                dbState={step.db.state}
                apiState={step.api.state}
                crashAt={null}
              />
            </div>
          </div>

          {/* 이벤트 로그 */}
          <EventLog events={step.timeline} />

          {/* verdict */}
          <div className={`mt-2 rounded-lg px-2.5 py-1.5 text-[10px] font-medium leading-tight ${
            step.verdict.ok
              ? 'bg-emerald-50 border border-emerald-300 text-emerald-800'
              : 'bg-rose-50 border border-rose-300 text-rose-800'
          }`}>
            {step.verdict.text}
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-2 text-[9px] mt-2 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-amber-400"></span>starting
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-emerald-500"></span>healthy
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-rose-500"></span>unhealthy/exit
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2 h-2 rounded bg-sky-500"></span>restarting
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js 토큰화
    //   파일명 탭 + 윈도우 dot + 라인 번호 + 강조 라인
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 */}
          <div className="overflow-auto max-h-[44rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      className={`flex hover:bg-slate-800/50 ${
                        highlighted ? 'bg-sky-500/15 border-l-2 border-sky-400' : ''
                      }`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인 — 상태 관리, 자동재생(3000ms), 키보드 단축키
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum VI-1-3</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-sky-600 text-white flex items-center justify-center rounded-full font-bold text-sm">VI</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part VI. Docker Compose 심화 &gt; Chapter 1. 의존성</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">VI-1-3. 헬스체크 타이밍 — depends_on with condition: service_healthy</h1>
                  <p className="text-sm text-slate-500 mt-0.5">"시작됨(started)" ≠ "준비됨(healthy)" — 5단계로 보는 컨테이너 상태머신과 시작 순서</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-sky-50 border-2 border-sky-300 rounded-xl p-3 text-sm text-sky-900">
                💡 정리: <strong>HEALTHCHECK</strong>(준비 판정) + <strong>condition: service_healthy</strong>(대기) + <strong>start_period</strong>(부팅 그레이스) + <strong>restart: on-failure</strong>(자동 복구) — 이 4 가지 조합이 운영 표준이다. 다음(VI-1-4)에서는 다중 의존성 그래프와 service_completed_successfully 패턴을 다룬다.
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-sky-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-sky-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-sky-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-sky-600 text-white hover:bg-sky-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 키워드 태그 */}
            <div className="flex flex-wrap gap-2 justify-center">
              {['HEALTHCHECK', 'depends_on', 'service_healthy', 'pg_isready', 'start_period', 'restart', 'on-failure'].map((kw) => (
                <span key={kw} className="bg-sky-50 text-sky-700 px-3 py-1 rounded-full text-xs font-medium border border-sky-200">
                  {kw}
                </span>
              ))}
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="./vi-1-2_depends_on.html" className="text-sky-700 hover:text-sky-900 font-medium">&larr; VI-1-2 depends_on 기본</a>
              <a href="./vi-1-4_multi_dependency.html" className="text-sky-700 hover:text-sky-900 font-medium">VI-1-4 다중 의존성 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
