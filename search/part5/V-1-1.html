  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Search V-1-1 — 검색 품질 평가 — nDCG·MRR
    학습 목표: "요즘 검색이 이상해요" 같은 감(感)에 의존한 튜닝을 숫자로 바꾼다.
              (1) 평가셋(골든셋)이 없으면 모든 변경이 도박임을 체험하고
              (2) recall@k·precision@k, (3) MRR, (4) nDCG 를 각각 실제로 계산해 보며
              (5) 어떤 상황에 어떤 지표를 쓰고, 오프라인 평가 파이프라인으로 회귀를 잡는 운영 체계를 세운다.
    패턴: fastapi v1 — 좌(LiveDataPane: 검색 결과에 정답 마킹 → 4지표 실계산 + 민감도 비교 + 파이프라인) / 우(VSCode CodeViewer: eval_metrics.py)
    색상: sky/blue (search 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 평가 없는 튜닝의 위험 → precision/recall → MRR → nDCG → 운영 체계
    //   results  : 검색 결과 리스트. 각 행 = { rank, title, rel }
    //              rel : 등급 관련도 (0=무관, 1=보통, 2=좋음, 3=완벽) / 이진 지표는 rel>=1 을 정답으로 본다
    //   metrics  : 이 단계에서 강조할 지표 계산 (중간값 포함)
    //   code     : 우측 CodeViewer 파일 (eval_metrics.py / golden_set.py / eval_runner.py)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      golden: {lang:"python", filename:"golden_set.py (평가셋 = 자를 만든다)", lines:[
        "\"\"\"",
        "golden_set.py — 검색 품질의 \"자(尺)\": 질의-정답 문서 쌍의 모음.",
        "이 골든셋이 없으면 모든 튜닝은 \"한 곳 고치고 열 곳 망가뜨리는\" 도박이다.",
        "\"\"\"",
        "from dataclasses import dataclass, field",
        "",
        "",
        "@dataclass",
        "class QueryCase:",
        "    \"\"\"질의 하나에 대한 평가 케이스.",
        "    query    : 사용자가 친 검색어",
        "    relevance: {문서id: 관련도 등급}  (0=무관,1=보통,2=좋음,3=완벽)",
        "               이진 지표는 등급>=1 을 \"정답\"으로 본다.",
        "    \"\"\"",
        "    query: str",
        "    relevance: dict[str, int] = field(default_factory=dict)",
        "",
        "    def relevant_ids(self) -> set[str]:",
        "        \"\"\"이진 정답 집합 — 등급 1 이상인 문서 전체.\"\"\"",
        "        return {doc_id for doc_id, g in self.relevance.items() if g >= 1}",
        "",
        "",
        "# 로그에서 뽑은 대표 질의 100~500개를 이렇게 라벨링해 둔다.",
        "GOLDEN_SET = [",
        "    QueryCase(\"노트북\", {\"p-01\": 3, \"p-02\": 2, \"p-09\": 1}),",
        "    QueryCase(\"삼성\",   {\"p-01\": 3, \"p-14\": 2}),",
        "    QueryCase(\"케이스\", {\"p-21\": 2, \"p-22\": 2, \"p-23\": 1}),",
        "    # ... 100~500 질의",
        "]",
        "",
        "# 왜 100~500 인가?",
        "#   너무 적으면 우연에 흔들리고, 너무 많으면 라벨링 비용이 폭발한다.",
        "#   대표 질의 수백 개면 회귀(개악)를 통계적으로 잡아내기에 충분하다.",
      ]},
      pr: {lang:"python", filename:"eval_metrics.py (① precision@k · recall@k)", lines:[
        "\"\"\"",
        "eval_metrics.py — 4대 검색 품질 지표의 순수 파이썬 구현.",
        "입력은 항상 (검색 결과 문서id 리스트, 정답 정보) 두 가지뿐이다.",
        "\"\"\"",
        "import math",
        "",
        "",
        "def precision_at_k(ranked_ids: list[str],",
        "                   relevant: set[str], k: int) -> float:",
        "    \"\"\"상위 k 개 중 정답의 비율 — \"첫 화면이 얼마나 깨끗한가\".\"\"\"",
        "    top_k = ranked_ids[:k]",
        "    hits = sum(1 for doc_id in top_k if doc_id in relevant)",
        "    return hits / k",
        "",
        "",
        "def recall_at_k(ranked_ids: list[str],",
        "                relevant: set[str], k: int) -> float:",

    // ─────────────────────────────────────────────────────
    // 등급 관련도 → 배지 스타일 (sky/blue 톤)
    //   3=완벽, 2=좋음, 1=보통, 0=무관
    // ─────────────────────────────────────────────────────
    const REL_STYLE = {
      3: { bg: 'bg-emerald-50', border: 'border-emerald-400', text: 'text-emerald-800', label: '완벽 (3)' },
      2: { bg: 'bg-sky-50',     border: 'border-sky-400',     text: 'text-sky-800',     label: '좋음 (2)' },
      1: { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-800',   label: '보통 (1)' },
      0: { bg: 'bg-slate-50',   border: 'border-slate-200',   text: 'text-slate-500',   label: '무관 (0)' },
    };

    function ResultRow({ row }) {
      const v = REL_STYLE[row.rel] || REL_STYLE[0];
      return (
        <div className={`rounded border ${v.bg} ${v.border} px-2 py-1 flex items-center gap-2`}>
          <span className="text-[10px] font-mono font-bold text-sky-700 w-8 text-center shrink-0">#{row.rank}</span>
          <div className="min-w-0 flex-1">
            <div className="text-[11px] font-bold text-slate-800 truncate">{row.title}</div>
            {row.rr && <div className="text-[9px] text-sky-600 font-mono">RR = {row.rr}</div>}
          </div>
          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap ${v.text} bg-white/70 border border-current/20`}>
            {row.rel >= 1 ? '✓' : '·'} {v.label}
          </span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 눈대중 튜닝 위험 표 + 골든셋 만들기
    // ─────────────────────────────────────────────────────
    function RiskBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">🎲 {box.title}</div>
          <div className="space-y-1">
            {box.before.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px]">
                <span className="w-16 shrink-0 font-mono font-bold text-slate-700">"{r.q}"</span>
                <span className="text-slate-400">→</span>
                <span className={`flex-1 font-bold ${r.tone === 'good' ? 'text-emerald-700' : 'text-red-700'}`}>
                  {r.tone === 'good' ? '✓ ' : '✗ '}{r.change}
                </span>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-red-900">{box.note}</div>
        </div>
      );
    }

    function GoldenBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">📏 {box.title}</div>
          <div className="space-y-1.5">
            {box.steps.map((s, i) => (
              <div key={i} className="flex gap-2 rounded border border-sky-200 bg-sky-50 p-1.5">
                <span className="text-base">{s.icon}</span>
                <div className="min-w-0">
                  <div className="text-[11px] font-bold text-sky-900">{s.head}</div>
                  <div className="text-[10px] text-slate-600 leading-snug">{s.body}</div>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-sky-900 font-bold">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — precision/recall 실계산 + RAG 박스
    // ─────────────────────────────────────────────────────
    const CALC_TONE = { sky: 'text-sky-700', emerald: 'text-emerald-700' };
    function MetricCalc({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🧮 {box.title}</div>
          <div className="space-y-1">
            {box.lines.map((l, i) => (
              <div key={i} className="flex items-center justify-between text-[11px] border-b border-slate-100 py-0.5">
                <span className="text-slate-600">{l.label}</span>
                <span className={`font-mono font-bold ${CALC_TONE[l.tone] || 'text-slate-800'}`}>{l.value}</span>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-sky-900">{box.note}</div>
        </div>
      );
    }

    function RagBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-emerald-400 bg-emerald-50 p-3">
          <div className="text-xs font-bold text-emerald-900 mb-1">👑 {box.title}</div>
          <div className="text-[10px] text-emerald-900 leading-snug">{box.body}</div>
          <div className="mt-1.5 text-[10px] text-slate-600 leading-snug border-t border-emerald-200 pt-1.5">{box.contrast}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — MRR 계산 표 + 적합/부적합
    // ─────────────────────────────────────────────────────
    function MrrTable({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🥇 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b border-sky-200">
                <th className="text-left py-0.5">질의</th>
                <th className="text-center py-0.5">첫 정답</th>
                <th className="text-right py-0.5">RR = 1/순위</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r, i) => (
                <tr key={i} className="border-t border-sky-100">
                  <td className="py-1 font-bold text-slate-700">{r.q}</td>
                  <td className="py-1 text-center font-mono">{r.first}</td>
                  <td className="py-1 text-right font-mono text-sky-700 font-bold">{r.rr.toFixed(3)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-slate-600 font-mono">합: {box.sum}</div>
          <div className="text-[11px] text-sky-900 font-mono font-bold">MRR = {box.mrr}</div>
        </div>
      );
    }

    function FitBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 grid grid-cols-1 gap-2">
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2">
            <div className="text-[11px] font-bold text-emerald-900 mb-0.5">✅ 잘 맞는 곳</div>
            <div className="text-[10px] text-emerald-900 leading-snug">{box.good}</div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2">
            <div className="text-[11px] font-bold text-amber-900 mb-0.5">⚠️ 안 맞는 곳</div>
            <div className="text-[10px] text-amber-900 leading-snug">{box.bad}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — DCG / IDCG 계산 표
    // ─────────────────────────────────────────────────────
    function DcgTable({ box, isIdeal }) {
      if (!box) return null;
      const accent = isIdeal ? 'emerald' : 'sky';
      return (
        <div className={`mt-3 rounded-lg border-2 border-${accent}-300 bg-white p-3`}>
          <div className={`text-xs font-bold text-${accent}-900 mb-2`}>{isIdeal ? '🌟' : '📐'} {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className={`text-${accent}-900 border-b border-${accent}-200`}>
                <th className="text-left py-0.5">순위</th>
                <th className="text-center py-0.5">등급(gain)</th>
                <th className="text-center py-0.5">할인 log2(i+1)</th>
                <th className="text-right py-0.5">기여분</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r, i) => (
                <tr key={i} className={`border-t border-${accent}-100`}>
                  <td className="py-1 font-mono">#{r.rank}</td>
                  <td className="py-1 text-center font-mono font-bold">{r.gain}</td>
                  <td className="py-1 text-center font-mono text-slate-500">{r.disc}</td>
                  <td className={`py-1 text-right font-mono font-bold text-${accent}-700`}>{r.contrib.toFixed(3)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className={`mt-1.5 text-[11px] text-${accent}-900 font-mono font-bold text-right`}>
            {isIdeal ? `IDCG = ${box.idcg}` : `DCG = ${box.dcg}`}
          </div>
          {isIdeal && box.ndcg && (
            <div className="mt-1 rounded bg-emerald-50 border border-emerald-300 px-2 py-1 text-[11px] text-emerald-900 font-mono font-bold text-center">
              nDCG = {box.ndcg}
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 지표 선택표 / 파이프라인 / 온라인 지표
    // ─────────────────────────────────────────────────────
    function GuideTable({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-400 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🧭 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b border-sky-200">
                <th className="text-left py-0.5">상황</th>
                <th className="text-left py-0.5 pl-2">지표</th>
                <th className="text-left py-0.5 pl-2">이유</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r, i) => (
                <tr key={i} className="border-t border-sky-100 align-top">
                  <td className="py-1 font-bold text-slate-700">{r.use}</td>
                  <td className="py-1 pl-2 font-mono font-bold text-sky-700 whitespace-nowrap">{r.metric}</td>
                  <td className="py-1 pl-2 text-slate-600 leading-snug">{r.why}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function PipelineBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">🔁 {box.title}</div>
          <div className="flex items-stretch gap-1">
            {box.steps.map((s, i) => (
              <React.Fragment key={i}>
                {i > 0 && <div className="flex items-center text-sky-500 text-lg">→</div>}
                <div className="flex-1 rounded-lg border-2 border-sky-300 bg-white p-2 text-[10px] font-bold text-sky-900 text-center whitespace-pre-line flex items-center justify-center">
                  {s}
                </div>
              </React.Fragment>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-sky-900 leading-snug">{box.note}</div>
        </div>
      );
    }

    function OnlineBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-indigo-50 p-3">
          <div className="text-xs font-bold text-indigo-900 mb-2">📡 {box.title}</div>
          <div className="space-y-1.5">
            {box.rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px]">
                <span className="text-base">{r.icon}</span>
                <span className="w-24 shrink-0 font-bold text-indigo-900">{r.name}</span>
                <span className="flex-1 text-slate-600 leading-snug">{r.desc}</span>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-indigo-900 font-bold border-t border-indigo-200 pt-1.5">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 검색 결과 + 지표 실계산 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const PHASE_BADGE = {
      risk:  { icon: '🎲', label: '평가셋 부재' },
      pr:    { icon: '🎯', label: 'precision·recall' },
      mrr:   { icon: '🥇', label: 'MRR' },
      ndcg:  { icon: '📐', label: 'nDCG' },
      ops:   { icon: '🔁', label: '평가 운영' },
    };

    function LiveDataPane({ beat, state }) {
      const ph = PHASE_BADGE[state.phase] || PHASE_BADGE.pr;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{ph.icon}</span>
              <span>검색 품질 평가 — {ph.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.query && (
            <div className="mb-2 flex items-center gap-2 px-2 py-1 rounded border border-sky-200 bg-sky-50">
              <span className="text-xs">🔎</span>
              <span className="text-[11px] font-mono text-sky-800">질의: "{state.query}"</span>
            </div>
          )}
          <div className="text-[10px] text-sky-700 font-mono mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            지표: {state.phaseDetail}
          </div>
          {state.results && state.results.length > 0 && (
            <div className="space-y-1.5">
              {state.results.map((r) => <ResultRow key={r.rank} row={r} />)}
            </div>
          )}
          <RiskBox box={state.riskBox} />
          <GoldenBox box={state.goldenBox} />
          <MetricCalc box={state.metricCalc} />
          <RagBox box={state.ragBox} />
          <MrrTable box={state.mrrTable} />
          <FitBox box={state.fitBox} />
          <DcgTable box={state.dcgTable} />
          <DcgTable box={state.idcgTable} isIdeal />
          <GuideTable box={state.guideTable} />
          <PipelineBox box={state.pipelineBox} />
          <OnlineBox box={state.onlineBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">V-1-1. 검색 품질 평가 — nDCG·MRR</h1>
                <p className="text-sm text-sky-800/80">"요즘 검색이 이상해요"를 숫자로 — 개선인지 개악인지 판정하는 자(尺)</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                평가셋(골든셋)이 없으면 모든 튜닝은 도박이다 — 한 질의를 고치고 열 질의를 조용히 망가뜨린다.
                precision@k(첫 화면 청결도)·recall@k(놓치지 않음)는 정답이 k 안에 있는지를, MRR(첫 정답 순위 역수)은 정답이 하나인 검색을,
                nDCG(등급·상위 가중·정규화)는 정답 여럿·순서 중요한 랭킹을 잰다.
                지표는 목적이 정한다: RAG=recall@k, 내비=MRR, 일반 랭킹=nDCG.
                오프라인 파이프라인(변경→골든셋 실행→지표 비교→회귀 감지)이 개악을 막는 게이트라면,
                온라인 지표(CTR·무결과율)는 실사용 판정이다 — 이 루프가 검색 품질 운영의 심장이다(다음: V-2-1 A/B 테스트).
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['골든셋', '평가셋', 'precision@k', 'recall@k', 'MRR', 'nDCG', 'DCG', 'IDCG', '등급관련도', '회귀감지', '오프라인평가', 'CTR', '무결과율'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-2-1.html" className="underline hover:no-underline">다음: V-2-1 (A/B 테스트) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
