    @media (min-width: 768px) {

      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Search III-1-2 — ANN 알고리즘 — HNSW 그래프
    학습 목표: 100만 벡터 전수 비교(브루트포스)의 비용을 실제로 계산해 그 벽을 체감한 뒤,
              "정확한 최근접(kNN)"을 포기하고 "거의 최근접(ANN)"으로 넘어가는 거래(recall↔속도)를 이해하고,
              그래프 greedy 탐색 → HNSW 계층(고속도로→골목) → 파라미터(M·ef) 감각 → ANN 지형도(HNSW/IVF/PQ)
              까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 브루트포스 비용계산기 + 2D greedy 그래프 탐색 애니메이션 + HNSW 3계층 하강 + recall-속도 게이지 + ANN 비교표) / 우(VSCode CodeViewer: hnsw_demo.py)
    색상: sky/blue (search 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ─────────────────────────────────────────────────────
    // 결정론적 2D 점 구름 — greedy 그래프 탐색을 "실제로" 계산하기 위한 데이터
    //   seededPoints : LCG 로 60개 점을 재현 가능하게 생성 (0~100 좌표)
    //   query        : 질의 벡터(점). 목표는 이 점에 가장 가까운 데이터 점을 찾는 것.
    // ─────────────────────────────────────────────────────
    function makePoints(n, seed) {
      let s = seed >>> 0;
      const rnd = () => {
        // 간단한 LCG (numerical recipes 계수)
        s = (1664525 * s + 1013904223) >>> 0;
        return s / 4294967296;
      };
      const pts = [];
      for (let i = 0; i < n; i++) {
        pts.push({ id: i, x: 6 + rnd() * 88, y: 6 + rnd() * 88 });
      }
      return pts;
    }
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    const POINTS = makePoints(60, 12345);
    const QUERY = { x: 74, y: 30 };            // 질의점
    const START_ID = 3;                        // greedy 탐색 진입점(임의의 점)

    // kNN 그래프: 각 점을 가장 가까운 K개 점과 연결 (무방향)
    function buildKnnGraph(points, K) {
      const adj = points.map(() => new Set());
      points.forEach((p, i) => {
        const near = points
          .map((q, j) => ({ j, d: dist(p, q) }))
          .filter((o) => o.j !== i)
          .sort((a, b) => a.d - b.d)
          .slice(0, K);
        near.forEach((o) => { adj[i].add(o.j); adj[o.j].add(i); });
      });
      return adj.map((s) => [...s]);
    }
    const GRAPH = buildKnnGraph(POINTS, 3);

    // greedy 탐색: 현재 점에서 이웃 중 질의에 "더 가까운" 이웃으로 이동, 없으면 종료
    function greedySearch(points, graph, startId, query) {
      let cur = startId;
      let curD = dist(points[cur], query);
      const path = [cur];
      const guard = new Set([cur]);
      while (true) {
        let best = cur, bestD = curD;
        for (const nb of graph[cur]) {
          const d = dist(points[nb], query);
          if (d < bestD) { bestD = d; best = nb; }
        }
        if (best === cur || guard.has(best)) break;   // 더 가까운 이웃 없음 → 지역 최적
        guard.add(best);
        path.push(best);
        cur = best; curD = bestD;
      }
      return path;
    }
    const GREEDY_PATH = greedySearch(POINTS, GRAPH, START_ID, QUERY);
    // 진짜 최근접(전수 비교) — greedy 결과와 비교해 recall 을 보여주기 위함
    const TRUE_NN = POINTS.reduce((best, p) => (dist(p, QUERY) < dist(POINTS[best], QUERY) ? p.id : best), 0);

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      s1: {lang:"python", filename:"hnsw_demo.py — 1) 브루트포스 비용", lines:[
        "\"\"\"",
        "hnsw_demo.py — 브루트포스 kNN vs HNSW ANN 벤치마크",
        "  pip install numpy hnswlib   (faiss 는 마지막 단계에서만)",
        "\"\"\"",
        "import time",
        "import numpy as np",
        "",
        "N, D = 1_000_000, 768        # 100만 벡터, 768차원",
        "rng = np.random.default_rng(42)",
        "data = rng.standard_normal((N, D)).astype(np.float32)",
        "query = rng.standard_normal((1, D)).astype(np.float32)",
        "",
        "def brute_force_knn(data, query, k=10):",

      s2: {lang:"python", filename:"hnsw_demo.py — 2) greedy 그래프 탐색", lines:[
        "def greedy_search(graph, coords, start, query):",
        "    \"\"\"이웃 중 질의에 더 가까운 점으로 이동, 없으면 종료.\"\"\"",
        "    cur = start",
        "    cur_d = np.linalg.norm(coords[cur] - query)",
        "    path = [cur]",
        "    while True:",
        "        best, best_d = cur, cur_d",
        "        for nb in graph[cur]:          # 이웃만 확인",
        "            d = np.linalg.norm(coords[nb] - query)",
        "            if d < best_d:",
        "                best, best_d = nb, d",
        "        if best == cur:                # 더 가까운 이웃 없음",
        "            break                      #   → 지역 최적에서 종료",
        "        cur, cur_d = best, best_d",
        "        path.append(cur)",
        "    return path",
        "",
        "# 핵심: 전수 비교(N개) 대신 \"방문 점의 이웃\"만 계산한다.",
        "#   방문 수는 보통 O(log N) 규모 → 100만 점도 수십 홉.",
        "#",
        "# 약점: 진입점 하나 + 평평한 그래프면 지역 최적에 갇힌다.",

        "#   → 해결책이 다음 단계의 \"계층(HNSW)\" 이다.",
      ]},

        "def recall_at_k(approx_ids, true_ids):",
        "    \"\"\"근사 결과가 진짜 최근접 k개 중 몇 개를 맞췄나 (0~1).\"\"\"",

        "    return hit / len(true_ids)",

    const S1 = { title:"Step 1. 브루트포스의 벽 — 100만 벡터를 한 줄씩 비교하면", desc:"임베딩 검색의 가장 정직한 방법은 질의 벡터와 모든 문서 벡터의 거리를 하나씩 재는 것이다(정확한 최근접, kNN). 문제는 비용이다. 100만 개 × 768차원이면 한 번 검색에 곱셈·덧셈이 약 7.7억 번, 여기에 정렬까지 붙는다. 단일 코어로는 수백 ms~초 단위라 실시간 검색창엔 못 쓰고, 초당 수천 질의(QPS)를 받으면 CPU가 그대로 녹는다. 그래서 우리는 타협한다 — \"무조건 1등\"을 포기하고 \"거의 1등(예: 상위 10개 중 9~10개가 진짜 이웃)\"을 아주 빠르게 받는다. 이 recall과 속도의 거래가 ANN(Approximate Nearest Neighbor)의 출발점이다." };
    const S2 = { title:"Step 2. 그래프 탐색 직관 — 이웃을 따라 질의 쪽으로 굴러간다", desc:"벡터들을 \"가까운 것끼리\" 미리 연결해 그래프를 만들어 두면, 검색은 이 그래프 위를 걷는 문제가 된다. 아무 점에서 출발해 현재 점의 이웃들 중 질의에 더 가까운 쪽으로 한 칸씩 이동하고, 더 가까워지는 이웃이 없으면 멈춘다(greedy 탐색). 아래는 60개 점과 3-최근접 그래프에서 실제로 계산한 경로다 — 진입점에서 질의(★)를 향해 몇 번의 홉만에 굴러간다. 전수 비교가 아니라 \"방문한 점의 이웃만\" 보므로 훨씬 적게 계산한다. 다만 함정이 있다 — 이웃 중엔 더 가까운 점이 없지만 그래프 전체엔 있는 \"지역 최적\"에 갇힐 수 있다. 단일 그래프·단일 진입점의 이 약점을 다음 단계의 계층 구조가 푼다." };
    const S3 = { title:"Step 3. HNSW 계층 — 고속도로에서 내려와 골목으로", desc:"HNSW(Hierarchical Navigable Small World)는 그래프를 여러 층으로 쌓는다. 맨 위 층은 점이 적고 링크가 성긴 \"고속도로\" — 한 홉에 멀리 점프해 질의의 대략적 위치로 순식간에 이동한다. 아래로 내려갈수록 점이 많아지고 링크가 촘촘해져 \"국도 → 골목\"이 되고, 맨 아래 0층은 모든 점을 담아 정밀하게 마무리한다. 각 층에서 greedy로 지역 최적에 닿으면 그 점을 진입점 삼아 한 층 내려간다. 스킵 리스트가 정렬 리스트를 층으로 건너뛰어 O(log N) 탐색을 얻는 것과 똑같은 아이디어를, 1차원 순서가 아니라 고차원 이웃 그래프에 적용한 것이다. 위에서 크게 좁히고 아래서 정밀화하니, 단일 그래프의 지역 최적 함정도 크게 완화된다." };
    const S4 = { title:"Step 4. 파라미터 감각 — M · ef_construction · ef_search", desc:"HNSW의 성능은 세 다이얼로 조율한다. M은 층당 이웃 수 — 크면 그래프가 촘촘해져 정확도가 오르지만 메모리(벡터당 링크)와 색인 시간이 늘고, 보통 8~64를 쓴다. ef_construction은 색인을 지을 때 후보를 얼마나 넓게 탐색하는지 — 크면 그래프 품질이 좋아지지만 색인이 느려진다(한 번만 치르는 비용). ef_search는 검색 순간의 후보 리스트 폭으로, 이게 바로 실시간에 돌리는 recall↔속도 다이얼이다 — 키우면 더 많은 후보를 훑어 recall이 오르지만 QPS(초당 처리량)가 떨어진다. 아래 게이지에서 ef_search를 올리며 recall은 포화 곡선으로 오르고 속도는 반대로 내려가는 트레이드오프를 확인하라. 실무 기본값은 M=16, ef_construction=200에서 시작해 목표 recall에 맞춰 ef_search만 튜닝하는 것이다." };
    const S5 = { title:"Step 5. ANN 지형도 — HNSW vs IVF vs PQ, 그리고 조합", desc:"HNSW만이 답은 아니다. ANN 인덱스는 크게 세 갈래다. HNSW는 그래프 기반으로 recall·지연이 최상급이지만 벡터당 링크를 메모리에 들고 있어야 해 RAM을 많이 먹는다. IVF(Inverted File)는 벡터를 미리 군집(centroid)으로 나눠, 검색 시 질의와 가까운 몇 개 군집(nprobe)만 뒤진다 — 메모리 효율이 좋고 대용량에 유리하나 recall은 nprobe로 조절해야 한다. PQ(Product Quantization)는 벡터를 짧은 코드로 압축해 메모리를 8~32배 줄이는 대신 거리 계산이 근사가 된다. 실무에선 이들을 조합한다 — IVF로 후보 군집을 좁히고 PQ로 압축해 수십억 벡터를 RAM에 얹는 IVF-PQ가 대표적이다. 규모가 크지 않고 recall·지연이 최우선이면 HNSW, 메모리가 빠듯하고 수억~수십억이면 IVF-PQ가 출발점이다. 이 선택은 vector-db 주제로 이어지고, 다음 장에서는 이 모든 것을 감싸는 kNN 실전 도구(FAISS·hnswlib·벡터 DB)를 직접 다룬다." };

    // ─────────────────────────────────────────────────────
    // Step 1 — 브루트포스 비용 계산기
    // ─────────────────────────────────────────────────────
    function CostBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">💥 {box.title}</div>
          <div className="text-[10px] text-red-900 font-mono mb-2">
            N = {box.N.toLocaleString()} 벡터 · d = {box.d} 차원
          </div>
          <div className="space-y-1.5">
            {box.rows.map((r, i) => (
              <div key={i} className="flex items-center justify-between rounded border border-red-200 bg-white px-2 py-1">
                <div>
                  <div className="text-[11px] font-bold text-red-900">{r.label}</div>
                  <div className="text-[9px] text-slate-500 font-mono">{r.sub}</div>
                </div>
                <span className="text-sm font-mono font-bold text-red-700">{r.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function TradeBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-400 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">⚖️ {box.title}</div>
          <div className="flex items-center gap-2 text-[11px]">
            <div className="flex-1 rounded border-2 border-red-300 bg-red-50 p-2 text-center">
              <div className="text-[9px] text-red-700 font-bold">내주는 것</div>
              <div className="text-red-900 font-bold">{box.give}</div>
            </div>
            <span className="text-lg text-sky-500">→</span>
            <div className="flex-1 rounded border-2 border-emerald-300 bg-emerald-50 p-2 text-center">
              <div className="text-[9px] text-emerald-700 font-bold">얻는 것</div>
              <div className="text-emerald-900 font-bold">{box.get}</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 2D greedy 그래프 탐색 애니메이션 (SVG, 실계산 경로)
    // ─────────────────────────────────────────────────────
    function GraphSearchViz({ active }) {
      const [hop, setHop] = useState(0);   // 현재까지 밝혀진 경로 홉 수
      useEffect(() => {
        if (!active) return;
        setHop(0);
        const t = setInterval(() => {
          setHop((h) => (h >= GREEDY_PATH.length ? 0 : h + 1));
        }, 750);
        return () => clearInterval(t);
      }, [active]);

      const shown = GREEDY_PATH.slice(0, Math.max(1, hop));
      const shownSet = new Set(shown);
      const curId = shown[shown.length - 1];
      const found = hop >= GREEDY_PATH.length;

      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-2.5">
          <div className="flex items-center justify-between text-[11px] font-bold text-sky-900 mb-1">
            <span>🕸️ greedy 탐색 경로 (실계산)</span>
            <span className="font-mono">홉 {Math.min(shown.length, GREEDY_PATH.length)} / {GREEDY_PATH.length}</span>
          </div>
          <svg viewBox="0 0 100 100" className="w-full rounded bg-sky-50 border border-sky-200" style={{ aspectRatio: '1 / 1' }}>
            {/* 그래프 엣지 */}
            {POINTS.map((p) => GRAPH[p.id].filter((j) => j > p.id).map((j) => (
              <line key={p.id + '-' + j} x1={p.x} y1={p.y} x2={POINTS[j].x} y2={POINTS[j].y}
                    stroke="#bae6fd" strokeWidth="0.3" />
            )))}
            {/* 탐색 경로 엣지 */}
            {shown.slice(1).map((id, i) => (
              <line key={'path-' + i} x1={POINTS[shown[i]].x} y1={POINTS[shown[i]].y}
                    x2={POINTS[id].x} y2={POINTS[id].y} stroke="#0284c7" strokeWidth="0.9" />
            ))}
            {/* 점 */}
            {POINTS.map((p) => {
              const isPath = shownSet.has(p.id);
              const isCur = p.id === curId;
              const isTrue = p.id === TRUE_NN;
              return (
                <circle key={p.id} cx={p.x} cy={p.y}
                        r={isCur ? 2.2 : isPath ? 1.6 : 1}
                        fill={isCur ? '#0369a1' : isPath ? '#38bdf8' : isTrue ? '#10b981' : '#cbd5e1'}
                        stroke={isTrue ? '#059669' : 'none'} strokeWidth={isTrue ? 0.6 : 0} />
              );
            })}
            {/* 진입점 표시 */}
            <circle cx={POINTS[START_ID].x} cy={POINTS[START_ID].y} r="2.6" fill="none" stroke="#0369a1" strokeWidth="0.5" strokeDasharray="1 1" />
            {/* 질의점 ★ */}
            <text x={QUERY.x} y={QUERY.y + 2} fontSize="6" textAnchor="middle" fill="#f59e0b">★</text>
          </svg>
          <div className="mt-1 flex flex-wrap gap-x-3 gap-y-0.5 text-[9px] text-slate-600">
            <span>★ 질의</span>
            <span className="text-emerald-700">● 진짜 최근접</span>
            <span className="text-sky-700">● 탐색 경로</span>
            <span>◌ 진입점(#{START_ID})</span>
            <span className="text-slate-400">● 미방문</span>
          </div>
          <div className="mt-1 text-[10px] text-sky-900">
            {found
              ? `종료: #${curId} 도착 (진짜 최근접 #${TRUE_NN}${curId === TRUE_NN ? ' = 정답 적중' : ' — 지역 최적일 수 있음'})`
              : `이동 중: #${curId} 의 이웃 중 질의에 더 가까운 점으로…`}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — HNSW 3계층 하강 (SVG)
    // ─────────────────────────────────────────────────────
    function HnswLayers({ box, active }) {
      const [lv, setLv] = useState(0);   // 현재 밝혀진 층 (0=top 부터 아래로)
      useEffect(() => {
        if (!box || !active) return;
        setLv(0);
        const t = setInterval(() => {
          setLv((v) => (v >= box.rows.length ? 0 : v + 1));
        }, 850);
        return () => clearInterval(t);
      }, [box, active]);
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🛣️ HNSW 계층 하강 탐색</div>
          <div className="space-y-2">
            {box.rows.map((r, i) => {
              const reached = i < lv;
              const isCur = i === lv - 1;
              // 층별 점 위치 (성긴→촘촘) 결정론적 배치
              const pts = Array.from({ length: r.count }, (_, k) => ({
                x: ((k * 61 + i * 13) % 90) + 5,
                y: 50,
              }));
              return (
                <div key={i} className={`rounded-lg border-2 p-2 transition ${reached ? 'border-sky-400 bg-sky-50' : 'border-slate-200 bg-white'}`}>
                  <div className="flex items-center justify-between mb-1">
                    <span className={`text-[11px] font-bold ${reached ? 'text-sky-900' : 'text-slate-400'}`}>
                      {isCur ? '📍 ' : reached ? '✓ ' : ''}{r.name}
                    </span>
                    <span className="text-[9px] text-slate-500 font-mono">{r.count}점</span>
                  </div>
                  <svg viewBox="0 0 100 12" className="w-full" style={{ height: '18px' }}>
                    {pts.map((p, k) => k < pts.length - 1 && (
                      <line key={'l' + k} x1={p.x} y1="6" x2={pts[k + 1].x} y2="6"
                            stroke={reached ? '#7dd3fc' : '#e2e8f0'} strokeWidth="0.4" />
                    ))}
                    {pts.map((p, k) => (
                      <circle key={k} cx={p.x} cy="6" r={reached ? 1.6 : 1.1}
                              fill={reached ? '#0ea5e9' : '#cbd5e1'} />
                    ))}
                  </svg>
                  <div className={`text-[9px] mt-0.5 ${reached ? 'text-sky-800' : 'text-slate-400'}`}>{r.desc}</div>
                  {i < box.rows.length - 1 && (
                    <div className="text-center text-sky-400 text-[10px] leading-none mt-1">↓ 지역 최적점을 진입점 삼아 하강</div>
                  )}
                </div>
              );
            })}
          </div>
          <div className="mt-2 text-[10px] text-sky-900">
            {lv >= box.rows.length
              ? '0층 도착 — 촘촘한 골목에서 최근접을 정밀 확정.'
              : '상위 층에서 대략 위치를 잡고 아래로 내려가며 정밀화…'}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — ef_search 다이얼 (recall↑ · QPS↓ 곡선)
    // ─────────────────────────────────────────────────────
    function EfDial({ box }) {
      const [idx, setIdx] = useState(2);
      if (!box) return null;
      const rows = box.rows;
      const r = rows[idx];
      const maxQps = Math.max(...rows.map((x) => x.qps));
      return (
        <div className="mt-3 rounded-lg border-2 border-emerald-300 bg-white p-3">
          <div className="text-xs font-bold text-emerald-900 mb-2">🎛️ {box.title}</div>
          {/* 슬라이더 */}
          <input type="range" min="0" max={rows.length - 1} value={idx}
                 onChange={(e) => setIdx(+e.target.value)}
                 aria-label="ef_search 값 조절"
                 className="w-full accent-emerald-600" />
          <div className="flex items-center justify-between text-[10px] font-mono text-slate-500 mb-2">
            {rows.map((x, i) => <span key={i} className={i === idx ? 'text-emerald-700 font-bold' : ''}>{x.ef}</span>)}
          </div>
          {/* 현재값 게이지 */}
          <div className="space-y-2">
            <div>
              <div className="flex justify-between text-[10px] font-bold text-emerald-800">
                <span>recall@10</span><span className="font-mono">{(r.recall * 100).toFixed(1)}%</span>
              </div>
              <div className="h-2.5 rounded-full bg-emerald-100 overflow-hidden">
                <div className="h-full bg-emerald-500 transition-all duration-500" style={{ width: `${r.recall * 100}%` }} />
              </div>
            </div>
            <div>
              <div className="flex justify-between text-[10px] font-bold text-sky-800">
                <span>QPS(처리량)</span><span className="font-mono">{r.qps.toLocaleString()}/s</span>
              </div>
              <div className="h-2.5 rounded-full bg-sky-100 overflow-hidden">
                <div className="h-full bg-sky-500 transition-all duration-500" style={{ width: `${(r.qps / maxQps) * 100}%` }} />
              </div>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-slate-700">
            ef_search = <b className="font-mono text-emerald-700">{r.ef}</b> — recall 은 포화 곡선으로 오르고 QPS 는 반대로 내려간다.
            {r.recall >= 0.99 ? ' 이 지점 이후는 비용만 늘고 recall 이득은 미미하다.' : ' 목표 recall 까지 더 올릴 여지가 있다.'}
          </div>
        </div>
      );
    }

    function ParamCards({ cards }) {
      if (!cards) return null;
      const tone = {
        sky: 'border-sky-300 bg-sky-50 text-sky-900',
        indigo: 'border-indigo-300 bg-indigo-50 text-indigo-900',
        emerald: 'border-emerald-300 bg-emerald-50 text-emerald-900',
      };
      return (
        <div className="mt-3 grid grid-cols-1 gap-2">
          {cards.map((c, i) => (
            <div key={i} className={`rounded border-2 p-2 ${tone[c.color]}`}>
              <div className="flex items-center justify-between">
                <span className="text-[11px] font-bold font-mono">{c.name}</span>
                <span className="text-[9px] font-mono opacity-80">{c.typ}</span>
              </div>
              <div className="text-[10px] mt-0.5"><b>{c.role}</b> — {c.up}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — ANN 비교표 + 선택 가이드
    // ─────────────────────────────────────────────────────
    function AnnTable({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🗺️ {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b border-sky-200">
                <th className="text-left py-0.5">방식</th>
                <th className="text-left py-0.5 pl-1">아이디어</th>
                <th className="text-left py-0.5 pl-1">메모리</th>
                <th className="text-left py-0.5 pl-1">recall</th>
                <th className="text-left py-0.5 pl-1">언제</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.name} className="border-t border-sky-100 align-top">
                  <td className="py-1 font-bold text-sky-900 font-mono">{r.name}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.idea}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.mem}</td>
                  <td className="py-1 pl-1 text-emerald-700 font-bold">{r.recall}</td>
                  <td className="py-1 pl-1 text-slate-700">{r.when}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function PickBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">🎯 {box.title}</div>
          <div className="space-y-1.5">
            {box.rows.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px]">
                <span className="text-base">{r.icon}</span>
                <span className="flex-1 text-slate-700">{r.cond}</span>
                <span className="text-sky-500">→</span>
                <span className="w-40 shrink-0 text-emerald-800 font-bold text-right">{r.pick}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — HNSW/ANN 시뮬레이션 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const PHASE_BADGE = {
      bruteforce: { icon: '💥', label: '브루트포스' },
      greedy:     { icon: '🕸️', label: '그래프 탐색' },
      hnsw:       { icon: '🛣️', label: 'HNSW 계층' },
      params:     { icon: '🎛️', label: '파라미터' },
      landscape:  { icon: '🗺️', label: 'ANN 지형도' },
    };

    function LiveDataPane({ beat, state, active }) {
      const ph = PHASE_BADGE[state.phase] || PHASE_BADGE.bruteforce;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{ph.icon}</span>
              <span>벡터 검색 — {ph.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-sky-700 font-mono mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            방식: {state.phaseDetail}
          </div>
          <CostBox box={state.costBox} />
          <TradeBox box={state.tradeBox} />
          {state.graph && <GraphSearchViz active={active} />}
          {state.layers && <HnswLayers box={state.layers} active={active} />}
          <EfDial box={state.efDial} />
          <ParamCards cards={state.paramCards} />
          <AnnTable box={state.annTable} />
          <PickBox box={state.pickBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">III-1-2. ANN 알고리즘 — HNSW 그래프</h1>
                <p className="text-sm text-sky-800/80">100만 벡터에서 10ms — 정확도를 조금 내주고 속도를 천 배 얻는 거래</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} active={true} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                브루트포스 kNN은 정확하지만 100만×768차원에서 검색 1회에 ~1.5 GFLOP를 써 실시간엔 못 쓴다.
                ANN은 recall을 조금(예: 100%→97%) 내주고 속도를 100~1000배 얻는 거래다.
                그래프 greedy 탐색은 이웃만 보며 질의로 굴러가고(지역 최적 위험), HNSW는 이를 고속도로→골목의 계층으로 쌓아 O(log N)으로 만든다(스킵 리스트의 그래프판).
                튜닝은 M·ef_construction(색인 시 1회)과 ef_search(실시간 recall↔QPS 다이얼)로 하고, M=16·ef_construction=200에서 시작해 ef_search만 올린다.
                지형도로는 HNSW(그래프·메모리 큼)·IVF(군집 분할)·PQ(압축)와 조합 IVF-PQ가 있으며, 규모·메모리 제약이 선택을 가른다. 다음 장에서는 이 도구들(FAISS·벡터 DB)을 실전으로 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['ANN', 'HNSW', 'kNN', 'recall', 'QPS', 'greedy탐색', '스킵리스트', 'M파라미터', 'ef_search', 'IVF', 'PQ', 'IVF-PQ', 'faiss', 'hnswlib'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-3.html" className="underline hover:no-underline">다음: III-1-3 (kNN 실전 도구) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
