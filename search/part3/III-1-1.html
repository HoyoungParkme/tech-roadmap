  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Search III-1-1 — 임베딩이 의미를 잡는 원리
    학습 목표: 렉시컬(BM25)이 '글자 겹침'에서 멈추는 천장을 다시 확인하고("축구화"↔"풋살화" 미스매치),
              텍스트를 고차원 벡터(임베딩)로 바꾸면 '의미의 거리'가 곧 유사도가 됨을 산점도로 체험한다.
              분포 가설 → word2vec → BERT 문맥 임베딩 → sentence-transformers 진화 지도를 훑고,
              코사인/내적/유클리드 3종 유사도를 실수치로 계산한 뒤,
              100만 벡터 브루트포스 O(N)의 새 병목(다음 장 ANN)까지 5단계로 잇는다.
    패턴: search v1 — 좌(LiveDataPane: 미스매치 카드 / 2D 임베딩 산점도 / 진화 지도 / 코사인 실계산 / 브루트포스) / 우(CodeViewer)
    색상: sky/blue (search 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 2D 임베딩 좌표 — 의미가 비슷하면 가까이 놓인다
    //   x/y : 학습이 끝나 '군집'을 이룬 최종 좌표 (0~1)
    //   sx/sy : 학습 전 흩어진 초기 좌표 (군집 형성 애니메이션용)
    //   cat : 'shoe'(신발류) | 'appl'(가전) — 색으로 구분
    // ─────────────────────────────────────────────────────
    const EMB_POINTS = [
      { id: 'soccer',  label: '축구화',  cat: 'shoe', x: 0.90, y: 0.30, sx: 0.35, sy: 0.82 },
      { id: 'futsal',  label: '풋살화',  cat: 'shoe', x: 0.80, y: 0.42, sx: 0.14, sy: 0.20 },
      { id: 'running', label: '러닝화',  cat: 'shoe', x: 0.86, y: 0.26, sx: 0.62, sy: 0.55 },
      { id: 'sneaker', label: '운동화',  cat: 'shoe', x: 0.83, y: 0.40, sx: 0.48, sy: 0.08 },
      { id: 'fridge',  label: '냉장고',  cat: 'appl', x: 0.12, y: 0.92, sx: 0.72, sy: 0.30 },
      { id: 'washer',  label: '세탁기',  cat: 'appl', x: 0.20, y: 0.84, sx: 0.26, sy: 0.62 },
      { id: 'aircon',  label: '에어컨',  cat: 'appl', x: 0.08, y: 0.88, sx: 0.90, sy: 0.74 },
    ];
    // 코사인/내적/유클리드 실계산에 쓰는 대표 벡터 (본문·코드 수치 일치)
    const VEC = {
      soccer: [0.90, 0.30], // 축구화 (질의)
      futsal: [0.80, 0.42], // 풋살화 (가까움)
      fridge: [0.10, 0.95], // 냉장고 (멂)
    };

    // 2D 유사도 유틸 — 화면 숫자를 코드와 똑같이 뽑기 위해 JS로 직접 계산
    const dot2 = (a, b) => a[0] * b[0] + a[1] * b[1];
    const norm2 = (a) => Math.sqrt(a[0] * a[0] + a[1] * a[1]);
    const cosine2 = (a, b) => dot2(a, b) / (norm2(a) * norm2(b));
    const euclid2 = (a, b) => Math.sqrt((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2);

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 렉시컬 천장 → 의미를 좌표로 → 학습 원리 → 유사도 계산 → 벡터 검색의 새 병목
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      lexical: {lang: "python", filename: "lexical_limit.py (BM25 미스매치 재현)", lines: [
        "\"\"\"",
        "lexical_limit.py — 렉시컬(BM25)의 천장을 재현",
        "BM25 는 '같은 글자(토큰)' 가 겹쳐야만 점수가 오른다.",
        "글자가 안 겹치는 동의 표현은 0점 → 검색 실패.",
        "\"\"\"",
        "",
        "from rank_bm25 import BM25Okapi",
        "",
        "DOCS = [",
        "    \"풋살화 인도어 코트화\",",
        "    \"환불 규정 안내\",",
        "]",

    // ─────────────────────────────────────────────────────
    // Step 1 — BM25 미스매치 카드
    // ─────────────────────────────────────────────────────
    function MismatchCards({ box }) {
      if (!box) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">📕 {box.title}</div>
          <div className="space-y-2">
            {box.pairs.map((p, i) => {
              const zero = p.bm25 === 0;
              return (
                <div key={i} className={`rounded border-2 p-2 flex items-center gap-2 ${zero ? 'border-red-300 bg-red-50' : 'border-emerald-300 bg-emerald-50'}`}>
                  <span className="px-2 py-0.5 rounded bg-white border border-slate-300 text-[11px] font-mono font-bold text-slate-800">"{p.q}"</span>
                  <span className="text-slate-400 text-sm">↔</span>
                  <span className="px-2 py-0.5 rounded bg-white border border-slate-300 text-[11px] font-mono font-bold text-slate-800">"{p.d}"</span>
                  {p.meaning && <span className="text-[9px] text-slate-500">뜻은 같음</span>}
                  <span className={`ml-auto text-[11px] font-bold px-2 py-0.5 rounded ${zero ? 'text-red-700 bg-red-100' : 'text-emerald-700 bg-emerald-100'}`}>
                    BM25 {p.bm25.toFixed(1)}{zero ? ' 👻' : ' ✓'}
                  </span>
                </div>
              );
            })}
          </div>
          <div className="mt-2 text-[10px] text-slate-600">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2·4 — 2D 임베딩 산점도 (군집 애니메이션 / 질의-문서 선)
    // ─────────────────────────────────────────────────────
    const CAT_COLOR = {
      shoe: { fill: '#0284c7', ring: '#7dd3fc', label: '신발류' },
      appl: { fill: '#d97706', ring: '#fcd34d', label: '가전' },
    };
    const W = 300, H = 200, PAD = 22;
    const toPx = (x) => PAD + x * (W - 2 * PAD);
    const toPy = (y) => PAD + (1 - y) * (H - 2 * PAD);

    function EmbeddingScatter({ box }) {
      const [settled, setSettled] = useState(!(box && box.animate));
      useEffect(() => {
        if (!box || !box.animate) { setSettled(true); return; }
        setSettled(false);
        const t = setTimeout(() => setSettled(true), 120);
        return () => clearTimeout(t);
      }, [box]);
      // 훅은 early return 보다 위에 있어야 한다. 아래로 두면 이 컴포넌트가 처음
      // 등장하는 스텝에서 훅 개수가 늘어 React 가 트리를 통째로 버린다.
      if (!box) return null;

      const query = box.showLines ? box.points.find((p) => p.id === box.queryId) : null;

      return (
        <div className="mt-1 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="flex items-center justify-between mb-1">
            <div className="text-xs font-bold text-sky-900">🧭 2D 임베딩 산점도 <span className="font-normal text-slate-500">(768차원 → 2D 축소)</span></div>
            <div className="flex gap-2 text-[9px]">
              {Object.values(CAT_COLOR).map((c) => (
                <span key={c.label} className="flex items-center gap-1">
                  <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: c.fill }} />{c.label}
                </span>
              ))}
            </div>
          </div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ background: '#faf7ef', borderRadius: 6 }}>
            {/* 축 */}
            <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke="#cfc9ba" strokeWidth="1" />
            <line x1={PAD} y1={PAD} x2={PAD} y2={H - PAD} stroke="#cfc9ba" strokeWidth="1" />
            <text x={W - PAD} y={H - 8} textAnchor="end" fontSize="7" fill="#8a8578">의미 축 →</text>

            {/* 질의 → 문서 선 (Step 4) */}
            {query && box.points.filter((p) => p.id !== query.id).map((p) => {
              const cos = cosine2(VEC.soccer, VEC[p.id] || [p.x, p.y]);
              const strong = cos > 0.8;
              return (
                <g key={'l-' + p.id}>
                  <line
                    x1={toPx(query.x)} y1={toPy(query.y)}
                    x2={toPx(p.x)} y2={toPy(p.y)}
                    stroke={strong ? '#059669' : '#cfc9ba'}
                    strokeWidth={strong ? 2 : 1}
                    strokeDasharray={strong ? '0' : '3 2'}
                  />
                  <text
                    x={(toPx(query.x) + toPx(p.x)) / 2}
                    y={(toPy(query.y) + toPy(p.y)) / 2 - 2}
                    textAnchor="middle" fontSize="6.5"
                    fill={strong ? '#047857' : '#8a8578'} fontWeight="bold"
                  >{cos.toFixed(2)}</text>
                </g>
              );
            })}

            {/* 포인트 */}
            {box.points.map((p) => {
              const c = CAT_COLOR[p.cat];
              const cx = toPx(settled ? p.x : p.sx);
              const cy = toPy(settled ? p.y : p.sy);
              const isQuery = query && p.id === query.id;
              return (
                <g key={p.id} style={{ transition: 'transform 1s ease', transform: `translate(${cx}px, ${cy}px)` }}>
                  {isQuery && <circle r="9" fill="none" stroke="#0369a1" strokeWidth="1.5" strokeDasharray="2 2" />}
                  <circle r={isQuery ? 5 : 4.5} fill={c.fill} stroke={c.ring} strokeWidth="2" />
                  <text x="0" y="-8" textAnchor="middle" fontSize="8" fontWeight="bold" fill="#2b2b2b">
                    {p.label}{isQuery ? ' 🔎' : ''}
                  </text>
                </g>
              );
            })}
          </svg>
          <div className="mt-1.5 text-[10px] text-slate-600">
            {box.showLines
              ? '질의(축구화)에서 각 문서로 선을 긋고 코사인을 표시 — 초록 굵은 선일수록 가깝다(관련도 높음).'
              : (settled ? '학습이 끝나 의미가 비슷한 것끼리 군집을 이뤘다 — 거리가 곧 유사도.' : '학습 전: 좌표가 무작위로 흩어져 있다…')}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 임베딩 진화 지도
    // ─────────────────────────────────────────────────────
    const ERA_TONE = {
      sky: 'border-sky-400 bg-sky-50 text-sky-900',
      indigo: 'border-indigo-400 bg-indigo-50 text-indigo-900',
      emerald: 'border-emerald-400 bg-emerald-50 text-emerald-900',
    };
    function EvolutionMap({ box }) {
      if (!box) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🧬 {box.title}</div>
          <div className="mb-2 rounded border border-amber-300 bg-amber-50 px-2 py-1 text-[10px] text-amber-900 font-bold">
            💡 {box.hypothesis}
          </div>
          <div className="space-y-1.5">
            {box.items.map((it, i) => (
              <React.Fragment key={it.name}>
                <div className={`rounded border-2 p-2 ${ERA_TONE[it.tone]}`}>
                  <div className="flex items-center gap-2 mb-0.5">
                    <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-white/70 border border-current/20">{it.era}</span>
                    <span className="text-[12px] font-bold">{it.name}</span>
                    <span className="ml-auto text-[9px] px-1.5 py-0.5 rounded-full bg-white/70 border border-current/30">단위: {it.unit}</span>
                  </div>
                  <div className="text-[10px] leading-snug">{it.desc}</div>
                </div>
                {i < box.items.length - 1 && <div className="text-center text-sky-500 text-sm leading-none">↓</div>}
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 코사인 실계산 다이어그램
    // ─────────────────────────────────────────────────────
    function CosineCalc({ box }) {
      if (!box) return null;
      const a = box.a.v;
      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-indigo-50 p-3">
          <div className="text-xs font-bold text-indigo-900 mb-2">📐 {box.title}</div>
          <div className="text-[10px] font-mono text-slate-700 mb-2">
            질의 a = {box.a.name} = [{a[0]}, {a[1]}]
          </div>
          <div className="space-y-2">
            {box.pairs.map((p) => {
              const b = p.v;
              const d = dot2(a, b);
              const na = norm2(a), nb = norm2(b);
              const cos = cosine2(a, b);
              const eu = euclid2(a, b);
              const good = p.tone === 'good';
              return (
                <div key={p.name} className={`rounded border-2 p-2 ${good ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                  <div className={`text-[11px] font-bold mb-1 ${good ? 'text-emerald-800' : 'text-red-800'}`}>
                    b = {p.name} = [{b[0]}, {b[1]}] {good ? '(가까움)' : '(멂)'}
                  </div>
                  <div className="text-[9.5px] font-mono text-slate-700 space-y-0.5 leading-relaxed">
                    <div>내적 a·b = {a[0]}×{b[0]} + {a[1]}×{b[1]} = <b>{d.toFixed(3)}</b></div>
                    <div>|a| = {na.toFixed(3)} , |b| = {nb.toFixed(3)}</div>
                    <div className={good ? 'text-emerald-800' : 'text-red-800'}>
                      코사인 = {d.toFixed(3)} / ({na.toFixed(3)}×{nb.toFixed(3)}) = <b className="text-[11px]">{cos.toFixed(3)}</b>
                    </div>
                    <div>유클리드 = {eu.toFixed(3)}</div>
                  </div>
                  <div className="mt-1 h-1.5 rounded-full bg-white overflow-hidden border border-slate-200">
                    <div className={`h-full ${good ? 'bg-emerald-500' : 'bg-red-400'}`} style={{ width: `${Math.round(cos * 100)}%` }} />
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-2 text-[9.5px] text-indigo-900 font-mono">
            정규화 시: 내적 = 코사인, 유클리드² = 2 − 2·코사인 → 셋이 한 몸
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 브루트포스 O(N) 병목 표 + 비교
    // ─────────────────────────────────────────────────────
    const CMP_TONE = {
      good: 'border-sky-300 bg-sky-50 text-sky-900',
      bad: 'border-red-300 bg-red-50 text-red-900',
      best: 'border-emerald-400 bg-emerald-50 text-emerald-900',
    };
    function BruteForceBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-1 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">⏱️ {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-red-800 border-b border-red-200">
                <th className="text-left py-0.5">문서 수</th>
                <th className="text-left py-0.5 pl-2">응답시간</th>
                <th className="text-right py-0.5">복잡도</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.size} className="border-t border-red-100">
                  <td className="py-1 font-mono">{r.size}</td>
                  <td className="py-1 pl-2">
                    <div className="flex items-center gap-1">
                      <div className="w-20 h-1.5 rounded-full bg-red-100 overflow-hidden">
                        <div className={`h-full ${r.ms < 50 ? 'bg-emerald-500' : r.ms < 1000 ? 'bg-amber-500' : 'bg-red-500'}`} style={{ width: `${r.bar}%` }} />
                      </div>
                      <span className="font-mono">{r.ms.toLocaleString()}ms</span>
                    </div>
                  </td>
                  <td className="py-1 text-right font-mono text-red-900">{r.mode}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 grid grid-cols-3 gap-1.5">
            {box.compare.map((c) => (
              <div key={c.label} className={`rounded border-2 p-1.5 text-center ${CMP_TONE[c.tone]}`}>
                <div className="text-[10px] font-bold mb-0.5">{c.label}</div>
                <div className="text-[9px] leading-snug">{c.big}</div>
              </div>
            ))}
          </div>
          <div className="mt-1.5 text-[10px] text-red-900">문서가 늘수록 O(N) 브루트포스는 정비례로 느려진다 → "빠르게 가까운 이웃 찾기"(ANN)가 다음 과제.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 임베딩 시뮬레이션 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      lexical: { icon: '📕', label: '렉시컬(BM25)' },
      embed:   { icon: '🧭', label: '임베딩 좌표' },
      learn:   { icon: '🧬', label: '학습 원리' },
      sim:     { icon: '📐', label: '유사도 계산' },
      ann:     { icon: '⏱️', label: '벡터 검색 병목' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.embed;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>의미 검색 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.query && (
            <div className="mb-2 flex items-center gap-2 px-2 py-1 rounded border border-sky-200 bg-sky-50">
              <span className="text-xs">🔎</span>
              <span className="text-[11px] font-mono text-sky-800">검색어: "{state.query}"</span>
            </div>
          )}
          <div className="text-[10px] text-sky-700 font-mono mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            방식: {state.engineDetail}
          </div>
          <MismatchCards box={state.mismatch} />
          <EmbeddingScatter box={state.scatter} />
          <EvolutionMap box={state.evolution} />
          <CosineCalc box={state.cosine} />
          <BruteForceBox box={state.bruteForce} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">III-1-1. 임베딩이 의미를 잡는 원리</h1>
                <p className="text-sm text-sky-800/80">"축구화"로 검색해도 "풋살화"가 나오는 이유 — 단어를 숫자 공간의 위치로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                렉시컬(BM25)은 글자가 겹쳐야만 매칭해 "축구화"↔"풋살화" 같은 동의 표현을 놓친다.
                임베딩은 텍스트를 고차원 벡터로 바꿔 "의미가 비슷하면 좌표가 가깝게" 만들고, 거리가 곧 유사도가 된다.
                이 능력은 분포 가설(비슷한 문맥=비슷한 의미)에서 자라 word2vec → BERT 문맥 임베딩 → 문장 임베딩으로 진화했다.
                가까움은 코사인(각도)·내적·유클리드로 재며, 정규화하면 셋이 한 몸이라 보통 내적 한 번으로 코사인을 얻는다.
                단, 100만 벡터를 전부 비교하는 브루트포스는 O(N)이라 렉시컬보다 느려질 수 있어 — 다음 장의 ANN(근사 최근접 이웃)이 이 병목을 푼다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['임베딩', '벡터검색', '의미검색', '분포가설', 'word2vec', 'BERT', 'sentence-transformers', '코사인유사도', '내적', '유클리드', '브루트포스', 'ANN', 'BM25한계'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 (ANN·근사 최근접 이웃) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
