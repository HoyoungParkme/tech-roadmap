  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔍</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Search I-2-2 — 검색 파이프라인 전체 지도
    학습 목표: 검색창에 엔터를 친 순간부터 결과가 뜨기까지의 전체 여정을 한 장으로 조립한다.
              (1) 색인 시간: 문서 수집→분석기(I-2-1)→역색인(I-1-2)+원본 저장 — 쓰기 경로
              (2) 질의 시간: 질의→같은 분석기→posting 조회→후보 집합 — 읽기 경로
              (3) 랭킹: 후보 수천 건을 관련도 점수 + 비즈니스 부스팅으로 정렬 (1단계 검색→2단계 리랭킹 프리뷰)
              (4) 결과 가공: 하이라이팅·페이지네이션·facet 집계·검색어 제안
              (5) 전체 지도: 각 단계를 이 과정의 Part(Ⅱ~Ⅴ)에 매핑 + 장애 진단표
    패턴: fastapi v1 — 좌(LiveDataPane: 파이프라인 다이어그램 + 랭킹 게이지 + 결과 목업 + 과정 지도) / 우(CodeViewer: search_pipeline.py)
    색상: sky/blue (search 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 색인 → 질의 → 랭킹 → 가공 → 전체 지도
    //   pipeline : 색인/질의 파이프라인 다이어그램. 각 stage = { id, path, label, active }
    //              path : 'index'(쓰기) | 'query'(읽기) | 'shared'(공통 분석기) | 'rank' | 'render'
    //   rankGauge: 랭킹 합성 게이지 { relevance, boost, ... }
    //   result   : 결과 화면 목업 { hits, facets, suggest }
    //   mapBox   : 과정 지도(Part 매핑) / diagBox: 장애 진단표
    //   code     : 우측 CodeViewer 파일 (search_pipeline.py, 단계별 하이라이트)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang: "python", filename: "search_pipeline.py — index_time()", lines: [
        "\"\"\"",
        "search_pipeline.py — 검색 파이프라인 전체 구현",
        "I-1-2 역색인 코드를 확장해 색인→질의→랭킹→가공까지 한 파일로 잇는다.",
        "\"\"\"",
        "from collections import defaultdict, Counter",
        "import math, re",
        "",
        "",
        "def analyze(text: str) -> list[str]:",
        "    \"\"\"색인·질의가 공유하는 분석기 (I-2-1).",
        "    소문자화 → 공백/기호 분리 → 토큰 리스트. 색인과 질의가",
        "    반드시 같은 함수를 써야 매칭이 성립한다.",
        "    \"\"\"",
        "    text = text.lower()",
        "    return [t for t in re.split(r\"[^0-9a-z가-힣]+\", text) if t]",
        "",
        "",
        "class SearchIndex:",
        "    def __init__(self):",
        "        self.inverted = defaultdict(dict)   # term -> {doc_id: tf}",
        "        self.source = {}                    # doc_id -> 원본 문서",
        "        self.doc_len = {}                   # doc_id -> 토큰 수",
        "",
        "    def add(self, doc_id: int, doc: dict):",
        "        \"\"\"색인 시간: 분석 → 역색인 적재 + 원본 저장.\"\"\"",
        "        tokens = analyze(doc[\"title\"])",
        "        tf = Counter(tokens)",
        "        for term, freq in tf.items():",
        "            self.inverted[term][doc_id] = freq   # posting 적재",
        "        self.source[doc_id] = doc                # 화면 표시용 원본",
        "        self.doc_len[doc_id] = len(tokens)",
      ]},
      s2: {lang: "python", filename: "search_pipeline.py — query_time()", lines: [
        "    def search_candidates(self, query: str) -> set[int]:",
        "        \"\"\"질의 시간(1단계): 질의를 같은 분석기로 쪼개",
        "        각 토큰의 posting 을 역색인에서 꺼내 후보 집합을 만든다.",
        "        색인과 동일한 analyze() 를 쓰는 것이 매칭의 전제다.",
        "        \"\"\"",
        "        terms = analyze(query)              # 색인과 같은 분석기!",
        "        if not terms:",
        "            return set()",
        "        candidates: set[int] = set()",
        "        for term in terms:",
        "            posting = self.inverted.get(term, {})",
        "            candidates |= set(posting.keys())  # OR (합집합)",
        "        return candidates                   # 아직 정렬 안 됨",
        "",
        "    # 참고: AND(교집합) 검색이면 |= 대신 &= 로 좁힌다.",

          </div>
          <div className="mt-1.5 flex flex-wrap gap-2 text-[9px] text-slate-500">
            <span>🟦 색인(쓰기)</span><span>🟨 공통 분석기</span><span>🟦 질의(읽기)</span><span>🟪 랭킹</span><span>🟩 가공</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // posting 조회 표 (Step 2)
    // ─────────────────────────────────────────────────────
    function PostingTable({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-blue-300 bg-blue-50 p-3">
          <div className="text-xs font-bold text-blue-900 mb-2">🗂 {box.title}</div>
          <table className="w-full text-[10px]">
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.term} className="border-b border-blue-100">
                  <td className="py-1 font-bold text-blue-900 w-16">{r.term}</td>
                  <td className="py-1 font-mono text-slate-700">→ {r.docs}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-blue-900 font-bold">{box.result}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 랭킹 합성 게이지 (Step 3) — 관련도 + 부스팅 스택 바
    // ─────────────────────────────────────────────────────
    function RankGauge({ box }) {
      if (!box) return null;
      const max = Math.max(...box.items.map((it) => it.relevance + it.boost));
      return (
        <div className="mt-3 rounded-lg border-2 border-indigo-300 bg-white p-3">
          <div className="text-xs font-bold text-indigo-900 mb-2">📊 {box.title}</div>
          <div className="space-y-2">
            {box.items.map((it) => {
              const total = it.relevance + it.boost;
              return (
                <div key={it.id}>
                  <div className="flex items-center justify-between text-[10px] mb-0.5">
                    <span className="font-bold text-slate-800 truncate">{it.name}</span>
                    <span className="font-mono text-indigo-900">
                      {it.tag && <span className="mr-1 px-1 rounded bg-amber-100 text-amber-800 text-[9px]">{it.tag}</span>}
                      {total}점
                    </span>
                  </div>
                  <div className="flex h-3 rounded-full overflow-hidden bg-slate-100" style={{ width: `${(total / max) * 100}%` }}>
                    <div className="h-full bg-indigo-500" style={{ width: `${(it.relevance / total) * 100}%` }} title="관련도(BM25)" />
                    <div className="h-full bg-amber-400" style={{ width: `${(it.boost / total) * 100}%` }} title="비즈니스 부스팅" />
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-2 flex gap-3 text-[9px] text-slate-600">
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm bg-indigo-500"></span>관련도(BM25)</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-sm bg-amber-400"></span>비즈니스 부스팅</span>
          </div>
          <div className="mt-1.5 text-[10px] text-indigo-900 leading-snug">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 결과 화면 목업 (Step 4) — 하이라이트 + facet + 제안
    // ─────────────────────────────────────────────────────
    function renderHl(parts) {
      return parts.map((p, i) =>
        p.startsWith('em:')
          ? <em key={i} className="not-italic font-bold bg-yellow-200 text-slate-900 px-0.5 rounded">{p.slice(3)}</em>
          : <span key={i}>{p}</span>
      );
    }
    function ResultMockup({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-emerald-300 bg-white p-3">
          <div className="text-xs font-bold text-emerald-900 mb-2">🖥 사용자가 보는 결과 화면</div>
          <div className="flex items-center gap-2 mb-2 px-2 py-1 rounded border border-sky-200 bg-sky-50">
            <span className="text-xs">🔎</span>
            <span className="text-[11px] font-mono text-sky-800 flex-1">{box.query}</span>
            <span className="text-[9px] text-slate-500">검색</span>
          </div>
          <div className="flex gap-2">
            {/* facet 필터 */}
            <div className="w-24 shrink-0 rounded border border-slate-200 bg-slate-50 p-1.5">
              <div className="text-[9px] font-bold text-slate-600 mb-1">브랜드 (facet)</div>
              {box.facets.map((f) => (
                <div key={f.name} className="flex justify-between text-[10px] text-slate-700 py-0.5">
                  <span>{f.name}</span><span className="font-mono text-slate-500">{f.count}</span>
                </div>
              ))}
            </div>
            {/* 결과 리스트 */}
            <div className="flex-1 space-y-1.5">
              {box.hits.map((h, i) => (
                <div key={i} className="rounded border border-emerald-200 bg-emerald-50 px-2 py-1.5">
                  <div className="text-[11px] font-bold text-slate-800">
                    {renderHl(h.title)}
                    {h.badge && <span className="ml-1 px-1 rounded bg-amber-100 text-amber-800 text-[9px]">{h.badge}</span>}
                  </div>
                  <div className="text-[10px] text-emerald-800 font-mono">{h.price}</div>
                </div>
              ))}
              <div className="text-[9px] text-slate-500 text-center pt-0.5">◀ 1 2 3 ... ▶ (10건씩 · deep paging 주의)</div>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-sky-800 bg-sky-50 border border-sky-200 rounded px-2 py-1">💡 {box.suggest}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 과정 지도 (Step 5) — 단계 → Part 매핑
    // ─────────────────────────────────────────────────────
    const MAP_TONE = {
      sky: 'border-sky-400 bg-sky-50 text-sky-900',
      indigo: 'border-indigo-400 bg-indigo-50 text-indigo-900',
      violet: 'border-violet-400 bg-violet-50 text-violet-900',
      emerald: 'border-emerald-400 bg-emerald-50 text-emerald-900',
    };
    function MapBox({ box }) {
      if (!box) return null;
      return (
        <div className="rounded-lg border-2 border-sky-400 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🗺️ {box.title}</div>
          <div className="space-y-1.5">
            {box.rows.map((r, i) => (
              <div key={i} className={`flex items-center gap-2 rounded border-2 px-2 py-1 ${MAP_TONE[r.tone]}`}>
                <span className="text-[10px] font-bold w-24 shrink-0">{r.stage}</span>
                <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/70 border border-current/20 shrink-0">{r.part}</span>
                <span className="text-[10px] flex-1">{r.desc}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 장애 진단표 (Step 5)
    // ─────────────────────────────────────────────────────
    function DiagTable({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">🩺 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-red-800 border-b border-red-200">
                <th className="text-left py-0.5">증상</th>
                <th className="text-left py-0.5 pl-2">의심 원인</th>
                <th className="text-right py-0.5">범인 단계</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r, i) => (
                <tr key={i} className="border-t border-red-100">
                  <td className="py-1 font-bold text-red-900">{r.icon} {r.symptom}</td>
                  <td className="py-1 pl-2 text-slate-700">{r.suspect}</td>
                  <td className="py-1 text-right font-mono text-red-900">{r.where}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 검색 파이프라인 시뮬레이션 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      index:  { icon: '📥', label: '색인 시간' },
      query:  { icon: '🔎', label: '질의 시간' },
      rank:   { icon: '📊', label: '랭킹' },
      render: { icon: '🎨', label: '결과 가공' },
      map:    { icon: '🗺️', label: '전체 지도' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.index;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>검색 파이프라인 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.query && (
            <div className="mb-2 flex items-center gap-2 px-2 py-1 rounded border border-sky-200 bg-sky-50">
              <span className="text-xs">🔎</span>
              <span className="text-[11px] font-mono text-sky-800">검색어: "{state.query}"</span>
            </div>
          )}
          <div className="text-[10px] text-sky-700 font-mono mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            단계: {state.engineDetail}
          </div>
          <PipelineDiagram stages={state.pipeline} />
          <PostingTable box={state.postings} />
          <RankGauge box={state.rankGauge} />
          <ResultMockup box={state.result} />
          {state.mapBox && <div className="mt-3"><MapBox box={state.mapBox} /></div>}
          <DiagTable box={state.diagBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">I-2-2. 검색 파이프라인 전체 지도</h1>
                <p className="text-sm text-sky-800/80">검색창에 엔터를 친 순간부터 결과가 뜨기까지 — 색인·질의·랭킹의 전체 여정</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                검색은 두 파이프라인의 만남이다 — 색인(쓰기: 수집→분석기→역색인+원본)이 조용히 품질의 8할을 못 박고,
                질의(읽기: 같은 분석기→posting 조회→후보)가 그 위에서 돈다. 두 흐름은 랭킹에서 만나
                관련도(BM25)+비즈니스 부스팅으로 정렬되고(1단계 검색→2단계 리랭킹), 하이라이트·페이지네이션·facet·제안으로 가공돼 화면이 된다.
                이 지도가 곧 과정 지도다: 렉시컬 랭킹(Ⅱ)→벡터(Ⅲ)→하이브리드(Ⅳ)→운영(Ⅴ).
                장애는 늘 특정 단계에서 나므로, 증상(느림·이상·누락·순서)을 단계에 매핑하면 범인을 좁힐 수 있다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['색인시간', '질의시간', '분석기일치', 'posting', '후보집합', 'BM25', '비즈니스부스팅', '리랭킹', '하이라이팅', 'deep_paging', 'facet집계', '검색어제안', '파이프라인', '장애진단'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">이전: I-2-1 (분석기) ↩</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
