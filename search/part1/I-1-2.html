  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    Search I-1-2 — 역색인(inverted index) 원리
    학습 목표: "문서→단어" 순방향 색인을 "단어→문서" 역방향으로 뒤집는 발상을 체험하고,
              색인 구축(토큰화→소문자화→posting) → 검색(AND 교집합·OR 합집합 병합) →
              posting 확장(df·position·field) → 실무 세그먼트·불변 색인까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 문서·역색인 사전·병합 시각화) / 우(VSCode CodeViewer: inverted_index.py 진화)
    색상: sky/blue (search 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 예제 코퍼스 — 문서 3개 (검색 엔진 색인의 최소 재현)
    //   D1 "노트북 가방 추천"   → [노트북, 가방, 추천]
    //   D2 "가방 세일 정보"     → [가방, 세일, 정보]
    //   D3 "게이밍 노트북 후기" → [노트북, 게이밍, 후기]
    // 이 코퍼스에서 역색인은 아래처럼 뒤집힌다:
    //   노트북 → [1,3] · 가방 → [1,2] · 추천 → [1]
    //   세일 → [2] · 정보 → [2] · 게이밍 → [3] · 후기 → [3]
    // ─────────────────────────────────────────────────────
    const DOCS = [
      { id: 1, text: '노트북 가방 추천', tokens: ['노트북', '가방', '추천'] },
      { id: 2, text: '가방 세일 정보',   tokens: ['가방', '세일', '정보'] },
      { id: 3, text: '게이밍 노트북 후기', tokens: ['노트북', '게이밍', '후기'] },
    ];

    // 완성된 역색인 (단계별로 부분 공개하며 자라는 모습을 보여줌)
    const FULL_DICT = [
      { term: '노트북',   postings: [1, 3] },
      { term: '가방',     postings: [1, 2] },
      { term: '추천',     postings: [1] },
      { term: '세일',     postings: [2] },
      { term: '정보',     postings: [2] },
      { term: '게이밍',   postings: [3] },
      { term: '후기',     postings: [3] },
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 발상의 전환 — 문서→단어를 단어→문서로 뒤집기',
        desc: '순방향으로 저장하면(문서 → 그 안의 단어들) "노트북"이 든 문서를 찾으려고 매번 전 문서를 처음부터 훑어야 한다 — 문서가 백만 개면 백만 번 읽는 것이다. 발상을 뒤집는다: 저장을 단어 기준으로 바꿔 "노트북 → [1, 3]"처럼 단어가 어느 문서에 있는지를 미리 적어 둔다. 책 맨 뒤의 찾아보기(index)가 바로 이 구조다 — 본문을 다 읽지 않고 "역색인" 항목만 펼쳐 페이지 번호로 점프한다. 검색은 사전에서 단어 하나를 찾는 O(1)에 가까운 조회로 바뀐다. 이 뒤집힌 표가 검색 엔진의 심장, 역색인(inverted index)이다.',
        actor: '🔄 순방향(문서→단어) ↔ 역방향(단어→문서)',
        phase: 'flip',
        phaseDetail: '구조를 뒤집는다 — forward → inverted',
        docs: DOCS,
        dict: [],
        flipBox: {
          forward: DOCS.map((d) => ({ from: 'D' + d.id, to: d.tokens.join(', ') })),
          inverted: FULL_DICT.map((e) => ({ from: e.term, to: e.postings.map((p) => 'D' + p).join(', ') })),
        },
        alert: { tone: 'info', text: '순방향은 "이 문서에 뭐가 있나?"에 강하고, 역방향은 "이 단어가 어디에 있나?"에 강하다. 검색은 후자의 질문이므로 색인을 미리 뒤집어 둔다.' },
        code: {
          lang: 'python',
          filename: 'inverted_index.py (개념)',
          lines: [
            '"""',
            'inverted_index.py — Step 1: 순방향 vs 역방향',
            '',
            '순방향(forward):  문서 → 그 안의 단어들',
            '역방향(inverted): 단어 → 그 단어가 든 문서들',
            '',
            '검색은 "이 단어가 어디 있나?" 질문이므로 역방향이 유리하다.',
            '"""',
            '',
            '# 문서 3개 (제목만 사용)',
            'docs = {',
            '    1: "노트북 가방 추천",',
            '    2: "가방 세일 정보",',
            '    3: "게이밍 노트북 후기",',
            '}',
            '',
            '# 순방향 색인: 문서 → 단어들 (그냥 원문 그대로)',
            'forward = {doc_id: text.split() for doc_id, text in docs.items()}',
            '# forward[1] = ["노트북", "가방", "추천"]',
            '',
            '# "노트북"이 든 문서를 순방향으로 찾으면 → 전 문서를 훑어야 한다',
            'def search_forward(term):',
            '    """느림: 문서 수 N 에 비례해 매번 전체 스캔."""',
            '    return [d for d, words in forward.items() if term in words]',
            '',
            '# 역방향 색인: 단어 → 문서들 (미리 뒤집어 둔다)',
            'inverted = {',
            '    "노트북": [1, 3],',

    function DocCard({ doc }) {
      return (
        <div className="rounded border border-sky-300 bg-sky-50 px-2 py-1 flex items-center gap-2">
          <span className="text-[10px] font-bold text-sky-700 font-mono">D{doc.id}</span>
          <span className="text-[11px] font-bold text-slate-800 truncate">{doc.text}</span>
          <span className="ml-auto text-[9px] text-slate-500 font-mono truncate">[{doc.tokens.join(', ')}]</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 역색인 사전 한 줄 — term → posting list
    // ─────────────────────────────────────────────────────
    function DictRow({ entry }) {
      return (
        <div className={`rounded border px-2 py-1 flex items-center gap-2 ${entry.hit ? 'bg-amber-50 border-amber-400' : entry.rare ? 'bg-blue-50 border-blue-400' : 'bg-white border-sky-200'}`}>
          <span className="text-[11px] font-bold text-sky-900 font-mono w-14 truncate">{entry.term}</span>
          <span className="text-sky-400">→</span>
          <span className="flex gap-1">
            {entry.postings.map((p) => (
              <span key={p} className="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-sky-100 text-sky-800 border border-sky-300">D{p}</span>
            ))}
          </span>
          {entry.df !== undefined && (
            <span className={`ml-auto text-[9px] font-mono px-1 rounded ${entry.rare ? 'bg-blue-100 text-blue-800 font-bold' : 'bg-slate-100 text-slate-600'}`}>df={entry.df}</span>
          )}
          {entry.isNew && entry.df === undefined && (
            <span className="ml-auto text-[9px] text-emerald-600 font-bold">+추가</span>
          )}
        </div>
      );
    }

    function DictPanel({ dict }) {
      if (!dict || dict.length === 0) return null;
      return (
        <div className="mt-2 rounded-lg border-2 border-sky-300 bg-white p-2">
          <div className="text-[11px] font-bold text-sky-900 mb-1.5 flex items-center gap-1">
            <span>📖</span><span>역색인 사전 (term → posting list)</span>
          </div>
          <div className="space-y-1">
            {dict.map((e) => <DictRow key={e.term} entry={e} />)}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 순방향 vs 역방향 뒤집기
    // ─────────────────────────────────────────────────────
    function FlipBox({ box }) {
      if (!box) return null;
      const Col = ({ title, rows, tone }) => (
        <div className={`flex-1 rounded-lg border-2 p-2 ${tone === 'fwd' ? 'border-slate-300 bg-slate-50' : 'border-sky-400 bg-sky-50'}`}>
          <div className={`text-[11px] font-bold mb-1.5 ${tone === 'fwd' ? 'text-slate-700' : 'text-sky-900'}`}>{title}</div>
          <div className="space-y-1">
            {rows.map((r, i) => (
              <div key={i} className="flex items-center gap-1 text-[10px]">
                <span className={`font-mono font-bold px-1 rounded ${tone === 'fwd' ? 'bg-white text-slate-700 border border-slate-300' : 'bg-white text-sky-800 border border-sky-300'}`}>{r.from}</span>
                <span className={tone === 'fwd' ? 'text-slate-400' : 'text-sky-500'}>→</span>
                <span className="font-mono text-slate-700 truncate">{r.to}</span>
              </div>
            ))}
          </div>
        </div>
      );
      return (
        <div className="mt-2 rounded-lg border-2 border-sky-400 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🔄 같은 데이터, 뒤집힌 두 표</div>
          <div className="flex gap-2 items-stretch">
            <Col title="순방향: 문서 → 단어들" rows={box.forward} tone="fwd" />
            <div className="flex items-center text-sky-500 text-lg font-bold">⇄</div>
            <Col title="역방향: 단어 → 문서들" rows={box.inverted} tone="inv" />
          </div>
          <div className="mt-2 text-[10px] text-sky-900">왼쪽을 세로로 읽으면 오른쪽이 된다 — "노트북"이 D1·D3에 있으니 노트북 → [D1, D3].</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 색인 구축 파이프라인
    // ─────────────────────────────────────────────────────
    function BuildBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-2 rounded-lg border-2 border-emerald-300 bg-emerald-50 p-3">
          <div className="text-xs font-bold text-emerald-800 mb-2">🏗 색인 구축 파이프라인 (문서 1건 기준)</div>
          <div className="space-y-1">
            {box.pipeline.map((p, i) => (
              <React.Fragment key={i}>
                {i > 0 && <div className="text-center text-[10px] text-emerald-500">▼</div>}
                <div className="rounded border border-emerald-300 bg-white px-2 py-1 text-[10px] text-slate-800 font-mono">{p}</div>
              </React.Fragment>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-emerald-900">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 검색 병합 (AND 교집합 / OR 합집합)
    // ─────────────────────────────────────────────────────
    function SearchBox({ box }) {
      if (!box) return null;
      const Chip = ({ children, tone }) => (
        <span className={`text-[10px] font-mono font-bold px-1.5 py-0.5 rounded border ${tone === 'hit' ? 'bg-amber-100 text-amber-800 border-amber-400' : 'bg-sky-100 text-sky-800 border-sky-300'}`}>{children}</span>
      );
      return (
        <div className="mt-2 rounded-lg border-2 border-sky-400 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🔎 질의 "{box.query}" 처리</div>
          <div className="space-y-1 mb-2">
            <div className="flex items-center gap-1 text-[11px]">
              <span className="font-mono font-bold text-sky-900 w-14">{box.listA.term}</span><span className="text-sky-400">→</span>
              {box.listA.postings.map((p) => <Chip key={p}>D{p}</Chip>)}
            </div>
            <div className="flex items-center gap-1 text-[11px]">
              <span className="font-mono font-bold text-sky-900 w-14">{box.listB.term}</span><span className="text-sky-400">→</span>
              {box.listB.postings.map((p) => <Chip key={p}>D{p}</Chip>)}
            </div>
          </div>
          {/* 병합 진행 */}
          <div className="rounded border border-slate-300 bg-slate-50 p-2 mb-2">
            <div className="text-[10px] font-bold text-slate-700 mb-1">두 포인터 병합 (merge)</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-slate-600 border-b border-slate-200">
                  <th className="text-left py-0.5">노트북 i</th>
                  <th className="text-left py-0.5">가방 j</th>
                  <th className="text-left py-0.5 pl-2">동작</th>
                </tr>
              </thead>
              <tbody>
                {box.merge.map((m, i) => (
                  <tr key={i} className={`border-t border-slate-100 ${m.hit ? 'bg-amber-50' : ''}`}>
                    <td className="py-1 font-mono">{m.a}</td>
                    <td className="py-1 font-mono">{m.b}</td>
                    <td className="py-1 pl-2 text-slate-800">{m.hit ? '✓ ' : ''}{m.act}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="flex gap-2">
            <div className="flex-1 rounded border-2 border-amber-400 bg-amber-50 p-2">
              <div className="text-[10px] font-bold text-amber-800">AND (교집합)</div>
              <div className="mt-1 flex gap-1">{box.andResult.map((p) => <Chip key={p} tone="hit">D{p}</Chip>)}</div>
            </div>
            <div className="flex-1 rounded border-2 border-sky-400 bg-sky-50 p-2">
              <div className="text-[10px] font-bold text-sky-800">OR (합집합)</div>
              <div className="mt-1 flex gap-1">{box.orResult.map((p) => <Chip key={p}>D{p}</Chip>)}</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — posting 메타데이터 (df · position · field)
    // ─────────────────────────────────────────────────────
    function PostingBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-2 rounded-lg border-2 border-blue-400 bg-white p-3">
          <div className="text-xs font-bold text-blue-900 mb-2">📦 posting 상세 — term "{box.term}" (df={box.df})</div>
          <table className="w-full text-[10px] mb-2">
            <thead>
              <tr className="text-blue-900 border-b-2 border-blue-200">
                <th className="text-left py-0.5">문서</th>
                <th className="text-left py-0.5 pl-2">position</th>
                <th className="text-left py-0.5 pl-2">field</th>
              </tr>
            </thead>
            <tbody>
              {box.entries.map((e) => (
                <tr key={e.doc} className="border-t border-blue-100">
                  <td className="py-1 font-mono font-bold">D{e.doc}</td>
                  <td className="py-1 pl-2 font-mono">@{e.positions.join(', @')}</td>
                  <td className="py-1 pl-2"><span className="px-1 rounded bg-blue-100 text-blue-800">{e.field}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="rounded border border-amber-400 bg-amber-50 px-2 py-1 text-[10px] text-amber-900">
            <span className="font-bold">구문검색 {box.phrase.query}:</span> {box.phrase.check}
          </div>
          <div className="mt-1.5 text-[10px] text-blue-900">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 세그먼트 · 병합
    // ─────────────────────────────────────────────────────
    function SegmentBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-2 rounded-lg border-2 border-sky-500 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🗂 세그먼트 → 병합 (append-only, immutable)</div>
          <div className="flex items-center gap-2 mb-2">
            <div className="flex flex-col gap-1 flex-1">
              {box.segments.map((s) => (
                <div key={s.name} className={`rounded border px-2 py-1 text-[10px] ${s.state === 'live' ? 'border-emerald-400 bg-emerald-50' : 'border-slate-300 bg-slate-50'}`}>
                  <span className="font-mono font-bold text-slate-800">{s.name}</span>
                  <span className="ml-1 text-slate-600">docs [{s.docs.join(', ')}]</span>
                  <span className={`ml-1 text-[9px] px-1 rounded ${s.state === 'live' ? 'bg-emerald-200 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>{s.state === 'live' ? '쓰기중' : '🔒 불변'}</span>
                </div>
              ))}
            </div>
            <div className="text-sky-500 text-lg font-bold">⇒</div>
            <div className="flex-1">
              <div className="rounded border-2 border-sky-400 bg-sky-50 px-2 py-2 text-[10px]">
                <span className="font-mono font-bold text-sky-900">{box.merged.name}</span>
                <div className="text-slate-700 mt-0.5">docs [{box.merged.docs.join(', ')}]</div>
                <div className="text-[9px] text-sky-700 mt-0.5">병합 = 삭제분 청소 + 조회 조각 감소</div>
              </div>
            </div>
          </div>
          <table className="w-full text-[10px]">
            <tbody>
              {box.tradeoff.map((t) => (
                <tr key={t.k} className="border-t border-sky-100">
                  <td className="py-1 font-bold text-sky-900 w-32">{t.k}</td>
                  <td className="py-1 text-slate-700">{t.v}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-2 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 문서 · 역색인 · 단계별 시각화 (sky 톤)
    // ─────────────────────────────────────────────────────
    const PHASE_BADGE = {
      flip:    { icon: '🔄', label: '뒤집기' },
      build:   { icon: '🏗', label: '색인 구축' },
      search:  { icon: '🔎', label: '검색 실행' },
      posting: { icon: '📦', label: 'posting 확장' },
      segment: { icon: '🗂', label: '세그먼트' },
    };

    function LiveDataPane({ state }) {
      const ph = PHASE_BADGE[state.phase] || PHASE_BADGE.flip;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{ph.icon}</span>
              <span>역색인 — {ph.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-sky-700 font-mono mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            단계: {state.phaseDetail}
          </div>
          {/* 코퍼스 */}
          <div className="space-y-1">
            {state.docs.map((d) => <DocCard key={d.id} doc={d} />)}
          </div>
          <FlipBox box={state.flipBox} />
          <DictPanel dict={state.dict} />
          <BuildBox box={state.buildBox} />
          <SearchBox box={state.searchBox} />
          <PostingBox box={state.postingBox} />
          <SegmentBox box={state.segmentBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-16 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">I-1-2. 역색인(inverted index) 원리</h1>
                <p className="text-sm text-sky-800/80">책 뒤의 찾아보기가 검색 엔진의 심장이 되기까지 — 문서→단어를 단어→문서로 뒤집기</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                역색인은 "문서 → 단어"를 "단어 → 문서"로 뒤집어, 검색을 전 문서 스캔에서 사전 조회로 바꾼다.
                색인 구축은 토큰화·정규화 후 posting list에 문서 ID를 오름차순으로 쌓는 것이고, 검색은 정렬된 posting들을
                병합(AND=교집합·OR=합집합)해 O(n+m)에 끝낸다. posting에 df·position·field를 실으면 랭킹(TF-IDF·BM25)의 원료가 되고,
                실무 색인은 불변 세그먼트를 append-only로 쌓고 백그라운드 병합으로 정리한다 — 색인 비용을 미리 치르고 검색 속도를 산다.
                다음 장에서는 이 파이프라인의 입구, 토크나이저(한국어 형태소 분석 nori)를 연다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['역색인', 'inverted-index', 'posting-list', '토큰화', '교집합', '합집합', 'merge', 'df', 'position', '세그먼트', 'append-only'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
