  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {

      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */

  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Search IV-1-1 — 렉시컬 vs 벡터 — 언제 뭐가 이기나
    학습 목표: 같은 코퍼스·같은 질의 5종으로 BM25(렉시컬, Part Ⅱ)와 임베딩(벡터, Part Ⅲ)을 나란히 돌려
              (1) "어느 쪽이 낫냐"가 아니라 "어떤 질의에서 갈리냐"를 본다
              (2) 렉시컬이 반드시 이기는 질의(정확 매칭·OOV)와 벡터가 반드시 이기는 질의(의미 변형)를 각각 재현
              (3) 실패 매트릭스로 "둘 다 써야 한다"를 논리적으로 도출
              (4) 점수 스케일이 달라 단순 합산이 안 되는 문제 → "점수가 아니라 순위로 합치자"(RRF) 예고
    패턴: fastapi v1 — 좌(LiveDataPane: 대결 스코어보드 + 실패 사례 카드 + 승패 매트릭스 + 스케일 불일치) / 우(VSCode CodeViewer: lexical_vs_vector.py 계열)
    색상: sky/blue (search 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 공통 코퍼스 — 신발/전자제품이 섞인 작은 쇼핑몰 상품 6종.
    //   대결 질의 5종이 모두 이 코퍼스 위에서 돈다(변인 통제).
    //   d1~d6 을 각 스텝의 랭킹이 참조한다.
    // ─────────────────────────────────────────────────────
    // d1: RTX4090 그래픽카드   d2: 겨울용 방한 부츠   d3: 방수 레인코트
    // d4: 라이트한 러닝화       d5: 알엑스 조명 스탠드  d6: DB 에러 해설 문서

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 대결 구도 → 렉시컬 승 → 벡터 승 → 실패 매트릭스 → 합치기의 함정
    //   match      : 한 질의의 BM25 랭킹 vs 벡터 랭킹 (좌 스코어보드)
    //   caseCards  : "왜 졌나" 해설 카드
    //   matrix     : 질의유형 × 방식 승패표
    //   dist       : 실서비스 질의 분포
    //   scaleViz   : 점수 스케일 불일치 시각화
    //   rrfBox     : 순위 기반 결합(RRF) 예고
    //   code       : 우측 CodeViewer 파일
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      step1: {lang:"python", filename:"lexical_vs_vector.py (실험 셋업)", lines:[
        "\"\"\"",
        "lexical_vs_vector.py — 같은 코퍼스·같은 질의로 BM25 vs 벡터 비교.",
        "  - BM25   : rank_bm25 (렉시컬, 단어 일치)",
        "  - Vector : sentence-transformers (임베딩, 의미 유사)",
        "핵심 질문: \"누가 이기나\"가 아니라 \"어떤 질의에서 갈리나\".",
        "\"\"\"",
        "from rank_bm25 import BM25Okapi",
        "from sentence_transformers import SentenceTransformer, util",
        "",
        "# 신발 + 전자제품이 섞인 공통 코퍼스(변인 통제)",
        "CORPUS = [",
        "    \"RTX4090 그래픽카드 24GB 게이밍 GPU\",   # d1",
        "    \"겨울용 방한 부츠 기모 방수 발열\",        # d2",
        "    \"방수 레인코트 경량 우비 자켓\",           # d3",
        "    \"가벼운 러닝화 마라톤 경량 운동화\",       # d4",
        "    \"알엑스 LED 조명 스탠드 книга 독서등\",    # d5",
        "    \"ORA-00942 테이블 없음 오류 해결 가이드\", # d6",
        "]",
        "",
        "QUERIES = [",
        "    \"RTX4090\",              # 모델명(정확 매칭)",
        "    \"ORA-00942\",            # 에러코드(정확 매칭·OOV)",

    const S1 = { title:"Step 1. 대결 구도 — 같은 코퍼스, 같은 질의 5종", desc:"\"BM25가 낫냐, 벡터가 낫냐\"는 잘못 세운 질문이다. 옳은 질문은 \"어떤 질의에서 승패가 갈리냐\"다. 그래서 신발과 전자제품이 섞인 같은 상품 코퍼스 위에 질의 5종을 던져 렉시컬(BM25)과 벡터(임베딩)의 순위를 나란히 세운다. 미리 결과를 훑으면 정확 매칭류(모델명·에러코드)는 렉시컬이, 의미 변형류(자연어 문장·동의어)는 벡터가 이긴다 — 승자가 질의 성격에 따라 규칙적으로 뒤바뀐다. 이 규칙성이 바로 \"하나만 쓰면 반드시 지는 질의가 있다\"는 이 장의 출발점이다." };
    const S2 = { title:"Step 2. 렉시컬이 이기는 질의 — 정확 매칭·희귀 토큰·OOV", desc:"\"RTX4090\"을 검색하면 사용자는 정확히 그 제품 하나를 원한다. BM25는 이 희귀 토큰을 문서에서 그대로 찾아 d1을 1위로 올린다 — IDF가 높은(=희귀한) 단어의 정확 일치는 렉시컬의 홈그라운드다. 반면 벡터는 진다. \"RTX4090\"은 임베딩 모델의 학습 어휘 밖(OOV)이거나 하위 토큰으로 쪼개져 의미 벡터가 부실하고, \"GPU·그래픽·조명 스탠드\"처럼 주변 의미가 비슷한 것들에 유사도가 뭉개져 엉뚱한 d5(조명)를 위로 올린다. 에러코드(\"ORA-00942\")·인명·신조어도 같은 이유로 벡터가 약하다 — 의미로 뭉개면 안 되고 글자 그대로 맞아야 하는 질의이기 때문이다." };
    const S3 = { title:"Step 3. 벡터가 이기는 질의 — 자연어 문장·동의어·오타·다국어", desc:"\"겨울에 신을 따뜻한 신발\"이라고 검색하면, 정답 문서 d2(\"겨울용 방한 부츠 기모 발열\")에는 \"따뜻한\"도 \"신발\"도 글자로는 한 번도 안 나온다. BM25는 겹치는 토큰이 \"겨울\" 하나뿐이라 관련도를 제대로 못 매긴다 — 토큰 불일치 앞에서 렉시컬은 눈이 먼다. 벡터는 이긴다. \"방한·기모·발열\"이 \"따뜻한\"과, \"부츠\"가 \"신발\"과 임베딩 공간에서 가까워 의미로 d2를 1위로 끌어올린다. 동의어(\"레인코트\"↔\"방수 자켓\"), 오타 일부, 다국어도 마찬가지다 — 표면 글자가 달라도 의미가 같으면 벡터가 잡고, 바로 그 지점에서 BM25는 토큰이 안 겹쳐 진다." };
    const S4 = { title:"Step 4. 실패 매트릭스 — \"둘 다 써야 한다\"의 논리적 도출", desc:"두 스텝의 결과를 한 표로 모으면 패턴이 선명해진다 — 정확 매칭류는 렉시컬 승, 의미 변형류는 벡터 승. 승자가 질의 유형에 따라 갈리므로, 한 방식만 쓰면 그 방식이 지는 유형의 질의를 통째로 놓친다. 여기서 흔한 오해 하나 — \"요즘은 벡터가 대세니 벡터만 쓰면 되지 않나?\" 실서비스 질의 로그를 까 보면 모델명·품번·에러코드 같은 정확 매칭류가 의외로 큰 비중을 차지한다(그래서 로그 분석이 중요하다 — V-2-1에서 다룬다). 벡터만 깔면 이 질의들에서 조용히 품질이 무너진다. 결론은 취향이 아니라 논리다 — 승패가 유형별로 갈리고 두 유형이 모두 실제로 들어온다면, 둘 다 써서 각자의 홈그라운드를 살려야 한다." };
    const S5 = { title:"Step 5. 합치는 방법의 문제 — 점수 단위가 다르다", desc:"\"둘 다 쓰자\"까지는 왔는데, 막상 합치려니 벽에 부딪힌다. BM25 점수는 0에서 수십까지 제멋대로 커지고(코퍼스·질의 길이에 따라 상한이 없다), 코사인 유사도는 0~1에 갇혀 있다. 두 점수를 그냥 더하면 스케일이 큰 BM25가 합계를 지배해 벡터가 무의미해진다. \"그럼 정규화하자\"도 함정이다 — min-max 정규화는 질의마다 최솟값·최댓값이 바뀌어(특히 이상치 하나에) 결과가 요동치고, 질의 간 비교도 불안정하다. 근본 통찰은 이렇다 — 두 점수의 \"크기\"는 애초에 같은 자로 잴 수 없다. 그러나 각 방식이 매긴 \"순위(1등, 2등...)\"는 방식이 달라도 동일한 의미를 갖는다. 그래서 점수가 아니라 순위로 합친다 — 이것이 다음 장 RRF(Reciprocal Rank Fusion)의 출발점이다." };

      return (
        <div className={`flex-1 rounded-lg border-2 p-2 ${accent.border} ${accent.bg}`}>
          <div className={`text-[11px] font-bold mb-1.5 flex items-center justify-between ${accent.text}`}>

          <div className="space-y-1">
            {rows.map((r) => (
              <div
                key={r.rank}
                className={`flex items-center gap-1.5 rounded px-1.5 py-1 border ${r.rel ? 'bg-emerald-50 border-emerald-400' : 'bg-white border-slate-200'}`}
              >
                <span className={`text-[10px] font-bold w-4 text-center ${r.rank === 1 ? 'text-amber-500' : 'text-slate-400'}`}>{r.rank}</span>

                <span className="text-[10px]">{r.rel ? '✓' : '·'}</span>
              </div>

          </div>
        </div>
      );
    }

      );
    }

    // ─────────────────────────────────────────────────────
    // 승패 매트릭스 (Step 4)
    // ─────────────────────────────────────────────────────
    function WinCell({ v }) {
      const win = v === 'win';
      return (
        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${win ? 'text-emerald-700 bg-emerald-100 border border-emerald-300' : 'text-red-700 bg-red-100 border border-red-300'}`}>
          {win ? '◎ WIN' : '✗ LOSE'}
        </span>
      );
    }
    function Matrix({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🧮 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b border-sky-200">
                {box.headers.map((h, i) => (
                  <th key={i} className={`py-1 ${i === 0 ? 'text-left' : 'text-center'}`}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.type} className="border-t border-sky-100">
                  <td className="py-1.5 font-bold text-slate-800">{r.type}</td>
                  <td className="py-1.5 text-center"><WinCell v={r.bm25} /></td>
                  <td className="py-1.5 text-center"><WinCell v={r.vector} /></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-slate-700">대각선이 갈린다 — 승자가 유형에 따라 뒤집힌다. 하나만 쓰면 반대편 유형을 통째로 놓친다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 실서비스 질의 분포 (Step 4)
    // ─────────────────────────────────────────────────────
    const DIST_TONE = { lex: 'bg-sky-500', vec: 'bg-indigo-500', mix: 'bg-amber-500' };
    function DistBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
          <div className="text-xs font-bold text-amber-900 mb-2">📊 {box.title}</div>
          <div className="space-y-2">
            {box.rows.map((r, i) => (
              <div key={i}>
                <div className="flex items-center justify-between text-[10px] mb-0.5">
                  <span className="text-slate-800 font-bold">{r.label}</span>
                  <span className="font-mono text-slate-600">{r.pct}%</span>
                </div>
                <div className="h-2.5 rounded-full bg-white border border-amber-200 overflow-hidden">
                  <div className={`h-full ${DIST_TONE[r.tone]}`} style={{ width: `${r.pct}%` }} />
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-amber-900 leading-snug">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 점수 스케일 불일치 시각화 (Step 5)
    // ─────────────────────────────────────────────────────
    const SCALE_TONE = { lex: 'bg-sky-500', vec: 'bg-indigo-500' };
    function ScaleBar({ item }) {
      const pct = Math.min(100, (item.value / item.max) * 100);
      return (
        <div>
          <div className="flex items-center justify-between text-[10px] mb-0.5">
            <span className="font-bold text-slate-800">{item.label}</span>
            <span className="font-mono text-slate-600">{item.value} · 범위 {item.range}</span>
          </div>
          <div className="h-3 rounded-full bg-white border border-slate-300 overflow-hidden">
            <div className={`h-full ${SCALE_TONE[item.tone]}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }
    function ScaleViz({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">⚖️ {box.title}</div>
          <div className="space-y-2.5 bg-white rounded p-2 border border-red-200">
            <ScaleBar item={box.bm25} />
            <ScaleBar item={box.vector} />
          </div>
          <div className="mt-2 text-[10px] text-red-900 leading-snug bg-white border border-red-200 rounded p-1.5">
            <span className="font-bold">문제: </span>{box.sumNote}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 순위 기반 결합(RRF) 예고 (Step 5)
    // ─────────────────────────────────────────────────────
    function RrfBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">🧭 {box.title}</div>
          <div className="text-[10px] text-red-800 bg-white border border-red-200 rounded p-1.5 mb-1.5">
            <span className="font-bold">함정: </span>{box.trap}
          </div>
          <div className="text-[10px] text-sky-900 bg-white border border-sky-200 rounded p-1.5 mb-1.5">
            <span className="font-bold">통찰: </span>{box.insight}
          </div>
          <div className="text-[11px] font-mono text-indigo-900 bg-indigo-100 border border-indigo-300 rounded p-1.5 mb-1.5">{box.formula}</div>
          <div className="text-[10px] text-sky-900 leading-snug font-bold">➡ {box.next}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 렉시컬 vs 벡터 대결 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      preview: { icon: '🥊', label: '대결 구도' },
      lexical: { icon: '🎯', label: '렉시컬 승' },
      vector:  { icon: '🧠', label: '벡터 승' },
      matrix:  { icon: '🧮', label: '실패 매트릭스' },
      merge:   { icon: '⚖️', label: '합치기 함정' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.preview;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>렉시컬 vs 벡터 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.query && (
            <div className="mb-2 flex items-center gap-2 px-2 py-1 rounded border border-sky-200 bg-sky-50">
              <span className="text-xs">🔎</span>
              <span className="text-[11px] font-mono text-sky-800">검색어: "{state.query}"</span>
            </div>
          )}
          <div className="text-[10px] text-sky-700 font-mono mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            방식: {state.engineDetail}
          </div>
          <PreviewTable box={state.preview} />
          <Scoreboard box={state.match} />
          <CaseCards box={state.caseCards} />
          <Matrix box={state.matrix} />
          <DistBox box={state.dist} />
          <ScaleViz box={state.scaleViz} />
          <RrfBox box={state.rrfBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">IV-1-1. 렉시컬 vs 벡터 — 언제 뭐가 이기나</h1>
                <p className="text-sm text-sky-800/80">BM25와 임베딩의 실패 사례 교환전 — 하나만 쓰면 반드시 지는 질의가 있다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                렉시컬(BM25)과 벡터(임베딩)의 우열은 "누가 낫냐"가 아니라 "어떤 질의냐"에 달렸다.
                모델명·에러코드·인명·신조어 같은 정확 매칭류·OOV는 렉시컬이, 자연어 문장·동의어·오타·다국어 같은 의미 변형류는 벡터가 이긴다.
                실서비스 로그엔 두 유형이 모두 들어오므로(정확 매칭류가 의외로 큰 비중), 하나만 쓰면 반대편을 반드시 놓친다 — 둘 다 써야 한다.
                그런데 BM25(0~수십)와 코사인(0~1)은 스케일이 달라 단순 합산도 min-max 정규화도 불안정하다.
                해법은 "점수가 아니라 순위로 합치는 것" — 다음 장 IV-1-2의 RRF로 직결된다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['렉시컬검색', 'BM25', '벡터검색', '임베딩', 'OOV', '정확매칭', '의미유사', '동의어', '실패매트릭스', '질의로그분석', '스케일불일치', 'RRF', '하이브리드'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 (RRF 하이브리드) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
