              accent={{ border: 'border-sky-300', bg: 'bg-sky-50', text: 'text-sky-900' }}
              rows={box.bm25}
              isWinner={box.winner === 'lexical'}
            />
            <RankColumn
              title="Embedding · 벡터"
              accent={{ border: 'border-indigo-300', bg: 'bg-indigo-50', text: 'text-indigo-900' }}
              rows={box.vector}
              isWinner={box.winner === 'vector'}
            />
          </div>
          <div className="mt-2 text-[10px] leading-snug text-slate-700 bg-amber-50 border border-amber-200 rounded p-1.5">
            <span className="font-bold text-amber-900">왜 갈렸나: </span>{box.why}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 대결 미리보기 표 (Step 1)
    // ─────────────────────────────────────────────────────
    function PreviewTable({ box }) {
      if (!box) return null;
      const badge = {
        lexical: { c: 'text-sky-700 bg-sky-100 border-sky-300', t: '렉시컬' },
        vector:  { c: 'text-indigo-700 bg-indigo-100 border-indigo-300', t: '벡터' },
        tie:     { c: 'text-slate-600 bg-slate-100 border-slate-300', t: '무승부' },
      };
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🔭 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b border-sky-200">
                <th className="text-left py-0.5">질의</th>
                <th className="text-left py-0.5 pl-2">유형</th>
                <th className="text-left py-0.5 pl-2">승자</th>
                <th className="text-left py-0.5 pl-2">이유</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => {
                const b = badge[r.winner];
                return (
                  <tr key={r.q} className="border-t border-sky-100 align-top">
                    <td className="py-1 font-mono font-bold text-slate-800">{r.q}</td>
                    <td className="py-1 pl-2 text-slate-600">{r.type}</td>
                    <td className="py-1 pl-2"><span className={`px-1.5 py-0.5 rounded-full border font-bold ${b.c}`}>{b.t}</span></td>
                    <td className="py-1 pl-2 text-slate-600">{r.reason}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 실패 사례 카드 (Step 2~3)
    // ─────────────────────────────────────────────────────
    const CASE_TONE = {
      lex: 'border-sky-400 bg-sky-50 text-sky-900',
      vec: 'border-indigo-400 bg-indigo-50 text-indigo-900',
    };
    function CaseCards({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-slate-300 bg-white p-3">
          <div className="text-xs font-bold text-slate-800 mb-2">🔎 {box.title}</div>
          <div className="grid grid-cols-2 gap-2">
            {box.items.map((it, i) => (
              <div key={i} className={`rounded border-2 p-2 ${CASE_TONE[it.kind]}`}>
                <div className="text-[11px] font-bold mb-0.5">{it.icon} {it.head}</div>
                <div className="text-[10px] leading-snug">{it.body}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 승패 매트릭스 (Step 4)
    // ─────────────────────────────────────────────────────
    function WinCell({ v }) {
      const win = v === 'win';
      return (
        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${win ? 'text-emerald-700 bg-emerald-100 border border-emerald-300' : 'text-red-700 bg-red-100 border border-red-300'}`}>
          {win ? '◎ WIN' : '✗ LOSE'}
        </span>
      );
    }
    function Matrix({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🧮 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b border-sky-200">
                {box.headers.map((h, i) => (
                  <th key={i} className={`py-1 ${i === 0 ? 'text-left' : 'text-center'}`}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.type} className="border-t border-sky-100">
                  <td className="py-1.5 font-bold text-slate-800">{r.type}</td>
                  <td className="py-1.5 text-center"><WinCell v={r.bm25} /></td>
                  <td className="py-1.5 text-center"><WinCell v={r.vector} /></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-1.5 text-[10px] text-slate-700">대각선이 갈린다 — 승자가 유형에 따라 뒤집힌다. 하나만 쓰면 반대편 유형을 통째로 놓친다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 실서비스 질의 분포 (Step 4)
    // ─────────────────────────────────────────────────────
    const DIST_TONE = { lex: 'bg-sky-500', vec: 'bg-indigo-500', mix: 'bg-amber-500' };
    function DistBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
          <div className="text-xs font-bold text-amber-900 mb-2">📊 {box.title}</div>
          <div className="space-y-2">
            {box.rows.map((r, i) => (
              <div key={i}>
                <div className="flex items-center justify-between text-[10px] mb-0.5">
                  <span className="text-slate-800 font-bold">{r.label}</span>
                  <span className="font-mono text-slate-600">{r.pct}%</span>
                </div>
                <div className="h-2.5 rounded-full bg-white border border-amber-200 overflow-hidden">
                  <div className={`h-full ${DIST_TONE[r.tone]}`} style={{ width: `${r.pct}%` }} />
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-amber-900 leading-snug">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 점수 스케일 불일치 시각화 (Step 5)
    // ─────────────────────────────────────────────────────
    const SCALE_TONE = { lex: 'bg-sky-500', vec: 'bg-indigo-500' };
    function ScaleBar({ item }) {
      const pct = Math.min(100, (item.value / item.max) * 100);
      return (
        <div>
          <div className="flex items-center justify-between text-[10px] mb-0.5">
            <span className="font-bold text-slate-800">{item.label}</span>
            <span className="font-mono text-slate-600">{item.value} · 범위 {item.range}</span>
          </div>
          <div className="h-3 rounded-full bg-white border border-slate-300 overflow-hidden">
            <div className={`h-full ${SCALE_TONE[item.tone]}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }
    function ScaleViz({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-red-300 bg-red-50 p-3">
          <div className="text-xs font-bold text-red-800 mb-2">⚖️ {box.title}</div>
          <div className="space-y-2.5 bg-white rounded p-2 border border-red-200">
            <ScaleBar item={box.bm25} />
            <ScaleBar item={box.vector} />
          </div>
          <div className="mt-2 text-[10px] text-red-900 leading-snug bg-white border border-red-200 rounded p-1.5">
            <span className="font-bold">문제: </span>{box.sumNote}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 순위 기반 결합(RRF) 예고 (Step 5)
    // ─────────────────────────────────────────────────────
    function RrfBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">🧭 {box.title}</div>
          <div className="text-[10px] text-red-800 bg-white border border-red-200 rounded p-1.5 mb-1.5">
            <span className="font-bold">함정: </span>{box.trap}
          </div>
          <div className="text-[10px] text-sky-900 bg-white border border-sky-200 rounded p-1.5 mb-1.5">
            <span className="font-bold">통찰: </span>{box.insight}
          </div>
          <div className="text-[11px] font-mono text-indigo-900 bg-indigo-100 border border-indigo-300 rounded p-1.5 mb-1.5">{box.formula}</div>
          <div className="text-[10px] text-sky-900 leading-snug font-bold">➡ {box.next}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 렉시컬 vs 벡터 대결 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      preview: { icon: '🥊', label: '대결 구도' },
      lexical: { icon: '🎯', label: '렉시컬 승' },
      vector:  { icon: '🧠', label: '벡터 승' },
      matrix:  { icon: '🧮', label: '실패 매트릭스' },
      merge:   { icon: '⚖️', label: '합치기 함정' },
    };

    function LiveDataPane({ state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.preview;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>렉시컬 vs 벡터 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.query && (
            <div className="mb-2 flex items-center gap-2 px-2 py-1 rounded border border-sky-200 bg-sky-50">
              <span className="text-xs">🔎</span>
              <span className="text-[11px] font-mono text-sky-800">검색어: "{state.query}"</span>
            </div>
          )}
          <div className="text-[10px] text-sky-700 font-mono mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            방식: {state.engineDetail}
          </div>
          <PreviewTable box={state.preview} />
          <Scoreboard box={state.match} />
          <CaseCards box={state.caseCards} />
          <Matrix box={state.matrix} />
          <DistBox box={state.dist} />
          <ScaleViz box={state.scaleViz} />
          <RrfBox box={state.rrfBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">IV-1-1. 렉시컬 vs 벡터 — 언제 뭐가 이기나</h1>
                <p className="text-sm text-sky-800/80">BM25와 임베딩의 실패 사례 교환전 — 하나만 쓰면 반드시 지는 질의가 있다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                렉시컬(BM25)과 벡터(임베딩)의 우열은 "누가 낫냐"가 아니라 "어떤 질의냐"에 달렸다.
                모델명·에러코드·인명·신조어 같은 정확 매칭류·OOV는 렉시컬이, 자연어 문장·동의어·오타·다국어 같은 의미 변형류는 벡터가 이긴다.
                실서비스 로그엔 두 유형이 모두 들어오므로(정확 매칭류가 의외로 큰 비중), 하나만 쓰면 반대편을 반드시 놓친다 — 둘 다 써야 한다.
                그런데 BM25(0~수십)와 코사인(0~1)은 스케일이 달라 단순 합산도 min-max 정규화도 불안정하다.
                해법은 "점수가 아니라 순위로 합치는 것" — 다음 장 IV-1-2의 RRF로 직결된다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['렉시컬검색', 'BM25', '벡터검색', '임베딩', 'OOV', '정확매칭', '의미유사', '동의어', '실패매트릭스', '질의로그분석', '스케일불일치', 'RRF', '하이브리드'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 (RRF 하이브리드) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
