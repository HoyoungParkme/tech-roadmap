              "점수는 버리고 순위만 믿는" RRF 공식 score(d)=Σ 1/(k+rank_i(d)) 를 문서 6개·검색기 2개로
              전 과정 실계산(모든 1/(60+r) 항 표시)하여 최종 융합 순위를 손으로 도출하고,
              k 파라미터(=60 표준)를 1/10/60/1000 으로 바꿔 순위가 어떻게 재편되는지 인터랙티브로 체험한 뒤,
              ES/OpenSearch 내장 RRF 문법·3-way 융합·RRF의 한계(점수 소실·window)와 다음 장(리랭커)까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 스케일 불일치표 / 1-over-(k+rank) 곡선 / 융합 실계산표 / k 슬라이더 재랭킹 / 실무 박스)
                       우(VSCode CodeViewer: problem_score_scale.py / rrf_fusion.py / rrf_k_experiment.py / es_rrf_retriever.py)
    색상: sky/blue (search 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ─────────────────────────────────────────────────────
    // 실계산 데이터셋 — 쿼리 "파이썬 비동기 프로그래밍", 검색기 2개
    //   각 문서 = { id, title, bm25, vec, tag }
    //     bm25 : BM25(렉시컬) 검색 순위 (1이 최상위), null = 후보에 없음
    //     vec  : 벡터(의미) 검색 순위,               null = 후보에 없음
    //   RRF 점수 = Σ 1/(k + rank_i)  (rank 가 null 인 검색기는 항을 더하지 않음)
    //   k=60 기준 최종 융합 순위: D1 > D3 > D2 > D4 > D5 > D6
    // ─────────────────────────────────────────────────────
    const DOCS = [
      { id: 'D1', title: 'asyncio 로 배우는 파이썬 비동기 프로그래밍 입문', bm25: 2, vec: 1, tag: '두 검색기 모두 상위' },
      { id: 'D2', title: 'async / await 문법 완벽 가이드',                  bm25: 3, vec: 5, tag: '키워드 강함·의미 약함' },
      { id: 'D3', title: '코루틴과 이벤트 루프의 내부 동작 원리',           bm25: 4, vec: 2, tag: '의미 최상·키워드 중위' },
      { id: 'D4', title: '동시성 vs 병렬성: 개념 정리',                      bm25: 5, vec: 4, tag: '양쪽 중하위' },
      { id: 'D5', title: '파이썬 비동기 파이썬 async 파이썬 (키워드 반복)', bm25: 1, vec: null, tag: '키워드 스팸·의미 무관' },
      { id: 'D6', title: 'Node.js 논블로킹 이벤트 루프 아키텍처',           bm25: null, vec: 3, tag: '의미만 유사·한국어 키워드 0' },
    ];

    // RRF 점수: rank 가 있는 검색기의 1/(k+rank) 만 합산
    function rrfScore(doc, k) {
      let s = 0;
      if (doc.bm25 != null) s += 1 / (k + doc.bm25);
      if (doc.vec  != null) s += 1 / (k + doc.vec);
      return s;
    }
    // 주어진 k 로 전체 문서를 융합 정렬 → [{...doc, score, fused(=1부터)}]
    function fuse(docs, k) {
      return docs
        .map((d) => ({ ...d, score: rrfScore(d, k) }))
        .sort((a, b) => b.score - a.score)
        .map((d, i) => ({ ...d, fused: i + 1 }));
    }

    // Step 2 — 1/(k+rank) 곡선 (k=1 vs k=60 비교 막대)
    function RrfCurve() {
      const K_LOW = 1, K_STD = 60;
      const ranks = [1, 2, 3, 4, 5, 6, 7, 8];
      const vLow = ranks.map((r) => 1 / (K_LOW + r));
      const vStd = ranks.map((r) => 1 / (K_STD + r));
      const maxLow = Math.max(...vLow);
      const maxStd = Math.max(...vStd);
      // 인접 순위 간 값 차이(=상위권일수록 큰지 확인)
      const gapTop = (1 / (K_STD + 1) - 1 / (K_STD + 2));
      const gapBot = (1 / (K_STD + 7) - 1 / (K_STD + 8));
      return (
        <div className="mt-1">
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">📉 1/(k+rank) — 순위가 낮아질수록 완만히 감소</div>

              {/* k=1 : 가파름 */}

                  {vLow.map((v, i) => (
                    <div key={i} className="flex-1 flex flex-col items-center justify-end">
                      <span className="text-[7px] text-slate-500 font-mono">{v.toFixed(2)}</span>
                      <div className="w-full bg-rose-400 rounded-t" style={{ height: `${(v / maxLow) * 90}%` }} />
                      <span className="text-[8px] text-slate-500">{i + 1}</span>
                    </div>
                  ))}
                </div>
              </div>
              {/* k=60 : 완만 */}
              <div>
                <div className="text-[10px] font-bold text-sky-700 mb-1">k = 60 (완만 · 표준)</div>
                <div className="flex items-end gap-1 h-28">
                  {vStd.map((v, i) => (
                    <div key={i} className="flex-1 flex flex-col items-center justify-end">
                      <span className="text-[7px] text-slate-500 font-mono">{v.toFixed(3)}</span>
                      <div className="w-full bg-sky-500 rounded-t" style={{ height: `${(v / maxStd) * 90}%` }} />
                      <span className="text-[8px] text-slate-500">{i + 1}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="mt-1 text-[9px] text-slate-500 text-center">가로축 = 순위(rank), 세로축 = 1/(k+rank) 기여값</div>
          </div>

          <div className="mt-3 rounded-lg border-2 border-sky-300 bg-sky-50 p-3">

            <div className="space-y-1.5 text-[10px] text-sky-900">
              <div className="flex gap-2"><span>①</span><span>위로 볼록 → <b>상위권 순위 차이</b>(1↔2등)를 하위권 차이(7↔8등)보다 크게 반영.</span></div>

    // Step 3 — 완전 실계산 융합 표
    function FusionTable({ k = 60 }) {
      const fused = useMemo(() => fuse(DOCS, k), [k]);
      const rankById = Object.fromEntries(fused.map((d) => [d.id, d.fused]));
      const maxScore = Math.max(...fused.map((d) => d.score));
      const term = (r) => (r == null ? null : 1 / (k + r));
      return (
        <div className="mt-1">
          <div className="rounded-lg border-2 border-sky-400 bg-white p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">

                  {DOCS.map((d) => {

    // Step 4 — k 슬라이더 인터랙티브 재랭킹

            </div>
            <input
              type="range" min="0" max="3" step="1" value={kIdx}
              onChange={(e) => setKIdx(Number(e.target.value))}
              aria-label="RRF k 파라미터 선택"
              className="w-full accent-sky-600"
            />
            <div className="flex justify-between text-[10px] font-mono text-slate-500 px-0.5">
              {K_CHOICES.map((c) => (
                <span key={c} className={c === k ? 'text-sky-700 font-bold' : ''}>{c}</span>
              ))}
            </div>
            <div className="mt-1 text-[10px] text-slate-600">
              {k === 1 && '상위 순위가 폭발 → 한 검색기의 1등이 결과를 좌우한다.'}
              {k === 10 && '아직 상위 편중이 있으나 스팸 문서는 이미 가라앉는다.'}
              {k === 60 && '표준값 — 상위권 존중과 합의 사이의 균형점.'}
              {k === 1000 && '곡선이 평탄 → 순위 차이 소멸, "몇 검색기가 지지했나"만 남는다.'}
            </div>
          </div>

          {/* 재랭킹 결과 */}
          <div className="mt-3 rounded-lg border-2 border-sky-300 bg-sky-50 p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">📊 융합 순위 (k={k})</div>
            <div className="space-y-1">
              {fused.map((d) => {
                const isSpam = d.id === 'D5';
                return (
                  <div key={d.id} className={`flex items-center gap-2 rounded px-1 py-0.5 ${isSpam ? 'bg-rose-100 border border-rose-300' : ''}`}>
                    <span className="w-4 text-[10px] font-bold text-sky-700 text-right">{d.fused}</span>
                    <span className={`w-7 font-mono text-[10px] font-bold ${isSpam ? 'text-rose-700' : 'text-sky-800'}`}>{d.id}</span>
                    <div className="flex-1 h-3 rounded-full bg-sky-100 overflow-hidden">
                      <div className={`h-full ${isSpam ? 'bg-rose-400' : 'bg-gradient-to-r from-sky-400 to-sky-600'} transition-all duration-500`} style={{ width: `${(d.score / maxScore) * 100}%` }} />
                    </div>
                    <span className="w-16 text-right font-mono text-[9px] text-slate-600">{d.score.toFixed(5)}</span>
                  </div>
                );
              })}
            </div>
            <div className={`mt-2 rounded p-1.5 text-[10px] leading-snug ${d5rank <= 3 ? 'bg-rose-50 border border-rose-300 text-rose-900' : 'bg-emerald-50 border border-emerald-300 text-emerald-900'}`}>
              {d5rank <= 3
                ? <span>🚨 키워드 스팸 <b>D5</b>가 <b>{d5rank}위</b>까지 상승! 작은 k 가 단일 검색기의 1등을 과대평가한다.</span>
                : <span>✅ 키워드 스팸 <b>D5</b>는 <b>{d5rank}위</b>로 강등. 두 검색기의 합의를 받은 문서가 상위를 차지한다.</span>}
            </div>
          </div>
        </div>
      );
    }

    // Step 5 — 실무 박스
    function ProductionBox() {
      const threeWay = useMemo(() => {
        const docs3 = [
          { id: 'D1', bm25: 2, vec: 1, pop: 3 },
          { id: 'D3', bm25: 4, vec: 2, pop: 5 },
          { id: 'D2', bm25: 3, vec: 5, pop: 1 },
          { id: 'D4', bm25: 5, vec: 4, pop: 2 },
        ];
        const k = 60;
        return docs3
          .map((d) => ({ id: d.id, score: 1 / (k + d.bm25) + 1 / (k + d.vec) + 1 / (k + d.pop), bm25: d.bm25, vec: d.vec, pop: d.pop }))
          .sort((a, b) => b.score - a.score);
      }, []);
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-sky-400 bg-white p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">🏭 검색 엔진 내장 RRF (한 줄로)</div>
            <div className="space-y-1.5 text-[10px]">
              <div className="flex items-start gap-2 rounded bg-sky-50 border border-sky-200 p-1.5">
                <span className="font-bold text-sky-700 w-24 shrink-0">Elasticsearch</span>
                <span className="font-mono text-slate-700">retriever.rrf {`{ rank_constant: 60, rank_window_size }`}</span>
              </div>
              <div className="flex items-start gap-2 rounded bg-sky-50 border border-sky-200 p-1.5">
                <span className="font-bold text-sky-700 w-24 shrink-0">OpenSearch</span>
                <span className="font-mono text-slate-700">hybrid query + score-ranking normalization processor</span>
              </div>
            </div>
          </div>

          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-xs font-bold text-indigo-900 mb-2">➕ 3-way 융합: BM25 + 벡터 + 인기도 (항만 늘 뿐)</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-slate-600 border-b border-slate-200">
                  <th className="text-left py-0.5">문서</th>
                  <th className="text-center py-0.5">BM25</th>
                  <th className="text-center py-0.5">벡터</th>
                  <th className="text-center py-0.5">인기도</th>
                  <th className="text-center py-0.5">RRF 합</th>
                </tr>
              </thead>
              <tbody>
                {threeWay.map((d, i) => (
                  <tr key={d.id} className={`border-t border-slate-100 ${i === 0 ? 'bg-indigo-50' : ''}`}>
                    <td className="py-1 font-mono font-bold text-indigo-800">{d.id}</td>
                    <td className="text-center font-mono">{d.bm25}</td>
                    <td className="text-center font-mono">{d.vec}</td>
                    <td className="text-center font-mono">{d.pop}</td>
                    <td className="text-center font-mono font-bold text-indigo-900">{d.score.toFixed(5)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
            <div className="text-xs font-bold text-amber-800 mb-1.5">⚠️ RRF 의 한계</div>
            <div className="space-y-1 text-[10px] text-amber-900">
              <div className="flex gap-2"><span>①</span><span><b>점수 정보 소실</b> — 0.95 확신과 0.51 이 같은 rank 면 동일 취급.</span></div>
              <div className="flex gap-2"><span>②</span><span><b>window 밖 소실</b> — rank_window_size 밖 문서는 그 검색기 항이 빠진다.</span></div>
            </div>
          </div>

          <div className="rounded-xl border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
            <div className="text-sm font-bold text-sky-900 mb-2">🧭 실전 2단계 파이프라인</div>
            <div className="flex items-stretch gap-1 text-[10px] font-bold text-center">
              <div className="flex-1 rounded-lg border-2 border-sky-300 bg-white p-2 flex flex-col items-center justify-center text-sky-900">
                <span>1) RRF 융합</span><span className="text-[9px] font-normal text-slate-500">넓게 후보 확보 (recall)</span>
              </div>
              <div className="flex items-center text-sky-500 text-lg">→</div>
              <div className="flex-1 rounded-lg border-2 border-indigo-400 bg-white p-2 flex flex-col items-center justify-center text-indigo-900">
                <span>2) 리랭커</span><span className="text-[9px] font-normal text-slate-500">정밀 재정렬 (precision)</span>
              </div>
            </div>
            <div className="mt-2 text-[10px] text-sky-900 leading-snug">
              크로스 인코더 리랭커는 점수를 다시 계산해 RRF 가 버린 정밀도를 되찾는다 — <b>다음 장</b>에서 다룬다.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 뷰 라우팅 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const VIEW_LABEL = {
      scaleTable:  { icon: '⚖️', label: '스케일 불일치' },
      curve:       { icon: '📉', label: '1/(k+rank) 곡선' },
      fusionTable: { icon: '🧮', label: 'RRF 실계산' },
      kExperiment: { icon: '🎚️', label: 'k 파라미터' },
      production:  { icon: '🏭', label: '실무 적용' },
    };

    function LiveDataPane({ state }) {
      const v = VIEW_LABEL[state.view] || VIEW_LABEL.fusionTable;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{v.icon}</span>
              <span>RRF 융합 — {v.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.view === 'scaleTable'  && <ScaleTable />}
          {state.view === 'curve'       && <RrfCurve />}
          {state.view === 'fusionTable' && <FusionTable k={60} />}
          {state.view === 'kExperiment' && <KExperiment />}
          {state.view === 'production'  && <ProductionBox />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">IV-1-2. RRF — Reciprocal Rank Fusion</h1>
                <p className="text-sm text-sky-800/80">점수는 버리고 순위만 믿는다 — 하이브리드 검색의 사실상 표준 융합법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · Step 4 는 슬라이더로 k 를 직접 조절</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                RRF 는 점수를 버리고 순위만 융합한다 — score(d) = Σ 1/(k+rank_i(d)). 순위에는 스케일이 없어 정규화도 가중치 튜닝도 필요 없다.
                1/(k+rank) 곡선은 상위권 차이를 크게, 하위권 차이를 작게 반영하며, k(표준 60)로 그 완만함을 조절한다.
                한쪽 검색기에만 나온 문서는 항이 하나뿐이라 자동으로 강등되고, 두 검색기의 합의를 받은 문서가 올라온다.
                다만 RRF 는 점수 정보를 버리고 window 밖 문서를 놓치므로, 실전은 "RRF 로 recall → 리랭커로 precision" 2단계로 간다.
                다음 장에서는 그 크로스 인코더 리랭커를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RRF', '순위융합', '하이브리드검색', 'BM25', '벡터검색', 'k파라미터', 'rank_constant', 'rank_window_size', 'Elasticsearch', 'OpenSearch', '3-way융합', '리랭커'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-3.html" className="underline hover:no-underline">다음: IV-1-3 (크로스 인코더 리랭커) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
