  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔀</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Search IV-1-2 — RRF (Reciprocal Rank Fusion)
    학습 목표: BM25 점수와 벡터(코사인) 점수는 스케일이 달라 그대로 더할 수 없다는 문제(IV-1-1 회수)에서 출발해,
              "점수는 버리고 순위만 믿는" RRF 공식 score(d)=Σ 1/(k+rank_i(d)) 를 문서 6개·검색기 2개로
              전 과정 실계산(모든 1/(60+r) 항 표시)하여 최종 융합 순위를 손으로 도출하고,
              k 파라미터(=60 표준)를 1/10/60/1000 으로 바꿔 순위가 어떻게 재편되는지 인터랙티브로 체험한 뒤,
              ES/OpenSearch 내장 RRF 문법·3-way 융합·RRF의 한계(점수 소실·window)와 다음 장(리랭커)까지 5단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 스케일 불일치표 / 1-over-(k+rank) 곡선 / 융합 실계산표 / k 슬라이더 재랭킹 / 실무 박스)
                       우(VSCode CodeViewer: problem_score_scale.py / rrf_fusion.py / rrf_k_experiment.py / es_rrf_retriever.py)
    색상: sky/blue (search 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ─────────────────────────────────────────────────────
    // 실계산 데이터셋 — 쿼리 "파이썬 비동기 프로그래밍", 검색기 2개
    //   각 문서 = { id, title, bm25, vec, tag }
    //     bm25 : BM25(렉시컬) 검색 순위 (1이 최상위), null = 후보에 없음
    //     vec  : 벡터(의미) 검색 순위,               null = 후보에 없음
    //   RRF 점수 = Σ 1/(k + rank_i)  (rank 가 null 인 검색기는 항을 더하지 않음)
    //   k=60 기준 최종 융합 순위: D1 > D3 > D2 > D4 > D5 > D6
    // ─────────────────────────────────────────────────────
    const DOCS = [
      { id: 'D1', title: 'asyncio 로 배우는 파이썬 비동기 프로그래밍 입문', bm25: 2, vec: 1, tag: '두 검색기 모두 상위' },
      { id: 'D2', title: 'async / await 문법 완벽 가이드',                  bm25: 3, vec: 5, tag: '키워드 강함·의미 약함' },
      { id: 'D3', title: '코루틴과 이벤트 루프의 내부 동작 원리',           bm25: 4, vec: 2, tag: '의미 최상·키워드 중위' },
      { id: 'D4', title: '동시성 vs 병렬성: 개념 정리',                      bm25: 5, vec: 4, tag: '양쪽 중하위' },
      { id: 'D5', title: '파이썬 비동기 파이썬 async 파이썬 (키워드 반복)', bm25: 1, vec: null, tag: '키워드 스팸·의미 무관' },
      { id: 'D6', title: 'Node.js 논블로킹 이벤트 루프 아키텍처',           bm25: null, vec: 3, tag: '의미만 유사·한국어 키워드 0' },
    ];

    // RRF 점수: rank 가 있는 검색기의 1/(k+rank) 만 합산
    function rrfScore(doc, k) {
      let s = 0;
      if (doc.bm25 != null) s += 1 / (k + doc.bm25);
      if (doc.vec  != null) s += 1 / (k + doc.vec);
      return s;
    }
    // 주어진 k 로 전체 문서를 융합 정렬 → [{...doc, score, fused(=1부터)}]
    function fuse(docs, k) {
      return docs
        .map((d) => ({ ...d, score: rrfScore(d, k) }))
        .sort((a, b) => b.score - a.score)
        .map((d, i) => ({ ...d, fused: i + 1 }));
    }

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      step1: {lang:"python", filename:"problem_score_scale.py (가중 합산의 실패)", lines:[
        "\"\"\"",
        "problem_score_scale.py — 점수를 직접 더하면 왜 실패하는가",
        "BM25 는 0~수십, cosine 은 0~1. 스케일이 달라 그대로 못 더한다.",
        "\"\"\"",
        "",
        "# 같은 문서에 대한 두 검색기의 원점수 (스케일이 전혀 다르다)",

        code:{...CODE.step5, highlight:[34,35,36,37]},

    // ═════════════════════════════════════════════════════
    // 좌측 뷰 컴포넌트들 (sky/blue 톤)
    // ═════════════════════════════════════════════════════

    // Step 1 — 점수 스케일 불일치 표
    function ScaleTable() {

          <div className="mt-3 grid grid-cols-1 gap-2">
            <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">

                D3: 0.6×12.7 + 0.4×0.91 = <b>7.98</b><br/>

                BM25 1등도 1등, 벡터 1등도 1등. <b>점수를 버리고 순위만</b> 융합하면 정규화·가중치 튜닝이 통째로 사라진다.

          </div>

    }

    // Step 2 — 1/(k+rank) 곡선 (k=1 vs k=60 비교 막대)
    function RrfCurve() {
      const K_LOW = 1, K_STD = 60;
      const ranks = [1, 2, 3, 4, 5, 6, 7, 8];
      const vLow = ranks.map((r) => 1 / (K_LOW + r));
      const vStd = ranks.map((r) => 1 / (K_STD + r));
      const maxLow = Math.max(...vLow);
      const maxStd = Math.max(...vStd);
      // 인접 순위 간 값 차이(=상위권일수록 큰지 확인)
      const gapTop = (1 / (K_STD + 1) - 1 / (K_STD + 2));
      const gapBot = (1 / (K_STD + 7) - 1 / (K_STD + 8));
      return (
        <div className="mt-1">
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">📉 1/(k+rank) — 순위가 낮아질수록 완만히 감소</div>
            <div className="grid grid-cols-2 gap-3">
              {/* k=1 : 가파름 */}
              <div>
                <div className="text-[10px] font-bold text-rose-700 mb-1">k = 1 (가파름 · 상위 독주)</div>
                <div className="flex items-end gap-1 h-28">
                  {vLow.map((v, i) => (
                    <div key={i} className="flex-1 flex flex-col items-center justify-end">
                      <span className="text-[7px] text-slate-500 font-mono">{v.toFixed(2)}</span>
                      <div className="w-full bg-rose-400 rounded-t" style={{ height: `${(v / maxLow) * 90}%` }} />
                      <span className="text-[8px] text-slate-500">{i + 1}</span>
                    </div>
                  ))}
                </div>
              </div>
              {/* k=60 : 완만 */}
              <div>
                <div className="text-[10px] font-bold text-sky-700 mb-1">k = 60 (완만 · 표준)</div>
                <div className="flex items-end gap-1 h-28">
                  {vStd.map((v, i) => (
                    <div key={i} className="flex-1 flex flex-col items-center justify-end">
                      <span className="text-[7px] text-slate-500 font-mono">{v.toFixed(3)}</span>
                      <div className="w-full bg-sky-500 rounded-t" style={{ height: `${(v / maxStd) * 90}%` }} />
                      <span className="text-[8px] text-slate-500">{i + 1}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <div className="mt-1 text-[9px] text-slate-500 text-center">가로축 = 순위(rank), 세로축 = 1/(k+rank) 기여값</div>
          </div>

          <div className="mt-3 rounded-lg border-2 border-sky-300 bg-sky-50 p-3">
            <div className="text-xs font-bold text-sky-900 mb-1.5">🔍 왜 이 모양이 좋은가</div>
            <div className="space-y-1.5 text-[10px] text-sky-900">
              <div className="flex gap-2"><span>①</span><span>위로 볼록 → <b>상위권 순위 차이</b>(1↔2등)를 하위권 차이(7↔8등)보다 크게 반영.</span></div>
              <div className="flex gap-2"><span>②</span><span>어떤 검색기가 1등을 줘도 최대 <b>1/(k+1)</b> 로 상한 → 한 검색기의 독식을 막는다.</span></div>
              <div className="rounded bg-white border border-sky-200 p-1.5 font-mono text-[9px] text-slate-700">
                k=60 인접 차이 &nbsp; 상위(1↔2): {gapTop.toFixed(6)} &nbsp;&gt;&nbsp; 하위(7↔8): {gapBot.toFixed(6)}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Step 3 — 완전 실계산 융합 표
    function FusionTable({ k = 60 }) {
      const fused = useMemo(() => fuse(DOCS, k), [k]);
      const rankById = Object.fromEntries(fused.map((d) => [d.id, d.fused]));
      const maxScore = Math.max(...fused.map((d) => d.score));
      const term = (r) => (r == null ? null : 1 / (k + r));
      return (
        <div className="mt-1">
          <div className="rounded-lg border-2 border-sky-400 bg-white p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">
              🧮 RRF 실계산 (k={k}) — 쿼리 "파이썬 비동기 프로그래밍"
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-[9.5px] whitespace-nowrap">
                <thead>
                  <tr className="text-slate-600 border-b-2 border-slate-200">
                    <th className="text-left py-1 pr-1">문서</th>
                    <th className="text-center py-1">BM25<br/>r₁</th>
                    <th className="text-center py-1">1/(60+r₁)</th>
                    <th className="text-center py-1">벡터<br/>r₂</th>
                    <th className="text-center py-1">1/(60+r₂)</th>
                    <th className="text-center py-1">RRF 합</th>
                    <th className="text-center py-1">융합<br/>순위</th>
                  </tr>
                </thead>
                <tbody>
                  {DOCS.map((d) => {
                    const t1 = term(d.bm25), t2 = term(d.vec);
                    const sum = (t1 || 0) + (t2 || 0);
                    const fr = rankById[d.id];
                    const isTop = fr === 1;
                    return (
                      <tr key={d.id} className={`border-t border-slate-100 ${isTop ? 'bg-sky-50' : ''}`}>
                        <td className="py-1.5 pr-1">
                          <span className="font-mono font-bold text-sky-800">{d.id}</span>
                          <div className="text-[8px] text-slate-500 whitespace-normal max-w-[92px] leading-tight">{d.tag}</div>
                        </td>
                        <td className="text-center font-mono">{d.bm25 ?? '—'}</td>
                        <td className="text-center font-mono text-slate-600">{t1 ? t1.toFixed(5) : <span className="text-slate-400">0</span>}</td>
                        <td className="text-center font-mono">{d.vec ?? '—'}</td>
                        <td className="text-center font-mono text-slate-600">{t2 ? t2.toFixed(5) : <span className="text-slate-400">0</span>}</td>
                        <td className="text-center font-mono font-bold text-sky-900">{sum.toFixed(5)}</td>
                        <td className="text-center">
                          <span className={`inline-block w-5 h-5 leading-5 rounded-full text-white font-bold ${fr === 1 ? 'bg-sky-600' : fr === 2 ? 'bg-sky-500' : fr <= 4 ? 'bg-sky-400' : 'bg-slate-400'}`}>{fr}</span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* 융합 결과 막대 순위 */}
          <div className="mt-3 rounded-lg border-2 border-sky-300 bg-sky-50 p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">🏁 최종 융합 순위</div>
            <div className="space-y-1">
              {fused.map((d) => (
                <div key={d.id} className="flex items-center gap-2">
                  <span className="w-4 text-[10px] font-bold text-sky-700 text-right">{d.fused}</span>
                  <span className="w-7 font-mono text-[10px] font-bold text-sky-800">{d.id}</span>
                  <div className="flex-1 h-3 rounded-full bg-sky-100 overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-sky-400 to-sky-600" style={{ width: `${(d.score / maxScore) * 100}%` }} />
                  </div>
                  <span className="w-16 text-right font-mono text-[9px] text-slate-600">{d.score.toFixed(5)}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] text-sky-900 leading-snug">
              <b>D5</b>(BM25 1등·키워드 스팸)는 벡터 항이 없어 <b>5위로 강등</b>, <b>D3</b>(BM25 4등)은 벡터 2등의 힘으로 <b>2위</b>로 상승 — 융합이 편향을 교정한다.
            </div>
          </div>
        </div>
      );
    }

    // Step 4 — k 슬라이더 인터랙티브 재랭킹
    const K_CHOICES = [1, 10, 60, 1000];
    function KExperiment() {
      const [kIdx, setKIdx] = useState(2); // 기본 k=60
      const k = K_CHOICES[kIdx];
      const fused = useMemo(() => fuse(DOCS, k), [k]);
      const maxScore = Math.max(...fused.map((d) => d.score));
      const d5rank = fused.find((d) => d.id === 'D5').fused;
      return (
        <div className="mt-1">
          <div className="rounded-lg border-2 border-sky-400 bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="text-xs font-bold text-sky-900">🎚️ k 값을 바꿔 보라</div>
              <div className="font-mono text-sm font-bold text-sky-700">k = {k}</div>
            </div>
            <input
              type="range" min="0" max="3" step="1" value={kIdx}
              onChange={(e) => setKIdx(Number(e.target.value))}
              aria-label="RRF k 파라미터 선택"
              className="w-full accent-sky-600"
            />
            <div className="flex justify-between text-[10px] font-mono text-slate-500 px-0.5">
              {K_CHOICES.map((c) => (
                <span key={c} className={c === k ? 'text-sky-700 font-bold' : ''}>{c}</span>
              ))}
            </div>
            <div className="mt-1 text-[10px] text-slate-600">
              {k === 1 && '상위 순위가 폭발 → 한 검색기의 1등이 결과를 좌우한다.'}
              {k === 10 && '아직 상위 편중이 있으나 스팸 문서는 이미 가라앉는다.'}
              {k === 60 && '표준값 — 상위권 존중과 합의 사이의 균형점.'}
              {k === 1000 && '곡선이 평탄 → 순위 차이 소멸, "몇 검색기가 지지했나"만 남는다.'}
            </div>
          </div>

          {/* 재랭킹 결과 */}
          <div className="mt-3 rounded-lg border-2 border-sky-300 bg-sky-50 p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">📊 융합 순위 (k={k})</div>
            <div className="space-y-1">
              {fused.map((d) => {
                const isSpam = d.id === 'D5';
                return (
                  <div key={d.id} className={`flex items-center gap-2 rounded px-1 py-0.5 ${isSpam ? 'bg-rose-100 border border-rose-300' : ''}`}>
                    <span className="w-4 text-[10px] font-bold text-sky-700 text-right">{d.fused}</span>
                    <span className={`w-7 font-mono text-[10px] font-bold ${isSpam ? 'text-rose-700' : 'text-sky-800'}`}>{d.id}</span>
                    <div className="flex-1 h-3 rounded-full bg-sky-100 overflow-hidden">
                      <div className={`h-full ${isSpam ? 'bg-rose-400' : 'bg-gradient-to-r from-sky-400 to-sky-600'} transition-all duration-500`} style={{ width: `${(d.score / maxScore) * 100}%` }} />
                    </div>
                    <span className="w-16 text-right font-mono text-[9px] text-slate-600">{d.score.toFixed(5)}</span>
                  </div>
                );
              })}
            </div>
            <div className={`mt-2 rounded p-1.5 text-[10px] leading-snug ${d5rank <= 3 ? 'bg-rose-50 border border-rose-300 text-rose-900' : 'bg-emerald-50 border border-emerald-300 text-emerald-900'}`}>
              {d5rank <= 3
                ? <span>🚨 키워드 스팸 <b>D5</b>가 <b>{d5rank}위</b>까지 상승! 작은 k 가 단일 검색기의 1등을 과대평가한다.</span>
                : <span>✅ 키워드 스팸 <b>D5</b>는 <b>{d5rank}위</b>로 강등. 두 검색기의 합의를 받은 문서가 상위를 차지한다.</span>}
            </div>
          </div>
        </div>
      );
    }

    // Step 5 — 실무 박스
    function ProductionBox() {
      const threeWay = useMemo(() => {
        const docs3 = [
          { id: 'D1', bm25: 2, vec: 1, pop: 3 },
          { id: 'D3', bm25: 4, vec: 2, pop: 5 },
          { id: 'D2', bm25: 3, vec: 5, pop: 1 },
          { id: 'D4', bm25: 5, vec: 4, pop: 2 },
        ];
        const k = 60;
        return docs3
          .map((d) => ({ id: d.id, score: 1 / (k + d.bm25) + 1 / (k + d.vec) + 1 / (k + d.pop), bm25: d.bm25, vec: d.vec, pop: d.pop }))
          .sort((a, b) => b.score - a.score);
      }, []);
      return (
        <div className="mt-1 space-y-3">
          <div className="rounded-lg border-2 border-sky-400 bg-white p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">🏭 검색 엔진 내장 RRF (한 줄로)</div>
            <div className="space-y-1.5 text-[10px]">
              <div className="flex items-start gap-2 rounded bg-sky-50 border border-sky-200 p-1.5">
                <span className="font-bold text-sky-700 w-24 shrink-0">Elasticsearch</span>
                <span className="font-mono text-slate-700">retriever.rrf {`{ rank_constant: 60, rank_window_size }`}</span>
              </div>
              <div className="flex items-start gap-2 rounded bg-sky-50 border border-sky-200 p-1.5">
                <span className="font-bold text-sky-700 w-24 shrink-0">OpenSearch</span>
                <span className="font-mono text-slate-700">hybrid query + score-ranking normalization processor</span>
              </div>
            </div>
          </div>

          <div className="rounded-lg border-2 border-indigo-300 bg-white p-3">
            <div className="text-xs font-bold text-indigo-900 mb-2">➕ 3-way 융합: BM25 + 벡터 + 인기도 (항만 늘 뿐)</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-slate-600 border-b border-slate-200">
                  <th className="text-left py-0.5">문서</th>
                  <th className="text-center py-0.5">BM25</th>
                  <th className="text-center py-0.5">벡터</th>
                  <th className="text-center py-0.5">인기도</th>
                  <th className="text-center py-0.5">RRF 합</th>
                </tr>
              </thead>
              <tbody>
                {threeWay.map((d, i) => (
                  <tr key={d.id} className={`border-t border-slate-100 ${i === 0 ? 'bg-indigo-50' : ''}`}>
                    <td className="py-1 font-mono font-bold text-indigo-800">{d.id}</td>
                    <td className="text-center font-mono">{d.bm25}</td>
                    <td className="text-center font-mono">{d.vec}</td>
                    <td className="text-center font-mono">{d.pop}</td>
                    <td className="text-center font-mono font-bold text-indigo-900">{d.score.toFixed(5)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
            <div className="text-xs font-bold text-amber-800 mb-1.5">⚠️ RRF 의 한계</div>
            <div className="space-y-1 text-[10px] text-amber-900">
              <div className="flex gap-2"><span>①</span><span><b>점수 정보 소실</b> — 0.95 확신과 0.51 이 같은 rank 면 동일 취급.</span></div>
              <div className="flex gap-2"><span>②</span><span><b>window 밖 소실</b> — rank_window_size 밖 문서는 그 검색기 항이 빠진다.</span></div>
            </div>
          </div>

          <div className="rounded-xl border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
            <div className="text-sm font-bold text-sky-900 mb-2">🧭 실전 2단계 파이프라인</div>
            <div className="flex items-stretch gap-1 text-[10px] font-bold text-center">
              <div className="flex-1 rounded-lg border-2 border-sky-300 bg-white p-2 flex flex-col items-center justify-center text-sky-900">
                <span>1) RRF 융합</span><span className="text-[9px] font-normal text-slate-500">넓게 후보 확보 (recall)</span>
              </div>
              <div className="flex items-center text-sky-500 text-lg">→</div>
              <div className="flex-1 rounded-lg border-2 border-indigo-400 bg-white p-2 flex flex-col items-center justify-center text-indigo-900">
                <span>2) 리랭커</span><span className="text-[9px] font-normal text-slate-500">정밀 재정렬 (precision)</span>
              </div>
            </div>
            <div className="mt-2 text-[10px] text-sky-900 leading-snug">
              크로스 인코더 리랭커는 점수를 다시 계산해 RRF 가 버린 정밀도를 되찾는다 — <b>다음 장</b>에서 다룬다.
            </div>

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 뷰 라우팅 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const VIEW_LABEL = {
      scaleTable:  { icon: '⚖️', label: '스케일 불일치' },
      curve:       { icon: '📉', label: '1/(k+rank) 곡선' },
      fusionTable: { icon: '🧮', label: 'RRF 실계산' },
      kExperiment: { icon: '🎚️', label: 'k 파라미터' },
      production:  { icon: '🏭', label: '실무 적용' },
    };

    function LiveDataPane({ beat, state }) {
      const v = VIEW_LABEL[state.view] || VIEW_LABEL.fusionTable;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{v.icon}</span>
              <span>RRF 융합 — {v.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.view === 'scaleTable'  && <ScaleTable />}
          {state.view === 'curve'       && <RrfCurve />}
          {state.view === 'fusionTable' && <FusionTable k={60} />}
          {state.view === 'kExperiment' && <KExperiment />}
          {state.view === 'production'  && <ProductionBox />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">IV-1-2. RRF — Reciprocal Rank Fusion</h1>
                <p className="text-sm text-sky-800/80">점수는 버리고 순위만 믿는다 — 하이브리드 검색의 사실상 표준 융합법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · Step 4 는 슬라이더로 k 를 직접 조절</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                RRF 는 점수를 버리고 순위만 융합한다 — score(d) = Σ 1/(k+rank_i(d)). 순위에는 스케일이 없어 정규화도 가중치 튜닝도 필요 없다.
                1/(k+rank) 곡선은 상위권 차이를 크게, 하위권 차이를 작게 반영하며, k(표준 60)로 그 완만함을 조절한다.
                한쪽 검색기에만 나온 문서는 항이 하나뿐이라 자동으로 강등되고, 두 검색기의 합의를 받은 문서가 올라온다.
                다만 RRF 는 점수 정보를 버리고 window 밖 문서를 놓치므로, 실전은 "RRF 로 recall → 리랭커로 precision" 2단계로 간다.
                다음 장에서는 그 크로스 인코더 리랭커를 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['RRF', '순위융합', '하이브리드검색', 'BM25', '벡터검색', 'k파라미터', 'rank_constant', 'rank_window_size', 'Elasticsearch', 'OpenSearch', '3-way융합', '리랭커'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-3.html" className="underline hover:no-underline">다음: IV-1-3 (크로스 인코더 리랭커) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
