  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

<body>
  <div id="root"></div>

  <!--
    Search II-1-2 — BM25 — 표준 랭킹 함수 해부
    학습 목표: TF-IDF의 두 구멍(TF 무한 증가·긴 문서 유리)이 실제로 잘못된 랭킹을 만드는 것을 재현하고,
              BM25가 이를 어떻게 메우는지 두 파라미터로 해부한다 —
              (k1) TF 포화 곡선 tf(k1+1)/(tf+k1),
              (b) 문서 길이 정규화 (1 - b + b·|D|/avgdl),
              그리고 IDF×포화TF×길이보정을 문서 3개에 완전 실계산해 TF-IDF와 순위가 뒤집히는 지점을 본다.
    패턴: fastapi v1 — 좌(LiveDataPane: k1 포화 곡선(슬라이더)·b 길이 게이지(슬라이더)·BM25 실계산 표·순위 비교)
                       우(VSCode CodeViewer: bm25_demo.py / rank_bm25 / ES explain)
    색상: sky/blue (search 도메인)
    수치: N=6, df=3, avgdl=40, idf=ln2≈0.6931 / k1=1.2 b=0.75 기본
          Doc A(len10,tf2)=1.2079  Doc B(len40,tf5)=1.2298  Doc C(len120,tf9)=1.1437
          TF-IDF 순위 C>B>A ↔ BM25 순위 B>A>C  (긴 문서 C가 최하위로 추락)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ─────────────────────────────────────────────────────
    // 공용 코퍼스 & BM25 수학 — 좌측 시각화와 우측 코드가 같은 숫자를 쓴다
    //   N     : 전체 문서 수
    //   DF    : "파이썬" 을 포함한 문서 수 (document frequency)
    //   AVGDL : 평균 문서 길이(단어)
    //   DOCS  : 순위를 매길 후보 3개 { id, name, kind, len, tf }
    // ─────────────────────────────────────────────────────
    const N = 6, DF = 3, AVGDL = 40;
    const IDF = Math.log((N - DF + 0.5) / (DF + 0.5) + 1);        // = ln2 ≈ 0.6931 (BM25 IDF)
    const IDF_CLASSIC = Math.log(N / DF);                         // = ln2 (고전 TF-IDF 용, 여기선 우연히 동일)

    const DOCS = [
      { id: 'A', name: '"파이썬 입문"',          kind: '짧은 제목 필드', len: 10,  tf: 2 },
      { id: 'B', name: '블로그 — 파이썬 튜토리얼', kind: '평균 길이 본문', len: 40,  tf: 5 },
      { id: 'C', name: '파이썬 종합 가이드(장문)', kind: '아주 긴 본문',   len: 120, tf: 9 },
    ];

    // 길이 정규화 계수 K = k1·(1 - b + b·|D|/avgdl)
    const lenNorm = (k1, b, len) => k1 * (1 - b + b * len / AVGDL);
    // 포화 TF = tf·(k1+1) / (tf + K)
    const satTf = (tf, k1, b, len) => (tf * (k1 + 1)) / (tf + lenNorm(k1, b, len));
    // BM25(단일 텀) = IDF × 포화TF
    const bm25 = (tf, k1, b, len) => IDF * satTf(tf, k1, b, len);
    // 고전 TF-IDF = raw_tf × idf  (TF 무한 증가 + 길이 보정 없음)
    const tfidf = (tf) => tf * IDF_CLASSIC;
    // 순수 포화 곡선(길이 무시): tf·(k1+1)/(tf+k1)
    const satPure = (tf, k1) => (tf * (k1 + 1)) / (tf + k1);

    const r2 = (x) => Math.round(x * 100) / 100;
    const r4 = (x) => Math.round(x * 10000) / 10000;

    // ─────────────────────────────────────────────────────
    // STEPS — 5단계 시나리오
    //   각 step 은 좌측 패널이 무엇을 그릴지 pane 키로 지정한다
    //   pane: 'holes' | 'saturation' | 'length' | 'fullcalc' | 'tuning'
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. TF-IDF의 두 구멍 — 잘못된 랭킹을 재현한다',
        pane: 'holes',
        actor: '🕳️ "파이썬" 검색 · 문서 3개',
        query: '파이썬',
        desc: '앞 장의 TF-IDF는 "단어 빈도(TF) × 희소성(IDF)"으로 점수를 매겼다. 그런데 여기엔 두 개의 구멍이 있다. 첫째, TF가 선형으로 무한히 커진다 — 같은 단어가 10번 나온 문서를 1번 나온 문서의 정확히 10배 관련 있다고 본다. 하지만 "파이썬"이 2번 나온 글과 3번 나온 글의 차이는 크게 느껴져도, 20번과 21번의 차이는 사실상 무의미하다. 둘째, 긴 문서가 부당하게 유리하다 — 문서가 길면 단어도 많으니 TF가 자동으로 높아져, 실제로는 장황할 뿐인 긴 문서가 정곡을 찌른 짧은 문서를 밀어낸다. 아래 실계산이 바로 그 사고를 보여준다: 짧은 제목 A와 알맞은 본문 B를 제치고, 그저 길기만 한 문서 C가 6.24점으로 1위를 차지한다.',
        alert: { tone: 'danger', text: 'TF-IDF 순위: C(6.24) > B(3.47) > A(1.39). "파이썬"을 9번 반복한 장문 C가 1위 — 길이만으로 이겼다. TF의 무한 증가와 길이 무보정이라는 두 구멍이 랭킹을 망친다.' },
      },
      {
        title: 'Step 2. TF 포화 — k1으로 "빈도의 한계효용"을 꺾는다',
        pane: 'saturation',

            <div className="space-y-1.5">
              {ranked.map((d, i) => {
                const sc = tfidf(d.tf);
                return (
                  <div key={d.id} className={`rounded border px-2 py-1.5 ${i === 0 ? 'border-red-400 bg-red-50' : 'border-slate-200 bg-slate-50'}`}>
                    <div className="flex items-center gap-2">
                      <span className={`text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center ${i === 0 ? 'bg-red-500 text-white' : 'bg-slate-300 text-slate-700'}`}>{i + 1}</span>
                      <span className="text-[11px] font-bold text-slate-800 flex-1 truncate">{d.id}. {d.name}</span>
                      <span className="text-[9px] text-slate-500 font-mono">len {d.len} · tf {d.tf}</span>
                      <span className="text-[11px] font-mono font-bold text-red-800 w-12 text-right">{r2(sc)}</span>
                    </div>
                    <div className="mt-1 h-1.5 rounded-full bg-slate-100 overflow-hidden">
                      <div className={`h-full ${i === 0 ? 'bg-red-500' : 'bg-sky-400'}`} style={{ width: `${(sc / maxScore) * 100}%` }} />
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="mt-2 text-[10px] text-red-900 font-bold">→ 그저 긴 문서 C가 6.24점 1위. 짧고 정확한 A는 꼴찌. BM25가 이 둘을 메운다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — k1 포화 곡선 (SVG + 슬라이더)
    // ─────────────────────────────────────────────────────
    function SaturationCurve({ k1, setK1 }) {
      const W = 300, H = 160, PADL = 28, PADB = 22, PADT = 10, PADR = 10;
      const tfMax = 24;
      const yMax = 3.2;                       // (k1+1) 최대 ~3.1 여유
      const x = (tf) => PADL + (tf / tfMax) * (W - PADL - PADR);
      const y = (v) => H - PADB - (v / yMax) * (H - PADB - PADT);
      const curve = (kk) => {
        let d = '';
        for (let tf = 0; tf <= tfMax; tf += 0.5) {
          d += (tf === 0 ? 'M' : 'L') + r2(x(tf)) + ',' + r2(y(satPure(tf, kk))) + ' ';
        }
        return d;
      };
      const marks = [2, 3, 20, 21];
      const d23 = r2(satPure(3, k1) - satPure(2, k1));
      const d2021 = Math.round((satPure(21, k1) - satPure(20, k1)) * 1000) / 1000;
      return (
        <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="flex items-center justify-between mb-1">
            <div className="text-xs font-bold text-sky-900">📉 포화 곡선 tf·(k1+1)/(tf+k1)</div>
            <div className="text-[10px] font-mono text-sky-700">수렴값 → {r2(k1 + 1)}</div>
          </div>
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ maxHeight: 170 }}>
            {/* 축 */}
            <line x1={PADL} y1={H - PADB} x2={W - PADR} y2={H - PADB} stroke="#cbd5e1" strokeWidth="1" />
            <line x1={PADL} y1={PADT} x2={PADL} y2={H - PADB} stroke="#cbd5e1" strokeWidth="1" />
            {/* 수렴선 */}
            <line x1={PADL} y1={y(k1 + 1)} x2={W - PADR} y2={y(k1 + 1)} stroke="#f59e0b" strokeWidth="1" strokeDasharray="3 3" />
            <text x={W - PADR} y={y(k1 + 1) - 3} textAnchor="end" fontSize="8" fill="#b45309">k1+1 상한</text>
            {/* 비교용 선형 TF (얇게) */}
            <line x1={x(0)} y1={y(0)} x2={x(tfMax)} y2={y(Math.min(yMax, tfMax * 0.13))} stroke="#fca5a5" strokeWidth="1" strokeDasharray="2 2" />
            <text x={x(tfMax) - 4} y={y(Math.min(yMax, tfMax * 0.13)) - 2} textAnchor="end" fontSize="8" fill="#ef4444">선형 TF(구멍)</text>
            {/* 포화 곡선 */}
            <path d={curve(k1)} fill="none" stroke="#0284c7" strokeWidth="2.4" />
            {/* 마크 점 */}
            {marks.map((tf) => (
              <g key={tf}>
                <circle cx={x(tf)} cy={y(satPure(tf, k1))} r="3" fill="#0369a1" />
                <text x={x(tf)} y={y(satPure(tf, k1)) - 5} textAnchor="middle" fontSize="7.5" fill="#0c4a6e">{tf}</text>
              </g>
            ))}
            <text x={(W) / 2} y={H - 4} textAnchor="middle" fontSize="8" fill="#64748b">단어 등장 횟수 tf →</text>
          </svg>
          {/* k1 슬라이더 */}
          <div className="mt-1 flex items-center gap-2">
            <span className="text-[10px] font-mono text-sky-800 w-16">k1 = {k1.toFixed(1)}</span>
            <input type="range" min="0" max="3" step="0.1" value={k1}
              onChange={(e) => setK1(parseFloat(e.target.value))}
              className="flex-1 accent-sky-600" aria-label="k1 파라미터 슬라이더" />
            <button onClick={() => setK1(1.2)} className="text-[9px] px-1.5 py-0.5 rounded border border-sky-300 text-sky-700 hover:bg-sky-50">기본 1.2</button>
          </div>
          <div className="mt-2 grid grid-cols-2 gap-2 text-[10px]">
            <div className="rounded border border-sky-200 bg-sky-50 px-2 py-1 text-sky-900">2회→3회 증가분 <b className="font-mono">+{d23}</b></div>
            <div className="rounded border border-slate-200 bg-slate-50 px-2 py-1 text-slate-700">20회→21회 증가분 <b className="font-mono">+{d2021}</b></div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — b 길이 정규화 게이지 (슬라이더)
    // ─────────────────────────────────────────────────────
    function LengthGauge({ k1, b, setB }) {
      // b=0.75 기준 계수 K, 그리고 base(k1=길이무시) 대비 페널티/이득 표시
      const base = k1;                          // b=0 일 때 K = k1 (기준선)
      return (
        <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-1">📏 길이 계수 K = k1·(1 − b + b·|D|/avgdl)</div>
          <div className="text-[10px] text-slate-600 mb-2">avgdl(평균 길이) = {AVGDL} 단어 · K가 클수록 포화 TF가 깎인다</div>
          {DOCS.map((d) => {
            const K = lenNorm(k1, b, d.len);
            const ratio = d.len / AVGDL;
            const penalty = K > base + 0.01;    // 평균보다 길어 페널티
            const bonus = K < base - 0.01;      // 평균보다 짧아 이득
            const pct = Math.min(100, (K / (k1 * (1 - b + b * (120 / AVGDL)))) * 100);
            return (
              <div key={d.id} className="mb-2">
                <div className="flex items-center gap-2 text-[10px]">
                  <span className="font-bold text-slate-800 w-6">{d.id}</span>
                  <span className="text-slate-600 flex-1 truncate">{d.kind} · len {d.len}</span>
                  <span className="font-mono text-slate-500">|D|/avgdl={r2(ratio)}</span>
                  <span className={`font-mono font-bold w-14 text-right ${penalty ? 'text-red-700' : bonus ? 'text-emerald-700' : 'text-slate-700'}`}>K={r2(K)}</span>
                </div>
                <div className="mt-0.5 h-2 rounded-full bg-slate-100 overflow-hidden">
                  <div className={`h-full ${penalty ? 'bg-red-500' : bonus ? 'bg-emerald-500' : 'bg-sky-400'}`} style={{ width: `${pct}%` }} />
                </div>
                <div className="text-[9px] mt-0.5">
                  {penalty ? <span className="text-red-700">▲ 평균보다 길다 → 페널티(점수 깎임)</span>
                    : bonus ? <span className="text-emerald-700">▼ 평균보다 짧다 → 보정 이득</span>
                    : <span className="text-slate-500">= 평균 길이 → 보정 없음</span>}
                </div>
              </div>
            );
          })}
          <div className="mt-1 flex items-center gap-2">
            <span className="text-[10px] font-mono text-sky-800 w-16">b = {b.toFixed(2)}</span>
            <input type="range" min="0" max="1" step="0.05" value={b}
              onChange={(e) => setB(parseFloat(e.target.value))}
              className="flex-1 accent-sky-600" aria-label="b 파라미터 슬라이더" />
            <button onClick={() => setB(0.75)} className="text-[9px] px-1.5 py-0.5 rounded border border-sky-300 text-sky-700 hover:bg-sky-50">기본 0.75</button>
          </div>
          <div className="mt-2 grid grid-cols-2 gap-2 text-[9px]">
            <div className="rounded border border-emerald-200 bg-emerald-50 px-2 py-1 text-emerald-900">b=0 → 길이 완전 무시 (모든 K 동일)</div>
            <div className="rounded border border-red-200 bg-red-50 px-2 py-1 text-red-900">b=1 → 길이에 완전 비례 (장문 최대 페널티)</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 전체 식 실계산 표 + 순위 비교
    // ─────────────────────────────────────────────────────
    function FullCalcTable({ k1, b }) {
      const rows = DOCS.map((d) => {
        const ratio = d.len / AVGDL;
        const K = lenNorm(k1, b, d.len);
        const sat = satTf(d.tf, k1, b, d.len);
        const score = IDF * sat;
        return { ...d, ratio, K, sat, score, tfidfScore: tfidf(d.tf) };
      });
      const byBm25 = [...rows].sort((a, b2) => b2.score - a.score);
      const byTfidf = [...rows].sort((a, b2) => b2.tfidfScore - a.tfidfScore);
      const rankBm25 = (id) => byBm25.findIndex((r) => r.id === id) + 1;
      const rankTfidf = (id) => byTfidf.findIndex((r) => r.id === id) + 1;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-sky-300 bg-white p-2.5">
            <div className="text-xs font-bold text-sky-900 mb-1">🧮 실계산 (IDF={r4(IDF)}, k1={k1.toFixed(1)}, b={b.toFixed(2)})</div>
            <div className="overflow-x-auto">
              <table className="w-full text-[10px]">
                <thead>
                  <tr className="text-sky-900 border-b border-sky-200">
                    <th className="text-left py-0.5">문서</th>
                    <th className="text-right py-0.5">tf</th>
                    <th className="text-right py-0.5">|D|/avgdl</th>
                    <th className="text-right py-0.5">K</th>
                    <th className="text-right py-0.5">포화TF</th>
                    <th className="text-right py-0.5">BM25</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => (
                    <tr key={r.id} className="border-t border-slate-100 font-mono">
                      <td className="py-1 font-sans font-bold text-slate-800">{r.id} <span className="text-[8px] text-slate-500">({r.len})</span></td>
                      <td className="py-1 text-right">{r.tf}</td>
                      <td className="py-1 text-right text-slate-600">{r2(r.ratio)}</td>
                      <td className="py-1 text-right text-slate-600">{r2(r.K)}</td>
                      <td className="py-1 text-right text-sky-700">{r4(r.sat)}</td>
                      <td className="py-1 text-right font-bold text-sky-900">{r4(r.score)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="mt-1 text-[9px] text-slate-500 font-mono">BM25 = IDF × tf·(k1+1)/(tf + K),  K = k1·(1 − b + b·|D|/avgdl)</div>
          </div>
          {/* 순위 비교 */}
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2.5">
            <div className="text-xs font-bold text-emerald-900 mb-1.5">🔀 순위 역전 — TF-IDF vs BM25</div>
            <div className="grid grid-cols-2 gap-2 text-[10px]">
              <div>
                <div className="text-red-800 font-bold mb-1">TF-IDF (구멍 그대로)</div>
                {byTfidf.map((r, i) => (
                  <div key={r.id} className="flex items-center gap-1 mb-0.5">
                    <span className="w-4 h-4 rounded-full bg-red-400 text-white flex items-center justify-center text-[8px] font-bold">{i + 1}</span>
                    <span className="font-bold">{r.id}</span>
                    <span className="font-mono text-red-800 ml-auto">{r2(r.tfidfScore)}</span>
                  </div>
                ))}
              </div>
              <div>
                <div className="text-sky-800 font-bold mb-1">BM25 (포화+길이보정)</div>
                {byBm25.map((r, i) => {
                  const moved = rankBm25(r.id) !== rankTfidf(r.id);
                  return (
                    <div key={r.id} className="flex items-center gap-1 mb-0.5">
                      <span className="w-4 h-4 rounded-full bg-sky-500 text-white flex items-center justify-center text-[8px] font-bold">{i + 1}</span>
                      <span className="font-bold">{r.id}</span>
                      {moved && <span className="text-[8px] text-emerald-700">{rankBm25(r.id) < rankTfidf(r.id) ? '▲' : '▼'}</span>}
                      <span className="font-mono text-sky-800 ml-auto">{r4(r.score)}</span>
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="mt-1.5 text-[10px] text-emerald-900 font-bold">장문 C: TF-IDF 1위 → BM25 최하위. "많이"가 아니라 "밀도 높게" 관련된 문서가 위로.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 튜닝 & 현재 위치
    // ─────────────────────────────────────────────────────
    function TuningPane() {
      const tuneCases = [
        { icon: '🏷️', head: '아주 짧은 필드 (상품명·태그)', body: 'b를 낮춰(≈0.3) 길이 페널티 완화. 제목은 길이 차이가 관련도와 무관.', tone: 'border-sky-400 bg-sky-50 text-sky-900' },
        { icon: '⚗️', head: '반복 용어 많은 도메인 (법률·의학)', body: '동일 용어 반복이 자연스러움 → k1을 조정해 포화 시점을 바꾼다.', tone: 'border-indigo-400 bg-indigo-50 text-indigo-900' },
        { icon: '🧱', head: '필드별 가중치가 필요할 때', body: 'BM25F — 제목·본문을 합산 전에 정규화·가중. ES multi_match + 필드 부스팅이 실전판.', tone: 'border-amber-400 bg-amber-50 text-amber-900' },
        { icon: '🛑', head: '대부분의 경우', body: '기본값 k1=1.2, b=0.75가 최선. 섣부른 튜닝보다 기본값이 낫다 — 근거(explain) 없이 만지지 말 것.', tone: 'border-emerald-400 bg-emerald-50 text-emerald-900' },
      ];
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">🔧 k1·b 튜닝 — 언제 손대나</div>
            <div className="grid grid-cols-1 gap-2">
              {tuneCases.map((c, i) => (
                <div key={i} className={`rounded border-2 p-2 ${c.tone}`}>
                  <div className="text-[11px] font-bold mb-0.5">{c.icon} {c.head}</div>
                  <div className="text-[10px] leading-snug">{c.body}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-xl border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
            <div className="text-sm font-bold text-sky-900 mb-2">🗺️ 이 과정의 지도 — 현재 위치</div>
            <div className="flex items-stretch gap-1">
              {[
                { t: '렉시컬\n(BM25)', on: true },
                { t: '벡터\n(임베딩)', on: false },
                { t: '하이브리드\n(둘의 결합)', on: false },
              ].map((s, i) => (
                <React.Fragment key={i}>
                  {i > 0 && <div className="flex items-center text-sky-500 text-lg">→</div>}
                  <div className={`flex-1 rounded-lg border-2 p-2 text-[10px] font-bold text-center whitespace-pre-line flex items-center justify-center ${s.on ? 'border-sky-500 bg-sky-500 text-white' : 'border-sky-300 bg-white text-sky-900'}`}>
                    {s.t}{s.on && ' ◀ 지금'}
                  </div>
                </React.Fragment>
              ))}
            </div>
            <div className="mt-2 text-[10px] text-sky-900 leading-snug">
              BM25는 "단어 일치"의 왕. 하지만 "노트북≈랩탑", "빠르다≈신속하다" 같은 <b>의미</b>는 모른다.
              동의어·문맥·의도를 잡으려면 단어를 벡터로 바꾸는 <b>임베딩·벡터 검색</b>(Part Ⅲ)으로.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 단계별 패널 스위칭 (k1·b 상태 공유)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ state, k1, setK1, b, setB }) {
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>🏆</span>
              <span>BM25 랭킹 해부</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.query && (
            <div className="mb-2 flex items-center gap-2 px-2 py-1 rounded border border-sky-200 bg-sky-50">
              <span className="text-xs">🔎</span>
              <span className="text-[11px] font-mono text-sky-800">검색어: "{state.query}" · 코퍼스 N={N}, df={DF}, avgdl={AVGDL}</span>
            </div>
          )}
          {state.pane === 'holes' && <TfIdfHoles />}
          {state.pane === 'saturation' && <SaturationCurve k1={k1} setK1={setK1} />}
          {state.pane === 'length' && <LengthGauge k1={k1} b={b} setB={setB} />}
          {state.pane === 'fullcalc' && <FullCalcTable k1={k1} b={b} />}
          {state.pane === 'tuning' && <TuningPane />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [k1, setK1] = useState(1.2);       // 좌측 슬라이더 공유 상태
      const [b, setB] = useState(0.75);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">II-1-2. BM25 — 표준 랭킹 함수 해부</h1>
                <p className="text-sm text-sky-800/80">Elasticsearch·OpenSearch·Lucene의 기본값 — TF-IDF의 두 구멍을 메운 25번째 시도</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} k1={k1} setK1={setK1} b={b} setB={setB} />
              <CodeViewer code={CODES[stepIdx]} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 슬라이더로 k1·b 직접 조절</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                BM25는 TF-IDF의 두 구멍을 두 파라미터로 메운다 — k1으로 TF를 포화시켜(빈도의 한계효용 체감, 상한 k1+1) 반복 스팸을 막고,
                b로 문서 길이를 정규화해(계수 1−b+b·|D|/avgdl) 장황한 긴 문서의 겉보기 우위를 회수한다.
                그 결과 TF-IDF에서 길이만으로 1위였던 장문이 BM25에서는 최하위로 내려가고, 밀도 높게 관련된 문서가 위로 올라온다.
                기본값 k1=1.2·b=0.75는 대개 최선이며, 짧은 필드나 특수 도메인에서만 조정하고 필드 가중은 BM25F로 푼다.
                그러나 BM25는 단어 일치를 세는 렉시컬의 왕일 뿐 의미(동의어·문맥)는 모른다 — 다음 Part Ⅲ에서 벡터 검색으로 그 벽을 넘는다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['BM25', 'TF포화', 'k1파라미터', 'b파라미터', '길이정규화', 'IDF', '랭킹함수', 'Elasticsearch', 'explainAPI', 'BM25F', '렉시컬검색', '벡터검색예고'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-3.html" className="underline hover:no-underline">다음: II-1-3 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
