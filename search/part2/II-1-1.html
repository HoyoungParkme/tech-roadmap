  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Search II-1-1 — TF-IDF 계산 시각화
    학습 목표: 매칭 여부(불리언)만으로는 랭킹을 못 매긴다는 문제에서 출발해,
              TF(단어 빈도) → IDF(역문서 빈도) → TF×IDF 합성으로 문서 3개의
              관련도 점수를 직접 손계산하고, 순위가 매겨지는 순간을 본다.
              마지막으로 TF-IDF의 유산(키워드 추출·유사 문서)과 한계(TF 포화 없음)를
              짚어 다음 장 BM25로 연결한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 코퍼스·TF막대·IDF게이지·점수표·순위) / 우(VSCode CodeViewer: tfidf_demo.py)
    색상: sky/blue (search 도메인)

    핵심 수치 (질의 "노트북 추천", 문서 3개, TF=count/docLen, IDF=ln(N/df)):
      df(노트북)=2 → IDF=ln(3/2)=0.405   df(추천)=3 → IDF=ln(3/3)=0.000
      D1 노트북2회 TF0.4 → 0.4*0.405 = 0.162 (1위)
      D2 노트북1회 TF0.2 → 0.2*0.405 = 0.081 (2위)
      D3 노트북0회 TF0.0 → 0.000            (3위)
      '추천' 은 모든 문서에 있어 IDF 0 → 순위에 기여 0
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 공통 코퍼스 — 문서 3개 (좌측 전 단계 공유). token = 공백 분리 단어
    //   질의 "노트북 추천" 의 단어는 형광 표시된다.
    // ─────────────────────────────────────────────────────
    const QUERY_TERMS = ['노트북', '추천'];
    const DOCS = [
      { id: 'D1', title: '가벼운 노트북 추천 블로그', tokens: ['노트북', '가벼운', '노트북', '추천', '가성비'] },
      { id: 'D2', title: '게이밍 노트북 리뷰',        tokens: ['게이밍', '노트북', '성능', '그래픽', '추천'] },
      { id: 'D3', title: '사무용 데스크탑 조립기',     tokens: ['사무용', '데스크탑', '조립', '견적', '추천'] },
    ];

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 랭킹의 필요 → TF → IDF → TF×IDF 합성 → 유산과 한계
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };


    const S1 = {
      title: "Step 1. 랭킹의 필요 — 매칭됐다, 그런데 어떤 순서로?",
      desc: "\"노트북 추천\"으로 검색하면 역색인이 후보 문서 1000건을 순식간에 골라 준다. 하지만 사용자 화면에는 상위 10건만 들어간다 — 어떤 순서로 보여줄 것인가? 매칭 여부(불리언)는 \"포함한다/안 한다\"만 알 뿐, 세 문서가 다 \"노트북\"을 담고 있으면 셋 다 참이라 우열을 못 가린다. 그래서 \"더 관련 있는\" 문서를 수치(점수)로 바꿔야 한다. 직관 후보가 여럿 떠오른다 — 단어가 많이 나온 문서? 최신 문서? 짧은 문서? 이 중 \"많이 나올수록 그 문서의 주제일 것\"이라는 직관이 가장 그럴듯한데, 그대로 쓰면 함정에 빠진다. 그 함정을 다음 단계부터 하나씩 고쳐 나간다.",
    };
    const S2 = {
      title: "Step 2. TF (단어 빈도) — 많이 나오면 그 문서의 주제다",

      '"""',
      '',
      'import math',
      'from collections import Counter',
      '',
      '# 문서 3개짜리 작은 코퍼스 (좌측 시각화와 동일)',
      'CORPUS = [',
      '    "노트북 가벼운 노트북 추천 가성비",   # D1',
      '    "게이밍 노트북 성능 그래픽 추천",      # D2',
      '    "사무용 데스크탑 조립 견적 추천",      # D3',
      ']',
      'QUERY = "노트북 추천"',
      '',
      '',
      'def tokenize(text: str) -> list[str]:',
      '    """공백 기준 토큰화 (실무에선 형태소 분석기 사용)."""',
      '    return text.split()',
      '',
      '',
      'def term_freq(tokens: list[str]) -> dict[str, float]:',
      '    """TF = 단어 등장 횟수 / 문서 전체 단어 수 (길이 정규화)."""',
      '    counts = Counter(tokens)',
      '    total = len(tokens)',
      '    return {w: c / total for w, c in counts.items()}',
      '',
      '',
      'def inverse_doc_freq(docs: list[list[str]]) -> dict[str, float]:',
      '    """IDF = ln(N / df). 모든 문서에 나오면 0 에 수렴."""',
      '    n = len(docs)',
      '    df = Counter()',
      '    for tokens in docs:',
      '        for w in set(tokens):      # 문서당 1번만 센다',
      '            df[w] += 1',
      '    return {w: math.log(n / d) for w, d in df.items()}',
      '',

      'tfs = [term_freq(t) for t in docs_tokens]   # 문서별 TF',

      '',
      'ranked = sorted(range(len(CORPUS)),',
      '                key=lambda i: score(QUERY, tfs[i], idf),',
      '                reverse=True)',
      'for r, i in enumerate(ranked, 1):',
      '    print(f"{r}위 D{i+1} 점수={score(QUERY, tfs[i], idf):.3f}")',
      '#  1위 D1 점수=0.162   (노트북 2회 → TF 최고)',
      '#  2위 D2 점수=0.081   (노트북 1회)',
      '#  3위 D3 점수=0.000   (노트북 없음, "추천" 은 IDF 0)',
      '',
      '# ── 실무: sklearn 이 위 과정을 한 줄로 (스케일만 다름) ──',
      'from sklearn.feature_extraction.text import TfidfVectorizer',
      'from sklearn.metrics.pairwise import cosine_similarity',
      '',
      'vec = TfidfVectorizer()',
      'X = vec.fit_transform(CORPUS)        # 문서 × 단어 TF-IDF 행렬',
      'q = vec.transform([QUERY])           # 질의도 같은 벡터 공간으로',
      '',
      '# 벡터 공간 모델: 방향의 닮음 = 코사인 유사도',
      'sims = cosine_similarity(q, X).ravel()',
      'print(sims.argsort()[::-1])          # → [0 1 2] = D1 > D2 > D3',
      '#  순수 파이썬 순위와 동일하다.',
      '',
      '# ── 한계: TF 포화가 없다 (BM25 가 푸는 문제) ──',
      'spam = "노트북 " * 100 + "추천"       # 노트북 100번 반복',
      '#  TF-IDF 는 점수가 거의 100배로 폭증 → 반복 스팸에 취약.',
      '#  → 다음 장 BM25: TF 를 포화시키고 문서 길이를 보정한다.',
    ];

    // ─────────────────────────────────────────────────────
    // 코퍼스 문서 카드 — 질의 단어는 형광 표시
    // ─────────────────────────────────────────────────────
    function Token({ w }) {
      const isQ = QUERY_TERMS.includes(w);
      return (
        <span className={`inline-block px-1 rounded text-[11px] mr-0.5 ${isQ ? 'bg-amber-200 text-amber-900 font-bold' : 'text-slate-600'}`}>
          {w}
        </span>
      );
    }
    function CorpusDocs({ matched }) {
      return (
        <div className="space-y-1.5">
          {DOCS.map((d) => (
            <div key={d.id} className="rounded border border-sky-200 bg-sky-50 px-2 py-1.5">
              <div className="flex items-center gap-2 mb-0.5">
                <span className="text-[10px] font-bold text-white bg-sky-600 rounded px-1.5 py-0.5">{d.id}</span>
                <span className="text-[11px] font-bold text-slate-800">{d.title}</span>
                {matched && <span className="ml-auto text-[9px] font-bold text-sky-700 bg-white/70 border border-sky-300 rounded px-1.5 py-0.5">✓ 매칭</span>}
              </div>
              <div className="flex flex-wrap">
                {d.tokens.map((t, i) => <Token key={i} w={t} />)}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 직관 후보 카드
    // ─────────────────────────────────────────────────────
    const INTUITION_TONE = {
      no:    'border-red-300 bg-red-50 text-red-900',
      maybe: 'border-sky-300 bg-sky-50 text-sky-900',
    };
    function IntuitionCards({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🤔 {box.title}</div>
          <div className="grid grid-cols-2 gap-2">
            {box.items.map((it, i) => (
              <div key={i} className={`rounded border-2 p-2 ${INTUITION_TONE[it.kind]}`}>
                <div className="text-[11px] font-bold mb-0.5">{it.icon} {it.head}</div>
                <div className="text-[10px] leading-snug">{it.body}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — TF 막대 (문서별 단어 빈도)
    // ─────────────────────────────────────────────────────
    function TFBars({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">📊 {box.title}</div>
          <div className="space-y-2">
            {box.rows.map((r) => (
              <div key={r.id} className="flex items-center gap-2">
                <span className="text-[10px] font-bold text-white bg-sky-600 rounded px-1.5 py-0.5 w-8 text-center">{r.id}</span>
                <div className="flex-1 h-5 rounded bg-sky-100 overflow-hidden relative">
                  <div className="h-full bg-sky-500 transition-all duration-700" style={{ width: `${r.tf * 100 / 0.4 * 0.95 + 2}%` }} />
                  <span className="absolute inset-0 flex items-center pl-2 text-[10px] font-mono text-slate-700">
                    {r.count}/{r.total} = TF {r.tf.toFixed(1)}
                  </span>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-slate-600">D1은 5단어 중 "노트북"이 2번(0.4)으로 가장 잦다. D3은 아예 없어 0.0.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — IDF 표 (단어별 게이지)
    // ─────────────────────────────────────────────────────
    const IDF_TONE = {
      rare: 'text-emerald-700',
      mid:  'text-sky-700',
      zero: 'text-red-700',
    };
    const IDF_BAR = {
      rare: 'bg-emerald-500',
      mid:  'bg-sky-500',
      zero: 'bg-red-400',
    };
    function IDFTable({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">⚖️ {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b border-sky-200">
                <th className="text-left py-0.5">단어</th>
                <th className="text-center py-0.5">df</th>
                <th className="text-left py-0.5 pl-2 w-1/2">IDF = ln(3/df)</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.term} className="border-t border-sky-100 align-middle">
                  <td className="py-1 font-bold text-slate-800">{r.term}</td>
                  <td className="py-1 text-center font-mono">{r.df}</td>
                  <td className="py-1 pl-2">
                    <div className="flex items-center gap-1.5">
                      <div className="w-16 h-2 rounded-full bg-sky-100 overflow-hidden">
                        <div className={`h-full ${IDF_BAR[r.kind]}`} style={{ width: `${r.idf / box.maxIdf * 100}%` }} />
                      </div>
                      <span className={`font-mono font-bold ${IDF_TONE[r.kind]}`}>{r.idf.toFixed(3)}</span>
                      <span className="text-slate-500 truncate">{r.note}</span>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 text-[10px] text-red-800">"추천"은 3개 문서 모두에 있어 df=3 → ln(3/3)=0. 순위에 한 톨도 기여하지 못한다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — TF×IDF 점수표 + 순위
    // ─────────────────────────────────────────────────────
    function ScoreTable({ box }) {
      if (!box) return null;
      const ranked = [...box.rows].sort((a, b) => b.sum - a.sum);
      const maxSum = Math.max(...box.rows.map((r) => r.sum), 0.001);
      return (
        <div className="mt-3 space-y-3">
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3 overflow-x-auto">
            <div className="text-xs font-bold text-sky-900 mb-1">🧮 문서 점수 = Σ TF × IDF</div>
            <div className="text-[10px] text-slate-600 mb-2 font-mono">IDF(노트북)={box.idf['노트북'].toFixed(3)} · IDF(추천)={box.idf['추천'].toFixed(3)}</div>
            <table className="w-full text-[10px] whitespace-nowrap">
              <thead>
                <tr className="text-sky-900 border-b border-sky-200">
                  <th className="text-left py-0.5">문서</th>
                  <th className="text-right py-0.5 px-1">TF·노트북</th>
                  <th className="text-right py-0.5 px-1 text-sky-700">×IDF</th>
                  <th className="text-right py-0.5 px-1">TF·추천</th>
                  <th className="text-right py-0.5 px-1 text-red-600">×IDF(0)</th>
                  <th className="text-right py-0.5 px-1 font-bold">합계</th>
                </tr>
              </thead>
              <tbody className="font-mono">
                {box.rows.map((r) => (
                  <tr key={r.id} className="border-t border-sky-100">
                    <td className="py-1 font-bold text-slate-800">{r.id}</td>
                    <td className="py-1 px-1 text-right">{r.tfN.toFixed(1)}</td>
                    <td className="py-1 px-1 text-right text-sky-700 font-bold">{r.cN.toFixed(3)}</td>
                    <td className="py-1 px-1 text-right text-slate-500">{r.tfR.toFixed(1)}</td>
                    <td className="py-1 px-1 text-right text-red-500">{r.cR.toFixed(3)}</td>
                    <td className="py-1 px-1 text-right font-bold text-sky-900">{r.sum.toFixed(3)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-blue-50 p-3">
            <div className="text-xs font-bold text-sky-900 mb-2">🏆 최종 순위 (점수 내림차순)</div>
            <div className="space-y-1.5">
              {ranked.map((r, i) => (
                <div key={r.id} className="flex items-center gap-2">
                  <span className="text-sm font-bold text-sky-800 w-6">{i + 1}위</span>
                  <span className="text-[10px] font-bold text-white bg-sky-600 rounded px-1.5 py-0.5 w-8 text-center">{r.id}</span>
                  <div className="flex-1 h-4 rounded bg-sky-100 overflow-hidden">
                    <div className="h-full bg-sky-500 transition-all duration-700" style={{ width: `${r.sum / maxSum * 96 + 4}%` }} />
                  </div>
                  <span className="font-mono text-[11px] font-bold text-sky-900 w-12 text-right">{r.sum.toFixed(3)}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[10px] text-sky-900">"추천"은 기여 0이라 순위는 순전히 "노트북" 빈도가 결정 — 2번 쓴 D1이 이긴다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 유산/한계 카드 + 로드맵
    // ─────────────────────────────────────────────────────
    function LegacyCards({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🧭 {box.title}</div>
          <div className="text-[10px] font-bold text-emerald-800 mb-1">지금도 쓰인다</div>
          <div className="grid grid-cols-2 gap-2 mb-2">
            {box.uses.map((it, i) => (
              <div key={i} className="rounded border-2 border-emerald-300 bg-emerald-50 text-emerald-900 p-2">
                <div className="text-[11px] font-bold mb-0.5">{it.icon} {it.head}</div>
                <div className="text-[10px] leading-snug">{it.body}</div>
              </div>
            ))}
          </div>
          <div className="text-[10px] font-bold text-red-800 mb-1">한계 (BM25 가 푼다)</div>
          <div className="grid grid-cols-2 gap-2">
            {box.limits.map((it, i) => (
              <div key={i} className="rounded border-2 border-red-300 bg-red-50 text-red-900 p-2">
                <div className="text-[11px] font-bold mb-0.5">{it.icon} {it.head}</div>
                <div className="text-[10px] leading-snug">{it.body}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function RoadmapBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">🗺️ {box.title}</div>
          <div className="flex items-stretch gap-1">
            {box.steps.map((s, i) => (
              <React.Fragment key={i}>
                {i > 0 && <div className="flex items-center text-sky-500 text-lg">→</div>}
                <div className="flex-1 rounded-lg border-2 border-sky-300 bg-white p-2 text-[10px] font-bold text-sky-900 text-center whitespace-pre-line flex items-center justify-center">
                  {s}
                </div>
              </React.Fragment>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-sky-900 leading-snug">{box.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — TF-IDF 계산 시뮬레이션 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      rank:   { icon: '📚', label: '랭킹의 필요' },
      tf:     { icon: '📊', label: 'TF 계산' },
      idf:    { icon: '⚖️', label: 'IDF 계산' },
      score:  { icon: '🏆', label: 'TF×IDF 합성' },
      legacy: { icon: '🧭', label: '유산과 한계' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.rank;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>관련도 점수 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="mb-2 flex items-center gap-2 px-2 py-1 rounded border border-sky-200 bg-sky-50">
            <span className="text-xs">🔎</span>
            <span className="text-[11px] font-mono text-sky-800">질의: "{QUERY_TERMS.join(' ')}"</span>
          </div>
          <div className="text-[10px] text-sky-700 font-mono mb-2 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            방식: {state.engineDetail}
          </div>
          {state.showDocs && <CorpusDocs matched={state.matched} />}
          <IntuitionCards box={state.intuitions} />
          <TFBars box={state.tfBars} />
          <IDFTable box={state.idfTable} />
          <ScoreTable box={state.scoreTable} />
          <LegacyCards box={state.legacyCards} />
          <RoadmapBox box={state.roadmapBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ lines, lang, filename, highlight, stepIdx, total }) {
      const highlightSet = new Set(highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(lines.join('\n'), { language: lang }).value;
          const split = html.split('\n');
          return lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [lines, lang]);

      // 현재 단계 첫 하이라이트 줄로 자동 스크롤
      const boxRef = useRef(null);
      useEffect(() => {
        if (!boxRef.current || !highlight || highlight.length === 0) return;
        const el = boxRef.current.querySelector('[data-hi="1"]');
        if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }, [highlight]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{lang}</span>
          </div>
          <div ref={boxRef} className="flex-1 overflow-auto p-3 text-xs font-mono leading-5" style={{ maxHeight: '68vh' }}>
            <div className={`text-slate-200 language-${lang}`}>
              {lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                const firstHi = isHi && lineNo === Math.min(...highlight);
                return (
                  <div
                    key={i}
                    data-hi={firstHi ? '1' : undefined}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">II-1-1. TF-IDF 계산 시각화</h1>
                <p className="text-sm text-sky-800/80">"많이 나오면 중요한데, 어디서나 나오면 안 중요하다" — 관련도 점수의 첫 번째 답</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer
                lines={CODE_LINES}
                lang="python"
                filename="tfidf_demo.py"
                highlight={step.codeHighlight}
                stepIdx={stepIdx}
                total={STEPS.length}
              />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                TF-IDF는 관련도에 점수를 매기는 첫 번째 답이다. TF(문서 안 빈도, 많이 나오면 주제)와 IDF(코퍼스 희귀도, log(N/df), 어디서나 나오면 0)를 곱해 단어 가중치를 만들고,
                질의 단어들의 TF×IDF를 더해 문서 점수를 낸다. 이 코퍼스에서 "추천"은 모든 문서에 있어 IDF=0으로 무력화되고, "노트북"을 2번 쓴 D1이 1위가 된다.
                지금도 키워드 추출·유사 문서에 쓰이지만, TF 포화가 없어 반복 스팸에 약하고 문서 길이 보정이 거칠다.
                다음 장 BM25가 바로 이 둘(TF 포화·길이 정규화)을 고친 렉시컬 검색의 표준이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['TF', 'IDF', 'TF-IDF', '단어빈도', '역문서빈도', '관련도점수', '벡터공간모델', '코사인유사도', 'TfidfVectorizer', 'TF포화', 'BM25'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 (BM25) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
