  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Search II-2-2 — 오타·동의어·자동완성
    학습 목표: 불완전 질의("삼송"·"랩탑"·미완성 "노트")를 fuzzy / synonym filter /
              edge n-gram·completion 으로 구제하고, 셋을 하나의 파이프라인으로 배치한다.
    패턴: fastapi v1 — 좌 LiveDataPane / 우 CodeViewer(typo_synonym.py · suggest_settings.json)
    색상: sky/blue (search 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 — 오타(fuzzy) → 동의어 → 자동완성(edge n-gram) → 제안/교정 → 종합 파이프라인
    //   각 STEP = { title, desc, engine, ...전용 시각화 데이터(단계별 하나씩), alert, code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      fuzzy: {lang: "python", filename: "typo_synonym.py — (1) 편집거리 & fuzzy", lines: [
        "\"\"\"",
        "typo_synonym.py — 오타/동의어/자동완성을 한 파일에서 실험.",
        "(1) 편집거리(Levenshtein) 를 직접 구현해 fuzzy 의 원리를 본다.",
        "\"\"\"",
        "from elasticsearch import Elasticsearch",
        "",
        "",
        "def edit_distance(a: str, b: str) -> int:",
        "    \"\"\"a→b 로 바꾸는 최소 편집(치환·삽입·삭제) 횟수. DP O(len(a)*len(b)).\"\"\"",
        "    dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]",
        "    for i in range(len(a) + 1):",
        "        dp[i][0] = i          # a 를 다 지우면 i 회 삭제",
        "    for j in range(len(b) + 1):",
        "        dp[0][j] = j          # 빈 문자열에 b 를 다 넣으면 j 회 삽입",
        "    for i in range(1, len(a) + 1):",
        "        for j in range(1, len(b) + 1):",
        "            cost = 0 if a[i - 1] == b[j - 1] else 1",
        "            dp[i][j] = min(",
        "                dp[i - 1][j] + 1,        # 삭제",
        "                dp[i][j - 1] + 1,        # 삽입",
        "                dp[i - 1][j - 1] + cost, # 치환(같으면 0)",
        "            )",
        "    return dp[-1][-1]",
        "",
        "",
        "print(edit_distance(\"삼송\", \"삼성\"))   # 1  (송→성 치환)",
        "print(edit_distance(\"labtop\", \"laptop\"))  # 2  (b↔p 위치)",
        "",
        "# ── Elasticsearch fuzzy 쿼리: 편집거리를 엔진이 대신 계산 ──",
        "es = Elasticsearch(\"http://localhost:9200\")",
        "es.search(index=\"products\", query={",
        "    \"match\": {",
        "        \"name\": {",
        "            \"query\": \"삼송 노트북\",",
        "            \"fuzziness\": \"AUTO\",   # 길이별 자동 허용(0/1/2)",
        "            \"prefix_length\": 1,    # 첫 글자는 오타 불허 → 정밀도↑",
        "        }",
        "    }",
        "})",
        "# prefix_length 로 첫 글자를 고정하면 후보가 급감해 성능·정밀도 둘 다 이득.",
      ]},
      synonym: {lang: "python", filename: "typo_synonym.py — (2) 동의어 확장", lines: [
        "# ── (2) 동의어: 같은 뜻 다른 말을 한 그룹으로 확장 ──",
        "#",
        "# 순수 파이썬으로 \"검색 시 확장\" 의 원리를 흉내 낸다.",
        "SYNONYMS = {",
        "    \"노트북\": {\"노트북\", \"랩탑\", \"laptop\"},",
        "    \"랩탑\":   {\"노트북\", \"랩탑\", \"laptop\"},",
        "    \"laptop\": {\"노트북\", \"랩탑\", \"laptop\"},",
        "}",
        "",
        "",
        "def expand_query(term: str) -> set[str]:",
        "    \"\"\"검색 시 확장: 질의어를 동의어 그룹 전체로 넓힌다.\"\"\"",
        "    return SYNONYMS.get(term, {term})",
        "",
        "",
        "print(expand_query(\"랩탑\"))",
        "#  → {\"노트북\", \"랩탑\", \"laptop\"}  → 셋 중 하나라도 있으면 매칭",
        "",
        "# ── Elasticsearch: 검색 시 확장용 analyzer ──",
        "settings = {",
        "  \"settings\": {\"analysis\": {",

    // ─────────────────────────────────────────────────────
    // Step 1 — 편집거리 DP 행렬 (실계산 애니메이션: 셀이 순차 점등)
    // ─────────────────────────────────────────────────────
    function EditMatrix({ box }) {
      const src = box ? box.source : '', tgt = box ? box.target : '';
      const cells = (src.length + 1) * (tgt.length + 1);
      const [lit, setLit] = useState(0);
      useEffect(() => {
        setLit(0);
        const t = setInterval(() => {
          setLit((n) => (n >= cells ? n : n + 1));
        }, 140);
        return () => clearInterval(t);
      }, [box && box.source, box && box.target]);
      // 훅은 early return 보다 위에 있어야 한다. 아래로 두면 이 컴포넌트가 처음
      // 등장하는 스텝에서 훅 개수가 늘어 React 가 트리를 통째로 버린다.
      if (!box) return null;
      const idx = (i, j) => i * (tgt.length + 1) + j + 1; // 점등 순서(행 우선)
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🧮 편집 거리 행렬 — "{src}" → "{tgt}"</div>
          <table className="mx-auto text-[11px] font-mono border-collapse">
            <tbody>
              <tr>
                <td className="w-7 h-7"></td>
                <td className="w-7 h-7 text-center text-slate-400">ε</td>
                {tgt.split('').map((c, j) => (
                  <td key={j} className="w-7 h-7 text-center font-bold text-sky-700">{c}</td>
                ))}
              </tr>
              {box.grid.map((rowArr, i) => (
                <tr key={i}>
                  <td className="w-7 h-7 text-center font-bold text-sky-700">{i === 0 ? 'ε' : src[i - 1]}</td>
                  {rowArr.map((val, j) => {
                    const on = lit >= idx(i, j);
                    const isFinal = i === src.length && j === tgt.length;
                    return (
                      <td key={j} className="p-0.5">
                        <div className={`w-7 h-7 flex items-center justify-center rounded border transition-all duration-200
                          ${on ? (isFinal ? 'bg-sky-600 text-white border-sky-700 font-bold scale-110' : 'bg-sky-50 border-sky-300 text-sky-900') : 'bg-slate-50 border-slate-200 text-transparent'}`}>
                          {val}
                        </div>
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
          <div className="mt-2 text-center text-[11px]">
            <span className="text-slate-600">우하단 셀 = 최종 편집거리 </span>
            <span className="font-bold text-sky-700">{box.distance}</span>
            <span className="text-slate-600"> · {box.op}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — fuzziness AUTO 길이별 규칙 표
    // ─────────────────────────────────────────────────────
    const TONE_BADGE = {
      good:   'bg-emerald-100 text-emerald-800 border-emerald-300',
      danger: 'bg-red-100 text-red-800 border-red-300',
    };
    function FuzzTable({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">📐 {box.title}</div>
          <table className="w-full text-[10px]">
            <thead>
              <tr className="text-sky-900 border-b border-sky-200">
                <th className="text-left py-0.5">단어 길이</th>
                <th className="text-left py-0.5 pl-2">예</th>
                <th className="text-center py-0.5">허용 편집</th>
                <th className="text-left py-0.5 pl-2">이유</th>
              </tr>
            </thead>
            <tbody>
              {box.rows.map((r) => (
                <tr key={r.len} className="border-t border-sky-100 align-top">
                  <td className="py-1 font-bold text-sky-900">{r.len}</td>
                  <td className="py-1 pl-2 font-mono text-slate-700">{r.ex}</td>
                  <td className="py-1 text-center">
                    <span className={`px-1.5 py-0.5 rounded border font-bold ${TONE_BADGE[r.tone]}`}>{r.maxEdit}</span>
                  </td>
                  <td className="py-1 pl-2 text-slate-700">{r.why}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 동의어 확장: 색인 시 vs 검색 시 비교
    // ─────────────────────────────────────────────────────
    function SynonymBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">🔀 {box.title}</div>
          <div className="flex items-center justify-center gap-1.5 mb-3 flex-wrap">
            {box.group.map((g, i) => (
              <React.Fragment key={g}>
                {i > 0 && <span className="text-sky-400 text-xs">↔</span>}
                <span className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-300 text-[11px] font-mono font-bold">{g}</span>
              </React.Fragment>
            ))}
          </div>
          <div className="grid grid-cols-2 gap-2">
            {box.cards.map((c) => (
              <div key={c.kind} className={`rounded border-2 p-2 ${c.tone}`}>
                <div className="text-[11px] font-bold mb-1">{c.icon} {c.head}</div>
                <div className="space-y-0.5">
                  {c.pros.map((p, i) => <div key={i} className="text-[9px]">✓ {p}</div>)}
                  {c.cons.map((p, i) => <div key={i} className="text-[9px] opacity-70">✗ {p}</div>)}
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-emerald-800 font-bold bg-emerald-50 border border-emerald-200 rounded px-2 py-1">
            ◎ {box.verdict}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — edge n-gram 토큰 생성 시각화
    // ─────────────────────────────────────────────────────
    function NgramBox({ box }) {
      const [shown, setShown] = useState(0);
      useEffect(() => {
        if (!box) return;
        setShown(0);
        const t = setInterval(() => setShown((n) => (n >= box.tokens.length ? n : n + 1)), 500);
        return () => clearInterval(t);
      }, [box && box.word]);
      // 훅은 early return 보다 위에 있어야 한다. 아래로 두면 이 컴포넌트가 처음
      // 등장하는 스텝에서 훅 개수가 늘어 React 가 트리를 통째로 버린다.
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">⌨️ {box.title}</div>
          <div className="text-center text-[11px] text-slate-600 mb-1">색인 대상 단어</div>
          <div className="text-center mb-2">
            <span className="px-2 py-0.5 rounded bg-sky-600 text-white font-mono font-bold text-sm">{box.word}</span>
          </div>
          <div className="text-center text-[10px] text-slate-500 mb-1">↓ 앞에서부터 잘라 접두사 토큰 생성</div>
          <div className="flex items-center justify-center gap-1.5 flex-wrap mb-2">
            {box.tokens.map((t, i) => {
              const on = shown > i;
              const isMatch = t === box.matched;
              return (
                <span key={t}
                  className={`px-2 py-0.5 rounded border font-mono text-[11px] font-bold transition-all duration-300
                    ${on ? (isMatch ? 'bg-emerald-100 border-emerald-400 text-emerald-800 scale-110' : 'bg-sky-50 border-sky-300 text-sky-800') : 'opacity-0'}`}>
                  {t}{isMatch && on ? ' ✓' : ''}
                </span>
              );
            })}
          </div>
          <div className="text-center text-[10px] text-emerald-800 mb-2">
            사용자가 "<span className="font-mono font-bold">{box.typed}</span>" 입력 → 토큰 "<span className="font-mono font-bold">{box.matched}</span>" 와 정확 일치(초고속)
          </div>
          <div className="text-[10px] text-amber-900 bg-amber-50 border border-amber-200 rounded px-2 py-1 mb-1">💾 {box.costNote}</div>
          <div className="text-[10px] text-red-900 bg-red-50 border border-red-200 rounded px-2 py-1">🚨 {box.rule}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — completion / term / popular suggester 비교
    // ─────────────────────────────────────────────────────
    function SuggestBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-sky-300 bg-white p-3">
          <div className="text-xs font-bold text-sky-900 mb-2">💡 {box.title}</div>
          <div className="space-y-2">
            {box.cards.map((c) => (
              <div key={c.head} className={`rounded border-2 p-2 ${c.tone}`}>
                <div className="flex items-baseline justify-between">
                  <span className="text-[11px] font-bold">{c.icon} {c.head}</span>
                  <span className="text-[9px] opacity-70">{c.sub}</span>
                </div>
                <div className="text-[10px] leading-snug mt-0.5">{c.body}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-emerald-800 font-bold bg-emerald-50 border border-emerald-200 rounded px-2 py-1">
            👑 {box.verdict}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 파이프라인 배치도 + 0건 폴백 + 못 잡는 벽
    // ─────────────────────────────────────────────────────
    function PipelineBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-sky-500 bg-gradient-to-br from-sky-50 to-indigo-50 p-3">
          <div className="text-sm font-bold text-sky-900 mb-2">🧩 {box.title}</div>
          <div className="flex items-stretch gap-1">
            {box.stages.map((s, i) => (
              <React.Fragment key={i}>
                {i > 0 && <div className="flex items-center text-sky-500 text-lg">→</div>}
                <div className="flex-1 rounded-lg border-2 border-sky-300 bg-white p-2 text-center">
                  <div className="text-[9px] text-slate-500 mb-0.5">{s.when}</div>
                  <div className="text-[11px] font-bold text-sky-900">{s.icon} {s.tool}</div>
                  <div className="text-[9px] text-slate-600 mt-0.5 font-mono">{s.how}</div>
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    function FallbackBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
          <div className="text-xs font-bold text-amber-900 mb-2">🪜 {box.title}</div>
          <div className="space-y-1">
            {box.steps.map((s) => (
              <div key={s.n} className="flex items-center gap-2 text-[10px]">
                <span className="w-5 h-5 shrink-0 flex items-center justify-center rounded-full bg-amber-500 text-white font-bold">{s.n}</span>
                <span className="w-24 shrink-0 font-bold text-amber-900">{s.label}</span>
                <span className="flex-1 text-slate-700">{s.detail}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function WallBox({ box }) {
      if (!box) return null;
      return (
        <div className="mt-3 rounded-lg border-2 border-violet-400 bg-violet-50 p-3">
          <div className="text-xs font-bold text-violet-900 mb-2">🧱 {box.title}</div>
          <div className="flex items-center justify-center gap-2 mb-2">
            <span className="px-2 py-1 rounded bg-white border-2 border-violet-300 font-mono font-bold text-violet-900 text-[11px]">{box.left}</span>
            <span className="text-violet-400 text-lg">≈?</span>
            <span className="px-2 py-1 rounded bg-white border-2 border-violet-300 font-mono font-bold text-violet-900 text-[11px]">{box.right}</span>
          </div>
          <div className="text-[10px] text-violet-900 mb-1">{box.why}</div>
          <div className="text-[10px] text-violet-800 font-bold bg-white border border-violet-200 rounded px-2 py-1">➡️ {box.next}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-sky-50',     border: 'border-sky-300',     text: 'text-sky-900',     icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — 불완전 질의 구제 시뮬레이션 (sky/blue 톤)
    // ─────────────────────────────────────────────────────
    const ENGINE_BADGE = {
      fuzzy:    { icon: '✏️', label: '오타 · fuzzy' },
      synonym:  { icon: '🔀', label: '동의어 확장' },
      ngram:    { icon: '⌨️', label: '자동완성 · edge n-gram' },
      suggest:  { icon: '💡', label: '제안 · 교정' },
      pipeline: { icon: '🧩', label: '종합 파이프라인' },
    };

    function LiveDataPane({ beat, state }) {
      const eng = ENGINE_BADGE[state.engine] || ENGINE_BADGE.fuzzy;
      return (
        <div className="rounded-xl border border-sky-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-sky-900 flex items-center gap-1.5">
              <span>{eng.icon}</span>
              <span>불완전 질의 구제 — {eng.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          {state.query && (
            <div className="mb-2 flex items-center gap-2 px-2 py-1 rounded border border-sky-200 bg-sky-50">
              <span className="text-xs">🔎</span>
              <span className="text-[11px] font-mono text-sky-800">사용자 입력: "{state.query}"</span>
            </div>
          )}
          <div className="text-[10px] text-sky-700 font-mono mb-1 px-2 py-1 rounded bg-sky-50 border border-sky-200">
            방식: {state.engineDetail}
          </div>
          <EditMatrix box={state.editMatrix} />
          <FuzzTable box={state.fuzzTable} />
          <SynonymBox box={state.synonymBox} />
          <NgramBox box={state.ngramBox} />
          <SuggestBox box={state.suggestBox} />
          <PipelineBox box={state.pipelineBox} />
          <FallbackBox box={state.fallbackBox} />
          <WallBox box={state.wallBox} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-sky-400/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-sky-50 to-blue-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-14 h-10 rounded-lg bg-sky-600 text-white font-bold text-sm">Search</span>
              <div>
                <h1 className="text-2xl font-bold text-sky-900">II-2-2. 오타·동의어·자동완성</h1>
                <p className="text-sm text-sky-800/80">사용자는 완벽하게 입력하지 않는다 — 불완전한 질의를 구하는 세 가지 장치</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-sky-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-sky-500' : 'bg-sky-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-sky-800 text-sky-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-sky-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-sky-800 text-white' : 'bg-sky-600 text-white hover:bg-sky-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-sky-400 bg-white text-sky-800 hover:bg-sky-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-sky-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-sky-500 bg-white px-4 py-3 text-sm text-sky-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                오타는 편집거리 기반 fuzzy(AUTO 가 길이별로 관대함을 조절 — 짧은 단어의 남용은 정밀도 붕괴),
                동의어는 synonym filter(재색인 없는 검색 시 확장이 실무 기본값),
                자동완성은 edge n-gram·completion suggester(색인 크기를 대가로 초고속 접두사 매칭)로 구한다.
                셋은 시점이 다른 협력이다 — 입력 중 자동완성 → 실행 시 동의어 확장 → 0건 시 오타 교정 폴백(단계적 완화).
                그리고 인기 질의 로그가 모든 제안의 품질을 끌어올린다(V-2-1 복선).
                하지만 "축구화↔풋살화" 같은 의미의 변형은 글자·사전으로 환원되지 않는다 — 그 벽을 Part Ⅲ 벡터 검색이 넘는다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['편집거리', 'Levenshtein', 'fuzzy', 'fuzzinessAUTO', '동의어', 'synonym_graph', '검색시확장', 'edge_ngram', '자동완성', 'completion_suggester', 'term_suggester', '인기질의', '0건폴백', '벡터예고'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-sky-100 text-sky-900 border border-sky-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-sky-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline">다음: Part Ⅲ 벡터 검색 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
