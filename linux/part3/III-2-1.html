  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Linux Chapter III-2-1 — 백그라운드 실행
    학습 목표: 셸이 닫혀도 살아남는 프로세스를 만드는 5가지 방법을 직관적으로 비교한다.
    핵심 비유: 가게 점원에게 "지금 일 시작하고 나 나가도 계속 해" 라고 시키는 여러 가지 방법
    패턴: fastapi v1 — 좌(LiveDataPane: 프로세스 생존 상태) / 우(VSCode CodeViewer)
    색상: Tux yellow (#fcc624) + amber
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      amp: {lang:'bash', filename:'step1-amp.sh', lines:[
            '# Step 1. & 로 백그라운드 실행',
            '',
            '# 포어그라운드 (셸이 멈춤)',
            'python long_task.py',
            '# ↑ 끝날 때까지 다음 명령 못 침',
            '',
            '# 백그라운드 (셸이 즉시 돌아옴)',
            'python long_task.py &',
            '# [1] 12345     ← 잡 번호 [1], PID 12345',
            '',
            '# 출력은 그대로 터미널에 섞여 나옴 → 로그로 빼는 게 보통',
            'python long_task.py > app.log 2>&1 &',
            '',
            '# 현재 잡 확인',
            'jobs',
            '# [1]+  Running   python long_task.py > app.log 2>&1 &',
            '',
            '# ⚠️ 약점: 셸을 닫으면 (exit / Ctrl+D / SSH 끊김)',
            '# 부모 셸이 자식에게 SIGHUP 을 보내고 자식은 죽는다',
            '# → SSH 세션 끊긴 채 8시간 학습 돌리면 다 날아감',
      ]},
      nohup: {lang:'bash', filename:'step2-nohup.sh', lines:[
            '# Step 2. nohup 으로 SIGHUP 무시',
            '',
            '# 기본 사용',
            'nohup python train.py &',
            '# nohup: ignoring input and appending output to \'nohup.out\'',
            '# [1] 23456',
            '',
            '# stdout/stderr 를 따로 지정',
            'nohup python train.py > train.log 2>&1 &',
            '',
            '# stdin 도 닫아두는 게 안전 (SSH 세션 끊김 때 hang 방지)',
            'nohup python train.py > train.log 2>&1 < /dev/null &',
            '',
            '# 실행 후 SSH 끊기 → 다시 접속 → ps 로 살아있는지 확인',
            'ps -ef | grep train.py | grep -v grep',
            '# user  23456  1  0 14:00 ?  00:01:23 python train.py',
            '#              ↑ PPID 가 1 (init) — 셸에서 떨어져 나옴',
            '',
            '# nohup.out 자동 로그',
            'tail -f nohup.out',
            '',
            '# 언제 쓰나',
            '#  • SSH 로 접속해서 긴 학습/배치 돌릴 때',
            '#  • 간단한 1회성 데몬을 띄울 때 (운영은 systemd 추천)',
      ]},
      disown: {lang:'bash', filename:'step3-disown.sh', lines:[
            '# Step 3. disown 으로 사후 분리',
            '',
            '# 시나리오: nohup 깜빡하고 그냥 띄움',
            'python heavy_task.py &',
            '# [1] 34567',
            '',
            '# 잡 확인',
            'jobs',
            '# [1]+  Running   python heavy_task.py &',
            '',
            '# 옵션 ① 잡을 잡 테이블에서 제거 (가장 흔함)',
            'disown %1',
            '#     ↑ 잡 번호. 안 적으면 가장 최근 잡',
            '',
            '# 옵션 ② SIGHUP 만 안 받게 표시 (잡 테이블엔 유지)',
            'disown -h %1',
            '',
            '# 확인 — 더 이상 jobs 에 안 보임',
            'jobs',
            '# (empty)',
            '',
            '# 하지만 프로세스는 살아있음',
            'ps -p 34567',
            '#   PID TTY   TIME CMD',
            '# 34567 ?     00:00:05 python',
            '',
            '# 이제 exit 해도 안전',
            'exit',
            '',
            '# 한계: 이미 띄운 프로세스의 stdout 은 여전히 원래 터미널을 가리킴',
            '# → 터미널 닫히면 stdout 쓰기에서 EPIPE 가능',
            '# 가장 안전한 건 처음부터 nohup + 로그 리다이렉트',
      ]},
      jobs: {lang:'bash', filename:'step4-jobs.sh', lines:[

               caption:'%1 은 번호, %+ 는 현재 잡, %- 는 직전 잡, %?text 는 명령에 text 가 든 잡이다.',
               changes:[{mark:'read', text:'%1 / %+ / %- / %?text'},
                        {mark:'new', text:'kill %1 처럼 다른 명령에도 사용'}] },
        sshOpen:true, jobAlive:true,
        scenario:{ tool:'%1 / %+ / %-', shellState:'연결됨', afterLogout:'⚠️ 종료 (nohup 같이)' },
        keyPoint:'잡 번호 표기는 fg/bg 뿐 아니라 kill %1 처럼 그대로 쓸 수 있다.',
        code:{...CODE.jobs, highlight:[30,31,32,33,34]},
      },

      // ── Step 5. tmux ──────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'서버 안에 세션을 만든다', at:'step5-tmux.sh L3–5',
               caption:'tmux new -s train 은 서버 쪽에 이름 붙은 가상 터미널을 하나 만들고 그 안으로 들어간다.',
               changes:[{mark:'new', text:'세션 train 생성'},
                        {mark:'changed', text:'셸이 세션 안으로 이동'}] },
        sshOpen:true, jobAlive:true,
        scenario:{ tool:'tmux new -s train', shellState:'연결됨', afterLogout:'✅ 화면까지 보존' },
        keyPoint:'tmux 세션은 SSH 가 아니라 서버 쪽에 존재한다. 이름을 붙여 두면 찾기 쉽다.',
        code:{...CODE.tmux, highlight:[3,4,5]},
      },
      { ...S5,
        beat:{ label:'세션 안에서 그냥 실행', at:'step5-tmux.sh L7–9',
               caption:'세션 안에서는 평소처럼 포어그라운드로 돌린다. 출력이 실시간으로 보인다.',
               changes:[{mark:'new', text:'세션 안에서 train.py 실행'},
                        {mark:'read', text:'출력 실시간 확인'}] },
        sshOpen:true, jobAlive:true,
        scenario:{ tool:'tmux session', shellState:'연결됨', afterLogout:'✅ 화면까지 보존' },
        keyPoint:'tmux 안에서는 &, nohup 없이 그냥 포어그라운드로 돌려도 된다.',
        code:{...CODE.tmux, highlight:[7,8,9]},
      },
      { ...S5,
        beat:{ label:'detach 하고 나온다', at:'step5-tmux.sh L11–15',
               caption:'Ctrl+B, D 로 세션에서 몸만 빠져나온다. 세션과 그 안의 작업은 서버에 그대로 남는다.',
               changes:[{mark:'changed', text:'attach → detached'},
                        {mark:'new', text:'세션은 서버에 잔류'},
                        {mark:'gone', text:'SSH 끊겨도 영향 없음'}] },
        sshOpen:false, jobAlive:true,
        scenario:{ tool:'Ctrl+B, D (detach)', shellState:'끊김', afterLogout:'✅ 화면까지 보존' },
        keyPoint:'detach 는 종료가 아니다. 세션은 살아 있고 연결만 끊긴 상태다.',
        code:{...CODE.tmux, highlight:[11,12,13,14,15]},
      },
      { ...S5,
        beat:{ label:'다시 붙어 화면을 되찾는다', at:'step5-tmux.sh L17–23',
               caption:'tmux ls 로 남은 세션을 확인하고 attach 하면 detach 직전 화면 그대로 돌아온다.',
               changes:[{mark:'read', text:'tmux ls → train'},
                        {mark:'changed', text:'detached → attached'},
                        {mark:'new', text:'출력 화면 복구'}] },
        sshOpen:false, jobAlive:true,
        scenario:{ tool:'tmux attach -t train', shellState:'재접속', afterLogout:'✅ 화면까지 보존' },
        keyPoint:'nohup 과 달리 tmux 는 로그가 아니라 화면 자체를 되돌려 준다.',
        code:{...CODE.tmux, highlight:[17,18,19,20,21,22,23]},
      },
      { ...S5,
        beat:{ label:'prefix 단축키 익히기', at:'step5-tmux.sh L25–32',
               caption:'모든 조작은 prefix(Ctrl+B) 뒤에 한 글자. 분할·이동·새 창·스크롤이 전부 여기에 있다.',
               changes:[{mark:'new', text:'C-b " / % 분할'},
                        {mark:'new', text:'C-b c / n / p 창 관리'},
                        {mark:'read', text:'C-b [ 스크롤 모드'}] },
        sshOpen:false, jobAlive:true,
        scenario:{ tool:'tmux 단축키', shellState:'재접속', afterLogout:'✅ 화면까지 보존' },
        keyPoint:'tmux 는 prefix + 한 글자 조합만 외우면 대부분의 조작이 끝난다.',
        code:{...CODE.tmux, highlight:[25,26,27,28,29,30,31,32]},
      },
      { ...S5,
        beat:{ label:'세션 정리와 screen', at:'step5-tmux.sh L34–40',
               caption:'작업이 끝나면 kill-session 으로 정리한다. screen 도 이름만 다를 뿐 같은 개념이다.',
               changes:[{mark:'gone', text:'세션 train 제거'},
                        {mark:'read', text:'screen -S / -r 은 같은 역할'}] },
        sshOpen:false, jobAlive:true,
        scenario:{ tool:'tmux kill-session', shellState:'끊김', afterLogout:'✅ 화면까지 보존' },
        summary: {
          title: '5가지 백그라운드 기법 비교',
          rows: [
            { metric: '&', before: '간단', after: 'SSH 끊기면 죽음', delta: '☠️' },
            { metric: 'nohup &', before: 'SIGHUP 무시', after: '화면 못 봄', delta: '✅' },
            { metric: 'disown', before: '사후 분리', after: '화면 못 봄', delta: '✅' },
            { metric: 'jobs/fg/bg', before: '한 셸 내 토글', after: '셸 닫히면 죽음', delta: '⚠️' },
            { metric: 'tmux', before: '세션 분리/재접속', after: '화면까지 보존', delta: '🏆' },
          ],
        },
        keyPoint:'tmux = "서버 안의 가상 터미널". detach 후 SSH 끊겨도 화면이 보존된다.',
        code:{...CODE.tmux, highlight:[34,35,36,37,38,39,40]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function ScenarioBox({ scenario, sshOpen, jobAlive }) {
      const shellTone = sshOpen ? TONE.good : TONE.danger;
      const jobTone = jobAlive ? TONE.good : TONE.danger;
      return (
        <div className="rounded-lg border border-amber-300 bg-amber-50 p-3">
          <div className="text-xs font-bold text-amber-900 mb-2">🔧 사용 방식: <span className="font-mono">{scenario.tool}</span></div>
          <div className="grid grid-cols-2 gap-2">
            <div className={`rounded ${shellTone.bg} ${shellTone.border} border px-2 py-1.5`}>
              <div className={`text-[10px] ${shellTone.text}`}>SSH/셸 상태</div>
              <div className={`text-sm font-bold ${shellTone.text}`}>{scenario.shellState}</div>
            </div>
            <div className={`rounded ${jobTone.bg} ${jobTone.border} border px-2 py-1.5`}>
              <div className={`text-[10px] ${jobTone.text}`}>로그아웃 후</div>
              <div className={`text-sm font-bold ${jobTone.text}`}>{scenario.afterLogout}</div>
            </div>
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-amber-400 bg-white p-3">
          <div className="text-sm font-bold text-amber-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-amber-700 border-b border-amber-200">
                <th className="py-1 pr-2">기법</th><th className="py-1 pr-2">장점</th><th className="py-1 pr-2">한계</th><th className="py-1">평가</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-amber-50">
                  <td className="py-1 pr-2 font-medium text-amber-900 font-mono">{r.metric}</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.before}</td>
                  <td className="py-1 pr-2 text-rose-700">{r.after}</td>
                  <td className="py-1 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-amber-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-amber-900">백그라운드 프로세스 생존 시뮬레이션</h3>
            <span className="text-[10px] px-2 py-0.5 rounded bg-amber-200 text-amber-900">Step {state.title.match(/Step (\d+)/)[1]}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <ScenarioBox scenario={state.scenario} sshOpen={state.sshOpen} jobAlive={state.jobAlive} />

          {/* 프로세스 트리 다이어그램 */}
          <div className="mt-3 rounded-lg bg-amber-50 border border-amber-200 p-3">
            <div className="text-[11px] font-bold text-amber-900 mb-2">프로세스 부모-자식 관계</div>
            <div className="flex items-center justify-between text-xs font-mono">
              <span className={`px-2 py-1 rounded text-white ${state.sshOpen ? 'bg-amber-500' : 'bg-rose-500 line-through opacity-70'}`}>🖥️ SSH/Shell</span>
              <span className="text-amber-700">→</span>
              <span className={`px-2 py-1 rounded text-white ${state.jobAlive ? 'bg-emerald-600' : 'bg-rose-600'}`}>
                {state.jobAlive ? '✅ 작업 생존' : '☠️ 작업 종료'}
              </span>
            </div>
            <div className="mt-2 text-[10px] text-amber-800">
              {state.sshOpen
                ? '셸이 살아있어 모든 자식 프로세스가 정상 동작'
                : '셸이 종료된 후에도 자식이 살아남아야 진정한 백그라운드'}
            </div>
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-amber-900 bg-amber-100 border border-amber-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-800 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-amber-500/25 border-l-2 border-amber-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-800 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-amber-50 to-yellow-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap rounded-xl px-4 py-3" style={{ backgroundColor: '#fcc624', color: '#1f2937' }}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-zinc-900 text-amber-400 font-bold">🐧</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter III-2-1. 백그라운드 실행</h1>
                <p className="text-sm opacity-90">& / nohup / disown / jobs / tmux — 셸이 닫혀도 살아남는 5가지 방법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-amber-500' : 'bg-amber-100'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-zinc-800 text-amber-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-amber-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button aria-label="처음으로" onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border border-amber-300 bg-white text-amber-800 hover:bg-amber-50">처음</button>
              <button aria-label="이전 단계" onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-amber-300 bg-white text-amber-800 hover:bg-amber-50 disabled:opacity-40">← 이전</button>
              <button aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-amber-700 text-white' : 'bg-amber-600 text-white hover:bg-amber-700'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button aria-label="다음 단계" onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-amber-300 bg-white text-amber-800 hover:bg-amber-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-amber-700 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-amber-400 bg-white px-4 py-3 text-sm text-zinc-900">
                <div className="font-bold mb-1 text-amber-900">✅ 핵심 정리</div>
                실무 권장: 1회성 긴 작업은 <code className="px-1 bg-amber-100 rounded">nohup ... &gt; log 2&gt;&amp;1 &amp;</code>, 작업 화면을 다시 보고 싶으면 <code className="px-1 bg-amber-100 rounded">tmux</code>, 운영 데몬은 다음 챕터의 <code className="px-1 bg-amber-100 rounded">systemd unit</code>.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['&', 'nohup', 'disown', 'jobs', 'fg/bg', 'tmux', 'SIGHUP'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 border border-amber-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-amber-800">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 cron / systemd timer →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
