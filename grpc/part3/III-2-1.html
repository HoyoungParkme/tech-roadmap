            '        "localhost:50051",',
            '        grpc.WithTransportCredentials(insecure.NewCredentials()),',
            '        grpc.WithChainUnaryInterceptor(',
            '            interceptor.AuthInterceptor(ts),    // 가장 바깥 — 토큰 먼저',
            '            interceptor.LoggingInterceptor,     // 지연 측정',
            '            RetryInterceptor(3),                // 가장 안쪽 — 전송 직전',
            '        ),',
            '        // 스트리밍은 별도: grpc.WithChainStreamInterceptor(...)',
            '    )',
            '    if err != nil { log.Fatal(err) }',
            '    defer conn.Close()',
            '',
            '    client := pb.NewUserServiceClient(conn)',
            '',
            '    // 이 한 줄이 auth+logging+retry 를 모두 자동 통과한다',
            '    ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)',
            '    defer cancel()',
            '    user, err := client.GetUser(ctx, &pb.GetUserRequest{UserId: "u-42"})',
            '    if err != nil { log.Fatal(err) }',
            '    log.Println("user:", user.Name)',
            '}',
          ],
          highlight: [17, 18, 24, 25, 26, 27, 28, 31, 32, 33, 43, 44, 45, 46, 49, 50, 51, 52, 53, 55, 63],
        },
      },
      {
        title: 'Step 5. 한 장 정리 — 5 용도 + 함정 + Python',
        desc: '클라이언트 인터셉터는 인증/로깅/메트릭/재시도/deadline 5 용도가 핵심이다. 함정 3개: ① invoker 를 반드시 호출해야 요청이 나간다(빠뜨리면 조용히 차단), ② 체이닝 순서 = 실행 순서라 auth 를 가장 바깥에 둬야 토큰이 먼저 실린다, ③ ctx 를 metadata 로 가공했으면 그 새 ctx 로 invoker 를 불러야 한다(원본 ctx 를 넘기면 주입이 무효). Python 은 grpc.UnaryUnaryClientInterceptor 클래스의 intercept_unary_unary(continuation, call_details, request) 로 같은 일을 하며, continuation 이 Go 의 invoker 에 해당한다.',
        active: 'summary',
        phase: 'done',
        activeStage: -1,
        verdict: '정리',
        verdictTone: 'warn',
        summary: {
          title: 'Client Interceptor 한 장 요약',
          rows: [
            { metric: '정체',      after: '클라이언트 미들웨어',      delta: 'invoker 를 wrap' },
            { metric: '시그니처',  after: 'ctx,method,req,reply,cc,invoker,opts', delta: 'invoker=실제 전송' },
            { metric: '용도',      after: 'auth / log / metric',    delta: '+retry +deadline' },
            { metric: '토큰 주입', after: 'AppendToOutgoingContext', delta: 'invoker 전에 부착' },
            { metric: '등록',      after: 'WithChainUnaryInterceptor', delta: '등록 순=실행 순' },
            { metric: 'Python',    after: 'UnaryUnaryClientInterceptor', delta: 'continuation=invoker' },
          ],
        },
        keyPoint: 'invoker 필수 호출 + 체인 순서 + 가공한 새 ctx 전달. 이 3가지만 지키면 안전.',
        code: {
          lang: 'python',
          filename: 'client_interceptor.py',
          lines: [
            '# Step 5. Python 클라이언트 인터셉터 — 토큰 주입 + 로깅',
            '',
            'import time',
            'import logging',
            'import grpc',
            'import user_pb2',
            'import user_pb2_grpc',
            '',
            'logger = logging.getLogger("grpc.client")',
            '',
            '',
            '# Go 의 UnaryClientInterceptor 에 대응하는 클래스',
            'class AuthLoggingInterceptor(grpc.UnaryUnaryClientInterceptor):',
            '    """모든 unary RPC 에 토큰 주입 + 지연 로깅."""',
            '',
            '    def __init__(self, token: str) -> None:',
            '        self._token = token',
            '',
            '    def intercept_unary_unary(self, continuation, call_details, request):',
            '        # continuation = Go 의 invoker (실제 전송)',
            '        # call_details = method 이름 등 호출 정보',
            '',
            '        # ── 요청 단계: metadata 에 토큰 주입 ──',
            '        metadata = list(call_details.metadata or [])',
            '        metadata.append(("authorization", f"Bearer {self._token}"))',
            '        new_details = call_details._replace(metadata=metadata)',
            '',
            '        start = time.time()',
            '        logger.info("→ call %s", call_details.method)',
            '',
            '        # ★ 실제 전송 — 반드시 호출해야 요청이 나간다',
            '        response = continuation(new_details, request)',
            '',
            '        # ── 응답 단계: 지연 로깅 ──',
            '        elapsed_ms = int((time.time() - start) * 1000)',
            '        logger.info("← done %s (%dms)", call_details.method, elapsed_ms)',
            '        return response',
            '',
            '',
            'def main() -> None:',
            '    """인터셉터를 채널에 끼워서 등록 — Go 의 DialOption 에 대응."""',
            '    interceptors = [AuthLoggingInterceptor("my-secret-token")]',
            '',
            '    channel = grpc.insecure_channel("localhost:50051")',
            '    # intercept_channel 로 감싸면 모든 호출에 자동 적용',
            '    channel = grpc.intercept_channel(channel, *interceptors)',
            '',
            '    stub = user_pb2_grpc.UserServiceStub(channel)',
            '',
            '    # 이 호출이 토큰 주입 + 로깅을 자동 통과한다',
            '    user = stub.GetUser(user_pb2.GetUserRequest(user_id="u-42"))',
            '    print("user:", user.name)',
            '',
            '',
            'if __name__ == "__main__":',
            '    logging.basicConfig(level=logging.INFO)',
            '    main()',
            '',
            '',
            '# ─────────────────────────────────────────────',
            '# 3 대 함정 (Go / Python 공통)',
            '# ─────────────────────────────────────────────',
            '#',
            '#  1) invoker / continuation 을 반드시 호출',
            '#     빠뜨리면 요청이 조용히 차단된다',
            '#',
            '#  2) 체이닝 순서 = 실행 순서',
            '#     auth 를 가장 바깥에 → 토큰이 먼저 실린다',
            '#',
            '#  3) 가공한 새 ctx / new_details 를 넘길 것',
            '#     원본을 그대로 넘기면 metadata 주입이 무효',
            '',
            '# 다음 챕터(III-2-2): Server Interceptor — 서버 측 대칭',
          ],
          highlight: [12, 13, 19, 20, 23, 24, 25, 26, 31, 32, 34, 35, 36, 37, 41, 42, 45, 46, 47, 51, 52, 65, 66, 69, 70, 73, 74],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-teal-50',  border: 'border-teal-400', text: 'text-teal-900', badge: 'bg-teal-200 text-teal-900' },
      warn:   { bg: 'bg-amber-50', border: 'border-amber-400', text: 'text-amber-900', badge: 'bg-amber-200 text-amber-900' },
      info:   { bg: 'bg-sky-50',   border: 'border-sky-400',   text: 'text-sky-900',   badge: 'bg-sky-200 text-sky-900' },
      danger: { bg: 'bg-rose-50',  border: 'border-rose-400',  text: 'text-rose-800',  badge: 'bg-rose-200 text-rose-800' },
    };

    // 인터셉터 체인 파이프라인: 클라이언트 호출이 체인을 통과해 서버로, 응답은 역순
    const STAGES = [
      { key: 'client', icon: '🖥️', name: 'Client', sub: 'stub.GetUser()' },
      { key: 'auth',   icon: '🔑', name: 'Auth',    sub: '토큰 주입' },
      { key: 'log',    icon: '📝', name: 'Logging', sub: '지연 측정' },
      { key: 'invoke', icon: '📡', name: 'invoker', sub: '네트워크 전송' },
      { key: 'server', icon: '🗄️', name: 'Server',  sub: 'handler(ctx)' },
    ];

    function InterceptorPipeline({ state }) {
      // phase: idle | request | response | done
      // activeStage: 강조할 STAGES 인덱스 (-1 이면 없음)
      const isReq = state.phase === 'request';
      const isResp = state.phase === 'response';
      const isDone = state.phase === 'done';
      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-xs">
          <div className="flex items-center justify-between mb-2">
            <span className="text-teal-300">🔌 Client Interceptor Chain</span>
            <span className="text-[10px] text-teal-400">
              {isReq ? '요청 → 통과' : isResp ? '응답 ← 역순' : isDone ? '왕복 완료' : '대기'}
            </span>
          </div>
          <div className="space-y-1">
            {STAGES.map((s, i) => {
              const isActive = state.activeStage === i;
              const isMiddleware = s.key === 'auth' || s.key === 'log';
              return (
                <div key={s.key} className={`flex items-center gap-2 rounded px-2 py-1.5 transition
                  ${isActive ? 'bg-teal-500/30 border border-teal-400' : 'bg-teal-900/40 border border-transparent'}`}>
                  <span className="text-base">{s.icon}</span>
                  <div className="flex-1 min-w-0">
                    <div className={`text-[11px] font-bold ${isActive ? 'text-white' : 'text-teal-200'}`}>{s.name}</div>
                    <div className="text-[9px] text-teal-400 truncate">{s.sub}</div>
                  </div>
                  {isMiddleware && (
                    <span className="text-[8px] px-1.5 py-0.5 rounded bg-teal-700/60 text-teal-100">interceptor</span>
                  )}
                  <span className="text-teal-500 w-4 text-center">
                    {isReq ? '▼' : isResp ? '▲' : isDone ? '↕' : '·'}
                  </span>
                </div>
              );
            })}
          </div>
          <div className="mt-2 flex items-center justify-between text-[9px] text-teal-400 px-1">
            <span>{isResp ? '← 응답이 역순으로 돌아옴' : '요청이 위 → 아래로 통과'}</span>
            <span className="text-teal-300">invoker = 다음 단계</span>
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2"></th><th className="py-1 pr-2">값</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-mono font-bold text-teal-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-gray-300">→</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-gray-700 font-mono text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.info;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-teal-900">🔌 인터셉터 파이프라인</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          <InterceptorPipeline state={state} />
          <SummaryTable summary={state.summary} />
          <div className={`mt-3 text-xs rounded p-2 ${state.verdictTone === 'danger' ? 'bg-rose-50 text-rose-900 border border-rose-300' : 'bg-teal-100 text-teal-900 border border-teal-300'}`}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap rounded-xl px-4 py-3" style={{backgroundColor:'#2DA6B0', color:'#ffffff'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-teal-700 font-bold">🔌</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter III-2-1. Client Interceptor (클라이언트 미들웨어)</h1>
                <p className="text-sm opacity-90">모든 RPC 를 가로채는 미들웨어 — 인증/로깅/재시도/deadline</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-100'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-gray-900 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-gray-900 text-teal-300' : 'bg-teal-500 text-white hover:bg-teal-600'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-800 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-400 bg-white px-4 py-3 text-sm text-gray-900">
                <div className="font-bold mb-1 text-teal-900">✅ 핵심 정리</div>
                Client Interceptor = 클라이언트 미들웨어. UnaryClientInterceptor 로 invoker 호출 전후를 감싸 인증/로깅/재시도/deadline 을 한 곳에. WithChainUnaryInterceptor 로 등록하면 등록 순서대로 통과하고 응답은 역순. invoker 필수 호출 + 가공한 새 ctx 전달, 이 2가지만 지키면 안전. 서버 인터셉터와 대칭.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['client-interceptor', 'middleware', 'UnaryClientInterceptor', 'invoker', 'auth-inject', 'retry', 'chaining', 'DialOption'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-teal-900">
              <a href="./III-1-2.html" className="underline hover:no-underline">← III-1-2 Auth (Bearer + mTLS)</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 Server Interceptor →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
