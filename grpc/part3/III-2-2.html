  <script id="trn-focus-js">

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

    .trn-beat-off { opacity: .22 !important; }

    #trn-beat-badge {

  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    gRPC Chapter III-2-2 — Auth (token / mTLS 인증)
    학습 목표: 전송 보안(TLS/mTLS) + 호출 인증(토큰 metadata) — 채널 자격증명 vs 호출 자격증명.
    패턴: fastapi v1 / gRPC teal #2DA6B0
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      overview: {lang:"go", filename:"auth-overview.go", lines:[
        "// Step 1. gRPC 인증의 두 층위 — 개요",
        "//",
        "// ─────────────────────────────────────────────",
        "// 층위 A. 전송 보안 = channel credentials",
        "// ─────────────────────────────────────────────",
        "//   TLS  : 서버 인증서만 검증 (클라 → 서버 신뢰)",
        "//   mTLS : 서버 + 클라 인증서 상호 검증",
        "//          → \"이 채널의 상대가 누구인가\"를 증명",
        "//          → 내부 서비스 간(service-to-service) 신뢰",
        "//",
        "// ─────────────────────────────────────────────",
        "// 층위 B. 호출 인증 = call credentials",
        "// ─────────────────────────────────────────────",
        "//   metadata 의 authorization: \"Bearer <JWT>\"",
        "//   → 각 RPC 마다 \"요청 주체가 누구인가\"를 증명",
        "//   → 사용자 요청(user request) 인가",
        "//   → 서버 인터셉터에서 토큰 검증",
        "//",
        "// ─────────────────────────────────────────────",
        "// 두 층은 곱해진다 (실무 표준 조합)",
        "// ─────────────────────────────────────────────",
        "//",
        "//   [ mTLS 채널 ]  ×  [ 호출별 JWT ]",
        "//     전송 레벨          애플리케이션 레벨",
        "//     서비스 신원        사용자 신원",
        "//",
        "package main",
        "",
        "import \"google.golang.org/grpc\"",
        "",
        "// grpc.DialOption 두 종류로 대응된다",
        "func dialOptions() []grpc.DialOption {",
        "    return []grpc.DialOption{",
        "        // 층위 A — 채널(전송) 자격증명 1개",
        "        grpc.WithTransportCredentials(/* TLS or mTLS */ nil),",
        "",
        "        // 층위 B — 호출 자격증명 (모든 RPC 에 자동 첨부)",
        "        grpc.WithPerRPCCredentials(/* token source */ nil),",
        "    }",
        "}",
        "",
        "// 인증 실패 시 서버는 항상 이 status 로 응답한다",
        "//   codes.Unauthenticated  → 신원 증명 실패 (401 에 대응)",
        "//   codes.PermissionDenied → 신원은 맞지만 권한 없음 (403)",
        "",
        "// 다음 Step: TLS / mTLS credentials 를 실제로 설정",
      ]},
      mtls: {lang:"go", filename:"mtls_credentials.go", lines:[
        "// Step 2. mTLS credentials — 서버 + 클라이언트 (Go)",
        "//",
        "// ── 사전 준비: 인증서 발급 (bash) ─────────────",
        "//   # 1) CA 키/인증서",
        "//   openssl req -x509 -newkey rsa:4096 -nodes -days 365 \\",
        "//     -keyout ca.key -out ca.crt -subj /CN=my-root-ca",
        "//   # 2) 서버 키/인증서 (CA 로 서명)",
        "//   openssl req -newkey rsa:4096 -nodes \\",

        "package main",
        "",
        "import (",
        "    \"context\"",
        "    \"strings\"",

        "func authInterceptor(",
        "    ctx context.Context,",

        gate: { tls: 'pass', mtls: 'verify', token: 'verify', result: 'good', resultText: 'peer CN = 서비스 신원' },
        verdict: '검증', verdictTone: 'good',
        keyPoint: 'PeerCertificates가 비어 있으면 mTLS가 아니라는 뜻이다.',
        code: {...CODE.gate, highlight: [67,68,69,70,71]},
      },
      { ...S4,
        beat: { label: '서버에 게이트 장착', at: 'server_auth_interceptor.go L75–78',
                caption: 'Creds로 mTLS를, UnaryInterceptor로 토큰 게이트를 건다. 두 층이 서버에서도 나란히 선다.',
                changes: [{mark:'new', text:'grpc.Creds(serverCreds())'},
                          {mark:'new', text:'UnaryInterceptor(authInterceptor)'}] },
        active: 'verify',
        gate: { tls: 'pass', mtls: 'verify', token: 'verify', result: 'good', resultText: '게이트 통과 → 핸들러' },
        verdict: '검증', verdictTone: 'good',
        keyPoint: 'UnaryInterceptor에서 peer 인증서(CN) + 토큰 이중 검증. 실패는 Unauthenticated.',
        code: {...CODE.gate, highlight: [75,76,77,78]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat: { label: '두 층위 비교표', at: 'recap.go L7–10',
                caption: '전송 층은 서비스 신원을 채널 한 번에, 호출 층은 사용자 신원을 RPC마다 증명한다.',
                changes: [{mark:'read', text:'credentials.NewTLS'},
                          {mark:'read', text:'PerRPCCredentials'}] },
        active: 'summary',
        gate: { tls: 'pass', mtls: 'verify', token: 'idle', result: 'info', resultText: '전송 층 vs 호출 층' },
        verdict: '정리', verdictTone: 'info',
        keyPoint: '증명 대상과 적용 범위가 다르다 — 그래서 둘 다 필요하다.',
        code: {...CODE.recap, highlight: [7,8,9,10]},
      },
      { ...S5,
        beat: { label: '실무 조합 3가지', at: 'recap.go L16–18',
                caption: '내부 서비스 간은 mTLS, 사용자 요청은 JWT, 게이트웨이 뒤는 둘 다 쓴다.',
                changes: [{mark:'new', text:'내부 = mTLS'},
                          {mark:'new', text:'사용자 = JWT'},
                          {mark:'changed', text:'게이트웨이 뒤 = 둘 다'}] },
        active: 'summary',
        gate: { tls: 'pass', mtls: 'verify', token: 'attach', result: 'good', resultText: '내부 mTLS · 사용자 JWT' },
        verdict: '정리', verdictTone: 'good',
        keyPoint: '어디서 오는 요청인지에 따라 조합이 달라진다.',
        code: {...CODE.recap, highlight: [16,17,18]},
      },
      { ...S5,
        beat: { label: '서버 검증 흐름', at: 'recap.go L24–27',
                caption: 'peer로 서비스 신원을, metadata로 사용자 신원을 확인하고, 통과하면 ctx에 심어 핸들러로 넘긴다.',
                changes: [{mark:'read', text:'peer.FromContext'},
                          {mark:'read', text:'metadata.FromIncoming'},
                          {mark:'changed', text:'통과 → handler'}] },
        active: 'summary',
        gate: { tls: 'pass', mtls: 'verify', token: 'verify', result: 'good', resultText: '인터셉터 한 곳에서 이중 검증' },
        verdict: '정리', verdictTone: 'good',
        keyPoint: '검증 지점은 인터셉터 한 곳 — 핸들러는 손대지 않는다.',
        code: {...CODE.recap, highlight: [24,25,26,27]},
      },
      { ...S5,
        beat: { label: '함정 ① 평문 전송', at: 'recap.go L33–34',
                caption: 'RequireTransportSecurity를 false로 두면 TLS 없이 토큰이 그대로 나간다.',
                changes: [{mark:'gone', text:'전송 보호'},
                          {mark:'changed', text:'토큰 평문 노출'}] },
        active: 'summary',
        gate: { tls: 'fail', mtls: 'idle', token: 'fail', result: 'danger', resultText: 'TLS 없이 토큰 전송 → 탈취' },
        verdict: '정리', verdictTone: 'danger',
        keyPoint: '개발 편의로 false를 둔 채 배포되는 사고가 가장 흔하다.',
        code: {...CODE.recap, highlight: [33,34]},
      },
      { ...S5,
        beat: { label: '함정 ② 인증서 만료', at: 'recap.go L36–37',
                caption: '같은 CA로 한꺼번에 발급한 인증서는 한꺼번에 만료된다. 전 서비스가 동시에 멈춘다.',
                changes: [{mark:'gone', text:'핸드셰이크 성공'},
                          {mark:'new', text:'자동 갱신 체계'}] },
        active: 'summary',
        gate: { tls: 'pass', mtls: 'fail', token: 'idle', result: 'danger', resultText: '만료 → 핸드셰이크 동시 실패' },
        verdict: '정리', verdictTone: 'danger',
        keyPoint: '인증서 로테이션은 배포 파이프라인에 넣어 두어야 한다.',
        code: {...CODE.recap, highlight: [36,37]},
      },
      { ...S5,
        beat: { label: '함정 ③ status 구분', at: 'recap.go L39–43',
                caption: 'Unauthenticated는 재로그인이 답이고, PermissionDenied는 재시도해도 소용없다. 클라 동작이 달라진다.',
                changes: [{mark:'read', text:'Unauthenticated = 신원 실패'},
                          {mark:'read', text:'PermissionDenied = 권한 없음'}] },
        active: 'summary',
        gate: { tls: 'pass', mtls: 'verify', token: 'verify', result: 'good', resultText: '전송 × 호출 이중 방어' },
        verdict: '정리', verdictTone: 'warn',
        summary: { title: 'Auth 한 장 요약', rows: [
          { metric: '전송 보안', after: 'TLS / mTLS', delta: 'channel creds · 서비스 신원' },
          { metric: '호출 인증', after: 'JWT metadata', delta: 'call creds · 사용자 신원' },
          { metric: 'mTLS 핵심', after: 'RequireAndVerifyClientCert', delta: 'peer CN 으로 신원' },
          { metric: '토큰 주입', after: 'PerRPCCredentials', delta: '모든 RPC 자동 첨부' },
          { metric: '서버 검증', after: 'UnaryInterceptor', delta: 'peer + JWT 이중' },
          { metric: '실패 status', after: 'Unauthenticated', delta: 'vs PermissionDenied' },
        ]},
        keyPoint: '내부 서비스=mTLS, 사용자 요청=JWT. 인터셉터로 일괄 검증. 실패는 Unauthenticated.',
        code: {...CODE.recap, highlight: [39,40,41,42,43]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-teal-50',  border: 'border-teal-400', text: 'text-teal-900', badge: 'bg-teal-200 text-teal-900' },
      warn:   { bg: 'bg-amber-50', border: 'border-amber-400', text: 'text-amber-900', badge: 'bg-amber-200 text-amber-900' },
      info:   { bg: 'bg-sky-50',   border: 'border-sky-400',   text: 'text-sky-900',   badge: 'bg-sky-200 text-sky-900' },
      danger: { bg: 'bg-rose-50',  border: 'border-rose-400',  text: 'text-rose-800',  badge: 'bg-rose-200 text-rose-800' },
    };

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2"></th><th className="py-1 pr-2">값</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-mono font-bold text-teal-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-gray-300">→</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.after}</td>
                  <td className="py-1 text-gray-700 font-mono text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }


    // ── RefPanel ── 그림 밖 참고 표 (anim/stage.jsx 가 "표·정리 보기" 상자에 넣는다)
    // openssl 로 만든 CA·서버·클라 인증서와 grpcio 1.85.3 · grpc-js 1.14.7 로 직접 돌린 결과다
    function RefPanel({ step, stepIdx }) {
      const g = STEPS.slice(0, stepIdx + 1).filter((s, i, a) => i === 0 || s.title !== a[i - 1].title).length - 1;
      if (g === 1) return (
        <div>
          <h4>서버 인증서의 이름 확인 (SAN 과 CN)</h4>
          <table>
            <thead><tr><th>클라이언트</th><th>CN=user-svc 만 있는 인증서</th><th>SAN DNS:user-svc 를 넣은 인증서</th></tr></thead>
            <tbody>
              <tr><td>Python grpcio</td><td>통과 (실행 확인)</td><td>통과 (실행 확인)</td></tr>
              <tr><td>Node grpc-js</td><td>통과 (실행 확인)</td><td>통과 (실행 확인)</td></tr>
              <tr><td>Go crypto/tls</td><td>거절 (Go 1.15 부터 CN 을 이름으로 쓰지 않음)</td><td>통과</td></tr>
            </tbody>
          </table>
          <p className="mt-1">그래서 코드 블록의 서버 인증서 발급 줄에 <span className="font-mono">-extfile &lt;(echo subjectAltName=DNS:user-svc)</span> 를 붙였다. 클라 인증서의 CN(order-svc)은 이름 확인이 아니라 호출 서비스 식별에 쓰므로 그대로 둔다.</p>
        </div>
      );
      if (g !== 3 && g !== 4) return null;
      return (
        <div>
          <h4>실패 지점별 결과 (서버 require_client_auth=True, grpcio)</h4>
          <table>
            <thead><tr><th>상황</th><th>클라이언트가 받은 코드</th><th>details 앞부분</th></tr></thead>
            <tbody>
              <tr><td>정상 mTLS + 토큰</td><td>OK</td><td>서버가 본 CN = order-svc</td></tr>
              <tr><td>클라 인증서 없음</td><td className="font-mono">UNAVAILABLE (14)</td><td>failed to connect to all addresses</td></tr>
              <tr><td>다른 CA 가 서명한 클라 인증서</td><td className="font-mono">UNAVAILABLE (14)</td><td>failed to connect to all addresses</td></tr>
              <tr><td>ServerName 이 billing-svc</td><td className="font-mono">UNAVAILABLE (14)</td><td>… Hostname Verification …</td></tr>
              <tr><td>토큰 없음</td><td className="font-mono">UNAUTHENTICATED (16)</td><td>서버 인터셉터가 abort</td></tr>
              <tr><td>토큰 맞고 권한 없음</td><td className="font-mono">PERMISSION_DENIED (7)</td><td>서버 핸들러가 abort</td></tr>
            </tbody>
          </table>
          <p className="mt-1">전송 층 실패는 연결 자체가 서지 않아 UNAVAILABLE 로 보인다. Unauthenticated 는 연결이 선 뒤 호출 층에서 거절됐다는 뜻이다.</p>
        </div>
      );
    }
    // ── /RefPanel ──

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
