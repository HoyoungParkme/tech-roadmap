<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gRPC 학습 — III-1-1. Metadata (헤더 송수신)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📨</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    gRPC Chapter III-1-1 — Metadata (헤더 송수신)
    학습 목표: HTTP 헤더에 해당하는 gRPC Metadata 의 송수신 (Initial / Trailing).
    패턴: fastapi v1 / gRPC teal #2DA6B0
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      overview: {lang:"protobuf", filename:"metadata-overview.proto", lines:[
        "// Step 1. Metadata 개요 — .proto 에는 안 적힌다",
        "",
        "// 핵심: Metadata 는 message 가 아니라 transport 레벨이다.",
        "// .proto 파일에는 절대 등장하지 않는다.",
        "// 코드(클라이언트/서버)에서 직접 다룬다.",
        "",
        "syntax = \"proto3\";",
        "package user.v1;",
        "",
        "service UserService {",
        "  // 이 호출에는 보이지 않지만",
        "  //   요청 헤더: authorization: Bearer xxx",
        "  //              x-request-id: abc-123",
        "  //   응답 트레일러: grpc-status: 0",
        "  //                x-server-timing: db=12ms",
        "  rpc GetUser(GetUserRequest) returns (User);",
        "}",
        "",
        "message GetUserRequest { string user_id = 1; }",
        "message User { string id = 1; string name = 2; }",
        "",
        "// ─────────────────────────────────────────────",
        "// Metadata 규칙 (gRPC 사양)",
        "// ─────────────────────────────────────────────",
        "//",
        "// 1) 키는 ASCII, 대소문자 무시 (서버는 소문자로 받음)",
        "//    \"Authorization\" 보내도 \"authorization\" 으로 수신",
        "//",
        "// 2) 값은 두 종류",
        "//    (a) ASCII printable : 보통 문자열",
        "//        authorization: Bearer eyJhbGc...",
        "//    (b) Binary           : 키에 -bin 접미사, 자동 base64",
        "//        trace-context-bin: <binary bytes>",
        "//",
        "// 3) 예약된 키 (직접 쓰지 말 것)",
        "//    grpc-*           gRPC 내부 (grpc-status, grpc-message)",
        "//    content-type     application/grpc 고정",
        "//    te               trailers 고정",
        "//    user-agent       gRPC 라이브러리가 채움",
        "//",
        "// 4) 같은 키 반복 허용 (HTTP 와 동일)",
        "//    accept-language: en",
        "//    accept-language: ko",
        "",
        "// ─────────────────────────────────────────────",
        "// 어디서 쓰나 — 5 대 용도",
        "// ─────────────────────────────────────────────",
        "//",
        "//  ① 인증/인가      : authorization (Bearer / Basic / 사내 토큰)",
        "//  ② 추적           : x-request-id, traceparent (W3C)",
        "//  ③ 멀티 테넌트    : x-tenant-id, x-org-id",
        "//  ④ 클라이언트 정보: x-client-version, x-platform",
        "//  ⑤ 서버 진단      : x-server-timing (응답 trailer)",
        "",
        "// 다음 Step: Go / Python 으로 송수신 실제 코드",
      ]},
      client: {lang:"go", filename:"client_metadata.go", lines:[
        "// Step 2. Go 클라이언트 — Metadata 송신",
        "package main",
        "",
        "import (",
        "    \"context\"",
        "    \"fmt\"",
        "    \"log\"",
        "    \"time\"",
        "",
        "    \"google.golang.org/grpc\"",
        "    \"google.golang.org/grpc/credentials/insecure\"",
        "    \"google.golang.org/grpc/metadata\"",
        "    pb \"example.com/user/v1\"",
        ")",
        "",
        "func main() {",
        "    conn, err := grpc.NewClient(",
        "        \"localhost:50051\",",
        "        grpc.WithTransportCredentials(insecure.NewCredentials()),",
        "    )",
        "    if err != nil { log.Fatal(err) }",
        "    defer conn.Close()",
        "",
        "    client := pb.NewUserServiceClient(conn)",
        "",
        "    // ─────────────────────────────────────",
        "    // (1) Outgoing metadata 만들기",
        "    // ─────────────────────────────────────",
        "    md := metadata.New(map[string]string{",
        "        \"authorization\":  \"Bearer eyJhbGciOiJIUzI1NiJ9...\",",
        "        \"x-request-id\":   \"abc-123-def\",",
        "        \"x-tenant-id\":    \"acme-corp\",",
        "        \"x-client-version\": \"1.4.2\",",
        "    })",
        "",
        "    // 같은 키를 여러 번 보내려면 Pairs",
        "    md2 := metadata.Pairs(",
        "        \"accept-language\", \"ko\",",
        "        \"accept-language\", \"en\",",
        "    )",
        "    md = metadata.Join(md, md2)",
        "",
        "    // ─────────────────────────────────────",
        "    // (2) Context 에 실어서 호출",
        "    // ─────────────────────────────────────",
        "    ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)",
        "    defer cancel()",
        "    ctx = metadata.NewOutgoingContext(ctx, md)",
        "",
        "    // ─────────────────────────────────────",
        "    // (3) Header / Trailer 받기",
        "    // ─────────────────────────────────────",
        "    var hMD, tMD metadata.MD",
        "    user, err := client.GetUser(",

        "// Step 3. Go 서버 — Metadata 수신 + 응답 헤더/트레일러",
        "package main",
        "",
        "import (",
        "    \"context\"",
        "    \"fmt\"",
        "    \"log\"",
        "    \"net\"",
        "    \"time\"",
        "",
        "    \"google.golang.org/grpc\"",
        "    \"google.golang.org/grpc/codes\"",
        "    \"google.golang.org/grpc/metadata\"",
        "    \"google.golang.org/grpc/status\"",
        "    pb \"example.com/user/v1\"",
        ")",
        "",
        "type userServer struct {",
        "    pb.UnimplementedUserServiceServer",
        "}",
        "",
        "func (s *userServer) GetUser(",
        "    ctx context.Context,",
        "    req *pb.GetUserRequest,",
        ") (*pb.User, error) {",
        "    start := time.Now()",
        "",
        "    // ─────────────────────────────────────",
        "    // (1) 들어온 Metadata 추출",
        "    // ─────────────────────────────────────",
        "    md, ok := metadata.FromIncomingContext(ctx)",
        "    if !ok {",
        "        return nil, status.Error(codes.Internal, \"metadata 없음\")",
        "    }",
        "",
        "    // 단일 값",
        "    authz := md.Get(\"authorization\")  // []string",
        "    if len(authz) == 0 {",
        "        return nil, status.Error(",
        "            codes.Unauthenticated, \"authorization 헤더 필요\",",
        "        )",
        "    }",
        "    token := authz[0]",
        "",
        "    // 추적 ID — 없으면 생성",
        "    reqID := firstOr(md.Get(\"x-request-id\"), genID())",
        "    tenant := firstOr(md.Get(\"x-tenant-id\"), \"default\")",
        "",
        "    log.Printf(\"[%s] tenant=%s token=%s...\", reqID, tenant, token[:10])",
        "",
        "    // ─────────────────────────────────────",
        "    // (2) 응답 Initial Header 부착",
        "    // ─────────────────────────────────────",
        "    hdr := metadata.Pairs(",
        "        \"x-server-id\", \"srv-tokyo-7\",",
        "        \"x-request-id\", reqID,",
        "    )",
        "",
        "    // SetHeader: 응답 메시지가 나갈 때 같이 전송 (지연)",
        "    // SendHeader: 지금 즉시 전송 (스트리밍에서 유용)",
        "    if err := grpc.SetHeader(ctx, hdr); err != nil {",
        "        log.Println(\"setHeader 실패:\", err)",
        "    }",
        "",
        "    // ─────────────────────────────────────",
        "    // (3) 비즈니스 로직",
        "    // ─────────────────────────────────────",
        "    user := &pb.User{Id: req.UserId, Name: \"Alice\"}",
        "",
        "    // ─────────────────────────────────────",
        "    // (4) 응답 Trailer 부착 (응답 끝에 같이 감)",
        "    // ─────────────────────────────────────",
        "    trailer := metadata.Pairs(",
        "        \"x-server-timing\", fmt.Sprintf(\"total=%dms\", time.Since(start).Milliseconds()),",
        "        \"x-db-queries\", \"3\",",
        "    )",
        "    if err := grpc.SetTrailer(ctx, trailer); err != nil {",
        "        log.Println(\"setTrailer 실패:\", err)",
        "    }",
        "",
        "    return user, nil",
        "}",
        "",
        "func firstOr(vals []string, def string) string {",
        "    if len(vals) == 0 { return def }",
        "    return vals[0]",
        "}",
        "",
        "func genID() string { return fmt.Sprintf(\"auto-%d\", time.Now().UnixNano()) }",
        "",
        "func main() {",
        "    lis, _ := net.Listen(\"tcp\", \":50051\")",
        "    s := grpc.NewServer()",
        "    pb.RegisterUserServiceServer(s, &userServer{})",
        "    log.Println(\"listening :50051\")",
        "    s.Serve(lis)",
        "}",
      ]},

        "# Step 4. Python gRPC — 클라이언트 + 서버 동시",
        "",
        "import grpc",
        "import time",
        "import user_pb2",
        "import user_pb2_grpc",
        "from concurrent import futures",
        "",
        "# ─────────────────────────────────────────────",
        "# 1) 클라이언트 — Metadata 송신",
        "# ─────────────────────────────────────────────",
        "",
        "def call_with_metadata(token: str) -> None:",
        "    \"\"\"metadata 인자에 (key, value) 튜플 리스트로 넘긴다.\"\"\"",
        "    with grpc.insecure_channel(\"localhost:50051\") as channel:",
        "        stub = user_pb2_grpc.UserServiceStub(channel)",
        "",
        "        md = [",
        "            (\"authorization\", f\"Bearer {token}\"),",
        "            (\"x-request-id\", \"abc-123-def\"),",
        "            (\"x-tenant-id\", \"acme-corp\"),",
        "            (\"x-client-version\", \"1.4.2\"),",
        "            # 같은 키 여러 번 — 튜플로 그냥 두 번",
        "            (\"accept-language\", \"ko\"),",
        "            (\"accept-language\", \"en\"),",
        "        ]",
        "",
        "        # with_call 로 호출하면 (response, call) 반환",
        "        response, call = stub.GetUser.with_call(",
        "            user_pb2.GetUserRequest(user_id=\"u-42\"),",
        "            metadata=md,",
        "            timeout=5.0,",
        "        )",
        "",
        "        # 응답 헤더 / 트레일러 추출",
        "        for key, value in call.initial_metadata():",
        "            print(f\"[header] {key}: {value}\")",
        "        for key, value in call.trailing_metadata():",
        "            print(f\"[trailer] {key}: {value}\")",
        "",
        "        print(\"user:\", response.name)",
        "",
        "",
        "# ─────────────────────────────────────────────",
        "# 2) 서버 — Metadata 수신 + 응답 헤더/트레일러",
        "# ─────────────────────────────────────────────",
        "",
        "class UserService(user_pb2_grpc.UserServiceServicer):",
        "    \"\"\"사용자 조회 서비스 — metadata 인증 + 응답 진단 정보.\"\"\"",
        "",
        "    def GetUser(",
        "        self,",
        "        request: user_pb2.GetUserRequest,",
        "        context: grpc.ServicerContext,",
        "    ) -> user_pb2.User:",
        "        start = time.time()",
        "",
        "        # (a) 들어온 metadata 추출 — 튜플 리스트",
        "        md = dict(context.invocation_metadata())",
        "",
        "        if \"authorization\" not in md:",
        "            context.abort(",
        "                grpc.StatusCode.UNAUTHENTICATED,",
        "                \"authorization 헤더 필요\",",
        "            )",
        "",
        "        token = md[\"authorization\"].removeprefix(\"Bearer \")",
        "        req_id = md.get(\"x-request-id\", f\"auto-{int(start*1000)}\")",
        "        tenant = md.get(\"x-tenant-id\", \"default\")",
        "",
        "        print(f\"[{req_id}] tenant={tenant} token={token[:10]}...\")",
        "",
        "        # (b) 응답 Initial Header — 즉시 전송",
        "        context.send_initial_metadata([",
        "            (\"x-server-id\", \"srv-tokyo-7\"),",
        "            (\"x-request-id\", req_id),",
        "        ])",
        "",
        "        # (c) 비즈니스",
        "        user = user_pb2.User(id=request.user_id, name=\"Alice\")",
        "",
        "        # (d) 응답 Trailer — 응답 끝에 자동으로 같이 감",
        "        elapsed_ms = int((time.time() - start) * 1000)",
        "        context.set_trailing_metadata([",
        "            (\"x-server-timing\", f\"total={elapsed_ms}ms\"),",
        "            (\"x-db-queries\", \"3\"),",
        "        ])",
        "",
        "        return user",
        "",
        "",
        "def serve() -> None:",
        "    \"\"\"서버 시작 — 4 worker thread.\"\"\"",
        "    server = grpc.server(futures.ThreadPoolExecutor(max_workers=4))",
        "    user_pb2_grpc.add_UserServiceServicer_to_server(UserService(), server)",
        "    server.add_insecure_port(\"[::]:50051\")",
        "    server.start()",
        "    print(\"listening :50051\")",
        "    server.wait_for_termination()",
        "",
        "",
        "if __name__ == \"__main__\":",
        "    serve()",
        "",
        "",
        "# ─────────────────────────────────────────────",
        "# 3) asyncio (grpc.aio) — 동일한 API",
        "# ─────────────────────────────────────────────",
        "#",
        "#   async def call():",
        "#       async with grpc.aio.insecure_channel(\"localhost:50051\") as ch:",
        "#           stub = user_pb2_grpc.UserServiceStub(ch)",
        "#           call = stub.GetUser(",
        "#               user_pb2.GetUserRequest(user_id=\"u-42\"),",
        "#               metadata=((\"authorization\", \"Bearer xxx\"),),",
        "#           )",
        "#           response = await call",
        "#           print(await call.initial_metadata())",
        "#           print(await call.trailing_metadata())",
        "#",
        "# asyncio 도 동일한 메서드 이름. 차이는 await 뿐.",
      ]},

        verdict: "정리",
        verdictTone: "warn",
        summary: {"title":"Metadata 한 장 요약","rows":[{"metric":"정체","after":"HTTP/2 headers","delta":"Initial + Trailing"},{"metric":"키 규칙","after":"소문자, -bin = binary","delta":"grpc-* 예약"},{"metric":"용도","after":"auth / trace / tenant","delta":"+클라정보 +진단"},{"metric":"Go 송신","after":"NewOutgoingContext","delta":"PerRPCCredentials 자동화"},{"metric":"Go 수신","after":"FromIncomingContext","delta":"Set/Send Header + SetTrailer"},{"metric":"Python","after":"튜플 리스트","delta":"invocation_metadata() / send_initial"}]},
        keyPoint: "인증/추적은 다음 챕터의 Interceptor 로 자동화. 직접 메타 만지면 누락 위험.",

    const TONE = {
      good:   { bg: 'bg-teal-50',  border: 'border-teal-400', text: 'text-teal-900', badge: 'bg-teal-200 text-teal-900' },
      warn:   { bg: 'bg-amber-50', border: 'border-amber-400', text: 'text-amber-900', badge: 'bg-amber-200 text-amber-900' },
      info:   { bg: 'bg-sky-50',   border: 'border-sky-400',   text: 'text-sky-900',   badge: 'bg-sky-200 text-sky-900' },
      danger: { bg: 'bg-rose-50',  border: 'border-rose-400',  text: 'text-rose-800',  badge: 'bg-rose-200 text-rose-800' },
    };

    function MetadataFlow({ state }) {
      const arrowColor = state.direction === 'client-to-server' ? '#2DA6B0'
                       : state.direction === 'server-extract' ? '#0e7490'
                       : '#64748b';
      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-xs">
          <div className="text-teal-300 mb-2">📨 HTTP/2 Frame Flow</div>
          <div className="flex items-center gap-2 mb-3">
            <div className="flex-1 rounded bg-teal-800/50 p-2 text-center text-[10px]">
              <div className="text-teal-300">Client</div>
              <div className="text-white">stub.GetUser()</div>
            </div>
            <div className="text-teal-400" style={{color: arrowColor}}>━━▶</div>
            <div className="flex-1 rounded bg-teal-800/50 p-2 text-center text-[10px]">
              <div className="text-teal-300">Server</div>
              <div className="text-white">handler(ctx, req)</div>
            </div>
          </div>
          <div className="text-[10px] space-y-1">
            <div className="rounded bg-teal-900/50 px-2 py-1">
              <span className="text-teal-400">Initial:</span> <span className="text-white">{state.labels.initial}</span>
            </div>
            <div className="rounded bg-teal-900/50 px-2 py-1">
              <span className="text-teal-400">Trailing:</span> <span className="text-white">{state.labels.trailing}</span>
            </div>
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2"></th><th className="py-1 pr-2">값</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-mono font-bold text-teal-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-gray-300">→</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.after}</td>
                  <td className="py-1 text-gray-700 font-mono text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ beat, state }) {
      const t = TONE[state.verdictTone] || TONE.info;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-teal-900">📨 Metadata 흐름</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <MetadataFlow state={state} />
          <SummaryTable summary={state.summary} />
          <div className={`mt-3 text-xs rounded p-2 ${state.verdictTone === 'danger' ? 'bg-rose-50 text-rose-900 border border-rose-300' : 'bg-teal-100 text-teal-900 border border-teal-300'}`}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap rounded-xl px-4 py-3" style={{backgroundColor:'#2DA6B0', color:'#ffffff'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-teal-700 font-bold">📨</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter III-1-1. Metadata (헤더 송수신)</h1>
                <p className="text-sm opacity-90">HTTP 헤더의 gRPC 버전 — Initial + Trailing</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-100'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-gray-900 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-gray-900 text-teal-300' : 'bg-teal-500 text-white hover:bg-teal-600'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-800 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-400 bg-white px-4 py-3 text-sm text-gray-900">
                <div className="font-bold mb-1 text-teal-900">✅ 핵심 정리</div>
                Metadata = HTTP/2 headers (Initial + Trailing). Go/Python 모두 동일 4 동작 — 클라 송신/응답수신, 서버 수신/응답송신. 인증·추적은 Interceptor 로 자동화하는 게 정석.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['metadata', 'http/2 headers', 'initial', 'trailing', 'authorization', 'x-request-id', '-bin'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-teal-900">
              <a href="../part2/II-2-2.html" className="underline hover:no-underline">← II-2-2 스트리밍 4 패턴</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 Auth (Bearer + mTLS) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
