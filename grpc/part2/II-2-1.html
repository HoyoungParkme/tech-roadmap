  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    gRPC Chapter II-2-1 — Client Streaming (N 요청 / 1 응답)
    학습 목표: 클라이언트가 여러 메시지를 스트림으로 보내고 서버가 끝에 응답 1개를 반환하는 패턴.
    패턴: fastapi v1 / gRPC teal #2DA6B0
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. Client Streaming 이란 — N 요청 / 1 응답',
        desc: 'Unary(1 요청 / 1 응답)와 달리 Client Streaming 은 클라이언트가 같은 RPC 위에서 요청 메시지를 여러 개 연속으로 흘려보내고, 서버는 그 스트림이 끝날 때 딱 응답 1개만 돌려준다. 대표 사례는 파일 청크 업로드(수백 MB 를 64KB 씩 쪼개 전송)와 배치 집계(수천 건 로그/센서 값을 보내 합계·평균을 받는 것)다. 핵심은 서버가 매 메시지마다 답하지 않고 누적만 하다가 종료 신호를 받고 최종 결과 1개를 만든다는 것. .proto 에서는 요청 타입 앞에만 stream 키워드가 붙는다.',
        active: 'overview',
        sent: 0,
        aggregate: null,
        closed: false,
        response: null,
        verdict: '개요',
        verdictTone: 'info',
        keyPoint: 'stream 은 요청 쪽에만. 서버는 누적하다가 종료 시 응답 1개.',
        code: {
          lang: 'protobuf',
          filename: 'upload.proto',
          lines: [
            '// Step 1. Client Streaming — .proto 정의',
            '',
            'syntax = "proto3";',
            'package upload.v1;',
            '',
            'service UploadService {',
            '  // stream 이 "요청 타입" 앞에만 붙는다 → Client Streaming',
            '  //   클라이언트: 여러 UploadRequest 를 연속 전송',
            '  //   서버:       마지막에 UploadResponse 1개 반환',
            '  rpc Upload(stream UploadRequest) returns (UploadResponse);',
            '',
            '  // 비교) Unary — stream 없음, 1:1',
            '  //   rpc GetInfo(InfoRequest) returns (InfoResponse);',
            '  // 비교) Server Streaming — 응답 쪽에 stream',
            '  //   rpc Watch(WatchRequest) returns (stream Event);',
            '}',
            '',
            '// 파일 청크 업로드용 요청 — 한 번에 64KB 씩',
            'message UploadRequest {',
            '  oneof payload {',
            '    FileMeta meta  = 1;   // 첫 메시지: 파일 이름/전체 크기',
            '    bytes    chunk = 2;   // 이후 메시지들: 바이트 청크',
            '  }',
            '}',
            '',
            'message FileMeta {',
            '  string filename    = 1;',
            '  int64  total_bytes = 2;',
            '}',
            '',
            '// 스트림이 끝나야 서버가 딱 1개 반환',
            'message UploadResponse {',
            '  string file_id      = 1;   // 저장된 파일 ID',
            '  int64  bytes_stored = 2;   // 실제 저장 바이트',
            '  uint32 chunk_count  = 3;   // 받은 청크 수',
            '}',
            '',
            '// ─────────────────────────────────────────────',
            '// 언제 쓰나 — 3 대 용도',
            '// ─────────────────────────────────────────────',
            '//  ① 파일/미디어 업로드  : 큰 입력을 청크로 분할 전송',
            '//  ② 배치 집계          : 대량 레코드 → 합계/평균/카운트 1개',
            '//  ③ 대량 로그/메트릭 수집: 이벤트 스트림 → 저장 완료 요약',
            '//',
            '// 공통점: "많이 보내고, 결과는 하나" → 왕복(round-trip) 최소화',
          ],
          highlight: [5, 6, 7, 8, 9, 17, 18, 19, 20, 21, 22, 23, 30, 31, 32, 33, 34, 35],
        },
      },
      {
        title: 'Step 2. 클라이언트 — Send() 반복 후 CloseAndRecv() (Go)',
        desc: 'Go 클라이언트는 client.Upload(ctx) 로 스트림 핸들을 얻고, 보낼 메시지마다 stream.Send(&req) 를 반복 호출한다. 전송이 끝나면 반드시 stream.CloseAndRecv() 를 호출한다. 이 한 번의 호출이 두 가지를 동시에 한다: 클라이언트 → 서버 방향 스트림을 닫아 "끝났다"는 신호(EOF)를 보내고, 그 자리에서 서버가 만든 응답 1개를 블로킹으로 받는다. Send 를 다 하고 CloseAndRecv 를 빠뜨리면 서버는 스트림 종료를 모른 채 영원히 대기한다. 백프레셔: Send 는 전송 버퍼가 차면 flow control 로 자동 대기하므로 클라이언트가 서버보다 빠르면 자연히 느려진다.',
        active: 'client',
        sent: 4,
        aggregate: null,
        closed: true,
        response: { file_id: 'f-8kd2', bytes_stored: 262144, chunk_count: 4 },
        verdict: '송신',
        verdictTone: 'good',
        keyPoint: 'Send() 루프 → CloseAndRecv() 한 방에 종료 신호 + 응답 수신.',
        code: {
          lang: 'go',
          filename: 'client_upload.go',
          lines: [
            '// Step 2. Go 클라이언트 — Send 루프 + CloseAndRecv',
            'package main',
            '',
            'import (',
            '    "context"',
            '    "io"',
            '    "log"',
            '    "os"',
            '    "time"',
            '',
            '    "google.golang.org/grpc"',
            '    "google.golang.org/grpc/credentials/insecure"',
            '    pb "example.com/upload/v1"',
            ')',
            '',
            'const chunkSize = 64 * 1024 // 64KB',
            '',
            'func uploadFile(client pb.UploadServiceClient, path string) error {',
            '    ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)',
            '    defer cancel()',
            '',
            '    // (1) 스트림 열기 — 아직 아무것도 안 보냄',
            '    stream, err := client.Upload(ctx)',
            '    if err != nil {',
            '        return err',
            '    }',
            '',
            '    file, err := os.Open(path)',

            <div className="flex justify-between text-white px-1">
              <span>chunks: {state.aggregate ? state.aggregate.chunks : sent > 0 ? sent : 0}</span>
              <span>bytes: {fmtBytes(state.aggregate ? state.aggregate.bytes : null)}</span>
            </div>
          </div>

          {/* 응답 1개 */}
          <div className="text-center text-teal-400 text-[10px] mb-1">
            {state.response ? '▲ SendAndClose() — 응답 1개' : '(스트림 진행 중 — 아직 응답 없음)'}
          </div>
          <div className={`rounded p-2 text-[10px] ${state.response ? 'bg-emerald-700 text-white' : 'bg-teal-900/40 text-teal-600'}`}>
            {state.response ? (
              <div>
                <div className="text-center text-emerald-200 mb-1">UploadResponse ×1</div>
                <div className="flex justify-between px-1">
                  <span>id: {state.response.file_id}</span>
                  <span>{state.response.chunk_count} chunks</span>
                  <span>{fmtBytes(state.response.bytes_stored)}</span>
                </div>
              </div>
            ) : (
              <div className="text-center">— 서버는 종료 신호를 기다리는 중 —</div>
            )}
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2"></th><th className="py-1 pr-2">값</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-mono font-bold text-teal-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-gray-300">→</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.after}</td>
                  <td className="py-1 text-gray-700 font-mono text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.info;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-teal-900">📤 Client Streaming 흐름</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          <StreamFlow state={state} />
          <SummaryTable summary={state.summary} />
          <div className={`mt-3 text-xs rounded p-2 ${state.verdictTone === 'danger' ? 'bg-rose-50 text-rose-900 border border-rose-300' : 'bg-teal-100 text-teal-900 border border-teal-300'}`}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap rounded-xl px-4 py-3" style={{backgroundColor:'#2DA6B0', color:'#ffffff'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-teal-700 font-bold">📤</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter II-2-1. Client Streaming</h1>
                <p className="text-sm opacity-90">N 요청 / 1 응답 — 많이 보내고, 결과는 하나</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-100'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-gray-900 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-gray-900 text-teal-300' : 'bg-teal-500 text-white hover:bg-teal-600'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-800 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-400 bg-white px-4 py-3 text-sm text-gray-900">
                <div className="font-bold mb-1 text-teal-900">✅ 핵심 정리</div>
                Client Streaming = N 요청 / 1 응답. 클라는 Send() 루프 후 CloseAndRecv()(Python 은 제너레이터 yield), 서버는 Recv() 루프 + io.EOF 후 SendAndClose()(Python 은 for + return). 종료 신호를 빠뜨리면 서버가 행에 걸리고, 응답은 반드시 1개다. 백프레셔는 HTTP/2 flow control 이 자동 처리. 다음은 반대 방향인 Server Streaming.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['client-streaming', 'stream-request', 'CloseAndRecv', 'SendAndClose', 'io.EOF', 'chunk-upload', 'backpressure'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-teal-900">
              <a href="./II-1-2.html" className="underline hover:no-underline">← II-1-2 이전</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 Server Streaming (1 요청 / N 응답) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
