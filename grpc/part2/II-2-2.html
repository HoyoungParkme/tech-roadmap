            '    // ── 메인: 메시지를 여러 개 Send ──',
            '    for _, text := range []string{"hello", "how are you", "bye"} {',
            '        err := stream.Send(&pb.Msg{',
            '            Room: "room-1", User: "alice", Text: text,',
            '            SentAt: time.Now().UnixMilli(),',
            '        })',
            '        if err != nil { log.Fatal(err) }',
            '        log.Printf("▶ alice: %s", text)',
            '        time.Sleep(300 * time.Millisecond)',
            '    }',
            '',
            '    // 보낼 게 끝남 → C→S 방향만 닫는다',
            '    // (서버는 여전히 남은 응답을 보낼 수 있음)',
            '    stream.CloseSend()',
            '',
            '    // 서버가 S→C 를 닫을 때까지 기다림',
            '    <-done',
            '    log.Println("대화 종료")',
            '}',
            '',
            '// ─────────────────────────────────────────────',
            '// Python 등가 (grpc.aio) — async for 로 대칭 처리',
            '// ─────────────────────────────────────────────',
            '//',
            '//   async def chat(stub):',
            '//       call = stub.Chat()',
            '//       async def send():',
            '//           for t in ["hi", "bye"]:',
            '//               await call.write(chat_pb2.Msg(text=t))',
            '//           await call.done_writing()   # = CloseSend',
            '//       asyncio.create_task(send())',
            '//       async for msg in call:          # = Recv 루프',
            '//           print("recv:", msg.text)',
          ],
          highlight: [26, 27, 30, 31, 32, 33, 34, 35, 36, 37, 44, 45, 49, 50, 51, 55, 56, 61, 62, 65, 66],
        },
      },
      {
        title: 'Step 5. 한 장 정리 — 전이중 종료 조율 + 함정',
        desc: 'Bidirectional 은 클라·서버가 독립 goroutine 으로 각각 Send/Recv 하는 게 전부다. 종료는 방향별로 독립: 클라의 CloseSend 는 C→S 만 닫고, 서버의 return 은 S→C 를 닫는다. 함정 3개: ① 같은 방향(Send끼리 또는 Recv끼리)을 여러 goroutine 에서 동시 호출하면 안 된다(데이터 레이스), Recv↔Send 는 안전. ② 한쪽만 CloseSend 하고 상대 응답을 안 받으면 데드락/누수 — 반드시 Recv 로 EOF 까지 소진. ③ HTTP/2 flow control 때문에 상대가 안 읽으면 Send 가 블로킹된다. 실무에선 채팅·협업·게임처럼 지속 연결 실시간 통신에 쓴다.',
        active: 'summary',
        phase: 'recap',
        verdict: '정리',
        verdictTone: 'warn',
        summary: {
          title: 'Bidirectional Streaming 한 장 요약',
          rows: [
            { metric: '패턴',     after: 'N ↔ N (전이중)',        delta: 'stream ↔ stream' },
            { metric: '.proto',   after: 'rpc Chat(stream) returns(stream)', delta: '양쪽 stream' },
            { metric: '동시성',   after: 'Recv 루프 + Send goroutine', delta: 'Recv↔Send 동시 OK' },
            { metric: '종료',     after: '방향별 독립',            delta: 'CloseSend / return' },
            { metric: '순서',     after: '방향 내부 FIFO',         delta: '두 방향은 독립' },
            { metric: '용도',     after: '채팅·협업·게임',         delta: '지속 연결 실시간' },
          ],
        },
        keyPoint: '독립 goroutine으로 Send/Recv, 종료는 방향별 조율. 같은 방향 동시호출 금지.',
        code: {
          lang: 'protobuf',
          filename: 'recap.proto',
          lines: [
            '// Step 5. Bidirectional Streaming 한 장 요약',
            '',
            '// ─────────────────────────────────────────────',
            '// 4 패턴 비교',
            '// ─────────────────────────────────────────────',
            '//',
            '//   Unary            :  Req         → Resp',
            '//   Server Streaming :  Req         → stream Resp',
            '//   Client Streaming :  stream Req  → Resp',
            '//   Bidirectional    :  stream Req  ↔ stream Resp   ← 이번',
            '',
            '// ─────────────────────────────────────────────',
            '// 전이중 실행 구조 (Go/Python 공통)',
            '// ─────────────────────────────────────────────',
            '//',
            '//   [goroutine 1]  for { stream.Recv() }   ← 받기 루프',
            '//   [goroutine 2]  for { stream.Send() }   ← 보내기 루프',
            '//',
            '//   · Recv 와 Send 를 다른 goroutine 에서 동시에 = 안전',
            '//   · Recv 끼리 / Send 끼리 동시 호출 = 금지 (레이스)',
            '',
            '// ─────────────────────────────────────────────',
            '// 종료 조율',
            '// ─────────────────────────────────────────────',
            '//',
            '//   클라 CloseSend()  → C→S 만 닫힘 (서버 Recv EOF)',
            '//   서버 return       → S→C 닫힘 (클라 Recv EOF)',
            '//   양쪽 EOF 도달     → 스트림 완전 종료 + status',
            '',
            '// ─────────────────────────────────────────────',
            '// 3 대 함정',
            '// ─────────────────────────────────────────────',
            '//',
            '//   ⚠ 같은 방향 동시 호출 금지',
            '//     Send 를 두 goroutine 에서? → 데이터 레이스',
            '//     보낼 소스는 채널 하나로 모아서 단일 Send',
            '//',
            '//   ⚠ 응답 스트림 끝까지 소진',
            '//     CloseSend 후에도 Recv 로 EOF 까지 읽어야',
            '//     리소스 누수/데드락 없음',
            '//',
            '//   ⚠ HTTP/2 flow control',
            '//     상대가 안 읽으면 Send 가 블로킹됨',
            '//     느린 소비자 대비 버퍼/타임아웃 설계',
            '',
            '// 실무: 실시간 채팅 · 협업 편집 · 게임 · 이벤트 동기화',
          ],
          highlight: [7, 8, 9, 10, 16, 17, 19, 20, 26, 27, 28, 34, 35, 36, 39, 40, 41, 43, 44, 45],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-teal-50',  border: 'border-teal-400', text: 'text-teal-900', badge: 'bg-teal-200 text-teal-900' },
      warn:   { bg: 'bg-amber-50', border: 'border-amber-400', text: 'text-amber-900', badge: 'bg-amber-200 text-amber-900' },
      info:   { bg: 'bg-sky-50',   border: 'border-sky-400',   text: 'text-sky-900',   badge: 'bg-sky-200 text-sky-900' },
      danger: { bg: 'bg-rose-50',  border: 'border-rose-400',  text: 'text-rose-800',  badge: 'bg-rose-200 text-rose-800' },
    };

    // 전이중 채팅 애니메이션 — 클라이언트/서버가 동시에 주고받는 두 독립 스트림
    function DuplexChat({ state }) {
      const [visible, setVisible] = useState(0);
      useEffect(() => {
        setVisible(0);
        const msgs = state.messages || [];
        const timers = msgs.map((_, i) =>
          setTimeout(() => setVisible((v) => Math.max(v, i + 1)), 350 * (i + 1))
        );
        return () => timers.forEach(clearTimeout);
      }, [state]);

      const msgs = state.messages || [];
      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-xs">
          <div className="flex items-center justify-between mb-2">
            <span className="text-teal-300">🔀 Full-Duplex Chat</span>
            <span className="text-[10px] text-gray-400">HTTP/2 단일 스트림</span>
          </div>
          <div className="flex items-center gap-2 mb-2">
            <div className="flex-1 rounded bg-teal-800/50 p-1.5 text-center text-[10px]">
              <div className="text-teal-300">Client</div>
              <div className="text-white">alice</div>
            </div>
            <div className="flex flex-col items-center text-[10px] leading-tight">
              <span className="text-emerald-400">━━▶</span>
              <span className="text-sky-400">◀━━</span>
            </div>
            <div className="flex-1 rounded bg-teal-800/50 p-1.5 text-center text-[10px]">
              <div className="text-teal-300">Server</div>
              <div className="text-white">chat.v1</div>
            </div>
          </div>
          <div className="space-y-1 min-h-[7rem]">
            {msgs.map((m, i) => {
              const shown = i < visible;
              const isUp = m.kind === 'up';
              return (
                <div key={i} className={`flex ${isUp ? 'justify-start' : 'justify-end'} transition-all duration-300 ${shown ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-1'}`}>
                  <div className={`max-w-[80%] rounded px-2 py-1 text-[10px] ${isUp ? 'bg-emerald-700/60 text-emerald-50' : 'bg-sky-700/60 text-sky-50'}`}>
                    <span className="opacity-70">{isUp ? 'C→S' : 'S→C'}</span> {m.text}
                  </div>
                </div>
              );
            })}
            {msgs.length === 0 && (
              <div className="text-gray-500 text-[10px] text-center pt-6">스트림 대기 중…</div>
            )}
          </div>
          <div className="mt-2 flex gap-2 text-[9px]">
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>C→S (독립)</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-sky-500 inline-block"></span>S→C (독립)</span>
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2"></th><th className="py-1 pr-2">값</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-mono font-bold text-teal-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-gray-300">→</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.after}</td>
                  <td className="py-1 text-gray-700 font-mono text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.info;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-teal-900">🔀 전이중 스트림</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          <DuplexChat state={state} />
          <SummaryTable summary={state.summary} />
          <div className={`mt-3 text-xs rounded p-2 ${state.verdictTone === 'danger' ? 'bg-rose-50 text-rose-900 border border-rose-300' : 'bg-teal-100 text-teal-900 border border-teal-300'}`}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap rounded-xl px-4 py-3" style={{backgroundColor:'#2DA6B0', color:'#ffffff'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-teal-700 font-bold">🔀</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter II-2-2. Bidirectional Streaming (N↔N)</h1>
                <p className="text-sm opacity-90">전이중 — 클라·서버가 독립 스트림으로 동시에 주고받는다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-100'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-gray-900 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-gray-900 text-teal-300' : 'bg-teal-500 text-white hover:bg-teal-600'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-800 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-400 bg-white px-4 py-3 text-sm text-gray-900">
                <div className="font-bold mb-1 text-teal-900">✅ 핵심 정리</div>
                Bidirectional Streaming = 전이중(N↔N). 클라·서버가 각자 독립 goroutine 으로 Send/Recv 를 동시에 한다. 종료는 방향별 독립(CloseSend → C→S, return → S→C). 같은 방향 동시 호출은 금지, Recv↔Send 동시는 안전. 실시간 채팅·협업·게임 같은 지속 연결 통신에 쓴다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['bidirectional', 'full-duplex', 'stream↔stream', 'goroutine', 'CloseSend', 'http/2', 'realtime-chat'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-teal-900">
              <a href="./II-2-1.html" className="underline hover:no-underline">← II-2-1 Client Streaming (N→1)</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 Metadata (헤더 송수신) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
