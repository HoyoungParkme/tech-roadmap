  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <script>window.LESSON = {"topic": "grpc", "topicName": "gRPC", "topicHref": "../index.html", "id": "IV-1-1", "title": "Status Code & Error 처리", "sub": "code + message + details — 서버 반환부터 재시도 판단까지", "path": "part4/IV-1-1.html", "prev": {"id": "III-2-2", "title": "Auth — token / mTLS", "href": "../part3/III-2-2.html"}, "next": {"id": "IV-1-2", "title": "Deadline / Timeout 전파", "href": "../part4/IV-1-2.html"}, "wrap": "에러는 (code, message, details) 세 층이다. 서버는 status.Error로 정확한 code를 반환하고, 클라이언트는 status.FromError → st.Code() 로만 분기한다. 재시도 여부는 code로 결정 — Unavailable은 재시도, InvalidArgument·NotFound는 즉시 중단. 구조화·다국어·필드 단위 정보는 details로, 정책은 인터셉터/retryPolicy로 중앙화한다."};</script>

  <!--
    gRPC Chapter IV-1-1 — Status Code & Error 처리
    학습 목표: gRPC status code 체계, code+message, error details, 재시도 판단.
    패턴: fastapi v1 / gRPC teal #2DA6B0
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // gRPC status code 카탈로그 — 실무에서 가장 자주 만나는 11개
    const CATALOG = [
      { code: 'OK',                 num: 0,  http: 200, retry: 'ok',    note: '정상' },
      { code: 'InvalidArgument',    num: 3,  http: 400, retry: 'no',    note: '요청 값 오류' },
      { code: 'Unauthenticated',    num: 16, http: 401, retry: 'no',    note: '인증 실패' },
      { code: 'PermissionDenied',   num: 7,  http: 403, retry: 'no',    note: '권한 없음' },
      { code: 'NotFound',           num: 5,  http: 404, retry: 'no',    note: '리소스 없음' },
      { code: 'AlreadyExists',      num: 6,  http: 409, retry: 'no',    note: '중복 생성' },
      { code: 'FailedPrecondition', num: 9,  http: 400, retry: 'no',    note: '상태 전제 불충족' },
      { code: 'ResourceExhausted',  num: 8,  http: 429, retry: 'back',  note: '쿼터/율 초과' },
      { code: 'DeadlineExceeded',   num: 4,  http: 504, retry: 'back',  note: '타임아웃' },
      { code: 'Unavailable',        num: 14, http: 503, retry: 'yes',   note: '일시 장애' },
      { code: 'Internal',           num: 13, http: 500, retry: 'no',    note: '서버 버그' },
    ];

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      overview: {lang:"go", filename:"status_overview.go", lines:[
        "// Step 1. gRPC Status Code 개요 — 코드가 곧 계약이다",
        "",
        "// gRPC 응답 = (code, message) + optional details",
        "//   code    : 정수 0~16 (기계가 switch 로 분기)",
        "//   message : 사람이 읽는 설명 (로그/UI용, 파싱 금지)",
        "//   details : 구조화된 부가 정보 (Step 4)",
        "",
        "import \"google.golang.org/grpc/codes\"",
        "",
        "// codes 패키지의 상수 — 총 17개 (OK 포함)",
        "const (",
        "    _ = iota",
        "    // codes.OK                = 0   // 유일한 성공",
        "    // codes.Canceled          = 1   // 클라이언트가 취소",
        "    // codes.Unknown           = 2   // 원인 불명",
        "    // codes.InvalidArgument   = 3   // 요청 값이 틀림 (재시도 X)",
        "    // codes.DeadlineExceeded  = 4   // 타임아웃",
        "    // codes.NotFound          = 5   // 리소스 없음",
        "    // codes.AlreadyExists     = 6   // 이미 존재 (중복 생성)",
        "    // codes.PermissionDenied  = 7   // 인증됐지만 권한 없음",
        "    // codes.ResourceExhausted = 8   // 쿼터/율 제한 초과",
        "    // codes.FailedPrecondition= 9   // 시스템 상태 전제 불충족",
        "    // codes.Aborted           = 10  // 동시성 충돌 (재시도 가능)",
        "    // codes.OutOfRange        = 11  // 범위 벗어남",
        "    // codes.Unimplemented     = 12  // 미구현 RPC",
        "    // codes.Internal          = 13  // 서버 내부 버그",
        "    // codes.Unavailable       = 14  // 일시 장애 (재시도 O)",
        "    // codes.DataLoss          = 15  // 복구 불가 손상",
        "    // codes.Unauthenticated   = 16  // 인증 자체 실패",
        ")",
        "",
        "// ─────────────────────────────────────────────",

      client: {lang:"go", filename:"client_handle.go", lines:[
        "// Step 3. 클라이언트 — 코드별 분기 + 재시도",
        "package main",
        "",
        "import (",
        "    \"context\"",
        "    \"time\"",
        "",
        "    \"google.golang.org/grpc/codes\"",
        "    \"google.golang.org/grpc/status\"",
        "    pb \"example.com/user/v1\"",
        ")",
        "",
        "func fetchUser(",
        "    ctx context.Context,",
        "    client pb.UserServiceClient,",
        "    id string,",
        ") (*pb.User, error) {",
        "    user, err := client.GetUser(ctx, &pb.GetUserRequest{UserId: id})",
        "    if err == nil {",
        "        return user, nil  // 성공",
        "    }",
        "",
        "    // (1) err 에서 status 추출",
        "    st, ok := status.FromError(err)",
        "    if !ok {",
        "        return nil, err  // gRPC status 가 아닌 에러",
        "    }",
        "",
        "    // (2) 코드로 분기 — message 는 절대 파싱 안 함",
        "    switch st.Code() {",
        "    case codes.NotFound:",
        "        return nil, ErrUserGone           // UI: \"없는 사용자\"",
        "    case codes.Unauthenticated:",
        "        redirectToLogin()                 // 로그인 화면으로",
        "        return nil, ErrNeedLogin",
        "    case codes.PermissionDenied:",
        "        return nil, ErrForbidden          // 403 화면",
        "    case codes.InvalidArgument:",
        "        return nil, st.Err()              // 입력 폼 에러 표시",
        "    case codes.Unavailable, codes.DeadlineExceeded:",
        "        return retryWithBackoff(ctx, client, id)  // 재시도!",
        "    default:",
        "        return nil, st.Err()              // Internal 등",
        "    }",
        "}",
        "",
        "// 지수 백오프 재시도 — Unavailable 계열만",
        "func retryWithBackoff(",
        "    ctx context.Context,",
        "    client pb.UserServiceClient,",
        "    id string,",
        ") (*pb.User, error) {",
        "    backoff := 100 * time.Millisecond",
        "    for attempt := 0; attempt < 3; attempt++ {",
        "        time.Sleep(backoff)",
        "        user, err := client.GetUser(ctx, &pb.GetUserRequest{UserId: id})",
        "        if err == nil {",
        "            return user, nil",
        "        }",
        "        // status.Code(err) — 코드만 바로 꺼내는 헬퍼",
        "        if status.Code(err) != codes.Unavailable {",
        "            return nil, err  // 재시도 불가 코드면 즉시 중단",
        "        }",
        "        backoff *= 2  // 100 → 200 → 400ms",
        "    }",
        "    return nil, status.Error(codes.Unavailable, \"재시도 소진\")",
        "}",
      ]},

        "    ei := &epb.ErrorInfo{",
        "        Reason:   \"INVALID_EMAIL\",",
        "        Domain:   \"user.example.com\",",
        "        Metadata: map[string]string{\"input\": email},",
        "    }",
        "",
        "    // (c) LocalizedMessage — 로케일별 사용자 문구",

        "    case codes.DeadlineExceeded, codes.ResourceExhausted:",

        code: {...CODE.recap, highlight:[12,13,14,15]},
      },
      { ...S5,
        beat:{
          label:"나머지는 전부 중단",
          at:"recap_retry.go L16–19",
          caption:"default는 false. Invalid·NotFound·PermissionDenied는 다시 보내도 결과가 같다.",
          changes:[
            {mark:"changed", text:"code → InvalidArgument(3)"},
            {mark:"gone", text:"재시도 경로 차단"},
          ],
        },
        active: "summary",
        status: "InvalidArgument",
        http: 400,
        clientAction: "fail",
        message: "isRetryable → false",
        verdict: "정리",
        verdictTone: "danger",
        keyPoint: "재시도 불가 코드를 재시도하면 부하만 늘어난다.",
        code: {...CODE.recap, highlight:[16,17,18,19]},
      },
      { ...S5,
        beat:{
          label:"설정으로 대체하기",
          at:"recap_retry.go L22–27",
          caption:"손코딩 대신 서비스 설정의 methodConfig / retryPolicy로 맡길 수 있다.",
          changes:[
            {mark:"new", text:"WithDefaultServiceConfig"},
            {mark:"read", text:"methodConfig 대상 지정"},
          ],
        },
        active: "summary",
        status: "OK",
        http: 200,
        clientAction: "summary",
        message: "methodConfig 설정",
        verdict: "정리",
        verdictTone: "info",
        keyPoint: "재시도 정책은 코드가 아니라 설정으로 중앙화한다.",
        code: {...CODE.recap, highlight:[22,23,24,25,26,27]},
      },
      { ...S5,
        beat:{
          label:"정책 값 채우기",
          at:"recap_retry.go L28–35",
          caption:"maxAttempts 4, 0.1s에서 1s까지 2배씩. retryableStatusCodes에는 UNAVAILABLE만 둔다.",
          changes:[
            {mark:"changed", text:"maxAttempts 4 · backoff 0.1→1s"},
            {mark:"read", text:"retryableStatusCodes=[UNAVAILABLE]"},
          ],
        },
        active: "summary",
        status: "Unavailable",
        http: 503,
        clientAction: "retry",
        message: "maxAttempts 4 · backoff 0.1→1s",
        verdict: "정리",
        verdictTone: "warn",
        keyPoint: "재시도 대상 코드는 좁게 — UNAVAILABLE부터 시작한다.",
        code: {...CODE.recap, highlight:[28,29,30,31,32,33,34,35]},
      },
      { ...S5,
        beat:{
          label:"3 대 함정",
          at:"recap_retry.go L41–43",
          caption:"raw error 반환, message substring 매칭, Internal 남발 — 셋 다 장애를 키운다.",
          changes:[
            {mark:"gone", text:"raw error / message 매칭"},
            {mark:"changed", text:"code → Internal(13)"},
          ],
        },
        active: "summary",
        status: "Internal",
        http: 500,
        clientAction: "fail",
        message: "Internal 남발 주의",
        verdict: "정리",
        verdictTone: "danger",
        keyPoint: "Internal은 재시도 불가라 장애가 그대로 사용자에게 간다.",
        code: {...CODE.recap, highlight:[41,42,43]},
      },
      { ...S5,
        beat:{
          label:"다음 장으로",
          at:"recap_retry.go L48–50",
          caption:"다음 장은 DeadlineExceeded(4)를 만드는 마감 시각과, 그 마감이 호출 체인 전체로 전파되는 방식이다.",
          changes:[
            {mark:"new", text:"요약표 표시"},
            {mark:"read", text:"다음: IV-1-2 Deadline"},
          ],
        },
        active: "summary",
        status: "OK",
        http: 200,
        clientAction: "summary",
        message: "재시도 정책 요약",
        verdict: "정리",
        verdictTone: "info",
        keyPoint: "재시도 여부는 code로 결정. Unavailable=재시도, InvalidArgument=중단. 정책은 중앙화.",
        summary: {title:"Status Code 처리 한 장 요약", rows:[
          {metric:"반환",     after:"status.Error(code, msg)", delta:"errors.New 금지"},
          {metric:"추출",     after:"status.FromError / Code", delta:"message 파싱 금지"},
          {metric:"재시도 O", after:"Unavailable",             delta:"백오프 후 재시도"},
          {metric:"조건부",   after:"Deadline / Resource",     delta:"백오프+상한"},
          {metric:"재시도 X", after:"Invalid / NotFound",      delta:"즉시 중단"},
          {metric:"상세",     after:"WithDetails / Details()", delta:"BadRequest·ErrorInfo"},
        ]},
        code: {...CODE.recap, highlight:[48,49,50]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-teal-50',  border: 'border-teal-400', text: 'text-teal-900', badge: 'bg-teal-200 text-teal-900' },
      warn:   { bg: 'bg-amber-50', border: 'border-amber-400', text: 'text-amber-900', badge: 'bg-amber-200 text-amber-900' },
      info:   { bg: 'bg-sky-50',   border: 'border-sky-400',   text: 'text-sky-900',   badge: 'bg-sky-200 text-sky-900' },
      danger: { bg: 'bg-rose-50',  border: 'border-rose-400',  text: 'text-rose-800',  badge: 'bg-rose-200 text-rose-800' },
    };

    const RETRY_STYLE = {
      ok:   { label: '정상',   cls: 'text-emerald-600' },
      no:   { label: '중단',   cls: 'text-rose-600' },
      back: { label: '백오프', cls: 'text-amber-600' },
      yes:  { label: '재시도', cls: 'text-teal-600' },
    };

    // 표·정리 보기: 자주 만나는 상태 코드 11개 (재시도 판단 · grpc-gateway HTTP 매핑). 지금 단계의 코드를 강조한다
    function RefPanel({ step }) {
      const active = step.status;
      return (
        <div>
          <h4>Status Code 카탈로그 — 자주 만나는 11개</h4>
          <table>
            <thead><tr><th>code</th><th>번호</th><th>HTTP</th><th>재시도</th><th>의미</th></tr></thead>
            <tbody>{CATALOG.map((r) => (
              <tr key={r.code} style={r.code === active ? { background: '#f0fdfa', fontWeight: 700 } : null}>
                <td className="font-mono">{r.code === active ? '▶ ' : ''}{r.code}</td><td className="font-mono">{r.num}</td><td className="font-mono">{r.http}</td>
                <td>{RETRY_STYLE[r.retry].label}</td><td>{r.note}</td>
              </tr>))}</tbody>
          </table>
          <p className="mt-1">HTTP 열은 grpc-gateway 가 REST 로 바꿀 때의 값이다. gRPC 와이어에서는 :status 가 늘 200 이고 실제 결과는 grpc-status 트레일러에 실린다.</p>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2"></th><th className="py-1 pr-2">값</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-mono font-bold text-teal-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-gray-300">→</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.after}</td>
                  <td className="py-1 text-gray-700 font-mono text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }


    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
