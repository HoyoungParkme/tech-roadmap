            '#     use: [FILE]            # 파일 단위 호환성 검사',
            '',
            '# ─────────────────────────────────────────────',
            '# 실무 명령 흐름 (protoc 대비 짧다)',
            '# ─────────────────────────────────────────────',
            '#',
            '#   buf lint                 # 스타일 위반 잡기',
            '#   buf breaking \\',
            '#     --against ".git#branch=main"   # main 대비 깨짐 감지',
            '#   buf generate             # Go + Python 동시 생성',
            '#',
            '# CI 예: PR 에서 lint + breaking 을 돌려',
            '#   호환성 깨는 proto 변경을 merge 전에 차단한다.',
            '#',
            '# protoc 한 줄: protoc --go_out=... --go-grpc_out=... (플래그 지옥)',
            '# buf 한 줄:    buf generate            (선언은 yaml 에)',
          ],
          highlight: [3, 5, 6, 7, 8, 9, 10, 11, 12, 13, 15, 16, 17, 18, 19, 26, 27, 28, 29, 35, 36, 37, 38],
        },
      },
      {
        title: 'Step 5. 한 장 정리 — 생성물 3종 + 빌드 통합 + 버전관리',
        desc: '어떤 언어든 생성물은 3종: 메시지(직렬화), 서버 base(구현할 인터페이스), 클라이언트 stub(원격 호출). 실무 결정 2가지가 남는다. ① 커밋 vs 빌드시 생성 — 생성물을 저장소에 커밋하면 CI 가 단순하고 IDE 가 바로 인식하지만 diff 가 지저분하다. 빌드 때 생성하면 저장소는 깨끗하지만 모두가 protoc/buf 를 설치해야 한다(요즘은 buf remote 로 완화). ② 변경 흐름 — proto 수정 → 재생성 → 서버/클라 반영을 한 사이클로 묶고, buf breaking 으로 호환성을 지킨다. 생성 파일은 절대 손대지 않는다.',
        active: 'summary',
        tool: 'both',
        langFocus: 'both',
        stage: 'recap',
        verdict: '정리',
        verdictTone: 'warn',
        summary: {
          title: 'Code Generation 한 장 요약',
          rows: [
            { metric: '엔진',        after: 'protoc / buf',           delta: 'buf = 선언적 wrapper' },
            { metric: 'Go 플러그인', after: 'go + go-grpc',           delta: '.pb.go + _grpc.pb.go' },
            { metric: 'Py 도구',     after: 'grpcio-tools',           delta: '_pb2.py + _pb2_grpc.py' },
            { metric: '생성물 3종',  after: '메시지 / 서버base / stub', delta: '언어 무관 동형' },
            { metric: 'buf 안전망',  after: 'lint + breaking',        delta: 'CI 에서 깨짐 차단' },
            { metric: '버전관리',    after: '커밋 vs 빌드생성',        delta: 'remote 로 절충' },
          ],
        },
        keyPoint: '생성물은 손대지 말 것. proto→재생성→반영을 한 사이클로. breaking 으로 호환성 유지.',
        code: {
          lang: 'bash',
          filename: 'workflow.sh',
          lines: [
            '#!/usr/bin/env bash',
            '# Step 5. Code Generation 워크플로우 한 장',
            '',
            '# ─────────────────────────────────────────────',
            '# 생성물 3종 (언어 무관)',
            '# ─────────────────────────────────────────────',
            '#   ① 메시지     : 직렬화/역직렬화 코드 (struct / class)',
            '#   ② 서버 base  : 내가 구현할 인터페이스 (Server / Servicer)',
            '#   ③ client stub: 원격 호출을 로컬 함수처럼 (Client / Stub)',
            '',
            '# ─────────────────────────────────────────────',
            '# 언어별 산출 파일',
            '# ─────────────────────────────────────────────',
            '#   Go     : user.pb.go        (메시지)',
            '#            user_grpc.pb.go   (서버base + stub)',
            '#   Python : user_pb2.py       (메시지)',
            '#            user_pb2_grpc.py  (Servicer + Stub)',
            '',
            '# ─────────────────────────────────────────────',
            '# 실무 변경 사이클 — proto 수정 시 매번',
            '# ─────────────────────────────────────────────',
            'buf lint                                  # 1. 스타일 검사',
            'buf breaking --against ".git#branch=main" # 2. 호환성 깨짐 감지',
            'buf generate                              # 3. Go+Python 재생성',
            'go build ./... && pytest                  # 4. 서버/클라 반영 확인',
            '',
            '# ─────────────────────────────────────────────',
            '# 결정 1 — 생성물 커밋 vs 빌드시 생성',
            '# ─────────────────────────────────────────────',
            '#   커밋      : CI 단순 + IDE 즉시 인식 / diff 지저분',
            '#   빌드 생성 : 저장소 깨끗 / 모두 툴 설치 필요',
            '#   → buf remote 플러그인이면 로컬 설치 부담 없이 절충',
            '',
            '# ─────────────────────────────────────────────',
            '# 3 대 원칙',
            '# ─────────────────────────────────────────────',
            '#   ⚠ 생성 파일은 절대 손으로 수정하지 말 것 (재생성 시 덮어씀)',
            '#   ⚠ .proto 가 유일한 진실 — 코드는 항상 파생물',
            '#   ⚠ breaking 검사로 배포된 클라이언트를 깨지 말 것',
            '',
            '# 다음 챕터(II-1-1): 생성된 stub 로 첫 서버/클라이언트 구현',
          ],
          highlight: [6, 7, 8, 13, 14, 15, 16, 21, 22, 23, 24, 29, 30, 31, 36, 37, 38],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-teal-50',  border: 'border-teal-400', text: 'text-teal-900', badge: 'bg-teal-200 text-teal-900' },
      warn:   { bg: 'bg-amber-50', border: 'border-amber-400', text: 'text-amber-900', badge: 'bg-amber-200 text-amber-900' },
      info:   { bg: 'bg-sky-50',   border: 'border-sky-400',   text: 'text-sky-900',   badge: 'bg-sky-200 text-sky-900' },
      danger: { bg: 'bg-rose-50',  border: 'border-rose-400',  text: 'text-rose-800',  badge: 'bg-rose-200 text-rose-800' },
    };

    function GenPipeline({ state }) {
      const goOn = state.langFocus === 'go' || state.langFocus === 'both';
      const pyOn = state.langFocus === 'python' || state.langFocus === 'both';
      const toolBuf = state.tool === 'buf' || state.tool === 'both';
      const toolProtoc = state.tool === 'protoc' || state.tool === 'both';

      const artifact = (label, sub, on) => (
        <div className={`rounded px-2 py-1 border text-[10px] ${on ? 'bg-teal-800/60 border-teal-400 text-white' : 'bg-gray-800/40 border-gray-600 text-gray-400'}`}>
          <div className="font-bold">{label}</div>
          <div className="opacity-80">{sub}</div>
        </div>
      );

      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-xs">
          <div className="text-teal-300 mb-2">⚙️ Code Generation Pipeline</div>

          {/* source */}
          <div className="flex items-center gap-2 mb-2">
            <div className="rounded bg-teal-700/50 px-3 py-2 text-center text-[11px] border border-teal-400">
              <div className="text-teal-200 text-[9px]">SOURCE (IDL)</div>
              <div className="text-white font-bold">user.proto</div>
            </div>
            <div className="text-teal-400 text-lg">&rarr;</div>
            {/* engine */}
            <div className="flex flex-col gap-1">
              <div className={`rounded px-2 py-1 text-center text-[10px] border ${toolProtoc ? 'bg-cyan-800/70 border-cyan-400 text-white' : 'bg-gray-800/40 border-gray-600 text-gray-500'}`}>protoc + plugins</div>
              <div className={`rounded px-2 py-1 text-center text-[10px] border ${toolBuf ? 'bg-cyan-800/70 border-cyan-400 text-white' : 'bg-gray-800/40 border-gray-600 text-gray-500'}`}>buf generate</div>
            </div>
            <div className="text-teal-400 text-lg">&rarr;</div>
          </div>

          {/* outputs */}
          <div className="grid grid-cols-2 gap-2">
            <div className={`rounded p-2 border ${goOn ? 'border-teal-400 bg-teal-900/30' : 'border-gray-700 bg-gray-800/20'}`}>
              <div className={`text-[10px] mb-1 font-bold ${goOn ? 'text-teal-300' : 'text-gray-500'}`}>Go</div>
              <div className="space-y-1">
                {artifact('메시지', 'user.pb.go', goOn)}
                {artifact('서버 base', 'UserServiceServer', goOn)}
                {artifact('client stub', 'UserServiceClient', goOn)}
              </div>
            </div>
            <div className={`rounded p-2 border ${pyOn ? 'border-teal-400 bg-teal-900/30' : 'border-gray-700 bg-gray-800/20'}`}>
              <div className={`text-[10px] mb-1 font-bold ${pyOn ? 'text-teal-300' : 'text-gray-500'}`}>Python</div>
              <div className="space-y-1">
                {artifact('메시지', 'user_pb2.py', pyOn)}
                {artifact('서버 base', 'UserServiceServicer', pyOn)}
                {artifact('client stub', 'UserServiceStub', pyOn)}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2"></th><th className="py-1 pr-2">값</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-mono font-bold text-teal-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-gray-300">&rarr;</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.after}</td>
                  <td className="py-1 text-gray-700 font-mono text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.info;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-teal-900">⚙️ .proto → 언어별 코드</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          <GenPipeline state={state} />
          <SummaryTable summary={state.summary} />
          <div className={`mt-3 text-xs rounded p-2 ${state.verdictTone === 'danger' ? 'bg-rose-50 text-rose-900 border border-rose-300' : 'bg-teal-100 text-teal-900 border border-teal-300'}`}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap rounded-xl px-4 py-3" style={{backgroundColor:'#2DA6B0', color:'#ffffff'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-teal-700 font-bold">⚙️</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter I-2-2. Code Generation (.proto → Go/Python)</h1>
                <p className="text-sm opacity-90">protoc / buf 로 메시지 · 서버 base · 클라이언트 stub 생성</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline">&larr; 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-100'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-gray-900 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">&larr; 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-gray-900 text-teal-300' : 'bg-teal-500 text-white hover:bg-teal-600'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">다음 &rarr;</button>
            </div>
            <div className="text-center text-[10px] text-teal-800 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-400 bg-white px-4 py-3 text-sm text-gray-900">
                <div className="font-bold mb-1 text-teal-900">✅ 핵심 정리</div>
                .proto 는 유일한 진실, 코드는 파생물이다. protoc/buf 가 메시지·서버 base·클라이언트 stub 3종을 언어별로 생성한다. Go(go+go-grpc) 와 Python(grpcio-tools) 은 API 이름만 다를 뿐 구조는 동형. buf 로 lint/breaking 을 CI 에 걸어 호환성을 지키고, 생성 파일은 절대 손대지 않는다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['code-generation', 'protoc', 'protoc-gen-go', 'grpcio-tools', 'buf', 'stub', 'servicer', 'buf.gen.yaml'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-teal-900">
              <a href="./I-2-1.html" className="underline hover:no-underline">&larr; I-2-1 .proto 문법</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 첫 서버/클라이언트 &rarr;</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
