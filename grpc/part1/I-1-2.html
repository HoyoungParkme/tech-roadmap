            '# → { "id": "42", "name": "Alice" }',
            '',
            '# 내부 서비스끼리는 같은 서버를 gRPC 로 직접 호출.',
            '# 하나의 .proto 에서 두 인터페이스가 동시에 나온다.',
            '',
            '# 정리:',
            '#   내부 MSA  → gRPC (저지연·타입안전·스트리밍)',
            '#   외부 공개 → REST (브라우저·캐싱·생태계)',
            '#   둘 사이   → grpc-gateway 로 브릿지',
          ],
          highlight: [1, 2, 3, 4, 5, 11, 12, 13, 14],
        },
        grpc: {
          lang: 'protobuf', filename: 'user_gateway.proto',
          lines: [
            '// Step 5. .proto 에 HTTP 매핑을 달면 REST 도 자동 생성.',
            'import "google/api/annotations.proto";',
            '',
            'service UserService {',
            '  rpc GetUser(GetUserRequest) returns (User) {',
            '    // 이 gRPC 메서드를 REST GET 으로도 노출',
            '    option (google.api.http) = {',
            '      get: "/v1/users/{user_id}"',
            '    };',
            '  }',
            '}',
            '',
            '// 하나의 서비스 정의에서:',
            '//   - 내부: client.GetUser(...)      (gRPC, 바이너리)',
            '//   - 외부: GET /v1/users/42          (REST, JSON)',
            '//',
            '// 내부는 gRPC, 외부는 REST — 실무 표준 구성.',
            '// 다음 장(I-2-1): Protocol Buffers 로 계약 깊이 파기.',
          ],
          highlight: [1, 4, 5, 6, 7, 8, 9, 13, 14, 15, 17, 18],
        },
      },
    ];

    const TONE = {
      good:   { badge: 'bg-teal-200 text-teal-900' },
      warn:   { badge: 'bg-amber-200 text-amber-900' },
      info:   { badge: 'bg-sky-200 text-sky-900' },
      danger: { badge: 'bg-rose-200 text-rose-800' },
    };

    // 좌측: REST vs gRPC 를 나란히 비교. STEP 의 focus 에 해당하는 행을 강조.
    const COMPARE_ROWS = [
      { key: 'model',    label: '호출 모델', rest: '자원 + HTTP 동사',   grpc: '메서드 호출(stub)' },
      { key: 'contract', label: '계약',      rest: 'OpenAPI 문서',       grpc: '.proto → 코드생성' },
      { key: 'payload',  label: '페이로드',  rest: 'JSON 78B',           grpc: 'protobuf 12B' },
      { key: 'stream',   label: '스트리밍',  rest: '별도 SSE/WS',        grpc: '4종 내장' },
      { key: 'choose',   label: '적합처',    rest: '공개 API·브라우저',  grpc: '내부 MSA·저지연' },
    ];

    function CompareTable({ focus }) {
      return (
        <div className="rounded-lg overflow-hidden border border-teal-200">
          <div className="grid grid-cols-[80px_1fr_1fr] text-[11px] font-bold bg-gray-900 text-teal-50">
            <div className="px-2 py-1.5">항목</div>
            <div className="px-2 py-1.5 border-l border-gray-700 text-amber-200">REST / JSON</div>
            <div className="px-2 py-1.5 border-l border-gray-700 text-teal-200">gRPC / protobuf</div>
          </div>
          {COMPARE_ROWS.map((r) => {
            const on = r.key === focus;
            return (
              <div key={r.key} className={`grid grid-cols-[80px_1fr_1fr] text-[11px] border-t border-gray-100 ${on ? 'bg-teal-50' : 'bg-white'}`}>
                <div className={`px-2 py-1.5 font-bold ${on ? 'text-teal-900' : 'text-gray-600'}`}>{r.label}</div>
                <div className={`px-2 py-1.5 border-l border-gray-100 font-mono ${on ? 'text-amber-700 font-bold' : 'text-gray-500'}`}>{r.rest}</div>
                <div className={`px-2 py-1.5 border-l border-gray-100 font-mono ${on ? 'text-teal-700 font-bold' : 'text-gray-500'}`}>{r.grpc}</div>
              </div>
            );
          })}
        </div>
      );
    }

    // 같은 "사용자 조회"를 REST 왕복 vs gRPC stub 왕복으로 나란히 그린다.
    function CallDiagram({ focus }) {
      const payloadFocus = focus === 'payload';
      const streamFocus = focus === 'stream';
      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-[10px] mb-3">
          <div className="grid grid-cols-2 gap-2">
            <div className="rounded bg-amber-900/30 p-2">
              <div className="text-amber-300 font-bold mb-1">REST</div>
              <div className="text-white">GET /users/42</div>
              <div className="text-amber-200">━━▶ HTTP/1.1</div>
              <div className="text-white">&larr;&larr; JSON {payloadFocus ? '78 bytes' : '{...}'}</div>
              {streamFocus && <div className="text-rose-300 mt-1">실시간 → 폴링/SSE 별도</div>}
            </div>
            <div className="rounded bg-teal-900/40 p-2">
              <div className="text-teal-300 font-bold mb-1">gRPC</div>
              <div className="text-white">client.GetUser(42)</div>
              <div className="text-teal-200">━━▶ HTTP/2 mux</div>
              <div className="text-white">&larr;&larr; protobuf {payloadFocus ? '12 bytes' : '<bin>'}</div>
              {streamFocus && <div className="text-emerald-300 mt-1">stream 내장(4종)</div>}
            </div>
          </div>
          {payloadFocus && (
            <div className="mt-2">
              <div className="flex items-center gap-1"><span className="w-12 text-amber-300">JSON</span><div className="h-2 rounded bg-amber-400" style={{width:'78%'}}></div><span className="ml-1">78B</span></div>
              <div className="flex items-center gap-1"><span className="w-12 text-teal-300">proto</span><div className="h-2 rounded bg-teal-400" style={{width:'12%'}}></div><span className="ml-1">12B</span></div>
            </div>
          )}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-[11px]">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th>
                <th className="py-1 pr-2 text-amber-700">REST</th>
                <th className="py-1 text-teal-700">gRPC</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-bold text-gray-800">{r.metric}</td>
                  <td className="py-1 pr-2 font-mono text-amber-700">{r.rest}</td>
                  <td className="py-1 font-mono text-teal-700">{r.grpc}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.info;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-teal-900">🔀 REST vs gRPC 비교</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          <CallDiagram focus={state.focus} />
          <CompareTable focus={state.focus} />
          <SummaryTable summary={state.summary} />
          <div className="mt-3 text-xs rounded p-2 bg-teal-100 text-teal-900 border border-teal-300">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ codePair, defaultTab, stepIdx, total }) {
      const [tab, setTab] = useState(defaultTab);
      useEffect(() => { setTab(defaultTab); }, [defaultTab, stepIdx]);
      const code = codePair[tab];
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code, tab, stepIdx]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      const tabBtn = (id, label, color) => (
        <button
          onClick={() => setTab(id)}
          className={`px-3 py-1 text-[11px] font-mono rounded-t border-b-2 ${tab === id ? `${color} bg-[#282c34] text-white` : 'border-transparent bg-gray-800 text-gray-400 hover:text-gray-200'}`}
        >{label}</button>
      );

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex gap-1 px-2 pt-1.5 bg-gray-800 border-b border-gray-700">
            {tabBtn('rest', 'REST · curl/JSON', 'border-amber-400')}
            {tabBtn('grpc', 'gRPC · stub', 'border-teal-400')}
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap rounded-xl px-4 py-3" style={{backgroundColor:'#2DA6B0', color:'#ffffff'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-teal-700 font-bold">🔀</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter I-1-2. RPC vs REST</h1>
                <p className="text-sm opacity-90">함수 호출 모델 — 자원(REST) vs 메서드(gRPC)</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-100'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-gray-900 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer codePair={CODE[stepIdx]} defaultTab={step.tab} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-gray-900 text-teal-300' : 'bg-teal-500 text-white hover:bg-teal-600'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-800 mt-2">키보드 ←/→ · 자동재생 3초/단계 · 코드탭 REST/gRPC 전환</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-400 bg-white px-4 py-3 text-sm text-gray-900">
                <div className="font-bold mb-1 text-teal-900">✅ 핵심 정리</div>
                REST 는 자원+HTTP 동사(브라우저·공개 API 에 강함), gRPC 는 메서드 호출+protobuf/HTTP2(내부 MSA·저지연·스트리밍에 강함). 계약은 OpenAPI 문서 vs .proto 코드생성. 실무는 내부 gRPC · 외부 REST 를 grpc-gateway 로 브릿지한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['rpc', 'rest', 'stub', 'protobuf', 'openapi', 'http/2', 'grpc-web', 'grpc-gateway'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-teal-900">
              <a href="./I-1-1.html" className="underline hover:no-underline">← I-1-1 gRPC 란 무엇인가</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 Protocol Buffers →</a>
            </nav>
            <div className="mt-2 text-center">
              <a href="../index.html" className="text-[11px] text-teal-700 underline hover:no-underline">← 목차</a>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
