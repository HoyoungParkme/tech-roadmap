          rows: [
            { metric: '정체',       after: '언어 중립 IDL',        delta: 'protoc → 언어별 코드' },
            { metric: 'message',   after: '타입 이름 = 번호',      delta: '번호 = wire 식별자' },
            { metric: 'service',   after: 'rpc 요청→응답',        delta: '서버 IF + 클라 스텁' },
            { metric: '직렬화',    after: '번호+값 바이너리',      delta: 'JSON 보다 작고 빠름' },
            { metric: '하위호환',  after: '추가는 새 번호',        delta: '삭제는 reserved' },
            { metric: '금지',      after: '필드 번호 재사용',      delta: '옛 데이터 오해석' },
          ],
        },
        keyPoint: '계약 우선으로 .proto 부터 합의. 필드 번호는 영원 — 재사용 절대 금지, 삭제는 reserved.',
        code: {
          lang: 'protobuf',
          filename: 'user.proto',
          lines: [
            '// Step 5. 하위호환 규칙 — 필드 번호는 영원하다',
            'syntax = "proto3";',
            'package user.v1;',
            '',
            'message User {',
            '  string id   = 1;',
            '  string name = 2;',
            '  int32  age  = 3;',
            '',
            '  // ✅ 필드 추가: 새 번호를 쓴다',
            '  //    구버전 클라는 4번을 모르니 그냥 무시 (안전)',
            '  string email = 4;',
            '',
            '  // ✅ 필드 삭제: 번호(와 이름)를 reserved 로 잠근다',
            '  //    → 실수로 재사용하면 컴파일 에러로 막아줌',
            '  reserved 5, 6;',
            '  reserved "phone", "fax";',
            '}',
            '',
            '// ─────────────────────────────────────────────',
            '// 하위호환 규칙 요약',
            '// ─────────────────────────────────────────────',
            '//   ✅ 필드 추가       → 새 번호 부여',
            '//   ✅ 필드 삭제       → reserved 로 번호 잠금',
            '//   ✅ 필드 이름 변경  → 이름은 wire 에 없어서 OK (호환)',
            '//',
            '//   ❌ 필드 번호 재사용 → 옛 데이터가 엉뚱한 필드로 해석',
            '//   ❌ 필드 타입 변경   → int32→string 등 깨짐',
            '//   ❌ required 사용    → proto3 에서 아예 제거됨',
            '',
            '// ─────────────────────────────────────────────',
            '// 계약 우선(contract-first) 실무 흐름',
            '// ─────────────────────────────────────────────',
            '//   1) .proto 를 팀이 먼저 리뷰·합의 (API 설계)',
            '//   2) protoc 로 서버·클라 코드 생성',
            '//   3) 서버는 인터페이스 구현, 클라는 스텁 호출',
            '//   4) 변경 시 buf lint / buf breaking 으로 호환성 검사',
            '',
            '// 다음 챕터(I-1-2): protoc 컴파일과 생성 코드 뜯어보기',
          ],
          highlight: [12, 16, 17, 23, 24, 25, 27, 28, 29, 35, 36, 37, 38],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-teal-50',  border: 'border-teal-400', text: 'text-teal-900', badge: 'bg-teal-200 text-teal-900' },
      warn:   { bg: 'bg-amber-50', border: 'border-amber-400', text: 'text-amber-900', badge: 'bg-amber-200 text-amber-900' },
      info:   { bg: 'bg-sky-50',   border: 'border-sky-400',   text: 'text-sky-900',   badge: 'bg-sky-200 text-sky-900' },
      danger: { bg: 'bg-rose-50',  border: 'border-rose-400',  text: 'text-rose-800',  badge: 'bg-rose-200 text-rose-800' },
    };

    const KIND_COLOR = {
      scalar:   'bg-teal-800/60 text-teal-100',
      repeated: 'bg-indigo-800/60 text-indigo-100',
      enum:     'bg-amber-800/60 text-amber-100',
    };

    // Step 1 — 개요: .proto 한 파일이 여러 언어로 갈라지는 그림
    function IdlView() {
      const langs = ['Go', 'Python', 'TypeScript', 'Java'];
      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-xs">
          <div className="text-teal-300 mb-2">📜 단일 계약 → 언어별 코드</div>
          <div className="rounded bg-teal-800/60 px-3 py-2 text-center text-white mb-2">
            user.proto <span className="text-teal-300">(message + service)</span>
          </div>
          <div className="text-center text-teal-400 mb-1">│ protoc │</div>
          <div className="grid grid-cols-2 gap-2">
            {langs.map((l) => (
              <div key={l} className="rounded bg-gray-800 px-2 py-1.5 text-center text-[10px]">
                <div className="text-teal-300">{l}</div>
                <div className="text-white">생성 코드</div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-teal-200/80">→ 모든 언어가 같은 정의에서 출발 (타입·이름 100% 일치)</div>
        </div>
      );
    }

    // Step 2 — message: 필드 번호 테이블
    function MessageView({ fields }) {
      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-xs">
          <div className="text-teal-300 mb-2">📦 message User — 파싱 결과</div>
          <div className="space-y-1">
            {fields.map((f) => (
              <div key={f.num} className="flex items-center gap-2">
                <span className="w-6 h-6 flex items-center justify-center rounded bg-teal-500 text-white font-bold">{f.num}</span>
                <span className="text-teal-300 w-32">{f.type}</span>
                <span className="text-white flex-1">{f.name}</span>
                <span className={`text-[9px] px-1.5 py-0.5 rounded ${KIND_COLOR[f.kind] || KIND_COLOR.scalar}`}>{f.kind}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-teal-200/80">번호 = wire 식별자. 1~15 는 태그 1바이트</div>
        </div>
      );
    }

    // Step 3 — service: rpc 시그니처
    function ServiceView({ rpcs }) {
      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-xs">
          <div className="text-teal-300 mb-2">🔌 service UserService — rpc 목록</div>
          <div className="space-y-1.5">
            {rpcs.map((r) => (
              <div key={r.name} className="rounded bg-gray-800 px-2 py-1.5">
                <span className="text-teal-300">rpc </span>
                <span className="text-white font-bold">{r.name}</span>
                <div className="ml-4 text-[10px] mt-0.5">
                  <span className="text-indigo-300">{r.req}</span>
                  <span className="text-teal-400"> &rarr; </span>
                  <span className="text-emerald-300">{r.res}</span>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-teal-200/80">요청 message &rarr; 응답 message. protoc 가 스텁 생성</div>
        </div>
      );
    }

    // Step 4 — wire: 바이트 인코딩 + 크기 비교
    function WireView({ wire, sizes }) {
      const jsonW = 100;
      const protoW = Math.round((sizes.proto / sizes.json) * 100);
      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-xs">
          <div className="text-teal-300 mb-2">🧬 wire 인코딩 — User{'{'}id, name, age{'}'}</div>
          <div className="space-y-1 mb-3">
            {wire.map((w) => (
              <div key={w.tag} className="rounded bg-gray-800 px-2 py-1">
                <div>
                  <span className="text-amber-300">{w.tag}</span>
                  <span className="text-gray-400"> {w.bytes}</span>
                </div>
                <div className="text-[10px] text-teal-200/80">{w.meaning} = <span className="text-white">{w.text}</span></div>
              </div>
            ))}
          </div>
          <div className="text-[10px] text-teal-300 mb-1">크기 비교 (같은 데이터)</div>
          <div className="space-y-1">
            <div className="flex items-center gap-2">
              <span className="w-16 text-gray-300">JSON</span>
              <div className="flex-1 bg-gray-800 rounded h-4">
                <div className="h-4 rounded bg-rose-500/70 flex items-center justify-end pr-1" style={{width: jsonW + '%'}}>
                  <span className="text-[9px] text-white">{sizes.json}B</span>
                </div>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-16 text-gray-300">protobuf</span>
              <div className="flex-1 bg-gray-800 rounded h-4">
                <div className="h-4 rounded bg-teal-400 flex items-center justify-end pr-1" style={{width: protoW + '%'}}>
                  <span className="text-[9px] text-gray-900 font-bold">{sizes.proto}B</span>
                </div>
              </div>
            </div>
          </div>
          <div className="mt-2 text-[10px] text-teal-200/80">필드 이름을 안 보내서 약 {Math.round((1 - sizes.proto / sizes.json) * 100)}% 절약</div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2"></th><th className="py-1 pr-2">값</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-mono font-bold text-teal-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-gray-300">&rarr;</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.after}</td>
                  <td className="py-1 text-gray-700 font-mono text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function ProtoVisual({ state }) {
      switch (state.active) {
        case 'idl':     return <IdlView />;
        case 'message': return <MessageView fields={state.fields} />;
        case 'service': return <ServiceView rpcs={state.rpcs} />;
        case 'wire':    return <WireView wire={state.wire} sizes={state.sizes} />;
        default:        return <IdlView />;
      }
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.info;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-teal-900">📜 .proto 시뮬레이션</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.active === 'summary'
            ? <SummaryTable summary={state.summary} />
            : <ProtoVisual state={state} />}
          <div className={`mt-3 text-xs rounded p-2 ${state.verdictTone === 'danger' ? 'bg-rose-50 text-rose-900 border border-rose-300' : 'bg-teal-100 text-teal-900 border border-teal-300'}`}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap rounded-xl px-4 py-3" style={{backgroundColor:'#2DA6B0', color:'#ffffff'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-teal-700 font-bold">📜</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter I-1-1. Protocol Buffers IDL</h1>
                <p className="text-sm opacity-90">.proto 한 파일 — message · service · wire 직렬화</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-100'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-gray-900 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-gray-900 text-teal-300' : 'bg-teal-500 text-white hover:bg-teal-600'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-800 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-400 bg-white px-4 py-3 text-sm text-gray-900">
                <div className="font-bold mb-1 text-teal-900">✅ 핵심 정리</div>
                .proto 한 파일이 서버·클라이언트의 단일 계약이다. message(타입 이름 = 번호) + service(rpc 요청→응답)를 정의하면 protoc 가 언어별 코드를 생성한다. 필드 번호는 wire 식별자라 이름보다 작게 직렬화되고(JSON 대비 절약), 하위호환의 기준이 된다 — 추가는 새 번호, 삭제는 reserved, 재사용은 절대 금지.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['protobuf', 'proto3', 'message', 'service', 'rpc', 'field-number', 'wire-format', 'contract-first', 'reserved'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-teal-900">
              <a href="../index.html" className="underline hover:no-underline">← 목차</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 protoc 컴파일 · 생성 코드 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
