            '                  retry_policy:',
            '                    retry_on: "unavailable"',
            '                    num_retries: 3',
            '            http_filters:',
            '            - name: envoy.filters.http.router',
            '',
            '  clusters:',
            '  - name: user_backends',
            '    type: STRICT_DNS               # DNS 로 endpoint 발견',
            '    lb_policy: ROUND_ROBIN         # 요청 단위 균등 분산',
            '    http2_protocol_options: {}     # 업스트림도 HTTP/2',
            '    load_assignment:',
            '      cluster_name: user_backends',
            '      endpoints:',
            '      - lb_endpoints:',
            '        - endpoint: { address: { socket_address: { address: backend.default.svc, port_value: 50051 } } }',
            '',
            '# ─────────────────────────────────────────────',
            '# 서비스메시(Istio/Linkerd) 관점',
            '# ─────────────────────────────────────────────',
            '#  - 위 Envoy 를 Pod 사이드카로 자동 주입',
            '#  - LB/재시도/타임아웃/mTLS/트레이싱을 코드 밖에서 제어',
            '#  - 컨트롤 플레인이 xDS 로 설정을 동적 배포',
            '#  - Envoy 와 gRPC 클라이언트가 같은 xDS API 를 공유',
          ],
          highlight: [0, 1, 2, 14, 21, 22, 23, 24, 25, 26, 27, 32, 33, 34, 35, 36, 43, 44, 45, 46, 47, 48, 49],
        },
      },
      {
        title: 'Step 5. 한 장 정리 — 무엇을 언제 쓰나',
        desc: '핵심은 하나: gRPC 는 요청 단위로 나눠야 한다. 연결 단위(L4) 로 나누면 롱리브드 HTTP/2 때문에 한 백엔드로 쏠린다. 소규모/내부 통신은 client-side round_robin + DNS(headless service) 가 가장 단순하고 강력하다. 재시도·타임아웃·mTLS·관측이 조직 차원에서 필요하거나 폴리글랏(여러 언어) 환경이면 서비스메시(Envoy 사이드카) 로 LB 를 코드 밖으로 빼는 편이 낫다. 대규모 동적 트래픽 제어가 필요하면 xDS 컨트롤 플레인으로 둘 다(클라 LB·프록시 LB) 통일해 관리한다.',
        active: 'summary',
        mode: 'summary',
        weights: [1, 1, 1],
        verdict: '정리',
        verdictTone: 'warn',
        summary: {
          title: '로드밸런싱 선택 가이드',
          rows: [
            { metric: '문제 원인', after: 'HTTP/2 롱리브드', delta: 'L4=연결단위 → 쏠림' },
            { metric: '기본 정책', after: 'pick_first', delta: '분산 안 함(1개만)' },
            { metric: '표준 분산', after: 'round_robin', delta: '요청마다 서브채널 순환' },
            { metric: '목록 발견', after: 'dns:/// resolver', delta: 'headless svc 궁합' },
            { metric: '대규모/동적', after: 'xds:/// resolver', delta: '컨트롤 플레인' },
            { metric: '조직/폴리글랏', after: '서비스메시(Envoy)', delta: '+재시도·mTLS·관측' },
          ],
        },
        keyPoint: '소규모=round_robin+DNS. 관측·정책 필요=서비스메시. 대규모 동적=xDS 로 통일.',
        code: {
          lang: 'json',
          filename: 'recap.json',
          lines: [
            '// Step 5. Load Balancing 한 장 요약',
            '',
            '// ─────────────────────────────────────────────',
            '// 한 문장: gRPC 는 "요청 단위" 로 나눠야 한다',
            '// ─────────────────────────────────────────────',
            '//   L4(연결) LB → HTTP/2 롱리브드 → 한 백엔드 쏠림',
            '//   L7/클라 LB → RPC 낱개 분산 → 고르게',
            '',
            '// ─────────────────────────────────────────────',
            '// 두 갈래 해법',
            '// ─────────────────────────────────────────────',
            '//',
            '//  (A) Client-side LB   설정만으로 분산, 인프라 가벼움',
            '//      dns:/// + round_robin (headless service)',
            '//      단점: 클라가 백엔드를 알아야 / 언어별 구현',
            '//',
            '//  (B) Proxy LB (mesh)  코드 밖에서 LB + 관측/보안',
            '//      Envoy 사이드카 + ROUND_ROBIN + 재시도/mTLS',
            '//      단점: 프록시 홉 1개 / 운영 복잡도',
            '',
            '// ─────────────────────────────────────────────',
            '// 상황별 처방',
            '// ─────────────────────────────────────────────',
            '{',
            '  "internal_small":  "round_robin + dns:/// (가장 단순)",',
            '  "polyglot_org":    "service mesh (Envoy sidecar)",',
            '  "large_dynamic":   "xDS control plane (클라·프록시 통일)",',
            '  "single_gateway":  "pick_first (분산 불필요)"',
            '}',
            '',
            '// ─────────────────────────────────────────────',
            '// 3 대 함정',
            '// ─────────────────────────────────────────────',
            '//  ⚠ NewClient 기본은 pick_first → 분산 안 됨을 잊지 말 것',
            '//  ⚠ "host:port" 직접 dial 하면 IP 1개만 → round_robin 무의미',
            '//     반드시 dns:/// / xds:/// 로 목록을 열어라',
            '//  ⚠ L4 LB(ClusterIP) 뒤 gRPC = 쏠림. headless service 로',
            '',
            '// 다음 챕터(V-2-2): Retry / Deadline / Health check 심화',
          ],
          highlight: [2, 3, 4, 5, 6, 8, 9, 10, 12, 13, 14, 16, 17, 18, 23, 24, 25, 26, 27, 28, 30, 31, 32, 33, 34, 35, 36, 37],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-teal-50',  border: 'border-teal-400', text: 'text-teal-900', badge: 'bg-teal-200 text-teal-900' },
      warn:   { bg: 'bg-amber-50', border: 'border-amber-400', text: 'text-amber-900', badge: 'bg-amber-200 text-amber-900' },
      info:   { bg: 'bg-sky-50',   border: 'border-sky-400',   text: 'text-sky-900',   badge: 'bg-sky-200 text-sky-900' },
      danger: { bg: 'bg-rose-50',  border: 'border-rose-400',  text: 'text-rose-800',  badge: 'bg-rose-200 text-rose-800' },
    };

    const BACKENDS = ['Pod-A', 'Pod-B', 'Pod-C'];

    // 요청을 weights 확률로 백엔드에 배정 (L4 는 [1,0,0] 이라 전부 A 로 쏠린다)
    function pickBackend(weights) {
      const total = weights.reduce((s, w) => s + w, 0);
      if (total <= 0) return 0;
      let r = Math.random() * total;
      for (let i = 0; i < weights.length; i++) {
        r -= weights[i];
        if (r < 0) return i;
      }
      return weights.length - 1;
    }

    function LoadBalancerViz({ state }) {
      const [counts, setCounts] = useState([0, 0, 0]);
      const [pulse, setPulse] = useState(-1);

      // step(mode) 바뀌면 카운터 초기화
      useEffect(() => {
        setCounts([0, 0, 0]);
        setPulse(-1);
      }, [state.mode]);

      // 요청이 일정 간격으로 도착 → weights 대로 분산
      useEffect(() => {
        const id = setInterval(() => {
          const idx = pickBackend(state.weights);
          setPulse(idx);
          setCounts((c) => {
            const next = c.slice();
            next[idx] += 1;
            return next;
          });
        }, 550);
        return () => clearInterval(id);
      }, [state.mode]);

      const total = counts.reduce((s, c) => s + c, 0) || 1;
      const lbLabel = state.mode === 'l4' ? 'L4 LB (연결 단위)'
                    : state.mode === 'proxy' ? 'Envoy L7 (요청 단위)'
                    : 'client round_robin';
      const lbColor = state.mode === 'l4' ? '#e11d48' : '#2DA6B0';

      return (
        <div className="rounded-lg bg-gray-900 text-teal-50 p-3 font-mono text-xs">
          <div className="flex items-center justify-between mb-2">
            <span className="text-teal-300">⚖️ 요청 분산 시뮬레이션</span>
            <span className="text-[10px] text-gray-400">총 {total} req</span>
          </div>

          <div className="flex items-center gap-2 mb-3">
            <div className="rounded bg-teal-800/50 px-2 py-1 text-center text-[10px]">
              <div className="text-teal-300">Client</div>
              <div className="text-white">stub.Call()</div>
            </div>
            <div className="text-teal-400">━▶</div>
            <div className="rounded px-2 py-1 text-center text-[10px] text-white font-bold" style={{ backgroundColor: lbColor }}>
              {lbLabel}
            </div>
            <div className="text-teal-400">━▶</div>
          </div>

          <div className="space-y-1.5">
            {BACKENDS.map((name, i) => {
              const pct = Math.round((counts[i] / total) * 100);
              const hot = state.mode === 'l4' && i === 0;
              const barColor = hot ? '#e11d48' : '#2DA6B0';
              return (
                <div key={name} className="flex items-center gap-2">
                  <span className={`w-12 ${pulse === i ? 'text-white' : 'text-teal-300'}`}>{name}</span>
                  <div className="flex-1 h-4 rounded bg-gray-800 overflow-hidden">
                    <div className="h-full transition-all duration-300" style={{ width: pct + '%', backgroundColor: barColor }} />
                  </div>
                  <span className="w-16 text-right text-white">{counts[i]} · {pct}%</span>
                </div>
              );
            })}
          </div>

          <div className="mt-2 text-[10px] text-gray-400">
            {state.mode === 'l4'
              ? '🔴 롱리브드 연결이 Pod-A 에 고정 → 나머지는 논다'
              : '🟢 요청마다 순환 → 3대에 고르게 분산'}
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-teal-400 bg-white p-3">
          <div className="text-sm font-bold text-teal-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-gray-500 border-b border-gray-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2"></th><th className="py-1 pr-2">권장</th><th className="py-1">메모</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-mono font-bold text-teal-900">{r.metric}</td>
                  <td className="py-1 pr-2 text-gray-300">→</td>
                  <td className="py-1 pr-2 text-emerald-700">{r.after}</td>
                  <td className="py-1 text-gray-700 font-mono text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.info;
      return (
        <div className="rounded-xl border border-teal-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-teal-900">⚖️ 로드밸런싱 흐름</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          <LoadBalancerViz state={state} />
          <SummaryTable summary={state.summary} />
          <div className={`mt-3 text-xs rounded p-2 ${state.verdictTone === 'danger' ? 'bg-rose-50 text-rose-900 border border-rose-300' : 'bg-teal-100 text-teal-900 border border-teal-300'}`}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-gray-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-gray-800 border-b border-gray-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-gray-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-gray-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-gray-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-teal-500/25 border-l-2 border-teal-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-gray-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-gray-800 border-t border-gray-700 flex items-center justify-between text-[10px] text-gray-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-teal-50 to-cyan-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap rounded-xl px-4 py-3" style={{backgroundColor:'#2DA6B0', color:'#ffffff'}}>
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-white text-teal-700 font-bold">⚖️</span>
              <div>
                <h1 className="text-2xl font-bold">Chapter V-2-1. Load Balancing (로드밸런싱)</h1>
                <p className="text-sm opacity-90">gRPC 는 요청 단위로 나눠야 한다 — round_robin · DNS/xDS · 서비스메시</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-teal-500' : 'bg-teal-100'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-gray-900 text-teal-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-teal-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-gray-900 text-teal-300' : 'bg-teal-500 text-white hover:bg-teal-600'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-teal-300 bg-white text-teal-900 hover:bg-teal-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-teal-800 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-teal-400 bg-white px-4 py-3 text-sm text-gray-900">
                <div className="font-bold mb-1 text-teal-900">✅ 핵심 정리</div>
                gRPC 는 HTTP/2 롱리브드 연결이라 L4(연결) LB 면 한 백엔드에 쏠린다. 요청 단위로 나눠야 한다. 소규모=client-side round_robin + dns:///(headless service), 관측·정책·폴리글랏=서비스메시(Envoy 사이드카), 대규모 동적=xDS 컨트롤 플레인으로 통일. NewClient 기본은 pick_first 라 분산이 안 된다는 점을 잊지 말 것.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['load-balancing', 'round_robin', 'pick_first', 'http/2', 'dns-resolver', 'xds', 'envoy', 'service-mesh', 'service-config'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-teal-100 text-teal-900 border border-teal-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-teal-900">
              <a href="./V-1-2.html" className="underline hover:no-underline">← V-1-2</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
