  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧪</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#3178C6';


    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      basic: {lang:'typescript', filename:'conditional-basic.ts', lines:[
        'type IsString<T> = T extends string ? true : false;',
        '',
        'type A = IsString<"hello">;  // true',
        'type B = IsString<42>;       // false',
        'type C = IsString<string>;   // true',
        '',
        '// boolean 으로 자주 사용',
        'type NonNull<T> = T extends null | undefined ? never : T;',
        'type D = NonNull<string | null>;  // string',
      ]},
      distributive: {lang:'typescript', filename:'distributive.ts', lines:[
        'type Test<T> = T extends string ? "Y" : "N";',
        '',
        'type X = Test<string | number>;',
        '// → "Y" | "N"  (분배됨)',
        '',
        '// 분배를 막고 싶으면 tuple 로 감싼다',
        'type Test2<T> = [T] extends [string] ? "Y" : "N";',
        '',
        'type Y = Test2<string | number>;  // "N" (string|number 는 string 의 부분집합이 아님)',
      ]},
      infer: {lang:'typescript', filename:'infer.ts', lines:[
        '// 1) Promise unwrap (Awaited 의 본체)',
        'type Unwrap<T> = T extends Promise<infer U> ? U : T;',
        'type A = Unwrap<Promise<string>>;  // string',
        'type B = Unwrap<number>;           // number',
        '',
        '// 2) ReturnType 의 본체',
        'type Ret<F> = F extends (...a: any[]) => infer R ? R : never;',
        'type C = Ret<() => User>;           // User',
        '',
        '// 3) Parameters 의 본체',
        'type Params<F> = F extends (...a: infer A) => any ? A : never;',
        'type D = Params<(a:number, b:string)=>void>;  // [number, string]',
      ]},
      apiMap: {lang:'typescript', filename:'api-map.ts', lines:[
        'type ApiByStatus = {',
        '  ok:    { data: User };',
        '  error: { message: string };',
        '};',
        '',
        'type ApiResponse<S extends keyof ApiByStatus> =',
        '  { status: S } & ApiByStatus[S];',
        '',
        'function handle<S extends keyof ApiByStatus>(r: ApiResponse<S>) {',
        '  if (r.status === "ok")    return r.data;     // r.data: User',
        '  if (r.status === "error") return r.message;  // r.message: string',
        '}',
      ]},
      guideline: {lang:'typescript', filename:'guideline.ts', lines:[
        '// 라이브러리 작성자: 자유롭게',
        'type DeepReadonly<T> =',
        '  T extends (infer U)[] ? readonly DeepReadonly<U>[]',
        '  : T extends object ? { readonly [K in keyof T]: DeepReadonly<T[K]> }',
        '  : T;',
        '',
        '// 앱 코드: 표준 유틸리티 활용',
        'type FetchResult = Awaited<ReturnType<typeof fetchUser>>;',
        '',
        '// 너무 복잡하면 → 함수로 빼서 시그니처로 표현',
        '// (타입의 가독성도 코드의 가독성이다)',
      ]},
    };

    const S1 = {
      title:'Step 1. conditional 의 모양',
      desc:'타입 자리에서 if 를 쓰는 문법. T extends U ? X : Y. T 가 U 의 부분집합이면 X, 아니면 Y. 함수의 if 처럼 타입에 분기를 만든다.',
    };
    const S2 = {
      title:'Step 2. distributive — union 에 자동 분배',
      desc:'T 가 union 일 때 conditional 은 각 멤버에 자동으로 분배된다. (A|B) extends X ? Y : Z 는 (A extends X ? Y : Z) | (B extends X ? Y : Z) 와 같다. 자주 사용되지만 함정도 있다.',
    };
    const S3 = {
      title:'Step 3. infer — 타입의 일부를 변수로 빼낸다',
      desc:'정규식의 capture group 처럼, conditional 안에서 infer U 라고 적으면 그 자리에 매치된 타입을 U 로 빼낸다. ReturnType, Parameters 같은 표준 유틸리티의 본체가 모두 infer 다.',
    };
    const S4 = {
      title:'Step 4. 실전 — 객체의 키별 타입 매핑',
      desc:'API 응답에서 status 별 데이터 모양이 다른 경우, 키로 매핑된 conditional 을 만들어 응답을 자동 좁히기. 한 번 만들면 새 status 가 추가되어도 매핑만 늘리면 된다.',
    };
    const S5 = {
      title:'Step 5. 한계와 가이드',
      desc:'conditional/infer 는 강력하지만 복잡한 타입은 IDE 가 느려지고 에러 메시지가 어려워진다. 라이브러리 작성자 영역. 앱 코드에선 표준 유틸리티(Awaited/ReturnType/Parameters)만 능숙해도 충분.',
    };

    const STEPS = [
      // ── Step 1 ────────────────────────────────────────────────────────
      { ...S1,
        beat:{ label:'타입에 if 를 적는다', at:'conditional-basic.ts L1', caption:'T 가 string 의 부분집합이면 true, 아니면 false 를 내놓는 타입 함수다.' },
        rows:[
          {name:'IsString<T>', desc:'T extends string ? true : false', mark:'new'},
          {name:'읽는 법', desc:'"T 가 string 이면 … 아니면 …"'},
        ],
        alert:{tone:'info', text:'타입 레벨의 if-else.'},
        code:{...CODE.basic, highlight:[1]},
      },
      { ...S1,
        beat:{ label:'인자를 넣어 결과를 본다', at:'conditional-basic.ts L3–5', caption:'"hello" 는 string 의 부분집합이라 true, 42 는 아니라서 false 가 나온다.' },
        rows:[
          {name:'IsString<"hello">', desc:'→ true', mark:'read'},
          {name:'IsString<42>', desc:'→ false', mark:'gone'},
          {name:'IsString<string>', desc:'→ true', mark:'read'},
        ],
        alert:{tone:'info', text:'literal 도 그 원시 타입의 부분집합이라 true 가 된다.'},
        code:{...CODE.basic, highlight:[3,4,5]},
      },
      { ...S1,
        beat:{ label:'never 를 결과로 써서 걸러낸다', at:'conditional-basic.ts L7–9', caption:'조건에 걸리면 never 를 내보내면, union 에서 그 멤버가 사라진다.' },
        rows:[
          {name:'NonNull<T>', desc:'null|undefined 면 never', mark:'new'},
          {name:'NonNull<string|null>', desc:'→ string (null 이 사라짐)', mark:'changed'},
        ],
        alert:{tone:'good', text:'never 는 union 에서 흡수된다 — 필터의 재료가 된다.'},
        code:{...CODE.basic, highlight:[7,8,9]},
      },

      // ── Step 2 ────────────────────────────────────────────────────────
      { ...S2,
        beat:{ label:'조건 하나를 만든다', at:'distributive.ts L1', caption:'평범해 보이지만, T 에 union 이 들어오면 특별하게 동작한다.' },
        rows:[
          {name:'Test<T>', desc:'T extends string ? "Y" : "N"', mark:'new'},
        ],
        alert:{tone:'info', text:'여기까지는 Step 1 과 같다.'},
        code:{...CODE.distributive, highlight:[1]},
      },
      { ...S2,
        beat:{ label:'union 은 멤버별로 쪼개져 들어간다', at:'distributive.ts L3–4', caption:'string 과 number 가 각각 조건을 통과해 결과도 union 이 된다.' },
        rows:[
          {name:'string 쪽', desc:'→ "Y"', mark:'new'},
          {name:'number 쪽', desc:'→ "N"', mark:'new'},
          {name:'최종 결과', desc:'"Y" | "N"', mark:'changed'},
        ],
        alert:{tone:'warn', text:'한 번 판정될 거라 기대하면 결과가 예상과 달라진다.'},
        code:{...CODE.distributive, highlight:[3,4]},
      },
      { ...S2,
        beat:{ label:'대괄호로 감싸면 분배가 멈춘다', at:'distributive.ts L6–9', caption:'[T] 로 감싸면 union 을 통째로 하나의 대상으로 판정한다.' },
        rows:[
          {name:'[T] extends [string]', desc:'통째로 비교', mark:'changed'},
          {name:'Test2<string|number>', desc:'→ "N" (통째로는 string 이 아님)', mark:'read'},
        ],
        alert:{tone:'warn', text:'union 에 자동 분배. 분배를 막으려면 [T] extends [X] 패턴.'},
        code:{...CODE.distributive, highlight:[6,7,8,9]},
      },

      // ── Step 3 ────────────────────────────────────────────────────────
      { ...S3,
        beat:{ label:'Promise 안의 타입을 꺼낸다', at:'infer.ts L1–4', caption:'infer U 는 "여기 뭐가 들어오든 U 라 부르겠다" 는 뜻이다.' },
        rows:[
          {name:'Promise<infer U>', desc:'U 자리에 매치된 타입이 담긴다', mark:'new'},
          {name:'Unwrap<Promise<string>>', desc:'→ string', mark:'read'},
          {name:'Unwrap<number>', desc:'→ number (매치 실패 시 원본)', mark:'read'},
        ],
        alert:{tone:'good', text:'표준 Awaited<T> 가 바로 이 모양이다.'},
        code:{...CODE.infer, highlight:[1,2,3,4]},
      },
      { ...S3,
        beat:{ label:'함수의 반환 타입을 꺼낸다', at:'infer.ts L6–8', caption:'화살표 오른쪽에 infer R 을 두면 반환 타입만 뽑힌다.' },
        rows:[
          {name:'(...a: any[]) => infer R', desc:'R = 반환 타입', mark:'new'},
          {name:'Ret<() => User>', desc:'→ User', mark:'read'},
        ],
        alert:{tone:'good', text:'표준 ReturnType<F> 의 본체가 이것이다.'},
        code:{...CODE.infer, highlight:[6,7,8]},
      },
      { ...S3,
        beat:{ label:'인자 목록도 같은 방법으로', at:'infer.ts L10–12', caption:'infer 를 인자 자리에 두면 인자들이 튜플로 뽑힌다.' },
        rows:[
          {name:'(...a: infer A) => any', desc:'A = 인자 튜플', mark:'new'},
          {name:'Params<(a,b)=>void>', desc:'→ [number, string]', mark:'read'},
        ],
        alert:{tone:'good', text:'infer = 패턴 매칭의 변수.'},
        code:{...CODE.infer, highlight:[10,11,12]},
      },

      // ── Step 4 ────────────────────────────────────────────────────────
      { ...S4,
        beat:{ label:'status 별 모양을 표로 적는다', at:'api-map.ts L1–4', caption:'분기 규칙을 코드가 아니라 하나의 매핑 표로 모아 둔다.' },
        rows:[
          {name:'ok', desc:'{ data: User }', mark:'new'},
          {name:'error', desc:'{ message: string }', mark:'new'},
        ],
        alert:{tone:'info', text:'새 status 가 생기면 이 표에만 한 줄 추가하면 된다.'},
        code:{...CODE.apiMap, highlight:[1,2,3,4]},
      },
      { ...S4,
        beat:{ label:'표에서 응답 타입을 만들어낸다', at:'api-map.ts L6–7', caption:'status 값과 그에 맞는 본문을 & 로 붙여 하나의 응답 타입을 조립한다.' },
        rows:[
          {name:'ApiResponse<"ok">', desc:'{ status:"ok" } & { data: User }', mark:'new'},
          {name:'ApiResponse<"error">', desc:'{ status:"error" } & { message }', mark:'new'},
        ],
        alert:{tone:'good', text:'표 하나로 모든 응답 모양이 자동 생성된다.'},
        code:{...CODE.apiMap, highlight:[6,7]},
      },
      { ...S4,
        beat:{ label:'분기 안에서 본문이 자동으로 열린다', at:'api-map.ts L9–12', caption:'status 를 비교하면 그 분기에서 쓸 수 있는 필드가 정해진다.' },
        rows:[
          {name:'status === "ok"', desc:'r.data 사용 가능', mark:'read'},
          {name:'status === "error"', desc:'r.message 사용 가능', mark:'read'},
          {name:'잘못 쓰면', desc:'그 자리에서 컴파일 에러', mark:'gone'},
        ],
        alert:{tone:'good', text:'키 매핑 + conditional 로 응답 안전 분기.'},
        code:{...CODE.apiMap, highlight:[9,10,11,12]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'라이브러리라면 여기까지 간다', at:'guideline.ts L1–5', caption:'재귀 conditional 로 중첩 구조 전체를 readonly 로 바꾸는 예다.' },
        rows:[
          {name:'DeepReadonly<T>', desc:'배열·객체를 재귀로 순회', mark:'new'},
          {name:'대가', desc:'IDE 가 느려지고 에러가 난해', mark:'gone'},
        ],
        alert:{tone:'warn', text:'표현력은 크지만 읽는 사람의 비용도 함께 커진다.'},
        code:{...CODE.guideline, highlight:[1,2,3,4,5]},
      },
      { ...S5,
        beat:{ label:'앱 코드는 표준 유틸리티로 충분', at:'guideline.ts L7–8', caption:'직접 만들지 않고 Awaited·ReturnType 을 조합하면 대부분 해결된다.' },
        rows:[
          {name:'ReturnType<typeof f>', desc:'함수 반환 타입', mark:'read'},
          {name:'Awaited<…>', desc:'Promise 를 벗김', mark:'read'},
          {name:'조합 결과', desc:'fetchUser 의 최종 데이터 타입', mark:'new'},
        ],
        alert:{tone:'good', text:'표준 유틸리티만 익혀도 실무 90% 커버.'},
        code:{...CODE.guideline, highlight:[7,8]},
      },
      { ...S5,
        beat:{ label:'복잡해지면 타입이 아니라 함수로', at:'guideline.ts L10–11', caption:'타입으로 억지로 표현하지 말고 함수 시그니처로 드러내는 편이 읽기 쉽다.' },
        rows:[
          {name:'판단 기준', desc:'남이 읽고 바로 이해되는가'},
          {name:'대안', desc:'함수로 빼서 시그니처로 표현', mark:'new'},
        ],
        wins:[
          'extends ? : = 타입 if',
          'union 은 자동 분배 (막으려면 [T])',
          'infer = 패턴 매칭의 변수',
          'Awaited / ReturnType / Parameters 의 본체',
          '앱 코드는 표준 유틸리티만으로 90%',
        ],
        alert:{tone:'good', text:'타입의 가독성도 코드의 가독성이다.'},
        code:{...CODE.guideline, highlight:[10,11]},
      },
    ];

    const PANEL_TITLE = '🧪 conditional/infer 추론표';
    // beat 마다 좌측 항목에 무슨 일이 일어났는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', tip: '새로 생김' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', tip: '값이 바뀜' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', tip: '꺼내 씀' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', tip: '불가능·사라짐' },
    };

    function Rows({ rows, title }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>{title}</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => {
              const m = r.mark ? MARK[r.mark] : null;
              return (
                <div key={i} className={`flex items-center gap-2 text-xs rounded px-1 py-0.5 ${m ? 'trn-mark' : ''}`}
                     style={m ? {background:m.bg, border:`1px solid ${m.color}33`} : {}}>
                  {m && <span className="font-bold shrink-0 w-3" style={{color:m.color}} title={m.tip}>{m.sign}</span>}
                  <span className="w-40 font-mono font-bold shrink-0" style={{color:BRAND, textDecoration: r.mark === 'gone' ? 'line-through' : 'none'}}>{r.name}</span>
                  <span className="flex-1 px-2 py-0.5 rounded font-mono" style={{background:'#eef4fb', color:'#1e4a78'}}>{r.desc}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="mb-2 text-sm font-bold" style={{color:'#1e4a78'}}>T extends U ? X : Y · infer 로 부분 추출</div>
          {state.beat && (
            <div className="mb-2">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold" style={{color:BRAND}}>{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold"
                      style={{background:'#eef4fb', border:`1px solid ${BRAND}`, color:'#1e4a78'}}>↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1" style={{color:'#3b5f80'}}>{state.beat.caption}</p>
            </div>
          )}
          <Rows rows={state.rows} title={state.panelTitle || PANEL_TITLE} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#eef4fb'}}>
          <div className="text-lg font-bold mb-2" style={{color:'#1e4a78'}}>🔷 {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#1e4a78'}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:'#eef4fb', bd:'#bcd3ec', tx:'#1e4a78', icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n')); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(49,120,198,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#eef4fb 0%,#dbeafe 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TS</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:'#1e4a78'}}>II-2-1. conditional type + infer</h1>
                <p className="text-sm" style={{color:'#3178C6'}}>비유: 타입 if문 — T extends U ? X : Y</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#bcd3ec'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#3178C6aa'}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#1e4a78'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                extends ? : 는 타입 레벨 if. infer 로 한 부분을 변수로 빼낸다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["conditional","infer","Awaited","ReturnType"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#eef4fb', color:'#1e4a78', border:'1px solid #bcd3ec'}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="./II-1-2.html" className="underline hover:no-underline">← 이전</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
