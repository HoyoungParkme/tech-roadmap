    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#3178C6';


    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      button: {lang:'typescript', filename:'button.tsx', lines:[
        'interface ButtonProps {',
        '  label: string;',
        '  onClick: () => void;',
        '  disabled?: boolean;',
        '}',
        '',
        'function Button({ label, onClick, disabled = false }: ButtonProps) {',
        '  return (',
        '    <button onClick={onClick} disabled={disabled}>',
        '      {label}',
        '    </button>',
        '  );',
        '}',
      ]},
      children: {lang:'typescript', filename:'children.tsx', lines:[
        'import type { ReactNode, PropsWithChildren } from "react";',
        '',
        '// 1) 직접 명시',
        'interface CardProps {',
        '  title: string;',
        '  children: ReactNode;',
        '}',
        'function Card({ title, children }: CardProps) {',
        '  return <section><h2>{title}</h2>{children}</section>;',
        '}',
        '',
        '// 2) PropsWithChildren 헬퍼',
        'type BoxProps = PropsWithChildren<{ padded?: boolean }>;',
        'function Box({ children, padded }: BoxProps) {',
        '  return <div style={{ padding: padded ? 12 : 0 }}>{children}</div>;',
        '}',
      ]},
      events: {lang:'typescript', filename:'events.tsx', lines:[
        'import type { MouseEvent, ChangeEvent, FormEvent } from "react";',
        '',
        'function Form() {',
        '  const onClick = (e: MouseEvent<HTMLButtonElement>) => {',
        '    e.preventDefault();',
        '  };',
        '  const onChange = (e: ChangeEvent<HTMLInputElement>) => {',
        '    console.log(e.target.value);',
        '  };',
        '  const onSubmit = (e: FormEvent<HTMLFormElement>) => {',
        '    e.preventDefault();',
        '  };',
        '  return <form onSubmit={onSubmit}>…</form>;',
        '}',
      ]},
      extend: {lang:'typescript', filename:'extend-button.tsx', lines:[
        'import type { ButtonHTMLAttributes } from "react";',
        '',
        'interface ButtonProps',
        '  extends ButtonHTMLAttributes<HTMLButtonElement> {',
        '  variant?: "primary" | "secondary";',
        '}',
        '',
        'function Button({ variant = "primary", ...rest }: ButtonProps) {',
        '  return <button className={variant} {...rest} />;',
        '}',
        '',
        '// 사용 — type, aria-label, onClick 모두 자동 인식',
        '<Button variant="secondary" type="submit" aria-label="저장" />',
      ]},
      whyNotFc: {lang:'typescript', filename:'why-not-fc.tsx', lines:[
        '// ✗ 옛 방식 — 권장하지 않음',
        'const Button1: React.FC<{ label: string }> = ({ label, children }) => (',
        '  <button>{label}{children /* 강제 포함 */}</button>',
        ');',
        '',
        '// ✓ 권장 — 일반 함수',
        'function Button2({ label }: { label: string }) {',
        '  return <button>{label}</button>;',
        '}',
        '',
        '// ✓ 제네릭 컴포넌트',
        'function List<T>({ items, render }: { items: T[]; render: (x: T) => React.ReactNode }) {',
        '  return <ul>{items.map((x, i) => <li key={i}>{render(x)}</li>)}</ul>;',
        '}',
      ]},
    };

    const S1 = {
      title:'Step 1. props 타입 — interface 로 정의',
      desc:'리액트 컴포넌트는 함수다. props 는 함수의 첫 번째 인자. 가장 단순한 패턴은 props 타입을 interface 로 정의하고 함수 인자에 그대로 부여하는 것.',
    };
    const S2 = {
      title:'Step 2. children — PropsWithChildren 또는 직접',
      desc:'옛 React.FC 는 children 을 암묵적으로 포함했지만 이제는 명시해야 한다. ReactNode 로 직접 적거나 PropsWithChildren<T> 헬퍼를 쓴다.',
    };
    const S3 = {
      title:'Step 3. 이벤트 — HTMLButtonElement 등 정확한 타입',
      desc:'onClick 의 인자는 MouseEvent<HTMLButtonElement> 같은 정확한 타입. JSX 자동 추론에 의존해도 되지만 핸들러를 변수로 빼면 직접 적어야 한다.',
    };
    const S4 = {
      title:'Step 4. props 확장 — 기본 HTML 속성까지',
      desc:'커스텀 Button 이 기존 button 의 모든 속성(aria, type, className 등)도 받게 하려면 ButtonHTMLAttributes<HTMLButtonElement> 를 extends. 라이브러리에서 표준 패턴.',
    };
    const S5 = {
      title:'Step 5. 왜 React.FC 를 피하는가',
      desc:'React.FC 는 (1) defaultProps 와 충돌, (2) children 을 강제 포함 (원치 않는 경우도), (3) 제네릭 컴포넌트 작성이 어려움. 공식 react 팀과 커뮤니티가 모두 일반 함수 권장.',
    };

    const STEPS = [
      // ── Step 1 ────────────────────────────────────────────────────────
      { ...S1,
        beat:{ label:'받을 값의 모양을 먼저 적는다', at:'button.tsx L1–5', caption:'필수 두 개와 선택 하나. ? 가 붙은 것만 없어도 된다.' },
        rows:[
          {name:'label', desc:'string — 필수', mark:'new'},
          {name:'onClick', desc:'() => void — 필수', mark:'new'},
          {name:'disabled?', desc:'boolean — 선택', mark:'new'},
        ],
        alert:{tone:'info', text:'props 는 결국 함수의 첫 번째 인자일 뿐이다.'},
        code:{...CODE.button, highlight:[1,2,3,4,5]},
      },
      { ...S1,
        beat:{ label:'함수 인자에 그 타입을 붙인다', at:'button.tsx L7', caption:'구조분해와 기본값을 함께 쓰면 disabled 가 없을 때 false 가 된다.' },
        rows:[
          {name:'인자 타입', desc:'ButtonProps', mark:'changed'},
          {name:'disabled 기본값', desc:'false 로 채워짐', mark:'new'},
        ],
        alert:{tone:'info', text:'표준은 일반 함수 + props 타입.'},
        code:{...CODE.button, highlight:[7]},
      },
      { ...S1,
        beat:{ label:'받은 값을 그대로 흘려보낸다', at:'button.tsx L9–11', caption:'타입이 정해져 있으니 오타나 누락은 여기서 걸린다.' },
        rows:[
          {name:'onClick', desc:'버튼에 전달', mark:'read'},
          {name:'disabled', desc:'버튼에 전달', mark:'read'},
          {name:'label', desc:'본문으로 출력', mark:'read'},
        ],
        alert:{tone:'good', text:'React.FC 없이도 필요한 안전성은 모두 확보된다.'},
        code:{...CODE.button, highlight:[9,10,11]},
      },

      // ── Step 2 ────────────────────────────────────────────────────────
      { ...S2,
        beat:{ label:'children 을 직접 적는다', at:'children.tsx L3–7', caption:'children 도 그냥 하나의 prop 이다. 타입은 ReactNode.' },
        rows:[
          {name:'title', desc:'string', mark:'new'},
          {name:'children', desc:'ReactNode — 직접 명시', mark:'new'},
        ],
        alert:{tone:'info', text:'ReactNode 는 문자열·요소·배열·null 을 모두 포함한다.'},
        code:{...CODE.children, highlight:[3,4,5,6,7]},
      },
      { ...S2,
        beat:{ label:'다른 prop 처럼 꺼내 쓴다', at:'children.tsx L8–10', caption:'구조분해로 꺼내 원하는 자리에 그대로 놓으면 된다.' },
        rows:[
          {name:'title', desc:'제목 자리에 출력', mark:'read'},
          {name:'children', desc:'본문 자리에 출력', mark:'read'},
        ],
        alert:{tone:'good', text:'children 을 어디에 놓을지 직접 정할 수 있다.'},
        code:{...CODE.children, highlight:[8,9,10]},
      },
      { ...S2,
        beat:{ label:'헬퍼로 줄여 쓴다', at:'children.tsx L12–16', caption:'PropsWithChildren 은 내 props 에 children 을 얹어 주는 도우미다.' },
        rows:[
          {name:'PropsWithChildren<P>', desc:'P + children', mark:'new'},
          {name:'BoxProps', desc:'{ padded?, children }', mark:'changed'},
        ],
        alert:{tone:'good', text:'명시적으로 children 적기 — 가독성/안전 모두 ↑'},
        code:{...CODE.children, highlight:[12,13,14,15,16]},
      },

      // ── Step 3 ────────────────────────────────────────────────────────
      { ...S3,
        beat:{ label:'이벤트 타입을 가져온다', at:'events.tsx L1', caption:'DOM 의 Event 가 아니라 react 가 제공하는 합성 이벤트 타입을 쓴다.' },
        rows:[
          {name:'MouseEvent', desc:'클릭 등 마우스', mark:'new'},
          {name:'ChangeEvent', desc:'입력 값 변경', mark:'new'},
          {name:'FormEvent', desc:'폼 제출', mark:'new'},
        ],
        alert:{tone:'info', text:'react 의 이벤트는 브라우저 이벤트를 감싼 별도 타입이다.'},
        code:{...CODE.events, highlight:[1]},
      },
      { ...S3,
        beat:{ label:'어떤 요소의 이벤트인지까지 적는다', at:'events.tsx L4–6', caption:'제네릭 자리에 요소 타입을 넣어야 e.currentTarget 이 정확해진다.' },
        rows:[
          {name:'MouseEvent<HTMLButtonElement>', desc:'버튼 클릭', mark:'new'},
          {name:'얻는 것', desc:'e.preventDefault() 등 자동완성', mark:'read'},
        ],
        alert:{tone:'info', text:'JSX 안에 인라인으로 쓰면 추론되지만, 변수로 빼면 직접 적어야 한다.'},
        code:{...CODE.events, highlight:[4,5,6]},
      },
      { ...S3,
        beat:{ label:'입력 값은 target 에서 꺼낸다', at:'events.tsx L7–9', caption:'HTMLInputElement 로 지정해야 e.target.value 가 string 으로 잡힌다.' },
        rows:[
          {name:'ChangeEvent<HTMLInputElement>', desc:'input 변경', mark:'new'},
          {name:'e.target.value', desc:'string 으로 확정', mark:'read'},
        ],
        alert:{tone:'good', text:'요소 타입을 빼먹으면 value 가 any 로 새어 나간다.'},
        code:{...CODE.events, highlight:[7,8,9]},
      },
      { ...S3,
        beat:{ label:'폼 제출도 같은 방식', at:'events.tsx L10–13', caption:'FormEvent<HTMLFormElement> 를 적고 onSubmit 에 연결한다.' },
        rows:[
          {name:'FormEvent<HTMLFormElement>', desc:'폼 제출', mark:'new'},
          {name:'onSubmit 에 연결', desc:'타입이 맞아야 통과', mark:'read'},
        ],
        alert:{tone:'good', text:'핸들러를 변수로 빼두면 재사용·테스트가 쉬워진다.'},
        code:{...CODE.events, highlight:[10,11,12,13]},
      },

      // ── Step 4 ────────────────────────────────────────────────────────
      { ...S4,
        beat:{ label:'기본 button 속성을 통째로 물려받는다', at:'extend-button.tsx L3–6', caption:'extends 한 줄로 type·aria-label·className 등이 모두 들어온다.' },
        rows:[
          {name:'ButtonHTMLAttributes', desc:'button 의 모든 속성', mark:'new'},
          {name:'variant?', desc:'내가 추가한 속성', mark:'new'},
        ],
        alert:{tone:'info', text:'속성을 하나씩 다시 적을 필요가 없다.'},
        code:{...CODE.extend, highlight:[3,4,5,6]},
      },
      { ...S4,
        beat:{ label:'내 것만 꺼내고 나머지는 넘긴다', at:'extend-button.tsx L8–10', caption:'variant 만 쓰고 나머지(...rest)는 그대로 button 에 펼친다.' },
        rows:[
          {name:'variant', desc:'className 으로 사용', mark:'read'},
          {name:'...rest', desc:'button 으로 그대로 전달', mark:'read'},
        ],
        alert:{tone:'good', text:'rest 전달은 래퍼 컴포넌트의 기본기다.'},
        code:{...CODE.extend, highlight:[8,9,10]},
      },
      { ...S4,
        beat:{ label:'쓰는 쪽에서 전부 인식된다', at:'extend-button.tsx L12–13', caption:'내가 만든 variant 와 원래 button 속성이 한 자리에서 자동완성된다.' },
        rows:[
          {name:'variant="secondary"', desc:'내가 만든 속성', mark:'read'},
          {name:'type / aria-label', desc:'물려받은 속성', mark:'read'},
        ],
        alert:{tone:'good', text:'기본 HTML 속성 그대로 받는 패턴은 라이브러리 표준.'},
        code:{...CODE.extend, highlight:[12,13]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'React.FC 는 children 을 강제한다', at:'why-not-fc.tsx L1–4', caption:'children 을 받을 생각이 없어도 타입에 끼어 들어온다.' },
        rows:[
          {name:'React.FC<P>', desc:'P + children 이 강제', mark:'new'},
          {name:'문제', desc:'안 받을 컴포넌트도 받게 됨', mark:'gone'},
        ],
        alert:{tone:'warn', text:'"children 을 받지 않는다" 를 표현할 수 없다.'},
        code:{...CODE.whyNotFc, highlight:[1,2,3,4]},
      },
      { ...S5,
        beat:{ label:'일반 함수로 쓰면 그대로다', at:'why-not-fc.tsx L6–9', caption:'적은 것만 받는다. 더 짧고 의도도 분명하다.' },
        rows:[
          {name:'function Button2', desc:'label 만 받음', mark:'changed'},
          {name:'children', desc:'타입에 없음 → 전달 시 에러', mark:'gone'},
        ],
        alert:{tone:'good', text:'단순한 함수가 가장 안전한 컴포넌트.'},
        code:{...CODE.whyNotFc, highlight:[6,7,8,9]},
      },
      { ...S5,
        beat:{ label:'제네릭 컴포넌트는 함수라야 쉽다', at:'why-not-fc.tsx L11–14', caption:'React.FC 로는 타입 매개변수를 붙이기가 번거롭다.' },
        rows:[
          {name:'function List<T>', desc:'항목 타입을 T 로 받음', mark:'new'},
          {name:'render', desc:'T 를 받아 노드를 반환', mark:'read'},
          {name:'얻는 것', desc:'items 와 render 의 타입이 연동', mark:'changed'},
        ],
        wins:[
          '일반 함수 + props 타입이 표준',
          'children 은 명시 (ReactNode 또는 PropsWithChildren)',
          '이벤트 타입은 MouseEvent<…> 등 정확하게',
          'HTML 속성 그대로 받으려면 ButtonHTMLAttributes 등 extends',
          'React.FC 는 잊는다',
        ],
        alert:{tone:'good', text:'제네릭까지 생각하면 일반 함수 외에 선택지가 없다.'},
        code:{...CODE.whyNotFc, highlight:[11,12,13,14]},
      },
    ];

    const PANEL_TITLE = '⚛️ 컴포넌트 시그니처 비교';
    // beat 마다 좌측 항목에 무슨 일이 일어났는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', tip: '새로 생김' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', tip: '값이 바뀜' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', tip: '꺼내 씀' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', tip: '불가능·사라짐' },
    };

    function Rows({ rows, title }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>{title}</div>
          <div className="p-3 space-y-2">
            {rows.map((r, i) => {
              const m = r.mark ? MARK[r.mark] : null;
              return (
                <div key={i} className={`flex items-center gap-2 text-xs rounded px-1 py-0.5 ${m ? 'trn-mark' : ''}`}
                     style={m ? {background:m.bg, border:`1px solid ${m.color}33`} : {}}>
                  {m && <span className="font-bold shrink-0 w-3" style={{color:m.color}} title={m.tip}>{m.sign}</span>}
                  <span className="w-40 font-mono font-bold shrink-0" style={{color:BRAND, textDecoration: r.mark === 'gone' ? 'line-through' : 'none'}}>{r.name}</span>
                  <span className="flex-1 px-2 py-0.5 rounded font-mono" style={{background:'#eef4fb', color:'#1e4a78'}}>{r.desc}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="mb-2 text-sm font-bold" style={{color:'#1e4a78'}}>React.FC 는 잊고 일반 함수로</div>
          {state.beat && (
            <div className="mb-2">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold" style={{color:BRAND}}>{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold"
                      style={{background:'#eef4fb', border:`1px solid ${BRAND}`, color:'#1e4a78'}}>↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1" style={{color:'#3b5f80'}}>{state.beat.caption}</p>
            </div>
          )}
          <Rows rows={state.rows} title={state.panelTitle || PANEL_TITLE} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#eef4fb'}}>
          <div className="text-lg font-bold mb-2" style={{color:'#1e4a78'}}>🔷 {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#1e4a78'}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:'#eef4fb', bd:'#bcd3ec', tx:'#1e4a78', icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n')); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(49,120,198,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#eef4fb 0%,#dbeafe 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TS</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:'#1e4a78'}}>III-1-1. React 컴포넌트 props 타입</h1>
                <p className="text-sm" style={{color:'#3178C6'}}>비유: 컴포넌트 = 함수, props = 인자</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#bcd3ec'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#3178C6aa'}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#1e4a78'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                React.FC 는 권장하지 않는 흐름. 일반 함수 + props 타입이 표준.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["React","props","FC","PropsWithChildren"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#eef4fb', color:'#1e4a78', border:'1px solid #bcd3ec'}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../part2/II-2-2.html" className="underline hover:no-underline">← 이전</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
