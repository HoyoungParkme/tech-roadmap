  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#3178C6';


    // beat 마다 좌측 항목에 무슨 일이 일어났는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', tip: '새로 생김' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', tip: '값이 바뀜' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', tip: '꺼내 씀' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', tip: '불가능·사라짐' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      partial: {lang:'typescript', filename:'partial.ts', lines:[
        'interface User { id: number; name: string; email: string }',
        '',
        'type UserPatch = Partial<User>;',
        '// → { id?: number; name?: string; email?: string }',
        '',
        'function updateUser(id: number, patch: UserPatch) {',
        '  return db.users.update({ where: { id }, data: patch });',
        '}',
        '',
        'updateUser(1, { name: "Bob" });           // ✓',
        'updateUser(1, { email: "b@x.com" });      // ✓',
        'updateUser(1, {});                        // ✓ (모두 옵셔널)',
      ]},
      required: {lang:'typescript', filename:'required.ts', lines:[
        'interface DraftUser { id?: number; name?: string; email?: string }',
        '',
        'type FinalUser = Required<DraftUser>;',
        '// → { id: number; name: string; email: string }',
        '',
        'function submit(u: FinalUser) {',
        '  return api.create(u);',
        '}',
        '',
        'submit({ id: 1, name: "A" });            // ✗ email 누락',
        'submit({ id: 1, name: "A", email: "a@x" }); // ✓',
      ]},
      pickOmit: {lang:'typescript', filename:'pick-omit.ts', lines:[
        'interface User {',
        '  id: number;',
        '  name: string;',
        '  email: string;',
        '  password: string;',
        '}',
        '',
        '// 1) Pick — 필요한 것만',
        'type UserListItem = Pick<User, "id" | "name">;',
        '// → { id: number; name: string }',
        '',
        '// 2) Omit — 빼고 싶은 것 제외 (응답에서 비밀번호 제거 표준)',
        'type PublicUser = Omit<User, "password">;',
        '// → { id; name; email }',
        '',
        'function getUsers(): PublicUser[] { /* … */ return [] }',
      ]},
      record: {lang:'typescript', filename:'record.ts', lines:[
        'type Status = "idle" | "loading" | "done" | "error";',
        '',
        'const STATUS_COLOR: Record<Status, string> = {',
        '  idle: "gray",',
        '  loading: "blue",',
        '  done: "green",',
        '  error: "red",',
        '  // 한 키라도 빠지면 컴파일 에러',
        '};',
        '',
        '// React 컴포넌트에서 lookup',
        'function Badge({ status }: { status: Status }) {',
        '  return <span style={{ color: STATUS_COLOR[status] }}>{status}</span>;',
        '}',
      ]},
      combo: {lang:'typescript', filename:'combo.ts', lines:[
        'interface User { id: number; name: string; email: string; password: string }',
        '',
        '// 1) 응답에서 비밀번호 빼고, 일부 필드만 옵셔널',
        'type UpdateBody = Partial<Omit<User, "id" | "password">>;',
        '// → { name?: string; email?: string }',
        '',
        '// 2) 함수에서 타입 뽑기',
        'function createUser(input: Omit<User, "id">): User { /*...*/ return {} as User }',
        '',
        'type CreateInput  = Parameters<typeof createUser>[0]; // Omit<User,"id">',
        'type CreateResult = ReturnType<typeof createUser>;    // User',
        '',
        '// 3) Promise unwrap',
        'async function fetchUser(): Promise<User> { /*...*/ return {} as User }',
        'type FetchUserResult = Awaited<ReturnType<typeof fetchUser>>; // User',
      ]},
    };

    const S1 = {
      title: 'Step 1. Partial — 모든 필드 옵셔널',
      desc: 'Partial 은 모든 필드를 선택적으로 만든다. "수정 API 의 body — 필드 중 일부만 보낼 수 있다" 같은 곳에 쓴다. 새 타입을 손으로 적지 않고도 "옵셔널 버전" 을 얻는다.',
    };
    const S2 = {
      title: 'Step 2. Required — 모든 필드 필수',
      desc: 'Partial 의 반대. ? 가 붙은 필드를 모두 필수로 바꾼다. "내부적으로는 일부 옵셔널이지만, 이 시점에는 반드시 모두 있어야 한다" 인 곳에 쓴다.',
    };
    const S3 = {
      title: 'Step 3. Pick / Omit — 필요한 필드만 / 빼고',
      desc: 'Pick 은 골라내고 Omit 은 제외한다. API 응답에서 비밀번호 같은 민감 필드를 빼거나, 작성 폼에서 일부 필드만 노출할 때 사용.',
    };
    const S4 = {
      title: 'Step 4. Record — key 가 K, value 가 V 인 객체',
      desc: '맵(딕셔너리) 타입. enum 값마다 메타데이터를 붙이거나, status → 색상 같은 매핑에 쓴다. 모든 key 가 빠짐없이 채워졌는지 컴파일러가 검사한다.',
    };
    const S5 = {
      title: 'Step 5. 합쳐 쓰기 + ReturnType/Parameters',
      desc: '실무에선 여러 유틸리티를 조합한다. 비밀번호를 빼고(Omit) 일부 필드만 옵셔널로(Partial) 같은 식. ReturnType / Parameters 로 함수 시그니처에서 타입을 뽑을 수도 있다.',
    };

    const STEPS = [
      // ── Step 1 ────────────────────────────────────────────────────────
      { ...S1,
        beat:{ label:'원본은 전부 필수다', at:'partial.ts L1', caption:'세 필드 모두 반드시 있어야 하는 타입에서 출발한다.' },
        ops: [{name:'User', desc:'{id, name, email} — 전부 필수', mark:'new'}],
        alert:{tone:'info', text:'생성할 때는 이 모양이 맞다.'},
        code:{...CODE.partial, highlight:[1]},
      },
      { ...S1,
        beat:{ label:'Partial 로 전부 선택으로 바꾼다', at:'partial.ts L3–4', caption:'필드를 다시 적지 않고 한 줄로 옵셔널 버전을 얻는다.' },
        ops: [
          {name:'User', desc:'{id, name, email}'},
          {name:'Partial<User>', desc:'{id?, name?, email?}', mark:'new'},
        ],
        alert:{tone:'info', text:'수정 API · 폼 진행상태 · 부분 업데이트 ← 표준'},
        code:{...CODE.partial, highlight:[3,4]},
      },
      { ...S1,
        beat:{ label:'부분 수정 함수에 쓴다', at:'partial.ts L6–8', caption:'보낸 필드만 반영하는 수정 API 의 전형적인 모양이다.' },
        ops: [
          {name:'updateUser(id, patch)', desc:'patch: Partial<User>', mark:'new'},
        ],
        alert:{tone:'info', text:'전체를 다시 보내지 않아도 된다.'},
        code:{...CODE.partial, highlight:[6,7,8]},
      },
      { ...S1,
        beat:{ label:'무엇을 보내든 통과한다', at:'partial.ts L10–12', caption:'전부 옵셔널이므로 빈 객체까지 허용된다.' },
        ops: [
          {name:'{ name }', desc:'✓ 통과', mark:'read'},
          {name:'{ email }', desc:'✓ 통과', mark:'read'},
          {name:'{}', desc:'✓ 통과 (주의)', mark:'read'},
        ],
        alert:{tone:'warn', text:'빈 객체도 통과하므로 "최소 한 필드" 규칙은 따로 검증해야 한다.'},
        code:{...CODE.partial, highlight:[10,11,12]},
      },

      // ── Step 2 ────────────────────────────────────────────────────────
      { ...S2,
        beat:{ label:'작성 중에는 전부 비어 있을 수 있다', at:'required.ts L1', caption:'폼을 채워 가는 동안의 모양이다.' },
        ops: [{name:'DraftUser', desc:'{id?, name?, email?}', mark:'new'}],
        alert:{tone:'info', text:'작성 중 상태를 표현하기에는 이 편이 편하다.'},
        code:{...CODE.required, highlight:[1]},
      },
      { ...S2,
        beat:{ label:'Required 로 물음표를 떼어낸다', at:'required.ts L3–4', caption:'제출 시점에는 모든 값이 있어야 한다는 규칙을 타입으로 만든다.' },
        ops: [
          {name:'DraftUser', desc:'{id?, name?, email?}'},
          {name:'Required<DraftUser>', desc:'{id, name, email}', mark:'new'},
        ],
        alert:{tone:'info', text:'폼 제출 직전 검증 후 = Required'},
        code:{...CODE.required, highlight:[3,4]},
      },
      { ...S2,
        beat:{ label:'제출 함수는 완성본만 받는다', at:'required.ts L6–8', caption:'미완성 상태가 API 까지 흘러가지 못하게 막는다.' },
        ops: [{name:'submit(u)', desc:'u: FinalUser 만', mark:'new'}],
        alert:{tone:'good', text:'검증 통과 여부가 타입으로 표현된다.'},
        code:{...CODE.required, highlight:[6,7,8]},
      },
      { ...S2,
        beat:{ label:'하나라도 빠지면 막힌다', at:'required.ts L10–11', caption:'email 이 없는 호출은 컴파일 단계에서 거부된다.' },
        ops: [
          {name:'{ id, name }', desc:'✗ email 누락', mark:'gone'},
          {name:'{ id, name, email }', desc:'✓ 통과', mark:'read'},
        ],
        alert:{tone:'good', text:'"검증했겠지" 라는 가정을 타입이 대신 확인한다.'},
        code:{...CODE.required, highlight:[10,11]},
      },

      // ── Step 3 ────────────────────────────────────────────────────────
      { ...S3,
        beat:{ label:'민감 필드가 섞인 원본', at:'pick-omit.ts L1–6', caption:'password 가 들어 있어 그대로 응답에 쓰면 안 되는 타입이다.' },
        ops: [
          {name:'User', desc:'{id, name, email, password}', mark:'new'},
          {name:'password', desc:'외부에 나가면 안 됨', mark:'gone'},
        ],
        alert:{tone:'warn', text:'응답 타입을 손으로 다시 적으면 언젠가 어긋난다.'},
        code:{...CODE.pickOmit, highlight:[1,2,3,4,5,6]},
      },
      { ...S3,
        beat:{ label:'Pick — 필요한 것만 고른다', at:'pick-omit.ts L8–10', caption:'목록 화면에는 id 와 name 만 있으면 된다.' },
        ops: [
          {name:'Pick<User,"id"|"name">', desc:'{id, name}', mark:'new'},
          {name:'나머지 필드', desc:'포함되지 않음'},
        ],
        alert:{tone:'info', text:'가져갈 것이 적을 때는 Pick 이 읽기 쉽다.'},
        code:{...CODE.pickOmit, highlight:[8,9,10]},
      },
      { ...S3,
        beat:{ label:'Omit — 뺄 것만 지정한다', at:'pick-omit.ts L12–14', caption:'필드가 늘어나도 자동으로 포함되므로 응답 타입에 적합하다.' },
        ops: [
          {name:'Omit<User,"password">', desc:'{id, name, email}', mark:'new'},
          {name:'password', desc:'제외됨', mark:'gone'},
        ],
        alert:{tone:'good', text:'민감 필드 제거 / 일부 필드 선택의 표준'},
        code:{...CODE.pickOmit, highlight:[12,13,14]},
      },
      { ...S3,
        beat:{ label:'응답 타입으로 그대로 쓴다', at:'pick-omit.ts L16', caption:'User 에 필드가 추가돼도 password 만 계속 빠진다.' },
        ops: [
          {name:'getUsers()', desc:'PublicUser[] 반환', mark:'read'},
          {name:'유지보수', desc:'원본만 고치면 따라온다'},
        ],
        alert:{tone:'good', text:'원본과 파생 타입이 어긋날 수 없다.'},
        code:{...CODE.pickOmit, highlight:[16]},
      },

      // ── Step 4 ────────────────────────────────────────────────────────
      { ...S4,
        beat:{ label:'키가 될 값 목록을 정한다', at:'record.ts L1', caption:'네 가지 상태가 이 맵의 키가 된다.' },
        ops: [{name:'Status', desc:'"idle"|"loading"|"done"|"error"', mark:'new'}],
        alert:{tone:'info', text:'literal union 이 Record 의 재료가 된다.'},
        code:{...CODE.record, highlight:[1]},
      },
      { ...S4,
        beat:{ label:'모든 키를 빠짐없이 채운다', at:'record.ts L3–9', caption:'하나라도 빠뜨리면 컴파일이 막는다 — 이것이 Record 의 값어치다.' },
        ops: [
          {name:'Record<Status, string>', desc:'각 status 마다 색', mark:'new'},
          {name:'한 키 누락 시', desc:'컴파일 에러', mark:'gone'},
        ],
        alert:{tone:'good', text:'상태가 추가되면 색을 정하도록 강제된다.'},
        code:{...CODE.record, highlight:[3,4,5,6,7,8,9]},
      },
      { ...S4,
        beat:{ label:'조회는 인덱스 한 번으로 끝', at:'record.ts L11–14', caption:'switch 문 없이 표에서 바로 꺼내 쓴다.' },
        ops: [
          {name:'STATUS_COLOR[status]', desc:'string 확정', mark:'read'},
          {name:'분기문', desc:'필요 없음', mark:'gone'},
        ],
        alert:{tone:'good', text:'enum/literal → 무엇 매핑은 Record 가 표준'},
        code:{...CODE.record, highlight:[11,12,13,14]},
      },

      // ── Step 5 ────────────────────────────────────────────────────────
      { ...S5,
        beat:{ label:'유틸리티를 겹쳐 쓴다', at:'combo.ts L3–5', caption:'먼저 빼고(Omit) 그 다음 옵셔널로(Partial) 만든다.' },
        ops: [
          {name:'Omit<User,"id"|"password">', desc:'{name, email}', mark:'new'},
          {name:'+ Partial', desc:'{name?, email?}', mark:'changed'},
        ],
        alert:{tone:'info', text:'안쪽부터 바깥쪽으로 읽으면 된다.'},
        code:{...CODE.combo, highlight:[3,4,5]},
      },
      { ...S5,
        beat:{ label:'함수에서 타입을 뽑아 쓴다', at:'combo.ts L7–11', caption:'함수 시그니처가 이미 진실이므로 거기서 꺼내면 어긋나지 않는다.' },
        ops: [
          {name:'Parameters<typeof f>[0]', desc:'첫 인자 타입', mark:'read'},
          {name:'ReturnType<typeof f>', desc:'반환 타입', mark:'read'},
        ],
        alert:{tone:'good', text:'함수를 고치면 이 타입들도 자동으로 따라온다.'},
        code:{...CODE.combo, highlight:[7,8,9,10,11]},
      },
      { ...S5,
        beat:{ label:'Promise 도 벗겨 낸다', at:'combo.ts L13–15', caption:'Awaited 와 ReturnType 을 겹치면 최종 데이터 타입이 나온다.' },
        ops: [
          {name:'ReturnType', desc:'Promise<User>', mark:'read'},
          {name:'+ Awaited', desc:'User', mark:'changed'},
        ],
        wins:[
          'Partial/Required: 옵셔널 토글',
          'Pick/Omit: 필드 선택/제외',
          'Record: key→value 매핑',
          'ReturnType/Parameters: 함수에서 타입 뽑기',
          'Awaited<T>: Promise unwrap',
        ],
        alert:{tone:'good', text:'외워서 쓰면 type 작성 시간이 절반.'},
        code:{...CODE.combo, highlight:[13,14,15]},
      },
    ];

    function OpList({ ops }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white" style={{background:BRAND}}>🛠 utility type 변환표</div>
          <table className="w-full text-xs">
            <thead><tr style={{background:'#eef4fb'}}><th className="text-left px-2 py-1" style={{color:'#1e4a78'}}>도구</th><th className="text-left px-2 py-1" style={{color:'#1e4a78'}}>결과</th></tr></thead>
            <tbody>
              {ops.map((o, i) => (
                <tr key={i} className={`border-t ${o.mark ? 'trn-mark' : ''}`}
                    style={{borderColor:'#dbeafe', background: o.mark ? MARK[o.mark].bg : 'transparent'}}>
                  <td className="px-2 py-1 font-mono font-bold" style={{color:BRAND}}>
                    {o.mark && <span style={{color:MARK[o.mark].color}} title={MARK[o.mark].tip}>{MARK[o.mark].sign} </span>}{o.name}</td>
                  <td className="px-2 py-1 font-mono text-slate-700">{o.desc}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }
    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3"><h3 className="text-sm font-bold" style={{color:'#1e4a78'}}>utility type 시뮬레이션</h3></div>
          {state.beat && (
            <div className="mb-2">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold" style={{color:BRAND}}>{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold"
                      style={{background:'#eef4fb', border:`1px solid ${BRAND}`, color:'#1e4a78'}}>↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1" style={{color:'#3b5f80'}}>{state.beat.caption}</p>
            </div>
          )}
          <OpList ops={state.ops} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }
  

    function WinsBox({ wins, title }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#eef4fb'}}>
          <div className="text-lg font-bold mb-2" style={{color:'#1e4a78'}}>🔷 {title || '핵심 정리'}</div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#1e4a78'}}><span style={{color:BRAND}}>✓</span><span>{w}</span></li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:{bg:'#eef4fb', bd:'#bcd3ec', tx:'#1e4a78', icon:'💡'},
      warn:{bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️'},
      danger:{bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨'},
      good:{bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅'},
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}><span>{s.icon}</span><span>{alert.text}</span></div>;
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n')); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(49,120,198,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span><span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#eef4fb 0%,#dbeafe 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>TS</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:'#1e4a78'}}>I-2-2. utility type</h1>
                <p className="text-sm" style={{color:'#3178C6'}}>비유: 도면 변형 도구 — Partial/Pick/Omit/Record</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#bcd3ec'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#3178C6aa'}}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#1e4a78'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Partial/Pick/Omit/Record 는 표준 도구함. 외운다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {["Partial","Pick","Omit","Record","utility"].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#eef4fb', color:'#1e4a78', border:'1px solid #bcd3ec'}}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="./I-2-1.html" className="underline hover:no-underline">← 이전</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음 →</a>
            </nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
