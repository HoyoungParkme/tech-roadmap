<!DOCTYPE html>

<head>

  <title>Java 학습 — V-1-2. 스레드와 동시성 기초</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>☕</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Java V-1-2 — 스레드와 동시성 기초
    학습 목표: 스레드가 무엇인지(프로세스 내 실행 흐름), 왜 동시성이 필요한지부터,
              공유 상태가 만드는 레이스 컨디션(읽기-수정-쓰기 인터리빙)과 가시성 문제,
              그리고 synchronized·Atomic·java.util.concurrent(고수준 도구)로 안전하게 푸는 법을 6단계로 뜯어본다.
    패턴: fastapi v1 — 좌(LiveDataPane: 스레드·레이스 애니메이션·가시성·락·CAS·스레드풀 시뮬레이션) / 우(VSCode CodeViewer: java 코드)
    색상: Java 오렌지 #E76F00 기조 / 형광펜·배경 채움 옅은 파랑 #a7c7e7 / 텍스트·링크·배지 오렌지 다크 #8a4200
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 스레드 → 레이스 → 가시성 → synchronized/데드락 → Atomic/CAS → 고수준 도구
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      threads: { lang: "java", filename: "ThreadBasics.java — Runnable로 스레드 만들기", lines: [
        "public class ThreadBasics {",
        "  public static void main(String[] args) throws InterruptedException {",
        "    // \"할 일\"은 Runnable 로, \"실행\"은 Thread 가 맡는다 (책임 분리)",
        "    Runnable job = () -> {",
        "      String me = Thread.currentThread().getName();",
        "      System.out.println(me + \" 작업 시작\");",
        "    };",
        "",
        "    Thread t1 = new Thread(job, \"worker-1\");",
        "    Thread t2 = new Thread(job, \"worker-2\");",
        "",
        "    t1.start();   // start() 여야 새 스레드에서 실행된다",
        "    t2.start();   // run() 을 직접 부르면 그냥 현재 스레드 실행!",
        "",
        "    t1.join();    // 두 스레드가 끝날 때까지 main 이 기다림",
        "    t2.join();",
        "    System.out.println(\"main 종료\");",
        "    // => worker-1 작업 시작",
        "    // => worker-2 작업 시작   (순서는 실행마다 다를 수 있음)",
        "    // => main 종료",
        "  }",
        "}",
      ] },
      race: { lang: "java", filename: "RaceCondition.java — 동기화 없는 공유 카운터", lines: [
        "public class RaceCondition {",
        "  // 여러 스레드가 공유하는 상태 (보호 장치 없음)",
        "  private static int count = 0;",
        "",
        "  public static void main(String[] args) throws InterruptedException {",
        "    Runnable task = () -> {",
        "      for (int i = 0; i < 100_000; i++) {",
        "        count++;   // 읽기 → +1 → 쓰기 : 원자적이지 않다!",
        "      }",
        "    };",
        "",
        "    Thread t1 = new Thread(task);",
        "    Thread t2 = new Thread(task);",
        "    t1.start(); t2.start();",
        "    t1.join();  t2.join();",
        "",
        "    // 기대: 200000, 실제: 그때그때 다른, 더 작은 수",
        "    System.out.println(\"count = \" + count);",
        "    // => count = 137492   (실행마다 다름, 200000 미만)",
        "  }",
        "}",
      ] },
      visibility: { lang: "java", filename: "Visibility.java — 멈추지 않는 반복문", lines: [
        "public class Visibility {",
        "  // volatile 없으면: writer가 바꿔도 reader가 옛 값을 계속 봄",
        "  private static volatile boolean running = true;",
        "",
        "  public static void main(String[] args) throws InterruptedException {",
        "    Thread worker = new Thread(() -> {",
        "      long n = 0;",
        "      while (running) {   // volatile 이라 최신 값을 읽는다",
        "        n++;",
        "      }",
        "      System.out.println(\"멈춤. 반복 \" + n + \"회\");",
        "    });",
        "    worker.start();",
        "",
        "    Thread.sleep(50);",
        "    running = false;   // 다른 스레드에게 정지 신호",
        "    // volatile 이 없다면 worker 는 이 변경을 못 보고 무한루프!",
        "    worker.join();",
        "    // => 멈춤. 반복 4821337회",
        "",
        "    // 주의: volatile 은 가시성만. count++ 누적엔 부족하다.",
        "  }",

          <div className="grid grid-cols-2 gap-2">
            <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2 text-center">
              <div className="text-[10px] text-emerald-800">기대값 (2회 증가)</div>
              <div className="text-lg font-bold text-emerald-700 font-mono">2</div>
            </div>
            <div className={`rounded-lg border-2 p-2 text-center ${fr.done === 'lost' ? 'border-red-400 bg-red-50' : 'border-slate-200 bg-white'}`}>
              <div className="text-[10px] text-red-700">실제 결과</div>
              <div className={`text-lg font-bold font-mono ${fr.done === 'lost' ? 'text-red-600' : 'text-slate-400'}`}>{fr.done === 'lost' ? '1 ✗' : fr.shared}</div>
            </div>
          </div>
          <div className="text-center text-[9px] text-slate-500">한 번의 증가가 사라졌다 — synchronized / AtomicInteger로 원자화하면 항상 2가 된다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 가시성: 코어 캐시 vs 메인 메모리
    // ─────────────────────────────────────────────────────
    function VisibilityView({ visibility }) {
      const TONE = { good: 'border-emerald-300 bg-emerald-50 text-emerald-800', bad: 'border-red-300 bg-red-50 text-red-800' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">👁️ 캐시된 값 때문에 변경이 안 보인다</div>
            <div className="grid grid-cols-2 gap-2 mb-2">
              {visibility.caches.map((c, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 ${TONE[c.tone]}`}>
                  <div className="text-[10px] font-bold mb-1">{c.core}</div>
                  <div className="text-[11px] font-mono font-bold">running = {c.sees}</div>
                  <div className="text-[9px] mt-1 opacity-90">{c.note}</div>
                </div>
              ))}
            </div>
            <div className="text-center text-orange-500 text-sm">▼ 캐시는 뒤늦게 반영 ▼</div>
            <div className="mt-1 rounded border-2 border-dashed border-orange-300 bg-[#eaf2fb] px-2 py-1.5 text-center">
              <span className="text-[10px] text-slate-500">{visibility.main.label}: </span>
              <span className="text-[11px] font-mono font-bold text-[#8a4200]">{visibility.main.field} = {visibility.main.updated}</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-2.5">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🔧 volatile — 무엇을 하고 무엇을 못 하나</div>
            <div className="space-y-1.5">
              {visibility.fixes.map((x, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 flex items-start gap-2 ${x.ok ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                  <span className="text-[11px]">{x.ok ? '✅' : '🚫'}</span>
                  <span><span className="text-[11px] font-bold font-mono text-[#8a4200]">{x.k}</span><span className="text-[10px] text-slate-700"> — {x.v}</span></span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — synchronized: 상호배제 + 데드락 도식
    // ─────────────────────────────────────────────────────
    function SyncView({ sync }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🔒 모니터 락 — 한 번에 한 스레드만 임계구역</div>
            <div className="flex items-center gap-2 mb-2">
              <div className="rounded border-2 border-[#E76F00] bg-orange-50 px-2 py-1.5 flex-1 text-center">
                <div className="text-[10px] font-bold text-emerald-700">🔓 {sync.holder}</div>
              </div>
              <span className="text-orange-500 text-[10px] font-bold">락</span>
              <div className="rounded border-2 border-slate-300 bg-slate-50 px-2 py-1.5 flex-1 text-center">
                <div className="text-[10px] font-bold text-slate-500">⏳ {sync.waiter}</div>
              </div>
            </div>
            <div className="rounded bg-slate-800 text-slate-100 px-2 py-1.5 font-mono text-[10px] text-center">{sync.critical}</div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">💀 데드락 — 서로가 쥔 락을 기다림</div>
            <div className="grid grid-cols-2 gap-2">
              <div className="rounded border border-red-300 bg-white px-2 py-1.5">
                <div className="text-[10px] font-bold text-[#8a4200]">T1</div>
                <div className="text-[10px] text-emerald-700">쥠: {sync.deadlock.t1.holds}</div>
                <div className="text-[10px] text-red-600">원함: {sync.deadlock.t1.wants} ⏳</div>
              </div>
              <div className="rounded border border-red-300 bg-white px-2 py-1.5">
                <div className="text-[10px] font-bold text-[#8a4200]">T2</div>
                <div className="text-[10px] text-emerald-700">쥠: {sync.deadlock.t2.holds}</div>
                <div className="text-[10px] text-red-600">원함: {sync.deadlock.t2.wants} ⏳</div>
              </div>
            </div>
            <div className="mt-2 text-center text-[10px] text-red-700 font-bold">↻ 순환 대기 → 둘 다 영원히 멈춤</div>
            <div className="mt-1 rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-[10px] text-emerald-800">✅ {sync.deadlock.fix}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — Atomic: CAS 루프
    // ─────────────────────────────────────────────────────
    function AtomicView({ atomic }) {
      const ICON = { read: '📖', compute: '🧮', CAS: '🔁', result: '✅' };
      const TONE = { good: 'border-emerald-300 bg-emerald-50 text-emerald-800', mid: 'border-[#a7c7e7] bg-[#eaf2fb] text-[#8a4200]' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🔁 CAS — 비교하고, 같으면 바꾼다 (incrementAndGet)</div>
            <div className="space-y-1.5">
              {atomic.steps.map((s, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-6 h-6 rounded-full bg-[#E76F00] text-white text-[11px] font-bold flex items-center justify-center">{s.n}</span>
                  <span className="text-sm">{ICON[s.t]}</span>
                  <div className="flex-1 rounded border border-[#a7c7e7] bg-[#eaf2fb] px-2 py-1 text-[10px] text-slate-700">
                    <span className="font-mono font-bold text-[#8a4200] mr-1">{s.t}</span>{s.d}
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-center text-[9px] text-slate-500">실패하면 처음으로 돌아가 재시도 → 락 없이(lock-free) 항상 정확</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-2.5">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🧭 Atomic vs synchronized — 무엇을 언제</div>
            <div className="space-y-1.5">
              {atomic.pick.map((p, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 flex items-center gap-2 ${TONE[p.tone]}`}>
                  <span className="text-[10px] flex-1 text-slate-700">{p.who}</span>
                  <span className="text-[10px] font-mono font-bold rounded bg-white border border-[#a7c7e7] px-1.5 py-0.5 text-[#8a4200]">{p.use}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 고수준 도구: 스레드 풀 + 작업 큐
    // ─────────────────────────────────────────────────────
    function ExecutorView({ executor }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🏭 스레드 풀 — 미리 만들어 재사용</div>
            {/* 작업 큐 */}
            <div className="mb-2">
              <div className="text-[10px] font-bold text-slate-500 mb-1">작업 큐 (제출된 task)</div>
              <div className="flex gap-1.5">
                {executor.queue.map((t, i) => (
                  <span key={i} className="rounded border border-orange-300 bg-orange-50 px-2 py-1 font-mono text-[10px] font-bold text-[#8a4200]">{t}</span>
                ))}
              </div>
            </div>
            <div className="text-center text-orange-500 text-sm">▼ 풀이 배정 ▼</div>
            {/* 워커 */}
            <div className="mt-1">
              <div className="text-[10px] font-bold text-slate-500 mb-1">{executor.pool}</div>
              <div className="grid grid-cols-4 gap-1.5">
                {executor.workers.map((w, i) => (
                  <span key={i} className="rounded border-2 border-[#a7c7e7] bg-[#eaf2fb] px-1 py-1 font-mono text-[9px] font-bold text-center text-[#8a4200]">{w}</span>
                ))}
              </div>
            </div>
            <div className="mt-2 rounded border border-red-300 bg-red-50 px-2 py-1 text-[9px] text-red-700">🚫 {executor.antipattern}</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-2.5">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🧰 java.util.concurrent 핵심 도구</div>
            <div className="space-y-1.5">
              {executor.tools.map((t, i) => (
                <div key={i} className="rounded border border-slate-200 bg-white px-2 py-1.5">
                  <span className="text-[11px] font-mono font-bold text-[#8a4200]">{t.k}</span>
                  <span className="text-[10px] text-slate-700"> — {t.v}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf2fb]', border: 'border-[#a7c7e7]', text: 'text-[#8a4200]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java 오렌지 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      threads:    { icon: '🧵', label: '스레드' },
      race:       { icon: '🏁', label: '레이스 컨디션' },
      visibility: { icon: '👁️', label: '가시성 / volatile' },
      sync:       { icon: '🔒', label: 'synchronized / 데드락' },
      atomic:     { icon: '🔁', label: 'Atomic / CAS' },
      executor:   { icon: '🏭', label: '고수준 도구' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.threads;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#8a4200] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>동시성 시뮬레이터 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#8a4200] font-mono mb-3 px-2 py-1 rounded bg-[#eaf2fb] border border-[#a7c7e7]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'threads' && <ThreadsView threads={state.threads} />}
          {state.stage === 'race' && <RaceView />}
          {state.stage === 'visibility' && <VisibilityView visibility={state.visibility} />}
          {state.stage === 'sync' && <SyncView sync={state.sync} />}
          {state.stage === 'atomic' && <AtomicView atomic={state.atomic} />}
          {state.stage === 'executor' && <ExecutorView executor={state.executor} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-[#E76F00] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅴ. 현장 투입</span>
              <div>
                <h1 className="text-2xl font-bold text-[#8a4200]"><span className="font-mono text-lg mr-1">V-1-2</span> 스레드와 동시성 기초</h1>
                <p className="text-sm text-[#8a4200]/80">스레드·공유상태의 위험(레이스 컨디션)과 동기화·고수준 동시성 도구</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#8a4200] text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#8a4200] text-white' : 'bg-[#E76F00] text-white hover:bg-[#8a4200]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#E76F00] bg-white px-4 py-3 text-sm text-[#8a4200]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                스레드는 프로세스 안의 실행 흐름이고 같은 Heap을 공유한다 — 이 공유가 레이스 컨디션(읽기-수정-쓰기 인터리빙에 의한 lost update)과 가시성(캐시된 옛 값) 문제를 낳는다.
                해결 도구는 계층적이다: synchronized(상호배제·모니터 락, 대신 데드락 주의), AtomicInteger(CAS 무잠금, 단일 변수에 빠름), volatile(가시성만, 원자성 아님).
                실무 원칙은 하나로 수렴한다 — 저수준 wait/notify·수동 스레드 대신 java.util.concurrent(ExecutorService·스레드 풀·CompletableFuture·ConcurrentHashMap)에 작업을 맡기고, 스레드 남발과 락 순서 엇갈림을 피하라.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['스레드', 'Runnable', '레이스컨디션', 'lost update', '가시성', 'volatile', 'synchronized', '모니터락', '데드락', 'Atomic', 'CAS', 'ExecutorService', '스레드풀', 'CompletableFuture', 'ConcurrentHashMap'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-[#8a4200] border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#8a4200]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
