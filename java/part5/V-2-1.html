  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Java V-2-1 — Maven·Gradle 빌드
    학습 목표: 빌드 도구가 의존성·컴파일·테스트·패키징을 자동화하는 원리를 추적하고,
              수동 javac/classpath 지옥이 왜 표준 라이프사이클로 대체되었는지,
              Maven(선언형 pom.xml) vs Gradle(태스크 그래프·증분 빌드)의 차이,
              전이 의존성·버전 충돌·래퍼(wrapper)의 실무 함정을 5단계로 뜯어본다.
    패턴: fastapi v1 — 좌(LiveDataPane: 라이프사이클 애니메이션·pom vs gradle 대비·의존성 트리·충돌 해결) / 우(VSCode CodeViewer: pom.xml·build.gradle·셸)
    색상: Java 오렌지 #E76F00 기조 / 형광펜·배경 채움 옅은 파랑 #a7c7e7 / 텍스트·링크·배지 오렌지 다크 #8a4200
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 수동 지옥 → Maven → Gradle → 의존성/충돌 → 래퍼·멀티모듈
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(manual/maven/gradle/deps/wrapper)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      k1: {lang:"bash", filename:"terminal — 빌드 도구 없이 손으로 하면", lines:[
        "# 1) 라이브러리를 직접 내려받아 lib/ 에 둔다",
        "#    Jackson 하나 쓰려면 전이 의존성까지 손으로 추적:",
        "#    jackson-databind, jackson-core, jackson-annotations ...",
        "$ ls lib/",
        "jackson-annotations-2.17.jar  jackson-core-2.17.jar",
        "jackson-databind-2.17.jar     ... (계속 늘어남)",
        "",
        "# 2) 컴파일할 때마다 classpath를 손으로 나열 (지옥)",
        "$ javac -cp \"lib/jackson-databind-2.17.jar:lib/jackson-core-2.17.jar:lib/jackson-annotations-2.17.jar\" \\",
        "        -d out src/App.java",
        "",
        "# 3) 실행할 때도 똑같이 다시 나열",
        "$ java -cp \"out:lib/jackson-databind-2.17.jar:lib/jackson-core-2.17.jar:lib/jackson-annotations-2.17.jar\" App",
        "",
        "# 4) 테스트·패키징 순서도 매번 손으로...",
        "$ javac -cp ... test/AppTest.java   # 컴파일",
        "$ java  -cp ... org.junit.runner...  # 테스트",
        "$ jar cfe app.jar App -C out .       # 패키징",
        "",
        "#  => 파일이 수백 개면 사람이 관리 불가.",
        "#     빌드 도구(Maven/Gradle)가 이 전부를 자동화한다.",
      ]},
      k2: {lang:"xml", filename:"pom.xml — 무엇을 원하는지 선언", lines:[
        "<project xmlns=\"http://maven.apache.org/POM/4.0.0\">",
        "  <modelVersion>4.0.0</modelVersion>",
        "",
        "  <!-- 이 프로젝트 자신의 좌표 -->",
        "  <groupId>com.example</groupId>",
        "  <artifactId>my-app</artifactId>",
        "  <version>1.0.0</version>",
        "  <packaging>jar</packaging>",
        "",
        "  <properties>",
        "    <maven.compiler.release>21</maven.compiler.release>",
        "  </properties>",
        "",
        "  <dependencies>",
        "    <!-- 좌표만 적으면 전이 의존성까지 자동 -->",
        "    <dependency>",
        "      <groupId>com.fasterxml.jackson.core</groupId>",
        "      <artifactId>jackson-databind</artifactId>",
        "      <version>2.17.1</version>",
        "    </dependency>",
        "",
        "    <!-- scope=test: 최종 jar 에는 안 들어간다 -->",
        "    <dependency>",
        "      <groupId>org.junit.jupiter</groupId>",
        "      <artifactId>junit-jupiter</artifactId>",
        "      <version>5.10.2</version>",
        "      <scope>test</scope>",
        "    </dependency>",
        "  </dependencies>",
        "</project>",
        "",
        "<!-- $ mvn package  → compile·test 가 자동 선행된 뒤 jar 생성 -->",
      ]},
      k3: {lang:"gradle", filename:"build.gradle — 같은 프로젝트, 훨씬 짧게", lines:[
        "plugins {",
        "    id 'java'",
        "}",
        "",
        "java {",
        "    // 툴체인으로 JDK 버전 고정 (재현성)",
        "    toolchain { languageVersion = JavaLanguageVersion.of(21) }",
        "}",
        "",
        "repositories {",
        "    mavenCentral()   // 중앙 저장소",
        "}",

    const S1 = { title:"Step 1. 왜 빌드 도구인가 — 수동 javac·classpath 지옥", desc:"작은 예제는 javac Hello.java 한 줄로 끝나지만, 실무 프로젝트는 그렇게 굴러가지 않는다. 라이브러리 하나(예: Jackson)를 쓰려면 그 라이브러리가 의존하는 다른 jar까지 전부 직접 내려받아 lib 폴더에 넣고, javac와 java를 실행할 때마다 -cp에 그 경로를 일일이 나열해야 한다. 파일이 수백 개가 되면 이 classpath 문자열은 사람이 관리할 수 없는 지옥이 된다. 게다가 \"컴파일→테스트→패키징\" 순서를 매번 손으로 챙겨야 하고, 내 PC에서 되던 빌드가 동료 PC나 CI에서는 라이브러리 버전이 달라 깨진다. 빌드 도구는 이 세 가지를 자동화한다 — ① 의존성을 좌표만 적으면 중앙 저장소에서 전이 의존성까지 자동으로 받아오고, ② compile·test·package라는 표준 라이프사이클을 강제하며, ③ 같은 설정 파일을 커밋해 두면 누가 어디서 빌드해도 같은 결과(재현 가능한 빌드)가 나온다." };
    const S2 = { title:"Step 2. Maven — pom.xml 선언형 좌표와 표준 라이프사이클", desc:"Maven의 철학은 \"설정보다 관습(Convention over Configuration)\"이다. src/main/java, src/test/java 같은 폴더 구조를 약속으로 정해두고, 우리는 pom.xml에 \"무엇을 원하는지\"만 XML로 선언한다. 의존성은 groupId:artifactId:version이라는 좌표(coordinate) 세 값으로 가리키기만 하면 Maven이 중앙 저장소(Maven Central)에서 그 jar와 전이 의존성을 자동으로 내려받아 로컬 ~/.m2 캐시에 저장한다. 빌드는 정해진 라이프사이클 순서(validate→compile→test→package→verify→install→deploy)를 따르며, mvn package를 부르면 그 앞 단계(compile·test)가 자동으로 먼저 실행된다. 실무에서 자주 넘어지는 지점은 의존성 스코프다 — scope를 test로 준 라이브러리는 컴파일·테스트에서만 보이고 최종 jar에는 안 들어가며, provided는 컴파일엔 필요하지만 런타임엔 서버가 제공한다고 가정한다. 스코프를 잘못 이해하면 \"로컬 테스트는 되는데 배포하면 ClassNotFound\"가 난다." };
    const S3 = { title:"Step 3. Gradle — build.gradle DSL·태스크 그래프·증분 빌드", desc:"Gradle은 같은 문제를 다른 방식으로 푼다. XML 대신 Groovy나 Kotlin으로 쓰는 DSL(build.gradle / build.gradle.kts)을 쓰기 때문에 설정이 훨씬 짧고, 필요하면 그 안에 로직(조건·반복)도 넣을 수 있다. 내부적으로 빌드를 \"태스크(task) 그래프\"로 모델링하는 것이 핵심이다 — compileJava, test, jar 같은 태스크마다 입력과 출력을 선언해 두고, 의존 관계를 방향 그래프(DAG)로 연결한다. 그 덕에 Gradle은 입력이 바뀐 태스크만 다시 실행하는 증분 빌드(incremental build)를 하고, 한 번 계산한 출력은 빌드 캐시에 저장해 다음번(심지어 다른 사람·CI)에 재사용한다. 그래서 두 번째 빌드부터는 \"UP-TO-DATE\"로 건너뛰며 Maven보다 확연히 빠르다. 정리하면 Maven은 관습에 기대 단순·표준을 얻고, Gradle은 유연성과 속도를 얻는다 — 어느 쪽이 우월하다기보다, 표준화가 중요하면 Maven, 빌드가 크고 커스터마이즈·속도가 중요하면 Gradle을 고른다." };
    const S4 = { title:"Step 4. 의존성 관리 — 전이 의존성·버전 충돌·BOM", desc:"빌드 도구의 진짜 가치는 전이 의존성(transitive dependency) 처리에 있다. 내가 A를 선언하면 A가 의존하는 B, B가 의존하는 C까지 자동으로 딸려온다. 문제는 서로 다른 두 라이브러리가 같은 라이브러리의 다른 버전을 요구할 때다 — 예를 들어 라이브러리 X는 guava:30을, Y는 guava:32를 끌어오면 하나의 클래스패스에 두 버전이 공존할 수 없다. 이때 Maven은 \"가장 가까운 정의(nearest wins)\" 규칙으로, Gradle은 기본적으로 \"가장 높은 버전\"으로 충돌을 해결한다. 이 자동 해결이 엉뚱한 버전을 골라 런타임에 NoSuchMethodError·NoClassDefFoundError를 내는 것이 실무에서 가장 흔한 사고다. 그래서 ① mvn dependency:tree / gradle dependencies로 실제로 어떤 버전이 선택됐는지 트리를 눈으로 확인하고, ② 여러 모듈이 버전을 공유해야 하면 BOM(Bill of Materials)으로 버전을 한곳에서 고정하며, ③ 정말 위험하면 명시적으로 버전을 강제(dependencyManagement / constraints)한다. 버전은 \"알아서 되겠지\"가 아니라 반드시 검증하는 대상이다." };
    const S5 = { title:"Step 5. 래퍼(wrapper)·멀티모듈 — 재현 가능한 빌드의 완성", desc:"마지막 조각은 \"빌드 도구 자신의 버전\"이다. 팀원 A는 Gradle 8.5, B는 7.6을 로컬에 깔아뒀다면 같은 프로젝트도 다르게 빌드될 수 있다. 이를 막는 것이 래퍼(mvnw / gradlew)다 — 프로젝트에 래퍼 스크립트와 버전을 못박은 설정(gradle-wrapper.properties)을 커밋해 두면, 누구든 ./gradlew build만 치면 지정된 버전의 Gradle을 자동으로 내려받아 그 버전으로 빌드한다. 그래서 실무에서는 로컬에 깔린 gradle이 아니라 항상 ./gradlew(맥·리눅스) 또는 gradlew.bat(윈도우)을 쓰는 것이 규칙이다. 여기에 규모가 커지면 멀티모듈로 쪼갠다 — 부모(루트)가 공통 버전·설정을 관리하고, 자식 모듈(api, service, common)이 서로를 의존한다. 정리하면 재현 가능한 빌드의 3요소는 ① 의존성 버전 고정(BOM·lock), ② JDK 버전 고정(toolchain), ③ 빌드 도구 버전 고정(wrapper)이다. 이 셋을 커밋하면 \"내 PC에선 되는데 CI에선 안 돼요\"가 사라진다. 다음 장(V-2-2)에서는 이렇게 빌드한 산출물을 컨테이너로 패키징하는 흐름을 다룬다." };

            <div className="text-[11px] font-bold text-emerald-900 mb-1">⚡ {gradle.second.title}</div>
            <div className="text-[10px] text-emerald-800">{gradle.second.note}</div>
            <div className="mt-1.5 flex gap-1.5">
              <span className="text-[9px] font-mono rounded bg-white border border-emerald-300 text-emerald-800 px-1.5 py-0.5">compileJava UP-TO-DATE</span>
              <span className="text-[9px] font-mono rounded bg-white border border-emerald-300 text-emerald-800 px-1.5 py-0.5">test UP-TO-DATE</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">⚖️ Maven vs Gradle</div>
            <div className="space-y-1">
              {gradle.compare.map((c, i) => (
                <div key={i} className="rounded border border-slate-200 bg-white px-2 py-1.5">
                  <span className={`text-[11px] font-bold ${TONE[c.tone]}`}>{c.k}</span>
                  <span className="text-[10px] text-slate-700 ml-2">{c.v}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 의존성 트리 + 충돌 해결
    // ─────────────────────────────────────────────────────
    function DepsView({ deps }) {
      const CONF = { win: 'border-2 border-emerald-400 bg-emerald-50 text-emerald-900', lose: 'border border-red-300 bg-red-50 text-red-800 line-through' };
      return (
        <div className="space-y-2.5">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🌳 의존성 트리 — 전이 의존성이 충돌</div>
            <div className="space-y-1 font-mono">
              {deps.tree.map((n, i) => (
                <div key={i} className="flex items-center" style={{ paddingLeft: `${n.d * 18}px` }}>
                  {n.d > 0 && <span className="text-orange-400 text-[10px] mr-1">└─</span>}
                  <span className={`text-[10px] rounded px-2 py-1 ${n.conflict ? CONF[n.conflict] : 'border border-[#a7c7e7] bg-[#eaf2fb] text-[#8a4200]'}`}>{n.name}</span>
                  <span className="text-[9px] text-slate-500 ml-1.5">{n.tag}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🧭 {deps.resolve.title}</div>
            <div className="space-y-1">
              {deps.resolve.rows.map((r, i) => (
                <div key={i} className="rounded border border-slate-200 bg-white px-2 py-1 flex items-center gap-2">
                  <span className="text-[10px] font-bold text-[#8a4200] w-14">{r.tool}</span>
                  <span className="text-[10px] text-slate-700 flex-1">{r.rule}</span>
                </div>
              ))}
            </div>
            <div className="mt-1.5 text-center text-[10px] font-bold rounded bg-emerald-100 border border-emerald-300 text-emerald-900 py-1">{deps.resolve.picked}</div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[10px] text-red-800">🚨 {deps.risk}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 래퍼 흐름 + 멀티모듈 + 재현성 3요소
    // ─────────────────────────────────────────────────────
    function WrapperView({ wrapper }) {
      return (
        <div className="space-y-2.5">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">📦 래퍼 — 로컬 버전이 달라도 동일 빌드</div>
            <div className="space-y-1.5">
              {wrapper.flow.map((f, i) => (
                <div key={i} className="rounded border border-[#a7c7e7] bg-[#eaf2fb] px-2 py-1.5 flex items-center gap-2">
                  <span className="text-[10px] font-bold text-[#8a4200] w-20">{f.who}</span>
                  <span className="text-[9px] text-slate-500 w-24">로컬: {f.local}</span>
                  <span className="text-[10px] font-mono rounded bg-white border border-orange-300 text-[#8a4200] px-1.5 py-0.5">{f.cmd}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-center text-[10px] font-bold text-emerald-800 bg-emerald-50 border border-emerald-300 rounded py-1">{wrapper.pinned}</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🧱 멀티모듈 — 부모가 관리, 자식이 의존</div>
            <div className="space-y-1">
              {wrapper.modules.map((m, i) => (
                <div key={i} className="rounded border border-slate-200 bg-white px-2 py-1 flex items-center gap-2" style={{ marginLeft: `${i * 12}px` }}>
                  <span className="text-[10px] font-mono font-bold text-[#8a4200] w-24">{m.name}</span>
                  <span className="text-[10px] text-slate-700 flex-1">{m.role}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-3">
            <div className="text-[11px] font-bold text-emerald-900 mb-1.5">✅ 재현 가능한 빌드 3요소</div>
            <div className="flex flex-col gap-1">
              {wrapper.three.map((t, i) => (
                <div key={i} className="text-[10px] text-emerald-800 flex items-center gap-1.5">
                  <span className="w-4 h-4 rounded-full bg-emerald-500 text-white text-[9px] flex items-center justify-center font-bold">{i + 1}</span>
                  {t}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf2fb]', border: 'border-[#a7c7e7]', text: 'text-[#8a4200]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java 오렌지 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      manual:  { icon: '🔥', label: '수동 빌드의 한계' },
      maven:   { icon: '📜', label: 'Maven — pom.xml' },
      gradle:  { icon: '🐘', label: 'Gradle — build.gradle' },
      deps:    { icon: '🌳', label: '의존성·충돌 해결' },
      wrapper: { icon: '📦', label: '래퍼·멀티모듈' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.manual;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#8a4200] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>빌드 도구 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#8a4200] font-mono mb-3 px-2 py-1 rounded bg-[#eaf2fb] border border-[#a7c7e7]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'manual' && <ManualView manual={state.manual} />}
          {state.stage === 'maven' && <MavenView maven={state.maven} />}
          {state.stage === 'gradle' && <GradleView gradle={state.gradle} />}
          {state.stage === 'deps' && <DepsView deps={state.deps} />}
          {state.stage === 'wrapper' && <WrapperView wrapper={state.wrapper} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-[#E76F00] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅴ. 현장 투입</span>
              <div>
                <h1 className="text-2xl font-bold text-[#8a4200]"><span className="font-mono text-lg mr-1">V-2-1</span> Maven·Gradle 빌드</h1>
                <p className="text-sm text-[#8a4200]/80">빌드 도구가 의존성·컴파일·테스트·패키징을 자동화하는 원리와 Maven vs Gradle</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#8a4200] text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#8a4200] text-white' : 'bg-[#E76F00] text-white hover:bg-[#8a4200]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#E76F00] bg-white px-4 py-3 text-sm text-[#8a4200]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                빌드 도구는 수동 javac·classpath 지옥을 세 가지로 자동화한다 — 의존성 자동 다운로드(좌표), 표준 라이프사이클(compile·test·package), 재현 가능한 빌드.
                Maven은 XML 선언형 pom.xml과 관습으로 표준화·단순을, Gradle은 DSL·태스크 DAG·증분 빌드로 유연성과 속도를 얻는다.
                전이 의존성 버전 충돌은 가장 흔한 사고 — dependency:tree로 검증하고 BOM으로 고정한다.
                재현 가능한 빌드의 3요소는 의존성 버전·JDK 버전(toolchain)·빌드 도구 버전(wrapper)이며, 이 셋을 커밋하면 "내 PC에선 됨" 사고가 사라진다. 다음 장 V-2-2에서 컨테이너 패키징을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Maven', 'Gradle', 'pom.xml', 'build.gradle', '좌표', '라이프사이클', '전이의존성', '버전충돌', 'BOM', '스코프', '증분빌드', 'wrapper', '멀티모듈', '재현성'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-[#8a4200] border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#8a4200]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
