  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    Java V-2-2 — 종합: 미니 주문 도메인 구현 (java Part5 마지막 장)
    학습 목표: 앞서 배운 OOP·컬렉션·제네릭·record·예외·Stream·Optional·sealed를 하나의
              작은 주문 도메인(Order·OrderItem·Product·Money)으로 합쳐, 각 개념이 실무
              설계에서 어떤 역할을 맡는지 5단계로 조립한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 값객체·엔티티·컬렉션·합계/할인·상태전이 시뮬레이션) / 우(VSCode CodeViewer: 실전 java)
    색상: Java 오렌지 #E76F00 기조 / 형광펜·배경 채움 옅은 파랑 #a7c7e7 / 텍스트·링크·배지 오렌지 다크 #8a4200
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 값 객체(record) → 엔티티(class·캡슐화) →
    //   컬렉션·제네릭(항목 담기) → Stream·다형성·Optional(합계·할인·조회) →
    //   sealed(주문 상태 모델링·전이)
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code, concepts(적용 챕터 배지) }
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. 값 객체는 record — Money·Product를 불변으로',
        desc: '도메인을 만들 때 첫 갈림길은 "이건 값인가, 실체인가"다. 3000원이라는 금액이나 "아메리카노"라는 상품은 그 값 자체가 정체성인 값 객체(Value Object)다. 3000원 두 개는 완전히 같은 것으로 취급돼야 하고, 한 번 만들어지면 바뀌면 안 된다. 자바 16+의 record는 바로 이 값 객체를 위해 태어났다 — 필드를 final로 고정하고, 생성자·게터·equals·hashCode·toString을 자동으로 만들어 준다. 특히 equals/hashCode가 "필드 값이 같으면 같은 객체"로 동작하기 때문에, Money(3000)와 Money(3000)이 Set이나 Map 키로 써도 올바르게 중복 처리된다. compact 생성자에 검증을 한 줄 넣으면, 음수 금액 같은 잘못된 값 객체는 아예 생성 자체가 막힌다.',
        actor: '💎 record Money · Product — 불변 값 객체',
        stage: 'value',
        stageLabel: '값 객체 (record)',
        concepts: ['record', 'equals/hashCode', '불변', '예외(검증)'],
        value: {
          records: [
            { name: 'Money', fields: 'long amount', note: '금액 · 음수 금지', sample: 'Money(3000)' },
            { name: 'Product', fields: 'String name, Money price', note: '상품 · 이름+가격', sample: 'Product("아메리카노", 3000원)' },
          ],
          equalsDemo: {
            title: 'equals — 값이 같으면 같은 객체',
            rows: [
              { expr: 'new Money(3000).equals(new Money(3000))', result: 'true', tone: 'good' },
              { expr: 'new Money(3000).equals(new Money(4500))', result: 'false', tone: 'bad' },
            ],
            note: 'record가 필드 기반 equals/hashCode를 자동 생성 → Set·Map 키로 안전',
          },
        },
        alert: { tone: 'info', text: '값 객체 = 값이 곧 정체성 + 불변. record가 final 필드·equals·hashCode·toString을 자동 생성한다. compact 생성자에서 불변식(음수 금지 등)을 검증하면 잘못된 값은 아예 못 태어난다.' },
        code: {
          lang: 'java',
          filename: 'Money.java · Product.java — 값 객체',
          lines: [
            '// 값 객체(Value Object): 값이 같으면 같은 것 + 불변',
            '// record가 생성자·게터·equals·hashCode·toString 자동 생성',
            'public record Money(long amount) {',
            '',
            '  // compact 생성자 — 불변식(invariant) 검증',
            '  public Money {',
            '    if (amount < 0)',
            '      throw new IllegalArgumentException("금액은 음수일 수 없다: " + amount);',
            '  }',
            '',
            '  // 값 객체는 스스로 계산해서 "새 값"을 돌려준다 (자기 자신은 안 바뀜)',
            '  public Money plus(Money other) { return new Money(amount + other.amount); }',
            '  public Money times(int qty)    { return new Money(amount * qty); }',
            '}',
            '',
            'public record Product(String name, Money price) {',
            '  public Product {',
            '    if (name == null || name.isBlank())',
            '      throw new IllegalArgumentException("상품명은 필수");',
            '  }',
            '}',
            '',
            '// 값이 같으면 같은 객체로 취급된다',
            'var a = new Money(3000);',
            'var b = new Money(3000);',
            'System.out.println(a.equals(b));  // => true  (필드 값 비교)',
            'System.out.println(a.plus(b));    // => Money[amount=6000]',
          ],
          highlight: [2, 3, 6, 7, 8],
        },
      },

            <div className="rounded-lg border-2 border-[#E76F00] bg-orange-100 p-2.5">
              <div className="text-[10px] font-mono font-bold text-[#8a4200] mb-1.5">class {entity.className} {'{'}</div>
              <div className="space-y-1 pl-2">
                {entity.fields.map((f, i) => (
                  <div key={i} className="flex items-center gap-2 rounded border border-[#a7c7e7] bg-white px-2 py-1">
                    <span>{f.locked ? '🔐' : '🔓'}</span>
                    <span className="text-[9px] font-mono text-red-600 font-bold">{f.vis}</span>
                    <span className="text-[10px] font-mono text-slate-700">{f.type} {f.name}</span>
                  </div>
                ))}
              </div>
              <div className="text-[10px] font-mono font-bold text-[#8a4200] mt-1.5">{'}'}</div>
            </div>
            <div className="mt-2 text-[9px] text-slate-600">{entity.why}</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🛡️ {entity.guard.title}</div>
            <div className="rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-[10px] font-mono text-emerald-800 mb-1">
              불변식: {entity.guard.rule}
            </div>
            <div className="rounded border border-red-300 bg-red-50 px-2 py-1">
              <div className="text-[9px] font-mono text-slate-700">{entity.guard.bad}</div>
              <div className="text-[10px] font-mono text-red-700 font-bold mt-0.5">🚨 {entity.guard.badResult}</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 컬렉션(항목 리스트) + 타입 안전 + 방어적 복사
    // ─────────────────────────────────────────────────────
    function CollectionView({ collection }) {
      const total = collection.items.reduce((s, it) => s + it.subtotal, 0);
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-[11px] font-bold text-[#8a4200]">📦 {collection.order}</span>
              <span className="text-[9px] font-mono text-slate-500">List&lt;OrderItem&gt;</span>
            </div>
            <div className="space-y-1.5">
              {collection.items.map((it, i) => (
                <div key={i} className="rounded border border-[#a7c7e7] bg-[#eaf2fb] px-2 py-1.5 flex items-center gap-2">
                  <span className="text-[9px] font-mono text-slate-400 w-4">[{i}]</span>
                  <span className="text-[10px] font-bold text-[#8a4200] flex-1">{it.product}</span>
                  <span className="text-[9px] font-mono text-slate-500">{it.price}×{it.qty}</span>
                  <span className="text-[10px] font-mono font-bold text-[#8a4200] w-14 text-right">{it.subtotal.toLocaleString()}원</span>
                </div>
              ))}
            </div>
            <div className="mt-1.5 pt-1.5 border-t border-[#a7c7e7]/50 flex justify-between text-[10px]">
              <span className="text-slate-500">항목 {collection.items.length}개</span>
              <span className="font-mono font-bold text-[#8a4200]">소계 합 {total.toLocaleString()}원</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3 space-y-1.5">
            <div className="text-[11px] font-bold text-[#8a4200]">🧷 제네릭 타입 안전 · 방어적 복사</div>
            <div className="rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-[9px] font-mono text-emerald-800">✓ {collection.typeSafe.good}</div>
            <div className="rounded border border-red-300 bg-red-50 px-2 py-1 text-[9px] font-mono text-red-700">✗ {collection.typeSafe.bad}</div>
            <div className="text-[9px] text-slate-600 mt-1">🛡️ {collection.defensive}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — Stream 합계 + 할인 정책 다형성 + Optional
    // ─────────────────────────────────────────────────────
    function CalcView({ calc }) {
      const TONE = { good: 'border-emerald-300 bg-emerald-50 text-emerald-800', mid: 'border-[#a7c7e7] bg-[#eaf2fb] text-[#8a4200]' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🧮 Stream 합계 — 소계를 모아 reduce</div>
            <div className="flex items-center justify-center gap-1 flex-wrap mb-2">
              {calc.subtotals.map((s, i) => (
                <React.Fragment key={i}>
                  <span className="rounded border border-[#a7c7e7] bg-[#eaf2fb] px-2 py-1 text-[10px] font-mono text-[#8a4200]">{s.toLocaleString()}</span>
                  {i < calc.subtotals.length - 1 && <span className="text-orange-500 text-[11px] font-bold">+</span>}
                </React.Fragment>
              ))}
              <span className="text-orange-500 text-[11px] font-bold">=</span>
              <span className="rounded border-2 border-[#E76F00] bg-orange-100 px-2.5 py-1 text-[11px] font-mono font-bold text-[#8a4200]">{calc.total.toLocaleString()}원</span>
            </div>
            <div className="text-[9px] text-slate-500 text-center font-mono">items.stream().map(subtotal).reduce(Money::plus)</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🎭 DiscountPolicy 다형성 — 같은 호출, 다른 결과</div>
            <div className="space-y-1">
              {calc.policies.map((p, i) => (
                <div key={i} className={`rounded border px-2 py-1 flex items-center gap-2 ${TONE[p.tone]}`}>
                  <span className="text-[10px] font-mono font-bold flex-1">{p.name}</span>
                  <span className="text-[9px] font-mono text-slate-500">{p.calc}</span>
                  <span className="text-[10px] font-mono font-bold w-16 text-right">{p.result.toLocaleString()}원</span>
                </div>
              ))}
            </div>
            <div className="text-[9px] text-slate-500 mt-1">Order는 policy.applyTo()만 호출 — 정책이 뭔지 모른다(OCP).</div>
          </div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1">🎁 Optional 조회 — 없을 수 있음</div>
            <div className="text-[9px] font-mono text-slate-700">{calc.optional.expr}</div>
            <div className="text-[10px] font-mono text-emerald-700 mt-0.5">→ {calc.optional.some}</div>
            <div className="text-[9px] font-mono text-slate-500">{calc.optional.empty}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — sealed 상태 전이 다이어그램
    // ─────────────────────────────────────────────────────
    function SealedView({ sealed }) {
      const STONE = {
        wait: 'border-amber-300 bg-amber-50 text-amber-900',
        good: 'border-emerald-300 bg-emerald-50 text-emerald-800',
        bad: 'border-red-300 bg-red-50 text-red-700',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🔀 sealed OrderStatus — 봉인된 상태 4종</div>
            <div className="grid grid-cols-2 gap-1.5">
              {sealed.states.map((s, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 ${STONE[s.tone]}`}>
                  <div className="text-[10px] font-mono font-bold">{s.name}</div>
                  <div className="text-[9px]">{s.label}</div>
                </div>
              ))}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">permits로 봉인 → 이 4개 외의 상태는 존재 불가. switch 누락은 컴파일 에러.</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">➡️ 상태 전이 — 규칙을 메서드가 강제</div>
            <div className="space-y-1.5">
              {sealed.transitions.map((t, i) => (
                <div key={i} className={`rounded border px-2 py-1 flex items-center gap-1.5 ${t.ok ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                  <span className="text-[10px] font-mono font-bold text-[#8a4200]">{t.from}</span>
                  <span className={t.ok ? 'text-emerald-600' : 'text-red-500'}>{t.ok ? '──▶' : '──✗▶'}</span>
                  <span className="text-[10px] font-mono font-bold text-[#8a4200]">{t.to}</span>
                  <span className="text-[9px] font-mono text-slate-500 ml-auto">{t.via}</span>
                </div>
              ))}
            </div>
            {sealed.transitions.filter(t => !t.ok).map((t, i) => (
              <div key={i} className="mt-1 text-[9px] text-red-700 font-bold">🚨 {t.from}→{t.to}: {t.why} → InvalidOrderException</div>
            ))}
          </div>
          <div className="rounded-lg border-2 border-[#E76F00] bg-orange-100 p-2.5">
            <div className="text-[11px] font-bold text-[#8a4200] mb-0.5">🧱 계층 분리</div>
            <div className="text-[9px] text-[#8a4200]">{sealed.layers}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf2fb]', border: 'border-[#a7c7e7]', text: 'text-[#8a4200]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java 오렌지 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      value:      { icon: '💎', label: '값 객체 (record)' },
      entity:     { icon: '🔒', label: '엔티티 (캡슐화)' },
      collection: { icon: '📦', label: '컬렉션 · 제네릭' },
      calc:       { icon: '🧮', label: 'Stream · 다형성 · Optional' },
      sealed:     { icon: '🔀', label: 'sealed 상태' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.value;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#8a4200] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>주문 도메인 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <ConceptBadges concepts={state.concepts} />
          <div className="text-[10px] text-[#8a4200] font-mono mb-3 px-2 py-1 rounded bg-[#eaf2fb] border border-[#a7c7e7]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'value' && <ValueView value={state.value} />}
          {state.stage === 'entity' && <EntityView entity={state.entity} />}
          {state.stage === 'collection' && <CollectionView collection={state.collection} />}
          {state.stage === 'calc' && <CalcView calc={state.calc} />}
          {state.stage === 'sealed' && <SealedView sealed={state.sealed} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-[#E76F00] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅴ. 현장 투입</span>
              <div>
                <h1 className="text-2xl font-bold text-[#8a4200]"><span className="font-mono text-lg mr-1">V-2-2</span> 종합: 미니 주문 도메인 구현</h1>
                <p className="text-sm text-[#8a4200]/80">OOP·컬렉션·제네릭·record·예외·Stream·sealed를 합쳐 작은 주문 도메인을 설계한다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#8a4200] text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#8a4200] text-white' : 'bg-[#E76F00] text-white hover:bg-[#8a4200]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#E76F00] bg-white px-4 py-3 text-sm text-[#8a4200]">
                <div className="font-bold mb-1">✅ 미니 주문 도메인 — 개념 조립도</div>
                값 객체(Money·Product)는 <b>record</b>로 불변 + 자동 equals/hashCode, 실체(Order·OrderItem)는 <b>class</b>로 캡슐화해 불변식을 지킨다.
                여러 항목은 제네릭 <b>List&lt;OrderItem&gt;</b>으로 타입 안전하게 담고 방어적 복사로 노출한다. 합계는 <b>Stream</b>, 할인은 <b>다형성(DiscountPolicy)</b>으로 OCP를 지키고, 없을 수 있는 조회는 <b>Optional</b>로 NPE를 지운다.
                상태는 <b>sealed</b>로 봉인해 허용된 전이만 도메인 예외로 강제한다. 도메인 로직이 입출력과 분리돼 있어 JVM만으로 테스트 가능 — 작지만 견고한 설계다. 이걸로 java Part을 마친다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['record', '값객체', '캡슐화', 'List제네릭', '방어적복사', 'Stream', '다형성', 'DiscountPolicy', 'Optional', 'sealed', '상태전이', '도메인예외', 'OCP', '계층분리'].map((k) => (
