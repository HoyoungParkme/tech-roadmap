  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }

    // ─────────────────────────────────────────────────────
    // 공용 미니 컴포넌트
    // ─────────────────────────────────────────────────────
    function VarBox({ name, val, kind, type }) {
      const isRef = kind === 'ref';
      return (
        <div className={`flex items-center gap-2 rounded border-2 px-2 py-1 ${isRef ? 'bg-[#eef4fb] border-[#a7c7e7]' : 'bg-orange-50 border-orange-300'}`}>
          <span className="text-[11px] font-mono font-bold text-[#8a4200] w-6">{name}</span>
          <span className="text-[9px] text-slate-500">{type}</span>
          <span className={`ml-auto text-[11px] font-mono px-1.5 py-0.5 rounded ${isRef ? 'bg-[#a7c7e7]/40 text-[#274b6d]' : 'bg-orange-200 text-orange-900 font-bold'}`}>{val}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 1 — 스택/힙 메모리 모델
    // ─────────────────────────────────────────────────────
    function MemoryPaneView({ stack, heap, defaults }) {
      return (
        <div className="space-y-3">
          <div className="flex gap-2 items-stretch">
            <div className="flex-1 rounded-lg border-2 border-orange-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">📚 스택 — 원시=값, 참조=주소</div>
              <div className="space-y-1.5">
                {stack.map((s, i) => <VarBox key={i} {...s} />)}
              </div>
            </div>
            <div className="flex items-center text-orange-500 text-xl font-bold">→</div>
            <div className="flex-1 rounded-lg border-2 border-[#a7c7e7] bg-white p-2.5">
              <div className="text-[11px] font-bold text-[#274b6d] mb-1.5">🗄 힙 — 실제 객체</div>
              <div className="space-y-1.5">
                {heap.map((h, i) => (
                  <div key={i} className="rounded border-2 border-[#a7c7e7] bg-[#eef4fb] px-2 py-1.5">
                    <div className="text-[9px] font-mono text-[#274b6d]">{h.id}</div>
                    <div className="text-[11px] font-bold text-[#274b6d]">{h.label}</div>
                    <div className="text-[11px] font-mono text-slate-700">{h.body}</div>
                  </div>
                ))}
                <div className="text-[9px] text-slate-500 font-mono">↑ s 가 이 객체를 가리킴 (참조)</div>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🧭 초기화 안 한 필드의 기본값</div>
            <table className="w-full text-[10px]">
              <tbody>
                {defaults.map((d, i) => (
                  <tr key={i} className="border-t border-orange-100">
                    <td className="py-1 font-mono text-slate-700">{d.type}</td>
                    <td className={`py-1 pl-2 font-mono font-bold ${d.tone === 'ref' ? 'text-[#274b6d]' : 'text-orange-800'}`}>{d.def}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 오토박싱 + 함정
    // ─────────────────────────────────────────────────────
    function BoxingView({ box, traps }) {
      const TONE = { bad: 'bg-red-50 border-red-300', good: 'bg-emerald-50 border-emerald-300' };
      const TTL = { bad: 'text-red-700', good: 'text-emerald-800' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">📦 오토박싱 / 언박싱</div>
            <div className="space-y-2">
              <div className="flex items-center gap-2 text-[11px] font-mono">
                <span className="rounded bg-orange-100 border border-orange-300 px-2 py-1 text-orange-900 font-bold">{box.up.from}</span>
                <span className="text-orange-500">──{box.up.label}→</span>
                <span className="rounded bg-[#eef4fb] border border-[#a7c7e7] px-2 py-1 text-[#274b6d] font-bold">{box.up.to}</span>
              </div>
              <div className="flex items-center gap-2 text-[11px] font-mono">
                <span className="rounded bg-[#eef4fb] border border-[#a7c7e7] px-2 py-1 text-[#274b6d] font-bold">{box.down.from}</span>
                <span className="text-orange-500">──{box.down.label}→</span>
                <span className="rounded bg-orange-100 border border-orange-300 px-2 py-1 text-orange-900 font-bold">{box.down.to}</span>
              </div>
            </div>
          </div>
          <div className="space-y-1.5">
            {traps.map((t, i) => (
              <div key={i} className={`rounded-lg border-2 ${TONE[t.tone]} p-2`}>
                <div className={`text-[11px] font-bold mb-1 ${TTL[t.tone]}`}>{t.tone === 'good' ? '✅' : '⚠️'} {t.title}</div>
                <pre className="text-[10px] font-mono text-slate-700 bg-white/70 rounded p-1.5 border border-slate-200 whitespace-pre-wrap">{t.code}</pre>
                <div className="text-[9px] text-slate-500 mt-1">{t.note}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — == vs equals
    // ─────────────────────────────────────────────────────
    function EqualsView({ compare }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-white p-3">
            <div className="text-[11px] font-bold text-[#274b6d] mb-2">🗄 힙 — 내용은 같지만 별개 객체</div>
            <div className="flex gap-3 items-center justify-center">
              {compare.heap.map((h, i) => (
                <React.Fragment key={i}>
                  <div className="rounded border-2 border-[#a7c7e7] bg-[#eef4fb] px-3 py-2 text-center">
                    <div className="text-[9px] font-mono text-[#274b6d]">{h.id}</div>
                    <div className="text-[11px] font-mono font-bold text-slate-700">{h.body}</div>
                  </div>
                  {i === 0 && <span className="text-slate-400 text-[10px]">별개</span>}
                </React.Fragment>
              ))}
            </div>
            <div className="flex gap-6 justify-center mt-2">
              {compare.vars.map((v, i) => (
                <div key={i} className="text-[10px] font-mono text-[#8a4200]">
                  {v.name} → <span className="text-[#274b6d]">{v.to}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🔍 비교 결과</div>
            <div className="space-y-1.5">
              {compare.results.map((r, i) => (
                <div key={i} className={`flex items-center gap-2 rounded border-2 px-2 py-1.5 ${r.tone === 'good' ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                  <span className="text-[11px] font-mono font-bold text-slate-700 w-28">{r.expr}</span>
                  <span className={`text-[11px] font-mono font-bold ${r.tone === 'good' ? 'text-emerald-700' : 'text-red-600'}`}>{r.val}</span>
                  <span className="ml-auto text-[9px] text-slate-500">{r.why}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 문자열 풀
    // ─────────────────────────────────────────────────────
    function StringPoolView({ pool }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-white p-3">
            <div className="text-[11px] font-bold text-[#274b6d] mb-2">🗄 힙 — 문자열 풀 vs new 객체</div>
            <div className="flex gap-3 items-stretch">
              <div className="flex-1 rounded border-2 border-orange-400 bg-orange-50 px-2 py-2 text-center">
                <div className="text-[9px] font-mono text-orange-700">{pool.literal.id}</div>
                <div className="text-[13px] font-mono font-bold text-orange-900">{pool.literal.body}</div>
                <div className="text-[9px] text-orange-700 mt-0.5">{pool.literal.note}</div>
              </div>
              <div className="flex-1 rounded border-2 border-[#a7c7e7] bg-[#eef4fb] px-2 py-2 text-center">
                <div className="text-[9px] font-mono text-[#274b6d]">{pool.newObj.id}</div>
                <div className="text-[13px] font-mono font-bold text-[#274b6d]">{pool.newObj.body}</div>
                <div className="text-[9px] text-[#274b6d] mt-0.5">{pool.newObj.note}</div>
              </div>
            </div>
            <div className="flex gap-2 justify-center mt-2 flex-wrap">
              {pool.vars.map((v, i) => (
                <div key={i} className={`text-[10px] font-mono rounded px-2 py-0.5 border ${v.kind === 'new' ? 'bg-[#eef4fb] border-[#a7c7e7] text-[#274b6d]' : 'bg-orange-100 border-orange-300 text-orange-900'}`}>
                  {v.name} → {v.to}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🔍 비교 결과</div>
            <div className="space-y-1.5">
              {pool.results.map((r, i) => (
                <div key={i} className={`flex items-center gap-2 rounded border-2 px-2 py-1.5 ${r.tone === 'good' ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
                  <span className="text-[11px] font-mono font-bold text-slate-700 w-32">{r.expr}</span>
                  <span className={`text-[11px] font-mono font-bold ${r.tone === 'good' ? 'text-emerald-700' : 'text-red-600'}`}>{r.val}</span>
                  <span className="ml-auto text-[9px] text-slate-500">{r.why}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 캐시 + 형변환 + 규칙 지도
    // ─────────────────────────────────────────────────────
    function SummaryView({ cache, casts, rules }) {
      const Card = ({ d }) => (
        <div className={`flex-1 rounded-lg border-2 p-2.5 ${d.tone === 'good' ? 'bg-emerald-50 border-emerald-300' : 'bg-red-50 border-red-300'}`}>
          <div className="text-[10px] font-mono text-slate-600">{d.a}</div>
          <div className="text-[10px] font-mono text-slate-600">{d.b}</div>
          <div className={`text-[12px] font-mono font-bold mt-1 ${d.tone === 'good' ? 'text-emerald-700' : 'text-red-600'}`}>{d.res}</div>
          <div className="text-[9px] text-slate-500 mt-0.5">{d.why}</div>
        </div>
      );
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🎯 Integer 캐시 (-128 ~ 127)</div>
            <div className="flex gap-2">
              <Card d={cache.inRange} />
              <Card d={cache.outRange} />
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-white p-3">
            <div className="text-[11px] font-bold text-[#274b6d] mb-1.5">🔀 형변환 — 넓히기 자동 / 좁히기 명시</div>
            <table className="w-full text-[10px]">
              <tbody>
                {casts.map((c, i) => (
                  <tr key={i} className="border-t border-slate-100 align-top">
                    <td className="py-1 font-mono font-bold text-slate-700">{c.from}</td>
                    <td className={`py-1 pl-2 font-bold ${c.tone === 'good' ? 'text-emerald-700' : 'text-red-600'}`}>
                      {c.kind}
                      <div className="text-[9px] font-mono font-normal text-slate-500">{c.ex}</div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-orange-400 bg-orange-50 p-3">
            <div className="text-[11px] font-bold text-orange-900 mb-1.5">📌 핵심 규칙 지도</div>
            <ul className="space-y-1">
              {rules.map((r, i) => (
                <li key={i} className="flex gap-2 text-[10px] text-orange-900">
                  <span className="text-orange-500 font-bold">{i + 1}.</span>
                  <span>{r}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java orange 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      memory:     { icon: '📚', label: '스택 · 힙' },
      boxing:     { icon: '📦', label: '오토박싱' },
      equals:     { icon: '🔍', label: '== vs equals' },
      stringpool: { icon: '🧵', label: '문자열 풀' },
      summary:    { icon: '🗺', label: '캐시 · 정리' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.memory;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#8a4200] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>타입 메모리 모델 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#8a4200] font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'memory' && <MemoryPaneView stack={state.stack} heap={state.heap} defaults={state.defaults} />}
          {state.stage === 'boxing' && <BoxingView box={state.box} traps={state.traps} />}
          {state.stage === 'equals' && <EqualsView compare={state.compare} />}
          {state.stage === 'stringpool' && <StringPoolView pool={state.pool} />}
          {state.stage === 'summary' && <SummaryView cache={state.cache} casts={state.casts} rules={state.rules} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅰ. JVM과 기초</span>
              <div>
                <h1 className="text-2xl font-bold text-[#8a4200]">I-1-2. 타입·연산자·문자열 풀</h1>
                <p className="text-sm text-[#8a4200]/80">원시타입 vs 참조타입, 오토박싱, String 불변성과 문자열 풀 메모리 모델</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#8a4200] text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#8a4200] text-white' : 'bg-[#E76F00] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-[#8a4200]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Java의 변수는 원시타입(값을 스택에)과 참조타입(힙 객체의 주소)으로 갈리고, 이 차이가 대입·비교·기본값을 전부 좌우한다.
                래퍼(Integer)와 오토박싱은 편하지만 null 언박싱 NPE와 박싱 성능 함정이 있고, Integer 캐시(-128~127)는 == 결과를 우연히 맞게 만들어 큰 수에서 깨진다.
                String은 불변이라 리터럴은 문자열 풀에서 공유되고 new String은 별도 객체다. 모든 함정은 한 문장으로 수렴한다 — "값이 같은지"는 언제나 .equals()로 물어라.
                다음 장 I-2-1에서는 여기서 예고한 StringBuilder와 문자열 처리를 본격적으로 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['원시타입', '참조타입', '스택과힙', '래퍼클래스', '오토박싱', '언박싱NPE', 'equals', '문자열풀', '불변성', 'Integer캐시', '형변환'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-[#8a4200] border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#8a4200]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
