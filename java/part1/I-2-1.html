  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Java I-2-1 — 배열과 제어문
    학습 목표: 고정 크기 배열이 힙에 어떻게 연속 저장되는지, for 루프가 인덱스를 따라
              각 슬롯에 접근하는 과정, 경계 초과가 왜 예외를 던지는지, 그리고
              if/switch/반복문의 흐름을 6단계로 추적한다.
    패턴: fastapi v1 — 좌(LiveDataPane: 배열 슬롯·루프 포인터·switch 분기 시뮬레이션) / 우(VSCode CodeViewer: Main.java)
    색상: Java 오렌지 (#E76F00) · 형광펜 옅은 파랑 (#a7c7e7) · 글자/링크 오렌지 다크 (#8a4200)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 배열 구조 → 순회 → 경계 예외 → 조건문 → 반복문 → 배열 vs List
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값에 따라 서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. 배열 선언과 생성 — 힙에 연속된 슬롯을 예약한다',
        desc: 'int[] a = new int[5]; 한 줄은 사실 두 가지 일을 한다. new int[5]가 힙에 정수 5칸을 "연속된 메모리"로 예약하고, 그 시작 주소를 참조 변수 a에 담는다. 예약된 칸은 쓰레기값이 아니라 타입별 기본값으로 자동 초기화된다 — int는 0, boolean은 false, 참조 타입은 null이다. 배열은 이렇게 만들어지는 순간 크기가 못 박히며, a.length로 그 크기를 언제든 읽을 수 있지만 바꿀 수는 없다. 연속 저장 덕분에 a[i]는 "시작주소 + i×원소크기"라는 단순 산술로 즉시 찾아가므로, 인덱스 접근이 O(1)로 빠른 것이다.',
        actor: '☕ new int[5] → 힙에 20 bytes 예약, 기본값 0으로 초기화',
        stage: 'array',
        stageLabel: '배열 생성 · 기본값 초기화',
        array: {
          name: 'int[] a',
          slots: [
            { idx: 0, val: '0' }, { idx: 1, val: '0' }, { idx: 2, val: '0' },
            { idx: 3, val: '0' }, { idx: 4, val: '0' },
          ],
          note: 'new int[5] → 5칸 모두 int 기본값 0 · a.length == 5 (고정)',
        },
        defaults: {
          title: '타입별 배열 기본값 (자동 초기화)',
          rows: [
            { type: 'int / long / short', def: '0' },
            { type: 'double / float', def: '0.0' },
            { type: 'boolean', def: 'false' },
            { type: 'char', def: "'\\u0000'" },
            { type: 'String · 객체 (참조형)', def: 'null' },
          ],
        },
        alert: { tone: 'info', text: '배열 생성 = 힙에 연속 슬롯 예약 + 기본값 초기화. C와 달리 Java 배열 원소는 쓰레기값이 아니라 항상 0/false/null로 시작한다. 크기는 이 순간 못 박혀 이후 변경 불가.' },
        code: {
          lang: 'java',
          filename: 'Main.java — 배열 선언과 생성',
          lines: [
            'public class Main {',
            '    public static void main(String[] args) {',
            '        // 1) 선언 + 생성: 힙에 int 5칸 예약',
            '        int[] a = new int[5];',
            '',
            '        // 2) 기본값 자동 초기화 — 쓰레기값 아님',
            '        System.out.println(a[0]);        // => 0',
            '        System.out.println(a.length);    // => 5',
            '',
            '        // 3) 값 할당은 인덱스로',
            '        a[0] = 10;',
            '        a[4] = 50;',
            '',
            '        // 4) 선언과 동시에 초기화 (크기 자동 추론)',
            '        int[] b = {1, 2, 3, 4, 5};',
            '        System.out.println(b.length);    // => 5',
            '',
            '        // 5) 2차원 배열 = "배열의 배열"',
            '        int[][] grid = new int[2][3];    // 2행 3열',
            '        grid[1][2] = 9;',
            '        System.out.println(grid[1][2]);  // => 9',
            '    }',
            '}',
          ],
          highlight: [3, 4, 7, 8],
        },

    function ArrayView({ array, defaults }) {
      return (
        <div className="space-y-3">

            <div className="text-[11px] font-bold text-orange-800 mb-2">🧱 {array.name} — 힙에 연속된 슬롯 (인덱스 · 값)</div>
            <div className="flex gap-1 overflow-x-auto pb-1">
              {array.slots.map((s) => (
                <div key={s.idx} className="flex flex-col items-center">
                  <div className="w-14 h-12 rounded border-2 border-orange-400 bg-orange-50 flex items-center justify-center text-base font-bold text-orange-900 font-mono">{s.val}</div>
                  <div className="text-[10px] text-slate-500 mt-0.5 font-mono">[{s.idx}]</div>
                </div>
              ))}
            </div>
            <div className="mt-1.5 text-[10px] text-orange-900 font-mono">{array.note}</div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-white p-3">
            <div className="text-[11px] font-bold text-sky-800 mb-1.5">🎯 {defaults.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {defaults.rows.map((r, i) => (
                  <tr key={i} className="border-t border-sky-100">
                    <td className="py-1 pr-2 font-mono text-slate-700">{r.type}</td>
                    <td className="py-1 font-mono font-bold text-sky-800">{r.def}</td>

          </div>

    // ─────────────────────────────────────────────────────
    // Step 2 — for 루프 순회 애니메이션 (인덱스 포인터 이동 + 합계 누적)
    // ─────────────────────────────────────────────────────
    function LoopView({ loop }) {
      const [cursor, setCursor] = useState(0);
      const n = loop.values.length;

      useEffect(() => {
        const t = setInterval(() => setCursor((c) => (c + 1) % (n + 1)), 900);
        return () => clearInterval(t);
      }, [n]);

      const sum = loop.values.slice(0, Math.min(cursor, n)).reduce((s, v) => s + v, 0);
      const done = cursor >= n;

      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🔁 for (int i = 0; i &lt; a.length; i++) — 인덱스가 슬롯을 밟는다</div>
            <div className="flex gap-1 overflow-x-auto pb-1">
              {loop.values.map((v, i) => {
                const active = i === cursor && !done;
                const visited = i < cursor;
                return (
                  <div key={i} className="flex flex-col items-center">
                    <div className="h-4 text-[10px] font-bold text-emerald-600">{active ? '▼ i' : ''}</div>
                    <div className={`w-14 h-12 rounded border-2 flex items-center justify-center text-base font-bold font-mono transition
                      ${active ? 'border-emerald-500 bg-emerald-100 text-emerald-900 scale-110' : visited ? 'border-orange-300 bg-orange-50 text-orange-400' : 'border-slate-300 bg-white text-slate-700'}`}>{v}</div>
                    <div className="text-[10px] text-slate-500 mt-0.5 font-mono">[{i}]</div>
                  </div>
                );
              })}
            </div>
            <div className="mt-2 flex items-center gap-2 text-[11px] font-mono">
              <span className={`px-2 py-1 rounded border ${done ? 'bg-emerald-100 border-emerald-400 text-emerald-900' : 'bg-orange-50 border-orange-300 text-orange-900'}`}>
                {done ? 'i == length → 루프 종료' : `i = ${cursor}`}
              </span>
              <span className="text-slate-400">→</span>
              <span className="px-2 py-1 rounded border border-sky-300 bg-sky-50 text-sky-900">sum = {sum}</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-sky-300 bg-sky-50 p-2.5 text-[10px] text-sky-900">
            💡 조건 <span className="font-mono font-bold">i &lt; a.length</span> — i가 length가 되는 순간은 이미 배열 밖. 유효 인덱스는 <span className="font-mono">0..length-1</span> 뿐.
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 경계 초과 접근 (빨간 포인터가 배열 밖을 가리킴)
    // ─────────────────────────────────────────────────────
    function BoundsView({ bounds }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-red-800 mb-2">🚨 a[{bounds.badIndex}] 접근 — 유효 범위(0..{bounds.values.length - 1}) 밖</div>
            <div className="flex gap-1 items-end overflow-x-auto pb-1">
              {bounds.values.map((v, i) => (
                <div key={i} className="flex flex-col items-center">
                  <div className="w-12 h-11 rounded border-2 border-orange-400 bg-orange-50 flex items-center justify-center text-sm font-bold text-orange-900 font-mono">{v}</div>
                  <div className="text-[10px] text-slate-500 mt-0.5 font-mono">[{i}]</div>
                </div>
              ))}
              {/* 배열 밖 슬롯 */}
              <div className="flex flex-col items-center">
                <div className="h-4 text-[11px] font-bold text-red-600">▼</div>
                <div className="w-12 h-11 rounded border-2 border-dashed border-red-500 bg-red-50 flex items-center justify-center text-sm font-bold text-red-600 font-mono">?</div>
                <div className="text-[10px] text-red-600 mt-0.5 font-mono font-bold">[{bounds.badIndex}] ✗</div>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-400 bg-red-50 p-2.5">
            <div className="text-[10px] font-bold text-red-800 mb-1">런타임 예외 (실행 중 프로그램 중단)</div>
            <pre className="text-[10px] font-mono text-red-700 whitespace-pre-wrap leading-4">{bounds.exception}</pre>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — switch 분기 흐름 (매칭된 case 강조)
    // ─────────────────────────────────────────────────────
    function SwitchView({ sw }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-2">🔀 switch (day) — day = <span className="font-mono">{sw.value}</span> 가 어디로 분기하나</div>
            <div className="space-y-1">
              {sw.cases.map((c, i) => {
                const hit = c.key === sw.matched;
                return (
                  <div key={i} className={`flex items-center gap-2 text-[11px] font-mono rounded border px-2 py-1.5
                    ${hit ? 'bg-emerald-100 border-emerald-500 text-emerald-900 font-bold' : 'bg-white border-slate-200 text-slate-600'}`}>
                    <span className="w-16 text-orange-800">{c.key === 'default' ? 'default' : `case ${c.key}`}</span>
                    <span className="text-slate-400">→</span>
                    <span>{c.label}</span>
                    {hit && <span className="ml-auto text-emerald-600">✓ 매칭</span>}
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-2.5">
            <div className="text-[11px] font-bold text-amber-900 mb-1">⚠️ {sw.fallthrough.title}</div>
            <div className="text-[10px] text-amber-900">{sw.fallthrough.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 반복문 4형제 카드 + break/continue/label 표
    // ─────────────────────────────────────────────────────
    function IterateView({ loops, flow }) {
      const TONE = {
        orange: 'border-orange-400 bg-orange-50 text-orange-900',
        sky: 'border-sky-400 bg-sky-50 text-sky-900',
        amber: 'border-amber-400 bg-amber-50 text-amber-900',
        emerald: 'border-emerald-400 bg-emerald-50 text-emerald-900',
      };
      const FLOW_TONE = { red: 'text-red-700', amber: 'text-amber-700', orange: 'text-orange-700' };
      return (
        <div className="space-y-3">
          <div className="grid grid-cols-2 gap-2">
            {loops.map((l, i) => (
              <div key={i} className={`rounded-lg border-2 p-2.5 ${TONE[l.tone]}`}>
                <div className="text-[12px] font-bold font-mono">{l.name}</div>
                <div className="text-[10px] mt-0.5 opacity-80">{l.when}</div>
                <div className="text-[10px] mt-1 font-mono bg-white/60 rounded px-1.5 py-0.5">{l.ex}</div>
              </div>
            ))}
          </div>
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-orange-800 mb-1.5">🧭 {flow.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {flow.rows.map((r, i) => (
                  <tr key={i} className="border-t border-orange-100">
                    <td className={`py-1 pr-2 font-mono font-bold whitespace-nowrap ${FLOW_TONE[r.tone]}`}>{r.kw}</td>
                    <td className="py-1 text-slate-700">{r.act}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 배열 vs ArrayList 비교
    // ─────────────────────────────────────────────────────
    function CompareView({ compare }) {
      const TONE = {
        orange: { border: 'border-orange-400', head: 'text-orange-800', chip: 'bg-orange-50 border-orange-200 text-orange-900' },
        sky: { border: 'border-sky-400', head: 'text-sky-800', chip: 'bg-sky-50 border-sky-200 text-sky-900' },
      };
      const Card = ({ data }) => {
        const t = TONE[data.tone];
        return (
          <div className={`flex-1 rounded-lg border-2 ${t.border} bg-white p-3`}>
            <div className={`text-[11px] font-bold mb-2 ${t.head}`}>{data.title}</div>
            <div className="space-y-1">
              {data.rows.map((r, i) => (
                <div key={i} className={`text-[10px] rounded border px-2 py-1 ${t.chip}`}>{r}</div>
              ))}
            </div>
          </div>
        );
      };
      return (
        <div className="space-y-3">
          <div className="flex gap-2 items-stretch">
            <Card data={compare.left} />
            <div className="flex items-center text-orange-500 text-lg font-bold">vs</div>
            <Card data={compare.right} />
          </div>
          <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-2.5 text-[10px] text-emerald-900">
            ✅ 선택 기준 — <span className="font-bold">크기 고정·성능 중요 → 배열</span>, <span className="font-bold">크기 변함 → ArrayList</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-orange-50',  border: 'border-orange-300',  text: 'text-orange-900',  icon: '💡' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-300',   text: 'text-amber-900',   icon: '⚠️' },
      danger: { bg: 'bg-red-50',     border: 'border-red-300',     text: 'text-red-900',     icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java 오렌지 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      array:   { icon: '🧱', label: '배열 생성' },
      loop:    { icon: '🔁', label: 'for 순회' },
      bounds:  { icon: '🚨', label: '경계 초과' },
      switch:  { icon: '🔀', label: '조건 분기' },
      iterate: { icon: '🔂', label: '반복문' },
      dynamic: { icon: '📦', label: '배열 vs List' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.array;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-orange-900 flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>배열과 제어문 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-orange-700 font-mono mb-3 px-2 py-1 rounded bg-orange-50 border border-orange-200">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'array' && <ArrayView array={state.array} defaults={state.defaults} />}
          {state.stage === 'loop' && <LoopView loop={state.loop} />}
          {state.stage === 'bounds' && <BoundsView bounds={state.bounds} />}
          {state.stage === 'switch' && <SwitchView sw={state.sw} />}
          {state.stage === 'iterate' && <IterateView loops={state.loops} flow={state.flow} />}
          {state.stage === 'dynamic' && <CompareView compare={state.compare} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅰ. JVM과 기초</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">I-2-1. 배열과 제어문</h1>
                <p className="text-sm text-orange-800/80">고정 크기 배열의 메모리 구조와 조건·반복문, 향상된 for</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-[#E76F00] text-white hover:bg-orange-700'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/70 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                배열은 생성되는 순간 크기가 못 박히고(int[] a = new int[5]), 힙에 연속 저장되어 a[i] 접근이 O(1)로 빠르다.
                유효 인덱스는 0..length-1뿐이라 그 밖을 건드리면 실행 중 ArrayIndexOutOfBoundsException이 터진다.
                흐름 제어는 if/else·switch(fall-through 주의, Java 14+ 화살표식 권장)·삼항으로, 반복은 for/while/do-while/향상된 for로 하되
                인덱스가 필요 없으면 for-each가 가장 안전하다. 크기가 변하는 데이터는 배열 대신 ArrayList를 쓴다.
                다음 장 I-2-2에서는 메서드와 매개변수 전달을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['배열', 'length', '기본값초기화', '인덱스', 'ArrayIndexOutOfBounds', 'if-else', 'switch식', 'fall-through', 'for-each', 'break-continue', '라벨', 'ArrayList'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-[#8a4200] border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#8a4200]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
