  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */

      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    Java I-1-1 — JVM·JRE·JDK, 자바가 도는 원리
    학습 목표: 소스(.java)→바이트코드(.class)→JVM 실행이라는 자바의 실행 모델을 추적하고,
              "Write Once, Run Anywhere"가 왜 성립하는지, JDK⊃JRE⊃JVM의 관계가 무엇인지,
              JVM 내부(클래스로더·런타임 데이터 영역·실행엔진·GC)를 5단계로 뜯어본다.
    패턴: fastapi v1 — 좌(LiveDataPane: 컴파일·실행 파이프라인·WORA·계층 시뮬레이션) / 우(VSCode CodeViewer: Hello.java + 명령)
    색상: Java 오렌지 #E76F00 기조 / 형광펜·배경 채움 옅은 파랑 #a7c7e7 / 텍스트·링크·배지 오렌지 다크 #8a4200
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 소스 → 컴파일(.class) → JVM 내부 → WORA → JDK/JRE/JVM 계층
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(source/compile/jvm/wora/layers)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. .java는 사람이 읽는 텍스트 — CPU는 못 읽는다',
        desc: '우리가 작성하는 Hello.java는 사람이 읽으라고 만든 "글자 파일"일 뿐, CPU가 바로 실행할 수 있는 형태가 아니다. C/C++이 소스를 곧장 그 OS·CPU 전용 기계어(.exe)로 컴파일하는 것과 달리, 자바는 한 단계를 더 둔다. 왜일까? 만약 자바도 곧장 기계어로 컴파일하면 Windows용, Mac용, Linux용 실행파일을 따로 빌드해야 한다. 자바는 이 문제를 "중간 언어(바이트코드)"로 푼다. 소스를 특정 CPU가 아니라 가상의 기계(JVM)를 위한 명령어로 한 번만 컴파일해 두고, 실제 실행은 각 OS의 JVM에게 맡긴다. 이 첫 단계에서 기억할 것은 하나 — .java는 아직 실행물이 아니라 설계도 텍스트다.',
        actor: '📝 Hello.java · UTF-8 텍스트 · 아직 실행 불가',
        stage: 'source',
        stageLabel: '소스 코드 (.java)',
        source: {
          filename: 'Hello.java',
          lines: [
            'public class Hello {',
            '  public static void main(String[] args) {',
            '    System.out.println("Hello, JVM!");',
            '  }',
            '}',
          ],
        },
        compare: {
          title: 'C/C++ vs Java — 실행까지 가는 길',
          rows: [
            { lang: 'C / C++', path: '.c → (컴파일) → OS·CPU 전용 기계어 .exe', note: 'OS마다 다시 빌드', tone: 'bad' },
            { lang: 'Java', path: '.java → (컴파일) → 바이트코드 .class → JVM', note: '한 번 컴파일, 어디서나 실행', tone: 'good' },
          ],
        },
        alert: { tone: 'info', text: '.java 파일은 "그림"도 "실행물"도 아니다. javac로 한 번 번역해서 바이트코드로 바꿔야 JVM이 실행할 수 있다. main 메서드가 프로그램의 진입점이다.' },
        code: {
          lang: 'java',
          filename: 'Hello.java — 사람이 읽는 소스',
          lines: [
            '// 파일명은 반드시 public 클래스명과 같아야 한다: Hello.java',
            'public class Hello {',
            '',
            '  // JVM이 프로그램을 시작할 때 호출하는 진입점.',
            '  // 시그니처가 정확히 이래야 JVM이 찾는다:',
            '  //   public  : JVM(외부)이 호출하므로 공개',
            '  //   static  : 객체(new) 없이도 호출 가능해야 함',
            '  //   void    : 반환값을 OS로 돌려주지 않음',
            '  //   main    : 약속된 이름',
            '  //   String[] args : 실행 시 넘어온 명령행 인자',
            '  public static void main(String[] args) {',
            '    System.out.println("Hello, JVM!");',
            '  }',
            '}',
            '',
            '/*',
            '  이 파일은 지금 그냥 "텍스트"다.',
            '  CPU는 이 글자를 직접 실행하지 못한다.',
            '  → 다음 단계: javac 로 컴파일해서',
            '    바이트코드(.class)로 번역한다.',

          ],
          highlight: [1, 2, 11, 12],
        },
      },

        <div className="space-y-3">

          <div className="text-center text-orange-500 text-sm">▼ 로드된 코드·데이터가 자리잡는 곳</div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">② 런타임 데이터 영역</div>
            <div className="grid grid-cols-1 gap-1.5">
              {jvm.areas.map((a, i) => (
                <div key={i} className="rounded border border-[#a7c7e7] bg-[#eaf2fb] px-2 py-1.5 flex items-center gap-2">
                  <span className="text-[11px] font-mono font-bold text-[#8a4200] w-24">{a.name}</span>
                  <span className="text-[10px] text-slate-700 flex-1">{a.desc}</span>
                  <span className="text-[9px] rounded-full bg-white border border-[#a7c7e7] px-1.5 py-0.5 text-[#8a4200]">{a.tag}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="text-center text-orange-500 text-sm">▼ 실제로 돌리는 곳</div>
          <div className="rounded-lg border-2 border-orange-400 bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">③ 실행 엔진</div>
            <div className="space-y-1">
              {jvm.engine.map((e, i) => (
                <div key={i} className={`rounded border px-2 py-1 flex items-center gap-2 ${TONE[e.tone]}`}>
                  <span className="text-[11px] font-mono font-bold w-24">{e.name}</span>
                  <span className="text-[10px] flex-1">{e.desc}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — WORA: 하나의 .class → 3 OS
    // ─────────────────────────────────────────────────────
    function WoraView({ wora, caveat }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🌍 하나의 바이트코드, 세 개의 JVM</div>
            <div className="flex justify-center mb-2">
              <span className="rounded border-2 border-[#E76F00] bg-orange-100 px-3 py-1.5 font-mono text-[11px] font-bold text-[#8a4200]">{wora.artifact}</span>
            </div>
            <div className="text-center text-orange-500 text-sm mb-2">▼ 각 OS의 JVM에 그대로 전달 ▼</div>
            <div className="grid grid-cols-1 gap-1.5">
              {wora.targets.map((t, i) => (
                <div key={i} className="rounded border border-[#a7c7e7] bg-[#eaf2fb] px-2 py-1.5 flex items-center gap-2">
                  <span className="text-[11px] font-bold text-[#8a4200] w-20">{t.os}</span>
                  <span className="text-[10px] font-mono text-slate-600 flex-1">{t.jvm}</span>
                  <span className="text-[10px] font-mono rounded bg-emerald-50 border border-emerald-300 text-emerald-800 px-1.5 py-0.5">{t.out}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500 text-center">세 곳 모두 동일 출력 — OS 차이는 JVM이 흡수한다.</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1">⚠️ {caveat.title}</div>
            <div className="text-[10px] text-slate-700">{caveat.text}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — JDK ⊃ JRE ⊃ JVM 겹박스 + 설치 표
    // ─────────────────────────────────────────────────────
    function LayersView({ layers, pickTable }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">📦 포함관계 — 겹겹의 상자</div>
            <div className="rounded-lg border-2 border-[#E76F00] bg-orange-100 p-3">
              <div className="flex items-center justify-between mb-1">
                <span className="text-[12px] font-bold text-[#8a4200]">{layers.jdk.label}</span>
                <span className="text-[9px] text-[#8a4200]">{layers.jdk.sub}</span>
              </div>
              <div className="text-[9px] font-mono text-[#8a4200] mb-2">+ {layers.jdk.extra}</div>
              <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[12px] font-bold text-[#8a4200]">{layers.jre.label}</span>
                  <span className="text-[9px] text-[#8a4200]">{layers.jre.sub}</span>
                </div>
                <div className="text-[9px] font-mono text-slate-600 mb-2">+ {layers.jre.extra}</div>
                <div className="rounded-lg border-2 border-emerald-400 bg-emerald-50 p-3">
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-[12px] font-bold text-emerald-900">{layers.jvm.label}</span>
                    <span className="text-[9px] text-emerald-800">{layers.jvm.sub}</span>
                  </div>
                  <div className="text-[9px] font-mono text-emerald-800">{layers.jvm.extra}</div>
                </div>
              </div>
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500 text-center">JDK ⊃ JRE ⊃ JVM — 바깥일수록 더 많은 도구를 포함.</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-2.5">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🧭 {pickTable.title}</div>
            <table className="w-full text-[10px]">
              <tbody>
                {pickTable.rows.map((r, i) => (
                  <tr key={i} className="border-t border-[#a7c7e7]/50 align-top">
                    <td className="py-1 pr-2 text-slate-700">{r.who}</td>
                    <td className="py-1 pr-2 font-bold text-[#8a4200] whitespace-nowrap">{r.pick}</td>
                    <td className="py-1 text-[9px] text-slate-500">{r.note}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf2fb]', border: 'border-[#a7c7e7]', text: 'text-[#8a4200]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java 오렌지 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      source:  { icon: '📝', label: '소스 (.java)' },
      compile: { icon: '⚙️', label: '컴파일 (.class)' },
      jvm:     { icon: '🧩', label: 'JVM 내부' },
      wora:    { icon: '🌍', label: 'Write Once Run Anywhere' },
      layers:  { icon: '📦', label: 'JDK / JRE / JVM' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.source;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#8a4200] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>자바 실행 원리 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#8a4200] font-mono mb-3 px-2 py-1 rounded bg-[#eaf2fb] border border-[#a7c7e7]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'source' && <SourceView source={state.source} compare={state.compare} />}
          {state.stage === 'compile' && <CompileView compile={state.compile} versionTrap={state.versionTrap} />}
          {state.stage === 'jvm' && <JvmView jvm={state.jvm} />}
          {state.stage === 'wora' && <WoraView wora={state.wora} caveat={state.caveat} />}
          {state.stage === 'layers' && <LayersView layers={state.layers} pickTable={state.pickTable} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-[#E76F00] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅰ. JVM과 기초</span>
              <div>
                <h1 className="text-2xl font-bold text-[#8a4200]"><span className="font-mono text-lg mr-1">I-1-1</span> JVM·JRE·JDK — 자바가 도는 원리</h1>
                <p className="text-sm text-[#8a4200]/80">소스(.java)→바이트코드(.class)→JVM 실행, "Write Once Run Anywhere"의 실체</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#8a4200] text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#8a4200] text-white' : 'bg-[#E76F00] text-white hover:bg-[#8a4200]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#E76F00] bg-white px-4 py-3 text-sm text-[#8a4200]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                자바는 소스(.java)를 javac로 바이트코드(.class)로 한 번 컴파일하고, 실제 실행은 각 OS의 JVM에게 맡긴다.
                바이트코드에는 OS·CPU 정보가 없어 하나의 .class가 Windows·Mac·Linux 어디서나 돈다(Write Once, Run Anywhere).
                JVM은 클래스로더로 .class를 읽어 Heap·Stack·Method Area에 올리고, 인터프리터+JIT로 실행하며 GC로 메모리를 자동 회수한다.
                설치 관점에서는 JDK ⊃ JRE ⊃ JVM — 개발자는 JDK를 깔고 LTS(17·21)로 팀·서버·CI 버전을 통일한다. 다음 장 I-1-2에서 자바 기본 문법을 뜯어본다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['바이트코드', 'javac', 'JVM', 'JRE', 'JDK', 'WORA', '클래스로더', 'JIT', 'GC', 'classpath', 'LTS17', 'LTS21'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-[#8a4200] border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#8a4200]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
