  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Java III-1-1 — String·StringBuilder (불변성·O(n²) 함정·가변 버퍼·메서드·선택 기준)
    좌 LiveDataPane / 우 CodeViewer(java) · Java 오렌지 #E76F00 · 옅은 파랑 #a7c7e7 · 오렌지 다크 #8a4200
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 불변성 → 루프 함정(O(n²)) → StringBuilder(O(n))
    //   → StringBuffer/+ 최적화 → 주요 메서드·풀 → 선택 기준
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      immutable: {lang:"java", filename:"Immutable.java — String은 절대 안 바뀐다", lines:[
        "String s = \"Hi\";",
        "String t = s;            // t와 s가 같은 객체 @0x01 을 가리킴",
        "",
        "s = s + \"!\";             // 새 객체 \"Hi!\"(@0x02) 생성, s만 이동",
        "",
        "System.out.println(s);   // => Hi!",
        "System.out.println(t);   // => Hi   (원본은 그대로!)",
        "",
        "// replace 도 원본을 안 고친다 — 새 String을 \"반환\"할 뿐",
        "String u = \"banana\";",
        "u.replace(\"a\", \"o\");     // 반환값을 안 받으면 버려짐",
        "System.out.println(u);   // => banana  (그대로)",
        "",
        "u = u.replace(\"a\", \"o\"); // 반환값을 받아야 반영된다",
        "System.out.println(u);   // => bonono",
      ]},
      looptrap: {lang:"java", filename:"LoopTrap.java — 이렇게 하면 안 된다", lines:[
        "// ❌ 안티패턴: 루프 안에서 String 결합",
        "String result = \"\";",
        "for (int i = 0; i < 100_000; i++) {",
        "    result += i + \",\";   // 매 반복 새 String 생성!",
        "    // i=0: \"0,\"  (2글자 복사)",
        "    // i=1: \"0,1,\"(4글자 복사)",
        "    // i=2: \"0,1,2,\"(6글자 복사)  ... 점점 커진다",
        "}",
        "// 총 복사량 ≈ 1+2+...+n ≈ n²/2  → O(n²)",
        "// 버려진 임시 String 약 n개 → GC 폭탄",
        "",
        "// 측정해 보면 (환경마다 다름):",
        "//   10만 결합  => 수 초 (매우 느림)",
        "//   같은 일을 StringBuilder로 => 수 ms",
        "",
        "// 규칙: \"루프 + 문자열 결합\"이 보이면 StringBuilder를 의심하라",
      ]},
      builder: {lang:"java", filename:"Builder.java — 올바른 반복 결합", lines:[
        "// ✅ 루프 결합은 StringBuilder로",
        "StringBuilder sb = new StringBuilder(); // 버퍼 1개",
        "for (int i = 0; i < 100_000; i++) {",
        "    sb.append(i).append(\",\");           // 버퍼에 이어 쓰기(복사X)",
        "}",
        "String result = sb.toString();          // 마지막에 딱 한 번",
        "",
        "// append 는 this 반환 → 체이닝 가능",
        "String msg = new StringBuilder()",
        "        .append(\"id=\").append(42)",
        "        .append(\", ok=\").append(true)",
        "        .toString();",
        "System.out.println(msg);  // => id=42, ok=true",
        "",
        "// 크기를 대충 알면 초기 용량을 잡아 확장 횟수를 줄인다",
        "StringBuilder big = new StringBuilder(1 << 16); // 65536칸 예약",
        "insert/delete/reverse 도 제자리(in-place)로 지원",
      ]},
      buffer: {lang:"java", filename:"BuilderVsBuffer.java", lines:[
        "// 단일 스레드 조립 → StringBuilder (락 없음, 빠름)",
        "StringBuilder sb = new StringBuilder();",
        "sb.append(\"x\").append(\"y\");",
        "",
        "// 여러 스레드가 같은 버퍼를 공유 → StringBuffer",
        "StringBuffer safe = new StringBuffer(); // 메서드마다 synchronized",
        "",
        "// \"+\" 는 무죄 — 이 한 줄은 컴파일러가 최적화한다",
        "int b = 7;",
        "String line = \"a\" + b + \"c\";",
        "//  컴파일 결과(개념): new StringBuilder().append(\"a\")",
        "//                     .append(b).append(\"c\").toString()",
        "",
        "// 유죄는 오직 이것 — 루프 안 += (최적화 안 됨)",
        "String s = \"\";",

    const S1 = { title:"Step 1. String은 불변(immutable) — 바꾸면 \"새 객체\"가 생긴다", desc:"Java의 String은 한 번 만들어지면 그 내용을 절대 바꿀 수 없다(불변). 그래서 s = s + \"!\" 처럼 \"바꾼 것처럼\" 보이는 코드도 사실은 원본을 수정하는 게 아니라, 합쳐진 내용을 담은 완전히 새로운 String 객체를 만들고 그 참조를 s에 다시 꽂는 것이다. 원래 있던 객체는 아무도 안 가리키게 되어 GC 대상이 된다. 왜 이렇게 불편하게 만들었을까? 불변이면 여러 스레드가 같은 문자열을 공유해도 안전하고(동기화 불필요), 해시값을 캐싱할 수 있어 HashMap 키로 쓰기 좋으며, 문자열 풀에서 리터럴을 안전하게 재사용할 수 있기 때문이다. 즉 불변성은 \"안전과 공유\"를 얻는 대신 \"변경 때마다 새 객체\"라는 비용을 치르는 설계다.", actor:"📌 String s = \"Hi\"; s += \"!\"; → 원본 불변, 새 객체 생성", stage:"immutable", stageLabel:"불변성 (immutable)" };
    const S2 = { title:"Step 2. 루프에서 String += 의 함정 — 매 반복 새 객체, O(n²)", desc:"불변성의 대가는 루프에서 폭발한다. for 안에서 result += word 를 n번 돌리면, 매 반복마다 \"지금까지 누적된 문자열 + 새 조각\"을 담을 새 String을 통째로 만든다. i번째 반복에서 복사해야 하는 글자 수가 대략 i에 비례하므로, 전체 복사량은 1+2+3+...+n ≈ n²/2 — 즉 시간 복잡도가 O(n²)이 된다. 게다가 매 반복이 버리는 중간 객체를 힙에 쏟아내 GC까지 자극한다. 문자열 1만 개를 이어 붙이면 눈에 띄게 느려지고, 10만 개면 수 초씩 멈춘다. 실무에서 로그·CSV·쿼리를 루프로 조립하다 성능이 무너지는 전형적 원인이 바로 이것이다. 아래 애니메이션에서 반복이 돌 때마다 힙에 버려지는 객체가 쌓이는 걸 보라 — 이게 GC가 청소해야 할 쓰레기다.", actor:"🔥 for(i<n) result += word  →  버린 객체 n개 · 복사 ≈ n²/2", stage:"looptrap", stageLabel:"루프 += 의 함정 (O(n²))" };
    const S3 = { title:"Step 3. StringBuilder — 하나의 가변 버퍼에 append, O(n)", desc:"StringBuilder는 내부에 \"가변 char 배열(버퍼)\"을 하나 들고, append 할 때마다 새 객체를 만드는 대신 그 배열의 뒤에 글자를 이어 쓴다. 배열이 꽉 차면 보통 2배 크기로 한 번에 늘려(용량 확장) 다시 채우므로, n글자를 붙이는 전체 비용이 O(n)으로 떨어진다 — 루프 결합의 O(n²)과 차원이 다르다. 사용법은 간단하다: new StringBuilder()로 만들고 append를 원하는 만큼 호출한 뒤, 마지막에 toString()으로 실제 String을 딱 한 번 만들어 꺼낸다. append는 자기 자신(this)을 반환하므로 sb.append(\"a\").append(\"b\")처럼 체이닝도 된다. 초기 크기를 대략 알면 new StringBuilder(예상길이)로 미리 잡아 용량 확장 횟수까지 줄일 수 있다. 아래에서 같은 n번 반복이 객체 1개(버퍼)만 쓰는 걸 확인하라.", actor:"✅ StringBuilder sb; sb.append(...)×n → 객체 1개 · 복사 ≈ n", stage:"builder", stageLabel:"StringBuilder — 가변 버퍼" };
    const S4 = { title:"Step 4. StringBuilder vs StringBuffer, 그리고 \"+\"의 진실", desc:"StringBuilder와 거의 똑같이 생긴 StringBuffer가 있다. 차이는 딱 하나 — StringBuffer는 모든 메서드가 synchronized(동기화)라 멀티스레드에서 안전하지만, 그 락 비용 때문에 단일 스레드에서는 더 느리다. 현실에서 문자열 조립은 대개 한 메서드 안(한 스레드)에서 끝나므로 기본 선택은 StringBuilder다. 여러 스레드가 정말 같은 버퍼를 공유해야 하는 드문 경우에만 StringBuffer를 쓴다. 한편 초보가 자주 혼동하는 지점 — \"그럼 + 는 무조건 나쁜가?\"는 아니다. \"a\" + b + \"c\" 처럼 한 문장에서 끝나는 결합은 컴파일러가 알아서 StringBuilder(또는 JDK 9+의 invokedynamic)로 바꿔 준다. 나쁜 건 오직 \"루프를 돌며 += 로 누적\"하는 경우다. 컴파일러는 매 반복마다 새 StringBuilder를 만들어 버리기 때문에 최적화가 안 된다. 정리하면: 단일 결합은 + 편하게, 반복 결합은 StringBuilder 직접.", actor:"⚖️ 단일 스레드 → StringBuilder · 공유 → StringBuffer · 단일 결합 → + OK", stage:"buffer", stageLabel:"Builder vs Buffer · \"+\" 최적화" };
    const S5 = { title:"Step 5. String 주요 메서드와 문자열 풀 — 자주 쓰고 자주 틀린다", desc:"실무에서 매일 쓰는 String 메서드를 손에 익히자. substring(begin, end)는 begin 포함·end 제외의 반열림 구간이라 \"abcde\".substring(1,3)은 \"bc\"다 — end를 포함으로 착각해 한 글자 밀리는 실수가 잦다. indexOf는 못 찾으면 -1을 반환하니 반드시 확인해야 하고, split은 인자가 정규식이라 \"a.b.c\".split(\".\")는 빈 배열이 된다(.은 \"아무 문자\") — 점으로 자르려면 split(\"\\\\.\")로 이스케이프해야 한다. 공백 제거는 유니코드까지 처리하는 strip()이 옛 trim()보다 안전하고, 여러 조각을 구분자로 합칠 땐 String.join(\",\", list), 형식 문자열은 String.format(\"%d원\", n)을 쓴다. 마지막으로 문자열 풀 — \"hi\" 같은 리터럴은 풀에 한 번만 저장돼 재사용되므로 ==(같은 객체냐)가 true지만, new String(\"hi\")는 매번 새 객체라 ==가 false다. 그래서 문자열 내용 비교는 반드시 equals를 써야 한다.", actor:"🧰 substring · indexOf · split · join · format · strip · 풀 == 함정", stage:"methods", stageLabel:"주요 메서드 · 문자열 풀" };
    const S6 = { title:"Step 6. 선택 기준 정리 — 언제 String, 언제 StringBuilder", desc:"마지막으로 실전 판단 기준을 한 장으로 굳히자. 규칙은 단순하다. ① 값이 몇 개 안 되고 한 번에 합치면 끝나는 상수·소량 결합은 그냥 String과 +를 쓴다 — 읽기 쉽고 컴파일러가 최적화한다. ② 반복문·재귀·조건 분기를 돌며 조금씩 누적하는 조립은 StringBuilder를 직접 만들어 append하고 마지막에 toString한다. ③ 여러 스레드가 같은 버퍼를 공유하는 드문 경우에만 StringBuffer. 흔한 실패를 뒤집으면 그대로 체크리스트가 된다: 루프에서 += 로 로그·쿼리·CSV를 만들다 느려진 경우(→ StringBuilder), 반대로 값 두세 개 합치는데 StringBuilder를 장황하게 쓴 과설계(→ 그냥 +), split의 정규식 함정에 빠진 경우(→ 이스케이프), 문자열 비교에 ==를 쓴 경우(→ equals). \"루프가 보이면 StringBuilder, 아니면 +\"만 기억해도 대부분 맞다. 다음 장 III-1-2에서 컬렉션 프레임워크로 넘어간다.", actor:"🎯 소량·상수 → String(+) · 루프 결합 → StringBuilder · 공유 → StringBuffer", stage:"choose", stageLabel:"선택 기준 · 실패 사례" };

    // ─────────────────────────────────────────────────────
    // Step 2 — 루프 += 함정: 힙 객체 누적 애니메이션 + 카운터
    // ─────────────────────────────────────────────────────
    function LoopTrapView({ looptrap }) {
      const { n, word } = looptrap;
      const [iter, setIter] = useState(0); // 0..n
      useEffect(() => {
        setIter(0);
        const id = setInterval(() => {
          setIter((k) => (k >= n ? 0 : k + 1)); // 루프처럼 반복 재생
        }, 650);
        return () => clearInterval(id);
      }, [n]);

      // String += : i번째 반복마다 새 임시객체 1개, 복사량 ≈ i*len
      const strObjects = iter;                    // 버려진 객체 수
      const strCopies = (iter * (iter + 1) / 2) * word.length; // 누적 복사 글자수 ≈ n²
      // StringBuilder : 객체 1개(버퍼), 복사량 ≈ iter*len
      const sbObjects = iter === 0 ? 0 : 1;
      const sbCopies = iter * word.length;

      const Counter = ({ label, obj, copy, tone }) => (
        <div className={`rounded-lg border-2 p-2.5 ${tone === 'bad' ? 'border-red-300 bg-red-50' : 'border-emerald-300 bg-emerald-50'}`}>
          <div className={`text-[11px] font-bold mb-1 ${tone === 'bad' ? 'text-red-700' : 'text-emerald-700'}`}>{label}</div>
          <div className="flex gap-3 text-[10px]">
            <div>생성·폐기 객체 <span className={`font-mono font-bold text-sm ${tone === 'bad' ? 'text-red-700' : 'text-emerald-700'}`}>{obj}</span></div>
            <div>누적 복사 <span className={`font-mono font-bold text-sm ${tone === 'bad' ? 'text-red-700' : 'text-emerald-700'}`}>{copy}</span> 글자</div>
          </div>
          <div className="mt-1.5 flex flex-wrap gap-0.5">
            {Array.from({ length: obj }).map((_, i) => (
              <span key={i} className={`inline-block w-3 h-3 rounded-sm ${tone === 'bad' ? 'bg-red-400' : 'bg-emerald-500'}`}></span>
            ))}
          </div>
        </div>
      );

      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="text-[11px] font-bold text-[#8a4200]">🔥 같은 반복 {n}회 — 무엇이 쌓이나</div>
              <div className="text-[10px] font-mono text-[#8a4200] px-2 py-0.5 rounded bg-[#eaf2fb] border border-[#a7c7e7]">i = {iter} / {n}</div>
            </div>
            <div className="space-y-2">
              <Counter label={`❌ String result += "${word}"`} obj={strObjects} copy={strCopies} tone="bad" />
              <Counter label={`✅ sb.append("${word}")`} obj={sbObjects} copy={sbCopies} tone="good" />
            </div>
            <div className="mt-2 text-[9px] text-slate-500">빨강(String)은 반복마다 객체가 쌓이고 복사량이 n²로 폭증한다. 초록(StringBuilder)은 버퍼 1개, 복사량은 n에 비례.</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-2.5">
            <div className="text-[10px] text-slate-700"><span className="font-bold text-[#8a4200]">복잡도:</span> String += 는 <span className="font-mono">O(n²)</span> · StringBuilder는 <span className="font-mono">O(n)</span>. n=10만이면 수 초 vs 수 ms.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — StringBuilder 버퍼 append 애니메이션
    // ─────────────────────────────────────────────────────
    function BuilderView({ builder }) {
      const [idx, setIdx] = useState(0);
      const steps = builder.steps;
      useEffect(() => {
        setIdx(0);
        const id = setInterval(() => setIdx((k) => (k + 1) % steps.length), 900);
        return () => clearInterval(id);
      }, [steps.length]);
      const cur = steps[idx];
      const cells = Array.from({ length: cur.cap }).map((_, i) => cur.buf[i] || '');
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="text-[11px] font-bold text-[#8a4200]">✅ 내부 char[] 버퍼에 이어 쓰기</div>
              <div className="text-[10px] font-mono text-[#8a4200] px-2 py-0.5 rounded bg-[#eaf2fb] border border-[#a7c7e7]">{cur.op}</div>
            </div>
            <div className="flex flex-wrap gap-1 mb-2">
              {cells.map((c, i) => (
                <span key={i} className={`w-7 h-7 flex items-center justify-center rounded border font-mono text-[12px] font-bold

              ))}
            </div>
            <div className="flex gap-3 text-[10px]">
              <div>길이 length <span className="font-mono font-bold text-[#8a4200] text-sm">{cur.len}</span></div>
              <div>용량 capacity <span className="font-mono font-bold text-[#8a4200] text-sm">{cur.cap}</span></div>
              <div>객체 수 <span className="font-mono font-bold text-emerald-700 text-sm">1</span> (버퍼)</div>
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">꽉 차면 용량을 2배로 한 번에 늘린다(위 마지막 스텝). 새 String은 만들지 않고 append → 마지막에 toString() 한 번.</div>
          </div>
          <div className="rounded-lg border-2 border-emerald-300 bg-emerald-50 p-2.5">

          </div>
        </div>
      );
    }

                    <td className="py-1 pr-2 font-mono text-slate-700">{r.call}</td>
                    <td className="py-1 pr-2 font-mono font-bold text-[#8a4200] whitespace-nowrap">{r.out}</td>
                    <td className="py-1 text-[9px] text-slate-500">{r.note}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🏊 {p.title}</div>
            <div className="space-y-1.5">
              {poolRow(p.a)}
              {poolRow(p.b)}
              {poolRow(p.c)}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">== 는 "같은 객체냐", equals는 "같은 내용이냐". 문자열 비교는 언제나 equals.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 선택 기준 + 실패 사례
    // ─────────────────────────────────────────────────────
    function ChooseView({ choose }) {
      const TONE = { good: 'border-emerald-300 bg-emerald-50', mid: 'border-[#a7c7e7] bg-[#eaf2fb]' };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🎯 무엇을 언제 쓰나</div>
            <div className="space-y-1.5">
              {choose.picks.map((r, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 ${TONE[r.tone]}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] text-slate-700">{r.when}</span>
                    <span className="font-mono text-[11px] font-bold text-[#8a4200]">{r.pick}</span>
                  </div>
                  <div className="text-[9px] text-slate-500 mt-0.5">{r.why}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-1.5">🚑 실무 실패 4종 → 처방</div>
            <div className="space-y-1">
              {choose.fails.map((f, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono text-red-600 flex-1 line-through decoration-red-300">{f.bad}</span>
                  <span className="text-orange-500">▶</span>
                  <span className="font-mono text-emerald-700 flex-1 font-bold">{f.fix}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf2fb]', border: 'border-[#a7c7e7]', text: 'text-[#8a4200]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java 오렌지 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      immutable: { icon: '📌', label: 'String 불변성' },
      looptrap:  { icon: '🔥', label: '루프 += 함정' },
      builder:   { icon: '✅', label: 'StringBuilder 버퍼' },
      buffer:    { icon: '⚖️', label: 'Builder vs Buffer' },
      methods:   { icon: '🧰', label: '메서드 · 풀' },
      choose:    { icon: '🎯', label: '선택 기준' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.immutable;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#8a4200] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>문자열 조립 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#8a4200] font-mono mb-3 px-2 py-1 rounded bg-[#eaf2fb] border border-[#a7c7e7]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'immutable' && <ImmutableView immutable={state.immutable} why={state.why} />}
          {state.stage === 'looptrap' && <LoopTrapView looptrap={state.looptrap} />}
          {state.stage === 'builder' && <BuilderView builder={state.builder} />}
          {state.stage === 'buffer' && <BufferView buffer={state.buffer} />}
          {state.stage === 'methods' && <MethodsView methods={state.methods} />}
          {state.stage === 'choose' && <ChooseView choose={state.choose} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-[#E76F00] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅲ. 필수 API</span>
              <div>
                <h1 className="text-2xl font-bold text-[#8a4200]"><span className="font-mono text-lg mr-1">III-1-1</span> String·StringBuilder</h1>
                <p className="text-sm text-[#8a4200]/80">String 불변성이 만드는 성능 함정과 StringBuilder로 효율적 문자열 조립</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#8a4200] text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#8a4200] text-white' : 'bg-[#E76F00] text-white hover:bg-[#8a4200]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#E76F00] bg-white px-4 py-3 text-sm text-[#8a4200]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                String은 불변이라 모든 "변경"이 새 객체를 만든다 — 루프에서 += 로 결합하면 O(n²) + 임시객체 폭탄이다.
                반복 결합은 StringBuilder로 버퍼 하나에 append하고 마지막에 toString하면 O(n)으로 떨어진다.
                동기화가 필요한 스레드 공유 시에만 StringBuffer, 단일 문장 결합은 컴파일러가 최적화하니 + 를 그대로 써도 된다.
                substring(end 제외)·split(정규식)·문자열 비교(equals)의 함정만 피하면 문자열은 안전하다. 다음 장 III-1-2에서 컬렉션 프레임워크로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['불변성', 'StringBuilder', 'StringBuffer', 'O(n²)', 'append', 'toString', 'char배열', '용량확장', 'substring', 'split정규식', '문자열풀', 'equals'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-[#8a4200] border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#8a4200]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-1-2.html" className="underline hover:no-underline">다음: III-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
