  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Java III-2-2 — 예외 계층, checked vs unchecked
    학습 목표: Throwable→Error/Exception, Exception→checked/RuntimeException(unchecked)의 계층을 뜯고,
              컴파일러가 강제하는 checked와 강제하지 않는 unchecked의 차이·처리 전략,
              try-catch-finally·multi-catch·try-with-resources·예외 체이닝·커스텀 예외 설계,
              그리고 실무 실패 사례(예외 삼키기·무분별 래핑·리소스 누수·너무 넓은 catch)를 6단계로 다룬다.
    패턴: fastapi v1 — 좌(LiveDataPane: 계층 트리·강제 대비·전파·자동정리·번역·안티패턴) / 우(VSCode CodeViewer: java)
    색상: Java 오렌지 #E76F00 기조 / 형광펜·배경 채움 옅은 파랑 #a7c7e7 / 텍스트·링크·배지 오렌지 다크 #8a4200
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 계층 → checked/unchecked → 잡기·전파 → 자동정리 → 체이닝·커스텀 → 안티패턴
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // beat 재구성 — 원본 6스텝을 36개 beat 로 펼침

    const CODE = {
      tree: {lang:"java", filename:"ThrowableTree.java — 계층 한눈에", lines:[
        "// java.lang 표준 계층 (요약)",
        "//",
        "//   Throwable",
        "//   ├── Error                  (복구 불가 · 잡지 마라)",
        "//   │     ├── OutOfMemoryError",
        "//   │     └── StackOverflowError",
        "//   └── Exception              (대응 가능 · 최상위 checked)",
        "//         ├── IOException      (checked)",
        "//         ├── SQLException     (checked)",
        "//         └── RuntimeException (unchecked 뿌리)",
        "//               ├── NullPointerException",
        "//               ├── IllegalArgumentException",
        "//               └── IndexOutOfBoundsException",
        "",
        "boolean isChecked(Throwable t) {",
        "  // Exception 이지만 RuntimeException 은 아닌 것 = checked",
        "  return (t instanceof Exception)",
        "      && !(t instanceof RuntimeException);",
        "}",
        "",
        "// Error 는 Exception 이 아니므로 위 검사에서 false.",
        "// => catch (Exception e) 로는 Error 가 안 잡힌다(의도된 설계).",
      ]},
      checkedVsUnchecked: {lang:"java", filename:"CheckedVsUnchecked.java — 강제의 실체", lines:[
        "import java.io.*;",
        "",
        "// (1) checked: 컴파일러가 처리를 강제한다",
        "String readFirstLine(String path) throws IOException {",
        "  //                                    ^^^^^^^^^^^^^^^^^^",
        "  //  throws 를 지우면 아래 줄에서 컴파일 에러:",
        "  //  \"unreported exception IOException; must be caught\"",
        "  try (BufferedReader r = new BufferedReader(new FileReader(path))) {",
        "    return r.readLine();   // readLine() 은 IOException 을 던진다",
        "  }",
        "}",
        "",
        "// (2) unchecked: 아무 선언 없이 던져진다",
        "int parsePositive(String s) {",
        "  int n = Integer.parseInt(s);            // NumberFormatException(unchecked)",
        "  if (n <= 0) {",
        "    throw new IllegalArgumentException(\"양수가 아님: \" + n);",
        "    // throws 선언 불필요 — 컴파일러가 강제하지 않는다",
        "  }",
        "  return n;",
        "}",
      ]},
      propagation: {lang:"java", filename:"Propagation.java — 전파와 잡기", lines:[
        "void main() {",
        "  try {",
        "    service();                 // 여기서 호출 → 안쪽에서 예외 발생",
        "  } catch (FileNotFoundException e) {",
        "    // 좁은 타입 먼저: 파일 없음만 특별 처리",
        "    log.warn(\"설정 파일 없음, 기본값 사용\", e);",
        "  } catch (IOException | SQLException e) {",
        "    // multi-catch: I/O·DB 오류는 같은 방식으로",
        "    log.error(\"외부 자원 오류\", e);",
        "    throw new IllegalStateException(\"초기화 실패\", e);",
        "  } finally {",
        "    // 성공/실패와 무관하게 항상 실행 (정리)",
        "    metrics.record(\"init.attempt\");",
        "  }",
        "}",
        "",
        "void service() throws IOException { repository(); }   // 안 잡고 전파",
        "void repository() throws IOException {",
        "  new BufferedReader(new FileReader(\"app.conf\")).readLine();",
        "  //  💥 파일 없으면 FileNotFoundException(IOException 하위) → 위로 전파",
        "}",
      ]},

    const S1 = { title: "Step 1. Throwable 계층 — Error와 Exception은 다른 종족이다", desc: "자바에서 던지고 잡을 수 있는 모든 것의 최상위는 Throwable이다. 그 아래는 크게 두 갈래로 갈린다. Error는 OutOfMemoryError·StackOverflowError처럼 JVM 수준에서 터지는 \"복구 불가능한\" 상황이라, 애플리케이션이 잡아서 되살리려 해선 안 된다. 반대편 Exception은 프로그램이 대응할 수 있는 예외 상황이다. 그리고 Exception은 다시 두 부류로 나뉜다 — RuntimeException을 상속하지 않은 \"checked\"와, RuntimeException 계열인 \"unchecked\"다. 이 갈래를 처음부터 정확히 그려두는 이유는, 잡을 대상(Exception)과 잡으면 안 되는 대상(Error)을 구분하고, 컴파일러가 언제 처리를 강제하는지를 계층 위치만 보고 판단하기 위해서다. 실무에서 catch (Throwable t)나 catch (Exception e)로 뭉뚱그리면 Error까지 삼켜 장애 원인을 숨기게 되므로, 계층을 아는 것이 곧 안전한 catch 범위를 정하는 일이다." };
    const S2 = { title: "Step 2. checked vs unchecked — 컴파일러가 강제하느냐", desc: "두 부류의 실질적 차이는 딱 하나, \"컴파일러가 처리를 강제하는가\"이다. checked 예외(IOException 등)를 던질 수 있는 메서드는 반드시 try-catch로 잡거나 throws로 시그니처에 선언해야 하고, 안 하면 컴파일 자체가 안 된다. 설계 의도는 \"호출자가 무시하면 안 되는, 복구 가능한 외부 상황(파일 없음·네트워크 끊김)을 코드에 강제로 드러내라\"는 것이다. 반대로 unchecked(RuntimeException 계열)는 강제가 없다. NullPointerException·IllegalArgumentException처럼 대개 프로그래밍 오류라서, 매 호출마다 try-catch를 강요하면 코드가 지저분해지고 정작 고쳐야 할 것은 예외 처리가 아니라 버그이기 때문이다. 선택 기준은 이 관점에서 나온다 — 호출자가 현실적으로 회복할 수 있는 상황이면 checked, 계약 위반이나 버그라 회복이 무의미하면 unchecked. 다만 checked를 남발하면 throws가 전염병처럼 번지고 무의미한 래핑을 부르므로, 현대 자바·스프링은 unchecked를 선호하는 경향이 강하다." };
    const S3 = { title: "Step 3. try-catch-finally · multi-catch · 전파", desc: "예외를 만난 지점에서 잡지 않으면, 던져진 예외는 호출 스택을 거꾸로 타고 올라가며 자신을 잡아줄 catch를 찾는다. 이 \"전파(propagation)\"가 예외의 핵심 동작이다 — main까지 아무도 안 잡으면 프로그램이 스택 트레이스를 뿌리며 종료된다. 잡는 도구가 try-catch-finally다. try에서 위험한 코드를 감싸고, catch에서 타입별로 대응하며, finally는 예외가 나든 안 나든 항상 실행되어 정리 코드를 둔다. 여러 예외를 같은 방식으로 처리할 땐 multi-catch(catch (A | B e))로 중복을 줄인다. 이때 순서 규칙이 중요하다 — 부모 타입(Exception)을 자식(IOException)보다 위 catch에 두면 자식 catch는 영원히 도달 못 해 컴파일 에러가 난다. 그래서 항상 \"좁은 타입 먼저, 넓은 타입 나중\"이다. 실무 함정은 catch (Exception e)로 너무 넓게 잡아 정작 구분해서 처리했어야 할 예외까지 뭉개는 것과, finally에서 또 예외를 던져 원래 예외를 덮어버리는 것이다." };
    const S4 = { title: "Step 4. try-with-resources — finally 리소스 누수를 끝내다", desc: "finally로 리소스를 닫는 옛 방식은 두 가지 함정이 있다. 첫째, close() 자체가 예외를 던질 수 있어 finally 안에서 또 try-catch를 겹쳐야 하고, 둘째, try 본문에서 난 진짜 예외를 finally의 close 예외가 덮어써 원인이 사라진다. try-with-resources는 이 문제를 언어 차원에서 해결한다. try(...) 괄호 안에서 AutoCloseable을 구현한 자원을 열면, 블록을 벗어나는 순간(정상 종료든 예외든) JVM이 열린 역순으로 close()를 자동 호출한다. 게다가 close()에서 난 예외는 원래 예외를 덮지 않고 \"suppressed\"로 원래 예외에 매달려 보존된다(getSuppressed()로 확인). 실무 결론은 명확하다 — 파일·소켓·DB 커넥션·스트림처럼 닫아야 하는 자원은 예외 없이 try-with-resources로 열어라. finally에서 수동으로 닫는 코드는 리소스 누수와 원인 소실의 온상이며, 코드 리뷰에서 반드시 걸러야 할 레거시 패턴이다." };
    const S5 = { title: "Step 5. 예외 체이닝 · 번역 · 커스텀 예외 설계", desc: "하위 계층의 기술 예외를 그대로 상위로 흘려보내면 도메인 코드가 JDBC·파일 API에 오염된다. 그래서 \"예외 번역(translation)\"을 한다 — 저수준 SQLException을 잡아 의미가 분명한 도메인 예외(예: OrderNotFoundException)로 바꿔 던지는 것이다. 이때 반드시 원래 예외를 cause로 넘겨 체이닝한다(new DomainException(msg, cause)). cause를 빠뜨리면 스택 트레이스에서 진짜 원인(어느 SQL이 왜 터졌는지)이 통째로 사라져, 장애 분석이 불가능해진다. 이것이 실무에서 가장 자주 저지르는 실수 중 하나다. 커스텀 예외를 설계할 땐 checked/unchecked 선택이 관건이다 — 호출자가 대부분 회복할 수 없고 상위로 그냥 전파될 거라면 RuntimeException을 상속(unchecked)해 throws 전염을 막는다. 반대로 호출자가 반드시 분기 처리해야 하는 회복 가능한 상황이면 Exception을 상속(checked)한다. 스프링이 모든 데이터 접근 예외를 unchecked인 DataAccessException 계층으로 번역하는 이유가 바로 이것이다." };
    const S6 = { title: "Step 6. 실무 실패 사례 — 이렇게 쓰면 장애가 숨는다", desc: "예외를 잘못 다루면 프로그램은 안 죽지만 원인이 사라져 훨씬 위험해진다. 첫째, \"예외 삼키기(empty catch)\" — catch에서 아무것도 안 하면 예외가 조용히 사라져, 데이터가 저장 안 됐는데도 성공한 것처럼 보인다. 최소한 로그를 남기고 절대 빈 catch를 두지 마라. 둘째, \"checked를 RuntimeException으로 무분별 래핑\" — 귀찮다고 모든 예외를 catch (Exception e) { throw new RuntimeException(e); }로 뭉개면 타입 정보와 처리 의도가 사라진다. 번역은 의미 있는 도메인 타입으로 해야 한다. 셋째, \"finally에서 리소스 누수\" — finally 없이 스트림을 안 닫거나 finally에서 조건을 잘못 걸어 close를 건너뛰면 커넥션이 고갈된다(→ try-with-resources로 해결). 넷째, \"너무 넓은 catch\" — catch (Exception e)나 catch (Throwable t)는 잡지 말아야 할 프로그래밍 버그·Error까지 삼켜 무한 재시도나 데이터 손상을 부른다. 예외는 필요한 타입만, 필요한 곳에서, 원인을 보존하며 잡는 것이 원칙이다." };

            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🧭 {design.title}</div>
            <div className="space-y-1.5">
              {design.rows.map((r, i) => (
                <div key={i} className="rounded border border-slate-200 bg-white px-2 py-1.5 flex items-center gap-2">
                  <span className="text-[10px] text-slate-700 flex-1">{r.q}</span>
                  <span className={`text-[9px] font-mono rounded border px-1.5 py-0.5 whitespace-nowrap ${DESIGN_TONE[r.tone]}`}>{r.pick}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 안티패턴 카드
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-red-300 bg-white p-2.5">
              <div className="flex items-start gap-1.5 mb-1">
                <span className="text-[10px] font-bold text-red-600">❌</span>
                <code className="text-[10px] font-mono text-red-800 flex-1 break-all">{p.bad}</code>
              </div>
              <div className="text-[9px] text-slate-500 mb-1.5 pl-4">→ {p.why}</div>
              <div className="flex items-start gap-1.5 rounded bg-emerald-50 border border-emerald-300 px-2 py-1">
                <span className="text-[10px] font-bold text-emerald-700">✅</span>
                <span className="text-[10px] text-emerald-900 flex-1">{p.good}</span>
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf2fb]', border: 'border-[#a7c7e7]', text: 'text-[#8a4200]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java 오렌지 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      hierarchy: { icon: '🌳', label: 'Throwable 계층' },
      checked:   { icon: '⚖️', label: 'checked / unchecked' },
      catch:     { icon: '📞', label: '전파 · try-catch' },
      resource:  { icon: '🚰', label: 'try-with-resources' },
      custom:    { icon: '🔗', label: '체이닝 · 커스텀' },
      pitfall:   { icon: '🚨', label: '실무 안티패턴' },
    };
    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.hierarchy;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#8a4200] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>예외 계층 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#8a4200] font-mono mb-3 px-2 py-1 rounded bg-[#eaf2fb] border border-[#a7c7e7]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'hierarchy' && <HierarchyView hierarchy={state.hierarchy} />}
          {state.stage === 'checked' && <CheckedView compare={state.compare} />}
          {state.stage === 'catch' && <CatchView stack={state.stack} />}
          {state.stage === 'resource' && <ResourceView resource={state.resource} />}
          {state.stage === 'custom' && <CustomView translate={state.translate} design={state.design} />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-[#E76F00] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅲ. 필수 API</span>
              <div>
                <h1 className="text-2xl font-bold text-[#8a4200]"><span className="font-mono text-lg mr-1">III-2-2</span> 예외 계층 — checked vs unchecked</h1>
                <p className="text-sm text-[#8a4200]/80">Throwable 계층과 checked/unchecked 예외의 차이·처리 전략</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#8a4200] text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#8a4200] text-white' : 'bg-[#E76F00] text-white hover:bg-[#8a4200]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#E76F00] bg-white px-4 py-3 text-sm text-[#8a4200]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Throwable은 Error(복구 불가·잡지 마라)와 Exception으로 갈리고, Exception은 다시 checked(컴파일러 강제)와 unchecked(RuntimeException 계열·강제 없음)로 나뉜다.
                회복 가능하면 checked, 버그·계약 위반이면 unchecked를 고른다. catch는 좁은 타입 먼저, finally는 항상 실행되며, 자원은 try-with-resources로 자동 정리한다.
                저수준 예외는 도메인 예외로 번역하되 반드시 cause를 넘겨 체이닝하라. 빈 catch(삼키기)·무분별 래핑·리소스 누수·catch (Throwable)는 원인을 숨겨 장애를 키우는 4대 안티패턴이다.
                다음 장 IV-1-1에서 이어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Throwable', 'Error', 'Exception', 'checked', 'unchecked', 'RuntimeException', 'try-with-resources', 'AutoCloseable', 'multi-catch', 'finally', '예외체이닝', 'cause', '예외번역', '안티패턴'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-[#8a4200] border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#8a4200]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part4/IV-1-1.html" className="underline hover:no-underline">다음: IV-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
