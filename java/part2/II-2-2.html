  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>☕</text></svg>" />

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Java II-2-2 — 캡슐화와 접근제어자
    학습 목표: private 필드 + getter/setter로 내부를 감추고 불변식을 지키는 캡슐화를 5단계로 뜯어본다.
              ① public 필드의 위험(무방비) → ② private + getter/setter(경계 세우기) →
              ③ setter 유효성 검사(불변식 보호) → ④ 불변 객체 + 방어적 복사 → ⑤ 접근제어자 4종 범위 매트릭스.
    패턴: fastapi v1 — 좌(LiveDataPane: 캡슐화 상자·경계·검증 게이트·범위 매트릭스) / 우(VSCode CodeViewer: BankAccount.java)
    색상: Java 오렌지 #E76F00 기조 / 형광펜·배경 채움 옅은 파랑 #a7c7e7 / 텍스트·링크·배지 오렌지 다크 #8a4200
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — public 위험 → private 경계 → setter 검증 → 불변 객체 → 접근제어자 매트릭스
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(exposed/encap/validate/immutable/modifiers)에 따라
    //   서로 다른 시각화를 그린다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      exposed: {lang:"java", filename:"BankAccount.java — 위험한 public 필드", lines:[
        "// ❌ 안티패턴: 필드를 그대로 외부에 노출",
        "public class BankAccount {",
        "  // public 이라 외부 어디서든 직접 읽고 쓸 수 있다",
        "  public long balance;",
        "}",
        "",
        "class Demo {",
        "  public static void main(String[] args) {",
        "    BankAccount acc = new BankAccount();",
        "    acc.balance = 50000;      // 정상 입금",
        "    System.out.println(acc.balance);  // => 50000",
        "",
        "    // 관문이 없으니 이런 것도 그대로 통과한다",
        "    acc.balance = -9999;      // 불변식 붕괴!",
        "    System.out.println(acc.balance);  // => -9999",
        "",
        "    // 나중에 balance 타입을 BigDecimal 로 바꾸면",
        "    // 위 대입문들이 전부 컴파일 에러 → 변경 취약",
        "  }",
        "}",
      ]},
      encap: {lang:"java", filename:"BankAccount.java — private + 메서드 경계", lines:[
        "public class BankAccount {",
        "  // ✅ 필드는 감춘다 — 외부는 존재조차 몰라도 된다",
        "  private long balance;",
        "",
        "  // 읽기 전용 통로 (getter)",
        "  public long getBalance() {",
        "    return balance;",
        "  }",
        "",
        "  // 쓰기는 \"의미 있는 행위\"로만 노출 (setter 대신)",
        "  public void deposit(long amount) {",
        "    balance += amount;",
        "  }",
        "",
        "  public void withdraw(long amount) {",
        "    balance -= amount;",
        "  }",
        "}",
        "",
        "class Demo {",
        "  public static void main(String[] args) {",
        "    BankAccount acc = new BankAccount();",
        "    acc.deposit(50000);",
        "    System.out.println(acc.getBalance());  // => 50000",
        "    // acc.balance = -9999;  // 컴파일 에러: private",
        "  }",
        "}",
      ]},
      validate: {lang:"java", filename:"BankAccount.java — 검증으로 불변식 유지", lines:[
        "public class BankAccount {",
        "  private long balance;",
        "",
        "  public void deposit(long amount) {",
        "    if (amount <= 0) {",
        "      throw new IllegalArgumentException(\"입금액은 양수여야 한다\");",
        "    }",
        "    balance += amount;",
        "  }",
        "",
        "  public void withdraw(long amount) {",
        "    if (amount <= 0) {",
        "      throw new IllegalArgumentException(\"출금액은 양수여야 한다\");",
        "    }",
        "    if (amount > balance) {          // 불변식 방어",
        "      throw new IllegalStateException(\"잔액 부족\");",
        "    }",
        "    balance -= amount;",
        "  }",
        "",
        "  public long getBalance() { return balance; }",
        "}",
        "",
        "class Demo {",
        "  public static void main(String[] args) {",
        "    BankAccount acc = new BankAccount();",
        "    acc.deposit(50000);",
        "    acc.withdraw(30000);",
        "    System.out.println(acc.getBalance());  // => 20000",

    const S3 = { title:"Step 3. setter/메서드 안에서 검증 — 불변식을 지킨다", desc:"경계를 세운 진짜 목적은 그 관문에서 유효성 검사를 걸어 불변식을 지키는 데 있다. deposit()과 withdraw() 안에 \"입금액은 양수여야 한다\", \"잔액보다 많이 출금할 수 없다\" 같은 규칙을 넣으면, 잘못된 값은 상태에 반영되기 전에 예외로 막힌다. 이제 BankAccount 객체는 언제 어떤 순서로 호출해도 balance ≥ 0을 항상 만족한다 — 이것이 불변식을 \"객체가 스스로 보장한다\"는 의미다. 이 검증을 필드가 아니라 메서드에 두는 것이 핵심이다. 만약 검증을 호출하는 쪽마다 흩뿌리면(if (amt > 0) acc.deposit(amt)) 누군가 빠뜨리는 순간 규칙이 깨진다. 검증을 객체 안으로 모으면 \"이 규칙은 여기 한 곳에만 있다\"가 보장된다. 실무에서 흔한 실패가 setter를 기계적으로 다 만들고 검증을 안 넣는 것 — 그러면 private으로 감춘 의미가 없다. setter가 있다면 반드시 그 안에서 값을 검사하라.", actor:"🛡️ deposit/withdraw 게이트 · 잘못된 값은 예외로 차단", stage:"validate", stageLabel:"유효성 검사로 불변식 보호" };
    const S4 = { title:"Step 4. 불변 객체 + 방어적 복사 — 아예 못 바꾸게", desc:"캡슐화의 가장 강력한 형태는 애초에 상태가 바뀌지 않게 만드는 불변 객체다. 모든 필드를 final로 선언하고 setter를 하나도 두지 않으면, 객체는 생성 시점에 값이 정해진 뒤 절대 변하지 않는다. 불변 객체는 검증을 생성자에서 딱 한 번만 통과하면 그 뒤로는 영원히 유효하고, 여러 스레드가 동시에 읽어도 안전하며(락 불필요), 캐시 키나 Map의 키로 마음 놓고 쓸 수 있다. 그런데 함정이 하나 있다 — 필드가 배열이나 List, Date처럼 가변 객체를 가리키면 final은 \"참조를 못 바꾼다\"만 보장할 뿐, 그 참조가 가리키는 내용물은 여전히 바뀔 수 있다. 생성자에서 받은 리스트를 그대로 저장하고 getter가 그 참조를 그대로 반환하면, 외부가 list.add(...)로 내부를 뒤흔든다. 그래서 가변 객체는 들일 때(생성자)와 내보낼 때(getter) 모두 복사본을 쓰는 방어적 복사가 필요하다. 이걸 빠뜨리면 \"불변인 줄 알았는데 밖에서 바뀌는\" 가장 찾기 어려운 버그가 된다.", actor:"🧊 final 필드 · setter 없음 · 가변 필드는 방어적 복사", stage:"immutable", stageLabel:"불변 객체 + 방어적 복사" };

          rule:'메서드도 같다 — 내부 헬퍼 private, 확장 지점 protected, 공개 API 만 public',
        },
        alert:{ tone:'info', text:'describe() 만 public 이면 외부가 아는 통로는 하나뿐이다. 나머지는 언제든 고칠 수 있다.' },
        code:{...CODE.modifiers, highlight:[9,10,11,12,13,14]},
      },
      { ...S5,
        beat:{ label:'다른 패키지에서의 결과', at:'AccessDemo.java L17–22',
               caption:'밖에서는 name 만 보인다. 좁게 시작해 두면 나중에 넓히는 일은 언제든 안전하다.',
               changes:[{mark:'read', text:'product.name 만 OK'},
                        {mark:'gone', text:'sku · stock · id 접근'},
                        {mark:'new',  text:'원칙: 좁게 시작'}] },
        modifiers:{
          rows:[
            { mod:'private', sameClass:true, samePkg:false, subCls:false, world:false, use:'필드·내부 헬퍼 (기본)' },
            { mod:'default', sameClass:true, samePkg:true, subCls:false, world:false, use:'패키지 내부 협력·테스트' },
            { mod:'protected', sameClass:true, samePkg:true, subCls:true, world:false, use:'자식이 쓸 확장 지점' },
            { mod:'public', sameClass:true, samePkg:true, subCls:true, world:true, use:'공개 API' },
          ],
          rule:'가장 좁게 시작 → 필요할 때만 넓힌다 (넓힌 건 되돌리기 어렵다)',
        },
        alert:{ tone:'good', text:'private ⊂ default ⊂ protected ⊂ public. 필드는 일단 private, 공개 API만 public. 좁게 시작하면 넓히기는 안전하지만, 넓게 열면 남이 의존해 좁히기 어렵다. 다음 장 III-1-1에서 컬렉션을 다룬다.' },
        code:{...CODE.modifiers, highlight:[17,18,19,20,21,22]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — public 필드: 무방비 대입
    // ─────────────────────────────────────────────────────
    function ExposedView({ exposed }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-red-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2 flex items-center gap-1.5">
              <span>🔓</span><span>{exposed.className} — 필드가 밖으로 뚫려 있다</span>
            </div>
            <div className="rounded border-2 border-red-300 bg-red-50 px-3 py-2 font-mono text-[11px] font-bold text-red-700 text-center mb-3">
              {exposed.field}
            </div>
            <div className="text-[10px] font-bold text-slate-500 mb-1">외부에서 직접 대입 (관문 없음):</div>
            <div className="space-y-1.5">
              {exposed.writes.map((w, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 flex items-center gap-2 ${w.ok ? 'border-[#a7c7e7] bg-[#eaf2fb]' : 'border-red-300 bg-red-50'}`}>
                  <span className="text-[10px] text-slate-600 w-24">{w.by}</span>
                  <span className="text-orange-500 text-[10px] font-bold">──▶</span>
                  <span className={`text-[11px] font-mono font-bold flex-1 ${w.ok ? 'text-[#8a4200]' : 'text-red-700'}`}>balance {w.value}</span>
                  <span className="text-[12px]">{w.ok ? '✅' : '💥'}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-red-600 font-bold text-center">불변식 "잔액 ≥ 0" 을 막을 관문이 없다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — private + 메서드 경계
    // ─────────────────────────────────────────────────────
    function EncapView({ encap }) {
      const KIND = { read: 'bg-[#eaf2fb] border-[#a7c7e7] text-[#8a4200]', write: 'bg-orange-100 border-[#E76F00] text-[#8a4200]' };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2 flex items-center gap-1.5">
              <span>🔒</span><span>{encap.className} — public 메서드가 감싼 경계</span>
            </div>
            <div className="rounded-lg border-2 border-[#E76F00] bg-orange-50 p-2.5">
              <div className="text-[9px] font-bold text-[#8a4200] mb-1.5 text-center">public 메서드 경계 (외부에 열린 통로)</div>
              <div className="space-y-1 mb-2.5">
                {encap.api.map((m, i) => (
                  <div key={i} className={`rounded border px-2 py-1 flex items-center gap-2 ${KIND[m.kind]}`}>
                    <span className="text-[10px] font-mono font-bold w-32">{m.sig}</span>
                    <span className="text-[9px] flex-1">{m.desc}</span>
                    <span className="text-[8px] rounded-full bg-white border border-current px-1.5 py-0.5">{m.kind === 'read' ? '읽기' : '쓰기'}</span>
                  </div>
                ))}
              </div>
              <div className="rounded border-2 border-dashed border-slate-400 bg-[#faf7ef] px-3 py-2">
                <div className="text-[8px] text-slate-500 mb-1">🔒 감춰진 내부 (외부에서 접근 불가)</div>
                {encap.hidden.map((h, i) => (
                  <div key={i} className="font-mono text-[11px] font-bold text-slate-700 line-through decoration-slate-400/50">{h}</div>
                ))}
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500 text-center">외부는 필드를 못 본다 — 정해진 메서드로만 소통한다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 검증 게이트
    // ─────────────────────────────────────────────────────
    function ValidateView({ validate }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🛡️ 검증 게이트 — {validate.gate}</div>
            <div className="rounded border-2 border-emerald-300 bg-emerald-50 px-2 py-1 text-[10px] font-bold text-emerald-800 text-center mb-2.5">
              지켜야 할 불변식: {validate.invariant}
            </div>
            <div className="space-y-1.5">
              {validate.checks.map((c, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 ${c.pass ? 'border-emerald-300 bg-emerald-50' : 'border-red-300 bg-red-50'}`}>
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-mono font-bold text-[#8a4200] flex-1">{c.input}</span>
                    <span className="text-[12px]">{c.pass ? '✅ 통과' : '⛔ 차단'}</span>
                  </div>
                  <div className="flex items-center gap-2 mt-0.5">
                    <span className="text-[8px] text-slate-500">규칙 {c.rule}</span>
                    <span className={`text-[9px] font-mono ml-auto ${c.pass ? 'text-emerald-700' : 'text-red-700 font-bold'}`}>{c.result}</span>
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500 text-center">검증이 객체 안에 모여 있어 어떤 호출 순서에도 불변식이 유지된다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 불변 객체 + 방어적 복사
    // ─────────────────────────────────────────────────────
    function ImmutableView({ immutable }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2 flex items-center gap-1.5">
              <span>🧊</span><span>{immutable.className} — 모든 필드 final, setter 없음</span>
            </div>
            <div className="space-y-1.5 mb-3">
              {immutable.fields.map((f, i) => (
                <div key={i} className={`rounded border px-2 py-1.5 flex items-center gap-2 ${f.danger ? 'border-amber-400 bg-amber-50' : 'border-[#a7c7e7] bg-[#eaf2fb]'}`}>
                  <span className="text-[11px]">{f.danger ? '⚠️' : '🔒'}</span>
                  <span className="text-[11px] font-mono font-bold text-[#8a4200] flex-1">{f.name}</span>
                  <span className={`text-[9px] ${f.danger ? 'text-amber-800 font-bold' : 'text-slate-500'}`}>{f.note}</span>
                </div>
              ))}
            </div>
            <div className="text-[10px] font-bold text-slate-500 mb-1">불변 객체의 이득:</div>
            <div className="space-y-1">
              {immutable.benefits.map((b, i) => (
                <div key={i} className="rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-[10px] text-emerald-800 flex items-center gap-1.5">
                  <span>✅</span><span>{b}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 접근제어자 범위 매트릭스
    // ─────────────────────────────────────────────────────
    function ModifiersView({ modifiers }) {
      const cell = (ok) => (
        <span className={`text-[11px] font-bold ${ok ? 'text-emerald-600' : 'text-red-400'}`}>{ok ? '●' : '○'}</span>
      );
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🔑 접근 범위 매트릭스 (● 접근 가능 · ○ 불가)</div>
            <table className="w-full text-[10px]">
              <thead>
                <tr className="text-[#8a4200]">
                  <th className="text-left py-1 font-bold">제어자</th>
                  <th className="py-1 font-bold">같은<br/>클래스</th>
                  <th className="py-1 font-bold">같은<br/>패키지</th>
                  <th className="py-1 font-bold">자식<br/>(타패키지)</th>
                  <th className="py-1 font-bold">전체</th>
                </tr>
              </thead>
              <tbody>
                {modifiers.rows.map((r, i) => (
                  <tr key={i} className="border-t border-[#a7c7e7]/50">
                    <td className="py-1.5 font-mono font-bold text-[#8a4200]">{r.mod}</td>
                    <td className="text-center">{cell(r.sameClass)}</td>
                    <td className="text-center">{cell(r.samePkg)}</td>
                    <td className="text-center">{cell(r.subCls)}</td>
                    <td className="text-center">{cell(r.world)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[10px] font-bold text-[#8a4200] mb-1.5">🧭 언제 무엇을 쓰나</div>
            <div className="space-y-1">
              {modifiers.rows.map((r, i) => (
                <div key={i} className="flex items-center gap-2 text-[10px]">
                  <span className="font-mono font-bold text-[#8a4200] w-20">{r.mod}</span>
                  <span className="text-slate-700 flex-1">{r.use}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-[#8a4200] font-bold border-t border-[#a7c7e7] pt-1.5">💡 {modifiers.rule}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf2fb]', border: 'border-[#a7c7e7]', text: 'text-[#8a4200]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java 오렌지 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      exposed:   { icon: '🔓', label: 'public 필드 (무방비)' },
      encap:     { icon: '🔒', label: 'private + 메서드 경계' },
      validate:  { icon: '🛡️', label: '유효성 검사' },
      immutable: { icon: '🧊', label: '불변 객체' },
      modifiers: { icon: '🔑', label: '접근제어자 4종' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.exposed;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#8a4200] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>캡슐화 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#8a4200] font-mono mb-3 px-2 py-1 rounded bg-[#eaf2fb] border border-[#a7c7e7]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'exposed' && <ExposedView exposed={state.exposed} />}
          {state.stage === 'encap' && <EncapView encap={state.encap} />}
          {state.stage === 'validate' && <ValidateView validate={state.validate} />}
          {state.stage === 'immutable' && <ImmutableView immutable={state.immutable} />}
          {state.stage === 'modifiers' && <ModifiersView modifiers={state.modifiers} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      // (DOM ref 방식은 이전 단계 결과가 한 렌더 늦게 보이는 문제가 있어 문자열 API 사용)
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-[#E76F00] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅱ. 객체지향 핵심</span>
              <div>
                <h1 className="text-2xl font-bold text-[#8a4200]"><span className="font-mono text-lg mr-1">II-2-2</span> 캡슐화와 접근제어자</h1>
                <p className="text-sm text-[#8a4200]/80">private 필드 + getter/setter로 내부를 감추고 불변식을 지키는 캡슐화</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#8a4200] text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#8a4200] text-white' : 'bg-[#E76F00] text-white hover:bg-[#8a4200]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#E76F00] bg-white px-4 py-3 text-sm text-[#8a4200]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                필드를 public으로 열면 아무나 불변식을 깨고, 내부 타입을 바꿀 때 외부 코드가 다 깨진다. 그래서 필드는 private으로 감추고 상태 변경은 내가 정한 public 메서드로만 연다.
                setter/메서드 안에서 유효성 검사를 걸면 객체가 스스로 불변식을 지킨다 — 검증은 호출부가 아니라 객체 안에 모은다.
                가장 강한 형태는 모든 필드 final + setter 없는 불변 객체이며, 가변 필드는 방어적 복사로 진짜 불변을 만든다.
                접근제어자는 private ⊂ default ⊂ protected ⊂ public — 가장 좁게 시작해 필요할 때만 넓힌다. 다음 장 III-1-1에서 컬렉션을 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['캡슐화', 'private', 'getter', 'setter', '불변식', '유효성검사', '불변객체', 'final', '방어적복사', 'default', 'protected', 'public'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-[#8a4200] border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#8a4200]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
