  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Java II-1-2 — 상속·다형성·오버라이딩 (6단계)
    extends 계층(Animal←Dog·Cat) · 생성자 super 순서 · 오버라이딩(@Override) vs 오버로딩 ·
    Animal a = new Dog() 동적 바인딩 · 캐스팅/instanceof/final · 실무 3대 함정.
    패턴: fastapi v1 — 좌(LiveDataPane) / 우(CodeViewer: java) · 색상: 오렌지 #E76F00 / 옅은파랑 #a7c7e7 / 오렌지다크 #8a4200
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 상속 → 생성자순서 → 오버라이딩 → 다형성(동적바인딩) → 캐스팅 → 실무함정
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang:"java", filename:"Animal.java / Dog.java — 상속 기본", lines:[
        "// 부모 클래스 — 공통 상태와 행동을 한 곳에 모은다",
        "class Animal {",
        "  protected String name;         // 자식이 접근하도록 protected",
        "  Animal(String name) { this.name = name; }",
        "",
        "  void eat()   { System.out.println(name + \" eats\"); }",
        "  void sound() { System.out.println(\"...\"); }        // 기본 소리",
        "}",
        "",
        "// 자식 클래스 — Animal의 name·eat()을 물려받는다",
        "class Dog extends Animal {",
        "  Dog(String name) { super(name); }   // 부모 생성자 호출",
        "  void fetch() { System.out.println(name + \" fetches\"); }",
        "}",
        "",
        "Dog d = new Dog(\"바둑이\");",
        "d.eat();     // => 바둑이 eats   (Animal에서 물려받음)",
        "d.fetch();   // => 바둑이 fetches (Dog가 추가한 기능)",
      ]},
      s2: {lang:"java", filename:"Constructor.java — super 호출 순서", lines:[
        "class Animal {",
        "  String name;",
        "  Animal(String name) {",
        "    System.out.println(\"Animal 생성자\");",
        "    this.name = name;",
        "  }",
        "}",
        "",
        "class Dog extends Animal {",
        "  Dog(String name) {",
        "    super(name);                    // 반드시 첫 줄 — 부모 먼저",
        "    System.out.println(\"Dog 생성자\");",
        "  }",
        "}",
        "",
        "new Dog(\"바둑이\");",
        "// => Animal 생성자   (부모가 먼저)",
        "// => Dog 생성자      (그 다음 자식)",
        "",
        "// super(name) 을 지우면? 컴파일러가 super() 를 넣으려는데",
        "// Animal 에 기본 생성자가 없어서 => 컴파일 에러",
      ]},
      s3: {lang:"java", filename:"Override.java — 재정의와 규칙", lines:[
        "class Animal {",
        "  void sound() { System.out.println(\"...\"); }",
        "}",
        "",
        "class Dog extends Animal {",
        "  @Override                          // 실수 방지용 — 꼭 붙이자",
        "  void sound() { System.out.println(\"멍멍\"); }  // 재정의",
        "}",
        "",
        "class Cat extends Animal {",
        "  @Override",
        "  public void sound() { System.out.println(\"야옹\"); } // 넓히기 OK",
        "}",
        "",
        "new Dog().sound();   // => 멍멍  (부모 것을 덮어씀)",
        "new Cat().sound();   // => 야옹",
        "",
        "// 오버로딩 — 재정의가 아니라 \"같은 이름 + 다른 매개변수\"",
        "class Printer {",
        "  void print(int n)    { }",
        "  void print(String s) { }   // 오버로딩 (상속과 무관)",
        "}",
      ]},
      s4: {lang:"java", filename:"Polymorphism.java — 동적 바인딩", lines:[
        "class Animal { void sound() { System.out.println(\"...\"); } }",
        "class Dog extends Animal { @Override void sound(){ System.out.println(\"멍멍\"); } }",
        "class Cat extends Animal { @Override void sound(){ System.out.println(\"야옹\"); } }",
        "class Cow extends Animal { @Override void sound(){ System.out.println(\"음메\"); } }",
        "",
        "// 선언 타입은 Animal, 실제 객체는 Dog",
        "Animal a = new Dog();",
        "a.sound();   // => 멍멍   (런타임에 실제 타입으로 결정 = 동적 바인딩)",
        "",
        "// 부모 타입 배열 하나로 여러 자식을 담는다",
        "Animal[] zoo = { new Dog(), new Cat(), new Cow() };",
        "for (Animal x : zoo) {",
        "  x.sound();",
        "}",

            fix:'if (x instanceof Dog d) 로 확인 후에만 자식 기능 사용.',
          },
        ],
        alert:{ tone:'danger', text:'핵심: 다형성은 "메서드"에만 적용된다. 필드는 정적 바인딩이라 선언 타입 기준으로 읽힌다. @Override 는 재정의 실수를, instanceof 는 캐스팅 폭탄을 막는 가드다. 다음 장 II-2-1 에서 추상 클래스와 인터페이스로 이어진다.' },
        code:{ ...CODE.s6, highlight:[17] },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 상속 계층 트리
    // ─────────────────────────────────────────────────────
    function InheritView({ tree }) {
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🌳 상속 계층 — 위에서 아래로 물려받는다</div>
            {/* Object */}
            <div className="flex justify-center">
              <span className="rounded border border-slate-300 bg-[#faf7ef] px-3 py-1.5 text-center">
                <span className="block text-[11px] font-mono font-bold text-slate-600">{tree.root.name}</span>
                <span className="block text-[9px] text-slate-500">{tree.root.sub}</span>
              </span>
            </div>
            <div className="text-center text-orange-500 text-sm">▼ extends (자동)</div>
            {/* Animal */}
            <div className="flex justify-center">
              <span className="rounded border-2 border-[#E76F00] bg-orange-100 px-4 py-2 text-center">
                <span className="block text-[12px] font-mono font-bold text-[#8a4200]">{tree.parent.name}</span>
                <span className="block text-[9px] text-[#8a4200]">{tree.parent.sub}</span>
              </span>
            </div>
            <div className="text-center text-orange-500 text-sm">▼ extends</div>
            {/* Dog / Cat */}
            <div className="grid grid-cols-2 gap-2">
              {tree.children.map((c, i) => (
                <div key={i} className="rounded border-2 border-[#a7c7e7] bg-[#eaf2fb] px-2 py-2 text-center">
                  <span className="block text-[12px] font-mono font-bold text-[#8a4200]">{c.name}</span>
                  <span className="block text-[9px] text-slate-600">{c.sub}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500 text-center">"Dog is a Animal" — 자식은 부모의 필드·메서드를 물려받고 자기 것을 더한다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 생성자 호출 순서 체인
    // ─────────────────────────────────────────────────────
    function CtorView({ ctor, trap }) {
      const TONE = {
        root: 'border-slate-300 bg-[#faf7ef] text-slate-600',
        parent: 'border-[#E76F00] bg-orange-100 text-[#8a4200]',
        child: 'border-[#a7c7e7] bg-[#eaf2fb] text-[#8a4200]',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">⛓️ 호출 순서 — 부모가 항상 먼저</div>
            <div className="flex justify-center mb-2">
              <span className="rounded border-2 border-[#E76F00] bg-orange-100 px-3 py-1.5 font-mono text-[11px] font-bold text-[#8a4200]">{ctor.call}</span>
            </div>
            <div className="space-y-1.5">
              {ctor.chain.map((c, i) => (
                <div key={i}>
                  <div className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 ${TONE[c.tone]}`}>
                    <span className="w-6 h-6 rounded-full bg-white border border-current flex items-center justify-center text-[11px] font-bold">{c.order}</span>
                    <span className="text-[11px] font-mono font-bold w-28">{c.who}</span>
                    <span className="text-[10px] flex-1">{c.desc}</span>
                  </div>
                  {i < ctor.chain.length - 1 && <div className="text-center text-orange-500 text-xs leading-none">▼</div>}
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500 text-center">부모 부분이 완전히 초기화된 뒤에야 자식 본문이 실행된다.</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1">⚠️ {trap.title}</div>
            <div className="text-[10px] text-slate-700">{trap.text}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 오버라이딩 규칙 + vs 오버로딩
    // ─────────────────────────────────────────────────────
    function OverrideView({ override }) {
      const DTONE = {
        over: 'border-[#E76F00] bg-orange-100',
        load: 'border-[#a7c7e7] bg-[#eaf2fb]',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">✏️ 오버라이딩 규칙 (어기면 재정의 실패)</div>
            <div className="space-y-1.5">
              {override.rules.map((r, i) => (
                <div key={i} className="rounded border border-emerald-300 bg-emerald-50 px-2 py-1.5 flex items-center gap-2">
                  <span className="text-emerald-700 text-[11px] font-bold">✓</span>
                  <span className="text-[11px] font-bold text-[#8a4200] w-28">{r.rule}</span>
                  <span className="text-[10px] text-slate-700 flex-1">{r.ok}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🔀 {override.diff.title}</div>
            <div className="grid grid-cols-2 gap-2">
              {override.diff.rows.map((r, i) => (
                <div key={i} className={`rounded border-2 p-2 ${DTONE[r.tone]}`}>
                  <div className="text-[12px] font-bold text-[#8a4200] mb-1">{r.key}</div>
                  <div className="text-[9px] text-slate-600">위치: <span className="font-mono">{r.where}</span></div>
                  <div className="text-[9px] text-slate-600">시그니처: {r.sig}</div>
                  <div className="text-[9px] text-slate-600">결정: <span className="font-bold text-[#8a4200]">{r.when}</span></div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 다형성 · 동적 바인딩
    // ─────────────────────────────────────────────────────
    function PolyView({ poly }) {
      const b = poly.binding;
      const a = poly.array;
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-400 bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-2">🔀 동적 바인딩 — 선언 타입 vs 실제 객체</div>
            <div className="flex items-center justify-center gap-2 mb-2">
              <span className="rounded border border-slate-300 bg-[#faf7ef] px-2.5 py-1.5 text-center">
                <span className="block text-[9px] text-slate-500">선언 타입</span>
                <span className="block text-[12px] font-mono font-bold text-slate-600">{b.declared}</span>
              </span>
              <span className="text-orange-500 text-[11px] font-bold">a =</span>
              <span className="rounded border-2 border-[#E76F00] bg-orange-100 px-2.5 py-1.5 text-center">
                <span className="block text-[9px] text-[#8a4200]">실제 객체</span>
                <span className="block text-[12px] font-mono font-bold text-[#8a4200]">{b.actual}</span>
              </span>
            </div>
            <div className="text-center text-[10px] font-mono text-slate-600 mb-2">{b.expr}</div>
            <div className="rounded border border-[#a7c7e7] bg-[#eaf2fb] px-2 py-1.5 text-[10px] text-slate-700 mb-1">🔎 컴파일 시: {b.compileCheck}</div>
            <div className="rounded border-2 border-[#E76F00] bg-orange-100 px-2 py-1.5 text-[10px] font-bold text-[#8a4200]">⚡ 런타임: {b.runtimeCall}</div>
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-white p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1">📦 {a.title}</div>
            <div className="text-[9px] font-mono text-slate-600 bg-[#eaf2fb] rounded px-2 py-1 border border-[#a7c7e7] mb-2 overflow-auto whitespace-pre">{a.decl}</div>
            <div className="space-y-1">
              {a.items.map((it, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-[10px] font-mono font-bold text-[#8a4200] w-14 rounded border border-[#a7c7e7] bg-[#eaf2fb] px-1.5 py-0.5 text-center">{it.holds}</span>
                  <span className="text-orange-500 text-[11px] font-bold">.sound() ▶</span>
                  <span className="text-[10px] font-mono rounded bg-emerald-50 border border-emerald-300 text-emerald-800 px-2 py-0.5">{it.out}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] font-mono text-slate-600 bg-[#faf7ef] rounded px-2 py-1 border border-slate-200 overflow-auto whitespace-pre">{a.loop}</div>
            <div className="mt-1 text-[9px] text-slate-500 text-center">코드는 한 줄, 결과는 객체마다 다르다 — 이것이 다형성.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 캐스팅 · instanceof · final
    // ─────────────────────────────────────────────────────
    function CastView({ cast }) {
      const box = (b, key) => {
        const TONE = { good: 'border-emerald-300 bg-emerald-50', bad: 'border-red-300 bg-red-50' };
        return (
          <div key={key} className={`rounded border-2 p-2 ${TONE[b.tone]}`}>
            <div className="text-[11px] font-bold text-[#8a4200] mb-1">{b.title}</div>
            <div className="text-[10px] font-mono text-slate-700 bg-white rounded px-2 py-1 border border-slate-200 overflow-auto whitespace-pre">{b.code}</div>
            <div className="text-[9px] text-slate-600 mt-1">{b.note}</div>
          </div>
        );
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-orange-300 bg-white p-3 space-y-2">
            {box(cast.up, 'up')}
            {box(cast.down, 'down')}
            {box(cast.guard, 'guard')}
          </div>
          <div className="rounded-lg border-2 border-[#a7c7e7] bg-[#eaf2fb] p-3">
            <div className="text-[11px] font-bold text-[#8a4200] mb-1.5">🔒 final — 확장을 막는 잠금</div>
            <div className="space-y-1">
              {cast.finals.map((f, i) => (
                <div key={i} className="rounded border border-slate-300 bg-white px-2 py-1.5 flex items-center gap-2">
                  <span className="text-[10px] font-mono font-bold text-[#8a4200] w-28">{f.kw}</span>
                  <span className="text-[10px] text-slate-700 flex-1">{f.effect}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실무 3대 함정
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.map((p, i) => (
            <div key={i} className="rounded-lg border-2 border-red-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-red-800 mb-1.5 flex items-center gap-1.5">
                <span className="w-5 h-5 rounded-full bg-red-100 border border-red-300 flex items-center justify-center text-[11px]">{p.no}</span>
                <span>{p.title}</span>
              </div>
              <div className="text-[10px] font-mono text-red-900 bg-red-50 rounded px-2 py-1 border border-red-200 overflow-auto whitespace-pre">{p.bad}</div>
              <div className="text-[9px] text-slate-600 mt-1">🔍 {p.why}</div>
              <div className="text-[9px] text-emerald-800 mt-1 rounded bg-emerald-50 border border-emerald-200 px-2 py-1">✅ {p.fix}</div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#eaf2fb]', border: 'border-[#a7c7e7]', text: 'text-[#8a4200]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-emerald-50', border: 'border-emerald-300', text: 'text-emerald-900', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Java 오렌지 톤)
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      inherit:  { icon: '🌳', label: '상속 계층 (extends)' },
      ctor:     { icon: '⛓️', label: '생성자 호출 순서' },
      override: { icon: '✏️', label: '오버라이딩 규칙' },
      poly:     { icon: '🔀', label: '다형성 · 동적 바인딩' },
      cast:     { icon: '⬆️', label: '캐스팅 · final' },
      pitfall:  { icon: '🚨', label: '실무 3대 함정' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.inherit;
      return (
        <div className="rounded-xl border border-orange-300 bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#8a4200] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>상속·다형성 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#8a4200] font-mono mb-3 px-2 py-1 rounded bg-[#eaf2fb] border border-[#a7c7e7]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'inherit' && <InheritView tree={state.tree} />}
          {state.stage === 'ctor' && <CtorView ctor={state.ctor} trap={state.trap} />}
          {state.stage === 'override' && <OverrideView override={state.override} />}
          {state.stage === 'poly' && <PolyView poly={state.poly} />}
          {state.stage === 'cast' && <CastView cast={state.cast} />}
          {state.stage === 'pitfall' && <PitfallView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-orange-400/15 border-l-2 border-[#E76F00] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      const isLast = stepIdx === STEPS.length - 1;

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#E76F00] text-white font-bold text-xs">Ⅱ. 객체지향 핵심</span>
              <div>
                <h1 className="text-2xl font-bold text-[#8a4200]"><span className="font-mono text-lg mr-1">II-1-2</span> 상속·다형성·오버라이딩</h1>
                <p className="text-sm text-[#8a4200]/80">extends로 계층 만들기, 오버라이딩과 동적 바인딩이 만드는 다형성</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#8a4200] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#E76F00]' : 'bg-orange-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#8a4200] text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#8a4200] text-white' : 'bg-[#E76F00] text-white hover:bg-[#8a4200]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-orange-400 bg-white text-[#8a4200] hover:bg-orange-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#8a4200]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#E76F00] bg-white px-4 py-3 text-sm text-[#8a4200]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                상속(extends)은 부모의 필드·메서드를 물려받아 계층을 만들고(단일상속, 최상위 Object), 생성자는 항상 부모(super)가 먼저 실행된다.
                오버라이딩은 부모 메서드를 같은 시그니처로 재정의하는 것(@Override로 실수 방지), 오버로딩은 같은 클래스의 동명·다른 매개변수 메서드로 전혀 다른 개념이다.
                다형성은 부모 타입 참조(Animal a = new Dog())가 런타임에 실제 객체의 메서드를 부르는 동적 바인딩으로 성립하며, Animal[] 하나로 여러 자식을 다루고 확장에 유연하다(OCP).
                단, 다형성은 "메서드"에만 적용된다 — 필드는 정적 바인딩이라 선언 타입 기준으로 읽히고, 확인 없는 다운캐스팅은 ClassCastException을 낸다(instanceof로 가드). 다음 장 II-2-1에서 추상 클래스와 인터페이스로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['extends', 'super', '단일상속', 'Object', '@Override', '오버라이딩', '오버로딩', '다형성', '동적바인딩', '업캐스팅', '다운캐스팅', 'instanceof', 'final', 'OCP', 'ClassCastException'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-[#8a4200] border border-orange-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#8a4200]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
