        alert: { tone: 'good', text: 'scripts 로 명령을 표준화하면 신입도 README 없이 npm run 만으로 프로젝트를 돌린다. 일회성 도구는 글로벌 설치 대신 npx 로 — 시스템을 더럽히지 않고, 항상 최신을 쓰며, 재현성도 지킨다.' },
        code: {

      {

        desc: '마지막으로 실무에서 반복되는 함정을 정리한다. 첫째, package-lock.json 을 커밋하지 않으면 팀원·CI 가 제각기 다른 버전을 받아 "내 컴퓨터에선 됐는데" 사고가 난다 — lock 은 무조건 커밋한다. 둘째, dependencies 와 devDependencies 를 헷갈려 테스트 도구를 dependencies 에 넣으면 배포 이미지가 비대해지고, 반대로 런타임에 쓰는 라이브러리를 devDependencies 에 넣으면 프로덕션에서 모듈을 못 찾아 죽는다. 셋째, 프로젝트 도구를 -g 로 전역 설치하면 사람마다 버전이 달라 재현이 깨진다 — devDependencies + npx 로 둔다. 넷째, semver 범위를 무심코 넓게 열어 두면 예기치 않은 MINOR 업데이트가 딸려 와 깨질 수 있다 — 범위는 열되 lock 으로 고정하고 CI 테스트로 검증한다. 이 넷만 지켜도 대부분의 "의존성 지옥"을 피한다.',
        actor: '🧭 4대 함정 — lock·dep구분·글로벌·범위',
        stage: 'pitfall',

        pitfall: {

            { bad: '런타임 라이브러리를 devDependencies 에', good: 'import 하는 것은 dependencies 에', tone: 'bad' },
            { bad: '프로젝트 도구를 -g 로 전역 설치', good: 'devDependencies + npx 로 재현성 유지', tone: 'bad' },
            { bad: '버전 범위를 무심코 넓게', good: '범위는 열되 lock 고정 + CI 테스트', tone: 'bad' },
          ],
        },
        alert: { tone: 'good', text: 'lock 커밋 · dep/devDep 구분 · 글로벌 자제 · 범위+lock 이중 안전벨트 — 이 넷이 재현 가능한 설치의 기본기다. 다음 장 I-2-2 에서 모듈 해석과 node_modules 탐색 규칙을 더 파고든다.' },
        code: {
          lang: 'bash',
          filename: 'terminal — 안전한 의존성 습관',

            'git add package.json package-lock.json',

            'npm install -D eslint vitest',
            '',

            'npm ci --omit=dev',
            '',
            '# 4) 취약점·구버전 주기 점검',
            'npm audit --production',
            'npm outdated',
            '',
            '# => 재현 가능한 설치 = lock 커밋 + npm ci + dep 구분',
          ],
          highlight: [1, 2, 4, 5, 7, 8],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — package.json 필드 구조
    // ─────────────────────────────────────────────────────
    function ManifestView({ manifest }) {
      const TONE = {
        point: 'border-[#339933] bg-[#c8e6c9]',
        good: 'border-[#81c784] bg-[#e8f5e9]',
        mid: 'border-[#81c784] bg-white',
      };
      return (
        <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
          <div className="text-[11px] font-bold text-[#1b5e20] mb-2">📄 package.json — 핵심 필드</div>
          <div className="space-y-1.5">
            {manifest.fields.map((f, i) => (
              <div key={i} className={`rounded border-2 px-2 py-1.5 ${TONE[f.tone]}`}>
                <div className="flex items-center gap-2">
                  <span className="text-[11px] font-mono font-bold text-[#1b5e20] w-32">{f.key}</span>
                  <span className="text-[10px] font-mono text-slate-500">{f.val}</span>
                </div>
                <div className="text-[9px] text-slate-700 mt-0.5">{f.role}</div>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[9px] text-slate-500">이 파일 하나를 공유하면 npm install 로 프로젝트가 재구성된다.</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — npm install → node_modules 트리 (애니메이션)
    // ─────────────────────────────────────────────────────
    function InstallView({ install, tick }) {
      const TONE = {
        point: 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]',
        mid: 'border-[#81c784] bg-white text-slate-600',
        dev: 'border-amber-300 bg-amber-50 text-amber-800',
      };
      const shown = (tick % (install.tree.length + 1)); // 하나씩 전개
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">📦 npm install → node_modules 전개</div>
            <div className="flex items-center gap-2 mb-2">
              <span className="text-[10px] font-mono px-2 py-1 rounded bg-[#1b5e20] text-[#c8e6c9]">$ npm i {install.root}</span>
              <span className="text-[9px] text-slate-500">↓</span>
            </div>
            <div className="rounded border border-[#81c784] bg-[#faf7ef] p-2">
              <div className="text-[10px] font-mono font-bold text-[#1b5e20] mb-1">📁 node_modules/</div>
              <div className="space-y-1 pl-3">
                {install.tree.map((n, i) => (
                  <div
                    key={i}
                    className={`rounded border px-2 py-1 flex items-center gap-2 transition
                      ${i < shown ? TONE[n.tone] : 'border-dashed border-slate-300 bg-white text-slate-300'}`}
                  >
                    <span className="text-[10px] font-mono font-bold w-28">{i < shown ? '📄 ' + n.name : '· ' + n.name}</span>
                    <span className="text-[9px] flex-1">{n.dep}</span>
                    {i < shown && <span className="text-[9px]">✓</span>}
                  </div>
                ))}
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500">{install.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — lock 파일 박제 + npm install vs npm ci
    // ─────────────────────────────────────────────────────
    function LockView({ lock }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🔒 범위 선언 → 정확 버전 박제</div>
            <div className="space-y-1.5">
              <div className="rounded border border-[#81c784] bg-[#e8f5e9] px-2 py-1.5">
                <div className="text-[9px] text-slate-500">package.json (범위)</div>
                <div className="text-[11px] font-mono font-bold text-[#1b5e20]">{lock.declared}</div>
              </div>
              <div className="text-center text-[11px] text-[#339933]">⬇ npm install 이 확정</div>
              <div className="rounded border-2 border-[#339933] bg-[#c8e6c9] px-2 py-1.5">
                <div className="text-[9px] text-[#1b5e20]">package-lock.json (박제)</div>
                <div className="text-[11px] font-mono font-bold text-[#1b5e20]">{lock.resolved}</div>
                <div className="text-[9px] font-mono text-slate-600 mt-0.5">{lock.integrity}</div>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">⚖️ npm install vs npm ci</div>
            <div className="space-y-1.5">
              {lock.compare.map((c, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 ${c.tone === 'point' ? 'border-[#339933] bg-[#c8e6c9]' : 'border-[#81c784] bg-white'}`}>
                  <div className="text-[11px] font-mono font-bold text-[#1b5e20]">{c.cmd}</div>
                  <div className="text-[9px] text-slate-600">기준: {c.use}</div>
                  <div className="text-[9px] text-slate-700">{c.effect}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — semver 범위 해석 표 (후보 버전 × 범위, 애니메이션 강조)
    // ─────────────────────────────────────────────────────
    function SemverView({ semver, tick }) {
      const colActive = tick % semver.candidates.length; // 후보 버전을 순회 강조
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1">🔢 기준 {semver.base} — 범위별 허용 버전</div>
            <div className="text-[9px] text-slate-500 mb-2">MAJOR.MINOR.PATCH · ✓ 허용 / ✕ 제외</div>
            <div className="overflow-x-auto">
              <table className="w-full text-[10px]">
                <thead>
                  <tr className="text-[9px] text-slate-500">
                    <td className="pb-1 pr-2 font-bold">범위</td>
                    {semver.candidates.map((c, i) => (
                      <td key={i} className={`pb-1 px-1 text-center font-mono ${i === colActive ? 'text-[#1b5e20] font-bold' : ''}`}>{c}</td>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {semver.ranges.map((r, ri) => (
                    <tr key={ri} className="border-t border-[#81c784]/50">
                      <td className="py-1.5 pr-2">
                        <div className="font-mono font-bold text-[#1b5e20]">{r.spec}</div>
                        <div className="text-[8px] text-slate-500">{r.name}</div>
                      </td>
                      {r.allow.map((ok, ci) => (
                        <td key={ci} className={`py-1.5 px-1 text-center ${ci === colActive ? 'bg-[#c8e6c9]/60 rounded' : ''}`}>
                          <span className={ok ? 'text-[#339933] font-bold' : 'text-red-400'}>{ok ? '✓' : '✕'}</span>
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-2.5 space-y-1">
            {semver.ranges.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-[10px]">
                <span className="font-mono font-bold text-[#1b5e20] w-24">{r.spec}</span>
                <span className="text-slate-700">{r.lo} · {r.hi}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — scripts 매핑 + npx
    // ─────────────────────────────────────────────────────
    function ScriptsView({ scripts }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">⚙️ npm run — 명령 단축키</div>
            <div className="space-y-1.5">
              {scripts.rows.map((r, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 ${r.tone === 'point' ? 'border-[#339933] bg-[#c8e6c9]' : 'border-[#81c784] bg-[#e8f5e9]'}`}>
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-mono font-bold text-[#1b5e20] w-28">{r.call}</span>
                    <span className="text-[9px] text-slate-500">→</span>
                    <span className="text-[10px] font-mono text-slate-700 flex-1">{r.maps}</span>
                  </div>
                  <div className="text-[9px] text-slate-500 mt-0.5">{r.note}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#1b5e20] p-3">
            <div className="text-[11px] font-bold text-[#c8e6c9] mb-1.5">📦 npx — 설치 없이 즉석 1회 실행</div>
            <div className="space-y-1">
              {scripts.npx.map((n, i) => (
                <div key={i}>
                  <div className="text-[11px] font-mono text-[#c8e6c9]">$ {n.cmd}</div>
                  <div className="text-[9px] text-[#c8e6c9]/70 pl-3">{n.note}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 실무 함정 체크리스트 (나쁜 습관 → 좋은 습관)
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfall }) {
      return (
        <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
          <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🧭 4대 함정 → 안전한 습관</div>
          <div className="space-y-1.5">
            {pitfall.rows.map((r, i) => (
              <div key={i} className="rounded border border-[#81c784] overflow-hidden">
                <div className="flex items-center gap-2 px-2 py-1 bg-red-50 border-b border-red-200">
                  <span className="text-[10px]">⛔</span>
                  <span className="text-[10px] text-red-700 flex-1">{r.bad}</span>
                </div>
                <div className="flex items-center gap-2 px-2 py-1 bg-[#c8e6c9]">
                  <span className="text-[10px]">✅</span>
                  <span className="text-[10px] text-[#1b5e20] flex-1">{r.good}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#e8f5e9]', border: 'border-[#81c784]', text: 'text-[#1b5e20]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-[#c8e6c9]', border: 'border-[#339933]', text: 'text-[#1b5e20]', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Node 그린 톤)
    //   install/semver 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      manifest: { icon: '📄', label: 'package.json' },
      install:  { icon: '📦', label: 'npm install' },
      lock:     { icon: '🔒', label: 'lock · npm ci' },
      semver:   { icon: '🔢', label: 'semver 범위' },
      scripts:  { icon: '⚙️', label: 'scripts · npx' },
      pitfall:  { icon: '🧭', label: '실무 함정' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.manifest;
      const [tick, setTick] = useState(0);

      useEffect(() => {
        const animated = state.stage === 'install' || state.stage === 'semver';
        setTick(0);
        if (!animated) return;
        const id = setInterval(() => setTick((t) => t + 1), 900);
        return () => clearInterval(id);
      }, [state.stage]);

      return (
        <div className="rounded-xl border border-[#339933] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1b5e20] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>npm 의존성 관리 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#1b5e20] font-mono mb-3 px-2 py-1 rounded bg-[#e8f5e9] border border-[#81c784]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'manifest' && <ManifestView manifest={state.manifest} />}
          {state.stage === 'install' && <InstallView install={state.install} tick={tick} />}
          {state.stage === 'lock' && <LockView lock={state.lock} />}
          {state.stage === 'semver' && <SemverView semver={state.semver} tick={tick} />}
          {state.stage === 'scripts' && <ScriptsView scripts={state.scripts} />}
          {state.stage === 'pitfall' && <PitfallView pitfall={state.pitfall} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-[#339933]/20 border-l-2 border-[#339933] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#339933] text-white font-bold text-xs">Ⅰ. 런타임 기초</span>
              <div>
                <h1 className="text-2xl font-bold text-[#1b5e20]"><span className="font-mono text-lg mr-1">I-2-1</span> npm과 package.json — 의존성·스크립트·버전</h1>
                <p className="text-sm text-[#1b5e20]/80">패키지 관리의 핵심, node_modules·semver·lock 파일</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#1b5e20] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#339933]' : 'bg-green-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#1b5e20] text-green-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-green-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#1b5e20] text-white' : 'bg-[#339933] text-white hover:bg-[#1b5e20]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#1b5e20]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#339933] bg-white px-4 py-3 text-sm text-[#1b5e20]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                package.json 은 프로젝트 명세서다 — name·version·main·type·scripts·dependencies·devDependencies 를 담는다.
                npm install 이 이 선언을 node_modules 트리로 펼치고, package-lock.json 이 정확 버전을 박제해 재현 가능한 설치를 보장한다(CI 는 npm ci).
                semver 범위는 ^(MINOR까지)·~(PATCH까지)·고정으로 갈리며, 범위는 열되 lock 으로 실제 버전을 고정한다.
                scripts 로 명령을 표준화하고 npx 로 일회성 도구를 실행한다. lock 커밋·dep 구분·글로벌 자제·범위+lock 이 재현성의 기본기다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['npm', 'package.json', 'node_modules', 'dependencies', 'devDependencies', 'package-lock', 'npm ci', 'semver', '캐럿^', '틸드~', 'scripts', 'npx', 'npm run', '재현가능한설치'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-green-100 text-[#1b5e20] border border-green-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1b5e20]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
