  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->

  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <!--
    Node.js I-2-1 — npm과 package.json: 의존성·스크립트·버전
    학습 목표: package.json이 프로젝트의 명세서라는 것을 이해하고,
              의존성 선언(dependencies/devDependencies) → npm install → node_modules 트리 →
              package-lock.json 고정(재현 가능한 설치·npm ci)까지의 흐름과,
              semver 범위(^ ~ 정확버전)가 실제 어떤 버전으로 해석되는지,
              scripts·npx의 쓰임과 실무 함정(lock 커밋·dep vs devDep·글로벌 남용)을 6단계로 뜯어본다.
    패턴: fastapi v1 — 좌(LiveDataPane: 의존성 선언 → 설치 → node_modules 트리 → lock 고정 → semver 해석)
                       우(VSCode CodeViewer: package.json(json) · 명령(bash))
    색상: Node 그린 #339933 기조 / 형광펜·배경 채움 연한 그린 #c8e6c9 / 텍스트·링크·배지 다크 그린 #1b5e20
  -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — package.json 구조 → 설치 → lock/ci → semver → scripts/npx → 함정
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(manifest/install/lock/semver/scripts/pitfall)에 따라
    //   서로 다른 시각화를 그린다. install/semver 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      manifest: {lang:"json", filename:"package.json — npm init -y 후 손질", lines:[
        "{",
        "  \"name\": \"my-app\",",
        "  \"version\": \"1.0.0\",",
        "  \"main\": \"index.js\",",
        "  \"type\": \"module\",",
        "  \"scripts\": {",
        "    \"start\": \"node index.js\",",
        "    \"test\": \"vitest\"",
        "  },",
        "  \"dependencies\": {",
        "    \"express\": \"^4.19.2\"",
        "  },",
        "  \"devDependencies\": {",
        "    \"vitest\": \"^1.6.0\"",
        "  }",
        "}",
      ]},
      install: {lang:"bash", filename:"terminal — 의존성 설치", lines:[
        "# 실행 의존성 → dependencies 에 기록",
        "npm install express",
        "# => node_modules/express 생성 + package.json 갱신",
        "",
        "# 개발 전용 → devDependencies 에 기록 (-D 는 --save-dev)",
        "npm install -D vitest eslint",
        "",
        "# package.json 의 모든 의존성을 한 번에 설치",
        "npm install",
        "",
        "# 배포용: 개발 의존성 제외 → 이미지 용량 절감",
        "npm install --omit=dev",
        "",
        "# 전역 설치 (CLI 편의용 · 재현성 저하 주의)",

    const S1 = { title: "Step 1. package.json — 프로젝트의 명세서, npm init로 시작한다", desc: "Node 프로젝트의 심장은 package.json 한 파일이다. 이 파일은 \"이 프로젝트가 무엇이고, 어떤 라이브러리에 의존하며, 어떤 명령으로 돌아가는지\"를 적어 둔 명세서다. 빈 폴더에서 npm init -y를 치면 기본 골격이 생기고, 여기에 name(패키지 이름)·version(내 버전, semver 형식)·main(진입 파일)·type(module이면 ESM, 없거나 commonjs면 CommonJS)·scripts(명령 단축키)·dependencies(실행에 필요한 라이브러리)·devDependencies(개발·빌드·테스트에만 필요한 라이브러리) 필드가 채워진다. 이 파일 하나만 공유하면 누구든 npm install로 똑같은 프로젝트를 재구성할 수 있다는 것이 핵심이다." };
    const S2 = { title: "Step 2. npm install — 선언을 node_modules 트리로 펼친다 (-D, -g)", desc: "package.json에 의존성을 적는 것만으로는 아무 코드도 받아지지 않는다. npm install(줄여서 npm i)을 실행해야 npm 레지스트리에서 실제 파일을 내려받아 node_modules 폴더 안에 펼친다. npm install express는 express를 dependencies에, npm install -D vitest는 devDependencies에 기록한다. 여기서 둘의 구분이 중요하다 — 서버가 런타임에 실제로 import 하는 것은 dependencies(예: express), 빌드·테스트·린트처럼 개발할 때만 쓰는 것은 devDependencies(예: vitest·eslint)다. 배포 이미지에서 npm install --omit=dev로 devDependencies를 빼면 용량이 줄어든다. 한편 npm install -g는 시스템 전역에 설치해 CLI 명령을 어디서나 부를 수 있게 하지만, 프로젝트 재현성을 해치므로 남용은 금물이다." };
    const S3 = { title: "Step 3. package-lock.json과 npm ci — 재현 가능한 설치", desc: "package.json의 \"^4.19.2\" 는 정확한 버전이 아니라 범위다. 그래서 오늘 npm install 한 사람과 한 달 뒤 설치한 사람이 서로 다른 패치 버전을 받을 수 있고, 이것이 \"내 컴퓨터에선 됐는데\" 사고의 흔한 원인이다. package-lock.json은 이 문제를 없앤다 — 설치 시점에 실제로 확정된 모든 패키지의 정확한 버전과 무결성 해시를 통째로 박제한다. 그래서 lock 파일은 반드시 git에 커밋해야 한다. CI·배포 환경에서는 npm install 대신 npm ci를 쓴다. npm ci는 lock 파일을 유일한 기준으로 삼아 node_modules를 깨끗이 지우고 lock 그대로 재현하며, package.json과 lock이 어긋나면 그냥 실패시킨다 — 그래서 빠르고 결정적(deterministic)이다." };
    const S4 = { title: "Step 4. semver — ^, ~, 정확 버전이 실제로 뜻하는 것", desc: "버전은 MAJOR.MINOR.PATCH 세 칸(semver, 예: 4.19.2)으로 읽는다 — PATCH는 버그 수정, MINOR는 호환되는 기능 추가, MAJOR는 호환이 깨지는 변경이다. package.json의 범위 기호가 무엇을 허용하는지 정확히 알아야 한다. \"^4.19.2\"(캐럿)는 MAJOR를 고정하고 그 아래(MINOR·PATCH)는 올라가도 허용한다 — 4.19.2 이상 5.0.0 미만. \"~4.19.2\"(틸드)는 더 보수적으로 PATCH만 허용한다 — 4.19.2 이상 4.20.0 미만. 기호 없는 \"4.19.2\" 는 정확히 그 버전만 쓴다. npm 기본값은 캐럿(^)이라 대부분 MINOR 업까지 자동으로 딸려 온다. 이 규칙을 모르면 \"코드 한 줄 안 바꿨는데 배포가 깨졌다\" 같은 사고가 난다 — 그래서 범위를 열어 두되(협업 편의) lock 파일로 실제 버전을 고정(재현)하는 두 층이 함께 간다." };
    const S5 = { title: "Step 5. scripts와 npx — 명령을 표준화하고 도구를 즉석 실행", desc: "package.json의 scripts는 팀의 공통 명령 사전이다. \"start\": \"node index.js\" 를 적어 두면 누구나 긴 명령을 외울 필요 없이 npm start로 실행한다. start·test는 특별 취급이라 npm start / npm test로 바로 부르고, 그 외 커스텀 스크립트(예: dev·build·lint)는 npm run dev처럼 run을 붙인다. 스크립트 안에서는 node_modules/.bin에 깔린 도구를 이름만으로 부를 수 있어, 전역 설치 없이도 vitest·eslint 같은 로컬 도구가 그대로 돌아간다. npx는 그 사촌이다 — 설치돼 있지 않은 패키지도 npx create-react-app my-app처럼 즉석에서 내려받아 한 번 실행하고 버린다. 덕분에 일회성 도구(스캐폴딩·마이그레이션)를 글로벌로 더럽히지 않고 쓸 수 있다." };
    const S6 = { title: "Step 6. 실무 함정 — lock 커밋·dep 구분·글로벌 남용·버전 범위", desc: "마지막으로 실무에서 반복되는 함정을 정리한다. 첫째, package-lock.json을 커밋하지 않으면 팀원·CI가 제각기 다른 버전을 받아 \"내 컴퓨터에선 됐는데\" 사고가 난다 — lock은 무조건 커밋한다. 둘째, dependencies와 devDependencies를 헷갈려 테스트 도구를 dependencies에 넣으면 배포 이미지가 비대해지고, 반대로 런타임에 쓰는 라이브러리를 devDependencies에 넣으면 프로덕션에서 모듈을 못 찾아 죽는다. 셋째, 프로젝트 도구를 -g로 전역 설치하면 사람마다 버전이 달라 재현이 깨진다 — devDependencies + npx로 둔다. 넷째, semver 범위를 무심코 넓게 열어 두면 예기치 않은 MINOR 업데이트가 딸려 와 깨질 수 있다 — 범위는 열되 lock으로 고정하고 CI 테스트로 검증한다. 이 넷만 지켜도 대부분의 \"의존성 지옥\"을 피한다." };

    // 그림·코드 아래 "표·정리 보기" (옛 왼쪽 패널의 표·목록, 훅 없음)
    function RefPanel({ step }) {
      const st = step.stage;
      if (st === 'manifest') return (
        <div>
          <h4>package.json 필드</h4>
          <table><thead><tr><th>필드</th><th>값</th><th>뜻</th></tr></thead><tbody>
            {step.manifest.fields.map((f) => <tr key={f.key}><td><code>{f.key}</code></td><td><code>{f.val}</code></td><td>{f.role}</td></tr>)}
          </tbody></table>
          <p className="mt-2">npm 11 의 npm init -y 는 "type": "commonjs" 를 기본으로 넣는다. ESM 으로 쓰려면 "module" 로 바꾼다.</p>
        </div>
      );
      if (st === 'install') return (
        <div>
          <h4>어디에 적히나</h4>
          <table><thead><tr><th>명령</th><th>기록되는 곳</th><th>언제 쓰나</th></tr></thead><tbody>
            <tr><td><code>npm install express</code></td><td>dependencies</td><td>런타임에 import 한다</td></tr>
            <tr><td><code>npm install -D vitest eslint</code></td><td>devDependencies</td><td>개발 · 테스트 때만</td></tr>
            <tr><td><code>npm install --omit=dev</code></td><td>(기록 없음)</td><td>배포 설치 — 개발 의존성 제외</td></tr>
            <tr><td><code>npm install -g http-server</code></td><td>(프로젝트 밖)</td><td>개인 CLI 편의용 — 재현성 없음</td></tr>
          </tbody></table>
          <p className="mt-2">express 4.19.2 를 빈 프로젝트에 설치하면 package-lock.json 의 패키지가 모두 68개다 (express 포함, npm 11.9.0).</p>
        </div>
      );
      if (st === 'lock') return (
        <div>
          <h4>npm install vs npm ci</h4>
          <table><thead><tr><th>명령</th><th>기준</th><th>결과</th></tr></thead><tbody>
            <tr><td><code>npm install</code></td><td>package.json 범위</td><td>lock 이 없으면 새로 해석 → 기계마다 다를 수 있다</td></tr>
            <tr><td><code>npm ci</code></td><td>lock 파일</td><td>node_modules 를 지우고 lock 그대로 재현</td></tr>
          </tbody></table>
        </div>
      );
      if (st === 'semver') return (
        <div>
          <h4>범위 기호가 허용하는 버전 (express, 2026-11 레지스트리)</h4>
          <table><thead><tr><th>선언</th><th>뜻</th><th>4.19.2</th><th>4.20.0</th><th>4.21.2</th><th>4.22.3</th><th>5.0.0</th><th>5.3.0</th></tr></thead><tbody>
            <tr><td><code>^4.19.2</code></td><td>4.19.2 이상 5.0.0 미만</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td><td>✗</td><td>✗</td></tr>
            <tr><td><code>~4.19.2</code></td><td>4.19.2 이상 4.20.0 미만</td><td>✓</td><td>✗</td><td>✗</td><td>✗</td><td>✗</td><td>✗</td></tr>
            <tr><td><code>4.19.2</code></td><td>정확히 그 버전</td><td>✓</td><td>✗</td><td>✗</td><td>✗</td><td>✗</td><td>✗</td></tr>
          </tbody></table>
          <p className="mt-2">실행 결과: npm update → 4.22.3, npm outdated → Current 4.19.2 · Wanted 4.22.3 · Latest 5.3.0, npm audit → 4.19.2 트리 7건(low 3 · moderate 1 · high 3), 4.22.3 트리 0건. 레지스트리 상태에 따라 달라진다.</p>
        </div>
      );
      if (st === 'scripts') return (
        <div>
          <h4>호출 규칙</h4>
          <table><thead><tr><th>호출</th><th>실행되는 것</th><th>메모</th></tr></thead><tbody>
            {step.scripts.rows.map((r) => <tr key={r.call}><td><code>{r.call}</code></td><td><code>{r.maps}</code></td><td>{r.note}</td></tr>)}
          </tbody></table>
          <h4>npx</h4>
          <ul>{step.scripts.npx.map((r) => <li key={r.cmd}><code>{r.cmd}</code> — {r.note}</li>)}</ul>
        </div>
      );
      if (st === 'pitfall') return (
        <div>
          <h4>흔한 함정과 처방</h4>
          <table><thead><tr><th>함정</th><th>처방</th></tr></thead><tbody>
            {step.pitfall.rows.map((r) => <tr key={r.bad}><td>{r.bad}</td><td>{r.good}</td></tr>)}
          </tbody></table>
        </div>
      );
      return null;
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-[#339933]/20 border-l-2 border-[#339933] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
