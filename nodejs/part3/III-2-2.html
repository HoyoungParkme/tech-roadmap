        desc: '스트림은 이벤트로 말한다. data: 청크가 하나 도착했다, end: 읽을 데이터가 끝났다, error: 문제가 생겼다(파일 없음·권한·디스크 풀). 초보가 가장 자주 밟는 지뢰가 바로 error 이벤트 미처리다 — Readable/Writable 어느 쪽이든 error 리스너가 없으면 그 에러는 잡히지 않은 예외(uncaught)가 되어 프로세스 전체를 죽인다. 그 밖의 단골 함정 넷을 정리하면: ① 대용량을 readFile로 통째 로드해 메모리 폭발, ② pipe 없이 수동 처리로 백프레셔 무시, ③ error 이벤트 미처리로 서버 다운, ④ Buffer 인코딩 실수로 데이터 깨짐(utf8 파일을 latin1로 읽는 등). 정리하면 — 대용량·실시간이면 스트림, 이을 땐 pipe/pipeline, error는 반드시 처리, 인코딩은 명시. 이 네 가지만 지켜도 스트림 사고의 대부분을 막는다.',
        actor: '📡 data · end · error 이벤트 + 실무 함정 4',

        stageLabel: '이벤트 · 실무 함정',
        events: {

            { ev: 'end', desc: '읽을 데이터 끝 (1번)', tone: 'mid' },
            { ev: 'error', desc: '문제 발생 — 반드시 처리!', tone: 'bad' },
          ],
          traps: [

            { bad: 'error 이벤트 미처리 → 프로세스 다운', fix: '.on("error") 항상 등록', tone: 'bad' },
            { bad: 'Buffer 인코딩 실수 → 데이터 깨짐', fix: '인코딩 명시(utf8 등)', tone: 'bad' },
          ],
        },
        alert: { tone: 'good', text: '대용량·실시간이면 스트림, 이을 땐 pipe/pipeline, error 는 반드시 .on("error") 로 처리, 인코딩은 명시. 이 넷이 스트림 실무의 핵심 체크리스트다. 다음 파트 IV-1-1 에서 HTTP 서버를 다룬다 — 요청·응답도 결국 스트림이다.' },
        code: {
          lang: 'javascript',
          filename: 'events-and-traps.js — 이벤트 안전하게',
          lines: [
            'const fs = require("fs");',

            '//                             인코딩 명시 ↑ (함정 ④ 예방)',
            '',
            'let total = 0;',
            'read.on("data", (chunk) => {   // 청크마다 여러 번 호출',

    // ─────────────────────────────────────────────────────
    // Step 1 — Buffer 바이트 배열 + 인코딩
    // ─────────────────────────────────────────────────────
    function BufferView({ buffer }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🧱 "{buffer.text}" → utf8 바이트</div>
            <div className="flex gap-1 flex-wrap">
              {buffer.bytes.map((b, i) => (
                <div key={i} className="flex flex-col items-center">

                    {b.toString(16).padStart(2, '0')}
                  </div>
                  <span className="text-[8px] text-slate-500 mt-0.5">{b}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500">{buffer.note}</div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🔤 같은 바이트, 다른 인코딩</div>
            <div className="space-y-1.5">
              {buffer.encodings.map((e, i) => (
                <div key={i} className="rounded border border-[#81c784] bg-white px-2 py-1.5 flex items-center gap-2">
                  <span className="text-[11px] font-mono font-bold text-[#1b5e20] w-16">{e.name}</span>
                  <span className="text-[10px] text-slate-700 flex-1">{e.role}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — Stream 4종
    // ─────────────────────────────────────────────────────
    function KindsView({ kinds }) {
      const TONE = {
        point: 'border-[#339933] bg-[#c8e6c9]',
        good: 'border-[#81c784] bg-[#e8f5e9]',
        mid: 'border-[#81c784] bg-white',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🌊 Stream 4종 — 데이터가 흐르는 통로</div>
            <div className="space-y-1.5">
              {kinds.items.map((k, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 ${TONE[k.tone]}`}>
                  <span className="text-base w-6 text-center text-[#1b5e20]">{k.arrow}</span>
                  <span className="text-[11px] font-mono font-bold text-[#1b5e20] w-24">{k.name}</span>
                  <div className="flex-1">
                    <div className="text-[10px] text-slate-700">{k.role}</div>
                    <div className="text-[9px] font-mono text-slate-500">{k.ex}</div>
                  </div>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-slate-500">{kinds.note}</div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🔗 처리 라인 예시</div>
            <div className="flex items-center gap-1.5 flex-wrap text-[10px] font-mono font-bold text-[#1b5e20]">
              <span className="px-2 py-1 rounded bg-white border border-[#339933]">Readable</span>
              <span>→</span>
              <span className="px-2 py-1 rounded bg-[#c8e6c9] border border-[#339933]">Transform</span>
              <span>→</span>
              <span className="px-2 py-1 rounded bg-white border border-[#339933]">Writable</span>
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">읽기 → 변형(압축·암호화) → 쓰기</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 메모리 대비 (애니메이션): readFile 폭발 vs Stream 평평
    // ─────────────────────────────────────────────────────
    function MemoryView({ memory, tick }) {
      const N = 8;                       // 파일을 8조각으로 나눠 흘림
      const loaded = tick % (N + 2);     // 0..N+1 진행
      const progress = Math.min(loaded, N);
      // readFile: 진행에 비례해 계속 차오른다 (한계선 초과)
      const readFilePct = Math.min(100, (progress / N) * 130);
      const overLimit = readFilePct >= 100;
      // Stream: 청크 한두 개만 → 낮고 평평 (약간 출렁)
      const streamPct = progress === 0 || progress > N ? 8 : 14 + (tick % 2) * 8;
      const Gauge = ({ label, pct, danger, sub }) => (
        <div className={`rounded-lg border-2 p-3 ${danger ? 'border-red-300 bg-red-50' : 'border-[#339933] bg-[#e8f5e9]'}`}>
          <div className={`text-[11px] font-bold mb-1.5 ${danger ? 'text-red-700' : 'text-[#1b5e20]'}`}>{label}</div>
          <div className="relative w-full h-4 rounded bg-white border border-slate-300 overflow-hidden">
            {/* 한계선 */}
            <div className="absolute top-0 bottom-0 border-r-2 border-dashed border-red-500" style={{ left: '77%' }} />
            <div
              className={`h-full transition-all ${danger ? (pct >= 100 ? 'bg-red-500' : 'bg-red-400') : 'bg-[#339933]'}`}
              style={{ width: `${pct}%` }}
            />
          </div>
          <div className={`mt-1 text-[9px] ${danger ? 'text-red-600' : 'text-slate-500'}`}>{sub}</div>
        </div>
      );
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-2.5">
            <div className="text-[10px] font-bold text-[#1b5e20] mb-1">📦 파일이 흘러 들어오는 중 …</div>
            <div className="flex gap-1">
              {Array.from({ length: N }).map((_, i) => (
                <div
                  key={i}
                  className={`flex-1 h-4 rounded text-center text-[8px] font-mono border transition
                    ${i < progress ? 'bg-[#c8e6c9] border-[#339933] text-[#1b5e20]' : 'bg-white border-[#81c784] text-slate-400'}`}
                >{i < progress ? '▓' : ''}</div>
              ))}
            </div>
            <div className="mt-1 text-[9px] text-slate-500">청크 {progress} / {N} 도착</div>
          </div>
          <Gauge
            label="① fs.readFile — 전체를 메모리에 쌓음"
            pct={readFilePct}
            danger={true}
            sub={overLimit ? '🚨 한계선 초과 → OOM 위험 (프로세스 다운)' : '읽을수록 계속 차오른다 (파일 크기 = 메모리)'}
          />
          <Gauge
            label="② createReadStream — 청크만 흐른다"
            pct={streamPct}
            danger={false}
            sub="청크가 들어왔다 빠져나가며 낮고 평평하게 유지"
          />
          <div className="text-[9px] text-slate-500 text-center">{memory.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — pipe + 백프레셔 (애니메이션)
    // ─────────────────────────────────────────────────────
    function PipeView({ pipe, tick }) {
      // 소비(Writable)가 주기적으로 느려짐 → 백프레셔 발동
      const slow = tick % 4 >= 2;            // 절반 주기 동안 소비가 느림
      const bufferFill = slow ? 80 : 25;     // 중간 버퍼 채움
      const producing = !slow;               // 느릴 땐 생산 멈춤(백프레셔)
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-3">🔗 readStream.pipe(writeStream)</div>
            <div className="flex items-center gap-1.5">
              {/* Readable */}
              <div className={`flex-1 rounded-lg border-2 p-2 text-center transition ${producing ? 'border-[#339933] bg-[#c8e6c9]' : 'border-slate-300 bg-slate-100'}`}>
                <div className="text-[10px] font-bold text-[#1b5e20]">Readable</div>
                <div className="text-[9px] text-slate-600">{producing ? '생산 중 ▶' : '⏸ 멈춤(백프레셔)'}</div>
              </div>
              <span className="text-lg text-[#339933]">{producing ? '»' : '‖'}</span>
              {/* 중간 버퍼 */}
              <div className="flex-1 rounded-lg border-2 border-[#81c784] bg-white p-2">
                <div className="text-[9px] font-bold text-[#1b5e20] text-center mb-1">내부 버퍼</div>
                <div className="w-full h-3 rounded bg-slate-100 border border-slate-300 overflow-hidden">
                  <div className={`h-full transition-all ${bufferFill >= 80 ? 'bg-amber-400' : 'bg-[#339933]'}`} style={{ width: `${bufferFill}%` }} />
                </div>
              </div>
              <span className="text-lg text-[#339933]">»</span>
              {/* Writable */}
              <div className={`flex-1 rounded-lg border-2 p-2 text-center transition ${slow ? 'border-amber-400 bg-amber-50' : 'border-[#339933] bg-[#e8f5e9]'}`}>
                <div className="text-[10px] font-bold text-[#1b5e20]">Writable</div>
                <div className="text-[9px] text-slate-600">{slow ? '🐢 소비 느림' : '소비 중 ✅'}</div>
              </div>
            </div>
          </div>
          <div className={`rounded-lg border-2 p-3 transition ${slow ? 'border-amber-400 bg-amber-50' : 'border-[#81c784] bg-[#e8f5e9]'}`}>
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1">
              {slow ? '⚠️ 소비 < 생산 → 백프레셔 발동' : '✅ 균형 — 버퍼가 낮게 유지'}
            </div>
            <div className="text-[9px] text-slate-600">
              {slow
                ? '버퍼가 차자 pipe 가 Readable 에게 "멈춰" 신호 → 생산 중단 → 버퍼 넘침 방지'
                : '소비가 따라오면 pipe 가 생산을 재개한다'}
            </div>
          </div>
          <div className="text-[9px] text-slate-500 text-center">{pipe.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 이벤트 흐름 + 실무 함정
    // ─────────────────────────────────────────────────────
    function EventsView({ events }) {
      const EV_TONE = {
        good: 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]',
        mid: 'border-[#81c784] bg-white text-slate-700',
        bad: 'border-red-400 bg-red-50 text-red-700',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">📡 스트림 이벤트 흐름</div>
            <div className="flex items-center gap-1.5">
              {events.flow.map((e, i) => (
                <React.Fragment key={i}>
                  <div className={`flex-1 rounded border-2 px-1.5 py-2 text-center ${EV_TONE[e.tone]}`}>
                    <div className="text-[11px] font-mono font-bold">{e.ev}</div>
                    <div className="text-[8px] mt-0.5">{e.desc}</div>
                  </div>
                  {i < events.flow.length - 1 && <span className="text-[#339933] font-bold">→</span>}
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-2">🕳 실무 함정 4 + 해법</div>
            <div className="space-y-1.5">
              {events.traps.map((t, i) => (
                <div key={i} className="rounded border border-red-300 bg-white px-2 py-1.5">
                  <div className="text-[10px] text-red-700 flex items-center gap-1">
                    <span className="font-bold">❌</span><span>{t.bad}</span>
                  </div>
                  <div className="text-[10px] text-[#1b5e20] flex items-center gap-1 mt-0.5">
                    <span className="font-bold">✅</span><span>{t.fix}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#e8f5e9]', border: 'border-[#81c784]', text: 'text-[#1b5e20]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-[#c8e6c9]', border: 'border-[#339933]', text: 'text-[#1b5e20]', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Node 그린 톤)
    //   memory/pipe 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      buffer:  { icon: '🧱', label: 'Buffer · 바이트' },
      kinds:   { icon: '🌊', label: 'Stream 4종' },
      memory:  { icon: '📈', label: '메모리 대비' },
      pipe:    { icon: '🔗', label: 'pipe · 백프레셔' },
      events:  { icon: '📡', label: '이벤트 · 함정' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.buffer;
      const [tick, setTick] = useState(0);

      useEffect(() => {
        const animated = state.stage === 'memory' || state.stage === 'pipe';
        setTick(0);
        if (!animated) return;
        const id = setInterval(() => setTick((t) => t + 1), 700);
        return () => clearInterval(id);
      }, [state.stage]);

      return (
        <div className="rounded-xl border border-[#339933] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1b5e20] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>스트림과 버퍼 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#1b5e20] font-mono mb-3 px-2 py-1 rounded bg-[#e8f5e9] border border-[#81c784]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'buffer' && <BufferView buffer={state.buffer} />}
          {state.stage === 'kinds' && <KindsView kinds={state.kinds} />}
          {state.stage === 'memory' && <MemoryView memory={state.memory} tick={tick} />}
          {state.stage === 'pipe' && <PipeView pipe={state.pipe} tick={tick} />}
          {state.stage === 'events' && <EventsView events={state.events} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-[#339933]/20 border-l-2 border-[#339933] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#339933] text-white font-bold text-xs">Ⅲ. 핵심 모듈</span>
              <div>
                <h1 className="text-2xl font-bold text-[#1b5e20]"><span className="font-mono text-lg mr-1">III-2-2</span> 스트림과 버퍼 — 대용량을 조각으로 다루기</h1>
                <p className="text-sm text-[#1b5e20]/80">메모리에 다 안 올리고 흐르게 하는 Stream, 이진 데이터 Buffer</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#1b5e20] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#339933]' : 'bg-green-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#1b5e20] text-green-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-green-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#1b5e20] text-white' : 'bg-[#339933] text-white hover:bg-[#1b5e20]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#1b5e20]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#339933] bg-white px-4 py-3 text-sm text-[#1b5e20]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Buffer 는 파일·네트워크가 주고받는 원시 바이트(0~255)를 담는 고정 크기 배열이고, 인코딩(utf8·base64·hex)으로 문자열과 오간다.
                Stream 4종(Readable·Writable·Duplex·Transform)은 데이터를 청크로 흘려보내 100GB 파일도 메모리엔 한 조각만 올린다.
                대용량을 readFile 로 통째 로드하면 메모리가 폭발하므로 스트림으로 청크 처리하고, 이을 땐 pipe/pipeline 한 줄로 백프레셔까지 자동 조절한다.
                data·end·error 이벤트 중 error 는 반드시 처리해야 프로세스가 죽지 않는다. 다음 파트 IV-1-1 의 HTTP 서버도 요청·응답이 모두 스트림이다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Buffer', '바이트', '인코딩', 'Readable', 'Writable', 'Duplex', 'Transform', '청크', 'createReadStream', 'pipe', '백프레셔', 'pipeline', 'data이벤트', 'error이벤트', 'OOM'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-green-100 text-[#1b5e20] border border-green-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1b5e20]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part4/IV-1-1.html" className="underline hover:no-underline">다음: IV-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
