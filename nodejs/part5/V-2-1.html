<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node.js 학습 — V-2-1. 성능과 확장 — 클러스터·보안 기본</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#x2B22;</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Node.js V-2-1 — 성능과 확장: 클러스터·보안 기본
    학습 목표: 단일 스레드의 한계를 넘어 멀티코어를 쓰는 법(cluster·PM2·worker_threads),
              무상태 설계로 수평 확장하는 법(로드밸런서 뒤 여러 인스턴스),
              그리고 기본 보안(helmet·CORS·입력검증·rate limit·시크릿·npm audit)을
              6단계로 실무 관점에서 뜯어본다.
    패턴: fastapi v1 — 좌(LiveDataPane: 코어 활용·워커 분산·확장·보안 계층 애니메이션)
                       우(VSCode CodeViewer: 실전 Node 예제 코드)
    색상: Node 그린 #339933 기조 / 형광펜·배경 채움 연한 그린 #c8e6c9 / 텍스트·링크·배지 다크 그린 #1b5e20
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — 멀티코어(cluster) → PM2 → worker_threads → 수평확장 → 보안계층 → 시크릿·audit
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값에 따라 다른 시각화를 그린다.
    //   cluster/worker/scale/security 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      cluster: {lang:"javascript", filename:"cluster.js — 코어 수만큼 워커 띄우기", lines:[
        "const cluster = require(\"cluster\");",
        "const http = require(\"http\");",
        "const os = require(\"os\");",
        "",
        "if (cluster.isPrimary) {",
        "  const cpus = os.cpus().length;   // 예: 4코어",
        "  console.log(`마스터 ${process.pid} — 워커 ${cpus}개 fork`);",
        "  for (let i = 0; i < cpus; i++) cluster.fork();",
        "",
        "  // 워커가 죽으면 되살린다 (무중단)",
        "  cluster.on(\"exit\", (worker) => {",
        "    console.log(`워커 ${worker.process.pid} 종료 → 재시작`);",
        "    cluster.fork();",
        "  });",
        "} else {",
        "  // 워커: 같은 3000 포트를 공유해 요청을 나눠 받는다",
        "  http.createServer((req, res) => {",
        "    res.end(`처리한 워커 pid: ${process.pid}`);",
        "  }).listen(3000);",
        "}",
        "// => 요청이 여러 워커 pid로 분산 → 코어를 모두 활용",
      ]},
      pm2: {lang:"javascript", filename:"ecosystem & 배포 명령 (주석은 셸)", lines:[
        "// ── PM2 설치 & 실행 (셸에서) ─────────────",
        "// npm i -g pm2",
        "// pm2 start app.js -i max --name api",
        "//   -i max => 코어 수만큼 클러스터 인스턴스",
        "// pm2 reload api   => 무중단 순차 재배포",
        "// pm2 logs api     => 실시간 로그",
        "// pm2 startup      => 서버 부팅 시 자동 기동",
        "",
        "// ── ecosystem.config.js (설정 파일로 관리) ──",
        "module.exports = {",
        "  apps: [{",
        "    name: \"api\",",
        "    script: \"app.js\",",
        "    instances: \"max\",     // 코어 수만큼",
        "    exec_mode: \"cluster\", // 클러스터 모드",
        "    max_memory_restart: \"300M\", // 누수 시 재시작",
        "    env: { NODE_ENV: \"production\" },",
        "  }],",
        "};",
        "// => pm2 start ecosystem.config.js",
      ]},
      worker: {lang:"javascript", filename:"worker-offload.js — 계산을 옆 스레드로", lines:[
        "const { Worker } = require(\"worker_threads\");",
        "",
        "// 무거운 계산을 별도 스레드에서 돌리고 결과만 받는다",
        "function heavyTaskAsync(input) {",
        "  return new Promise((resolve, reject) => {",
        "    const w = new Worker(\"./heavy.js\", { workerData: input });",
        "    w.on(\"message\", resolve);     // 계산 끝 → 결과 수신",
        "    w.on(\"error\", reject);",
        "  });",
        "}",
        "",
        "// 요청 핸들러는 막히지 않는다",
        "app.get(\"/report\", async (req, res) => {",
        "  const result = await heavyTaskAsync(req.query);",
        "  res.json(result);   // 그동안 다른 요청도 처리됨",
        "});",

    const S1 = { title:"Step 1. 단일 스레드의 한계 → cluster로 멀티코어 쓰기", desc:"Node의 메인 이벤트 루프는 스레드가 하나라, 프로세스를 하나만 띄우면 8코어 서버에서도 코어 1개만 일하고 나머지 7개는 놀게 된다. cluster 모듈은 마스터 프로세스가 CPU 코어 수만큼 워커 프로세스를 fork 하고, 워커들이 같은 포트를 공유하며 들어오는 연결을 나눠 받게 해준다. 결과적으로 동일한 서버 코드로 처리량이 코어 수에 비례해 늘어난다. 워커는 각자 독립된 메모리를 가진 별도 프로세스라, 하나가 죽어도 나머지가 계속 요청을 받고 마스터가 죽은 워커를 되살릴 수 있다. 그래서 실무에서는 \"한 서버 = 한 프로세스\"를 그대로 두지 말고, 코어를 다 쓰도록 반드시 다중화한다." };
    const S2 = { title:"Step 2. PM2 — 프로세스 매니저로 무중단 운영", desc:"cluster를 직접 코딩하지 않아도, PM2 같은 프로세스 매니저를 쓰면 명령 한 줄로 클러스터 모드·무중단 재시작·로그 수집·부팅 시 자동 기동을 얻는다. pm2 start app.js -i max 는 코어 수만큼 인스턴스를 띄우고, 코드가 죽으면 자동으로 재기동한다. 배포할 때 pm2 reload 를 쓰면 워커를 하나씩 순차 교체해 사용자 요청을 끊지 않고 새 버전으로 넘어간다(graceful reload). 개발 중 node app.js 로 띄우던 것을 운영에서는 그대로 두면 안 되는 이유가 이것 — 프로세스가 죽으면 서비스가 통째로 멈추기 때문이다. PM2가 부담스러우면 systemd나 컨테이너 오케스트레이터(쿠버네티스)가 같은 \"죽으면 되살리기·다중화\" 역할을 대신한다." };
    const S3 = { title:"Step 3. CPU 바운드는 worker_threads로 분리", desc:"cluster·PM2가 프로세스를 늘려 동시성을 키우는 것과 별개로, 한 요청 안의 무거운 계산(이미지 리사이즈, 암호 해시, 큰 배열 정렬)은 여전히 그 워커의 이벤트 루프를 붙든다. 계산이 도는 동안 그 워커가 받은 다른 요청은 전부 얼어붙는다. 해법은 worker_threads — 메인 스레드가 아닌 별도 스레드에서 계산을 돌리고, 결과만 메시지로 돌려받는 것이다. 이러면 이벤트 루프는 계속 I/O와 짧은 일을 처리하고, 무거운 연산은 옆 스레드가 태운다. 판단 기준은 단순하다: I/O가 대부분이면 cluster로 프로세스만 늘려도 충분하고, 한 요청 안에 수십 ms 이상 CPU를 먹는 구간이 있으면 worker_threads로 빼라. 그마저 과하면 그 연산을 전용 서비스로 떼어내는 것도 방법이다." };
    const S4 = { title:"Step 4. 수평 확장 — 로드밸런서 뒤 여러 인스턴스 + 무상태 설계", desc:"한 서버의 코어를 다 써도 트래픽이 더 늘면, 서버 자체를 여러 대로 늘리는 수평 확장(scale out)으로 넘어간다. 로드밸런서(nginx·ALB) 뒤에 동일한 인스턴스를 여러 개 두고 요청을 분산하는 구조다. 이게 되려면 애플리케이션이 무상태(stateless)여야 한다 — 세션·업로드 파일·캐시를 특정 서버의 메모리에 담아두면, 다음 요청이 다른 서버로 가는 순간 그 상태가 사라진다. 그래서 세션은 Redis, 파일은 S3, 캐시는 공유 저장소로 밖에 빼서 어느 인스턴스가 받아도 동일하게 동작하게 만든다. 스케일 업(더 큰 서버 한 대)은 간단하지만 한계가 있고, 스케일 아웃(작은 서버 여러 대)은 무상태 설계라는 숙제가 있는 대신 사실상 무한히 늘어난다. 실무에선 먼저 무상태로 짜두면 나중에 확장이 쉬워진다." };
    const S5 = { title:"Step 5. 기본 보안 — helmet · CORS · 입력 검증 · rate limit", desc:"성능만큼 기본 보안도 최소한은 갖춰야 한다. 들어오는 요청은 신뢰할 수 없다고 가정하고 여러 계층으로 거른다. helmet은 X-Frame-Options·Content-Security-Policy 같은 보안 HTTP 헤더를 한 번에 세팅해 흔한 브라우저 공격을 막는다. CORS는 어떤 출처(origin)의 요청을 허용할지 명시적으로 좁혀 아무 사이트나 API를 호출하지 못하게 한다. 입력 검증(zod·express-validator)은 요청 본문·쿼리를 스키마로 확인해 SQL 인젝션·잘못된 타입을 걸러내고, rate limiting은 같은 IP가 짧은 시간에 과도하게 때리는 것을 막아 무차별 대입·DoS를 완화한다. 왼쪽 그림처럼 정상 요청은 통과하고, 헤더 없는·과도한·검증 실패 요청은 각 계층에서 차단된다. 이 넷은 코드 몇 줄이면 붙는 \"기본기\"라, 누락하면 취약점 리포트에 그대로 잡힌다." };

    function ClusterView({ cluster, tick }) {
      const n = cluster.cores;
      const active = tick % n; // 라운드로빈으로 워커가 요청을 받는 모습
      return (
        <div className="space-y-3">
          {/* 단일 프로세스 — 1코어만 */}

            <div className="flex gap-1.5">
              {Array.from({ length: n }).map((_, i) => (
                <div key={i} className={`flex-1 rounded px-1 py-2 text-center text-[9px] font-mono font-bold border
                  ${i === 0 ? 'bg-red-200 border-red-500 text-red-800' : 'bg-white border-slate-300 text-slate-400'}`}>
                  코어{i + 1}{i === 0 ? ' 🔥' : ' 💤'}
                </div>
              ))}
            </div>
            <div className="mt-1.5 text-[9px] text-red-600">나머지 코어는 놀고 처리량은 1코어에 갇힌다</div>
          </div>
          {/* cluster — 코어 수만큼 워커 */}
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">✅ cluster — 코어 수만큼 워커가 분산 처리</div>
            <div className="flex items-center gap-2 mb-2">
              <span className="text-[10px] font-mono font-bold text-[#1b5e20] px-2 py-1 rounded bg-[#c8e6c9] border border-[#339933]">마스터</span>
              <span className="text-[9px] text-slate-500">fork ×{n} →</span>
            </div>
            <div className="flex gap-1.5">
              {Array.from({ length: n }).map((_, i) => (
                <div key={i} className={`flex-1 rounded px-1 py-2 text-center text-[9px] font-mono font-bold border transition
                  ${i === active
                    ? 'bg-[#c8e6c9] border-[#339933] text-[#1b5e20] scale-110'
                    : 'bg-[#e8f5e9] border-[#81c784] text-[#1b5e20]'}`}>
                  워커{i + 1}{i === active ? ' ▶' : ''}
                </div>
              ))}

            <div className="mt-2 text-[9px] text-slate-500">{cluster.note}</div>
          </div>
        </div>
      );

                <div key={i} className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 ${TONE[f.tone]}`}>
                  <span className="text-[10px] font-mono font-bold w-36">{f.name}</span>
                  <span className="text-[9px] flex-1">{f.desc}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-1">⚠ 운영에서 하지 말 것</div>
            <div className="text-[10px] text-red-600 font-mono">$ node app.js</div>
            <div className="text-[9px] text-red-600 mt-1">{pm2.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — worker_threads: CPU 점유 vs offload (애니메이션)
    // ─────────────────────────────────────────────────────
    function WorkerView({ worker, tick }) {
      const heat = 40 + (tick % 4) * 20;
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-2">🔥 메인 스레드에서 계산 → 그 워커의 루프 정지</div>
            <div className="text-[9px] text-slate-600 mb-1">메인 스레드 CPU 점유율 (계산 중)</div>
            <div className="w-full h-3 rounded-full bg-white border border-red-300 overflow-hidden">
              <div className="h-full bg-red-400 transition-all" style={{ width: `${heat}%` }} />
            </div>
            <div className="mt-2 flex gap-1.5">
              {['req1', 'req2', 'req3'].map((r, i) => (
                <span key={i} className="flex-1 text-center text-[9px] font-mono rounded px-1 py-1 bg-white border border-red-300 text-red-500">
                  {r} ⏳ 대기
                </span>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">✅ worker_threads — 계산을 옆 스레드로</div>
            <div className="flex items-center justify-around gap-2">
              <div className="text-center">
                <div className="w-14 h-14 rounded-lg border-2 border-[#339933] bg-[#c8e6c9] flex items-center justify-center text-xl">🔁</div>
                <div className="text-[9px] text-[#1b5e20] font-bold mt-1">메인 루프</div>
                <div className="text-[9px] text-slate-500">요청 계속 처리</div>
              </div>
              <div className="text-[#1b5e20] text-lg">→</div>
              <div className="text-center">
                <div className="w-14 h-14 rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] flex items-center justify-center text-xl" style={{ opacity: 0.5 + (tick % 2) * 0.5 }}>🔥</div>
                <div className="text-[9px] text-[#1b5e20] font-bold mt-1">워커 스레드</div>
                <div className="text-[9px] text-slate-500">무거운 계산</div>
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500">{worker.note}</div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-2.5">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🧭 언제 무엇을 쓰나</div>
            <div className="space-y-1">
              {worker.pick.map((p, i) => (
                <div key={i} className="rounded border border-[#81c784] bg-white px-2 py-1 flex items-center gap-2">
                  <span className="text-[10px] text-slate-700 flex-1">{p.work}</span>
                  <span className={`text-[9px] font-bold rounded px-1.5 py-0.5 whitespace-nowrap ${p.tone === 'good' ? 'bg-[#c8e6c9] text-[#1b5e20] border border-[#339933]' : 'bg-red-100 text-red-700 border border-red-300'}`}>{p.verdict}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 수평 확장: 로드밸런서 → 인스턴스 분산 (애니메이션)
    // ─────────────────────────────────────────────────────
    function ScaleView({ scale, tick }) {
      const n = scale.instances;
      const active = tick % n;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">⚖ 로드밸런서 → 무상태 인스턴스 분산</div>
            <div className="flex flex-col items-center">
              <div className="text-[10px] font-mono font-bold text-[#1b5e20] px-3 py-1 rounded bg-[#c8e6c9] border border-[#339933]">Load Balancer</div>
              <div className="text-[#1b5e20] text-sm my-0.5">▼</div>
              <div className="flex gap-1.5 w-full">
                {Array.from({ length: n }).map((_, i) => (
                  <div key={i} className={`flex-1 rounded px-1 py-2 text-center text-[9px] font-mono font-bold border transition
                    ${i === active
                      ? 'bg-[#c8e6c9] border-[#339933] text-[#1b5e20] scale-110'
                      : 'bg-[#e8f5e9] border-[#81c784] text-[#1b5e20]'}`}>
                    인스턴스{i + 1}{i === active ? ' ◀' : ''}
                  </div>
                ))}
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500">{scale.note}</div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🗄 상태는 서버 밖 공유 저장소로</div>
            <div className="space-y-1">
              {scale.shared.map((s, i) => (
                <div key={i} className={`rounded border px-2 py-1 flex items-center gap-2 ${s.tone === 'good' ? 'border-[#339933] bg-[#c8e6c9]' : 'border-[#81c784] bg-white'}`}>
                  <span className="text-[10px] font-mono font-bold text-[#1b5e20] w-28">{s.name}</span>
                  <span className="text-[9px] text-slate-700 flex-1">{s.desc}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 보안 계층: 요청이 계층을 통과/차단 (애니메이션)
    // ─────────────────────────────────────────────────────
    function SecurityView({ security, tick }) {
      const layers = security.layers;
      // 정상 요청은 모든 계층 통과, 위험 요청은 tick에 따라 특정 계층에서 차단
      const blockedAt = tick % (layers.length + 1); // layers.length면 전부 통과(정상)
      const isNormal = blockedAt === layers.length;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">
              🛡 요청 → 보안 계층 통과 {isNormal ? '(정상 요청 ✅)' : '(위험 요청 차단 ⛔)'}
            </div>
            <div className="flex items-center gap-1 flex-wrap">
              <span className="text-[9px] font-mono px-1.5 py-1 rounded bg-slate-100 border border-slate-300 text-slate-600">요청</span>
              {layers.map((l, i) => {
                const blocked = !isNormal && i === blockedAt;
                const passed = isNormal || i < blockedAt;
                return (
                  <React.Fragment key={i}>
                    <span className="text-[#1b5e20] text-xs">→</span>
                    <span className={`text-[9px] font-mono font-bold px-1.5 py-1 rounded border transition
                      ${blocked
                        ? 'bg-red-200 border-red-500 text-red-800 scale-110'
                        : passed
                          ? 'bg-[#c8e6c9] border-[#339933] text-[#1b5e20]'
                          : 'bg-white border-[#81c784] text-slate-400'}`}>
                      {l.name}{blocked ? ' ✕' : passed ? ' ✓' : ''}
                    </span>
                  </React.Fragment>
                );
              })}
              <span className="text-[#1b5e20] text-xs">→</span>
              <span className={`text-[9px] font-mono px-1.5 py-1 rounded border ${isNormal ? 'bg-[#c8e6c9] border-[#339933] text-[#1b5e20]' : 'bg-white border-slate-300 text-slate-400'}`}>
                라우터
              </span>
            </div>
            <div className="mt-2 text-[9px] text-slate-500">{security.note}</div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🧱 각 계층이 막는 것</div>
            <div className="space-y-1">
              {layers.map((l, i) => (
                <div key={i} className="rounded border border-[#81c784] bg-white px-2 py-1 flex items-center gap-2">
                  <span className="text-[10px] font-mono font-bold text-[#1b5e20] w-24">{l.name}</span>
                  <span className="text-[9px] text-slate-700 flex-1">{l.role}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 시크릿·취약점 체크리스트 + 스케일 판단
    // ─────────────────────────────────────────────────────
    function SecretView({ secret }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🔑 운영 위생 체크</div>
            <div className="space-y-1.5">
              {secret.checks.map((c, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 ${c.ok ? 'border-[#339933] bg-[#c8e6c9]' : 'border-red-300 bg-red-50'}`}>
                  <div className={`text-[10px] font-bold flex items-center gap-1 ${c.ok ? 'text-[#1b5e20]' : 'text-red-700'}`}>
                    <span>{c.ok ? '✅' : '⛔'}</span>
                    <span>{c.label}</span>
                  </div>
                  <div className={`text-[9px] mt-0.5 ${c.ok ? 'text-[#1b5e20]/80' : 'text-red-600'}`}>→ {c.fix}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🧭 스케일 업 vs 아웃 — 언제?</div>
            <div className="space-y-1">
              {secret.scaleRule.map((r, i) => (
                <div key={i} className="rounded border border-[#81c784] bg-white px-2 py-1.5">
                  <div className="text-[10px] text-slate-700">{r.when}</div>
                  <div className="text-[10px] font-bold text-[#1b5e20]">→ {r.pick}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#e8f5e9]', border: 'border-[#81c784]', text: 'text-[#1b5e20]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-[#c8e6c9]', border: 'border-[#339933]', text: 'text-[#1b5e20]', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Node 그린 톤)
    //   cluster/worker/scale/security 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      cluster:  { icon: '⬢', label: '멀티코어 · cluster' },
      pm2:      { icon: '🛡', label: 'PM2 프로세스 매니저' },
      worker:   { icon: '🔥', label: 'worker_threads' },
      scale:    { icon: '⚖', label: '수평 확장' },
      security: { icon: '🛡', label: '보안 계층' },
      secret:   { icon: '🔑', label: '시크릿 · 취약점' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.cluster;
      const [tick, setTick] = useState(0);

      useEffect(() => {
        const animated = state.stage === 'cluster' || state.stage === 'worker' || state.stage === 'scale' || state.stage === 'security';
        setTick(0);
        if (!animated) return;
        const id = setInterval(() => setTick((t) => t + 1), 700);
        return () => clearInterval(id);
      }, [state.stage]);

      return (
        <div className="rounded-xl border border-[#339933] bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1b5e20] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>성능·확장·보안 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#1b5e20] font-mono mb-3 px-2 py-1 rounded bg-[#e8f5e9] border border-[#81c784]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'cluster' && <ClusterView cluster={state.cluster} tick={tick} />}
          {state.stage === 'pm2' && <Pm2View pm2={state.pm2} />}
          {state.stage === 'worker' && <WorkerView worker={state.worker} tick={tick} />}
          {state.stage === 'scale' && <ScaleView scale={state.scale} tick={tick} />}
          {state.stage === 'security' && <SecurityView security={state.security} tick={tick} />}
          {state.stage === 'secret' && <SecretView secret={state.secret} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-[#339933]/20 border-l-2 border-[#339933] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#339933] text-white font-bold text-xs">Ⅴ. 현장</span>
              <div>
                <h1 className="text-2xl font-bold text-[#1b5e20]"><span className="font-mono text-lg mr-1">V-2-1</span> 성능과 확장 — 클러스터·보안 기본</h1>
                <p className="text-sm text-[#1b5e20]/80">단일 스레드의 한계를 넘고, 기본 보안을 갖춘다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#1b5e20] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#339933]' : 'bg-green-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#1b5e20] text-green-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-green-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#1b5e20] text-white' : 'bg-[#339933] text-white hover:bg-[#1b5e20]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#1b5e20]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#339933] bg-white px-4 py-3 text-sm text-[#1b5e20]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                단일 프로세스는 코어 하나만 쓰므로 cluster나 PM2로 코어 수만큼 워커를 띄워 처리량을 늘리고, 죽으면 되살려 무중단으로 운영한다.
                한 요청 안의 무거운 CPU 계산은 worker_threads로 옆 스레드에 빼서 이벤트 루프를 지킨다.
                트래픽이 더 크면 로드밸런서 뒤에 무상태 인스턴스를 여러 대 두는 수평 확장으로 넘어가되, 세션·파일·캐시는 Redis·S3로 밖에 뺀다.
                기본 보안은 helmet·CORS·입력 검증·rate limit 네 계층으로 깔고, 시크릿은 환경변수로, 의존성은 npm audit로 점검한다. 다음 장 V-2-2에서 관측성으로 이어진다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['cluster', 'PM2', 'worker_threads', '수평확장', '무상태', 'Redis세션', 'helmet', 'CORS', '입력검증', 'rate limit', '환경변수', 'npm audit', '캐싱', '스케일업', '스케일아웃'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-green-100 text-[#1b5e20] border border-green-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1b5e20]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
