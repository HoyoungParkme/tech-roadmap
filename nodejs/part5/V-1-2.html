<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node.js 학습 — V-1-2. 테스트 — Jest와 supertest로 API 검증</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#x2B22;</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Node.js V-1-2 — 테스트: Jest와 supertest로 API 검증
    학습 목표: Jest 기본(test/describe/expect 매처·셋업), AAA 패턴으로 단위 테스트,
              jest.fn·모듈 모킹으로 의존 격리, supertest로 Express HTTP 통합 테스트,
              커버리지·좋은 테스트 기준·실무 함정(상태 공유·실제 DB 호출·await 누락)을 6단계로 뜯어본다.
    패턴: fastapi v1 — 좌(LiveDataPane: AAA 실행·pass/fail·모킹 격리·supertest 요청/응답·커버리지 애니메이션)
                       우(VSCode CodeViewer: Jest/supertest 예제 코드)
    색상: Node 그린 #339933 기조 / 형광펜·배경 채움 연한 그린 #c8e6c9 / 텍스트·링크·배지 다크 그린 #1b5e20
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6단계 시나리오 — Jest 기본 → AAA 단위 → 모킹 → supertest HTTP → 비동기 → 커버리지/함정
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   좌측 패널은 stage 값(jest/aaa/mock/http/async/coverage)에 따라
    //   서로 다른 시각화를 그린다. aaa/mock/http/coverage 단계는 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      jest: {lang:"javascript", filename:"sum.test.js — Jest 첫 테스트", lines:[
        "// 검증 대상: 순수 함수",
        "function sum(a, b) { return a + b; }",
        "",
        "// describe: 관련 테스트를 하나로 묶는다",
        "describe(\"sum()\", () => {",
        "  // test(이름, 함수): 케이스 하나",
        "  test(\"두 수를 더한다\", () => {",
        "    expect(sum(1, 2)).toBe(3);   // => 통과 (1+2 === 3)",
        "  });",
        "",
        "  test(\"음수도 처리한다\", () => {",
        "    expect(sum(-1, -2)).toBe(-3);",
        "  });",
        "",
        "  // 객체는 toBe(참조) 대신 toEqual(값) 로 비교",
        "  test(\"객체는 값으로 비교\", () => {",
        "    expect({ id: 1 }).toEqual({ id: 1 });  // => 통과",
        "  });",
        "});",
      ]},
      aaa: {lang:"javascript", filename:"cart.test.js — AAA 패턴", lines:[
        "const { calcTotal } = require(\"./cart\");",
        "",
        "test(\"항목들의 합계를 계산한다\", () => {",
        "  // ── Arrange: 입력 준비 ──",
        "  const items = [",
        "    { name: \"book\", price: 12000, qty: 1 },",
        "    { name: \"pen\",  price: 1500,  qty: 2 },",
        "  ];",
        "",
        "  // ── Act: 검증 대상 실행 (한 번) ──",
        "  const total = calcTotal(items);",
        "",
        "  // ── Assert: 결과 단언 ──",
        "  expect(total).toBe(15000);   // => 12000 + 1500*2",
        "});",
        "",
        "// A·A·A 를 빈 줄로 나누면 테스트가 문서처럼 읽힌다",
      ]},
      mock: {lang:"javascript", filename:"register.test.js — 모킹", lines:[
        "const { registerUser } = require(\"./register\");",
        "const mailer = require(\"./mailer\");",
        "",
        "// 모듈 전체를 가짜로 대체 (실제 메일 발송 X)",
        "jest.mock(\"./mailer\");",
        "",
        "test(\"가입하면 환영 메일을 보낸다\", async () => {",
        "  // Arrange: 가짜 반환값 지정",
        "  mailer.sendEmail.mockResolvedValue(true);",
        "",
        "  // Act",
        "  await registerUser({ email: \"a@x.com\" });",
        "",
        "  // Assert: 호출 여부·인자·횟수 검증",
        "  expect(mailer.sendEmail).toHaveBeenCalledTimes(1);",
        "  expect(mailer.sendEmail).toHaveBeenCalledWith(\"a@x.com\");",
        "});",
        "",
        "afterEach(() => jest.clearAllMocks());  // 호출 기록 초기화",
      ]},
      http: {lang:"javascript", filename:"users.api.test.js — supertest", lines:[
        "const request = require(\"supertest\");",
        "const app = require(\"./app\");   // listen 안 한 app 객체",
        "",
        "describe(\"POST /users\", () => {",
        "  test(\"유저를 생성하고 201을 준다\", async () => {",

    const S1 = { title:"Step 1. Jest 기본 — describe·test·expect 매처로 \"기대\"를 코드로 적는다", desc:"테스트란 \"이 입력이면 이 결과가 나와야 한다\"는 기대를 코드로 못 박아두는 일이다. Jest는 Node 진영에서 가장 널리 쓰는 테스트 러너로, 설정 없이 바로 돌아간다. 구조는 셋뿐이다 — describe로 관련 테스트를 묶고, test(또는 it)로 하나의 케이스를 적고, expect(값).매처(기대) 로 검증한다. 매처는 목적에 맞게 골라야 한다: 원시값은 toBe(===), 객체·배열은 값이 같은지 보는 toEqual, 예외가 나야 하면 toThrow. 매처를 잘못 고르면(객체에 toBe) 값이 같아도 실패하니 주의한다. 반복되는 준비는 beforeEach로 각 테스트 직전에 새로 만들어, 테스트끼리 상태가 새지 않게 격리한다." };
    const S2 = { title:"Step 2. AAA 패턴 — Arrange·Act·Assert로 테스트를 읽기 쉽게", desc:"좋은 테스트는 한눈에 \"무엇을 준비하고, 무엇을 실행하고, 무엇을 기대하는지\" 읽힌다. 그 뼈대가 AAA 패턴이다 — Arrange(준비: 입력·객체·모의 데이터를 세팅), Act(실행: 검증할 함수·API를 딱 한 번 호출), Assert(단언: expect로 결과를 확인). 이 셋을 순서대로, 빈 줄로 구분해 적으면 테스트가 문서처럼 읽힌다. 실무에서 흔한 실수는 Act와 Assert를 뒤섞어 한 테스트에서 여러 동작을 검증하는 것 — 그러면 실패했을 때 어디가 깨졌는지 알기 어렵다. 원칙은 \"한 테스트는 한 가지만 검증한다\". 왼쪽 애니메이션은 하나의 테스트가 Arrange→Act→Assert를 거쳐 초록 pass 또는 빨강 fail로 판정되는 흐름을 보여준다." };
    const S3 = { title:"Step 3. 모킹 — jest.fn·모듈 모킹으로 의존을 격리한다", desc:"단위 테스트의 핵심은 \"검증 대상만 진짜로, 나머지는 가짜로\" 두는 것이다. 함수가 DB·이메일 발송·외부 API에 의존하면, 그것들을 진짜로 부를 때마다 테스트가 느려지고 불안정해진다(네트워크·상태 오염). 그래서 의존을 가짜(mock)로 갈아끼운다. jest.fn()은 호출 여부·인자·호출 횟수를 기록하는 가짜 함수를 만들고, mockReturnValue/mockResolvedValue로 반환값을 정해준다. 모듈 전체는 jest.mock(\"모듈경로\")로 통째로 대체할 수 있다. 그러면 sendEmail이 실제로 메일을 보내지 않고도 \"정확히 1번, 이 인자로 불렸다\"를 toHaveBeenCalledWith로 검증한다. 원칙: 내가 만든 로직만 진짜로 실행하고, 경계 너머(외부 세계)는 모킹으로 격리한다." };
    const S4 = { title:"Step 4. supertest — 실제 서버 없이 Express 앱에 HTTP 요청을 쏜다", desc:"단위 테스트가 함수를 검증한다면, 통합 테스트는 \"요청이 들어와 라우팅·미들웨어·핸들러를 거쳐 올바른 응답이 나가는지\" 전체 경로를 검증한다. supertest는 실제로 포트를 열지 않고도 Express app 객체에 직접 가짜 HTTP 요청을 보낸다 — request(app).get(\"/users\") 처럼. 그래서 서버를 listen하지 않아 포트 충돌·정리 문제가 없고, 빠르다. 검증은 상태코드(.expect(200))와 응답 본문(res.body)을 함께 본다. 흐름은 왼쪽 애니메이션처럼 [요청 생성 → app이 라우트 처리 → 응답 수신 → 상태코드·본문 검증]이다. 실무 규칙: app.js에서는 app을 export만 하고, listen은 별도 server.js에서 호출하라. 그래야 테스트가 app만 가져와 검증할 수 있다." };

                <div key={i} className={`rounded border-2 px-2 py-1.5 ${TONE[m.tone]}`}>

                    <span className="text-[11px] font-mono font-bold text-[#1b5e20] w-20">{m.name}</span>
                    <span className="text-[10px] text-slate-700 flex-1">{m.use}</span>

          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🔧 {jest.hooks.title}</div>
            <div className="space-y-1.5">
              {jest.hooks.rows.map((r, i) => (
                <div key={i} className="rounded border border-[#81c784] bg-white px-2 py-1.5 flex items-center gap-2">
                  <span className="text-[11px] font-mono font-bold text-[#1b5e20] w-24">{r.name}</span>
                  <div className="flex-1">
                    <div className="text-[10px] text-slate-700">{r.when}</div>
                    <div className="text-[9px] text-slate-500">{r.why}</div>

    // ─────────────────────────────────────────────────────
    // Step 2 — AAA 단계 진행 + pass/fail 케이스 (애니메이션)
    // ─────────────────────────────────────────────────────
    function AaaView({ aaa, tick }) {
      const activePhase = tick % aaa.phases.length;             // 진행 중인 A·A·A 단계
      const activeCase = Math.floor(tick / aaa.phases.length) % aaa.cases.length; // 판정된 케이스
      const TONE = {
        point: 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]',
        good: 'border-[#81c784] bg-[#e8f5e9] text-[#1b5e20]',
        mid: 'border-[#81c784] bg-white text-slate-700',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🎬 하나의 테스트가 흐르는 순서</div>
            <div className="flex items-center gap-1.5">
              {aaa.phases.map((p, i) => (
                <React.Fragment key={i}>
                  <div className={`flex-1 rounded border-2 px-2 py-2 text-center transition ${i === activePhase ? TONE[p.tone] + ' scale-105' : 'border-[#81c784] bg-white text-slate-400'}`}>
                    <div className="text-[11px] font-mono font-bold">{p.label}</div>
                    <div className="text-[8px] mt-0.5 leading-tight">{p.desc}</div>
                  </div>
                  {i < aaa.phases.length - 1 && <span className="text-[#339933] font-bold">→</span>}
                </React.Fragment>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🚦 테스트 판정 결과</div>
            <div className="space-y-1.5">
              {aaa.cases.map((c, i) => {
                const revealed = i <= activeCase;
                return (
                  <div key={i} className={`rounded border px-2 py-1.5 flex items-center gap-2 transition ${!revealed ? 'border-[#81c784] bg-white opacity-40' : c.pass ? 'border-[#339933] bg-[#c8e6c9]' : 'border-red-400 bg-red-50'}`}>
                    <span className={`text-[11px] font-bold ${!revealed ? 'text-slate-400' : c.pass ? 'text-[#1b5e20]' : 'text-red-700'}`}>{!revealed ? '…' : c.pass ? '✓ PASS' : '✗ FAIL'}</span>
                    <span className="text-[10px] text-slate-700 flex-1">{c.name}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 모킹으로 의존 격리 (애니메이션)
    // ─────────────────────────────────────────────────────
    function MockView({ mock, tick }) {
      const swapped = tick % 2 === 1; // 진짜↔가짜 전환을 깜빡여 "대체"를 표현
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🎭 검증 대상만 진짜, 나머지는 가짜</div>
            <div className="rounded border-2 border-[#339933] bg-[#c8e6c9] px-2 py-2 mb-2">
              <div className="text-[11px] font-mono font-bold text-[#1b5e20]">{mock.real.name}</div>
              <div className="text-[9px] text-[#1b5e20]/80">{mock.real.note}</div>
            </div>
            <div className="text-[9px] text-slate-500 mb-1">의존하는 것들 ↓</div>
            <div className="space-y-1.5">
              {mock.deps.map((d, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 transition ${d.mocked ? (swapped ? 'border-amber-400 bg-amber-50' : 'border-[#81c784] bg-white') : 'border-[#339933] bg-[#e8f5e9]'}`}>
                  <span className="text-[11px] font-mono font-bold text-slate-700 w-28">{d.name}</span>
                  <span className={`text-[9px] font-bold rounded px-1.5 py-0.5 whitespace-nowrap ${d.mocked ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-[#c8e6c9] text-[#1b5e20] border border-[#339933]'}`}>{d.mocked ? '🎭 mock' : '✅ real'}</span>
                  <span className="text-[9px] text-slate-500 flex-1">{d.note}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-2.5">
            <div className="text-[10px] text-[#1b5e20]">🔎 {mock.assertNote}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — supertest 요청/응답 흐름 (애니메이션)
    // ─────────────────────────────────────────────────────
    function HttpView({ http, tick }) {
      const active = tick % http.steps.length;
      const TONE = {
        point: 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]',
        good: 'border-[#81c784] bg-[#e8f5e9] text-[#1b5e20]',
        mid: 'border-[#81c784] bg-white text-slate-700',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">📡 request(app) → 응답까지</div>
            <div className="space-y-1.5">
              {http.steps.map((s, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className={`text-[10px] font-mono font-bold w-5 text-center ${i <= active ? 'text-[#339933]' : 'text-slate-300'}`}>{i + 1}</span>
                  <div className={`flex-1 rounded border-2 px-2 py-1.5 transition ${i === active ? TONE[s.tone] + ' scale-[1.02]' : i < active ? 'border-[#81c784] bg-[#e8f5e9]' : 'border-[#81c784] bg-white opacity-50'}`}>
                    <div className="text-[10px] font-bold text-[#1b5e20]">{s.label}</div>
                    <div className="text-[9px] font-mono text-slate-600">{s.detail}</div>
                  </div>
                  {i < http.steps.length - 1 && <span className="text-[#339933] text-xs">{i < active ? '↓' : ' '}</span>}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-2.5">
            <div className="text-[10px] text-[#1b5e20]">💡 {http.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — await 있음 vs 누락 비교 (애니메이션)
    // ─────────────────────────────────────────────────────
    function AsyncView({ async: data, tick }) {
      const step = tick % 4; // flow 4단계 진행
      const Lane = ({ lane }) => {
        const bad = lane.tone === 'bad';
        return (
          <div className={`rounded-lg border-2 p-3 ${bad ? 'border-red-300 bg-red-50' : 'border-[#339933] bg-[#e8f5e9]'}`}>
            <div className={`text-[11px] font-bold mb-2 ${bad ? 'text-red-700' : 'text-[#1b5e20]'}`}>{lane.title}</div>
            <div className="flex items-center gap-1">
              {lane.flow.map((f, i) => {
                const done = i <= step;
                const isLast = i === lane.flow.length - 1;
                return (
                  <React.Fragment key={i}>
                    <div className={`flex-1 rounded px-1 py-1.5 text-center text-[8px] font-mono font-bold border transition
                      ${!done ? 'bg-white border-slate-200 text-slate-300'
                        : isLast ? (bad ? 'bg-red-200 border-red-500 text-red-800' : 'bg-[#c8e6c9] border-[#339933] text-[#1b5e20]')
                        : (bad ? 'bg-red-100 border-red-300 text-red-600' : 'bg-white border-[#81c784] text-[#1b5e20]')}`}>
                      {f}
                    </div>
                    {i < lane.flow.length - 1 && <span className={`text-[9px] ${done ? (bad ? 'text-red-400' : 'text-[#339933]') : 'text-slate-300'}`}>→</span>}
                  </React.Fragment>
                );
              })}
            </div>
          </div>
        );
      };
      return (
        <div className="space-y-3">
          {data.compare.map((lane, i) => <Lane key={i} lane={lane} />)}
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[10px] text-red-700">🚨 {data.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 6 — 커버리지 게이지 + 좋은 테스트 3원칙 + 함정 (애니메이션)
    // ─────────────────────────────────────────────────────
    function CoverageView({ coverage, tick }) {
      const grow = Math.min(1, (tick % 5) / 4); // 게이지가 0→목표치까지 차오름
      return (
        <div className="space-y-2.5">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">📊 jest --coverage 리포트</div>
            <div className="space-y-2">
              {coverage.metrics.map((m, i) => {
                const shown = Math.round(m.pct * grow);
                return (
                  <div key={i}>
                    <div className="flex justify-between text-[9px] text-slate-600 mb-0.5">
                      <span className="font-mono">{m.label}</span>
                      <span className="font-mono font-bold text-[#1b5e20]">{shown}%</span>
                    </div>
                    <div className="w-full h-2.5 rounded-full bg-[#e8f5e9] border border-[#81c784] overflow-hidden">
                      <div className="h-full bg-[#339933] transition-all" style={{ width: `${shown}%` }} />
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="mt-1.5 text-[9px] text-slate-500">100%가 버그 0은 아니다 — 핵심 분기·에러 경로를 덮는 게 목적</div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-2.5">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">✅ 좋은 테스트 3원칙</div>
            <div className="flex gap-1.5">
              {coverage.rules.map((r, i) => (
                <div key={i} className="flex-1 rounded border border-[#339933] bg-[#c8e6c9] px-1.5 py-1 text-center">
                  <div className="text-[10px] font-bold text-[#1b5e20]">{r.name}</div>
                  <div className="text-[8px] text-[#1b5e20]/80 leading-tight mt-0.5">{r.desc}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-2.5">
            <div className="text-[11px] font-bold text-red-700 mb-1.5">🚫 실무 함정</div>
            <div className="grid grid-cols-2 gap-1.5">
              {coverage.traps.map((t, i) => (
                <div key={i} className="rounded border border-red-300 bg-white px-1.5 py-1 text-[9px] text-red-600">⛔ {t.text}</div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#e8f5e9]', border: 'border-[#81c784]', text: 'text-[#1b5e20]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-[#c8e6c9]', border: 'border-[#339933]', text: 'text-[#1b5e20]', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Node 그린 톤)
    //   aaa/mock/http/async/coverage 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      jest:     { icon: '🧪', label: 'Jest 기본' },
      aaa:      { icon: '🎬', label: 'AAA 패턴' },
      mock:     { icon: '🎭', label: '모킹' },
      http:     { icon: '📡', label: 'supertest' },
      async:    { icon: '⏳', label: '비동기 함정' },
      coverage: { icon: '📊', label: '커버리지' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.jest;
      const [tick, setTick] = useState(0);

      useEffect(() => {
        const animated = ['aaa', 'mock', 'http', 'async', 'coverage'].includes(state.stage);
        setTick(0);
        if (!animated) return;
        const id = setInterval(() => setTick((t) => t + 1), 800);
        return () => clearInterval(id);
      }, [state.stage]);

      return (
        <div className="rounded-xl border border-[#339933] bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1b5e20] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>테스트 흐름 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#1b5e20] font-mono mb-3 px-2 py-1 rounded bg-[#e8f5e9] border border-[#81c784]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'jest' && <JestView jest={state.jest} />}
          {state.stage === 'aaa' && <AaaView aaa={state.aaa} tick={tick} />}
          {state.stage === 'mock' && <MockView mock={state.mock} tick={tick} />}
          {state.stage === 'http' && <HttpView http={state.http} tick={tick} />}
          {state.stage === 'async' && <AsyncView async={state.async} tick={tick} />}
          {state.stage === 'coverage' && <CoverageView coverage={state.coverage} tick={tick} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-[#339933]/20 border-l-2 border-[#339933] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#339933] text-white font-bold text-xs">Ⅴ. 현장</span>
              <div>
                <h1 className="text-2xl font-bold text-[#1b5e20]"><span className="font-mono text-lg mr-1">V-1-2</span> 테스트 — Jest와 supertest로 API 검증</h1>
                <p className="text-sm text-[#1b5e20]/80">단위 테스트와 HTTP 통합 테스트로 안심하고 배포한다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#1b5e20] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#339933]' : 'bg-green-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#1b5e20] text-green-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-green-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#1b5e20] text-white' : 'bg-[#339933] text-white hover:bg-[#1b5e20]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#1b5e20]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#339933] bg-white px-4 py-3 text-sm text-[#1b5e20]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Jest는 describe·test·expect(매처)로 "기대"를 코드로 못 박는 테스트 러너다. 단위 테스트는 AAA(Arrange·Act·Assert)로 읽기 쉽게 적고, 외부 의존(DB·메일·API)은 jest.fn·jest.mock으로 격리한다.
                supertest는 실제 포트를 열지 않고 Express app에 직접 요청을 보내 상태코드·본문을 검증한다. 비동기 테스트는 반드시 async/await로 — await 누락은 검증이 실행되지 않는 "거짓 통과"를 만든다.
                커버리지는 참고 지표일 뿐, 독립·빠름·명확한 테스트가 진짜 안전망이다. npm test 한 줄로 CI가 배포 전 회귀를 잡는다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Jest', 'describe', 'test', 'expect', 'toBe', 'toEqual', 'AAA', 'beforeEach', 'jest.fn', 'jest.mock', 'supertest', 'req(app)', 'async/await', '커버리지', 'npm test'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-green-100 text-[#1b5e20] border border-green-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1b5e20]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
