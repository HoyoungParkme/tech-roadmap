  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Node.js IV-2-2 — 데이터베이스 연동: 연결·쿼리·풀
    학습 목표: API가 실제 데이터를 저장·조회하는 법을 이해한다.
              ① DB 드라이버(pg)로 연결하고, 매 요청 새 연결이 왜 비싼지,
              ② 연결 풀(pool)이 커넥션을 빌려주고 돌려받는 흐름,
              ③ 파라미터 바인딩($1)이 문자열 연결(인젝션)을 어떻게 막는지,
              ④ CRUD를 async 쿼리로 + 라우트→서비스→저장소 레이어 분리,
              ⑤ 트랜잭션(begin·commit·rollback)으로 부분 실패를 막는 법을 5단계로 본다.
    패턴: fastapi v1 — 좌(LiveDataPane: 연결 풀 대여/반환·바인딩 대비·레이어 흐름·트랜잭션 애니메이션)
                       우(VSCode CodeViewer: pg 드라이버 실전 코드)
    색상: Node 그린 #339933 기조 / 형광펜·배경 채움 연한 그린 #c8e6c9 / 텍스트·링크·배지 다크 그린 #1b5e20
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 연결·왜 풀? → 풀 대여/반환 → 바인딩 vs 문자열연결
    //                 → CRUD + 레이어 분리 → 트랜잭션(commit/rollback)
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   pool/binding/layers/tx 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      connect: {lang:"javascript", filename:"db-connect.js — 단일 연결 (개념 확인용)", lines:[
        "const { Client } = require(\"pg\");",
        "",
        "// 접속 정보는 환경변수로 (코드에 비밀번호 금지)",
        "const client = new Client({",
        "  host: process.env.DB_HOST,",
        "  user: process.env.DB_USER,",
        "  password: process.env.DB_PASSWORD,",
        "  database: process.env.DB_NAME,",
        "});",
        "",
        "async function main() {",
        "  await client.connect();          // 연결 1회 = 수십 ms 비용",
        "  const r = await client.query(\"SELECT NOW()\");",
        "  console.log(r.rows[0]);          // => { now: 2026-08-07T... }",
        "  await client.end();              // 연결 닫기",
        "}",
        "main();",
        "",
        "// 문제: 요청마다 connect/end 를 반복하면",
        "//   쿼리보다 \"연결 준비\"에 시간을 다 쓴다 → 풀이 필요",
      ]},
      pool: {lang:"javascript", filename:"pool.js — 풀에서 빌려 쓰기", lines:[
        "const { Pool } = require(\"pg\");",
        "",
        "// 풀을 앱 전체에서 하나만 만들어 재사용한다",
        "const pool = new Pool({",
        "  host: process.env.DB_HOST,",
        "  user: process.env.DB_USER,",
        "  password: process.env.DB_PASSWORD,",
        "  database: process.env.DB_NAME,",
        "  max: 10,                 // 최대 커넥션 수 (DB 한도 고려)",
        "});",
        "",
        "// (A) 간단한 경우: pool.query — 빌리기·반납 자동",
        "const r = await pool.query(\"SELECT NOW()\");",
        "console.log(r.rows[0]);    // => { now: ... }",
        "",
        "// (B) 직접 꺼내 쓰면 반납은 내 책임",
        "const client = await pool.connect();  // 커넥션 빌리기",
        "try {",
        "  await client.query(\"SELECT 1\");",
        "} finally {",
        "  client.release();        // 반드시 반납 (누락 = 풀 고갈)",
        "}",
      ]},
      binding: {lang:"javascript", filename:"binding.js — 바인딩으로 인젝션 차단", lines:[
        "// ⛔ 절대 금지 — 유저 입력을 문자열로 이어 붙이기",
        "const name = req.query.name;   // 공격자가 조작 가능",
        "const bad = \"SELECT * FROM users WHERE name = '\" + name + \"'\";",
        "await pool.query(bad);",
        "//  name 이 \"'; DROP TABLE users; --\" 이면",
        "//  => 쿼리 구조가 통째로 바뀐다 (SQL 인젝션)",
        "",

        "  const client = await pool.connect();   // 같은 커넥션에서",
        "  try {",
        "    await client.query(\"BEGIN\");         // 트랜잭션 시작",
        "    await client.query(",
        "      \"UPDATE accounts SET balance = balance - $1\"",
        "      + \" WHERE id = $2\", [amount, fromId]);",
        "    await client.query(",
        "      \"UPDATE accounts SET balance = balance + $1\"",
        "      + \" WHERE id = $2\", [amount, toId]);",
        "    await client.query(\"COMMIT\");        // 둘 다 성공 → 확정",
        "    return true;                         // => true",
        "  } catch (err) {",
        "    await client.query(\"ROLLBACK\");      // 하나라도 실패 → 취소",
        "    throw err;",
        "  } finally {",
        "    client.release();                    // 반드시 반납",
        "  }",
        "}",

    const S1 = { title:"Step 1. DB 드라이버로 연결 — 매 요청마다 새 연결은 왜 비싼가", desc:"API가 화면에 뿌리는 데이터는 결국 어딘가의 데이터베이스에 저장돼 있다. Node에서 PostgreSQL을 쓰려면 pg 같은 드라이버가 필요하다 — 드라이버는 앱과 DB 사이에서 TCP 연결을 열고, SQL을 보내고, 결과를 JS 객체로 받아주는 통역사다. 그런데 DB 연결 하나를 새로 여는 일은 생각보다 비싸다. TCP 핸드셰이크, 인증(비밀번호 검증), 세션 셋업까지 수십 ms가 든다. 요청이 올 때마다 연결을 새로 열고 닫으면, 정작 쿼리보다 연결 준비에 시간을 다 쓴다. 접속 정보(호스트·비밀번호)는 코드에 박지 말고 환경변수로 빼야 한다(앞 I-2-2 연계). 그래서 다음 단계의 연결 풀이 등장한다 — 연결을 미리 몇 개 열어두고 재사용하는 것이다." };
    const S2 = { title:"Step 2. 연결 풀(pool) — 커넥션을 빌리고 반드시 돌려준다", desc:"연결 풀은 DB 연결을 미리 여러 개 열어 보관해 두는 창고다. 요청이 오면 창고에서 놀고 있는 커넥션 하나를 빌려(acquire) 쿼리하고, 끝나면 다시 창고에 반납(release)한다 — 연결을 새로 여닫지 않으니 준비 비용이 사라진다. pg에서는 Client 대신 Pool을 쓰고, pool.query()를 부르면 빌리기·반납이 자동으로 처리된다. 직접 커넥션을 꺼내 쓸 때(트랜잭션 등)는 client.release()로 반납을 잊으면 안 된다 — 반납을 빠뜨리면 커넥션이 창고에서 사라져 결국 풀이 고갈되고, 모든 요청이 빈 커넥션을 기다리며 멈춘다. 풀 크기(max)는 무한정 키우지 않는다. DB가 감당할 동시 연결에는 한계가 있어, 앱 인스턴스 수 × 풀 크기가 DB 한도를 넘지 않게 잡는 게 실무 감각이다." };
    const S3 = { title:"Step 3. 파라미터 바인딩 — 문자열 연결은 SQL 인젝션의 문", desc:"유저가 준 값을 SQL에 끼워 넣을 때가 진짜 위험한 순간이다. \"SELECT * FROM users WHERE name = '\" + input + \"'\" 처럼 문자열을 이어 붙이면, 공격자가 입력에 SQL 조각을 심어 쿼리 자체를 바꿔버릴 수 있다(SQL 인젝션). 예컨대 input 에 홑따옴표와 OR 1=1 을 넣으면 조건이 무력화돼 전체 행이 노출된다. 해법은 파라미터 바인딩이다 — 쿼리 문자열에는 $1, $2 같은 자리표시자만 두고, 실제 값은 배열로 따로 넘긴다. 드라이버는 이 값을 SQL 문법이 아니라 순수한 데이터로만 취급하므로, 값 안에 무슨 문자가 있어도 쿼리 구조를 바꾸지 못한다. 규칙은 예외가 없다: 유저 입력이 들어가는 모든 쿼리는 반드시 바인딩을 쓴다. 문자열 연결로 값을 넣는 코드는 리뷰에서 즉시 반려 대상이다." };
    const S4 = { title:"Step 4. CRUD를 DB로 — 라우트→서비스→저장소 레이어 분리", desc:"INSERT·SELECT·UPDATE·DELETE 네 가지 SQL이 곧 생성·조회·수정·삭제(CRUD)다. pg에서는 모두 pool.query(sql, params)로 실행하고 await 로 결과를 기다린다 — 결과의 rows 에 행 배열이, rowCount 에 영향받은 행 수가 담긴다. 중요한 건 이 쿼리들을 아무 데나 흩뿌리지 않는 것이다. 실무에서는 세 겹으로 나눈다: 라우트(HTTP 요청/응답만 담당) → 서비스(업무 규칙·검증) → 저장소(SQL과 DB 접근만). 이렇게 나누면 SQL이 저장소 한 곳에 모여 테스트·교체가 쉽고, 라우트는 DB를 몰라도 된다. DB를 직접 다루기 싫다면 Prisma 같은 ORM이 SQL을 메서드 호출로 감싸주지만(선택지), 내부에서 벌어지는 일은 결국 지금 배우는 이 쿼리들이다 — 원리를 알아야 ORM도 제대로 쓴다." };
    const S5 = { title:"Step 5. 트랜잭션 — begin·commit·rollback으로 부분 실패를 막는다", desc:"여러 쿼리가 \"전부 성공 아니면 전부 취소\"여야 하는 순간이 있다. 계좌 이체가 대표 예다 — A에서 돈을 빼고 B에 더하는데, 빼기만 성공하고 더하기가 실패하면 돈이 증발한다. 트랜잭션은 이 여러 쿼리를 하나의 원자적 묶음으로 만든다. BEGIN 으로 시작해, 모든 쿼리가 성공하면 COMMIT 으로 확정하고, 중간에 하나라도 실패하면 ROLLBACK 으로 전부 없던 일로 되돌린다. 주의할 점: 트랜잭션은 반드시 같은 커넥션에서 실행해야 하므로 pool.query 를 그냥 부르면 안 되고, pool.connect() 로 커넥션을 하나 꺼내 그 위에서 BEGIN·쿼리·COMMIT 을 돌린다. try 안에서 커밋, catch 에서 롤백, finally 에서 release 반납 — 이 세 박자가 정석이다. 트랜잭션을 빠뜨리면 부분 실패가 데이터를 조용히 망가뜨린다." };

        beat:{ label:'커넥션을 하나 빌린다', at:'transfer.js L1–3',
               caption:'트랜잭션은 같은 커넥션에서만 유효하다. 그래서 pool.query 가 아니라 pool.connect() 로 하나를 꺼낸다.',
               changes:[{mark:'new', text:'client — 전용 커넥션'},
                        {mark:'gone', text:'pool.query 로는 불가'}] },
        actor:'🔒 같은 커넥션 확보 — 트랜잭션 준비',
        stage:'tx',
        stageLabel:'트랜잭션용 커넥션 확보',
        tx:{
          ops:['acquire client'],
          note:'트랜잭션은 같은 커넥션에서만 유효하다 — 먼저 하나를 빌린다',
        },
        alert:{ tone:'info', text:'pool.query 는 매번 다른 커넥션을 쓸 수 있어 BEGIN 과 COMMIT 이 서로 다른 연결에서 실행될 수 있다.' },
        code:{...CODE.tx, highlight:[1,2,3]},
      },
      { ...S5,
        beat:{ label:'BEGIN 으로 묶음을 연다', at:'transfer.js L4',
               caption:'BEGIN 이후의 쿼리들이 하나의 원자적 묶음이 된다. 확정 전까지는 밖에서 보이지 않는다.',
               changes:[{mark:'new', text:'열린 트랜잭션'},
                        {mark:'changed', text:'이후 쿼리는 미확정 상태'}] },
        actor:'🔒 BEGIN — 묶음 시작',
        stage:'tx',
        stageLabel:'BEGIN — 트랜잭션 시작',
        tx:{
          ops:['acquire client','BEGIN'],
          note:'BEGIN 이후의 쿼리들이 한 묶음이 된다',
        },
        alert:{ tone:'info', text:'BEGIN 을 부른 커넥션은 반납 전까지 트랜잭션 상태를 유지한다.' },
        code:{...CODE.tx, highlight:[4]},
      },
      { ...S5,
        beat:{ label:'출금 UPDATE', at:'transfer.js L5–7',
               caption:'보내는 계좌에서 금액을 뺀다. 아직 확정 전이라 다른 세션에는 이 변경이 보이지 않는다.',
               changes:[{mark:'changed', text:'A 잔액 −amount (미확정)'},
                        {mark:'read', text:'[amount, fromId] 바인딩'}] },
        actor:'🔒 UPDATE A −50 — 아직 미확정',
        stage:'tx',
        stageLabel:'첫 번째 UPDATE (출금)',
        tx:{
          ops:['acquire client','BEGIN','UPDATE A -50'],
          note:'아직 확정 전 — 다른 세션에는 이 변경이 보이지 않는다',
        },
        alert:{ tone:'warn', text:'여기서 멈추면 돈이 사라진다. 반드시 뒤따르는 입금까지 함께 성공해야 한다.' },
        code:{...CODE.tx, highlight:[5,6,7]},
      },
      { ...S5,
        beat:{ label:'입금 UPDATE', at:'transfer.js L8–10',
               caption:'받는 계좌에 같은 금액을 더한다. 두 UPDATE 가 같은 커넥션·같은 트랜잭션 안에 있다.',
               changes:[{mark:'changed', text:'B 잔액 +amount (미확정)'},
                        {mark:'read', text:'[amount, toId] 바인딩'}] },
        actor:'🔒 UPDATE B +50 — 두 쿼리 모두 미확정',
        stage:'tx',
        stageLabel:'두 번째 UPDATE (입금)',
        tx:{
          ops:['acquire client','BEGIN','UPDATE A -50','UPDATE B +50'],
          note:'둘 다 성공해야 의미가 있다 — 하나만 남으면 돈이 증발한다',
        },
        alert:{ tone:'warn', text:'이 지점에서 예외가 나면 catch 로 빠져 ROLLBACK 이 실행된다.' },
        code:{...CODE.tx, highlight:[8,9,10]},
      },
      { ...S5,
        beat:{ label:'COMMIT 으로 확정', at:'transfer.js L11–12',
               caption:'두 UPDATE 가 모두 성공했으니 COMMIT 으로 확정한다. 이제서야 변경이 밖에 보인다.',
               changes:[{mark:'changed', text:'두 잔액 변경 확정'},
                        {mark:'new', text:'return true'}] },
        actor:'🔒 COMMIT — 변경 확정',
        stage:'tx',
        stageLabel:'COMMIT — 전부 확정',
        tx:{
          ops:['BEGIN','UPDATE A -50','UPDATE B +50','COMMIT'],
          note:'모두 성공 → COMMIT 으로 확정, 이제 다른 세션도 볼 수 있다',
        },
        alert:{ tone:'good', text:'COMMIT 까지 도달해야 비로소 "이체가 끝났다"고 말할 수 있다.' },
        code:{...CODE.tx, highlight:[11,12]},
      },
      { ...S5,
        beat:{ label:'실패하면 ROLLBACK', at:'transfer.js L13–15',
               caption:'중간에 하나라도 실패하면 catch 로 들어와 ROLLBACK 을 부른다. 두 UPDATE 가 모두 없던 일이 된다.',
               changes:[{mark:'gone', text:'두 UPDATE 전부 취소'},
                        {mark:'changed', text:'에러는 위층으로 다시 던짐'}] },
        actor:'🔒 ROLLBACK — 전부 취소',
        stage:'tx',
        stageLabel:'ROLLBACK — 부분 실패 되돌리기',
        tx:{
          ops:['BEGIN','UPDATE A -50','UPDATE B +50','ROLLBACK'],
          note:'하나라도 실패하면 전부 없던 일이 된다 — 부분 실패를 막는 장치',
        },
        alert:{ tone:'danger', text:'catch 에서 ROLLBACK 을 빠뜨리면 커넥션이 열린 트랜잭션째로 반납돼 다음 요청을 오염시킨다.' },
        code:{...CODE.tx, highlight:[13,14,15]},
      },
      { ...S5,
        beat:{ label:'finally 에서 커넥션 반납', at:'transfer.js L16–18',
               caption:'커밋이든 롤백이든 마지막은 release 다. 반납해야 다음 요청이 이 커넥션을 쓸 수 있다.',
               changes:[{mark:'changed', text:'커넥션 창고로 복귀'},
                        {mark:'gone', text:'누수로 인한 풀 고갈'}] },
        actor:'🔒 BEGIN → 쿼리들 → COMMIT / 실패 시 ROLLBACK',
        stage:'tx',
        stageLabel:'트랜잭션 commit / rollback',
        tx:{
          ops:['BEGIN','UPDATE A -50','UPDATE B +50','COMMIT'],
          note:'모두 성공하면 COMMIT 으로 확정, 하나라도 실패하면 ROLLBACK 으로 전부 취소',
        },
        alert:{ tone:'warn', text:'트랜잭션은 같은 커넥션에서만 유효하다 — pool.connect() 로 꺼내 BEGIN·COMMIT 을 돌리고 finally 에서 release. catch 에서 ROLLBACK 을 빠뜨리면 커넥션이 열린 트랜잭션째로 반납돼 다음 요청을 오염시킨다.' },
        code:{...CODE.tx, highlight:[16,17,18]},
      },
    ];

    // ─────────────────────────────────────────────────────
    // Step 1 — 연결 비용 단계 표시 (준비 3단계 + 쿼리)
    // ─────────────────────────────────────────────────────
    function ConnectView({ connect }) {
      const TONE = {
        point: 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]',
        good: 'border-[#81c784] bg-[#e8f5e9] text-[#1b5e20]',
        mid: 'border-[#81c784] bg-white text-slate-700',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🐘 연결 1회에 벌어지는 일</div>
            <div className="space-y-1.5">
              {connect.steps.map((s, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 ${TONE[s.tone]}`}>
                  <span className="text-[10px] font-mono font-bold w-6 text-center">{i + 1}</span>
                  <span className="text-[11px] font-mono font-bold w-32">{s.name}</span>
                  <span className="text-[10px] flex-1">{s.role}</span>
                </div>
              ))}
            </div>
            <div className="mt-2 text-[9px] text-red-600">{connect.costNote}</div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3 text-[10px] text-slate-700">
            요청마다 이 준비를 반복하면 낭비다. 미리 연결을 열어두고 재사용하는
            <span className="font-mono font-bold text-[#1b5e20]"> 연결 풀</span> 이 해답이다. (다음 단계)
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — 연결 풀 대여/반납 애니메이션
    // ─────────────────────────────────────────────────────
    function PoolView({ pool, tick }) {
      const size = pool.size;
      const borrowed = tick % (size + 1);   // 몇 개가 대여 중인지 오르내림
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🏊 연결 풀 — 커넥션 창고</div>
            <div className="flex gap-2 justify-center mb-2">
              {Array.from({ length: size }).map((_, i) => {
                const isBorrowed = i < borrowed;
                return (
                  <div
                    key={i}
                    className={`w-14 h-14 rounded-lg border-2 flex flex-col items-center justify-center text-[9px] font-mono font-bold transition
                      ${isBorrowed
                        ? 'bg-[#c8e6c9] border-[#339933] text-[#1b5e20] scale-105'
                        : 'bg-white border-[#81c784] text-slate-400'}`}
                  >
                    <span className="text-lg">🔌</span>
                    {isBorrowed ? '대여중' : '대기'}
                  </div>
                );
              })}
            </div>
            <div className="flex items-center justify-around text-[10px] font-mono">
              <span className="rounded px-2 py-1 bg-[#e8f5e9] border border-[#81c784] text-[#1b5e20]">acquire ▶ {borrowed}</span>
              <span className="rounded px-2 py-1 bg-white border border-[#81c784] text-slate-500">idle {size - borrowed}</span>
              <span className="rounded px-2 py-1 bg-[#e8f5e9] border border-[#81c784] text-[#1b5e20]">◀ release</span>
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-1">⚠ 반납을 빠뜨리면?</div>
            <div className="text-[10px] text-red-600">빌린 커넥션을 release 하지 않으면 창고가 비어간다 → 결국 풀 고갈 → 모든 요청이 빈 커넥션을 기다리며 멈춘다.</div>
          </div>
          <div className="text-[9px] text-slate-500">{pool.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 문자열 연결 vs 바인딩 대비 애니메이션
    // ─────────────────────────────────────────────────────
    function BindingView({ binding, tick }) {
      const phase = tick % 4;   // 0~1 입력 도착, 2~3 결과
      const attacking = phase >= 2;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-2.5">
            <div className="text-[10px] text-slate-600 mb-1">공격자가 넣은 입력값</div>
            <code className="text-[11px] font-mono font-bold text-red-700 break-all">{binding.evil}</code>
          </div>

          {/* 위험 레인 */}
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-1.5">⛔ {binding.lanes[0].title}</div>
            <div className="text-[10px] font-mono text-slate-600">
              "... WHERE name = '" + input + "'"
            </div>
            <div className={`mt-2 rounded px-2 py-1.5 text-[10px] font-mono border transition
              ${attacking ? 'bg-red-200 border-red-500 text-red-800 scale-105' : 'bg-white border-red-200 text-slate-400'}`}>
              {attacking ? '💥 쿼리 구조가 바뀜 → users 테이블 삭제 위험' : '입력이 SQL 문법으로 섞여 들어간다…'}
            </div>
          </div>

          {/* 안전 레인 */}
          <div className="rounded-lg border-2 border-[#339933] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">✅ {binding.lanes[1].title}</div>
            <div className="text-[10px] font-mono text-slate-600">
              "... WHERE name = $1", [input]
            </div>
            <div className={`mt-2 rounded px-2 py-1.5 text-[10px] font-mono border transition
              ${attacking ? 'bg-[#c8e6c9] border-[#339933] text-[#1b5e20] scale-105' : 'bg-white border-[#81c784] text-slate-400'}`}>
              {attacking ? '🛡 input 은 "값"으로만 취급 → 구조 변경 불가, 안전' : '값과 SQL을 분리해서 전달…'}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 레이어 흐름 애니메이션 + CRUD 매핑
    // ─────────────────────────────────────────────────────
    function LayersView({ layers, tick }) {
      const TONE = {
        point: 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]',
        good: 'border-[#339933] bg-[#e8f5e9] text-[#1b5e20]',
        mid: 'border-[#81c784] bg-white text-slate-700',
      };
      const active = tick % layers.nodes.length;   // 흐름이 아래로 흘러감
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🧱 요청이 흐르는 길</div>
            <div className="space-y-1.5">
              {layers.nodes.map((n, i) => (
                <div key={i}>
                  <div className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 transition
                    ${i === active ? TONE[n.tone] + ' scale-105' : 'border-[#81c784] bg-white text-slate-500'}`}>
                    <span className="text-[11px] font-mono font-bold w-28">{n.name}</span>
                    <span className="text-[10px] flex-1">{n.role}</span>
                    {i === active ? <span className="text-[10px]">▶</span> : null}
                  </div>
                  {i < layers.nodes.length - 1 ? (
                    <div className="text-center text-[#339933] text-xs leading-none">↓</div>
                  ) : null}
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🔤 CRUD ↔ SQL</div>
            <div className="grid grid-cols-2 gap-1.5">
              {layers.crud.map((c, i) => (
                <div key={i} className="rounded border border-[#81c784] bg-white px-2 py-1">
                  <div className="text-[10px] font-bold text-[#1b5e20]">{c.op}</div>
                  <div className="text-[9px] font-mono text-slate-500">{c.sql}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 트랜잭션 진행 + commit/rollback 애니메이션
    // ─────────────────────────────────────────────────────
    function TxView({ tx, tick }) {
      const total = tx.ops.length;
      // 6틱 주기: 0..3 정상 진행 → 4 실패 → 5 롤백
      const phase = tick % 6;
      const failMode = phase === 4 || phase === 5;
      const progress = failMode ? 2 : Math.min(phase, total - 1);
      const rolledBack = phase === 5;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🔒 트랜잭션 — 전부 성공 아니면 전부 취소</div>
            <div className="space-y-1.5">
              {tx.ops.map((op, i) => {
                const done = i < progress;
                const now = i === progress && !failMode;
                const isCommit = op === 'COMMIT';
                const active = done || now;
                return (
                  <div
                    key={i}
                    className={`rounded border-2 px-2 py-1.5 text-[11px] font-mono font-bold flex items-center gap-2 transition
                      ${rolledBack
                        ? 'bg-red-50 border-red-300 text-red-500 line-through'
                        : active
                          ? (isCommit ? 'bg-[#c8e6c9] border-[#339933] text-[#1b5e20] scale-105' : 'bg-[#e8f5e9] border-[#81c784] text-[#1b5e20]')
                          : 'bg-white border-[#81c784] text-slate-400'}`}
                  >
                    <span className="w-5 text-center">{rolledBack ? '↩' : active ? '✓' : '·'}</span>
                    <span>{op}</span>
                  </div>
                );
              })}
            </div>
          </div>
          <div className={`rounded-lg border-2 p-3 transition ${rolledBack ? 'border-red-300 bg-red-50' : 'border-[#339933] bg-[#c8e6c9]'}`}>
            <div className={`text-[11px] font-bold ${rolledBack ? 'text-red-700' : 'text-[#1b5e20]'}`}>
              {rolledBack ? '↩ ROLLBACK — 전부 없던 일로 (부분 실패 방지)' : failMode ? '⚠ 두 번째 UPDATE 실패 감지…' : '✅ COMMIT — 변경 확정'}
            </div>
          </div>
          <div className="text-[9px] text-slate-500">{tx.note}</div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#e8f5e9]', border: 'border-[#81c784]', text: 'text-[#1b5e20]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-[#c8e6c9]', border: 'border-[#339933]', text: 'text-[#1b5e20]', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Node 그린 톤)
    //   pool/binding/layers/tx 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      connect:  { icon: '🐘', label: 'DB 연결·비용' },
      pool:     { icon: '🏊', label: '연결 풀' },
      binding:  { icon: '🛡', label: '파라미터 바인딩' },
      layers:   { icon: '🧱', label: 'CRUD · 레이어' },
      tx:       { icon: '🔒', label: '트랜잭션' },
    };

    function LiveDataPane({ beat, state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.connect;
      const [tick, setTick] = useState(0);

      useEffect(() => {
        const animated = state.stage === 'pool' || state.stage === 'binding'
          || state.stage === 'layers' || state.stage === 'tx';
        setTick(0);
        if (!animated) return;
        const id = setInterval(() => setTick((t) => t + 1), 700);
        return () => clearInterval(id);
      }, [state.stage]);

      return (
        <div className="rounded-xl border border-[#339933] bg-white p-4 h-full flex flex-col">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1b5e20] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>DB 연동 원리 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#1b5e20] font-mono mb-3 px-2 py-1 rounded bg-[#e8f5e9] border border-[#81c784]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'connect' && <ConnectView connect={state.connect} />}
          {state.stage === 'pool' && <PoolView pool={state.pool} tick={tick} />}
          {state.stage === 'binding' && <BindingView binding={state.binding} tick={tick} />}
          {state.stage === 'layers' && <LayersView layers={state.layers} tick={tick} />}
          {state.stage === 'tx' && <TxView tx={state.tx} tick={tick} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-[#339933]/20 border-l-2 border-[#339933] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#339933] text-white font-bold text-xs">Ⅳ. 서버 개발</span>
              <div>
                <h1 className="text-2xl font-bold text-[#1b5e20]"><span className="font-mono text-lg mr-1">IV-2-2</span> 데이터베이스 연동 — 연결·쿼리·풀</h1>
                <p className="text-sm text-[#1b5e20]/80">API가 실제 데이터를 저장하고 읽는 법, 연결 풀과 async 쿼리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#1b5e20] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#339933]' : 'bg-green-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#1b5e20] text-green-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-green-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#1b5e20] text-white' : 'bg-[#339933] text-white hover:bg-[#1b5e20]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#1b5e20]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#339933] bg-white px-4 py-3 text-sm text-[#1b5e20]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Node에서 DB를 쓰려면 드라이버(pg)로 연결하는데, 연결 1회는 수십 ms로 비싸므로 연결 풀(Pool)로 미리 열어두고 빌려·반납해 재사용한다.
                직접 꺼낸 커넥션은 finally 에서 release 를 잊으면 풀이 고갈된다.
                유저 입력이 들어가는 쿼리는 예외 없이 파라미터 바인딩($1)을 쓴다 — 문자열 연결은 SQL 인젝션의 문이다.
                CRUD 쿼리는 저장소에 모으고 라우트→서비스→저장소로 레이어를 나눈다. 여러 쿼리가 전부 성공/전부 취소여야 하면 트랜잭션(BEGIN·COMMIT·ROLLBACK)으로 묶는다. ORM(Prisma 등)은 선택지지만 내부 원리는 동일하다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['pg', '드라이버', '연결풀', 'Pool', 'acquire', 'release', '풀고갈', '파라미터바인딩', 'SQL인젝션', 'CRUD', 'async쿼리', '레이어분리', 'repository', '트랜잭션', 'COMMIT', 'ROLLBACK', 'ORM'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-green-100 text-[#1b5e20] border border-green-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1b5e20]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="underline hover:no-underline">다음: V-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
