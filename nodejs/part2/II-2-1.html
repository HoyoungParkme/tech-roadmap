  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    Node.js II-2-1 — async/await: 동기처럼 쓰는 비동기
    학습 목표: async 함수가 Promise를 반환하고 await가 "완료까지 기다림"(블로킹이 아니라 루프 양보)이라는 것,
              try/catch로 비동기 에러를 동기처럼 잡는 법, 순차 await 남발이 왜 느려지고
              Promise.all 병렬로 어떻게 줄이는지, for await...of·최상위 await·async 화살표,
              그리고 실무 4대 함정(await 빼먹음·반복문 순차·try/catch 범위·병렬로 묶을 것)을 5단계로 뜯어본다.
    패턴: fastapi v1 — 좌(LiveDataPane: await 멈춤/재개, 순차 vs 병렬 실행시간 대비 애니메이션)
                       우(VSCode CodeViewer: async/await 예제 코드)
    색상: Node 그린 #339933 기조 / 형광펜·배경 채움 연한 그린 #c8e6c9 / 텍스트·링크·배지 다크 그린 #1b5e20
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — async·await 기본 → 에러 처리 → 순차 vs 병렬 → 패턴 → 함정
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   basic/error/parallel 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. async는 Promise를 반환, await는 "완료까지 기다림" — 블로킹은 아니다',
        desc: 'async를 붙인 함수는 무엇을 return하든 그 값을 감싼 Promise를 돌려준다. 그 안에서 await는 뒤에 오는 Promise가 완료(resolve)될 때까지 함수 실행을 그 줄에서 잠시 멈춰 세운다. 여기서 핵심 오해를 짚자 — 이 "멈춤"은 스레드를 붙드는 블로킹이 아니다. await를 만나면 함수는 남은 실행을 마이크로태스크로 예약해 두고 제어권을 이벤트 루프에 양보하며, 그 사이 루프는 다른 요청·타이머·I/O 콜백을 계속 처리한다. 결과가 도착하면 멈췄던 지점부터 값을 받아 재개한다. 그래서 코드는 위에서 아래로 읽히는 동기 모양이지만, 실제로는 논블로킹으로 굴러간다 — 이것이 async/await가 "Promise 위의 문법 설탕"이라 불리는 이유다.',
        actor: '⏸ 실행 → await에서 양보 → ▶ 결과 도착 시 재개',
        stage: 'basic',
        stageLabel: 'async 반환 · await 멈춤/재개',
        basic: {
          fnName: 'loadUser()',
          phases: [
            { label: '① 함수 시작 — 동기 코드 실행', tone: 'run', note: 'async loadUser() 진입' },
            { label: '② await fetchUser() — 여기서 멈춤', tone: 'wait', note: '남은 코드를 예약하고 루프에 양보(블로킹 아님)' },
            { label: '③ 루프는 그동안 다른 일 처리', tone: 'yield', note: '타이머·다른 요청·I/O 콜백이 계속 돈다' },
            { label: '④ 결과 도착 → 멈춘 곳부터 재개', tone: 'resume', note: 'user 값을 받아 다음 줄 실행' },
            { label: '⑤ return user → Promise로 감싸 반환', tone: 'done', note: '호출부는 await loadUser()로 값 수신' },
          ],
        },
        alert: { tone: 'info', text: 'async 함수의 반환값은 항상 Promise다. 그래서 loadUser()를 호출한 쪽도 await(또는 .then)로 받아야 실제 값을 얻는다. await의 "기다림"은 스레드를 세우는 게 아니라 이벤트 루프에 순서를 양보하는 것이다.' },
        code: {
          lang: 'javascript',
          filename: 'load-user.js — async 함수와 await',
          lines: [
            '// async 함수는 return 값을 Promise 로 감싸 반환한다',
            'async function loadUser(id) {',
            '  console.log("1) 시작");',
            '  // await: fetchUser 가 끝날 때까지 이 줄에서 멈춘다',
            '  //        (스레드를 붙드는 게 아니라 루프에 양보)',
            '  const user = await fetchUser(id);',
            '  console.log("3) 결과 도착, 재개");',
            '  return user;              // => Promise<User> 로 감싸짐',
            '}',
            '',
            'console.log("0) 호출 직전");',
            'const p = loadUser(7);      // => Promise 즉시 반환',
            'console.log("2) 호출 직후");// await 안 기다리고 바로 실행',
            '',
            'const user = await p;       // 여기서 실제 값 수신',
            '// => 0) → 1) → 2) → (fetch 완료) → 3)',
            '//    2)가 3)보다 먼저! await 지점에서 양보했다는 증거',
          ],
          highlight: [1, 5, 7, 11, 14],
        },
      },
      {
        title: 'Step 2. try/catch로 비동기 에러를 동기처럼 — reject는 예외로 던져진다',

    // ─────────────────────────────────────────────────────
    // Step 1 — await 멈춤/재개 타임라인 (애니메이션)
    //   tick 이 현재 활성 phase 를 지나가며 "멈춤→양보→재개" 를 보여준다.
    // ─────────────────────────────────────────────────────
    function BasicView({ basic, tick }) {
      const TONE = {
        run:    'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]',
        wait:   'border-amber-400 bg-amber-50 text-amber-800',
        yield:  'border-[#81c784] bg-[#e8f5e9] text-[#1b5e20]',
        resume: 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]',
        done:   'border-[#1b5e20] bg-[#1b5e20] text-[#c8e6c9]',
      };
      const active = tick % basic.phases.length;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">⏸▶ {basic.fnName} 실행 타임라인</div>
            <div className="space-y-1.5">
              {basic.phases.map((p, i) => {
                const isNow = i === active;
                const passed = i < active;
                return (
                  <div
                    key={i}
                    className={`rounded border-2 px-2 py-1.5 transition
                      ${isNow ? `${TONE[p.tone]} scale-[1.02] shadow` : passed ? 'border-[#81c784] bg-white text-slate-400' : 'border-slate-200 bg-white text-slate-500'}`}
                  >
                    <div className="text-[11px] font-mono font-bold flex items-center gap-1">
                      {p.label}{isNow ? ' ◀' : passed ? ' ✓' : ''}
                    </div>
                    <div className={`text-[9px] ${isNow && p.tone === 'done' ? 'text-[#c8e6c9]' : 'text-slate-500'}`}>{p.note}</div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1">🧵 이벤트 루프 관점</div>
            <div className="text-[10px] text-slate-700">
              await 지점에서 함수는 <span className="font-mono font-bold text-amber-700">멈추지만</span> 스레드는 <span className="font-mono font-bold text-[#1b5e20]">놀지 않는다</span> —
              루프는 그 틈에 다른 요청·타이머를 처리하고, 결과가 오면 멈춘 곳부터 <span className="font-mono font-bold text-[#1b5e20]">재개</span>한다.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — try/catch/finally 흐름 (애니메이션)
    // ─────────────────────────────────────────────────────
    function ErrorView({ error, tick }) {
      const TONE = {
        try:     'border-[#339933] bg-white text-[#1b5e20]',
        await:   'border-[#81c784] bg-[#e8f5e9] text-[#1b5e20]',
        throw:   'border-red-400 bg-red-50 text-red-700',
        catch:   'border-amber-400 bg-amber-50 text-amber-800',
        finally: 'border-[#1b5e20] bg-[#c8e6c9] text-[#1b5e20]',
      };
      const active = tick % error.steps.length;
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🧯 비동기 에러가 catch 로 흐르는 길</div>
            <div className="space-y-1.5">
              {error.steps.map((s, i) => {
                const isNow = i === active;
                return (
                  <div key={i} className="flex items-center gap-2">
                    <span className={`text-[9px] w-4 text-right font-mono ${isNow ? 'text-[#1b5e20] font-bold' : 'text-slate-400'}`}>{i + 1}</span>
                    <div
                      className={`flex-1 rounded border-2 px-2 py-1.5 transition
                        ${isNow ? `${TONE[s.tone]} scale-[1.02] shadow` : 'border-slate-200 bg-white text-slate-400'}`}
                    >
                      <span className="text-[11px] font-mono font-bold">{s.label}</span>
                      <span className="text-[9px] ml-2">{isNow ? s.note : ''}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          <div className="rounded-lg border-2 border-red-300 bg-red-50 p-3">
            <div className="text-[11px] font-bold text-red-700 mb-1">⚠️ 잡히지 않은 reject</div>
            <div className="text-[10px] text-slate-700">
              await 한 Promise 가 reject됐는데 try 밖이면 <span className="font-mono font-bold text-red-600">unhandledRejection</span> —
              최신 Node는 프로세스를 <span className="font-bold">종료</span>시킨다. 위험한 await 는 반드시 try 안에.
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — 순차 vs 병렬 실행시간 대비 (애니메이션, 핵심)
    //   공유 타임라인(0~900ms) 위에서 sweep 시계가 흐르고,
    //   순차 레인은 작업을 이어 붙여 900ms에, 병렬 레인은 400ms에 끝난다.
    // ─────────────────────────────────────────────────────
    function ParallelView({ parallel, tick }) {
      const { tasks, totalMs, maxMs, scaleMax } = parallel;
      const CYCLE = 10;                         // 10틱에 한 바퀴
      const clockMs = (tick % (CYCLE + 1)) / CYCLE * scaleMax;  // 0 → 900ms 흐르는 시계
      const pct = (ms) => (ms / scaleMax) * 100;

      // 순차: 작업을 앞에서부터 누적 배치
      let acc = 0;
      const seqSegs = tasks.map((t) => {
        const start = acc; acc += t.ms;
        return { ...t, start, end: acc };
      });

      const SEG_TONE = ['bg-[#339933]', 'bg-[#66bb6a]', 'bg-[#2e7d32]'];

      const Sweep = () => (
        <div
          className="absolute top-0 bottom-0 w-0.5 bg-red-500 z-10"
          style={{ left: `${pct(clockMs)}%`, transition: 'left .35s linear' }}
        />
      );

      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="flex items-center justify-between mb-1">
              <span className="text-[11px] font-bold text-[#1b5e20]">⏱ 공유 타임라인 (0 → {scaleMax}ms)</span>
              <span className="text-[10px] font-mono text-red-600">now ≈ {Math.round(clockMs)}ms</span>
            </div>

            {/* 순차 레인 */}
            <div className="text-[10px] font-bold text-red-700 mt-2 mb-1">🐢 순차 (await 한 줄씩) — 합산</div>
            <div className="relative h-7 rounded bg-white border border-slate-300 overflow-hidden flex">
              <Sweep />
              {seqSegs.map((s, i) => (
                <div
                  key={i}
                  className={`h-full flex items-center justify-center text-[8px] font-mono font-bold text-white border-r border-white/60 ${SEG_TONE[i]}`}
                  style={{ width: `${pct(s.ms)}%` }}
                  title={`${s.name} ${s.ms}ms`}
                >{s.name}</div>
              ))}
              <div className="flex-1 h-full bg-slate-100" />
            </div>
            <div className="text-[9px] text-red-600 mt-0.5">완료 = {totalMs}ms (300 + 200 + 400 전부 더해짐)</div>

            {/* 병렬 레인 */}
            <div className="text-[10px] font-bold text-[#1b5e20] mt-3 mb-1">⚡ 병렬 (Promise.all) — 가장 느린 것만</div>
            <div className="relative rounded bg-white border border-slate-300 overflow-hidden p-1 space-y-1">
              <Sweep />
              {tasks.map((t, i) => (
                <div key={i} className="h-4 flex items-center">
                  <div
                    className={`h-full rounded-sm flex items-center justify-center text-[8px] font-mono font-bold text-white ${SEG_TONE[i]}`}
                    style={{ width: `${pct(t.ms)}%` }}
                  >{t.name} {t.ms}ms</div>
                </div>
              ))}
            </div>
            <div className="text-[9px] text-[#1b5e20] mt-0.5">완료 = {maxMs}ms (동시 출발 → fetchTags 400ms 에서 끝)</div>
          </div>

          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="flex items-center justify-between">
              <span className="text-[11px] font-bold text-red-700">순차 {totalMs}ms</span>
              <span className="text-[11px] font-bold text-[#1b5e20]">→ 병렬 {maxMs}ms</span>
              <span className="text-[11px] font-bold text-[#1b5e20] bg-[#c8e6c9] border border-[#339933] rounded px-2 py-0.5">
                {Math.round((1 - maxMs / totalMs) * 100)}% 단축
              </span>
            </div>
            <div className="text-[9px] text-slate-600 mt-1">서로 독립인 호출만 묶어라 — 뒤가 앞 결과를 쓰면 순차가 맞다.</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 실전 문법 3종 카드 (정적)
    // ─────────────────────────────────────────────────────
    function PatternsView({ patterns }) {
      const TONE = {
        point: 'border-[#339933] bg-[#c8e6c9]',
        good:  'border-[#81c784] bg-[#e8f5e9]',
        mid:   'border-[#81c784] bg-white',
      };
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🧩 자주 쓰는 async 문법 3종</div>
            <div className="space-y-2">
              {patterns.items.map((it, i) => (
                <div key={i} className={`rounded border-2 px-2.5 py-2 ${TONE[it.tone]}`}>
                  <div className="text-[11px] font-mono font-bold text-[#1b5e20]">{it.name}</div>
                  <div className="text-[10px] text-slate-700 mt-0.5">{it.use}</div>
                  <div className="text-[10px] font-mono text-[#1b5e20] mt-1 px-2 py-1 rounded bg-white/70 border border-[#81c784]">{it.ex}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="rounded-lg border-2 border-amber-300 bg-amber-50 p-3">
            <div className="text-[11px] font-bold text-amber-800 mb-1">⚠️ map + async 주의</div>
            <div className="text-[10px] text-slate-700">{patterns.note}</div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 4대 함정 (잘못된 코드 vs 교정, 정적)
    // ─────────────────────────────────────────────────────
    function PitfallsView({ pitfalls }) {
      return (
        <div className="space-y-2">
          {pitfalls.items.map((it, i) => (
            <div key={i} className="rounded-lg border-2 border-slate-300 bg-white p-2.5">
              <div className="text-[11px] font-bold text-red-700 mb-1.5">🚧 {it.bad}</div>
              <div className="rounded border border-red-300 bg-red-50 px-2 py-1 text-[10px] font-mono text-red-700 mb-1">
                ❌ {it.badNote}
              </div>
              <div className="rounded border border-[#339933] bg-[#c8e6c9] px-2 py-1 text-[10px] font-mono text-[#1b5e20]">
                ✅ {it.good}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#e8f5e9]', border: 'border-[#81c784]', text: 'text-[#1b5e20]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-[#c8e6c9]', border: 'border-[#339933]', text: 'text-[#1b5e20]', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Node 그린 톤)
    //   basic/error/parallel 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      basic:    { icon: '⏸▶', label: 'await 멈춤/재개' },
      error:    { icon: '🧯', label: 'try/catch' },
      parallel: { icon: '⚡', label: '순차 vs 병렬' },
      patterns: { icon: '🧩', label: '실전 문법' },
      pitfalls: { icon: '🚧', label: '실무 함정' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.basic;
      const [tick, setTick] = useState(0);

      useEffect(() => {
        const animated = state.stage === 'basic' || state.stage === 'error' || state.stage === 'parallel';
        setTick(0);
        if (!animated) return;
        const id = setInterval(() => setTick((t) => t + 1), 700);
        return () => clearInterval(id);
      }, [state.stage]);

      return (
        <div className="rounded-xl border border-[#339933] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1b5e20] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>async/await 동작 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#1b5e20] font-mono mb-3 px-2 py-1 rounded bg-[#e8f5e9] border border-[#81c784]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'basic' && <BasicView basic={state.basic} tick={tick} />}
          {state.stage === 'error' && <ErrorView error={state.error} tick={tick} />}
          {state.stage === 'parallel' && <ParallelView parallel={state.parallel} tick={tick} />}
          {state.stage === 'patterns' && <PatternsView patterns={state.patterns} />}
          {state.stage === 'pitfalls' && <PitfallsView pitfalls={state.pitfalls} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-[#339933]/20 border-l-2 border-[#339933] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#339933] text-white font-bold text-xs">Ⅱ. 비동기</span>
              <div>
                <h1 className="text-2xl font-bold text-[#1b5e20]"><span className="font-mono text-lg mr-1">II-2-1</span> async/await — 동기처럼 쓰는 비동기</h1>
                <p className="text-sm text-[#1b5e20]/80">Promise 위의 문법 설탕, try/catch와 병렬 처리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#1b5e20] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#339933]' : 'bg-green-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#1b5e20] text-green-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-green-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#1b5e20] text-white' : 'bg-[#339933] text-white hover:bg-[#1b5e20]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#1b5e20]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#339933] bg-white px-4 py-3 text-sm text-[#1b5e20]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                async 함수는 Promise를 반환하고, await는 그 완료까지 함수를 멈추되 스레드는 붙들지 않고 이벤트 루프에 양보한다(논블로킹).
                비동기 에러는 try/catch로 동기처럼 잡고, 정리 코드는 finally에 둔다.
                서로 독립인 호출을 한 줄씩 await하면 시간이 누적되므로 Promise.all로 묶어 가장 느린 하나로 줄인다.
                for await...of·최상위 await(ESM)·async 화살표를 상황에 맞게 쓰고, 4대 함정(await 누락·반복문 순차·try 범위·미병렬)을 피한다.
                다음 장 II-2-2에서 Promise 조합기(all·race·allSettled·any)를 더 깊게 다룬다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['async', 'await', 'Promise', '논블로킹', 'try/catch', 'finally', 'Promise.all', '순차vs병렬', 'for await...of', '최상위await', 'ESM', 'unhandledRejection'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-green-100 text-[#1b5e20] border border-green-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1b5e20]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
