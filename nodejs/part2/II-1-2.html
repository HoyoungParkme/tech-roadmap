  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    /* 주제 액센트의 연한 배경 워시만 종이존으로 — 진한 의미색(배지/버튼/다이어그램)은 보존 */
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>

  <!--
    Node.js II-1-2 — Promise: 비동기의 표준
    학습 목표: 콜백 지옥을 푸는 Promise 객체의 3상태(pending→fulfilled/rejected),
              then/catch/finally 체이닝과 에러 전파, 조합기(all·allSettled·race·any)의 차이와 용도,
              util.promisify 로 콜백 API를 Promise로 감싸기, 그리고 실무 3대 함정
              (catch 누락 · then 안 return 빠뜨림 · 병렬 가능한데 순차)을 5단계로 뜯어본다.
    패턴: fastapi v1 — 좌(LiveDataPane: 상태 전이·체인 흐름·병렬 대기·promisify·함정 애니메이션)
                       우(VSCode CodeViewer: JavaScript Promise 예제)
    색상: Node 그린 #339933 기조 / 형광펜·배경 채움 연한 그린 #c8e6c9 / 텍스트·링크·배지 다크 그린 #1b5e20
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — 3상태 → 체이닝 → 조합 → promisify → 실무 함정
    //   각 STEP = { title, desc, stage, 좌측 패널 데이터, 우측 code }
    //   states/chain/combine/pitfall 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    const STEPS = [
      {
        title: 'Step 1. Promise의 3상태 — pending에서 fulfilled 또는 rejected로 딱 한 번',
        desc: 'Promise는 "지금은 없지만 나중에 생길 값"을 담는 그릇이다. 콜백이 함수를 인자로 넘겨 결과를 받는 방식이었다면, Promise는 결과를 값처럼 반환해 변수에 담고 넘길 수 있게 한다. 상태는 셋뿐이다 — 아직 결과가 안 나온 pending, 성공으로 값을 확정한 fulfilled, 실패로 이유를 확정한 rejected. 핵심 규칙은 "한 번 확정되면 다시는 바뀌지 않는다(불변)"는 것 — resolve나 reject 중 먼저 호출된 하나만 유효하고 나머지는 무시된다. new Promise 의 executor 함수는 성공 시 resolve(값), 실패 시 reject(이유)를 부른다. 이 불변성 덕분에 결과를 안심하고 여러 곳에 전달할 수 있다.',
        actor: '🔮 pending → fulfilled / rejected · 한 번 확정되면 불변',
        stage: 'states',
        stageLabel: 'Promise의 3상태',
        states: {
          note: 'executor 안에서 resolve() 또는 reject() 를 먼저 부른 쪽으로 딱 한 번 확정된다',
        },
        alert: { tone: 'info', text: 'Promise는 값을 "반환"하므로 변수에 담아 함수 밖으로 넘길 수 있다 — 콜백처럼 안으로만 파고들지 않는다. 확정은 단 한 번, 이후 상태는 불변. 다음 단계에서 이 값을 then 으로 이어받는다.' },
        code: {
          lang: 'javascript',
          filename: 'promise-basics.js — new Promise 로 3상태 만들기',
          lines: [
            '// Promise 는 "나중에 생길 값"을 담는 그릇이다',
            'const p = new Promise((resolve, reject) => {',
            '  // executor: 여기서 비동기 작업을 하고',
            '  const ok = Math.random() > 0.5;',
            '  if (ok) resolve("데이터 준비 완료");   // 성공 → fulfilled',
            '  else    reject(new Error("실패했다"));  // 실패 → rejected',
            '  // 둘 중 "먼저 부른 하나"만 유효, 나머지는 무시된다',
            '});',
            '',
            'console.log(p);            // => Promise { <pending> }',
            '// 잠시 뒤 확정되면 상태가 바뀐다 (그리고 다시는 안 바뀜)',
            '',
            'p.then((v) => console.log("성공:", v))    // fulfilled 처리',
            ' .catch((e) => console.log("실패:", e.message)); // rejected 처리',
            '// => 성공: 데이터 준비 완료   또는   실패: 실패했다',
          ],
          highlight: [1, 4, 5, 6],
        },
      },
      {
        title: 'Step 2. then / catch / finally 체이닝 — 값은 흐르고 에러는 한 곳으로 점프',

    // ─────────────────────────────────────────────────────
    // Step 1 — Promise 3상태 전이 (애니메이션)
    //   pending 에서 fulfilled 또는 rejected 로 확정되는 과정을 반복 재생
    // ─────────────────────────────────────────────────────
    function StatesView({ states, tick }) {
      // 사이클: 0=pending, 1=pending, 2=확정(성공/실패 번갈아)
      const phase = tick % 3;
      const settled = phase === 2;
      const isFulfilled = Math.floor(tick / 3) % 2 === 0; // 확정 시 성공/실패 번갈아
      const pendingOn = !settled;
      const fulfilledOn = settled && isFulfilled;
      const rejectedOn = settled && !isFulfilled;
      const Box = ({ on, base, title, sub, icon }) => (
        <div className={`flex-1 rounded-lg border-2 px-2 py-3 text-center transition ${on ? base + ' scale-105' : 'border-slate-300 bg-white opacity-50'}`}>
          <div className="text-2xl mb-1">{icon}</div>
          <div className="text-[11px] font-mono font-bold">{title}</div>
          <div className="text-[9px] mt-0.5">{sub}</div>
        </div>
      );
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🔮 상태 전이 — 확정은 단 한 번</div>
            <div className="flex items-stretch gap-2">
              <Box on={pendingOn} base="border-[#81c784] bg-[#e8f5e9] text-[#1b5e20]"
                   title="pending" sub={pendingOn ? '대기 중… ⏳' : '대기'} icon="⏳" />
              <div className="flex flex-col items-center justify-center text-[#339933] font-bold">
                <span className="text-lg">→</span>
              </div>
              <div className="flex-1 flex flex-col gap-2">
                <Box on={fulfilledOn} base="border-[#339933] bg-[#c8e6c9] text-[#1b5e20]"
                     title="fulfilled" sub="resolve(값)" icon="✅" />
                <Box on={rejectedOn} base="border-red-400 bg-red-50 text-red-700"
                     title="rejected" sub="reject(이유)" icon="❌" />
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500">{states.note}</div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🧾 확정 로그</div>
            <div className="font-mono text-[10px] space-y-0.5">
              <div className="text-slate-600">new Promise(...)  →  <span className="text-[#1b5e20] font-bold">pending</span></div>
              <div className={fulfilledOn ? 'text-[#1b5e20] font-bold' : rejectedOn ? 'text-red-600 font-bold' : 'text-slate-400'}>
                {settled ? (isFulfilled ? 'resolve("데이터")  →  fulfilled ✅' : 'reject(Error)  →  rejected ❌') : '…확정 대기 중…'}
              </div>
              <div className="text-slate-400">이후 상태 변경 시도  →  무시됨 (불변)</div>
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 2 — then 체인 흐름 + 에러 점프 (애니메이션)
    // ─────────────────────────────────────────────────────
    function ChainView({ chain, tick }) {
      const N = chain.steps.length;
      // 사이클 길이 = N(정상 흐름) + 1(에러 시나리오)
      const cycle = tick % (N + 2);
      const errorRun = Math.floor(tick / (N + 2)) % 2 === 1; // 한 사이클은 정상, 다음은 에러
      const errAt = 1; // 에러는 두 번째 단계에서 발생
      const pos = cycle;
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">
              ⛓ {errorRun ? '에러 흐름 — catch 로 점프' : '정상 흐름 — 값이 then 을 타고 흐름'}
            </div>
            <div className="space-y-1.5">
              {chain.steps.map((s, i) => {
                const reached = i < pos;
                const active = i === pos;
                const skipped = errorRun && i > errAt && reached;
                const failed = errorRun && i === errAt && reached;
                let cls = 'border-[#81c784] bg-white text-slate-500';
                if (failed) cls = 'border-red-400 bg-red-50 text-red-700';
                else if (skipped) cls = 'border-slate-300 bg-white text-slate-400 line-through opacity-60';
                else if (active) cls = 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20] scale-[1.02]';
                else if (reached) cls = 'border-[#339933] bg-[#e8f5e9] text-[#1b5e20]';
                return (
                  <div key={i} className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 transition ${cls}`}>
                    <span className="text-[10px] font-mono font-bold">.then</span>
                    <span className="text-[11px] font-mono flex-1">{s.label}()</span>
                    {failed
                      ? <span className="text-[9px] font-bold">throw ❌</span>
                      : <span className="text-[9px] rounded px-1.5 py-0.5 bg-white border border-[#81c784] text-[#1b5e20]">→ {s.out}</span>}
                  </div>
                );
              })}
              {/* catch 레인 */}
              <div className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 transition ${errorRun && pos > errAt ? 'border-red-500 bg-red-100 text-red-800 scale-[1.02]' : 'border-slate-300 bg-white text-slate-400'}`}>
                <span className="text-[10px] font-mono font-bold">.catch</span>
                <span className="text-[11px] font-mono flex-1">handleError(err)</span>
                {errorRun && pos > errAt && <span className="text-[9px] font-bold">⤺ 점프!</span>}
              </div>
              {/* finally 레인 */}
              <div className={`rounded border-2 px-2 py-1.5 flex items-center gap-2 transition ${pos >= N ? 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]' : 'border-slate-300 bg-white text-slate-400'}`}>
                <span className="text-[10px] font-mono font-bold">.finally</span>
                <span className="text-[11px] font-mono flex-1">cleanup()  // 항상 실행</span>
              </div>
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-2.5 text-[9px] text-slate-600">
            {chain.note}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 3 — Promise.all 병렬 대기 + 조합기 비교표 (애니메이션)
    // ─────────────────────────────────────────────────────
    function CombineView({ combine, tick }) {
      const maxMs = Math.max(...combine.tasks.map((t) => t.ms));
      const clk = tick % (maxMs + 2); // 0..maxMs 채우고 잠깐 완료 표시
      const TONE = {
        point: 'border-[#339933] bg-[#c8e6c9] text-[#1b5e20]',
        good: 'border-[#81c784] bg-[#e8f5e9] text-[#1b5e20]',
        mid: 'border-[#81c784] bg-white text-slate-700',
      };
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🧩 Promise.all — 셋을 동시에 시작해 함께 대기</div>
            <div className="space-y-1.5">
              {combine.tasks.map((t, i) => {
                const done = clk >= t.ms;
                const w = Math.min(100, (clk / t.ms) * 100);
                return (
                  <div key={i} className="flex items-center gap-2">
                    <span className="text-[10px] font-mono font-bold text-[#1b5e20] w-16">{t.label}</span>
                    <div className="flex-1 h-3 rounded-full bg-white border border-[#81c784] overflow-hidden">
                      <div className={`h-full transition-all ${done ? 'bg-[#339933]' : 'bg-[#81c784]'}`} style={{ width: `${done ? 100 : w}%` }} />
                    </div>
                    <span className="text-[9px] w-10 text-right">{done ? '완료 ✅' : t.ms + 's'}</span>
                  </div>
                );
              })}
            </div>
            <div className="mt-2 text-[9px] text-slate-500">
              {clk >= maxMs ? '모두 완료 → Promise.all 이 [a,b,c] 배열로 resolve' : '가장 느린 작업까지 함께 기다림 (순차라면 합산 시간)'}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">📊 조합기 4종 — 언제 뭘 쓰나</div>
            <div className="space-y-1">
              {combine.table.map((r, i) => (
                <div key={i} className={`rounded border-2 px-2 py-1 ${TONE[r.tone]}`}>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-mono font-bold w-32">{r.name}</span>
                    <span className="text-[9px] flex-1">{r.when}</span>
                    <span className="text-[8px] rounded px-1.5 py-0.5 bg-white border border-[#81c784] text-[#1b5e20] whitespace-nowrap">{r.use}</span>
                  </div>
                  <div className="text-[8px] text-slate-500 mt-0.5 pl-1">실패 규칙: {r.fail}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 4 — 콜백 → Promise 변신 (정적)
    // ─────────────────────────────────────────────────────
    function PromisifyView({ promisify }) {
      return (
        <div className="space-y-3">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">🔁 콜백 함수 → Promise 반환 함수</div>
            <div className="rounded border-2 border-red-300 bg-red-50 px-2 py-1.5 font-mono text-[10px] text-red-700">
              {promisify.before}
            </div>
            <div className="text-center text-[#339933] text-lg my-1">↓ util.promisify</div>
            <div className="rounded border-2 border-[#339933] bg-[#c8e6c9] px-2 py-1.5 font-mono text-[10px] text-[#1b5e20]">
              {promisify.after}
            </div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-[#e8f5e9] p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">📐 감쌀 때 규약</div>
            <div className="space-y-1">
              {promisify.rules.map((r, i) => (
                <div key={i} className="rounded border border-[#81c784] bg-white px-2 py-1 flex items-center gap-2">
                  <span className="text-[10px] font-bold text-[#1b5e20] w-24 whitespace-nowrap">{r.k}</span>
                  <span className="text-[9px] text-slate-600 flex-1">{r.v}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // Step 5 — 실무 3대 함정 + 순차 vs 병렬 시간 (애니메이션)
    // ─────────────────────────────────────────────────────
    function PitfallView({ pitfall, tick }) {
      const { seq, par } = pitfall.race;
      const clk = tick % (seq + 2);
      const seqW = Math.min(100, (clk / seq) * 100);
      const parW = Math.min(100, (clk / par) * 100);
      return (
        <div className="space-y-2">
          <div className="rounded-lg border-2 border-[#339933] bg-white p-3">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-2">⏱ 순차 vs 병렬 — 같은 작업, 다른 시간</div>
            <div className="space-y-2">
              <div>
                <div className="flex justify-between text-[9px] text-red-600 mb-0.5">
                  <span>❌ 순차 await (독립인데 하나씩)</span><span>{seq}초</span>
                </div>
                <div className="h-3 rounded-full bg-white border border-red-300 overflow-hidden">
                  <div className="h-full bg-red-400 transition-all" style={{ width: `${seqW}%` }} />
                </div>
              </div>
              <div>
                <div className="flex justify-between text-[9px] text-[#1b5e20] mb-0.5">
                  <span>✅ Promise.all 병렬</span><span>{par}초</span>
                </div>
                <div className="h-3 rounded-full bg-white border border-[#81c784] overflow-hidden">
                  <div className="h-full bg-[#339933] transition-all" style={{ width: `${parW}%` }} />
                </div>
              </div>
            </div>
            <div className="mt-2 text-[9px] text-slate-500">독립 작업 셋: 순차 {seq}초 → 병렬 {par}초 ({seq - par}초 절약)</div>
          </div>
          <div className="rounded-lg border-2 border-[#81c784] bg-white p-2.5">
            <div className="text-[11px] font-bold text-[#1b5e20] mb-1.5">🧯 3대 함정과 교정</div>
            <div className="space-y-1">
              {pitfall.items.map((it, i) => (
                <div key={i} className="rounded border border-[#81c784] bg-[#e8f5e9] px-2 py-1.5">
                  <div className="flex items-center gap-1.5">
                    <span className="text-[9px] font-bold rounded px-1.5 py-0.5 bg-red-100 text-red-700 border border-red-300 whitespace-nowrap">❌ {it.bad}</span>
                    <span className="text-[9px] text-slate-600 flex-1">{it.why}</span>
                  </div>
                  <div className="text-[9px] text-[#1b5e20] mt-1 pl-1">✅ {it.fix}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 경고/알림 박스
    // ─────────────────────────────────────────────────────
    const ALERT_STYLE = {
      info:   { bg: 'bg-[#e8f5e9]', border: 'border-[#81c784]', text: 'text-[#1b5e20]', icon: '💡' },
      warn:   { bg: 'bg-amber-50',  border: 'border-amber-300', text: 'text-amber-900', icon: '⚠️' },
      danger: { bg: 'bg-red-50',    border: 'border-red-300',   text: 'text-red-900',   icon: '🚨' },
      good:   { bg: 'bg-[#c8e6c9]', border: 'border-[#339933]', text: 'text-[#1b5e20]', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className={`mt-3 rounded-lg border ${s.bg} ${s.border} ${s.text} p-2 text-xs flex gap-2`}>
          <span>{s.icon}</span>
          <span>{alert.text}</span>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 좌측 LiveDataPane — stage 값에 따라 다른 시각화 (Node 그린 톤)
    //   states/chain/combine/pitfall 단계는 tick 애니메이션이 돈다.
    // ─────────────────────────────────────────────────────
    const STAGE_BADGE = {
      states:    { icon: '🔮', label: '3상태 전이' },
      chain:     { icon: '⛓', label: 'then/catch 체이닝' },
      combine:   { icon: '🧩', label: '조합기 4종' },
      promisify: { icon: '🔁', label: '콜백 → Promise' },
      pitfall:   { icon: '🧯', label: '실무 함정' },
    };

    function LiveDataPane({ state }) {
      const badge = STAGE_BADGE[state.stage] || STAGE_BADGE.states;
      const [tick, setTick] = useState(0);

      useEffect(() => {
        const animated = state.stage === 'states' || state.stage === 'chain' || state.stage === 'combine' || state.stage === 'pitfall';
        setTick(0);
        if (!animated) return;
        const id = setInterval(() => setTick((t) => t + 1), 700);
        return () => clearInterval(id);
      }, [state.stage]);

      return (
        <div className="rounded-xl border border-[#339933] bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-sm font-bold text-[#1b5e20] flex items-center gap-1.5">
              <span>{badge.icon}</span>
              <span>Promise 원리 — {badge.label}</span>
            </h3>
            <span className="text-[10px] text-slate-500">{state.actor}</span>
          </div>
          <div className="text-[10px] text-[#1b5e20] font-mono mb-3 px-2 py-1 rounded bg-[#e8f5e9] border border-[#81c784]">
            현재 단계: {state.stageLabel}
          </div>
          {state.stage === 'states' && <StatesView states={state.states} tick={tick} />}
          {state.stage === 'chain' && <ChainView chain={state.chain} tick={tick} />}
          {state.stage === 'combine' && <CombineView combine={state.combine} tick={tick} />}
          {state.stage === 'promisify' && <PromisifyView promisify={state.promisify} />}
          {state.stage === 'pitfall' && <PitfallView pitfall={state.pitfall} tick={tick} />}
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // 우측 VSCode CodeViewer (highlight.js / atom-one-dark)
    // ─────────────────────────────────────────────────────
    const escapeHtml = (s) =>
      s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function CodeViewer({ code, stepIdx, total }) {
      const highlightSet = new Set(code.highlight || []);
      // hljs.highlight 를 동기 호출 — 렌더 시점에 항상 "현재 단계" 코드가 하이라이트된다
      const tokenLines = React.useMemo(() => {
        try {
          const html = window.hljs.highlight(code.lines.join('\n'), { language: code.lang }).value;
          const split = html.split('\n');
          return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : escapeHtml(l) }));
        } catch (e) {
          return code.lines.map((l) => ({ html: escapeHtml(l) }));
        }
      }, [code]);

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <div className={`text-slate-200 language-${code.lang}`}>
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    data-hi={isHi ? "1" : "0"}
                    className={`flex ${isHi ? 'bg-[#339933]/20 border-l-2 border-[#339933] -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) {
              setPlaying(false);
              return i;
            }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            {/* 헤더 */}
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center px-3 h-10 rounded-lg bg-[#339933] text-white font-bold text-xs">Ⅱ. 비동기</span>
              <div>
                <h1 className="text-2xl font-bold text-[#1b5e20]"><span className="font-mono text-lg mr-1">II-1-2</span> Promise — 비동기의 표준</h1>
                <p className="text-sm text-[#1b5e20]/80">콜백 지옥을 푸는 객체, then/catch 체이닝과 조합</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-[#1b5e20] underline hover:no-underline">← 챕터 목록</a>
            </header>

            {/* 진행 바 */}
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div
                  key={i}
                  className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#339933]' : 'bg-green-200'}`}
                />
              ))}
            </div>

            {/* 설명 패널 */}
            <div className="mb-4 rounded-xl bg-[#1b5e20] text-green-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-green-100/90 leading-relaxed">{step.desc}</p>
            </div>

            {/* 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 컨트롤 */}
            <div className="mt-5 flex items-center justify-center gap-2">
              <button
                onClick={() => setStepIdx(0)}
                aria-label="처음으로"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50"
              >처음</button>
              <button
                onClick={() => setStepIdx((i) => Math.max(0, i - 1))}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >← 이전</button>
              <button
                onClick={() => {
                  if (isLast) setStepIdx(0);
                  setPlaying((p) => !p);
                }}
                aria-pressed={playing}
                aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'}
                className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-[#1b5e20] text-white' : 'bg-[#339933] text-white hover:bg-[#1b5e20]'}`}
              >{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button
                onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))}
                disabled={isLast}
                aria-label="다음 단계"
                className="px-3 py-1.5 text-xs rounded border border-[#339933] bg-white text-[#1b5e20] hover:bg-green-50 disabled:opacity-40"
              >다음 →</button>
            </div>
            <div className="text-center text-[10px] text-[#1b5e20]/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {/* 마지막 단계 안내 */}
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-[#339933] bg-white px-4 py-3 text-sm text-[#1b5e20]">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Promise 는 "나중에 생길 값"을 담는 그릇으로, pending 에서 fulfilled/rejected 로 딱 한 번 확정되고 이후 불변이다.
                then 은 값을 흘려보내고(평탄화 포함), 에러는 체인 끝 catch 하나로 모이며, finally 는 항상 실행된다.
                여러 작업은 all(모두)·allSettled(전부 수집)·race(첫 결과)·any(첫 성공)로 병렬 처리한다.
                옛 콜백 API 는 util.promisify 나 fs.promises 로 Promise 화한다. 함정 셋 — catch 누락·return 빠뜨림·순차 남용 — 만 피하면 된다. 다음 장 II-2-1 에서 async/await 로 넘어간다.
              </div>
            )}

            {/* 키워드 */}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Promise', 'pending', 'fulfilled', 'rejected', 'resolve', 'reject', 'then', 'catch', 'finally', 'Promise.all', 'allSettled', 'race', 'any', 'util.promisify', 'unhandledRejection'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-green-100 text-[#1b5e20] border border-green-200">#{k}</span>
              ))}
            </div>

            {/* 네비 */}
            <nav className="mt-6 flex items-center justify-between text-xs text-[#1b5e20]">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
