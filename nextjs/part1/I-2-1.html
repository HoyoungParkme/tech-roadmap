    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

               caption:'App Router 만 필수고 나머지는 권장/취향이다. 이 조합이 기본 추천이다.',
               changes:[{mark:'new',     text:'App Router: Yes (필수)'},
                        {mark:'changed', text:'src/, alias: No'}] },
        terminal:'router', progress:100, status:'live',
        verdict:'2단계 복습', verdictTone:'good',
        keyPoint:'App Router 만 잘못 고르면 되돌리기가 번거롭다. 나머지는 나중에 바꿔도 된다.',
        code:{...CODE.checklist, highlight:[13,14,15,16,17,18,19]},
      },
      { ...S5,
        beat:{ label:'개발 서버와 Turbopack', at:'setup-checklist.md L23–24, L29',
               caption:'npm run dev 로 3000 포트에 띄우고, --turbo 를 붙이면 컴파일이 더 빠르다.',
               changes:[{mark:'read', text:'localhost:3000'},
                        {mark:'new',  text:'--turbo 옵션'}] },
        terminal:'dev', progress:100, status:'live',
        verdict:'3단계 복습', verdictTone:'good',
        keyPoint:'Turbopack 은 선택이다. 문제가 생기면 옵션만 빼면 원래대로 돌아간다.',
        code:{...CODE.checklist, highlight:[23,24,29]},
      },
      { ...S5,
        beat:{ label:'기억할 폴더 셋', at:'setup-checklist.md L33–35',
               caption:'app/ 은 화면, public/ 은 정적 파일, next.config.mjs 는 프로젝트 설정이다.',
               changes:[{mark:'read', text:'app / public / next.config'}] },
        terminal:'edit', progress:100, status:'live',
        verdict:'4단계 복습', verdictTone:'good',
        keyPoint:'처음에는 이 셋만 알아도 개발이 굴러간다.',
        code:{...CODE.checklist, highlight:[33,34,35]},
      },
      { ...S5,
        beat:{ label:'Fast Refresh 가 안 될 때', at:'setup-checklist.md L38–41',
               caption:'저장 충돌, 에러로 인한 비활성화, 설정 파일 변경. 이 셋이 흔한 원인이다.',
               changes:[{mark:'changed', text:'에러 시 자동 비활성화'},
                        {mark:'read',    text:'next.config 변경은 재시작'}] },
        terminal:'fastrefresh', progress:100, status:'live',
        verdict:'완료', verdictTone:'good',
        summary: {
          title: '설치부터 첫 페이지까지 5단계',
          rows: [
            { metric: '1. 명령',     before: '-', after: 'npx create-next-app@latest', delta: '' },
            { metric: '2. 라우터',   before: '-', after: 'App Router (Yes)', delta: '' },
            { metric: '3. 개발 서버', before: '-', after: 'npm run dev (port 3000)', delta: '' },
            { metric: '4. 편집',     before: '-', after: 'app/page.tsx 수정', delta: '' },
            { metric: '5. 반영',     before: '-', after: 'Fast Refresh 0.3s', delta: '✓' },
          ],
        },
        keyPoint:'create-next-app → App Router → npm run dev → page.tsx 수정. 5분 안에 첫 페이지가 라이브로 돈다.',
        code:{...CODE.checklist, highlight:[38,39,40,41]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800', bar: 'bg-emerald-500' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800',   bar: 'bg-amber-500' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800',    bar: 'bg-rose-500' },
    };

    function ProgressBar({ pct }) {
      return (
        <div className="rounded-lg bg-zinc-100 border border-zinc-300 p-2">
          <div className="flex justify-between text-[10px] text-zinc-600 mb-1">
            <span>설치 진행률</span>
            <span className="font-mono font-bold text-zinc-900">{pct}%</span>
          </div>
          <div className="h-2 bg-white rounded overflow-hidden border border-zinc-200">
            <div className="h-full bg-black transition-all duration-500" style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function TerminalView({ terminal }) {
      const screens = {
        create: [
          '$ npx create-next-app@latest my-app',
          'Need to install create-next-app@15.0.0 (y) y',
          '? TypeScript? Yes',
          '? ESLint? Yes',
          '? Tailwind CSS? Yes',
          '? App Router? Yes',
          'Installing dependencies...',
        ],
        router: [
          '? Would you like to use App Router? Yes',
          '✓ Next 13+ App Router 선택됨',
          '',
          'my-app/',
          '├── app/',
          '│   ├── layout.tsx',
          '│   └── page.tsx',
          '└── package.json',
        ],
        dev: [
          '$ cd my-app',
          '$ npm run dev',
          '',
          '▲ Next.js 15.0.0',
          '- Local: http://localhost:3000',
          '✓ Ready in 1.8s',
          '○ Compiling / ...',
          '✓ Compiled / in 1.2s',
        ],
        edit: [
          '편집기: app/page.tsx',
          '저장 (Ctrl+S)',
          '',
          '서버 로그:',
          '○ Compiling /...',
          '✓ Compiled in 230ms',
          'HMR update sent',
        ],
        fastrefresh: [
          '코드 저장 (0ms)',
          '↓ Turbopack 변경 감지',
          'compile diff (180ms)',
          '↓ websocket → browser',
          'React tree update (50ms)',
          '✓ 화면 갱신, state 유지',
          '총 230ms · 새로고침 없음',
        ],
      };
      const lines = screens[terminal] || screens.create;
      return (
        <div className="rounded-lg overflow-hidden border border-zinc-300 bg-black">
          <div className="flex items-center gap-2 px-3 py-1.5 bg-zinc-900">
            <span className="w-2.5 h-2.5 rounded-full bg-red-400"></span>
            <span className="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
            <span className="w-2.5 h-2.5 rounded-full bg-green-400"></span>
            <span className="ml-2 text-[10px] text-zinc-400 font-mono">terminal — bash</span>
          </div>
          <div className="p-3 text-[11px] font-mono leading-5 text-emerald-300">
            {lines.map((l, i) => (
              <div key={i} className={l.startsWith('$') ? 'text-zinc-100' : l.startsWith('✓') ? 'text-emerald-400' : l.startsWith('?') || l.startsWith('▲') || l.startsWith('○') ? 'text-amber-300' : 'text-zinc-300'}>{l || ' '}</div>
            ))}
          </div>
        </div>
      );
    }

    function BrowserPreview({ status }) {
      if (status === 'pending') {
        return (
          <div className="rounded-lg border border-zinc-300 bg-white p-3 text-center text-zinc-400 text-xs">
            <div className="text-2xl mb-1">⏳</div>
            <div>아직 서버 가동 전</div>
          </div>
        );
      }
      if (status === 'router-selected') {
        return (
          <div className="rounded-lg border border-zinc-300 bg-white p-3">
            <div className="text-[10px] text-zinc-500 mb-1 font-mono">project ready</div>
            <div className="text-xs text-zinc-800">app/ 폴더 생성 완료 · App Router 활성화</div>
          </div>
        );
      }
      if (status === 'dev-server' || status === 'editing' || status === 'live') {
        const body = status === 'live' ? 'Hello, 나의 첫 Next.js 앱 🎉' : status === 'editing' ? 'Welcome to Next.js! (편집 중)' : 'Welcome to Next.js!';
        return (
          <div className="rounded-lg border border-zinc-300 bg-white">
            <div className="px-3 py-1.5 bg-zinc-100 border-b border-zinc-200 flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-red-400"></span>
              <span className="w-2 h-2 rounded-full bg-yellow-400"></span>
              <span className="w-2 h-2 rounded-full bg-green-400"></span>
              <span className="ml-2 text-[10px] text-zinc-600 font-mono">localhost:3000</span>
            </div>
            <div className="p-4">
              <h2 className="text-xl font-bold text-zinc-900">{body}</h2>
              {status === 'live' && (
                <ul className="mt-2 space-y-1 text-xs text-zinc-700">
                  <li>• 서버에서 렌더 (SSR/SSG)</li>
                  <li>• File-based 라우팅</li>
                  <li>• Fast Refresh</li>
                </ul>
              )}
              {status !== 'live' && (
                <p className="mt-1 text-xs text-zinc-600">Get started by editing app/page.tsx</p>
              )}
            </div>
          </div>
        );
      }
      return null;
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-zinc-400 bg-white p-3">
          <div className="text-sm font-bold text-zinc-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-zinc-100">
                  <td className="py-1 pr-2 font-medium text-zinc-800 w-1/4">{r.metric}</td>
                  <td className="py-1 pr-2 text-zinc-700 font-mono">{r.after}</td>
                  <td className="py-1 text-emerald-700 font-bold w-12 text-right">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-zinc-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-zinc-900">설치 + 첫 페이지 시뮬레이션</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <ProgressBar pct={state.progress} />

          <div className="mt-3">
            <TerminalView terminal={state.terminal} />
          </div>

          <div className="mt-3">
            <BrowserPreview status={state.status} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-zinc-900 bg-zinc-100 border border-zinc-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-zinc-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-zinc-900 border-b border-zinc-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-zinc-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-zinc-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-zinc-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-zinc-500/25 border-l-2 border-zinc-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-zinc-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-zinc-900 border-t border-zinc-700 flex items-center justify-between text-[10px] text-zinc-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-zinc-50 to-neutral-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-black text-white font-bold text-xl">▲</span>
              <div>
                <h1 className="text-2xl font-bold text-zinc-900">Chapter I-2-1. 설치 + 첫 페이지</h1>
                <p className="text-sm text-zinc-700/80">create-next-app → App Router → npm run dev → page.tsx</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-zinc-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-black' : 'bg-zinc-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-black text-zinc-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-zinc-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-zinc-300 bg-white text-zinc-800 hover:bg-zinc-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-zinc-300 bg-white text-zinc-800 hover:bg-zinc-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-zinc-900 text-white' : 'bg-black text-white hover:bg-zinc-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-zinc-300 bg-white text-zinc-800 hover:bg-zinc-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-zinc-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-zinc-400 bg-white px-4 py-3 text-sm text-zinc-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                npx create-next-app@latest 로 5분 안에 첫 페이지가 라이브로 돈다. App Router 는 무조건 Yes. npm run dev 로 3000 포트, app/page.tsx 가 곧 "/" 경로. 저장 즉시 Fast Refresh.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['create-next-app', 'App Router', 'npm run dev', 'localhost:3000', 'page.tsx', 'Fast Refresh'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-800 border border-zinc-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-zinc-700">
              <a href="./I-1-2.html" className="underline hover:no-underline">← 이전: I-1-2 렌더링 모드</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 App vs Pages Router →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
