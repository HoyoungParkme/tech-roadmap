    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);

    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }

<body>
  <div id="root"></div>
  <!--
    Rust II-2-1 — derive 매크로 (Debug/Clone/Copy/Eq)
    #[derive(...)] 는 컴파일 시점에 trait impl 을 자동 생성하는 절차 매크로다.
    5단계: derive 개념 → Debug({:?}) → Copy vs Clone → PartialEq/Eq+Hash(HashMap 키) → derive 조건과 함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#CE422B';

    const STEPS = [
      {
        title: 'Step 1. #[derive] — 컴파일러가 impl 을 대신 써준다',
        desc: '트레잇을 손으로 impl 하려면 필드마다 반복 코드가 쌓인다. #[derive(...)] 를 붙이면 컴파일러가 그 impl 코드를 자동으로 펼쳐 준다. 이는 절차 매크로(procedural macro) 로, 구조체의 필드 정보를 읽어 트레잇 구현을 기계적으로 생성한다. 즉 우리가 쓰는 한 줄이 실제로는 수십 줄의 impl 로 확장되어 컴파일된다. 보일러플레이트를 없애면서도 손으로 쓴 것과 동일한 코드가 나온다.',
        struct: { name: 'Point', fields: [{ name: 'x', type: 'i32' }, { name: 'y', type: 'i32' }] },
        derives: [
          { name: 'Debug', on: true },
          { name: 'Clone', on: false },
          { name: 'Copy', on: false },
          { name: 'PartialEq', on: false },
        ],
        expand: {
          label: '컴파일러가 자동 생성하는 impl (Debug)',
          lines: [
            'impl std::fmt::Debug for Point {',
            '    fn fmt(&self, f: &mut Formatter) -> Result {',
            '        f.debug_struct("Point")',
            '         .field("x", &self.x)',
            '         .field("y", &self.y)',
            '         .finish()',
            '    }',
            '}',
          ],
        },
        alert: { tone: 'info', text: '한 줄 #[derive(Debug)] 가 컴파일 시점에 위와 같은 impl 블록으로 펼쳐진다.' },
        code: {
          lang: 'rust',
          filename: 'derive_intro.rs',
          lines: [
            '// derive 없이 손으로 쓰면 이렇게 길다',
            'struct Point { x: i32, y: i32 }',
            '',
            'impl std::fmt::Debug for Point {',
            '    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {',
            '        f.debug_struct("Point")',
            '         .field("x", &self.x)',
            '         .field("y", &self.y)',
            '         .finish()',
            '    }',
            '}',
            '',
            '// derive 를 붙이면 위 8줄을 컴파일러가 대신 써준다',
            '#[derive(Debug)]',
            'struct Point2 { x: i32, y: i32 }',
            '// => 동일한 Debug impl 이 자동 생성된다',
          ],
          highlight: [12, 13, 14, 15],
        },
      },
      {
        title: 'Step 2. Debug({:?}) vs Display — 어느 쪽을 derive 할 수 있나',
        desc: 'Debug 는 개발자용 출력이라 derive 가 가능하다 — 필드 이름과 값을 기계적으로 찍으면 되기 때문이다. 반면 Display 는 사용자용 표현이라 "어떻게 보여줄지" 가 도메인마다 다르므로 derive 할 수 없고 반드시 손으로 impl 한다. 그래서 {:?} 는 derive(Debug) 만으로 바로 쓰지만, {} 는 Display 를 직접 구현해야 한다. 실무에서 assert_eq! 나 dbg! 는 내부적으로 Debug 를 요구하므로, 테스트하는 타입에는 거의 항상 Debug 를 붙여 둔다.',
        struct: { name: 'Point', fields: [{ name: 'x', type: 'i32' }, { name: 'y', type: 'i32' }] },
        derives: [
          { name: 'Debug', on: true },
          { name: 'Clone', on: false },
          { name: 'Copy', on: false },
          { name: 'PartialEq', on: false },
        ],
        outputs: [
          { fmt: '{:?}', from: 'derive(Debug)', text: 'Point { x: 3, y: 4 }', ok: true },
          { fmt: '{:#?}', from: 'derive(Debug) 확장', text: 'Point {\\n    x: 3,\\n    y: 4,\\n}', ok: true },
          { fmt: '{}', from: 'Display (derive 불가)', text: '컴파일 에러 — Display 미구현', ok: false },
        ],
        alert: { tone: 'warn', text: 'Display 는 derive 가 없다. 사용자용 표현이 필요하면 impl Display 를 직접 써야 한다.' },
        code: {
          lang: 'rust',
          filename: 'debug_vs_display.rs',
          lines: [
            '#[derive(Debug)]',
            'struct Point { x: i32, y: i32 }',
            '',
            'fn main() {',
            '    let p = Point { x: 3, y: 4 };',
            '',
            '    println!("{:?}", p);   // => Point { x: 3, y: 4 }',
            '    println!("{:#?}", p);  // => 여러 줄 pretty 출력',
            '',
            '    // println!("{}", p);  // 컴파일 에러: Display 미구현',
            '}',
            '',
            '// 사용자용 출력이 필요하면 Display 를 직접 impl',
            'impl std::fmt::Display for Point {',
            '    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {',
            '        write!(f, "({}, {})", self.x, self.y)  // => (3, 4)',
            '    }',
            '}',
          ],
          highlight: [6, 7, 9, 13, 14, 15],
        },
      },
      {
        title: 'Step 3. Copy vs Clone — 비트 복사 vs 명시 복제',
        desc: 'Clone 은 .clone() 을 호출해야 복제되고, 힙 할당처럼 비용이 있을 수 있다. Copy 는 대입만 해도 비트 단위로 통째 복사되며, 원본이 이동(move)되지 않고 그대로 남는다. 그래서 Copy 는 정수처럼 작고 힙을 소유하지 않는 타입에만 붙일 수 있다 — String 처럼 힙을 가진 타입은 Copy 가 불가능하다. Copy 는 Clone 을 전제로 하므로 항상 #[derive(Clone, Copy)] 를 함께 쓴다. 큰 구조체에 무심코 Copy 를 붙이면 대입마다 조용히 전체 복사가 일어나 성능을 갉아먹는다.',
        struct: { name: 'Point', fields: [{ name: 'x', type: 'i32' }, { name: 'y', type: 'i32' }] },
        derives: [
          { name: 'Debug', on: false },
          { name: 'Clone', on: true },
          { name: 'Copy', on: true },
          { name: 'PartialEq', on: false },
        ],
        moveDemo: {
          copy: { title: 'Copy 타입 (Point)', src: 'a', dst: 'b', srcAfter: '여전히 유효 ✓', note: 'let b = a; 후에도 a 사용 가능' },
          move: { title: 'Copy 없는 타입 (String)', src: 's1', dst: 's2', srcAfter: 'move 됨 — 사용 불가 ✗', note: 'let s2 = s1; 후 s1 은 E0382' },
        },
        alert: { tone: 'info', text: 'Copy 는 항상 Clone 과 함께 derive 한다. 힙을 소유한 타입(String, Vec)에는 Copy 불가.' },
        code: {
          lang: 'rust',
          filename: 'copy_vs_clone.rs',
          lines: [
            '#[derive(Clone, Copy)]   // Copy 는 Clone 을 전제로 한다',
            'struct Point { x: i32, y: i32 }',
            '',
            'fn main() {',
            '    let a = Point { x: 1, y: 2 };',
            '    let b = a;          // 비트 복사 — a 는 move 되지 않는다',
            '    println!("{} {}", a.x, b.x);  // => 1 1  (둘 다 유효)',
            '',
            '    // String 은 힙을 소유 → Copy 불가, move 만 된다',
            '    let s1 = String::from("hi");',
            '    let s2 = s1;        // move — s1 은 무효화된다',
            '    // println!("{}", s1);  // 에러 E0382: value moved',
            '',
            '    let s3 = s2.clone();  // 명시적 복제 (힙 재할당)',
            '    println!("{} {}", s2, s3);    // => hi hi',
            '}',
          ],
          highlight: [0, 5, 6, 9, 10, 12, 13],
        },
      },
      {
        title: 'Step 4. PartialEq/Eq + Hash — HashMap 키로 쓰기',
        desc: 'PartialEq 를 derive 하면 == 비교가 필드별로 생성되어 assert_eq! 나 값 비교가 가능해진다. Eq 는 "모든 값이 자기 자신과 같다"(반사성) 를 보장하는 마커 트레잇으로, f64 처럼 NaN 이 있는 타입에는 붙일 수 없다. HashMap 이나 HashSet 의 키가 되려면 Eq 와 Hash 를 둘 다 derive 해야 한다 — Hash 로 버킷을 찾고 Eq 로 충돌을 판별하기 때문이다. 이 둘의 규칙은 반드시 일치해야 하므로, 한쪽만 손으로 바꾸면 맵이 조용히 오작동한다. 그래서 보통 함께 derive 로 맞춘다.',
        struct: { name: 'Point', fields: [{ name: 'x', type: 'i32' }, { name: 'y', type: 'i32' }] },
        derives: [
          { name: 'Debug', on: true },
          { name: 'PartialEq', on: true },
          { name: 'Eq', on: true },
          { name: 'Hash', on: true },
        ],
        hashDemo: {
          title: 'HashMap<Point, &str>',
          rows: [
            { key: 'Point { x: 0, y: 0 }', val: '"origin"' },
            { key: 'Point { x: 1, y: 2 }', val: '"a"' },
          ],
          lookup: 'get(&Point { x: 1, y: 2 }) => Some("a")',
        },
        alert: { tone: 'good', text: 'HashMap 키의 조건 = Eq + Hash. 둘을 함께 derive 하면 규칙이 자동으로 일치한다.' },
        code: {
          lang: 'rust',
          filename: 'eq_hash_key.rs',
          lines: [
            'use std::collections::HashMap;',
            '',
            '#[derive(Debug, PartialEq, Eq, Hash)]',
            'struct Point { x: i32, y: i32 }',
            '',
            'fn main() {',
            '    let mut m = HashMap::new();',
            '    m.insert(Point { x: 0, y: 0 }, "origin");',
            '    m.insert(Point { x: 1, y: 2 }, "a");',
            '',
            '    let k = Point { x: 1, y: 2 };',
            '    println!("{:?}", m.get(&k));  // => Some("a")',
            '',
            '    // PartialEq 덕분에 == 비교도 가능',
            '    assert_eq!(k, Point { x: 1, y: 2 });  // => 통과',
            '}',
          ],
          highlight: [2, 6, 7, 8, 10, 11, 14],
        },
      },
      {
        title: 'Step 5. derive 조건과 실무 함정',
        desc: 'derive 는 마법이 아니다 — 모든 필드가 해당 트레잇을 구현해야만 성립한다. 필드 하나가 Clone 이 아니면 구조체 전체가 Clone 을 derive 할 수 없다. 또 도메인 규칙이 필요한 경우(대소문자 무시 비교, 특정 필드 제외 등) 에는 derive 대신 손으로 impl 해야 한다. 자주 겪는 함정 세 가지: 큰 구조체에 Copy 를 붙여 대입마다 전체 복사가 일어나는 것, Eq/Hash 없이 HashMap 키로 쓰려다 컴파일이 막히는 것, Debug 를 안 붙여 assert_eq! 실패 메시지가 출력되지 않는 것이다. 테스트 대상 타입엔 최소한 Debug + PartialEq 를 습관처럼 붙여 둔다.',
        struct: { name: 'User', fields: [{ name: 'id', type: 'u64' }, { name: 'conn', type: 'TcpStream' }] },
        derives: [
          { name: 'Debug', on: true },
          { name: 'Clone', on: false, blocked: true },
          { name: 'Copy', on: false, blocked: true },
          { name: 'PartialEq', on: false },
        ],
        pitfalls: [
          '큰 구조체에 Copy — 대입마다 전체 비트 복사가 조용히 발생',
          'Eq/Hash 없이 HashMap 키 — 컴파일 거부',
          'Debug 없이 assert_eq! — 실패 시 값 출력 불가',
          '필드가 트레잇 미구현 — 구조체 derive 자체가 불가 (TcpStream 은 Clone 아님)',
        ],
        alert: { tone: 'danger', text: '필드 TcpStream 은 Clone 이 아니다 → User 는 #[derive(Clone)] 이 컴파일 거부된다.' },
        code: {
          lang: 'rust',
          filename: 'derive_pitfalls.rs',
          lines: [
            'use std::net::TcpStream;',
            '',
            '// 필드가 Clone 이 아니면 구조체도 derive(Clone) 불가',
            '#[derive(Debug)]        // Debug 만 가능',
            'struct User { id: u64, conn: TcpStream }',
            '',
            '// #[derive(Clone)] 를 추가하면:',
            '// => error: the trait `Clone` is not implemented',
            '//            for `TcpStream`',
            '',
            '// 도메인 규칙이 필요하면 손으로 impl',
            '#[derive(Debug)]',
            'struct CiName(String);   // 대소문자 무시 비교',
            'impl PartialEq for CiName {',
            '    fn eq(&self, other: &Self) -> bool {',
            '        self.0.eq_ignore_ascii_case(&other.0)  // => 규칙 지정',
            '    }',
            '}',
          ],
          highlight: [2, 3, 4, 6, 7, 8, 10, 12, 13, 14, 15],
        },
      },
    ];

    function StructCard({ struct, derives }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🦀</span>
            <span>struct 정의 + #[derive(...)]</span>
          </div>
          <div className="p-3">
            <div className="flex flex-wrap gap-1.5 mb-2">
              {derives.map((d, i) => {
                let cls = 'bg-slate-100 text-slate-400 border-slate-200';
                if (d.on) cls = 'text-white border-transparent';
                else if (d.blocked) cls = 'bg-red-50 text-red-600 border-red-200 line-through';
                return (
                  <span key={i} className={`text-[11px] font-mono px-2 py-0.5 rounded border ${cls}`}
                        style={d.on ? {background:BRAND} : {}}>{d.name}</span>
                );
              })}
            </div>
            <div className="font-mono text-xs bg-[#282c34] text-slate-200 rounded p-2 leading-5">
              <div><span style={{color:'#c678dd'}}>struct</span> <span style={{color:'#e5c07b'}}>{struct.name}</span> {'{'}</div>
              {struct.fields.map((f, i) => (
                <div key={i} className="pl-4"><span style={{color:'#e06c75'}}>{f.name}</span>: <span style={{color:'#e5c07b'}}>{f.type}</span>,</div>
              ))}
              <div>{'}'}</div>
            </div>
          </div>
        </div>
      );
    }

    function ExpandBox({ expand }) {
      if (!expand) return null;
      return (
        <div className="mt-3 rounded-lg overflow-hidden" style={{border:`1px dashed ${BRAND}`}}>
          <div className="px-3 py-1 text-[11px] font-bold" style={{background:'#fef2ef', color:'#7a2418'}}>▼ {expand.label}</div>
          <div className="bg-[#282c34] text-slate-300 font-mono text-[11px] leading-5 p-2">
            {expand.lines.map((l, i) => <div key={i} className="whitespace-pre">{l}</div>)}
          </div>
        </div>
      );
    }

    function OutputsBox({ outputs }) {
      if (!outputs) return null;
      return (
        <div className="mt-3 space-y-1.5">
          {outputs.map((o, i) => (
            <div key={i} className="flex items-center gap-2 text-xs">
              <span className="w-12 font-mono font-bold" style={{color:BRAND}}>{o.fmt}</span>
              <span className="text-[10px] text-slate-500 w-32">{o.from}</span>
              <span className={`flex-1 font-mono px-2 py-0.5 rounded whitespace-pre ${o.ok ? '' : ''}`}
                    style={o.ok ? {background:'#dbf3e6', color:'#166534'} : {background:'#fee2e2', color:'#991b1b'}}>{o.text}</span>
            </div>
          ))}
        </div>
      );
    }

    function MoveDemo({ demo }) {
      if (!demo) return null;
      const Col = ({ d, isCopy }) => (
        <div className="flex-1 rounded-lg p-2" style={{border:`1px solid ${isCopy ? '#86efac' : '#fecaca'}`, background: isCopy ? '#f0fdf4' : '#fef2f2'}}>
          <div className="text-[11px] font-bold mb-1.5" style={{color: isCopy ? '#166534' : '#991b1b'}}>{d.title}</div>
          <div className="flex items-center gap-1 text-[11px] font-mono mb-1">
            <span className="px-2 py-0.5 rounded bg-white border">{d.src}</span>
            <span style={{color:BRAND}}>→</span>
            <span className="px-2 py-0.5 rounded bg-white border">{d.dst}</span>
          </div>
          <div className="text-[10px] font-mono px-1.5 py-0.5 rounded inline-block"
               style={isCopy ? {background:'#dbf3e6', color:'#166534'} : {background:'#fee2e2', color:'#991b1b'}}>{d.src}: {d.srcAfter}</div>
          <div className="text-[10px] text-slate-500 mt-1">{d.note}</div>
        </div>
      );
      return (
        <div className="mt-3 flex gap-2">
          <Col d={demo.copy} isCopy={true} />
          <Col d={demo.move} isCopy={false} />
        </div>
      );
    }

    function HashDemo({ demo }) {
      if (!demo) return null;
      return (
        <div className="mt-3 rounded-lg p-2" style={{border:`1px solid ${BRAND}`, background:'#fff'}}>
          <div className="text-[11px] font-bold mb-1.5" style={{color:'#7a2418'}}>{demo.title}</div>
          {demo.rows.map((r, i) => (
            <div key={i} className="flex items-center gap-1 text-[11px] font-mono mb-1">
              <span className="px-2 py-0.5 rounded" style={{background:'#fef2ef', color:'#7a2418'}}>{r.key}</span>
              <span style={{color:BRAND}}>↦</span>
              <span className="px-2 py-0.5 rounded bg-slate-100">{r.val}</span>
            </div>
          ))}
          <div className="mt-1.5 text-[11px] font-mono px-2 py-0.5 rounded" style={{background:'#dbf3e6', color:'#166534'}}>{demo.lookup}</div>
        </div>
      );
    }

    function PitfallsBox({ pitfalls }) {
      if (!pitfalls) return null;
      return (
        <div className="mt-3 rounded-xl p-3" style={{border:`2px solid ${BRAND}`, background:'#fef2ef'}}>
          <div className="flex items-center gap-2 mb-1.5">
            <span className="text-lg">⚠️</span>
            <span className="text-sm font-bold" style={{color:'#7a2418'}}>실무 함정 4가지</span>
          </div>
          <ul className="space-y-1">
            {pitfalls.map((w, i) => (
              <li key={i} className="text-[11px] flex gap-2" style={{color:'#7a2418'}}>
                <span style={{color:BRAND}}>✗</span><span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#fef2ef', bd:'#f4c3b3', tx:'#7a2418', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col overflow-auto" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#7a2418'}}>#[derive] 가 펼쳐지는 과정</h3>
            <span className="text-[10px] text-slate-500">절차 매크로 = 코드 생성기</span>
          </div>
          <StructCard struct={state.struct} derives={state.derives} />
          <ExpandBox expand={state.expand} />
          <OutputsBox outputs={state.outputs} />
          <MoveDemo demo={state.moveDemo} />
          <HashDemo demo={state.hashDemo} />
          <PitfallsBox pitfalls={state.pitfalls} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(206,66,43,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#fef2ef 0%,#fde2d8 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>Rs</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:'#a85138'}}>Part II. 트레잇</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full" style={{background:'#fef2ef', color:'#7a2418', border:'1px solid #f4c3b3'}}>II-2-1</span>
                </div>
                <h1 className="text-2xl font-bold mt-1" style={{color:'#7a2418'}}>derive 매크로 — Debug/Clone/Copy/Eq</h1>
                <p className="text-sm" style={{color:'#CE422B'}}>#[derive]로 보일러플레이트를 자동 생성하는 절차 매크로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#f4c3b3'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#CE422Baa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#7a2418'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                #[derive] 는 절차 매크로로 trait impl 을 컴파일 시점에 자동 생성한다. Debug 는 개발자용(&#123;:?&#125;), Display 는 손으로. Copy 는 비트 복사(작은 타입만)·Clone 은 명시 복제. HashMap 키는 Eq + Hash 가 필요하다. 단, 모든 필드가 해당 트레잇을 구현해야 derive 가 성립한다. 테스트 타입엔 Debug + PartialEq 를 습관처럼 붙이자.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Rust', 'derive', 'trait', 'Debug', 'Copy', 'Clone', 'Eq', 'Hash', 'proc-macro'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#fef2ef', color:'#7a2418', border:'1px solid #f4c3b3'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
