  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🦀</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>
  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null, autoplay = false;

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length || autoplay) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length || autoplay) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) { autoplay = !autoplay; apply(); return; }   // 자동재생 중에는 beat 를 쉬게 한다
      if (!dir) return;
      if (autoplay) { autoplay = false; return; }
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    Rust II-1-2 — trait — 동작을 묶는 인터페이스 (비유: 공통 자격증)
    trait = "이 동작을 할 수 있다"는 계약. 여러 타입이 같은 자격증(trait)을 따면
    호출자는 구체 타입을 몰라도 공통 인터페이스로 부른다.
    5단계: 계약 정의/impl → 기본 메서드 → 트레잇 바운드/impl Trait → 표준 트레잇 → 오펀 규칙/newtype
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#CE422B';
    const INK = '#7a2418';
    const SUB = '#a85138';

    const STEPS = [
      {
        title: 'Step 1. trait 정의와 impl — 공유 행동의 계약',
        desc: 'trait 는 "이 타입은 이런 동작을 할 수 있다"는 계약이다. 메서드 시그니처만 나열해 두면, 각 타입은 impl Trait for Type 블록에서 실제 구현을 채운다. 핵심은 Article 과 Tweet 처럼 서로 다른 타입이 같은 trait 를 impl 하면, 호출자는 구체 타입을 몰라도 summarize() 하나로 통일해 부를 수 있다는 점이다. 자바의 interface, 고의 interface 와 같은 역할이지만 Rust 는 이를 컴파일 시점에 정적으로 연결한다.',
        contract: { name: 'Summary', reqs: ['summarize(&self) -> String'] },
        impls: [
          { type: 'Article', body: '제목 + 저자', overridden: true, active: true },
          { type: 'Tweet', body: '@user: 내용', overridden: true, active: false },
        ],
        callLabel: 'article.summarize()',
        alert: { tone: 'info', text: '서로 다른 타입이 같은 계약을 지키면, 호출부는 하나의 이름으로 모두를 다룬다.' },
        code: {
          lang: 'rust', filename: 'summary.rs',
          lines: [
            '// trait = 공유할 동작의 계약 (메서드 시그니처)',
            'pub trait Summary {',
            '    fn summarize(&self) -> String;',
            '}',
            '',
            'struct Article { title: String, author: String }',
            'struct Tweet { user: String, body: String }',
            '',
            '// impl Trait for Type — 각 타입이 계약을 이행',
            'impl Summary for Article {',
            '    fn summarize(&self) -> String {',
            '        format!("{} — {}", self.title, self.author)',
            '    }',
            '}',
            'impl Summary for Tweet {',
            '    fn summarize(&self) -> String {',
            '        format!("@{}: {}", self.user, self.body)',
            '    }',
            '}',
            '',
            'let a = Article { title: "Rust 1.80".into(),',
            '                  author: "core".into() };',
            'println!("{}", a.summarize());',
            '// => Rust 1.80 — core',
          ],
          highlight: [1, 2, 3, 9, 10, 11, 12, 13],
        },
      },
      {
        title: 'Step 2. 기본 메서드 — 계약에 기본 구현을 얹는다',
        desc: 'trait 는 시그니처만이 아니라 기본 구현(default method)도 담을 수 있다. 기본 메서드는 다른 필수 메서드를 호출해 만들어 두면, impl 쪽에서는 최소한만 채우고 나머지는 공짜로 얻는다. Article 은 preview() 를 그대로 물려받고, Tweet 은 필요에 따라 오버라이드해 자기 방식으로 덮어쓴다. 이 방식은 표준 라이브러리가 Iterator 하나의 next() 만 요구하고 map·filter·collect 수십 개를 기본 메서드로 제공하는 원리와 같다.',
        contract: { name: 'Summary', reqs: ['summarize(&self) -> String', 'preview(&self) [기본 구현]'] },
        impls: [
          { type: 'Article', body: 'preview 물려받음', overridden: false, active: true },
          { type: 'Tweet', body: 'preview 오버라이드', overridden: true, active: false },
        ],
        callLabel: 'article.preview()',
        alert: { tone: 'good', text: '기본 메서드는 필수 메서드 위에 세워진다 — impl 은 최소만 채우고 나머지를 공짜로 얻는다.' },
        code: {
          lang: 'rust', filename: 'default_method.rs',
          lines: [
            'pub trait Summary {',
            '    fn summarize(&self) -> String;   // 필수',
            '',
            '    // 기본 메서드 — 필수 메서드 위에서 동작',
            '    fn preview(&self) -> String {',
            '        let s = self.summarize();',
            '        format!("[미리보기] {}...", &s[..s.len().min(10)])',
            '    }',
            '}',
            '',
            'impl Summary for Article {',
            '    fn summarize(&self) -> String {',
            '        format!("{} — {}", self.title, self.author)',
            '    }',
            '    // preview 를 정의하지 않음 => 기본 구현 사용',
            '}',
            '',
            'impl Summary for Tweet {',
            '    fn summarize(&self) -> String { self.body.clone() }',
            '    // 기본을 덮어쓴다 (오버라이드)',
            '    fn preview(&self) -> String {',
            '        format!("🐦 @{}", self.user)',
            '    }',
            '}',
            '// => Article 은 [미리보기]..., Tweet 은 🐦 @user',
          ],
          highlight: [4, 5, 6, 7, 8, 15, 20, 21, 22],
        },
      },
      {
        title: 'Step 3. 트레잇 바운드 — 계약을 강제하는 제네릭',
        desc: '제네릭 함수는 어떤 타입 T 든 받지만, 그 T 가 특정 동작을 할 수 있어야 한다면 트레잇 바운드로 제약을 건다. fn notify(item: &T) where T: Summary 는 "summarize 를 가진 타입만 통과"라는 게이트다. 짧게 쓰려면 파라미터에 impl Summary 를 바로 쓰고, 반환에도 impl Summary 로 구체 타입을 감출 수 있다. 바운드를 어긴 타입을 넘기면 런타임이 아니라 컴파일에서 막히므로, 계약 위반이 배포까지 새어 나가지 않는다.',
        contract: { name: 'T: Summary', reqs: ['바운드 게이트: summarize 필수'] },
        impls: [
          { type: 'Article', body: 'Summary 구현 ✓', overridden: false, active: true, pass: true },
          { type: 'i32', body: 'Summary 없음 ✗', overridden: false, active: false, pass: false },
        ],
        callLabel: 'notify(&article)  // i32 는 컴파일 거부',
        alert: { tone: 'warn', text: '바운드를 어긴 타입은 컴파일에서 걸린다 — E0277: the trait bound is not satisfied.' },
        code: {
          lang: 'rust', filename: 'bounds.rs',
          lines: [
            '// 트레잇 바운드 — T 는 반드시 Summary 여야 한다',
            'fn notify<T: Summary>(item: &T) {',
            '    println!("속보! {}", item.summarize());',
            '}',
            '',
            '// impl Trait — 같은 뜻의 짧은 표기 (파라미터)',
            'fn notify_short(item: &impl Summary) {',
            '    println!("속보! {}", item.summarize());',
            '}',
            '',
            '// impl Trait 반환 — 구체 타입을 숨긴 채 돌려준다',
            'fn make_tweet() -> impl Summary {',
            '    Tweet { user: "core".into(), body: "hi".into() }',
            '}',
            '',
            'notify(&article);      // OK: Article: Summary',
            'notify(&make_tweet()); // OK: Tweet: Summary',
            '// notify(&42);        // ✗ E0277: i32 는 Summary 아님',
            '// => 계약 위반이 컴파일에서 차단된다',
          ],
          highlight: [1, 2, 6, 7, 11, 12, 17, 18],
        },
      },
      {
        title: 'Step 4. 표준 트레잇 — Display · From/Into',
        desc: '표준 라이브러리의 트레잇을 내 타입에 impl 하면 언어의 관용구에 바로 올라탄다. Display 를 구현하면 {} 포매팅과 to_string() 이 열리고, From 을 구현하면 반대 방향 Into 는 자동으로 따라온다. 흔한 함정은 Debug(#[derive(Debug)], {:?}) 는 파생했지만 Display 는 구현하지 않은 채 {} 로 출력하려다 컴파일 에러를 만나는 것이다. Display 는 사람이 읽는 표현이라 자동 파생이 없고 직접 써야 한다.',
        contract: { name: 'std traits', reqs: ['Display: {} 출력', 'From<Article>: 변환 진입점'] },
        impls: [
          { type: 'Article', body: 'Display 구현 => {} 가능', overridden: false, active: true, pass: true },
          { type: 'Tweet', body: 'Display 미구현 => {} 불가', overridden: false, active: false, pass: false },
        ],
        callLabel: 'let s: Summary = article.into()',
        alert: { tone: 'danger', text: '{:?} 는 Debug, {} 는 Display 다. Display 미구현 타입을 {} 로 찍으면 E0277.' },
        code: {
          lang: 'rust', filename: 'std_traits.rs',
          lines: [
            'use std::fmt;',
            '',
            '// Display — {} 포매팅 & to_string() 을 연다',
            'impl fmt::Display for Article {',
            '    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {',
            '        write!(f, "{} by {}", self.title, self.author)',
            '    }',
            '}',
            '',
            '// From<T> 를 구현하면 Into<T> 는 공짜로 따라온다',
            'impl From<Article> for String {',
            '    fn from(a: Article) -> String { a.summarize() }',
            '}',
            '',
            'let a = Article { title: "Rust".into(),',
            '                  author: "core".into() };',
            'println!("{}", a);          // => Rust by core',
            'let s: String = a.into();   // From => Into 자동',
            '',
            '// println!("{}", tweet);   // ✗ Display 미구현: E0277',
            '// println!("{:?}", tweet); // Debug 는 derive 로 가능',
          ],
          highlight: [3, 4, 5, 6, 10, 11, 12, 17, 18],
        },
      },
      {
        title: 'Step 5. 오펀 규칙과 newtype 패턴',
        desc: '오펀 규칙(고아 규칙)은 "impl Trait for Type 에서 트레잇이나 타입 중 하나는 내 크레이트 소유여야 한다"는 제약이다. 남의 트레잇(Display)을 남의 타입(Vec)에 바로 impl 하는 것은 금지된다 — 두 크레이트가 서로 다른 구현을 넣으면 충돌하기 때문이다. 해법이 newtype 패턴이다. Wrapper(Vec) 처럼 내 크레이트의 얇은 튜플 구조체로 감싸면, 그 새 타입에는 무엇이든 impl 할 수 있다. 실무에서 외부 타입에 기능을 붙일 때 표준적으로 쓰는 우회로다.',
        contract: { name: 'orphan rule', reqs: ['trait 또는 type 중 하나는 내 크레이트'] },
        impls: [
          { type: 'Display for Vec', body: '둘 다 외부 => 금지 ✗', overridden: false, active: false, pass: false },
          { type: 'Display for Wrapper', body: 'Wrapper 는 내 것 => OK', overridden: false, active: true, pass: true },
        ],
        callLabel: 'println!("{}", Wrapper(v))',
        wins: [
          'trait·type 중 하나는 내 크레이트 소유여야 impl 가능',
          'newtype: 튜플 구조체로 외부 타입을 얇게 감싼다',
          '감싼 새 타입엔 어떤 트레잇이든 자유롭게 impl',
          '같은 트레잇을 두 번 impl 하면 충돌(중복 구현) 에러',
        ],
        alert: { tone: 'good', text: '오펀 규칙에 막히면 newtype 으로 감싸라 — 안전하게 외부 타입에 동작을 더한다.' },
        code: {
          lang: 'rust', filename: 'newtype.rs',
          lines: [
            'use std::fmt;',
            '',
            '// ✗ 오펀 규칙 위반 — Display 도 Vec 도 남의 크레이트',
            '// impl fmt::Display for Vec<String> { ... } // E0117',
            '',
            '// ✓ newtype 패턴 — 내 크레이트의 얇은 래퍼',
            'struct Wrapper(Vec<String>);',
            '',
            'impl fmt::Display for Wrapper {',
            '    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {',
            '        write!(f, "[{}]", self.0.join(", "))',
            '    }',
            '}',
            '',
            'let w = Wrapper(vec!["a".into(), "b".into()]);',
            'println!("{}", w);   // => [a, b]',
            '',
            '// self.0 으로 내부 Vec 에 접근 (튜플 구조체)',
            '// => 외부 타입에 안전하게 동작을 더했다',
          ],
          highlight: [3, 4, 6, 7, 9, 10, 11, 12, 16],
        },
      },
    ];

    function TraitContract({ contract }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>📜</span>
            <span>계약 (trait)</span>
            <span className="ml-auto font-mono text-[11px] px-2 py-0.5 rounded bg-white/20">{contract.name}</span>
          </div>
          <div className="p-3 space-y-1.5">
            {contract.reqs.map((r, i) => (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span style={{color:BRAND}}>▪</span>
                <span className="font-mono px-2 py-0.5 rounded" style={{background:'#fef2ef', color:INK}}>{r}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ImplRows({ impls, callLabel }) {
      const STATUS = (im) => {
        if (im.pass === false) return { bg:'#fee2e2', tx:'#991b1b', tag:'거부' };
        if (im.pass === true) return { bg:'#dbf3e6', tx:'#166534', tag:'통과' };
        return { bg:'#fef9c3', tx:'#854d0e', tag:'구현' };
      };
      return (
        <div className="mt-3 rounded-lg overflow-hidden bg-white" style={{border:`1px solid ${SUB}`}}>
          <div className="px-3 py-1.5 text-[11px] font-bold flex items-center gap-2" style={{background:'#fde2d8', color:INK}}>
            <span>🧩</span><span>impl Trait for Type — 같은 계약, 다른 구현</span>
          </div>
          <div className="p-3 space-y-2">
            {impls.map((im, i) => {
              const s = STATUS(im);
              return (
                <div key={i} className="flex items-center gap-2 text-xs rounded px-2 py-1.5 transition"
                     style={{background: im.active ? '#fff7f4' : 'transparent', border: im.active ? `1px solid ${BRAND}` : '1px solid transparent'}}>
                  <span className="w-32 font-bold font-mono truncate" style={{color:INK}}>{im.type}</span>
                  <span className="flex-1 font-mono px-2 py-0.5 rounded" style={{background:s.bg, color:s.tx}}>{im.body}</span>
                  {im.overridden
                    ? <span className="text-[9px] px-1.5 py-0.5 rounded-full" style={{background:BRAND, color:'#fff'}}>override</span>
                    : <span className="text-[9px] px-1.5 py-0.5 rounded-full" style={{background:'#e2e8f0', color:'#475569'}}>{s.tag}</span>}
                </div>
              );
            })}
          </div>
          <div className="px-3 py-2 border-t flex items-center gap-2 text-[11px]" style={{borderColor:'#f4c3b3', background:'#fffdfc'}}>
            <span style={{color:SUB}}>공통 호출</span>
            <span className="ml-auto font-mono px-2 py-0.5 rounded" style={{background:INK, color:'#fde2d8'}}>{callLabel}</span>
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#fef2ef'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🦀</span>
            <span className="text-lg font-bold" style={{color:INK}}>오펀 규칙 · newtype 정리</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:INK}}>
                <span style={{color:BRAND}}>✓</span><span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#fef2ef', bd:'#f4c3b3', tx:INK, icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:INK}}>하나의 계약, 여러 타입의 구현</h3>
            <span className="text-[10px] text-slate-500">trait = 공통 자격증</span>
          </div>
          <TraitContract contract={state.contract} />
          <ImplRows impls={state.impls} callLabel={state.callLabel} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(206,66,43,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#fef2ef 0%,#fde2d8 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>Rs</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:INK}}>Part II. 트레잇</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full" style={{background:'#fff', color:BRAND, border:`1px solid ${BRAND}`}}>II-1-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:INK}}>trait — 동작을 묶는 인터페이스</h1>
                <p className="text-sm" style={{color:BRAND}}>공유 행동의 계약, 기본 구현과 트레잇 바운드</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#f4c3b3'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#CE422Baa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:INK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                trait 는 여러 타입이 공유하는 동작의 계약이다. impl 로 계약을 이행하면 호출부는 하나의 이름으로 다형적으로 부르고, 기본 메서드로 공통 로직을 재사용하며, 트레잇 바운드로 제네릭에 계약을 강제한다. 표준 트레잇(Display·From/Into)을 impl 해 언어 관용구에 올라타되, 오펀 규칙에 막히면 newtype 으로 감싼다. 다음 장에서는 이 계약들을 조합하는 제네릭과 트레잇 객체를 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Rust', 'trait', 'impl', 'trait-bound', 'Display', 'From-Into', 'orphan-rule', 'newtype'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#fef2ef', color:INK, border:'1px solid #f4c3b3'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
