  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    Rust III-1-1. async fn / await — Future 의 lazy 평가
    학습 목표: async fn 호출만으로는 실행되지 않고 .await 또는 executor 가 polling 해야 진행됨을 5단계로 추적
    핵심 비유: 영수증만 받아둔 상태 (Future) → 카운터에 제출(.await) 하면 그제서야 일이 시작
    패턴: 좌(LiveDataPane: Future state machine) / 우(VSCode CodeViewer)
    색상: orange (#CE422B Rust 도메인)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. async fn 정의 — 본문은 즉시 실행되지 않는다',
        desc: 'async fn 은 본문을 그대로 실행하는 함수가 아니라, 본문을 감싼 Future 를 만들어 돌려주는 "생성기"다. 호출만으로는 println! 한 줄도 실행되지 않는다. 이것이 lazy 평가다.',
        flow: {
          caller: { state: 'active', label: 'Caller (fn main)', detail: 'fetch_user(1) 호출' },
          future: { state: 'created', label: 'Future', detail: 'state = Created (대기)' },
          exec:   { state: 'idle',    label: 'Executor (tokio)', detail: '미실행' },
          io:     { state: 'idle',    label: 'I/O (DB · HTTP)', detail: '아무 작업 없음' },
        },
        metric: { state: 'Created', polls: 0, awaited: false, status: 'lazy' },
        keyPoint: 'async fn 호출 = Future 생성. 본문 실행 X. await 필요.',
        code: {
          lang: 'rust',
          filename: 'main.rs',
          lines: [
            '// Step 1. async fn 은 호출만 해도 아무 일이 일어나지 않는다',
            '',
            'async fn fetch_user(id: u64) -> String {',
            '    println!("fetch_user 본문 시작!");',
            '    // 가짜 DB 조회',
            '    format!("user-{}", id)',
            '}',
            '',
            'fn main() {',
            '    // 1) async fn 호출 → Future 만 생성, 본문 실행 X',
            '    let fut = fetch_user(1);',
            '',
            '    // 콘솔에 "fetch_user 본문 시작!" 가 찍히지 않는다',
            '    println!("Future 만 받았다, 본문은 아직");',
            '',
            '    // 2) drop 되어도 본문은 끝까지 한 줄도 실행되지 않는다',
            '    drop(fut);',
            '}',
            '',
            '// 출력:',
            '//   Future 만 받았다, 본문은 아직',
            '//   (fetch_user 본문 시작! 은 출력 안 됨)',
          ],
          highlight: [2, 9, 10, 11, 13, 16, 19, 20, 21],
        },
      },
      {
        title: 'Step 2. .await — Future 를 executor 에 제출',
        desc: 'Future 를 진짜로 진행시키려면 .await 가 필요하다. .await 는 컴파일러가 "현재 함수도 async 여야 한다" 고 강제한다. 즉 async 는 전염성이 있고, 결국 #[tokio::main] 같은 executor 가 root 에서 첫 Future 를 받아 polling 을 시작한다.',
        flow: {
          caller: { state: 'active', label: 'Caller (async fn main)', detail: 'fut.await' },
          future: { state: 'pending', label: 'Future', detail: 'state = Pending' },
          exec:   { state: 'active',  label: 'Executor (tokio)', detail: 'poll(fut)' },
          io:     { state: 'idle',    label: 'I/O (DB · HTTP)', detail: '준비 중' },
        },
        metric: { state: 'Pending', polls: 1, awaited: true, status: 'polling' },
        keyPoint: '.await = executor 에게 "이 Future polling 해줘" 요청. async 는 전염된다.',
        code: {
          lang: 'rust',
          filename: 'main.rs',
          lines: [
            '// Step 2. .await 가 있어야 비로소 본문이 실행된다',
            '',
            'async fn fetch_user(id: u64) -> String {',
            '    println!("fetch_user 본문 시작!");',
            '    format!("user-{}", id)',
            '}',
            '',
            '// async fn main 은 tokio 매크로가 executor 로 감싼다',
            '#[tokio::main]',
            'async fn main() {',
            '    // .await 로 Future 를 executor 에 넘긴다',
            '    let user = fetch_user(1).await;',
            '',
            '    // 이제 본문이 끝까지 실행되고, 결과를 변수에 받는다',
            '    println!("결과: {}", user);',
            '}',
            '',
            '// 출력:',
            '//   fetch_user 본문 시작!',
            '//   결과: user-1',
            '',
            '// 주의:',
            '//   • .await 는 async 컨텍스트(async fn / async block) 안에서만 가능',
            '//   • 따라서 main 도 async 가 되고, 누군가는 첫 executor 를 만들어야 한다',
          ],
          highlight: [7, 8, 9, 10, 11, 13, 14, 17, 18, 19, 21, 22, 23],
        },
      },
      {
        title: 'Step 3. Pending → I/O 대기 — yield 하고 다른 일 처리',
        desc: 'await 이 만난 I/O (네트워크 read / sleep / DB query) 가 즉시 끝나지 않으면 Future 는 Poll::Pending 을 반환한다. 이때 executor 는 이 task 를 잠시 멈추고 다른 task 를 실행한다. 이것이 Rust async 가 "스레드 1개로 수천 작업" 을 처리하는 이유다.',
        flow: {
          caller: { state: 'waiting', label: 'Caller (async fn)', detail: '⏸ Pending 대기' },
          future: { state: 'pending', label: 'Future', detail: 'Poll::Pending 반환' },
          exec:   { state: 'busy',    label: 'Executor (tokio)', detail: '다른 task 실행' },
          io:     { state: 'busy',    label: 'I/O (DB · HTTP)', detail: '⏳ 응답 기다리는 중' },
        },
        metric: { state: 'Pending', polls: 3, awaited: true, status: 'yield' },
        keyPoint: 'Pending = yield. executor 가 다른 task 로 컨텍스트 스위치 (스레드 안 막힘).',
        code: {
          lang: 'rust',
          filename: 'concurrent.rs',
          lines: [
            '// Step 3. await 이 Pending 이면 task 가 yield 되고 executor 가 다른 일을 한다',
            '',
            'use tokio::time::{sleep, Duration};',
            '',
            'async fn slow_io(name: &str, ms: u64) {',
            '    println!("[{}] 시작 (sleep {}ms)", name, ms);',
            '    // .await 가 Pending → executor 가 잠시 멈춤',
            '    sleep(Duration::from_millis(ms)).await;',
            '    println!("[{}] 끝", name);',
            '}',
            '',
            '#[tokio::main]',
            'async fn main() {',
            '    // 동시에 3 개의 Future 띄움 (스레드 1개여도 가능)',
            '    let a = tokio::spawn(slow_io("A", 300));',
            '    let b = tokio::spawn(slow_io("B", 100));',
            '    let c = tokio::spawn(slow_io("C", 200));',
            '',
            '    // 모두 끝날 때까지 await',
            '    let _ = tokio::join!(a, b, c);',
            '}',
            '',
            '// 출력 (순서가 ms 기준으로 섞임):',
            '//   [A] 시작 (sleep 300ms)',
            '//   [B] 시작 (sleep 100ms)',
            '//   [C] 시작 (sleep 200ms)',
            '//   [B] 끝     <- 100ms 라 제일 먼저',
            '//   [C] 끝     <- 200ms',
            '//   [A] 끝     <- 300ms',
          ],
          highlight: [2, 4, 5, 6, 7, 8, 9, 13, 14, 15, 16, 19, 22, 23, 24, 25, 26, 27, 28],
        },
      },
      {
        title: 'Step 4. Ready — I/O 완료 → poll 재개 → 결과 반환',
        desc: 'I/O 가 끝났다는 신호가 reactor (mio/epoll) 에서 전달되면, executor 는 잠들어 있던 task 를 다시 poll 한다. 이때 Future 는 Poll::Ready(value) 를 반환하고, .await 표현식이 그 값으로 평가된다. 호출자는 마치 동기 함수에서 값을 받은 것처럼 다음 줄을 실행한다.',
        flow: {
          caller: { state: 'active', label: 'Caller (async fn)', detail: '값 수신: "user-1"' },
          future: { state: 'ready',  label: 'Future', detail: 'Poll::Ready("user-1")' },
          exec:   { state: 'active', label: 'Executor (tokio)', detail: 're-poll 후 wake' },
          io:     { state: 'done',   label: 'I/O (DB · HTTP)', detail: '✓ 응답 완료' },
        },
        metric: { state: 'Ready', polls: 5, awaited: true, status: 'done' },
        keyPoint: 'Ready = 결과 도착. await 표현식이 값으로 평가되고 호출자 재개.',
        code: {
          lang: 'rust',
          filename: 'result.rs',
          lines: [
            '// Step 4. Future 가 Ready 가 되면 await 가 값을 평가한다',
            '',
            'use reqwest;',
            '',
            'async fn fetch_title(url: &str) -> Result<String, reqwest::Error> {',
            '    // 1) HTTP GET — Pending 동안 yield',
            '    let html = reqwest::get(url).await?.text().await?;',
            '',
            '    // 2) Ready 가 되면 다음 줄이 즉시 실행',
            '    let title = html',
            '        .split("<title>").nth(1)',
            '        .and_then(|s| s.split("</title>").next())',
            '        .unwrap_or("(no title)")',
            '        .to_string();',
            '',
            '    Ok(title)',
            '}',
            '',
            '#[tokio::main]',
            'async fn main() {',
            '    let title = fetch_title("https://example.com").await.unwrap();',
            '    println!("title = {}", title);',
            '}',
            '',
            '// 흐름:',
            '//   reqwest::get  → Pending → yield',
            '//   응답 도착     → wake  → re-poll → Ready(Response)',
            '//   .text()       → Pending → yield',
            '//   바디 도착     → wake  → re-poll → Ready(String)',
            '//   호출자 재개   → title 파싱 → return Ok',
          ],
          highlight: [2, 4, 5, 6, 8, 9, 10, 11, 12, 13, 15, 18, 19, 20, 24, 25, 26, 27, 28, 29],
        },
      },
      {
        title: 'Step 5. 정리 — async/await 와 lazy Future 의 멘탈 모델',
        desc: 'Rust async 는 "코드를 알아서 백그라운드 스레드에 던지는" 마법이 아니다. async fn 은 Future state machine 을 만들고, .await 는 executor 에게 polling 을 위임하며, Pending/Ready 의 순환으로 진행된다. 본문이 실행되지 않는 흔한 버그는 대부분 ".await 빠뜨림" 또는 "Future 를 spawn 하지 않음" 이다.',
        flow: {
          caller: { state: 'idle', label: 'Caller', detail: '루프 끝' },
          future: { state: 'done', label: 'Future', detail: '소멸' },
          exec:   { state: 'idle', label: 'Executor (tokio)', detail: '대기' },
          io:     { state: 'idle', label: 'I/O', detail: '닫힘' },
        },
        metric: { state: 'Done', polls: 5, awaited: true, status: 'recap' },
        summary: {
          title: 'async / await 멘탈 모델',
          points: [
            'async fn 호출 = Future 생성. 본문 실행 X (lazy)',
            '.await = executor 에 polling 위임 + Pending 시 yield',
            'Poll::Pending 동안 스레드는 다른 task 처리 → 동시성',
            'Poll::Ready 면 await 표현식이 값으로 평가되어 재개',
            '"async 전염성" → root 에 #[tokio::main] 같은 executor 필요',
            '본문이 안 도는 흔한 버그 = .await 빼먹음 / 결과를 받기만 함',
          ],
        },
        keyPoint: 'lazy Future → await/spawn 으로만 진행. 컴파일러가 안 잡아주는 동작 버그 1순위.',
        code: {
          lang: 'rust',
          filename: 'mental-model.rs',
          lines: [
            '// Step 5. 자주 만나는 lazy Future 버그 패턴 4 가지',
            '',
            'use tokio::time::{sleep, Duration};',
            '',
            'async fn work(name: &str) {',
            '    println!("[{}] 시작", name);',
            '    sleep(Duration::from_millis(50)).await;',
            '    println!("[{}] 끝",   name);',
            '}',
            '',
            '#[tokio::main]',
            'async fn main() {',
            '    // ✗ Bug 1: .await 빠뜨림 → Future 만 생성하고 버려짐',
            '    work("buggy-1");',
            '',
            '    // ✗ Bug 2: spawn 했지만 join 안 함 → main 종료 시 취소될 수 있음',
            '    tokio::spawn(work("buggy-2"));',
            '',
            '    // ✓ 옳은 방법 1: 그냥 .await',
            '    work("ok-3").await;',
            '',
            '    // ✓ 옳은 방법 2: spawn + handle 보관 + join',
            '    let h = tokio::spawn(work("ok-4"));',
            '    let _ = h.await;',
            '',
            '    // ✓ 옳은 방법 3: 여러 Future 묶어서 join!',
            '    tokio::join!(work("ok-5"), work("ok-6"));',
            '}',
            '',
            '// 출력 (buggy-1 은 절대 나오지 않음):',
            '//   [ok-3] 시작/끝',
            '//   [ok-4] 시작/끝',
            '//   [ok-5] 시작/끝',
            '//   [ok-6] 시작/끝',
            '//   ([buggy-2] 는 보일 수도, 안 보일 수도)',
          ],
          highlight: [10, 11, 12, 13, 15, 16, 18, 19, 21, 22, 23, 25, 26, 29, 30, 31, 32, 33, 34, 35],
        },
      },
    ];

    const NODE_STYLE = {
      idle:    { bg: 'bg-orange-50',   border: 'border-orange-200',  text: 'text-orange-700',  badge: 'IDLE' },
      active:  { bg: 'bg-orange-600',  border: 'border-orange-700',  text: 'text-white',       badge: 'ACTIVE' },
      busy:    { bg: 'bg-amber-500',   border: 'border-amber-700',   text: 'text-white',       badge: 'BUSY' },
      pending: { bg: 'bg-yellow-400',  border: 'border-yellow-600',  text: 'text-yellow-900',  badge: 'PENDING' },
      ready:   { bg: 'bg-emerald-500', border: 'border-emerald-700', text: 'text-white',       badge: 'READY' },
      created: { bg: 'bg-stone-200',   border: 'border-stone-400',   text: 'text-stone-800',   badge: 'CREATED' },
      waiting: { bg: 'bg-orange-200',  border: 'border-orange-400',  text: 'text-orange-900',  badge: 'WAITING' },
      done:    { bg: 'bg-emerald-200', border: 'border-emerald-500', text: 'text-emerald-900', badge: 'DONE' },
    };

    function FlowNode({ node }) {
      const s = NODE_STYLE[node.state] || NODE_STYLE.idle;
      return (
        <div className={`rounded-lg border-2 ${s.bg} ${s.border} px-4 py-3 transition`}>
          <div className="flex items-center justify-between mb-1">
            <span className={`text-sm font-bold ${s.text}`}>{node.label}</span>
            <span className={`text-[9px] px-2 py-0.5 rounded ${s.text === 'text-white' ? 'bg-white/20' : 'bg-white'} font-mono`}>{s.badge}</span>
          </div>
          <div className={`text-xs font-mono ${s.text}`}>{node.detail}</div>
        </div>
      );
    }

    function FlowArrow({ active }) {
      return (
        <div className="flex justify-center my-1">
          <span className={`text-2xl ${active ? 'text-orange-600' : 'text-orange-200'}`}>↓</span>
        </div>
      );
    }

    function MetricBar({ metric }) {
      const STATUS_STYLE = {
        lazy:    'bg-stone-200 text-stone-800',
        polling: 'bg-yellow-200 text-yellow-900',
        yield:   'bg-amber-200 text-amber-900',
        done:    'bg-emerald-200 text-emerald-900',
        recap:   'bg-orange-200 text-orange-900',
      };
      const ss = STATUS_STYLE[metric.status] || STATUS_STYLE.lazy;
      return (
        <div className="mt-3 grid grid-cols-4 gap-2">
          <div className="rounded bg-white border border-orange-200 p-2 text-center">
            <div className="text-[10px] text-orange-700">Future state</div>
            <div className="text-lg font-mono font-bold text-orange-900">{metric.state}</div>
          </div>
          <div className="rounded bg-white border border-orange-200 p-2 text-center">
            <div className="text-[10px] text-orange-700">poll 횟수</div>
            <div className="text-lg font-mono font-bold text-orange-900">{metric.polls}</div>
          </div>
          <div className="rounded bg-white border border-orange-200 p-2 text-center">
            <div className="text-[10px] text-orange-700">awaited</div>
            <div className="text-lg font-mono font-bold text-orange-900">{metric.awaited ? 'yes' : 'no'}</div>
          </div>
          <div className={`rounded p-2 text-center ${ss}`}>
            <div className="text-[10px] opacity-80">상태</div>
            <div className="text-sm font-bold">{metric.status}</div>
          </div>
        </div>
      );
    }

    function SummaryBox({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-orange-500 bg-gradient-to-br from-orange-50 to-amber-50 p-4">
          <div className="text-sm font-bold text-orange-900 mb-2">📋 {summary.title}</div>
          <ul className="space-y-1.5">
            {summary.points.map((p, i) => (
              <li key={i} className="text-sm text-stone-900 flex gap-2">
                <span className="text-orange-600 mt-0.5">▸</span>
                <span>{p}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const f = state.flow;
      return (
        <div className="rounded-xl border border-orange-200 bg-white p-4 h-full flex flex-col" aria-label="Rust async/await Future 흐름 시각화">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-orange-900">async / await Future 흐름</h3>
            <span className="text-[10px] text-orange-700">Caller → Future → Executor → I/O</span>
          </div>
          <FlowNode node={f.caller} />
          <FlowArrow active={f.future.state !== 'idle'} />
          <FlowNode node={f.future} />
          <FlowArrow active={f.exec.state !== 'idle'} />
          <FlowNode node={f.exec} />
          <FlowArrow active={f.io.state !== 'idle'} />
          <FlowNode node={f.io} />
          <MetricBar metric={state.metric} />
          <SummaryBox summary={state.summary} />
          <div className="mt-3 text-xs text-orange-900 bg-orange-50 border border-orange-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg" aria-label="Rust 코드 뷰어">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-orange-500/20 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🦀</span>
              <div>
                <h1 className="text-2xl font-bold text-orange-900">III-1-1. async fn / await — Future lazy 평가</h1>
                <p className="text-sm text-orange-800/80">호출만으로는 안 돈다. await/executor 가 polling 해야 진행</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← Rust 학습 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-600' : 'bg-orange-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                async fn = Future 생성기, 본문은 lazy. .await 가 executor 에 polling 위임, Pending 동안 yield 해서 다른 task 처리, Ready 면 값으로 평가. "async 전염성" → root 에 #[tokio::main]. 본문 안 도는 버그 = .await 빼먹음 / spawn join 안 함.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Rust', 'async', 'await', 'Future', 'lazy', 'tokio', 'Pending', 'Ready'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-orange-700">
              <a href="../index.html" className="underline hover:no-underline">← Rust 학습 목록</a>
              <a href="../curriculum.md" className="underline hover:no-underline">커리큘럼 보기 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
