      var sc = first.closest('[class*="overflow-auto"]');

          out:    { state: 'pending', label: 'Poll<Output>', detail: 'Pending' },

        keyPoint: '첫 poll = Pending + Waker 저장. 저장 안 하면 task 영원히 잠듦.',
        code: {
          lang: 'rust',
          filename: 'delay-future.rs',
          lines: [
            '// Step 2. Pending 반환하며 Waker 저장 — 직접 만든 Delay Future',
            '',
            'use std::future::Future;',
            'use std::pin::Pin;',
            'use std::sync::{Arc, Mutex};',
            'use std::task::{Context, Poll, Waker};',
            'use std::thread;',
            'use std::time::{Duration, Instant};',
            '',
            'pub struct Delay {',
            '    when: Instant,',
            '    waker: Arc<Mutex<Option<Waker>>>,',
            '    spawned: bool,',
            '}',
            '',
            'impl Future for Delay {',
            '    type Output = ();',
            '    fn poll(mut self: Pin<&mut Self>, cx: &mut Context<\'_>) -> Poll<()> {',
            '        // 1) 준비됐는가?',
            '        if Instant::now() >= self.when {',
            '            return Poll::Ready(());',
            '        }',
            '',
            '        // 2) 아직이면 — Waker 저장 + 백그라운드 타이머 한 번만 스폰',
            '        let waker = cx.waker().clone();',
            '        *self.waker.lock().unwrap() = Some(waker);',
            '',
            '        if !self.spawned {',
            '            self.spawned = true;',
            '            let when = self.when;',
            '            let shared = self.waker.clone();',
            '            thread::spawn(move || {',
            '                let now = Instant::now();',
            '                if when > now { thread::sleep(when - now); }',
            '                if let Some(w) = shared.lock().unwrap().take() {',
            '                    w.wake();  // ← executor 에게 "다시 poll 해!"',
            '                }',
            '            });',
            '        }',
            '        Poll::Pending',
            '    }',
            '}',
          ],

        keyPoint: 'Waker.wake() = executor 에 task 재등록. 곧 다시 poll 호출.',

          lang: 'rust',
          filename: 'channel-future.rs',
          lines: [
            '// Step 3. 채널을 받는 Future — Waker 가 wake 되는 순간',
            '',
            'use std::future::Future;',
            'use std::pin::Pin;',
            'use std::sync::{Arc, Mutex};',
            'use std::task::{Context, Poll, Waker};',
            '',
            'pub struct Shared<T> {',
            '    value: Option<T>,',
            '    waker: Option<Waker>,',
            '}',
            '',
            'pub struct Receive<T> {',
            '    inner: Arc<Mutex<Shared<T>>>,',
            '}',
            '',
            'impl<T> Future for Receive<T> {',
            '    type Output = T;',
            '    fn poll(self: Pin<&mut Self>, cx: &mut Context<\'_>) -> Poll<T> {',
            '        let mut g = self.inner.lock().unwrap();',
            '        if let Some(v) = g.value.take() {',
            '            Poll::Ready(v)            // ← 값 있으면 Ready',
            '        } else {',
            '            g.waker = Some(cx.waker().clone());',
            '            Poll::Pending             // ← 없으면 Pending + Waker 저장',
            '        }',
            '    }',
            '}',
            '',
            '// 다른 스레드/task 가 값을 넣을 때',
            'pub fn send<T>(inner: &Arc<Mutex<Shared<T>>>, v: T) {',
            '    let mut g = inner.lock().unwrap();',
            '    g.value = Some(v);',
            '    if let Some(w) = g.waker.take() {',
            '        w.wake();                     // ← 잠든 task 깨움',
            '    }',
            '}',
          ],

            '// ✓ 거의 항상: async fn 으로 충분',
            'async fn fetch(url: &str) -> String {',

            '// ✓ 라이브러리에서 Future 직접 구현하는 경우',
            'use std::future::Future;',
            'use std::pin::Pin;',
            'use std::task::{Context, Poll};',

            'pub struct AlwaysReady<T>(pub Option<T>);',

            '    type Output = T;',

      );
    }
    function FlowArrow({ active }) { return (<div className="flex justify-center my-1"><span className={`text-2xl ${active ? 'text-orange-600' : 'text-orange-200'}`}>↓</span></div>); }
    function MetricBar({ metric }) {
      const STATUS_STYLE = {
        trait: 'bg-stone-200 text-stone-800', first_poll: 'bg-yellow-200 text-yellow-900',
        wake: 'bg-amber-200 text-amber-900', ready: 'bg-emerald-200 text-emerald-900',
        recap: 'bg-orange-200 text-orange-900',
      };
      const ss = STATUS_STYLE[metric.status] || STATUS_STYLE.trait;
      return (
        <div className="mt-3 grid grid-cols-4 gap-2">
          <div className="rounded bg-white border border-orange-200 p-2 text-center"><div className="text-[10px] text-orange-700">poll 호출</div><div className="text-lg font-mono font-bold text-orange-900">{metric.polls}</div></div>
          <div className="rounded bg-white border border-orange-200 p-2 text-center"><div className="text-[10px] text-orange-700">상태</div><div className="text-sm font-mono font-bold text-orange-900">{metric.state}</div></div>
          <div className="rounded bg-white border border-orange-200 p-2 text-center"><div className="text-[10px] text-orange-700">Waker 저장</div><div className="text-lg font-mono font-bold text-orange-900">{metric.waker ? 'yes' : 'no'}</div></div>
          <div className={`rounded p-2 text-center ${ss}`}><div className="text-[10px] opacity-80">단계</div><div className="text-sm font-bold">{metric.status}</div></div>
        </div>
      );
    }
    function SummaryBox({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-orange-500 bg-gradient-to-br from-orange-50 to-amber-50 p-4">
          <div className="text-sm font-bold text-orange-900 mb-2">📋 {summary.title}</div>
          <ul className="space-y-1.5">
            {summary.points.map((p, i) => (
              <li key={i} className="text-sm text-stone-900 flex gap-2"><span className="text-orange-600 mt-0.5">▸</span><span>{p}</span></li>
            ))}
          </ul>
        </div>
      );
    }
    function LiveDataPane({ state }) {
      const f = state.flow;
      return (
        <div className="rounded-xl border border-orange-200 bg-white p-4 h-full flex flex-col" aria-label="Future trait 흐름 시각화">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-orange-900">Future · poll · Waker 흐름</h3>
            <span className="text-[10px] text-orange-700">trait → poll → Context → Output</span>
          </div>
          <FlowNode node={f.trait_} />
          <FlowArrow active={f.poll.state !== 'idle'} />
          <FlowNode node={f.poll} />
          <FlowArrow active={f.ctx.state !== 'idle'} />
          <FlowNode node={f.ctx} />
          <FlowArrow active={f.out.state !== 'idle'} />
          <FlowNode node={f.out} />
          <MetricBar metric={state.metric} />
          <SummaryBox summary={state.summary} />
          <div className="mt-3 text-xs text-orange-900 bg-orange-50 border border-orange-200 rounded p-2">💡 {state.keyPoint}</div>
        </div>
      );
    }
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => { if (codeRef.current && window.hljs) { codeRef.current.removeAttribute('data-highlighted'); window.hljs.highlightElement(codeRef.current); } }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg" aria-label="Rust 코드 뷰어">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span><span className="w-3 h-3 rounded-full bg-yellow-400"></span><span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span><span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1; const isHi = highlightSet.has(lineNo);
                return (<div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-orange-500/20 border-l-2 border-orange-400 -ml-3 pl-2' : ''}`}><span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span><span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} /></div>);
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400"><span>{code.lines.length} lines</span><span>Step {stepIdx + 1} / {total}</span></div>
        </div>
      );
    }
    function App() {
      const [stepIdx, setStepIdx] = useState(0); const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null); const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1)); else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1)); };
        window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => { setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; }); }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-orange-600 text-white font-bold">🦀</span>
              <div><h1 className="text-2xl font-bold text-orange-900">III-2-1. Future trait — poll / Pending / Ready</h1><p className="text-sm text-orange-800/80">Future 의 내부 구조와 Waker 메커니즘을 직접 구현으로 추적</p></div>
              <a href="../index.html" className="ml-auto text-xs text-orange-700 underline hover:no-underline">← Rust 학습 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">{STEPS.map((_, i) => (<div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-orange-600' : 'bg-orange-200'}`} />))}</div>
            <div className="mb-4 rounded-xl bg-orange-800 text-orange-50 px-5 py-4 shadow"><h2 className="text-lg font-bold mb-1">{step.title}</h2><p className="text-sm text-orange-100/90 leading-relaxed">{step.desc}</p></div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4"><LiveDataPane state={step} /><CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} /></div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-orange-900 text-white' : 'bg-orange-600 text-white hover:bg-orange-700'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-orange-300 bg-white text-orange-700 hover:bg-orange-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-orange-700/60 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (<div className="mt-5 rounded-lg border-2 border-orange-500 bg-white px-4 py-3 text-sm text-orange-900"><div className="font-bold mb-1">✅ 핵심 정리</div>Future = trait + poll 메서드 1개. poll(Pin, Context) → Poll&lt;T&gt; (Ready/Pending). Pending 시 cx.waker() 저장 필수, 외부 이벤트가 wake() 호출 → executor 재poll. async fn 은 컴파일러가 이 state machine 을 자동 생성.</div>)}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">{['Rust', 'Future', 'poll', 'Pending', 'Ready', 'Waker', 'Pin', 'Context'].map((k) => (<span key={k} className="px-2 py-0.5 rounded-full bg-orange-100 text-orange-900 border border-orange-200">#{k}</span>))}</div>
            <nav className="mt-6 flex items-center justify-between text-xs text-orange-700"><a href="../index.html" className="underline hover:no-underline">← Rust 학습 목록</a><a href="../curriculum.md" className="underline hover:no-underline">커리큘럼 보기 →</a></nav>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
