<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rust 학습 — IV-2-2. thiserror / anyhow</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🦀</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">

<body>
  <div id="root"></div>
  <!--
    Rust IV-2-2 — thiserror / anyhow (실전 에러 처리 크레이트)
    표준 에러 수동 impl 의 번거로움 / thiserror = derive 로 커스텀 에러 타입 자동 생성 / anyhow = 타입 지우고 ? 로 전파·context 로 맥락
    5단계: std 수동 impl 한계 → thiserror derive → thiserror from → anyhow context → 언제 무엇을 · 함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#CE422B';
    const DARK = '#7a2418';
    const MID = '#a85138';

    const TONE = {
      ok:     { bg: '#dbf3e6', tx: '#166534' },
      warn:   { bg: '#fef3c7', tx: '#92400e' },
      danger: { bg: '#fee2e2', tx: '#991b1b' },
      check:  { bg: '#fef9c3', tx: '#854d0e' },
      neutral:{ bg: '#e2e8f0', tx: '#475569' },
    };

    const STEPS = [
      {
        title: 'Step 1. 표준 에러의 한계 — 손 impl 이 곱셈으로 늘어난다',
        desc: '커스텀 에러 타입을 표준 라이브러리만으로 만들면, 에러 종류마다 Display 를 손으로 match 해서 쓰고, 빈 Error 트레잇 impl 을 붙이고, 원인 에러가 늘 때마다 From 을 하나씩 더 구현해야 한다. 종류 3개에 소스 에러 2개면 impl 이 대여섯 개로 불어난다. 메시지 문구가 impl 안에 흩어져 오타·불일치가 생기고, 리팩터링할 때 놓치기 쉽다. 이 보일러플레이트를 매크로로 걷어내는 것이 thiserror 가 존재하는 이유다.',
        pane: {
          header: '표준 라이브러리 수동 구현',
          note: '에러 종류 × 소스 에러 = impl 폭발',
          rows: [
            { from: 'impl Display', to: '변주마다 손으로 match', tone: 'warn' },
            { from: 'impl Error', to: '빈 impl 반복 부착', tone: 'warn' },
            { from: 'impl From io::Error', to: '변환마다 새 impl', tone: 'danger' },
            { from: 'impl From ParseIntError', to: '또 새 impl…', tone: 'danger' },
          ],
          alert: { tone: 'danger', text: '에러 종류가 늘 때마다 impl 이 곱셈으로 늘어난다 — 보일러플레이트 폭발.' },
        },
        code: {
          lang: 'rust',
          filename: 'manual.rs',
          lines: [
            '// 표준 라이브러리만으로 커스텀 에러를 만들면?',
            'use std::fmt;',
            '',
            '#[derive(Debug)]',
            'enum ConfigError {',
            '    Missing(String),',
            '    Invalid(String),',
            '}',
            '',
            '// 1) Display 를 손으로 구현',
            'impl fmt::Display for ConfigError {',
            '    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {',
            '        match self {',
            '            ConfigError::Missing(k) => write!(f, "설정 없음: {}", k),',
            '            ConfigError::Invalid(k) => write!(f, "잘못된 값: {}", k),',
            '        }',
            '    }',
            '}',
            '',
            '// 2) Error 트레잇도 손으로 구현',
            'impl std::error::Error for ConfigError {}',
            '',
            '// 3) From 도 에러 종류마다 반복 … 보일러플레이트 폭발',
          ],
          highlight: [10, 11, 12, 13, 14, 15, 16, 17, 20, 21, 23],
        },
      },
      {
        title: 'Step 2. thiserror — #[derive(Error)] 한 줄로 타입을 만든다',
        desc: 'thiserror 는 커스텀 에러 "타입" 을 만드는 도구다. enum 에 #[derive(Error)] 를 붙이고 각 변주에 #[error("...")] 메시지만 적으면, Display 와 Error 트레잇 구현이 매크로로 자동 생성된다. {0} 은 튜플 필드, {name} 은 이름 필드를 그대로 메시지에 끼워 넣는다. 메시지가 타입 정의 바로 옆에 모여 있어 오타·불일치가 사라지고, 변주를 추가해도 그 변주에 한 줄만 쓰면 된다. 손 impl 이 통째로 증발한다.',
        pane: {
          header: '#[derive(Error)] 자동 생성',
          note: '메시지가 타입 정의 옆에 모인다',
          rows: [
            { from: '#[error("...")]', to: 'Display 자동 생성', tone: 'ok' },
            { from: '#[derive(Error)]', to: 'Error 트레잇 자동', tone: 'ok' },
            { from: '변주 추가', to: '그 변주에 한 줄만', tone: 'ok' },
          ],
          chips: ['ConfigError::Missing', 'ConfigError::Invalid'],
          alert: { tone: 'ok', text: 'Display · Error 구현을 매크로가 만든다 — 손 impl 이 사라진다.' },
        },
        code: {
          lang: 'rust',
          filename: 'thiserror_basic.rs',
          lines: [
            '// 같은 것을 thiserror 로 — derive 한 줄',
            'use thiserror::Error;',
            '',
            '#[derive(Debug, Error)]',
            'enum ConfigError {',
            '    #[error("설정 없음: {0}")]',
            '    Missing(String),',
            '',
            '    #[error("잘못된 값: {0}")]',
            '    Invalid(String),',
            '}',
            '',
            '// Display · Error 구현이 자동 생성된다',
            '// #[error("...")] 문자열이 그대로 메시지가 된다',
            'fn load() -> Result<(), ConfigError> {',
            '    Err(ConfigError::Missing("DATABASE_URL".into()))',
            '}',
            '',
            '// => 출력: 설정 없음: DATABASE_URL',
          ],
          highlight: [3, 4, 5, 6, 8, 9, 12, 13],
        },
      },
      {
        title: 'Step 3. #[from] — 원인 에러를 자동 변환해 ? 하나로 승격',
        desc: '실무 함수는 여러 종류의 에러를 만난다. 파일 읽기는 io::Error, 파싱은 ParseIntError 를 낸다. 각 변주 필드에 #[from] 을 붙이면 thiserror 가 From<io::Error> 같은 변환을 자동 구현한다. 그러면 ? 연산자 하나가 서로 다른 소스 에러를 모두 우리 AppError 로 승격시킨다. 원인 에러는 source() 로 체인에 보존되어 디버깅 때 추적할 수 있다. 변환 코드를 한 줄도 쓰지 않고 여러 에러를 한 타입으로 모은다.',
        pane: {
          header: '#[from] — 자동 변환 + ? 전파',
          note: '서로 다른 에러 → 하나의 AppError',
          rows: [
            { from: 'io::Error', arrow: '#[from]', to: 'AppError::Io', tone: 'ok' },
            { from: 'ParseIntError', arrow: '#[from]', to: 'AppError::Parse', tone: 'ok' },
            { from: '? 연산자', arrow: '승격', to: '한 타입으로 모임', tone: 'check' },
          ],
          alert: { tone: 'ok', text: 'From 이 자동 생성돼 ? 하나로 다양한 에러가 AppError 로 모인다. 원인은 source() 로 보존.' },
        },
        code: {
          lang: 'rust',
          filename: 'thiserror_from.rs',
          lines: [
            'use thiserror::Error;',
            '',
            '#[derive(Debug, Error)]',
            'enum AppError {',
            '    #[error("파일 읽기 실패")]',
            '    Io(#[from] std::io::Error),',
            '',
            '    #[error("숫자 파싱 실패")]',
            '    Parse(#[from] std::num::ParseIntError),',
            '',
            '    #[error("설정 없음: {0}")]',
            '    Missing(String),',
            '}',
            '',
            '// #[from] 이 From io::Error 를 자동 구현 →',
            '// ? 하나로 서로 다른 에러가 AppError 로 승격된다',
            'fn read_port(path: &str) -> Result<u16, AppError> {',
            '    let text = std::fs::read_to_string(path)?; // io -> AppError',
            '    let port: u16 = text.trim().parse()?;      // parse -> AppError',
            '    Ok(port)',
            '}',
          ],
          highlight: [4, 5, 7, 8, 14, 15, 16, 17, 18],
        },
      },
      {
        title: 'Step 4. anyhow — 타입을 지우고 context 로 맥락을 쌓다',
        desc: 'anyhow 는 반대 전략이다. 커스텀 타입을 만드는 대신 anyhow::Result 로 반환 타입에서 에러 종류를 지운다. 안에는 어떤 에러든 담기므로, io 에러든 toml 에러든 커스텀 에러든 ? 하나로 그대로 전파된다. 핵심은 .context("...") 다 — 전파되는 지점마다 사람이 읽을 맥락을 스택처럼 쌓아, 최종 출력에서 "무엇을 하다가 무엇 때문에" 실패했는지 원인 체인을 보여준다. 애플리케이션(bin)에서 타입 매칭이 필요 없고 빠르게 위로 던지고 싶을 때 최적이다.',
        pane: {
          header: 'anyhow — 하나의 타입 · 맥락 스택',
          note: '무엇이든 ? 로 승격, context 를 쌓음',
          rows: [
            { from: 'io::Error', arrow: '?', to: 'anyhow::Error', tone: 'ok' },
            { from: 'toml::Error', arrow: '?', to: 'anyhow::Error', tone: 'ok' },
            { from: '커스텀 에러', arrow: '?', to: 'anyhow::Error', tone: 'ok' },
          ],
          stack: ['설정 파일을 열 수 없음', '설정 파일 형식이 잘못됨', 'Caused by: expected `=` at line 3'],
          alert: { tone: 'ok', text: 'context() 로 맥락이 스택처럼 쌓여 원인 추적이 쉬워진다 — 앱 코드에 최적.' },
        },
        code: {
          lang: 'rust',
          filename: 'anyhow_app.rs',
          lines: [
            'use anyhow::{Context, Result};',
            '',
            '// 반환 타입에서 에러 종류를 지운다: anyhow::Result<T>',
            'fn load_config(path: &str) -> Result<Config> {',
            '    let text = std::fs::read_to_string(path)',
            '        .context("설정 파일을 열 수 없음")?;      // 맥락 추가',
            '',
            '    let cfg: Config = toml::from_str(&text)',
            '        .context("설정 파일 형식이 잘못됨")?;     // 또 맥락',
            '',
            '    Ok(cfg)',
            '}',
            '',
            '// => Error: 설정 파일 형식이 잘못됨',
            '// =>   Caused by: expected `=` at line 3',
          ],
          highlight: [0, 2, 3, 4, 5, 7, 8, 13, 14],
        },
      },
      {
        title: 'Step 5. 언제 무엇을 — 라이브러리=thiserror · 앱=anyhow',
        desc: '경계에서 결정한다. 라이브러리 크레이트는 호출자가 match 로 분기할 수 있도록 구체 에러 타입을 노출해야 하니 thiserror 를 쓴다. 애플리케이션(bin)은 빠른 전파와 좋은 로그가 목적이니 anyhow 를 쓴다. Box<dyn Error> 도 가능하지만 다운캐스트가 번거롭고 context 기능이 없다. 함정도 분명하다. 라이브러리가 anyhow 를 노출하면 호출자가 타입 매칭을 못 하고, context 없이 ? 만 쓰면 원인이 사라지며, 에러 enum 을 무한정 늘리면 유지보수가 무너진다.',
        pane: {
          header: '경계에서 고른다',
          note: 'lib → 구체 타입 · bin → 빠른 전파',
          rows: [
            { from: '라이브러리(lib)', arrow: '→', to: 'thiserror · 구체 타입 노출', tone: 'ok' },
            { from: '애플리케이션(bin)', arrow: '→', to: 'anyhow · 빠른 전파', tone: 'ok' },
            { from: 'Box<dyn Error>', arrow: '→', to: '다운캐스트·context 없음', tone: 'warn' },
          ],
          pitfalls: [
            'lib 에 anyhow 노출 → 호출자가 match 불가',
            'context 없이 ? → 무엇이 왜 실패했는지 사라짐',
            '에러 enum 폭발 → 경계 단위로 묶어라',
          ],
          alert: { tone: 'check', text: '규칙 한 줄: 타입을 보여줘야 하면 thiserror, 던지기만 하면 anyhow.' },
        },
        code: {
          lang: 'rust',
          filename: 'choose.rs',
          lines: [
            '// 규칙: 경계에서 결정한다',
            '',
            '// ── 라이브러리 크레이트 ── 구체 에러 타입을 노출',
            '//    호출자가 match 로 분기할 수 있어야 한다',
            'pub fn parse(input: &str) -> Result<Ast, ParseError> { // thiserror',
            '    // ...',
            '}',
            '',
            '// ── 애플리케이션(bin) ── 빠른 전파가 목적',
            'fn main() -> anyhow::Result<()> {                      // anyhow',
            '    let ast = parse(&input)',
            '        .context("입력 파싱 단계")?;   // 라이브러리 에러 + 맥락',
            '    run(ast)?;',
            '    Ok(())',
            '}',
            '',
            '// 함정 1: lib 이 anyhow 노출 → 호출자 match 불가',
            '// 함정 2: context 없이 ? → "무엇이 왜" 가 사라진다',
            '// 함정 3: 에러 enum 폭발 → 경계 단위로 묶어라',
          ],
          highlight: [2, 3, 4, 8, 9, 10, 11, 16, 17, 18],
        },
      },
    ];

    const ALERT_STYLE = {
      ok:     { bg: '#dbf3e6', bd: '#86efac', tx: '#166534', icon: '✅' },
      warn:   { bg: '#fef3c7', bd: '#fde68a', tx: '#92400e', icon: '⚠️' },
      danger: { bg: '#fee2e2', bd: '#fecaca', tx: '#991b1b', icon: '🚨' },
      check:  { bg: '#fef9c3', bd: '#fde047', tx: '#854d0e', icon: '🧭' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.ok;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{ background: s.bg, border: `1px solid ${s.bd}`, color: s.tx }}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function FlowRows({ rows }) {
      return (
        <div className="space-y-2">
          {rows.map((r, i) => {
            const s = TONE[r.tone] || TONE.neutral;
            return (
              <div key={i} className="flex items-center gap-2 text-xs">
                <span className="w-32 font-mono font-bold shrink-0" style={{ color: DARK }}>{r.from}</span>
                <span className="shrink-0 text-[10px] px-1.5 py-0.5 rounded" style={{ background: '#fef2ef', color: BRAND, border: `1px solid #f4c3b3` }}>{r.arrow || '→'}</span>
                <span className="flex-1 font-mono px-2 py-0.5 rounded" style={{ background: s.bg, color: s.tx }}>{r.to}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function ChipRow({ chips }) {
      if (!chips) return null;
      return (
        <div className="mt-3 flex flex-wrap gap-1.5">
          {chips.map((c, i) => (
            <span key={i} className="text-[11px] font-mono px-2 py-0.5 rounded" style={{ background: '#dbf3e6', color: '#166534', border: '1px solid #86efac' }}>{c}</span>
          ))}
        </div>
      );
    }

    function ContextStack({ stack }) {
      if (!stack) return null;
      return (
        <div className="mt-3 rounded-lg p-3" style={{ border: `1px dashed ${BRAND}`, background: '#fff8f6' }}>
          <div className="text-[11px] font-bold mb-2" style={{ color: DARK }}>context 스택 (아래로 쌓임)</div>
          <div className="space-y-1">
            {stack.map((line, i) => (
              <div key={i} className="flex items-center gap-2 text-[11px] font-mono" style={{ paddingLeft: `${i * 12}px`, color: MID }}>
                <span style={{ color: BRAND }}>{i === 0 ? '▸' : '↳'}</span>
                <span>{line}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function PitfallBox({ pitfalls }) {
      if (!pitfalls) return null;
      return (
        <div className="mt-3 rounded-xl p-3" style={{ border: `2px solid #fecaca`, background: '#fef2f2' }}>
          <div className="flex items-center gap-2 mb-1.5">
            <span>🚨</span>
            <span className="text-sm font-bold" style={{ color: '#991b1b' }}>실무 함정 3가지</span>
          </div>
          <ul className="space-y-1">
            {pitfalls.map((p, i) => (
              <li key={i} className="text-xs flex gap-2" style={{ color: '#991b1b' }}>
                <span>✗</span><span>{p}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const p = state.pane;
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{ border: `1px solid ${BRAND}` }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: DARK }}>thiserror(타입) vs anyhow(전파)</h3>
            <span className="text-[10px] text-slate-500">에러 처리 크레이트</span>
          </div>
          <div className="rounded-lg overflow-hidden" style={{ border: `2px solid ${BRAND}` }}>
            <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{ background: BRAND }}>
              <span>🦀</span>
              <span>{p.header}</span>
              <span className="ml-auto text-[10px] px-2 py-0.5 rounded bg-white/20">{p.note}</span>
            </div>
            <div className="p-3">
              <FlowRows rows={p.rows} />
              <ChipRow chips={p.chips} />
              <ContextStack stack={p.stack} />
            </div>
          </div>
          <PitfallBox pitfalls={p.pitfalls} />
          <AlertBox alert={p.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? { background: 'rgba(206,66,43,0.18)', borderLeft: `2px solid ${BRAND}` } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg,#fef2ef 0%,#fde2d8 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-11 h-11 rounded-lg text-white font-bold text-xs leading-tight text-center" style={{ background: BRAND }}>IV<br/>2-2</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{ background: MID }}>Part IV. 안전성</span>
                  <span className="text-[10px] font-mono" style={{ color: MID }}>IV-2-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{ color: DARK }}>thiserror / anyhow</h1>
                <p className="text-sm" style={{ color: BRAND }}>실전 에러 처리 크레이트 — 라이브러리는 thiserror · 애플리케이션은 anyhow</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BRAND }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ background: i <= stepIdx ? BRAND : '#f4c3b3' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{ background: BRAND }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ background: BRAND }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#CE422Baa' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{ border: `2px solid ${BRAND}`, color: DARK }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                표준 에러의 수동 impl 은 종류가 늘수록 곱셈으로 불어난다. thiserror 는 #[derive(Error)] 와 #[error]·#[from] 으로 커스텀 에러 "타입" 을 자동 생성해 라이브러리가 구체 에러를 노출하게 하고, anyhow 는 타입을 지운 Result 와 context() 로 앱이 맥락을 쌓으며 빠르게 전파하게 한다. 경계에서 나누어라 — 보여줄 타입은 thiserror, 던질 뿐이면 anyhow. Part IV 안전성 여정은 여기서 마무리, 다음 장에서 새 주제로 넘어간다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Rust', 'thiserror', 'anyhow', 'error-handling', 'derive-Error', 'from', 'context'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{ background: '#fef2ef', color: DARK, border: '1px solid #f4c3b3' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BRAND }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="underline hover:no-underline">다음: V-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
