  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);

<body>
  <div id="root"></div>
  <!--
    Rust IV-2-1 — panic! 과 unwrap (복구 불가능한 에러의 처리)
    panic! = 복구 불가(스택 되감기·중단), Result = 복구 가능
    unwrap/expect 는 내부적으로 panic 을 부른다. 언제 패닉하고 언제 Result 로 돌려줄까.
    5단계: panic 정의 → unwrap 의 정체 → 암묵 패닉 → 언제 패닉 OK → catch_unwind·panic=abort·현장 함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#CE422B';

    const STEPS = [
      {
        title: 'Step 1. panic! — 복구 불가능한 에러의 비상 정지',
        desc: 'panic! 은 "여기서 더 진행하면 안 된다"는 복구 불가능한 상황을 알린다. 호출되면 스택을 되감으며(unwind) 각 변수의 drop 을 실행하고 스레드를 종료한다. 반대로 Result 는 파일이 없거나 입력이 잘못된 것처럼 호출자가 대응할 수 있는 복구 가능 에러를 값으로 돌려준다. 판단 기준은 하나다. 호출자가 의미 있게 대처할 수 있으면 Result, 프로그램의 불변식이 깨졌으면 panic!.',
        input: { kind: 'panic', label: 'panic!("불변식 위반")', variant: 'panic' },
        op: 'panic! 매크로 실행',
        stack: [
          { fn: 'main', note: '진입점', status: 'unwind' },
          { fn: 'run_app', note: 'drop 실행', status: 'unwind' },
          { fn: 'validate', note: 'panic! 발생 지점', status: 'panic' },
        ],
        outcome: { tone: 'danger', text: '스택을 되감으며 종료 — 이 스레드에서는 이후 코드가 실행되지 않는다.' },
        alert: { tone: 'danger', text: 'panic 은 흐름 제어가 아니라 비상 정지다. 복구 가능한 에러에 쓰면 안 된다.' },
        code: {
          lang: 'rust',
          filename: 'panic_vs_result.rs',
          lines: [
            '// 복구 불가 vs 복구 가능 — 축을 먼저 잡는다',
            '',
            '// 복구 불가: 프로그램의 불변식이 깨졌다',
            'fn validate(age: i32) {',
            '    if age < 0 {',
            '        panic!("나이는 음수가 될 수 없다: {age}");',
            '    }',
            '}',
            '',
            '// 복구 가능: 호출자가 대응할 수 있다',
            'fn parse_age(s: &str) -> Result<i32, std::num::ParseIntError> {',
            '    s.trim().parse::<i32>()   // 실패해도 값으로 돌려준다',
            '}',
            '',
            '// panic! => 스택 되감기(unwind) 후 스레드 종료',
            '// Result => 호출자가 match 로 선택',
          ],
          highlight: [3, 4, 5, 6, 7, 14, 15],
        },
      },
      {
        title: 'Step 2. unwrap 의 정체 — 숨겨진 panic',
        desc: 'unwrap 은 마법이 아니다. Option 이 Some 이거나 Result 가 Ok 면 안의 값을 꺼내 주지만, None 이나 Err 를 만나면 즉시 panic 을 호출한다. 즉 unwrap 을 쓰는 순간 "이 값은 절대 비어 있지 않다"고 컴파일러가 아니라 당신이 보증하는 것이다. 그 보증이 틀리면 프로그램이 죽는다. 그래서 unwrap 은 편해 보이지만 실은 panic 을 코드 곳곳에 뿌리는 일이다.',
        input: { kind: 'Result', label: 'Ok(42)', variant: 'Ok', value: '42' },
        op: '.unwrap()  →  42',
        stack: [
          { fn: 'main', note: '값 42 를 받음', status: 'ok' },
          { fn: '.unwrap()', note: 'Ok 이므로 값 반환', status: 'ok' },
        ],
        outcome: { tone: 'good', text: 'Ok/Some 이면 값을 그대로 반환한다 — 이때는 문제가 없다.' },
        alert: { tone: 'warn', text: 'unwrap 은 "비어 있으면 panic" 이라는 뜻. 편의가 아니라 보증이다.' },
        code: {
          lang: 'rust',
          filename: 'unwrap_inside.rs',
          lines: [
            '// unwrap 은 내부적으로 이런 코드다 (개념)',
            'fn unwrap<T>(opt: Option<T>) -> T {',
            '    match opt {',
            '        Some(v) => v,              // => 값을 꺼낸다',
            '        None => panic!("called unwrap on None"),',
            '    }',
            '}',
            '',
            '// 실제 사용',
            'let ok: Result<i32, String> = Ok(42);',
            'let n = ok.unwrap();       // => 42 (Ok 이라 안전)',
            '',
            'let bad: Result<i32, String> = Err("타임아웃".into());',
            '// let n = bad.unwrap();   // panic! 스택 되감기 시작',
          ],
          highlight: [1, 2, 3, 4, 5, 6, 10, 11],
        },
      },
      {
        title: 'Step 3. expect — panic 에 의미를 남긴다',
        desc: 'unwrap 이 None/Err 에서 panic 할 때 남기는 메시지는 맥락이 없어 원인 추적이 어렵다. expect 는 같은 동작이지만 당신이 적은 메시지를 패닉 로그에 남긴다. 좋은 메시지는 "무엇이 실패했나"가 아니라 "무엇을 기대했는데 왜 깨졌나"를 적는다. 예: expect("설정 파일은 시작 시 로드되어 항상 존재해야 한다"). 어차피 unwrap 을 써야 한다면 expect 로 미래의 자신에게 단서를 남겨라.',
        input: { kind: 'Result', label: 'Err("파일 없음")', variant: 'Err', value: '파일 없음' },
        op: '.expect("설정 로드 실패")  →  panic!',
        message: "설정은 시작 시 로드되어 항상 존재해야 한다",
        stack: [
          { fn: 'main', note: 'drop 실행', status: 'unwind' },
          { fn: 'load_config', note: '.expect(...) 호출', status: 'panic' },
        ],
        outcome: { tone: 'danger', text: 'panic 로그에 expect 메시지가 그대로 찍혀 원인을 즉시 알 수 있다.' },
        alert: { tone: 'warn', text: 'unwrap 대신 expect. 메시지엔 "무엇을 기대했는지"를 적는다.' },
        code: {
          lang: 'rust',
          filename: 'expect_message.rs',
          lines: [
            'use std::fs;',
            '',
            '// 나쁜 예: 원인을 알 수 없는 패닉',
            'let cfg = fs::read_to_string("app.toml").unwrap();',
            '//  panic: called `Result::unwrap()` on an `Err` value ...',
            '',
            '// 좋은 예: 기대와 이유를 남긴다',
            'let cfg = fs::read_to_string("app.toml")',
            '    .expect("설정은 시작 시 로드되어 항상 존재해야 한다");',
            '//  panic: 설정은 시작 시 로드되어 항상 존재해야 한다: Os { ... }',
            '',
            '// => 로그만 보고도 원인·위치를 특정할 수 있다',
          ],
          highlight: [3, 4, 5, 7, 8, 9, 10],
        },
      },
      {
        title: 'Step 4. 암묵 패닉 — 내가 부르지 않아도 터진다',
        desc: 'panic 은 unwrap 으로만 오지 않는다. 배열/슬라이스를 범위 밖 인덱스로 접근하면(arr[10]) 즉시 패닉하고, 디버그 빌드에서 정수 오버플로도 패닉한다(릴리스는 래핑). 0 으로 나누기, 잘못된 슬라이스 경계도 마찬가지다. 그래서 인덱스 접근보다 get 을 써서 Option 으로 받고, 산술은 checked_add 같은 안전 연산으로 처리하는 습관이 프로덕션 안정성을 가른다.',
        input: { kind: 'Index', label: 'v = [10, 20, 30];  v[5]', variant: 'panic', value: 'index 5 / len 3' },
        op: 'v[5]  →  panic (범위 초과)',
        stack: [
          { fn: 'main', note: 'drop 실행', status: 'unwind' },
          { fn: 'Index::index', note: '경계 검사 실패', status: 'panic' },
        ],
        outcome: { tone: 'danger', text: 'index out of bounds: len is 3 but index is 5 — 런타임 패닉.' },
        alert: { tone: 'info', text: '인덱싱 대신 .get(i) 로 Option 받기, 산술은 checked_*/saturating_* 로 방어.' },
        code: {
          lang: 'rust',
          filename: 'implicit_panic.rs',
          lines: [
            'let v = vec![10, 20, 30];',
            '',
            '// 암묵 패닉 1: 범위 초과 인덱싱',
            '// let x = v[5];   // panic: index out of bounds',
            '',
            '// 안전한 대안: get 은 Option 을 돌려준다',
            'match v.get(5) {',
            '    Some(x) => println!("값 {x}"),',
            '    None => println!("범위 밖 — 패닉 없이 처리"),',
            '}',
            '',
            '// 암묵 패닉 2: 정수 오버플로 (디버그 빌드)',
            'let a: u8 = 250;',
            '// let b = a + 10;          // debug 에서 panic',
            'let b = a.checked_add(10);  // => None (안전)',
          ],
          highlight: [3, 4, 6, 7, 8, 9, 10, 12, 13, 14, 15],
        },
      },
      {
        title: 'Step 5. 언제 패닉? — 경계·설정·현장 함정',
        desc: 'panic 이 정당한 경우가 있다. 프로토타입/테스트에서 빠르게 실패시킬 때, 논리적으로 불가능한 불변식이 깨졌을 때, 정말 복구할 수 없을 때다. 반대로 라이브러리는 호출자의 선택권을 뺏지 않도록 Result 를 선호한다. 경계에서만 catch_unwind 로 패닉을 붙잡아 스레드 붕괴를 막고, 릴리스 바이너리 크기·속도를 위해 panic=abort 로 되감기를 끌 수도 있다. 현장 함정 셋: 프로덕션 코드의 unwrap, 부실한 expect 메시지, 패닉을 흐름 제어로 쓰는 것.',
        input: { kind: 'Guide', label: '패닉 OK vs Result 선호', variant: 'ok' },
        op: '경계에서 catch_unwind / panic=abort',
        stack: [
          { fn: 'thread::spawn', note: '작업 스레드', status: 'ok' },
          { fn: 'catch_unwind', note: '패닉을 Result 로 포착', status: 'check' },
          { fn: 'main', note: '전체 붕괴 방지', status: 'ok' },
        ],
        guide: [
          '패닉 OK: 프로토타입/테스트, 불변식 위반, 정말 복구 불가',
          '라이브러리: Result 선호 — 호출자가 선택하게',
          'catch_unwind: 경계(스레드·FFI)에서만, 흐름 제어 금지',
          'panic=abort: 되감기 제거로 바이너리 축소·속도',
        ],
        outcome: { tone: 'good', text: '핵심: 복구 가능하면 Result, 불변식이 깨졌으면 panic. unwrap 은 보증할 때만.' },
        alert: { tone: 'danger', text: '현장 함정: 프로덕션 unwrap · 부실한 expect · 패닉을 흐름 제어로 사용.' },
        code: {
          lang: 'rust',
          filename: 'when_to_panic.rs',
          lines: [
            'use std::panic;',
            '',
            '// 라이브러리 함수: 패닉하지 말고 Result 로 돌려준다',
            'pub fn divide(a: i32, b: i32) -> Result<i32, String> {',
            '    if b == 0 {',
            '        return Err("0 으로 나눌 수 없다".into());',
            '    }',
            '    Ok(a / b)   // => 호출자가 대응 선택',
            '}',
            '',
            '// 경계에서만: 작업 스레드의 패닉이 전체를 죽이지 않게',
            'let result = panic::catch_unwind(|| {',
            '    risky_task()   // panic 하면 여기서 포착',
            '});',
            'if result.is_err() {',
            '    eprintln!("작업 실패 — 스레드는 계속 산다");',
            '}',
            '',
            '// Cargo.toml: [profile.release] panic = "abort"',
            '//   되감기 제거 => 바이너리 축소·속도 향상',
          ],
          highlight: [3, 4, 5, 6, 7, 8, 11, 12, 13, 14, 15, 16, 17],
        },
      },
    ];

    const STATUS_TONE = {
      ok:     { bg: '#dbf3e6', tx: '#166534', dot: '#16a34a' },
      unwind: { bg: '#fde68a', tx: '#92400e', dot: '#d97706' },
      panic:  { bg: '#fee2e2', tx: '#991b1b', dot: '#dc2626' },
      check:  { bg: '#fef9c3', tx: '#854d0e', dot: '#ca8a04' },
    };

    function InputBox({ input, op }) {
      const isPanic = input.variant === 'panic' || input.variant === 'Err';
      const tone = isPanic ? { bg: '#fee2e2', tx: '#991b1b', bd: '#fecaca' }
                           : { bg: '#dbf3e6', tx: '#166534', bd: '#86efac' };
      return (
        <div className="rounded-lg p-3" style={{ background: tone.bg, border: `1px solid ${tone.bd}` }}>
          <div className="text-[10px] font-bold mb-1" style={{ color: tone.tx }}>입력 값</div>
          <div className="font-mono text-sm font-bold" style={{ color: tone.tx }}>{input.label}</div>
          <div className="mt-2 text-[11px] font-mono px-2 py-1 rounded bg-white/70" style={{ color: '#7a2418' }}>{op}</div>
          {input.value ? (
            <div className="mt-1 text-[10px]" style={{ color: tone.tx }}>세부: {input.value}</div>
          ) : null}
        </div>
      );
    }

    function CallStack({ stack }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{ border: `2px solid ${BRAND}` }}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{ background: BRAND }}>
            <span>🧵</span>
            <span>호출 스택 — 되감기(unwind)</span>
            <span className="ml-auto text-[10px] px-2 py-0.5 rounded bg-white/20">위 = 나중 프레임</span>
          </div>
          <div className="p-3 space-y-1.5">
            {stack.map((f, i) => {
              const s = STATUS_TONE[f.status] || STATUS_TONE.ok;
              return (
                <div key={i} className="flex items-center gap-2 text-xs rounded px-2 py-1"
                     style={{ background: s.bg, color: s.tx, transform: f.status === 'unwind' ? 'translateX(6px)' : 'none', transition: 'transform .3s' }}>
                  <span className="w-2 h-2 rounded-full" style={{ background: s.dot }}></span>
                  <span className="w-28 font-mono font-bold">{f.fn}</span>
                  <span className="flex-1">{f.note}</span>
                  {f.status === 'panic' ? <span className="text-[10px] font-bold">💥 panic</span> : null}
                  {f.status === 'unwind' ? <span className="text-[10px]">↑ drop</span> : null}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function MessageBox({ message }) {
      if (!message) return null;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs font-mono" style={{ background: '#1f2937', color: '#fde68a', border: '1px solid #374151' }}>
          <span className="opacity-70">panic log &gt; </span>{message}
        </div>
      );
    }

    function GuideBox({ guide }) {
      if (!guide) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{ border: `2px solid ${BRAND}`, background: '#fef2ef' }}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🦀</span>
            <span className="text-base font-bold" style={{ color: '#7a2418' }}>언제 패닉? — 판단 가이드</span>
          </div>
          <ul className="space-y-1.5">
            {guide.map((g, i) => (
              <li key={i} className="text-sm flex gap-2" style={{ color: '#7a2418' }}>
                <span style={{ color: BRAND }}>✓</span>
                <span>{g}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#fef2ef', bd: '#f4c3b3', tx: '#7a2418', icon: '💡' },
      warn:   { bg: '#fef3c7', bd: '#fde68a', tx: '#92400e', icon: '⚠️' },
      danger: { bg: '#fee2e2', bd: '#fecaca', tx: '#991b1b', icon: '🚨' },
      good:   { bg: '#dbf3e6', bd: '#86efac', tx: '#166534', icon: '✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{ background: s.bg, border: `1px solid ${s.bd}`, color: s.tx }}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function OutcomeBox({ outcome }) {
      if (!outcome) return null;
      const s = ALERT_STYLE[outcome.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2.5 text-xs font-bold flex gap-2" style={{ background: s.bg, border: `1px solid ${s.bd}`, color: s.tx }}>
          <span>{s.icon}</span><span>{outcome.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{ border: `1px solid ${BRAND}` }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#7a2418' }}>unwrap / expect / panic 의 흐름</h3>
            <span className="text-[10px] text-slate-500">Some·Ok = 값 / None·Err = panic</span>
          </div>
          <InputBox input={state.input} op={state.op} />
          <div className="my-2 text-center text-[11px]" style={{ color: BRAND }}>▼</div>
          <CallStack stack={state.stack} />
          <MessageBox message={state.message} />
          <GuideBox guide={state.guide} />
          <OutcomeBox outcome={state.outcome} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? { background: 'rgba(206,66,43,0.18)', borderLeft: `2px solid ${BRAND}` } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg,#fef2ef 0%,#fde2d8 100%)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ background: BRAND }}>Rs</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{ background: '#a85138' }}>Part IV. 안전성</span>
                  <span className="text-[10px] font-mono" style={{ color: BRAND }}>IV-2-1</span>
                </div>
                <h1 className="text-2xl font-bold mt-1" style={{ color: '#7a2418' }}>panic! 과 unwrap</h1>
                <p className="text-sm" style={{ color: '#CE422B' }}>복구 불가능한 에러의 처리 — 언제 패닉하고 언제 Result 로 돌려줄까</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: BRAND }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ background: i <= stepIdx ? BRAND : '#f4c3b3' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{ background: BRAND }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ background: BRAND }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{ border: `1px solid ${BRAND}`, color: BRAND }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#CE422Baa' }}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{ border: `2px solid ${BRAND}`, color: '#7a2418' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                panic! 은 복구 불가능한 상황의 비상 정지이고, Result 는 호출자가 대응할 수 있는 복구 가능한 에러다. unwrap/expect 는 내부적으로 panic 을 부르므로 "값이 절대 비지 않는다"고 보증할 때만 쓰고, 어차피 쓸 거면 expect 로 이유를 남긴다. 라이브러리는 Result 를 선호하고, 패닉은 경계에서만 catch_unwind 로 다룬다. 다음에는 복구 가능한 에러를 다루는 Result 와 ? 연산자를 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Rust', 'panic', 'unwrap', 'expect', 'Result', 'catch_unwind', 'panic-abort'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{ background: '#fef2ef', color: '#7a2418', border: '1px solid #f4c3b3' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: BRAND }}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
