  <div id="root"></div>
  <!--
    Rust IV-1-2 — Result 와 ? 연산자 (비유: 공장 조립 라인의 품질 검사 통과증)
    각 공정은 Ok(합격) 또는 Err(불량)를 반환한다. ? 는 합격이면 다음 공정으로 통과시키고
    불량이면 라인을 멈추고 상위로 즉시 반송한다. From 은 하위 라인의 불량표를 상위 규격으로 승격한다.
    5단계: Result 정의 → match 처리 → ? 전파 → From 변환 → 콤비네이터/Option 상호변환 + main
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#CE422B';

    const STEPS = [
      {
        title: 'Step 1. Result — 실패를 예외가 아니라 "값"으로 반환한다',
        desc: 'Rust 에는 예외(try/catch)가 없다. 실패할 수 있는 함수는 Result 타입, 즉 Ok(성공값) 또는 Err(에러값) 중 하나를 반환한다. 왜 이렇게 할까. 예외는 함수 시그니처에 드러나지 않아 어디서 터질지 호출자가 알 수 없지만, Result 는 타입에 "이 함수는 실패할 수 있다"가 새겨져 있어 컴파일러가 처리를 강제한다. Result 는 must_use 로 표시돼 있어 결과를 그냥 버리면 경고가 뜬다 — 실패를 조용히 삼키는 실수를 컴파일 단계에서 막는다.',
        frames: [
          { name: 'parse_port', ret: 'Ok(8080)', tone: 'ok', note: '성공 → 값을 감싸서 반환' },
          { name: 'parse_port', ret: 'Err(ParseError)', tone: 'danger', note: '실패 → 에러를 값으로 반환' },
        ],
        flowLabel: 'Result = Ok(T) | Err(E) — 둘 중 하나',
        conversion: null,
        alert: { tone: 'info', text: '예외가 없다는 건 곧 "실패가 리턴 타입에 보인다"는 뜻이다 — 숨은 제어 흐름이 사라진다.' },
        code: {
          lang: 'rust',
          filename: 'result_basics.rs',
          lines: [
            '// Result 는 표준 라이브러리의 열거형이다',
            'enum Result<T, E> {',
            '    Ok(T),   // 성공: 값 T 를 담는다',
            '    Err(E),  // 실패: 에러 E 를 담는다',
            '}',
            '',
            '// 실패할 수 있는 함수는 Result 를 반환한다',
            'fn parse_port(s: &str) -> Result<u16, std::num::ParseIntError> {',
            '    let port: u16 = s.parse()?;  // 문자열 → 숫자',
            '    Ok(port)',
            '}',
            '',
            'fn main() {',
            '    let r = parse_port("8080");',
            '    // => r == Ok(8080)',
            '',
            '    // #[must_use]: 결과를 안 쓰면 컴파일 경고',
            '    parse_port("oops");  // warning: unused Result',
            '}',
          ],
          highlight: [1, 2, 3, 4, 7, 8, 9, 10],
        },
      },
      {
        title: 'Step 2. match — 성공과 실패를 눈에 보이게 나눠 처리한다',
        desc: 'Result 를 받으면 두 갈래를 모두 다뤄야 한다. 가장 기본은 match 로 Ok 와 Err 를 갈라 처리하는 것이다. 컴파일러는 두 갈래를 모두 처리했는지 검사하므로 "실패 케이스를 깜빡"하는 일이 원천 차단된다. 반대로 unwrap 이나 expect 는 Ok 면 값을 꺼내지만 Err 면 그 자리에서 panic 으로 프로그램을 죽인다. 예제 코드나 프로토타입에서는 편하지만, 프로덕션에서 남발하면 사용자 입력 하나에 서버가 통째로 내려앉는다. expect 는 "여기서 실패하면 절대 복구 불가"인 곳에만 쓴다.',
        frames: [
          { name: 'match Ok(v)', ret: 'v 를 꺼내 사용', tone: 'ok', note: '성공 경로 — 정상 처리' },
          { name: 'match Err(e)', ret: '로그·기본값·재시도', tone: 'warn', note: '실패 경로 — 반드시 다룬다' },
          { name: '.unwrap()', ret: 'Err 이면 panic!', tone: 'danger', note: '프로덕션 남발 금지' },
        ],
        flowLabel: 'match 는 두 갈래를 강제한다 — 빠뜨릴 수 없다',
        conversion: null,
        alert: { tone: 'danger', text: 'unwrap / expect 는 "실패 = 프로그램 종료" 선언이다. 남발하면 입력 한 줄에 전체가 panic 한다.' },
        code: {
          lang: 'rust',
          filename: 'handle_match.rs',
          lines: [
            'fn main() {',
            '    // 1) match — 두 갈래를 모두 처리 (안전)',
            '    match parse_port("8080") {',
            '        Ok(port) => println!("listening on {port}"),',
            '        Err(e)   => eprintln!("bad port: {e}"),',
            '    }',
            '',
            '    // 2) unwrap_or — 실패 시 기본값으로 대체',
            '    let port = parse_port("oops").unwrap_or(3000);',
            '    // => port == 3000',
            '',
            '    // 3) unwrap / expect — 실패 시 panic',
            '    let n = parse_port("8080").unwrap();     // Ok → 8080',
            '    let m = parse_port("x").expect("port required");',
            '    // => panic: port required: invalid digit...',
            '}',
          ],
          highlight: [2, 3, 4, 5, 6, 8, 9, 12, 13, 14],
        },
      },
      {
        title: 'Step 3. ? 연산자 — 합격이면 통과, 불량이면 즉시 반송',
        desc: '실무 코드는 실패할 수 있는 함수를 연달아 호출한다. 매번 match 로 풀면 성공 로직이 에러 처리에 파묻힌다. ? 연산자가 이걸 한 글자로 압축한다. 식 뒤에 ? 를 붙이면, Ok 면 값을 꺼내 그 자리에 놓고, Err 면 함수를 그 즉시 중단하고 그 에러를 호출자에게 반환한다. 조립 라인의 품질 검사와 같다 — 합격품은 다음 공정으로 흘려보내고, 불량이 하나라도 나오면 라인을 세우고 상위로 반송한다. 덕분에 성공 경로만 위에서 아래로 곧게 읽히고, 실패 경로는 ? 한 글자에 위임된다.',
        frames: [
          { name: 'read_file(path)?', ret: 'Ok → 내용 통과', tone: 'ok', note: '합격 → 다음 줄로' },
          { name: 'parse(content)?', ret: 'Err → 즉시 return', tone: 'danger', note: '불량 → 라인 정지·반송' },
          { name: 'validate(cfg)?', ret: '(도달 안 함)', tone: 'idle', note: '앞에서 반송돼 실행 안 됨' },
        ],
        flowLabel: '? = Ok 면 값 꺼내 통과 · Err 면 조기 return',
        conversion: null,
        alert: { tone: 'good', text: '? 는 "성공이면 계속, 실패면 여기서 끝"을 한 글자로 표현한다 — 성공 경로가 곧게 읽힌다.' },
        code: {
          lang: 'rust',
          filename: 'question_op.rs',
          lines: [
            'use std::fs;',
            '',
            '// ? 가 없으면 — match 지옥',
            'fn load_verbose(path: &str) -> Result<Config, std::io::Error> {',
            '    let text = match fs::read_to_string(path) {',
            '        Ok(t) => t,',
            '        Err(e) => return Err(e),  // 손으로 반송',
            '    };',
            '    Ok(Config { raw: text })',
            '}',
            '',
            '// ? 를 쓰면 — 성공 경로만 남는다',
            'fn load(path: &str) -> Result<Config, std::io::Error> {',
            '    let text = fs::read_to_string(path)?;  // Err 면 즉시 return',
            '    Ok(Config { raw: text })',
            '    // => 파일이 없으면 io::Error 가 그대로 호출자에게 전파',
            '}',
          ],
          highlight: [12, 13, 14, 15, 16],
        },
      },
      {
        title: 'Step 4. From 변환 — 하위 에러를 상위 규격으로 승격한다',
        desc: '? 의 진짜 힘은 에러 타입 변환에 있다. 함수가 반환하는 에러 타입과, ? 를 붙인 식이 내는 에러 타입이 다를 수 있다. 이때 ? 는 From 트레잇을 통해 하위 에러를 함수의 에러 타입으로 자동 변환한 뒤 반환한다. 예를 들어 io::Error 와 ParseIntError 를 각각 내는 두 호출을, 상위 함수는 하나의 AppError 로 통일해 던질 수 있다 — From 구현만 있으면 ? 가 알아서 승격한다. 이것이 여러 계층의 서로 다른 에러를 한 지점에서 일관되게 다루는 핵심이다. 실무 함정: From 구현이 없으면 "? 는 이 에러 타입을 변환할 수 없다"는 컴파일 에러가 난다 — thiserror 크레이트로 이 변환을 자동 생성하는 게 관행이다.',
        frames: [
          { name: 'io::Error', ret: 'From → AppError::Io', tone: 'warn', note: '하위 에러 A' },
          { name: 'ParseIntError', ret: 'From → AppError::Parse', tone: 'warn', note: '하위 에러 B' },
          { name: 'AppError', ret: '상위 함수의 단일 에러 타입', tone: 'ok', note: '?가 자동 승격해 통일' },
        ],
        flowLabel: '? + From = 서로 다른 에러를 한 타입으로 통일',
        conversion: { from: 'io::Error / ParseIntError', to: 'AppError' },
        alert: { tone: 'warn', text: 'From 구현이 없으면 "? 가 변환 불가" 컴파일 에러가 난다. thiserror 로 From 을 자동 생성하는 게 관행이다.' },
        code: {
          lang: 'rust',
          filename: 'from_convert.rs',
          lines: [
            'enum AppError {',
            '    Io(std::io::Error),',
            '    Parse(std::num::ParseIntError),',
            '}',
            '',
            '// From 구현 → ? 가 이 변환을 자동으로 호출한다',
            'impl From<std::io::Error> for AppError {',
            '    fn from(e: std::io::Error) -> Self { AppError::Io(e) }',
            '}',
            'impl From<std::num::ParseIntError> for AppError {',
            '    fn from(e: std::num::ParseIntError) -> Self { AppError::Parse(e) }',
            '}',
            '',
            'fn load_port(path: &str) -> Result<u16, AppError> {',
            '    let text = std::fs::read_to_string(path)?;  // io::Error → AppError',
            '    let port: u16 = text.trim().parse()?;       // ParseIntError → AppError',
            '    Ok(port)',
            '    // => 두 하위 에러가 AppError 하나로 통일돼 전파된다',
            '}',
          ],
          highlight: [6, 7, 8, 9, 10, 11, 14, 15, 16],
        },
      },
      {
        title: 'Step 5. 콤비네이터 · Option 상호변환 · main 도 Result',
        desc: 'match 와 ? 외에도 Result 를 다루는 도구가 많다. map 은 Ok 값만 변형하고, map_err 는 에러만 변형하며, and_then 은 Result 를 내는 다음 단계를 이어 붙이고, unwrap_or / unwrap_or_else 는 실패 시 기본값을 준다 — 이 콤비네이터들은 성공/실패 분기를 명시적으로 쓰지 않고도 흐름을 잇게 해 준다. Result 와 Option 도 서로 오간다. ok() 는 Result 를 Option 으로 낮추고(에러 정보는 버림), ok_or() 는 Option 의 None 에 에러를 붙여 Result 로 올린다. 마지막으로 main 도 Result 를 반환할 수 있어, 최상단에서 ? 로 에러를 전파하고 종료 코드로 자동 변환하게 만들 수 있다 — 프로그램 전체가 예외 없이 값으로 흐른다.',
        frames: [
          { name: '.map / .map_err', ret: 'Ok 값·Err 만 각각 변형', tone: 'ok', note: '분기 없이 변형' },
          { name: '.ok() / .ok_or()', ret: 'Result ↔ Option 상호변환', tone: 'ok', note: '두 타입을 오간다' },
          { name: 'fn main() -> Result', ret: '최상단에서 ? 로 전파', tone: 'ok', note: '종료 코드로 자동 변환' },
        ],
        flowLabel: '콤비네이터로 잇고, Option 과 오가고, main 까지 값으로',
        conversion: null,
        wins: [
          'map / map_err / and_then / unwrap_or 로 분기 없이 흐름을 잇는다',
          'ok() 는 Result → Option (에러 버림), ok_or() 는 Option → Result (에러 부여)',
          'fn main() -> Result 로 최상단에서 ? 전파, 실패는 종료 코드로 변환',
          '예외 없음 — 실패가 타입에 드러나 컴파일러가 처리를 강제한다',
        ],
        alert: { tone: 'good', text: 'Result 는 실패를 1급 값으로 만든다 — 숨은 예외 대신, 타입과 컴파일러가 안전망이 된다.' },
        code: {
          lang: 'rust',
          filename: 'combinators.rs',
          lines: [
            'fn main() -> Result<(), AppError> {',
            '    // 콤비네이터 — 분기 없이 변형·연결',
            '    let port = parse_port("8080")',
            '        .map(|p| p + 1)              // Ok(8080) → Ok(8081)',
            '        .unwrap_or(3000);           // Err 면 3000',
            '',
            '    // Result → Option (에러 정보는 버린다)',
            '    let maybe: Option<u16> = parse_port("oops").ok();',
            '    // => None',
            '',
            '    // Option → Result (None 에 에러를 붙인다)',
            '    let first = "a,b".split(",").next()',
            '        .ok_or(AppError::Parse(/* ... */))?;',
            '',
            '    // main 도 ? 를 쓴다 — 실패는 종료 코드로',
            '    let cfg = load_port("app.conf")?;',
            '    Ok(())',
            '}',
          ],
          highlight: [1, 2, 3, 4, 5, 7, 8, 11, 12, 13, 15, 16],
        },
      },
    ];

    function PropagationPane({ frames, flowLabel, conversion }) {
      const TONE = {
        ok:     { bg: '#dbf3e6', tx: '#166534', dot: '#22c55e' },
        warn:   { bg: '#fef3c7', tx: '#92400e', dot: '#f59e0b' },
        danger: { bg: '#fee2e2', tx: '#991b1b', dot: '#ef4444' },
        idle:   { bg: '#e2e8f0', tx: '#64748b', dot: '#94a3b8' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>🏭</span>
            <span>조립 라인 — 공정별 합격(Ok) / 불량(Err) 검사</span>
            <span className="ml-auto text-[10px] px-2 py-0.5 rounded bg-white/20">{flowLabel}</span>
          </div>
          <div className="p-3 space-y-2">
            {frames.map((f, i) => {
              const s = TONE[f.tone] || TONE.idle;
              return (
                <div key={i} className="flex items-center gap-2 text-xs">
                  <span className="w-2 h-2 rounded-full shrink-0" style={{background:s.dot}}></span>
                  <span className="w-40 font-mono font-bold shrink-0" style={{color:BRAND}}>{f.name}</span>
                  <span className="flex-1 font-mono px-2 py-0.5 rounded" style={{background:s.bg, color:s.tx}}>{f.ret}</span>
                  <span className="w-32 text-[10px] text-slate-500 shrink-0 text-right">{f.note}</span>
                </div>
              );
            })}
          </div>
          {conversion && (
            <div className="mx-3 mb-3 rounded-lg px-3 py-2 text-xs flex items-center gap-2" style={{background:'#fef2ef', border:`1px dashed ${BRAND}`, color:'#7a2418'}}>
              <span className="font-mono px-2 py-0.5 rounded bg-white" style={{border:'1px solid #f4c3b3'}}>{conversion.from}</span>
              <span className="font-bold" style={{color:BRAND}}>—From→</span>
              <span className="font-mono px-2 py-0.5 rounded bg-white font-bold" style={{border:`1px solid ${BRAND}`}}>{conversion.to}</span>
            </div>
          )}
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#fef2ef'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🦀</span>
            <span className="text-lg font-bold" style={{color:'#7a2418'}}>Result 를 다루는 4가지 도구</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#7a2418'}}>
                <span style={{color:BRAND}}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#fef2ef', bd:'#f4c3b3', tx:'#7a2418', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#7a2418'}}>실패를 값으로 — Result · ? · From 흐름</h3>
            <span className="text-[10px] text-slate-500">Ok=합격 · Err=불량</span>
          </div>
          <PropagationPane frames={state.frames} flowLabel={state.flowLabel} conversion={state.conversion} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(206,66,43,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#fef2ef 0%,#fde2d8 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>Rs</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded mb-1" style={{background:'#a85138', color:'#fff'}}>Part IV. 안전성 · IV-1-2</span>
                <h1 className="text-2xl font-bold" style={{color:'#7a2418'}}>IV-1-2. Result 와 ? 연산자</h1>
                <p className="text-sm" style={{color:'#CE422B'}}>예외 없는 에러 처리 — 실패를 값으로 반환하고 ? 로 전파</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#f4c3b3'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#CE422Baa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#7a2418'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Rust 는 예외 대신 Result 로 실패를 값으로 다룬다. match 로 두 갈래를 강제하고, ? 로 Ok 는 통과·Err 는 조기 반환하며, From 으로 하위 에러를 상위 타입으로 승격한다. unwrap / expect 남발은 프로덕션 panic 의 지름길이니 경계 지점에만 쓴다. 다음에는 여러 에러 타입을 하나로 묶는 커스텀 에러 설계를 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Rust', 'Result', 'question-mark', 'From', 'error-handling', 'no-exceptions', 'thiserror'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#fef2ef', color:'#7a2418', border:'1px solid #f4c3b3'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-1.html" className="underline hover:no-underline">다음: IV-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
