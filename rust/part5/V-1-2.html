    @media (min-width: 768px) {

      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

<body>
  <div id="root"></div>
  <!--
    Rust V-1-2 — Axum 라우터 (tokio 기반 모던 웹 프레임워크)
    비유: 우편 분류 센터 — Router 가 주소(경로)로 분류하고, 추출자가 봉투를 뜯어 내용물을 꺼내며,
          tower 레이어(컨베이어 검문소)를 통과한 뒤 핸들러가 답장을 만든다.
    5단계: Router 구조 → 추출자 → State 공유 → tower 미들웨어 → 실무 함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#CE422B';
    const DARK = '#7a2418';
    const MID = '#a85138';

    const STEPS = [
      {
        title: 'Step 1. Router — 경로를 async 핸들러에 연결한다',
        desc: 'Axum 의 시작은 Router::new() 다. route("/path", get(handler)) 로 경로와 HTTP 메서드를 async fn 핸들러에 매핑한다. 핸들러는 반드시 async 함수여야 하고, Axum 은 tokio 런타임 위에서 이 future 들을 스케줄링한다. 별도의 매크로나 어노테이션 없이, 함수 시그니처와 라우팅 표만으로 서버가 구성되는 것이 Actix-web 대비 간결한 점이다. 서버는 tokio::net::TcpListener 에 bind 한 뒤 axum::serve 로 띄운다.',
        pipeline: [
          { stage: 'GET /users/42', role: '요청 도착', status: 'active' },
          { stage: 'Router 경로 매칭', role: '/users/:id 에 매칭', status: 'active' },
          { stage: 'handler(async fn)', role: 'tokio 가 실행', status: 'idle' },
          { stage: 'Response', role: '아직', status: 'idle' },
        ],
        note: { label: 'tokio 런타임 위 async fn' },
        alert: { tone: 'info', text: '핸들러가 async 가 아니면 컴파일 에러다 — Axum 은 future 를 tokio 로 구동한다.' },
        code: {
          lang: 'rust',
          filename: 'main.rs',
          lines: [
            '// Cargo.toml: axum = "0.7", tokio = { version = "1", features = ["full"] }',
            'use axum::{routing::get, Router};',
            '',
            'async fn hello() -> &\'static str {',
            '    "Hello, Axum!"   // => 200 OK, 본문 "Hello, Axum!"',
            '}',
            '',
            '#[tokio::main]',
            'async fn main() {',
            '    let app = Router::new()',
            '        .route("/", get(hello))',
            '        .route("/users/:id", get(show_user));',
            '',
            '    let listener = tokio::net::TcpListener::bind("0.0.0.0:3000")',
            '        .await.unwrap();',
            '    axum::serve(listener, app).await.unwrap();',
            '}',
          ],
          highlight: [1, 3, 4, 5, 10, 11, 12, 15],
        },
      },
      {
        title: 'Step 2. 추출자 — 함수 인자 타입이 곧 요청 파싱이다',
        desc: '핸들러의 인자 타입이 그대로 요청 파싱 규칙이 된다. Path 는 경로 변수를, Query 는 쿼리스트링을, Json 은 본문을 역직렬화한다. 개발자는 파싱 코드를 한 줄도 쓰지 않는다 — 타입만 선언하면 Axum 이 FromRequest / FromRequestParts 트레잇으로 채워 준다. 반환값은 IntoResponse 를 구현한 무엇이든 되며, Json 으로 감싸면 자동으로 직렬화 + Content-Type 헤더가 붙는다. 파싱 실패는 자동으로 400 응답이 된다.',
        pipeline: [
          { stage: 'POST /users?admin=1', role: '요청 도착', status: 'active' },
          { stage: 'Path(id) 추출', role: '경로 변수 파싱', status: 'active' },
          { stage: 'Query(p) / Json(body)', role: '쿼리·본문 파싱', status: 'active' },
          { stage: 'handler → Json 응답', role: 'IntoResponse', status: 'active' },
        ],
        note: { label: '타입 = 파싱 규칙' },
        alert: { tone: 'good', text: '파싱 실패는 자동 400 — 핸들러 본문은 성공 경로만 다루면 된다.' },
        code: {
          lang: 'rust',
          filename: 'extractors.rs',
          lines: [
            'use axum::{extract::{Path, Query, Json}, response::IntoResponse};',
            'use serde::{Deserialize, Serialize};',
            '',
            '#[derive(Deserialize)]',
            'struct Params { admin: bool }',
            '',
            '#[derive(Deserialize, Serialize)]',
            'struct NewUser { name: String }',
            '',
            '// 인자 타입만으로 파싱 — Path/Query/Json',
            'async fn create_user(',
            '    Path(id): Path<u64>,',
            '    Query(p): Query<Params>,',
            '    Json(body): Json<NewUser>,',
            ') -> impl IntoResponse {',
            '    let msg = format!("id={} admin={} name={}", id, p.admin, body.name);',
            '    Json(msg)   // => 200 OK, application/json 자동 직렬화',
            '}',
          ],
          highlight: [10, 11, 12, 13, 14, 15, 16],
        },
      },
      {
        title: 'Step 3. State — 공유 자원을 타입 안전하게 주입한다',
        desc: 'DB 커넥션 풀이나 설정처럼 모든 핸들러가 공유하는 자원은 State 추출자로 주입한다. Router 에 with_state(app_state) 로 등록하면, 핸들러 인자에 State(자원) 를 선언하는 것만으로 꺼내 쓸 수 있다. 전역 변수나 lazy_static 없이 컴파일러가 타입을 검사한다. 핵심 함정은 Router 의 상태 타입과 핸들러가 요구하는 State 타입이 정확히 일치해야 한다는 점 — 어긋나면 난해한 트레잇 미구현 에러가 난다. 보통 Arc 로 감싸 값싸게 clone 한다.',
        pipeline: [
          { stage: 'with_state(AppState)', role: 'Router 에 등록', status: 'done' },
          { stage: '요청 도착', role: 'GET /count', status: 'active' },
          { stage: 'State(state) 주입', role: '공유 풀 꺼냄', status: 'active' },
          { stage: 'handler → 응답', role: 'DB 조회 후 응답', status: 'active' },
        ],
        note: { label: 'with_state ↔ State 타입 일치' },
        alert: { tone: 'warn', text: 'Router 상태 타입과 State 타입이 다르면 트레잇 미구현 에러 — 타입을 맞춰라.' },
        code: {
          lang: 'rust',
          filename: 'state.rs',
          lines: [
            'use axum::{extract::State, routing::get, Router};',
            'use std::sync::Arc;',
            '',
            '#[derive(Clone)]',
            'struct AppState { pool: Arc<DbPool> }   // Arc 로 값싸게 clone',
            '',
            'async fn count(State(state): State<AppState>) -> String {',
            '    let n = state.pool.query_count().await;',
            '    format!("total = {}", n)   // => 200 OK',
            '}',
            '',
            'fn app(pool: Arc<DbPool>) -> Router {',
            '    Router::new()',
            '        .route("/count", get(count))',
            '        .with_state(AppState { pool })   // 상태 주입',
            '}',
          ],
          highlight: [4, 5, 7, 8, 14, 15],
        },
      },
      {
        title: 'Step 4. tower 미들웨어 — 레이어로 요청을 감싼다',
        desc: 'Axum 은 tower 생태계 위에 있어, 로깅·타임아웃·인증·압축 같은 공통 관심사를 Layer 로 붙인다. .layer(...) 로 추가하며, 여러 레이어는 양파처럼 요청을 감싼다. 중요한 규칙: 나중에 추가한 레이어가 바깥쪽(요청을 먼저 본다)이다. 즉 실행 순서는 선언 역순이라 인증을 로깅보다 먼저 태우려면 순서를 신경 써야 한다. tower_http 의 TraceLayer, TimeoutLayer 등 검증된 레이어를 조합하면 직접 구현할 코드가 급감한다.',
        pipeline: [
          { stage: '요청', role: '바깥 레이어부터', status: 'active' },
          { stage: 'TraceLayer', role: '로깅 (가장 바깥)', status: 'active' },
          { stage: 'TimeoutLayer', role: '10초 제한', status: 'active' },
          { stage: 'handler → 응답', role: '레이어 역순 통과', status: 'active' },
        ],
        note: { label: '나중 .layer = 바깥쪽' },
        alert: { tone: 'warn', text: '레이어 실행 순서는 선언 역순 — 인증을 로깅보다 먼저 태우려면 순서를 뒤집어라.' },
        code: {
          lang: 'rust',
          filename: 'middleware.rs',
          lines: [
            'use axum::{routing::get, Router};',
            'use tower_http::trace::TraceLayer;',
            'use tower_http::timeout::TimeoutLayer;',
            'use std::time::Duration;',
            '',
            'fn app() -> Router {',
            '    Router::new()',
            '        .route("/", get(hello))',
            '        // 나중에 붙인 레이어가 바깥쪽 = 요청을 먼저 본다',
            '        .layer(TimeoutLayer::new(Duration::from_secs(10)))',
            '        .layer(TraceLayer::new_for_http())',
            '}',
            '',
            '// 요청 순서:  TraceLayer -> TimeoutLayer -> handler',
            '// 응답 순서:  handler -> TimeoutLayer -> TraceLayer',
          ],
          highlight: [9, 10, 13, 14],
        },
      },
      {
        title: 'Step 5. 실무 함정 — 추출자 순서·시그니처를 지켜라',
        desc: '현장에서 가장 자주 막히는 지점을 정리한다. 첫째, 본문을 소비하는 추출자(Json, String, Bytes)는 요청 본문을 한 번만 읽을 수 있어 반드시 인자 목록 맨 뒤에 와야 한다. 둘째, 핸들러 시그니처가 조금만 어긋나도 "handler 트레잇 미구현" 이라는 난해한 에러가 나는데, 대개 인자 타입·State 타입 불일치가 원인이다. 셋째, 레이어 순서 착각으로 인증이 로깅 뒤에 걸린다. 이 세 가지만 체크하면 Axum 온보딩의 8할은 끝난다.',
        pipeline: [
          { stage: 'Json 을 앞에 배치', role: '본문 이미 소비됨', status: 'reject' },
          { stage: 'State 타입 불일치', role: '트레잇 미구현 에러', status: 'reject' },
          { stage: '레이어 순서 착각', role: '인증이 로깅 뒤', status: 'reject' },
          { stage: '규칙 준수 시', role: '컴파일 통과', status: 'done' },
        ],
        note: { label: '본문 추출자는 맨 뒤' },
        wins: [
          '본문 소비 추출자(Json/String/Bytes)는 인자 맨 뒤에 둔다',
          '핸들러 트레잇 에러의 8할은 인자·State 타입 불일치다',
          '레이어는 선언 역순 실행 — 인증을 먼저 태우려면 뒤에 선언',
          'tower_http 검증 레이어를 조합해 직접 구현을 줄인다',
        ],
        alert: { tone: 'good', text: 'Actix-web 대비 tokio 생태계와 tower 조합이 간결하다 — 타입만 맞추면 컴파일러가 안전을 보장한다.' },
        code: {
          lang: 'rust',
          filename: 'pitfalls.rs',
          lines: [
            '// (1) 본문 추출자는 맨 뒤 — 그렇지 않으면 런타임 실패',
            'async fn bad(Json(b): Json<Body>, Path(id): Path<u64>) {}   // 위험',
            'async fn good(Path(id): Path<u64>, Json(b): Json<Body>) {}  // 정답',
            '',
            '// (2) State 타입은 with_state 와 정확히 일치해야 한다',
            '//   Router::new().route(..).with_state(AppState { .. })',
            '//   async fn h(State(s): State<AppState>)  <- 타입 일치 필수',
            '//   타입이 어긋나면: the trait Handler is not implemented',
            '',
            '// (3) 레이어는 선언 역순 실행',
            '//   .layer(auth).layer(trace)  =>  요청: trace -> auth',
            '//   인증을 먼저 태우려면 auth 를 뒤에 선언한다',
            '',
            '// 이 세 가지만 지키면 온보딩의 8할은 끝난다',
          ],
          highlight: [1, 2, 3, 5, 6, 7, 10, 11, 12],
        },
      },
    ];

    const STATUS_TONE = {
      idle:   { bg: '#e2e8f0', tx: '#475569', dot: '#94a3b8' },
      active: { bg: '#fef2ef', tx: DARK,      dot: BRAND },
      done:   { bg: '#dbf3e6', tx: '#166534', dot: '#16a34a' },
      reject: { bg: '#fee2e2', tx: '#991b1b', dot: '#dc2626' },
    };

    function PipelineMock({ pipeline, note }) {
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>📮</span>
            <span>요청 분류 센터 — Router · 추출자 · 레이어</span>
            <span className="ml-auto text-[10px] px-2 py-0.5 rounded bg-white/20">{note.label}</span>
          </div>
          <div className="p-3 space-y-2">
            {pipeline.map((p, i) => {
              const s = STATUS_TONE[p.status] || STATUS_TONE.idle;
              return (
                <div key={i} className="flex items-center gap-2 text-xs">
                  <span className="w-4 text-center" style={{color:s.dot}}>{i + 1}</span>
                  <span className="w-40 font-bold font-mono text-[11px]" style={{color:DARK}}>{p.stage}</span>
                  <span className="flex-1 px-2 py-1 rounded" style={{background:s.bg, color:s.tx}}>{p.role}</span>
                </div>
              );
            })}
            <div className="flex items-center justify-center gap-1 pt-1 text-[10px]" style={{color:MID}}>
              <span>요청</span><span>▼</span><span>Router</span><span>▼</span><span>레이어</span><span>▼</span><span>추출자</span><span>▼</span><span>핸들러</span>
            </div>
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#fef2ef'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🦀</span>
            <span className="text-lg font-bold" style={{color:DARK}}>Axum 온보딩 체크리스트</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:DARK}}>
                <span style={{color:BRAND}}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#fef2ef', bd:'#f4c3b3', tx:DARK,      icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:DARK}}>요청이 Router · 레이어 · 추출자를 지나 응답이 되기까지</h3>
            <span className="text-[10px] text-slate-500">Axum on tokio</span>
          </div>
          <PipelineMock pipeline={state.pipeline} note={state.note} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(206,66,43,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#fef2ef 0%,#fde2d8 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>Rs</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:MID}}>Part V. 실전</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full" style={{background:'#fef2ef', color:DARK, border:`1px solid #f4c3b3`}}>V-1-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:DARK}}>Axum 라우터</h1>
                <p className="text-sm" style={{color:BRAND}}>tokio 기반 모던 웹 프레임워크 — 타입 안전 추출자와 타워 미들웨어</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#f4c3b3'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#CE422Baa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:DARK}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Axum 은 Router 로 경로를 async 핸들러에 연결하고, 함수 인자 타입(Path · Query · Json · State)만으로 요청을 파싱한다. tower 레이어로 공통 관심사를 감싸되 실행 순서는 선언 역순이며, 본문 추출자는 맨 뒤에 둬야 한다. 타입만 맞추면 컴파일러가 안전을 보장하는 것이 tokio 생태계 위 Axum 의 힘이다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Rust', 'Axum', 'tokio', 'tower', 'extractor', 'IntoResponse', 'middleware'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#fef2ef', color:DARK, border:'1px solid #f4c3b3'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-1.html" className="underline hover:no-underline">다음: V-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
