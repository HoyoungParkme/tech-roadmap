<body>
  <div id="root"></div>
  <!--
    Rust V-1-1 — Actix-web 핸들러 (비유: 고속 우체국의 자동 분류기)
    HTTP 요청 → 라우터 매칭 → 추출자(Path/Query/Json/State)가 타입으로 뽑기 → 핸들러 실행 → JSON 응답
    6단계: 서버 구조 → 라우팅/핸들러 → 추출자 → 앱 상태(web::Data) → JSON 응답/에러 → 실무 함정
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const BRAND = '#CE422B';

    const STEPS = [
      {
        title: 'Step 1. HttpServer · App — 서버의 뼈대',
        desc: 'Actix-web 앱은 HttpServer 가 소켓을 열고, 그 안에서 App 팩토리가 워커 스레드마다 라우팅 테이블을 조립한다. 클로저로 App 을 만드는 이유는 각 워커가 독립된 App 인스턴스를 갖기 때문이다. bind 로 주소를 잡고 run().await 로 이벤트 루프를 돌린다. 여기서 정한 route 매핑이 이후 모든 요청 처리의 출발점이 된다.',
        flow: [
          { stage: 'HttpServer', label: '소켓 bind :8080', tone: 'ok' },
          { stage: 'App factory', label: '워커마다 라우트 조립', tone: 'ok' },
          { stage: '.route()', label: 'GET /hello 등록', tone: 'info' },
        ],
        gate: { label: '서버 기동 — 라우팅 테이블 준비' },
        alert: { tone: 'info', text: 'App 을 클로저로 넘기는 이유: 워커 스레드마다 App 을 새로 만들어 락 없이 병렬 처리한다.' },
        code: {
          lang: 'rust',
          filename: 'main.rs',
          lines: [
            'use actix_web::{web, App, HttpServer, HttpResponse, Responder};',
            '',
            'async fn hello() -> impl Responder {',
            '    HttpResponse::Ok().body("Hello, Actix!")  // => 200 OK',
            '}',
            '',
            '#[actix_web::main]',
            'async fn main() -> std::io::Result<()> {',
            '    HttpServer::new(|| {',
            '        App::new()',
            '            .route("/hello", web::get().to(hello))',
            '    })',
            '    .bind(("127.0.0.1", 8080))?',
            '    .run()',
            '    .await',
            '}',
          ],
          highlight: [8, 9, 10, 11, 12, 13, 14],
        },
      },
      {
        title: 'Step 2. 라우팅 · 핸들러 — async fn 이 곧 엔드포인트',
        desc: '핸들러는 그냥 async 함수다. 반환 타입이 impl Responder 이면 Actix 가 알아서 HTTP 응답으로 바꾼다. 라우트는 web::get().to(fn) 처럼 메서드와 함수를 묶어 등록하거나, #[get("/path")] 매크로로 함수 위에 직접 붙인다. 매크로 방식은 service() 로 등록하며 경로와 로직이 한곳에 모여 읽기 좋다. 핸들러가 순수 함수라 테스트도 쉽다.',
        flow: [
          { stage: 'GET /users/42', label: '요청 도착', tone: 'info' },
          { stage: '라우터', label: '/users/{id} 매칭', tone: 'ok' },
          { stage: 'get_user()', label: '핸들러 호출', tone: 'ok' },
        ],
        gate: { label: '경로 매칭 → 핸들러 디스패치' },
        alert: { tone: 'info', text: '#[get("/path")] 매크로와 .route() 방식은 동일하다 — 팀 컨벤션에 맞춰 하나로 통일하라.' },
        code: {
          lang: 'rust',
          filename: 'routes.rs',
          lines: [
            'use actix_web::{get, web, App, HttpServer, Responder};',
            '',
            '// 매크로 방식 — 경로와 로직이 함께',
            '#[get("/users/{id}")]',
            'async fn get_user(path: web::Path<u32>) -> impl Responder {',
            '    let id = path.into_inner();',
            '    format!("user id = {}", id)  // => 200 "user id = 42"',
            '}',
            '',
            '// 등록은 service() 로',
            '// App::new().service(get_user)',
            '',
            '// .route() 방식과 동일하게 동작한다',
            '// App::new().route("/users/{id}", web::get().to(get_user))',
          ],
          highlight: [3, 4, 5, 6, 7, 8],
        },
      },
      {
        title: 'Step 3. 추출자(extractor) — 요청을 타입으로 뽑는다',
        desc: '추출자는 Actix 의 핵심이다. 핸들러 파라미터에 web::Path, web::Query, web::Json 을 선언하면 프레임워크가 요청에서 값을 꺼내 지정한 타입으로 역직렬화한다. 실패하면 핸들러가 실행되기 전에 400 을 반환하므로, 핸들러 안에서는 이미 검증된 데이터만 다룬다. serde 로 구조체에 매핑되어 문자열 파싱 코드가 사라진다. 이것이 타입 안전한 요청 처리다.',
        flow: [
          { stage: 'Path<u32>', label: '/users/42 → 42', tone: 'ok' },
          { stage: 'Query<Page>', label: '?page=2 → Page{2}', tone: 'ok' },
          { stage: 'Json<NewUser>', label: 'body → 구조체', tone: 'ok' },
        ],
        gate: { label: '추출 성공 → 타입 확정 / 실패 → 400' },
        alert: { tone: 'warn', text: '추출 실패는 핸들러 진입 전에 400 으로 끝난다 — 잘못된 입력 방어 코드를 따로 쓸 필요가 없다.' },
        code: {
          lang: 'rust',
          filename: 'extractors.rs',
          lines: [
            'use actix_web::{web, Responder};',
            'use serde::Deserialize;',
            '',
            '#[derive(Deserialize)]',
            'struct Page { page: u32, size: u32 }',
            '',
            '#[derive(Deserialize)]',
            'struct NewUser { name: String, email: String }',
            '',
            '// 세 가지 추출자를 한 핸들러에서',
            'async fn create(',
            '    path: web::Path<u32>,       // /orgs/{oid}',
            '    query: web::Query<Page>,    // ?page=2&size=20',
            '    body: web::Json<NewUser>,   // JSON 본문',
            ') -> impl Responder {',
            '    let oid = path.into_inner();',
            '    format!("org={} page={} name={}",',
            '        oid, query.page, body.name)  // => 200 OK',
            '}',
          ],
          highlight: [11, 12, 13, 14, 15, 16, 17, 18],
        },
      },
      {
        title: 'Step 4. 앱 상태 공유 — web::Data 로 DB 풀 나누기',
        desc: 'DB 커넥션 풀이나 설정처럼 모든 핸들러가 공유해야 하는 값은 web::Data 로 등록한다. app_data() 로 넣으면 핸들러가 web::Data 추출자로 받아 쓴다. 내부는 Arc 라서 복제 비용이 없고 워커 스레드 간 안전하게 공유된다. 단, 가변 상태를 넣을 때는 Mutex 로 감싸야 한다 — 여러 워커가 동시에 접근하기 때문이다. 여기서 동기화를 빠뜨리면 컴파일은 되지만 데이터가 깨진다.',
        flow: [
          { stage: 'app_data', label: 'Data<Pool> 등록', tone: 'ok' },
          { stage: 'Arc 공유', label: '워커마다 clone', tone: 'info' },
          { stage: '가변 상태', label: 'Mutex 필수', tone: 'warn' },
        ],
        gate: { label: '상태 주입 → 핸들러가 추출' },
        alert: { tone: 'warn', text: '공유 상태를 가변으로 쓰려면 Mutex/RwLock 필수 — 동기화 없이 넣으면 데이터 레이스로 값이 깨진다.' },
        code: {
          lang: 'rust',
          filename: 'state.rs',
          lines: [
            'use actix_web::{web, App, HttpServer, Responder};',
            'use std::sync::Mutex;',
            '',
            'struct AppState {',
            '    app_name: String,',
            '    counter: Mutex<u32>,   // 가변 상태는 Mutex 로',
            '}',
            '',
            'async fn hit(data: web::Data<AppState>) -> impl Responder {',
            '    let mut c = data.counter.lock().unwrap();',
            '    *c += 1;',
            '    format!("{} hit #{}", data.app_name, c)  // => "api hit #3"',
            '}',
            '',
            '// 등록 — Data 는 내부가 Arc 라 clone 이 저렴하다',
            'let state = web::Data::new(AppState {',
            '    app_name: "api".into(), counter: Mutex::new(0),',
            '});',
            '// App::new().app_data(state.clone())',
          ],
          highlight: [4, 5, 6, 7, 9, 10, 11, 12],
        },
      },
      {
        title: 'Step 5. JSON 응답 · 에러 처리 — Result 로 상태코드까지',
        desc: '응답은 Serialize 구조체를 web::Json 으로 감싸면 자동으로 JSON 직렬화되어 나간다. 핸들러가 Result 를 반환하면 Ok 는 성공 응답, Err 는 에러 타입이 된다. 에러 타입에 ResponseError 를 구현하면 어떤 상태코드로 나갈지 직접 정한다 — 404, 409 같은 것을 타입으로 표현한다. 이렇게 하면 성공과 실패 경로가 컴파일러로 강제되어, 처리하지 않은 에러가 조용히 200 으로 나가는 사고가 사라진다.',
        flow: [
          { stage: 'Ok(Json)', label: '구조체 → JSON 200', tone: 'ok' },
          { stage: 'Err(NotFound)', label: 'ResponseError → 404', tone: 'warn' },
          { stage: '타입 강제', label: '미처리 에러 컴파일 거부', tone: 'ok' },
        ],
        gate: { label: 'Result 분기 → 상태코드 결정' },
        alert: { tone: 'good', text: 'ResponseError 로 에러를 타입화하면 상태코드가 코드에 새겨진다 — 실패 경로를 컴파일러가 챙긴다.' },
        code: {
          lang: 'rust',
          filename: 'response.rs',
          lines: [
            'use actix_web::{web, HttpResponse, ResponseError};',
            'use serde::Serialize;',
            'use derive_more::Display;',
            '',
            '#[derive(Serialize)]',
            'struct User { id: u32, name: String }',
            '',
            '#[derive(Debug, Display)]',
            'enum ApiError { #[display(fmt = "not found")] NotFound }',
            '',
            'impl ResponseError for ApiError {',
            '    fn error_response(&self) -> HttpResponse {',
            '        HttpResponse::NotFound().json("user not found")  // => 404',
            '    }',
            '}',
            '',
            'async fn find(path: web::Path<u32>)',
            '    -> Result<web::Json<User>, ApiError> {',
            '    let id = path.into_inner();',
            '    if id == 0 { return Err(ApiError::NotFound); }',
            '    Ok(web::Json(User { id, name: "Alice".into() }))  // => 200 JSON',
            '}',
          ],
          highlight: [8, 9, 11, 12, 13, 14, 15, 17, 18, 19, 20, 21],
        },
      },
      {
        title: 'Step 6. 실무 함정 — 블로킹 · 미들웨어 · 추출 실패',
        desc: 'Actix 는 async 런타임 위에서 돈다. 핸들러 안에서 무거운 동기 작업(파일 I/O, 동기 DB 드라이버, CPU 연산)을 그냥 호출하면 워커 스레드가 막혀 다른 요청까지 멈춘다. 이럴 때는 web::block 으로 별도 스레드풀에 넘긴다. 인증·로깅 같은 공통 처리는 wrap 미들웨어로 붙이고, 추출 실패 시 커스텀 400 을 주려면 JsonConfig 등으로 에러 핸들러를 지정한다. 이 세 가지가 운영에서 가장 자주 밟는 지점이다.',
        flow: [
          { stage: '블로킹 호출', label: 'web::block 으로 격리', tone: 'warn' },
          { stage: '미들웨어', label: 'wrap(Logger) 공통 처리', tone: 'ok' },
          { stage: '추출 실패', label: 'JsonConfig 커스텀 400', tone: 'info' },
        ],
        gate: { label: '함정 3종 — 운영 안정성의 핵심' },
        wins: [
          '블로킹 작업은 web::block 으로 워커 스레드를 막지 않는다',
          '공통 관심사(인증·로깅)는 wrap 미들웨어로 한곳에',
          '추출 실패 응답은 JsonConfig 로 형식을 통제한다',
          '핸들러는 async·순수 함수라 단위 테스트가 쉽다',
        ],
        alert: { tone: 'good', text: '핸들러 안에서 동기 블로킹을 직접 호출하면 워커가 막힌다 — web::block 이 성능의 갈림길이다.' },
        code: {
          lang: 'rust',
          filename: 'pitfalls.rs',
          lines: [
            'use actix_web::{web, App, Responder, middleware::Logger, error};',
            '',
            '// 1) 블로킹 작업은 web::block 으로 스레드풀에 위임',
            'async fn report() -> impl Responder {',
            '    let sum = web::block(|| {',
            '        (0..1_000_000_000u64).sum::<u64>()  // 무거운 동기 연산',
            '    }).await.unwrap();',
            '    format!("sum = {}", sum)  // => 200 OK',
            '}',
            '',
            '// 2) 미들웨어 · 3) 추출 실패 커스텀 응답',
            '// App::new()',
            '//   .wrap(Logger::default())            // 공통 로깅',
            '//   .app_data(web::JsonConfig::default()',
            '//     .error_handler(|err, _req| {       // 커스텀 400',
            '//       error::InternalError::from_response(',
            '//         err, HttpResponse::BadRequest().finish()).into()',
            '//     }))',
            '//   .service(report)',
          ],
          highlight: [3, 4, 5, 6, 7, 8, 13, 14, 15, 16, 17, 18],
        },
      },
    ];

    function FlowMock({ flow, gate }) {
      const TONE = {
        ok: { bg: '#dbf3e6', tx: '#166534' },
        warn: { bg: '#fef3c7', tx: '#92400e' },
        danger: { bg: '#fee2e2', tx: '#991b1b' },
        info: { bg: '#e2e8f0', tx: '#475569' },
      };
      return (
        <div className="rounded-lg overflow-hidden bg-white" style={{border:`2px solid ${BRAND}`}}>
          <div className="px-3 py-1.5 text-xs font-bold text-white flex items-center gap-2" style={{background:BRAND}}>
            <span>📮</span>
            <span>고속 우체국 — 요청 자동 분류기</span>
            <span className="ml-auto text-[10px] px-2 py-0.5 rounded bg-white/20">{gate.label}</span>
          </div>
          <div className="p-3 space-y-2">
            {flow.map((f, i) => {
              const s = TONE[f.tone] || TONE.info;
              return (
                <div key={i} className="flex items-center gap-2 text-xs">
                  <span className="w-28 font-bold font-mono" style={{color:BRAND}}>{f.stage}</span>
                  <span className="text-slate-400">▸</span>
                  <span className="flex-1 font-mono px-2 py-0.5 rounded" style={{background:s.bg, color:s.tx}}>{f.label}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function WinsBox({ wins }) {
      if (!wins) return null;
      return (
        <div className="mt-3 rounded-xl p-4" style={{border:`2px solid ${BRAND}`, background:'#fef2ef'}}>
          <div className="flex items-center gap-2 mb-2">
            <span className="text-2xl">🦀</span>
            <span className="text-lg font-bold" style={{color:'#7a2418'}}>운영에서 챙길 4가지</span>
          </div>
          <ul className="space-y-1.5">
            {wins.map((w, i) => (
              <li key={i} className="text-sm flex gap-2" style={{color:'#7a2418'}}>
                <span style={{color:BRAND}}>✓</span>
                <span>{w}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg:'#fef2ef', bd:'#f4c3b3', tx:'#7a2418', icon:'💡' },
      warn:   { bg:'#fef3c7', bd:'#fde68a', tx:'#92400e', icon:'⚠️' },
      danger: { bg:'#fee2e2', bd:'#fecaca', tx:'#991b1b', icon:'🚨' },
      good:   { bg:'#dbf3e6', bd:'#86efac', tx:'#166534', icon:'✅' },
    };

    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg p-2 text-xs flex gap-2" style={{background:s.bg, border:`1px solid ${s.bd}`, color:s.tx}}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl bg-white p-4 h-full flex flex-col" style={{border:`1px solid ${BRAND}`}}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{color:'#7a2418'}}>요청 → 라우터 → 추출자 → 응답</h3>
            <span className="text-[10px] text-slate-500">분류기 = Actix 추출자</span>
          </div>
          <FlowMock flow={state.flow} gate={state.gate} />
          <WinsBox wins={state.wins} />
          <AlertBox alert={state.alert} />
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? '-ml-3 pl-2' : ''}`} style={isHi ? {background:'rgba(206,66,43,0.18)', borderLeft:`2px solid ${BRAND}`} : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{background:'linear-gradient(135deg,#fef2ef 0%,#fde2d8 100%)'}}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{background:BRAND}}>Rs</span>
              <div>
                <div className="inline-block text-[10px] font-bold px-2 py-0.5 rounded mb-1" style={{background:'#7a2418', color:'#fff'}}>Part V. 실전 · V-1-1</div>
                <h1 className="text-2xl font-bold" style={{color:'#7a2418'}}>V-1-1. Actix-web 핸들러</h1>
                <p className="text-sm" style={{color:'#CE422B'}}>고성능 Rust 웹 프레임워크, 액터 기반 핸들러와 추출자</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{color:BRAND}}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{background: i <= stepIdx ? BRAND : '#f4c3b3'}} />
              ))}
            </div>

            <div className="mb-4 rounded-xl px-5 py-4 shadow text-white" style={{background:BRAND}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded bg-white" style={{border:`1px solid ${BRAND}`, color:BRAND}}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background:BRAND}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded bg-white disabled:opacity-40" style={{border:`1px solid ${BRAND}`, color:BRAND}}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{color:'#CE422Baa'}}>키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg bg-white px-4 py-3 text-sm" style={{border:`2px solid ${BRAND}`, color:'#7a2418'}}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Actix-web 은 async 핸들러와 추출자로 요청을 타입 안전하게 처리한다. Path·Query·Json 이 검증을 대신하고, web::Data 로 상태를 공유하며, ResponseError 로 상태코드를 타입에 새긴다. 성능의 관건은 블로킹 작업을 web::block 으로 격리하는 것이다 — 이 규칙만 지키면 컴파일 타임 안전과 고성능을 동시에 얻는다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['actix-web', 'extractor', 'handler', 'web::Data', 'ResponseError', 'web::block'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full" style={{background:'#fef2ef', color:'#7a2418', border:'1px solid #f4c3b3'}}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{color:BRAND}}>
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
