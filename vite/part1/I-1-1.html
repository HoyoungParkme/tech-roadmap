            '4. 저장 시 그 파일만 다시 변환 -> HMR 즉각',
            '',
            '## 실무 함정 (반드시 기억)',
            '- native ESM 은 파일 단위 요청이라, 내부 파일 수백 개인',
            '  node_modules 패키지를 그대로 주면 요청이 폭발한다.',
            '  -> 해결: 의존성만 미리 묶는 "사전 번들" (다음 칸 I-1-2)',
            '- 아주 구형 브라우저는 ESM 미지원 -> dev 안 뜸',
            '- dev 와 prod 는 도구가 다르다: 동작 차이를 항상 prod 빌드로 검증',
            '',
            '## 역할 분담 (의도적 설계)',
            '| 국면 | 방식 | 도구 |',
            '|:--|:--|:--|',
            '| dev — 소스 서빙 | 번들 없이 native ESM | 브라우저 |',
            '| dev — TS/JSX 변환 | 요청 시 즉석 변환 | esbuild |',
            '| prod — 배포 번들 | tree-shaking/청크 | Rollup |',
            '',
            '## 다음 칸',
            '> I-1-2 — node_modules 700 파일 + CJS 문제를',
            '> esbuild "사전 번들"로 어떻게 푸는지 본다.',
          ],
          highlight: [3, 4, 5, 7, 8, 9, 10, 11, 13, 14, 15, 16, 17, 18, 20, 21, 22, 23, 24, 25],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-indigo-50',  border: 'border-indigo-300', text: 'text-indigo-800', badge: 'bg-indigo-200 text-indigo-800', bar: 'bg-indigo-500' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-800',  badge: 'bg-amber-200 text-amber-800',  bar: 'bg-amber-500' },
      danger: { bg: 'bg-rose-50',    border: 'border-rose-400',   text: 'text-rose-800',   badge: 'bg-rose-200 text-rose-800',    bar: 'bg-rose-500' },
    };

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70 ml-0.5">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">지표</th><th className="py-1 pr-2">번들러</th><th className="py-1 pr-2">Vite</th><th className="py-1">차이</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function Scene({ scene }) {
      if (scene === 'bundler') {
        return (
          <div className="rounded-lg bg-white border border-rose-300 p-3">
            <div className="text-[10px] text-slate-500 mb-2 font-mono">webpack dev — 번들 후에야 서버 오픈</div>
            <div className="space-y-1 text-[11px] font-mono">
              <div className="flex items-center gap-2">
                <span className="w-24 text-slate-700">build modules</span>
                <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                  <div className="h-full bg-rose-500" style={{ width: '92%' }} />
                </div>
                <span className="w-14 text-right text-rose-700">11.4s</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-24 text-slate-700">bundle</span>
                <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                  <div className="h-full bg-amber-500" style={{ width: '8%' }} />
                </div>
                <span className="w-14 text-right text-amber-700">0.9s</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-24 text-slate-700">server open</span>
                <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                  <div className="h-full bg-slate-300" style={{ width: '2%' }} />
                </div>
                <span className="w-14 text-right text-slate-500">12.3s</span>
              </div>
            </div>
            <div className="text-[10px] text-rose-700 mt-2 font-mono">⚠ 3,200 모듈 전부 번들 → 12.3s 뒤 첫 화면</div>
          </div>
        );
      }
      if (scene === 'vite') {
        return (
          <div className="rounded-lg bg-gradient-to-r from-indigo-50 to-emerald-50 border border-indigo-300 p-3">
            <div className="text-[10px] text-slate-500 mb-2 font-mono">vite dev — 번들 없이 즉시 오픈</div>
            <div className="space-y-1 text-[11px] font-mono">
              <div className="flex items-center gap-2">
                <span className="w-24 text-slate-700">server open</span>
                <div className="flex-1 bg-white rounded h-3 overflow-hidden border border-emerald-200">
                  <div className="h-full bg-emerald-500" style={{ width: '4%' }} />
                </div>
                <span className="w-14 text-right text-emerald-700">312ms</span>
              </div>
            </div>
            <div className="mt-2 text-[10px] font-mono text-slate-600">
              번들 단계 없음 · 소스는 요청 시 변환
            </div>
            <div className="text-[10px] text-indigo-700 mt-1 font-mono">앱 3,200 → 8,000 모듈이어도 시작 시간 거의 그대로</div>
          </div>
        );
      }
      if (scene === 'ondemand') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono space-y-1">
            <div className="text-slate-500">browser import graph (요청 순서)</div>
            <div className="flex items-center gap-1"><span className="text-indigo-700">GET</span> /src/main.jsx</div>
            <div className="flex items-center gap-1 pl-3"><span className="text-indigo-700">└ GET</span> /src/App.jsx</div>
            <div className="flex items-center gap-1 pl-6"><span className="text-indigo-700">└ GET</span> /src/Home.jsx <span className="text-emerald-600">보임</span></div>
            <div className="flex items-center gap-1 pl-6 text-slate-400"><span>· </span>/src/Admin.jsx <span className="text-slate-400">(아직 요청 안 됨)</span></div>
            <div className="text-emerald-700 pt-1">→ 초기엔 14 개 모듈만 · 안 보는 라우트는 skip</div>
          </div>
        );
      }
      if (scene === 'esbuild') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3">
            <div className="text-[10px] text-slate-500 mb-1 font-mono">요청 시 변환 (파일당 소요)</div>
            <div className="space-y-1 text-[11px] font-mono">
              {[
                { name: 'babel 일괄', ms: '전체 선변환', w: 100, c: 'bg-rose-500' },
                { name: 'esbuild', ms: '~1ms/파일', w: 3, c: 'bg-emerald-500' },
              ].map((b, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-24 text-slate-700">{b.name}</span>
                  <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                    <div className={`h-full ${b.c}`} style={{ width: `${b.w}%` }} />
                  </div>
                  <span className="w-24 text-right text-slate-600">{b.ms}</span>
                </div>
              ))}
            </div>
            <div className="text-[10px] text-indigo-700 mt-2 font-mono">.jsx / .ts 요청 → esbuild.transform → 순수 ESM JS</div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">dev vs prod — 도구 역할 분담</div>
          <div className="grid grid-cols-3 gap-2 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">브라우저</div>
              <div className="text-slate-600 mt-1">native ESM</div>
              <div className="text-[9px] text-slate-500">소스 번들 없음</div>
            </div>
            <div className="bg-white rounded p-2 border-2 border-indigo-400">
              <div className="text-indigo-700 font-bold">esbuild</div>
              <div className="text-slate-600 mt-1">dev 변환</div>
              <div className="text-[9px] text-slate-500">요청 시 TS/JSX</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">Rollup</div>
              <div className="text-slate-600 mt-1">prod 빌드</div>
              <div className="text-[9px] text-slate-500">번들/청크</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">번들러 vs Vite — 개발 서버 시작</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="서버 시작 시간" value={state.serverStart.toLocaleString()} unit="ms" max={12000} current={state.serverStart} tone={state.serverStart >= 3000 ? 'danger' : 'good'} />
            <MetricCard label="사전 번들 파일" value={state.prebundled.toLocaleString()} unit="개" max={3200} current={state.prebundled} tone={state.prebundled >= 1000 ? 'danger' : 'good'} />
            <MetricCard label="초기 요청 모듈" value={state.browserReq} unit="개" max={50} current={state.browserReq} tone="good" />
            <MetricCard label="TS/JSX 변환" value={state.transformMs === 0 ? '일괄' : state.transformMs} unit={state.transformMs === 0 ? '' : 'ms'} max={50} current={state.transformMs === 0 ? 50 : state.transformMs} tone={state.transformMs === 0 ? 'warn' : 'good'} />
          </div>

          <div className="mt-3">
            <Scene scene={state.scene} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded mb-1" style={{background:'#646CFF',color:'#fff'}}>Part I. Vite 기초 · I-1-1</span>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>ESM Native — 개발 중엔 번들 없음</h1>
                <p className="text-sm text-slate-700/80">브라우저의 네이티브 ESM 을 활용해 즉시 뜨는 개발 서버</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                브라우저가 ESM 을 직접 읽으니 dev 에선 미리 번들하지 않는다. 그래서 앱이 커져도 서버가 즉시 뜨고, 브라우저는 import 그래프를 따라 필요한 모듈만 요청한다. TS/JSX 는 요청 시 esbuild 로 파일당 ~1ms 변환. 함정은 native ESM 의 파일 단위 요청 폭발 — 다음 칸의 사전 번들로 푼다. dev = native ESM + esbuild, prod = Rollup 번들.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['native-ESM', 'no-bundle-dev', 'esbuild', 'on-demand', 'dev-server'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 사전 번들 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
