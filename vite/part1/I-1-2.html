            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70 ml-0.5">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">지표</th><th className="py-1 pr-2">Before</th><th className="py-1 pr-2">After</th><th className="py-1">변화</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function Scene({ scene }) {
      if (scene === 'problem') {
        return (
          <div className="rounded-lg bg-white border border-rose-300 p-3 font-mono text-[10px]">
            <div className="text-slate-500 mb-1">browser network — without pre-bundle</div>
            <div className="space-y-0.5 text-rose-700">
              <div>GET /node_modules/lodash/lodash.js</div>
              <div>GET /node_modules/lodash/fp.js</div>
              <div>GET /node_modules/lodash/_baseEach.js</div>
              <div>GET /node_modules/lodash/_arrayEach.js</div>
              <div className="text-rose-500">… 600+ more requests</div>
              <div className="text-rose-800 font-bold pt-1">⚠ 712 requests · CJS modules error</div>
            </div>
          </div>
        );
      }
      if (scene === 'esbuild') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3">
            <div className="text-[10px] text-slate-500 mb-1 font-mono">번들러 벤치마크 (동일 입력)</div>
            <div className="space-y-1 text-[11px] font-mono">
              {[
                { name: 'webpack 5', ms: 12400, w: 100, c: 'bg-rose-500' },
                { name: 'parcel 2',  ms: 4300,  w: 35, c: 'bg-amber-500' },
                { name: 'rollup',    ms: 3200,  w: 26, c: 'bg-amber-400' },
                { name: 'esbuild',   ms: 98,    w: 1, c: 'bg-emerald-500' },
              ].map((b, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-20 text-slate-700">{b.name}</span>
                  <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                    <div className={`h-full ${b.c}`} style={{ width: `${b.w}%` }} />
                  </div>
                  <span className="w-16 text-right text-slate-600">{b.ms.toLocaleString()}ms</span>
                </div>
              ))}
            </div>
            <div className="text-[10px] text-indigo-700 mt-1 font-mono">esbuild = Go + multi-thread → 127x</div>
          </div>
        );
      }
      if (scene === 'flow') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono space-y-1">
            <div className="text-slate-500">vite startup flow</div>
            <div className="flex items-center gap-1"><span className="text-indigo-700">1.</span> scan imports → deps: [react, lodash, date-fns, …]</div>
            <div className="flex items-center gap-1"><span className="text-indigo-700">2.</span> hash lockfile → cache key</div>
            <div className="flex items-center gap-1"><span className="text-indigo-700">3.</span> esbuild bundle each → node_modules/.vite/deps/</div>
            <div className="flex items-center gap-1"><span className="text-indigo-700">4.</span> write _metadata.json</div>
            <div className="text-emerald-700 pt-1">→ deps optimized in 240ms</div>
          </div>
        );
      }
      if (scene === 'cache') {
        return (
          <div className="rounded-lg bg-gradient-to-r from-indigo-50 to-emerald-50 border border-indigo-300 p-3">
            <div className="text-[10px] text-slate-500 mb-2 font-mono">cold start (같은 프로젝트)</div>
            <div className="space-y-1 text-[11px] font-mono">
              <div className="flex items-center gap-2">
                <span className="w-20 text-slate-700">1st boot</span>
                <div className="flex-1 bg-white rounded h-3 overflow-hidden border border-amber-200">
                  <div className="h-full bg-amber-400" style={{ width: '100%' }} />
                </div>
                <span className="w-16 text-right text-amber-700">287ms</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-20 text-slate-700">2nd boot</span>
                <div className="flex-1 bg-white rounded h-3 overflow-hidden border border-emerald-200">
                  <div className="h-full bg-emerald-500" style={{ width: '28%' }} />
                </div>
                <span className="w-16 text-right text-emerald-700">80ms</span>
              </div>
            </div>
            <div className="text-[10px] text-indigo-700 mt-2 font-mono">cache hit 100% → optimizeDeps skipped</div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">Vite 의 3 도구 조립</div>
          <div className="grid grid-cols-3 gap-2 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">브라우저</div>
              <div className="text-slate-600 mt-1">native ESM</div>
              <div className="text-[9px] text-slate-500">소스 import 해결</div>
            </div>
            <div className="bg-white rounded p-2 border-2 border-indigo-400">
              <div className="text-indigo-700 font-bold">esbuild</div>
              <div className="text-slate-600 mt-1">dev 사전 번들</div>
              <div className="text-[9px] text-slate-500">+ transform</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">Rollup</div>
              <div className="text-slate-600 mt-1">prod 빌드</div>
              <div className="text-[9px] text-slate-500">tree-shake/chunk</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">esbuild 사전 번들 효과</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="브라우저 deps 요청" value={state.depRequests} unit="회" max={750} current={state.depRequests} tone={state.depRequests >= 100 ? 'danger' : 'good'} />
            <MetricCard label="사전 번들 시간" value={state.prebundleTime} unit="ms" max={300} current={state.prebundleTime} tone={state.prebundleTime >= 200 ? 'warn' : 'good'} />
            <MetricCard label="CJS 패키지" value={state.cjsCount} unit="개" max={200} current={state.cjsCount} tone="warn" />
            <MetricCard label="cache hit" value={state.cacheHit} unit="%" max={100} current={state.cacheHit} tone={state.cacheHit >= 80 ? 'good' : state.cacheHit >= 30 ? 'warn' : 'danger'} />
          </div>

          <div className="mt-3">
            <Scene scene={state.scene} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>Chapter I-1-2. Dev Server + esbuild 사전 번들</h1>
                <p className="text-sm text-slate-700/80">node_modules 700 파일 + CJS 문제를 어떻게 해결하나</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                node_modules 는 (a) 파일이 너무 많고 (b) CJS 가 섞여 있다. Vite 는 dev 부팅 시 esbuild 로 dep 만 사전 번들 → ESM 단일 파일 → node_modules/.vite/deps/ 캐시. lockfile 해시 캐시라 두 번째 부팅은 80ms. Vite = ESM(브라우저) + esbuild(deps) + Rollup(prod).
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['esbuild', 'pre-bundle', 'CJS-to-ESM', 'cache', 'optimizeDeps'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="./I-1-1.html" className="underline hover:no-underline">← 이전: I-1-1 ESM Native</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 HMR →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
