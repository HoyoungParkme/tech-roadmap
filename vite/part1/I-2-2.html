            '- 그 안 script type="module" src 가 JS를 가리킨다',
            '- 브라우저가 받는 파일 = 개발자가 보는 소스 (일치)',
            '',
            '## 에셋 규칙',
            '1. 상대경로 import 자산 → Vite가 해시 (캐시버스팅)',
            '2. public/ 자산 → 그대로 복사, 경로·이름 고정',
            '3. 기본은 import, 경로 고정이 필요할 때만 public/',
            '',
            '## env 규칙',
            '- import.meta.env 로 읽는다',
            '- VITE_ 접두어만 클라이언트 번들에 주입 (나머지는 서버 전용)',
            '- index.html 안에서 %VITE_XXX% 로 빌드 타임 치환',
            '',
            '## 실무 함정 3가지',
            '- public vs import: public/은 처리 안 됨(트리셰이킹/해시 없음)',
            '- 절대 vs 상대: 절대경로는 base를 무시한다',
            '- 다중 진입: input의 값은 html 파일 경로여야 한다',
            '',
            '## 다음 장',
            '> Part II 에서 Vite 플러그인과 빌드 파이프라인으로 들어간다.',
          ],
          highlight: [3, 4, 5, 6, 8, 9, 10, 11, 13, 14, 15, 16, 18, 19, 20, 21],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-indigo-50',  border: 'border-indigo-300', text: 'text-indigo-800', badge: 'bg-indigo-200 text-indigo-800', bar: 'bg-indigo-500' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-800',  badge: 'bg-amber-200 text-amber-800',  bar: 'bg-amber-500' },
      danger: { bg: 'bg-rose-50',    border: 'border-rose-400',   text: 'text-rose-800',   badge: 'bg-rose-200 text-rose-800',    bar: 'bg-rose-500' },
    };

    const SCRIPT_TAG = '<script type="module" src="/src/main.jsx">';

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">webpack</th><th className="py-1 pr-2">Vite</th><th className="py-1">평가</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function Scene({ scene }) {
      if (scene === 'entry') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 font-mono text-[11px] space-y-2">
            <div className="text-slate-500">dev server 가 index.html 을 그대로 서빙</div>
            <div className="flex items-center gap-2">
              <span className="px-2 py-1 rounded bg-slate-100 text-slate-700">Browser</span>
              <span className="text-indigo-500">— GET / →</span>
              <span className="px-2 py-1 rounded bg-indigo-100 text-indigo-800 font-bold border border-indigo-300">index.html</span>
              <span className="text-[9px] text-indigo-600">진입점 · 루트</span>
            </div>
            <div className="pl-4 text-slate-700">
              <div className="text-slate-500">안에는:</div>
              <div className="text-indigo-700">{SCRIPT_TAG}</div>
            </div>
            <div className="flex items-center gap-2 text-slate-700">
              <span className="px-2 py-1 rounded bg-slate-100">index.html</span>
              <span className="text-indigo-500">→</span>
              <span className="px-2 py-1 rounded bg-slate-100">main.jsx</span>
              <span className="text-indigo-500">→</span>
              <span className="px-2 py-1 rounded bg-slate-100">App</span>
            </div>
            <div className="text-emerald-700 pt-1">진입점은 HTML. JS는 HTML이 가리키는 대상이다.</div>
          </div>
        );
      }
      if (scene === 'assets') {
        return (
          <div className="grid grid-cols-2 gap-2 text-[10px] font-mono">
            <div className="rounded-lg bg-white border border-indigo-300 p-2">
              <div className="text-indigo-700 font-bold mb-1">import 자산</div>
              <div className="text-slate-600">{'./assets/logo.png'}</div>
              <div className="text-indigo-500 my-0.5">↓ Vite 처리</div>
              <div className="text-emerald-700">/assets/logo.4f3a1b.png</div>
              <div className="text-[9px] text-slate-500 mt-1">해시 → 캐시 무효화 자동</div>
            </div>
            <div className="rounded-lg bg-white border border-amber-300 p-2">
              <div className="text-amber-700 font-bold mb-1">public/ 자산</div>
              <div className="text-slate-600">{'public/vite.svg'}</div>
              <div className="text-amber-500 my-0.5">↓ 그대로 복사</div>
              <div className="text-emerald-700">/vite.svg</div>
              <div className="text-[9px] text-slate-500 mt-1">해시 없음 · 경로 고정</div>
            </div>
          </div>
        );
      }
      if (scene === 'env') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono space-y-1">
            <div className="text-slate-500">.env → 번들 주입 여부</div>
            <div className="flex items-center justify-between">
              <span className="text-slate-700">VITE_API_URL</span>
              <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">클라이언트 노출 O</span>
            </div>
            <div className="flex items-center justify-between">
              <span className="text-slate-700">VITE_APP_TITLE</span>
              <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">클라이언트 노출 O</span>
            </div>
            <div className="flex items-center justify-between">
              <span className="text-slate-700">DB_PASSWORD</span>
              <span className="px-2 py-0.5 rounded bg-rose-100 text-rose-700">서버 전용 · 유출 X</span>
            </div>
            <div className="text-indigo-700 pt-1">규칙: VITE_ 접두어가 있는 값만 번들에 들어간다.</div>
          </div>
        );
      }
      if (scene === 'webpack') {
        return (
          <div className="grid grid-cols-1 gap-2 text-[10px] font-mono">
            <div className="rounded-lg bg-white border border-rose-300 p-2">
              <div className="text-rose-700 font-bold mb-1">webpack — JS 진입</div>
              <div className="flex items-center gap-1 text-slate-700 flex-wrap">
                <span className="px-2 py-0.5 rounded bg-slate-100">main.js (entry)</span>
                <span className="text-rose-500">→ 번들 →</span>
                <span className="px-2 py-0.5 rounded bg-slate-100">플러그인이 HTML 생성</span>
              </div>
              <div className="text-[9px] text-slate-500 mt-1">HTML은 산출물 · 템플릿 문법 학습 필요</div>
            </div>
            <div className="rounded-lg bg-white border border-indigo-300 p-2">
              <div className="text-indigo-700 font-bold mb-1">Vite — HTML 진입</div>
              <div className="flex items-center gap-1 text-slate-700 flex-wrap">
                <span className="px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">index.html (entry)</span>
                <span className="text-indigo-500">→ 읽음 →</span>
                <span className="px-2 py-0.5 rounded bg-slate-100">script src 로 그래프 구성</span>
              </div>
              <div className="text-[9px] text-slate-500 mt-1">보이는 HTML이 곧 소스 · 학습 부담 낮음</div>
            </div>
          </div>
        );
      }
      if (scene === 'multipage') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono space-y-1">
            <div className="text-slate-500">rollupOptions.input</div>
            <div className="flex items-center gap-2">
              <span className="px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">index.html</span>
              <span className="text-indigo-500">→</span>
              <span className="text-emerald-700">main 번들 · /</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">admin/index.html</span>
              <span className="text-indigo-500">→</span>
              <span className="text-emerald-700">admin 번들 · /admin/</span>
            </div>
            <div className="pt-1 text-slate-500">base = /my-app/ 적용</div>
            <div className="text-slate-700">절대 /logo.png : <span className="text-rose-700">base 무시</span></div>
            <div className="text-slate-700">상대 ./logo.png : <span className="text-emerald-700">base 반영</span></div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">index.html 진입점의 4가지 얼굴</div>
          <div className="grid grid-cols-2 gap-2 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">진입</div>
              <div className="text-slate-600 mt-1">root index.html</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">에셋</div>
              <div className="text-slate-600 mt-1">import 해시 / public 고정</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">env</div>
              <div className="text-slate-600 mt-1">VITE_ 접두어만 노출</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">MPA</div>
              <div className="text-slate-600 mt-1">input 에 html 추가</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">index.html 진입점 흐름</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="mt-1">
            <Scene scene={state.scene} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{background:'#646CFF'}}>Part I. Vite 기초</span>
                  <span className="text-[10px] text-slate-500 font-mono">I-2-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>index.html — entry가 HTML</h1>
                <p className="text-sm text-slate-700/80">JS가 아닌 HTML이 진입점, 그래서 직관적이다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                Vite의 진입점은 프로젝트 루트 index.html이다. script type="module" 이 JS를 가리키고, HTML 안 에셋은 Vite가 해시하며 public/은 그대로 복사된다. env는 VITE_ 접두어로 노출을 통제하고, 다중 페이지는 input에 html을 추가한다. webpack의 "JS 진입 + 플러그인 HTML 생성"과 달리, 보이는 HTML이 곧 소스라서 진입 구조가 한눈에 들어온다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['index.html', 'entry-point', 'import.meta.env', 'public-assets', 'multi-page', 'base'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="./I-2-1.html" className="underline hover:no-underline">← 이전: I-2-1 HMR</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
