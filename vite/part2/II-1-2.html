    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }

      try {

            '# 4) 핵심 요약',
            '#   dist/index.html = 진입점 (no-cache)',
            '#   dist/assets/*-[hash].* = 불변 (1년 immutable)',
            '#   콘텐츠 해시 = 캐시 무효화 자동화',
            '',
            '# 다음 칸',
            '#   II-2-1 에서 환경 변수(import.meta.env)와',
            '#   모드별 빌드(.env.production)를 다룬다',
          ],
          highlight: [3, 4, 5, 8, 9, 10, 13, 14, 15, 16, 19, 20, 21],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-indigo-50',  border: 'border-indigo-300', text: 'text-indigo-800', badge: 'bg-indigo-200 text-indigo-800', bar: 'bg-indigo-500' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-800',  badge: 'bg-amber-200 text-amber-800',  bar: 'bg-amber-500' },
      danger: { bg: 'bg-rose-50',    border: 'border-rose-400',   text: 'text-rose-800',   badge: 'bg-rose-200 text-rose-800',    bar: 'bg-rose-500' },
    };

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70 ml-0.5">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">Before</th><th className="py-1 pr-2">After</th><th className="py-1">확인</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function Scene({ scene }) {
      if (scene === 'tree') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 font-mono text-[10px]">
            <div className="text-slate-500 mb-1">vite build → dist/</div>
            <div className="space-y-0.5 text-slate-700">
              <div className="text-indigo-800 font-bold">dist/</div>
              <div className="pl-3">├── index.html <span className="text-slate-400">진입점</span></div>
              <div className="pl-3">└── assets/</div>
              <div className="pl-8 text-indigo-700">├── index-a1b2c3d4.js</div>
              <div className="pl-8 text-indigo-700">├── vendor-9f8e7d6c.js</div>
              <div className="pl-8 text-violet-700">├── index-4e2a9f1c.css</div>
              <div className="pl-8 text-emerald-700">└── logo-7c3b2a10.svg</div>
              <div className="text-emerald-700 font-bold pt-1">→ 폴더 통째로 정적 서버에 업로드</div>
            </div>
          </div>
        );
      }
      if (scene === 'hash') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 font-mono text-[10px] space-y-2">
            <div className="text-slate-500">콘텐츠 변경 → 해시 변경</div>
            <div className="flex items-center gap-2">
              <span className="text-slate-600">App.jsx</span>
              <span className="text-rose-600">"저장"</span>
              <span className="text-slate-400">→</span>
              <span className="text-emerald-600">"제출"</span>
            </div>
            <div className="flex items-center gap-2 text-[11px]">
              <span className="px-2 py-1 rounded bg-slate-100 text-slate-600 line-through">index-a1b2c3d4.js</span>
            </div>
            <div className="flex items-center gap-2 text-[11px]">
              <span className="px-2 py-1 rounded bg-indigo-100 text-indigo-800 font-bold">index-e5f6a7b8.js</span>
              <span className="text-emerald-700">새 이름 → 자동 재요청</span>
            </div>
            <div className="text-indigo-700 pt-1">?v= 수동 버스팅 불필요</div>
          </div>
        );
      }
      if (scene === 'cache') {
        return (
          <div className="rounded-lg bg-gradient-to-r from-indigo-50 to-emerald-50 border border-indigo-300 p-3 font-mono text-[10px] space-y-2">
            <div className="text-slate-500">2단 캐시 정책</div>
            <div className="rounded bg-white border border-indigo-200 p-2">
              <div className="text-indigo-800 font-bold">/assets/*-[hash].*</div>
              <div className="text-slate-600">Cache-Control: max-age=31536000, immutable</div>
              <div className="text-emerald-700">→ 1년 영구 캐시 (안전)</div>
            </div>
            <div className="rounded bg-white border border-amber-200 p-2">
              <div className="text-amber-800 font-bold">/index.html</div>
              <div className="text-slate-600">Cache-Control: no-cache</div>
              <div className="text-amber-700">→ 매번 최신 확인</div>
            </div>
          </div>
        );
      }
      if (scene === 'base') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 font-mono text-[10px] space-y-2">
            <div className="text-slate-500">서브패스 배포: base 필수</div>
            <div className="rounded bg-rose-50 border border-rose-200 p-2">
              <div className="text-rose-700 font-bold">base 미설정 (기본 "/")</div>
              <div className="text-slate-600">index.html → /assets/index-…js</div>
              <div className="text-rose-700">example.com/app/ 에선 404</div>
            </div>
            <div className="text-center text-indigo-500">base: "/app/" ↓</div>
            <div className="rounded bg-emerald-50 border border-emerald-200 p-2">
              <div className="text-emerald-700 font-bold">base 설정</div>
              <div className="text-slate-600">index.html → /app/assets/index-…js</div>
              <div className="text-emerald-700">정상 로드</div>
            </div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">정적 배포 3요소</div>
          <div className="grid grid-cols-3 gap-2 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">base</div>
              <div className="text-slate-600 mt-1">배포 경로 일치</div>
              <div className="text-[9px] text-slate-500">서브패스 대응</div>
            </div>
            <div className="bg-white rounded p-2 border-2 border-indigo-400">
              <div className="text-indigo-700 font-bold">2단 캐시</div>
              <div className="text-slate-600 mt-1">assets 영구</div>
              <div className="text-[9px] text-slate-500">html no-cache</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">청크 분리</div>
              <div className="text-slate-600 mt-1">vendor 분리</div>
              <div className="text-[9px] text-slate-500">초기 로딩 ↓</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">dist/ 출력 + 콘텐츠 해시</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="assets 파일 수" value={state.assets} unit="개" max={8} current={state.assets} tone="good" />
            <MetricCard label="해시 길이" value={state.hashLen} unit="자" max={8} current={state.hashLen} tone="good" />
            <MetricCard label="에셋 캐시 기간" value={state.cacheDays} unit="일" max={365} current={state.cacheDays} tone="good" />
            <MetricCard label="깨진 경로" value={state.broken} unit="건" max={5} current={state.broken} tone={state.broken > 0 ? 'danger' : 'good'} />
          </div>

          <div className="mt-3">
            <Scene scene={state.scene} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded text-white" style={{background:'#3d40b5'}}>Part II. 프로덕션 빌드</span>
                  <span className="text-[10px] font-mono text-slate-500">II-1-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>dist/ 출력 구조 + 해시</h1>
                <p className="text-sm text-slate-700/80">빌드 산출물과 캐시 무효화를 위한 파일 해시</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                vite build 는 dist/index.html(진입점)과 dist/assets/ 아래 해시 붙은 파일을 만든다. 콘텐츠 해시라 내용이 바뀌면 파일명이 바뀌어 캐시가 자동 무효화된다. 그래서 assets 는 1년 immutable, index.html 은 no-cache 로 나눈다. 서브패스 배포는 base 를 맞춰야 경로가 안 깨진다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['dist', 'content-hash', 'cache-control', 'immutable', 'base-path'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-1.html" className="underline hover:no-underline">다음: II-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
