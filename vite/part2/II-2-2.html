<!DOCTYPE html>
<html lang="ko" data-trn-native-beats="1">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite 학습 — II-2-2. Asset 처리 — ?url / ?raw / public</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⚡</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius: 8px !important; }
    #root > div { background-image: none !important; background-color: #fffdf7 !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    Vite Chapter II-2-2 — Asset 처리 (?url / ?raw / public)
    학습 목표: 같은 자산을 여러 방식으로 다룰 때 각각 어떤 결과가 나오나
              - 기본 import   → 해시된 URL 문자열 (번들 관리, 캐시 안전)
              - ?url          → 명시적 URL (기본과 같으나 의도 표현)
              - ?raw          → 파일 내용을 문자열로 인라인
              - ?inline       → 강제 base64 data URI 인라인
              - public/       → 변환 없이 그대로 서빙, 경로 유지 (해시 없음)
    패턴: fastapi v1 — 좌(LiveDataPane: 4가지 처리 결과 대비) / 우(VSCode CodeViewer)
    색상: #646CFF
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      dflt: {lang: 'javascript', filename: 'default-import.js', lines: [
            '// 자산을 그냥 import 하면 "URL 문자열" 이 온다',
            'import logoUrl from "./assets/logo.png";',
            '',
            'console.log(logoUrl);',
            '// => dev  : /src/assets/logo.png',
            '// => build: /assets/logo.4a7f9c2b.png   (내용 해시 포함)',
            '',
            '// 그래서 이렇게 쓴다 — 값은 항상 "경로"다',
            'const img = document.createElement("img");',
            'img.src = logoUrl;',
            'document.body.appendChild(img);',
            '',
            '// React 예시',
            'function Logo() {',
            '  return React.createElement("img", { src: logoUrl, alt: "logo" });',
            '}',
            '',
            '// 왜 URL 인가',
            '//  - 이미지 바이트를 JS 번들에 넣으면 JS 가 무거워진다',
            '//  - 브라우저가 별도로 병렬 요청 + 캐시하게 두는 편이 낫다',
            '//  - 해시 파일명 => 무한 캐시 (Cache-Control immutable) 가능',
      ]},
      suffix: {lang: 'javascript', filename: 'query-suffix.js', lines: [
            '// 1) ?url — 명시적으로 URL 을 받는다 (기본과 동일 결과)',
            'import iconUrl from "./icon.svg?url";',
            '// => /assets/icon.7d1e.svg',
            '',
            '// 2) ?raw — 파일 "내용" 을 문자열로 가져온다',
            'import shaderSrc from "./frag.glsl?raw";',
            'console.log(typeof shaderSrc);   // => "string"',
            '// => "precision highp float; void main(){ ... }"',
            'gl.shaderSource(shader, shaderSrc);',
            '',
            '// SVG 마크업을 직접 넣고 싶을 때',
            'import svgText from "./check.svg?raw";',
            'el.innerHTML = svgText;          // 인라인 SVG DOM',
            '',
            '// 3) ?inline — 크기와 무관하게 base64 data URI',
            'import bgInline from "./tiny.png?inline";',
            'console.log(bgInline);',
            '// => data:image/png;base64,iVBORw0KGgo...',
            'el.style.backgroundImage = "url(" + bgInline + ")";',
            '',
            '// 정리 — 무엇을 "값" 으로 받고 싶은가로 고른다',
            '//   URL 이 필요   => ?url (또는 기본)',
            '//   내용(문자열) => ?raw',
            '//   data URI     => ?inline',
      ]},
      inline: {lang: 'javascript', filename: 'inline-threshold.js', lines: [
            '// vite.config.js',
            'import { defineConfig } from "vite";',
            '',
            'export default defineConfig({',
            '  build: {',
            '    // 기본 4096 bytes. 이보다 작으면 base64 인라인',
            '    assetsInlineLimit: 4096,',
            '  },',
            '});',
            '',
            '// 결과 예시 (같은 import 문, 크기만 다름)',
            'import small from "./icon-16.png";   // 1.2 KB',
            'import large from "./hero-bg.jpg";   // 320 KB',
            '',
            'console.log(small);',
            '// => data:image/png;base64,iVBORw0K...  (인라인됨)',
            'console.log(large);',
            '// => /assets/hero-bg.a91c.jpg           (별도 파일)',
            '',
            '// 파일별로 세밀하게 제어하려면 함수로',
            'assetsInlineLimit: (filePath, content) => {',
            '  if (filePath.endsWith(".svg")) return false; // 항상 파일로',
            '  return content.length < 4096;',
            '}',
            '',
            '// 함정 — 큰 파일을 ?inline 으로 강제하면',
            '//   base64 는 원본보다 ~33% 커지고 JS 번들에 박힌다',
            '//   => 첫 로딩 파싱 비용 증가. 작은 자산에만 쓰자.',
      ]},
      pub: {lang: 'javascript', filename: 'public-vs-import.js', lines: [
            '// 디렉터리 구조',
            '//   public/',
            '//     robots.txt        => /robots.txt  로 그대로 서빙',

               caption:'값 없는 부작용 import 는 스타일을 페이지에 주입하고, CSS Modules 는 클래스 맵을 돌려준다.',
               changes:[{mark:'new', text:'reset.css 주입'},
                        {mark:'new', text:'styles 클래스 맵'}] },
        active: 'glob',
        keyPoint: 'CSS 는 부작용 import, CSS Modules 는 값이 있는 import 다.',
        code:{...CODE.glob, highlight:[5, 6, 7, 8, 9]},
      },
      { ...S5,
        beat:{ label:'glob 으로 폴더를 모은다', at:'json-css-glob.js L11–15',
               caption:'import.meta.glob 은 경로 → 로더 함수 맵을 만들고, 호출하는 순간 실제로 로딩한다.',
               changes:[{mark:'new', text:'pages 모듈 맵'},
                        {mark:'read', text:'load() 시점에 로딩'}] },
        active: 'glob',
        keyPoint: 'glob 의 기본은 지연 로딩이다. 맵의 값은 모듈이 아니라 함수다.',
        code:{...CODE.glob, highlight:[11, 12, 13, 14, 15]},
      },
      { ...S5,
        beat:{ label:'eager 로 즉시 가져온다', at:'json-css-glob.js L17–23',
               caption:'eager 와 query 를 함께 주면 아이콘 파일들이 문자열 맵으로 한 번에 들어온다.',
               changes:[{mark:'changed', text:'함수 맵 → 값 맵'},
                        {mark:'read', text:'query 로 ?raw 적용'}] },
        active: 'raw',
        keyPoint: 'glob 의 query 옵션은 접미사와 같다. eager + ?raw 면 문자열 맵이 된다.',
        code:{...CODE.glob, highlight:[17, 18, 19, 20, 21, 22, 23]},
      },
      { ...S5,
        beat:{ label:'glob 패턴은 정적이어야 한다', at:'json-css-glob.js L25–28',
               caption:'변수로 경로를 조립하면 번들러가 대상 파일을 찾지 못한다.',
               changes:[{mark:'gone', text:'변수 경로 지원'},
                        {mark:'read', text:'방식 5종 비교표'}] },
        active: 'glob',
        keyPoint: 'JSON=객체, CSS=자동 주입, glob=폴더 일괄. 자산은 무엇을 값으로 받나로 방식을 고른다.',
        summary: {
          title: '자산 처리 방식 한눈에 (같은 파일, 다른 목적)',
          rows: [
            { way: '기본 import', result: '해시된 URL', use: 'img/CSS 배경, 캐시 안전', hash: '있음' },
            { way: '?url', result: 'URL(명시적)', use: '의도를 분명히', hash: '있음' },
            { way: '?raw', result: '문자열(내용)', use: '셰이더·SVG·텍스트', hash: '없음' },
            { way: '?inline', result: 'base64 URI', use: '아주 작은 자산', hash: '없음' },
            { way: 'public/', result: '원본 경로', use: '고정 파일명·정적', hash: '없음' },
          ],
        },
        code:{...CODE.glob, highlight:[25, 26, 27, 28]},
      },
    ];

    // 각 STEP 에서 강조할 "처리 방식" 4종
    const WAYS = [
      { key: 'default', label: '기본 import', input: 'import x from "./logo.png"', output: '/assets/logo.4a7f.png', form: 'URL', tone: 'good' },
      { key: 'raw',     label: '?raw',        input: 'import x from "./logo.svg?raw"', output: '"<svg>...</svg>" (문자열)', form: '내용', tone: 'violet' },
      { key: 'inline',  label: '?inline',     input: 'import x from "./logo.png?inline"', output: 'data:image/png;base64,iVBO...', form: 'base64', tone: 'amber' },
      { key: 'public',  label: 'public/',     input: '"/logo.png" (직접 참조)', output: '/logo.png (해시 없음)', form: '원본경로', tone: 'slate' },
    ];

    const WAY_TONE = {
      good:   { bg: 'bg-indigo-50',  border: 'border-indigo-400', text: 'text-indigo-800', chip: 'bg-indigo-500' },
      violet: { bg: 'bg-violet-50',  border: 'border-violet-400', text: 'text-violet-800', chip: 'bg-violet-500' },
      amber:  { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-800',  chip: 'bg-amber-500' },
      slate:  { bg: 'bg-slate-100',  border: 'border-slate-400',  text: 'text-slate-700',  chip: 'bg-slate-500' },
    };

    function WayRow({ way, active }) {
      const t = WAY_TONE[way.tone];
      const on = active === way.key;
      return (
        <div className={`rounded-lg border px-3 py-2 transition-all duration-300 ${on ? `${t.bg} ${t.border} shadow-sm scale-[1.02]` : 'bg-white border-slate-200 opacity-60'}`}>
          <div className="flex items-center gap-2 mb-1">
            <span className={`text-[10px] px-1.5 py-0.5 rounded text-white font-mono ${on ? t.chip : 'bg-slate-300'}`}>{way.label}</span>
            <span className="text-[10px] text-slate-500 font-mono truncate">{way.input}</span>
            <span className={`ml-auto text-[9px] px-1.5 py-0.5 rounded-full font-bold ${on ? `${t.bg} ${t.text}` : 'bg-slate-100 text-slate-400'}`}>{way.form}</span>
          </div>
          <div className="flex items-center gap-2 font-mono text-[11px]">
            <span className="text-slate-400">=&gt;</span>
            <span className={`truncate ${on ? t.text + ' font-semibold' : 'text-slate-400'}`}>{way.output}</span>
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">방식</th><th className="py-1 pr-2">받는 값</th><th className="py-1 pr-2">쓰임</th><th className="py-1">해시</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-mono font-medium text-indigo-800">{r.way}</td>
                  <td className="py-1 pr-2 text-slate-800">{r.result}</td>
                  <td className="py-1 pr-2 text-slate-600">{r.use}</td>
                  <td className={`py-1 font-bold ${r.hash === '있음' ? 'text-emerald-700' : 'text-rose-600'}`}>{r.hash}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">같은 자산, 4가지 처리 결과</h3>
            <span className="text-[10px] px-2 py-0.5 rounded bg-indigo-100 text-indigo-800 font-mono">logo 파일 1개</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-50 border border-indigo-200 p-2 mb-3 text-center">
            <span className="text-[10px] text-slate-500 font-mono">src/assets/logo · public/logo</span>
            <div className="text-[11px] text-indigo-700 mt-0.5">한 파일을 아래 4가지 방식으로 다루면 값의 "형태" 가 달라진다</div>
          </div>

          <div className="space-y-2">
            {WAYS.map((w) => (
              <WayRow key={w.key} way={w} active={state.active} />
            ))}
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(i);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded text-white" style={{background:'#3d40b5'}}>Part II. 프로덕션 빌드</span>
                  <span className="text-[10px] font-mono text-slate-500">II-2-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>Asset 처리 — ?url / ?raw / public</h1>
                <p className="text-sm text-slate-700/80">이미지·폰트·텍스트 등 자산을 다루는 여러 방법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                자산을 다루는 핵심 질문은 "무엇을 값으로 받고 싶은가" 다. URL 이면 기본 import 나 ?url, 내용이면 ?raw, data URI 면 ?inline. 작은 자산(4KB 미만)은 자동 base64 인라인된다. 파일명을 고정하거나 파이프라인을 안 태우려면 public/ 에 두되 해시가 없어 캐시 버스팅은 수동이다. 여러 파일은 import.meta.glob 로 일괄 수집한다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['assets', 'url-query', 'raw', 'inline', 'public', 'glob'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="./II-2-1.html" className="underline hover:no-underline">← 이전: II-2-1</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
