        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>

            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>

          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">

                <div className="h-full bg-indigo-500" style={{ width: '100%' }} />
              </div>
              <span className="w-24 text-right text-indigo-700">Rollup 번들 · 최적화</span>
            </div>
            <div className="text-[10px] text-amber-700 pt-1">prod = 네트워크 왕복이 비싸다 → 번들 필요</div>
          </div>
        );
      }
      if (scene === 'shake') {
        return <ShakeScene shaken={true} />;
      }
      if (scene === 'minify') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3">
            <div className="text-[10px] text-slate-500 mb-2 font-mono">크기 축소 단계 (240 KB 출발)</div>
            <div className="space-y-1 text-[11px] font-mono">
              {[
                { name: '원본', kb: 240, w: 100, c: 'bg-rose-400' },
                { name: 'tree-shake', kb: 96, w: 40, c: 'bg-amber-400' },
                { name: 'minify', kb: 62, w: 26, c: 'bg-indigo-400' },
                { name: 'gzip', kb: 21, w: 9, c: 'bg-emerald-500' },
              ].map((b, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-20 text-slate-700">{b.name}</span>
                  <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                    <div className={`h-full ${b.c}`} style={{ width: `${b.w}%` }} />
                  </div>
                  <span className="w-14 text-right text-slate-600">{b.kb}KB</span>
                </div>
              ))}
            </div>
            <div className="text-[10px] text-indigo-700 mt-2 font-mono">sourcemap 은 별도 .map 로 디버깅 좌표 보존</div>
          </div>
        );
      }
      if (scene === 'sideeffects') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono space-y-1">
            <div className="text-slate-500 mb-1">sideEffects 판정</div>
            <div className="flex items-center gap-2">
              <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 border border-emerald-300">safe</span>
              <span className="text-slate-700">pure util 파일 → 미사용 시 제거 OK</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="px-2 py-0.5 rounded bg-rose-100 text-rose-700 border border-rose-300">keep</span>
              <span className="text-slate-700">register.js · *.css → import 자체가 효과</span>
            </div>
            <div className="mt-2 rounded bg-slate-900 text-slate-200 p-2 text-[10px]">
              <div className="text-emerald-300">"sideEffects": false</div>
              <div className="text-amber-300">"sideEffects": ["**/*.css"]</div>
            </div>
            <div className="text-[10px] text-indigo-700 pt-1">오설정 → 필요한 부수효과 파일 삭제 → 런타임 버그</div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">tree-shaking 3대 함정</div>
          <div className="grid grid-cols-3 gap-2 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">CJS</div>
              <div className="text-slate-600 mt-1">동적 require</div>
              <div className="text-[9px] text-slate-500">절삭 어려움</div>
            </div>
            <div className="bg-white rounded p-2 border-2 border-indigo-400">
              <div className="text-indigo-700 font-bold">sideEffects</div>
              <div className="text-slate-600 mt-1">오설정</div>
              <div className="text-[9px] text-slate-500">필요 코드 삭제</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">배럴 파일</div>
              <div className="text-slate-600 mt-1">re-export</div>
              <div className="text-[9px] text-slate-500">그래프 유입</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">Rollup 번들 · tree-shaking</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="모듈 수 (입력)" value={state.modules} unit="개" max={250} current={state.modules} tone="warn" />
            <MetricCard label="최종 번들" value={state.bundleKb} unit="KB" max={240} current={state.bundleKb || 1} tone={state.bundleKb === 0 ? 'warn' : state.bundleKb <= 80 ? 'good' : 'warn'} />
            <MetricCard label="제거된 코드" value={state.removedKb} unit="KB" max={200} current={state.removedKb} tone={state.removedKb >= 100 ? 'good' : 'warn'} />
            <MetricCard label="번들 파일 요청" value={state.requests} unit="회" max={240} current={state.requests} tone={state.requests >= 100 ? 'danger' : 'good'} />
          </div>

          <div className="mt-3">
            <Scene state={state} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full mb-1 text-white" style={{background:'#3d40b5'}}>Part II. 프로덕션 빌드</span>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>II-1-1. Rollup 빌드 — tree-shaking</h1>
                <p className="text-sm text-slate-700/80">배포용은 Rollup 으로 번들·최적화, 안 쓰는 코드는 제거</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                prod 는 네트워크 너머라 요청이 비싸서 vite build 가 Rollup 으로 번들한다. ESM import 는 정적이라 미사용 export 를 실행 없이 판정해 제거(tree-shaking)하고, minify 로 부피를 줄이며 sourcemap 으로 디버깅 좌표를 남긴다. 잘 되게 하려면 ESM 라이브러리 선택, sideEffects 정확한 선언, 배럴 파일 회피 이 세 가지를 지킨다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Rollup', 'tree-shaking', 'minify', 'sourcemap', 'sideEffects'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
