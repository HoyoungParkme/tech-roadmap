  -->

        polyfills: 0,

        verdictTone: 'good',

          ],

      },
      {
        title: 'Step 3. plugins 배열 등록과 순서',
        desc: 'plugins 는 배열이라 여러 프레임워크·기능 플러그인을 함께 쓸 수 있다. Vite 는 배열 순서대로 각 플러그인의 훅을 실행하므로 순서가 곧 파이프라인이다. 소스를 변환하는 프레임워크 플러그인(react/vue) 을 앞에 두고, 최종 산출물을 다시 가공하는 plugin-legacy 는 반드시 맨 뒤에 둔다. 순서를 뒤집으면 legacy 가 아직 변환 안 된 코드를 처리해 빌드가 깨진다.',
        scene: 'register',

        code: {
          lang: 'javascript',

            '      targets: ["defaults", "not IE 11"],',
            '    }),',
            '  ],',
            '});',
            '',
            '// 왜 순서가 중요한가',
            '//   Vite 는 plugins 배열을 위에서 아래로 실행',
            '//   react() 가 JSX => JS 로 먼저 바꿔놔야',
            '//   legacy() 가 그 결과를 구형 문법으로 다운레벨 가능',

            'export const plugins = [',
            '  react(),',

        code: {
          lang: 'javascript',
          filename: 'vite.config.js',
          lines: [
            'import { defineConfig } from "vite";',

            '      // => async/await 등 런타임 폴리필 보강',
            '      additionalLegacyPolyfills: [',
            '        "regenerator-runtime/runtime",',

            '      polyfills: true,            // => 필요한 폴리필 자동 추가',
            '    }),',
            '  ],',
            '});',

            '//   dist/assets/index-modern.js   (ESM, 최신 브라우저)',

            '',
            '// 함정: targets 를 "ie >= 11" 로 크게 잡으면',

        },
      },
      {
        title: 'Step 5. 공식 vs 커뮤니티 · 실무 함정',

            { metric: 'plugin-legacy', before: '구형 청크+폴리필', after: '호환성', delta: '선택' },

        keyPoint: '프레임워크 플러그인 먼저, legacy 마지막. 옵션은 최소로, 버전은 vite 메이저에 맞춰라.',
        code: {
          lang: 'markdown',
          filename: 'official-plugins-summary.md',
          lines: [
            '# 공식 플러그인 (react / vue / legacy) 정리',
            '',
            '## 왜 플러그인인가',
            '- Vite 코어는 프레임워크를 모른다 (의도적으로 얇게)',
            '- 프레임워크 통합/브라우저 호환은 플러그인이 담당',
            '- plugins 배열에 등록하면 dev/build 훅에 끼어든다',
            '',
            '## 세 가지 역할',
            '1. plugin-react  => JSX 변환 + Fast Refresh',
            '2. plugin-vue    => .vue SFC 컴파일 + SFC 단위 HMR',
            '3. plugin-legacy => 구형용 청크 + 폴리필 자동 생성',
            '',
            '## 순서 규칙 (사고의 90%)',
            '- 소스를 바꾸는 react/vue 를 앞에',
            '- 산출물을 후처리하는 legacy 를 맨 뒤에',
            '- 뒤집으면 legacy 가 변환 전 코드를 만나 빌드 실패',

            '## 공식 vs 커뮤니티',

            '- 버전 불일치 => plugin 메이저와 vite 메이저 어긋남',

          ],
          highlight: [2, 3, 4, 5, 7, 8, 9, 10, 12, 13, 14, 15],
        },
      },

    const TONE = {
      good:   { bg: 'bg-indigo-50',  border: 'border-indigo-300', text: 'text-indigo-800', badge: 'bg-indigo-200 text-indigo-800', bar: 'bg-indigo-500' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-800',  badge: 'bg-amber-200 text-amber-800',  bar: 'bg-amber-500' },
      danger: { bg: 'bg-rose-50',    border: 'border-rose-400',   text: 'text-rose-800',   badge: 'bg-rose-200 text-rose-800',    bar: 'bg-rose-500' },
    };

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70 ml-0.5">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">역할</th><th className="py-1 pr-2">효과</th><th className="py-1">구분</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function PluginPipe({ active }) {
      const boxes = [
        { key: 'react', label: 'plugin-react', sub: 'JSX 변환' },
        { key: 'vue', label: 'plugin-vue', sub: 'SFC 컴파일' },
        { key: 'legacy', label: 'plugin-legacy', sub: '레거시 번들' },
      ];
      return (
        <div className="rounded-lg bg-white border border-indigo-300 p-3">
          <div className="text-[10px] text-slate-500 mb-2 font-mono">vite.config plugins 파이프라인</div>
          <div className="flex items-stretch gap-1 text-[10px]">
            <div className="flex flex-col justify-center px-2 py-1 rounded bg-slate-100 text-slate-600 font-mono">source</div>
            <div className="flex items-center text-indigo-400">→</div>
            {boxes.map((b, i) => {
              const on = active === b.key || active === 'all';
              return (
                <React.Fragment key={b.key}>
                  <div className={`flex-1 flex flex-col items-center justify-center px-1 py-1 rounded border text-center transition ${on ? 'bg-indigo-500 text-white border-indigo-600' : 'bg-slate-50 text-slate-400 border-slate-200'}`}>
                    <span className="font-mono font-bold">{b.label}</span>
                    <span className="opacity-80">{b.sub}</span>
                  </div>
                  {i < boxes.length - 1 && <div className="flex items-center text-indigo-300">→</div>}
                </React.Fragment>
              );
            })}
            <div className="flex items-center text-indigo-400">→</div>
            <div className="flex flex-col justify-center px-2 py-1 rounded bg-emerald-100 text-emerald-700 font-mono">bundle</div>
          </div>
        </div>
      );
    }

    function Scene({ scene }) {
      if (scene === 'react') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 font-mono text-[10px] space-y-1">
            <div className="text-slate-500">Fast Refresh 동작</div>
            <div className="text-slate-700">Counter.jsx 저장</div>
            <div className="text-indigo-700">→ plugin-react 가 그 컴포넌트만 교체</div>
            <div className="text-emerald-700">→ count state 유지 (입력값 안 날아감)</div>
            <div className="text-slate-400 pt-1">JSX → createElement · HMR 45ms</div>
          </div>
        );
      }
      if (scene === 'vue') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 font-mono text-[10px]">
            <div className="text-slate-500 mb-1">App.vue → SFC 3블록 분해</div>
            <div className="grid grid-cols-3 gap-1 text-center">
              <div className="bg-emerald-50 border border-emerald-200 rounded px-1 py-1 text-emerald-700">template<br/>렌더 함수</div>
              <div className="bg-indigo-50 border border-indigo-200 rounded px-1 py-1 text-indigo-700">script<br/>컴포넌트</div>
              <div className="bg-amber-50 border border-amber-200 rounded px-1 py-1 text-amber-700">style<br/>scoped CSS</div>
            </div>
            <div className="text-slate-400 pt-1">plugin-vue 가 컴파일 → HMR 40ms</div>
          </div>
        );
      }
      if (scene === 'register') {
        return <PluginPipe active="all" />;
      }
      if (scene === 'legacy') {
        return (
          <div className="rounded-lg bg-white border border-amber-300 p-3">
            <div className="text-[10px] text-slate-500 mb-2 font-mono">build 산출물 (한 소스 → 두 벌)</div>
            <div className="space-y-1 text-[11px] font-mono">
              <div className="flex items-center gap-2">
                <span className="w-24 text-slate-700">modern.js</span>
                <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                  <div className="h-full bg-emerald-500" style={{ width: '52%' }} />
                </div>
                <span className="w-14 text-right text-emerald-700">62 KB</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-24 text-slate-700">legacy.js</span>
                <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                  <div className="h-full bg-amber-500" style={{ width: '80%' }} />
                </div>
                <span className="w-14 text-right text-amber-700">96 KB</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-24 text-slate-700">polyfills</span>
                <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                  <div className="h-full bg-rose-400" style={{ width: '35%' }} />
                </div>
                <span className="w-14 text-right text-rose-700">41 KB</span>
              </div>
            </div>
            <div className="text-[10px] text-amber-700 mt-2 font-mono">modern=module / legacy=nomodule 로 자동 분기</div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">공식 플러그인 3종 · 적재적소</div>
          <div className="grid grid-cols-3 gap-2 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">plugin-react</div>
              <div className="text-slate-600 mt-1">JSX · Fast Refresh</div>
              <div className="text-[9px] text-slate-500">React 앱 필수</div>
            </div>
            <div className="bg-white rounded p-2 border-2 border-indigo-400">
              <div className="text-indigo-700 font-bold">plugin-vue</div>
              <div className="text-slate-600 mt-1">SFC 컴파일</div>
              <div className="text-[9px] text-slate-500">Vue 앱 필수</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">plugin-legacy</div>
              <div className="text-slate-600 mt-1">구형 지원</div>
              <div className="text-[9px] text-slate-500">배열 맨 뒤</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">plugins 파이프라인</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="등록 플러그인" value={state.plugins} unit="개" max={3} current={state.plugins} tone="good" />
            <MetricCard label="HMR 지연" value={state.hmrMs} unit="ms" max={200} current={state.hmrMs} tone={state.hmrMs >= 100 ? 'warn' : 'good'} />
            <MetricCard label="legacy 청크" value={state.legacyKb} unit="KB" max={120} current={state.legacyKb} tone={state.legacyKb >= 80 ? 'warn' : 'good'} />
            <MetricCard label="폴리필" value={state.polyfills} unit="개" max={40} current={state.polyfills} tone={state.polyfills >= 20 ? 'warn' : 'good'} />
          </div>

          <div className="mt-3">
            <Scene scene={state.scene} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{background:'#646CFF'}}>Part III. 플러그인</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 font-mono">III-2-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>공식 플러그인 — react / vue / legacy</h1>
                <p className="text-sm text-slate-700/80">프레임워크 통합과 구형 브라우저 지원을 플러그인으로</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} aria-label="이전 단계" disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} aria-label="다음 단계" disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                Vite 코어는 프레임워크를 모른다. plugin-react(JSX·Fast Refresh)·plugin-vue(SFC) 로 프레임워크를 붙이고, plugin-legacy 로 구형 브라우저용 청크·폴리필을 자동 생성한다. plugins 배열은 순서가 곧 파이프라인이라 프레임워크 플러그인을 먼저, legacy 를 맨 뒤에 둔다. 공식 3종은 vite 메이저와 함께 검증되니 버전을 맞추고, 옵션과 targets 는 최소로 유지하라.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['plugin-react', 'plugin-vue', 'plugin-legacy', 'plugins-order', 'FastRefresh'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
