  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⚡</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    III-1-1. esbuild plugin — Vite 사전 번들 단계 (dev only)
    학습 목표: vite dev 첫 실행 시 node_modules CJS/UMD 를 ESM 으로 변환하는
              esbuild 사전 번들(dep optimization) 의 흐름과 esbuild plugin 훅을 5단계로 본다.
    핵심 비유: "택배 라벨링 공장" — 들어온 라이브러리(다양한 포맷)를 ESM 으로 통일 라벨링.
    패턴: fastapi v1 — 좌(LiveDataPane: node_modules → esbuild plugin chain → .vite cache)
                       / 우(VSCode CodeViewer 5탭)
    색상: #646CFF (Vite indigo)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 5단계 시나리오 — esbuild plugin 사전 번들 흐름
    //   1) 의존성 스캔 (scan)
    //   2) onResolve  훅 — 경로 해석
    //   3) onLoad     훅 — 파일 로드/변환
    //   4) CJS → ESM 변환 + 번들
    //   5) .vite/deps/ 캐시 산출
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 원본 STEPS 의 트리·청크 데이터를 그대로 상수화한다 (beat 는 slice 로 점진 공개)
    const T1S = [
          { id: 's1-root', name: 'my-app/', depth: 0, kind: 'dir' },
          { id: 's1-idx', name: 'index.html', depth: 1, kind: 'entry' },
          { id: 's1-src', name: 'src/', depth: 1, kind: 'dir' },
          { id: 's1-main', name: 'main.jsx', depth: 2, kind: 'file' },
          { id: 's1-app', name: 'App.jsx', depth: 2, kind: 'file' },
          { id: 's1-nm', name: 'node_modules/', depth: 1, kind: 'dir' },
    ];
    const T1D = [
          { id: 'd1-scan', name: 'esbuild.scan({...})', depth: 0, kind: 'cmd' },
          { id: 'd1-log1', name: 'parse main.jsx → react, react-dom 발견', depth: 0, kind: 'log' },
          { id: 'd1-log2', name: 'parse App.jsx → lodash-es 발견', depth: 0, kind: 'log' },
          { id: 'd1-log3', name: 'parse Settings.jsx → axios 발견', depth: 0, kind: 'log' },
          { id: 'd1-log4', name: '✓ 4 개 의존성 후보 수집', depth: 0, kind: 'log' },
    ];
    const C1 = [];
    const T2S = [
          { id: 's2-input', name: "import 'react'", depth: 0, kind: 'cmd' },
          { id: 's2-input2', name: "import 'lodash-es'", depth: 0, kind: 'cmd' },
          { id: 's2-input3', name: "import 'virtual:my-mod'", depth: 0, kind: 'cmd' },
    ];
    const T2D = [
          { id: 'd2-res', name: 'onResolve({ filter, namespace })', depth: 0, kind: 'cmd' },
          { id: 'd2-r1', name: 'react        → node_modules/react/...', depth: 0, kind: 'log' },
          { id: 'd2-r2', name: 'lodash-es    → node_modules/lodash-es/...', depth: 0, kind: 'log' },
          { id: 'd2-r3', name: 'virtual:mod  → ns:"virtual" + path 보존', depth: 0, kind: 'log' },
          { id: 'd2-r4', name: '✓ 3 건 해석 완료', depth: 0, kind: 'log' },
    ];
    const C2 = [
          { name: 'baseImports', kb: 2, color: 'bg-[#646CFF]' },
          { name: 'virtualImports', kb: 1, color: 'bg-fuchsia-400' },
    ];
    const T3S = [
          { id: 's3-r1', name: 'virtual:my-mod', depth: 0, kind: 'cmd' },
          { id: 's3-r2', name: 'lodash-es/index.js', depth: 0, kind: 'cmd' },
          { id: 's3-r3', name: 'axios/lib/axios.js', depth: 0, kind: 'cmd' },
    ];
    const T3D = [
          { id: 'd3-load', name: 'onLoad({ filter, namespace })', depth: 0, kind: 'cmd' },
          { id: 'd3-l1', name: 'virtual: → contents 문자열 즉시 반환', depth: 0, kind: 'log' },
          { id: 'd3-l2', name: 'lodash-es: 디스크에서 읽음 → loader:"js"', depth: 0, kind: 'log' },
          { id: 'd3-l3', name: 'axios(CJS): 읽음 → loader:"js" (변환 예정)', depth: 0, kind: 'log' },
          { id: 'd3-l4', name: '✓ 3 건 콘텐츠 확보', depth: 0, kind: 'log' },
    ];
    const C3 = [
          { name: 'virtual', kb: 1, color: 'bg-fuchsia-400' },
          { name: 'lodash-es', kb: 24, color: 'bg-[#646CFF]' },
          { name: 'axios(cjs)', kb: 18, color: 'bg-amber-400' },
    ];
    const T4S = [
          { id: 's4-i1', name: 'axios/lib/axios.js  (CJS)', depth: 0, kind: 'cmd' },
          { id: 's4-i2', name: 'axios/lib/core/...  (CJS)', depth: 0, kind: 'cmd' },
          { id: 's4-i3', name: 'lodash-es/each.js   (ESM)', depth: 0, kind: 'cmd' },
    ];
    const T4D = [
          { id: 'd4-conv', name: 'esbuild 변환 + 번들', depth: 0, kind: 'cmd' },

    // ─────────────────────────────────────────────────────
    // FolderTree — node_modules 입력 / .vite cache 출력
    // ─────────────────────────────────────────────────────
    function FolderTree({ title, nodes, accent, highlight }) {
      const iconMap = {
        dir: '📁', file: '📄', entry: '🔵', hash: '#️⃣', html: '🌐',
        vendor: '📦', app: '⚛️', cmd: '$', log: '›', note: '💭',
      };
      const colorMap = {
        dir: 'text-slate-700 font-semibold',
        file: 'text-slate-600',
        entry: 'text-[#646CFF] font-semibold',
        hash: 'text-[#646CFF] font-bold',
        html: 'text-[#646CFF] font-semibold',
        cmd: 'text-emerald-700 font-mono font-bold',
        log: 'text-slate-500 font-mono',
        note: 'text-slate-500 italic',
      };
      const accentMap = {
        src: { border: 'border-emerald-200', headerBg: 'bg-emerald-100', headerText: 'text-emerald-700', tag: 'input' },
        dist: { border: 'border-[#646CFF]/30', headerBg: 'bg-[#646CFF]/15', headerText: 'text-[#646CFF]', tag: 'output' },
      };
      const a = accentMap[accent] || accentMap.src;
      return (
        <div className={`bg-white rounded-lg border-2 ${a.border} overflow-hidden`}>
          <div className={`${a.headerBg} px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider ${a.headerText} flex items-center justify-between`}>
            <span>{title}</span>
            <span className="text-[9px] font-mono opacity-70">{a.tag}</span>
          </div>
          <div className="p-2.5 space-y-0.5">
            {nodes.map((n) => {
              const icon = iconMap[n.kind] || '·';
              const color = colorMap[n.kind] || 'text-slate-600';
              const isHL = highlight && highlight.includes(n.id);
              return (
                <div
                  key={n.id}
                  className={`flex items-center gap-1.5 text-[11px] font-mono leading-tight rounded px-1 py-0.5 ${isHL ? 'bg-[#646CFF]/15 ring-1 ring-[#646CFF]/40' : ''}`}
                  style={{ marginLeft: `${n.depth * 12}px` }}
                >
                  <span className="flex-shrink-0 w-4 text-center">{icon}</span>
                  <span className={color}>{n.name}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function ChunkBars({ chunks }) {
      if (!chunks || chunks.length === 0) {
        return (
          <div className="bg-slate-50 rounded-lg border-2 border-slate-200 p-3 text-center text-[11px] text-slate-400 italic">
            (아직 변환 산출물 없음)
          </div>
        );
      }
      const maxKb = Math.max(...chunks.map((c) => c.kb));
      return (
        <div className="bg-white rounded-lg border-2 border-slate-200 overflow-hidden">
          <div className="bg-slate-100 px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-600 flex items-center justify-between">
            <span>📊 크기 비교</span>
            <span className="text-[9px] font-mono text-slate-500">KB</span>
          </div>
          <div className="p-2.5 space-y-1.5">
            {chunks.map((c) => {
              const w = Math.max(8, (c.kb / maxKb) * 100);
              return (
                <div key={c.name} className="flex items-center gap-2">
                  <span className="text-[10px] font-mono font-semibold text-slate-700 w-28 flex-shrink-0 text-right">{c.name}</span>
                  <div className="flex-1 bg-slate-100 rounded-full h-4 overflow-hidden">
                    <div className={`${c.color} h-full rounded-full flex items-center justify-end pr-2 transition-all duration-500`} style={{ width: `${w}%` }}>
                      <span className="text-[9px] text-white font-bold">{c.kb} KB</span>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function FlowArrow({ label }) {
      return (
        <div className="flex flex-col items-center justify-center px-1">

          <div className="text-[#646CFF]/70 text-2xl leading-none">→</div>
        </div>
      );
    }

              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{step.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {step.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{step.beat.caption}</p>
              {step.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {step.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="grid grid-cols-[1fr_auto_1fr] gap-1 items-stretch">
            <FolderTree title="입력 (의존성)" nodes={step.srcTree} accent="src" highlight={step.highlight} />
            <FlowArrow label={step.arrowLabel} />
            <FolderTree title="출력 (esbuild plugin)" nodes={step.distTree} accent="dist" highlight={step.highlight} />
          </div>
          <div className="mt-3">
            <ChunkBars chunks={step.chunks} />
          </div>
          <div className="mt-3 bg-[#646CFF]/10 border-l-4 border-[#646CFF] px-3 py-2 rounded-r">
            <div className="text-[9px] font-bold text-[#646CFF] uppercase tracking-wider mb-0.5">핵심 포인트</div>
            <p className="text-[11px] text-[#646CFF]/90 leading-snug">{step.keyPoint}</p>
          </div>
          <div className="flex flex-wrap gap-2 text-[9px] mt-3 pt-2 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-[#646CFF]"></span>esm 결과</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-amber-500"></span>cjs 원본</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-fuchsia-500"></span>virtual</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-emerald-500"></span>입력 의존성</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-rose-500"></span>첫 부팅</span>
          </div>
        </div>
      );
    }

    function CodeViewer({ steps, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);
      const code = steps[stepIdx].code;
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.className = `language-${code.lang}`;
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          const html = codeRef.current.innerHTML;
          setRenderedLines(html.split('\n'));
        }
      }, [code]);
      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          <div className="bg-[#21252b] px-3 py-2 border-b border-slate-700">
            <div className="flex items-center gap-2 mb-1.5">
              <div className="flex gap-1.5">
                <span className="w-3 h-3 rounded-full bg-red-500"></span>
                <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                <span className="w-3 h-3 rounded-full bg-green-500"></span>
              </div>
              <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
            </div>
            <div className="flex flex-wrap gap-1">
              {steps.map((s, i) => (
                <span key={s.code.filename}
                  className={`text-[10px] font-mono px-2 py-1 rounded-t border-b-2 ${
                    i === stepIdx ? 'bg-[#282c34] text-[#646CFF] border-[#646CFF] font-bold' : 'bg-[#21252b] text-slate-500 border-transparent'
                  }`}>
                  {s.code.filename}
                </span>
              ))}
            </div>
          </div>
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>
          <div className="overflow-auto max-h-[42rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const hl = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div key={i} data-hi={hl ? "1" : "0"} className={`flex hover:bg-slate-800/50 ${hl ? 'bg-[#646CFF]/15 border-l-2 border-[#646CFF]' : ''}`}>
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">{i + 1}</span>
                      <span className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1" dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }} />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines · {code.filename}</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);
      const step = STEPS[stepIdx];

      const handleNext = () => setStepIdx((i) => {
        if (i >= STEPS.length - 1) { setIsPlaying(false); return i; }
        return i + 1;
      });
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };
      const handleReset = () => { setStepIdx(0); setIsPlaying(false); };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-[#646CFF] hover:opacity-80 font-medium">&larr; 목차로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">chapter III-1-1</span>
            </nav>
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-[#646CFF] text-white flex items-center justify-center rounded-full font-bold text-sm">III</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part III. 플러그인 생태계 &gt; Chapter 1. esbuild plugin</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">III-1-1. esbuild plugin — 사전 번들 단계</h1>
                  <p className="text-sm text-slate-500 mt-0.5">vite dev 첫 부팅 시 node_modules 를 ESM 으로 통일하는 4가지 훅</p>
                </div>
              </div>
            </header>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane step={step} />
              <CodeViewer steps={STEPS} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-[#646CFF]/10 border-2 border-[#646CFF]/40 rounded-xl p-3 text-sm text-[#646CFF]">
                💡 정리: <strong>scan</strong> → <strong>onResolve</strong>(경로 해석) → <strong>onLoad</strong>(콘텐츠 로드) → <strong>CJS→ESM 변환</strong> → <strong>.vite/deps 캐시</strong>. dev 전용 단계로, 두 번째 부팅부터 200ms 안쪽. 다음(III-1-2)에서는 Vite 자체 plugin API 를 살펴본다.
              </div>
            )}
            <div className="p-4 rounded-xl bg-[#646CFF] text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-white/80">세부 {stepIdx + 1} / {STEPS.length} · {step.title}</h3>
                <span className="text-xs text-white/80">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>
            <div className="flex items-center justify-center gap-3">
              <button onClick={handleReset} disabled={stepIdx === 0 && !isPlaying} aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">처음</button>
              <button onClick={handlePrev} disabled={stepIdx === 0} aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">&larr; 이전</button>
              <button onClick={togglePlay} aria-pressed={isPlaying} aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-[#646CFF] text-white hover:opacity-90 transition min-w-[100px]">
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button onClick={handleNext} disabled={stepIdx >= STEPS.length - 1} aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">다음 &rarr;</button>
            </div>
            <div className="flex flex-wrap gap-2 justify-center">
              {['esbuild', 'pre-bundle', 'onResolve', 'onLoad', 'CJS→ESM', '.vite/deps', 'cache', 'cold start'].map((kw) => (
                <span key={kw} className="bg-[#646CFF]/10 text-[#646CFF] px-3 py-1 rounded-full text-xs font-medium border border-[#646CFF]/30">{kw}</span>
              ))}
            </div>
            <nav className="flex justify-between text-sm pt-2">
              <a href="../part2/II-2-2.html" className="text-[#646CFF] hover:opacity-80 font-medium">&larr; II-2-2 Asset 처리</a>
              <a href="./III-1-2.html" className="text-[#646CFF] hover:opacity-80 font-medium">III-1-2 Vite plugin API &rarr;</a>
            </nav>
            <footer className="text-center text-xs text-slate-400 pb-4">
              React 18 UMD + Babel Standalone + Tailwind CSS Play CDN + highlight.js 11.9.0
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
