    function HookPipeline({ litUpTo, focus }) {
      return (
        <div className="rounded-lg bg-white border border-indigo-300 p-3">
          <div className="text-[10px] text-slate-500 mb-2 font-mono">plugin pipeline (모듈 1개당 1사이클)</div>
          <div className="space-y-1.5">
            {PIPE.map((s, i) => {
              const lit = i <= litUpTo;
              const isFocus = focus === 'all' ? (s.id === 'resolveId' || s.id === 'load' || s.id === 'transform') : focus === s.id;
              return (
                <div key={s.id} className="flex items-center gap-2">
                  <div className={`flex-1 rounded-md border px-2 py-1.5 transition ${isFocus ? 'border-indigo-500 bg-indigo-50' : lit ? 'border-slate-300 bg-slate-50' : 'border-slate-200 bg-white opacity-50'}`}>
                    <div className={`text-[11px] font-mono font-bold ${isFocus ? 'text-indigo-700' : 'text-slate-700'}`}>{s.label}</div>
                    <div className="text-[9px] text-slate-500">{s.sub}</div>
                  </div>
                  {i < PIPE.length - 1 && (
                    <span className={`text-xs ${lit ? 'text-indigo-500' : 'text-slate-300'}`}>&#8595;</span>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">&#128203; {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">잘못</th><th className="py-1 pr-2">올바름</th><th className="py-1">효과</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function SceneDetail({ scene }) {
      if (scene === 'hooks') {
        return (
          <div className="grid grid-cols-3 gap-2 text-[10px] text-center">
            {[
              { h: 'resolveId', d: 'id 를 실제 경로로', c: 'border-indigo-400' },
              { h: 'load', d: '소스 문자열 반환', c: 'border-indigo-400' },
              { h: 'transform', d: '코드 변형', c: 'border-indigo-400' },
            ].map((x) => (
              <div key={x.h} className={`bg-white rounded p-2 border-2 ${x.c}`}>
                <div className="text-indigo-700 font-bold font-mono">{x.h}</div>
                <div className="text-slate-600 mt-1">{x.d}</div>
              </div>
            ))}
          </div>
        );
      }
      if (scene === 'virtual') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 font-mono text-[10px] space-y-0.5">
            <div className="text-slate-500 mb-1">virtual module id 흐름</div>
            <div className="text-slate-700">import id: <span className="text-indigo-700">virtual:my-config</span></div>
            <div className="text-slate-400">&#8595; resolveId</div>
            <div className="text-slate-700">resolved: <span className="text-emerald-700">\0virtual:my-config</span></div>
            <div className="text-slate-400">&#8595; load</div>
            <div className="text-slate-700">code: <span className="text-emerald-700">export default {'{'} apiUrl: ... {'}'}</span></div>
            <div className="text-indigo-700 pt-1">\0 접두 &#8594; 다른 플러그인이 파일로 오인 안 함</div>
          </div>
        );
      }
      if (scene === 'transform') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 font-mono text-[10px] space-y-1">
            <div className="text-slate-500">transform 치환 예시</div>
            <div className="text-rose-700">- console.log(__BUILD_TIME__)</div>
            <div className="text-emerald-700">+ console.log("2026-08-11T00:00:00Z")</div>
            <div className="text-slate-500 pt-1">대상 아닌 모듈 &#8594; <span className="text-indigo-700">return null</span> (원본 통과)</div>
          </div>
        );
      }
      if (scene === 'lifecycle') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[10px] space-y-1">
            <div className="text-slate-500 font-mono mb-1">플러그인 실행 순서 (enforce)</div>
            <div className="flex items-center gap-2 font-mono">
              <span className="px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">pre</span>
              <span className="text-slate-400">&#8594;</span>
              <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-700">기본</span>
              <span className="text-slate-400">&#8594;</span>
              <span className="px-2 py-0.5 rounded bg-violet-100 text-violet-800">post</span>
            </div>
            <div className="text-slate-600 pt-1">apply: <span className="font-mono text-indigo-700">'serve'</span>=dev 전용, <span className="font-mono text-indigo-700">'build'</span>=빌드 전용</div>
            <div className="text-slate-600">Vite 훅: configureServer · handleHotUpdate</div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3 text-[10px] text-center">
          <div className="text-indigo-700 font-mono mb-2">가상 모듈 = resolveId + load, 확장 = transform</div>
          <div className="grid grid-cols-3 gap-2">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold font-mono">resolveId</div>
              <div className="text-slate-600 mt-1">id 확정</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold font-mono">load</div>
              <div className="text-slate-600 mt-1">코드 생성</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold font-mono">transform</div>
              <div className="text-slate-600 mt-1">코드 변형</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">플러그인 파이프라인</h3>
            <span className="text-[10px] px-2 py-0.5 rounded bg-indigo-200 text-indigo-800 font-mono">resolveId &#8594; load &#8594; transform</span>
          </div>

          <HookPipeline litUpTo={state.litUpTo} focus={state.focus} />

          <div className="mt-3">
            <SceneDetail scene={state.scene} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            &#128161; {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>&#9889;</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{background:'#646CFF'}}>Part III. 플러그인</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 font-mono">III-2-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>커스텀 플러그인 · virtual module</h1>
                <p className="text-sm text-slate-700/80">직접 만드는 플러그인과 가상 모듈로 빌드 확장</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">&#8592; 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} aria-label="이전 단계" disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">&#8592; 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} aria-label="다음 단계" disabled={isLast} className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 &#8594;</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 &#8592;/&#8594; · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>&#9989; 핵심 정리</div>
                Vite 플러그인은 Rollup 훅(resolveId·load·transform)에 Vite 전용 훅(configureServer·handleHotUpdate)을 더한 객체다. 가상 모듈은 resolveId 로 id 를 잡고 load 로 코드를 생성하며, \0 접두로 실제 파일과 구분한다. transform 으로 설정 주입·매크로·코드 생성을 붙이되 대상이 아니면 null 을 돌려준다. enforce(pre/post)·apply(serve/build)로 순서와 모드를 통제하고, 가상 모듈의 HMR 은 handleHotUpdate 로 직접 무효화한다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['resolveId', 'load', 'transform', 'virtual-module', 'enforce', 'handleHotUpdate'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="./III-2-1.html" className="underline hover:no-underline">&#8592; 이전: III-2-1 공식 플러그인</a>
              <a href="../part4/IV-1-1.html" className="underline hover:no-underline">다음: IV-1-1 &#8594;</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
