            { metric: '소비자 호환', before: 'ESM 만', after: 'ESM·CJS·CDN', delta: '✓' },
          ],
        },
        keyPoint: 'build.lib + external(peerDeps) + exports/dts — 세 축이 맞물려야 안전한 이중 패키지가 된다.',
        code: {
          lang: 'markdown',
          filename: 'library-mode-summary.md',
          lines: [
            '# Vite Library Mode 정리',
            '',
            '## 무엇을 하나',
            '- 앱이 아니라 npm 에 올릴 "패키지" 를 빌드',
            '- 하나의 소스 엔트리 → 여러 소비 포맷',
            '',
            '## 세 축',
            '1. 빌드(build.lib): entry·name·formats(es/cjs/umd)',
            '2. 의존성(rollupOptions.external): peerDependencies 제외',
            '3. 패키지 메타(package.json): main/module/types + exports + dts',
            '',
            '## 포맷 선택 가이드',
            '| 포맷 | 소비자 | 특징 |',
            '|:--|:--|:--|',
            '| es  | 번들러/Node ESM | tree-shaking 가능 |',
            '| cjs | 구형 Node require | 호환성 |',
            '| umd | script 태그/CDN | 전역 1개, 단일 파일 |',
            '',
            '## 배포 전 필수 점검',
            '- exports 맵: types 를 맨 위, import/require 분기',
            '- sideEffects:false 로 tree-shaking 허용',
            '- npx publint / arethetypeswrong 로 자동 검증',
            '',
            '## 다음 칸',
            '> IV-2-2 에서 라이브러리 배포 다음 단계를 이어본다.',
          ],
          highlight: [3, 4, 5, 7, 8, 9, 10, 12, 13, 14, 15, 16, 17, 19, 20, 21, 22],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-indigo-50',  border: 'border-indigo-300', text: 'text-indigo-800', badge: 'bg-indigo-200 text-indigo-800', bar: 'bg-indigo-500' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-800',  badge: 'bg-amber-200 text-amber-800',  bar: 'bg-amber-500' },
      danger: { bg: 'bg-rose-50',    border: 'border-rose-400',   text: 'text-rose-800',   badge: 'bg-rose-200 text-rose-800',    bar: 'bg-rose-500' },
    };

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70 ml-0.5">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📦 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">지표</th><th className="py-1 pr-2">Before</th><th className="py-1 pr-2">After</th><th className="py-1">변화</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function Scene({ scene }) {
      if (scene === 'lib') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 font-mono text-[11px]">
            <div className="text-slate-500 mb-2">build.lib — 하나의 엔트리에서 출발</div>
            <div className="flex items-center gap-2">
              <div className="px-3 py-2 rounded bg-indigo-100 text-indigo-800 border border-indigo-300 text-center">
                <div className="font-bold">src/index.ts</div>
                <div className="text-[9px] text-slate-500">라이브러리 진입점</div>
              </div>
              <span className="text-indigo-500 text-lg">→</span>
              <div className="px-3 py-2 rounded text-white text-center" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
                <div className="font-bold">build.lib</div>
                <div className="text-[9px] opacity-80">HTML 처리 OFF</div>
              </div>
              <span className="text-indigo-500 text-lg">→</span>
              <div className="px-3 py-2 rounded bg-emerald-100 text-emerald-800 border border-emerald-300 text-center">
                <div className="font-bold">dist/</div>
                <div className="text-[9px] text-slate-500">import 가능</div>
              </div>
            </div>
            <div className="text-[10px] text-indigo-700 mt-2">entry · name · fileName · formats</div>
          </div>
        );
      }
      if (scene === 'formats') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3">
            <div className="text-[10px] text-slate-500 mb-1 font-mono">같은 소스 → 세 산출물</div>
            <div className="space-y-1 text-[11px] font-mono">
              {[
                { name: 'my-lib.es.js',  tag: 'ESM · tree-shake', w: 90, c: 'bg-indigo-500' },
                { name: 'my-lib.cjs.js', tag: 'CommonJS · require', w: 75, c: 'bg-indigo-400' },
                { name: 'my-lib.umd.js', tag: 'UMD · window.MyLib', w: 60, c: 'bg-violet-400' },
              ].map((b, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-28 text-slate-700">{b.name}</span>
                  <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                    <div className={`h-full ${b.c}`} style={{ width: `${b.w}%` }} />
                  </div>
                  <span className="w-32 text-right text-[9px] text-slate-500">{b.tag}</span>
                </div>
              ))}
            </div>
            <div className="text-[10px] text-amber-700 mt-1 font-mono">umd/iife = 단일 파일 (code splitting 불가)</div>
          </div>
        );
      }
      if (scene === 'external') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono">
            <div className="text-slate-500 mb-2">external — 소비자 앱의 react 를 재사용</div>
            <div className="flex items-center gap-2">
              <div className="px-2 py-2 rounded bg-indigo-100 text-indigo-800 border border-indigo-300 text-center flex-1">
                <div className="font-bold">my-lib</div>
                <div className="text-[9px] text-slate-500">4 KB (react 제외)</div>
              </div>
              <span className="text-slate-400">+</span>
              <div className="px-2 py-2 rounded bg-slate-100 text-slate-700 border border-slate-300 text-center flex-1">
                <div className="font-bold">consumer app</div>
                <div className="text-[9px] text-slate-500">react 1 벌만</div>
              </div>
            </div>
            <div className="mt-2 space-y-0.5">
              <div className="text-emerald-700">✓ external: [react, react-dom]</div>
              <div className="text-rose-600">✗ 미제외 시: react 2 벌 → Invalid hook call</div>
            </div>
          </div>
        );
      }
      if (scene === 'pkg') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[10px] font-mono">
            <div className="text-slate-500 mb-2">package.json exports — 조건별 진입점</div>
            <div className="space-y-1">
              <div className="flex items-center gap-2">
                <span className="w-16 text-indigo-700">import</span>
                <span className="text-slate-400">→</span>
                <span className="text-slate-700">dist/my-lib.es.js</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-16 text-indigo-700">require</span>
                <span className="text-slate-400">→</span>
                <span className="text-slate-700">dist/my-lib.cjs.js</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-16 text-indigo-700">types</span>
                <span className="text-slate-400">→</span>
                <span className="text-slate-700">dist/index.d.ts</span>
              </div>
            </div>
            <div className="text-[10px] text-emerald-700 mt-2">dual package: ESM 소비자 · CJS 소비자 모두 OK</div>
          </div>
        );
      }
      if (scene === 'pitfall') {
        return (
          <div className="rounded-lg bg-amber-50 border border-amber-300 p-3 text-[11px] font-mono">
            <div className="text-amber-700 mb-1">배포 사고 체크리스트</div>
            <div className="space-y-0.5 text-slate-700">
              <div>⚠ exports 에서 types 를 맨 위에</div>
              <div>⚠ import/require 조건 분기 누락</div>
              <div>⚠ CJS default interop 꼬임</div>
              <div>⚠ dts 누락 → 자동완성 사라짐</div>
              <div>⚠ sideEffects:false 없음 → tree-shake 차단</div>
            </div>
            <div className="text-[10px] text-indigo-700 mt-2">npx publint / arethetypeswrong 로 사전 점검</div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">Library Mode 의 3 축</div>
          <div className="grid grid-cols-3 gap-2 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">build.lib</div>
              <div className="text-slate-600 mt-1">es·cjs·umd</div>
              <div className="text-[9px] text-slate-500">멀티 포맷</div>
            </div>
            <div className="bg-white rounded p-2 border-2 border-indigo-400">
              <div className="text-indigo-700 font-bold">external</div>
              <div className="text-slate-600 mt-1">peerDeps 제외</div>
              <div className="text-[9px] text-slate-500">중복 방지</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">exports/dts</div>
              <div className="text-slate-600 mt-1">진입점·타입</div>
              <div className="text-[9px] text-slate-500">소비 완성</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">라이브러리 빌드 · 배포 흐름</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="출력 포맷" value={state.formats} unit="개" max={3} current={state.formats} tone={state.formats >= 3 ? 'good' : 'warn'} />
            <MetricCard label="번들 크기" value={state.bundleKb} unit="KB" max={60} current={state.bundleKb} tone={state.bundleKb >= 40 ? 'danger' : 'good'} />
            <MetricCard label="external 제외" value={state.externalCount} unit="개" max={3} current={state.externalCount} tone={state.externalCount >= 1 ? 'good' : 'warn'} />
            <MetricCard label="소비자 호환" value={state.consumerPct} unit="%" max={100} current={state.consumerPct} tone={state.consumerPct >= 90 ? 'good' : state.consumerPct >= 60 ? 'warn' : 'danger'} />
          </div>

          <div className="mt-3">
            <Scene scene={state.scene} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <div className="inline-flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full text-white" style={{background:'#3d40b5'}}>Part IV. SSR &amp; Library</span>
                  <span className="text-[10px] font-mono text-slate-500">IV-2-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>Library Mode · es/cjs/umd</h1>
                <p className="text-sm text-slate-700/80">npm 라이브러리를 Vite 로 빌드해 배포</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                build.lib(entry·name·formats)로 es/cjs/umd 를 동시에 뽑고, rollupOptions.external 로 peerDependencies 를 빼서 중복·훅 에러를 막는다. package.json 의 exports 맵으로 import/require 를 분기하고 dts 로 .d.ts 를 배포해야 소비자 IDE 자동완성까지 완성된다. 배포 전 publint / arethetypeswrong 로 점검하면 사고의 대부분을 미리 잡는다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['build.lib', 'es-cjs-umd', 'external', 'peerDependencies', 'exports-map', 'dts'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-end text-xs text-slate-700">
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
