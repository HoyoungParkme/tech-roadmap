      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">지표</th><th className="py-1 pr-2">SSR</th><th className="py-1 pr-2">SSG</th><th className="py-1">변화</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function Scene({ scene }) {
      if (scene === 'concept') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono space-y-1">
            <div className="text-slate-500">build time — 각 경로를 미리 렌더</div>
            <div className="flex items-center gap-2">
              <span className="px-2 py-0.5 rounded bg-indigo-100 text-indigo-700">routes</span>
              <span className="text-slate-400">→</span>
              <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-700">renderToString</span>
              <span className="text-slate-400">→</span>
              <span className="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700">.html 파일</span>
            </div>
            <div className="text-slate-600 pt-1">dist/index.html · dist/blog/vite/index.html · dist/about/index.html</div>
            <div className="text-indigo-700 pt-1">요청 시 서버 계산 0 → CDN 이 파일만 전송</div>
          </div>
        );
      }
      if (scene === 'compare') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono">
            <div className="grid grid-cols-2 gap-2">
              <div className="rounded border border-rose-200 bg-rose-50 p-2">
                <div className="text-rose-700 font-bold mb-1">SSR · 요청 시</div>
                <div className="text-slate-600">req → render → html</div>
                <div className="text-slate-600">매 요청 CPU</div>
                <div className="text-slate-600">서버 상시 가동</div>
                <div className="text-emerald-700 pt-1">항상 최신 ✓</div>
              </div>
              <div className="rounded border border-indigo-200 bg-indigo-50 p-2">
                <div className="text-indigo-700 font-bold mb-1">SSG · 빌드 시</div>
                <div className="text-slate-600">build → render 1회</div>
                <div className="text-slate-600">요청 CPU 0</div>
                <div className="text-slate-600">CDN 만</div>
                <div className="text-amber-700 pt-1">데이터 고정 ⚠</div>
              </div>
            </div>
          </div>
        );
      }
      if (scene === 'hydrate') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono space-y-1">
            <div className="text-slate-500">vite-ssg — 브라우저 2단계</div>
            <div className="flex items-center gap-2">
              <span className="w-16 text-slate-700">1. HTML</span>
              <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                <div className="h-full bg-emerald-500" style={{ width: '18%' }} />
              </div>
              <span className="text-emerald-700">즉시 표시</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-16 text-slate-700">2. JS</span>
              <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                <div className="h-full bg-amber-500" style={{ width: '100%' }} />
              </div>
              <span className="text-amber-700">148KB hydration</span>
            </div>
            <div className="text-indigo-700 pt-1">화면=즉시, 상호작용=JS 로드 후 (full hydration)</div>
          </div>
        );
      }
      if (scene === 'islands') {
        return (
          <div className="rounded-lg bg-gradient-to-r from-indigo-50 to-emerald-50 border border-indigo-300 p-3 text-[11px] font-mono">
            <div className="text-slate-500 mb-2">Astro — 정적 바다 위의 섬(hydration)만 JS</div>
            <div className="grid grid-cols-3 gap-1.5">
              <div className="rounded bg-white border border-slate-200 p-1.5 text-center text-slate-500">Header<div className="text-[9px]">0 JS</div></div>
              <div className="rounded bg-indigo-100 border-2 border-indigo-400 p-1.5 text-center text-indigo-800">SearchBox<div className="text-[9px]">client:load</div></div>
              <div className="rounded bg-white border border-slate-200 p-1.5 text-center text-slate-500">PostList<div className="text-[9px]">0 JS</div></div>
              <div className="rounded bg-white border border-slate-200 p-1.5 text-center text-slate-500">Article<div className="text-[9px]">0 JS</div></div>
              <div className="rounded bg-indigo-100 border-2 border-indigo-400 p-1.5 text-center text-indigo-800">Comments<div className="text-[9px]">client:visible</div></div>
              <div className="rounded bg-white border border-slate-200 p-1.5 text-center text-slate-500">Footer<div className="text-[9px]">0 JS</div></div>
            </div>
            <div className="text-emerald-700 pt-2">섬 2개만 hydration → 14KB (full 148KB 대비 −90%)</div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">렌더 전략 스펙트럼</div>
          <div className="grid grid-cols-4 gap-1.5 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">SSG</div>
              <div className="text-slate-600 mt-1">빌드 렌더</div>
              <div className="text-[9px] text-slate-500">문서·블로그</div>
            </div>
            <div className="bg-white rounded p-2 border-2 border-indigo-400">
              <div className="text-indigo-700 font-bold">Islands</div>
              <div className="text-slate-600 mt-1">부분 hydration</div>
              <div className="text-[9px] text-slate-500">정적+상호작용</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">SSR</div>
              <div className="text-slate-600 mt-1">요청 렌더</div>
              <div className="text-[9px] text-slate-500">신선도</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">ISR</div>
              <div className="text-slate-600 mt-1">증분 재생성</div>
              <div className="text-[9px] text-slate-500">대규모+신선</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">SSG 빌드 → 정적 HTML → hydration</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="빌드 렌더 페이지" value={state.buildPages} unit="개" max={10} current={state.buildPages} tone="good" />
            <MetricCard label="TTFB" value={state.ttfb} unit="ms" max={80} current={state.ttfb} tone={state.ttfb <= 20 ? 'good' : 'warn'} />
            <MetricCard label="전송 JS" value={state.jsShipped} unit="KB" max={160} current={state.jsShipped} tone={state.jsShipped === 0 ? 'good' : state.jsShipped <= 30 ? 'good' : 'warn'} />
            <MetricCard label="렌더 시점" value={state.renderWhen === 'build' ? '빌드' : '요청'} unit="" max={1} current={1} tone="good" />
          </div>

          <div className="mt-3">
            <Scene scene={state.scene} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{background:'#3d40b5'}}>Part IV. SSR &amp; Library</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-mono font-bold" style={{background:'#FFD028',color:'#3d40b5'}}>IV-1-2</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>SSG · vite-ssg / Astro 패턴</h1>
                <p className="text-sm text-slate-700/80">빌드 시 정적 HTML 생성으로 빠르고 안전하게</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                SSG 는 빌드 시 각 경로를 미리 렌더해 정적 HTML 로 배포한다. SSR(요청마다 렌더)과 달리 서버 없이 CDN 만으로 빠르고 안전하다. vite-ssg 는 Vue 앱 전체를 굽고, Astro Islands 는 기본 무JS 로 필요한 섬만 hydration 한다. 데이터가 빌드 시 확정되는 콘텐츠·문서에 최적이며, 동적 데이터·거대한 페이지 수·재빌드·hydration 비용이 함정이다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['SSG', 'vite-ssg', 'Astro', 'islands', 'hydration'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-1.html" className="underline hover:no-underline">다음: IV-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
