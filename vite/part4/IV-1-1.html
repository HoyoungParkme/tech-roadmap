  <!--
    Vite Chapter IV-1-1 — SSR · ssrLoadModule
    학습 목표: Vite 로 서버에서 HTML 을 렌더하고 브라우저에서 하이드레이션하는 SSR 흐름
              - 개발: middlewareMode + ssrLoadModule 로 entry-server 를 로드
              - 프로덕션: 빌드 2회(client / server), ssr.noExternal / external 설정
              - 실무 함정: window 접근, 하이드레이션 불일치, 상태 전달
    패턴: fastapi v1 — 좌(LiveDataPane: SSR 요청 흐름 애니메이션) / 우(VSCode CodeViewer)
    색상: #646CFF
  -->

    const STEPS = [
      {
        title: 'Step 1. 왜 SSR — 서버가 HTML 을 완성해서 보낸다',
        desc: 'CSR(SPA)은 브라우저가 빈 index.html + JS 번들을 받은 뒤 JS 가 실행돼야 화면이 그려진다. 검색 봇과 느린 기기에서는 이 공백이 SEO 손해와 FCP 지연으로 이어진다. SSR 은 서버에서 컴포넌트를 실제 HTML 문자열로 렌더해 곧바로 보이는 화면을 응답한다. 사용자는 JS 다운로드 전에 콘텐츠를 보고, 봇은 완성된 마크업을 크롤링한다.',

        code: {
          lang: 'javascript',

            '// CSR(SPA) 이 브라우저에 처음 보내는 HTML',

            '// => 이미 완성된 마크업 → 즉시 보이고, 봇도 읽는다',
            '',
            '// 언제 SSR 이 값어치를 하나',
            '// => SEO 가 중요한 페이지(커머스, 블로그, 랜딩)',
            '// => 첫 화면 속도가 매출/이탈에 직결되는 서비스',
            '// => 반대로 사내 대시보드는 CSR 로 충분한 경우가 많다',
          ],
          highlight: [1, 2, 3, 4, 7, 8, 9],
        },
      },
      {
        title: 'Step 2. entry-client / entry-server 분리와 하이드레이션',
        desc: 'SSR 앱은 진입점을 둘로 나눈다. entry-server 는 서버에서 renderToString 으로 HTML 문자열을 만들고, entry-client 는 브라우저에서 같은 컴포넌트 트리를 hydrateRoot 로 살려낸다. 서버가 보낸 정적 HTML 에 이벤트 리스너와 상태를 "덧씌우는" 과정이 하이드레이션이다. 두 진입점이 같은 App 을 공유해야 서버 마크업과 클라이언트 트리가 정확히 일치한다.',
        scene: 'split',
        stage: 'hydrate',
        ttfb: 40,
        fcp: 320,
        seo: 96,
        jsRequired: true,
        verdict: '2 entry',
        verdictTone: 'good',
        keyPoint: 'entry-server 는 renderToString, entry-client 는 hydrateRoot. 같은 App 을 공유해야 마크업이 일치한다.',
        code: {
          lang: 'javascript',
          filename: 'src/entry-server.js',
          lines: [
            '// src/App.jsx — 서버/클라 공용 컴포넌트',
            'export function App() {',
            '  return <h1>상품 목록</h1>;',
            '}',
            '',
            '// src/entry-server.js — 서버에서 HTML 문자열 생성',
            'import { renderToString } from "react-dom/server";',
            'import { App } from "./App";',
            'export function render() {',
            '  return renderToString(<App />);',
            '  // => "<h1>상품 목록</h1>" 문자열을 돌려준다',
            '}',
            '',
            '// src/entry-client.js — 브라우저에서 하이드레이션',
            'import { hydrateRoot } from "react-dom/client";',
            'import { App } from "./App";',
            'hydrateRoot(document.getElementById("app"), <App />);',
            '// => 서버 HTML 에 이벤트/상태를 덧씌운다(새로 그리지 않음)',
            '// => 서버와 클라 트리가 다르면 hydration mismatch 경고',
          ],
          highlight: [5, 6, 7, 8, 9, 10, 13, 14, 15, 16],
        },
      },
      {
        title: 'Step 3. 개발 SSR — middlewareMode + ssrLoadModule',
        desc: 'Vite 를 미들웨어 모드로 만들면 자체 HTTP 서버를 열지 않고 Express 같은 서버에 붙는다. 핵심은 ssrLoadModule 이다. 이 함수는 entry-server 를 매 요청마다 Node 에서 실행 가능한 형태로 변환·로드하는데, 브라우저가 아닌 서버용이라 사전 번들 없이 소스를 그대로 돌린다. 파일을 고치면 HMR 로 즉시 반영돼 빌드 없이 SSR 을 디버깅한다.',
        scene: 'dev',
        stage: 'ssrload',
        ttfb: 45,
        fcp: 300,
        seo: 96,
        jsRequired: true,
        verdict: 'no build',
        verdictTone: 'good',
        keyPoint: 'middlewareMode 로 Express 에 붙고, ssrLoadModule 이 entry-server 를 매 요청 변환·로드한다. 빌드 없이 HMR.',
        code: {
          lang: 'javascript',
          filename: 'server.js (dev)',
          lines: [
            '// npm i -D vite express',
            'import express from "express";',
            'import { createServer as createViteServer } from "vite";',
            '',
            'const app = express();',
            'const vite = await createViteServer({',
            '  server: { middlewareMode: true },',
            '  appType: "custom",',
            '});',
            'app.use(vite.middlewares); // Vite 미들웨어를 먼저 연결',
            '',
            'app.use("*", async (req, res) => {',
            '  const url = req.originalUrl;',
            '  // 1) index.html 을 읽고 HMR 스크립트를 주입',
            '  let template = fs.readFileSync("index.html", "utf-8");',
            '  template = await vite.transformIndexHtml(url, template);',
            '  // 2) entry-server 를 서버용으로 로드(핵심)',
            '  const mod = await vite.ssrLoadModule("/src/entry-server.js");',
            '  // 3) 실제 렌더 → HTML 문자열',
            '  const appHtml = mod.render(url);',
            '  // 4) 플레이스홀더 자리에 끼워 응답',
            '  const html = template.replace("<!--app-html-->", appHtml);',
            '  res.status(200).set({ "Content-Type": "text/html" }).end(html);',
            '});',
            'app.listen(5173);',
          ],
          highlight: [5, 6, 7, 8, 9, 16, 17, 18, 19, 20, 21],
        },
      },
      {
        title: 'Step 4. 프로덕션 SSR — 빌드 2회와 external 설정',
        desc: '프로덕션은 dev 처럼 소스를 변환하지 않는다. 클라이언트 번들(브라우저 하이드레이션용)과 서버 번들(--ssr, Node 실행용)을 각각 빌드한다. Node 는 node_modules 를 직접 require 할 수 있으므로 SSR 빌드는 의존성을 external 로 두어 번들에서 뺀다. 단 CSS 를 import 하거나 ESM 전용 패키지는 ssr.noExternal 로 강제 인라인해야 서버에서 깨지지 않는다.',
        scene: 'prod',
        stage: 'build',
        ttfb: 30,
        fcp: 260,
        seo: 98,
        jsRequired: true,
        verdict: '2 build',
        verdictTone: 'good',
        keyPoint: '클라 빌드 + 서버 빌드(--ssr). deps 는 external, CSS·ESM 전용은 ssr.noExternal 로 인라인.',
        code: {
          lang: 'javascript',
          filename: 'build & vite.config.js',
          lines: [
            '# package.json scripts — 빌드 2회',
            '# vite build                       => dist/client (브라우저용)',
            '# vite build --ssr src/entry-server.js  => dist/server (Node용)',
            '',
            '// vite.config.js',
            'import { defineConfig } from "vite";',
            'export default defineConfig({',
            '  ssr: {',
            '    // Node 가 직접 require 가능 → 번들에서 제외(external)',
            '    external: ["node-fetch"],',
            '    // 서버에서 인라인해야 하는 것들:',
            '    // CSS 를 import 하거나 ESM 전용/빌드 필요한 패키지',

            '',
            '// server.prod.js — 변환 없이 빌드 결과만 사용',

            'const appHtml = render(url);',

          highlight: [0, 1, 2, 7, 8, 9, 10, 11, 12, 13, 17, 18, 19],
        },
      },
      {
        title: 'Step 5. 실무 함정 — window·mismatch·상태 전달',
        desc: '서버에는 window·document·localStorage 가 없다. 모듈 최상단에서 이를 만지면 SSR 이 즉시 터지므로 useEffect 안이나 typeof window 가드로 미룬다. 서버 HTML 과 클라 첫 렌더가 다르면 hydration mismatch 가 나므로, 서버 데이터를 window.__DATA__ 로 함께 실어 보내 클라가 같은 상태로 시작하게 한다. 실제로는 SvelteKit·Nuxt 가 이 배선을 대신 감싸준다.',
        scene: 'summary',
        stage: 'ship',
        ttfb: 30,
        fcp: 260,
        seo: 98,
        jsRequired: true,
        verdict: '함정 회피',
        verdictTone: 'good',
        summary: {
          title: 'SSR 실무 함정 체크리스트',
          rows: [
            { metric: 'window/document', before: '모듈 최상단 접근', after: 'useEffect·typeof 가드', delta: '✓' },
            { metric: '하이드레이션', before: '서버≠클라 마크업', after: '같은 App·같은 상태', delta: '✓' },
            { metric: '초기 상태 전달', before: '클라가 재요청', after: 'window.__DATA__ 주입', delta: '✓' },
            { metric: '외부 의존', before: '서버서 import 에러', after: 'external/noExternal', delta: '✓' },

          ],
        },
        keyPoint: '서버엔 window 없음 → 가드. 상태는 window.__DATA__ 로 전달. 배선은 SvelteKit·Nuxt 가 감싸준다.',
        code: {
          lang: 'javascript',
          filename: 'ssr-pitfalls.js',
          lines: [
            '// 함정 1) 서버엔 window 가 없다',
            '// const w = window.innerWidth;  // => SSR 즉시 crash',
            'function useWidth() {',
            '  const [w, setW] = useState(0);',
            '  useEffect(() => { setW(window.innerWidth); }, []);',
            '  return w; // => 브라우저에서만 실행돼 안전',
            '}',
            '',
            '// 함정 2) 상태 전달 — 서버 데이터를 HTML 에 실어 보낸다',
            '// entry-server: 렌더하며 초기 데이터 직렬화',
            'const data = await fetchProducts();',
            'const state = `<script>window.__DATA__=${JSON.stringify(data)}<\/script>`;',
            'const html = renderToString(<App data={data} />) + state;',
            '// entry-client: 서버와 같은 데이터로 시작 → mismatch 없음',
            'hydrateRoot(el, <App data={window.__DATA__} />);',
            '',
            '// 함정 3) 대부분은 직접 안 짠다',
            '// => SvelteKit / Nuxt 가 위 배선을 프레임워크로 감싼다',
            '// => 원리를 알면 프레임워크 에러 메시지가 읽힌다',

          highlight: [0, 1, 2, 3, 4, 5, 8, 9, 10, 11, 12, 13, 14],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-indigo-50',  border: 'border-indigo-300', text: 'text-indigo-800', badge: 'bg-indigo-200 text-indigo-800', bar: 'bg-indigo-500' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-800',  badge: 'bg-amber-200 text-amber-800',  bar: 'bg-amber-500' },
      danger: { bg: 'bg-rose-50',    border: 'border-rose-400',   text: 'text-rose-800',   badge: 'bg-rose-200 text-rose-800',    bar: 'bg-rose-500' },
    };

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70 ml-0.5">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📋 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">지표</th><th className="py-1 pr-2">Before</th><th className="py-1 pr-2">After</th><th className="py-1">결과</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    // SSR 요청 흐름 파이프라인 — 현재 stage 를 하이라이트
    function FlowPipe({ stage }) {
      const nodes = [
        { key: 'request', label: '브라우저 요청', sub: 'GET /products' },
        { key: 'server', label: 'Node 서버', sub: 'express + vite' },
        { key: 'ssrload', label: 'ssrLoadModule', sub: 'entry-server 로드' },
        { key: 'build', label: 'render()', sub: 'HTML 문자열' },
        { key: 'hydrate', label: '하이드레이션', sub: 'hydrateRoot' },
        { key: 'ship', label: '상호작용 완료', sub: 'interactive' },
      ];
      const activeIdx = Math.max(0, nodes.findIndex((n) => n.key === stage));
      return (
        <div className="rounded-lg bg-white border border-indigo-300 p-3">
          <div className="text-[10px] text-slate-500 mb-2 font-mono">SSR request flow</div>
          <div className="space-y-1">
            {nodes.map((n, i) => {
              const isActive = i === activeIdx;
              const isDone = i < activeIdx;
              return (
                <div key={n.key} className="flex items-center gap-2">
                  <span className={`w-5 h-5 shrink-0 rounded-full text-[10px] font-bold flex items-center justify-center ${isActive ? 'bg-indigo-600 text-white' : isDone ? 'bg-indigo-200 text-indigo-800' : 'bg-slate-100 text-slate-400'}`}>{i + 1}</span>
                  <div className={`flex-1 rounded px-2 py-1 border text-[11px] transition ${isActive ? 'border-indigo-500 bg-indigo-50' : isDone ? 'border-indigo-200 bg-white' : 'border-slate-200 bg-slate-50'}`}>
                    <span className={`font-semibold ${isActive ? 'text-indigo-800' : isDone ? 'text-indigo-700' : 'text-slate-400'}`}>{n.label}</span>
                    <span className={`ml-2 font-mono text-[10px] ${isActive ? 'text-indigo-500' : 'text-slate-400'}`}>{n.sub}</span>
                  </div>
                  {isActive && <span className="text-indigo-600 text-xs animate-pulse">◀</span>}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function Scene({ state }) {
      const scene = state.scene;
      if (scene === 'why') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3">
            <div className="grid grid-cols-2 gap-2 text-[11px]">
              <div className="rounded border border-rose-300 bg-rose-50 p-2">
                <div className="font-bold text-rose-700 mb-1">CSR (SPA)</div>
                <div className="font-mono text-[10px] text-rose-700 bg-white rounded p-1 border border-rose-200">div id=app · 빈 껍데기</div>
                <div className="text-rose-600 mt-1">JS 실행 전 흰 화면 · 봇은 콘텐츠 0</div>
              </div>
              <div className="rounded border border-indigo-300 bg-indigo-50 p-2">
                <div className="font-bold text-indigo-700 mb-1">SSR</div>
                <div className="font-mono text-[10px] text-indigo-700 bg-white rounded p-1 border border-indigo-200">h1 상품 목록 /h1 · 완성</div>
                <div className="text-indigo-600 mt-1">즉시 보임 · 봇이 마크업 크롤링</div>
              </div>
            </div>
            <div className="text-[10px] text-indigo-700 mt-2 font-mono">서버가 완성 HTML 을 보내면 SEO·FCP 동시 확보</div>
          </div>
        );
      }
      if (scene === 'split') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px]">
            <div className="text-[10px] text-slate-500 mb-2 font-mono">공용 App 을 두 진입점이 공유</div>
            <div className="flex items-center justify-center gap-2">
              <div className="rounded border border-indigo-300 bg-indigo-50 px-2 py-1 text-center">
                <div className="font-bold text-indigo-700">entry-server</div>
                <div className="font-mono text-[10px] text-slate-600">renderToString</div>
              </div>
              <span className="text-indigo-400 font-bold">App</span>
              <div className="rounded border border-emerald-300 bg-emerald-50 px-2 py-1 text-center">
                <div className="font-bold text-emerald-700">entry-client</div>
                <div className="font-mono text-[10px] text-slate-600">hydrateRoot</div>
              </div>
            </div>
            <div className="mt-2 rounded bg-slate-50 border border-slate-200 p-2 font-mono text-[10px] text-slate-600">
              서버 HTML(정적) + JS(이벤트) = 하이드레이션 완료
            </div>
          </div>
        );
      }
      if (scene === 'dev') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono space-y-1">
            <div className="text-slate-500">dev: middlewareMode</div>
            <div className="flex items-center gap-1"><span className="text-indigo-700">1.</span> express + vite.middlewares</div>
            <div className="flex items-center gap-1"><span className="text-indigo-700">2.</span> transformIndexHtml(url)</div>
            <div className="flex items-center gap-1 bg-indigo-50 rounded px-1"><span className="text-indigo-700">3.</span> ssrLoadModule('/src/entry-server.js')</div>
            <div className="flex items-center gap-1"><span className="text-indigo-700">4.</span> mod.render(url) → appHtml</div>
            <div className="text-emerald-700 pt-1">→ 빌드 없이 HMR 로 SSR 디버깅</div>
          </div>
        );
      }
      if (scene === 'prod') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px]">
            <div className="text-[10px] text-slate-500 mb-2 font-mono">production: 빌드 2회</div>
            <div className="grid grid-cols-2 gap-2 font-mono">
              <div className="rounded border border-emerald-300 bg-emerald-50 p-2">
                <div className="font-bold text-emerald-700">vite build</div>
                <div className="text-[10px] text-slate-600">→ dist/client</div>
                <div className="text-[10px] text-slate-500">브라우저 하이드레이션</div>
              </div>
              <div className="rounded border border-indigo-300 bg-indigo-50 p-2">
                <div className="font-bold text-indigo-700">vite build --ssr</div>
                <div className="text-[10px] text-slate-600">→ dist/server</div>
                <div className="text-[10px] text-slate-500">Node render()</div>
              </div>
            </div>
            <div className="mt-2 flex gap-2 text-[10px] font-mono">
              <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-600">external: deps 제외</span>
              <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-700">noExternal: CSS·ESM 인라인</span>
            </div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">SSR 조립 = 서버 렌더 + 클라 하이드레이션</div>
          <div className="grid grid-cols-3 gap-2 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">서버</div>
              <div className="text-slate-600 mt-1">renderToString</div>
              <div className="text-[9px] text-slate-500">완성 HTML</div>
            </div>
            <div className="bg-white rounded p-2 border-2 border-indigo-400">
              <div className="text-indigo-700 font-bold">전달</div>
              <div className="text-slate-600 mt-1">window.__DATA__</div>
              <div className="text-[9px] text-slate-500">초기 상태</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">클라</div>
              <div className="text-slate-600 mt-1">hydrateRoot</div>
              <div className="text-[9px] text-slate-500">이벤트 부착</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">SSR 요청 흐름 시뮬레이션</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="TTFB" value={state.ttfb} unit="ms" max={80} current={state.ttfb} tone="good" />
            <MetricCard label="FCP" value={state.fcp} unit="ms" max={400} current={state.fcp} tone={state.fcp >= 350 ? 'warn' : 'good'} />
            <MetricCard label="SEO 점수" value={state.seo} unit="점" max={100} current={state.seo} tone="good" />
            <MetricCard label="JS 필요" value={state.jsRequired ? 'hydrate' : '불필요'} unit="" max={100} current={state.jsRequired ? 60 : 100} tone={state.jsRequired ? 'warn' : 'good'} />
          </div>

          <div className="mt-3">
            <FlowPipe stage={state.stage} />
          </div>

          <div className="mt-3">
            <Scene state={state} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <div className="text-[11px] font-bold tracking-wide" style={{color:'#3d40b5'}}>Part IV. SSR &amp; Library · IV-1-1</div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>SSR · ssrLoadModule</h1>
                <p className="text-sm text-slate-700/80">서버에서 렌더하는 Vite 앱, 개발/프로덕션 SSR</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                SSR 은 서버가 renderToString 으로 완성 HTML 을 만들고 브라우저가 hydrateRoot 로 살려낸다. dev 는 middlewareMode + ssrLoadModule 로 빌드 없이, prod 는 클라·서버 빌드 2회로 돌린다. window 가드·window.__DATA__ 상태 전달·external/noExternal 을 챙기면 되고, 실무에선 SvelteKit·Nuxt 가 이 배선을 감싸준다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['SSR', 'ssrLoadModule', 'hydration', 'middlewareMode', 'noExternal'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-end text-xs text-slate-700">
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
