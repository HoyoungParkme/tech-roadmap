    const TONE = {
      good:   { bg: 'bg-indigo-50',  border: 'border-indigo-300', text: 'text-indigo-800', badge: 'bg-indigo-200 text-indigo-800', bar: 'bg-indigo-500' },
      warn:   { bg: 'bg-amber-50',   border: 'border-amber-400',  text: 'text-amber-800',  badge: 'bg-amber-200 text-amber-800',  bar: 'bg-amber-500' },
      danger: { bg: 'bg-rose-50',    border: 'border-rose-400',   text: 'text-rose-800',   badge: 'bg-rose-200 text-rose-800',    bar: 'bg-rose-500' },
    };

    const MAP_ROWS = [
      { wp: 'entry', vt: 'index.html (script module)', hint: '진입점 = html' },
      { wp: 'loader', vt: '내장 · @vitejs/plugin-*', hint: 'esbuild 내장' },
      { wp: 'resolve.alias', vt: 'resolve.alias', hint: '거의 동일' },
      { wp: 'DefinePlugin', vt: 'define', hint: '상수 주입' },
      { wp: 'process.env.X', vt: 'import.meta.env.VITE_X', hint: 'VITE_ 접두' },
      { wp: 'require()', vt: 'import / 사전번들', hint: 'CJS 상호운용' },
      { wp: 'require.context', vt: 'import.meta.glob', hint: '다중 import' },
      { wp: 'HtmlWebpackPlugin', vt: '실제 index.html', hint: '템플릿 불필요' },
    ];

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70 ml-0.5">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">webpack</th><th className="py-1 pr-2">Vite</th><th className="py-1"> </th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold text-center">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function MappingBoard({ activeCount }) {
      return (
        <div className="rounded-lg bg-white border border-indigo-300 p-3">
          <div className="grid grid-cols-11 gap-1 text-[9px] text-slate-400 font-mono mb-1">
            <div className="col-span-5">webpack.config</div>
            <div className="col-span-1 text-center">→</div>
            <div className="col-span-5">vite.config</div>
          </div>
          <div className="space-y-1">
            {MAP_ROWS.map((r, i) => {
              const moved = i < activeCount;
              return (
                <div key={i} className="grid grid-cols-11 gap-1 items-center text-[10px] font-mono">
                  <div className={`col-span-5 rounded px-1.5 py-1 border transition ${moved ? 'bg-slate-100 border-slate-200 text-slate-400 line-through' : 'bg-rose-50 border-rose-300 text-rose-700'}`}>{r.wp}</div>
                  <div className={`col-span-1 text-center transition ${moved ? 'text-indigo-600' : 'text-slate-300'}`}>→</div>
                  <div className={`col-span-5 rounded px-1.5 py-1 border transition ${moved ? 'bg-indigo-50 border-indigo-300 text-indigo-800 font-bold' : 'bg-slate-50 border-slate-200 text-slate-400'}`}>{r.vt}</div>
                </div>
              );
            })}
          </div>
          <div className="text-[10px] text-indigo-700 mt-2 font-mono">이전 완료 {activeCount} / {MAP_ROWS.length} 항목</div>
        </div>
      );
    }

    function Scene({ scene, state }) {
      if (scene === 'why') {
        return (
          <div className="rounded-lg bg-gradient-to-r from-rose-50 to-indigo-50 border border-indigo-300 p-3">
            <div className="text-[10px] text-slate-500 mb-2 font-mono">dev 콜드 스타트 (모듈 3000개)</div>
            <div className="space-y-1 text-[11px] font-mono">
              <div className="flex items-center gap-2">
                <span className="w-16 text-slate-700">webpack</span>
                <div className="flex-1 bg-white rounded h-3 overflow-hidden border border-rose-200">
                  <div className="h-full bg-rose-400" style={{ width: '100%' }} />
                </div>
                <span className="w-14 text-right text-rose-700">42s</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-16 text-slate-700">Vite</span>
                <div className="flex-1 bg-white rounded h-3 overflow-hidden border border-emerald-200">
                  <div className="h-full bg-emerald-500" style={{ width: '2%' }} />
                </div>
                <span className="w-14 text-right text-emerald-700">0.4s</span>
              </div>
            </div>
            <div className="text-[10px] text-indigo-700 mt-2 font-mono">HMR: 3~6s → 40ms · 팀 피드백 루프 단축이 목적</div>
          </div>
        );
      }
      if (scene === 'mapping') {
        return <MappingBoard activeCount={state.mappedCount} />;
      }
      if (scene === 'esm') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[10px] font-mono space-y-2">
            <div className="text-slate-500">소스 코드 변환 (CJS → ESM)</div>
            <div className="grid grid-cols-2 gap-2">
              <div className="rounded border border-rose-300 bg-rose-50 p-2 text-rose-700 space-y-0.5">
                <div className="text-[9px] text-rose-400">Before (webpack)</div>
                <div>require("lodash")</div>
                <div>module.exports = …</div>
                <div>__dirname</div>
                <div>process.env.X</div>
              </div>
              <div className="rounded border border-indigo-300 bg-indigo-50 p-2 text-indigo-800 space-y-0.5">
                <div className="text-[9px] text-indigo-400">After (Vite)</div>
                <div>import lodash</div>
                <div>export …</div>
                <div>import.meta.url</div>
                <div>import.meta.env.VITE_X</div>
              </div>
            </div>
            <div className="text-[10px] text-emerald-700">서드파티 CJS 는 사전 번들이 상호운용 → 내 소스만 ESM 이면 OK</div>
          </div>
        );
      }
      if (scene === 'pitfall') {
        return (
          <div className="rounded-lg bg-white border border-amber-300 p-3 text-[10px] font-mono space-y-1.5">
            <div className="text-slate-500">자주 걸리는 3대 함정</div>
            <div className="flex items-start gap-2"><span className="text-amber-600 font-bold">1</span><span className="text-slate-700">글로벌 SCSS 주입 → css.preprocessorOptions.scss.additionalData</span></div>
            <div className="flex items-start gap-2"><span className="text-amber-600 font-bold">2</span><span className="text-slate-700">이미지 import → 경로 문자열 반환 · 다수는 import.meta.glob</span></div>
            <div className="flex items-start gap-2"><span className="text-amber-600 font-bold">3</span><span className="text-slate-700">환경변수 → VITE_ 접두만 클라이언트 노출 (그 외 undefined)</span></div>
            <div className="text-[10px] text-indigo-700 pt-1">이 셋만 미리 알면 마이그레이션 시간의 대부분을 아낀다</div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">안전한 마이그레이션 순서</div>
          <div className="flex flex-wrap items-center gap-1 text-[9px] font-mono">
            {['설정 매핑', '소스 ESM화', '함정 3곳', 'dev 검증', 'prod 빌드'].map((s, i, a) => (
              <React.Fragment key={i}>
                <span className="bg-white rounded px-2 py-1 border border-indigo-300 text-indigo-800 font-bold">{s}</span>
                {i < a.length - 1 && <span className="text-indigo-400">→</span>}
              </React.Fragment>
            ))}
          </div>
          <div className="text-[10px] text-slate-600 mt-2 font-mono">런타임 에러의 대부분 = process.env 직접 접근 · CJS 상호운용</div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">webpack → Vite 이전 현황</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="매핑 이전 항목" value={state.mappedCount} unit="개" max={8} current={state.mappedCount} tone={state.mappedCount >= 8 ? 'good' : state.mappedCount > 0 ? 'warn' : 'danger'} />
            <MetricCard label="ESM 전환 소스" value={state.cjsCount} unit="종" max={3} current={state.cjsCount} tone={state.cjsCount >= 3 ? 'good' : 'warn'} />
            <MetricCard label="dev 부팅 (webpack)" value={state.bootBefore} unit="s" max={42} current={state.bootBefore} tone="danger" />
            <MetricCard label="dev 부팅 (Vite)" value={state.bootAfter} unit="s" max={42} current={state.bootAfter} tone="good" />
          </div>

          <div className="mt-3">
            <Scene scene={state.scene} state={state} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] font-bold text-white px-2 py-0.5 rounded" style={{background:'#3d40b5'}}>Part V. 실전 운영</span>
                  <span className="text-[10px] font-mono text-slate-500">V-2-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>Webpack → Vite 마이그레이션</h1>
                <p className="text-sm text-slate-700/80">기존 webpack 프로젝트를 Vite 로 옮기는 실전 절차</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                옮기는 이유는 dev 부팅·HMR 피드백 루프 단축이다. 설정은 entry→html · loader→내장 · alias→resolve.alias · DefinePlugin→define · env→import.meta.env(VITE_) 로 매핑한다. 소스는 ESM 으로 통일하고(require→import, __dirname→import.meta.url), 함정 3곳(글로벌 SCSS·이미지 import·VITE_ 접두)을 처리한 뒤 dev 검증 → 프로덕션 빌드 순으로 옮긴다. 런타임 에러는 대부분 process.env 직접 접근과 CJS 상호운용에서 나온다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['migration', 'vite.config', 'CJS-to-ESM', 'import.meta.env', 'import.meta.glob'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-end text-xs text-slate-700">
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
