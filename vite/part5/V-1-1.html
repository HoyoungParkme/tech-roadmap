  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });

    function MetricCard({ label, value, unit, max, current, tone }) {
      const t = TONE[tone] || TONE.warn;
      const pct = Math.min(100, (current / max) * 100);
      return (
        <div className={`rounded-lg border ${t.bg} ${t.border} px-3 py-2`}>
          <div className="flex justify-between items-baseline mb-1">
            <span className={`text-xs ${t.text}`}>{label}</span>
            <span className={`text-lg font-mono font-bold ${t.text}`}>
              {value}<span className="text-xs opacity-70 ml-0.5">{unit}</span>
            </span>
          </div>
          <div className="h-1.5 bg-white/60 rounded overflow-hidden">
            <div className={`h-full ${t.bar}`} style={{ width: `${pct}%` }} />
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-indigo-400 bg-white p-3">
          <div className="text-sm font-bold text-indigo-900 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">지표</th><th className="py-1 pr-2">Before</th><th className="py-1 pr-2">After</th><th className="py-1">변화</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-800">{r.metric}</td>
                  <td className="py-1 pr-2 text-rose-700 font-mono">{r.before}</td>
                  <td className="py-1 pr-2 text-emerald-700 font-mono">{r.after}</td>
                  <td className="py-1 text-indigo-700 font-bold">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function Scene({ scene }) {
      if (scene === 'problem') {
        return (
          <div className="rounded-lg bg-white border border-rose-300 p-3 font-mono text-[10px]">
            <div className="text-slate-500 mb-1">dev server network — without optimizeDeps</div>
            <div className="space-y-0.5 text-rose-700">
              <div>GET /node_modules/lodash-es/lodash.js</div>
              <div>GET /node_modules/lodash-es/debounce.js</div>
              <div>GET /node_modules/lodash-es/throttle.js</div>
              <div>GET /node_modules/lodash-es/_setToString.js</div>
              <div className="text-rose-500">… 600+ more requests</div>
              <div className="text-rose-800 font-bold pt-1">⚠ 640 requests · CJS modules error</div>
            </div>
          </div>
        );
      }
      if (scene === 'config') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3 text-[11px] font-mono space-y-1">
            <div className="text-slate-500">optimizeDeps 스캔 → 사전 번들</div>
            <div className="flex items-center gap-1"><span className="text-emerald-600">include</span> lodash-es, date-fns → 미리 묶음</div>
            <div className="flex items-center gap-1"><span className="text-amber-600">exclude</span> linked-pkg → 사전 번들 스킵</div>
            <div className="flex items-center gap-1"><span className="text-indigo-700">scan</span> import 트리 자동 탐색</div>
            <div className="text-emerald-700 pt-1">→ deps optimized in 260ms · 요청 8 회</div>
          </div>
        );
      }
      if (scene === 'cache') {
        return (
          <div className="rounded-lg bg-gradient-to-r from-indigo-50 to-emerald-50 border border-indigo-300 p-3">
            <div className="text-[10px] text-slate-500 mb-2 font-mono">node_modules/.vite 캐시 재사용</div>
            <div className="space-y-1 text-[11px] font-mono">
              <div className="flex items-center gap-2">
                <span className="w-20 text-slate-700">cold start</span>
                <div className="flex-1 bg-white rounded h-3 overflow-hidden border border-amber-200">
                  <div className="h-full bg-amber-400" style={{ width: '100%' }} />
                </div>
                <span className="w-16 text-right text-amber-700">260ms</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-20 text-slate-700">warm start</span>
                <div className="flex-1 bg-white rounded h-3 overflow-hidden border border-emerald-200">
                  <div className="h-full bg-emerald-500" style={{ width: '15%' }} />
                </div>
                <span className="w-16 text-right text-emerald-700">40ms</span>
              </div>
            </div>
            <div className="text-[10px] text-indigo-700 mt-2 font-mono">cache hit 100% → 사전 번들 skipped</div>
          </div>
        );
      }
      if (scene === 'build') {
        return (
          <div className="rounded-lg bg-white border border-indigo-300 p-3">
            <div className="text-[10px] text-slate-500 mb-1 font-mono">빌드 청크 구성 (manualChunks)</div>
            <div className="space-y-1 text-[11px] font-mono">
              {[
                { name: 'vendor-react', kb: 142, w: 100, c: 'bg-indigo-500' },
                { name: 'vendor-utils', kb: 68, w: 48, c: 'bg-indigo-400' },
                { name: 'app', kb: 34, w: 24, c: 'bg-emerald-500' },
              ].map((b, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="w-24 text-slate-700">{b.name}</span>
                  <div className="flex-1 bg-slate-100 rounded h-3 overflow-hidden">
                    <div className={`h-full ${b.c}`} style={{ width: `${b.w}%` }} />
                  </div>
                  <span className="w-14 text-right text-slate-600">{b.kb}KB</span>
                </div>
              ))}
            </div>
            <div className="text-[10px] text-indigo-700 mt-1 font-mono">vendor 분리 → 재배포에도 캐시 유지</div>
          </div>
        );
      }
      // summary
      return (
        <div className="rounded-lg bg-gradient-to-br from-indigo-50 to-violet-100 border-2 border-indigo-400 p-3">
          <div className="text-[10px] text-indigo-700 font-mono mb-2">3 축 최적화</div>
          <div className="grid grid-cols-3 gap-2 text-[10px] text-center">
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">개발</div>
              <div className="text-slate-600 mt-1">optimizeDeps</div>
              <div className="text-[9px] text-slate-500">요청 폭증 방지</div>
            </div>
            <div className="bg-white rounded p-2 border-2 border-indigo-400">
              <div className="text-indigo-700 font-bold">빌드</div>
              <div className="text-slate-600 mt-1">vendor 분리</div>
              <div className="text-[9px] text-slate-500">캐시 유지</div>
            </div>
            <div className="bg-white rounded p-2">
              <div className="text-indigo-700 font-bold">로딩</div>
              <div className="text-slate-600 mt-1">modulepreload</div>
              <div className="text-[9px] text-slate-500">워터폴 제거</div>
            </div>
          </div>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      return (
        <div className="rounded-xl border border-indigo-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-indigo-900">pre-bundle / vendor 최적화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <div className="grid grid-cols-2 gap-2">
            <MetricCard label="개발 서버 요청" value={state.depRequests} unit="회" max={700} current={state.depRequests} tone={state.depRequests >= 100 ? 'danger' : 'good'} />
            <MetricCard label="사전 번들 시간" value={state.prebundleTime} unit="ms" max={300} current={state.prebundleTime} tone={state.prebundleTime >= 200 ? 'warn' : 'good'} />
            <MetricCard label="vendor 청크" value={state.vendorKB} unit="KB" max={200} current={state.vendorKB} tone="warn" />
            <MetricCard label="cache hit" value={state.cacheHit} unit="%" max={100} current={state.cacheHit} tone={state.cacheHit >= 80 ? 'good' : state.cacheHit >= 30 ? 'warn' : 'danger'} />
          </div>

          <div className="mt-3">
            <Scene scene={state.scene} />
          </div>

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-indigo-900 bg-indigo-50 border border-indigo-200 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-900 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-indigo-500/20 border-l-2 border-indigo-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-900 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-50 to-violet-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold text-xl" style={{background:'linear-gradient(135deg,#646CFF,#FFD028)'}}>⚡</span>
              <div>
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{background:'#3d40b5'}}>Part V. 실전 운영</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-mono font-bold" style={{background:'#FFD028',color:'#3d40b5'}}>V-1-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{color:'#646CFF'}}>성능 최적화 · pre-bundle / vendor</h1>
                <p className="text-sm text-slate-700/80">개발·빌드 속도를 끌어올리는 최적화</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition`} style={{background: i <= stepIdx ? '#646CFF' : '#e2e8f0'}} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{background:'linear-gradient(135deg,#646CFF,#3d40b5)'}}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-indigo-100/90 leading-relaxed">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-label="자동 재생 시작/정지" aria-pressed={playing} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{background: playing ? '#3d40b5' : '#646CFF'}}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-indigo-300 bg-white text-indigo-800 hover:bg-indigo-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-indigo-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1" style={{color:'#646CFF'}}>✅ 핵심 정리</div>
                개발은 optimizeDeps 사전 번들로 요청 폭증을 막고, node_modules/.vite 캐시로 웜 스타트를 만든다. 빌드는 manualChunks 로 vendor 를 분리해 재배포에도 브라우저 캐시를 살리고, modulepreload 로 초기 로딩 워터폴을 없앤다. 함정은 optimizeDeps 미스·캐시 무효화·큰 벤더·불필요한 의존성 네 가지다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['optimizeDeps', 'pre-bundle', 'vendor', 'manualChunks', 'modulepreload'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
