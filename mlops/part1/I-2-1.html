    @media (min-width: 768px) {

  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    I-2-1. ML 라이프사이클 6단계
    학습 목표: ML 사이클(수집→전처리→학습→평가→배포→모니터링)을 시각적 노드 그래프로 이해
    핵심 비유: 식물 키우기 — 씨앗(수집) → 흙 다지기(전처리) → 자라기(학습) → 수확(평가) → 출하(배포) → 관찰(모니터링) → 다시 씨앗
    패턴: fastapi v1 패턴 — 좌(LiveDataPane: 6 노드 파이프라인 그래프) / 우(VSCode CodeViewer)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─────────────────────────────────────────────────────
    // 6 노드 파이프라인 메타 (고정)
    // ─────────────────────────────────────────────────────
    const PIPELINE = [
      { key: 'collect',  emoji: '📥', name: 'Collect',  sub: '씨앗 모으기' },
      { key: 'prepare',  emoji: '🧹', name: 'Prepare',  sub: '흙 다지기' },
      { key: 'train',    emoji: '🎓', name: 'Train',    sub: '자라기' },
      { key: 'eval',     emoji: '🔍', name: 'Eval',     sub: '수확 검사' },
      { key: 'deploy',   emoji: '🚀', name: 'Deploy',   sub: '출하' },
      { key: 'monitor',  emoji: '📡', name: 'Monitor',  sub: '관찰 → 다시 씨앗' },
    ];

    // ─────────────────────────────────────────────────────
    // STEPS — 4 카테고리 진행
    //  Step1: collect/prepare 활성
    //  Step2: train/eval 활성
    //  Step3: deploy/monitor 활성
    //  Step4: loop — monitor → collect 다시 (사이클)
    // ─────────────────────────────────────────────────────
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const STEPS = [
      {
        title: 'Step 1. Collect → Prepare — "씨앗 모으기 + 흙 다지기"',
        desc: '사이클의 시작. DB / 외부 API / 이벤트 로그에서 raw 데이터를 모으고 라벨을 단다(DVC로 sha 추적). 결측·이상치를 정리하고 Feature Store에 등록 — 학습/서빙 동일 정의로 "training-serving skew" 사고를 막는다.',
        active: ['collect', 'prepare'],
        done:   [],
        focus:  'prepare',
        loop:   false,
        code: {
          lang: 'python',
          filename: 'pipeline/01_collect_prepare.py',
          lines: [
            '# Step 1. 데이터 수집 + 전처리 + Feature Store 등록',
            'import pandas as pd',
            'from sklearn.preprocessing import StandardScaler',
            'from feast import FeatureStore',
            '',
            '# 1) 수집 — DB + 외부 API + 라벨 (DVC로 sha 추적)',
            '#    $ dvc add data/raw/  →  data/raw.dvc  hash: 7c9d4b8f...',
            'df = pd.read_csv("data/raw/tx_2026_04.csv")',
            'labels = pd.read_csv("data/raw/labels.csv")',
            '',
            '# 2) 결측치 / 이상치 처리',
            'df = df[df["amount"] > 0]                       # 음수 금액 제거',
            'df["device"] = df["device"].fillna("unknown")    # 범주형 결측',
            '',
            '# 3) Feature engineering (도메인 지식)',
            'df["hour"]       = pd.to_datetime(df["created_at"]).dt.hour',
            'df["amount_log"] = (df["amount"] + 1).apply("log")',
            'df["is_night"]   = df["hour"].between(0, 5).astype(int)',
            '',
            '# 4) 스케일링 + Feature Store 등록 (학습/서빙 동일 정의)',
            'scaler = StandardScaler()',
            'df[["amount_log", "hour"]] = scaler.fit_transform(df[["amount_log", "hour"]])',
            '',
            'fs = FeatureStore(repo_path="feature_repo/")',
            'fs.apply([fraud_feature_view])',
            'fs.materialize_incremental(end_date=pd.Timestamp.now())',
          ],
          highlight: [6, 12, 13, 23, 24],
        },
      },
      {
        title: 'Step 2. Train → Eval — "자라기 + 수확 검사"',
        desc: 'sklearn / xgboost로 모델을 fit하고 시간 기반 cross-validation + holdout으로 평가. holdout은 마지막에 단 한 번만 사용 — 반복 사용 시 누수. MLflow로 파라미터 / 메트릭 / 아티팩트 자동 기록.',
        active: ['train', 'eval'],
        done:   ['collect', 'prepare'],
        focus:  'eval',
        loop:   false,
        code: {
          lang: 'python',
          filename: 'pipeline/02_train_eval.py',
          lines: [
            '# Step 2. 모델 학습 + Holdout 평가 (MLflow 추적)',
            'import mlflow',
            'from sklearn.ensemble import GradientBoostingClassifier',
            'from sklearn.model_selection import TimeSeriesSplit, cross_val_score',
            'from sklearn.metrics import roc_auc_score',
            '',
            'X_train, y_train     = load_features(period="2026-01..2026-03")',
            'X_holdout, y_holdout = load_features(period="2026-04")  # 시간 기반 split',
            '',
            'with mlflow.start_run(run_name="fraud-2026-04"):',
            '    mlflow.log_params({"max_depth": 5, "n_estimators": 200})',
            '    model = GradientBoostingClassifier(max_depth=5, n_estimators=200)',
            '',
            '    # 1) Cross-validation (시간 순서 유지)',
            '    cv = TimeSeriesSplit(n_splits=5)',
            '    cv_scores = cross_val_score(model, X_train, y_train, cv=cv, scoring="roc_auc")',
            '    mlflow.log_metric("cv_auc_mean", cv_scores.mean())',
            '',
            '    # 2) 최종 학습 + Holdout 평가 — 단 한 번만!',
            '    model.fit(X_train, y_train)',
            '    y_pred = model.predict_proba(X_holdout)[:, 1]',
            '    holdout_auc = roc_auc_score(y_holdout, y_pred)',
            '    mlflow.log_metric("holdout_auc", holdout_auc)',
            '    mlflow.sklearn.log_model(model, "model")',
            '',
            '# CV AUC: 0.913 ± 0.012 / Holdout AUC: 0.907 → 일관됨, 통과',
          ],
          highlight: [15, 16, 19, 20, 21],
        },
      },
      {
        title: 'Step 3. Deploy → Monitor — "출하 + 관찰"',
        desc: '평가 통과 모델을 Registry에 Production으로 등록 → 서빙. 운영 코드는 alias만 참조(버전 하드코딩 금지). Prometheus로 latency / error / accuracy를 실시간 추적, drift 감지 시 알람.',
        active: ['deploy', 'monitor'],
        done:   ['collect', 'prepare', 'train', 'eval'],
        focus:  'monitor',
        loop:   false,
        code: {
          lang: 'python',
          filename: 'pipeline/03_deploy_monitor.py',
          lines: [
            '# Step 3. Registry 등록 + 서빙 + 모니터링',
            'import mlflow',
            'from mlflow import MlflowClient',
            'from prometheus_client import Counter, Histogram',
            '',
            '# 1) Registry 등록 + Production stage 전환',
            'client = MlflowClient()',
            'mv = mlflow.register_model("runs:/abc123/model", "fraud-detector")',
            'client.transition_model_version_stage(',
            '    name="fraud-detector", version=mv.version,',
            '    stage="Production", archive_existing_versions=True,',
            ')',
            '',
            '# 2) 운영 — alias만 참조 (버전 하드코딩 금지)',
            'model = mlflow.pyfunc.load_model("models:/fraud-detector/Production")',
            '',
            '# 3) 추론 + 메트릭 수집 (Prometheus)',
            'predictions = Counter("ml_predictions_total", "Total", ["model"])',
            'latency     = Histogram("ml_latency_seconds", "Latency", ["model"])',
            '',
            '@app.post("/predict")',
            'def predict(payload: dict):',
            '    start = time.time()',
            '    score = model.predict([payload])[0]',
            '    predictions.labels(model="fraud").inc()',
            '    latency.labels(model="fraud").observe(time.time() - start)',
            '    return {"fraud_score": float(score)}',
          ],
          highlight: [9, 10, 11, 14, 15, 24, 25],
        },
      },
      {
        title: 'Step 4. Loop — "다시 씨앗" (사이클은 끊임없이 돈다)',
        desc: 'Monitor가 drift를 감지하면 Airflow DAG으로 재학습 자동 트리거 — Monitor → Collect로 화살표가 다시 이어진다. 일반 SW는 "출시 = 끝", ML은 "출시 = 새 사이클의 시작". 6단계 무한 루프가 MLOps의 본질.',
        active: ['monitor', 'collect'],
        done:   ['collect', 'prepare', 'train', 'eval', 'deploy', 'monitor'],
        focus:  'loop',
        loop:   true,
        code: {
          lang: 'python',
          filename: 'pipeline/04_drift_retrain.py',
          lines: [
            '# Step 4. Drift 감지 → 재학습 자동 트리거 (Monitor → Collect 루프)',
            'from evidently.metrics import DataDriftPreset',
            'from evidently.report import Report',
            'from airflow_client import trigger_dag',
            '',
            '# 1) 입력 분포 변화(drift) 자동 감지',
            'report = Report(metrics=[DataDriftPreset()])',
            'report.run(reference_data=X_train_ref, current_data=X_recent_prod)',
            '',
            'if report.as_dict()["metrics"][0]["result"]["dataset_drift"]:',
            '    # 2) 재학습 DAG 자동 실행 — Collect 단계로 다시!',
            '    trigger_dag("retrain_fraud_model")',
            '    notify_slack("#ml-ops", "drift detected -> retrain triggered")',
            '',
            '# ─────────────────────────────────────────────',
            '#   Collect → Prepare → Train → Eval → Deploy → Monitor',
            '#      ▲                                            │',
            '#      └────────  drift / 신규 데이터  ──────────────┘',
            '# ─────────────────────────────────────────────',
            '',
            '# 핵심 — 일반 SW vs ML',
            '#   일반 SW: 출시 = 끝',
            '#   ML    : 출시 = 새 사이클의 시작 (무한 루프)',
            '',
            '# 그래서 "MLOps"는 코드/모델/데이터 3축을 동시에 운영하는 학문',
          ],
          highlight: [10, 11, 12, 13, 17, 18, 22, 23],
        },
      },
    ];

    // ─────────────────────────────────────────────────────
    // 노드 상태별 스타일 (정적 Tailwind — purge 안전)
    // ─────────────────────────────────────────────────────
    const NODE_STYLE = {
      idle:   { box: 'bg-slate-50 border-slate-300',           text: 'text-slate-500',     ring: '' },
      done:   { box: 'bg-emerald-50 border-emerald-400',       text: 'text-emerald-700',   ring: '' },
      active: { box: 'bg-fuchsia-100 border-fuchsia-500',      text: 'text-fuchsia-800',   ring: 'ring-4 ring-fuchsia-300 scale-105' },
    };

    function nodeState(key, step) {
      if (step.active.includes(key)) return 'active';
      if (step.done.includes(key))   return 'done';
      return 'idle';
    }

    // ─────────────────────────────────────────────────────
    // LiveDataPane — 6 노드 파이프라인 그래프 (3x2 grid + 화살표)
    // ─────────────────────────────────────────────────────
    function LiveDataPane({ beat, step }) {
      return (
        <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="flex items-center justify-between mb-4">
            <h2 className="text-sm font-bold text-slate-700">🌱 ML 라이프사이클 파이프라인</h2>
            <span className="text-[10px] text-slate-400 font-mono">6 stages · cyclic</span>
          </div>

          {/* 3 x 2 노드 그리드 */}
          <div className="grid grid-cols-3 gap-x-2 gap-y-3">
            {PIPELINE.map((node, i) => {
              const state = nodeState(node.key, step);
              const style = NODE_STYLE[state];
              const isActive = state === 'active';
              const isDone   = state === 'done';
              return (
                <div key={node.key} className="relative">
                  <div
                    className={`rounded-lg border-2 p-3 text-center transition-all duration-500 ${style.box} ${style.ring}`}
                  >
                    <div className="flex items-center justify-center gap-1">
                      <span className="text-xl" aria-hidden="true">{node.emoji}</span>
                      {isDone && (
                        <span className="text-emerald-600 font-bold text-xs" aria-label="완료">✓</span>
                      )}
                    </div>
                    <div className={`text-xs font-bold mt-1 ${style.text}`}>{node.name}</div>
                    <div className={`text-[10px] mt-0.5 ${style.text} opacity-75`}>{node.sub}</div>
                    <div className="text-[9px] font-mono mt-1 text-slate-400">stage {i + 1}</div>
                  </div>

                  {/* 가로 화살표 — 같은 행의 다음 노드로 (i=0,1,3,4) */}
                  {i % 3 !== 2 && (
                    <div
                      className="absolute top-1/2 -translate-y-1/2 right-[-12px] z-10 text-slate-400 text-lg font-bold"
                      aria-hidden="true"
                    >
                      →
                    </div>
                  )}

                  {/* 행 끝(i=2)에서 다음 행으로 내려가는 ↓ 화살표 */}
                  {i === 2 && (
                    <div
                      className="absolute -bottom-3 right-2 text-slate-400 text-sm font-bold"
                      aria-hidden="true"
                    >
                      ↓
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* 루프 화살표 — Step 4에서 강조 (Monitor → Collect) */}
          <div className={`mt-4 rounded-lg border-2 border-dashed p-3 transition-all duration-500 ${step.loop ? 'border-fuchsia-500 bg-fuchsia-50' : 'border-slate-200 bg-slate-50'}`}>
            <div className={`flex items-center justify-center gap-2 text-xs font-mono ${step.loop ? 'text-fuchsia-800 font-bold' : 'text-slate-500'}`}>
              <span>📡 Monitor</span>
              <span className={`${step.loop ? 'animate-pulse' : ''} text-base`}>↺</span>
              <span>📥 Collect</span>
              <span className="ml-2 text-[10px]">— drift / 신규 데이터로 다시 사이클 시작</span>
            </div>
          </div>

          {/* 범례 */}
          <div className="flex flex-wrap gap-3 text-[10px] mt-4 pt-3 border-t border-slate-100 text-slate-500">
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded bg-slate-200 border border-slate-300"></span>대기
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded bg-fuchsia-300 border border-fuchsia-500"></span>진행 중
            </span>
            <span className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded bg-emerald-300 border border-emerald-400"></span>완료 ✓
            </span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // VSCode 스타일 CodeViewer — highlight.js
    // ─────────────────────────────────────────────────────
    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [renderedLines, setRenderedLines] = useState(null);

      useEffect(() => {
        if (!codeRef.current || !window.hljs) return;
        codeRef.current.removeAttribute('data-highlighted');
        codeRef.current.className = `language-${code.lang}`;
        codeRef.current.textContent = code.lines.join('\n');
        window.hljs.highlightElement(codeRef.current);
        setRenderedLines(codeRef.current.innerHTML.split('\n'));
      }, [code]);

      return (
        <div className="bg-[#282c34] rounded-xl overflow-hidden border border-slate-700 shadow-lg">
          {/* 윈도우 dot + 파일 탭 */}
          <div className="bg-[#21252b] px-4 py-2 flex items-center gap-2 border-b border-slate-700">
            <div className="flex gap-1.5">
              <span className="w-3 h-3 rounded-full bg-red-500"></span>
              <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
              <span className="w-3 h-3 rounded-full bg-green-500"></span>
            </div>
            <span className="text-xs text-slate-400 ml-2 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-500 font-mono uppercase">{code.lang}</span>
          </div>

          {/* hljs 토큰화용 hidden code (innerHTML 추출) */}
          <pre className="hidden">
            <code ref={codeRef} className={`language-${code.lang}`}>{code.lines.join('\n')}</code>
          </pre>

          {/* 실제 렌더링 — 라인 번호 + 강조 라인 */}
          <div className="overflow-auto max-h-[28rem] text-xs font-mono leading-5">
            <pre className="p-0 m-0">
              <code className="block">
                {(renderedLines || code.lines).map((lineHtml, i) => {
                  const highlighted = code.highlight && code.highlight.includes(i + 1);
                  return (
                    <div
                      key={i}
                      data-hi={highlighted ? "1" : "0"}
                      className={`flex hover:bg-slate-800/50 ${highlighted ? 'bg-fuchsia-500/10 border-l-2 border-fuchsia-400' : ''}`}
                    >
                      <span className="select-none text-slate-500 text-right pr-3 pl-3 border-r border-slate-700 w-12 flex-shrink-0">
                        {i + 1}
                      </span>
                      <span
                        className="pl-3 pr-3 whitespace-pre text-slate-200 flex-1"
                        dangerouslySetInnerHTML={{ __html: lineHtml || ' ' }}
                      />
                    </div>
                  );
                })}
              </code>
            </pre>
          </div>

          {/* 푸터 — 단계 번호 */}
          <div className="bg-[#21252b] px-4 py-1.5 text-[10px] text-slate-500 font-mono flex justify-between border-t border-slate-700">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────
    // App 메인
    // ─────────────────────────────────────────────────────
    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const intervalRef = useRef(null);
      const nextRef = useRef(null);
      const prevRef = useRef(null);

      const step = STEPS[stepIdx];

      const handleNext = () => {
        setStepIdx((i) => {
          if (i >= STEPS.length - 1) {
            setIsPlaying(false);
            return i;
          }
          return i + 1;
        });
      };
      const handlePrev = () => setStepIdx((i) => Math.max(0, i - 1));
      nextRef.current = handleNext;
      prevRef.current = handlePrev;

      const togglePlay = () => {
        if (stepIdx >= STEPS.length - 1) setStepIdx(0);
        setIsPlaying((p) => !p);
      };

      const handleReset = () => {
        setStepIdx(0);
        setIsPlaying(false);
      };

      useEffect(() => {
        if (!isPlaying) return;
        intervalRef.current = setInterval(() => nextRef.current(), 3000);
        return () => clearInterval(intervalRef.current);
      }, [isPlaying]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') { e.preventDefault(); nextRef.current(); }
          if (e.key === 'ArrowLeft')  { e.preventDefault(); prevRef.current(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      return (
        <div className="min-h-screen bg-slate-50 font-sans p-4 md:p-6 text-slate-800">
          <div className="max-w-6xl mx-auto space-y-5">

            {/* 상단 네비 */}
            <nav className="flex items-center justify-between text-sm">
              <a href="../index.html" className="text-fuchsia-700 hover:text-fuchsia-900 font-medium">&larr; 허브로</a>
              <span className="font-mono bg-slate-100 px-2 py-1 rounded border border-slate-200 text-xs">curriculum I-2-1</span>
            </nav>

            {/* 헤더 */}
            <header className="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-9 h-9 bg-fuchsia-600 text-white flex items-center justify-center rounded-full font-bold text-sm">I</div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Part I. MLOps 개론 &gt; Chapter 2. ML 워크플로</div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">ML 라이프사이클 6단계</h1>
                  <p className="text-sm text-slate-500 mt-0.5">식물 키우기 사이클 — 수집 → 전처리 → 학습 → 평가 → 배포 → 모니터링 (그리고 다시 수집)</p>
                </div>
              </div>
            </header>

            {/* 좌/우 2-pane */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <LiveDataPane beat={step.beat} step={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            {/* 마지막 단계 alert */}
            {stepIdx === STEPS.length - 1 && (
              <div className="bg-fuchsia-50 border-2 border-fuchsia-300 rounded-xl p-3 text-sm text-fuchsia-900">
                💡 다음(I-2-2)에서는 <strong>성숙도 모델 Level 0~2</strong>
              </div>
            )}

            {/* 설명 패널 */}
            <div className="p-4 rounded-xl bg-fuchsia-700 text-white shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <h3 className="text-xs font-bold uppercase tracking-wider text-fuchsia-200">
                  세부 {stepIdx + 1} / {STEPS.length} · {step.title}
                </h3>
                <span className="text-xs text-fuchsia-200">키보드 &larr;/&rarr;</span>
              </div>
              <p className="text-sm leading-relaxed">{step.desc}</p>
            </div>

            {/* 컨트롤 4 버튼 */}
            <div className="flex items-center justify-center gap-3">
              <button
                onClick={handleReset}
                disabled={stepIdx === 0 && !isPlaying}
                aria-label="처음으로"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                처음
              </button>
              <button
                onClick={handlePrev}
                disabled={stepIdx === 0}
                aria-label="이전 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                &larr; 이전
              </button>
              <button
                onClick={togglePlay}
                aria-pressed={isPlaying}
                aria-label={isPlaying ? '자동 재생 정지' : '자동 재생 시작'}
                className="px-4 py-1.5 rounded-lg text-sm font-bold bg-fuchsia-600 text-white hover:bg-fuchsia-700 transition min-w-[100px]"
              >
                {isPlaying ? '⏸ 정지' : (stepIdx >= STEPS.length - 1 ? '↻ 다시보기' : '▶ 자동재생')}
              </button>
              <button
                onClick={handleNext}
                disabled={stepIdx >= STEPS.length - 1}
                aria-label="다음 단계"
                className="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-200 text-slate-700 hover:bg-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition"
              >
                다음 &rarr;
              </button>
            </div>

            {/* 이전/다음 자료 네비 */}
            <nav className="flex justify-between text-sm pt-2">
              <a href="../index.html" className="text-slate-500 hover:text-slate-700">&larr; 허브</a>
              <a href="./I-2-2.html" className="text-fuchsia-700 hover:text-fuchsia-900 font-medium">I-2-2 성숙도 모델 Level 0~2 &rarr;</a>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
