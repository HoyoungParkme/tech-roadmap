<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArgoCD 인터랙티브 학습</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🐙</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" data-presets="env,react"></script>
  <style>
    html, body, #root { height: 100%; margin: 0; }
  </style>
  <!-- 필기노트 공통 스킨(hub) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-image:none !important; background-color:#fffdf7 !important; font-family:Pretendard, system-ui, sans-serif; }
    #root > div { background-image:none !important; background-color:#fffdf7 !important; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color:#faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color:#2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color:#57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color:#8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color:#cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow:3px 3px 0 rgba(0,0,0,.12) !important; }
    .rounded-xl, .rounded-2xl { border-radius:8px !important; }
    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color:#faf7ef !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!--
    ─────────────────────────────────────────────────────────────
    ArgoCD 인터랙티브 학습 허브 (index.html)
    ─────────────────────────────────────────────────────────────
    구조: 좌측 사이드바(전체 목차) + 우측 iframe(현재 자료)
    브랜드 컬러: ArgoCD orange-red (#EF7B4D) 통일
    5 Parts: I 기초 / II sync / III App of Apps / IV 보안 / V 실전
    ─────────────────────────────────────────────────────────────
  -->
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const ARGOCD_ORANGE = '#EF7B4D';

    // ─────────────────────────────────────────────────────
    // 전체 목차 — 5 Parts, 각 Part 4개 섹션
    //   현재 Part I, II 만 실제 viz 가 채워져 있음
    //   III, IV, V 는 stub 페이지로 연결됨
    // ─────────────────────────────────────────────────────
    const SECTIONS = [
      {
        part: 'I', label: 'Part I. 기초 — GitOps / Application / source / destination',
        color: '#EF7B4D', ready: true,
        items: [
          { id: 'I-1-1', title: 'GitOps — Git이 소스 오브 트루스', file: './part1/I-1-1.html' },
          { id: 'I-1-2', title: 'Application — 핵심 리소스', file: './part1/I-1-2.html' },
          { id: 'I-2-1', title: 'source — repo·path·targetRevision', file: './part1/I-2-1.html' },
          { id: 'I-2-2', title: 'destination + 동기화 상태', file: './part1/I-2-2.html' },
        ],
      },
      {
        part: 'II', label: 'Part II. sync 전략 — manual·auto·wave·option',
        color: '#EF7B4D', ready: true,
        items: [
          { id: 'II-1-1', title: 'manual sync — 수동 동기화', file: './part2/II-1-1.html' },
          { id: 'II-1-2', title: 'auto sync — prune·selfHeal', file: './part2/II-1-2.html' },
          { id: 'II-2-1', title: 'sync wave — 배포 순서 제어', file: './part2/II-2-1.html' },
          { id: 'II-2-2', title: 'sync option — 세부 동기화 옵션', file: './part2/II-2-2.html' },
        ],
      },
      {
        part: 'III', label: 'Part III. App of Apps + Project — 다중 환경·멀티 테넌시',
        color: '#EF7B4D', ready: true,
        items: [
          { id: 'III-1-1', title: 'App of Apps 패턴', file: './part3/III-1-1.html' },
          { id: 'III-1-2', title: 'ApplicationSet', file: './part3/III-1-2.html' },
          { id: 'III-2-1', title: 'AppProject — 프로젝트 격리', file: './part3/III-2-1.html' },
          { id: 'III-2-2', title: 'multi-tenancy — 멀티 테넌시', file: './part3/III-2-2.html' },
        ],
      },
      {
        part: 'IV', label: 'Part IV. 보안 — RBAC·SSO·Dex·Secret',
        color: '#EF7B4D', ready: true,
        items: [
          { id: 'IV-1-1', title: 'RBAC — 접근 제어', file: './part4/IV-1-1.html' },
          { id: 'IV-1-2', title: 'SSO / Dex — 통합 로그인', file: './part4/IV-1-2.html' },
          { id: 'IV-2-1', title: 'Sealed Secrets — 시크릿을 Git에', file: './part4/IV-2-1.html' },
          { id: 'IV-2-2', title: '보안 강화 — 감사·네트워크·이미지', file: './part4/IV-2-2.html' },
        ],
      },
      {
        part: 'V', label: 'Part V. 실전 — Progressive Delivery·Canary·Rollout·Notifications',
        color: '#EF7B4D', ready: true,
        items: [
          { id: 'V-1-1', title: 'Argo Rollouts — Progressive Delivery', file: './part5/V-1-1.html' },
          { id: 'V-1-2', title: 'Canary vs Blue-Green', file: './part5/V-1-2.html' },
          { id: 'V-2-1', title: 'AnalysisTemplate — 자동 검증·롤백', file: './part5/V-2-1.html' },
          { id: 'V-2-2', title: 'Notifications + 종합 운영', file: './part5/V-2-2.html' },
        ],
      },
    ];

    // ─────────────────────────────────────────────────────
    // 헬퍼 — id 로 item 찾기
    // ─────────────────────────────────────────────────────
    function findItemById(id) {
      for (const section of SECTIONS) {
        const found = section.items.find((item) => item.id === id);
        if (found) return { ...found, partLabel: section.label, ready: section.ready };
      }
      return null;
    }

    function App() {
      // 첫 로딩 시 Part I 자동 선택
      const [currentId, setCurrentId] = useState('I');
      const [sidebarOpen, setSidebarOpen] = useState(true);

      const current = findItemById(currentId);

      // 좌측 목차 클릭 → 우측 iframe 교체
      const handleSelect = useCallback((id) => {
        setCurrentId(id);
      }, []);

      return (
        <div className="flex h-screen bg-slate-50 font-sans">
          {/* 좌측 사이드바 */}
          <aside
            className={`bg-white border-r border-slate-200 flex flex-col transition-all duration-300 ${
              sidebarOpen ? 'w-80' : 'w-0'
            } overflow-hidden`}
          >
            {/* 헤더 */}
            <div className="p-4 border-b border-slate-200 flex items-center gap-2">
              <div
                className="w-9 h-9 rounded-full text-white flex items-center justify-center font-bold text-sm"
                style={{ background: ARGOCD_ORANGE }}
              >
                A
              </div>
              <div>
                <div className="font-bold text-sm text-slate-800">ArgoCD 학습</div>
                <div className="text-[10px] text-slate-500 font-mono">GitOps · Kubernetes</div>
              </div>
            </div>

            {/* 목차 트리 */}
            <nav className="flex-1 overflow-y-auto p-2">
              {SECTIONS.map((section) => (
                <div key={section.part} className="mb-2">
                  <div
                    className="px-2 py-1.5 text-[11px] font-bold text-slate-700 uppercase tracking-wider"
                    style={{ color: section.ready ? section.color : '#94a3b8' }}
                  >
                    {section.label}
                  </div>
                  {section.items.map((item) => {
                    const active = item.id === currentId;
                    const disabled = !section.ready;
                    return (
                      <button
                        key={item.id}
                        onClick={() => !disabled && handleSelect(item.id)}
                        disabled={disabled}
                        className={`block w-full text-left px-3 py-2 rounded-md text-xs transition mb-0.5 ${
                          active
                            ? 'text-white font-semibold'
                            : disabled
                            ? 'text-slate-400 cursor-not-allowed'
                            : 'text-slate-600 hover:bg-orange-50'
                        }`}
                        style={active ? { background: ARGOCD_ORANGE } : {}}
                      >
                        {item.title}
                        {disabled && <span className="ml-1 text-[9px] opacity-60">[준비중]</span>}
                      </button>
                    );
                  })}
                </div>
              ))}
            </nav>

            {/* 푸터 */}
            <div className="p-3 border-t border-slate-200 text-[10px] text-slate-400 font-mono">
              v0.1 · 5 Parts · Part I / II 가용
            </div>
          </aside>

          {/* 우측 컨텐츠 영역 */}
          <main className="flex-1 flex flex-col overflow-hidden">
            {/* 상단 바 */}
            <div className="bg-white border-b border-slate-200 px-4 py-2 flex items-center gap-3">
              <button
                onClick={() => setSidebarOpen((o) => !o)}
                aria-label="사이드바 토글"
                className="px-2 py-1 rounded hover:bg-slate-100 text-slate-600"
              >
                {sidebarOpen ? '◀' : '▶'}
              </button>
              <div className="flex-1">
                <div className="text-[10px] text-slate-500 font-mono">{current?.partLabel}</div>
                <div className="text-sm font-bold text-slate-800">{current?.title}</div>
              </div>
              <a
                href={current?.file}
                target="_blank"
                rel="noreferrer"
                className="text-xs text-orange-700 hover:underline font-medium"
              >
                새 창 열기 ↗
              </a>
            </div>

            {/* iframe */}
            <div className="flex-1 bg-slate-100">
              {current?.ready ? (
                <iframe
                  key={current.file}
                  src={current.file}
                  title={current.title}
                  className="w-full h-full border-0"
                />
              ) : (
                <div className="flex items-center justify-center h-full text-center px-8">
                  <div className="max-w-md">
                    <div
                      className="w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center text-white text-2xl font-bold"
                      style={{ background: ARGOCD_ORANGE }}
                    >
                      {current?.id}
                    </div>
                    <h2 className="text-xl font-bold text-slate-800 mb-2">{current?.title}</h2>
                    <p className="text-sm text-slate-500 leading-relaxed">
                      이 자료는 다음 sprint 에서 추가됩니다. 현재는 Part I (기초) 와 Part II (sync 전략) 가 가용합니다.
                    </p>
                    <a
                      href="./curriculum.md"
                      className="inline-block mt-4 px-4 py-2 rounded-lg text-sm font-medium text-white"
                      style={{ background: ARGOCD_ORANGE }}
                    >
                      커리큘럼 보기
                    </a>
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
