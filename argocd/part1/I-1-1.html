            '# ── 1) 감사(Audit): 배포 이력이 곧 커밋 로그 ──',
            'git log --oneline -5 k8s/deployment.yaml',
            '# a1b2c3d feat: image web:v1.1 배포 (신규 결제 UI)',
            '# 9f8e7d6 feat: replicas 3 -> 5 (트래픽 증가)',
            '# 3c2b1a0 fix: 헬스체크 경로 수정',
            '#   → 누가/언제/왜 배포했는지 별도 대시보드 없이 확인',
            '',
            '# ── 2) 롤백(Rollback): git revert 한 줄 ──',
            '# v1.1 배포 후 결제 오류 발견 → 즉시 되돌리기',
            'git revert --no-edit a1b2c3d',
            'git push origin main',
            '#   → ArgoCD가 새 커밋(=v1.0 복귀)을 감지',
            '#   → 클러스터를 v1.0 으로 자동 동기화',
            '#   → "이전 배포로 롤백"이 코드 리뷰 가능한 이벤트가 된다',
            '',
            '# ArgoCD 자체 롤백 명령도 가능 (히스토리 기반)',
            'argocd app history web',
            'argocd app rollback web 42        # 42번 리비전으로 되돌림',
            '',
            '# ── 3) 리뷰(Review): 배포를 PR로 승인 ──',
            '# 매니페스트 변경 = PR → 동료 승인 → merge → 배포',
            '#   운영 배포에 4개 눈(four-eyes) 원칙을 그대로 적용',
            '',
            '# ── 4) 재현(Reproducibility): 특정 시점 재구성 ──',
            'git checkout 3c2b1a0 -- k8s/       # 그 시점 매니페스트로',
            '#   → 동일 클러스터 상태를 언제든 재현 (DR/스테이징 복제)',
            '',
            '# ── ArgoCD의 역할 한 줄 요약 ───────────────',
            '# "Git(원하는 상태) 과 클러스터(실제 상태) 사이를',
            '#  끊임없이 비교·조정하는 컨트롤러"',
          ],
          highlight: [4, 5, 11, 13, 14, 15, 16, 17, 23, 24, 25, 28, 32, 33, 34],
        },
      },
      {
        title: 'Step 6. 실무 함정 — 드리프트·평문 시크릿·조정 주기·접근 권한',
        desc: 'GitOps를 도입할 때 자주 밟는 지뢰가 있다. 첫째, Git에 없는 수동 변경(드리프트)은 selfHeal로 막되 예외 상황을 팀 규칙으로 정한다. 둘째, 시크릿을 평문 YAML로 Git에 넣으면 저장소가 곧 유출 경로가 된다 — Sealed Secrets, SOPS, External Secrets로 암호화한다. 셋째, 조정 주기가 길면 반영이 늦으니 Git 웹훅으로 즉시 트리거한다. 넷째, ArgoCD가 클러스터에 붙는 권한 범위를 AppProject로 최소화한다. 이 넷을 초기에 잡으면 운영이 편해진다.',
        kind: 'pitfall',
        stage: 'diff',
        git: [
          { key: 'secret', val: '평문 금지!' },
          { key: '웹훅', val: '즉시 동기화' },
        ],
        cluster: [
          { key: '암호화', val: 'SOPS/Sealed', drift: false },
          { key: '권한', val: 'AppProject 제한', drift: false },
        ],
        syncStatus: 'OutOfSync',
        alert: { tone: 'danger', text: '평문 시크릿을 Git에 넣지 마라. 저장소가 곧 유출 경로가 된다.' },
        code: {
          lang: 'yaml',
          filename: 'pitfalls.md',
          lines: [
            '# GitOps 실무 함정 4가지와 대응',
            '',
            '## 함정 1 — 드리프트(Git에 없는 수동 변경)',
            '# 증상: kubectl edit 으로 임시 변경 → Git과 어긋남 → 방치',
            '# 대응: selfHeal: true 로 자동 원복. 진짜 변경은 커밋으로만.',
            'spec:',
            '  syncPolicy:',
            '    automated: { selfHeal: true, prune: true }',
            '',
            '## 함정 2 — 시크릿을 평문으로 Git에 커밋 (가장 위험)',
            '# 증상: Secret 의 data 를 base64로만 넣음 → 사실상 평문 노출',
            '# 대응 A) Sealed Secrets — 공개키로 암호화해 커밋, 클러스터서 복호',
            'apiVersion: bitnami.com/v1alpha1',
            'kind: SealedSecret          # 암호문만 Git에 올라간다',
            'spec:',
            '  encryptedData:',
            '    db-password: AgBy3i4OJ...암호문...',
            '# 대응 B) SOPS + age/KMS, 또는 External Secrets Operator',
            '#   (실제 값은 Vault/AWS Secrets Manager 에 두고 참조만 Git에)',
            '',
            '## 함정 3 — 조정 주기가 느려 반영이 늦다',
            '# 증상: 기본 폴링 약 3분 → 급한 핫픽스가 늦게 반영',
            '# 대응: Git 웹훅으로 push 즉시 sync 트리거',
            '#   GitHub → Settings → Webhooks → https://argocd.acme.com/api/webhook',
            'apiVersion: v1',
            'kind: Secret',
            'metadata:',
            '  name: argocd-webhook',
            '  namespace: argocd',
            'stringData:',
            '  webhook.github.secret: my-shared-secret   # 웹훅 검증용',
            '',
            '## 함정 4 — 클러스터 접근 권한이 과도',
            '# 증상: 하나의 ArgoCD가 모든 ns/클러스터에 admin 급 권한',
            '# 대응: AppProject 로 배포 대상(리포/ns/리소스)을 화이트리스트',
            'apiVersion: argoproj.io/v1alpha1',
            'kind: AppProject',
            'metadata:',
            '  name: team-web',
            '  namespace: argocd',
            'spec:',
            '  sourceRepos: ["https://github.com/acme/web-gitops.git"]',
            '  destinations:',
            '    - server: https://kubernetes.default.svc',
            '      namespace: web            # web ns 로만 배포 허용',
            '',
            '## 정리 — 초기에 잡을 4가지',
            '# selfHeal(드리프트) · 시크릿 암호화 · 웹훅(속도) · AppProject(권한)',
          ],
          highlight: [3, 4, 5, 8, 10, 11, 12, 13, 14, 21, 22, 23, 33, 34, 35, 38, 44, 45, 48, 49],
        },
      },
    ];

    const KIND_BADGE = {
      principle: { label: '원칙', color: '#F59E0B' },
      compare:   { label: 'push vs pull', color: '#0EA5E9' },
      loop:      { label: '조정 루프', color: '#EF7B4D' },
      drift:     { label: '드리프트', color: '#DC2626' },
      benefit:   { label: '이득', color: '#10B981' },
      pitfall:   { label: '함정', color: '#B91C1C' },
    };

    const SYNC_STYLE = {
      Synced:    { bg: '#DCFCE7', border: '#22C55E', text: '#166534', icon: '✅' },
      OutOfSync: { bg: '#FEF3C7', border: '#F59E0B', text: '#92400E', icon: '⚠️' },
      Syncing:   { bg: '#FFEDD5', border: '#EF7B4D', text: '#9A3412', icon: '🔄' },
    };

    // GitOps 조정 루프: OBSERVE → DIFF → ACT (해당 단계 강조)
    const LOOP_NODES = [
      { key: 'git',  label: 'Git\n(원하는 상태)' },
      { key: 'diff', label: 'ArgoCD DIFF\n(비교)' },
      { key: 'act',  label: '클러스터\n(실제 상태)' },
    ];

    function LoopDiagram({ stage }) {
      return (
        <div className="flex items-center justify-between gap-1">
          {LOOP_NODES.map((n, i) => {
            const active = n.key === stage;
            return (
              <React.Fragment key={n.key}>
                <div className="flex-1 rounded-lg border-2 px-2 py-2 text-center transition"
                     style={{
                       borderColor: active ? '#EF7B4D' : '#FED7AA',
                       backgroundColor: active ? '#FEE4D9' : '#FFF7ED',
                       color: '#9A3412',
                       boxShadow: active ? '0 0 0 2px rgba(239,123,77,0.35)' : 'none',
                     }}>
                    {n.label.split('\n').map((t, k) => (
                      <div key={k} className={k === 0 ? 'text-xs font-bold' : 'text-[10px] opacity-80'}>{t}</div>
                    ))}
                </div>
                {i < LOOP_NODES.length - 1 && (
                  <span className="text-lg" style={{ color: '#EF7B4D' }}>→</span>
                )}
              </React.Fragment>
            );
          })}
        </div>
      );
    }

    function DiffTable({ git, cluster }) {
      const rows = Math.max(git.length, cluster.length);
      return (
        <div className="mt-3 rounded-lg border overflow-hidden" style={{ borderColor: '#FED7AA' }}>
          <div className="grid grid-cols-2 text-[11px] font-bold" style={{ backgroundColor: '#FFF7ED', color: '#9A3412' }}>
            <div className="px-3 py-1.5 border-r" style={{ borderColor: '#FED7AA' }}>🐙 Git — 원하는 상태</div>
            <div className="px-3 py-1.5">☸️ 클러스터 — 실제 상태</div>
          </div>
          {Array.from({ length: rows }).map((_, i) => {
            const g = git[i];
            const c = cluster[i];
            return (
              <div key={i} className="grid grid-cols-2 text-[11px] border-t" style={{ borderColor: '#FDE9DC' }}>
                <div className="px-3 py-1.5 border-r font-mono" style={{ borderColor: '#FED7AA', color: '#374151' }}>
                  {g ? `${g.key}: ${g.val}` : ''}
                </div>
                <div className="px-3 py-1.5 font-mono"
                     style={{ color: c && c.drift ? '#B91C1C' : '#166534', backgroundColor: c && c.drift ? '#FEF2F2' : 'transparent' }}>
                  {c ? `${c.key}: ${c.val}${c.drift ? '  ✗' : '  ✓'}` : ''}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#EF7B4D', text: '#9A3412', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2"
             style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const badge = KIND_BADGE[state.kind] || KIND_BADGE.principle;
      const sync = SYNC_STYLE[state.syncStatus] || SYNC_STYLE.Synced;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>GitOps 조정 루프</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>
          <div className="rounded-lg border-2 p-3" style={{ borderColor: '#EF7B4D' }}>
            <LoopDiagram stage={state.stage} />
          </div>
          <div className="mt-3 flex items-center justify-between">
            <span className="text-xs font-bold" style={{ color: '#9A3412' }}>Sync 상태</span>
            <span className="text-[11px] px-2 py-0.5 rounded border font-bold"
                  style={{ backgroundColor: sync.bg, borderColor: sync.border, color: sync.text }}>
              {sync.icon} {state.syncStatus}
            </span>
          </div>
          <DiffTable git={state.git} cluster={state.cluster} />
          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                       style={isHi ? { backgroundColor: 'rgba(239,123,77,0.15)', borderColor: '#EF7B4D' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#EF7B4D' }}>A</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{ backgroundColor: '#9A3412' }}>Part I. 기초</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full border font-mono" style={{ borderColor: '#EF7B4D', color: '#9A3412' }}>I-1-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>GitOps — Git이 소스 오브 트루스</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>선언적 인프라를 Git으로 관리하는 배포 패러다임</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#EF7B4D' : '#FED7AA' }} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #EF7B4D)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80" style={{ borderColor: '#EF7B4D', color: '#9A3412' }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40" style={{ borderColor: '#EF7B4D', color: '#9A3412' }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#9A3412' : '#EF7B4D' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40" style={{ borderColor: '#EF7B4D', color: '#9A3412' }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#EF7B4D', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                GitOps = 원하는 상태를 Git에 선언하고, ArgoCD가 pull 방식으로 클러스터를 계속 조정한다. 드리프트는 selfHeal로 원복, 롤백은 git revert. 다음 챕터에서 ArgoCD 설치와 첫 Application을 만든다.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['GitOps', 'SourceOfTruth', 'Declarative', 'pull-vs-push', 'Reconciliation', 'Drift', 'selfHeal', 'gitRevert'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-end text-xs" style={{ color: '#9A3412' }}>
              <a href="./I-1-2.html" className="underline hover:no-underline">다음: I-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
