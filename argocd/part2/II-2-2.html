  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->

    @media (min-width: 768px) {

    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */

    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>

  <script>window.LESSON = {"topic": "argocd", "topicName": "ArgoCD", "topicHref": "../index.html", "id": "II-2-2", "title": "sync option — 세부 동기화 옵션", "sub": "동기화 동작을 미세 조정하는 옵션들 — 세탁기의 세부 코스 다이얼", "path": "part2/II-2-2.html", "prev": {"id": "II-2-1", "title": "sync wave — 배포 순서 제어", "href": "../part2/II-2-1.html"}, "next": {"id": "III-1-1", "title": "App of Apps 패턴", "href": "../part3/III-1-1.html"}, "wrap": "syncOptions는 동기화 \"방법\"을 조정하는 다이얼이다. CreateNamespace로 ns 자동 생성, ServerSideApply로 대형 CRD·필드 소유권 문제 해결, ignoreDifferences로 HPA·webhook 필드 diff 무시. Replace·Validate=false는 데이터 유실·검증 생략 위험이 있어 기본값(false/true)을 지키는 게 안전하다."};</script>

<body>

  <!-- ArgoCD II-2-2 — sync option 세부 동기화 옵션 (비유: 세탁기의 세부 코스 다이얼) -->
  <script type="text/babel" data-presets="env,react" src="../../anim/stage.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="../../anim/lesson.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 각 STEP 은 syncOptions 스위치 상태(options)와 동기화 결과(outcome), diff 시뮬레이션(diff)을 담는다.
    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang:"yaml", filename:"sync-options-overview.yaml", lines:[
        "# syncOptions — automated 아래에서 동기화 세부 동작을 조정한다",
        "apiVersion: argoproj.io/v1alpha1",
        "kind: Application",
        "metadata:",
        "  name: web-app",
        "  namespace: argocd",
        "spec:",
        "  project: default",
        "  source:",
        "    repoURL: https://github.com/acme/web.git",
        "    targetRevision: v2.3.1",
        "    path: k8s/overlays/prd",
        "  destination:",
        "    server: https://kubernetes.default.svc",
        "    namespace: web",
        "  syncPolicy:",
        "    automated:",
        "      prune: true                 # 삭제된 리소스 자동 회수",
        "      selfHeal: true              # 수동 변경 자동 복원",
        "    syncOptions:                  # ── 여기가 이번 챕터 주제 ──",
        "      - CreateNamespace=true      # 대상 ns 없으면 자동 생성",
        "      - ServerSideApply=true      # 서버 사이드 apply 사용",
        "      - ApplyOutOfSyncOnly=true   # OutOfSync 리소스만 apply",
        "      - PrunePropagationPolicy=foreground",
        "      - Validate=false            # 스키마 검증 생략 (주의)",
        "      - Replace=false             # apply 대신 replace 여부",
        "",
        "# ── 큰 그림 ─────────────────────────────",
        "# automated  = 자동 동기화를 켤지 말지 (on/off 스위치)",
        "# syncOptions = 동기화를 \"어떻게\" 할지 (세부 다이얼)",
        "#",
        "# 옵션은 문자열 배열이며 \"이름=값\" 또는 \"이름\" 형태.",
        "# 리소스별로 다르게 주려면 metadata.annotations 로도 지정 가능.",
      ]},
      s2: {lang:"yaml", filename:"create-namespace.yaml", lines:[
        "# CreateNamespace=true — 대상 ns 자동 생성",
        "spec:",
        "  destination:",
        "    server: https://kubernetes.default.svc",
        "    namespace: web              # 이 ns 가 없으면?",
        "  syncPolicy:",
        "    syncOptions:",
        "      - CreateNamespace=true    # → 없으면 ArgoCD 가 만든다",
        "",
        "# ── 켜기 전 (기본값 false) ──────────────",
        "# $ argocd app sync web-app",
        "# FAILED: namespaces \"web\" not found",
        "#   → ns 를 사람이 먼저 kubectl create ns web 해야 함",
        "",
        "# ── 켠 후 (true) ───────────────────────",
        "# $ argocd app sync web-app",
        "# 1) ArgoCD 가 web ns 생성",
        "# 2) web ns 안에 Deployment/Service 배포",
        "# 3) Synced / Healthy",
        "---",
        "# ── ns 에 메타데이터가 필요할 때 ─────────",
        "# 그냥 CreateNamespace 만 켜면 라벨 없는 맨몸 ns 가 생긴다.",
        "# istio 주입, PodSecurity 등급 등이 필요하면 아래처럼:",
        "spec:",
        "  syncPolicy:",
        "    managedNamespaceMetadata:",
        "      labels:",
        "        istio-injection: enabled",
        "        pod-security.kubernetes.io/enforce: restricted",
        "      annotations:",
        "        team: frontend",
        "    syncOptions:",
        "      - CreateNamespace=true",

               caption:'같은 syncOptions 배열이지만, 여기서부터는 기본값을 벗어나는 옵션들이다.',
               changes:[{mark:'read', text:'기본값을 벗어나는 옵션들'},
                        {mark:'changed', text:'세 위험 스위치는 아직 off'}] },
        kind:'danger',
        options:[
          { name:'Replace', on:false },
          { name:'Validate=false', on:false },
          { name:'PruneLast', on:false },
          { name:'ignoreDifferences', on:true },
        ],
        outcome:{ tone:'info', text:'아직 기본값 상태. 여기서 켜는 스위치는 대부분 안전을 깎는다.' },
        alert:{ tone:'warn', text:'기본값을 벗어날 때는 이유를 코드에 남겨라.' },
        code:{ ...CODE.s5, highlight:[1,2,3,4] },
      },
      { ...S5,
        beat:{ label:'Replace=true', at:'risky-options.yaml L6–12',
               caption:'apply 대신 replace로 통째 덮어쓴다. Force=true까지 붙이면 지우고 다시 만들어 clusterIP·PVC가 날아갈 수 있다.',
               changes:[{mark:'new', text:'Replace ON'},
                        {mark:'gone', text:'기존 clusterIP / PVC 데이터'}] },
        kind:'danger',
        options:[
          { name:'Replace', on:true },
          { name:'Validate=false', on:false },
          { name:'PruneLast', on:false },
          { name:'ignoreDifferences', on:true },
        ],
        outcome:{ tone:'danger', text:'replace로 통째 교체, Force면 삭제 후 재생성 — Service IP 재할당, PVC 데이터 유실 가능.' },
        alert:{ tone:'danger', text:'apply로 안 되는 이유를 설명할 수 있을 때만 켠다.' },
        code:{ ...CODE.s5, highlight:[6,7,8,9,10,11,12] },
      },
      { ...S5,
        beat:{ label:'Validate=false', at:'risky-options.yaml L14–18',
               caption:'스키마 검증을 건너뛴다. 스키마에 없는 필드를 통과시키는 대신 오타난 필드도 그대로 들어간다.',
               changes:[{mark:'new', text:'Validate=false ON'},
                        {mark:'gone', text:'스키마 검증'}] },
        kind:'danger',
        options:[
          { name:'Replace', on:true },
          { name:'Validate=false', on:true },
          { name:'PruneLast', on:false },
          { name:'ignoreDifferences', on:true },
        ],
        outcome:{ tone:'danger', text:'오타난 필드가 걸러지지 않고 클러스터로 그대로 간다.' },
        alert:{ tone:'warn', text:'검증을 끄는 만큼 오타를 잡을 곳이 사라진다.' },
        code:{ ...CODE.s5, highlight:[14,15,16,17,18] },
      },
      { ...S5,
        beat:{ label:'Prune 전파 정책', at:'risky-options.yaml L20–24',
               caption:'foreground는 자식까지 지운 뒤 부모를 지운다. 셋 중 가장 안전하다.',
               changes:[{mark:'read', text:'foreground / background / orphan'},
                        {mark:'changed', text:'삭제 전파 = foreground'}] },
        kind:'danger',
        options:[
          { name:'Replace', on:true },
          { name:'Validate=false', on:true },
          { name:'PruneLast', on:false },
          { name:'ignoreDifferences', on:true },
        ],
        outcome:{ tone:'good', text:'foreground를 쓰면 고아 리소스가 남지 않는다.' },
        alert:{ tone:'info', text:'orphan은 자식이 그대로 남으므로 청소 부담이 생긴다.' },
        code:{ ...CODE.s5, highlight:[20,21,22,23,24] },
      },
      { ...S5,
        beat:{ label:'PruneLast=true', at:'risky-options.yaml L26–29',
               caption:'모든 apply가 끝난 뒤 마지막에 prune 해서 의존 리소스를 지킨다.',
               changes:[{mark:'new', text:'PruneLast ON'},
                        {mark:'changed', text:'삭제를 맨 뒤로 미룸'}] },
        kind:'danger',
        options:[
          { name:'Replace', on:true },
          { name:'Validate=false', on:true },
          { name:'PruneLast', on:true },
          { name:'ignoreDifferences', on:true },
        ],
        outcome:{ tone:'good', text:'삭제될 리소스에 의존하는 것들이 먼저 자리를 잡는다.' },
        alert:{ tone:'info', text:'PruneLast는 위험 옵션이 아니라 안전 장치에 가깝다.' },
        code:{ ...CODE.s5, highlight:[26,27,28,29] },
      },
      { ...S5,
        beat:{ label:'ApplyOutOfSyncOnly', at:'risky-options.yaml L31–34',
               caption:'전체가 아니라 OutOfSync 리소스만 apply 해서 대형 앱의 sync 시간을 줄인다.',
               changes:[{mark:'read', text:'변경분만 apply'},
                        {mark:'changed', text:'ignoreDifferences는 잠시 끔'}] },
        kind:'danger',
        options:[
          { name:'Replace', on:true },
          { name:'Validate=false', on:true },
          { name:'PruneLast', on:true },
          { name:'ignoreDifferences', on:false },
        ],
        outcome:{ tone:'good', text:'리소스가 수백 개인 앱에서 sync 시간이 크게 줄어든다.' },
        alert:{ tone:'info', text:'성능 옵션은 안전을 깎지 않는다 — 위험 옵션과 구분해서 보자.' },
        code:{ ...CODE.s5, highlight:[31,32,33,34] },
      },
      { ...S5,
        beat:{ label:'안전 기본값 표', at:'risky-options.yaml L36–42',
               caption:'Replace는 false, Validate는 true를 유지하는 것이 기본이다.',
               changes:[{mark:'read', text:'옵션별 안전 기본값'},
                        {mark:'changed', text:'ignoreDifferences 다시 ON'}] },
        kind:'danger',
        options:[
          { name:'Replace', on:true },
          { name:'Validate=false', on:true },
          { name:'PruneLast', on:true },
          { name:'ignoreDifferences', on:true },
        ],
        outcome:{ tone:'danger', text:'Replace + Validate=false는 안전장치를 끈다. clusterIP/PVC 유실·오타 필드 반영 위험.' },
        alert:{ tone:'danger', text:'기본값이 곧 안전값이다. Replace·Validate=false는 "왜 필요한지" 문장으로 설명 가능할 때만 켠다.' },
        code:{ ...CODE.s5, highlight:[36,37,38,39,40,41,42] },
      },
    ];


    // ── RefPanel ── 예전 왼쪽 패널의 "결과" 상자와 diff 표 (lesson.jsx 의 "표·정리 보기")
    function RefPanel({ step }) {
      const out = [];
      if (step.outcome) out.push(<p key="o"><b>결과</b> · {step.outcome.text}</p>);
      if (step.diff) out.push(
        <table key="d">
          <thead><tr><th>필드</th><th>Git(원함)</th><th>live</th><th>판정</th></tr></thead>
          <tbody>{step.diff.map((r) => (<tr key={r.field}><td className="font-mono">{r.field}</td><td className="font-mono">{r.desired}</td><td className="font-mono">{r.live}</td>
            <td>{r.same ? '같음' : r.ignored ? '다르지만 무시' : 'OutOfSync'}</td></tr>))}</tbody>
        </table>);
      if (step.title.startsWith('Step 4.')) out.push(<p key="r">ignoreDifferences 는 기본으로 diff 계산에만 쓰인다. 다른 이유로 sync 가 일어나면 Git 의 replicas 가 다시 적용되므로, sync 에서도 그 필드를 건드리지 않으려면 <span className="font-mono">RespectIgnoreDifferences=true</span> 를 함께 켠다.</p>);
      if (step.title.startsWith('Step 5.')) out.push(
        <table key="s">
          <thead><tr><th>옵션</th><th>권장</th></tr></thead>
          <tbody>
            <tr><td className="font-mono">CreateNamespace</td><td>ns 를 자동으로 만들어야 할 때</td></tr>
            <tr><td className="font-mono">ServerSideApply</td><td>대형 CRD, 여러 컨트롤러가 한 객체를 나눠 쓸 때</td></tr>
            <tr><td className="font-mono">ApplyOutOfSyncOnly</td><td>리소스가 많은 앱에서 속도가 필요할 때</td></tr>
            <tr><td className="font-mono">ignoreDifferences</td><td>HPA·webhook 필드만 좁게</td></tr>
            <tr><td className="font-mono">Replace</td><td>기본 false 유지</td></tr>
            <tr><td className="font-mono">Validate</td><td>기본 true 유지</td></tr>
            <tr><td className="font-mono">PrunePropagationPolicy</td><td>기본 foreground (background, orphan 도 있음)</td></tr>
          </tbody>
        </table>);
      return out.length ? <div>{out}</div> : null;
    }
    // ── /RefPanel ──

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                       style={isHi ? { backgroundColor: 'rgba(239,123,77,0.15)', borderColor: '#EF7B4D' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() { return <LessonApp />; }   // 화면은 ../../anim/lesson.jsx (A형 레슨)

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
