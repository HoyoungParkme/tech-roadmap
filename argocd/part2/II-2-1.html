  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }
  </style>
  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>
  <!-- ArgoCD II-2-1 — sync wave (비유: 공사 순서 — 기초공사 끝나야 골조, 골조 끝나야 인테리어) -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang:"yaml", filename:"why-sync-wave.md", lines:[
        "# 왜 sync wave 가 필요한가",
        "",
        "## ArgoCD 기본 동작",
        "# 한 Application 의 모든 리소스를 \"동시에\" apply 한다.",
        "# → 리소스 사이에 배포 순서 의존성이 있으면 깨진다.",
        "",
        "## 순서 의존성이 있는 전형적 스택",
        "# 1) postgres (StatefulSet) — DB 가 먼저 Ready 여야",
        "# 2) db-migration (Job)      — 스키마/시드가 먼저 적용돼야",
        "# 3) api (Deployment)        — 앱이 부팅되며 DB 에 접속",
        "",
        "## 순서를 무시하면 (동시 배포)",
        "# - api Pod 가 먼저 떠서 아직 없는 DB 에 접속 시도",
        "# - 접속 실패 → 컨테이너 종료 → 재시작 → CrashLoopBackOff",
        "# - db-migration 이 DB Ready 전에 돌아 실패",
        "# - readinessProbe 로 버틸 수는 있지만 배포가 지저분해진다",
        "",
        "## sync wave 의 해결",
        "# 각 리소스에 배포 \"순번(wave)\" 을 annotation 으로 부여한다.",
        "# argocd.argoproj.io/sync-wave: \"0\"  → DB",
        "# argocd.argoproj.io/sync-wave: \"1\"  → migration",
        "# argocd.argoproj.io/sync-wave: \"2\"  → api",
        "#",
        "# ArgoCD 는 낮은 wave 부터 순차 배포하고,",
        "# 앞 wave 의 리소스가 모두 Healthy 가 된 뒤에 다음 wave 로 넘어간다.",
        "",
        "## 비유",
        "# 건물 공사 = 기초공사(0) → 골조(1) → 인테리어(2)",
        "# 기초가 굳기 전에 골조를 올리면 무너진다.",
      ]},
      s2: {lang:"yaml", filename:"sync-wave.yaml", lines:[
        "# sync-wave annotation — 배포 순번 부여",
        "# 값은 정수 \"문자열\". 낮을수록 먼저, 음수도 가능.",
        "",
        "# ── wave 0 : 데이터베이스 (가장 먼저) ─────────",
        "apiVersion: apps/v1",
        "kind: StatefulSet",
        "metadata:",
        "  name: postgres",
        "  annotations:",
        "    argocd.argoproj.io/sync-wave: \"0\"    # 안 주면 기본 0",
        "# ...(spec 생략)",
        "",
        "# ── wave 1 : 스키마 마이그레이션 Job ──────────",
        "apiVersion: batch/v1",
        "kind: Job",
        "metadata:",
        "  name: db-migration",
        "  annotations:",
        "    argocd.argoproj.io/sync-wave: \"1\"    # DB Healthy 후 실행",
        "# ...(spec 생략)",
        "",
        "# ── wave 2 : 애플리케이션 (마지막) ────────────",
        "apiVersion: apps/v1",
        "kind: Deployment",
        "metadata:",
        "  name: api",
        "  annotations:",
        "    argocd.argoproj.io/sync-wave: \"2\"    # 스키마 준비 후 부팅",
        "# ...(spec 생략)",
        "---",
        "apiVersion: apps/v1",
        "kind: Deployment",
        "metadata:",
        "  name: web",
        "  annotations:",
        "    argocd.argoproj.io/sync-wave: \"2\"    # api 와 같은 wave = 병렬",
        "# ...(spec 생략)",
        "",
        "# ── 규칙 요약 ─────────────────────────",
        "# - 미지정 = \"0\"",
        "# - 오름차순 배포: -2, -1, 0, 1, 2 ...",
        "# - 음수: CRD, Namespace, PriorityClass 등 선행 리소스에 유용",
        "# - 같은 wave = 병렬 (서로 순서 보장 없음)",
        "# - 다음 wave 로 넘어가려면 앞 wave 가 모두 Healthy 여야 함",
      ]},
      s3: {lang:"yaml", filename:"presync-hook.yaml", lines:[
        "# sync hook — sync 생명주기에 작업을 끼워 넣는다",
        "# hook 종류: PreSync / Sync / PostSync / SyncFail",
        "",
        "# ── PreSync hook: 본 배포 전에 스키마 마이그레이션 ──",
        "apiVersion: batch/v1",
        "kind: Job",
        "metadata:",
        "  name: db-migration",
        "  annotations:",
        "    argocd.argoproj.io/hook: PreSync         # 배포 \"전\" 실행",
        "    argocd.argoproj.io/sync-wave: \"1\"        # hook 끼리도 wave 로 정렬",
        "spec:",
        "  backoffLimit: 2                            # 실패 시 재시도 횟수",
        "  template:",
        "    spec:",

    const S1 = { title:"Step 1. 왜 sync wave — 한꺼번에 배포하면 깨진다", desc:"ArgoCD 는 기본적으로 한 Application 안의 모든 리소스를 동시에 apply 한다. 하지만 앱은 DB 가 떠 있어야 마이그레이션이 돌고, 스키마가 준비돼야 애플리케이션이 부팅된다. 순서를 무시하면 앱 Pod 가 아직 없는 DB 에 붙으려다 CrashLoopBackOff 로 재시작을 반복한다. sync wave 는 이 배포 순서를 annotation 한 줄로 강제하는 ArgoCD 기본 기능이다." };
    const S2 = { title:"Step 2. sync-wave annotation — 낮은 번호부터, 같은 번호는 병렬", desc:"sync-wave 는 리소스 metadata.annotations 에 붙이는 정수 문자열이다. ArgoCD 는 wave 값을 오름차순으로 정렬해 배포하며, 값을 안 주면 모두 \"0\" 으로 간주한다. 음수(-1, -2)도 가능해서 \"가장 먼저 CRD 를 깔아야 할 때\" 같은 선행 배포에 쓴다. 핵심 규칙 하나 — 같은 wave 안의 리소스들은 서로 순서 보장 없이 병렬 배포된다." };
    const S3 = { title:"Step 3. sync hook — PreSync·Sync·PostSync·SyncFail", desc:"wave 가 \"리소스 정렬 순서\" 라면, hook 은 \"sync 생명주기의 특정 시점에 끼워 넣는 작업\" 이다. PreSync 는 본 배포 전(예: DB 백업·마이그레이션), PostSync 는 배포 후(스모크 테스트·슬랙 알림), SyncFail 은 sync 실패 시(롤백·경보)에 돈다. hook 은 보통 일회성 Job 으로 만들고, hook 도 sync-wave 를 함께 붙여 hook 들 사이의 순서까지 제어한다. PreSync hook 이 실패하면 그 뒤 배포 전체가 중단된다." };
    const S4 = { title:"Step 4. hook-delete-policy — hook Job 정리 규칙", desc:"hook 은 대부분 일회성 Job 이라 다 쓰면 지워야 한다. 안 그러면 마이그레이션 Job 이 배포할 때마다 쌓여 클러스터가 지저분해지고, 이름 충돌로 다음 sync 가 실패한다. hook-delete-policy 로 언제 삭제할지 정한다 — HookSucceeded(성공 시 즉시 삭제), HookFailed(실패 시 삭제), BeforeHookCreation(다음 실행 직전 이전 것 삭제). 실무 기본값은 실패 원인을 로그로 남기려 성공 시 삭제 + 다음 실행 직전 삭제 조합이다." };
    const S5 = { title:"Step 5. wave + health 대기 — 앞 wave 가 Healthy 여야 다음으로", desc:"sync wave 의 핵심은 \"정렬\" 만이 아니라 \"대기\" 다. ArgoCD 는 한 wave 의 모든 리소스가 Healthy 상태가 될 때까지 기다린 뒤 다음 wave 를 시작한다. 그래서 StatefulSet 의 readinessProbe 나 Job 의 완료 판정이 정확해야 순서가 의미를 갖는다. health 판정이 애매한 커스텀 리소스(CRD)는 resource.customizations 로 health check 를 직접 정의해야 wave 대기가 제대로 동작한다." };
    const S6 = { title:"Step 6. 실무 함정 — wave·hook 에서 자주 터지는 것들", desc:"sync wave 는 annotation 한 줄이라 쉬워 보이지만 운영에서 반복적으로 사고가 난다. wave 번호를 문자열이 아닌 정수로 쓰거나, 같은 wave 를 순차라고 착각하거나, hook Job 정리를 빼먹는 실수가 대표적이다. 아래 다섯 가지를 배포 전 체크리스트로 두면 대부분의 sync wave 사고를 예방할 수 있다. 근본 원인은 대부분 \"순서를 코드가 아니라 머릿속에서만 가정\" 한 데 있다." };

        alert:{ tone:'info', text:'ArgoCD 는 wave 의 모든 리소스가 Healthy 될 때까지 대기 후 다음 wave 진행.' },
        code:{ ...CODE.s5, highlight:[40,41,42,43] },
      },

      // ── Step 6 ────────────────────────────────────────────────────────
      { ...S6,
        beat:{ label:'함정 1 — 정수로 씀', at:'sync-wave-pitfalls.md L3–6',
               caption:'annotation 값은 문자열이어야 한다. 따옴표 없는 1 은 무시되거나 에러가 난다.',
               changes:[{mark:'new', text:'wave 1 슬롯'},
                        {mark:'read', text:'값은 반드시 "1"'}] },
        kind:'trap',
        hook:null,
        waves:[
          { wave:1, label:'wave 1 — 마이그레이션', status:'pending', resources:[ { name:'db-migration', status:'pending' } ] },
        ],
        alert:{ tone:'warn', text:'따옴표 하나 빠뜨리면 순서가 통째로 무시된다.' },
        code:{ ...CODE.s6, highlight:[3,4,5,6] },
      },
      { ...S6,
        beat:{ label:'함정 2 — 같은 wave = 병렬', at:'sync-wave-pitfalls.md L8–11',
               caption:'같은 번호의 리소스는 순서 보장이 없다. 순서가 필요하면 번호를 나눠야 한다.',
               changes:[{mark:'new', text:'wave 2 (api·web 병렬)'},
                        {mark:'read', text:'순서 필요 시 2 / 3 으로 분리'}] },
        kind:'trap',
        hook:null,
        waves:[
          { wave:1, label:'wave 1 — 마이그레이션', status:'pending', resources:[ { name:'db-migration', status:'pending' } ] },
          { wave:2, label:'wave 2 — 앱', status:'pending', resources:[
            { name:'api', status:'pending' },
            { name:'web', status:'pending' },
          ] },
        ],
        alert:{ tone:'warn', text:'"같은 wave 는 순차" 라는 착각이 가장 흔한 사고 원인이다.' },
        code:{ ...CODE.s6, highlight:[8,9,10,11] },
      },
      { ...S6,
        beat:{ label:'함정 3 — hook 정리 누락', at:'sync-wave-pitfalls.md L13–16',
               caption:'delete-policy 없이 고정 name 을 쓰면 두 번째 배포가 already exists 로 죽는다.',
               changes:[{mark:'new', text:'PreSync hook 등장'},
                        {mark:'changed', text:'wave 1 실패'}] },
        kind:'trap',
        hook:{ phase:'PreSync', name:'db-migration (Job)', status:'failed' },
        waves:[
          { wave:1, label:'wave 1 — 마이그레이션', status:'failed', resources:[ { name:'db-migration', status:'failed' } ] },
          { wave:2, label:'wave 2 — 앱', status:'pending', resources:[ { name:'api', status:'pending' } ] },
        ],
        alert:{ tone:'danger', text:'이름 충돌 하나로 배포 파이프라인 전체가 멈춘다.' },
        code:{ ...CODE.s6, highlight:[13,14,15,16] },
      },
      { ...S6,
        beat:{ label:'함정 4 — PreSync 실패', at:'sync-wave-pitfalls.md L18–21',
               caption:'마이그레이션이 깨지면 뒤 배포가 통째로 멈춘다. SyncFail hook 을 준비해 둔다.',
               changes:[{mark:'changed', text:'hook → SyncFail 대기'},
                        {mark:'gone', text:'wave 2 배포 중단'}] },
        kind:'trap',
        hook:{ phase:'SyncFail', name:'notify-fail (Job)', status:'pending' },
        waves:[
          { wave:1, label:'wave 1 — 마이그레이션', status:'failed', resources:[ { name:'db-migration (Failed)', status:'failed' } ] },
          { wave:2, label:'wave 2 — 앱 (중단됨)', status:'pending', resources:[ { name:'api (배포 안 됨)', status:'pending' } ] },
        ],
        alert:{ tone:'danger', text:'마이그레이션은 재실행해도 안전하게(idempotent) 만들어야 한다.' },
        code:{ ...CODE.s6, highlight:[18,19,20,21] },
      },
      { ...S6,
        beat:{ label:'함정 5 — health 없음', at:'sync-wave-pitfalls.md L23–26',
               caption:'probe 가 없으면 즉시 Healthy 로 간주돼 wave 대기 자체가 의미를 잃는다.',
               changes:[{mark:'changed', text:'SyncFail hook 발동'},
                        {mark:'read', text:'probe / CRD health 필요'}] },
        kind:'trap',
        hook:{ phase:'SyncFail', name:'notify-fail (Job)', status:'syncing' },
        waves:[
          { wave:1, label:'wave 1 — 마이그레이션', status:'failed', resources:[ { name:'db-migration (Failed)', status:'failed' } ] },
          { wave:2, label:'wave 2 — 앱 (중단됨)', status:'pending', resources:[ { name:'api (배포 안 됨)', status:'pending' } ] },
        ],
        alert:{ tone:'warn', text:'health 판정 근거가 없으면 순서를 매겨도 지켜지지 않는다.' },
        code:{ ...CODE.s6, highlight:[23,24,25,26] },
      },
      { ...S6,
        beat:{ label:'배포 전 체크리스트', at:'sync-wave-pitfalls.md L28–34',
               caption:'문자열·wave 분리·delete-policy·SyncFail·health·idempotent 여섯 항목을 점검한다.',
               changes:[{mark:'changed', text:'경보 hook 도 실패'},
                        {mark:'read', text:'체크리스트 6항목'}] },
        kind:'trap',
        hook:{ phase:'SyncFail', name:'notify-fail (Job)', status:'failed' },
        waves:[
          { wave:1, label:'wave 1 — 마이그레이션', status:'failed', resources:[ { name:'db-migration (Failed)', status:'failed' } ] },
          { wave:2, label:'wave 2 — 앱 (중단됨)', status:'pending', resources:[ { name:'api (배포 안 됨)', status:'pending' } ] },
        ],
        alert:{ tone:'warn', text:'배포 전에 여섯 줄만 확인하면 대부분의 사고를 막는다.' },
        code:{ ...CODE.s6, highlight:[28,29,30,31,32,33,34] },
      },
      { ...S6,
        beat:{ label:'근본 원인', at:'sync-wave-pitfalls.md L36–38',
               caption:'순서를 머릿속에서만 가정하면 리뷰도 재현도 안 된다. 매니페스트에 명시해야 한다.',
               changes:[{mark:'read', text:'순서는 코드로 남긴다'},
                        {mark:'gone', text:'암묵적 순서 가정'}] },
        kind:'trap',
        hook:{ phase:'SyncFail', name:'notify-fail (Job)', status:'failed' },
        waves:[
          { wave:1, label:'wave 1 — 마이그레이션', status:'failed', resources:[ { name:'db-migration (Failed)', status:'failed' } ] },
          { wave:2, label:'wave 2 — 앱 (중단됨)', status:'pending', resources:[ { name:'api (배포 안 됨)', status:'pending' } ] },
        ],
        alert:{ tone:'danger', text:'PreSync hook 실패 → 뒤 wave 전부 중단. 롤백/경보 hook 을 반드시 준비.' },
        code:{ ...CODE.s6, highlight:[36,37,38] },
      },
    ];

    const KIND_BADGE = {
      why:    { label: '왜 wave', color: '#F59E0B' },
      wave:   { label: 'wave 순서', color: '#EF7B4D' },
      hook:   { label: 'hook', color: '#0EA5E9' },
      delete: { label: 'hook 정리', color: '#8B5CF6' },
      health: { label: 'health 대기', color: '#10B981' },
      trap:   { label: '함정', color: '#DC2626' },
    };

    const STATUS_STYLE = {
      pending: { bg: '#F3F4F6', border: '#D1D5DB', text: '#6B7280', dot: '#9CA3AF', label: '대기' },
      syncing: { bg: '#FFF7ED', border: '#EF7B4D', text: '#9A3412', dot: '#EF7B4D', label: '배포중' },
      healthy: { bg: '#ECFDF5', border: '#10B981', text: '#065F46', dot: '#10B981', label: 'Healthy' },
      failed:  { bg: '#FEF2F2', border: '#F87171', text: '#991B1B', dot: '#DC2626', label: '실패' },
    };

    function ResourceRow({ res }) {
      const s = STATUS_STYLE[res.status] || STATUS_STYLE.pending;
      const pulse = res.status === 'syncing';
      return (
        <div className="flex items-center justify-between rounded border px-2.5 py-1.5 text-xs"
             style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span className="flex items-center gap-2 font-mono">
            <span className="w-2 h-2 rounded-full" style={{ backgroundColor: s.dot, animation: pulse ? 'pulse 1s infinite' : 'none' }} />
            {res.name}
          </span>
          <span className="text-[10px] font-bold">{s.label}</span>
        </div>
      );
    }

    function WaveCard({ w }) {
      const s = STATUS_STYLE[w.status] || STATUS_STYLE.pending;
      return (
        <div className="rounded-lg border-2 p-2.5" style={{ borderColor: s.border, backgroundColor: '#FFFFFF' }}>
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold" style={{ color: '#9A3412' }}>{w.label}</span>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: s.dot }}>{s.label}</span>
          </div>
          <div className="space-y-1.5">
            {w.resources.map((r, i) => <ResourceRow key={i} res={r} />)}
          </div>
        </div>
      );
    }

    function HookBox({ hook }) {
      if (!hook) return null;
      const s = STATUS_STYLE[hook.status] || STATUS_STYLE.syncing;
      return (
        <div className="rounded-lg border-2 border-dashed p-2.5 mb-2" style={{ borderColor: '#0EA5E9', backgroundColor: '#F0F9FF' }}>
          <div className="flex items-center justify-between">
            <span className="text-xs font-bold" style={{ color: '#075985' }}>🪝 {hook.phase} hook</span>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: s.dot }}>{s.label}</span>
          </div>
          <div className="mt-1.5 font-mono text-xs" style={{ color: '#0C4A6E' }}>{hook.name}</div>
        </div>
      );
    }

    const ALERT_STYLE = {
      info:   { bg: '#FFF7ED', border: '#FED7AA', text: '#9A3412', icon: '💡' },
      warn:   { bg: '#FFFBEB', border: '#FCD34D', text: '#92400E', icon: '⚠️' },
      danger: { bg: '#FEF2F2', border: '#FCA5A5', text: '#991B1B', icon: '🚨' },
      good:   { bg: '#FFF7ED', border: '#EF7B4D', text: '#9A3412', icon: '✅' },
    };
    function AlertBox({ alert }) {
      if (!alert) return null;
      const s = ALERT_STYLE[alert.tone] || ALERT_STYLE.info;
      return (
        <div className="mt-3 rounded-lg border p-2 text-xs flex gap-2"
             style={{ backgroundColor: s.bg, borderColor: s.border, color: s.text }}>
          <span>{s.icon}</span><span>{alert.text}</span>
        </div>
      );
    }

    function LiveDataPane({ beat, state }) {
      const badge = KIND_BADGE[state.kind] || KIND_BADGE.wave;
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#FED7AA' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#9A3412' }}>sync wave 진행 — 배포 순서</h3>
            <span className="text-[10px] px-2 py-0.5 rounded text-white" style={{ backgroundColor: badge.color }}>{badge.label}</span>
          </div>
          {beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{beat.caption}</p>
              {beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          <div className="rounded-lg border-2 p-3 flex-1 overflow-auto" style={{ borderColor: '#EF7B4D', backgroundColor: '#FFFBF7' }}>
            <div className="text-xs font-bold mb-2" style={{ color: '#9A3412' }}>🌊 wave 0 → 1 → 2 순차 배포</div>
            <HookBox hook={state.hook} />
            <div className="space-y-2">
              {state.waves.map((w, i) => (
                <div key={i}>
                  <WaveCard w={w} />
                  {i < state.waves.length - 1 && (
                    <div className="text-center text-lg leading-none my-0.5" style={{ color: '#EF7B4D' }}>↓</div>
                  )}
                </div>
              ))}
            </div>
          </div>
          {state.alert && <AlertBox alert={state.alert} />}
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'border-l-2 -ml-3 pl-2' : ''}`}
                       style={isHi ? { backgroundColor: 'rgba(239,123,77,0.15)', borderColor: '#EF7B4D' } : {}}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);
      const isLast = stepIdx === STEPS.length - 1;
      return (
        <div className="min-h-screen px-4 py-6" style={{ background: 'linear-gradient(135deg, #FFF7ED, #FFEDD5)' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#EF7B4D' }}>A</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] px-2 py-0.5 rounded-full text-white font-bold" style={{ backgroundColor: '#9A3412' }}>Part II. sync 전략</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full font-mono" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', border: '1px solid #FED7AA' }}>II-2-1</span>
                </div>
                <h1 className="text-2xl font-bold" style={{ color: '#9A3412' }}>sync wave — 배포 순서 제어</h1>
                <p className="text-sm" style={{ color: '#7C2D12' }}>리소스를 정해진 순서로 단계적으로 배포</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#9A3412' }}>← 챕터 목록</a>
            </header>
            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#EF7B4D' : '#FED7AA' }} />
              ))}
            </div>
            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ background: 'linear-gradient(90deg, #9A3412, #EF7B4D)' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed opacity-95">{step.desc}</p>
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane beat={step.beat} state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>
            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80" style={{ borderColor: '#EF7B4D', color: '#9A3412' }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40" style={{ borderColor: '#EF7B4D', color: '#9A3412' }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: playing ? '#9A3412' : '#EF7B4D' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border bg-white hover:opacity-80 disabled:opacity-40" style={{ borderColor: '#EF7B4D', color: '#9A3412' }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] mt-2" style={{ color: '#9A3412' }}>키보드 ←/→ · 자동재생 3초/단계</div>
            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#EF7B4D', color: '#7C2D12' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                sync wave 는 annotation "sync-wave" 로 배포 순서를 정하고, 앞 wave 가 Healthy 여야 다음으로 넘어간다. hook(PreSync·PostSync·SyncFail)은 sync 생명주기에 작업을 끼워 넣고, hook-delete-policy 로 Job 을 정리한다. 순서를 머릿속이 아니라 매니페스트에 명시하는 것이 핵심.
              </div>
            )}
            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['syncWave', 'PreSync', 'PostSync', 'SyncFail', 'hookDeletePolicy', 'health', 'GitOps'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#FFF7ED', color: '#9A3412', borderColor: '#FED7AA' }}>#{k}</span>
              ))}
            </div>
            <nav className="mt-6 flex items-center justify-end text-xs" style={{ color: '#9A3412' }}>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const style = document.createElement('style');
    style.textContent = '@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }';
    document.head.appendChild(style);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
