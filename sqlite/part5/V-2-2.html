  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    SQLite Chapter V-2-2 — 종합: 프로덕션 SQLite 체크리스트 (SQLite 완주)
    학습 목표: 앞선 챕터(본질·SQL·인덱스·WAL·실전)를 프로덕션 배포 점검표로 종합
    핵심: PRAGMA 세팅 → 스키마·인덱스 → 트랜잭션 → 백업·모니터링 → SQLite vs 서버 DB 판단
    패턴: fastapi v1 — 좌(LiveDataPane: 배포 전 체크리스트) / 우(VSCode CodeViewer)
    색상: slate (sqlite 도메인, #003B57)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang:'python', filename:'db_connect.py', lines:[
            '"""프로덕션 SQLite 연결 — 여는 순간 PRAGMA를 박는다."""',
            'import sqlite3',
            '',
            'def connect(db_path: str) -> sqlite3.Connection:',
            '    """PRAGMA를 적용한 연결을 반환한다. 연결마다 매번 실행해야 한다."""',
            '    conn = sqlite3.connect(db_path, timeout=5.0)',
            '',
            '    # 1) WAL — 읽기와 쓰기가 서로를 막지 않는다 (IV장)',
            '    conn.execute("PRAGMA journal_mode = WAL")',
            '',
            '    # 2) synchronous=NORMAL — WAL과 짝. FULL보다 빠르고 여전히 안전',
            '    conn.execute("PRAGMA synchronous = NORMAL")',
            '',
            '    # 3) foreign_keys — 연결마다 OFF가 기본! 반드시 켠다 (I장)',
            '    conn.execute("PRAGMA foreign_keys = ON")',
            '',
            '    # 4) busy_timeout — 잠금 충돌 시 즉시 실패 대신 5초 재시도',
            '    conn.execute("PRAGMA busy_timeout = 5000")',
            '',
            '    # 5) cache_size — 음수는 KB 단위. -20000 = 약 20MB 캐시',
            '    conn.execute("PRAGMA cache_size = -20000")',
            '',
            '    # (선택) mmap — 읽기 많은 워크로드에서 페이지 접근 가속',
            '    conn.execute("PRAGMA mmap_size = 134217728")  # 128MB',
            '',
            '    conn.row_factory = sqlite3.Row',
            '    return conn',
            '',
            '# 자가 점검: 설정이 실제로 먹었는지 확인',
            'if __name__ == "__main__":',
            '    c = connect("app.db")',
            '    for key in ("journal_mode", "synchronous", "foreign_keys",',
            '                "busy_timeout", "cache_size"):',
            '        row = c.execute(f"PRAGMA {key}").fetchone()',
            '        print(key, "=", row[0])',
            '    # journal_mode = wal / foreign_keys = 1 이면 통과',
      ]},
      s2: {lang:'sql', filename:'schema.sql', lines:[
            '-- Step 2. 프로덕션 스키마 — 쿼리 패턴에서 인덱스를 역설계',
            '',
            'CREATE TABLE users (',
            '    id         INTEGER PRIMARY KEY,   -- rowid 별칭 (자동 covering 포함)',
            '    email      TEXT NOT NULL UNIQUE,  -- UNIQUE = 자동 인덱스',
            '    created_at TEXT NOT NULL DEFAULT (datetime("now"))',
            ');',
            '',
            'CREATE TABLE orders (',
            '    id       INTEGER PRIMARY KEY,',
            '    user_id  INTEGER NOT NULL REFERENCES users(id),  -- FK (PRAGMA로 강제됨)',
            '    status   TEXT NOT NULL CHECK (status IN ("PENDING","PAID","CANCELED")),',
            '    total    REAL NOT NULL,',
            '    created_at TEXT NOT NULL DEFAULT (datetime("now"))',
            ');',
            '',
            '-- 자주 쓰는 쿼리: WHERE user_id=? AND status=?',
            '-- 복합 인덱스 — 좌측 prefix 규칙 (user_id 단독도 커버)',
            'CREATE INDEX idx_orders_user_status ON orders(user_id, status);',
            '',
            '-- 대시보드 쿼리: SELECT total ... WHERE user_id=? AND status=?',
            '-- covering 인덱스 — total까지 담아 테이블 fetch 제거',
            'CREATE INDEX idx_orders_covering ON orders(user_id, status, total);',
            '',
            '-- 전문 검색이 필요하면 LIKE 대신 FTS5 (IV장)',
            'CREATE VIRTUAL TABLE docs_fts USING fts5(title, body);',
            '-- SELECT * FROM docs_fts WHERE docs_fts MATCH "sqlite";',
            '',
            '-- 함정: 낮은 카디널리티 컬럼엔 인덱스 만들지 마라',
            '-- CREATE INDEX idx_gender ON users(gender);  -- M/F 2종 → SCAN이 빠름',
            '',
            '-- 설계 끝나면 통계를 채운다 → planner가 올바른 인덱스 선택',
            'ANALYZE;',
            '',
            '-- 검증: 계획에 SEARCH ... USING INDEX / COVERING 이 보이는지',
            'EXPLAIN QUERY PLAN',
            'SELECT total FROM orders WHERE user_id = 42 AND status = "PAID";',
            '-- SEARCH orders USING COVERING INDEX idx_orders_covering (user_id=? AND status=?)',
      ]},
      s3: {lang:'python', filename:'bulk_write.py', lines:[
            '"""쓰기 묶기 — 트랜잭션 하나가 처리량을 수백 배 바꾼다."""',
            'from db_connect import connect',
            '',

            <div key={i} className="flex items-center gap-2 bg-white border border-emerald-300 rounded p-2">
              <span className="text-emerald-600 text-sm">✓</span>
              <div className="flex-1 min-w-0">
                <div className="text-[11px] font-mono font-bold text-slate-800 truncate">{it.pragma}</div>
                <div className="text-[10px] text-slate-500 truncate">{it.why}</div>
              </div>
              <ChapterBadge label={it.src} />
            </div>
          ))}
        </div>
      );
    }

    function SchemaViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.rows.map((r, i) => {
            const t = TONE[r.tone] || TONE.good;
            return (
              <div key={i} className={`flex items-center gap-2 rounded p-2 border ${t.bg} ${t.border}`}>
                <span className={`text-[9px] font-bold w-14 text-center px-1 py-0.5 rounded ${t.badge}`}>{r.kind}</span>
                <div className="flex-1 min-w-0">
                  <div className="text-[11px] font-mono font-bold text-slate-800 truncate">{r.name}</div>
                  <div className="text-[10px] text-slate-600 truncate">{r.detail}</div>
                </div>
                <ChapterBadge label={r.src} />
              </div>
            );
          })}
        </div>
      );
    }

    function TxnViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-2.5">
          {viz.rows.map((r, i) => {
            const t = TONE[r.tone] || TONE.good;
            const barColor = r.tone === 'danger' ? 'bg-rose-500' : 'bg-emerald-500';
            return (
              <div key={i}>
                <div className="flex justify-between text-[10px] mb-1">
                  <span className={`font-bold ${t.text}`}>{r.label}</span>
                  <span className="font-mono bg-slate-700 text-white px-1.5 py-0.5 rounded">{r.ms}ms</span>
                </div>
                <div className="h-3 bg-white rounded border border-slate-300 overflow-hidden">
                  <div className={`h-full ${barColor}`} style={{ width: `${r.bar}%` }}></div>
                </div>
              </div>
            );
          })}
          <div className="text-[10px] text-center text-slate-600">막대 = 처리량(길수록 좋음) · 자동 커밋은 건마다 fsync</div>
        </div>
      );
    }

    function BackupViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-3">
          <div className="space-y-1.5">
            {viz.methods.map((m, i) => (
              <div key={i} className={`flex items-center gap-2 rounded p-2 border ${m.safe ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}`}>
                <span className={m.safe ? 'text-emerald-600' : 'text-rose-500'}>{m.safe ? '✓' : '✗'}</span>
                <div className="flex-1 min-w-0">
                  <div className="text-[11px] font-mono font-bold text-slate-800 truncate">{m.name}</div>
                  <div className="text-[10px] text-slate-600 truncate">{m.note}</div>
                </div>
                <ChapterBadge label={m.src} />
              </div>
            ))}
          </div>
          <div className="border-t border-slate-200 pt-2 space-y-1.5">
            <div className="text-[10px] font-bold text-slate-500">모니터링</div>
            {viz.monitor.map((m, i) => (
              <div key={i} className="flex items-center gap-2 bg-white border border-slate-300 rounded p-2">
                <span className="text-slate-400 text-sm">📈</span>
                <span className="flex-1 text-[11px] font-mono text-slate-800 truncate">{m.check}</span>
                <span className="text-[10px] text-slate-600">{m.expect}</span>
                <ChapterBadge label={m.src} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    function DecisionViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="grid grid-cols-2 gap-3">
            <div className="rounded-lg border border-emerald-300 bg-emerald-50 p-3">
              <div className="text-xs font-bold text-emerald-800 mb-2">SQLite로 충분</div>
              <ul className="space-y-1.5">
                {viz.enough.map((s, i) => (
                  <li key={i} className="text-[10px] text-emerald-900 flex gap-1.5"><span>✓</span><span>{s}</span></li>
                ))}
              </ul>
            </div>
            <div className="rounded-lg border border-amber-400 bg-amber-50 p-3">
              <div className="text-xs font-bold text-amber-800 mb-2">서버 DB로</div>
              <ul className="space-y-1.5">
                {viz.server.map((s, i) => (
                  <li key={i} className="text-[10px] text-amber-900 flex gap-1.5"><span>→</span><span>{s}</span></li>
                ))}
              </ul>
            </div>
          </div>
          <div className="mt-3 text-center text-[11px] bg-[#003B57] text-white px-2 py-1.5 rounded font-bold">
            판단 기준 = 규모가 아니라 동시 쓰기 경합
          </div>
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">출처</th><th className="py-1 pr-2">핵심</th><th className="py-1">기준</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">배포 전 체크리스트</h3>
            <div className="flex items-center gap-1.5">
              <ChapterBadge label={state.chapter} />
              <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
            </div>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {viz?.kind === 'pragma' && <PragmaViz viz={viz} />}
          {viz?.kind === 'schema' && <SchemaViz viz={viz} />}
          {viz?.kind === 'txn' && <TxnViz viz={viz} />}
          {viz?.kind === 'backup' && <BackupViz viz={viz} />}
          {viz?.kind === 'decision' && <DecisionViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-[#003B57] text-white mb-1">Part V. 실전 활용 · V-2-2</span>
                <h1 className="text-2xl font-bold text-slate-900">종합: 프로덕션 SQLite 체크리스트</h1>
                <p className="text-sm text-slate-700/80">앞서 배운 것을 합친 프로덕션 배포 점검 (SQLite 완주)</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리 — SQLite 완주</div>
                프로덕션 SQLite는 다섯 층으로 완성된다. ① 연결마다 WAL·synchronous=NORMAL·foreign_keys=ON·busy_timeout·cache_size PRAGMA. ② 쿼리 패턴에서 역설계한 복합·covering·FTS5 인덱스와 ANALYZE. ③ 쓰기는 BEGIN…COMMIT 배치로 묶어 처리량 수백 배. ④ Backup API·VACUUM INTO로 일관 스냅샷, integrity_check로 감시. ⑤ 동시 쓰기 경합이 크면 서버 DB로. 본질·SQL·인덱스·WAL·실전이 여기서 하나로 꿰였다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['PRAGMA', 'WAL', 'covering', 'FTS5', 'transaction', 'BackupAPI', 'integrity_check', 'checklist'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline font-bold text-[#003B57]">🎓 SQLite 완주 · 챕터 목록으로 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
