            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['PRAGMA', 'WAL', 'covering', 'FTS5', 'transaction', 'BackupAPI', 'integrity_check', 'checklist'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../index.html" className="underline hover:no-underline font-bold text-[#003B57]">🎓 SQLite 완주 · 챕터 목록으로 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
