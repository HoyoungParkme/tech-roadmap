            { icon: '⚠', label: '행마다 커밋', desc: 'fsync 100만 번 — 트랜잭션으로 묶어라' },
            { icon: '⚠', label: '큰 OFFSET', desc: '깊은 페이지가 느림 — keyset으로 전환' },
            { icon: '⚠', label: '적재 중 인덱스 유지', desc: 'B-Tree 재정렬 반복 — 적재 후 생성' },
            { icon: '⚠', label: 'fetchall 메모리 폭발', desc: '수백만 행 한 번에 로드 — 커서 스트리밍' },
            { icon: '⚠', label: 'synchronous=OFF 상시', desc: '크래시 시 손상 — 적재 구간만' },
          ],
        },
        verdict: '함정 주의',
        verdictTone: 'warn',
        summary: {
          title: 'V-2-1 대용량 · 벌크 처리 정리',
          rows: [
            { metric: '벌크 INSERT', before: '한 트랜잭션', after: 'fsync 1회 + executemany', delta: '수십~수백 배' },
            { metric: '적재 PRAGMA', before: 'sync=OFF', after: '적재 구간만, 후 원복', delta: '초기만' },
            { metric: '인덱스', before: '적재 후 생성', after: 'CREATE INDEX + ANALYZE', delta: '빠름+조밀' },
            { metric: '조회', before: 'keyset', after: 'WHERE id > ? 인덱스 seek', delta: '일정 속도' },
            { metric: '공간 회수', before: 'VACUUM', after: '단편화 제거, 2배 공간 필요', delta: '한산할 때' },
          ],
        },
        keyPoint: '넣기는 트랜잭션+인덱스 후생성, 읽기는 keyset+스트리밍, 정리는 VACUUM. 다음(V-2-2)으로.',
        code: {
          lang: 'sql',
          filename: 'vacuum_and_pitfalls.sql',
          lines: [
            '-- Step 5. VACUUM 으로 공간 회수 + 함정 점검',
            '',
            '-- 대량 삭제 후 — 파일은 그대로, 빈 페이지만 늘어남',
            'DELETE FROM logs WHERE created_at < "2025-01-01";',
            '-- 디스크 크기 변화 없음 (freelist 페이지로 재활용 대기)',
            '',
            '-- VACUUM — DB를 통째로 다시 써서 단편화 제거 + 공간 회수',
            'VACUUM;',
            '--   주의 1) 실행 중 DB 크기의 약 2배 여유 공간 필요',
            '--   주의 2) 배타 락 — 다른 쓰기 차단. 한산한 시간에.',
            '',
            '-- 특정 DB로 압축 복사하며 회수 (백업 겸용)',
            'VACUUM INTO "compacted.db";',
            '',
            '-- 자동 회수 옵션 — 대량 삭제가 잦다면',
            'PRAGMA auto_vacuum = FULL;   -- 새 DB에서만 유효(재빌드 필요)',
            'PRAGMA auto_vacuum = INCREMENTAL;',
            'PRAGMA incremental_vacuum(1000);  -- 1000 페이지씩 점진 회수',
            '',
            '-- 유지보수 후 통계 갱신',
            'ANALYZE;',
            '',
            '-- 함정 체크리스트',
            '-- 1) 행마다 COMMIT?      → BEGIN~COMMIT로 묶기',
            '-- 2) 큰 OFFSET?          → keyset(WHERE id > ?)',
            '-- 3) 적재 중 인덱스?      → 적재 후 CREATE INDEX',
            '-- 4) fetchall 남발?       → 커서 스트리밍',
            '-- 5) sync=OFF 상시?       → 적재 구간만, 후 원복',
            '',
            '-- 다음 챕터: V-2-2',
          ],
          highlight: [2, 3, 4, 6, 7, 8, 9, 11, 12, 14, 15, 16, 17, 19, 20],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', bar: 'bg-emerald-500', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   bar: 'bg-amber-500',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    bar: 'bg-rose-500',    badge: 'bg-rose-200 text-rose-800' },
    };

    function RaceViz({ viz }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        setTick(0);
        const id = setInterval(() => setTick((x) => (x >= 100 ? 100 : x + 2)), 60);
        return () => clearInterval(id);
      }, [viz]);
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">{viz.caption}</div>
          <div className="space-y-3">
            {viz.racers.map((r, i) => {
              const t = TONE[r.tone] || TONE.warn;
              const pct = Math.min(100, tick * r.speed);
              const done = pct >= 100;
              return (
                <div key={i}>
                  <div className="flex items-center justify-between mb-1">
                    <span className={`text-xs font-bold ${t.text}`}>{r.label}</span>
                    <span className="text-[10px] font-mono bg-slate-700 text-white px-2 py-0.5 rounded">{r.ms}</span>
                  </div>
                  <div className="h-4 bg-white rounded border border-slate-300 overflow-hidden">
                    <div className={`h-full ${t.bar} transition-all duration-100 flex items-center justify-end pr-1`} style={{ width: `${pct}%` }}>
                      {done && <span className="text-[9px] text-white font-bold">✓</span>}
                    </div>
                  </div>
                  <div className="text-[10px] text-slate-600 mt-1">{r.note}</div>
                </div>
              );
            })}
          </div>
          <div className="mt-3 text-[10px] text-center text-slate-600">
            같은 100만 행 — 커밋/인덱스 전략만 바꿔도 처리 시간이 갈린다
          </div>
        </div>
      );
    }

    function PragmaViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">{viz.caption}</div>
          <div className="space-y-1.5">
            {viz.items.map((it, i) => {
              const t = TONE[it.tone] || TONE.warn;
              return (
                <div key={i} className={`flex items-center gap-2 rounded border p-2 ${t.bg} ${t.border}`}>
                  <span className="flex-1 font-mono text-[11px] text-slate-800">{it.pragma}</span>
                  <span className={`text-[10px] ${t.text} text-right`}>{it.note}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function PaginateViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">{viz.caption}</div>
          <div className="space-y-3">
            {viz.rows.map((r, i) => (
              <div key={i} className="bg-white border border-slate-300 rounded p-2">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-xs font-bold text-slate-800">{r.label}</span>
                  <span className="text-[10px] font-mono text-slate-500">{r.offset}</span>
                </div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] w-14 text-rose-700">OFFSET</span>
                  <div className="flex-1 h-3 bg-slate-100 rounded overflow-hidden">
                    <div className="h-full bg-rose-500" style={{ width: `${r.off}%` }}></div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-[10px] w-14 text-emerald-700">keyset</span>
                  <div className="flex-1 h-3 bg-slate-100 rounded overflow-hidden">
                    <div className="h-full bg-emerald-500" style={{ width: `${r.key}%` }}></div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-3 text-[10px] text-center text-slate-600">
            OFFSET은 깊어질수록 늘어나고, keyset은 항상 짧다
          </div>
        </div>
      );
    }

    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => (
            <div key={i} className="flex items-start gap-2 bg-amber-50 border border-amber-300 rounded p-2">
              <span className="text-amber-700">{it.icon}</span>
              <div className="flex-1">
                <div className="text-xs font-bold text-amber-900">{it.label}</div>
                <div className="text-[10px] text-amber-800">{it.desc}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">방법</th><th className="py-1 pr-2">효과</th><th className="py-1">결과</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">대용량 · 벌크 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          {viz?.kind === 'race' && <RaceViz viz={viz} />}
          {viz?.kind === 'pragma' && <PragmaViz viz={viz} />}
          {viz?.kind === 'paginate' && <PaginateViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-[#003B57] text-white mb-1">Part V. 실전 활용 · V-2-1</span>
                <h1 className="text-2xl font-bold text-slate-900">대용량 · 벌크 처리</h1>
                <p className="text-sm text-slate-700/80">수백만 행을 빠르게 넣고 다루는 실전 기법</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                벌크 INSERT는 한 트랜잭션으로 묶어 fsync를 줄이고 executemany로 statement를 재사용한다. 초기 적재에만 synchronous=OFF·journal_mode=MEMORY를 쓰고 끝나면 원복한다. 인덱스는 적재 후 CREATE INDEX + ANALYZE. 대용량 조회는 OFFSET 대신 keyset과 커서 스트리밍. 대량 삭제 후 공간은 한산할 때 VACUUM으로 회수한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['bulk_insert', 'executemany', 'transaction', 'PRAGMA', 'index_after_load', 'keyset', 'VACUUM'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-2-2.html" className="underline hover:no-underline">다음: V-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
