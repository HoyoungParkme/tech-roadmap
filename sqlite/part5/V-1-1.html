  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    SQLite Chapter V-1-1 — 앱 내장 / 백업 · restore
    학습 목표: 앱 내장 사례, Online Backup API, VACUUM INTO, .backup, restore, integrity_check, 마이그레이션
    핵심: 실행 중 DB를 단순 복사하면 손상 / 안전한 스냅샷 방법을 골라 쓴다
    패턴: fastapi v1 — 좌(LiveDataPane: 위험한 복사 vs 안전한 백업 대비) / 우(VSCode CodeViewer)
    색상: slate (sqlite 도메인, #003B57)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      embed: {lang:'python', filename:'embed_app.py', lines:[
            '# Step 1. 애플리케이션에 SQLite 품기 (파일 하나가 DB 전부)',
            'import sqlite3',
            'from pathlib import Path',
            '',
            '# 앱 데이터 폴더에 DB 파일 하나만 두면 끝 (서버·포트 없음)',
            'DB_PATH = Path.home() / ".myapp" / "app.db"',
            'DB_PATH.parent.mkdir(parents=True, exist_ok=True)',
            '',
            'def get_conn() -> sqlite3.Connection:',
            '    # 앱 프로세스 안에서 직접 파일을 연다',
            '    conn = sqlite3.connect(DB_PATH)',
            '    # 내장 앱 권장 PRAGMA (실무 기본 세팅)',
            '    conn.execute("PRAGMA journal_mode = WAL;")   # 동시 읽기+쓰기',
            '    conn.execute("PRAGMA foreign_keys = ON;")     # 무결성 강제',
            '    conn.execute("PRAGMA busy_timeout = 5000;")   # 잠금 5초 대기',
            '    return conn',
            '',
            '# 최초 실행 시 스키마 생성 (앱에 스키마를 내장)',
            'def init_schema(conn: sqlite3.Connection) -> None:',
            '    conn.executescript(',
            '        "CREATE TABLE IF NOT EXISTS notes (id INTEGER PRIMARY KEY, body TEXT, created REAL)"',
            '    )',
            '',
            '# 테스트는 파일 대신 메모리 DB — CI에서 격리·초고속',
            'def get_test_conn() -> sqlite3.Connection:',
            '    return sqlite3.connect(":memory:")',
            '',
            '# 배포: 실행 파일 + app.db 만 함께 두면 이동 가능',
            '# 단, "실행 중인 app.db"를 그냥 복사하면 손상될 수 있다 (Step 2)',
      ]},
      unsafe: {lang:'bash', filename:'unsafe-backup.sh', lines:[
            '# Step 2. 하지 말아야 할 백업 — 실행 중 단순 파일 복사',
            '',
            '# 앱이 WAL 모드로 켜져 있으면 파일이 3개다',
            'ls -la ~/.myapp/',
            '#  app.db        <- 커밋된 페이지 (과거 시점일 수 있음)',
            '#  app.db-wal    <- 최근 변경분 (아직 app.db 에 병합 안 됨)',
            '#  app.db-shm    <- WAL 공유 메모리 인덱스',
            '',
            '# 위험 1) -wal 을 빼먹은 복사 → 최근 데이터 통째로 유실',
            'cp ~/.myapp/app.db  /backup/backup.db      # BAD',
            '',
            '# 위험 2) 복사 도중 앱이 체크포인트/쓰기 → 페이지 불일치 손상',
            'cp ~/.myapp/app.db* /backup/               # 여전히 BAD (원자성 없음)',
            '#  → 파일별 복사 시점이 어긋나 db 와 wal 버전이 안 맞음',
            '',
            '# 위험 3) rsync 도 마찬가지 — 스냅샷의 원자성을 보장하지 못함',
            'rsync -a ~/.myapp/app.db /backup/          # BAD (실행 중이면)',
            '',
            '# 복원해보면 무결성 검사에서 바로 드러난다',
            'sqlite3 /backup/backup.db "PRAGMA integrity_check;"',
            '#  → "*** in database main ***" 또는 "database disk image is malformed"',
            '',
            '# 결론: 실행 중 DB 는 "파일"이 아니라 "살아있는 상태"다.',
            '#       SQLite 가 아는 방식(Step 3)으로 떠야 안전하다.',
      ]},
      safe: {lang:'python', filename:'safe_backup.py', lines:[
            '# Step 3. 안전한 백업 3종 (실행 중에도 OK)',
            'import sqlite3',
            '',
            '# 방법 A) Online Backup API — 실행 중 안전 복사 + 진행률',
            'def backup_online(src_path: str, dst_path: str) -> None:',
            '    src = sqlite3.connect(src_path)',
            '    dst = sqlite3.connect(dst_path)',
            '    with dst:',
            '        # pages=매 스텝 복사 페이지, 0 이하면 한 번에',

        viz: {
          kind: 'pitfalls',
          items: [
            { icon: '⚠', label: 'user_version 미사용', desc: '버전 없이 ALTER → 어디까지 적용됐는지 모름' },
            { icon: '⚠', label: '마이그레이션 순서', desc: 'user_version 무시 → 되돌리기 불가' },
            { icon: '⚠', label: '중복 적용', desc: '이미 올린 버전 재실행 → 오류·중복 인덱스' },
          ],
        },
        verdict: '건너뜀 처리',
        verdictTone: 'warn',
        keyPoint: '이미 적용된 버전을 건너뛰게 만들면 마이그레이션을 몇 번 돌려도 안전하다.',
        code: {...CODE.migrate, highlight:[15,16,17,18,19]},
      },
      { ...S5,
        beat:{ label:'트랜잭션 안에서 올린다', at:'migrate.py L20–23',
               caption:'with conn 블록 안에서 스키마 변경과 버전 기록을 함께 커밋한다. 실패하면 둘 다 롤백된다.',
               changes:[{mark:'new',     text:'with conn — 실패 시 롤백'},
                        {mark:'changed', text:'user_version = target'},
                        {mark:'gone',    text:'반쯤 적용된 스키마'}] },
        viz: {
          kind: 'pitfalls',
          items: [
            { icon: '⚠', label: 'user_version 미사용', desc: '버전 없이 ALTER → 어디까지 적용됐는지 모름' },
            { icon: '⚠', label: '마이그레이션 순서', desc: 'user_version 무시 → 되돌리기 불가' },
            { icon: '⚠', label: '중복 적용', desc: '이미 올린 버전 재실행 → 오류·중복 인덱스' },
            { icon: '⚠', label: '트랜잭션 없이 ALTER', desc: '중간 실패 시 반쯤 적용된 스키마' },
          ],
        },
        verdict: '롤백 보장',
        verdictTone: 'warn',
        keyPoint: 'SQL 적용과 버전 기록을 한 트랜잭션에 묶어야 상태가 어긋나지 않는다.',
        code: {...CODE.migrate, highlight:[20,21,22,23]},
      },
      { ...S5,
        beat:{ label:'백업 → 적용 → 검증 순으로', at:'migrate.py L25–28 · L30 · L32',
               caption:'마이그레이션 직전 VACUUM INTO 로 스냅샷을 뜨고, 끝나면 integrity_check 로 확인한다.',
               changes:[{mark:'new',  text:'app.pre-migrate.db 스냅샷'},
                        {mark:'read', text:'끝나고 integrity_check'},
                        {mark:'gone', text:'백업 없는 배포'}] },
        viz: {
          kind: 'pitfalls',
          items: [
            { icon: '⚠', label: '실행 중 단순 복사', desc: 'cp app.db → 페이지 불일치 손상' },
            { icon: '⚠', label: '-wal 누락 복사', desc: 'db 만 복사 → 최근 데이터 유실' },
            { icon: '⚠', label: '마이그레이션 순서', desc: 'user_version 무시 → 되돌리기 불가' },
            { icon: '⚠', label: '백업 검증 생략', desc: 'integrity_check 안 함 → 복원 때 발견' },
          ],
        },
        verdict: '함정 주의',
        verdictTone: 'warn',
        summary: {
          title: 'V-1-1 앱 내장 / 백업 · restore 정리',
          rows: [
            { metric: '단순 파일 복사', before: 'cp app.db', after: '-wal 누락/불일치', delta: '손상' },
            { metric: 'Online Backup API', before: 'src.backup(dst)', after: '실행 중 안전', delta: '실시간' },
            { metric: 'VACUUM INTO', before: '단일 파일', after: '조각 제거 스냅샷', delta: '아카이브' },
            { metric: '.backup CLI', before: 'sqlite3 .backup', after: 'Backup API 래핑', delta: '스크립트' },
            { metric: 'restore', before: '종료→교체→검사', after: 'integrity_check ok', delta: '검증' },
          ],
        },
        keyPoint: '백업은 SQLite 방식으로 뜨고, 복원은 순서 지켜 검증까지. 다음(V-1-2)에서 실전 운영 패턴을 이어간다.',
        code: {...CODE.migrate, highlight:[25,26,27,28,30,32]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function EmbedCasesViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">SQLite를 그대로 심는 5가지 현장</div>
          <div className="grid grid-cols-1 gap-2">
            {viz.cases.map((c, i) => (
              <div key={i} className="flex items-center gap-3 bg-white border border-slate-300 rounded p-2">
                <span className="text-xl">{c.icon}</span>
                <div className="flex-1">
                  <div className="text-xs font-bold text-slate-800">{c.label}</div>
                  <div className="text-[10px] text-slate-600">{c.desc}</div>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-3 text-[10px] text-center text-slate-600">
            공통점: 데이터가 파일 하나(.db)에 전부 → 백업·복원이 곧 운영
          </div>
        </div>
      );
    }

    function CopyContrastViz({ viz }) {
      const isUnsafe = viz.mode === 'unsafe';
      const res = TONE[viz.result.tone] || TONE.warn;
      return (
        <div className={`rounded-lg border p-4 ${isUnsafe ? 'bg-rose-50/40 border-rose-300' : 'bg-emerald-50/40 border-emerald-300'}`}>
          <div className="text-xs font-mono text-slate-800 bg-white border border-slate-300 rounded px-2 py-1 mb-3">{viz.title}</div>

          {isUnsafe ? (
            <div className="space-y-2">
              {viz.files.map((f, i) => {
                const t = TONE[f.tone] || TONE.warn;
                return (
                  <div key={i} className={`flex items-center gap-2 rounded border p-2 ${t.bg} ${t.border}`}>
                    <span className={`text-lg ${f.copied ? 'animate-pulse' : ''}`}>{f.copied ? '📄' : '❌'}</span>
                    <div className="flex-1">
                      <div className="text-xs font-mono font-bold text-slate-800">{f.name}</div>
                      <div className="text-[10px] text-slate-600">{f.note}</div>
                    </div>
                    <span className={`text-[10px] font-bold ${t.text}`}>{f.copied ? '복사됨' : '누락!'}</span>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="space-y-2">
              {viz.methods.map((m, i) => {
                const t = TONE[m.tone] || TONE.good;
                return (
                  <div key={i} className={`flex items-center gap-2 rounded border p-2 ${t.bg} ${t.border}`}>
                    <span className="text-lg">✅</span>
                    <div className="flex-1">
                      <div className="text-xs font-mono font-bold text-slate-800">{m.name}</div>
                      <div className="text-[10px] text-slate-600">{m.note}</div>
                    </div>
                    <span className={`text-[10px] font-bold ${t.text}`}>일관성 보장</span>
                  </div>
                );
              })}
            </div>
          )}

          <div className={`mt-3 text-center text-xs font-bold px-2 py-1.5 rounded border ${res.bg} ${res.border} ${res.text}`}>
            {isUnsafe ? '💥 ' : '🎯 '}{viz.result.text}
          </div>
        </div>
      );
    }

    function RestoreFlowViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">복원 순서 (어기면 또 손상)</div>
          <div className="space-y-2">
            {viz.steps.map((s, i) => {
              const t = TONE[s.tone] || TONE.good;
              return (
                <div key={i} className="flex items-center gap-2">
                  <span className={`w-6 h-6 shrink-0 rounded-full flex items-center justify-center text-[11px] font-bold ${t.badge}`}>{s.n}</span>
                  <div className={`flex-1 rounded border p-2 ${t.bg} ${t.border}`}>
                    <div className="text-xs font-bold text-slate-800">{s.label}</div>
                    <div className="text-[10px] text-slate-600">{s.desc}</div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-3 flex items-center justify-between bg-white border border-emerald-300 rounded px-2 py-1.5">
            <span className="text-[10px] font-mono text-slate-700">{viz.check.pragma}</span>
            <span className="text-[10px] font-mono font-bold bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded">{viz.check.ok}</span>
          </div>
        </div>
      );
    }

    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => (
            <div key={i} className="flex items-start gap-2 bg-amber-50 border border-amber-300 rounded p-2">
              <span className="text-amber-700">{it.icon}</span>
              <div className="flex-1">
                <div className="text-xs font-bold text-amber-900">{it.label}</div>
                <div className="text-[10px] text-amber-800">{it.desc}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">방법</th><th className="py-1 pr-2">효과</th><th className="py-1">결과</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">백업 · restore 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {viz?.kind === 'embed-cases' && <EmbedCasesViz viz={viz} />}
          {viz?.kind === 'copy-contrast' && <CopyContrastViz viz={viz} />}
          {viz?.kind === 'restore-flow' && <RestoreFlowViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-[#003B57] text-white mb-1">Part V. 실전 활용 · V-1-1</span>
                <h1 className="text-2xl font-bold text-slate-900">앱 내장 / 백업 · restore</h1>
                <p className="text-sm text-slate-700/80">애플리케이션에 SQLite를 품고 안전하게 백업한다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                SQLite는 파일 하나에 데이터 전부 → 백업·복원이 곧 운영. 실행 중 단순 복사는 손상. Online Backup API·VACUUM INTO·.backup 으로 일관된 스냅샷을 뜬다. 복원은 종료→교체→WAL 정리→integrity_check 순서. 마이그레이션 전 백업, 백업은 검증까지가 백업.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Embedded', 'WAL', 'BackupAPI', 'VACUUM_INTO', 'restore', 'integrity_check', 'migration'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./V-1-2.html" className="underline hover:no-underline">다음: V-1-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
