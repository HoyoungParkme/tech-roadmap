  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>

<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    SQLite Chapter II-2-1 — 트랜잭션과 SAVEPOINT
    학습 목표: BEGIN/COMMIT/ROLLBACK, 자동 커밋 vs 명시적 트랜잭션,
              SAVEPOINT/RELEASE/ROLLBACK TO(부분 롤백), 트랜잭션 유형(DEFERRED/IMMEDIATE/EXCLUSIVE)
    트랜잭션 = 여러 쓰기를 하나의 원자적 단위로. 전부 반영되거나 전부 취소.
    패턴: fastapi v1 — 좌(LiveDataPane: 원장/롤백/세이브포인트 애니메이션) / 우(VSCode CodeViewer)
    색상: slate + sqlite 도메인색 #003B57
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang:'sql', filename:'autocommit-vs-tx.sql', lines:[
            '-- Step 1. 자동 커밋 vs 명시적 트랜잭션',
            '',
            '-- 테스트 테이블',
            'CREATE TABLE events (',
            '    id      INTEGER PRIMARY KEY,',
            '    name    TEXT NOT NULL,',
            '    payload TEXT',
            ');',
            '',
            '-- (나쁨) 자동 커밋 모드에서 1만 INSERT',
            '-- 문장마다 암묵적 COMMIT + 디스크 fsync 발생',
            "INSERT INTO events(name, payload) VALUES ('login', 'u1');",
            "INSERT INTO events(name, payload) VALUES ('login', 'u2');",
            '-- ... 1만 번 반복 ...',
            '-- => 매 문장 fsync 1만 회. 약 9초. 디스크가 병목.',
            '',
            '-- (좋음) 하나의 트랜잭션으로 묶기',
            'BEGIN;',
            "INSERT INTO events(name, payload) VALUES ('login', 'u1');",
            "INSERT INTO events(name, payload) VALUES ('login', 'u2');",
            '-- ... 1만 번 반복 ...',
            'COMMIT;',
            '-- => fsync는 COMMIT 시 단 1회. 약 0.12초. 약 75배 빠름.',
            '',
            '-- 자동 커밋 여부 확인 (sqlite3 CLI)',
            '-- .databases  또는  PRAGMA 로 상태 점검',
            '-- 트랜잭션이 열려 있으면 sqlite3_get_autocommit() == 0',
            '',
            '-- 실무 팁',
            '-- 1) ORM/드라이버는 보통 자동 커밋이 켜져 있다',
            '-- 2) 대량 적재는 반드시 명시적 트랜잭션으로 감싼다',
            '-- 3) WAL 모드 + 트랜잭션 묶기 = 쓰기 처리량 극대화',
            '',
            '-- 다음 Step: 원자성 — 여러 UPDATE를 전부 반영 또는 전부 취소',
      ]},
      s2: {lang:'sql', filename:'transfer-commit.sql', lines:[
            '-- Step 2. BEGIN..COMMIT 로 원자적 이체',
            '',
            'CREATE TABLE accounts (',
            '    id      INTEGER PRIMARY KEY,',
            '    owner   TEXT NOT NULL,',
            '    balance INTEGER NOT NULL CHECK (balance >= 0)',
            ');',
            "INSERT INTO accounts(id, owner, balance) VALUES (1, 'A', 1000), (2, 'B', 500);",
            '',
            '-- A -> B 로 200 이체',
            'BEGIN;',
            '    UPDATE accounts SET balance = balance - 200 WHERE id = 1;',
            '    UPDATE accounts SET balance = balance + 200 WHERE id = 2;',
            'COMMIT;',
            '',
            '-- 확인: 합계는 항상 1500 으로 보존',
            'SELECT owner, balance FROM accounts ORDER BY id;',
            "-- A | 800",
            "-- B | 700",
            '',
            '-- 왜 원자적인가',
            '-- 1) COMMIT 전에는 두 UPDATE가 아직 확정 아님',
            '-- 2) 다른 연결은 이전 값(1000/500)만 본다 (스냅샷)',
            '-- 3) COMMIT 순간 둘 다 동시에 반영',
            '',
            '-- CHECK 제약과의 조합',
            '-- balance >= 0 위반 시 해당 UPDATE 가 실패',
            '-- 실패를 감지하면 COMMIT 대신 ROLLBACK 해야 함 (다음 Step)',
            '',
            '-- 안티패턴: 트랜잭션 없이 두 문장 실행',
            '-- UPDATE accounts SET balance = balance - 200 WHERE id = 1;  -- (성공)',
            '--   여기서 프로세스 크래시!',
            '-- UPDATE accounts SET balance = balance + 200 WHERE id = 2;  -- (미실행)',
            '-- => 200원 증발. 절대 금지.',
            '',
            '-- 다음 Step: 도중 오류 시 ROLLBACK 으로 전부 취소',
      ]},
      s3: {lang:'sql', filename:'transfer-rollback.sql', lines:[
            '-- Step 3. 오류 시 ROLLBACK 으로 전체 취소',
            '',
            '-- 현재 상태: A=800, B=700',
            '-- A 에서 900 이체 시도 (잔액 부족 상황)',
            '',
            'BEGIN;',
            '    UPDATE accounts SET balance = balance - 900 WHERE id = 1;',

            { icon: '!', label: 'EXCLUSIVE', desc: '읽기까지 차단 — 일반 요청 경로에서 쓰면 서비스가 멈춘다' },
            { icon: '✓', label: '적절한 용도', desc: '스키마 마이그레이션, 일괄 재구축처럼 독점이 정당한 작업' },
          ],
        },
        verdict: 'EXCLUSIVE',
        verdictTone: 'warn',
        keyPoint: '세 유형의 차이는 "락을 언제, 어디까지 잡느냐" 하나뿐이다.',
        code: { ...CODE.s5, highlight: [17, 18, 19, 20] },
      },
      { ...S5,
        beat: {
          label: '함정 ①② 커밋과 BUSY',
          at: 'tx-types-pitfalls.sql L22–26',
          caption: '개별 커밋을 묶고, busy_timeout 과 WAL 로 경합을 흡수한다.',
          changes: [
            { mark: 'new', text: 'PRAGMA busy_timeout = 5000' },
            { mark: 'new', text: 'PRAGMA journal_mode = WAL' },
          ],
        },
        viz: {
          kind: 'pitfalls',
          items: [
            { icon: '!', label: '대량 INSERT 개별 커밋', desc: '문장마다 fsync → 수백 배 느림. BEGIN..COMMIT로 묶어라' },
            { icon: '!', label: 'SQLITE_BUSY 재시도', desc: 'busy_timeout 으로 대기 허용 + WAL 로 읽기/쓰기 동시성 확보' },
          ],
        },
        verdict: '함정 ①②',
        verdictTone: 'warn',
        keyPoint: 'busy_timeout 이 0이면 경합 즉시 실패한다. 실무에서는 반드시 설정한다.',
        code: { ...CODE.s5, highlight: [22, 23, 24, 25, 26] },
      },
      { ...S5,
        beat: {
          label: '함정 ③④⑤',
          at: 'tx-types-pitfalls.sql L28–35',
          caption: '롤백 누락, 긴 트랜잭션, 격리 오해 — 남은 세 함정을 한 번에 정리한다.',
          changes: [
            { mark: 'gone', text: '롤백 누락 → 락 유지' },
            { mark: 'gone', text: '긴 트랜잭션 → WAL 무한 성장' },
            { mark: 'read', text: 'writer 는 언제나 하나' },
          ],
        },
        viz: {
          kind: 'pitfalls',
          items: [
            { icon: '!', label: '대량 INSERT 개별 커밋', desc: '문장마다 fsync → 수백 배 느림. BEGIN..COMMIT로 묶어라' },
            { icon: '!', label: '트랜잭션 없이 동시 쓰기', desc: 'DEFERRED가 늦게 락 승격 → 경합 시 SQLITE_BUSY. IMMEDIATE 권장' },
            { icon: '!', label: '롤백 누락', desc: '예외 후 트랜잭션 방치 → 락 유지, 다음 연결 차단' },
            { icon: '!', label: '긴 트랜잭션', desc: 'WAL 무한 성장, 체크포인트 지연, 다른 writer 대기' },
            { icon: '!', label: '격리 오해', desc: 'SQLite 기본은 직렬화 수준. 한 번에 writer 하나만' },
          ],
        },
        verdict: '함정 주의',
        verdictTone: 'warn',
        summary: {
          title: 'II-2-1 트랜잭션과 SAVEPOINT 정리',
          rows: [
            { metric: '자동 커밋', before: '문장마다', after: '매번 fsync', delta: '대량시 느림' },
            { metric: 'BEGIN..COMMIT', before: '원자적', after: '전부 반영', delta: '일관성' },
            { metric: 'ROLLBACK', before: '전체 취소', after: '원상복구', delta: '재시도 안전' },
            { metric: 'SAVEPOINT', before: '부분 롤백', after: '일부만 취소', delta: '세밀 제어' },
            { metric: 'BEGIN 유형', before: 'DEFERRED 기본', after: 'IMMEDIATE 권장', delta: '락 시점 제어' },
          ],
        },
        keyPoint: '유형으로 락 시점을 제어(IMMEDIATE). 긴 트랜잭션/롤백 누락/개별 커밋을 피하라. 다음(II-2-2) 격리 수준.',
        code: { ...CODE.s5, highlight: [28, 29, 30, 31, 32, 33, 34, 35] },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function CommitCompareViz({ viz }) {
      const maxMs = Math.max(...viz.rows.map((r) => r.ms));
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-3">
          <div className="text-xs text-slate-600">1만 건 적재 — fsync 횟수와 소요 시간</div>
          {viz.rows.map((r, i) => {
            const t = TONE[r.tone] || TONE.warn;
            return (
              <div key={i} className={`rounded border p-2 ${t.bg} ${t.border}`}>
                <div className="flex items-center justify-between mb-1">
                  <span className={`text-xs font-bold ${t.text}`}>{r.label}</span>
                  <span className="text-[10px] font-mono bg-slate-700 text-white px-2 py-0.5 rounded">{r.ms} ms</span>
                </div>
                <div className="text-[10px] text-slate-600 mb-1 font-mono">{r.detail}</div>
                <div className="flex items-center gap-2">
                  <div className="flex-1 h-3 bg-white rounded border border-slate-300 overflow-hidden">
                    <div className={`h-full ${r.tone === 'good' ? 'bg-emerald-500' : 'bg-rose-500'}`} style={{ width: `${Math.max(2, (r.ms / maxMs) * 100)}%` }}></div>
                  </div>
                  <span className="text-[10px] font-mono text-slate-600 w-24 text-right">fsync {r.fsync.toLocaleString()}회</span>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function LedgerViz({ viz }) {
      const rolled = viz.outcome === 'rolledback';
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-3">
          <div className="flex justify-center gap-3">
            {viz.accounts.map((a) => {
              const changed = a.before !== a.after;
              return (
                <div key={a.name} className="bg-white border border-slate-300 rounded p-3 text-center min-w-[110px]">
                  <div className="text-[10px] text-slate-500 mb-1">{a.name}</div>
                  <div className="text-xs font-mono text-slate-400 line-through">{a.before.toLocaleString()}</div>
                  <div className={`text-lg font-mono font-bold ${changed ? (rolled ? 'text-slate-700' : 'text-emerald-700') : 'text-slate-700'}`}>
                    {a.after.toLocaleString()}
                  </div>
                </div>
              );
            })}
          </div>
          <div className="space-y-1">
            {viz.ops.map((op, i) => {
              const isBegin = op === 'BEGIN';
              const isCommit = op === 'COMMIT';
              const isRollback = op === 'ROLLBACK';
              const isErr = op.indexOf('위반') !== -1;
              let cls = 'bg-white border-slate-300 text-slate-700';
              if (isBegin) cls = 'bg-slate-700 text-white border-slate-800';
              else if (isCommit) cls = 'bg-emerald-500 text-white border-emerald-700';
              else if (isRollback) cls = 'bg-rose-500 text-white border-rose-700';
              else if (isErr) cls = 'bg-amber-100 text-amber-800 border-amber-400';
              const struck = rolled && !isBegin && !isRollback && !isErr;
              return (
                <div key={i} className={`text-xs font-mono px-3 py-1 rounded border ${cls} ${struck ? 'line-through opacity-60' : ''}`}>{op}</div>
              );
            })}
          </div>
          <div className={`text-center text-xs px-2 py-1 rounded border font-bold ${rolled ? 'bg-rose-100 text-rose-800 border-rose-300' : 'bg-emerald-100 text-emerald-800 border-emerald-300'}`}>
            {rolled ? '취소됨' : '확정됨'} · {viz.note}
          </div>
        </div>
      );
    }

    function SavepointViz({ viz }) {
      const STATE_CLS = {
        kept:       'bg-emerald-50 border-emerald-300 text-emerald-900',
        rolledback: 'bg-rose-50 border-rose-300 text-rose-800 line-through opacity-70',
        action:     'bg-slate-700 border-slate-800 text-white',
      };
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-2">
          <div className="text-xs text-slate-600 mb-1">트랜잭션 타임라인 (위에서 아래로 실행)</div>
          {viz.frames.map((f, i) => (
            <div key={i} className="flex items-stretch gap-2">
              <span className="text-[10px] font-mono text-slate-500 w-16 flex items-center justify-end pr-1">{f.sp}</span>
              <div className={`flex-1 text-xs font-mono px-3 py-1.5 rounded border ${STATE_CLS[f.state]}`}>{f.op}</div>
            </div>
          ))}
          <div className="text-center text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded border border-emerald-300 font-bold">
            {viz.note}
          </div>
        </div>
      );
    }

    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => (
            <div key={i} className="flex items-start gap-2 bg-amber-50 border border-amber-300 rounded p-2">
              <span className="text-amber-700 font-bold w-4 text-center">{it.icon}</span>
              <div className="flex-1">
                <div className="text-xs font-bold text-amber-900">{it.label}</div>
                <div className="text-[10px] text-amber-800">{it.desc}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">분류</th><th className="py-1 pr-2">성격</th><th className="py-1 pr-2">효과</th><th className="py-1">결과</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">트랜잭션 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {viz?.kind === 'commit-compare' && <CommitCompareViz viz={viz} />}
          {viz?.kind === 'ledger' && <LedgerViz viz={viz} />}
          {viz?.kind === 'savepoint' && <SavepointViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <span className="inline-block text-[10px] font-bold px-2 py-0.5 rounded bg-[#003B57] text-white mb-1">Part II. SQL 문법과 트랜잭션</span>
                <h1 className="text-2xl font-bold text-slate-900">II-2-1. 트랜잭션과 SAVEPOINT</h1>
                <p className="text-sm text-slate-700/80">여러 작업을 하나로 묶고, 부분 롤백까지</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                트랜잭션은 여러 쓰기를 원자적으로 묶는다. BEGIN..COMMIT은 전부 반영, ROLLBACK은 전부 취소, SAVEPOINT/ROLLBACK TO는 일부만 취소. 대량 쓰기는 한 트랜잭션으로 묶어 fsync를 줄이고, read-modify-write는 IMMEDIATE로 연다. 긴 트랜잭션과 롤백 누락은 락 문제를 부른다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['BEGIN', 'COMMIT', 'ROLLBACK', 'SAVEPOINT', 'IMMEDIATE', 'WAL'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-2-2.html" className="underline hover:no-underline">다음: II-2-2 격리 수준과 동시성 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
