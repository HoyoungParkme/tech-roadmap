            '-- (4) 인덱스 없는 JOIN — FK 컬럼에 인덱스',
            'EXPLAIN QUERY PLAN',
            'SELECT u.name, o.total',
            'FROM users u JOIN orders o ON o.user_id = u.id;',
            '-- SCAN orders  <- user_id 인덱스 없으면 풀스캔',
            'CREATE INDEX idx_orders_user_id ON orders(user_id);',
            '-- 이후: SEARCH orders USING INDEX idx_orders_user_id',
            '',
            '-- 다음 챕터: 데이터 변경 (II-1-2 INSERT/UPDATE/DELETE)',
          ],
          highlight: [2, 3, 4, 5, 6, 7, 9, 10, 11, 12, 13, 14],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function PipelineViz({ viz }) {
      const maxRows = viz.stages[0].rows;
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">SELECT 실행 순서 · 단계마다 남는 행</div>
          <div className="space-y-1.5">
            {viz.stages.map((s, i) => {
              const pct = Math.max(4, (s.rows / maxRows) * 100);
              return (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-[10px] font-mono text-white bg-[#003B57] rounded-full w-4 h-4 flex items-center justify-center flex-shrink-0">{i + 1}</span>
                  <span className="text-[10px] font-mono text-slate-800 w-40 truncate">{s.clause}</span>
                  <div className="flex-1 h-3 bg-white rounded border border-slate-300 overflow-hidden">
                    <div className="h-full bg-[#0a6ea3]" style={{ width: pct + '%' }}></div>
                  </div>
                  <span className="text-[10px] font-mono w-12 text-right text-slate-700">{s.rows}행</span>
                </div>
              );
            })}
          </div>
          <div className="mt-3 text-[10px] text-center text-slate-600">
            WHERE는 그룹 전(행 필터) · HAVING은 그룹 후(그룹 필터)
          </div>
        </div>
      );
    }

    function JoinViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs font-mono text-slate-800 mb-3">{viz.joinType} · users ⋈ orders</div>
          <div className="flex items-start justify-between gap-2">
            <div className="flex-1">
              <div className="text-[10px] text-slate-500 mb-1">users (일)</div>
              {viz.left.map((r) => (
                <div key={r.id} className="text-[10px] font-mono bg-white border border-slate-300 rounded px-2 py-1 mb-1 flex justify-between">
                  <span className="text-[#003B57] font-bold">id={r.id}</span><span>{r.name}</span>
                </div>
              ))}
            </div>
            <div className="flex-1">
              <div className="text-[10px] text-slate-500 mb-1">orders (다)</div>
              {viz.right.map((r, i) => (
                <div key={i} className="text-[10px] font-mono bg-white border border-slate-300 rounded px-2 py-1 mb-1 flex justify-between">
                  <span className="text-[#003B57] font-bold">uid={r.user_id}</span><span>{r.total}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="mt-2 text-[10px] text-center text-slate-500">ON o.user_id = u.id ↓</div>
          <div className="mt-1 rounded border border-emerald-300 bg-emerald-50 p-2">
            <div className="text-[10px] text-emerald-700 mb-1">결과 (matched)</div>
            {viz.result.map((r, i) => (
              <div key={i} className="text-[10px] font-mono bg-white border border-emerald-200 rounded px-2 py-1 mb-1 flex justify-between">
                <span className="font-bold text-slate-800">{r.name}</span><span className="text-emerald-800">{r.total}</span>
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-center text-rose-700 bg-rose-50 border border-rose-200 rounded py-1">
            {viz.dropped}
          </div>
        </div>
      );
    }

    function AggregateViz({ viz }) {
      const maxSum = Math.max(...viz.groups.map((g) => g.sum));
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">GROUP BY city · {viz.agg}</div>
          <div className="space-y-2">
            {viz.groups.map((g, i) => (
              <div key={i} className="bg-white border border-slate-300 rounded p-2">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[11px] font-bold text-[#003B57]">{g.key}</span>
                  <span className="text-[10px] font-mono text-slate-700">{viz.agg} = {g.sum}</span>
                </div>
                <div className="flex items-center gap-1.5">
                  {g.members.map((m, j) => (
                    <span key={j} className="text-[9px] font-mono bg-slate-100 border border-slate-300 rounded px-1.5 py-0.5 text-slate-600">{m}</span>
                  ))}
                  <span className="text-[9px] text-slate-400">→</span>
                  <div className="flex-1 h-2.5 bg-slate-100 rounded overflow-hidden">
                    <div className="h-full bg-[#0a6ea3]" style={{ width: (g.sum / maxSum) * 100 + '%' }}></div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="mt-3 text-[10px] text-center text-slate-600">여러 행 → 그룹마다 한 값으로 접힌다</div>
        </div>
      );
    }

    function CteViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">WITH 파이프라인 · 위에서 아래로</div>
          <div className="space-y-2">
            {viz.stages.map((s, i) => (
              <div key={i}>
                <div className="bg-white border border-slate-300 rounded p-2.5 flex items-center gap-2">
                  <span className="text-[10px] font-mono text-white bg-[#003B57] rounded px-2 py-0.5 flex-shrink-0">{s.name}</span>
                  <span className="text-[10px] text-slate-700 flex-1">{s.desc}</span>
                  <span className="text-[10px] font-mono text-emerald-700 bg-emerald-50 border border-emerald-200 rounded px-1.5">{s.out}</span>
                </div>
                {i < viz.stages.length - 1 && <div className="text-center text-slate-400 text-xs leading-none">↓</div>}
              </div>
            ))}
          </div>
          <div className="mt-3 text-[10px] text-center text-slate-600">중간 결과에 이름을 붙여 다음 단계가 참조</div>
        </div>
      );
    }

    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => (
            <div key={i} className="flex items-start gap-2 bg-amber-50 border border-amber-300 rounded p-2">
              <span className="text-amber-700">{it.icon}</span>
              <div className="flex-1">
                <div className="text-xs font-bold text-amber-900">{it.label}</div>
                <div className="text-[10px] text-amber-800">{it.desc}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">분류</th><th className="py-1 pr-2">상태</th><th className="py-1 pr-2">설명</th><th className="py-1">핵심</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">조회 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          {viz?.kind === 'pipeline' && <PipelineViz viz={viz} />}
          {viz?.kind === 'join' && <JoinViz viz={viz} />}
          {viz?.kind === 'aggregate' && <AggregateViz viz={viz} />}
          {viz?.kind === 'cte' && <CteViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <div className="text-[11px] font-bold text-[#003B57] tracking-wide">Part II. SQL 문법과 트랜잭션 · II-1-1</div>
                <h1 className="text-2xl font-bold text-slate-900">SELECT와 JOIN</h1>
                <p className="text-sm text-slate-700/80">데이터를 조회하고 여러 테이블을 잇는다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                SELECT는 FROM→WHERE→GROUP BY→HAVING→SELECT→ORDER BY→LIMIT 순으로 실행된다. JOIN은 INNER(교집합)·LEFT(왼쪽 보존)·CROSS(모든 조합)로 나뉘고, 집계는 GROUP BY로 묶어 요약한다. CTE로 단계를 조립하면 가독성이 좋다. 함정: 조건 위치(ON vs WHERE), ON 누락, N+1, JOIN 키 인덱스.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['SELECT', 'JOIN', 'GROUP BY', 'HAVING', 'CTE', 'subquery', 'INNER', 'LEFT'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./II-1-2.html" className="underline hover:no-underline">다음: II-1-2 데이터 변경 (INSERT/UPDATE/DELETE) →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
