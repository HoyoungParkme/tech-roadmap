  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    SQLite Chapter II-2-2 — PRAGMA 활용
    학습 목표: PRAGMA 개념, foreign_keys, journal_mode=WAL, synchronous, 정보 조회, 영구 vs 연결별
    PRAGMA = SQLite 엔진을 제어·조회하는 특수 명령 (표준 SQL 아님)
    패턴: fastapi v1 — 좌(LiveDataPane: PRAGMA 토글 대비) / 우(VSCode CodeViewer, sql)
    색상: slate + SQLite 강조색 #003B57
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      s1: {lang:'sql', filename:'pragma-intro.sql', lines:[
            '-- Step 1. PRAGMA 기본 사용법',
            '',
            '-- 문법: PRAGMA name;        (조회)',
            '--       PRAGMA name = value; (설정)',
            '',
            '-- 현재 값 조회 (= 없이)',
            'PRAGMA foreign_keys;      -- 결과: 0 (OFF) 또는 1 (ON)',
            'PRAGMA journal_mode;      -- 결과: delete / wal / memory ...',
            'PRAGMA synchronous;       -- 결과: 0=OFF 1=NORMAL 2=FULL',
            'PRAGMA cache_size;        -- 결과: 페이지 수 (음수면 KB)',
            '',
            '-- 값 설정 (= 사용)',
            'PRAGMA foreign_keys = ON;',
            'PRAGMA busy_timeout = 5000;   -- lock 5초 대기',
            '',
            '-- 한 번에 여러 개 (연결 초기화 루틴에서 자주)',
            'PRAGMA journal_mode = WAL;',
            'PRAGMA synchronous  = NORMAL;',
            'PRAGMA foreign_keys = ON;',
            'PRAGMA busy_timeout = 5000;',
            '',
            '-- 조회형 PRAGMA 는 테이블처럼 SELECT 가능',
            'SELECT * FROM pragma_table_info("users");',
            '',
            '-- 왜 중요한가?',
            '-- 1) 표준 SQL 밖의 SQLite 고유 동작을 켠다',
            '-- 2) 성능(WAL, cache)과 안정성(synchronous)의 다이얼',
            '-- 3) 일부는 파일에 남고, 일부는 연결마다 리셋된다',
            '',
            '-- 다음 Step: 가장 많이 실수하는 foreign_keys',
      ]},
      s2: {lang:'sql', filename:'foreign-keys.sql', lines:[
            '-- Step 2. foreign_keys — 외래키 강제',
            '',
            '-- 스키마에 REFERENCES 를 써도...',
            'CREATE TABLE users (',
            '    id   INTEGER PRIMARY KEY,',
            '    name TEXT',
            ');',
            'CREATE TABLE orders (',
            '    id      INTEGER PRIMARY KEY,',
            '    user_id INTEGER REFERENCES users(id),',
            '    total   REAL',
            ');',
            '',
            '-- 기본 상태(OFF)에서는 고아 행이 들어간다',
            'PRAGMA foreign_keys;   -- 0  (OFF)',
            'INSERT INTO orders(user_id, total) VALUES (999, 10.0);',
            '-- => 성공. user 999 는 없는데도 삽입됨 (데이터 오염)',
            '',
            '-- 외래키 검사 켜기 (연결별!)',
            'PRAGMA foreign_keys = ON;',
            'INSERT INTO orders(user_id, total) VALUES (999, 10.0);',
            '-- => Error: FOREIGN KEY constraint failed',
            '',
            '-- 주의: 다음 연결에서는 다시 OFF 로 리셋된다',
            '-- 애플리케이션 연결 초기화 예 (Python sqlite3)',
            '-- conn = sqlite3.connect("app.db")',
            '-- conn.execute("PRAGMA foreign_keys = ON")',
            '',
            '-- 커넥션 풀(SQLAlchemy)이면 connect 이벤트에 등록',
            '-- @event.listens_for(engine, "connect")',
            '-- def _fk_on(dbapi_conn, _):',
            '--     dbapi_conn.execute("PRAGMA foreign_keys=ON")',
            '',
            '-- 이미 들어간 고아 행 점검',
            'PRAGMA foreign_key_check;',
            '-- => 위반 행 목록 (table, rowid, parent, fkid)',
            '',
            '-- 다음 Step: 성능·안정성 다이얼 (WAL, synchronous)',
      ]},
      s3: {lang:'sql', filename:'wal-synchronous.sql', lines:[
            '-- Step 3. WAL 과 synchronous',
            '',
            '-- 저널 모드 확인',
            'PRAGMA journal_mode;   -- delete (기본)',
            '',
            '-- WAL 로 전환 — 이 설정은 DB 파일에 영구 저장',
            'PRAGMA journal_mode = WAL;',
            '-- => wal (한 번만 걸면 이후 연결에도 유지)',
            '-- 부수 파일 생성: app.db-wal, app.db-shm',
            '',
            '-- WAL 장점: 읽기와 쓰기가 서로 막지 않음 (동시성↑)',
            '-- 단점: 파일 3개 세트 이동 필요, 네트워크 FS 부적합',
            '',
            '-- synchronous — 디스크 flush 강도 (연결별!)',
            'PRAGMA synchronous = NORMAL;   -- WAL 과 궁합 좋음',

        code: { ...CODE.s5, highlight: [35, 36, 37, 38] },
      },

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function CatalogViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-2">대표 PRAGMA 지도</div>
          <div className="space-y-1.5">
            {viz.items.map((it, i) => (
              <div key={i} className="flex items-center gap-2 bg-white border border-slate-300 rounded p-2">
                <span className="font-mono text-[11px] font-bold text-[#003B57] w-28">{it.name}</span>
                <span className={`text-[10px] px-1.5 py-0.5 rounded ${it.kind === '조회' ? 'bg-sky-100 text-sky-800' : 'bg-slate-200 text-slate-700'}`}>{it.kind}</span>
                <span className={`text-[10px] px-1.5 py-0.5 rounded ${it.scope === '영구' ? 'bg-emerald-100 text-emerald-800' : it.scope === '연결별' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-500'}`}>{it.scope}</span>
                <span className="text-[10px] text-slate-600 flex-1 text-right">{it.note}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ToggleViz({ viz }) {
      const cell = (side) => {
        const t = TONE[side.tone];
        return (
          <div className={`flex-1 rounded border p-3 ${t.bg} ${t.border}`}>
            <div className="flex items-center justify-between mb-1">
              <span className={`text-xs font-bold ${t.text}`}>{side.label}</span>
              <span className={`text-sm ${side.ok ? 'text-emerald-600' : 'text-rose-500'}`}>{side.ok ? '🛡' : '⚠'}</span>
            </div>
            <div className="font-mono text-[10px] text-slate-800 bg-white/70 rounded px-2 py-1 mb-1">{side.rows}</div>
            <div className={`text-[10px] ${t.text}`}>{side.note}</div>
          </div>
        );
      };
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs font-mono text-slate-800 mb-2">PRAGMA {viz.pragma}</div>
          <div className="flex gap-2">
            {cell(viz.off)}
            {cell(viz.on)}
          </div>
        </div>
      );
    }

    function PerfSafetyViz({ viz }) {
      const chip = (label, val) => {
        const color = val === '최고' || val === '높음' || val === '빠름' ? 'bg-emerald-100 text-emerald-800'
          : val === '위험' || val === '낮음' || val === '느림' ? 'bg-rose-100 text-rose-800'
          : 'bg-amber-100 text-amber-800';
        return <span className={`text-[10px] px-1.5 py-0.5 rounded ${color}`}>{label} {val}</span>;
      };
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-2">
          <div className="text-xs text-slate-600">journal_mode + synchronous 조합</div>
          {viz.modes.map((m, i) => {
            const t = TONE[m.tone];
            return (
              <div key={i} className={`rounded border p-2 ${t.bg} ${t.border}`}>
                <div className={`font-mono text-xs font-bold mb-1 ${t.text}`}>{m.name}</div>
                <div className="flex flex-wrap gap-1">
                  {chip('동시성', m.concur)}
                  {chip('안전성', m.safe)}
                  {chip('속도', m.speed)}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function IntrospectViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs font-mono text-slate-800 mb-2">{viz.query}</div>
          <div className="overflow-auto rounded border border-slate-300 bg-white">
            <table className="w-full text-[10px] font-mono">
              <thead>
                <tr className="bg-slate-100 text-slate-600 text-left">
                  {viz.cols.map((c) => (<th key={c} className="px-2 py-1">{c}</th>))}
                </tr>
              </thead>
              <tbody>
                {viz.rows.map((r, i) => (
                  <tr key={i} className="border-t border-slate-100">
                    {r.map((cell, j) => (
                      <td key={j} className={`px-2 py-1 ${j === 5 && cell === '1' ? 'text-[#003B57] font-bold' : j === 3 && cell === '1' ? 'text-amber-700' : 'text-slate-700'}`}>{cell}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="mt-2 text-[10px] text-slate-600">pk=1 은 기본키, notnull=1 은 NOT NULL 컬럼</div>
        </div>
      );
    }

    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => (
            <div key={i} className="flex items-start gap-2 bg-amber-50 border border-amber-300 rounded p-2">
              <span className="text-amber-700">{it.icon}</span>
              <div className="flex-1">
                <div className="text-xs font-bold text-amber-900">{it.label}</div>
                <div className="text-[10px] text-amber-800">{it.desc}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">PRAGMA</th><th className="py-1 pr-2">범위</th><th className="py-1 pr-2">설명</th><th className="py-1">권장</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-mono text-[10px] text-[#003B57]">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">PRAGMA 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {viz?.kind === 'catalog' && <CatalogViz viz={viz} />}
          {viz?.kind === 'toggle' && <ToggleViz viz={viz} />}
          {viz?.kind === 'perf-safety' && <PerfSafetyViz viz={viz} />}
          {viz?.kind === 'introspect' && <IntrospectViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#003B57] text-white">Part II. SQL 문법과 트랜잭션</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 font-mono">II-2-2</span>
                </div>
                <h1 className="text-2xl font-bold text-slate-900">PRAGMA 활용</h1>
                <p className="text-sm text-slate-700/80">SQLite를 제어하는 특수 명령들</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                PRAGMA는 SQLite 엔진 제어·조회 명령이다. journal_mode=WAL은 영구 저장이라 1회면 되고, foreign_keys·synchronous·busy_timeout·cache_size는 연결별이라 매 연결마다 재설정해야 한다. synchronous=OFF는 손상 위험, WAL 미설정은 동시성 저하. 연결 초기화 표준 세트로 고정하라.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['PRAGMA', 'foreign_keys', 'WAL', 'synchronous', 'busy_timeout', 'table_info', 'integrity_check'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part3/III-1-1.html" className="underline hover:no-underline">다음: III-1-1 인덱스 기초 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
