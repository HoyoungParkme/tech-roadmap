  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });

      setTimeout(focusFirst, 500);

  <!--
    SQLite Chapter I-2-1 — Single-writer 모델 + 파일 락 전이
    학습 목표: SHARED → RESERVED → PENDING → EXCLUSIVE 5단계 락 상태 추적
    핵심 시나리오: writer 1명 + reader 3명이 동시 접속하는 상황
    패턴: fastapi v1 — 좌(LiveDataPane: 락 상태/프로세스 시각화) / 우(VSCode CodeViewer)
    색상: SQLite navy (#003B57)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const STEPS = [
      {
        title: 'Step 1. UNLOCKED — 누구나 접근 가능',
        desc: '평상시 users.db는 락이 없다(UNLOCKED). 이 상태에서는 어떤 프로세스든 자유롭게 파일을 열 수 있다. 곧 reader 3명, writer 1명이 동시에 같은 파일을 열려고 시도한다고 가정하자. SQLite는 OS 파일 락으로 이 동시 접근을 안전하게 정리해야 한다.',
        lock: 'UNLOCKED',
        actors: [
          { kind: 'idle', label: 'Reader A', state: '대기 중', detail: 'sqlite3.connect()' },
          { kind: 'idle', label: 'Reader B', state: '대기 중', detail: 'sqlite3.connect()' },
          { kind: 'idle', label: 'Reader C', state: '대기 중', detail: 'sqlite3.connect()' },
          { kind: 'idle', label: 'Writer 1', state: '대기 중', detail: 'sqlite3.connect()' },
        ],
        keyPoint: 'UNLOCKED = 락 없음. OS 파일 락은 BEGIN/SELECT 시작될 때 잡힌다.',
        code: {
          lang: 'python',
          filename: 'open-connections.py',
          lines: [
            '"""',
            'Step 1. 같은 .db 파일에 여러 프로세스가 동시에 연결한다',
            '',
            '의존성: 표준 라이브러리 sqlite3',
            '"""',
            'import sqlite3',
            'from multiprocessing import Process',
            'from pathlib import Path',
            '',
            'DB_PATH = Path("users.db")',
            '',
            'def reader(name: str) -> None:',
            '    """파일을 열기만 하면 아직 락은 없다."""',
            '    conn = sqlite3.connect(DB_PATH)',
            '    # 아직 SELECT 도 안 했으므로 lock = UNLOCKED',
            '    conn.close()',
            '',
            'def writer() -> None:',
            '    """writer 도 연결만 한 상태."""',
            '    conn = sqlite3.connect(DB_PATH)',
            '    conn.close()',
            '',
            'if __name__ == "__main__":',
            '    procs = [',
            '        Process(target=reader, args=("A",)),',
            '        Process(target=reader, args=("B",)),',
            '        Process(target=reader, args=("C",)),',
            '        Process(target=writer),',
            '    ]',
            '    for p in procs: p.start()',
            '    for p in procs: p.join()',
            '',
            '# → 다음 단계 (Step 2): "reader 들이 SELECT 하면 SHARED 락"',
          ],
          highlight: [6, 7, 10, 12, 13, 14, 15, 18, 19, 20, 21],
        },
      },
      {
        title: 'Step 2. SHARED — reader 여러 명이 동시에 잡는다',
        desc: 'Reader A, B, C가 동시에 SELECT를 시작하면 각자 SHARED 락을 잡는다. SHARED 락은 여러 명이 동시에 가질 수 있는 "공유 read 락"이다. 이 단계에서는 모든 reader가 같은 데이터를 안전하게 읽는다. write는 이때까지 못 들어온다.',
        lock: 'SHARED (3명)',
        actors: [
          { kind: 'shared', label: 'Reader A', state: 'SHARED', detail: 'SELECT 진행' },
          { kind: 'shared', label: 'Reader B', state: 'SHARED', detail: 'SELECT 진행' },
          { kind: 'shared', label: 'Reader C', state: 'SHARED', detail: 'SELECT 진행' },
          { kind: 'idle',   label: 'Writer 1', state: '대기',    detail: 'BEGIN 전' },
        ],
        keyPoint: 'SHARED = 여러 reader 동시 가능. writer 는 아직 진입 못 함.',
        code: {
          lang: 'sql',
          filename: 'shared-lock.sql',
          lines: [
            '-- Step 2. Reader 3명이 동시에 SHARED 락 획득',
            '',
            '-- Reader A',
            'SELECT * FROM users WHERE id = 1;  -- SHARED 락 (자동)',
            '',
            '-- Reader B (동시)',
            'SELECT COUNT(*) FROM users;        -- 추가 SHARED 락 OK',
            '',
            '-- Reader C (동시)',
            "SELECT * FROM users WHERE name LIKE 'A%';  -- SHARED 락 OK",
            '',
            '-- SHARED 락의 성질:',
            '--   • 여러 connection 이 동시에 가질 수 있다',
            '--   • read 만 가능, write 는 불가',
            '--   • writer 가 RESERVED 잡고 기다리고 있어도 read 는 계속 가능',
            '',
            '-- 트랜잭션 외부 SELECT 는:',
            '--   1) SHARED 잡기',
            '--   2) 데이터 읽기',
            '--   3) 결과 반환 직후 SHARED 해제',
            '--   → 매우 짧은 시간만 락을 점유',
            '',
            '-- → 다음 단계 (Step 3): "writer 가 BEGIN 하면 RESERVED"',
          ],
          highlight: [3, 4, 6, 7, 9, 10, 12, 13, 14, 15, 17, 18, 19, 20, 21],
        },
      },
      {
        title: 'Step 3. RESERVED — writer 가 "곧 쓸 것" 표시',
        desc: 'Writer 1이 BEGIN IMMEDIATE를 호출하면 RESERVED 락을 잡는다. "지금부터 내가 쓸 거다"라는 예약이다. RESERVED는 단 한 명만 가질 수 있다. 다만 기존 SHARED reader들은 계속 read 가능하다. 즉 reader는 안 막고, 다른 writer 진입만 차단한다.',
        lock: 'RESERVED (1명) + SHARED (3명)',
        actors: [
          { kind: 'shared',   label: 'Reader A', state: 'SHARED',   detail: 'read 계속' },
          { kind: 'shared',   label: 'Reader B', state: 'SHARED',   detail: 'read 계속' },
          { kind: 'shared',   label: 'Reader C', state: 'SHARED',   detail: 'read 계속' },
          { kind: 'reserved', label: 'Writer 1', state: 'RESERVED', detail: 'BEGIN IMMEDIATE' },
        ],
        keyPoint: 'RESERVED = 1명만. 다른 writer 차단. 기존 reader 는 그대로 read 가능.',
        code: {
          lang: 'sql',
          filename: 'reserved-lock.sql',
          lines: [
            '-- Step 3. Writer 1 이 RESERVED 락 획득',
            '',
            '-- Writer 1',
            'BEGIN IMMEDIATE;                -- 곧바로 RESERVED 락 잡음',
            "UPDATE users SET email = 'X' WHERE id = 1;",
            '',
            '-- 동시에 다른 Writer 가 BEGIN IMMEDIATE 를 시도하면:',
            '--   → SQLITE_BUSY 에러 즉시 반환',
            "--   → \"database is locked\"",
            '',
            '-- 그러나 reader 들은 영향 없음:',
            "--   Reader A: SELECT * FROM users WHERE id = 2;  -- OK (SHARED 추가 가능)",
            "--   Reader B: SELECT COUNT(*) FROM users;        -- OK",
            '',
            '-- BEGIN vs BEGIN IMMEDIATE vs BEGIN EXCLUSIVE',
            '--   BEGIN           : 지연 락 (첫 write 시 RESERVED 잡음)',
            '--   BEGIN IMMEDIATE : 즉시 RESERVED — 권장',
            '--   BEGIN EXCLUSIVE : 즉시 EXCLUSIVE — reader 도 막음',
            '',
            '-- → 다음 단계 (Step 4): "COMMIT 직전 PENDING/EXCLUSIVE"',
          ],
          highlight: [3, 4, 5, 7, 8, 9, 11, 12, 13, 15, 16, 17, 18],
        },
      },
      {
        title: 'Step 4. PENDING → EXCLUSIVE — 쓰기 직전 잠깐 모두 막는다',
        desc: 'Writer가 실제로 main 파일에 쓰기 직전 PENDING으로 격상된다. PENDING은 "신규 SHARED를 못 받는다"는 표시. 기존 reader들이 자기 일 끝내고 해제하면 EXCLUSIVE로 격상. EXCLUSIVE 동안엔 어떤 read/write도 불가. 매우 짧은 시간(밀리초 단위)만 점유한다.',
        lock: 'EXCLUSIVE (1명)',
        actors: [
          { kind: 'blocked', label: 'Reader A', state: '⏳ 차단', detail: '새 SELECT 대기' },
          { kind: 'blocked', label: 'Reader B', state: '⏳ 차단', detail: '새 SELECT 대기' },
          { kind: 'blocked', label: 'Reader C', state: '⏳ 차단', detail: '새 SELECT 대기' },
          { kind: 'excl',    label: 'Writer 1', state: 'EXCLUSIVE', detail: 'main 파일 쓰기' },
        ],
        keyPoint: 'EXCLUSIVE = 누구도 read/write 불가. 다만 점유는 밀리초 단위로 짧음.',
        code: {
          lang: 'sql',
          filename: 'pending-exclusive.sql',
          lines: [
            '-- Step 4. COMMIT 직전의 락 격상',
            '',
            '-- Writer 1 (Step 3 의 트랜잭션 계속)',
            '-- ... (페이지 수정 누적) ...',
            '',
            'COMMIT;  -- 내부적으로:',
            '         --   1) RESERVED → PENDING 격상 (신규 SHARED 차단)',
            '         --   2) 기존 SHARED reader 들이 자기 read 끝낼 때까지 대기',
            '         --   3) 모두 해제되면 PENDING → EXCLUSIVE 격상',
            '         --   4) main 파일에 변경 페이지 쓰기 + fsync',
            '         --   5) journal 삭제 → EXCLUSIVE 해제',
            '',
            '-- EXCLUSIVE 가 잡혀있는 동안:',
            '--   Reader A: SELECT ...  →  SQLITE_BUSY',
            '--   Writer 2: BEGIN IMM   →  SQLITE_BUSY',
            '',
            '-- 다만 이 시간은 보통 1~10ms 수준',
            '--   → PRAGMA busy_timeout = 5000 켜두면',
            '--     5초까지 자동 대기 후 재시도 → 사실상 안 보임',
            '',
            '-- → 다음 단계 (Step 5): "그래서 SQLite 동시성의 본질은?"',
          ],
          highlight: [3, 4, 6, 7, 8, 9, 10, 11, 13, 14, 15, 17, 18, 19],
        },
      },
      {
        title: 'Step 5. 종합 — Reader 다수 + Writer 1명의 모델',
        desc: 'SQLite의 동시성 모델은 "reader 다수 + writer 1명"으로 단순화된다. 데드락이 사실상 없고, OS만으로 격리가 보장된다. 단점은 write가 줄을 서야 한다는 것. busy_timeout과 WAL 모드(Part IV에서 다룸)로 이 한계를 크게 완화할 수 있다.',
        lock: 'IDLE (트랜잭션 종료)',
        actors: [
          { kind: 'idle', label: 'Reader A', state: '해제', detail: 'connection 유지' },
          { kind: 'idle', label: 'Reader B', state: '해제', detail: 'connection 유지' },
          { kind: 'idle', label: 'Reader C', state: '해제', detail: 'connection 유지' },
          { kind: 'idle', label: 'Writer 1', state: '해제', detail: 'COMMIT 완료' },
        ],
        keyPoint: '핵심: reader N + writer 1. 데드락 없음. busy_timeout / WAL 로 체감 차단 거의 0.',
        code: {
          lang: 'python',
          filename: 'safe-write.py',
          lines: [
            '"""',
            'Step 5. 실전 — single-writer 한계를 우회하는 패턴',
            '',
            '의존성: 표준 라이브러리 sqlite3',
            '"""',
            'import sqlite3',
            'from pathlib import Path',
            '',
            'DB_PATH = Path("users.db")',
            '',
            'def safe_connect() -> sqlite3.Connection:',
            '    """busy_timeout 켜고 WAL 모드로 접속한다."""',
            '    conn = sqlite3.connect(DB_PATH, isolation_level=None)',
            '    # 락 충돌 시 5초까지 자동 재시도 → SQLITE_BUSY 거의 안 봄',
            '    conn.execute("PRAGMA busy_timeout = 5000")',
            '    # WAL 모드: reader 와 writer 가 서로 안 막음',
            '    conn.execute("PRAGMA journal_mode = WAL")',
            '    return conn',
            '',
            'def write_user(name: str, email: str) -> int:',
            '    """짧고 빠르게 트랜잭션을 끝낸다 = single-writer 한계 회피."""',
            '    with safe_connect() as conn:',
            '        conn.execute("BEGIN IMMEDIATE")',
            '        cur = conn.execute(',
            '            "INSERT INTO users(name, email) VALUES(?, ?)",',
            '            (name, email),',
            '        )',
            '        conn.execute("COMMIT")',
            '    return cur.lastrowid',
            '',
            '# 핵심 운영 팁:',
            '#   • 트랜잭션을 최대한 짧게 → EXCLUSIVE 점유 시간 최소화',
            '#   • busy_timeout 으로 자동 재시도',
            '#   • WAL 모드로 read/write 동시성 끌어올리기 (Part IV)',
          ],
          highlight: [6, 9, 11, 12, 13, 14, 15, 16, 17, 20, 21, 22, 23, 24, 25, 26, 27, 30, 31, 32, 33],
        },
      },
    ];

    const KIND_STYLE = {
      idle:     { bg: 'bg-slate-100',   border: 'border-slate-300',   text: 'text-slate-700',   pill: 'bg-slate-200 text-slate-700' },
      shared:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-900', pill: 'bg-emerald-200 text-emerald-900' },
      reserved: { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-900',   pill: 'bg-amber-200 text-amber-900' },
      excl:     { bg: 'bg-rose-50',     border: 'border-rose-500',    text: 'text-rose-900',    pill: 'bg-rose-200 text-rose-900' },
      blocked:  { bg: 'bg-slate-50',    border: 'border-slate-400 border-dashed', text: 'text-slate-500', pill: 'bg-slate-300 text-slate-700' },
    };

    function ActorCard({ item }) {
      const s = KIND_STYLE[item.kind] || KIND_STYLE.idle;
      return (
        <div className={`rounded-lg border ${s.bg} ${s.border} px-3 py-2 flex items-center justify-between`}>
          <div className="flex items-center gap-2">
            <span className={`text-xs font-bold ${s.text} w-20`}>{item.label}</span>
            <span className={`text-xs font-mono ${s.text}`}>{item.detail}</span>
          </div>
          <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${s.pill}`}>{item.state}</span>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#B3C8D3' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#003B57' }}>락 상태: {state.lock}</h3>
            <span className="text-[10px] text-slate-500">프로세스 4명 시뮬레이션</span>
          </div>
          <div className="space-y-2">
            {state.actors.map((it, i) => <ActorCard key={i} item={it} />)}
          </div>
          <div className="mt-3 text-xs rounded p-2 border" style={{ color: '#003B57', backgroundColor: '#E6EEF3', borderColor: '#B3C8D3' }}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);
      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();
      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-sky-500/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ backgroundColor: '#E6EEF3' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#003B57' }}>I</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: '#003B57' }}>Chapter I-2-1. Single-writer 모델</h1>
                <p className="text-sm text-slate-700">UNLOCKED → SHARED → RESERVED → PENDING → EXCLUSIVE 5단계 락 전이</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#003B57' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#003B57' : '#CBD5E1' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#003B57' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{ color: '#CFE0EA' }}>{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border bg-white" style={{ borderColor: '#B3C8D3', color: '#003B57' }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border bg-white disabled:opacity-40" style={{ borderColor: '#B3C8D3', color: '#003B57' }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: '#003B57' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border bg-white disabled:opacity-40" style={{ borderColor: '#B3C8D3', color: '#003B57' }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#003B57', color: '#003B57' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                락 5단계: UNLOCKED → SHARED(N명) → RESERVED(1명) → PENDING → EXCLUSIVE(1명). writer 는 줄을 서지만, 점유는 ms 단위. busy_timeout + WAL 로 거의 안 보이게 만든다. 다음(I-2-2)에서 embedded vs server 본질 비교.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['파일 락', 'SHARED', 'RESERVED', 'EXCLUSIVE', 'busy_timeout', 'database is locked', 'WAL', 'single-writer'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#E6EEF3', color: '#003B57', borderColor: '#B3C8D3' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#003B57' }}>
              <a href="./I-1-2.html" className="underline hover:no-underline">← 이전: I-1-2 ACID</a>
              <a href="./I-2-2.html" className="underline hover:no-underline">다음: I-2-2 Embedded vs Server →</a>
            </nav>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
