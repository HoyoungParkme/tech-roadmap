        code: {
          lang: 'python',
          filename: 'crash-recovery.py',
          lines: [
            '"""',
            'Step 5. CRASH 시나리오 + 자동 복구 검증',
            '',
            '의존성: 표준 라이브러리 sqlite3',
            '"""',
            'import os',
            'import sqlite3',
            'from pathlib import Path',
            '',
            'DB_PATH = Path("users.db")',
            'JOURNAL_PATH = Path("users.db-journal")',
            '',
            'def simulate_crash_during_update() -> None:',
            '    """UPDATE 도중 프로세스가 죽는 상황을 흉내."""',
            '    conn = sqlite3.connect(DB_PATH, isolation_level="DEFERRED")',
            '    conn.execute("BEGIN")',
            '    conn.execute("UPDATE users SET email = \'X\' WHERE id = 1")',
            '    # COMMIT 직전 — 강제로 죽는다 (close 없음)',

    const KIND_STYLE = {
      db:      { bg: 'bg-slate-100',    border: 'border-slate-300',   text: 'text-slate-800',   badge: 'bg-slate-200 text-slate-700' },

    function LiveDataPane({ state }) {
      return (
        <div className="rounded-xl border bg-white p-4 h-full flex flex-col" style={{ borderColor: '#B3C8D3' }}>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold" style={{ color: '#003B57' }}>트랜잭션 상태: {state.state}</h3>

          </div>
          <div className="space-y-2">
            {state.files.map((it, i) => (
              <DataCard key={i} item={it} />
            ))}
          </div>
          <div className="mt-3 text-xs rounded p-2 border" style={{ color: '#003B57', backgroundColor: '#E6EEF3', borderColor: '#B3C8D3' }}>
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div
                    key={i}
                    className={`flex ${isHi ? 'bg-sky-500/15 border-l-2 border-sky-400 -ml-3 pl-2' : ''}`}
                  >
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span
                      className="flex-1"
                      dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }}
                    />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => {
            if (i >= STEPS.length - 1) { setPlaying(false); return i; }
            return i + 1;
          });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen px-4 py-6" style={{ backgroundColor: '#E6EEF3' }}>
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg text-white font-bold" style={{ backgroundColor: '#003B57' }}>I</span>
              <div>
                <h1 className="text-2xl font-bold" style={{ color: '#003B57' }}>Chapter I-1-2. ACID와 트랜잭션</h1>
                <p className="text-sm text-slate-700">BEGIN → journal → main 쓰기 → COMMIT/CRASH 5단계</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs underline hover:no-underline" style={{ color: '#003B57' }}>← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className="h-1.5 flex-1 rounded-full transition" style={{ backgroundColor: i <= stepIdx ? '#003B57' : '#CBD5E1' }} />
              ))}
            </div>

            <div className="mb-4 rounded-xl text-white px-5 py-4 shadow" style={{ backgroundColor: '#003B57' }}>
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm leading-relaxed" style={{ color: '#CFE0EA' }}>{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} className="px-3 py-1.5 text-xs rounded border bg-white" style={{ borderColor: '#B3C8D3', color: '#003B57' }}>처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} className="px-3 py-1.5 text-xs rounded border bg-white disabled:opacity-40" style={{ borderColor: '#B3C8D3', color: '#003B57' }}>← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} className="px-4 py-1.5 text-xs rounded font-bold text-white" style={{ backgroundColor: '#003B57' }}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} className="px-3 py-1.5 text-xs rounded border bg-white disabled:opacity-40" style={{ borderColor: '#B3C8D3', color: '#003B57' }}>다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-500 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 bg-white px-4 py-3 text-sm" style={{ borderColor: '#003B57', color: '#003B57' }}>
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                rollback journal = "변경 전 원본 사본". BEGIN → journal 작성 → main 변경 → COMMIT(journal 삭제). 정전 시 journal 발견하면 자동 복원. 다음 챕터(I-2-1)에서는 단일 쓰기 모델과 락을 본다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['ACID', 'BEGIN', 'COMMIT', 'ROLLBACK', 'rollback journal', 'fsync', '복구', 'durability'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full border" style={{ backgroundColor: '#E6EEF3', color: '#003B57', borderColor: '#B3C8D3' }}>#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs" style={{ color: '#003B57' }}>
              <a href="./I-1-1.html" className="underline hover:no-underline">← 이전: I-1-1 파일 하나가 DB</a>
              <a href="./I-2-1.html" className="underline hover:no-underline">다음: I-2-1 Single-writer 모델 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
