          ],
        },
        keyPoint: '임베디드는 "틀린 선택"이 아니라 "다른 선택"이다. 워크로드(동시 쓰기·네트워크·규모)로 판단하라. 다음(II-1-1)부터 SQLite 실전.',
        code: {
          lang: 'python',
          filename: 'when_sqlite.py',
          lines: [
            '# Step 5. 선택 기준을 코드로 — 그리고 함정 회피',
            '',
            '# ✓ 테스트: 인메모리 SQLite (초고속 · 완전 격리)',
            'import sqlite3',
            'conn = sqlite3.connect(":memory:")   # 디스크조차 없음',
            'conn.execute("CREATE TABLE t(id INT)")',
            '',
            '# ✓ 앱 로컬 저장 (데스크톱/모바일/엣지)',
            'conn = sqlite3.connect("~/.myapp/data.db")',
            '',
            '# ⚠ 함정 1) 고동시성 쓰기 웹서버',
            '#   여러 워커가 동시에 write -> SQLITE_BUSY',
            '#   완화: busy_timeout · WAL · 짧은 트랜잭션',
            'conn.execute("PRAGMA journal_mode=WAL")',
            'conn.execute("PRAGMA busy_timeout=5000")',
            '#   그래도 한계면 -> PostgreSQL/MySQL 이전',
            '',
            '# ⚠ 함정 2) 네트워크 파일시스템(NFS/SMB) 위 SQLite',
            '#   파일 락이 깨져 DB 손상. 절대 금지.',
            '#   DB 파일은 반드시 로컬 디스크에 둔다.',
            'DB_PATH = "/var/lib/myapp/data.db"   # local disk only',
            '',
            '# ⚠ 함정 3) "SQLite 는 확장 안 된다" 는 오해',
            '#   읽기 위주 · 단일 노드면 프로덕션에서 매우 강력',
            '#   판단 기준은 "규모"가 아니라 "동시 쓰기 패턴"',
            '',
            '# 결정 규칙 (요약)',
            '# 동시 쓰기 많음 or 다중 노드 or 네트워크 공유 -> 서버 DB',
            '# 그 외 로컬/엣지/테스트 -> SQLite',
          ],
          highlight: [3, 4, 5, 8, 9, 11, 12, 13, 14, 15, 18, 19, 20, 21, 23, 24, 25, 28, 29, 30],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function ArchCompareViz({ viz }) {
      const Col = ({ data, accent }) => (
        <div className="flex-1">
          <div className={`text-xs font-bold text-center mb-2 ${accent}`}>{data.title}</div>
          <div className="space-y-1.5">
            {data.parts.map((p, i) => (
              <div key={i} className="relative">
                <div className={`text-[11px] font-mono text-center px-2 py-1.5 rounded border ${
                  i === 0 ? 'bg-slate-700 text-white border-slate-800' :
                  i === data.parts.length - 1 ? 'bg-[#003B57] text-white border-[#00263a]' :
                  'bg-white border-slate-300 text-slate-700'
                }`}>{p}</div>
                {i < data.parts.length - 1 && <div className="text-center text-slate-400 text-xs leading-3">↓</div>}
              </div>
            ))}
          </div>
          <div className="mt-2 text-[10px] text-center text-slate-600">{data.note}</div>
        </div>
      );
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 flex gap-4">
          <Col data={viz.embedded} accent="text-emerald-700" />
          <div className="w-px bg-slate-300"></div>
          <Col data={viz.server} accent="text-[#003B57]" />
        </div>
      );
    }

    function LatencyViz({ viz }) {
      const eTotal = viz.rounds * viz.embedded.perCall;
      const sTotal = viz.rounds * viz.server.perCall;
      const max = Math.max(eTotal, sTotal);
      const Bar = ({ data, total }) => {
        const t = TONE[data.tone] || TONE.good;
        return (
          <div className="flex items-center gap-2">
            <span className="text-[10px] text-slate-600 w-32">{data.label}</span>
            <div className="flex-1 h-4 bg-white rounded border border-slate-300 overflow-hidden">
              <div className={`h-full ${data.tone === 'good' ? 'bg-emerald-500' : 'bg-amber-500'}`} style={{ width: `${Math.max(2, (total / max) * 100)}%` }}></div>
            </div>
            <span className="text-[10px] font-mono w-24 text-right">{total.toFixed(2)} {viz.unit}</span>
          </div>
        );
      };
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">{viz.rounds}회 반복 조회 총 지연</div>
          <div className="space-y-3">
            <Bar data={viz.embedded} total={eTotal} />
            <Bar data={viz.server} total={sTotal} />
          </div>
          <div className="mt-3 text-center text-[10px] text-slate-600">
            호출당 <span className="font-mono">{viz.embedded.perCall}{viz.unit}</span> vs <span className="font-mono">{viz.server.perCall}{viz.unit}</span> ·
            약 <span className="font-mono font-bold">{Math.round(sTotal / eTotal)}배</span> 차이
          </div>
        </div>
      );
    }

    function DeployViz({ viz }) {
      const Col = ({ data, accent, count }) => (
        <div className="flex-1">
          <div className={`text-xs font-bold text-center mb-2 ${accent}`}>{data.title} <span className="text-slate-400">({count}단계)</span></div>
          <div className="space-y-1.5">
            {data.steps.map((s, i) => (
              <div key={i} className="flex items-center gap-2 text-[11px]">
                <span className="w-5 h-5 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-mono text-[10px] shrink-0">{i + 1}</span>
                <span className="text-slate-700">{s}</span>
              </div>
            ))}
          </div>
        </div>
      );
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 flex gap-4">
          <Col data={viz.embedded} accent="text-emerald-700" count={viz.embedded.steps.length} />
          <div className="w-px bg-slate-300"></div>
          <Col data={viz.server} accent="text-[#003B57]" count={viz.server.steps.length} />
        </div>
      );
    }

    function ConcurrencyViz({ viz }) {
      const Card = ({ data }) => (
        <div className={`flex-1 rounded border p-3 ${data.busy ? 'bg-amber-50 border-amber-300' : 'bg-emerald-50 border-emerald-300'}`}>
          <div className="text-xs font-bold text-slate-800 mb-2">{data.label}</div>
          <div className="space-y-1 text-[11px]">
            <div className="flex justify-between"><span className="text-slate-500">읽기</span><span className="font-mono text-slate-800">{data.readers}</span></div>
            <div className="flex justify-between"><span className="text-slate-500">쓰기</span><span className="font-mono text-slate-800">{data.writers}</span></div>
          </div>
          <div className={`mt-2 text-[10px] text-center rounded px-2 py-0.5 ${data.busy ? 'bg-amber-200 text-amber-800' : 'bg-emerald-200 text-emerald-800'}`}>
            {data.busy ? '쓰기 충돌 시 SQLITE_BUSY' : '동시 쓰기 확장 가능'}
          </div>
        </div>
      );
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 flex gap-3">
          <Card data={viz.embedded} />
          <Card data={viz.server} />
        </div>
      );
    }

    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => {
            const t = TONE[it.tone] || TONE.warn;
            return (
              <div key={i} className={`flex items-start gap-2 rounded p-2 border ${t.bg} ${t.border}`}>
                <span className={t.text}>{it.icon}</span>
                <div className="flex-1">
                  <div className={`text-xs font-bold ${t.text}`}>{it.label}</div>
                  <div className="text-[10px] text-slate-700">{it.desc}</div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">분류</th><th className="py-1 pr-2">SQLite</th><th className="py-1 pr-2">서버 DB</th><th className="py-1">핵심</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">Embedded vs Server 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          {viz?.kind === 'arch-compare' && <ArchCompareViz viz={viz} />}
          {viz?.kind === 'latency' && <LatencyViz viz={viz} />}
          {viz?.kind === 'deploy' && <DeployViz viz={viz} />}
          {viz?.kind === 'concurrency' && <ConcurrencyViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <div className="inline-flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-[#003B57] text-white">Part I. SQLite의 본질</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-200 text-slate-700">I-2-2</span>
                </div>
                <h1 className="text-2xl font-bold text-slate-900">Embedded vs Server</h1>
                <p className="text-sm text-slate-700/80">서버 없는 임베디드 DB와 클라이언트-서버 DB의 근본 차이</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                SQLite는 앱 안의 라이브러리 + 파일 하나, 서버 DB는 별도 프로세스 + 네트워크. 인프로세스 함수 호출은 왕복이 없어 반복 조회에 빠르고, 배포는 파일 복사로 끝난다. 대신 쓰기는 단일 writer라 고동시성 쓰기에는 서버 DB가 답. NFS 위 SQLite는 손상 위험이니 금지. 워크로드로 판단하라.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['Embedded', 'Server', 'In-Process', 'RTT', 'Zero-Config', 'Single-Writer', 'WAL', 'SQLITE_BUSY'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="./I-2-1.html" className="underline hover:no-underline">← I-2-1</a>
              <a href="../part2/II-1-1.html" className="underline hover:no-underline">다음: II-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
