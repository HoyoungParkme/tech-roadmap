  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }
    .text-slate-900, .text-slate-800, .text-gray-900, .text-gray-800, .text-zinc-800, .text-neutral-800, .text-stone-800 { color: #2b2b2b !important; }
    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }
    .shadow-sm, .shadow, .shadow-md { box-shadow: 3px 3px 0 rgba(0,0,0,.12) !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    SQLite Chapter III-2-1 — 복합 인덱스 설계
    학습 목표: multi-column index, 컬럼 순서 규칙(등가→범위→정렬), left-prefix, ORDER BY 회피, covering, 함정
    핵심: 복합 인덱스는 컬럼 "순서"가 성능을 좌우한다. 정렬은 첫 컬럼 우선.
    패턴: fastapi v1 — 좌(LiveDataPane: 복합 인덱스 순서/prefix 시각화) / 우(VSCode CodeViewer, sql)
    색상: slate (sqlite 도메인, #003B57)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    const CODE = {
      basics: {lang: 'sql', filename: 'composite-basics.sql', lines: [
        '-- Step 1. 복합 인덱스의 정렬 구조',
        '',
        'CREATE TABLE employees (',
        '    id       INTEGER PRIMARY KEY,',
        '    dept_id  INTEGER NOT NULL,',
        '    salary   INTEGER NOT NULL,',
        '    name     TEXT',
        ');',
        '',
        '-- 복합(multi-column) 인덱스 — 컬럼 순서에 주의',
        'CREATE INDEX idx_dept_salary ON employees(dept_id, salary);',
        '',
        '-- 내부 정렬 순서 (개념)',
        '--   dept_id | salary',
        '--   -------- | ------',
        '--        1   |  3000',
        '--        1   |  5000    <- 같은 dept 안에서 salary 오름차순',
        '--        2   |  2800',
        '--        3   |  2000',
        '--        3   |  6000',
        '--        3   |  9000',
        '',
        '-- 선행 컬럼(dept_id) 로 먼저 묶이므로,',
        '-- dept_id 를 지정하면 그 구간으로 바로 점프할 수 있다.',
        '',
        'EXPLAIN QUERY PLAN',
        'SELECT * FROM employees WHERE dept_id = 3 AND salary >= 6000;',
        '-- => SEARCH employees USING INDEX idx_dept_salary (dept_id=? AND salary>?)',
        '--    dept_id=3 구간으로 점프 후, salary>=6000 부터 순차 읽기',
        '',
        '-- 전화번호부 비유: 성(dept_id)으로 페이지를 찾고,',
        '-- 그 페이지 안에서 이름(salary)으로 좁힌다.',
      ]},
      columnOrder: {lang: 'sql', filename: 'column-order.sql', lines: [
        '-- Step 2. 컬럼 순서 규칙: 등가 -> 범위 -> 정렬',
        '',
        'CREATE TABLE orders (',
        '    id         INTEGER PRIMARY KEY,',
        '    status     TEXT NOT NULL,',
        '    created_at TEXT NOT NULL,',
        '    total      INTEGER',
        ');',
        '',
        '-- 대상 쿼리: 등가 하나 + 범위 하나',
        '--   WHERE status = ? AND created_at >= ?',
        '',
        '-- (O) 좋은 순서: 등가(status) 먼저, 범위(created_at) 나중',
        'CREATE INDEX idx_ok ON orders(status, created_at);',
        'EXPLAIN QUERY PLAN',
        "SELECT * FROM orders",
        "WHERE status = 'PAID' AND created_at >= '2026-01-01';",
        '-- => SEARCH orders USING INDEX idx_ok (status=? AND created_at>?)',
        '--    status=PAID 구간 확정 -> created_at 범위를 인덱스로 좁힘',
        '',
        '-- (X) 나쁜 순서: 범위(created_at) 먼저',
        'CREATE INDEX idx_bad ON orders(created_at, status);',
        'EXPLAIN QUERY PLAN',
        "SELECT * FROM orders",
        "WHERE status = 'PAID' AND created_at >= '2026-01-01';",
        '-- => SEARCH orders USING INDEX idx_bad (created_at>?)',
        '--    created_at 범위만 인덱스 사용, status 는 각 행마다 재검사',
        '--    범위 뒤의 status 는 정렬이 흩어져 인덱스로 못 좁힌다.',
        '',
        '-- 규칙 요약',
        '--   1) 등가(=) 조건 컬럼을 앞에',
        '--   2) 범위(>, <, BETWEEN, LIKE prefix) 컬럼은 하나만, 맨 뒤 쪽에',
        '--   3) ORDER BY 컬럼은 범위 컬럼 자리 또는 그 뒤에 배치',
      ]},
      leftPrefix: {lang: 'sql', filename: 'left-prefix.sql', lines: [
        '-- Step 3. left-prefix 규칙',
        '',
        'CREATE INDEX idx_dept_salary ON employees(dept_id, salary);',
        '',
        '-- (O) 선행 컬럼 + 범위 : 완전 활용',
        'EXPLAIN QUERY PLAN',
        'SELECT * FROM employees WHERE dept_id = 3 AND salary > 5000;',
        '-- => SEARCH employees USING INDEX idx_dept_salary (dept_id=? AND salary>?)',
        '',
        '-- (O) 선행 컬럼만 : prefix 활용',
        'EXPLAIN QUERY PLAN',
        'SELECT * FROM employees WHERE dept_id = 3;',
        '-- => SEARCH employees USING INDEX idx_dept_salary (dept_id=?)',
        '',
        '-- (O) 등가 조건은 순서 무관 : 옵티마이저가 재배열',
        'EXPLAIN QUERY PLAN',
        'SELECT * FROM employees WHERE salary = 5000 AND dept_id = 3;',

        keyPoint: '앞부분이 고정돼야 정렬된 목록에서 구간을 잡을 수 있다.',
        code: { ...CODE.pitfalls, highlight: [24, 25, 26, 27] },
      },
      { ...S5,
        beat: {
          label: '⑤ 인덱스가 많으면 쓰기가 느려진다',
          at: 'composite-pitfalls.sql L29–34',
          caption: '인덱스 5개면 INSERT 한 건마다 트리 5개를 갱신한다. sqlite_master 로 목록을 보고 안 쓰는 건 지운다.',
          changes: [
            { mark: 'read', text: 'sqlite_master 로 인덱스 목록' },
            { mark: 'gone', text: 'DROP INDEX idx_bad' },
          ],
        },
        viz: {
          kind: 'pitfalls',
          items: [
            { icon: '⚠', label: '과다 인덱스', desc: '인덱스 N개 = INSERT/UPDATE 마다 트리 N개 갱신, 쓰기 비용↑' },
          ],
        },
        verdict: '⑤ 쓰기 비용',
        verdictTone: 'warn',
        keyPoint: '읽기를 위해 만든 인덱스가 쓰기를 갉아먹는다. 개수를 관리한다.',
        code: { ...CODE.pitfalls, highlight: [29, 30, 31, 32, 33, 34] },
      },
      { ...S5,
        beat: {
          label: '통계 갱신하고 다음 장으로',
          at: 'composite-pitfalls.sql L36–39',
          caption: '인덱스를 만들거나 지웠으면 ANALYZE 로 통계를 맞춘다. 다음은 쿼리 플랜을 더 깊게 읽는다.',
          changes: [
            { mark: 'new', text: 'ANALYZE;' },
            { mark: 'read', text: '다음 챕터 III-2-2' },
          ],
        },
        viz: {
          kind: 'pitfalls',
          items: [
            { icon: '⚠', label: '컬럼 순서 오류', desc: '선행 컬럼이 WHERE 에 없으면 인덱스 미사용 → SCAN' },
            { icon: '⚠', label: '함수 적용 컬럼', desc: "WHERE lower(name)=? 는 원본 인덱스 무효 (표현식 인덱스 필요)" },
            { icon: '⚠', label: '낮은 카디널리티 선행', desc: '선행 컬럼 고유값 2~3개면 선택도↓, SCAN 이 더 빠를 수도' },
            { icon: '⚠', label: 'leading wildcard', desc: "LIKE '%kim' 은 prefix 없어 인덱스 못 탐" },
            { icon: '⚠', label: '과다 인덱스', desc: '인덱스 N개 = INSERT/UPDATE 마다 트리 N개 갱신, 쓰기 비용↑' },
          ],
        },
        verdict: '함정 주의',
        verdictTone: 'warn',
        summary: {
          title: 'III-2-1 복합 인덱스 설계 정리',
          rows: [
            { metric: '순서 규칙', before: '등가→범위→정렬', after: '범위 뒤 컬럼 못 좁힘', delta: '설계 1순위' },
            { metric: 'left-prefix', before: '(a,b,c)', after: 'a/(a,b)/(a,b,c)만', delta: '선행 필수' },
            { metric: 'ORDER BY', before: '인덱스 순서 일치', after: 'TEMP B-TREE 제거', delta: '정렬 회피' },
            { metric: 'covering', before: 'SELECT 컬럼 포함', after: '테이블 fetch X', delta: '최적' },
            { metric: '과다 인덱스', before: '쓰기 N배', after: '선택·설계 균형', delta: '트레이드오프' },
          ],
        },
        keyPoint: '순서·prefix·카디널리티·쓰기비용을 함께 본다. 다음(III-2-2)은 쿼리 플랜을 더 깊게 읽는다.',
        code: { ...CODE.pitfalls, highlight: [36, 37, 39] },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    const GROUP_COLOR = ['bg-sky-100 border-sky-300', 'bg-violet-100 border-violet-300', 'bg-emerald-100 border-emerald-300'];

    function CompositeSortedViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs font-mono text-slate-800 mb-2">{viz.index}</div>
          <div className="rounded border border-slate-300 overflow-hidden">
            <div className="flex text-[10px] font-bold text-slate-500 bg-white border-b border-slate-200">
              <span className="w-1/2 px-2 py-1 border-r border-slate-200">dept_id (선행)</span>
              <span className="w-1/2 px-2 py-1">salary (후행)</span>
            </div>
            {viz.rows.map((r, i) => (
              <div key={i} className={`flex text-xs font-mono border-b border-slate-100 ${GROUP_COLOR[r.group % 3]}`}>
                <span className="w-1/2 px-2 py-1 border-r border-slate-200 font-bold text-slate-800">{r.a}</span>
                <span className="w-1/2 px-2 py-1 text-slate-700">{r.b.toLocaleString()}</span>
              </div>
            ))}
          </div>
          <div className="mt-3 text-[10px] text-center text-slate-600">{viz.note}</div>
        </div>
      );
    }

    function ColumnOrderViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-2">
          <div className="text-[11px] font-mono text-slate-800 bg-white border border-slate-300 rounded p-2">{viz.query}</div>
          {viz.candidates.map((c, i) => {
            const t = c.good ? TONE.good : TONE.danger;
            return (
              <div key={i} className={`p-2 rounded border ${t.bg} ${t.border}`}>
                <div className="flex items-center gap-2">
                  <span className={`text-xs ${c.good ? 'text-emerald-700' : 'text-rose-600'}`}>{c.good ? '✓' : '✗'}</span>
                  <span className="font-mono text-xs font-bold text-slate-800">{c.order}</span>
                </div>
                <div className={`text-[10px] mt-0.5 ${t.text}`}>{c.note}</div>
              </div>
            );
          })}
        </div>
      );
    }

    function PrefixMatchViz({ viz }) {
      const badge = {
        full: { cls: 'bg-emerald-200 text-emerald-800', txt: '완전 사용' },
        partial: { cls: 'bg-sky-200 text-sky-800', txt: 'prefix 사용' },
        none: { cls: 'bg-rose-200 text-rose-800', txt: '미사용(SCAN)' },
      };
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          <div className="text-xs font-mono text-slate-800 mb-1">{viz.index}</div>
          {viz.cases.map((c, i) => {
            const b = badge[c.hit];
            return (
              <div key={i} className="flex items-center gap-2 bg-white border border-slate-200 rounded p-2">
                <span className="flex-1 font-mono text-[11px] text-slate-800">WHERE {c.q}</span>
                <span className={`text-[9px] px-1.5 py-0.5 rounded ${b.cls} whitespace-nowrap`}>{b.txt}</span>
              </div>
            );
          })}
          <div className="text-[10px] text-slate-600 pt-1">선행 컬럼(dept_id)이 빠지면 인덱스를 못 탄다. 등가는 순서 무관.</div>
        </div>
      );
    }

    function OrderCoverViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-3">
          <div className="text-[11px] font-mono text-slate-800 bg-white border border-slate-300 rounded p-2">{viz.query}</div>
          <div className="flex items-center justify-center gap-2">
            <div className="bg-emerald-100 border border-emerald-400 rounded p-3 text-center min-w-[110px]">
              <div className="text-[10px] text-emerald-700 mb-1">복합 인덱스</div>
              <div className="text-xs font-mono font-bold text-emerald-900">{viz.index}</div>
              <div className="text-[10px] text-emerald-700 mt-1">이미 정렬됨</div>
            </div>
            <span className="text-2xl text-slate-300">{'⇛'}</span>
            <div className="bg-slate-100 border border-slate-300 rounded p-3 text-center min-w-[110px] opacity-60 line-through">
              <div className="text-[10px] text-slate-500 mb-1">임시 정렬</div>
              <div className="text-xs font-mono font-bold text-slate-700">TEMP B-TREE</div>
              <div className="text-[10px] text-slate-500 mt-1">불필요</div>
            </div>
          </div>
          <div className="flex gap-2">
            <div className="flex-1 text-center text-[11px] bg-emerald-100 text-emerald-800 px-2 py-1 rounded border border-emerald-300 font-bold">
              {'✓'} ORDER BY 회피
            </div>
            <div className="flex-1 text-center text-[11px] bg-emerald-100 text-emerald-800 px-2 py-1 rounded border border-emerald-300 font-bold">
              {'✓'} COVERING (테이블 안 봄)
            </div>
          </div>
        </div>
      );
    }

    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => (
            <div key={i} className="flex items-start gap-2 bg-amber-50 border border-amber-300 rounded p-2">
              <span className="text-amber-700">{it.icon}</span>
              <div className="flex-1">
                <div className="text-xs font-bold text-amber-900">{it.label}</div>
                <div className="text-[10px] text-amber-800">{it.desc}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">{'📊'} {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">분류</th><th className="py-1 pr-2">규칙</th><th className="py-1 pr-2">효과</th><th className="py-1">비고</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">복합 인덱스 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {viz?.kind === 'composite-sorted' && <CompositeSortedViz viz={viz} />}
          {viz?.kind === 'column-order' && <ColumnOrderViz viz={viz} />}
          {viz?.kind === 'prefix-match' && <PrefixMatchViz viz={viz} />}
          {viz?.kind === 'order-cover' && <OrderCoverViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            {'💡'} {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <div className="inline-flex items-center gap-2 mb-1">
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#003B57] text-white font-bold">Part III. 인덱스와 쿼리 플랜</span>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-200 text-slate-700 font-mono">III-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-slate-900">복합 인덱스 설계</h1>
                <p className="text-sm text-slate-700/80">여러 컬럼 인덱스의 순서가 성능을 좌우한다</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                복합 인덱스는 컬럼 순서가 전부다. 등가→범위→정렬 순으로 배치하고, left-prefix 규칙에 맞는 쿼리만 인덱스를 탄다. 인덱스 정렬을 활용하면 ORDER BY 임시 정렬을 없애고, SELECT 컬럼까지 담으면 COVERING 이 된다. 순서 오류·함수 적용·낮은 카디널리티·과다 인덱스는 피한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['composite', 'left-prefix', '등가먼저', 'ORDER-BY회피', 'covering', '카디널리티'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="./III-1-1.html" className="underline hover:no-underline">← III-1-1 인덱스 기초</a>
              <a href="./III-2-2.html" className="underline hover:no-underline">다음: III-2-2 쿼리 플랜 읽기 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
