  <!-- 필기노트 공통 스킨 (디자인 토큰: 종이 #fffdf7 / 잉크 #2b2b2b / 형광펜 #fde68a) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style id="trn-note-skin">
    body { background-color: #fffdf7 !important; font-family: Pretendard, system-ui, sans-serif; }
    .bg-slate-50, .bg-gray-50, .bg-slate-100, .bg-gray-100, .bg-zinc-50, .bg-neutral-50, .bg-stone-50 { background-color: #faf7ef !important; }

    .text-slate-700, .text-slate-600, .text-gray-700, .text-gray-600, .text-zinc-600, .text-neutral-600, .text-stone-600 { color: #57534a !important; }
    .text-slate-500, .text-slate-400, .text-gray-500, .text-gray-400, .text-zinc-500, .text-neutral-500, .text-stone-500 { color: #8a8578 !important; }
    .border-slate-200, .border-slate-300, .border-gray-200, .border-gray-300, .border-zinc-200, .border-zinc-300, .border-neutral-200, .border-stone-200 { border-color: #cfc9ba !important; }

    .bg-emerald-50, .bg-green-50, .bg-sky-50, .bg-blue-50, .bg-indigo-50, .bg-violet-50, .bg-purple-50, .bg-rose-50, .bg-pink-50, .bg-amber-50, .bg-yellow-50, .bg-orange-50, .bg-red-50, .bg-teal-50, .bg-cyan-50, .bg-lime-50, .bg-fuchsia-50 { background-color: #faf7ef !important; }

  <!-- trn-focus: 패널 높이 상한(내부 스크롤) + 강조줄 포커스 -->
  <style id="trn-focus">
    @media (min-width: 768px) {
      /* 좌/우 패널 높이를 뷰포트에 맞춰 제한 — 코드 본문(.overflow-auto)이 내부 스크롤 */
      [class*="lg:grid-cols-2"] > * { max-height: clamp(320px, calc(100vh - 400px), 720px); }
      /* 내부 스크롤 컨테이너가 없는 패널(좌측 시각화)은 자신이 스크롤 */
      [class*="lg:grid-cols-2"] > *:not(:has([class*="overflow-auto"])) { overflow-y: auto; }
    }
    /* 강조가 있는 코드 블록에서만 비강조 줄을 흐리게 → 초점 확보 */
    [class*="overflow-auto"]:has([data-hi="1"]) [data-hi="0"] { opacity: .38; transition: opacity .2s; }
    [data-hi="1"] { scroll-margin: 80px; }
  </style>
  <script id="trn-focus-js">
  (function () {
    var t;
    function focusFirst() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi="1"]');
      if (!first) return;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc || sc.scrollHeight <= sc.clientHeight + 4) return;
      var r1 = first.getBoundingClientRect(), r2 = sc.getBoundingClientRect();
      var delta = (r1.top - r2.top) - (sc.clientHeight / 2 - r1.height / 2);
      sc.scrollTo({ top: Math.max(0, sc.scrollTop + delta), behavior: "smooth" });
    }
    function schedule() { clearTimeout(t); t = setTimeout(focusFirst, 140); }
    window.addEventListener("load", function () {
      try {
        new MutationObserver(schedule).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["data-hi"] });
      } catch (e) {}
      setTimeout(focusFirst, 500);
    });
  })();
  </script>

  <!-- trn-beat: 강조 구간을 세부 단계(beat)로 나눠 "다음" 으로 하나씩 따라가게 한다 -->
  <style id="trn-beat-css">
    [data-hi] { transition: opacity .18s ease; }
    .trn-beat-off { opacity: .22 !important; }
    .trn-beat-on  { opacity: 1 !important; }
    #trn-beat-badge {
      margin-left: auto; font-size: 10px; font-family: ui-monospace, monospace;
      padding: 2px 7px; border-radius: 999px; white-space: nowrap;
      background: rgba(255,204,51,.18); color: #ffcc33; border: 1px solid rgba(255,204,51,.35);
    }
    .trn-beat-item { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }
  </style>
  <script id="trn-beat-js">
  (function () {
    if (document.querySelector("[data-trn-native-beats]")) return;   // 페이지가 이미 beat 를 갖고 있으면 관여하지 않는다

    var beats = [], bi = 0, wantLast = false, busy = false, timer = null;

    // 자동재생(스텝 3초 간격 setInterval)도 beat 를 하나씩 밟게 한다.
    // 페이지 콜백을 직접 건드릴 수 없으므로 setInterval 을 감싸, 남은 beat 가 있으면
    // 원래 콜백을 건너뛰고 beat 만 넘긴다. 마지막 beat 에서만 원래 콜백이 실행돼 스텝이 넘어간다.
    try {
      var rawSetInterval = window.setInterval;
      window.setInterval = function (fn, delay) {
        // 자동재생은 3000ms(일부 4000ms), 애니메이션 틱은 1900ms 이하라 2500 을 경계로 삼는다
        if (typeof fn !== "function" || !(delay >= 2500)) return rawSetInterval.apply(window, arguments);
        var rest = [].slice.call(arguments, 2);
        return rawSetInterval(function () {
          if (beats.length && bi < beats.length - 1) { bi++; apply(); return; }
          fn.apply(null, rest);
        }, delay);
      };
    } catch (e) {}

    /** 코드 패널의 줄 목록을 찾는다 */
    function codeRows() {
      var first = document.querySelector('[class*="overflow-auto"] [data-hi]');
      if (!first) return null;
      var sc = first.closest('[class*="overflow-auto"]');
      if (!sc) return null;
      return { sc: sc, rows: [].slice.call(sc.querySelectorAll("[data-hi]")) };
    }

    /** 강조된 줄을 연속 구간으로 묶고, 너무 길면 8줄 단위로 쪼갠다 */
    function buildBeats(rows) {
      var hi = [];
      for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute("data-hi") === "1") hi.push(i);
      if (hi.length < 4) return [];                 // 이미 충분히 좁으면 그대로 둔다
      var runs = [], cur = [hi[0]];
      for (var k = 1; k < hi.length; k++) {
        if (hi[k] === hi[k - 1] + 1) cur.push(hi[k]);
        else { runs.push(cur); cur = [hi[k]]; }
      }
      runs.push(cur);
      var split = [];
      for (var r = 0; r < runs.length; r++) {
        var run = runs[r];
        if (run.length <= 8) { split.push(run); continue; }
        var parts = Math.ceil(run.length / 8), size = Math.ceil(run.length / parts);
        for (var j = 0; j < run.length; j += size) split.push(run.slice(j, j + size));
      }
      var merged = [];
      for (var m = 0; m < split.length; m++) {
        var seg = split[m], prev = merged[merged.length - 1];
        if (seg.length <= 2 && prev && prev.length + seg.length <= 8) merged[merged.length - 1] = prev.concat(seg);
        else merged.push(seg);
      }
      // 첫 조각이 너무 짧으면 다음 조각에 붙인다 (앞에 붙일 대상이 없으므로)
      if (merged.length > 1 && merged[0].length <= 2 && merged[0].length + merged[1].length <= 8) {
        merged[1] = merged[0].concat(merged[1]);
        merged.shift();
      }
      return merged.length > 1 ? merged : [];
    }

    /** 좌측 그림에서 beat 수와 항목 수가 정확히 일치하는 목록이 딱 하나면 그 항목에 표시한다 */
    function markLeft(n, idx) {
      var grid = document.querySelector('[class*="lg:grid-cols-2"]');
      if (!grid || !grid.children.length) return;
      var pane = grid.children[0];
      [].forEach.call(pane.querySelectorAll(".trn-beat-item"), function (e) { e.classList.remove("trn-beat-item"); });
      if (n < 3 || n > 6) return;
      var cands = [];
      var all = pane.querySelectorAll("*");
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length !== n) continue;
        var ok = true;
        for (var c = 0; c < el.children.length; c++) {
          if (el.children[c].textContent.trim().length < 3) { ok = false; break; }
        }
        if (ok) cands.push(el);
      }
      if (cands.length !== 1) return;               // 애매하면 표시하지 않는다
      cands[0].children[idx].classList.add("trn-beat-item");
    }

    /** 줄 번호 목록을 "L7–10, L14" 처럼 조각별로 적는다 (비연속 구간을 한 범위로 뭉뚱그리지 않는다) */
    function ranges(idx) {
      var a = idx.slice().sort(function (x, y) { return x - y; });
      var out = [], s = a[0], p = a[0];
      for (var i = 1; i <= a.length; i++) {
        if (a[i] === p + 1) { p = a[i]; continue; }
        out.push(s === p ? "L" + (s + 1) : "L" + (s + 1) + "–" + (p + 1));
        s = a[i]; p = a[i];
      }
      if (out.length > 2) return out.slice(0, 2).join(", ") + " 외 " + (out.length - 2);
      return out.join(", ");
    }

    function badge(d, text) {
      var panel = d.sc.closest(".rounded-xl") || d.sc.parentElement;
      var head = panel ? panel.querySelector(".border-b") : null;
      if (!head) return;
      var b = document.getElementById("trn-beat-badge");
      if (!b) { b = document.createElement("span"); b.id = "trn-beat-badge"; }
      if (b.parentElement !== head) head.appendChild(b);
      b.textContent = text;
    }

    function apply() {
      var d = codeRows();
      if (!d) return;
      busy = true;
      for (var i = 0; i < d.rows.length; i++) {
        d.rows[i].classList.remove("trn-beat-on", "trn-beat-off");
      }
      if (!beats.length) {
        var old = document.getElementById("trn-beat-badge");
        if (old) old.remove();
        markLeft(0, 0);
        busy = false;
        return;
      }
      if (bi >= beats.length) bi = beats.length - 1;
      if (bi < 0) bi = 0;
      var on = beats[bi];
      for (var j = 0; j < d.rows.length; j++) {
        d.rows[j].classList.add(on.indexOf(j) >= 0 ? "trn-beat-on" : "trn-beat-off");
      }
      badge(d, ranges(on) + " · 세부 " + (bi + 1) + "/" + beats.length);
      markLeft(beats.length, bi);
      // 활성 구간을 코드 패널 가운데로
      var el = d.rows[on[0]];
      if (d.sc.scrollHeight > d.sc.clientHeight + 4) {
        var r1 = el.getBoundingClientRect(), r2 = d.sc.getBoundingClientRect();
        var delta = (r1.top - r2.top) - (d.sc.clientHeight / 2 - r1.height / 2);
        d.sc.scrollTo({ top: Math.max(0, d.sc.scrollTop + delta), behavior: "smooth" });
      }
      setTimeout(function () { busy = false; }, 40);
    }

    function rebuild() {
      var d = codeRows();
      if (!d) { beats = []; return; }
      beats = buildBeats(d.rows);
      bi = wantLast && beats.length ? beats.length - 1 : 0;
      wantLast = false;
      apply();
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(rebuild, 90); }

    /** 다음/이전을 먼저 가로채 beat 를 이동하고, 끝에 도달했을 때만 스텝 전환을 통과시킨다 */
    function step(dir, ev) {
      if (!beats.length) return false;
      if (dir > 0 && bi < beats.length - 1) { bi++; apply(); return true; }
      if (dir < 0 && bi > 0) { bi--; apply(); return true; }
      if (dir < 0) wantLast = true;               // 이전 스텝으로 가면 그 스텝의 마지막 beat 부터
      return false;
    }

    /** aria-label 이 없는 페이지도 있어 버튼 텍스트까지 본다 */
    function dirOf(b) {
      var l = b.getAttribute("aria-label") || "";
      var t = (b.textContent || "").replace(/\s/g, "");
      if (l === "다음 단계" || t.indexOf("다음") === 0 || t === "다음→") return 1;
      if (l === "이전 단계" || t.indexOf("이전") >= 0) return -1;
      if (l.indexOf("자동") === 0 || t.indexOf("자동재생") >= 0 || t.indexOf("일시정지") >= 0 || t.indexOf("다시보기") >= 0) return 9;
      return 0;
    }

    document.addEventListener("click", function (e) {
      var b = e.target && e.target.closest ? e.target.closest("button") : null;
      if (!b || b.disabled) return;
      var dir = dirOf(b);
      if (dir === 9) return;                                     // 자동재생은 감싼 setInterval 이 beat 를 밟는다
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("keydown", function (e) {
      var dir = e.key === "ArrowRight" ? 1 : (e.key === "ArrowLeft" ? -1 : 0);
      if (!dir) return;
      if (step(dir, e)) { e.stopPropagation(); e.preventDefault(); }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        rebuild();
        var d = codeRows();
        if (!d) return;
        try {
          new MutationObserver(function () { if (!busy) schedule(); })
            .observe(d.sc, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["data-hi"] });
        } catch (e) {}
      }, 600);
    });
  })();
  </script>
  <style id="trn-mark-css">
    @keyframes trn-pop { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
    .trn-mark { animation: trn-pop .2s ease-out both; }
  </style>
</head>
<body>
  <div id="root" data-trn-native-beats="1"></div>

  <!--
    SQLite Chapter IV-1-1 — WAL mode vs Rollback Journal
    학습 목표: 두 저널 방식의 동시성 차이, WAL 파일 구조, 체크포인트, 실무 함정
    Rollback Journal = 원본 백업 후 덮어쓰기(쓰기 중 읽기 차단)
    WAL = 변경을 추가 기록(읽기·쓰기 동시), 체크포인트로 본 DB 반영
    패턴: fastapi v1 — 좌(LiveDataPane: 동시성 대비 애니메이션) / 우(VSCode CodeViewer)
    색상: slate (sqlite 도메인, #003B57)
  -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // beat 마다 무엇이 바뀌었는지 표시한다
    const MARK = {
      new:     { sign: '＋', color: '#16a34a', bg: '#f0fdf4', bd: '#86efac' },
      changed: { sign: '↻', color: '#d97706', bg: '#fffbeb', bd: '#fcd34d' },
      read:    { sign: '→', color: '#2563eb', bg: '#eff6ff', bd: '#93c5fd' },
      gone:    { sign: '−', color: '#78716c', bg: '#fafaf9', bd: '#d6d3d1' },
    };

    // 코드 본문은 스텝마다 하나뿐이라 상수로 묶고, beat 는 강조 줄만 바꿔 쓴다
    const CODE = {
      rollback:   {lang:'sql',  filename:'rollback-journal.sql', lines:[
            '-- Step 1. Rollback Journal (SQLite 기본 방식)',
            '',
            '-- 현재 저널 모드 확인',
            'PRAGMA journal_mode;',
            '-- 결과: delete  (rollback journal 계열 기본값)',
            '',
            '-- 동작 원리',
            '-- BEGIN;                 트랜잭션 시작',
            '--   변경할 페이지의 원본을 mydb.db-journal 에 백업',
            '--   mydb.db 본체를 직접 덮어쓴다 (in-place update)',
            '-- COMMIT;                저널 삭제 → 변경 확정',
            '--   중간에 프로세스가 죽으면?',
            '--   다음 접속 시 -journal 을 읽어 원본 복원 (자동 롤백)',
            '',
            '-- 실습: 쓰기 트랜잭션',
            'BEGIN IMMEDIATE;',
            'UPDATE accounts SET balance = balance - 100 WHERE id = 1;',
            'UPDATE accounts SET balance = balance + 100 WHERE id = 2;',
            '-- 이 순간 mydb.db-journal 파일이 생김 (원본 백업)',
            '-- 이 순간 다른 커넥션의 SELECT 는 SQLITE_BUSY 로 대기',
            'COMMIT;',
            '-- => 커밋되면 -journal 삭제, 그제서야 reader 진입 가능',
            '',
            '-- 잠금(lock) 단계: writer 는 EXCLUSIVE 락을 잡는다',
            '-- SHARED   : 읽기 (여러 reader 공유 가능)',
            '-- RESERVED : 곧 쓸 예정 (아직 읽기 허용)',
            '-- EXCLUSIVE: 쓰는 중 (모든 접근 차단)  <= 여기서 reader 막힘',
            '',
            '-- 한계: writer 1명 = reader 전부 대기',
            '-- 웹 서버처럼 동시 읽기가 많으면 병목 발생',
            '-- => 다음 Step: WAL 로 읽기·쓰기 동시 처리',
      ]},
      enableWal:  {lang:'sql',  filename:'enable-wal.sql',       lines:[
            '-- Step 2. WAL mode 전환과 동작',
            '',
            '-- WAL 모드로 전환 (DB당 한 번, 영구 저장됨)',
            'PRAGMA journal_mode = WAL;',
            '-- 결과: wal',
            '-- 주의: 이 설정은 DB 파일에 기록되어 다음 접속에도 유지',
            '',
            '-- 동작 원리',
            '-- writer: mydb.db 를 안 건드리고 mydb.db-wal 끝에 변경 append',
            '-- reader: mydb.db 본체 + 자기 시점까지의 -wal 을 합쳐서 읽음',
            '--   => 각 reader 는 트랜잭션 시작 시점의 스냅샷을 봄 (일관성)',
            '--   => writer 가 계속 append 해도 reader 는 방해받지 않음',
            '',
            '-- 동시성 실측 비교',
            '-- reader A: SELECT ... (진행 중)',
            '-- reader B: SELECT ... (동시 진행)',
            '-- writer  : INSERT ... (동시에 -wal 에 append)',
            '--   => rollback journal 이면 A, B 가 대기했을 상황',
            '--   => WAL 이면 셋 다 동시에 완료',
            '',
            '-- 실습',
            'PRAGMA journal_mode = WAL;',
            'BEGIN;',
            'INSERT INTO events(name, ts) VALUES ("login", 1700000000);',
            '-- 이 순간 다른 커넥션의 SELECT 는 막히지 않음',
            'COMMIT;',
            '-- => 변경은 아직 -wal 에만 있음. 본 DB 반영은 체크포인트에서',
            '',
            '-- WAL 이 유리한 상황',
            '-- 1) 읽기가 많은 웹/모바일 앱 (동시 SELECT 폭주)',
            '-- 2) 쓰기 지연이 중요한 로그/이벤트 수집',
            '-- 3) 짧은 쓰기가 자주 일어나는 워크로드',

               caption:'WAL + synchronous=NORMAL 이 실무 표준이다. 절대 손실이 안 되면 FULL 을 쓰되 느려진다.',
               changes:[{mark:'new',     text:'함정 카드 5개'},
                        {mark:'changed', text:'synchronous FULL → NORMAL'}] },
        viz:{ kind:'pitfalls', items:[P1, P2, P3, P4, P5] },
        verdict:'NORMAL 표준',
        verdictTone:'good',
        keyPoint:'WAL + NORMAL 은 전원 손실 시 마지막 몇 트랜잭션만 위험할 뿐 DB 손상은 없다.',
        code:{...CODE.pitfalls, highlight:[26,27,28,29,30,31]},
      },
      { ...S5,
        beat:{ label:'권장 초기화 세트', at:'wal-pitfalls.sql L33–37',
               caption:'로컬 앱이면 이 네 줄을 연결 시작에 그대로 넣으면 된다. WAL 관련 함정이 대부분 덮인다.',
               changes:[{mark:'new',  text:'journal_mode·synchronous·busy_timeout·foreign_keys'},
                        {mark:'read', text:'다음 챕터: 잠금과 SQLITE_BUSY'}] },
        viz:{ kind:'pitfalls', items:[P1, P2, P3, P4, P5] },
        verdict:'함정 주의',
        verdictTone:'warn',
        summary: {
          title: 'IV-1-1 WAL vs Rollback Journal 정리',
          rows: [
            { metric: '읽기·쓰기 동시', before: 'Rollback: X', after: 'WAL: O', delta: 'WAL 우세' },
            { metric: '쓰기 방식', before: 'Rollback: 덮어쓰기', after: 'WAL: append', delta: 'WAL 빠름' },
            { metric: '파일 수', before: 'Rollback: 2', after: 'WAL: 3(-wal,-shm)', delta: '세트 관리' },
            { metric: '동시 쓰기', before: 'Rollback: 1명', after: 'WAL: 1명', delta: '동일' },
            { metric: '네트워크 FS', before: 'Rollback: O', after: 'WAL: X', delta: 'Rollback' },
          ],
        },
        keyPoint:'로컬 앱이면 WAL 기본 권장. 네트워크 FS·-wal 삭제·장수 reader만 피하면 안전. 다음(IV-1-2) 잠금/BUSY 처리.',
        code:{...CODE.pitfalls, highlight:[33,34,35,36,37]},
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    // 흐르는 점 애니메이션 (변경이 이동하는 모습)
    function FlowDots({ color }) {
      return (
        <div className="relative h-2 flex-1 overflow-hidden rounded-full bg-slate-200 mx-2">
          <div className={`absolute top-0 h-2 w-6 rounded-full ${color}`} style={{ animation: 'slideDot 1.6s linear infinite' }}></div>
        </div>
      );
    }

    // Step 1: Rollback Journal — 쓰기 중 reader 차단
    function JournalViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-3">
          <div className="text-xs font-mono text-rose-800 bg-rose-100 border border-rose-300 rounded px-2 py-1 inline-block">{viz.mode}</div>
          <div className="flex items-center gap-2">
            <div className="bg-slate-700 text-white text-[11px] font-bold rounded px-3 py-2 min-w-[72px] text-center">writer</div>
            <FlowDots color="bg-rose-500" />
            <div className="bg-white border-2 border-rose-400 rounded px-3 py-2 text-center min-w-[96px]">
              <div className="text-[10px] text-slate-500">본 DB</div>
              <div className="text-xs font-mono font-bold text-slate-800">mydb.db</div>
              <div className="text-[9px] text-rose-600">덮어쓰는 중</div>
            </div>
          </div>
          <div className="flex items-center gap-2 opacity-90">
            <div className="bg-slate-400 text-white text-[11px] font-bold rounded px-3 py-2 min-w-[72px] text-center">reader</div>
            <div className="flex-1 mx-2 text-center">
              <span className="text-[11px] font-bold text-rose-700 bg-rose-100 border border-rose-300 rounded-full px-3 py-0.5">SQLITE_BUSY · 대기</span>
            </div>
            <div className="text-2xl text-rose-400">✕</div>
          </div>
          <div className="text-[10px] text-center text-slate-600">{viz.note}</div>
        </div>
      );
    }

    // Step 2: WAL — reader 스냅샷 + writer append 동시
    function WalViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-3">
          <div className="text-xs font-mono text-emerald-800 bg-emerald-100 border border-emerald-300 rounded px-2 py-1 inline-block">{viz.mode}</div>
          <div className="flex items-center gap-2">
            <div className="bg-slate-700 text-white text-[11px] font-bold rounded px-3 py-2 min-w-[72px] text-center">writer</div>
            <FlowDots color="bg-emerald-500" />
            <div className="bg-white border-2 border-emerald-400 rounded px-3 py-2 text-center min-w-[96px]">
              <div className="text-[10px] text-slate-500">변경 로그</div>
              <div className="text-xs font-mono font-bold text-emerald-800">-wal</div>
              <div className="text-[9px] text-emerald-600">append</div>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="bg-emerald-600 text-white text-[11px] font-bold rounded px-3 py-2 min-w-[72px] text-center">reader</div>
            <FlowDots color="bg-slate-500" />
            <div className="bg-white border-2 border-slate-400 rounded px-3 py-2 text-center min-w-[96px]">
              <div className="text-[10px] text-slate-500">스냅샷</div>
              <div className="text-xs font-mono font-bold text-slate-800">mydb.db</div>
              <div className="text-[9px] text-slate-600">읽기 OK</div>
            </div>
          </div>
          <div className="text-center">
            <span className="text-[11px] font-bold text-emerald-700 bg-emerald-100 border border-emerald-300 rounded-full px-3 py-0.5">동시 진행 · 충돌 없음</span>
          </div>
          <div className="text-[10px] text-center text-slate-600">{viz.note}</div>
        </div>
      );
    }

    // Step 3: Checkpoint — -wal 프레임이 본 DB로 이동
    function CheckpointViz({ viz }) {
      const frames = Array.from({ length: viz.walFrames });
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-3">
          <div className="text-xs text-slate-600">체크포인트: -wal 프레임 → 본 DB 병합</div>
          <div className="flex items-center gap-3">
            <div className="flex-1">
              <div className="text-[10px] text-emerald-700 mb-1 text-center">mydb.db-wal</div>
              <div className="flex flex-wrap gap-1 justify-center">
                {frames.map((_, i) => (
                  <span key={i} className="w-6 h-6 rounded bg-emerald-400 border border-emerald-600" style={{ animation: `pulseFrame 1.8s ease-in-out ${i * 0.2}s infinite` }}></span>
                ))}
              </div>
            </div>
            <div className="text-3xl text-slate-500" style={{ animation: 'slideDot 1.6s linear infinite' }}>→</div>
            <div className="bg-white border-2 border-slate-400 rounded px-3 py-3 text-center min-w-[96px]">
              <div className="text-[10px] text-slate-500">본 DB</div>
              <div className="text-xs font-mono font-bold text-slate-800">{viz.movedTo}</div>
              <div className="text-[9px] text-slate-600">병합 반영</div>
            </div>
          </div>
          <div className="text-center">
            <span className="text-[11px] font-bold text-slate-700 bg-slate-200 border border-slate-300 rounded-full px-3 py-0.5">이후 -wal 재사용 (크기 유지)</span>
          </div>
          <div className="text-[10px] text-center text-slate-600">{viz.note}</div>
        </div>
      );
    }

    // Step 4: 파일 3개
    function FilesViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-2">
          {viz.files.map((f, i) => {
            const t = TONE[f.tone] || TONE.warn;
            return (
              <div key={i} className={`flex items-center gap-3 rounded border p-2 ${t.bg} ${t.border}`}>
                <span className="text-lg">📄</span>
                <div className="flex-1">
                  <div className="text-xs font-mono font-bold text-slate-800">{f.name}</div>
                  <div className={`text-[10px] ${t.text}`}>{f.role}</div>
                </div>
                <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>보존</span>
              </div>
            );
          })}
          <div className="text-[10px] text-center text-slate-600 pt-1">{viz.note}</div>
        </div>
      );
    }

    // Step 5: 함정
    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => (
            <div key={i} className="flex items-start gap-2 bg-amber-50 border border-amber-300 rounded p-2">
              <span className="text-amber-700 font-bold w-4 text-center">{it.icon}</span>
              <div className="flex-1">
                <div className="text-xs font-bold text-amber-900">{it.label}</div>
                <div className="text-[10px] text-amber-800">{it.desc}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">Rollback</th><th className="py-1 pr-2">WAL</th><th className="py-1">결론</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">동시성 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>
          {state.beat && (
            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-zinc-900">{state.beat.label}</span>
                <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold border border-zinc-300 bg-zinc-50 text-zinc-700">↔ {state.beat.at}</span>
              </div>
              <p className="text-[11px] mt-1 text-zinc-600">{state.beat.caption}</p>
              {state.beat.changes && (
                <div className="flex flex-wrap gap-1 mt-1.5">
                  {state.beat.changes.map((c, i) => {
                    const m = MARK[c.mark] || MARK.changed;
                    return (
                      <span key={i} className="trn-mark text-[10px] px-1.5 py-0.5 rounded border"
                            style={{ background: m.bg, borderColor: m.bd, color: m.color }}>
                        <b>{m.sign}</b> {c.text}
                      </span>
                    );
                  })}
                </div>
              )}
            </div>
          )}


          {viz?.kind === 'journal' && <JournalViz viz={viz} />}
          {viz?.kind === 'wal' && <WalViz viz={viz} />}
          {viz?.kind === 'checkpoint' && <CheckpointViz viz={viz} />}
          {viz?.kind === 'files' && <FilesViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      const [tokenHtml, setTokenHtml] = useState(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          codeRef.current.textContent = code.lines.join('\n');
          window.hljs.highlightElement(codeRef.current);
          setTokenHtml(codeRef.current.innerHTML.split('\n'));
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = code.lines.map((l, i) => ({
        html: tokenHtml && tokenHtml[i] !== undefined ? tokenHtml[i] : l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
      }));

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>세부 {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <span className="inline-block text-[10px] font-bold text-[#003B57] bg-sky-100 border border-sky-200 rounded px-2 py-0.5 mb-1">Part IV. WAL과 동시성 · IV-1-1</span>
                <h1 className="text-2xl font-bold text-slate-900">WAL mode vs Rollback Journal</h1>
                <p className="text-sm text-slate-700/80">두 저널 방식과 동시성의 차이</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                Rollback Journal은 원본 백업 후 본 DB를 덮어써 쓰기 중 읽기를 막는다. WAL은 변경을 -wal에 append해 읽기·쓰기를 동시에 처리하고 체크포인트로 본 DB에 반영한다. 파일이 3개(-wal, -shm)로 늘고 한 세트로 관리해야 하며, 네트워크 FS·-wal 삭제·장수 reader만 피하면 로컬 앱에는 WAL이 좋은 기본값이다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['WAL', 'RollbackJournal', 'checkpoint', 'journal_mode', 'busy_timeout', 'synchronous'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-1-2.html" className="underline hover:no-underline">다음: IV-1-2 잠금과 SQLITE_BUSY →</a>
            </nav>
          </div>
        </div>
      );
    }

    const styleEl = document.createElement('style');
    styleEl.textContent = '@keyframes slideDot{0%{left:-24px}100%{left:100%}}@keyframes pulseFrame{0%,100%{opacity:1}50%{opacity:.35}}';
    document.head.appendChild(styleEl);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
