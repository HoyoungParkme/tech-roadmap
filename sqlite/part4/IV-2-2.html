            { icon: '⚠', label: 'cache * 연결 수', desc: '연결마다 캐시. 64MiB*20 = 1.2GiB 소모.' },
            { icon: '⚠', label: 'page_size 타이밍', desc: '데이터 넣은 뒤엔 VACUUM 없이 안 바뀜.' },
            { icon: '⚠', label: '무분별 동시 튜닝', desc: '한꺼번에 바꾸면 원인 추적 불가.' },
            { icon: '⚠', label: '벤치 없이 확신', desc: '워크로드마다 최적값 다름. 반드시 측정.' },
          ],
        },
        verdict: '함정 주의',
        verdictTone: 'warn',
        summary: {
          title: 'IV-2-2 성능 PRAGMA 정리',
          rows: [
            { metric: 'synchronous', before: 'FULL', after: 'WAL 이면 NORMAL', delta: '균형' },
            { metric: 'cache_size', before: '-2000', after: '-65536(연결수 고려)', delta: '읽기↑' },
            { metric: 'temp_store', before: 'FILE', after: 'MEMORY', delta: '정렬↑' },
            { metric: 'page_size', before: '4096', after: '데이터 전 결정', delta: '주의' },
            { metric: 'OFF 튜닝', before: '빠름', after: '전원 손실 손상', delta: '금지' },
          ],
        },
        keyPoint: '속도만 보고 OFF 로 가지 말 것. 한 번에 하나씩 측정. WAL+NORMAL+넉넉한 cache 가 안전한 기본. 다음(V-1-1) 로.',
        code: {
          lang: 'sql',
          filename: 'pitfalls.sql',
          lines: [
            '-- Step 5. 성능 PRAGMA 함정 5가지',
            '',
            '-- 1) synchronous=OFF 로 전원 손실 손상',
            'PRAGMA synchronous = OFF;  -- 빠르지만 위험',
            '-- 크래시/전원 손실 시 WAL 또는 DB 페이지가 반쯤 써져 손상',
            '-- => 프로덕션은 최소 NORMAL, 회계성 데이터는 FULL',
            '',
            '-- 2) cache 과다: 연결 수를 곱하지 않은 실수',
            'PRAGMA cache_size = -262144;  -- 256MiB * 연결 20개?',
            '-- => 총 5GiB. OOM 으로 프로세스가 죽는다.',
            '-- 계산식: 캐시 총량 = |cache_size| * 최대 동시 연결 수',
            '',
            '-- 3) page_size 변경 타이밍',
            'PRAGMA page_size = 8192;  -- 데이터 이미 있으면 무시됨',
            'SELECT count(*) FROM users; -- 여전히 옛 page_size',
            '-- => 반영하려면 VACUUM 필수',
            'VACUUM;',
            'PRAGMA page_size;  -- => 8192 (이제 반영)',
            '',
            '-- 4) 근거 없이 한꺼번에 바꾸기',
            '-- 여러 PRAGMA 를 동시에 바꾸면 무엇이 문제인지 모른다',
            '-- => 한 번에 하나씩 바꾸고 .timer 로 측정',
            '',
            '-- 5) 벤치마크 없이 남의 값 복붙',
            '-- 워크로드(읽기/쓰기 비율, 행 크기)마다 최적이 다름',
            '.timer ON',
            'SELECT count(*) FROM orders WHERE status = "PAID";',
            '-- 대표 쿼리를 내 데이터로 직접 측정',
            '',
            '-- 안전한 기본 요약',
            '-- journal_mode=WAL, synchronous=NORMAL,',
            '-- cache_size=넉넉히(연결수 고려), temp_store=MEMORY',
            '',
            '-- 다음 챕터: V-1-1 로 이어짐',
          ],
          highlight: [2, 3, 4, 5, 7, 8, 9, 10, 12, 13, 14, 15, 16, 17, 24, 25, 26],
        },
      },
    ];

    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800', bar: 'bg-emerald-500' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800',   bar: 'bg-amber-500' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800',    bar: 'bg-rose-500' },
    };

    function SpeedSafetyBars({ speed, safety }) {
      const speedTone = speed >= 80 ? 'good' : speed >= 45 ? 'warn' : 'danger';
      const safeTone = safety >= 80 ? 'good' : safety >= 45 ? 'warn' : 'danger';
      const Bar = ({ label, value, tone, hint }) => (
        <div className="flex items-center gap-2">
          <span className="text-[10px] text-slate-500 w-14">{label}</span>
          <div className="flex-1 h-3 bg-white rounded border border-slate-300 overflow-hidden">
            <div className={`h-full ${TONE[tone].bar} transition-all duration-700`} style={{ width: `${value}%` }}></div>
          </div>
          <span className="text-[10px] font-mono w-24 text-right text-slate-600">{hint}</span>
        </div>
      );
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-3 mb-3 space-y-2">
          <div className="text-[11px] text-slate-600 mb-1">안전성 · 속도 다이얼</div>
          <Bar label="쓰기 속도" value={speed} tone={speedTone} hint={`${speed}%`} />
          <Bar label="내구성" value={safety} tone={safeTone} hint={`${safety}%`} />
        </div>
      );
    }

    function SyncDialViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-2">
          <div className="text-xs text-slate-600 mb-1">PRAGMA synchronous 다이얼</div>
          {viz.levels.map((lv) => {
            const t = TONE[lv.tone];
            const active = lv.name === viz.active;
            return (
              <div key={lv.name} className={`flex items-center gap-2 p-2 rounded border ${active ? `${t.bg} ${t.border} ring-2 ring-[#003B57]` : 'bg-white border-slate-200'}`}>
                <span className={`text-xs font-mono font-bold w-16 ${active ? t.text : 'text-slate-500'}`}>{lv.name}</span>
                <span className="text-[10px] font-mono bg-slate-700 text-white px-1.5 py-0.5 rounded">={lv.code}</span>
                <span className="text-[10px] text-slate-500 w-20">fsync {lv.fsync}</span>
                <span className={`flex-1 text-[10px] ${active ? t.text : 'text-slate-400'}`}>{lv.note}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function CacheGaugeViz({ viz }) {
      const Card = ({ d, tone }) => {
        const t = TONE[tone];
        return (
          <div className={`flex-1 border rounded p-3 ${t.bg} ${t.border}`}>
            <div className={`text-[10px] font-bold ${t.text} mb-2`}>{d.label}</div>
            <div className="h-2 bg-white rounded border border-slate-300 overflow-hidden mb-1">
              <div className={`h-full ${t.bar}`} style={{ width: `${d.hit}%` }}></div>
            </div>
            <div className="text-[10px] text-slate-600">캐시 적중 {d.hit}%</div>
            <div className="text-[10px] font-mono text-slate-700">{d.pages.toLocaleString()} pages</div>
            <div className="mt-1 text-[10px] font-mono bg-slate-700 text-white px-2 py-0.5 rounded inline-block">{d.ms}ms</div>
          </div>
        );
      };
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-2">cache_size 확대 효과 (반복 조회)</div>
          <div className="flex items-stretch gap-2">
            <Card d={viz.before} tone="danger" />
            <div className="self-center text-lg text-slate-400">→</div>
            <Card d={viz.after} tone="good" />
          </div>
        </div>
      );
    }

    function TuneKnobsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          <div className="text-xs text-slate-600 mb-1">디스크 사용 방식 노브</div>
          {viz.knobs.map((k, i) => {
            const t = TONE[k.tone];
            return (
              <div key={i} className={`flex items-center gap-2 p-2 rounded border ${t.bg} ${t.border}`}>
                <span className="text-[11px] font-mono font-bold text-slate-800 w-24">{k.name}</span>
                <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded ${t.badge}`}>{k.value}</span>
                <span className="flex-1 text-[10px] text-slate-600 text-right">{k.effect}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function ProfileViz({ viz }) {
      const max = Math.max(...viz.bench.map((b) => b.ms));
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-3">
          <div>
            <div className="text-xs text-slate-600 mb-2">권장 PRAGMA 세트</div>
            <div className="bg-white border border-slate-300 rounded p-2 space-y-1">
              {viz.settings.map((s, i) => (
                <div key={i} className="text-[10px] font-mono text-[#003B57]">PRAGMA {s};</div>
              ))}
            </div>
          </div>
          <div>
            <div className="text-xs text-slate-600 mb-2">10000건 트랜잭션 INSERT 벤치</div>
            <div className="space-y-2">
              {viz.bench.map((b, i) => {
                const t = TONE[b.tone];
                return (
                  <div key={i} className="flex items-center gap-2">
                    <span className="text-[10px] w-24 text-slate-600">{b.label}</span>
                    <div className="flex-1 h-4 bg-white rounded border border-slate-300 overflow-hidden">
                      <div className={`h-full ${t.bar} transition-all duration-700`} style={{ width: `${(b.ms / max) * 100}%` }}></div>
                    </div>
                    <span className="text-[10px] font-mono w-16 text-right text-slate-700">{b.ms}ms</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => (
            <div key={i} className="flex items-start gap-2 bg-amber-50 border border-amber-300 rounded p-2">
              <span className="text-amber-700">{it.icon}</span>
              <div className="flex-1">
                <div className="text-xs font-bold text-amber-900">{it.label}</div>
                <div className="text-[10px] text-amber-800">{it.desc}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">기본</th><th className="py-1 pr-2">권장</th><th className="py-1">비고</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">성능 PRAGMA 다이얼</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          <SpeedSafetyBars speed={state.speed} safety={state.safety} />

          {viz?.kind === 'sync-dial' && <SyncDialViz viz={viz} />}
          {viz?.kind === 'cache-gauge' && <CacheGaugeViz viz={viz} />}
          {viz?.kind === 'tune-knobs' && <TuneKnobsViz viz={viz} />}
          {viz?.kind === 'profile' && <ProfileViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <div className="text-[11px] font-bold text-[#003B57] mb-0.5">Part IV. WAL과 동시성 · IV-2-2</div>
                <h1 className="text-2xl font-bold text-slate-900">성능 PRAGMA — cache_size · synchronous</h1>
                <p className="text-sm text-slate-700/80">안전성과 속도의 트레이드오프를 다이얼로 조절</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                synchronous 는 fsync 빈도로 내구성과 속도를 저울질한다. WAL 에서는 synchronous=NORMAL 이 커밋 손실 없이 빠른 균형점이다. cache_size 는 연결마다 잡히니 연결 수를 곱해 정하고, temp_store=MEMORY 로 정렬을 RAM 에서 처리한다. page_size 는 데이터 넣기 전에 정한다. OFF 로 가지 말고 한 번에 하나씩 벤치마크로 확인한다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['synchronous', 'cache_size', 'temp_store', 'page_size', 'WAL', 'fsync'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="../part5/V-1-1.html" className="underline hover:no-underline">다음: V-1-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
