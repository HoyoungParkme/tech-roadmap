      {
        title: 'Step 5. 연결 풀 — 읽기 다수 · 쓰기 하나로 웹서버에 얹는다',
        desc: '웹서버에서 SQLite 를 쓸 때의 정석은 읽기 연결 풀(여러 개)과 쓰기 경로 하나를 분리하는 것이다. 조회 핸들러는 풀에서 읽기 연결을 빌려 WAL 병렬로 처리하고, 변경 핸들러는 3단계의 쓰기 큐 하나로 보낸다. 읽기 위주 서비스라면 이 구성으로 충분히 견디고, 쓰기가 집중되면 큐가 병목 지표가 되어 스케일 판단의 기준이 된다. SQLite 는 스레드 안전 모드(serialized/default)를 확인하고, 연결을 스레드 간 공유하지 않는 규칙만 지키면 안정적이다.',
        mode: 'after',
        verdict: '현장 구성',
        verdictTone: 'good',
        summary: {
          title: 'IV-2-1 동시성 튜닝 정리',
          rows: [
            { metric: '읽기', before: 'WAL 병렬', after: '연결 풀 N개', delta: '동시 OK' },
            { metric: '쓰기', before: '단일 큐', after: '소비자 1개', delta: 'BUSY 0' },
            { metric: 'mmap_size', before: '메모리 맵', after: '읽기 가속', delta: '복사 감소' },
            { metric: 'busy_timeout', before: '재시도', after: '순간 경합 흡수', delta: '5000ms' },
            { metric: '쓰기 집중', before: '큐 병목', after: '스케일 신호', delta: '판단 기준' },
          ],
        },
        keyPoint: '읽기 풀(WAL 병렬) + 쓰기 큐(직렬) 분리 = 웹서버용 SQLite 정석. 큐 지연이 스케일 판단 지표. 연결은 스레드 공유 금지.',
        viz: {
          kind: 'concurrency',
          mode: 'pool',
          readers: 4,
          writers: 4,
          note: '읽기 풀 4 병렬 + 쓰기 큐 1 직렬 = 경합 없이 안정',
        },
        code: {
          lang: 'python',
          filename: 'sqlite_pool_web.py',
          lines: [
            '# Step 5. 웹서버용 SQLite — 읽기 풀 + 쓰기 큐',
            'import sqlite3',
            'import queue',
            'import threading',
            'from connection_pragma import open_connection   # Step 4 헬퍼',
            '',
            '# ---------- 읽기 풀: 미리 만든 연결을 빌려 쓰고 반납 ----------',
            'class ReadPool:',
            '    def __init__(self, size=4):',
            '        self._pool = queue.Queue()',
            '        for _ in range(size):',
            '            self._pool.put(open_connection(readonly=True))',
            '',
            '    def query(self, sql, params=()):',
            '        con = self._pool.get()          # 연결 대여',
            '        try:',
            '            return con.execute(sql, params).fetchall()',
            '        finally:',
            '            self._pool.put(con)          # 반드시 반납',
            '',
            '# ---------- 쓰기 큐: 소비자 1개 (Step 3 패턴) ----------',
            'class WriteQueue:',
            '    def __init__(self):',
            '        self._q = queue.Queue()',
            '        threading.Thread(target=self._loop, daemon=True).start()',
            '',
            '    def _loop(self):',
            '        con = open_connection()          # 쓰기 전용 단일 연결',
            '        while True:',
            '            sql, params, done = self._q.get()',
            '            con.execute(sql, params); con.commit()',
            '            done.set()',
            '',
            '    def write(self, sql, params=()):',
            '        done = threading.Event()',
            '        self._q.put((sql, params, done))',
            '        done.wait()',
            '',
            '# ---------- 웹 앱에서 전역으로 한 번만 생성 ----------',
            'reads = ReadPool(size=4)',
            'writes = WriteQueue()',
            '',
            '# GET  /events  -> 읽기 풀 (WAL 병렬)',
            '# POST /events  -> 쓰기 큐 (직렬)',
            '# 규칙: 연결을 스레드 간 공유하지 않는다 (각자 빌려 쓴다)',
            '# 쓰기가 집중돼 큐가 밀리면 -> Postgres 이관 등 스케일 신호',
          ],
          highlight: [7, 8, 11, 14, 15, 18, 20, 21, 26, 27, 30, 31, 38, 39, 42, 43],
        },
      },
    ];

    // ---- 좌측 시각화: 튜닝 전(경합) vs 후(원활) 애니메이션 ----
    function ConcurrencyViz({ viz }) {
      const tick = useTick(650);
      const readers = Array.from({ length: viz.readers });
      const writers = Array.from({ length: viz.writers });

      // 모드별 파라미터
      const isBefore = viz.mode === 'before';
      // 쓰기 활성 인덱스: before 는 모두 동시(경합), 그 외는 큐로 하나씩
      const activeWriter = tick % Math.max(1, viz.writers);

      const readerColor = (i) => {
        if (isBefore) {
          // 튜닝 전: 읽기도 쓰기 락에 막힘
          return 'bg-rose-100 border-rose-300 text-rose-700';
        }
        // 튜닝 후: 읽기는 항상 병렬(초록), 살짝 반짝임
        const pulse = (tick + i) % 2 === 0;
        return pulse ? 'bg-emerald-200 border-emerald-500 text-emerald-900' : 'bg-emerald-100 border-emerald-400 text-emerald-800';
      };

      const writerState = (i) => {
        if (isBefore) {
          // 모두 동시에 락 시도 → 하나만 성공, 나머지 BUSY
          return i === 0 ? { cls: 'bg-amber-200 border-amber-500 text-amber-900', tag: 'WRITE' }
                         : { cls: 'bg-rose-200 border-rose-500 text-rose-900 animate-pulse', tag: 'BUSY' };
        }
        if (viz.mode === 'wal-read') {
          return { cls: 'bg-[#003B57] text-white border-slate-800', tag: 'append' };
        }
        // write-queue / pool: 큐에서 하나씩
        return i === activeWriter
          ? { cls: 'bg-[#003B57] text-white border-slate-800', tag: 'WRITE' }
          : { cls: 'bg-slate-100 border-slate-300 text-slate-500', tag: 'wait' };
      };

      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="flex items-center justify-between mb-3">
            <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isBefore ? 'bg-rose-200 text-rose-800' : 'bg-emerald-200 text-emerald-800'}`}>
              {isBefore ? '튜닝 전 · 경합' : '튜닝 후 · 원활'}
            </span>
            <span className="text-[10px] font-mono text-slate-500">app.db</span>
          </div>

          <div className="flex items-stretch gap-3">
            {/* 읽기 연결 */}
            <div className="flex-1">
              <div className="text-[10px] text-slate-500 mb-1">읽기 연결</div>
              <div className="space-y-1">
                {readers.map((_, i) => (
                  <div key={i} className={`text-[10px] font-mono px-2 py-1 rounded border text-center transition ${readerColor(i)}`}>
                    R{i + 1} {isBefore ? 'blocked' : 'read'}
                  </div>
                ))}
              </div>
            </div>

            {/* 중앙: WAL / DB */}
            <div className="flex flex-col items-center justify-center px-1">
              <div className="text-[10px] text-slate-400">→</div>
              <div className={`text-[10px] font-mono px-2 py-3 rounded border text-center ${isBefore ? 'bg-rose-50 border-rose-300 text-rose-700' : 'bg-white border-slate-300 text-slate-700'}`}>
                {isBefore ? 'rollback\njournal'.split('\n').map((s, k) => <div key={k}>{s}</div>) : 'WAL'}
              </div>
              <div className="text-[10px] text-slate-400">←</div>
            </div>

            {/* 쓰기 연결 / 큐 */}
            <div className="flex-1">
              <div className="text-[10px] text-slate-500 mb-1">
                쓰기 {isBefore ? '(동시 시도)' : (viz.mode === 'wal-read' ? '(1개)' : '(큐)')}
              </div>
              <div className="space-y-1">
                {writers.map((_, i) => {
                  const st = writerState(i);
                  return (
                    <div key={i} className={`text-[10px] font-mono px-2 py-1 rounded border text-center transition ${st.cls}`}>
                      W{i + 1} {st.tag}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <div className={`mt-3 text-[10px] text-center px-2 py-1 rounded border ${isBefore ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-emerald-50 border-emerald-200 text-emerald-800'}`}>
            {viz.note}
          </div>
        </div>
      );
    }

    // ---- PRAGMA 게이지 뷰 ----
    function PragmaViz({ viz }) {
      const tick = useTick(700);
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          <div className="text-[10px] text-slate-500 mb-1">연결마다 적용하는 PRAGMA 세트</div>
          {viz.items.map((it, i) => {
            const t = TONE[it.tone] || TONE.warn;
            const lit = (tick + i) % viz.items.length === i % viz.items.length;
            return (
              <div key={i} className={`flex items-center gap-2 p-2 rounded border ${t.bg} ${t.border} ${lit ? 'ring-1 ring-[#003B57]/30' : ''}`}>
                <span className="text-[10px] font-mono w-28 text-slate-700">PRAGMA {it.label}</span>
                <span className={`text-[10px] font-mono font-bold w-20 text-center px-1 py-0.5 rounded ${t.badge}`}>{it.value}</span>
                <span className={`flex-1 text-[10px] ${t.text}`}>{it.note}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">항목</th><th className="py-1 pr-2">방식</th><th className="py-1 pr-2">효과</th><th className="py-1">결과</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">동시성 튜닝 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          {viz?.kind === 'concurrency' && <ConcurrencyViz viz={viz} />}
          {viz?.kind === 'pragma' && <PragmaViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <div className="inline-flex items-center gap-2 mb-1">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-[#003B57] text-white">Part IV. WAL과 동시성</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-200 text-slate-700">IV-2-1</span>
                </div>
                <h1 className="text-2xl font-bold text-slate-900">동시성 튜닝 — mmap · 연결 풀</h1>
                <p className="text-sm text-slate-700/80">SQLite를 동시성 환경에서 잘 쓰는 실전 튜닝</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                SQLite 동시성의 정석은 읽기는 WAL로 병렬, 쓰기는 단일 큐로 직렬화. mmap_size로 읽기를 가속하고 busy_timeout으로 순간 경합을 흡수한다. 웹서버에서는 읽기 연결 풀 + 쓰기 큐를 분리하고, PRAGMA는 연결마다 적용한다. 함정: 트랜잭션 오래 유지, 쓰기 병렬화 시도(BUSY 폭증), mmap 과다, 연결의 스레드 공유.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['WAL', 'busy_timeout', 'mmap_size', 'write-queue', 'connection-pool', 'SQLITE_BUSY'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-2.html" className="underline hover:no-underline">다음: IV-2-2 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
