    const TONE = {
      good:   { bg: 'bg-emerald-50',  border: 'border-emerald-300', text: 'text-emerald-800', badge: 'bg-emerald-200 text-emerald-800' },
      warn:   { bg: 'bg-amber-50',    border: 'border-amber-400',   text: 'text-amber-800',   badge: 'bg-amber-200 text-amber-800' },
      danger: { bg: 'bg-rose-50',     border: 'border-rose-400',    text: 'text-rose-800',    badge: 'bg-rose-200 text-rose-800' },
    };

    function LockHierarchyViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">쓰기 트랜잭션의 락 승격 순서</div>

              const t = TONE[lv.tone] || TONE.warn;

                <div key={lv.name} className="flex items-center gap-2">
                  <span className="text-[10px] font-mono text-slate-400 w-4 text-right">{i + 1}</span>

                    <span className={`text-xs font-mono font-bold ${t.text} w-20`}>{lv.name}</span>
                    <span className="text-[10px] text-slate-700 flex-1">{lv.desc}</span>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="mt-3 text-[10px] text-center text-slate-600">
            읽기는 SHARED에서 멈추고, 쓰기만 EXCLUSIVE까지 올라간다
          </div>
        </div>
      );
    }

    function BusyViz({ viz }) {
      const [tick, setTick] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setTick((x) => (x + 1) % 3), 900);
        return () => clearInterval(id);
      }, []);
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">동시 쓰기 요청 — RESERVED 락은 하나만</div>
          <div className="flex flex-col gap-2">
            {viz.conns.map((c) => {
              const isWinner = c.id === viz.winner;
              const active = tick >= 1;
              const state = !active ? '대기' : isWinner ? '락 획득' : 'SQLITE_BUSY';
              const t = !active ? TONE.warn : isWinner ? TONE.good : TONE.danger;
              return (
                <div key={c.id} className={`flex items-center gap-2 p-2 rounded border transition ${t.bg} ${t.border}`}>
                  <span className="text-xs font-mono font-bold text-slate-700 w-16">{c.label}</span>
                  <span className="text-[10px] font-mono text-slate-500 flex-1">BEGIN IMMEDIATE</span>
                  <span className={`text-[10px] font-mono font-bold px-2 py-0.5 rounded ${t.badge}`}>{state}</span>
                </div>
              );
            })}
          </div>
          <div className="mt-3 flex items-center justify-center gap-2 text-[10px]">
            <span className="font-mono bg-[#003B57] text-white px-2 py-0.5 rounded">accounts.db</span>
            <span className="text-slate-500">RESERVED 락 = 연결 {viz.winner} 독점</span>
          </div>
        </div>
      );
    }

    function BusyTimeoutViz({ viz }) {
      const [elapsed, setElapsed] = useState(0);
      useEffect(() => {
        setElapsed(0);
        const id = setInterval(() => {
          setElapsed((x) => (x >= viz.waited ? viz.waited : x + 40));
        }, 120);
        return () => clearInterval(id);
      }, [viz.waited]);
      const done = elapsed >= viz.waited;
      const pct = Math.min(100, (elapsed / viz.timeoutMs) * 100 * 6);
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-2">busy_timeout = {viz.timeoutMs}ms — 락 풀릴 때까지 재시도</div>
          <div className="space-y-3">
            <div className="flex items-center gap-2">
              <span className="text-[10px] text-slate-500 w-16">재시도</span>
              <div className="flex-1 h-3 bg-white rounded border border-slate-300 overflow-hidden">
                <div className={`h-full ${done ? 'bg-emerald-500' : 'bg-amber-400'} transition-all`} style={{ width: `${pct}%` }}></div>
              </div>
              <span className="text-[10px] font-mono w-16 text-right">{elapsed}ms</span>
            </div>
            <div className="flex items-center justify-center gap-2 text-[10px]">
              {done ? (
                <span className="font-mono font-bold bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded">락 해제 감지 → 쓰기 성공</span>
              ) : (
                <span className="font-mono bg-amber-200 text-amber-800 px-2 py-0.5 rounded">앞 트랜잭션 커밋 대기 중...</span>
              )}
            </div>
          </div>
          <div className="mt-3 text-[10px] text-center text-slate-600">
            {viz.waited}ms 만에 락 해제 → {viz.timeoutMs}ms 한도 안이라 성공
          </div>
        </div>
      );
    }

    function CheckpointViz({ viz }) {
      const [moved, setMoved] = useState(0);
      useEffect(() => {
        setMoved(0);
        const id = setInterval(() => {
          setMoved((x) => (x >= viz.walFrames ? 0 : x + 1));
        }, 700);
        return () => clearInterval(id);
      }, [viz.walFrames]);
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4">
          <div className="text-xs text-slate-600 mb-3">WAL 프레임을 본 DB로 반영 (checkpoint)</div>
          <div className="flex items-center gap-2 mb-3">
            <div className="flex-1">
              <div className="text-[10px] text-slate-500 mb-1 text-center">-wal 파일</div>
              <div className="flex gap-1 justify-center flex-wrap">
                {Array.from({ length: viz.walFrames }).map((_, i) => (
                  <span key={i} className={`w-5 h-6 rounded text-[9px] flex items-center justify-center font-mono border ${
                    i < moved ? 'bg-slate-200 border-slate-300 text-slate-300 line-through' : 'bg-amber-100 border-amber-400 text-amber-800'
                  }`}>{i + 1}</span>
                ))}
              </div>
            </div>
            <span className="text-xl text-[#003B57]">→</span>
            <div className="flex-1">
              <div className="text-[10px] text-slate-500 mb-1 text-center">main DB</div>
              <div className="flex gap-1 justify-center flex-wrap">
                {Array.from({ length: viz.walFrames }).map((_, i) => (
                  <span key={i} className={`w-5 h-6 rounded text-[9px] flex items-center justify-center font-mono border ${
                    i < moved ? 'bg-emerald-200 border-emerald-400 text-emerald-800' : 'bg-white border-slate-300 text-slate-300'
                  }`}>{i + 1}</span>
                ))}
              </div>
            </div>
          </div>
          <div className="space-y-1.5">
            {viz.modes.map((m) => {
              const t = TONE[m.tone] || TONE.warn;
              return (
                <div key={m.name} className={`flex items-center gap-2 p-1.5 rounded border ${t.bg} ${t.border}`}>
                  <span className={`text-[10px] font-mono font-bold ${t.text} w-16`}>{m.name}</span>
                  <span className="text-[10px] text-slate-700 flex-1">{m.desc}</span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function PitfallsViz({ viz }) {
      return (
        <div className="rounded-lg bg-slate-50 border border-slate-300 p-4 space-y-1.5">
          {viz.items.map((it, i) => (
            <div key={i} className="flex items-start gap-2 bg-amber-50 border border-amber-300 rounded p-2">
              <span className="text-amber-700">{it.icon}</span>
              <div className="flex-1">
                <div className="text-xs font-bold text-amber-900">{it.label}</div>
                <div className="text-[10px] text-amber-800">{it.desc}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SummaryTable({ summary }) {
      if (!summary) return null;
      return (
        <div className="mt-3 rounded-xl border-2 border-slate-400 bg-white p-3">
          <div className="text-sm font-bold text-slate-800 mb-2">📊 {summary.title}</div>
          <table className="w-full text-xs">
            <thead>
              <tr className="text-left text-slate-500 border-b border-slate-200">
                <th className="py-1 pr-2">분류</th><th className="py-1 pr-2">전</th><th className="py-1 pr-2">후</th><th className="py-1">포인트</th>
              </tr>
            </thead>
            <tbody>
              {summary.rows.map((r, i) => (
                <tr key={i} className="border-b border-slate-100">
                  <td className="py-1 pr-2 font-medium text-slate-700">{r.metric}</td>
                  <td className="py-1 pr-2 text-slate-600 font-mono text-[10px]">{r.before}</td>
                  <td className="py-1 pr-2 text-slate-800 font-mono text-[10px]">{r.after}</td>
                  <td className="py-1 text-slate-900 font-bold text-[10px]">{r.delta}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function LiveDataPane({ state }) {
      const t = TONE[state.verdictTone] || TONE.warn;
      const viz = state.viz;
      return (
        <div className="rounded-xl border border-slate-300 bg-white p-4 h-full flex flex-col">
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-bold text-slate-800">동시성 시각화</h3>
            <span className={`text-[10px] px-2 py-0.5 rounded ${t.badge}`}>{state.verdict}</span>
          </div>

          {viz?.kind === 'lock-hierarchy' && <LockHierarchyViz viz={viz} />}
          {viz?.kind === 'busy' && <BusyViz viz={viz} />}
          {viz?.kind === 'busy-timeout' && <BusyTimeoutViz viz={viz} />}
          {viz?.kind === 'checkpoint' && <CheckpointViz viz={viz} />}
          {viz?.kind === 'pitfalls' && <PitfallsViz viz={viz} />}

          <SummaryTable summary={state.summary} />

          <div className="mt-3 text-xs text-slate-800 bg-slate-100 border border-slate-300 rounded p-2">
            💡 {state.keyPoint}
          </div>
        </div>
      );
    }

    function CodeViewer({ code, stepIdx, total }) {
      const codeRef = useRef(null);
      useEffect(() => {
        if (codeRef.current && window.hljs) {
          codeRef.current.removeAttribute('data-highlighted');
          window.hljs.highlightElement(codeRef.current);
        }
      }, [code]);

      const highlightSet = new Set(code.highlight || []);
      const tokenLines = (() => {
        if (!codeRef.current) return code.lines.map((l) => ({ html: l }));
        const html = codeRef.current.innerHTML;
        const split = html.split('\n');
        return code.lines.map((l, i) => ({ html: split[i] !== undefined ? split[i] : l }));
      })();

      return (
        <div className="rounded-xl overflow-hidden border border-slate-700 bg-[#282c34] h-full flex flex-col shadow-lg">
          <div className="flex items-center gap-2 px-3 py-2 bg-slate-800 border-b border-slate-700">
            <span className="w-3 h-3 rounded-full bg-red-400"></span>
            <span className="w-3 h-3 rounded-full bg-yellow-400"></span>
            <span className="w-3 h-3 rounded-full bg-green-400"></span>
            <span className="ml-3 text-xs text-slate-300 font-mono">{code.filename}</span>
            <span className="ml-auto text-[10px] text-slate-400">{code.lang}</span>
          </div>
          <div className="flex-1 overflow-auto p-3 text-xs font-mono leading-5">
            <pre ref={codeRef} className={`hidden language-${code.lang}`}>{code.lines.join('\n')}</pre>
            <div className="text-slate-200">
              {code.lines.map((line, i) => {
                const lineNo = i + 1;
                const isHi = highlightSet.has(lineNo);
                return (
                  <div key={i} data-hi={isHi ? "1" : "0"} className={`flex ${isHi ? 'bg-slate-500/25 border-l-2 border-slate-300 -ml-3 pl-2' : ''}`}>
                    <span className="text-slate-500 select-none w-8 text-right pr-2">{lineNo}</span>
                    <span className="flex-1" dangerouslySetInnerHTML={{ __html: tokenLines[i] ? tokenLines[i].html : line }} />
                  </div>
                );
              })}
            </div>
          </div>
          <div className="px-3 py-1.5 bg-slate-800 border-t border-slate-700 flex items-center justify-between text-[10px] text-slate-400">
            <span>{code.lines.length} lines</span>
            <span>Step {stepIdx + 1} / {total}</span>
          </div>
        </div>
      );
    }

    function App() {
      const [stepIdx, setStepIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const intervalRef = useRef(null);
      const step = STEPS[stepIdx];

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowRight') setStepIdx((i) => Math.min(STEPS.length - 1, i + 1));
          else if (e.key === 'ArrowLeft') setStepIdx((i) => Math.max(0, i - 1));
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      useEffect(() => {
        if (!playing) return;
        intervalRef.current = setInterval(() => {
          setStepIdx((i) => { if (i >= STEPS.length - 1) { setPlaying(false); return i; } return i + 1; });
        }, 3000);
        return () => clearInterval(intervalRef.current);
      }, [playing]);

      const isLast = stepIdx === STEPS.length - 1;

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 px-4 py-6">
          <div className="max-w-7xl mx-auto">
            <header className="mb-5 flex items-end gap-3 flex-wrap">
              <span className="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-[#003B57] text-white font-bold">S</span>
              <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#003B57] text-white">Part IV. WAL과 동시성</span>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">IV-1-2</span>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 mt-1">busy_timeout · 락 · 체크포인트</h1>
                <p className="text-sm text-slate-700/80">동시 접근 시 락 경합과 대기 처리</p>
              </div>
              <a href="../index.html" className="ml-auto text-xs text-slate-700 underline hover:no-underline">← 챕터 목록</a>
            </header>

            <div className="mb-4 flex gap-1.5">
              {STEPS.map((_, i) => (
                <div key={i} className={`h-1.5 flex-1 rounded-full transition ${i <= stepIdx ? 'bg-[#003B57]' : 'bg-slate-200'}`} />
              ))}
            </div>

            <div className="mb-4 rounded-xl bg-[#003B57] text-slate-50 px-5 py-4 shadow">
              <h2 className="text-lg font-bold mb-1">{step.title}</h2>
              <p className="text-sm text-slate-200/90 leading-relaxed">{step.desc}</p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <LiveDataPane state={step} />
              <CodeViewer code={step.code} stepIdx={stepIdx} total={STEPS.length} />
            </div>

            <div className="mt-5 flex items-center justify-center gap-2">
              <button onClick={() => setStepIdx(0)} aria-label="처음으로" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">처음</button>
              <button onClick={() => setStepIdx((i) => Math.max(0, i - 1))} disabled={stepIdx === 0} aria-label="이전 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">← 이전</button>
              <button onClick={() => { if (isLast) setStepIdx(0); setPlaying((p) => !p); }} aria-pressed={playing} aria-label={playing ? '자동 재생 정지' : '자동 재생 시작'} className={`px-4 py-1.5 text-xs rounded font-bold ${playing ? 'bg-slate-900 text-white' : 'bg-[#003B57] text-white hover:bg-slate-800'}`}>{playing ? '⏸ 일시정지' : isLast ? '↻ 다시보기' : '▶ 자동재생'}</button>
              <button onClick={() => setStepIdx((i) => Math.min(STEPS.length - 1, i + 1))} disabled={isLast} aria-label="다음 단계" className="px-3 py-1.5 text-xs rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 disabled:opacity-40">다음 →</button>
            </div>
            <div className="text-center text-[10px] text-slate-600 mt-2">키보드 ←/→ · 자동재생 3초/단계</div>

            {isLast && (
              <div className="mt-5 rounded-lg border-2 border-slate-400 bg-white px-4 py-3 text-sm text-slate-900">
                <div className="font-bold mb-1">✅ 핵심 정리</div>
                SQLite는 single-writer라 동시 쓰기 중 하나만 락을 얻고 나머지는 SQLITE_BUSY. busy_timeout으로 짧은 경합을 대기·재시도로 흡수하고, 쓰기는 BEGIN IMMEDIATE, 트랜잭션은 짧게. WAL 체크포인트(PASSIVE~TRUNCATE)로 로그를 본 DB에 반영하며 WAL 무한 증가를 막는다.
              </div>
            )}

            <div className="mt-4 flex flex-wrap gap-1.5 text-[10px]">
              {['single-writer', 'SQLITE_BUSY', 'busy_timeout', 'WAL', 'checkpoint', 'IMMEDIATE'].map((k) => (
                <span key={k} className="px-2 py-0.5 rounded-full bg-slate-100 text-slate-800 border border-slate-300">#{k}</span>
              ))}
            </div>

            <nav className="mt-6 flex items-center justify-between text-xs text-slate-700">
              <a href="../index.html" className="underline hover:no-underline">← 챕터 목록</a>
              <a href="./IV-2-1.html" className="underline hover:no-underline">다음: IV-2-1 →</a>
            </nav>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
